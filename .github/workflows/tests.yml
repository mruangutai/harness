name: tests

# WHY THIS EXISTS (issue #161): nothing ran the suites mechanically. Not a git hook, not a
# Claude Code hook, not check-state.py at /harness entry — the only path was harness-qa
# reading test_kinds during a team flow, or a human remembering. Every assertion added
# across #149, #152 and #153 was dormant by default, which is issue #133's own shape
# ("logic correct, nothing calls it") applied to the safety net itself.

# TRIGGERS ARE DELIBERATELY ASYMMETRIC (issue #163). `on: push` + `on: pull_request` ran
# the suite TWICE for every PR — same SHA, same result, ~15s each — because pushing a
# branch and opening a PR from it are two events on ONE commit. The duplicate is what
# BLOCKED the first merge attempt on PR #162 while the identical push run had already
# passed: branch protection waits for EVERY matching check, so a green build refused a
# merge. That reads like a failing gate at a glance, on a mechanism whose job is trust.
#
# pull_request covers every branch on its way to main; push covers ONLY main, for the
# post-merge commit. A feature branch pushed without a PR gets no run — the intended
# trade, since nothing merges without a PR under branch protection.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A re-push supersedes its own in-flight run rather than queueing behind it. NEVER
  # cancel-in-progress on main: a cancelled run records no conclusion at all, and a
  # required check with no conclusion sits pending forever.
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # THREE JOBS, ONE REQUIRED CONTEXT (FEAT-2081, DEC-183 D-01). Branch protection on main
  # requires exactly one context, `integration` — measured: `contexts: ["integration"]`,
  # `enforce_admins: true`. That string is the ID of the AGGREGATION job at the bottom of this
  # file, not of the job that runs the gates. `checks` runs the unit suite and every gate with
  # its command body unchanged; `integration-shards` runs the integration suite as four matrix
  # cells; and `integration` needs both, runs `if: always()`, and passes ONLY when `checks` and
  # every shard concluded `success` AND check-integration-shards.py accepts all four manifests
  # against an independent discovery of the tested commit. Neither `checks` nor a shard is a
  # required context itself; they are required BECAUSE `integration` refuses without them.
  # Dropping a job from `needs:` or from the results passed to the validator weakens protection
  # silently — the same self-protection hole the Plan-route gate comment records, and nothing
  # detects it.
  checks:
    # NO `container:`, DELIBERATELY. GitHub-hosted runners execute as a non-root user;
    # a container job runs as root, and root IGNORES file permissions. test-check-domain.py
    # and test-gh-sync.py assert on `chmod 000` paths, so under root they would pass for
    # the wrong reason — a green tick proving nothing, which is the exact defect class this
    # repo keeps filing tickets about.
    #
    # NOTHING PROVES THE RUNNER IS NON-ROOT ANY MORE. The `Assert the runner is not root`
    # step that used to back this comment was removed by owner decision, so this ban is the
    # only thing standing between a container job and those assertions passing vacuously —
    # and it is a ban on a KEY, not evidence about the runtime. test-gh-sync.py carries a
    # `skip … (running as root)` branch, so if it ever did run as root those checks would go
    # QUIET rather than red. NOTHING KEEPS THE KEY BANNED. An earlier version of this comment
    # cited `case_25b9` as the guard; measured 2026-08-21, no such case exists anywhere under
    # .agents/skills/harness/bin/. The ban is this comment and the absence of the key, nothing
    # more, and nothing checks the uid either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OMP extensions execute on Bun. The provider-neutral hook adapter has native
      # TypeScript contract tests, so CI carries the same runtime required in production.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # NO `actions/setup-python`, BY OWNER DECISION. The job runs on whatever python3
      # `ubuntu-latest` ships. What that gives up is stated rather than discovered: the version
      # is no longer pinned, so a runner-image bump changes the interpreter under the suite
      # without any diff here. Accepted as too little value for its weight.
      #
      # PyYAML is REQUIRED, not optional (DEC-171). There is no line-scan fallback:
      # a missing parser is a loud failure by design, so install it rather than letting
      # the suite exercise a degraded path that does not exist. jsonschema is REQUIRED
      # too (DEC-189): FEAT-14's feature.json schema checker fails loudly, never silently,
      # when it is absent, and CI must carry the same dependency it demands locally.
      - name: Install PyYAML and jsonschema
        run: python3 -m pip install --upgrade pyyaml jsonschema

      # PRECOMPILE bin/ BEFORE ANY TEST. A fresh checkout has no __pycache__, so the first
      # import of each module writes a .pyc there through a temporary file. Many tests copy
      # the live bin/ tree with shutil.copytree, and a copy that lists that temporary file and
      # then finds it renamed fails with ENOENT — measured on run 37324916242, shard 3,
      # test-check-domain-artifact.py. Compiling once here means no test writes into the tree
      # it copies, and no process recompiles a module.
      - name: Precompile harness bin
        run: python3 -m compileall -q .claude/skills/harness/bin

      # UNIT HERE, INTEGRATION IN ITS OWN SHARDED JOB. Keeping unit and integration as
      # distinct runs gives each its own pass/fail attribution in the Actions log, which a
      # single `--kind all` run would not; the integration kind now runs in
      # `integration-shards` below, four ways in parallel.
      #
      # THE UNIT KIND NOW RUNS HERE TOO (FEAT-14/T-03). It used to be 3 files and 0.28s
      # and would have caught none of the defects that motivated this job; that is no
      # longer the whole story. FEAT-14's test-validate-feature-json.py is a UNIT script
      # (measured: 12 files, ~1.2s) and is the only mechanical proof that the
      # feature.json schema checker refuses when jsonschema is unavailable (SC-07) — the
      # required `integration` context is the one CI branch protection evaluates, and it
      # requires this job, so without this step nothing ever runs that proof. Integration
      # remains the reason this workflow exists in the first place: it is where the
      # write-guard, digest and route-checking assertions live (#160), which the unit kind
      # still does not cover.
      - name: Unit suite
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: .agents/skills/harness/bin/run-unit-tests.py --kind unit

      # VALIDATE EVERY FEATURE'S EXECUTION STATE (FEAT-14/T-03, REQ-06/REQ-07). No
      # arguments: the CLI sweeps every .harness/*/features/*/feature.{json,yaml,yml} file
      # on disk and exits non-zero if any fails the schema. This is the CI backstop for
      # a session where check-domain.py's write-time gate is not registered at all.
      - name: Validate feature execution state
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: .agents/skills/harness/bin/validate-feature-json.py

      # THE ROUTE CHECK, PROMOTED (issue #133, DEC-183). `check-plan-routes.py` worked from the
      # day it shipped and NOTHING mechanical ran it: not this workflow, not check-state.py, not
      # one of the 7 hook registrations in settings.json — `run-unit-tests.py` runs its TEST, never
      # the checker. Its sole invocation was one sentence in harness-spec-driven/SKILL.md telling a
      # planner to remember. This step is the mechanism; the sentence stays, because plan time is
      # still when a violation is cheap to fix.
      #
      # IN THE `checks` JOB, AND THAT JOB IS REQUIRED ONLY THROUGH `integration`. Branch
      # protection on main requires exactly one context, `integration` — the aggregation job's
      # ID, which deliberately carries NO `name:` key, so the ID is what GitHub emits. Two traps
      # follow: moving this step into a job that `integration` does not `need` (and whose result
      # it does not pass to check-integration-shards.py) emits a context nobody requires, so a PR
      # would merge with the route gate red or absent; and adding a `name:` to `integration`
      # renames the context and blocks every PR forever.
      #
      # AND THE STEP CAN BE DELETED BY THE THING IT PROTECTS. `pull_request` runs the workflow
      # definition from the PR's own ref, so a PR removing this step still emits `integration` and
      # still goes green — #133's shape applied to #133's fix. NOTHING DETECTS THAT, and the
      # citation that used to sit here was the worse kind of wrong: it named
      # `test-check-plan-routes.py` case 25 as reading this file and asserting the step is present
      # and unneutered. Measured 2026-08-21 — case_25 exists at :1030 and PASSES, and it asserts a
      # plan.yaml `status:` enum under DEC-203. It never opens this file. A reader following that
      # citation found a green test and stopped looking, which is worse than finding nothing.
      # No test under bin/ asserts anything about this workflow's content.
      #
      # M IS *NOT* ASSERTED — `examined` is, and that is the assertion this step actually rests
      # on. Measured 2026-08-21: `plans` is assigned at :154 and read only by the `echo` at :180;
      # no conditional touches it. `examined` is read by two, at :166 and :170. The `plans == 0`
      # check was deliberately removed on 2026-08-13 for the reason recorded below, so the
      # paragraph that follows describes a guard this file no longer has. It is kept because its
      # REASONING is still why `examined` is checked. The checker's last line is
      # `N violation(s) across M plan(s)`; a step that read only $? passes when M is 0 — a green
      # tick from a gate that examined nothing, issue #133's named ordering trap. Not a live hole as of 1c95e81, post-move:
      # all 20 plan files are git-tracked and `.harness/harness/features/` is not ignored, so
      # `actions/checkout@v4` cannot
      # produce M=0, and B-7 (PR #153) derives the root from the manifest rather than the cwd. It
      # is a guard against a future `.gitignore` entry, sparse checkout or root-derivation change
      # making it reachable again — cheap, and this repo's most-repeated defect is exactly "the
      # guard is right and nothing calls it correctly". Both halves measured at 1c95e81, post-move, not assumed:
      # `git ls-files '.harness/harness/features/*/PLAN.md' '.harness/harness/features/*/plan.yaml'` returns 20, and
      # `git check-ignore -v .harness/harness/features` exits 1.
      #
      # THREE OUTCOMES, THREE MESSAGES. Exit 2 with no summary means the checker could not run at
      # all; a summary with M=0 means it ran and looked at nothing; anything else is a real verdict
      # on real plans. Collapsing them into one "failed" is how a broken gate hides behind a red X.
      - name: Plan-route gate
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          rc=0
          out=$(python3 .agents/skills/harness/bin/check-plan-routes.py 2>&1) || rc=$?
          printf '%s\n' "$out"

          # THE REGEX IS COUPLED to `check-plan-routes.py`'s final `print()` — the summary
          # format string, which carries a comment pointing back here. A reword there makes
          # this grep miss, which fails the step CLOSED (nothing merges silently) but reports
          # "the checker could not run" about a checker that ran fine. Change both together.
          #
          # `|| true` IS LOAD-BEARING: steps run under `bash -e {0}`, so a grep that matches
          # nothing would kill the step HERE, at the assignment, before either message below
          # could print — the exit-2 case would come back as a bare failure with no diagnosis.
          summary=$(printf '%s\n' "$out" | grep -E '^[0-9]+ violation\(s\) across [0-9]+ plan\(s\)$' | tail -1) || true

          if [ -z "$summary" ]; then
            echo "::error::check-plan-routes.py printed no summary line and exited ${rc} — the CHECKER COULD NOT RUN (exit 2 = it does not know where to look). This is not a clean tree; nothing was checked." >&2
            exit 1
          fi

          plans=$(printf '%s' "$summary" | sed -E 's/^.* across ([0-9]+) plan\(s\)$/\1/')

          # THE GATE ASKS "DID YOU FIND THE FEATURES", NOT "DID YOU FIND WORK TO DO".
          # It used to fail on `plans == 0`, on the reasoning that a route gate finding
          # nothing is indistinguishable from a clean tree. The reasoning is right and the
          # number was wrong: shipped features are skipped by design, so `plans == 0` is
          # ALSO what a completely shipped repository looks like. On 2026-08-13 FEAT-18
          # went Done, every feature on disk was then shipped, and this step failed a
          # healthy tree. The checker now prints a second line with the count of feature
          # directories it actually entered, which is the number that proves discovery
          # ran. That one does not drift as features land.
          examined=$(printf '%s\n' "$out" | sed -nE 's/^examined ([0-9]+) feature dir\(s\).*$/\1/p' | tail -1)
          if [ -z "$examined" ]; then
            echo "::error::check-plan-routes.py printed no 'examined N feature dir(s)' line. The gate cannot tell broken discovery from an all-shipped tree without it, so it refuses to pass rather than guess." >&2
            exit 1
          fi
          if [ "$examined" -eq 0 ]; then
            echo "::error::check-plan-routes.py entered 0 feature directories, and this repository has features. Discovery did not run — an empty search is indistinguishable from a clean tree and would pass forever, the exact trap issue #133 names. Check CLAUDE_PROJECT_DIR and .harness/*/features/." >&2
            exit 1
          fi

          # NOT CHECKED HERE, AND SAID RATHER THAN LEFT IMPLICIT: a defect that reports
          # every feature as shipped gives examined>0 and plans==0 and passes this step.
          # `test-check-plan-routes.py` case_19a3b covers it against a fixture holding one
          # Building feature and one Done, asserting exactly 1. Neither check is enough
          # alone.
          echo "route gate entered ${examined} feature dir(s), checked ${plans} live plan(s); checker exit ${rc}"
          exit "$rc"

      # THE CANONICAL-READER AUDIT (#1993). BUG-285's inventory of every parse call under bin/
      # was checked only by `test-check-plan-routes.py --canonical-reader-self-test`, which no
      # runner invokes, so the FEAT-62/69/70 package splits left it 72 findings stale and nothing
      # turned red. This step runs the permanent audit on every PR: a parse call added, moved or
      # removed under bin/ without its row in tests/integration/canonical-reader-classification.json
      # fails here. Same job as the route gate, for the branch-protection reason recorded above.
      #
      # THE REGEX IS COUPLED to `_run_canonical_reader_audit`'s summary `print()` in
      # check-plan-routes.py, which carries a comment pointing back here. No summary means the
      # audit could not run; 0 Python files means discovery found nothing, never a clean tree.
      - name: Canonical-reader audit
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          rc=0
          out=$(python3 .agents/skills/harness/bin/check-plan-routes.py --canonical-reader-audit 2>&1) || rc=$?
          printf '%s\n' "$out"
          scanned=$(printf '%s\n' "$out" | sed -nE 's/^[0-9]+ unresolved reader site\(s\) across ([0-9]+) Python file\(s\)$/\1/p' | tail -1)
          if [ -z "$scanned" ]; then
            echo "::error::check-plan-routes.py --canonical-reader-audit printed no summary line and exited ${rc} — the AUDIT COULD NOT RUN. Nothing was checked." >&2
            exit 1
          fi
          if [ "$scanned" -eq 0 ]; then
            echo "::error::the canonical-reader audit scanned 0 Python files under .claude/skills/harness/bin/ — discovery did not run, which is not a clean tree." >&2
            exit 1
          fi
          exit "$rc"

      - name: Instruction-path gate
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          rc=0
          out=$(python3 .agents/skills/harness/bin/check-instruction-paths.py 2>&1) || rc=$?
          printf '%s\n' "$out"
          summary=$(printf '%s\n' "$out" | grep -E '^scanned [0-9]+ file\(s\), [0-9]+ violation\(s\)$' | tail -1) || true
          if [ -z "$summary" ]; then
            echo "::error::check-instruction-paths.py scan did not run." >&2
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error::check-instruction-paths.py could not run." >&2
            exit 1
          fi
          exit "$rc"

      # THE LAYOUT GATE (FEAT-20/T-03, REQ-06). Nothing in the repository asserts this
      # step is present or unneutered — still true at 2026-08-21, and it is the same hole the
      # Plan-route gate above carries. Both are accepted rather than unnoticed (DEC-183): a guard
      # hosted inside this workflow cannot protect this workflow, because `pull_request` runs the
      # definition from the PR's own ref, so one PR edits the step and its guard together. The
      # control that remains is a human reading the .github/ diff, and nothing can require one on
      # this repo — branch protection carries zero required reviewers and CODEOWNERS is
      # deliberately unenforced, because the sole collaborator cannot approve their own PR.
      - name: Layout gate
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          rc=0
          out=$(python3 .agents/skills/harness/bin/layout_migration.py . 2>&1) || rc=$?
          printf '%s\n' "$out"

          # THE REGEXES ARE COUPLED to `layout_migration.py`'s `render()` — the "layout:"
          # and "examined" format strings, which carry a comment pointing back here. A
          # reword there makes these greps miss, which fails the step CLOSED (nothing
          # merges silently) but reports "the checker could not run" about a checker that
          # ran fine. Change both together.
          #
          # `|| true` IS LOAD-BEARING: steps run under `bash -e {0}`, so a grep that
          # matches nothing would kill the step HERE, at the assignment, before any of
          # the messages below could print.
          summary=$(printf '%s\n' "$out" | grep -E '^layout: [0-9]+ surface\(s\) clean, [0-9]+ mixed, [0-9]+ cannot-verify$' | tail -1) || true

          if [ -z "$summary" ]; then
            echo "::error::layout_migration.py printed no 'layout: N surface(s) clean, ...' summary line and exited ${rc} — the CHECKER COULD NOT RUN. This is not a clean tree; nothing was checked." >&2
            exit 1
          fi

          examined=$(printf '%s\n' "$out" | sed -nE 's/^examined ([0-9]+) feature dir\(s\), ([0-9]+) doc root\(s\), ([0-9]+) reader file\(s\)$/\1 \2 \3/p' | tail -1)
          if [ -z "$examined" ]; then
            echo "::error::layout_migration.py printed no 'examined N feature dir(s), M doc root(s), R reader file(s)' line. The gate cannot tell broken discovery from a clean tree without it, so it refuses to pass rather than guess." >&2
            exit 1
          fi

          feature_dirs=$(printf '%s' "$examined" | awk '{print $1}')
          doc_roots=$(printf '%s' "$examined" | awk '{print $2}')
          reader_files=$(printf '%s' "$examined" | awk '{print $3}')

          zero=""
          if [ "$feature_dirs" -eq 0 ]; then
            zero="feature dir(s)"
          elif [ "$doc_roots" -eq 0 ]; then
            zero="doc root(s)"
          elif [ "$reader_files" -eq 0 ]; then
            zero="reader file(s)"
          fi
          if [ -n "$zero" ]; then
            echo "::error::layout_migration.py examined 0 ${zero}. Discovery did not run — an empty search is indistinguishable from a clean tree and would pass forever. Check CLAUDE_PROJECT_DIR and the feature/doc roots." >&2
            exit 1
          fi

          echo "layout gate examined ${feature_dirs} feature dir(s), ${doc_roots} doc root(s), ${reader_files} reader file(s); checker exit ${rc}"
          exit "$rc"

      # THE REPOSITORY-STATE GATE, PROMOTED (FEAT-54 backlog B-5). SC-04 asserted a clean
      # `check-state.py` at ONE review pin and bound no later commit: the gate ran because a
      # criterion told a human to run it, so the next commit could redden the corpus and
      # nothing would say so until the next feature happened to look. This step is the
      # standing detector that criterion could not be.
      #
      # IN THE `checks` JOB, FOR THE REASON THE PLAN-ROUTE GATE RECORDS ABOVE: branch protection
      # requires exactly the `integration` context, which needs `checks` and refuses unless it
      # concluded `success`. A job outside that chain would merge with this gate red or absent.
      #
      # EXIT CODE IS THE VERDICT, BUT SILENCE IS NOT A PASS. check-state.py prints one row per
      # finding and nothing at all when the corpus is clean, so exit 0 with no output is
      # genuinely ambiguous between "clean" and "discovered nothing to check" — this
      # repository's most-repeated defect. The corpus count below is the positive control:
      # it comes from git, not from the checker, so a root-derivation change or a sparse
      # checkout that blinds the checker cannot also silence the guard.
      - name: Repository-state gate
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          git config core.hooksPath .claude/skills/harness/hooks

          features=$(git ls-files '.harness/*/features/*/feature.json' | wc -l | tr -d ' ')
          if [ "$features" -eq 0 ]; then
            echo "::error::no .harness/*/features/*/feature.json is tracked, so check-state.py would have nothing to examine and would exit 0 on an empty corpus. Refusing to report a pass." >&2
            exit 1
          fi

          rc=0
          out=$(python3 .agents/skills/harness/bin/check-state.py 2>&1) || rc=$?
          printf '%s\n' "$out"

          # NOTE ROWS ARE NOT VIOLATIONS. check-state.py already decides that: it exits 0
          # with note rows present and non-zero only for a refusal, so this step adds no
          # severity judgment of its own and cannot drift from the checker's.
          echo "repository-state gate examined ${features} tracked feature record(s); checker exit ${rc}"
          exit "$rc"

  integration-shards:
    # NO `container:` here either, for the non-root reason recorded on `checks`: this is the
    # job that actually runs test-check-domain.py and test-gh-sync.py.
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to its own conclusion. A fail-fast cancel would turn one red shard
      # into three cancelled ones and hide which files actually failed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # Same runtime and dependencies as `checks`, for the reasons recorded there.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install PyYAML and jsonschema
        run: python3 -m pip install --upgrade pyyaml jsonschema

      # Same precompile as `checks`, for the reason recorded there.
      - name: Precompile harness bin
        run: python3 -m compileall -q .claude/skills/harness/bin

      # Before sharding (run 37264903064, 2026-10-05) the single unsharded integration step
      # took 171s on ubuntu-latest (`pool: 4 workers, 73 files, 170.49s wall`) inside a 211s
      # job. Each shard now runs its share of the discovered selection through
      # run-unit-tests.py's weighted --shard partition. First sharded runs (37324916242,
      # 37325307899): 93s and 95s from first shard start to `integration` completion; weights
      # were then re-measured per shard from 37325307899. SC-10's live record is the measured
      # figure — measure rather than trust any figure here.
      #
      # THE MANIFEST LIVES IN runner.temp, outside the watched bin tree and the checkout. The
      # runner writes it only after every started script terminated, so a crash or a cancelled
      # shard leaves no manifest, and `integration` refuses on its absence.
      - name: UAT U-04 omit one discovered file (throwaway only)
        run: rm tests/integration/test-bash-write-guard.py

      - name: Integration suite (shard ${{ matrix.shard }}/4)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: >-
          .agents/skills/harness/bin/run-unit-tests.py --kind integration
          --shard ${{ matrix.shard }}/4
          --manifest "${{ runner.temp }}/integration-manifest-${{ matrix.shard }}.json"

      # `always()` so a FAILING shard still ships its manifest — its failing records are
      # evidence. Nothing is fabricated: if the runner never wrote a manifest, nothing is
      # uploaded and the aggregator reports that shard missing. The name carries the run ID
      # and shard index; `overwrite` lets a re-run of this cell replace its own earlier upload.
      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-manifest-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/integration-manifest-${{ matrix.shard }}.json
          if-no-files-found: warn
          overwrite: true

  # THE REQUIRED CONTEXT. The job ID is `integration` and there is NO `name:` key: the ID is
  # what GitHub emits and what branch protection requires. Renaming either blocks every PR.
  integration:
    runs-on: ubuntu-latest
    needs: [checks, integration-shards]
    # `always()` so a failed, skipped or cancelled dependency still yields a CONCLUSION here —
    # a FAILED one — instead of a skipped job, which branch protection would never see turn
    # red. This covers shard-only cancellation (OQ-02). It does not claim to survive whole-
    # workflow cancellation or supersession of an old PR run; main still never cancels.
    if: always()
    steps:
      # Default ref: on pull_request that is refs/pull/N/merge, whose commit IS github.sha (the
      # merge commit the shards checked out and recorded as tested_commit); on push to main it
      # is the pushed commit, also github.sha. One SHA, one tree, for shards and validator.
      - uses: actions/checkout@v4

      # NO continue-on-error. If the download step errors, the job is already red; the
      # validator still runs (`always()`) so the log says what was missing, and it fails on the
      # download outcome explicitly. Zero matching artifacts downloads nothing and the
      # validator reports every shard's manifest missing.
      - name: Download shard manifests
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: integration-manifest-${{ github.run_id }}-*
          path: ${{ runner.temp }}/integration-manifests
          merge-multiple: true

      # The prerequisite results are passed LITERALLY; the validator accepts only `success` for
      # both and exits 0 only for exact, complete, all-passing coverage of the tested commit's
      # independently discovered integration files. Exit 1 incomplete, 2 malformed — both red.
      - name: Validate shard completeness
        if: always()
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          MATRIX_RESULT: ${{ needs.integration-shards.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          MANIFEST_DIR: ${{ runner.temp }}/integration-manifests
          TESTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$MANIFEST_DIR"
          rc=0
          python3 .agents/skills/harness/bin/check-integration-shards.py \
            --commit "$TESTED_SHA" --shards 4 \
            --checks-result "$CHECKS_RESULT" --matrix-result "$MATRIX_RESULT" \
            --manifest-dir "$MANIFEST_DIR" || rc=$?
          if [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            echo "::error::downloading shard manifests concluded '${DOWNLOAD_OUTCOME}', not success. Refusing to pass on manifests that may be incomplete." >&2
            exit 1
          fi
          exit "$rc"
