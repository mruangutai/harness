name: tests

# WHY THIS EXISTS (issue #161): nothing ran the suites mechanically. Not a git hook, not a
# Claude Code hook, not check-state.sh at /harness entry — the only path was harness-qa
# reading test_kinds during a team flow, or a human remembering. Every assertion added
# across #149, #152 and #153 was dormant by default, which is issue #133's own shape
# ("logic correct, nothing calls it") applied to the safety net itself.

# TRIGGERS ARE DELIBERATELY ASYMMETRIC (issue #163). `on: push` + `on: pull_request` ran
# the suite TWICE for every PR — same SHA, same result, ~15s each — because pushing a
# branch and opening a PR from it are two events on ONE commit. The duplicate is what
# BLOCKED the first merge attempt on PR #162 while the identical push run had already
# passed: branch protection waits for EVERY matching check, so a green build refused a
# merge. That reads like a failing gate at a glance, on a mechanism whose job is trust.
#
# pull_request covers every branch on its way to main; push covers ONLY main, for the
# post-merge commit. A feature branch pushed without a PR gets no run — the intended
# trade, since nothing merges without a PR under branch protection.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A re-push supersedes its own in-flight run rather than queueing behind it. NEVER
  # cancel-in-progress on main: a cancelled run records no conclusion at all, and a
  # required check with no conclusion sits pending forever.
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integration:
    # NO `container:`, DELIBERATELY. GitHub-hosted runners execute as a non-root user;
    # a container job runs as root, and root IGNORES file permissions. test-check-domain.py
    # and test-gh-sync.py assert on `chmod 000` paths, so under root they would pass for
    # the wrong reason — a green tick proving nothing, which is the exact defect class this
    # repo keeps filing tickets about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyYAML is REQUIRED, not optional (DEC-171 am.1). There is no line-scan fallback:
      # a missing parser is a loud failure by design, so install it rather than letting
      # the suite exercise a degraded path that does not exist.
      - name: Install PyYAML
        run: python3 -m pip install --upgrade pyyaml

      # The INTEGRATION kind, not `all`. The unit kind is 3 files and 0.28s and would have
      # caught none of the defects that motivated this; integration is 11 files and ~15s
      # and is where the write-guard, digest and route-checking assertions live (#160).
      - name: Integration suite
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: .claude/skills/harness/bin/run-unit-tests.sh --kind integration

      # Proves the runner is not root, so the chmod-based assertions above mean what they
      # say. If this ever fails, the suite result above is not trustworthy.
      - name: Assert the runner is not root
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "::error::running as root — chmod-based assertions cannot fail here" >&2
            exit 1
          fi
          echo "uid=$(id -u) ($(id -un)) — permission assertions are meaningful"
