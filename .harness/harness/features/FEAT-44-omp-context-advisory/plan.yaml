  - id: T-02
    title: Add the transcript reader and the threshold resolver to the OMP extension
    traces: [REQ-01, REQ-03, REQ-04]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174, the whole implementation is in an enforcement-layer hook file
    depends_on: [T-01]
    status: pending
    files:
      - .omp/extensions/harness-hooks.ts
    verify: |
      out=$(bun test ./.claude/skills/harness/bin/omp-hooks.test.ts -t readContextAnchor 2>&1)
      printf '%s' "$out" | grep -q "0 fail"; f=$?
      printf '%s' "$out" | grep -qE "[1-9][0-9]* pass"; p=$?
      test "$f" = 0 && test "$p" = 0
    intent: |
      Add to .omp/extensions/harness-hooks.ts, module scope, above registerHarnessHooks
      (which begins at line 409). Add a node:fs import for readFileSync, statSync and
      openSync/readSync as needed; the file currently imports only node:child_process,
      node:path and node:url at lines 1 to 3.

      export type ContextAnchor =
        | { kind: "tokens"; tokens: number }
        | { kind: "inert"; scannedBytes: number }
        | { kind: "none" };

      export const DEFAULT_CONTEXT_WARN_TOKENS = 200000;
      Keep that exact name: it is the name the retired context-watch.py resolver used, and
      DEC-198's amendment in T-06 re-homes its citation to this constant.

      export function readContextAnchor(sessionFile: string | undefined): ContextAnchor
      Behaviour, and every branch below must yield NO figure rather than a wrong figure:
      - falsy path, stat throws, or open throws: return { kind: "none" }.
      - read the last WINDOW bytes of the file, starting at WINDOW = 65536. Split the buffer
        on newlines and DISCARD the first fragment unless the window covers the whole file,
        because it may be a torn line.
      - iterate the fragments from the END. Skip any fragment that does not contain the
        substring "contextSnapshot" (a keyed prefilter, and the key implies the substring so
        it cannot produce a false negative). For a surviving fragment, JSON.parse inside
        try/catch and continue on throw. Read obj.message.contextSnapshot.promptTokens with
        defensive object checks, accept it only when typeof is number and Number.isFinite,
        and return { kind: "tokens", tokens } on the first acceptance. No regex is applied to
        the value anywhere.
      - on a miss with WINDOW smaller than the file size, multiply WINDOW by 4 and retry.
        When WINDOW reaches or exceeds the file size, perform exactly one whole-file pass.
      - after the whole-file pass finds nothing, return { kind: "inert", scannedBytes: size }.
      There is no persisted state, no byte offset, no accumulated delta and no dedupe: the
      newest anchor is read fresh each time.

      export function resolveContextWarnTokens(root: string): number
      Reads root/.harness/harness.json, returns budgets.orchestrator_context_warn_tokens
      when it is a finite number and not a boolean, and DEFAULT_CONTEXT_WARN_TOKENS on every
      other path: file missing, unreadable, not JSON, no budgets object, key absent, or value
      not a number. This mirrors the miss-path set DEC-198 records.

      export function contextAdvisoryText(tokens: number, threshold: number): string
      One line, containing the measured token count, the literal key name
      budgets.orchestrator_context_warn_tokens, the resolved threshold, and the computed
      ratio rendered as (tokens / threshold).toFixed(2) followed by the letter x. It states
      that the threshold advises and that the handoff belongs at a seam, and cites DEC-198
      and DEC-201. It must never read as a refusal or a gate.

      export function contextInertText(scannedBytes: number): string
      One line naming message.contextSnapshot.promptTokens as the field that was not found,
      the number of bytes scanned, and that the host record shape may have changed, citing
      issue 923.

      Do not wire anything into a handler in this task. T-03 does the wiring.

  - id: T-03
    title: Inject the advisory on the orchestrator wake inside the existing tool_result handler
    traces: [REQ-01, REQ-02, REQ-04, REQ-05]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174, this edits a registered OMP hook handler
    depends_on: [T-02]
    status: pending
    files:
      - .omp/extensions/harness-hooks.ts
    verify: |
      out=$(bun test ./.claude/skills/harness/bin/omp-hooks.test.ts 2>&1)
      printf '%s' "$out" | grep -q "0 fail"; f=$?
      printf '%s' "$out" | grep -qE "[3-9][0-9] pass"; p=$?
      test "$f" = 0 && test "$p" = 0
    intent: |
      Edit the tool_result handler in .omp/extensions/harness-hooks.ts. It is registered at
      line 575 and its shape today is: an early return at line 576 when currentAgent is
      unset, the task claim bookkeeping at lines 579 to 611, then the post-domain check at
      612 which returns early at 613 when there is no block reason and otherwise returns
      { content: [...content, checkLine], isError: true } at 615 to 618.

      Add a closure flag beside the existing ones declared at lines 410 to 417, named
      inertNoticeEmitted and initialised false.

      Compute the advisory BEFORE the existing early return, so the advisory does not depend
      on a block reason and the block does not pre-empt the advisory:
      - only when currentAgent is exactly the string harness-orchestrator, and only when
        toolName is exactly task. Both conditions are equality tests, not prefix or substring
        tests: the three domain leads carry different HARNESS_AGENT_ID values and the main
        session carries none, which line 576 already excludes.
      - resolve the session file as ctx.sessionManager?.getSessionFile?.() inside try/catch
        returning undefined on throw, mirroring the getSessionId helper at lines 324 to 328.
      - call readContextAnchor on it. On kind none, no advisory. On kind inert, the advisory
        line is contextInertText, emitted only when inertNoticeEmitted is false, and the flag
        is then set, so the notice costs one line per session and not one per wake. On kind
        tokens, resolve the threshold with resolveContextWarnTokens(gateRoot()) and produce
        contextAdvisoryText only when tokens are strictly greater than the threshold;
        at or under the threshold there is no advisory and nothing is returned.

      Then compose, replacing the early return at line 613:
      - no block reason and no advisory: return nothing, exactly as today.
      - no block reason and an advisory: return { content: [...content, advisoryEntry] } with
        NO isError key present at all. A normal tool result must not become an error.
      - a block reason and an advisory: return the existing shape with isError true and BOTH
        entries appended, the post-write check line first, then the advisory.
      - a block reason and no advisory: unchanged from today.
      The advisory entry has the same shape as the existing one: { type: "text", text }.

      Zero extra turns and zero extra tokens on the healthy path: nothing is added below the
      threshold, and the advisory rides content the orchestrator was already going to read.

