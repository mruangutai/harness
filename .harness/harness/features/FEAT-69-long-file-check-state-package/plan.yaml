    dec: none
tasks:
  - id: T-01
    title: Split check-state into the settled package
    traces:
    - SC-01
    - SC-03
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 assigns check-state.py and its proof-bearing cutover directly to the main session.
    depends_on: []
    status: review
    files:
    - .claude/skills/harness/bin/check-state.py
    - .claude/skills/harness/bin/check_state
    verify: |
      python3 -c 'import importlib.util,pathlib,sys; root=pathlib.Path("."); p=root/".claude/skills/harness/bin/code_grade.py"; s=importlib.util.spec_from_file_location("feat69_code_grade",p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m); pkg=root/".claude/skills/harness/bin/check_state"; expected={"__init__.py","ctx.py","table.py","runner.py","plan.py","feature_record.py","run_state.py","seams.py","brief.py","worktrees.py","board.py","host.py"}; assert {x.name for x in pkg.glob("*.py")}==expected; paths=[root/".claude/skills/harness/bin/check-state.py",*sorted(pkg.glob("*.py"))]; rows=[r for x in paths for r in m.grade_source(x.read_text(),str(x.relative_to(root)))]; bad=[(r.path,r.qualname,r.grade) for r in rows if r.grade<4]; assert rows and not bad,bad'
    intent: |
      Work only in the assigned FEAT-69 worktree. Use the grilling map at a726bad8 without re-deriving it: check-state.py is 5,058 lines; bootstrap is lines 1-118 with root = sys.argv[1] at line 96 as the bootstrap-end sentinel; class Ctx is lines 467-878; invariant bodies are lines 880-4563; INVARIANTS is lines 4599-4750; RETIRED is line 4754; runner logic is lines 4759-5058. The baseline code-grade record is 287 functions: 114 at grade 5, 169 at grade 4, two at grade 3, and two at grade 2. The only below-bar functions are _inv41_invocation at 2, _unquoted_hash_digit at 2, _quoted_scalar_closed at 3, and inv_49 at 3; improve those in the modules where they land while preserving observable behavior.

      Keep check-state.py as the existing hyphenated forked entry and thin it to roughly 150 lines without introducing a file-length gate. Preserve bootstrap root resolution, argv shape, bin-on-sys.path behavior, process exit semantics, and the root = sys.argv[1] sentinel. Add importable check_state/__init__.py. Keep Ctx whole in ctx.py, including parse-once caches, seed findings, spawn boundary, path helpers, and shared context primitives. Put the exact baseline table and all row-selection discretion in table.py; it alone imports every family and owns INVARIANTS in the baseline's exact order. Put row selection, repo and feature passes, collation, reporting, and CLI dispatch behind runner.py. check-state.py never selects families. Family modules never import or know the runner and expose no per-family entry points.

      Move invariant bodies and their private helpers by the settled declared-read ownership, with no omissions or extra families: plan.py owns INV-35/3/4/5/34/32/44; feature_record.py owns INV-1/2/6/7/8/12/18/22/23/33 and ledger INV-39/40/43/47 with collate_feat59; run_state.py owns INV-15/16/36/46; seams.py owns INV-17; brief.py owns INV-38/41/49 and the INV-38..41 helpers currently at lines 332-466; worktrees.py owns INV-25/27/29/31; board.py owns INV-13/21/24/26/28/30/37; host.py owns INV-19/42/45/48. Retain the accepted judgment placements INV-1/2 in feature_record.py and INV-27/31 in worktrees.py. Families export inv_NN(ctx[, feat]) returning the existing bad and warn shape; preserve the ledger collation shape.

      Preserve every invariant's behavior, exact message text, severity, table and finding order, short-circuit, accumulator seeding, feature iteration, retired-number behavior, and return/exit shape. Move existing comments byte-for-byte with their code. Preserve all four load-bearing INV-32 markers: the era BEGIN/END comments at baseline lines 1380/1384 travel with INV-32 in plan.py, and the table-row BEGIN/END comments at baseline lines 4605/4610 travel with that row in table.py. Make no rename beyond what the package forces. Do not change plan-merge.py, validate-digest.py, check-domain.py, gh-sync.py, any unrelated long file, any message, any severity, any invariant order, or any navigation-family .get site.

  - id: T-02
    title: Make structural locks scanners and canonical audit package aware
    traces: [SC-02, SC-03]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 assigns check-plan-routes.py, its owning integration test, and the check-skill-refs enforcement scanner directly to the main session.
    depends_on: [T-01]
    status: review
    files:
      - .claude/skills/harness/bin/check-plan-routes.py
      - .claude/skills/harness/bin/check-skill-refs.py
      - tests/integration/test-check-plan-routes.py
      - tests/unit/test-check-skill-refs.py
      - tests/integration/canonical-reader-classification.json
    verify: |
      python3 tests/integration/test-check-plan-routes.py &&
      python3 tests/unit/test-check-skill-refs.py
    intent: |
      Extend only the package-coupled FEAT-62 enforcement, both invariant-number scanners, and the canonical-reader identities affected by the package split; do not refactor check-plan-routes.py or any other long file. The baseline lock is check-plan-routes.py lines 1832-2330: CHECKER_REL at 1860, _module_functions at 1969, _inv_rows at 1992, _reachable at 2124, feat62_findings at 2299, and consolidation_findings at 2315. Its owning cases are test-check-plan-routes.py lines 2591-2923 and currently mutate a bin copy through _checker_path at 2547. Preserve those anchors' contracts while making the implementation package aware.

      Implement settled option (a). Parse check-state.py and every check_state/*.py file and build one combined module-qualified function table. Resolve direct calls, imported family functions, ctx method calls, and helper-to-helper calls across those ASTs; perform one transitive walk so an undeclared file, git, or gh read and an undeclared spawn two helpers deep still reaches the row. Apply the existing four decomposition rules unchanged over the complete surface: module-body shape after the entry sentinel, no re-parse of runner-shared sources inside invariant bodies, transitive declared reads, and live unstruck authority. Keep posture behavior unchanged. Add the reads-family rule: each table row's run function must be defined in the family module named by that row's declared reads. Do not accept aliases or per-module checks that can pass after dropping an imported edge.

      Apply FEAT-63's broad-catch ceiling of zero to check-state.py and every Python file under check_state, while leaving the unrelated harness_boundary.py allowance unchanged. Add a deterministic enumeration assertion that the ceiling scans the entry and the complete expected set of package Python files. Add only the weakest discriminating broad-catch mutants: one injected into the entry and one into a representative invariant-family module, with each rejected by its named finding. Do not add a per-file mutant matrix.

      Expand the existing mutation harness so it copies the package with bin and mutates package files. Add discriminating cases for a clean package, a module-body violation in a package file, re-parsing in a moved invariant, a direct undeclared read, a cross-module undeclared helper read, a spawn two helpers deep, struck or missing authority, and a row whose function lives outside the family its reads name. Each mutant must fail for its own named finding, and both feat62_findings and consolidation_findings must return their unchanged clean-tree outputs.

      Migrate both text scanners from the entry file to the package surface. check-plan-routes.py _live_invariant_numbers is at baseline lines 886-890; check-skill-refs.py uses CHECK_STATE_REL at line 32 and scans at lines 104-105 for INV-48. Each must read check-state.py plus check_state/*.py deterministically, deduplicate numbers, keep the same user-facing diagnostics, and retain the entry path in any wording that is part of the existing contract. Extend the exact owning tests so a number present only in a family module is live, a missing number remains missing, and duplicate textual citations do not create duplicate findings.

      Before the owning test-check-plan-routes.py audit runs, re-key every canonical-reader fixture row whose source moved from check-state.py to its actual package file, changing its source-derived id and file while preserving artifact, category, disposition, route, remedy, exemption, reason, symbol, and ordinal. Replace the legacy check-state.py scanned_files entry with the actual entry and package source files scanned after the split. Derive the complete affected set from the live canonical-reader scan rather than a fixed count. The ten grilling-supplied identities remain anchored examples and must all be accounted for: station_of::harness_yaml_file#1, <module>::load_plan#1, <module>::json_string#1, <module>::json_file#1, <module>::harness_yaml_file#1, <module>::json_file#2, <module>::json_string#2, <module>::json_string#3, _handoff_exempt::harness_yaml_file#1, and <module>::harness_yaml_file#2. They include station_of and _handoff_exempt but are not the complete live set. The canonical reader audit must pass within T-02; do not defer fixture repair to a successor task.

