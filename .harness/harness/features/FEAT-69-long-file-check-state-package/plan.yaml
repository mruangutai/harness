      python3 tests/integration/test-check-state-table.py
    intent: |
      Preserve the runner boundary established at tests/integration/check_state_support.py lines 24-26: SCRIPT and CHECK_STATE_BIN continue to resolve and fork the hyphenated check-state.py entry, and no suite imports it or a family module as its behavioral entry point. Exercise exactly the nine owning suites from the grilling facts: test-check-state.py, test-check-state-entry.py, test-check-state-plans.py, test-check-state-records.py, test-check-state-handoff.py, test-check-state-worktrees.py, test-check-state-inv26.py, test-check-state-feat59.py, and test-check-state-table.py.

      Update every isolated or scratch bin to copy check-state.py together with the complete check_state package before running or mutating it. The exact baseline copy and patch sites are test-check-state-worktrees.py lines 149-157 and 285-315; test-check-state-records.py lines 192 and 555, which also mutates the four INV-32 markers formerly at check-state.py lines 1380/1384/4605/4610; test-check-state-handoff.py lines 366, 527, and 662, with its line-1366 emission-shape citation; and test-check-state-feat59.py lines 594-597, which patches at the harness_yaml.require_or_die() anchor. Retarget source mutations to the package file that now owns the exact text, make every copy include __init__.py and all family modules, and keep each mutation's original behavioral assertion. A missing source anchor or omitted package file must fail loudly rather than skip a mutant.

      Preserve test-check-state-entry.py lines 383-477, which read check-state.py and check-domain.py as text for shared budget, CHECKPOINT, and handoff literals; move or update only the check-state source lookup needed to assert the same contract across entry plus package. Preserve test-check-state-table.py's exact --list expectations: INV-35 first, INV-44 last among active rows, INV-46 immediately after INV-15, retired rows last, every active row once, metadata unchanged, and sorted feature iteration.

      Preserve external compatibility at the unchanged entry path: .github/workflows/tests.yml lines 276-311 continues to fork it, and .omp/commands/harness.md line 11 continues to use it at session entry. Preserve CODEOWNERS lines 32-43 as a deliberate non-ownership decision for DEC-174 enforcement scripts. Do not add an ownership pattern for check-state.py or check_state/**; update only the existing explanatory comment if it must name the new package. Preserve .agents/skills as the .claude/skills symlinked view. Do not add a compatibility shim, a second CLI, or a family entry point.

  - id: T-04
    title: Pin the implementation and commit reproducible byte identity receipts
    traces: [SC-01, SC-02, SC-04]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 keeps clean-checkout proof collection and the immutable enforcement pin with the direct main-session change.
    depends_on: [T-01, T-02, T-03]
    status: review
    files:
    - .harness/harness/features/FEAT-69-long-file-check-state-package/notes
    verify: |
      python3 -c 'import re,subprocess; rel=".harness/harness/features/FEAT-69-long-file-check-state-package/notes/clean-pin-byte-receipts.generated.md"; receipt_commit=subprocess.check_output(["git","log","-1","--format=%H","HEAD","--",rel],text=True).strip(); assert receipt_commit,"receipt commit not found"; text=subprocess.check_output(["git","show",f"{receipt_commit}:{rel}"],text=True); pins=re.findall(r"(?m)^implementation_pin: ([0-9a-f]{40})$",text); assert len(pins)==1,pins; pin=pins[0]; assert pin!=receipt_commit,"receipt commit must postdate implementation pin"; subprocess.run(["git","merge-base","--is-ancestor",pin,receipt_commit],check=True); subprocess.run(["python3",".harness/harness/features/FEAT-69-long-file-check-state-package/notes/receipt-scripts/feat69-cleanpin.py",pin,"a726bad8"],check=True)'
    intent: |
      After T-01 through T-03 are committed, designate their exact full SHA as the immutable implementation pin before creating or committing any receipt script or receipt file. Under notes/receipt-scripts, adapt the FEAT-68 structure as feat69-baseline.py, feat69-cleanpin.py, and feat69-grade-assert.py; do not invent a second proof framework. The baseline and clean-pin scripts must create clean detached baseline and pin checkouts under .claude/worktrees/harness and assert both identities and empty status before measuring.

      The baseline script must define every SC-02 measurement: full-table output over every feature, --list, the nine named check-state suites, clean-tree feat62_findings, and clean-tree consolidation_findings. The grade assertion is the SC-01 lock: it enumerates check-state.py plus every Python file in check_state, requires every function grade to be at least 4, explicitly requires _inv41_invocation, _unquoted_hash_digit, _quoted_scalar_closed, and inv_49 to be present, compares moved functions with baseline pre-images by function identity and grade, and grades genuinely new lock-walker or table-glue functions as new with no exemption. Running this pin assertion against baseline is the committed red-first proof; do not add a file-length ratchet or unrelated permanent grade gate.

      Run each measurement exactly once per checkout and derive every reported byte, hash, diff, and verdict from that execution: one full-table check-state run over every feature; --list; all nine named check-state suites; clean-tree feat62_findings; clean-tree consolidation_findings; and code_grade over check-state.py plus every check_state package Python file. Capture exit status and raw stdout and stderr bytes and hashes. Before comparison, replace only each checkout's raw absolute root with one common token on both sides. Apply no other normalization. Require normalized exit status, stdout, and stderr identity for every SC-02 measurement. Record every remaining difference with its exact old and new bytes in build-divergences.md and leave the proof red unless the operator explicitly rules it; do not reinterpret behavior, message, severity, invariant-order, unrelated-file, or file-length differences as acceptable.

      Run the pin's feat69-grade-assert.py in the clean pin checkout and the same assertion against baseline. The pin run must show every function on the full entry-plus-package surface at grade 4 or better and the baseline run must show the intended red, explicitly naming _inv41_invocation, _unquoted_hash_digit, _quoted_scalar_closed, and inv_49. Record moved-function pre-image identity and grade, and identify every genuinely new function separately.

      Commit notes/receipt-scripts, red-first-receipts.md, clean-pin-byte-receipts.generated.md, the reviewed clean-pin-byte-receipts.md, and build-divergences.md only after the immutable implementation pin exists. The generated receipt must contain exactly one machine-readable line of the form implementation_pin: followed by the full 40-character SHA, and every other receipt must name that same full SHA. Each receipt names the full baseline and pin SHAs, detached checkout paths and clean status, exact commands, execution timestamps, one-execution provenance, exit statuses, raw and normalized hashes, comparison outcomes, grade records, and exact-byte divergence ledger. State explicitly that the receipt commit postdates the pin and does not claim any receipt or receipt script existed inside the pin it evaluates. The terminal verify resolves the pin from the committed generated receipt, proves that pin is a strict ancestor of the receipt commit, and passes the recorded pin to feat69-cleanpin.py rather than using post-receipt HEAD. Do not amend the implementation pin while writing proof; any implementation change creates a new pin and requires every measurement again.
