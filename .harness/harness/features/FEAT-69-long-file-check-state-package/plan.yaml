    traces: [SC-02, SC-03]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 assigns the check-state gate's owning behavioral tests and compatibility consumers directly to the main session.
    depends_on: [T-01, T-02]
    status: review
    files:
