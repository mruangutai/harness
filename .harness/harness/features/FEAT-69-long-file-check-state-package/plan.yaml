decisions:
  - id: D-01
    choice: Split check-state.py into a thin hyphenated entry over an importable check_state package with ctx.py, table.py, runner.py, and the eight settled read-family modules; keep Ctx whole and use host.py for the repository-scope shelling family.
    because: This keeps table discretion and the existing forked interface while making every invariant body's input ownership explicit without adding family entry points.
    dec: none
