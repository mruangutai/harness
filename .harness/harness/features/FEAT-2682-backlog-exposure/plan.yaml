decisions:
  - id: D-01
    choice: A backlog item's receipt key in backlog-issues.json stays nature:title, the exposure dropped, so the receipt keeps its shape and an entry an earlier run wrote still suppresses re-creating its item.
    because: The operator ruled the receipt unchanged and forward only; keying on the whole item would put the exposure into the receipt and make every rerun of an already-filed row create a duplicate. Rejected - keying on the full nature:exposure:title item. Accepted cost - re-passing a filed title with a different exposure is skipped, not re-filed.
    dec: none

