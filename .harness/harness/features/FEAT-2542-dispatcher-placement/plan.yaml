decisions:
  - id: D-01
    choice: A dispatcher in LEADS carrying harness_agent_id is placed only by its own runtime claim (find_run_claim, persona-matched); persona-mismatch, not-found, ambiguous, structured unreadable and escaped UnreadableRegistry/OSError are each an exit-2 lineage denial before any claim, never the declared feature and never the unavailable outcome; Main, non-lead dispatchers and a lead payload without harness_agent_id keep the declared-feature path.
    because: A failed placement silently replaced by the child's declaration drops a distill run's obligations with no backstop (measured at 2e7a2c77), DEC-100's unavailable channel is for safe own-failures and a refusal outranks it, and DEC-218/DEC-250 already refuse the same states elsewhere.
    dec: DEC-258
  - id: D-02
    choice: The product-lead to code-reviewer scope-reader rule holds unless the product lead's trusted placement resolves to its one open registered distill-* run; the route and the distill preflight consume one dispatch-local answer, the placement feature and its registered-run classification each read once, so they cannot disagree; rejected are a declared-mission exemption, a run-id or phase-field plan detector, panel existence as the discriminator, and reordering the start and distill preflights.
    because: Declared text supplies no authority (DEC-250), run records carry no phase field, a panel is written only after the reader wave, and the distill preflight already enforces marker, feature and tree root against the bound run, so a distill-placed lead declaring plan is still refused.
    dec: DEC-258

