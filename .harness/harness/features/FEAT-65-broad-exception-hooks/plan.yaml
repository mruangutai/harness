decisions:
  - id: D-01
    choice: Classify every one of the 77 hook sites as an expected typed boundary, a rule-level absorber to delete, or a legacy own-failure path that the settled classification routes to harness_boundary.hook_guard. Add no second failure wrapper or compatibility path, and do not add a universal entrypoint guard to a program whose classified sites are typed boundaries only.
    because: A single deep guard keeps expected recovery local while making programming defects loud and preserves one operator explanation of what was not checked.
    status: accepted
  - id: D-02
    choice: Preserve each hook's established fail-open or fail-closed verdict and every output byte except the legacy own-failure lines whose settled classification routes them to the canonical hook_guard wording, with each replacement ledgered and its owning case re-pinned. Shared authoritative direct commands remain outside a universal entrypoint guard, so unexpected direct-command failures stay loud and nonzero.
    because: This feature narrows defect masking; it does not change enforcement policy, and unrecorded wording drift would hide a policy change inside mechanical cleanup.
    status: accepted
  - id: D-03
    choice: Narrow inflight process identity exactly to (OSError, ValueError, IndexError, StopIteration) for the Linux proc reads, (OSError, subprocess.SubprocessError, ValueError) for ps, and (harness_boundary.AmbiguousWorktree, OSError) for feature worktree lookup while retaining None and the 24-hour fallback.
    because: Those are the settled environmental and parse boundaries; broader recovery would keep masking defects and different fallbacks would change claim liveness.
    status: accepted
  - id: D-04
    choice: Replace the four drifted gate bootstrap prologues with the run-unit-tests.py DEC-234 copy byte-for-byte, including its FEAT-64 comment, and protect all five copies with one reciprocal lock.
    because: DEC-234 requires intentional duplication until the bootstrap code can safely import shared code, so byte identity is the maintainable contract.
    status: accepted
  - id: D-05
    choice: Ratchet BROAD_CATCH_CEILINGS to the single harness_boundary.py value of 2, name an immutable implementation pin after build and simplify, test that pin from a clean checkout, and commit the tracked receipt later on the feature branch without claiming that the receipt exists inside the pin it names.
    because: Testing a named immutable implementation pin from a clean checkout makes the zero-hook census, prologue identity, and output evidence reproducible, while committing the receipt afterward avoids the impossible requirement that a tracked file contain the hash of the commit that already contains it.
    status: accepted
