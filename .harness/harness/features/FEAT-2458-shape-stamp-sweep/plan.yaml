      (1) the --dry-run run exits 0 and all five files still exist with their recorded bytes.
      (2) the dry-run stdout contains would remove .harness/.shape-sweep-stamp.FEAT-910-stamp-done.
      (3) the dry-run stdout has exactly one line containing .shape-sweep-stamp.FEAT-912-stamp-absent, and it contains unresolved and absent.
      (4) the real run exits 0 and .shape-sweep-stamp.FEAT-910-stamp-done no longer exists.
      (5) after the real run .shape-sweep-stamp exists with bytes plain.
      (6) after the real run .shape-sweep-stamp.FEAT-911-stamp-live exists with its bytes, and no stdout line of either run contains FEAT-911-stamp-live.
      (7) after the real run .shape-sweep-stamp.FEAT-912-stamp-absent exists with its bytes and exactly one stdout line of the real run contains it, carrying unresolved and absent; no stdout line of either run contains would remove or removed beside FEAT-912.
