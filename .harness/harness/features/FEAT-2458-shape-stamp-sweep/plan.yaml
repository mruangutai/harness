    intent: |
      Execute in the main session under DEC-174, inside the feature worktree .claude/worktrees/harness/FEAT-2458-shape-stamp-sweep only; every relative path here is relative to that worktree root and no edit may land outside it. Run gates with HARNESS_AGENT_TYPE unset.

      Product checkout: the harness repository itself (segment harness). It carries no docs/spec.md, docs/decisions.md or docs/architecture.md; its decision record is .harness/harness/docs/DECISIONS.md. Read DEC-174 (route), DEC-180 (the per-feature shape-sweep stamp is a high-water mark; a missing mark falls back to the window), DEC-191 (the station lives only in plan.yaml) and DEC-252 (INV-29 reads shipped records as data only) before editing. The BRIEF is .harness/harness/features/FEAT-2458-shape-stamp-sweep/BRIEF.md.

      Write the tests first and observe them fail (classify_feature does not exist yet) before touching production code.

      Production, .claude/skills/harness/bin/worktree_terminal.py:
      1. Add public classify_feature(root, feature_id) returning a tuple (klass, reason): klass is exactly one of the literals "terminal", "unresolved", "not_terminal" and reason is a non-empty str. Publish no new tuple constant for these three values; CLASSES stays as it is. root is the harness checkout whose default branch holds the feature directories. Build it ONLY from existing private helpers and add no new landed rule (FEAT-34 D-02: the gate and the hook share one predicate). feature_id is matched by EXACT directory name (plan D-03); classify_feature never calls _match_landed_id, _planning_segment or _resolve_landed:
         a. factory_config = _import_factory_config(); default_branch = _resolve_default_branch("harness", _import_feature_worktree(), factory_config). When None, return ("unresolved", "could not resolve the repository's default_branch").
         b. features_rel = os.path.join(".harness", "harness", "features"); names = _landed_dir_names(root, default_branch, features_rel). When names is None, return ("unresolved", "git ls-tree of the landed features directory errored").
         c. When feature_id is in names, resolved = (root, "harness", default_branch, features_rel, feature_id).
         d. Otherwise walk the fleet exactly: for each segment in _fleet_segments(factory_config), seg_rel = os.path.join(".harness", segment, "features"), seg_names = _landed_dir_names(root, default_branch, seg_rel); skip the segment when seg_names is None (a fleet segment with no landed features directory, as _planning_segment skips it); collect (segment, seg_rel) when feature_id is in seg_names. Exactly one hit: resolved = (root, segment, default_branch, seg_rel, feature_id). More than one: return ("unresolved", f"{feature_id} is landed under {len(hits)} segments' features directories"). None: return ("unresolved", f"{feature_id} is absent from {default_branch}'s features directory"); the word absent in this reason is the contract the sweep and the operator read, and no other reason classify_feature returns contains it.
         e. classified = _landed_classification(resolved). When not None, return it unchanged (it is already a terminal or unresolved pair with its reason). When None, return ("not_terminal", f"landed station for {feature_id} on {default_branch} is not finished").
         Do not modify _resolve_landed, _planning_segment, _match_landed_id, classify or classify_all: worktree resolution keeps its unique-prefix semantics, pinned by the existing prefix cases in tests/integration/test-worktree-terminal.py.
      2. Undecodable landed blobs, fixed at the landed-blob read seam: in _landed_blob_text, the cat-file call _run_git(["cat-file", "blob", blob], owner_root) decodes stdout as text, and a blob whose bytes are not valid UTF-8 raises UnicodeDecodeError out of subprocess.run, past _run_git's (OSError, subprocess.SubprocessError) catch. Wrap only that one call in try/except UnicodeDecodeError and return (None, "unparseable") from the handler; add "unparseable" to the docstring's list of error words. _read_landed_feature_json and _read_landed_plan_yaml already pass that error through, so an undecodable feature.json or plan.yaml classifies unresolved (landed feature.json for ID is unparseable) for classify and classify_feature alike instead of raising. Change no other line of _run_git or the readers. Do not add any broad except: tests/integration/test-checker-structure-locks.py and tests/unit/test-broad-catch-census.py hold this file at a zero broad-catch ceiling.
      3. Rewrite the module docstring's public-surface sentence (it currently reads: Public surface, and nothing wider: CLASSES, classify(root) and classify_all(root) (D-10).) so it names CLASSES, classify(root), classify_all(root), classify_feature(root, feature_id) and repo_arg_for_segment(repo_segment), adding one sentence: classify_feature answers whether ONE feature id, matched exactly, is finished on the harness default branch by the same landed rule, and post-merge-sweep.py's stamp sweep calls it (#2458).

      Tests, tests/integration/test-worktree-terminal.py: add case_classify_feature and append it to the results expression in main(). Build real git repositories with the existing helpers (_repo, _commit_feature with plan_station, _commit_brief, _build_probe_repo, _write_fleet, _run_classify_all_subprocess). Assert the literal klass and the reason per row, each as its own result tuple:
      (a) a feature committed with plan_station done gives terminal.
      (b) a feature with only a committed BRIEF whose approval block is status approved and whose by line names DEC-174 gives terminal, reason contains DEC-174.
      (c) plan_station building gives not_terminal, reason non-empty.
      (d) an id never committed gives unresolved, reason contains absent.
      (e) a feature whose feature.json is a raw unparseable string gives unresolved, reason does not contain absent.
      (f) a feature at plan_station shipped (outside the station vocabulary) gives unresolved, reason does not contain absent.
      (g) fleet: in a probe root from _build_probe_repo with _write_fleet declaring acme/second-repo (default_branch main), a feature committed only under repo_segment second-repo with plan_station done, classified in a subprocess through _run_classify_all_subprocess calling worktree_terminal.classify_feature(probe_root, id), gives terminal.
      (h) the same fleet fixture, a second id at plan_station building, gives not_terminal.
      (i) absent prefix: commit FEAT-920-prefix-absent-longer with plan_station done and nothing named FEAT-920-prefix-absent; classify_feature(root, "FEAT-920-prefix-absent") gives unresolved, reason contains absent (never terminal).
      (j) exact fleet over a harness prefix: in the fleet fixture of (g), commit FEAT-921-fleet-exact under repo_segment second-repo with plan_station done and FEAT-921-fleet-exact-longer under repo_segment harness with plan_station building; classify_feature(probe_root, "FEAT-921-fleet-exact") in the subprocess gives terminal.
      (k) undecodable: write .harness/harness/features/FEAT-922-bad-utf8/feature.json with open(path, "wb") holding the bytes b'{"feature_id": "\xff"}', and the sibling plan.yaml holding plan_text("FEAT-922-bad-utf8", "done") (add plan_text to the file's existing from git_support import line), and commit both with git add and git commit as _commit_brief does; classify_feature gives unresolved, reason contains unparseable and does not contain absent, and the call raises nothing.
