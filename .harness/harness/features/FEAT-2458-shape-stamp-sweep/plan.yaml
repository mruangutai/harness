decisions:
  - id: D-01
    choice: classify_feature reports a feature with no directory on the default branch as unresolved, with a reason naming it absent, so it has three results (terminal, unresolved, not_terminal) and no fourth exempt_absent result.
    because: the operator chose it at grilling; a kept never-landed stamp must stay visible to a human each merge, and the sweep deletes on terminal only either way.
    dec: none
  - id: D-02
    choice: Stamps are deleted by the post-merge sweep on classify_feature's terminal result only, which reuses the existing landed rule; not in feature-worktree.py remove and never keyed on worktree presence.
    because: worktree presence misses direct builds, hand-removed worktrees and every existing stamp, and a second rule in the hook could disagree with the INV-29 gate (FEAT-34 D-02, one shared predicate).
    dec: none

  - id: D-03
    choice: classify_feature matches a stamp's feature id against landed directory names exactly, in the harness features directory and then each fleet segment's; it never uses _match_landed_id's unique-prefix rule, which stays the worktree-only resolution inside classify and classify_all.
    because: a stamp names a full feature id, so a prefix match would delete a never-landed feature's stamp when a longer landed id is finished, and a harness prefix hit would hide an exact fleet match; sharing the prefix matcher is the alternative a future scan will re-suggest.
    dec: none
