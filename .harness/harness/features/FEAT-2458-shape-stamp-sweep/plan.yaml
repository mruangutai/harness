      Call _assert_resolved_root_in_fixture for both runs. Every pre-existing case stays green.

      The real main checkout's stamps are not a criterion: the operator may list .harness/.shape-sweep-stamp* after merge as a post-merge operational check. Never delete or edit a real stamp by hand.
