  - id: T-07
    title: Make the gates block of harness.json read by a program instead of by a reader
    traces: [REQ-10]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/gate_policy.py
      - .claude/skills/harness/bin/test-gate-policy.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      No script in this repository reads the gates block of .harness/harness.json at all. Its four
      keys - qa_gate, review, uat and merge - are honoured only by agents reading configuration as
      prose, which is a policy that reports without enforcing. Write gate_policy.py to close that.
      Test-first, in test-gate-policy.py.

      API. load_policy(harness_json_path) returns a mapping of the four gate names to their declared
      policy values, reading each key BY NAME. A missing key, an unreadable file, a file that does not
      parse, or a value not in that gate's known vocabulary each raise a GatePolicyError carrying the
      gate name and the offending value. There is no default and no fallback: a silent default is how
      the block came to have no consumer in the first place, and DEC-190's precedent is that a missing
      dependency is a loud error and never a quieter mode.

      Known vocabularies, taken from the live config: qa_gate accepts blocking and advisory; review
      accepts blocking, advisory and advisory_unless_high; uat accepts blocking,
      blocking_when_uat_criteria_exist and advisory; merge accepts user_gated and autonomous.

      evaluate_review(policy, must_fix, severity_max) returns the string PASS or FAIL, implementing
      DEC-31 under the declared policy: with advisory_unless_high, a non-empty must_fix list or a
      severity_max of high or critical returns FAIL and anything else returns PASS; with blocking, any
      non-empty findings list returns FAIL; with advisory, always PASS. severity_max is one of none,
      low, med, high, critical and an unknown value raises rather than comparing false.

      evaluate_qa(policy, suites) returns PASS or FAIL from a mapping of suite name to pass, fail or
      skipped: under blocking any fail is FAIL and a skipped suite is reported in the returned detail
      but does not fail; under advisory always PASS.

      Tests. Assert each of the four keys is resolved individually from a fixture config, one
      assertion per key, passing the fixture path explicitly so the loader cannot fall back to live
      state. Assert a fixture whose qa_gate value is the unrecognised string sometimes raises
      GatePolicyError naming qa_gate and sometimes. Assert an absent gates block raises. Assert
      evaluate_review returns FAIL for empty findings but non-empty must_fix, and PASS for empty
      must_fix with severity_max med - this is the pair that proves a clean report cannot pass a
      review on its own.

      Register test-gate-policy.py in the UNIT_SCRIPTS array of run-unit-tests.sh and do not add it to
      test_kinds.integration.detect.

  - id: T-08
    title: Cutover - make a grade an actual finding the reviewer cannot omit
    traces: [REQ-05, REQ-06, REQ-10]
    change_type: cross_module
