tasks:
  - id: T-01
    title: Compute the three metrics and the grade, pinned by hand-derived fixtures
    traces: [REQ-03]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/code_grade.py
      - .claude/skills/harness/bin/test-code-grade.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Write a new module code_grade.py exposing a pure, importable API, and a test file
      test-code-grade.py that pins its counting rules. Test-first: write the fixture assertions and
      watch them fail before the module exists, then make them pass.

      API. grade_source(source_text, path) returns a list of FunctionGrade records, one per function
      and per method, in source order. Each record carries: qualname (dotted, class-qualified, with
      nested functions joined by a dot), lineno (the line of the def or async def statement),
      cyclomatic (int), cognitive (int), abc_a (int), abc_b (int), abc_c (int), abc (float, one
      decimal), grade (int 1 to 5), and driver (one of the strings cyclomatic, cognitive, abc), being
      the metric that produced the grade. When two metrics tie for the worst band, driver names them
      joined by a plus in the fixed order cyclomatic, cognitive, abc.

      Bands, exactly as settled. Grade 5: cyclomatic <= 4 and cognitive <= 3 and abc <= 8. Grade 4:
      cyclomatic <= 8 and cognitive <= 9 and abc <= 20. Grade 3: cyclomatic <= 10 and cognitive <= 15
      and abc <= 26. Grade 2: cyclomatic <= 20 and cognitive <= 30 and abc <= 45. Grade 1 otherwise.
      Each metric is banded independently and the WORST of the three band results is the grade. Never
      average.

      Cyclomatic: start at 1; add 1 for each if, each elif, each for, each async for, each while, each
      except handler, each with item beyond the first, each assert, each comprehension for clause,
      each comprehension if clause, each match case other than a bare wildcard, and each boolean
      operator value beyond the first in a BoolOp. else and finally add nothing.

      Cognitive, a Sonar-style approximation and named as such in the module docstring: increments for
      if, elif, else, ternary IfExp, for, async for, while, except handler, finally, and each
      BoolOp sequence (one increment per BoolOp node, not per operand); nesting penalty equal to the
      current nesting depth added to every increment except elif and else, where nesting is increased
      by if, for, while, except, with, and a nested function or class definition; a break or continue
      carrying a label equivalent does not apply here, so ignore it; recursion adds 1 when the
      function calls its own qualname.

      ABC: A counts every binding occurrence of a name, meaning each target of an assignment including
      every name in a tuple unpacking, each augmented assignment target, each walrus target, each for
      target name, each with-as and except-as name, each import binding, and each nested def or class
      name. B counts every Call node, plus 1 for each decorator that is a bare Name rather than a
      call. C counts each if, elif, ternary, while, for, except handler, assert, comprehension if,
      match case, each operator in a Compare node, each unary Not, and each operand beyond the first
      in a BoolOp. The magnitude is the square root of A squared plus B squared plus C squared,
      rounded to one decimal place with round-half-up.

      Fixtures. Put every fixture in test-code-grade.py as a triple-quoted source string next to its
      expectation, with a comment DERIVING each expected number by hand: list the constructs counted
      for A, for B, for C, for cyclomatic and for cognitive, and show the arithmetic. A derivation
      that says the number came from running the tool is not acceptable and will be rejected at
      review. Ship at least twelve fixtures, and the set must include at least one landing on each of
      grades 5, 4, 3, 2 and 1; add an assertion that the set of grades produced by the fixture table
      equals the set 1,2,3,4,5, so a future edit cannot quietly drop a band.

      Direction pairs. Add at least four before/after pairs where the after version changes exactly one
      habit and is worse, asserting grade(after) < grade(before), and at least two where the after
      version is better, asserting grade(after) > grade(before). The four habits to cover are: replace
      an early return with a nested if; merge two sequential loops into one nested loop; add a third
      condition to an if; inline a helper call back into the caller.

      Register test-code-grade.py in the UNIT_SCRIPTS array of run-unit-tests.sh. Do not add it to
      test_kinds.integration.detect in harness.json; the runner's kind cross-check rejects a
      UNIT_SCRIPTS name that appears there, and unit.detect already globs bin/test-*.py.

      Keep every function you write in code_grade.py at grade 4 or better under the bands you are
      implementing. The tool must pass its own bar.

  - id: T-02
    title: Resolve the set of functions a change is responsible for
    traces: [REQ-04]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/code_grade.py
      - .claude/skills/harness/bin/test-code-grade.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Extend code_grade.py with gated_set(repo_root, base_ref, head_ref) returning two lists:
      gated and informational. Add its tests to test-code-grade.py, test-first.

      The rule, and it is stated over GRADES not over diff text. A function is gated when either it
      has no pre-image at base_ref, or its grade at head_ref is strictly worse (numerically lower)
      than its pre-image's grade at base_ref. Every other function that appears anywhere in the
      changed files is informational: it is listed with its grade and never produces a finding, even
      when its grade is 1. Because the rule reads grades and not text, a whitespace reformat, a
      comment edit or a docstring edit cannot move anything into the gated set; do not write an
      exclusion list for those cases.

      Pre-image resolution, in this order. First, the same qualname in the pre-image of the same file.
      Second, if that fails, a function in the pre-image of the same file whose body source hash
      matches, where the body hash is computed over the ast.unparse output of the function body only,
      excluding the def line and excluding the docstring; this makes a pure rename resolve to its
      original and therefore never gated. Third, if the file itself has no pre-image at its current
      path, use git diff with rename detection enabled between base_ref and head_ref to find the old
      path and look the pre-image up there, so a whole-file move gates nothing.

      Read both sides through git show ref colon path rather than the working tree, so the result is
      the same whether or not the tree is dirty. A file that exists at head_ref and not at base_ref
      after rename detection means every function in it is new.

      Tests. Build a synthetic git repository in a temporary directory with two commits. The second
      commit must contain, in one commit, all seven of: a newly added function; a body edit that
      lowers an existing function's grade; a body edit that raises one; a rename with a byte-identical
      body; a whitespace-only reformat; a signature change that adds no branching; and a whole-file
      move with no body edits. Assert the gated set equals exactly the new function and the worsened
      one by set equality of qualnames, and then assert each of the other five cases absent
      individually, one assertion per case, so a single over-broad match cannot hide a miss. Include
      one function that already grades 1 at base_ref and is untouched, and assert it is absent from
      gated and present in informational.

      Use the git binary through subprocess with an explicit -C repo_root; do not rely on the process
      working directory.

  - id: T-03
    title: The command line surface, its exit statuses and its report fields
    traces: [REQ-03, REQ-05, REQ-06, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-02]
    status: pending
    files:
      - .claude/skills/harness/bin/code-grade.py
      - .claude/skills/harness/bin/test-code-grade-cli.py
      - .claude/skills/harness/bin/run-unit-tests.sh
      - .harness/harness.json
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind integration
    intent: |
      Write the executable code-grade.py that drives the code_grade module, and its forking test file
      test-code-grade-cli.py. Test-first.

      Invocation. code-grade.py --base REF --head REF reports over the gated set of that range.
      code-grade.py PATH... reports over the named files with no diff resolution. A --json flag emits
      one JSON object; the default is text. Both must be produced from the same in-memory records.

      Report fields, per gated function, each on its own labelled field so a consumer can read them
      individually: the repository-relative path, the line number of the def, the qualname, cyclomatic,
      cognitive, abc, the grade, and the driver metric name. Text output puts one function per block
      with one field per line. Never emit a single opaque summary string as the only carrier of these
      values.

      Bars. A production function must reach grade 4; a test function must reach grade 3. Decide which
      a file is by evaluating the detect and exclude glob strings already in harness.json test_kinds,
      splitting each on the pipe character - note that detect is a pipe-separated STRING, not a list,
      so iterating it directly yields characters. A file matching any active kind's detect and not its
      exclude is test code; everything else under .claude/skills/harness/bin is production. Do not
      hardcode a second path list.

      Findings and reasons. A gated function below its bar at grade 1 is emitted as a finding with
      severity high. At grade 2 it is emitted with severity med and an additional explicit line of the
      form REASON REQUIRED followed by the qualname; emit that line only for grade 2 functions, never
      unconditionally. Grade 3 and above emit no finding, and for a test-code function grade 3 is a
      pass.

      Unparseable files. When ast.parse raises, print PARSE ERROR, the repository-relative path and the
      exception message to stderr, exclude the file from every count of graded and passing functions,
      and list it under an UNGRADED heading in the report. Never treat it as clean.

      Exit statuses, all distinct: 0 when every file parsed and no gated function is below its bar; 1
      when at least one gated function is below its bar; 3 when at least one file could not be parsed,
      regardless of the grades of the rest; 2 for a usage error. A run over a corpus containing an
      unparseable file must never exit 0.

      Determinism. Sort output by repository-relative path then by line number, never by directory
      iteration order. Emit only repository-relative paths, never absolute ones, and never the working
      directory. Resolve the repository root from the --base/--head repo argument or from git
      rev-parse --show-toplevel, and make every path relative to it.

      Tests, driving the real script through subprocess. Assert each report field separately for a
      known fixture, one assertion per field. Assert all four exit statuses. Assert the ungraded case
      by name and assert the passing count excludes it. Assert byte-identical stdout when the same
      fixture repository is copied to two different absolute paths and the script is invoked from two
      different working directories. Assert REASON REQUIRED appears naming the grade-2 function, and
      assert it is absent entirely from a run whose gated set has no grade-2 function.

      Register test-code-grade-cli.py in the INTEGRATION_SCRIPTS array of run-unit-tests.sh AND add
      the literal path .claude/skills/harness/bin/test-code-grade-cli.py to the pipe-separated
      test_kinds.integration.detect string in harness.json. The runner's kind cross-check fails if you
      do only one of the two.

  - id: T-04
    title: Write the skill that teaches the bar and the habits that keep code under it
    traces: [REQ-01, REQ-08]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for every .claude/skills/harness-*/ path, measured at 6e4a273
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness-code-risk-grading/SKILL.md
    verify: |
      test -f .claude/skills/harness-code-risk-grading/SKILL.md
    intent: |
      Author the skill harness-code-risk-grading. It is the ONLY delivery of this knowledge to the
      engineering squad, which has never been told any of it exists. If it is thin, the team writes
      exactly as it writes today.

      Lead with the habits, not the table. The habits that keep a function at grade 4: return early
      instead of nesting; one loop per function, and extract the inner one; extract a compound
      condition into a named predicate; handle the error case first and leave the happy path
      unindented; give each function one reason to change. For each habit show a short before and
      after with the grade of each, and say which metric moved and why.

      Then the reference: the five bands with their three thresholds, the two bars (grade 4 for
      production code, grade 3 for test code, because tests may repeat themselves but may not be
      unreadable), and worst-metric-wins with one worked example of a function whose cyclomatic score
      looks fine and whose cognitive score does not.

      Say plainly, in the skill: the cognitive number is a Sonar-STYLE approximation, not
      SonarSource's own algorithm, so do not expect it to match a Sonar report; shell scripts and
      TypeScript files are not graded at all, so nothing here says anything about them; and this
      grading does not fix the code already below the bar, which is a separate cleanup and is
      deliberately not a touch-it-fix-it ratchet.

      Say what happens when a function fails: grade 1 becomes a high finding, which fails the review
      under the rule that already exists; grade 2 passes but the reviewer will demand a written reason
      naming the function. Tell the reader how to check their own work before review, with the exact
      command.

      WORKED EXAMPLES BLOCK, and this part is machine-read. End the skill with a section headed
      Worked examples containing at least five entries. Each entry is a fenced python code block
      holding one complete function, immediately followed by a line of the exact form
      EXPECTED GRADE: N. A test in T-06 parses this section, runs the grader over each block and
      asserts the grade matches, so the skill and the tool can never drift apart. Pick examples that
      span at least grades 5, 4, 3 and 1.

