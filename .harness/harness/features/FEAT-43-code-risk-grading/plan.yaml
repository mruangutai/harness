  - id: T-09
    title: Make the route check answer about the manifest the write hook consults
    traces: [REQ-09]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 amendment 4 names check-plan-routes.py and its test file as enforcement layer
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/check-plan-routes.py
      - .claude/skills/harness/bin/test-check-plan-routes.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind integration
    intent: |
      The defect, measured 2026-08-27. check-plan-routes.py printed OK for a task route minutes before
      every write on that route was denied. The mechanism: the write hook is registered in
      settings.json as CLAUDE_PROJECT_DIR joined to .claude/skills/harness/bin/check-domain.sh, so at
      hook time it resolves the OWNER checkout's .harness/team-config.yaml. check-plan-routes.py run
      from inside a feature worktree with CLAUDE_PROJECT_DIR unset falls back to the root derived from
      its own file location, which is the WORKTREE, and reads the BRANCH's team-config.yaml. The two
      disagree exactly when a plan adds or moves a domain grant, which is exactly when the check
      matters.

      The fix. Before resolving any route, determine the manifest the hook will consult: take the
      resolved root, ask harness_boundary.worktree_owner for its owner checkout, and use the owner's
      .harness/team-config.yaml. Set HARNESS_PROJECT_DIR to that owner root in the environment passed
      to the check-domain.sh subprocess, so the resolver and the live hook read the same file. Print
      one line naming the absolute manifest path actually used, on every run, so the answer is never
      silently about a different tree.

      When the branch manifest and the owner manifest DIFFER in content, do not silently prefer one:
      print a DEVIATION line naming both paths and stating that the routes were resolved against the
      owner manifest because that is what the hook will consult, and count it toward the violation
      total so the exit status is non-zero. A plan whose routes depend on an unmerged manifest change
      is exactly the case that produced the false OK.

      When the owner checkout cannot be established, or its manifest is not readable, exit 2 with a
      message saying so. Do not fall back to the branch manifest - a fallback here reproduces the
      defect under a different name.

      Tests, in test-check-plan-routes.py. Build a fixture with an owner checkout whose manifest
      grants nothing and a linked worktree under the worktrees segment whose branch manifest grants
      everything, holding a plan that routes a task to an agent only the branch manifest grants.
      Assert the checker reports a violation and exits non-zero. Then prove the assertion can fail:
      extract the previous revision of check-plan-routes.py with git show HEAD colon path into a temp
      file, run the same fixture through it, and assert THAT run reports OK - so the new case is shown
      to discriminate rather than being green for an unrelated reason. Add a case asserting exit 2
      with the stated message when the owner manifest is unreadable.

  - id: T-10
    title: Pin one canonical spelling for the vocabulary this feature introduces
    traces: [REQ-11]
    change_type: docs
    execution_mode: team
    execution_agent: harness-pm
    depends_on: [T-04]
    status: pending
    files:
      - .harness/glossary.md
    verify: |
      test -f .harness/glossary.md \
        && grep -qi 'risk grade' .harness/glossary.md \
        && grep -qi 'gated set' .harness/glossary.md \
        && grep -qi 'driver metric' .harness/glossary.md \
        && grep -qi 'ABC magnitude' .harness/glossary.md \
        && grep -qi 'cognitive complexity' .harness/glossary.md
    intent: |
      Create .harness/glossary.md, which does not exist yet, and give it exactly the terms this
      feature settles. It is a glossary, not a spec: one canonical term per concept, one or two
      sentences each, no thresholds, no implementation detail, no duplication of the skill.

      The terms: risk grade (the integer 1 to 5 a function carries, worst metric wins); gated set (the
      functions a change is responsible for, being those that are new or whose grade got worse);
      driver metric (the one of the three metrics that produced the grade); ABC magnitude (the
      combined assignment, branch and condition size of a function); cognitive complexity (a
      Sonar-style approximation of how hard a function is to follow, not SonarSource's algorithm);
      cyclomatic complexity (the number of independent paths through a function).

      Say once, under risk grade, how it meets the vocabulary that already exists: grade 1 is reported
      as a high severity finding and grade 2 as med, on the existing severity ladder. Do not introduce
      a second word for severity, for finding or for gate.
