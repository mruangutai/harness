decisions:
  - id: D-01
    choice: A function is graded against the bar only when it is new in the change or when its grade at the head ref is strictly worse than the grade of its pre-image at the merge base; everything else is reported as informational and never as a finding.
    because: the operator refused a touch-it-fix-it ratchet, and gating every function that appears in a diff hunk would make one file move inherit all 226 pre-existing failures
    dec: none
  - id: D-02
    choice: The rule is stated over grades rather than over diff text, so a reformat, a comment change or a docstring edit cannot fire the gate at all, by construction rather than by an exclusion list.
    because: an exclusion list of non-substantive edit kinds is unbounded and every omission is a false gate
    dec: none
  - id: D-03
    choice: Pre-image identity is resolved by qualified name first, then by body hash within the same file, and file moves are resolved through git rename detection so the pre-image is looked up at its old path.
    because: without the body-hash fallback a pure rename makes an old function look new and gates a pre-existing failure on an improvement, which is the opposite incentive
    dec: none
  - id: D-04
    choice: The ABC, cyclomatic and cognitive counting rules are authoritative only as pinned by hand-derived fixtures, and the planning measurements are treated as directional evidence, not as expected values.
    because: Fitzpatrick's ABC specification varies by language and the planning figures used one defensible reading, so calibrating the tool to reproduce them would make the tool agree with an unverified label
    dec: none
  - id: D-05
    choice: The cognitive complexity implementation is named a Sonar-style approximation wherever it is reported, in the tool output and in the skill, and never as SonarSource's algorithm.
    because: reporting an approximation under the name of a published algorithm invites an engineer to check it against a Sonar number and conclude the tool is broken
    dec: none
  - id: D-06
    choice: The band thresholds and the two bars ship exactly as settled with the operator, and any divergence found between the re-measured repository failure rate and the recorded 27.1 percent production and 11.7 percent test rates is escalated rather than resolved by moving a band.
    because: the bands were calibrated against a measurement, so silently re-banding to reproduce a rate is fitting the ruler to the thing being measured
    dec: none
  - id: D-07
    choice: The two folded-in checker defects are two tasks, not one.
    because: they resolve to different execution modes under DEC-174 amendment 4, and a task needing both routes must be split; they also share no file, no root cause and no test
    dec: DEC-174
  - id: D-08
    choice: The grading library and its CLI are squad work; the step that makes a review verdict depend on their output is main-session-direct.
    because: DEC-174 amendment 4 states that a module a gate imports is not itself a gate, and that the cutover which makes a gate use it is main-session-direct
    dec: DEC-174
  - id: D-09
    choice: A file the tool cannot parse is reported by name and given its own process exit status, distinct from the all-clear status and from the bar-failed status.
    because: folding unreadable into clean is the exact failure this feature was raised to remove, and a shared exit code makes the two indistinguishable to any caller
    dec: none
  - id: D-10
    choice: The code reviewer's digest gains a required grading field, so a review cannot be returned without stating the grading outcome.
    because: without it the reviewer running the tool is protocol rather than enforcement, which is the same shape as the two defects this feature fixes
    dec: DEC-175
  - id: D-11
    choice: check-plan-routes.py resolves the manifest the write hook will consult by walking to the worktree owner, and refuses with a non-zero exit when it cannot establish which manifest that is.
    because: the hook binary is invoked as CLAUDE_PROJECT_DIR joined to the bin path, so it reads the owner checkout's manifest while the checker run inside a worktree derived the branch's manifest, and the two disagree exactly when a plan adds a grant
    dec: none
  - id: D-12
