decisions:
  - id: D-01
    choice: Issue 206 item 2 is not built, and a central .harness/products/ tree is created nowhere.
    because: The plan-phase advisor ruled it already satisfied in substance, and a central product config would be read by nothing since product_config reads only the remote at default_branch.
    dec: DEC-174
  - id: D-02
    choice: Step 1's prerequisite install is narrowed to the control-plane clone rather than deleted.
    because: check-state.sh INV-9 and INV-31 grade this clone against that step on every run and test-hooks-install.py asserts its command strings verbatim out of the skill.
    dec: none
  - id: D-03
    choice: The pilot product's four already-committed stale .harness/ subtrees are out of scope, and the rewritten skill only stops producing them.
    because: Deleting them is a write into a product default branch that no domain grants, and .harness/team-config.yaml is the boundary MARKER root_above reads, so removal is not reversible by a later cycle.
    dec: none
  - id: D-04
    choice: Fleet registration comes LAST — the product's harness.json lands on its default branch first, then the repos entry is added, and factory_config --check-product-configs must exit 0 before anything else runs.
    because: product_config has no disk fallback, so registering first opens a window whose only symptom is an unattributed FleetError mid-build, while ordering the steps this way makes the gap impossible and the check names any member that slipped through.
    dec: none
  - id: D-05
    choice: harness-init stays in check-instruction-paths.py MAIN_SESSION_ONLY, and only its rationale comment is corrected.
    because: The skill deliberately carries a clone-relative core.hooksPath value that the anchor rule would rewrite, and test-hooks-install.py asserts that value verbatim, so bringing the file under the anchor gate would break a live assertion to gain nothing.
    dec: none

  - id: D-06
    choice: Issue 203's scoped deletion of harness-init and issue 206's rewrite of it are reconciled IN FAVOUR OF REWRITE, and no task in this plan deletes the skill.
    because: Issue 203 is closed, the deploy.sh it was scoped around is absent from .claude/skills/harness/bin/, and .claude/skills/harness-init/SKILL.md still exists and is still the only onboarding instruction of record.
    dec: none
  - id: D-07
    choice: |
      Issue 206 is revised IN PLACE. No successor feature is created and no narrowed FEAT-56 is
      shipped; T-01 through T-08 stay done and nothing they delivered is reverted.
    because: |
      The operator ruled it on 2026-09-08 (notes/answers-rescope-2026-09-08.md item 1), overriding
      the advisor's SUCCEED recommendation. The engineering case agrees: the fifteen-file
      documentation inspection and the six executable-site sweep would otherwise be paid a second
      time over the same files, and a feature whose sole functional criterion is a failed uat cannot
      honestly be recorded as shipped.
    dec: none
  - id: D-08
    choice: |
      Onboarding becomes two artifacts along the seam the shipped file already carries. harness-init
      keeps its preflight, Track A and the --upgrade section and becomes only configure this harness
      checkout. A new skill harness-add-repo takes Track B minus steps 6, 7 and 8, the three-things
      opening paragraph and the one-file rule, and carries repository registration end to end with a
      preflight of its own.
    because: |
      The seam exists in the shipped file at SKILL.md:48 and :239 as of 12f74ea8, so the split reuses
      a boundary rather than cutting a new one, and the two jobs have disjoint preconditions: Track A
      runs once against an unconfigured checkout, Track B runs repeatedly against a configured one.
      Steps 6 to 8 leave entirely because they are the first BRIEF, its approval and the design pass,
      which are plan work rather than onboarding work (D-09).
    dec: DEC-220
  - id: D-09
    choice: |
      First-BRIEF, approval and design work leave onboarding altogether. A configured fleet
      repository that lacks its first BRIEF routes to /harness-plan, and neither onboarding artifact
      drafts a BRIEF, takes an approval or runs a design pass.
    because: |
      The operator ruled it (answers-rescope item 4), and the router already agrees where it was
      last corrected: commands/harness.md:14-17 sends a registered fleet member with an empty
      features directory to /harness-plan. The stale routes are elsewhere, measured at 12f74ea8:
      commands/harness-plan.md:18 and commands/harness-grilling.md:7 and :13. The approval-taking
      step inside onboarding also duplicated pm's own gate at a tier that cannot review a plan.
    dec: DEC-120
  - id: D-10
    choice: |
      harness-add-repo is a SKILL, and no command door is minted for it or for harness-init. DEC-06
      is NOT re-decided by this feature.
    because: |
      DEC-06's conclusion is that the runner is a skill rather than a command, and the new artifact
      conforms to it. DEC-06's stated premise, that harness-deploy distributes skills and agents but
      not the Claude command directory (DECISIONS.md:95-97), expired when deploy.sh and
      .claude/commands/harness-deploy.md were deleted in commit 45859123 for issue 259; no
      DECISIONS.md entry records that deletion, and DEC-113, which the earlier BRIEF cited for it,
      governs crew overrides rather than distribution. The conclusion survives on a different
      ground: a skill loads under every provider through the .agents/skills symlink today, while a
      command file is discovered by one provider's root only. So nothing signed is reversed, and the
      record of why is this entry.
    dec: DEC-06
  - id: D-11
    choice: |
      The canonical root for command doors is .omp/commands. The four doors are authored there, and
      .claude/commands holds generated adapters carrying a first-line banner naming the canonical
      file, produced and checked by bin/sync-command-adapters.py on the sync-agent-adapters.py
      pattern.
    because: |
      OMP reads slash commands from the config root's commands directory (omp://config-usage.md,
      scope-specific loading), and .omp/config.yml sets disabledProviders claude, so a door authored
      only under .claude/commands is discovered by Claude Code and by nothing else. A symlinked
      .claude/commands was considered and rejected: it cannot be shown to work here, because no test
      in this repository can exercise Claude Code's own discovery, whereas duplicated files with a
      diff-clean check are certain to work in both surfaces and their drift is caught mechanically.
      Commands carry no frontmatter, so the adapter is a copy plus a banner rather than a
      transformation.
    dec: none
  - id: D-12
    choice: |
      harness-init's preflight carries NO Claude CLI version check of any kind: both the
      claude --version probe line and the CLI under 2.1.217 STOP bullet are DELETED from it. The floor
      is not kept, not made runtime-conditional, and not replaced by a warning; it leaves the preflight
      entirely. harness-add-repo still carries no provider CLI check of any kind, unchanged. The
      operator ruled this on 2026-09-09, overriding pm's earlier runtime-conditional draft.
    because: |
      The operator's ruling of 2026-09-09, recorded as theirs and not as pm's. The floor's own stated
      reason was the spawn env vars, which is DEC-83's nesting-depth setting and therefore a Claude Code
      mechanism, and this artifact is being isolated to fresh-checkout configuration under a
      provider-neutral doctrine, so a Claude-Code-only gate has no home in it. The accepted cost: Claude
      Code operators lose a live preflight check. D-13 records the cascade this leaves open.
    dec: DEC-83
  - id: D-13
    choice: |
      RULED BY THE OPERATOR, 2026-09-09: the cli_min_version key is REMOVED from every config site
      that carries it, and DEC-83 is amended to match. The five sites are .harness/harness.json:3,
      .harness/team-config.yaml:11, .claude/skills/harness/templates/harness.json:4,
      .claude/skills/harness/templates/team-config.yaml:22 and
      .claude/skills/harness/templates/examples/harness.kaya-ai.json:4 — measured at 97fe447f, all
      five present. T-18 removes it from this project's live config, T-19 from the four sites that
      resolve to NOBODY, T-20 amends DEC-83 and BUILD.md. The CLI version band 2.1.172–2.1.216 /
      2.1.217–2.1.218 / >=2.1.219 SURVIVES in DEC-83 and BUILD.md as the documented compatibility
      fact; what leaves is the DECLARED floor, in config and in the doctrine sentence that told
      readers to pin it. The operator overrode pm's earlier recommendation, which was to keep the key
      as a documented, unenforced floor.
    because: |
      The operator's ruling of 2026-09-09, recorded as theirs and not as pm's. The ground: D-12
      severed the key from its only enforcement point, and nothing in the tree reads it — no reader,
      no schema entry, and no reference anywhere under .claude/skills/harness/bin/ (measured at
      97fe447f: the only non-config occurrence in the whole tree is one prose line,
      .harness/harness/docs/BUILD.md:426, which enumerates harness.json's keys). A value five config
      files declare and no code consults reads as load-bearing to every later reader, which is the
      cost the ruling removes. The accepted cost: the compatibility floor is no longer declared
      anywhere machine-readable, so a run under a CLI below 2.1.217 is documented but ungated —
      DEC-83's band table is what a reader consults instead. pm's contrary recommendation, to keep
      the key as a documented unenforced floor, was overridden and is recorded here only so the
      override is not mistaken for agreement.
    dec: DEC-83
