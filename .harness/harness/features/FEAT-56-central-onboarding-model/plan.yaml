         REPAIR that is the point of this task's first verify check. Do NOT assume the file is
         loadable - it is NOT. Measured at 4b5dbb23, from the worktree root:
           python3 -c "import yaml;yaml.safe_load(open('.claude/skills/harness/templates/team-config.yaml'))"
         raises yaml.parser.ParserError, "while parsing a flow sequence ... expected ',' or ']',
