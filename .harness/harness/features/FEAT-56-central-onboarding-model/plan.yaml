tasks:
  - id: T-04
    title: Add a fleet product-config reachability report to factory_config, with a red-capable unit suite
    traces: [REQ-05]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/factory_config.py
      - tests/unit/test-fleet-product-config.py
    verify: |
      python3 tests/unit/test-fleet-product-config.py && python3 tests/unit/test-factory-config.py
    intent: |
      Add ONE function and ONE CLI flag to .claude/skills/harness/bin/factory_config.py, and a new
      unit suite that proves both directions.

      1. product_config_report(fleet)
      Place it immediately after product_config and before board_for. It returns a LIST, one entry
      per repository in fleet["repos"], IN DECLARATION ORDER, each a dict with exactly these keys:
        {"repo": <name>, "ref": <entry default_branch>, "path": ".harness/harness.json",
         "ok": <bool>, "detail": <str>}
      For each entry it calls product_config(fleet, name) inside try/except FleetError. On success
      ok is True and detail is the empty string. On FleetError ok is False and detail is str(exc).
      It catches FleetError and nothing else — an unexpected exception must propagate, because a
      report that swallows a bug reports every member as unreachable for the wrong reason. It makes
      no other call and does not clear or consult the memo itself; product_config already never
      memoises a failure. Use the module's existing _PRODUCT_CONFIG_PATH constant for the path
      value rather than retyping the literal. Docstring: state that the ok count is only meaningful
      beside the declared count, because a report over an empty repos list is vacuously all-ok.

      2. The CLI flag
      In _main(), add:
        parser.add_argument("--check-product-configs", action="store_true",
                            help="read every fleet member's own harness.json at its default_branch")
      When set: build report = product_config_report(fleet); emit the single stdout payload through
      factory_cli.payload with exactly this shape:
        {"declared": len(fleet["repos"]), "ok": <count of ok>, "unreachable": <count of not ok>,
         "members": report}
      For every not-ok member ALSO write one stderr line through
        factory_cli.fail("config", "product config unreachable",
                         f'{m["repo"]}@{m["ref"]}:{m["path"]}', m["detail"])
      Then, if the unreachable count is non-zero OR len(report) does not equal
      len(fleet["repos"]), sys.exit(factory_cli.EXIT_REFUSED) — exit 2, NOT 1: factory_cli's
      contract reserves exit 1 for nothing-to-do and states a tool never exits 1 for a failure.
      Also accept an optional --repo <owner/name> that restricts the report to that one member,
      resolving it through repo_entry so an undeclared name raises FleetError and is refused by
      the existing run() trap. --check-product-configs and --show remain independent flags; when
      both are given, --check-product-configs wins and --show is not printed, because
      factory_cli.payload writes the ONE stdout payload and two payloads break the stream
      contract. Say that in a comment.

      3. NO invariant, NO check-state.sh change
      This makes a network read. check-state.sh runs at every /harness door and before every
      commit and deliberately makes no network call, so nothing in this task touches it. Put a
      comment on the flag saying so, naming the board-audit precedent (the same cost was ruled
      once-at-onboarding rather than every run).

      4. tests/unit/test-fleet-product-config.py — TEST FIRST, and prove it can report red
      Write this file BEFORE the code above and record its failure output. Follow
      tests/unit/test-factory-config.py's conventions exactly: the same sys.path anchor preamble,
      the same check()/FAILS/RAN accounting, the same patched_file_at_ref contextmanager shape
      that swaps fc.factory_gh.file_at_ref on the imported module object. This file is UNIT: no
      subprocess, no gh, no network, and never load_fleet() with no argument — always a fleet
      written to a tempfile so FLEET_PATH's live binding cannot make a case pass for the wrong
      reason. Cases, all five required:
        (a) two declared repos, stub returns valid JSON for both -> every entry ok, the ok count
            equals 2, the unreachable count is 0.
        (b) two declared repos, stub raises factory_gh.GhError for the FIRST name and returns
            valid JSON for the second -> exactly one entry not ok, it is the first, its detail
            contains both the repo name and its default_branch, and the second is ok. Assert the
            two entries INDIVIDUALLY by index, never by counting matches: a count is satisfied by
            the conformer alone.
        (c) stub returns "not { valid json" for one repo -> that entry not ok and its detail
            names the invalid-JSON failure.
        (d) len(report) equals len(fleet["repos"]) in every case above, asserted explicitly. A
            report that examined nothing must not read as all-ok.
        (e) _main() exit codes, in-process: patch sys.argv to
            ["factory_config", "--fleet", <tempfile>, "--check-product-configs"], capture stdout
            with contextlib.redirect_stdout and stderr with redirect_stderr, and assert
            SystemExit.code is 2 under the failing stub of case (b) and that _main() returns
            without raising SystemExit under the all-succeeding stub of case (a). Assert the
            captured stdout parses as JSON and carries declared/ok/unreachable/members.
      RED-CAPABILITY PROOF, required, and record it in your receipt: (i) the output of this file
      run BEFORE the factory_config change, which must be a hard failure (import or AttributeError
      on product_config_report) — a passing run here means the suite is asserting nothing; (ii)
      after the change, delete the sys.exit(factory_cli.EXIT_REFUSED) line in a temp COPY of
      factory_config.py, point the suite at it, and record that case (e) reddens while (a)-(d)
      stay green. Report both FAIL-line counts verbatim. A gate whose discovery finds nothing
      passes every check it has, which is exactly the failure this proof exists to exclude.

  - id: T-01
    title: Rewrite harness-init SKILL.md to the central onboarding model
    traces: [REQ-01, REQ-02, REQ-05]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve on .claude/skills/harness-init/SKILL.md returns NOBODY at 4b5dbb23, a DEC-174 carve-out
    depends_on: [T-04]
    status: done
    files:
      - .claude/skills/harness-init/SKILL.md
    verify: |
      grep -qF 'factory/fleet.yaml' .claude/skills/harness-init/SKILL.md &&
      grep -qF 'default_branch' .claude/skills/harness-init/SKILL.md &&
      grep -qF '.harness/<segment>/' .claude/skills/harness-init/SKILL.md &&
      grep -qF -- '--check-product-configs' .claude/skills/harness-init/SKILL.md &&
      ! grep -qF 'templates/team-config.yaml' .claude/skills/harness-init/SKILL.md &&
      DB=$(grep -niE 'default[ _-]branch' .claude/skills/harness-init/SKILL.md | head -1 | cut -d: -f1) &&
      FL=$(grep -nF 'factory/fleet.yaml' .claude/skills/harness-init/SKILL.md | head -1 | cut -d: -f1) &&
      SG=$(grep -nF '.harness/<segment>/' .claude/skills/harness-init/SKILL.md | head -1 | cut -d: -f1) &&
      test "$DB" -lt "$FL" &&
      test "$FL" -lt "$SG" &&
      python3 tests/integration/test-hooks-install.py &&
      python3 .claude/skills/harness/bin/check-instruction-paths.py
    intent: |
      Rewrite .claude/skills/harness-init/SKILL.md so it states the central onboarding model. The
      model is settled and is not yours to re-decide: onboarding a repository is (1) its own
      harness.json landed on its default branch, (2) its entry in
      .harness/factory/fleet.yaml, (3) its central per-segment tree at
      <control-plane>/.harness/<segment>/. Nothing else is installed into a product repository, and
      .harness/products/ is created nowhere.

      PRESERVE VERBATIM, and this is a live assertion, not a courtesy: the two command strings
      git config --get core.hooksPath || echo "(unset)"
      git config core.hooksPath .claude/skills/harness/hooks
      plus the step-1 merge-settings command string. tests/integration/test-hooks-install.py
      case_commands_verbatim_in_skill opens this file and asserts all three are present as literal
      substrings. Do NOT change that test — it stays exactly as it is, and your verify runs it.

      Preamble and frontmatter. Replace the description and the opening two paragraphs. The new
      opening states the three-part model above in one paragraph, then the one-file rule: the ONLY
      file onboarding puts in a product repository is that repository's own .harness/harness.json,
      and it counts only once it is on the default branch, because factory_config.product_config
      reads it from the remote at default_branch with no disk fallback and raises FleetError
      otherwise. Keep the two existing rules unchanged: run this in the main session because only
      it can call AskUserQuestion, and the interview IS a grilling (DEC-164).

      Preflight. Keep all three checks. Amend the fourth bullet: ".harness/ already exists" is
      about THIS clone, the control plane, and routes to --upgrade.

      Step 1 — KEEP, NARROWED (do not delete it). Retitle to name its subject: the eight
      prerequisites and the per-clone hooks step are installed in THIS control-plane clone, never
      in a product repository. Add one short paragraph giving the mechanical reason: nothing
      distributes bin/ since deploy.sh was deleted (DEC-113), the enforcing hooks are registered in
      the control plane's own .claude/settings.json and resolve the control plane's own manifest,
      and check-state.sh INV-9 and INV-31 grade this clone against this step on every run. Every
      command block, the per-clone core.hooksPath sub-section, the PyYAML and jsonschema blocks,
      the install-command quote from harness_yaml.INSTALL_COMMAND and the STOP rules stay as they
      are.

      Step 2 — REPLACE ENTIRELY. Its two cp lines die. The new step is titled for what it does:
      land harness.json, then register the repository. In this order, and say why the order is
      load-bearing (D-04: product_config has no disk fallback, so a member registered before its
      config lands has no symptom but an unattributed FleetError mid-build):
        a. Instantiate the product's config from
           .claude/skills/harness/templates/harness.json into a checkout of THAT repository, delete
           the _template key, and fill test_kinds (step 4) and the github block (step 7).
        b. LAND IT on that repository's default branch. Harness has no write route into a product
           repo: factory_workspace.py writes no artifact into a checkout and no agent domain covers
           a product's .harness/. So this is an operator action the main session asks for by name -
           a commit or PR in that repository - and onboarding does not continue until it is on the
           default branch.
        c. ONLY THEN add the member to <control-plane>/.harness/factory/fleet.yaml as
           "- name: <owner>/<repo>" with "default_branch: <branch>". Nothing else goes in that file:
           load_fleet REJECTS a board at any level, and workspace_root is fleet-wide.
        d. Prove it is reachable:
           python3 .claude/skills/harness/bin/factory_config.py --check-product-configs --repo <owner>/<repo>
           It must exit 0. Exit 2 prints one stderr line naming <repo>@<ref>:.harness/harness.json
           and the reason - the config has not landed, or does not parse. Do not proceed on exit 2.
        e. Create the central per-segment tree the factory actually reads:
           <control-plane>/.harness/<segment>/features/ and <control-plane>/.harness/<segment>/expertise/,
           where segment is the part of the name after the owner (factory_config.segment_of). This is
           where that repository's BRIEF, plan.yaml and expertise live -
           factory_config.features_root resolves the first of the two.
        State plainly what is NOT written: no team-config.yaml anywhere but the control plane, no
        .harness/expertise/ inside a product repo, no .harness/products/ in either place, and no
        bin/, hooks or settings.json in a product repo.
        For the control plane itself, onboarding instantiates its own .harness/harness.json and
        .harness/team-config.yaml from the templates - that is this clone, and it is the only place
        a team-config.yaml is ever instantiated.

      Step 3 — Interview, technical. UNCHANGED.

      Step 4 — dev-ops detection. RE-TARGET the write destination and keep every rule about
      verifying cmds, never inventing one, DEC-163 surfacing of null kinds, deleting a filled
      kind's _reason, and the source-layout report. New destination wording: for the control plane,
      <control-plane>/.harness/harness.json; for a fleet member, that repository's own
      .harness/harness.json in its checkout under workspace_root, which then goes back through step
      2b to reach the default branch. dev-ops never writes fleet.yaml and never writes a product's
      config directly to a remote.

      Step 5 — Seed the manifest. NARROW. It seeds the control plane's own
      <control-plane>/.harness/team-config.yaml and nothing else: check-domain.sh reads only that
      file, the live grants are repo-agnostic globs, and per-repo isolation is unbuilt (issue 495) -
      harness_boundary.glob_to_re supports only **, *, ? and literals, so a per-repo glob is
      inexpressible today. Keep both write-scope rules, the drop-a-SEED-glob rule and the qa
      colocated-test exception verbatim. Delete any framing that suggests a product repository gets
      a manifest.

      Step 6 — Interview, product, then the BRIEF. RE-HOME the destination to
      <control-plane>/.harness/<segment>/features/<FEAT>/BRIEF.md (factory_config.features_root),
      and state that a new feature's plan artifact is plan.yaml, never PLAN.md (DEC-182). Keep the
      harness-brief discipline paragraph.

      Step 7 — Approval gate, mirror, board. Keep the approval rules verbatim. Amend the mirror and
      board sub-sections on one point: the github block they produce - sync, repo, and the board
      declaration - belongs in the repository's OWN harness.json, the file step 2 lands, so ask
      these questions BEFORE step 2b or land a second commit carrying the answers. Keep the
      board_lifecycle provision exit-code table, the default-columns warning, the user-owned-board
      limit, the three-workflow hard gate and the accepted-cost paragraph unchanged.

      Step 8 — Design pass. Destination becomes
      <control-plane>/.harness/<segment>/features/<FEAT>/DESIGN.md. Otherwise unchanged.

      Step 9 — Verify. Keep check-state.sh and merge-settings.py --check, stating they grade THIS
      clone. Add the fleet check with no --repo argument, over every member:
        python3 .claude/skills/harness/bin/factory_config.py --check-product-configs
      Keep the DEC-100a restart caveat and its do-not-overstate paragraph verbatim.

      --upgrade. State its subject explicitly, because today it is silent about it: for the control
      plane it merges this clone's own .harness/harness.json and re-runs the two merge scripts; for
      a fleet member it merges that member's harness.json in its checkout, which then goes back
      through step 2b to the default branch. Keep the four existing bullets - the merge rule,
      team-config.yaml reported-never-rewritten, the merge-gitignore re-run, and BRIEF/PLAN/DESIGN
      untouched - and add that a product repository has no team-config.yaml to report on.

      Red flags table. Keep every row. Add one: "The repo is in fleet.yaml, so the factory can
      serve it" -> "Not until its harness.json is on its default branch. product_config has no
      fallback; run --check-product-configs."

      Finally, keep the file's own anchors honest: it is read by
      tests/integration/test-post-merge-sweep.py and bin/post-merge-sweep.sh by SECTION, not by
      line number, after T-03 re-anchors them, so do not add a line-numbered self-citation.

  - id: T-02
    title: Correct the six executable sites that assert the per-product install model
    traces: [REQ-03]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
    - .claude/skills/harness/bin/check-instruction-paths.py
    - .claude/skills/harness/bin/check-state.sh
    - .claude/skills/harness/bin/check-domain.sh
    - .claude/skills/harness/bin/upgrade-config.py
    - .claude/skills/harness/bin/gh-sync.py
    - .claude/skills/harness/bin/layout_migration.py
    verify: |
      grep -qF 'harness-init' .claude/skills/harness/bin/check-instruction-paths.py &&
      grep -qF 'anchor rule' .claude/skills/harness/bin/check-instruction-paths.py &&
      ! grep -qF '"harness-init",  # main session only' .claude/skills/harness/bin/check-instruction-paths.py &&
      grep -qF 'control-plane clone' .claude/skills/harness/bin/check-state.sh &&
      ! grep -qF 'project not onboarded. Run /harness-init.' .claude/skills/harness/bin/check-state.sh &&
      grep -qF 'never carries one' .claude/skills/harness/bin/check-domain.sh &&
      ! grep -qF 'enforcement OFF (run /harness-init)' .claude/skills/harness/bin/check-domain.sh &&
      grep -qF 'default branch' .claude/skills/harness/bin/upgrade-config.py &&
      grep -qF 'control-plane clone' .claude/skills/harness/bin/upgrade-config.py &&
      grep -qF 'on its default branch' .claude/skills/harness/bin/gh-sync.py &&
      ! grep -qF 'run /harness-init --upgrade to record it' .claude/skills/harness/bin/gh-sync.py &&
      grep -qF 'only the control plane carries the fleet declaration' .claude/skills/harness/bin/layout_migration.py &&
      ! grep -qF 'installs the whole bin/ into product repos' .claude/skills/harness/bin/layout_migration.py &&
      python3 .claude/skills/harness/bin/check-instruction-paths.py &&
      bash .claude/skills/harness/bin/check-domain.sh --resolve "$PWD/README.md"
    intent: |
      Six executable sites still assert that onboarding installs harness artifacts into a product
      repository, or tell a user to run /harness-init to repair a product-side path. Correct each.

      THE SIX PRESENT/ABSENT ASSERTIONS ARE A ONE-TIME BUILD GATE, NOT A TEST FILE. Every numbered
      item below ends in a "Test asserts:" pair - a required substring PRESENT and the stale substring
      ABSENT. Those pairs are carried by THIS TASK'S OWN verify block, one conjunct per file, never
      one file-global search: a global grep is satisfied by five conforming sites and blind to the
      sixth. RUN THE VERIFY BLOCK FIRST, against the unedited tree, and record its failure; then make
      each file green. Do NOT create tests/unit/test-onboarding-model-strings.py, and do not land any
      other permanent suite over these strings: a test asserting operator-message source text can only
      redden on a good rewording after this feature, which is the rot mode REQ-06 itself names. The
      durable record of these six corrections is SC-03's review, read at review_sha.

      1. check-instruction-paths.py, MAIN_SESSION_ONLY at lines 12-16. KEEP the "harness-init"
      entry - it is main-session-only and it deliberately carries a clone-relative
      core.hooksPath value that the anchor rule would rewrite and that test-hooks-install.py
      asserts verbatim (D-05). Replace its trailing "# main session only" comment with both
      reasons in one clause, and add a two-line comment above the tuple recording that the
      exclusion is about the anchor rule, not about ownership. Test asserts: the string
      "harness-init" is still present in the file, and the bare comment "# main session only" no
      longer appears on the harness-init line.

      2. check-state.sh, four user-facing remedies. Each keeps its exit behaviour and gains the
      clone as its subject:
         a. line ~110: "harness: no .harness/ - project not onboarded. Run /harness-init." becomes
            a message naming THIS clone: no .harness/ here, so this clone is not an onboarded
            harness control plane, run /harness-init in the control-plane clone.
         b. line ~286: the ".harness/harness.json missing - not onboarded (or half-onboarded)"
            remedy gains ", in this clone" on its /harness-init instruction.
         c. line ~2371: the INV-32 panel_era_start remedy keeps
            "/harness-init --upgrade (upgrade-config.py)" and gains that it runs against this
            clone's own harness.json.
         d. lines ~2431-2436: the INV-31 rationale asserting the setup step "lives in
            .claude/skills/harness-init/SKILL.md" stays, and gains one clause: that step's subject
            is the control-plane clone.
         Test asserts: the file contains "control-plane clone" and no longer contains the exact
         string "project not onboarded. Run /harness-init."

      3. check-domain.sh, the fail-open message at lines ~375-376. Today it prints
      "check-domain: no {manifest} - enforcement OFF (run /harness-init)." which is false for a
      product path: a product repository never carries a manifest and never will. New message,
      keeping the f-string and the flag-not-exit behaviour untouched:
      "check-domain: no {manifest} - enforcement OFF. That path is the control plane's own
      manifest; a product repository never carries one. Run /harness-init in the control-plane
      clone." Do not change _run_domain, do not turn the flag into an exit. Test asserts: the file
      contains "never carries one" and no longer contains "enforcement OFF (run /harness-init)".

      4. upgrade-config.py, the docstring at line 2 and the two remedies at ~187-188 and ~229-230.
      Docstring: state the subject - it upgrades the control-plane clone's own .harness/harness.json,
      and for a fleet member it upgrades that member's harness.json in a checkout, which must then
      be committed to the repository's default branch to be read at all. Remedy at ~187: keep
      "Run /harness-init (without --upgrade)" and name the clone. Remedy at ~229: the
      team-config.yaml MISSING message gains that a team-config.yaml exists only in the control
      plane, so this message is about this clone. Test asserts: the file contains "default branch"
      and "control-plane clone".

      5. gh-sync.py, the skip message at ~254-255. "github.repo is not pinned - run /harness-init
      --upgrade to record it" becomes: github.repo is not pinned in this project's harness.json,
      and for a fleet member that file lives in the member's own repository on its default branch.
      Keep skip() and the surrounding control flow untouched. Test asserts: the file no longer
      contains "run /harness-init --upgrade to record it" and does contain "on its default branch".

      6. layout_migration.py, the MARKER rationale at ~121-125. The sentence "harness-init installs
      the whole bin/ into product repos, so every onboarded product became applicable" is false
      under the central model and is also the reason the first marker choice was wrong. Replace it
      with the true reason a tree can hold every reader file yet not be the control plane: any copy
      or worktree of the control plane carries bin/, while only the control plane carries the fleet
      declaration - onboarding installs no bin/ into a product repository at all. Keep MARKER, the
      D-04 reference, and every following sentence about applicability and segment authority. Test
      asserts: the file no longer contains "installs the whole bin/ into product repos" and does
      contain "only the control plane carries the fleet declaration".

      Change nothing else in these six files. No behaviour, no exit code, no glob, no control flow:
      messages, comments and one docstring only. Record in your receipt the verify block's failure
      against the unedited tree and its green run after.

  - id: T-03
    title: Reconcile the onboarding-premise tests, amending comments and re-anchoring skill citations
