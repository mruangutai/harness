    intent: |
      The audit named fifteen test cases as resting on the old install behaviour. Most do not: they
      grade a script or a temp clone, and the per-clone install step SURVIVES narrowed to the
      control-plane clone, so their assertions stay correct. NO CASE IS DELETED in this task, and
