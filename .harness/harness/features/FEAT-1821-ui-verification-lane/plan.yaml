      Preserve the T-03 foundation already delivered: exact-version @playwright/test and @axe-core/playwright dependencies and lockfile-pinned Chromium; test:ui; desktop-1440 and desktop-1920 configuration at 1100px height, device scale factor 1, UTC, en-US, dark colour scheme, reduced motion, and frozen time 2026-09-17T12:00:00Z; a pre-webServer temporary copy of fixtures/project-a extended with deterministic attention, grilling, worktree, unavailable, filtered-zero, mixed valid-row/source-error, request-failure, overflow, and long-content states; fixed-port serving of only the committed client/dist bundle; and ui-manifest.ts consumption of the normalized T-01 ui_contract.py output without Markdown parsing or duplicated contract policy.

      Preserve rather than discard the delivered baseline in the transferred files: the existing SRC-TOKENS execution, all VIS-DENSITY and VIS-PROTOTYPE evidence captures, WebP capture through the pinned Chromium session, and the harness-ui-results/1 reporter foundation. The delivered reporter foundation includes feature and run identity, DESIGN path, served_bundle_commit, configured projects and viewports, listed, applicable, observed, and missing check accounting, checks, summary, repository-relative screenshot evidence metadata, and committable results and WebPs while local reports, traces, generated fixtures, and test-results remain ignored.

      The signed residual boundary is exactly the ruling in notes/answers-fix-c3-split.md. T-08 owns trimming feat-53.e2e.spec.ts to SRC-TOKENS, VIS-DENSITY, and VIS-PROTOTYPE plus C1-HEADER-GEOMETRY and KPI-R1 in geometry.e2e.spec.ts. T-09 owns DIR-KPI-IDENTITY and DIR-STATUS-LABEL. T-10 owns C3-KEYBOARD. T-11 owns C3-CONTRAST and C4-HATCH. T-12 owns TBL-DESKTOP and A11Y-AXE. T-13 owns ui-reporter.ts hardening and the seven two-stage fail-closed probes. Those six tasks preserve the twelve exact T-02 titles and predicates, named test.step coverage for every predicate clause, soft expectations, mandatory screenshots, inspection evidence without reader-judgment conversion, no pixel comparison unless a row opts in, no FEAT-53 production edits or behavioral normalization, and exactly twenty-three listed executions. T-03 owns no implementation or verification residual assigned to T-08 through T-13.

