tasks:
  - id: T-01
    title: Fix the canonical-reader self-test to the true named-plan contract and run it by default
    traces: [SC-03]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_agent: harness-backend-dev
    execution_reason: DEC-174 enumerates test-check-plan-routes.py as the test file of a gate; the edit is made directly, red first.
    depends_on: []
    status: ready
    files:
    - tests/integration/test-check-plan-routes.py#_check_live_inventory_reads_no_feature_plan
    - path: .harness/harness/features/FEAT-2489-plan-routes-split/notes/red-t01-canonical-self-test.txt
      create: true
    - path: .harness/harness/features/FEAT-2489-plan-routes-split/notes/green-t01-default-run.txt
      create: true
    verify: |
      python3 - <<'PY'
      import json, os, subprocess, sys
      env = {k: v for k, v in os.environ.items() if k not in ('CLAUDE_PROJECT_DIR', 'HARNESS_PROJECT_DIR', 'HARNESS_AGENT_TYPE')}
      git = lambda *a: subprocess.run(['git', *a], capture_output=True, text=True)
      T = 'tests/integration/test-check-plan-routes.py'
      FIXED = ['canonical_reader_live_inventory_has_no_document_plan', 'canonical_reader_named_plan_check_accepts_a_resolving_row', 'canonical_reader_named_plan_check_refuses_a_missing_plan', 'canonical_reader_named_plan_check_refuses_a_missing_task']
      contract = lambda doc: ['canonical_reader_live_inventory_named_plan_resolves[' + row['id'] + ']' for row in doc['rows'] if 'plan' in row] + FIXED
      rec = open('.harness/harness/features/FEAT-2489-plan-routes-split/notes/green-t01-default-run.txt').read().splitlines()
      hl, bl = rec[0].split(), rec[1].split()
      assert len(hl) == 2 and hl[0] == 'HEAD' and len(bl) == 3 and bl[:2] == ['BLOB', T], rec[:2]
      cp = hl[1]
      assert git('merge-base', '--is-ancestor', cp, 'HEAD').returncode == 0, 'recorded HEAD is not an ancestor of HEAD'
      at = git('rev-parse', '--verify', '--quiet', cp + ':' + T)
      assert at.returncode == 0 and at.stdout.strip() == bl[2], 'recorded BLOB is not the test file at the recorded HEAD'
      for module in ('canonical_reader_audit.py', 'structure_audit.py'):
          assert git('cat-file', '-e', cp + ':.claude/skills/harness/bin/' + module).returncode != 0, 'recorded HEAD already holds ' + module + ': it is not a pre-move checkpoint'
      src_cp = git('show', cp + ':' + T).stdout
      assert '_check_live_inventory_named_plans' in src_cp and 'names no plan' not in src_cp, 'recorded HEAD predates the T-01 test change'
      assert rec[-1] == 'exit=0' and 'ALL PASS' in rec and not [l for l in rec if l.startswith('FAIL ')], rec[-5:]
      for name in contract(json.loads(git('show', cp + ':tests/integration/canonical-reader-classification.json').stdout)):
          assert 'PASS ' + name in rec, 'receipt lacks ' + name
      r = subprocess.run([sys.executable, T], capture_output=True, text=True, timeout=58, env=env)
      lines = r.stdout.splitlines()
      fails = [l.split()[1] for l in lines if l.startswith('FAIL ')]
      for name in contract(json.load(open('tests/integration/canonical-reader-classification.json'))):
          assert 'PASS ' + name in lines, name
      base = subprocess.run(['git', 'merge-base', 'HEAD', 'main'], capture_output=True, text=True, check=True).stdout.strip()
      stale = os.path.exists('.claude/skills/harness/bin/canonical_reader_audit.py') and subprocess.run(['git', 'diff', '--quiet', base, '--', 'tests/integration/canonical-reader-classification.json']).returncode == 0
      if stale:
          assert r.returncode == 1 and fails and all(n.startswith('canonical_reader_') for n in fails), fails
      else:
          assert r.returncode == 0 and lines[-1] == 'ALL PASS' and not fails, r.stdout[-3000:]
          for name in ('canonical_reader_audit_holds_on_bin_plus_named_plans', 'canonical_reader_live_audit_is_zero', 'canonical_reader_planless_rows_read_no_plan'):
              assert 'PASS ' + name in lines, name
      assert not [l for l in lines if 'names_no_plan' in l or 'without_a_feature_corpus' in l]
      src = open(T).read()
      assert 'names no plan' not in src and 'no feature plan' not in src and 'without a feature corpus' not in src
      print('PASS T-01: green receipt bound to its committed pre-move checkpoint; canonical cases gate on the named-plan contract')
      PY
    intent: |
      Work directly in PRODUCT Harness checkout /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2489-plan-routes-split; never delegate execution (DEC-174: tests/integration/test-check-plan-routes.py is the test file of an enumerated gate). Consult AGENTS.md; .harness/harness/docs/DECISIONS.md DEC-174; in .claude/skills/harness/bin/check-plan-routes.py the canonical-reader functions _ownership_finding, _named_plans, _task_files and _classification_task_files; the grilling ruling Q4 at /Users/molchairuangutai/GitHub/harness/.harness/notes/grilling-plan-routes-split-e2-2026-11-24.md; and notes/research-plan-routes-split.md in this feature directory. docs/spec.md, docs/decisions.md and docs/architecture.md do not exist in this checkout. Edit only tests/integration/test-check-plan-routes.py, commit it, and write the receipt below; no production file changes in this task.

      Red first. Before any edit, with CLAUDE_PROJECT_DIR, HARNESS_PROJECT_DIR and HARNESS_AGENT_TYPE removed from the environment and PYTHONDONTWRITEBYTECODE=1, run python3 tests/integration/test-check-plan-routes.py --canonical-reader-self-test and save its whole stdout and stderr plus a final line exit=CODE to notes/red-t01-canonical-self-test.txt in this feature directory. Expected: exit=1 with exactly two FAIL lines, canonical_reader_live_inventory_names_no_plan and canonical_reader_audit_holds_without_a_feature_corpus. If it differs, stop and report.

      Then, in tests/integration/test-check-plan-routes.py:
      1. Import artifact_accessors and feature_corpus at module scope beside the existing imports (bin is already on sys.path through the _anchor_bin insert).
      2. Add _named_plan_problems(root, document): a list of (row id, problem) pairs, one per row of document["rows"] that is a dict carrying a plan key, in row order. problem is None when artifact_accessors.load_plan(feature_corpus.corpus_path(root, row["plan"])) succeeds and some task in the loaded plan's tasks has str(task["id"]) equal to row["task"]. Otherwise it is a one-line string naming the plan and either the read error (catch OSError, ValueError, KeyError, TypeError, harness_yaml.YamlParseError and feature_corpus.CorpusError; import harness_yaml inside the helper) or that the named task, by id, is absent. The helper reads plans independently of the audit: it never calls _task_files or _classification_task_files.
      3. Replace _check_live_inventory_reads_no_feature_plan(mod) with _check_live_inventory_named_plans(mod), whose docstring states the true contract: every plan a classification row names resolves, through the same corpus resolution the audit uses, to a readable plan whose named task exists; and the permanent audit depends on nothing outside bin plus exactly those plans. It (a) loads the live classification JSON at TESTS_DIR/canonical-reader-classification.json; (b) checks canonical_reader_live_inventory_has_no_document_plan, condition: the key plan is not in the document; (c) for each (row id, problem) of _named_plan_problems(ROOT, live) checks the name canonical_reader_live_inventory_named_plan_resolves[ROW_ID] (the row id inside the brackets) with condition problem is None and detail problem; (d) in a tempfile.TemporaryDirectory td, copies BIN_DIR to td/.claude/skills/harness/bin with shutil.copytree ignoring __pycache__ exactly as today, then for each distinct plan the rows name copies feature_corpus.corpus_path(ROOT, plan) to os.path.join(td, plan), creating parent directories, and copies nothing else; then result = mod.audit_canonical_readers(td, classification) and checks canonical_reader_audit_holds_on_bin_plus_named_plans with condition result["exit_code"] == 0 and result["classification_findings"] == [] and detail the repr of the findings.
      4. Add case_canonical_reader_named_plan_contract, registered in CANONICAL_READER_CASES right after the renamed case in item 5: in a tempfile.TemporaryDirectory td write plan.yaml with write_plan(td, PLAN_YAML % "fixture.py", name="plan.yaml") (its one task is T-01); build three single-row documents from _classification_row(_reader_fixture_candidate(), plan=..., task=...): plan "plan.yaml" with task "T-01"; plan "missing/plan.yaml" with task "T-01"; plan "plan.yaml" with task "T-99". Check canonical_reader_named_plan_check_accepts_a_resolving_row (the first row's problem is None), canonical_reader_named_plan_check_refuses_a_missing_plan (the second row's problem is not None) and canonical_reader_named_plan_check_refuses_a_missing_task (the third row's problem is not None and contains T-99), each through _named_plan_problems(td, document).
      5. Rename case_canonical_reader_reads_no_feature_plan to case_canonical_reader_planless_rows_read_no_plan. Replace its FEAT-71 docstring with one stating that a row without a plan carries its task as provenance and reads no plan. Have it call _check_live_inventory_named_plans(mod) where it called the removed helper, keeping its two existing checks canonical_reader_planless_rows_read_no_plan and canonical_reader_planless_row_is_not_an_ownership_finding unchanged. Update its CANONICAL_READER_CASES entry to the new name.
      6. Register the canonical cases by default: unpack every member of CANONICAL_READER_CASES, in its order, as the last elements of the CASES tuple, so the default run executes them after the existing cases. Keep the --canonical-reader-self-test selector (it still runs only the canonical tuple) and the --classification-task selector unchanged.
      Afterwards the file contains none of the phrases names no plan, no feature plan or without a feature corpus.

      Commit, after items 1 to 6: stage only tests/integration/test-check-plan-routes.py and commit it, so that git diff --quiet HEAD -- tests/integration/test-check-plan-routes.py exits 0. The green receipt is recorded after this commit, never before: recorded before it, the blob at the recorded HEAD is the unedited file and differs from the file that ran, by construction, and the verify fails.

      Green receipt, after the commit and before T-02 or any later commit: with the environment sanitised as above, run python3 tests/integration/test-check-plan-routes.py with no arguments and save to notes/green-t01-default-run.txt in this feature directory, in order: a line HEAD SHA, where SHA is the full output of git rev-parse HEAD (the T-01 commit); a line BLOB tests/integration/test-check-plan-routes.py SHA, where SHA is the full output of git rev-parse HEAD:tests/integration/test-check-plan-routes.py; the run's whole stdout and stderr; and a final line exit=CODE. Expected: exit=0, an ALL PASS line and no FAIL line. The receipt binds T-01's green to its own checkpoint: after T-03 moves the code, the live default run is red on canonical_reader_ checks by design until T-04 applies the inventory delta, and the receipt is then the record that the default run was green before the move. The verify binds it from the repository, never from the live file: the recorded HEAD must be an ancestor of HEAD (git merge-base --is-ancestor); the recorded BLOB must equal git rev-parse of RECORDED_HEAD:tests/integration/test-check-plan-routes.py; the recorded HEAD must hold _check_live_inventory_named_plans in that file and neither .claude/skills/harness/bin/canonical_reader_audit.py nor .claude/skills/harness/bin/structure_audit.py; and the receipt must carry a PASS line for every named-plan contract check of the inventory at the recorded HEAD. A receipt naming any other commit or blob fails. The receipt file itself is committed later with the feature notes, which leaves its recorded HEAD unchanged.

      Expected verify exit 0: the green receipt names an ancestor commit holding the T-01 test change and neither new module, its BLOB is that commit's test file, and it shows exit=0, ALL PASS and every named-plan contract check; the live default run carries a PASS line per plan-naming inventory row and for every named-plan contract check; before the move, and again after T-04, the live run passes whole; between T-03 and T-04 (bin holds canonical_reader_audit.py and the inventory is still at base) it fails only on canonical_reader_ checks other than those contract checks; no FEAT-71 check name is left.
  - id: T-02
    title: Write the one-time matched-tree CLI-equivalence checker into the feature notes
    traces:
    - SC-02
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_agent: harness-backend-dev
    execution_reason: The checker grades a DEC-174 gate's cutover and is written by the hand that makes it, before the move it grades.
    depends_on: [T-01]
    status: ready
    files:
    - path: .harness/harness/features/FEAT-2489-plan-routes-split/notes/split-equivalence.py
      create: true
    verify: |
      python3 - <<'PY'
      import os, re, subprocess, sys
      env = {k: v for k, v in os.environ.items() if k not in ('CLAUDE_PROJECT_DIR', 'HARNESS_PROJECT_DIR', 'HARNESS_AGENT_TYPE')}
      git = lambda *a: subprocess.run(['git', *a], capture_output=True, text=True)
      before = git('status', '--porcelain').stdout
      r = subprocess.run([sys.executable, '.harness/harness/features/FEAT-2489-plan-routes-split/notes/split-equivalence.py'], capture_output=True, text=True, timeout=58, env=env)
      lines = r.stdout.splitlines()
      assert 'Traceback' not in r.stdout + r.stderr and r.returncode in (0, 1) and git('status', '--porcelain').stdout == before, r.stdout[-2000:] + r.stderr[-2000:]
      names = [l.split()[1] for l in lines if l.startswith(('PASS ', 'FAIL '))]
      fails = {l.split()[1] for l in lines if l.startswith('FAIL ')}
      labels = ['clean:' + x for x in ('route', 'canonical', 'consolidation', 'help', 'both_flags', 'missing_plan')] + ['perturbed:canonical', 'perturbed:consolidation']
      assert names == ['projection_confined'] + ['cli_equivalent[' + x + ']' for x in labels] and lines.count('--- diff stdout') == 8, names
      for x in labels:
          assert any(l.startswith('CLI ' + x + ' ') for l in lines), x
      mapped = {x: int([l for l in lines if l.startswith('CLI ' + x + ' ')][0].rsplit(' mapped=', 1)[1]) for x in labels}
      maps = [l for l in lines if l.startswith('MAP ')]
      assert maps and any('::_classification_document json_file remedy=none: exemption requires a reason' in l for l in lines), maps
      base = git('merge-base', 'HEAD', 'main').stdout.strip()
      moved = git('cat-file', '-e', 'HEAD:.claude/skills/harness/bin/canonical_reader_audit.py').returncode == 0
      stale = moved and git('diff', '--quiet', base, 'HEAD', '--', 'tests/integration/canonical-reader-classification.json').returncode == 0
      mapre = r'MAP \.claude/skills/harness/bin/check-plan-routes\.py::(\S+) -> \.claude/skills/harness/bin/(?:canonical_reader_audit|structure_audit)\.py::\1'
      names_mapped = {m.split('::', 1)[1].split(' ', 1)[0] for m in maps if m != 'MAP none'}
      if moved:
          assert maps != ['MAP none'] and all(re.fullmatch(mapre, m) for m in maps) and {'_classification_document', '_task_files', 'LEGAL_MAIN_SESSION_TOKEN', '_run_canonical_reader_audit', '_run_consolidation_audit'} <= names_mapped, maps
      if stale:
          assert r.returncode == 1 and 'cli_equivalent[clean:canonical]' in fails and fails <= {'cli_equivalent[clean:canonical]', 'cli_equivalent[perturbed:canonical]'}, (maps, sorted(fails))
      elif moved:
          assert r.returncode == 0 and lines[-1] == 'ALL PASS' and not fails, sorted(fails)
