    intent: |
      Work directly in PRODUCT Harness checkout /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2488-plan-merge-atomicity; never delegate execution (DEC-174: validate-digest.py and dispatch-guard.py import harness_merge). Consult AGENTS.md, .harness/harness/docs/SPEC.md, .harness/harness/docs/DECISIONS.md DEC-199, DEC-229 and DEC-174, the module contract in harness_merge.py's docstring, and notes/research-journal-design.md in this feature directory. docs/spec.md, docs/decisions.md and docs/architecture.md do not exist in this product; SPEC and the module contracts supply the guidance.
      Tests first. Create tests/unit/test-harness-merge-journal.py in the house shape of tests/integration/test-harness-merge.py: sys.path to .claude/skills/harness/bin, a RESULTS list, check(name, ok, detail), one PASS or FAIL line per check, a final PASS or FAIL summary, exit 1 on any FAIL; every case in a fresh tempfile.mkdtemp, never a real .harness path. Run it before any production edit and save its whole stdout and exit code to notes/red-t01-journal-unit.txt in this feature directory; it must fail.
      In harness_merge.py, python3 stdlib only (base64, hashlib, json and stat join the imports), add:
      1. JOURNAL_SUFFIX = '.harness-merge.journal'. A pair's journal is its primary's path plus JOURNAL_SUFFIX (for the amendment pair, plan.yaml.harness-merge.journal beside plan.yaml). Every journal is therefore named for its primary and is created, replaced and removed only while that primary's lock is held; the single-primary rule is structural, not a convention.
      2. replace_bytes(path, data): the atomic same-directory replace locked_update's write body performs today (tempfile.mkstemp in the path's directory, write, close, os.replace, remove the temp file on any exception and re-raise), with no fsync. locked_update's write body calls it. Docstring: the caller must hold the lock that governs path.
      3. class JournalPending(Exception): __init__(self, journal, cause, replay=False) stores all three as attributes and passes the message '<type name of cause>: <cause>'. It means a journaled transaction is committed-pending: its journal is still on disk and the next write naming a member rolls it forward. locked_pair_update raises it with replay false, and only after its own journal was published; _recover_journal raises it with replay true when replaying an existing journal fails, in which case the calling write's own change was never attempted.
      4. _read_journal(journal_path): read the bytes and json.loads them; require schema equal to harness-merge-journal/1 and members a non-empty list of mappings, each with name (a bare file name: no path separator, not . or ..), before_sha256 (64 lowercase hex, or null for a file that was absent), after_sha256 (64 lowercase hex) and after_b64 (standard base64 whose decoded bytes hash to after_sha256). Member names must be pairwise distinct. Return the members with their decoded after bytes. Anything else raises MergeRefusal(5, ['JOURNAL UNREADABLE: <journal path>: <reason>', '  every write naming a file in this directory refuses until the files are reconciled by hand and the journal is removed.']). This is the module's only parse of a journal.
      5. _journals_naming(path): lock-free; [] when the path's directory does not exist; otherwise every entry of os.listdir of that directory whose name ends with JOURNAL_SUFFIX and either equals the path's basename plus JOURNAL_SUFFIX or is a journal whose _read_journal members include the path's basename, as full paths. A journal _read_journal refuses counts as naming every file (fail closed); one that vanishes between the listing and the read is skipped. The result is only a hint: nothing acts on it until _recover_journal re-reads the journal, membership included, under its primary's lock.
      6. _recover_journal(journal_path, path, timeout): the primary is journal_path minus JOURNAL_SUFFIX. Inside one contextlib.ExitStack acquire the primary's lock (primary plus .lock) with acquire(lock, timeout), and only then look at the journal: return False when it no longer exists. Read it with _read_journal; the first member's name must equal the primary's basename, else the JOURNAL UNREADABLE refusal. When no member's name equals the basename of path, return False and write nothing: the generation discovered lock-free has been replaced by one that does not name path, which therefore neither replays nor refuses for it. Acquire each further member's sibling lock in journal order. Because every writer of this journal holds the primary's lock for the journal's whole life, the bytes read under that lock are the current generation and cannot be replaced or removed before release. Compute every member's current sha256 (None when absent) before writing anything. If any member equals neither its after nor its before hash, raise MergeRefusal(5, ['JOURNAL DIVERGED: <member path> matches neither the before nor the after state recorded in <journal path>', '  nothing was changed; reconcile the file by hand, then remove the journal.']) and leave every file and the journal untouched. Otherwise replace_bytes each member still at its before hash with its after bytes, leave members already at after untouched, then os.unlink the journal, release the locks and return True. An Exception raised by any of those replace_bytes calls or by the unlink is raised as JournalPending(journal_path, exc, replay=True) from exc with the journal left in place; nothing runs after the unlink, so a completed replay never reports pending. The unlink is not followed by a directory fsync, as for locked_pair_update's own unlink: a journal a crash resurrects names members already at after and replays as a no-op, or refuses DIVERGED if a member was rewritten since.
      7. recover_journals(path, timeout=None): call _recover_journal(j, path, timeout) for each j in _journals_naming(path); return True when any call returned True, else False. This is the one recovery entry point for callers outside the module.
      8. locked_pair_update(primary, primary_transform, secondary, secondary_transform, timeout=None): raise ValueError unless the two paths are different files in one directory. Loop: recover_journals(primary, timeout), then recover_journals(secondary, timeout); acquire primary plus .lock, then secondary plus .lock; if _journals_naming(primary) or _journals_naming(secondary) is non-empty, release both and loop again. Otherwise read both bases as bytes (None when absent) and compute new_primary = primary_transform(base_primary) and new_secondary = secondary_transform(base_secondary); a MergeRefusal or any other exception from either transform propagates with nothing written and no journal. Then write the journal: members primary then secondary, each with name, before_sha256 of its base (null when absent), after_sha256 and after_b64 of its new bytes, serialized with json.dumps(sort_keys=True), written to tempfile.mkstemp(dir=directory, prefix='.harness-merge-tmp-'), flushed, os.fsync on its descriptor, closed, and os.replace onto primary plus JOURNAL_SUFFIX. Any exception up to and including that os.replace removes the temp file and propagates unchanged: nothing was written. After the journal's os.replace succeeds: fsync the directory (os.open read-only, os.fsync, os.close), replace_bytes(primary, new_primary), replace_bytes(secondary, new_secondary), os.unlink the journal, release the locks. An Exception raised by any of those four steps is raised as JournalPending(journal path, exc) from exc with the journal left in place; a BaseException that is not an Exception propagates unchanged, journal also left. There is no compensation path.
      9. locked_update(path, transform, timeout=None) gains the same recovery: loop: recover_journals(path, timeout); acquire path plus .lock; if _journals_naming(path) is non-empty, release and loop again; otherwise run today's read, transform and replace body unchanged. A journal that does not name the path is left alone, so a pending or diverged journal blocks only its own members' writers (every writer in the directory only when it is unreadable). With no journal in the directory, behaviour, refusals and timeouts are exactly today's.
      10. Module docstring: the journal protocol and its per-primary naming; fsync is performed on the journal file and its directory only, never on an ordinary locked_update write; recovery lives here and runs before every write that names a journal member, acting on each journal only as re-read, membership included, under its primary's lock; the JournalPending boundary (a failure before the journal's rename wrote nothing; a failure after it, or part-way through a replay, is committed-pending and rolls forward); and the lock order: a pair takes its primary's lock before its secondary's, which for the amendment pair is plan.yaml.lock then feature.json.lock; sign-approval's signed_task_hashes write takes the same order, and its nested feature.json write finds no journal because its outer locked_update on the plan already recovered and still holds the plan lock; approval's rework write takes feature.json.lock before, never while holding, the plan lock; no path acquires them reversed.
      Unit cases, each asserting exact file bytes and journal presence or absence: pair success writes both new images and leaves no journal and no .harness-merge-tmp- file; a refusal from either transform leaves both files byte-identical and no journal; the secondary's lock held by a test-held fcntl.flock with timeout=0.2 refuses with code 6 naming LOCKED and writes nothing; constructed journals for primary at after and secondary at before, primary at before and secondary at after, and both at after each converge through recover_journals(primary), through locked_update on the primary and through locked_update on the secondary (the caller's own transform then applied on top), with the journal removed; a second recover_journals returns False and changes no byte; a member overwritten with a third content refuses with code 5 naming JOURNAL DIVERGED and leaves both files and the journal byte-identical, and so does locked_update on either member, while locked_update on a third file in the same directory succeeds and leaves both members and the journal byte-identical; a truncated journal refuses with code 5 naming JOURNAL UNREADABLE; locked_pair_update across two directories raises ValueError; with harness_merge.replace_bytes replaced by a test wrapper raising OSError for the secondary path only, locked_pair_update raises JournalPending whose journal attribute is the primary plus JOURNAL_SUFFIX and whose cause is that OSError, leaving the primary at after, the secondary at before and the journal present, and after the real replace_bytes is restored recover_journals(primary) converges both to after. Replay failure: under the same wrapper and from a constructed journal with both members at their before images, recover_journals(primary) raises JournalPending with replay True, that journal and that OSError, leaving the primary at after, the secondary at before and the journal present; locked_pair_update on the same two paths under the same wrapper then raises JournalPending with replay True without calling either transform; with the real replace_bytes restored, recover_journals(primary) converges both to after and a second call returns False. A journal listing the primary's name twice refuses with code 5 naming JOURNAL UNREADABLE under timeout=0.2, never LOCKED.
      Interleaving cases, deterministic, with no sleeps and no threads: replace harness_merge.acquire with a test wrapper that, on its first call for the primary's lock, changes the files on disk and then delegates to the real acquire. Start each from a journal J1 with both members at J1's before images. (i) Generation change: the wrapper sets the primary to J2's after image, the secondary to J1's after image (which is J2's before image) and replaces the journal with J2; recover_journals(secondary) leaves both members at J2's after images and no journal, with no refusal. (ii) Fresh generation: the wrapper sets both members to J1's after images (J2's before images) and replaces the journal with J2; recover_journals(secondary) leaves both at J2's after images and no journal, never an unreplayed J2 unlinked. (iii) Disappearance: the wrapper sets both members to J1's after images and unlinks the journal; recover_journals(secondary) returns False and no byte changes after the wrapper's. (iv) Membership change: J1 names the primary and a member X; the wrapper replaces J1 with a J2 naming the primary and a different member Y, both at J2's before images; recover_journals(X) returns False and the primary, X, Y and J2 stay byte-identical to the wrapper's result. Restore every replaced function in a finally.
      Then run python3 .claude/skills/harness/bin/check-plan-routes.py --canonical-reader-audit. The json.loads in _read_journal is a new reader site: in tests/integration/canonical-reader-classification.json insert, immediately before the first row whose file is .claude/skills/harness/bin/harness_yaml.py, one row: artifact harness_merge intent journal, category json_string, dec174_category none, disposition exempt, execution_route main-session-direct, exemption module_internal_format, file .claude/skills/harness/bin/harness_merge.py, id .claude/skills/harness/bin/harness_merge.py::_read_journal::json_string#1, reason The locked-write core owns and parses its own intent journal format., remedy none, symbol _read_journal, task none. If the audit reports a different category for that site, classify exactly what it reports the same way; add no row for any other site. Do not edit check-plan-routes.py or test-check-plan-routes.py.
      Expected verify exit 0: every selected suite PASS, the audit reporting 0 unresolved reader sites, and the docstring and API names present.

      Amended at fix c1 (fable-advisor AdvisorE3Fix, notes/answers-2026-11-24-validate-c0.md); the signature stands per DEC-23:
      Validate c0 fix round 1, ruled in notes/answers-2026-11-24-validate-c0.md (OQ-1 (a); MF-2, MF-3, MF-4 and
      diagnostic bounding inside C5). The departures from the signed text are as follows.

      (1) Items 6 and 8 and the docstring (item 10): the replay handler in _replay and the post-publish handler in
      _commit_published catch OSError, not "an Exception". The signed text said "a BaseException that is not an
      Exception propagates unchanged". Now any non-OSError after the rename propagates unchanged as itself, with the
      journal kept, so the next write rolls it forward. The outcome space is therefore no longer total by construction.
      Every failure lands in one of three buckets: MergeRefusal; JournalPending; or an uncaught traceback with the journal
      on disk. The third bucket is confined to interpreter-anomaly classes. The reason is FEAT-63's broad-catch census,
      whose ceiling of 0 sits in check-plan-routes.py, which is forbidden to edit.

      (2) Item 4, under MF-2: members must be exactly two, named plan.yaml then feature.json (the module constant
      JOURNAL_PAIR), not "a non-empty list". A one-member, a three-member or a misbound-sibling journal is JOURNAL
      UNREADABLE, exit 5.

      (3) Item 4, under MF-4: before_sha256 must be present. Only an explicit null records an absent file; a missing key
      is UNREADABLE.

      (4) Item 4, under MF-3: the journal is read only from a regular file. It is lstat'd first, then opened
      O_NOFOLLOW|O_NONBLOCK. A symlink (dangling or not), a FIFO or a directory is UNREADABLE naming the journal. No FIFO
      is opened, and a dangling entry no longer reads as absent and spins locked_update.

      (5) Item 6, under MF-2 and MF-3: before the primary's lock, _recover_journal now lstats the entry and refuses
      UNREADABLE any non-regular entry, and any journal not named plan.yaml.harness-merge.journal. A feature.json-primary
      journal is therefore refused before any lock is taken, and the reversed order is unreachable. "Return False when it
      no longer exists" now means ENOENT only; it no longer means os.path.exists. The first-member check is subsumed by
      the pair check. Only feature.json.lock is taken as the further lock, not "each further member's sibling lock".

      (6) Item 8, under MF-2: locked_pair_update raises ValueError unless the two paths are plan.yaml then feature.json in
      one directory, not merely "two different files".

      (7) Refusal messages echo journal values as a repr truncated to 80 characters (security-low bounding).

      (8) Unit cases: interleave (iv) is reshaped, because a primary+X journal is now unreadable. The case is an
      unreadable journal discovered as naming X, which under the lock has become a legal generation that does not name
      X; it returns False and nothing is written. Cases were added for each of (2) to (7), plus sign-approval's nested
      shape.

      The signature stands (DEC-23); this is the ledgered judgement.
