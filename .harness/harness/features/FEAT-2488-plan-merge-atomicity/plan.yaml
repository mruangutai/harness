decisions:
  - id: D-01
    choice: The amendment pair commits through an fsync'd byte-image intent journal named for its primary, with roll-forward, as harness_merge.locked_pair_update, taking plan.yaml.lock then feature.json.lock and replacing the plan before the ledger; a failure after the journal is published is reported as committed-pending, never as nothing written.
    because: In-process compensation cannot survive SIGKILL or an exception after the ledger rename; ledger-first was tried and reversed, and check-state detection covers only the unledgered-edit direction.
    dec: DEC-229
  - id: D-02
    choice: Every harness_merge write and every mutating plan-merge verb first completes each leftover journal naming a file it writes; lock-free discovery is only a hint, and a journal is acted on only as re-read, membership included, under its primary's lock; a member matching neither recorded state refuses at exit 5 with the journal kept, blocking only that journal's members; a replay that fails part-way is reported as still pending, never as nothing written.
    because: A feature.json-only writer or a verb's lock-free preflight would otherwise act on a torn state first; semantic judgement replay would put feature.json knowledge into the core, and overwriting a diverged member would destroy a write nobody journaled.
    dec: DEC-199
