decisions:
  - id: D-01
    choice: Confine the fix to tests/integration/test-plan-merge.py; no shared tests/integration helper and no second test file is touched.
    because: Exactly one production script reads the variable from the environment (plan-merge.py line 1188), so generalising would edit about 26 further test files whose behaviour cannot differ under any environment today, and would pull the enforcement-layer test files into one task the squad cannot execute through the harness under DEC-174.
    dec: none
  - id: D-02
    choice: Make the file hermetic by popping HARNESS_AGENT_TYPE from os.environ once at module import, plus a comment naming plan-merge.py line 1188 as the coupling and one sentence in run_verb's docstring.
    because: It is the only candidate that stays hermetic for a future case written with a raw subprocess.run or Popen rather than a helper, and this file already has two raw Popens at lines 305 and 309; it covers run_apply and both Popens with zero per-site edits.
    dec: none
  - id: D-03
    choice: Do not change .claude/skills/harness/bin/plan-merge.py.
    because: Its environment read is deliberate issue-1103 defence-in-depth added after four demonstrated shell-form leaks past the hook's text prediction, and a test-mode escape hatch would add a bypass to an enforcement-adjacent guard.
    dec: none
  - id: D-04
    choice: Explicitly dropped as over-building — a shared tests/integration hermetic helper, a mandatory-explicit-env rule at every call site, any tree-wide lint or gate on environment discipline, per-site edits to run_apply and the two Popens, and a central scrub in run_pool.py or run-unit-tests.sh.
    because: The scrubbed-default helper and the explicit-env rule are bypassed by raw call sites; a central scrub in the pool turns the suite green while every file stays non-hermetic under the direct python3 tests/... invocation agents actually use, hiding the defect at the layer that would surface it.
    dec: none
  - id: D-05
    choice: No new permanent regression case is added to the file.
    because: An in-process assertion that os.environ.get of HARNESS_AGENT_TYPE is None is tautological, re-asserting the pop two lines above it. The non-tautological variant, spawning a fresh child interpreter with the variable set and asserting the pop, COULD be written as a case; it is declined on the Iron Law, not on impossibility — a test earns its place only where a plausible bug would fail it, and the 13 checks across six cases that go red again the moment the pop is removed are standing, non-tautological proof already, so such a meta-case would add no failure mode while pinning implementation structure and duplicating SC-04's cheaper inspection. The instrument that reconstructs the ambient-governed precondition is the invocation itself, which is the verify clause.
    dec: none
  - id: D-06
    choice: This flow runs under an eight cycle build and review cap, extendable only by the Advisor, with twenty as the hard maximum.
    because: The operator set it at the 2026-09-05 grilling, and the single source of the cap is BRIEF.md's Constraints section, which already carries the numbers verbatim; this entry records only that the operator chose the cap and that the Advisor is its sole extender, and defers the numbers themselves to BRIEF.md, so an extension amends one document and no gate can read a stale figure here.
    dec: none
  - id: D-07
    choice: The focused regression proof for this test-only change is the pre-fix red and post-fix green pair under the ambient governed invocation, and nothing else; the builder records the post-fix green in notes/receipt-harness-backend-dev-<runid>.md and qa records its independent run in notes/qa-BUG-1306-integration.md.
    because: The pre-fix red is already recorded by the orchestrator's measurement at HEAD c369fb1 (14 FAIL lines, exit 1), so the only missing half is the same command returning exit 0 with zero FAIL lines after the change, taken by an agent from its own governed shell.
    dec: none

