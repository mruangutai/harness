tasks:
  - id: T-01
    title: Make test-plan-merge.py hermetic against HARNESS_AGENT_TYPE at module import
    traces: [REQ-01, REQ-02, REQ-03]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: building
    files:
      - tests/integration/test-plan-merge.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      out=$(HARNESS_AGENT_TYPE=harness-orchestrator python3 tests/integration/test-plan-merge.py)
      rc=$?
      if [ "$rc" -ne 0 ]; then exit 1; fi
      if printf '%s\n' "$out" | grep -q "^FAIL"; then exit 1; fi
      printf '%s\n' "$out" | grep -qF "PASS  a governed agent's sign-approval exits 10" || exit 1
      printf '%s\n' "$out" | grep -qF "PASS  the signature actually lands" || exit 1
      # SC-03 clean-environment control. NOT redundant with SC-01: a builder who writes
      # del os.environ["HARNESS_AGENT_TYPE"] instead of os.environ.pop("HARNESS_AGENT_TYPE", None)
      # raises KeyError at module import whenever the variable is ABSENT — green under the governed
      # invocation above, red on every CI run after merge, because .github/workflows/tests.yml runs
      # this suite with no HARNESS_AGENT_TYPE. This half is the only gate that fails on it.
      clean_out=$(env -u HARNESS_AGENT_TYPE python3 tests/integration/test-plan-merge.py)
      clean_rc=$?
      if [ "$clean_rc" -ne 0 ]; then exit 1; fi
      if printf '%s\n' "$clean_out" | grep -q "^FAIL"; then exit 1; fi
      echo VERIFY-OK
    intent: |
      In tests/integration/test-plan-merge.py ONLY, make the file independent of the ambient
      HARNESS_AGENT_TYPE variable. Total change is about 15 lines and touches no other file.

      What to write, at module import time, in the import block near the top of the file (after
      "import os", alongside the TESTS_DIR / ROOT / BIN_DIR / CLI constants at lines 28-33) and
      therefore BEFORE any case body and BEFORE the two raw Popen call sites near lines 305 and
      309:

        os.environ.pop("HARNESS_AGENT_TYPE", None)

      Above it write a short comment stating: this suite shells out to plan-merge.py, whose
      cmd_sign_approval reads HARNESS_AGENT_TYPE from the process environment at
      .claude/skills/harness/bin/plan-merge.py line 1188 and exits 10 for any non-empty value; a
      Harness agent's own shell carries that variable, so without this pop 13 checks across six
      cases fail for the agent and pass for a human. Popping once here covers run_apply, run_verb
      and any raw subprocess.run or Popen a future case writes, with no per-call-site rule.

      Write the pop as os.environ.pop("HARNESS_AGENT_TYPE", None) exactly. Do NOT write
      del os.environ["HARNESS_AGENT_TYPE"]: that raises KeyError at module import whenever the
      variable is ABSENT, which is every CI run, since .github/workflows/tests.yml runs this suite
      with no HARNESS_AGENT_TYPE. The clean-environment half of this task's verify block is the only
      gate that fails on that mistake.

      Add ONE sentence to run_verb's existing docstring (line 137-141) saying that the ambient
      HARNESS_AGENT_TYPE is removed at module import, so env=None is already hermetic and an
      explicit mapping is needed only when a case wants a specific identity.

      Do NOT change plan-merge.py. Do NOT add a helper shared with other test files. Do NOT edit
      run_pool.py, run-unit-tests.sh, or any other test file. Do NOT add a new case: an in-process
      assertion that the variable is absent merely re-asserts the pop, and the child-process
      variant (a fresh interpreter spawned with the variable set) COULD be written but is declined
      on the Iron Law, since a test earns its place only where a plausible bug would fail it and
      the 13 checks across six cases already go red the moment the pop is removed.

      Leave both case_1103_ cases exactly as they are (lines 1097-1140). The positive case sets
      HARNESS_AGENT_TYPE explicitly and must still assert exit 10; the negative control's env
      filter becomes a redundant no-op while its assertion, that an absent identity signs at exit 0
      and the signature lands, is unchanged and still meaningful.

      BYTE-IDENTITY OF THE case_1103_ REGION, AND HOW IT IS CHECKED. Lines 1097-1140 of
      tests/integration/test-plan-merge.py — both case_1103_ case bodies in full — must be
      BYTE-IDENTICAL after this change. The reviewer of this task is to CONFIRM that against
      pre-fix HEAD, by diffing the file against the pre-fix commit and establishing that no hunk
      range intersects lines 1097-1140, and NOT to infer it from a green suite or from unchanged
      check() name strings. The reason it needs its own confirmation: SC-01, SC-02, SC-04 and SC-05
      all gate either which FILES changed or which strings PRINT, so a weakened predicate under an
      unchanged check() name — r.returncode in (0, 10) written in place of == 10 at
      test-plan-merge.py:1111 — still prints PASS and evades every one of them. This is a reviewer
      confirmation step, not a new success criterion.

      Then run the verify command from this task verbatim and record its full output, including the
      pass and fail counts, in
      .harness/harness/features/BUG-1306-agent-type-hermetic-tests/notes/receipt-harness-backend-dev-<runid>.md.
      The verify block now runs both halves: the governed invocation and the clean-environment
      control (env -u HARNESS_AGENT_TYPE python3 tests/integration/test-plan-merge.py), each of
      which must exit 0 with zero FAIL lines. Record both. The pre-fix red half of the evidence pair
      is already recorded: at HEAD c369fb1 the governed invocation printed 14 FAIL lines and
      exited 1.
