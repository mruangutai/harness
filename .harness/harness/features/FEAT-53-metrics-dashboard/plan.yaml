      FIXTURES ARE COMMITTED FILES, SO NO CASE MUTATES ONE IN PLACE. Every case that WRITES - each
      record() call, the fresh-project case that creates the instrumentation epoch, the two-touchpoint
      run, and the simulated ship - first copies the fixture tree it needs into a temporary directory
