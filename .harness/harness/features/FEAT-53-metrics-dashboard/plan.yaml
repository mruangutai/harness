      sparkline or its S-1/S-2 treatment. A figure NEVER appears without its denominator or unit.
      The grading tile's headline is the at-or-above-bar SHARE; rendering any central tendency is a
      violation. The usage tile names the unattributed count on the tile rather than dropping it.
      Escaped defects carries its payload sourcing_rule as persistent inline text beneath the figure
      - not a tooltip, not a footnote, not a link.
      PANELS: one level down per KPI, reached from the tile - the chart, its caveats and its feature
      table. The grading panel puts the histogram and the NAMED grade-1/grade-2 outlier table side by
      side at 1024px and above, stacked below that. Each outlier row is qualname, path and line,
      grade, driver, bar, with the grade cell tinted grade-1 or grade-2. The names are never behind a
      hover, tooltip, disclosure or click. An empty list renders the words "no grade-1 or grade-2
      functions in this window", which is a measured absence and therefore neither S-1 nor S-4.
      FOUR GAP STATES, as four distinct components named NoShipRecords (S-1), PreCapability (S-2),
      GradingCaveat (S-3) and UnavailableValue (S-4), each exactly as DESIGN C-4 draws it: S-1
      replaces the whole trend region with a dashed card and mounts NO chart and NO axes; S-2 draws
      axes, breaks the line, hatches the table cells with an em dash and the label "no trend -
      shipped before metrics", and prints the n-of-m line beneath; S-3 is the persistent caveat under
      the histogram whose counts and percentage come ONLY from the payload; S-4 differs from a
      genuine zero in all four of glyph, typography, fill and badge, and its second line is the
      payload's specific reason, never a generic "no data".
      NO literal of this repository's file mix anywhere in this source - the verify greps for it.
      Nothing is hover-only: every fact a hover would reveal is also present as text.
  - id: T-15
    title: Render the two chart shapes the probe cleared
    traces: [REQ-07, REQ-10, REQ-11]
    change_type: frontend
    execution_mode: team
    execution_agent: harness-frontend-dev
    depends_on: [T-14, T-18]
    status: ready
    files:
      - .claude/skills/harness/bin/dashboard/client/src/charts.tsx
    verify: |
      npm --prefix .claude/skills/harness/bin/dashboard/client run build && python3 -c "import pathlib,sys;s=pathlib.Path('.claude/skills/harness/bin/dashboard/client/src/charts.tsx').read_text();[sys.exit('missing '+k) for k in ['strokeDasharray','keyboard'] if k not in s];sys.exit(0 if ('scaleUtc' in s or 'scaleTime' in s) else 'no temporal scale - scaleBand/scalePoint fabricates cadence, CAP-07')"
    intent: |
      Build the two chart shapes DESIGN C-2 specifies, with the charting library T-18's probe cleared
      (D-08). T-18 has already recorded VERDICT: PROCEED; if it recorded STOP this task is not yours
      to run, because choosing what replaces the library is an operator decision.
      SHAPE A, the grading histogram: pre-binned counts as a bar series over an ordinal axis of
      exactly five grade categories, with a FIXED five-category domain so an empty grade renders as an
      empty bar and is never dropped - an inferred domain drops it silently. Each bar takes its own
      grade token from the datum; per-record bar membership is encoded as a datum-derived hatch on the
      sub-portion and NEVER as one global reference line at 4; one bin label per bin so no legend is
      needed. The chart is aria-hidden beside the real table T-14 supplies, AND it is passed keyboard
      false explicitly: the React adapter defaults tabIndex 0, which would leave focusable content
      inside an aria-hidden ancestor - an accessibility bug worse than the one the aria-hidden was for.
      Zero graded functions hands over to NoShipRecords before the chart mounts.
      SHAPE B, the time-series lines: the x scale is d3-scale's scaleUtc or scaleTime, NEVER the
      compact scaleBand or scalePoint, which treat Date values as equally spaced categories and would
      fabricate the cadence CAP-07 forbids while still rendering a plausible line.
      The payload already arrives PRE-SEGMENTED into contiguous runs (T-10): render one line per run
      and do no segmentation of your own. A missing point is already a break; there is no client-side
      null handling to write and no server file for you to edit.
      Per-series dash pattern (solid, 6-2 dash, 2-2 dot) through the strokeDasharray channel, and
      marker shape (circle, square, triangle) set independently of colour, plus a direct end-of-line
      label, so hue is never the only carrier. Square and triangle need a CUSTOM MARK via createMark -
      the built-ins are dot and hexagon only - so budget for authoring one rather than looking for a
      prop. Every colour, stroke and dash is a theme token passed in; no library default is used.
      Histogram height 280px, time-series 320px, both filling container width.
      CAP-08 is settled here, not left open: build THREE STACKED SINGLE-SERIES PLOTS sharing one x
      axis, not one plot with three y axes. Cycle time in days, a touchpoint count and a grade share
      are three incommensurable units; DESIGN C-3 records series-1 against series-2 at only 1.51 to 1
      in light and 1.21 to 1 in dark, so on one shared canvas a reader must hold dash, marker, label
      and hue together to separate three near-identical lines, while three single-series plots need no
      series-to-series disambiguation at all. Faceted composition is also the library's most
      documented path, which is less alpha surface than named multi-axis. Say in your DIGEST that you
      built it this way.
