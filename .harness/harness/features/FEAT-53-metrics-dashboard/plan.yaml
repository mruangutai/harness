      Add one assertion to test-metrics-kpi.py as well: for fixture project-a, the per-feature
      touchpoints value, the aggregate mean, the count at zero and the count not tracked in
      kpi.compute()'s payload match the hand-labelled numbers, with at least one fixture feature on
