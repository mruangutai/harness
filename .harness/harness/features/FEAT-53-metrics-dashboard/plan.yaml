  - id: D-13
    choice: KPI 6 ships as usage by agent and model tier with named unattributed buckets no-prefix, human and unresolvable-step-id, never a two-bucket split.
    because: measured at this repo, 753 of 975 commit subjects carry no harness prefix at all, so silent dropping would misreport three quarters of the work.
    dec: DEC-155
  - id: D-14
    choice: 'Cycle time starts at the feature''s BRIEF.md approval date - the date value in its Approval section, read only when that section''s status is approved - day granularity, and ends at the shipped_at of the feature''s trend record. That read is exposed ONCE, as approval_date(feature_dir) -> (value, reason) in .claude/skills/harness/bin/brief_approval.py, created by T-06, and that function is the only place the Approval section is parsed: kpi.py''s per-feature approved_on and touchpoints.py''s feature_start both CALL it rather than restating the parse - one authority, two callers - so the four gap states and their D-19 reason sentences cannot drift apart between them.'
    because: 'REQ-03 and the grilling both name BRIEF approval, so a plan-approval origin measures a different quantity than the one the requirement commits to, and the plan moves rather than the requirement; the earlier argument for plan.yaml approval.date was convenience - it is written structurally by plan-merge.py sign-approval so no prose needs parsing - and convenience does not buy a different measurement. The BRIEF carrier is also the better populated of the two and needs no new field and no new ceremony: it is filled with status and approved-by at the existing signature act (templates/BRIEF.md Approval section). Measured 2026-09-02 in the main checkout at e74e0880 by a python3 scan of every .harness/*/features/*/BRIEF.md Approval section - 47 BRIEF.md files exist, 43 carry status approved with a YYYY-MM-DD date, 2 are approved with an empty date and 2 are pending - against 31 of the same 58 feature directories carrying a dated plan-side approval, being 24 in plan.yaml approval.date plus 7 in a pre-DEC-182 PLAN.md Approval section. The read is a sectioned key-value parse for which precedent already exists in this tree - has_approval_block in .claude/skills/harness/bin/check-state.sh locates and reads exactly this block, and parse_brief in .claude/skills/harness/bin/gh-sync.py already sections BRIEF.md - so no implementer needs to invent a parser shape.'
    dec: DEC-182
  - id: D-15
    choice: An escaped defect is a BUG-NN feature unit whose directory first appears in the window, plus any commit whose subject begins Revert on the default branch; subjects beginning fix are excluded.
    because: BUG-NN units and Revert commits are conventions every onboarded project shares, while fix subjects are mostly within-feature repairs and would inflate the count.
    dec: none
  - id: D-16
    choice: A blocking human touchpoint is recorded at the moment it happens by appending one line to the feature's touchpoints.jsonl, for exactly three events - an approval signature request, an escalation that reaches the user, and a request to execute a UAT.
    because: a count reconstructed later from prose logs is not a measurement, and the per-feature file merges the way every other harness artifact does.
    dec: DEC-95
  - id: D-17
    choice: The entry point is one script at .claude/skills/harness/bin/dashboard/serve.py and no new slash command is added.
    because: .claude/commands/** is granted to no agent, so a command file would add a main-session-only surface for no capability.
    dec: DEC-174
  - id: D-18
    choice: A trend record is a single JSON object per line carrying schema, feature_id, shipped_at, approved_on, cycle_time_days, runs, cycles_used, max_total_cycles, insertions, deletions, files_changed, touchpoints, grade and attribution objects, plus an unavailable map.
    because: fixing the schema now is what lets the reader distinguish a genuine zero from an absent measurement without guessing.
    dec: none
  - id: D-19
    choice: Any value that cannot be computed is emitted as null with an entry in the sibling unavailable map whose value is a SPECIFIC SENTENCE naming the reason - no approval date in the feature's BRIEF.md, never no data; zero is reserved for a measured zero; and a missing value is never interpolated and never substituted from a neighbouring feature.
    because: REQ-11, SC-07 and DESIGN S-4 all rest on one mechanism, and two mechanisms would drift. The specific-sentence clause and the no-substitution clause live HERE because T-06, T-10, T-11 and T-14 all cite this decision as their authority; with them stated only inside T-06's intent, a reader who consulted the named authority alone got a weaker rule than the one the code implements.
    dec: none
  - id: D-20
    choice: The dashboard HAS a client build at all - React with TanStack Router and Query on the Astryx substrate, an npm package under bin/dashboard/client/, and a committed dist bundle - rather than a server-rendered HTML surface with no npm anywhere.
    because: 'the user settled React plus TanStack at the grilling (.harness/notes/grilling-metrics-dashboard-2026-09-01.md lines 76-78, and lines 20-22 for the live-server-not-static-HTML choice), and D-07 answers WHICH substrate while never arguing whether to have one, so this was the plan''s one unwritten decision. Engineering''s plan review records the live alternative, and it is new information - a server-rendered HTML surface off the same Python server satisfies REQ-01 and REQ-12 too, and would delete three of the four firsts - the frontend framework, package.json and the committed bundle - plus the entire alpha-charting risk. What the grilling rejected was the render-brief.py static-HTML-from-markdown convention, which is not the same thing as server-rendered HTML from this live server, so the alternative was never actually put to the operator. RULED by the operator on 2026-09-01 (notes/answers-2026-09-01-plan-signature.md, DEC-2): the client build is KEPT and this decision stands as drafted. The server-rendered alternative was weighed and REJECTED - REQ-12''s browser drill across three routes with URL-held state is what the plan is built around, and hand-written HTML would re-implement a router - so the disclosure above stands as a recorded consideration of what was weighed, not as a question open at signature.'
    dec: none

  - id: D-21
    choice: 'A touchpoint count is a measured zero only for a POST-INSTRUMENTATION feature, decided by a computable predicate - the project carries .harness/metrics/instrumented_at holding one RFC3339 UTC instant, written once by touchpoints.py record() on its first call in that project and never rewritten, and the feature''s own start (the BRIEF.md approval date per D-14, else the author date of the first commit that added its feature directory) falls on or after the epoch''s own UTC CALENDAR DAY. The comparison is at DAY granularity: both sides are reduced to their UTC date and only a strictly earlier date is pre-instrumentation, so a feature whose start is the SAME calendar day the epoch was written is post-instrumentation, not pre. Every other feature, including every feature in a project carrying no epoch file at all, reports null with a D-19 specific-sentence reason and never 0. Day granularity is specific to THIS predicate: a date-only approval date read as 00:00:00Z would otherwise sort before an epoch written later that same day and report null for a feature that is genuinely tracked. It does not change D-14''s cycle-time arithmetic and does not weaken the general rule that a date-only value is read as 00:00:00Z wherever an instant is needed.'
    because: 'an absent touchpoints.jsonl is ambiguous by construction - it is both a tracked run in which nothing blocked and a feature that shipped before the counter existed - and at this repository every existing feature is the second kind: measured 2026-09-02 in the main checkout at e74e0880, 58 feature directories exist under .harness/*/features/, none of them carries a touchpoints.jsonl, and 43 of them carry a signed BRIEF approval date, so the unscoped rule fabricates exactly the launch-day autonomy tile D-19 forbids; the predicate lives HERE and not inside T-11''s intent because D-19 already exists for that reason, a rule stated only in a task''s intent gave every other reader a weaker contract than the code implements, and a prose test such as features that predate this feature is not computable at all; the epoch file is chosen over a harness.json key or a git log over touchpoints.py because it self-installs in any onboarded project with no harness-init change, and it fails closed - no epoch means nothing in that project is a measurement. THE EPOCH''S DURABILITY: D-22 settles it. .harness/metrics/instrumented_at is a committed record, not scratch, and the step whose execution first creates it commits it in the same act, so a second clone of the repository inherits the epoch rather than writing a later one - the fabricated-zero case a clone opened is closed. THE RESIDUAL RISK, recorded rather than closed: record() creates the file at runtime inside whichever worktree runs first (DEC-95), so a reclamation of that worktree between the create and the commit landing takes it, and the next record() writes a later instant. WHAT MOVES IF IT IS LOST - every feature whose start instant falls before the new epoch flips from branch 4 to branch 3 and reports unavailable-never-tracked in place of its measured count, which is loss of a measurement in the SAFE direction D-19 mandates and never a fabricated zero: a feature could only report a zero it did not measure if its own touchpoints.jsonl were lost while its start instant stayed after the epoch, and a worktree reclamation takes the epoch and that feature''s touchpoints.jsonl together, so that combination is unreachable. T-11''s branch-1 case, a project carrying no instrumented_at file reporting every feature unavailable, is the assertion that pins the post-loss state.'
    dec: none

  - id: D-22
    choice: >-
      The three files this feature creates at runtime - .harness/metrics/instrumented_at and each
      feature's touchpoints.jsonl, both written by touchpoints.py's record(), and
      .harness/metrics/trend.jsonl, written by trend.py's append() - are COMMITTED records, never
      gitignored and never treated as ephemeral scratch, and the step whose execution first creates or
      appends each of them commits it in the same act; for the epoch and the touchpoints log that step is
      T-20's three recorded instructions, and for trend.jsonl it is the record_ship call T-19 adds to
      gh-sync.py's cmd_ship, which commits the appended line in the same act it appends it and is wrapped
      non-fatally exactly as the append is, and no other task owns any of the three.
    because: >-
      measured 2026-09-02 in the FEAT-53 worktree on branch feat/FEAT-53, git check-ignore -v exits 1
      with no output for .harness/metrics/instrumented_at, .harness/metrics/trend.jsonl and a
      feature's touchpoints.jsonl, and .gitignore carries no metrics line at all, so today's
      non-ignore is accidental - this decision makes it deliberate and names a committer for each of the
      three. Both directions are unsafe. An ignore rule over the epoch lets a second clone write a LATER
      instant, and a feature whose start instant falls after that fabricated epoch then reports a measured
      zero, which is exactly the fabrication D-21 exists to prevent. Leaving a created file
      uncommitted dirties the tree, and a dirty tree halts the next team run - the same failure
      .harness/features/*/runs/** is ignored to prevent, arrived at from the other side. trend.jsonl had
      no committer at all before this: gh-sync.py's _commit_terminal_station commits plan.yaml ONLY
      (gh-sync.py:659-661), so the first real ship would append an unignored, untracked line and leave the
      main checkout dirty at exactly the moment the next run starts - which is why the commit is named on
      the appending step rather than deferred to a human. Committing
      at the moment of creation, rather than seeding the epoch from a task of its own, is the weakest
      sufficient form: D-21 gives record() sole authorship of the epoch, so an agent-authored seed
      would add a second writer to the one marker that separates a tracked project from an untracked
      one. The stated disposition lives in .claude/skills/harness/templates/gitignore.snippet because
      that is the distributed copy every onboarded project receives; merge-gitignore.sh strips comment
      lines when it merges (it greps them out by leading hash), so a target .gitignore never receives
      the sentence, and T-02 therefore gates this repository's side with git check-ignore rather than
      with a comment. Fixture trees under dashboard/fixtures/ are outside this rule: T-11 writes there,
      not at the real project root.
    dec: none
  - id: D-23
    choice: >-
      The accepted backlog rows from every plan cycle of this feature are filed at ship as GitHub
      issues, one issue per row, each labelled Dashboard, and this decision is their single carrier.
      The complete accepted set is B-1, B-2, B-3, B-4, B-5, B-7, B-8, B-9, B-10, B-12, B-13, B-14,
      B-23 and B-25. B-1..B-5 and B-12..B-14 additionally carry their own panel-finding note in this
      plan's panel.findings, and so do B-23 and B-25 - B-23's disposition is C4-05 and B-25's is
      C4-07, both reading backlog. Only B-7..B-10 have no panel disposition of their own. Every
      row's subject is recorded here regardless of its carrier, so ONE decision names the complete
      accepted set in one place and a filer at ship does not have to reconstruct any of it from a
      briefing. B-7 - KPI 1's change-size half reads git diff default...branch, which nulls once a
      merged branch is pruned, and most onboarded projects prune, while review_sha survives the
      prune and is already read by the same task. B-8 - the KPI 6 tile is labelled by agent and
      model tier but its payload keys by model name only and the resolved agent is discarded, so
      keep the agent name or relabel the tile. B-9 - the start command is documented under
      .agents/skills while the source is pinned under .claude/skills, both resolve because
      .agents/skills is a symlink, and the README should state one; .claude/skills was ruled for
      internal consistency with D-01 and D-17, overridable. B-10 - a design clause pins focus to the
      originating control on browser Back, which needs router behaviour that cannot be verified
      until TanStack Router is installed, and if it cannot hold the fallback is the page heading and
      the clause needs one sentence. B-23 - SC-13 asserts both the escaped-defect count and that the
      rule is stated in the UI beside the number under verify automated with evidence unit, and the
      UI half has no gate, so either move the UI clause into SC-15's inspection scope or narrow
      SC-13 to the count. B-25 - T-05's contract was updated to the 3x3 seven-tile grid while the
      committed prototype it points at is a six-tile 3x2 build that no one has ever rendered, and
      T-05's verify cannot detect the divergence, so T-05 wants one clause recording the six-tile
      artifact as accepted under DEC-5's closure.
    because: >-
      the listed set is the COMPLETE accepted set and nothing else is owed: B-6 was STRUCK by the
      operator, and B-11, B-15, B-16, B-17, B-18, B-19, B-20, B-21, B-22 and B-24 were FIXED in
      later cycles, so no other briefing row survives. The four cycle-1 rows B-7..B-10 existed only
      inside pass 1's immutable briefing (notes/ship-review-2026-09-01-plan.md:126-129) and were
      wired to nothing live, while B-23 and B-25 were accepted as backlog in the pass-4 ruling
      (notes/answers-2026-09-02-plan-signature-c4.md Q2) after the last panel run, so without one
      decision naming every row a filer at ship has to reassemble the set from three separate
      briefings. The filing MECHANISM is the existing one and is not invented here - one issue per
      row, label Dashboard, at ship - exactly what the panel notes on B-1..B-5 and B-12..B-14
      already instruct.
    dec: none
  - id: D-24
    choice: >-
      Widen only REQ-02's operational surface to the fleet: collect every FEAT and BUG directory under every control-plane .harness segment, every control-plane grilling note, and every registered worktree entry of both the control plane and each repository under the configured workspace_root, including each primary checkout. The seven KPI computations remain scoped to the single project passed to the existing dashboard entry point.
    because: >-
      The operator needs one work queue across the factory, while cross-project KPI comparison remains out of scope and would violate the meaning of the existing project-local measures.
    dec: none
  - id: D-25
    choice: >-
      Derive attention from persisted disk state with precedence needs-you, blocked, stalled, over-budget, running, stale. needs-you means an awaiting_user run, a nonempty STATE Open Questions section, a pending plan approval, or an open grilling note; blocked means the run records blocked; stalled means a running run has no STATE or run-state write for dashboard.stalled_minutes; over-budget means remaining cycles are at or below dashboard.over_budget_remaining_cycles; running means a running run is fresher than the stalled boundary; stale means any other non-terminal item has no relevant write for dashboard.stale_days. Configure 45 minutes, 7 days and 1 remaining cycle in the control plane harness.json dashboard block. Sort by that state order, then oldest relevant write, then stable item id.
    because: >-
      All six labels can be reproduced from existing files without pretending to know whether a process is alive, and configuration makes the operational thresholds visible and changeable without modifying collector code.
    dec: none
  - id: D-26
    choice: >-
      Give grilling notes YAML front-matter with status open, handed-off or abandoned and became set to the full feature id only for handed-off notes. The grilling skill creates open notes; plan and patch intake mark their source note handed-off after an id exists; abandonment marks abandoned. A one-shot reviewed manifest migrates the 46 notes present on 2026-09-15: a uniquely cited note is handed-off to that feature and every uncited note is abandoned.
    because: >-
      Filename and prose heuristics cannot truthfully distinguish active exploration from work already converted into a feature, whereas an explicit lifecycle can be checked and backfilled conservatively.
    dec: none
  - id: D-27
    choice: >-
      Resolve feature state by matching the full feature directory name or its FEAT-N or BUG-N prefix to registered non-primary worktrees. When both copies exist, read the worktree copy as a whole and use the main-checkout copy only as fallback; never merge fields. Every feature item records canonical absolute main_path, nullable worktree_path, and source_path. Emit every git worktree list entry, primary or linked, as a separate worktree row even when its feature is terminal or absent.
    because: >-
      Live work commonly exists only in a linked worktree, but retaining both paths makes precedence auditable and keeps orphaned or terminal worktrees visible instead of collapsing them into feature state.
    dec: none
  - id: D-28
    choice: >-
      Build the operational view entirely from local files and git worktree metadata. Do not import a GitHub client, invoke gh, read the board, make network requests, or add tracker-mode wayfinding rows.
    because: >-
      The board is a write mirror, board and wayfinding receipts are not locally persisted, and a partial GitHub-backed view would contradict the operator's offline control-plane requirement.
    dec: none

  - id: D-29
    choice: >-
      The browser has exactly three product routes: the single dashboard /, one KPI /kpi/$n, and one feature-or-bug detail /work/$id. Retire /work as a separate route, the Work header toggle, /features, /features/$featureId and every /kpis page; no redirect, alias or hidden product route survives. Tile to KPI panel to work item is the only routed drill chain, while attention cards filter the work list in place on /.
    because: >-
      The operator chose one dashboard for the overview and work queue so repository context and attention remain visible while the work list changes; only KPI and feature-or-bug detail questions justify leaving that screen.
    dec: none
  - id: D-30
    choice: >-
      Compose / inside a centred max-width container as the shared header with window and Repository dropdown, an attention strip whose cards act as Status filter shortcuts, the Repository KPIs section first, and then the work list with Kanban and Table layouts. The work list filters Station, Status and Kind, has no Repository filter, and its table names the state column Status; Astryx icons carry status without text colour or coloured borders or top-lines. Compose /kpi/$n as one KPI panel and /work/$id with the operational header before the former per-feature KPI content. Grilling and worktree items expand inline from the work list on / and never receive a detail route.
    because: >-
      Keeping repository scope in the shared header and KPI context above the work queue makes the dashboard one continuous operational judgement, while the two remaining drill routes retain clear completion boundaries.
    dec: none
  - id: D-31
    choice: >-
      Report feature and bug elapsed time as total from BRIEF approval to ship or now and as plan,
      build and validate phase durations derived from DEC-159 seam handoff notes plus run started_at
      and ended_at. The active phase accrues through now; station remains a separate field.
    because: >-
      The operator needs time-in-phase rather than a second station label, and the persisted handoff
      and run timestamps are the existing local evidence for those boundaries.
    dec: DEC-159
  - id: D-32
    choice: >-
      At run end the orchestrator measures tokens from the host transcript and passes the exact
      integer to feature-record.py run-end. Aggregate measured tokens per item and phase while
      carrying the unmeasured run count; absent measurements are null, never zero, and historical
      runs are not backfilled. Compute and display no dollar cost.
    because: >-
      Zero of the 1,336 recorded runs currently carries a token value, so only prospective host
      measurement is honest; D-19 forbids converting missing measurements into zero and DEC-178
      rules dollar cost out of scope.
    dec: DEC-227
  - id: D-33
    choice: >-
      The shared header owns window and repository as URL parameters on every route, defaults both
      to all, preserves them through navigation and reload, and applies the same pair to GET
      /api/kpis and GET /api/work.
    because: >-
      A fleet dashboard whose visible selection and API slice diverge would compare unlike scopes;
      one URL-backed authority makes every route shareable and deterministic.
    dec: none
