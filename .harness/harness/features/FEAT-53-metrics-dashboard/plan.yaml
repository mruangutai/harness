        approval_date(feature_dir: Path) -> tuple[str | None, str | None]
      returning (the YYYY-MM-DD date value, None) when that feature's BRIEF.md carries an Approval
      section whose status is approved and whose date parses, and (None, reason) in every gap state.
      kpi.py calls it for every feature's approved_on and never restates the parse; T-11's feature_start
