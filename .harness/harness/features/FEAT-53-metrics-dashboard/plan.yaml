      second git diff, which measured 56ms per branch against 33.5ms and would spend about a
      second of the request budget for nothing - null with a reason when the branch is gone.
      Rework per feature: cycles_used and max_total_cycles verbatim from feature.json; the aggregate
      is the sum of each, reported as both terms and never as a lone ratio.
      Window filtering keys on shipped_at; 30d and 90d are relative to generated_at, all is
      unfiltered. A feature with no shipped_at is in the all window only.
      Expose that rule ONCE as resolve_window(token, generated_at) -> (start, end) in kpi.py and
