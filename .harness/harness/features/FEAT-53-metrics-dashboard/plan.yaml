    verify: |
      python3 .claude/skills/harness/bin/test-metrics-kpi.py && python3 .claude/skills/harness/bin/test-metrics-trend.py && python3 -c "import ast,sys;m=ast.parse(open('.claude/skills/harness/bin/gh-sync.py').read());f=[n for n in ast.walk(m) if isinstance(n,ast.FunctionDef) and n.name=='cmd_ship'];sys.exit('cmd_ship absent from gh-sync.py') if not f else None;names={getattr(c.func,'attr',getattr(c.func,'id','')) for c in ast.walk(f[0]) if isinstance(c,ast.Call)};sys.exit(0 if 'record_ship' in names else 'cmd_ship never calls record_ship')"
    intent: |
      trend.py's append() has NO CALLER anywhere in this plan: T-10 defines it and nothing invokes it.
      Left as drafted, trend.jsonl stays permanently empty, and DESIGN's S-1 - no axes at all - is not
      a transient gap state but the dashboard's permanent state for every feature, including ones
      shipped after this lands. REQ-10 would ship as a correct, unused library. Close that.
      Add record_ship(project_root, feature_dir) to trend.py. It assembles ONE record in D-18's shape
      for that feature - approved_on, cycle_time_days, runs, cycles_used, max_total_cycles,
      insertions, deletions and files_changed from kpi.py's per-feature fields, the grade object from
      grading.distribution, the attribution object from attribution.by_tier, touchpoints from
      touchpoints.count(), and shipped_at as the current RFC3339 UTC instant - then calls append().
      Any field it cannot compute is null with its reason in the record's own unavailable map (D-19): a
      ship is NEVER blocked by an uncomputable metric, and never records a zero it did not measure.
      Then call record_ship from gh-sync.py's cmd_ship, the function that runs at the user-gated ship
      step and already receives feat_dir. Call it BEFORE the board writes, and wrap the call so a
      failure prints one loud line and does NOT abort the ship - a metrics write must never be what
