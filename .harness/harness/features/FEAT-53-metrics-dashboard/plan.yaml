      Accept YYYY-MM-DD, which is the only form observed in this tree, and read a date-only value as
      00:00:00Z wherever an instant rather than a day is needed. That 00:00:00Z reading is the general
      rule; D-21's pre/post-instrumentation predicate compares at DAY granularity and is the single
