             neither an approval date in its BRIEF.md nor a commit that added its directory, so
             pre-instrumentation and post-instrumentation cannot be told apart").
          3. feature_start's UTC CALENDAR DAY is strictly BEFORE the epoch's UTC calendar day ->
             (None, "this feature predates touchpoint instrumentation in this project - touchpoints
             were never tracked for it") when that feature has NO touchpoints.jsonl, and (None, "this feature
           started before touchpoint instrumentation in this project - the N touchpoints recorded for it
           after instrumentation began are not a complete count") when the file EXISTS with N >= 1 lines.
           The value is null either way; only the sentence differs, because a verbatim "never tracked"
           rendered beside a file that holds real lines is a false D-19 reason - and the transition window
           is not hypothetical: every feature in flight when this ships has a pre-epoch BRIEF approval date
           and will accrue real lines from T-20's recorded instructions. This comparison is at DAY granularity, stated once here and
             once in D-21 and nowhere else: reduce both sides to their UTC date and compare the dates,
             so a feature whose start falls on the SAME calendar day the epoch was written is
             post-instrumentation and reaches branch 4. Comparing instants instead would read a
             date-only approval date as 00:00:00Z and report null for a feature that is genuinely
             tracked; that general 00:00:00Z reading (T-06) still holds everywhere else - this
             predicate is its one scoped exception, not a contradiction of it.
          4. otherwise POST-INSTRUMENTATION -> (the number of lines in that feature's
             touchpoints.jsonl, None), and 0 for an absent file, which here IS a measured zero -
             a tracked run in which no blocking touchpoint happened.
        Each reason above is a D-19 specific sentence and goes in the unavailable map verbatim;
        "no data" is not one of them. Measured 2026-09-02 in this repository, all 58 existing feature
        directories predate this capability and 43 of them carry a signed BRIEF approval date, so
        branch 3 is the common case at launch and an unscoped branch 4 would fabricate the whole
        launch-day autonomy tile.
      The three counted events, and no others: approval_request (the user is asked to sign a BRIEF
      or a plan), escalation (an ESCALATE or awaiting_user reaches the user), uat_request (the user
      is asked to execute a UAT). Reject any other event name with a non-zero exit naming the three.
      CLI: python3 touchpoints.py record --feature <FEAT> --event <kind> [--note <text>], and
      python3 touchpoints.py count --feature <FEAT>, which prints the integer when count() returns a
      value and the line unavailable: <reason> when it returns None, exiting 0 either way - an
      honest unavailable is an answer, not a failure. Both take an optional --root defaulting to the
      git root of cwd.
      Wire count into kpi.py's per-feature touchpoints: the value when it is an int, else null with
      the reason in that feature's unavailable map under the key touchpoints. The AGGREGATE is the
      mean over TRACKED features only, plus the count of tracked features at zero, plus the count of
      features not tracked, and that third term is reported by name on the payload - a mean whose
      denominator silently includes untracked features is the same fabrication one level up.
      Extend test-metrics-trend.py with these cases, and print each ok line with the case label
      given here VERBATIM, because T-11's verify greps for exactly these two strings:
        "touchpoints post-instrumentation absent file is zero" - a fixture project carrying an
        instrumented_at epoch and a feature whose BRIEF approval date is AFTER it, with no
        touchpoints.jsonl at all, reports 0 and carries NO entry in the unavailable map.
        "touchpoints pre-instrumentation is unavailable not zero" - the same fixture project with a
        feature whose BRIEF approval date is BEFORE the epoch reports None, carries the branch-3
        sentence in the unavailable map, and its value is asserted to be not 0 and not "0".
      Also assert, as its own case, the transition window: the same fixture project with a pre-epoch
      feature whose touchpoints.jsonl EXISTS and holds two lines reports None with the incomplete-count
      sentence, asserted to name the recorded count and NOT to say the touchpoints were never tracked.
      Also assert, as their own cases: a project with NO instrumented_at file reports every feature
      through branch 1; a feature with neither a BRIEF approval date nor an adding commit reports
      through branch 2; a feature whose BRIEF approval date is the SAME CALENDAR DAY as the epoch -
      the epoch instant later in that day than 00:00:00Z - reaches branch 4 and is POST-instrumentation,
      reporting a number (0 for an absent log) and NO unavailable entry, which is the case an
      instant-granularity comparison gets wrong; a simulated run recording two touchpoints reports 2
      and the shipped trend record carries 2; a run recording none, in an instrumented project,
      reports 0; an unknown event name exits non-zero and writes nothing; and record()'s first call in
      a fresh project creates instrumented_at while a second call leaves its bytes unchanged.
      Every fixture project this task builds lives under dashboard/fixtures/ and its files are the
      fixture's own, never this repository's .harness/metrics/ or feature directories - D-22's commit
      rule is about the real project root and does not reach fixture trees.
      FIXTURES ARE COMMITTED FILES, SO NO CASE MUTATES ONE IN PLACE. Every case that WRITES - each
