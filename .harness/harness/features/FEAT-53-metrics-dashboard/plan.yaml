      ship-retry case and is not an error worth aborting on either.
      Add to test-metrics-kpi.py: record_ship builds the record fixture project-a's hand-labelled
      values predict, field by field, with an uncomputable field appearing as null plus a reason and
      never as 0.
      Add to test-metrics-trend.py: a simulated ship against fixture project-a appends exactly one
      line whose feature_id and touchpoint count match the fixture, and a second ship of the same
      feature is refused rather than appending a second line. Demonstrate the failing state first -
      before the call site exists, the fixture's trend.jsonl stays absent.
      Do NOT touch this repository's own .harness/metrics/trend.jsonl. This task adds the CALLER; the
      write happens when a real ship runs.
