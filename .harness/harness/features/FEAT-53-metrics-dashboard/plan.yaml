      whose Approval section status is pending rather than approved, and one approved with an empty date
      value (the form 2 real features here already have) - plus a hand-written expected-values JSON
      beside it covering every one of them, including each gap feature's expected reason sentence.
      The tests assert against the HAND-LABELLED numbers, never against a second call of the same code.
      The four gap features get FOUR SEPARATE assertions, one per feature: that feature's approved_on and
      cycle_time_days are null and its unavailable map carries THAT gap's own distinct sentence, and the
      four sentences are asserted to differ from one another. Never one aggregate assertion over the four,
      and never a count of unavailable entries - a shared or copy-pasted sentence would pass both.
      Register test-metrics-kpi.py in run-unit-tests.sh UNIT_SCRIPTS. Do not add it to harness.json.
      Every function must grade at or above its bar under code-grade.py.
