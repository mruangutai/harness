decisions:
  - id: D-01
    choice: The dashboard's server and client source live under .claude/skills/harness/bin/dashboard/, never under web/src/ or src/.
    because: the authored skill tree IS the distribution now that deploy.sh is gone, and product-side globs resolve to NOBODY in the harness base.
    dec: DEC-202
  - id: D-02
    choice: harness-frontend-dev is granted .claude/skills/harness/bin/dashboard/client/** by T-01 before any client task runs.
    because: its only source grant today is a product-side glob that reaches nothing in this checkout, so without T-01 the client falls to backend-dev.
    dec: DEC-189
  - id: D-03
    choice: The server is python3 stdlib ThreadingHTTPServer with a hand-written route table and no web framework; rejected FastAPI plus uvicorn, Flask, and a Node server.
    because: three read-only loopback GET routes do not repay a framework, and each added runtime import becomes a hard prerequisite gate with a loud failure.
    dec: DEC-190
  - id: D-04
    choice: The client is built at development time and its bundle committed under bin/dashboard/client/dist/; rejected build-on-first-start and CDN-loaded React.
    because: REQ-01 and REQ-02 forbid a per-project build step and no onboarded project can be assumed to have Node.
    dec: none
  - id: D-05
    choice: The server binds 127.0.0.1 only, with no flag to bind any other interface and no authentication.
    because: a read-only local instrument panel on a single-operator machine has no threat model that a bind flag would not create.
    dec: DEC-193
  - id: D-06
    choice: The dashboard starts on demand from one documented command, recomputes every KPI per request, and runs no background refresh job and no lifecycle auto-start.
    because: a full recomputation projects to about 3.6 seconds at this repo's scale once T-06 pins the single-call git diff form, which is still cheaper than any staleness policy; the 1.1 second figure this decision carried before was taken before the per-branch change-size work T-06 specifies existed and is superseded by the per-item measurement of 2026-09-01.
    dec: none
  - id: D-07
    choice: The client is React with TanStack Router and TanStack Query, on the Astryx substrate; no second component substrate is introduced.
    because: the astryx-design-system convention makes a second substrate a Decision, and nothing here needs one.
    dec: none
  - id: D-08
    choice: Charting is TanStack Charts at alpha, pinned as @tanstack/charts with its /react adapter; the fallback trigger is any of CAP-01, CAP-05, CAP-07 or CAP-11 unmet at T-18's probe, and NO FALLBACK LIBRARY IS NAMED - what to do when the trigger fires is an operator decision outstanding at signature.
    because: alpha risk is accepted only while the four hard capabilities hold, and a named trigger keeps the swap a decision rather than a rescue - but the package this decision named before, npm react-charts, cannot be the net - its newest publication is 2023-11-02 and its peer is React 16, against this client's React 19 substrate, so it will not install beside Astryx at all. The two live options are to accept the alpha with a documented rollback, or to name a second, live charting library, which DESIGN requires be its own Decision. Recommendation - accept the alpha with a rollback, because T-18 now probes all thirteen capabilities before one line of client UI exists, so a STOP costs only the toolchain task and the operator can choose a library then with the probe in hand rather than now on speculation.
    dec: none
  - id: D-09
    choice: No database and no cache at launch; a derived, gitignored, rebuildable SQLite cache over trend.jsonl is the named future lever and is not built now.
    because: the measured cost of recomputation is about 3.6 seconds projected at this repo's scale, so a cache would add a staleness class of bug for a saving the single operator does not feel; T-12 re-measures it against an 8.0 second ceiling every run, so the deferral stays falsifiable rather than assumed.
    dec: none
  - id: D-10
    choice: Trend data is appended one JSON line per ship to .harness/metrics/trend.jsonl and history is never recomputed or backfilled.
    because: regrading about 967 commits costs roughly 16 minutes and would invent a past that was never measured.
    dec: DEC-95
  - id: D-11
    choice: Trend fields live in trend.jsonl rather than in new feature.json keys.
    because: the feature.json key set is closed with additionalProperties false, so extending it means a schema bump and a migration across every feature.
    dec: DEC-191
  - id: D-12
    choice: KPI 5 reports the at-or-above-bar share plus the named grade-1 and grade-2 outlier list, and no central tendency appears in the payload at all.
    because: a mean over per-record bars is not a statement anyone can act on.
    dec: none
  - id: D-13
    choice: KPI 6 ships as usage by agent and model tier with named unattributed buckets no-prefix, human and unresolvable-step-id, never a two-bucket split.
    because: measured at this repo, 753 of 975 commit subjects carry no harness prefix at all, so silent dropping would misreport three quarters of the work.
    dec: DEC-155
  - id: D-14
    choice: Cycle time starts at plan.yaml approval.date, day granularity, and ends at the shipped_at of the feature's trend record.
    because: approval.date is written structurally by plan-merge.py sign-approval and is populated for 41 of 54 features, so no prose needs parsing.
    dec: DEC-182
  - id: D-15
    choice: An escaped defect is a BUG-NN feature unit whose directory first appears in the window, plus any commit whose subject begins Revert on the default branch; subjects beginning fix are excluded.
    because: BUG-NN units and Revert commits are conventions every onboarded project shares, while fix subjects are mostly within-feature repairs and would inflate the count.
    dec: none
  - id: D-16
    choice: A blocking human touchpoint is recorded at the moment it happens by appending one line to the feature's touchpoints.jsonl, for exactly three events - an approval signature request, an escalation that reaches the user, and a request to execute a UAT.
    because: a count reconstructed later from prose logs is not a measurement, and the per-feature file merges the way every other harness artifact does.
    dec: DEC-95
  - id: D-17
    choice: The entry point is one script at .claude/skills/harness/bin/dashboard/serve.py and no new slash command is added.
    because: .claude/commands/** is granted to no agent, so a command file would add a main-session-only surface for no capability.
    dec: DEC-174
  - id: D-18
    choice: A trend record is a single JSON object per line carrying schema, feature_id, shipped_at, approved_on, cycle_time_days, runs, cycles_used, max_total_cycles, insertions, deletions, files_changed, touchpoints, grade and attribution objects, plus an unavailable map.
    because: fixing the schema now is what lets the reader distinguish a genuine zero from an absent measurement without guessing.
    dec: none
  - id: D-19
    choice: Any value that cannot be computed is emitted as null with an entry in the sibling unavailable map whose value is a SPECIFIC SENTENCE naming the reason - no approval date in plan.yaml, never no data; zero is reserved for a measured zero; and a missing value is never interpolated and never substituted from a neighbouring feature.
    because: REQ-11, SC-07 and DESIGN S-4 all rest on one mechanism, and two mechanisms would drift. The specific-sentence clause and the no-substitution clause live HERE because T-06, T-10, T-11 and T-14 all cite this decision as their authority; with them stated only inside T-06's intent, a reader who consulted the named authority alone got a weaker rule than the one the code implements.
    dec: none
  - id: D-20
    choice: The dashboard HAS a client build at all - React with TanStack Router and Query on the Astryx substrate, an npm package under bin/dashboard/client/, and a committed dist bundle - rather than a server-rendered HTML surface with no npm anywhere.
    because: the user settled React plus TanStack at the grilling (.harness/notes/grilling-metrics-dashboard-2026-09-01.md lines 76-78, and lines 20-22 for the live-server-not-static-HTML choice), and D-07 answers WHICH substrate while never arguing whether to have one, so this was the plan's one unwritten decision. Engineering's plan review records the live alternative, and it is new information - a server-rendered HTML surface off the same stdlib server satisfies REQ-01 and REQ-12 too, and would delete three of the four firsts - the frontend framework, package.json and the committed bundle - plus the entire alpha-charting risk. What the grilling rejected was the render-brief.py static-HTML-from-markdown convention, which is not the same thing as server-rendered HTML from this live server, so the alternative was never actually put to the operator. Recommendation - keep the client build, because REQ-12's browser drill across three routes with URL-held state is what the plan is built around and hand-written HTML would re-implement a router; but this reaches the operator at signature as an explicit yes or no.
    dec: none

