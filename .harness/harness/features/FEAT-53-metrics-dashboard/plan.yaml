      or a plan), escalation (an ESCALATE or awaiting_user reaches the user), uat_request (the user
      is asked to execute a UAT). Reject any other event name with a non-zero exit naming the three.
      CLI: python3 touchpoints.py record --feature <FEAT> --event <kind> [--note <text>], and
      python3 touchpoints.py count --feature <FEAT>, which prints the integer when count() returns a
      value and the line unavailable: <reason> when it returns None, exiting 0 either way - an
      honest unavailable is an answer, not a failure. Both take an optional --root defaulting to the
      git root of cwd.
      Wire count into kpi.py's per-feature touchpoints: the value when it is an int, else null with
      the reason in that feature's unavailable map under the key touchpoints. The AGGREGATE is the
      mean over TRACKED features only, plus the count of tracked features at zero, plus the count of
      features not tracked, and that third term is reported by name on the payload - a mean whose
      denominator silently includes untracked features is the same fabrication one level up.
      Extend test-metrics-trend.py with these cases, and print each ok line with the case label
      given here VERBATIM, because T-11's verify greps for exactly these two strings:
        "touchpoints post-instrumentation absent file is zero" - a fixture project carrying an
        instrumented_at epoch and a feature whose BRIEF approval date is AFTER it, with no
