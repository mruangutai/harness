      Do not invent a parser shape - has_approval_block in
      .claude/skills/harness/bin/check-state.sh already locates and reads exactly this block, and
      parse_brief in .claude/skills/harness/bin/gh-sync.py already sections BRIEF.md; follow one of
      them. FOUR gap states, each its own branch of approval_date returning its OWN distinct reason
      sentence and never a shared one: an absent BRIEF.md, a BRIEF.md with no Approval section, an
      Approval section whose status is not approved, and an approved section whose date is empty or
      unparseable. None of them is a crash: kpi.py puts each returned reason verbatim into that feature's
      unavailable map (D-19), so all four gap states route to a specific reason.
      That branch is LIVE, not theoretical - measured 2026-09-02 in this
      repository, 2 of 47 BRIEF.md files are approved with an empty date and 2 are still pending.
      Read every plan.yaml through harness_yaml.load_plan from
      .claude/skills/harness/bin/harness_yaml.py, never a bare yaml.safe_load: that module exists
      because a from-scratch parse failed on 35 of 36 real task blocks for reasons an author would
      not predict, and every other caller in this tree already goes through it. Catch its
      YamlParseError and PlanSchemaError and route each to that feature's unavailable map with the
      reason, rather than letting compute() raise - a foreign project's plan.yaml may be
      station-only or malformed and that is a gap state, not a crash.
      The returned payload is
        {schema: "kpi/1", project: {root, name}, window, generated_at,
         features: [ {feature_id, approved_on, shipped_at, cycle_time_days, runs, cycles_used,
                      max_total_cycles, insertions, deletions, files_changed, touchpoints,
                      unavailable: {}} ],
         aggregate: {throughput: {...}, rework: {...}, touchpoints: {...}, escaped_defects: {...},
                     grading: {...}, attribution: {...}, unavailable: {}},
         trend: {points: [], unavailable: {}}}
      This task fills throughput and rework and leaves the other four aggregate keys as null with an
      unavailable reason "not yet implemented"; later tasks replace them.
      THE UNAVAILABILITY CONTRACT, which every later task obeys: a value that cannot be computed is
      null AND carries an entry in its object's sibling unavailable map whose value is a specific
      sentence - "no approval date in the feature's BRIEF.md", not "no data". Zero is written only for
      a measured zero. Never interpolate and never substitute a neighbouring feature's value.
      Throughput per feature: approved_on is that BRIEF approval date, cycle_time_days = shipped_at
      minus approved_on in days (D-14), and shipped_at comes from the feature's trend
      record when one exists, else null with reason "no ship record for this feature". Aggregate
      throughput is the MEDIAN over features with both ends present, plus the count of features
      excluded and why. runs is len(feature.json runs); change size is insertions, deletions and
