    intent: |
      Write the failing test first, and make it fail for the right reason before the mechanism
      exists - SC-10 requires the two-touchpoint case to be demonstrated failing.
      touchpoints.py is a CLI plus a library implementing D-16 and D-21, and it lives at
      .claude/skills/harness/bin/touchpoints.py - NOT inside bin/dashboard/. The callers that
      record events are the orchestrator, pm and the validator; none of them is dashboard code,
      and the dashboard only READS the instrument. Homing harness-wide instrumentation inside a UI
      feature's subtree would make every future caller reach into bin/dashboard/ for something
      unrelated to rendering, and would take the counter with the subtree if it ever moved. bin/**
      is already granted, so the placement costs nothing.
        record(project_root, feature_id, event) appends one JSON line
        {"at": <RFC3339 UTC>, "event": <kind>, "note": <optional one line>} to
        project_root/.harness/<repo>/features/<feature_id>/touchpoints.jsonl, creating the file on
        first use. Append only; it never rewrites the file. On its FIRST call in a project it also
        writes the instrumentation epoch (below) if that file is absent, and never rewrites it.
        Both files are committed records, not scratch (D-22); the step that CALLS record() owns the
        commit (T-20), and record() itself never runs git.
        instrumentation_epoch(project_root) returns the single RFC3339 UTC instant on the first line
        of project_root/.harness/metrics/instrumented_at, or None when that file is absent. This is
        the ONLY marker that separates a tracked project from an untracked one. It is written by
        record() alone, at runtime; NO agent authors it, no task lists it in files, and no dashboard
        route can reach it (REQ-13).
        feature_start(project_root, feature_id) is that feature's own start - the feature's BRIEF.md
        approval date, read by CALLING approval_date(feature_dir) from
        .claude/skills/harness/bin/brief_approval.py, the single authority T-06 creates (D-14): do NOT
        restate the Approval-section parse here, and use the reason it returns rather than composing
        a second one. When that call yields no date, fall back to the author date of the
        first commit that added the feature directory
        (git -C <root> log --diff-filter=A --format=%aI -1 -- <feature dir>), else None.
        It reads no approval date out of plan.yaml.
        count(project_root, feature_id) returns a PAIR (value, reason) and is the whole of D-21.
        Four branches, in this order, and a zero is reachable through the last one only:
          1. instrumentation_epoch is None -> (None, "touchpoints were not tracked in this project -
             no .harness/metrics/instrumented_at epoch exists, so no count here is a measurement").
          2. feature_start is None -> (None, "touchpoints cannot be dated for this feature - it has
             neither an approval date in its BRIEF.md nor a commit that added its directory, so
             pre-instrumentation and post-instrumentation cannot be told apart").
          3. feature_start's UTC CALENDAR DAY is strictly BEFORE the epoch's UTC calendar day ->
             (None, "this feature predates touchpoint instrumentation in this project - touchpoints
             were never tracked for it"). This comparison is at DAY granularity, stated once here and
             once in D-21 and nowhere else: reduce both sides to their UTC date and compare the dates,
             so a feature whose start falls on the SAME calendar day the epoch was written is
             post-instrumentation and reaches branch 4. Comparing instants instead would read a
             date-only approval date as 00:00:00Z and report null for a feature that is genuinely
             tracked; that general 00:00:00Z reading (T-06) still holds everywhere else - this
             predicate is its one scoped exception, not a contradiction of it.
          4. otherwise POST-INSTRUMENTATION -> (the number of lines in that feature's
             touchpoints.jsonl, None), and 0 for an absent file, which here IS a measured zero -
             a tracked run in which no blocking touchpoint happened.
        Each reason above is a D-19 specific sentence and goes in the unavailable map verbatim;
        "no data" is not one of them. Measured 2026-09-02 in this repository, all 58 existing feature
        directories predate this capability and 43 of them carry a signed BRIEF approval date, so
        branch 3 is the common case at launch and an unscoped branch 4 would fabricate the whole
        launch-day autonomy tile.
