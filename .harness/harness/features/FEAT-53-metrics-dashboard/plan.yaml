      than restating it. Four private implementations disagreeing at an edge - calendar days
      versus 24 hours, inclusive versus exclusive - would count a feature inside the 90d window
      for throughput and outside it for attribution, a silent cross-KPI inconsistency no
      fixture-local test would catch.
      Build fixture project-a under dashboard/fixtures/ - its own .harness/ tree with feature
      directories whose ids do not exist in this repository: one carrying a signed, parseable approval
      date and a ship record, one with no ship record, and FOUR gap features, one per gap state of
