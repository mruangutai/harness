          collide, which is already true of workspace_root — as accepted, not fixed
        - the three board keys ruled per key: number required because nothing else identifies a
          board; owner required rather than derived from the repo owner, because deriving it for
          one repository and reading it for another is two rules for one field; station_field
          required and validated, because DEC-192 prescribes the six station values but not the
          field name holding them, and a pinned field name is a string that otherwise goes stale
          in silence.
          STATE PLAINLY THAT ALL THREE ARE ALREADY ENFORCED FOR A PRODUCT BOARD and that this
          entry records why, rather than adding enforcement. Verify it before writing it:
          factory_config._validate_board raises FleetError on a missing or empty owner, on a
