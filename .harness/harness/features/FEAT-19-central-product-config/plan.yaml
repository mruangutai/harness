tasks:
  - id: T-01
    title: Add factory_product_config.py, its unit tests, and register the test file in the suite arrays
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05]
    change_type: cross_module
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02]
    status: abandoned
    files:
      - .claude/skills/harness/bin/factory_product_config.py
      - .claude/skills/harness/bin/test-factory-product-config.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      grep -q test-factory-product-config.py .claude/skills/harness/bin/run-unit-tests.sh \
        && .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Create .claude/skills/harness/bin/factory_product_config.py, the ONLY resolver of which
      config file answers for a given session root. Every future consumer takes its config from
      this module and never from a hand-joined path.

      THE MODULE NAME IS LOAD-BEARING. test-factory-config.py enumerates only files matching
      factory_*.py when it asserts that exactly one scope anywhere in the tree opens or parses the
      fleet file. A module named product_config.py would sit outside that enumeration permanently.
      Named factory_product_config.py, it is inside it — which means: NEVER call open() or
      harness_yaml.load_file() on a fleet-bearing path in this module. Read the fleet ONLY by
      calling factory_config.load_fleet(). That invariant now watches this file, and a bypass will
      redden test-factory-config.py rather than pass unseen.

      PUBLIC SURFACE, exactly three names.

      class ProductConfigError(Exception) — constructed the way factory_config.FleetError is, via
      factory_cli.body(what, value, next_step), so factory_cli.run prints it verbatim. Two slot
      rules, both binding, from this feature's DESIGN.md:
        - value is ALWAYS a path or a repository name the operator can act on, never a class name
          and never merely where the operator was standing when a path was already computed.
        - next_step is ALWAYS the operator's NEXT ACTION, never the cause. Naming two roots is
          context; telling the operator to run from inside one of them is an action.
      Every refusal exits 2 with empty stdout via factory_cli.run, so on a refusal the value slot
      is the ONLY place the operator learns which config file was at issue.

      def resolve(session_root) -> dict — returns a mapping with exactly these keys:
        product: the fleet name (owner/repo) when a product answered, otherwise None
        config_path: the absolute path of the file that answered
        config: the parsed JSON mapping from that file
        source: the string "harness" or the string "product"
      Never returns a partial mapping and never returns None. product is None if and only if
      source is "harness" — the two encode one fact twice, so a test asserts they agree.

      def main() — an argparse CLI exposing --which-config <path>. NOT --resolve: check-domain.sh
      --resolve already answers a different question (which agent owns a path) in a different
      shape (plain text, including the literal NOBODY), and a homonym on an adjacent tool is what
      D-07 rules out. The path argument accepts a RELATIVE path and is resolved the way every
      other path in this module is, os.path.realpath(os.path.abspath(p)), so that
      --which-config . works from inside the checkout under test.
      On success print exactly one stdout line via factory_cli.payload: a JSON object with
      exactly the three keys source, config_path and product, and no others. product is JSON null
      when harness answered — the key is present and null, never omitted, because an absent key is
      indistinguishable from a tool that forgot to set it. The parsed config body is NOT printed:
      the question is which file answered, and a matrix dump buries the answer.
      Wire it with factory_cli.run("product-config", main, expected=(ProductConfigError,)).

      THE RESOLUTION ALGORITHM, in this order and no other. The ORDER is the specification: an
      earlier draft evaluated the fleet before the harness-root test, which returned the harness
      config to a session standing outside both roots whenever fleet.yaml happened to be absent.

      1. Compute the harness root exactly as factory_config.harness_root() does. Do not
         reimplement it — import factory_config and call it, so the two can never disagree about
         which checkout is the control plane.
      2. Take the real (absolute AND symlink-resolved, via os.path.realpath(os.path.abspath(p)))
         form of session_root and of the harness root. Containment is compared on path SEGMENTS,
         never on string prefixes — use os.path.commonpath([child, parent]) == parent, catching
         ValueError (different drives or unrelated roots) as False, which is what
         harness_boundary.select_base does.
      3. IF session_root is inside the harness root -> go straight to step 6. This test runs
         FIRST and needs no fleet at all. A harness session resolves the harness config whether or
         not a fleet declaration exists.
      4. session_root is NOT inside the harness root, so the answer can only come from a product,
         which means the fleet must load. Build the path explicitly:
         fleet_path = os.path.join(harness_root, ".harness", "factory", "fleet.yaml").
         4a. NEVER call factory_config.load_fleet() with no argument. Its default is
             factory_config.FLEET_PATH, a module-level constant computed at IMPORT time from that
             module's OWN root probe — not from the root this function just computed. Under a
             fixture root the two disagree and the default names the LIVE repository, so a fixture
             test would read the real fleet.yaml and pass for the wrong reason.
             harness_boundary.resolve_fleet documents this exact trap and passes the path
             explicitly for the same reason. Call factory_config.load_fleet(fleet_path).
         4b. Test ABSENCE separately from FAILURE, with os.path.exists(fleet_path), BEFORE
             calling load_fleet. load_fleet raises the same error type for an absent file and a
             malformed one, so a try/except around it cannot tell them apart, and a bare
             except that fell through to the harness config would convert an unreadable fleet
             into a silent fallback.
             If the fleet is ABSENT: raise ProductConfigError. There are no products and this
             session is not in the harness checkout, so nothing can answer. what is "no fleet
             declaration and the session is not in the harness checkout", value is the session
             root, next_step tells the operator to run from inside <harness root> or to declare a
             fleet at <fleet_path>.
             If the fleet is present but load_fleet raises ANYTHING: raise ProductConfigError.
             what is "the fleet declaration does not load", value is fleet_path, next_step tells
             the operator to fix that file. Chain the original error's text into the message so
             the reason is not swallowed. An unloadable fleet CLOSES rather than degrades: the
             value that identifies product paths is the one that failed.
      5. Realpath fleet["workspace_root"] and branch on segment containment:
         5a. session_root is NOT inside workspace_root: raise ProductConfigError. what is "session
             root is in neither the harness checkout nor the factory workspace", value is the
             session root, next_step is an ACTION parameterized by both roots — tell the operator
             to run from inside <harness root>, or from a registered checkout under
             <workspace_root>. Both roots appear, as the instruction rather than as an
             observation. DO NOT fall through to step 6: returning the harness config for a
             session that is not in the harness checkout is a fall-back to another repository's
             config, which is the exact failure this module exists to prevent.
         5b. session_root IS inside workspace_root. Compute every registered base as
             os.path.realpath(factory_config.workspace_path(fleet, entry["name"])) and keep the
             entries whose base contains session_root by segment containment.
             LONGEST MATCH WINS: when more than one base contains the session root, take the one
             with the longest base path, so a product checked out beneath another's path resolves
             against its own base rather than its parent's. This is a DELIBERATE COPY of
             harness_boundary.select_base's rule, not an import (D-08); the copy is recorded as an
             accepted divergence in T-05, and the test file below — not this module — imports
             select_base read-only to assert the two agree on the nested fixture. Stating it explicitly is what stops the guard and the
             config from disagreeing about a nested checkout, which is the merit D-02 was chosen
             for. Segment containment also makes /ws/kaya-ai-old not match /ws/kaya-ai.
             5b-i. NO entry contains it: raise ProductConfigError. what is "checkout belongs to no
                   registered repository", value is the session root, next_step says to add a
                   repos entry to <fleet_path>. This is the state that already exits 2 today and
                   it must keep doing so.
             5b-ii. An entry wins. The config path is
                   <harness root>/.harness/products/<segment>/harness.json, where <segment> is
                   os.path.basename(factory_config.workspace_path(fleet, entry["name"])) — reuse
                   that function's own rule so the derivation exists in one place only.
                   If that file does not exist: raise ProductConfigError. what is "registered
                   repository has no product config", value is THE CONFIG PATH THAT WAS LOOKED
                   FOR — not the session root; an operator told only where they were standing has
                   to re-derive a path the tool already computed — and next_step says to create
                   it. DO NOT fall back to the harness config. This fallback is the single worst
                   outcome this module can produce and its absence is the point of the module.
                   If the file exists but is not valid JSON, or does not parse to a mapping: raise
                   ProductConfigError. value is the file path, next_step says to repair the file
                   to a JSON object.
                   Otherwise return product=entry["name"], config_path, config, source="product".
      6. The harness's own config: <harness root>/.harness/harness.json. Missing, unparseable or
         not a mapping raises ProductConfigError with value the file path and next_step the
         repair. Otherwise return product=None, config_path, config, source="harness".

      A product config directory that has no matching fleet entry is unreachable by construction —
      step 5b keys on the fleet entry and never lists the products directory. Do not add a
      directory scan; the unreachability IS the requirement.

      Read JSON with json.load and YAML only through factory_config, which uses harness_yaml. No
      line scanning anywhere (DEC-171).

      Then create .claude/skills/harness/bin/test-factory-product-config.py, a stdlib-unittest
      file in the same shape as test-factory-config.py, building fixture trees under
      tempfile.TemporaryDirectory.

      HOW A FIXTURE BECOMES THE HARNESS ROOT, since resolve() takes only a session root and gets
      the harness root from factory_config.harness_root(): that function returns
      os.environ["CLAUDE_PROJECT_DIR"] when that directory holds a readable docs/harness/SPEC.md,
      and otherwise derives the root from its own file location. So each fixture root must contain
      docs/harness/SPEC.md, and each test sets CLAUDE_PROJECT_DIR to that fixture root and
      restores the previous value in a finally block — the same save-set-restore shape
      test-factory-config.py already uses for this variable. Do NOT add a root= parameter to
      resolve(); the public surface is fixed at three names and a second way to name the control
      plane is exactly the disagreement D-02 exists to prevent.
      No test may depend on this repository's own fleet.yaml.
      Cases, one test method each, and each raising case asserts on the raised message text as
      well as the type:
        - session root IS the harness root, fleet absent -> source harness
        - session root IS the harness root, fleet present -> source harness
        - session root IS the harness root and the harness's own .harness/harness.json is MISSING
          -> ProductConfigError whose message names the harness CONFIG path
          (<fixture root>/.harness/harness.json), and assert it is that config path and NOT the
          session root. The fixture root still carries docs/harness/SPEC.md, which is what
          factory_config.harness_root() keys on, so step 3 is reached and step 6 is the raiser.
          Nothing else forces this branch: without this case a resolver that returned an empty
          mapping here would pass the whole suite
        - same fixture, harness.json PRESENT but malformed JSON, and a third case where it parses
          to a LIST rather than a mapping -> ProductConfigError naming that same config path in
          both. Missing and unreadable are separate code paths (existence versus parse), so one
          case leaves the other unasserted
        - session root inside workspace_root under a registered repo WITH a product config ->
          source product, and the returned config is the product file's content, asserted by a
          sentinel key that exists ONLY in the product file
        - same, and assert the returned config is NOT the harness config, by asserting the harness
          file's own sentinel key is absent
        - FIXTURE INDEPENDENCE: a fixture fleet declaring a repository name that appears in NO
          entry of this repository's live .harness/factory/fleet.yaml, resolving to that fixture's
          own product config. This case fails outright if the module ever reads FLEET_PATH instead
          of the explicit path, which is the failure mode that would otherwise make every case
          above pass for the wrong reason
        - registered repo, product config MISSING -> ProductConfigError whose message names the
          missing CONFIG path, and assert it is the config path and not the session root
        - checkout under workspace_root registered nowhere -> ProductConfigError
        - a products directory present for a name that is NOT in fleet.yaml, session rooted in a
          sibling registered checkout -> the orphan is never returned
        - workspace_root sibling whose name shares a prefix with a registered repo
          (kaya-ai-old beside kaya-ai) -> ProductConfigError, not a false match
        - NESTED CHECKOUTS: two registered repos whose workspace paths nest, the session rooted in
          the inner one -> the INNER repo's config answers, not the outer's. This is the
          longest-match-wins rule and it is the one D-02's merit rests on
        - product config present but malformed JSON -> ProductConfigError naming the file
        - session root outside BOTH the harness root and workspace_root, fleet PRESENT ->
          ProductConfigError, never source harness. Assert the message names both roots
        - session root outside the harness root and fleet ABSENT -> ProductConfigError, never
          source harness. This is the case an earlier draft answered "harness" for, and without
          it the outside-both criterion passes over the hole
        - fleet present but MALFORMED (unparseable YAML, or a repos entry missing its board) ->
          ProductConfigError naming the fleet path, never a fall-through to the harness config
        - resolve's own consistency: across the harness-source and product-source cases, assert
          product is None if and only if source == "harness"
        - the LIVE kaya config in this repository, located as
          os.path.join(factory_config.harness_root(), ".harness", "products", "kaya-ai",
          "harness.json") — NOT a path relative to the process working directory, which is correct
          only under run-unit-tests.sh and wrong under a direct invocation. Assert: every value in
          that file's test_kinds is a MAPPING (a string sibling would break every consumer that
          iterates the object); every kind named in any change type's always list exists in that
          file's own test_kinds; every when clause names either an existing kind or a predicate
          placeholder beginning with a double underscore; and bugfix.always does not contain
          __bug_class__. This is the permanent proof of the matrix-closure criterion; the same
          assertions exist as a one-shot command on T-02 and that command dies with the task, so
          this case is what survives to be cited
        - GUARD AGREEMENT, nested fixture only: import harness_boundary and assert that
          harness_boundary.select_base picks the SAME base, for the same session root, as the
          resolver's own longest-match step on the NESTED-checkout fixture above. Every input is
          an argument, so the fixture drives it with no monkeypatching:
          select_base(abs_target, root, workspace_root, workspace_bases, fleet_path, label) — pass
          the realpath'd session root as abs_target (containment is the same test for a target as
          for a session root), the FIXTURE's harness root as root, the fixture's workspace_root and
          its realpath'd registered bases, and the fixture fleet path. It returns a 3-TUPLE; the
          base is element 0, and that is what the assertion compares. The import is
          READ-ONLY and lives in the test file alone — factory_product_config.py itself still must
          NOT import it (D-08 stands: the rule is copied, not shared). Scope this to the nested
          case and to no other: select_base calls sys.exit(2) on the unregistered-checkout branch,
          so pointing it at the registered-nowhere fixture aborts the test process rather than
          failing a case. This case deliberately couples the resolver's tests to select_base's
          signature — that coupling is the point, because it is what turns a future divergence
          between the two containment implementations into a reddening test instead of a silent
          drift
        - CLI SURFACE, four cases against main() rather than resolve(), because SC-12 is uat and
          ships not_met, so without these the CLI has no build-time proof at all:
            - a success invocation returns exactly three top-level keys in its one JSON line and no
              others: product, config_path, source. Assert the key SET, not just presence, so an
              extra key is a failure — T-07's rewired qa gate reads config_path out of this payload
            - on the harness branch the payload's product is JSON null, present as a key rather
              than omitted
            - --which-config with a RELATIVE path (".") invoked with the process working directory
              set to the fixture root resolves the same as the absolute path does. DESIGN Contract
              5 accepts a relative path and nothing else asserts it
            - one refusal branch (a checkout registered nowhere) exits 2 with EMPTY stdout, the
              diagnostic going to stderr, per factory_cli.run's contract

      Finally register the new file in .claude/skills/harness/bin/run-unit-tests.sh by appending
      "test-factory-product-config.py" to the UNIT_SCRIPTS array. The runner's drift detector runs
      over the union of both arrays and fails the WHOLE run on an unregistered test file, so this
      registration belongs in this task and not a later one.

  - id: T-02
    title: Write the central config for mruangutai/kaya-ai
    traces: [REQ-01, REQ-05]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for .harness/products/** at 63b83c7 (DEC-179)
    depends_on: []
    status: abandoned
    files:
      - .harness/products/kaya-ai/harness.json
    verify: |
      python3 - <<'PY'
      import json, sys
      d = json.load(open(".harness/products/kaya-ai/harness.json"))
      kinds = set(d["test_kinds"])
      bad = []
      for ct, spec in d["test_matrix"].items():
          for k in spec.get("always", []):
              if k not in kinds:
                  bad.append(ct + ".always names " + k)
          for w in spec.get("when", []):
              if w["kind"] not in kinds and not w["kind"].startswith("__"):
                  bad.append(ct + ".when names " + w["kind"])
      if "github" not in d or d["github"].get("repo") != "mruangutai/kaya-ai":
          bad.append("github.repo is not mruangutai/kaya-ai")
      for name, spec in d["test_kinds"].items():
          if name.startswith("_"):
              bad.append("test_kinds carries a note key " + name + "; notes go at top level")
              continue
          if not isinstance(spec, dict):
              bad.append(name + " is not a mapping")
          elif spec.get("status") != "unresolved":
              bad.append(name + " status is " + repr(spec.get("status"))
                         + ", must be unresolved (D-03 option A, DEC-187)")
      if "_test_kinds_note" not in d:
          bad.append("no top-level _test_kinds_note")
      print("\n".join(bad) if bad else "OK")
      sys.exit(1 if bad else 0)
      PY
    intent: |
      Create .harness/products/kaya-ai/harness.json — the central config for the repository
      registered in .harness/factory/fleet.yaml as mruangutai/kaya-ai. The directory name kaya-ai
      is the segment after the slash, matching factory_config.workspace_path.

      This is a REAL config, not a fixture. Start from
      .claude/skills/harness/templates/examples/harness.kaya-ai.json — copy its test_kinds and
      test_matrix — then make exactly the changes below. Do not copy its _comment key.

      CHANGE 1, mandatory under every option of D-03. The example's bugfix.always is
      ["__bug_class__"]. __bug_class__ is a predicate placeholder that exists in no test_kinds, so
      kaya's bugfix change type can never resolve — DEC-187 names this file and this defect by
      name. Write bugfix as always ["unit"] with a when clause of kind __bug_class__ and if
      match_bug_class, which is the shape .harness/harness.json already uses for the same
      predicate.

      CHANGE 2, D-03 option A. Add a "status" key to every entry in test_kinds with the value
      "unresolved". Nobody has run kaya's commands from this repository and this effort does not
      clone kaya, so "active" would be a claim that a cmd was run and seen pass when it was not.
      Add a note key "_test_kinds_note" at the TOP LEVEL of the file, a sibling of test_kinds and
      NOT a key inside it — the same placement .harness/harness.json already uses for its own
      note. Every consumer that iterates test_kinds expects each value to be a mapping, and a
      string sibling inside that object hands each of them a value they cannot read. One
      sentence: the statuses are unresolved because no kind's cmd has been run from the control
      plane, and DEC-187 closure is resolved at the first factory run against this repository.
      test_kinds itself must contain NO key beginning with an underscore.

      CHANGE 3. Add a "github" block with EXACTLY two keys, because project and repo data belongs
      with the product:
        sync: true
        repo: "mruangutai/kaya-ai"

      DO NOT add a board block here. Kaya's board is already declared in .harness/factory/fleet.yaml
      under its repos entry, where FEAT-16 put it and where factory_config._validate_board already
      requires owner, number and station_field. Copying it into this file would put one board in two
      files with nothing checking that they agree — which is the precise defect this whole feature
      exists to remove, reintroduced in the file that removes it. A product's board lives in
      fleet.yaml and nowhere else.

      CHANGE 4. Carry schema_version and cli_min_version across from the example unchanged.

      DO NOT add budgets, gates, log_retention_days or team-config data. Those are harness runtime
      metadata and stay in .harness/harness.json (D-01). The example's "gates" key is NOT copied.

      Do not modify .claude/skills/harness/templates/examples/harness.kaya-ai.json. It stays as the
      template example it is; this new file is the live config.

  - id: T-03
    title: Rewrite harness-init's skill for the central model
    traces: [REQ-06]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for .claude/skills/harness-init/SKILL.md at 63b83c7 (DEC-179)
    depends_on: []
    status: abandoned
    files:
      - .claude/skills/harness-init/SKILL.md
    verify: |
      python3 - <<'PY'
      import re, subprocess, sys
      P = ".claude/skills/harness-init/SKILL.md"
      cur = open(P).read()
      old = subprocess.run(["git", "show", "63b83c7:" + P], capture_output=True, text=True).stdout
      def steps(t):
          out, k, buf = [], None, []
          for ln in t.splitlines():
              if re.match(r"^#{2,3} ", ln):
                  if k is not None: out.append((k, "\n".join(buf)))
                  m = re.match(r"^### \d+\. (.*)$", ln)
