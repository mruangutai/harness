        - the containment rule is COPIED, not shared, and that is an accepted divergence: the
          resolver states longest-match-wins itself rather than importing
          harness_boundary.select_base's containment, because sharing would change a file both
          write guards import and that DEC-193 names as the one shared rule. Record what a future
          change must do: a change to the guard's containment rule has to be mirrored in the
          resolver by hand. Record the mitigation too, and do not overstate it:
          test-factory-product-config.py imports select_base read-only and asserts the two
          implementations agree on the NESTED-checkout fixture, so a divergence on that shape
          reddens the unit suite. It is one fixture, not a proof of general agreement, and the
          mirroring is still a hand edit
        - the inherited platform behaviour, so it is not rediscovered as a defect: containment is
          commonpath over realpath'd paths, which compares case-sensitively while APFS is
          case-insensitive by default, so a session root spelled with different case refuses
