        - the resolution rule as one paragraph, and the rejected alternatives with the reason each
          was declined, so a future scan does not re-propose them: a marker file in the product
          checkout (repos carry almost nothing of the harness), an env override (an override that
          can silently point a session at the wrong product's matrix), and a second key on the
          fleet entry (two things that could disagree with the guard about which product a path
          belongs to)
        - the no-fallback rule, stated as the load-bearing half: a registered repository with no
          product config raises, and never returns the harness config. A silent fallback to the
          control plane's own test matrix is the worst outcome the mechanism can produce
        - the per-directory naming rule and its measured reason: the segment after the slash,
          because glob_to_re translates a single star to a character class that cannot cross a path
          segment, so a two-segment product path would force every future domain glob over it to
