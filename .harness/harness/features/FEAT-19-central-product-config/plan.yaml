      The body must carry, and nothing else:
        - the rule, in the operator's own terms: harness.json holds harness runtime metadata, while
          project, repo and GitHub data belongs with the product
        - the named exception and why it exists: mruangutai/harness is deliberately absent from
          fleet.yaml because the absence is what makes a workspace checkout of harness exit 2
