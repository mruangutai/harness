decisions:
  - id: D-01
    choice: ship writes the done station on every recorded card and issues no close of its own; GitHub's Auto-close issue workflow closes the issue behind it
    because: reversing the direction makes the station the single authority on open, which is the whole point of the change
    dec: none
  - id: D-02
    choice: a card's children are read back from the GitHub sub_issues endpoint per card, never derived from the harness's own recorded issue map
    because: origin no longer gates the close, so the child check must see children the harness never created or the safety valve it replaces is toothless
    dec: none
  - id: D-03
    choice: a child counts as OPEN when its card is not at the done station, and a child that is not on the board at all also counts as open
    because: an unstationed child is unknown rather than finished, and the conservative reading is the one that cannot close someone else's live work
    dec: none
  - id: D-04
    choice: ship writes every child card before it evaluates any parent, in one pass over children then one pass over parents
    because: FEAT-34's parent 728 has 13 children whose cards read Review, so a single-pass order would skip it and the acceptance test would fail for the wrong reason
    dec: none
  - id: D-05
    choice: the terminal done write keeps DEC-146's best-effort per-card posture and exit 0, and ship prints two distinct summary literals - gh-sync HELD for a designed skip and gh-sync FAILED for a write that failed - of which post-merge-sweep.sh reads FAILED as a reason to decline the worktree removal
    because: no transaction spans N project_field_set calls and git ignores a post-merge hook's exit status, so the reader must change rather than the writer; the sweep already treats a literal's absence as its positive evidence and never the exit code, and a standing worktree is the evidence a human trips over
    dec: DEC-146
  - id: D-06
    choice: the Bash gate refuses every gh issue close unconditionally, with no environment marker
    because: a PreToolUse hook is handed only tool_input.command and gh-sync.py reaches gh through subprocess, so abandon's close never traverses the tool and needs no exemption; this reaches the OUTCOME issue 842 constraint 5 mandates by a simpler route than the mechanism that constraint names, and no marker exists for anyone to forge - the operator amended constraint 5 to this effect on 2026-08-25
    dec: none
  - id: D-07
    choice: the new entry restates DEC-192's one-status-field rule and DEC-186's read-back bound, widened to six purposes, rather than only the close rule
    because: striking DEC-192 without restating it would delete the status contract the whole board depends on
    dec: none
  - id: D-08
    choice: github.parent_origin is removed from feature-schema.json and stripped from all 24 feature.json files carrying it, in one task
    because: the github block is additionalProperties false, so removing the property from the schema alone invalidates every existing feature
    dec: DEC-191
  - id: D-09
    choice: factory_decompose.py's own factory block parent_origin is left in place
    because: it is a different ledger for served repos and no close branches on it; conflating the two would widen this change into the fleet control plane
    dec: none
  - id: D-10
    choice: the open-child test applies to source_issues and the parent only; a task sub-issue's card is written to done with no child check of its own
    because: cmd_open is the only writer of the recorded issue map and creates each task issue flat, attaching it to the parent and never to another task issue, so the recursion has depth 1 by construction; checking each would add one sub_issues read per task sub-issue - thirteen on FEAT-34's acceptance run - to prove a set that is empty by construction
    dec: none
  - id: D-11
    choice: an incomplete terminal batch emits the new literal gh-sync FAILED, never gh-sync SKIP, and post-merge-sweep.sh gains FAILED as a second condition of its existing positive-signal gate
    because: reusing SKIP would preserve the standing worktree but overload a token the module reserves for an environmental no-go where nothing was written, so a partial write would report as no write at all; a second literal preserves the same worktree evidence while keeping the prefix taxonomy one meaning per token
    dec: none

tasks:
  - id: T-01
    title: Re-measure that moving a card to the done station closes its issue
    traces: [REQ-01, REQ-02]
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: a live write to the operator's own board, creating and closing a throwaway issue; no member's domain grants a live board write and the deliverable is a measurement, not code
    depends_on: []
    status: pending
    files:
      - .harness/harness/features/FEAT-40-harness-writes-done/notes/probe-done-closes.md
    verify: |
      out=$(python3 .claude/skills/harness/bin/board_lifecycle.py audit --repo mruangutai/harness 2>&1); rc=$?
      test $rc -ne 4
      test -n "$out"
      ! printf '%s' "$out" | grep -q "WORKFLOW: 'Auto-close issue'"
      grep -Eq '^probe_issue: #[0-9]+ moved_to_done_at=[^ ]+ closed_at=[^ ]+$' .harness/harness/features/FEAT-40-harness-writes-done/notes/probe-done-closes.md
    intent: |
      The entire feature rests on one direction that was last measured in probe #807 and was NOT
      re-verified during the 2026-08-25 grilling: that moving a card to the Done station causes
      GitHub to close the issue. Every close path in the harness is deleted by later tasks and a
      Bash gate removes the manual fallback, so if this direction does not hold, tickets stop
      closing and nothing reports it. Measure it before anything else changes.

      Do this:

      1. Run: python3 .claude/skills/harness/bin/board_lifecycle.py audit --repo mruangutai/harness
         Record whether it emits a WORKFLOW finding naming 'Auto-close issue'. A MISSING or
         disabled workflow is a hard stop: report it and do not proceed to step 2, because only a
         click in the project web UI can enable it.
      2. Create a throwaway issue in mruangutai/harness titled
         "FEAT-40 probe: does a Done station write close the issue" with the label harness and a
         one-line body saying it is a throwaway probe for FEAT-40.
      3. Add it to the harness board and set its Status field to the value of
         .harness/harness.json github.board.stations.done, using
         python3 .claude/skills/harness/bin/board-station.py, not the web UI. Record the UTC
         timestamp of that write.
      4. Poll the issue's state with gh issue view for up to 60 seconds. Record the UTC timestamp
         at which it first reads CLOSED, or record that it did not close.
      5. Write the note at the path in files:. It must contain, as its first content line, exactly
         one line of the form:
           probe_issue: #<number> moved_to_done_at=<iso8601> closed_at=<iso8601>
         If the issue did not close, write closed_at=NEVER and stop the feature here: report
         BLOCKED to the operator, because the whole design has no close path.
      6. Below that line, record the audit output for the three named workflows verbatim, and one
         paragraph naming what was measured, on which board number, and by which command.
      7. Leave the throwaway issue closed. Do not delete it; it is the evidence.

      Do not re-derive anything already recorded in
      .harness/notes/grilling-board-done-and-parent-close-2026-08-25.md. This task measures exactly
      one thing that note explicitly flags as unverified.

      WHY THE VERIFY CAPTURES BEFORE IT GREPS, and do not simplify it back: cmd_audit exits 4 on a
      factory_gh.GhError — network down, unauthenticated, project unresolvable
      (board_lifecycle.py:906-914). A pipe into grep takes grep's status, so on exit 4 the string
      is absent, grep exits 1, and the clause passes while nothing was measured. That clause
      authorises every later deletion in this feature, so it asserts the run completed (rc != 4,
      output non-empty) before it asserts the string is absent. Do not demand exit 0: audit exits 1
      on any finding of any class.

  - id: T-02
    title: Install core.hooksPath on this clone and prove the post-merge sweep fires at a real merge
    traces: [REQ-02, REQ-09]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: a git config on the operator's own clone plus a scratch clone and a real merge; no agent domain covers machine-local git configuration and no file in the repository changes
    depends_on: []
    status: pending
    files:
      - .harness/harness/features/FEAT-40-harness-writes-done/notes/probe-sweep-fires.md
    verify: |
      test "$(git -C /Users/molchairuangutai/GitHub/harness config --get core.hooksPath)" = ".claude/skills/harness/hooks"
      grep -Eq '^sweep_fired: yes scratch_clone=[^ ]+ merge_commit=[0-9a-f]{7,40}$' .harness/harness/features/FEAT-40-harness-writes-done/notes/probe-sweep-fires.md
    intent: |
      ship becomes the only thing that closes tickets and the post-merge sweep is the only thing
      that runs ship. Measured at cc84b29, that sweep has never fired on this clone: core.hooksPath
      reads /Users/molchairuangutai/GitHub/harness/.git/hooks, which holds only samples.

      Two parts, both required.

      PART A, install it. In the OWNER clone /Users/molchairuangutai/GitHub/harness, not in this
      worktree, follow the three steps in .claude/skills/harness-init/SKILL.md exactly:
        1. git -C /Users/molchairuangutai/GitHub/harness config --get core.hooksPath
           Record the value you found.
        2. It currently reads an absolute path ending in .git/hooks. That directory holds only
           git's own .sample files, so nothing the operator wrote is being bypassed. Confirm that
           by listing it and recording the listing. If it holds any executable non-sample hook,
           STOP and ask the operator before writing, per step 3 of that skill.
        3. git -C /Users/molchairuangutai/GitHub/harness config core.hooksPath .claude/skills/harness/hooks
           The value is RELATIVE, deliberately: an absolute one is what produced the broken value.
           Re-read it and confirm it prints .claude/skills/harness/hooks.

      PART B, prove a real merge fires it. A configuration value is not proof of execution.
      Do NOT test this by merging anything in the owner clone or in any feature worktree.
        1. git clone --no-hardlinks /Users/molchairuangutai/GitHub/harness <scratch>, into the
           session scratchpad directory.
        2. In the scratch clone: git config core.hooksPath .claude/skills/harness/hooks
        3. Create a branch, add one trivial file, commit, return to the default branch, and
           git merge --no-ff that branch. A merge that creates a commit is what fires post-merge;
           an "Already up to date" merge fires nothing, so assert a merge commit was created.
        4. Capture the merge's combined stdout and stderr. The post-merge shim execs
           post-merge-sweep.sh, which prints its own lines prefixed post-merge-sweep:. Assert at
           least one such line is present. If instead you see the shim's
           "post-merge: ... is missing or not executable" line, that is also proof the hook
           resolved; record which of the two you saw.
        5. Delete the scratch clone.

      Write the note at the path in files:. Its first content line must be exactly one line of the
      form:
        sweep_fired: yes scratch_clone=<abs path used> merge_commit=<sha>
      followed by the captured hook output verbatim, the before and after values of
      core.hooksPath in the owner clone, and the listing of the old hooks directory.
      If the hook did not run, write sweep_fired: no and report BLOCKED.

  - id: T-03
    title: Write the replacement decision, strike DEC-186, DEC-192 and DEC-196, and strike DEC-138 amendment 7's parent table
    traces: [REQ-01, REQ-04, REQ-08]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: the entry is the operator's own ruling on a permanent record, and the operator settled its prose register personally on 2026-08-25; harness-documentor is granted the path but the wording of a signed decision stays with the tier that owns it
    depends_on: []
    status: pending
    files:
      - .harness/harness/docs/DECISIONS.md
      - .harness/harness/docs/DECISIONS-INDEX.md
    verify: |
      python3 .claude/skills/harness/bin/gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md
      python3 .claude/skills/harness/bin/test-gen-decisions-index.py
    intent: |
      THE PROSE REGISTER IS SETTLED (operator, 2026-08-25): DEC-203 is SHORTER AND PLAINER than the
      three entries it replaces. Cut the length and the density together, not the word count alone.
      The finished entry must be materially shorter than DEC-186, DEC-192 and DEC-196 taken
      together, and written in ordinary words - short sentences, plain nouns, no stacked
      subordinate clauses. Nothing essential in the nine items below is dropped; the dense,
      clause-heavy register of the current entries is the thing being removed. Before writing,
      count the words of the three entries you are replacing; check the finished DEC-203 comes in
      materially under that total.

      Append ONE new entry, DEC-203, at the end of DECISIONS.md. It replaces DEC-186, DEC-192 and
      DEC-196, which are struck under DEC-188 in the same act. It must state all of the following,
      because striking three entries and restating only one of their rules would delete two live
      contracts:

      1. THE OPEN RULE. A tracked ticket is open while its card is not at the done station. The
         station is the authority; the issue's own open or closed field is a consequence, not the
         record.
      2. WHO WRITES DONE. The harness writes it, at gh-sync.py ship. GitHub's Auto-close issue
         workflow then closes the issue. This reverses DEC-196's "the harness writes this column
         never" and DEC-138 amendment 7's station table row for Done.
      3. WHICH CARDS SHIP MOVES. Every card the feature records: each task sub-issue, each entry of
         source_issues, and the parent.
      4. THE PARENT RULE. A card is not moved to done while its ticket has an open child. Origin
         stops mattering entirely: who created a ticket is no longer part of the decision. Say
         plainly that this replaces DEC-196's created-versus-adopted gate and DEC-138 amendment 7's
         ship and abandon parent table, and say why the child check is the better guard: it
         protects someone else's live epic for a reason that is true of the ticket rather than true
         of its history.
      5. THE READ-BACK BOUND, carried forward from DEC-186 and widened by exactly one. The purposes
         are now SIX: whether an item is claimed; which station it is at; whether a blocker issue is
         finished; which of a board's native workflows are enabled, bounded to /harness-init;
         which merged pull request a recorded branch resolves to, bounded to record-pr and ship;
         and, new, which children a card's ticket has, bounded to gh-sync.py ship. State that a
         read-back value still never enters BRIEF.md, plan.yaml or any approval block. Restate
         DEC-186 amendment 1's one-board-per-repository framing.
      6. THE STATUS FIELD, carried forward from DEC-192 unchanged in substance: one lifecycle field
         named status, six case-sensitive values that are the board's own column names, Backlog,
         Plan, Ready, Building, Review, Done. No alias, no translation table, and blocked stays
         deliberately absent. Carry forward the two named collapses and their costs.
      7. WHAT DEC-168 KEEPS AND LOSES. DEC-168's three measured probe results stand: closure does
         not cascade in either direction. Its operational conclusion, that the parent is closed
         deliberately at ship acceptance by a close, is superseded by this entry.
      8. THE GUARDRAIL. A PreToolUse Bash gate refuses a hand-typed gh issue close and names the
         sanctioned command.
      9. THE ACCEPTED COST, stated as cost: the harness now depends on a board automation only a
         click in the project web UI can enable, and board_lifecycle.py audit's WORKFLOW finding
         class is the only reader of that dependency.

      Then, in the same edit:

      - Add a strike record to DEC-186, DEC-192 and DEC-196 in the form DEC-188 already uses in
        this file (see DEC-90, DEC-103 and DEC-104 for the shape). A struck entry keeps its body
        so citations still resolve; the strike record names DEC-203 as what replaces it.
      - Add DEC-138 amendment 8, striking amendment 7's ship-and-abandon parent table and its
        surrounding origin prose, and striking amendment 7's D-23 reasoning that a closed
        sub-issue cannot sit at Review. Record the measurement that falsifies it: FEAT-34's 13
        sub-issues, #818 through #830, are closed and at Review at cc84b29.
      - Add DEC-138 amendment 8's replacement station-writer row for Done: the harness writes it,
        at ship.

      Then regenerate the index: python3 .claude/skills/harness/bin/gen-decisions-index.py
      The hand-written summary right of ' :: ' on DEC-203's row must be at most 30 words;
      test-gen-decisions-index.py enforces that cap and a recent commit had to fix a 46-word row.

  - id: T-04
    title: Make ship write the done station on every recorded card, children first, skipping any card with an open child
    traces: [REQ-01, REQ-02, REQ-03, REQ-10, REQ-11]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: operator route ruling on issue 842; this is the close path itself and the same file's ship step is what runs at this feature's own merge, so a dispatched member would be building under a half-changed mirror
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - .claude/skills/harness/bin/gh_issues.py
      - .claude/skills/harness/bin/test-gh-sync.py
      - .claude/skills/harness/bin/post-merge-sweep.sh
      - .claude/skills/harness/bin/test-post-merge-sweep.py
    verify: |
      out=$(.agents/skills/harness/bin/run-unit-tests.sh --kind all 2>&1); rc=$?
      test $rc -eq 0
      printf '%s\n' "$out" | grep -qx 'PASS test-gh-sync.py'
      printf '%s\n' "$out" | grep -qx 'PASS test-post-merge-sweep.py'
      grep -q 'gh-sync: FAILED' .claude/skills/harness/bin/post-merge-sweep.sh
    intent: |
      Rewrite cmd_ship in .claude/skills/harness/bin/gh-sync.py so the harness lands cards at the
      board's done station instead of closing issues. Write the failing tests first and show them
      red before the implementation.

      NEW ARGV BUILDER in gh_issues.py. Add:
        def sub_issues_args(repo, num):
            return ["api", f"repos/{repo}/issues/{num}/sub_issues"]
      Keep the module's existing rule: it builds argv, it never runs anything. gh-sync.py keeps its
      own runner. Do NOT import parent_args or blocked_by_args into gh-sync.py; their absence is a
      standing regression guard for the write-only rule (DEC-138 amendment 7).

      NEW BEHAVIOUR of cmd_ship(feat_dir, repo, board, body_file=None, pr_arg=None). Note that it
      now takes board; update main()'s dispatch accordingly.

      Step 1. Load the recorded block. As today, skip with the existing message when no milestone is
      recorded. Post the signed --body-file comment on the parent, unconditionally, exactly as
      today.

      Step 2. Build the card set, in this order and recorded as three named groups:
        children  = sorted(rec["issues"].values())          the task sub-issues
        sources   = list(rec["source_issues"])              in recorded order
        parents   = [rec["parent"]] if rec["parent"] is not None else []

      Step 3. ONE call to gh_board.board_stations(board, repo) to get every card's current station
      as {issue number: station or None}. This is the cost-1 targeted read; never
      factory_gh.project_items.

      Step 4. Write the done station for every number in `children`, one gh_board.set_station call
      each, printing one line per card in the existing format:
        gh-sync: issue #<n> -> <done station>
      A BoardError prints one stderr line and the loop CONTINUES to the remaining cards, exactly as
      cmd_status already does. Record which numbers failed.

      NO CHILD CHECK RUNS ON THIS GROUP, and that is decided, not omitted (D-10). The open-child
      test applies to `sources` and to the parent only. A task sub-issue is a harness-created leaf:
      cmd_open is the only writer of rec["issues"], and it creates each one flat with no sub-issue
      of its own, so the recursion has depth 1 by construction. Checking each would add one
      sub_issues read per task sub-issue — thirteen extra network calls on FEAT-34's acceptance run
      — to prove a set that is empty by construction. Write this reason into cmd_ship's own
      docstring, because a later reader who finds REQ-03 stated unconditionally must be able to see
      that the exemption was chosen and why.

      Step 5. Only after step 4, evaluate `sources` and then `parents`. For each such number:
        a. Read its children: run gh_issues.sub_issues_args(repo, num) through the module's own
           gh() runner with capture, parse the JSON list, and take each element's "number".
           A failure of this read means the child set is UNKNOWN: print one stderr line naming the
           issue and the error, do NOT write its station, and continue. Unknown is never treated
           as childless.
        b. A child counts as OPEN when its card is not at the done station. Resolve each child's
           station from the map built in step 3. THE MAP IS REFRESHED IN PLACE AFTER EVERY
           SUCCESSFUL set_station ANYWHERE IN THIS FUNCTION, not only after step 4's writes: a
           source_issues entry can itself be a child of the parent, or of a source evaluated later
           in the same pass, and a map refreshed only for step 4 would still read it as open and
           skip a card that should have landed. Make the refresh a property of set_station's caller
           — one helper that writes the station and, on success, updates the map — so no future
           write site can forget it. Use gh_board.read_station, and treat both of its failure
           reasons — not on the board, and no station set — as OPEN.
        c. If any child is open, do NOT write the card's station, and print exactly one line, whose
           literal shape is pinned by DESIGN.md Contract 2:
             gh-sync: HELD — #<n> waiting on open child #<first open child number> (not at Done)
           naming ONE child, the lowest-numbered open one. When that child is absent from the board
           entirely, the parenthetical reads (not on the board) instead, so the operator can tell an
           unstationed child from a stationed one without a second command.
        d. Otherwise write the done station for that card and print the usual line.

      Step 6. cmd_ship issues NO gh issue close and NO state=closed PATCH on any issue. Delete the
      parent close entirely. The milestone PATCH to state=closed STAYS: a milestone is not a card
      and has no station.

      Step 7. After every card write, print the batch summary. It is TWO LINES, never one merged
      list, and their literal shapes are pinned by DESIGN.md Contract 2:
        gh-sync: HELD <k> of <n> — #<n> (child #<c>), #<n> (child #<c>)
        gh-sync: FAILED <k> of <n> — #<n> did not reach Done and nothing downstream reports it
      Rules, each of which is an assertion in the tests:
        - the HELD line is printed whenever anything was held, whether or not anything failed;
        - the FAILED line is printed ONLY when a write actually failed. Its PRESENCE is the signal,
          so a machine greps one literal rather than parsing a count;
        - FAILED never covers a held card. Held is correct behaviour; a word shared with failure
          teaches the operator to ignore both;
        - FAILED is a new token, not a reuse of the per-card "gh-sync: ERROR - " line, which already
          fires once per failed write on stderr and is unfindable in the merge output it is buried
          in. The summary names WHICH cards; the per-card ERROR lines above it say why;
        - when neither class occurred, print the single line, unchanged:
            gh-sync: every recorded card is at <done>
      NO NEW LINE THIS TASK ADDS MAY CONTAIN THE SUBSTRING "gh-sync: SKIP", and this is a hard
      constraint, not a style note: post-merge-sweep.sh:192 greps ship's combined stdout+stderr for
      exactly that substring and declines to remove the worktree on a match. A new line carrying it
      would silently change worktree behaviour on runs that are entirely healthy. Contract 1 of
      DESIGN.md also reserves SKIP for an environmental no-go where nothing was written, which a
      half-written batch is not.

      The exit status stays 0 and the failure posture stays best-effort per card (DEC-146): a mirror
      never gates, no transaction exists across N project_field_set calls, and git ignores a
      post-merge hook's exit status anyway.

      Step 7b. TEACH THE SWEEP TO READ THE FAILED LINE, in .claude/skills/harness/bin/post-merge-sweep.sh.
      That script already refuses to trust ship's exit code: it greps the combined output for
      "gh-sync: SKIP" and declines the removal on a match, because the standing worktree is "the
      only remaining evidence" the status was never recorded (its own comment, :180-195). Add the
      literal "gh-sync: FAILED" to that same positive-signal gate, as a second condition beside the
      SKIP one, with its own printed reason naming the failed cards. Do not add HELD: a held parent
      is a designed outcome of a healthy run, and keeping a worktree for every one of them would
      accumulate worktrees during normal operation. Do not change ship's exit status, and do not
      make the sweep exit non-zero — only the removal is declined.
        Cost of doing this, stated: a partially failed ship leaves a worktree standing and the
        operator must clear it by hand — cheap, visible, reversible.
        Cost of not doing it: a card silently misses Done, its ticket silently stays open, and the
        only signal is one line in the output of a git merge — the exact defect class this feature
        exists to end, reintroduced at the new terminal write.
      Add the matching assertions to test-post-merge-sweep.py: a ship whose captured output carries
      "gh-sync: FAILED" leaves the worktree in place and prints a reason naming it; a ship carrying
