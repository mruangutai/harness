      test $rc -eq 0
      printf '%s\n' "$out" | grep -qx 'PASS test-gh-close-gate.py'
      printf '%s\n' "$out" | grep -qx 'PASS test-run-unit-tests-kinds.py'
      printf '%s\n' "$out" | grep -qx 'PASS test-branch-create-gate.py'
      python3 -c "import json;h=json.load(open('.claude/settings.json'))['hooks']['PreToolUse'];assert any('gh-close-gate.sh' in c['command'] for m in h if m.get('matcher')=='Bash' for c in m['hooks'])"
    intent: |
      Create .claude/skills/harness/bin/gh-close-gate.sh, a third PreToolUse Bash hook, modelled on
      the structure of branch-create-gate.sh: read the hook JSON from stdin, take
      (tool_input or {}).get("command"), and deny with a structured permissionDecision — exit 0
      plus JSON with hookSpecificOutput.permissionDecision = "deny" and a
      permissionDecisionReason. Reuse that file's deny() helper shape verbatim in structure.

      WHAT IT REFUSES. Any command string that invokes the gh CLI to close a tracked issue:
        - gh issue close ...        in any position, including after a leading env assignment, a
          cd, a pipe or a semicolon;
        - gh api ... repos/<owner>/<name>/issues/<n> ... state=closed, in any argument order.
      Match on the command string only. Do not attempt to resolve the issue number, do not call gh,
      and do not read GitHub state: this gate must work offline and must never fail open on a
      network error.

      WHAT IT MUST NOT REFUSE:
        - any command that does not invoke gh at all;
        - gh issue close appearing only inside a quoted string that is being written to a file or
          echoed — do not attempt to be clever here; a false deny is recoverable and a false allow
          is not, so if you cannot distinguish, deny. Say so in the script's header comment.
        - a command invoking gh-sync.py, whatever its subcommand.

      THE REFUSAL TEXT, pinned character for character by DESIGN.md Contract 4. It routes by the
      operator's INTENT, in three clauses, and is used verbatim for both the gh issue close deny
      and the gh api state=closed deny — there is no second refusal text:

        Refused: the harness closes tickets by landing their card at Done, never by closing an issue.
        If the work is finished, do nothing here — gh-sync.py ship writes Done at the merge and GitHub
        closes the issue. If it is being dropped, run:
          python3 .claude/skills/harness/bin/gh-sync.py abandon <feature-dir> --reason-file <path> --yes
        If the issue is not tracked by the harness at all, close it in the GitHub web UI; this gate
        cannot tell tracked from untracked, by design.

      WHY THREE CLAUSES AND NOT ONE COMMAND NAME. An earlier draft of this task named
      gh-sync.py abandon as "the only sanctioned close". That satisfies SC-07's substring and is
      actively harmful: abandon PATCHes state_reason=not_planned and adds the abandoned label
      (gh-sync.py:986-991), and the likeliest intent behind a hand-typed gh issue close is that the
      work is FINISHED. An operator who obeyed that refusal would mark shipped work abandoned. The
      finished branch therefore comes first and its answer is to type nothing. The abandon branch is
      given as a runnable command, not a name — the bare name omits the interpreter, the path, the
      feature dir, the mandatory --reason-file (gh-sync.py:972) and the new --yes. The untracked
      branch exists because this gate must not resolve the issue number, so a legitimate close of an
      untracked issue is a false deny; false denies are accepted as recoverable only if the refusal
      says how to recover. The string gh-sync.py abandon is still present, so SC-07 holds.

      NO ENVIRONMENT MARKER. Issue 842 specifies an environment marker gh-sync.py sets to exempt
      abandon's own call. It cannot work and is not needed: a PreToolUse hook is handed only
      tool_input.command (branch-create-gate.sh:47), and gh-sync.py reaches gh through subprocess,
      which never traverses the Bash tool, so abandon's close is never presented to this gate. A
      marker would only be settable by hand, which is the hole the grilling flagged. Record this
      reasoning in the script's header comment, citing the measurement.

      SELF-GATING, as branch-create-gate.sh does: read .harness/harness.json github.sync and exit 0
      immediately when it is off or absent, so the hook costs nothing where the mirror is off.

      REGISTER IT in .claude/settings.json as a third command under the existing PreToolUse Bash
      matcher, after bash-write-guard.sh, using the same ${CLAUDE_PROJECT_DIR} prefix form.

      TEST at .claude/skills/harness/bin/test-gh-close-gate.py, feeding hook JSON on stdin and
      asserting the process stdout. Each case its own assertion:
        - gh issue close 728 --repo x/y                      -> deny, and the reason carries all
          three clauses, each its own assertion: the finished clause naming gh-sync.py ship, the
          runnable abandon command including --reason-file and --yes, and the untracked-issue
          escape naming the GitHub web UI;
        - the gh api state=closed deny returns the SAME reason string as the gh issue close deny,
          asserted by equality, so a second wording cannot drift into existence;
        - cd /tmp && gh issue close 728                      -> deny
        - FOO=1 gh issue close 728                           -> deny
        - gh api -X PATCH repos/o/r/issues/9 -f state=closed  -> deny
        - gh issue view 728                                  -> allow (no output)
        - python3 .claude/skills/harness/bin/gh-sync.py abandon d --reason-file r --yes -> allow
        - git status                                          -> allow
        - github.sync false in a fixture harness.json          -> allow even for gh issue close
      All of these must be shown failing against a tree without the script.

      REGISTER THE TEST in two places or the suite refuses to run: add "test-gh-close-gate.py" to
      INTEGRATION_SCRIPTS in .claude/skills/harness/bin/run-unit-tests.sh, and add the same path to
      the integration kind's detect glob list in .harness/harness.json. run-unit-tests.sh's drift
      detector exits 2 on an unregistered test-*.py, and its kind cross-check compares the two
