  - id: T-08
    title: Select a feature's worktree by prefix in harness_boundary and cut inflight_registry over
    traces: [REQ-03]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/inflight_registry.py
      - .claude/skills/harness/bin/test-harness-boundary.py
    verify: |
      python3 .claude/skills/harness/bin/test-harness-boundary.py || exit 1
      python3 .claude/skills/harness/bin/test-inflight-registry.py || exit 1
      python3 - <<'EOF'
      import os, sys, tempfile
      sys.path.insert(0, os.path.abspath('.claude/skills/harness/bin'))
      import harness_boundary as hb, inflight_registry as ir
      d = os.path.realpath(tempfile.mkdtemp())
      def wt(name):
          p = os.path.join(d, 'wt', name); e = os.path.join(d, '.git', 'worktrees', name)
          os.makedirs(p); os.makedirs(e)
          with open(os.path.join(p, '.git'), 'w') as fh: fh.write('gitdir: %s\n' % e)
          with open(os.path.join(e, 'gitdir'), 'w') as fh:
              fh.write('%s\n' % os.path.join(p, '.git'))
          return hb.real(p)
      short = wt('FEAT-X')
      assert hb.worktree_for_feature(d, 'FEAT-X-thing') == short, 'prefix form not selected'
      assert hb.worktree_for_feature(d, 'FEAT-X') == short, 'exact form not selected'
      assert hb.worktree_for_feature(d, 'FEAT-Y-other') is None, 'unrelated id matched'
      assert ir.feature_root(d, 'FEAT-X-thing') == short, 'inflight_registry not cut over'
      wt('FEAT')
      try:
          hb.worktree_for_feature(d, 'FEAT-X-thing')
          raise AssertionError('two candidates must raise AmbiguousWorktree')
      except hb.AmbiguousWorktree as exc:
          assert 'FEAT-X' in str(exc), 'the refusal must name the candidates'
      assert ir.feature_root(d, 'FEAT-X-thing') == d, 'ambiguity must fall back to owner_root'
      assert ir.feature_root(d, 'FEAT-Y-other') == d, 'no worktree must fall back to owner_root'
      src = open('.claude/skills/harness/bin/inflight_registry.py').read()
      assert 'os.path.basename(worktree)' not in src, 'inline basename loop still present'
      assert 'worktree_for_feature' in src, 'cutover not through the seam'
      assert src.count('def feature_root(') == 1, 'feature_root redefined or removed'
      print('OK')
      EOF
    intent: |
      Two library edits and their unit cases. This task installs the seam T-03 then cuts the domain
      gate over to; it touches no gate script and no test of one.

      1. In .claude/skills/harness/bin/harness_boundary.py, add a module-level exception class
      AmbiguousWorktree(Exception) and a function worktree_for_feature(owner_root, feature_id),
      placed beside worktree_owner and linked_worktrees. It enumerates
      linked_worktrees(owner_root) and keeps every checkout whose basename either EQUALS
      feature_id or is a prefix of it followed by a hyphen -- that is, feature_id.startswith(
      basename + "-"). Exactly one candidate: return it, already realpath-resolved by
      linked_worktrees. No candidate: return None. TWO OR MORE candidates: raise AmbiguousWorktree
      naming every candidate basename, sorted. Do not guess and do not prefer the longest match.

      Why prefix and not equality, and it must go in the docstring: this repository measured the
      premise false in its own source. feature-worktree.py:236-239 records that all four live
      worktrees were FEAT-32 while every feature directory was FEAT-32-concurrent-write-merge, and
      :244-248 resolves that by prefix, refusing on ambiguity because a coin flip is strictly worse
      than a refusal the operator can act on. Both spellings are legal input, so equality leaves
      every short-form worktree unmatched and silently unbound.

      Cost, and state it in the docstring: this runs on the PreToolUse path. It adds no I/O beyond
      the linked_worktrees call the caller already makes, which is measured at 0.371 ms per call
      over five worktrees against the hook's own ~38 ms interpreter-startup floor.

      2. In .claude/skills/harness/bin/inflight_registry.py, replace feature_root's inline loop at
      :262-269 -- which does the same basename equality and carries the same bug -- with a call to
      harness_boundary.worktree_for_feature. This cutover is BOUNDED and its bound is checked:
      feature_root's signature, its return type and its fallback contract are unchanged (any
      failure, no match, or an AmbiguousWorktree falls back to the supplied owner_root, and nothing
      is raised out of feature_root), and no other function in the module is touched -- this
      task's verify asserts that the inline basename loop is gone, that the call goes through the
      seam, and that feature_root is still defined exactly once. The ONE permitted observable
      change is that a
      short-form worktree now resolves where it previously fell back to owner_root. Run
      test-inflight-registry.py BEFORE the edit and again after: the same case set must pass, with
      no case modified, added or deleted, which is this cutover's before-and-after invariance
      check. SC-16 grades that boundary.

      3. Add cases to .claude/skills/harness/bin/test-harness-boundary.py using the fixture helpers
      that file already has -- read them first, including whichever one writes a gitdir pointer
      pair, and reuse it rather than building a second. Cover: exact-basename match, short-form
      prefix match, a feature id that no worktree prefixes, a basename that prefixes without the
      hyphen boundary (FEAT-XY must NOT match FEAT-X), no .git/worktrees at all, and two candidates
      raising AmbiguousWorktree with both names in the message. Assert on returned VALUES, not
      truthiness: None and a checkout path are the two answers a caller branches on.

      Register nothing. test-harness-boundary.py is already in UNIT_SCRIPTS in run-unit-tests.sh,
      so cases added here are evidence of kind unit; moving it would trip the runner's KIND-DRIFT
      check.
