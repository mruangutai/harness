      THE TWO CONTINUES ABOVE ARE OUT OF SCOPE, and this is load-bearing rather than a
      preference. `if rel.startswith(".."): continue` at :744 is the product-workspace exclusion
      the file's own comment at :735-743 records as deliberately kept: `rel` is ROOT-relative, so
      every product-workspace path begins with `..`, and touching it would start enforcing
      product-base domains on the Bash route for the first time — a widening with no REQ, no
      criterion and no test behind it. Do not move it, do not narrow it, do not reorder it. The
      DEC-153 `^\.claude/worktrees/` continue at :714 is likewise untouched; it is also why the
      allowed-inside-the-worktree direction needs no new branch here.

      WHICH `rel`. Use the LOOP's `rel` (computed at :706 as os.path.relpath(ap, root)) — the
      ROOT-relative one — as the string you match the feature-path pattern against, and use `ap`
      for containment. Do NOT use `verdict["rel"]`: the file's own comment at :758-762 records
      that the verdict's `rel` is BASE-relative while the loop's is ROOT-relative, and in the
      product base the two differ. The rule is about which CHECKOUT under this root the target
      sits in, so the root-relative spelling is the one that means what the rule needs; a
      base-relative path would silently change which string the anchored pattern sees.

      WHAT IT DECIDES.
      - Match the loop's `rel` against ^\.harness/[^/]+/features/([^/]+)/ to lift the feature id
        FROM THE TARGET PATH. Do NOT read harness_feature or any other payload key (D-03): the
        target path is present on every route, that key is not. No match: say nothing, continue.
      - Call harness_boundary.worktree_for_feature(root, feature_id) — the SAME seam T-08 lands
        and T-03 consumes. Do NOT re-derive the selection here and do NOT match worktree
        basenames for equality, which this repository has already measured false
        (feature-worktree.py:236-248). harness_boundary is already imported in this file.
      - None returned (no registered worktree for that feature): the check does NOT fire.
        Continue unchanged. A feature developed in the main checkout is legitimate.
      - A registered worktree exists and the target resolves INSIDE it: allowed, continue
        unchanged. Reached here in practice only for a worktree outside the DEC-153 segment,
        because :714 already continues for anything under .claude/worktrees/; write the branch
        anyway so the rule is total.
      - A registered worktree exists and the target resolves in the MAIN checkout: deny(...) —
        which exits 2. The message MUST name BOTH the target (as `ap`, so the checkout is
        identifiable) AND the worktree the write belonged in, and say plainly that the write
        belongs in that worktree. Without the second path the agent cannot act on the refusal,
        and this is the message a pressured agent reads instead of routing around the tool gate.
      - harness_boundary.AmbiguousWorktree — two registered worktrees both prefix this feature
        id: deny(...) at exit 2, NAMING the candidates the exception carries. A guess binds the
        write to a checkout nobody chose; a silent skip turns the gate off for exactly the setup
        that most needs it. Catch this exception SPECIFICALLY, ahead of the absorbing catch.
      - ANY OTHER EXCEPTION IS ABSORBING: print nothing, fire nothing, leave the prior verdict
        standing and let the continue stand. An unhandled exception in this script exits
        non-zero, which turns the whole guard off for that call — the failure mode is the guard
        going silently dark, so the broad catch is the correct shape here and must be written.

      CONTAINMENT is decided by harness_boundary.checkout_relative(ap): the target is inside the
      selected worktree when checkout_relative names that checkout, and in the main checkout when
      it names none. Do NOT compare realpath strings with startswith — a sibling checkout whose
      name prefixes the selected one would be misclassified as inside it, which is the
      prefix-collision class harness_boundary already fixed once in issue 103.

      SCOPE FENCE, and write it into the code comment in as many words: this binds the CHECKOUT
      question only. It does NOT extend REQ-04's run-digest preservation rule to the Bash route.
      That rule needs the PRIOR content of the file, which only a whole-file Write payload
      carries; a shell command hands this guard no payload to compare against. D-06's residual
      stands and BRIEF.md's `## Verification gaps` still says so.

      Also carry the comment recording the measured defect this closes: the tool route was bound
      by T-03 while the Bash route allow-continued at :747, so the identical governed
      main-checkout write landed at exit 0 through a route the tool-route refusal message itself
      named the destination for.

  - id: T-10
    title: Test the Bash-route checkout binding and prove it can report red
    traces: [REQ-06, REQ-08]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, test-bash-write-guard.py is the Bash write guard's own test
    depends_on: [T-09]
    status: done
    files:
      - .claude/skills/harness/bin/test-bash-write-guard.py
    verify: |
      python3 .claude/skills/harness/bin/test-bash-write-guard.py || exit 1
      T=.claude/skills/harness/bin/test-bash-write-guard.py
      grep -q 'bash-feature-checkout-main' "$T" || exit 1
      grep -q 'bash-feature-checkout-inside' "$T" || exit 1
      grep -q 'bash-feature-checkout-absent' "$T" || exit 1
      grep -q 'bash-feature-checkout-short' "$T" || exit 1
      grep -q 'bash-feature-checkout-red' "$T" || exit 1
      echo OK
    intent: |
      Add FIVE cases to .claude/skills/harness/bin/test-bash-write-guard.py covering T-09's
      binding. REUSE THE FIXTURE AND INVOCATION HELPERS THAT FILE ALREADY HAS — read them first:
      `fixture(text)` (:175), `fire(root, cmd, agent)` (:183), `_env(root)` (:20) and
      `_linked_worktree(path, owner_root, wt_id, manifest_text)` (:297), which builds the on-disk
      `.git` pointer shape by hand rather than invoking git. DO NOT BUILD A SECOND HARNESS. If
      _linked_worktree does not also write the owner's `.git/worktrees/<id>/gitdir` pointer that
      harness_boundary.linked_worktrees reads, EXTEND that one helper and re-run the existing
      worktree cases, rather than adding a parallel builder beside it.

      Every case asserts the EXACT exit code — 2 blocks, 0 passes, never "nonzero" (DEC-100) —
      and the refusing cases assert on the captured stderr TEXT as well. Capture by subprocess
      capture, never by piping to head or tail.

      Name each case with the greppable token below in its description; this task's verify greps
      for all five.

      1. bash-feature-checkout-main — a fixture root with a registered worktree whose basename is
      the feature id, and a governed-agent Bash write (a plain `echo hi > <abs path>`) naming the
      MAIN checkout's .harness/<repo>/features/<FEAT>/BRIEF.md. The fixture manifest must GRANT
      that path to the agent, so the verdict reaching :747 is `allow` and the denial can only be
      the new binding. Assert exit 2, and assert the stderr names BOTH the target path and the
      worktree the write belonged in. Exit 2 alone passes on a message an agent cannot act on.

      2. bash-feature-checkout-inside — the identical write aimed at the same feature path INSIDE
      that worktree. Assert exit 0. Be honest in the case's own comment about what this proves:
      if the worktree sits under .claude/worktrees/ the DEC-153 continue at bash-write-guard.sh
      :714 returns before classify is ever called, so the exit 0 is not evidence that the new
      binding's allow branch ran — it is evidence that the new check did not disturb DEC-153's
      carve-out, which is what this case actually binds.

      3. bash-feature-checkout-absent — the same main-checkout write with NO worktree registered
      for that feature id. Assert exit 0. A feature developed in the main checkout stays legal,
      and this is the case that stops the rule from being an unconditional deny.

      4. bash-feature-checkout-short — the SAME denial as case 1 with the registered worktree's
      basename being the SHORT flow id the feature id extends: worktree basename FEAT-NN against
      feature directory FEAT-NN-slug. Assert exit 2 and the same two names in stderr. THIS IS THE
      CLAUSE AN EQUALITY-MATCHING IMPLEMENTATION FAILS while every other clause here stays green,
      and it is the spelling this repository measured in the wild
      (feature-worktree.py:236-239: all four live worktrees were FEAT-32 while every feature
      directory was FEAT-32-concurrent-write-merge).

      5. bash-feature-checkout-red — the reachability proof for case 1, by D-07's idiom. Write a
      MARKER-FREE copy of bash-write-guard.sh with the feature-checkout binding removed — locate
      the region by its own source text, never by a line number and never by any commit ref,
      relative or pinned — to a DOT-PREFIXED path in the script's OWN directory whose name is
      UNIQUE PER PROCESS by including os.getpid(); copy the file mode; remove it in a `finally`
      block. That directory is shared and tracked and features run in parallel, so a fixed name
      lets one run's finally delete another's copy mid-read. The copy MUST live in the script's
      own directory: the guard imports harness_boundary and harness_yaml from there, so a copy in
      a tmpdir exits non-zero on import and the case would pass while measuring nothing.

      Run BOTH the real script and the mutant over case 1's fixture and assert ALL FOUR of: the
      mutant text DIFFERS from the source; the mutant DID NOT CRASH, by requiring its exit code
      to be 0 or 2 AND its stderr to carry no python traceback, so a SyntaxError or NameError
      cannot masquerade as a passing return; the real script exits 2; and the mutant exits 0.
      Fail loudly as INCONCLUSIVE if the source text searched for was not found or the copy is
      byte-identical to the original. Note in the case comment that this file already honours a
      BASH_WRITE_GUARD_BIN override (:17) — use it to point the invocation at the mutant rather
      than hand-rolling a second subprocess path.

      Register nothing. test-bash-write-guard.py is already in INTEGRATION_SCRIPTS in
      run-unit-tests.sh:31 and is already an explicit entry in harness.json's integration.detect,
      so cases added here are evidence of kind integration and no registration change is needed;
      moving it would trip the runner's KIND-DRIFT check.

  - id: T-11
    title: Resolve a lead's artifact path against the feature's checkout in validate-digest.py
    traces: [REQ-09]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, validate-digest.py is the registered SubagentStop validator
    depends_on: [T-08]
    status: done
    files:
      - .claude/skills/harness/bin/validate-digest.py
    verify: |
      python3 - <<'EOF'
      import importlib.util, os, sys, tempfile
      B = os.path.abspath('.claude/skills/harness/bin')
      sys.path.insert(0, B)
      spec = importlib.util.spec_from_file_location('vd', os.path.join(B, 'validate-digest.py'))
      vd = importlib.util.module_from_spec(spec); spec.loader.exec_module(vd)
      d = os.path.realpath(tempfile.mkdtemp())
      os.makedirs(os.path.join(d, '.harness'))
      open(os.path.join(d, '.harness', 'team-config.yaml'), 'w').write('agents: {}\n')
      wt = os.path.join(d, '.claude', 'worktrees', 'FEAT-X')
      e = os.path.join(d, '.git', 'worktrees', 'FEAT-X')
      os.makedirs(e); os.makedirs(os.path.join(wt, '.harness', 'runs', 'r1'))
      open(os.path.join(wt, '.harness', 'team-config.yaml'), 'w').write('agents: {}\n')
      open(os.path.join(wt, '.git'), 'w').write('gitdir: %s\n' % e)
      open(os.path.join(e, 'gitdir'), 'w').write('%s\n' % os.path.join(wt, '.git'))
      rel = os.path.join('.harness', 'runs', 'r1', 'digest.md')
      open(os.path.join(wt, rel), 'w').write('# narrative digest, no contract block\n')
      os.environ['HARNESS_PROJECT_DIR'] = d
      text = 'VERDICT: PASS\nDIGEST:\n  headline: x\nartifact: %s\n' % rel
      got = vd.check_artifact_file('harness-eng-lead', text, {'harness_feature': 'FEAT-X-thing'})
      assert got == 2, 'worktree-resident digest not located: got %r' % got
      got = vd.check_artifact_file('harness-eng-lead', text, {})
      assert got == 0, 'no-feature fallback changed: got %r' % got
      print('OK')
      EOF
    intent: |
      Fix the artifact-path resolution in check_artifact_file
      (.claude/skills/harness/bin/validate-digest.py:1374) so a lead running in a worktree has its
      digest FILE actually found. D-11 governs.

      THE DEFECT, measured at 5d12e68. Line 1414 reads

        cands = ([path] if os.path.isabs(path) else [os.path.join(_root_or_none() or "", path)])

      and _root_or_none() (:1343-1357) resolves the root from the INSTALLED script's own
      location — always the MAIN checkout. So for every lead running in a worktree the relative
      artifact path is joined onto the wrong checkout, the file is not found, the DEC-156
      file-shape check is SKIPPED, and the hook prints the INV-15 pass-through line, which reads
      like housekeeping. Three lead digest.md files in FEAT-50 itself fail the DEC-156 contract
      and were passed by this hook for exactly that reason.

      THE FIX, and it is the file's OWN precedent rather than a new mechanism. _hook_feature_dir
      (:1359-1372) already resolves a feature's checkout correctly:

        checkout_root = inflight_registry.feature_root(owner_root, feature)

      Do the same for the relative-path candidate. Take the feature from the payload —
      check_artifact_file already receives it as its `payload` argument — with
      payload.get("harness_feature"), resolve owner_root with _root_or_none(), and where BOTH are
      available resolve the base with inflight_registry.feature_root(owner_root, feature). Use
      that base instead of the bare owner root when joining a relative artifact path.

      FALLBACK, unchanged behaviour and therefore no regression: when harness_feature is absent
      or falsy, when _root_or_none() returns None, or when the feature does not resolve, join
      against _root_or_none() or "" exactly as today. feature_root's own contract already falls
      back to the supplied owner_root on no match or ambiguity and raises nothing, so no
      exception handling beyond the file's existing shape is needed; if you add any, it must
      absorb into the same fallback and never into a verdict.

      ABSOLUTE artifact paths keep today's handling verbatim: `[path]`, no resolution, no change.

      FAIL-OPEN-LOUDLY IS UNCHANGED (DEC-127, and the docstring at :1384-1388 says so): if the
      file is STILL not found after this resolution, print the same message and return 0. Do not
      turn a lookup failure into a block. Keep the INV-15 pointer line exactly as it reads —
      test-validate-digest.py's existing "missing file fails OPEN with the INV-15 pointer" case
      asserts on the word INV-15.

      WHY harness_feature IS LEGITIMATE INPUT HERE and D-03's ban does not reach it — carry this
      as a comment, because the next reader will otherwise see a contradiction. D-03 forbids
      reading harness_feature in check-domain.sh's PreToolUse route, where that key's presence
      varies by route while the target path is present on every route. This is the SubagentStop
      hook, which ALREADY consumes d.get("harness_feature") at :1514 and passes it to
      _hook_feature_dir at :1598-1599. This change follows the file's own established pattern; it
      introduces no new input.

      Change nothing else in check_artifact_file: the VERDICT tail-anchoring, the digest.md suffix
      filter, the validate() call and the two exit paths all stay as they are.

      DEPENDS ON T-08 and the ordering is real, not decorative: feature_root only resolves the
      SHORT-form worktree spelling once T-08 cuts it over to
      harness_boundary.worktree_for_feature. Landing this first would fix the exact-basename case
      and leave the spelling this repository actually measured in the wild still broken.

