      FEAT-32 while every feature directory was FEAT-32-concurrent-write-merge. State the scope
      honestly: the extraction reads the domain route's raw relative path, so the rule reaches a
      write aimed at the MAIN checkout and does not reach one aimed at a sibling feature's
      worktree.

      3. A RECORDED RUN DIGEST CANNOT BE REPLACED, only extended. A write to an existing non-empty
      runs/<runid>/digest.md is refused unless the existing text is a verbatim prefix of the
      payload. State why content preservation rather than run-directory allocation: preservation is
      decidable from the payload and the file alone, while directory uniqueness needs a notion of
      run identity no writer supplies and would refuse a lead revising its own digest inside one
      run. State why the shape route and not the sweep: the sweep runs after the write, where the
      prior text is gone, so the check there could only compare a file with itself. Measurement: a
      lead reusing a run directory across cycles overwrote an earlier lead digest and destroyed the
      cycle-0 record. Cite DEC-154, DEC-156, DEC-180.
      State the scope honestly here too: the rule is enforced on the PRE payload route, which is
      Write-only, so an Edit, a NotebookEdit or a shell redirect reaches no enforcement point. That
      is accepted residual risk with the team playbook as its compensating control, not an
      oversight.

      Add one closing paragraph recording what this entry does NOT do: it does not close
      validate-digest.py's stop_hook_active passthrough, which stays pre-existing and deliberate,
      and it takes no position on INV-32's retroactive red across 32 approved plans, which is a
