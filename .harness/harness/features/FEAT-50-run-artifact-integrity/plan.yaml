        hook_case("pass-through: empty last_assistant_message passes with a stated reason",
                  "harness-qa", "", 0, mentions="no final message")

      -- exit 0 for exactly the present-and-empty payload T-01 redirects to exit 2 under D-01.
      Leaving it in place makes this task unable to pass its own verify, because that verify runs
      the whole file first.

      DELETE that case outright, together with its own preceding comment line if that comment
      describes only it. Do NOT rewrite it to expect exit 2 instead: case 1 (empty-string) already
      covers that direction with the stronger assertion (exit 2 AND the persona named), so a
      rewrite leaves a duplicate whose description still says "pass-through" while it asserts a
