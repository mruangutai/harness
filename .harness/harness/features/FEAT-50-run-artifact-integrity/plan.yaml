decisions:
  - id: D-01
    choice: >-
      validate-digest.py's hook mode discriminates on PRESENCE, not on truthiness: the
      last_assistant_message key ABSENT, or present with a null value, is our gap and fails OPEN
      at exit 0; the key present with a string that is empty or whitespace-only is the persona's
      contract violation and fails CLOSED at exit 2.
    because: >-
      Presence is the only discriminator the payload actually carries, and the current
      or-empty-string collapses absent, null and empty into one branch, so the violation is
      indistinguishable from the platform gap. Failing closed on absence instead would wedge
      every subagent in the project.
    dec: DEC-127
  - id: D-02
    choice: >-
      The fail-open branch keeps exit 0 and states on stderr that the return was NOT validated,
      naming the persona. Nothing is written to disk and no new artifact is introduced.
    because: >-
      DEC-127 already fixed the direction: our own failure fails open loudly. Escalating the gap
      to a refusal is a different decision the operator has not taken, and a new record file
      would be a second artifact nobody reads.
    dec: DEC-127
  - id: D-03
    choice: >-
      A write is bound to a checkout by DERIVING the feature id from the TARGET PATH and requiring
      the target to sit in the checkout git has registered as that feature's worktree, when one is
      registered. No payload key is consulted and feature.json gains NO key. The registered
      worktree is selected by PREFIX, not by exact basename equality: a worktree qualifies when its
      basename equals the feature id, or when the feature id begins with that basename followed by
      a hyphen. Two candidates is an AMBIGUITY and the lookup refuses rather than guessing.
      Containment is decided by comparing harness_boundary.checkout_relative's checkout for the
      target against the selected worktree, never by a realpath startswith test. The selection
      lives in harness_boundary as worktree_for_feature(root, feature_id), beside worktree_owner
      and linked_worktrees, and inflight_registry.feature_root is cut over to it.
    because: >-
      git's worktree registry is authoritative and cannot drift, whereas a declared worktree key
      would be a DEC-191 schema change to a closed key set, and a payload key is only available on
      the routes that happen to carry it. Basename equality is FALSIFIED by this repository's own
      measurement, recorded at feature-worktree.py:236-239: all four live worktrees were FEAT-32
      while every feature directory was FEAT-32-concurrent-write-merge, and feature-worktree.py
      resolves it by prefix at :244-248, refusing on ambiguity. Both spellings occur, so equality
      would leave the binding silently off for every short-form worktree. A realpath startswith
      test would misclassify a sibling checkout whose name prefixes the selected one, which is the
      prefix-collision class harness_boundary already fixed once in issue 103. The extraction is
      not premature architecture: inflight_registry.feature_root at :262-269 already implements
      the same basename match and carries the same bug, so the second consumer exists today.
      Cost, since this runs on PreToolUse: linked_worktrees measures 0.371 ms/call over 5
      worktrees and real() adds two negligible realpath calls
      (harness_boundary.py:138-156,258-273); bounded to writes matching the feature-path regex
      inside the already-ALLOWED governed branch, this is under 1% of the ~38 ms
      interpreter-startup floor check-domain.sh already pays per hook launch.
    dec: DEC-191
  - id: D-04
    choice: >-
      The binding NARROWS an already-ALLOWED domain verdict and never widens one. It runs inside
      the governed-agent PreToolUse branch only, after the raw-then-stripped glob match has
      succeeded, so DEC-143's matching is untouched. Where no worktree is registered for the
      feature, the rule does not fire.
    because: >-
      DEC-143 is the design that lets an agent inside a worktree write what its domain grants;
      a remedy that changed the match would break every build dispatch. Restricting the rule to
      governed agents leaves the main session's post-merge writes to the main checkout legal,
      which is the only tier that needs them.
    dec: DEC-143
  - id: D-05
    choice: >-
      A run digest is protected by CONTENT PRESERVATION, not by run-directory allocation: a Write
      to an existing non-empty runs/<runid>/digest.md is refused unless the existing text is a
      prefix of the payload. Choosing a fresh run dir remains the lead's own remedy and is not
      enforced. The comparison reads the file at the write's own absolute target path, never
      os.path.join(root, rel).
    because: >-
      Preservation is the weakest rule that forces the requirement, and it is decidable from the
      payload and the file alone. Enforcing directory uniqueness would need a notion of run
      identity no writer supplies, and would refuse a lead revising its own digest within one run.
      The absolute target rather than root+rel because rel on the shape route comes from _norm,
      which STRIPS the worktree prefix at check-domain.sh:1007-1013: joining it to root names the
      MAIN checkout's copy, so the rule would read a file that does not exist for any lead working
      in a worktree and would allow exactly the clobber it exists to refuse. Cost: one file read
      per Write to a digest path, on the pre route only, and no read at all on the other routes.
    dec: DEC-154
  - id: D-06
    choice: >-
      The digest rule is enforced on check-domain.sh's PRE write-payload route only. RE_RUN_DIGEST
      is added neither to SHAPE_PATTERNS nor to the post-hoc sweep pattern list. The Edit,
      NotebookEdit and Bash routes are therefore UNENFORCED, accepted as residual risk.
    because: >-
      The pre route is the one moment the earlier content still exists, and it is Write-only by
      construction at check-domain.sh:1367-1368. A sweep runs after the write, where the prior text
      is already gone; the POST named-target route reads the file as it landed and would compare it
      with itself. Both would be checks that cannot fire, and SHAPE_PATTERNS is what opens the
      second of them, so omitting RE_RUN_DIGEST from it removes a wasted read rather than a
      guarantee. The residual is real and is not hidden: D-05's own protected case, a lead revising
      its own digest inside one run, is realistically an Edit, so the legitimate path is the
      unenforced one. The compensating control is T-06's playbook statement plus the fact that a
      lead composes its digest in one turn and writes it with Write. Reaching the other routes
      needs a mechanism this plan does not contain and would be a scope change.
    dec: DEC-180
  - id: D-07
    choice: >-
      Each of the three regressions proves its own reachability with a MARKER-FREE MUTANT COPY of
      the gate placed beside the original in the gate's own directory, never with a relative or
      pinned commit ref. The copy's filename is UNIQUE PER PROCESS -- dot-prefixed and carrying
      os.getpid() -- and it is removed in a finally block.
    because: >-
      The fix task lands as its own commit, so a relative ref reads the post-change file and the
      assertion is false from the first run. A copy elsewhere than the script's own directory dies
      on its sibling imports, which reads as a missing finding. The name is unique per process
      because that directory is shared and tracked while D-08 records that this harness runs
      features in parallel: on a fixed path two concurrent suites -- two worktrees' qa gates, or a
      human running the file while the harness does -- collide, and one run's finally deletes the
      other's copy mid-read, producing an INCONCLUSIVE or a false red against a correct tree.
      Constraint 3 of the operator's stated intent asks for DETERMINISTIC regressions, which a
      collision-prone red proof is not. Recorded and deliberately NOT fixed here:
      test-check-state.py's own INV-32 mutant idiom uses a fixed path and carries the same
      exposure, but that file is run UNCHANGED as the FEAT-45 regression (SC-08) and editing it is
      outside the three issues.
    dec: none
  - id: D-08
    choice: >-
      The three rules are recorded as ONE new decision, numbered as the next unused DEC-NNN at
      landing time and not as a number fixed now. No INV-32 remedy is planned.
    because: >-
      Three enforcement rules installed with no entry in the record leaves the next reader to infer
      the ruling from the scripts. The number is deliberately not pinned: DEC-207 was the highest
      in use on 2026-08-31, but this harness runs features in parallel and a concurrent
      documentor task can consume 208 before this one lands, at which point a pinned number is
      either a duplicate heading or a plan that contradicts the record it produced. Everything
      downstream anchors on the entry's heading text instead. No INV-32 remedy is planned here,
      and that is now a recorded ruling rather than a deferral: the operator ruled on 2026-08-31
      (notes/answers-2026-08-31-plan.md, "Operator ruling — INV-32", choice d) that INV-32 is
      being fixed in ANOTHER session, so neither option (a)'s approval.date scoping nor option
      (b)'s 32-plan backfill enters this plan and check-state.sh is edited by no task here.
      D-09 records what that ruling costs this feature.
    dec: none

  - id: D-09
    choice: >-
      FEAT-50 carries the UNWEAKENED check-state.sh exit-0 criterion (SC-11) and BLOCKS its own
      signature and its own build on an EXTERNAL event: the retroactive INV-32 fix landing on the
      default branch. No task here touches check-state.sh, no approval.date scoping and no
      32-plan panel backfill enters this plan. SC-11 therefore becomes gradeable only after that
      external fix lands with FEAT-50's feature directory present.
    because: >-
      The operator ruled it on 2026-08-31, recorded verbatim at
      notes/answers-2026-08-31-plan.md, "Operator ruling — INV-32", choice d: INV-32 is being
      fixed in another session, hold signature and build until that lands, do not alter INV-32
      here and do not weaken the exact exit-0 criterion. That is a FOURTH option, none of the
      (a)/(b)/(c) the plan offered, and it is recorded as d rather than forced into that shape
      because recording it as (c) would falsify what was ruled (PRINCIPLES rule 15). Form (c) —
      no violation row names FEAT-50, exit code not graded — was a WEAKENING of stated-intent
      constraint 4 and is refused; the "no row names FEAT-50" clause is KEPT ALONGSIDE the exit-0
      clause, because adding a clause is not weakening one. The consequence is deliberate and is
      not a plan defect: the 32 rows are outside this feature's diff and outside its branch, so
      no task in any correct version of this plan could clear them, and pretending otherwise
      would put an unreachable criterion behind a signature. This is the ONLY thing standing
      between this plan and signature.
    dec: none
  - id: D-10
    choice: >-
      The checkout binding is enforced on BOTH governed write surfaces: check-domain.sh's
      PreToolUse tool route (T-03) and bash-write-guard.sh's governed Bash write route (T-09),
      through the SAME harness_boundary.worktree_for_feature seam, with no second derivation of
      the selection. On the Bash route the rule NARROWS the allow-continue at
      bash-write-guard.sh:747 and never widens: the product-workspace continue above it
      (rel.startswith("..")) is untouched and stays out of scope. This closes the CHECKOUT
      question (REQ-03, REQ-08) ONLY. REQ-04's run-digest preservation rule is NOT extended to
      Bash and stays Write-only; D-06's residual stands unchanged.
    because: >-
      A refusal on one surface and silence on the other is a bypass by construction, and this
      hook exists because an agent routed around the other one (DEC-151). Worse than silence:
      T-03's refusal message NAMES the worktree, so a plan that stopped at the tool route would
      hand a pressured agent the destination and leave the shell route open to reach it. One
      seam rather than two implementations because two copies of a selection rule drift, and the
      one-implementation proof the guard's own suite already runs (test-bash-write-guard.py's
      both-routes-agree cases) is what keeps them honest. The scope fence is stated rather than
      assumed because the two rules live in the same gates and a reader would otherwise take
      route-completeness for the digest rule too: the digest rule needs the PRIOR CONTENT, which
      only a whole-file Write payload carries, and no Bash command hands the gate one.
    dec: DEC-151
  - id: D-11
    choice: >-
      validate-digest.py's check_artifact_file resolves a RELATIVE artifact path against the
      FEATURE'S checkout, using the file's own existing precedent — inflight_registry.feature_root
      (owner_root, feature) as _hook_feature_dir already calls it — and falls back to
      _root_or_none() when harness_feature is absent or the feature does not resolve. Absolute
      artifact paths keep today's handling and fail-open-loudly is unchanged: a file still not
      found exits 0 and keeps the INV-15 pointer line.
    because: >-
      _root_or_none() resolves from the INSTALLED script's own location, which is always the MAIN
      checkout, so for every lead running in a worktree the digest file is not found, the DEC-156
      file-shape check is SKIPPED, and the hook prints a pass-through line that reads like
      housekeeping. Measured live in this planning run: three lead digest.md files in FEAT-50
      itself fail the DEC-156 contract and were passed by this hook for exactly that reason.
      AND, BECAUSE A READER WILL OTHERWISE SEE A CONTRADICTION: D-03 forbids reading
      harness_feature in check-domain.sh's PreToolUse route, and that ban is ROUTE-SPECIFIC, not
      a blanket one. It holds there because that key's presence varies by route while the target
      path is present on every route. It does not extend here: this is the SubagentStop hook,
      which ALREADY consumes d.get("harness_feature") at validate-digest.py:1514 and :1598-1599,
      so the change follows the file's own established pattern rather than introducing a new
      input, and the behaviour when the key is absent is today's exact behaviour and therefore no
      regression. The fallback is what keeps this fail-open: a resolution that cannot be made is
      still not a verdict.
    dec: DEC-156

tasks:
  - id: T-01
    title: Discriminate an absent return from an empty one in validate-digest.py hook mode
    traces: [REQ-01, REQ-02]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, validate-digest.py is the registered SubagentStop validator
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/validate-digest.py
    verify: |
      V=.claude/skills/harness/bin/validate-digest.py
      grep -qi 'not validated' "$V" || exit 1
      printf '%s' '{"agent_type":"harness-qa","last_assistant_message":"   "}' | python3 "$V" --hook
      test "$?" -eq 2 || exit 1
      printf '%s' '{"agent_type":"harness-qa"}' | python3 "$V" --hook
      test "$?" -eq 0 || exit 1
      printf '%s' '{"agent_type":"harness-qa","last_assistant_message":null}' | python3 "$V" --hook
      test "$?" -eq 0 || exit 1
      echo OK
    intent: |
      In .claude/skills/harness/bin/validate-digest.py, inside hook_mode(), replace the single
      truthiness branch that currently reads

        text = d.get("last_assistant_message") or ""
        if not text.strip(): ... return 0

      with a branch that discriminates on PRESENCE. Read the raw value once with a sentinel, so
      the three states are distinguishable:

      1. The key "last_assistant_message" is ABSENT from the payload mapping, or its value is
      None. This is OUR gap: the platform supplied nothing to validate. Keep exit 0. Print to
      stderr one line naming the persona and saying explicitly that the return was NOT VALIDATED
      -- not that it was passed through as acceptable. The line must contain the literal words
      "not validated" so a reader and a test can both find it. Do not write to any file. And, in
      the same self-attributing form the file's other own-bug branches use, state plainly that this
      is our gap and not {agent}'s -- e.g. `check-digest: {agent}'s return carries no
      last_assistant_message (absent or null) -- this is our gap, not {agent}'s; the return was NOT
      VALIDATED.`
      The example spells it NOT VALIDATED and the required literal is "not validated": every check
      of these words -- this task's verify and T-02's cases 2 and 3 -- matches CASE-INSENSITIVELY,
      so either spelling satisfies them. Pick one and use it in both branches of the line.

      2. The value is a string (or any non-None value whose str() is taken) that is empty or
      whitespace-only after .strip(). This is the PERSONA'S contract violation: a harness persona
      that produced no final message returned nothing, which the digest contract forbids. Exit 2,
      which prevents the subagent from stopping. The message must name the persona from `agent`
      and state that a structured return is required, in the same voice the other contract
      violations in this file use, so the agent that receives it can act on it.

      3. Any other value: unchanged behaviour, fall through to validate() exactly as today with
      the value coerced to str.

      Two existing behaviours MUST be preserved verbatim and are ahead of this branch already --
      do not move, reorder or weaken either: the non-harness-persona early return, and the
      `if d.get("stop_hook_active"): return 0` passthrough. The second one means a re-prompted
      return is not re-validated; that hole is pre-existing, deliberate, and out of scope here.
      Do not close it and do not comment as if this change closed it.

      Fail-open discipline (DEC-127) is otherwise unchanged: an unreadable payload, an unknown
      persona or an exception in this file still exits 0 and says so on stderr. The ONLY direction
      this task changes is state 2, from exit 0 to exit 2.

      Carry a comment above the branch stating why presence rather than truthiness: absent, null
      and empty were one branch, so the platform's gap and the persona's violation were
      indistinguishable, and five empty returns in FEAT-45 were recovered only because leads
      re-measured. Do not add a marker comment pair; T-02's red proof does not need one.

  - id: T-02
    title: Test the empty-versus-absent discrimination and prove it can report red
    traces: [REQ-01, REQ-02, REQ-05, REQ-06]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, test-validate-digest.py is the validator gate's own test
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/test-validate-digest.py
    verify: |
      python3 .claude/skills/harness/bin/test-validate-digest.py \
        && python3 .claude/skills/harness/bin/test-run-unit-tests-kinds.py \
        && grep -q 'empty-red' .claude/skills/harness/bin/test-validate-digest.py \
        && grep -q 'not validated' .claude/skills/harness/bin/test-validate-digest.py \
        && grep -q 'null-passthrough' .claude/skills/harness/bin/test-validate-digest.py \
        && test "$(grep -cF 'pass-through: empty last_assistant_message passes with a stated reason' .claude/skills/harness/bin/test-validate-digest.py)" -eq 0
    intent: |
      Add FOUR cases to .claude/skills/harness/bin/test-validate-digest.py, reusing the payload and
      subprocess helpers that file already has. Read them first; do not build a second harness.
      Every case must assert on the EXIT CODE and on the captured stderr TEXT, and must capture
      output by subprocess capture or command substitution -- never by piping to head or tail,
      which reports the pipe's status rather than the script's.

      Name each case with the token below in its description, because this task's verify greps for
      three of them.

      1. empty-string -- payload {"agent_type": "harness-qa", "last_assistant_message": "   \n"}.
      Assert exit 2 AND that stderr names harness-qa. This is the issue-1056 direction.

      2. absent-key -- the same payload with the key omitted entirely. Assert exit 0 AND that
      stderr carries the words "not validated", matched CASE-INSENSITIVELY because T-01's line may
      spell them either way. Exit 0 alone is not enough: it is what the broken code also returned,
      so the words are what discriminate the fix from the defect. Assert in the same case that the
      line attributes the gap to US and not to the persona, by requiring the word "our" alongside
      the persona name -- a fail-open line an agent reads as "you failed" is the confusion this
      branch exists to end.

      3. null-passthrough -- the same payload with the value explicitly null. Assert exit 0 and the
