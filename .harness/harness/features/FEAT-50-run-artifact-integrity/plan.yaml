  - id: T-04
    title: Refuse a run digest write that would destroy the recorded digest
    traces: [REQ-04]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, check-domain.sh is the registered PreToolUse domain gate
    depends_on: [T-03]
    status: pending
    files:
      - .claude/skills/harness/bin/check-domain.sh
    intent: |
      Add a fifth shape-rule family to .claude/skills/harness/bin/check-domain.sh covering the
      lead's run digest, beside the four that exist.

      1. Define RE_RUN_DIGEST as ^\.harness/[^/]+/features/[^/]+/runs/[^/]+/digest\.md$ next to
      RE_STATE_YAML. Do NOT add it to SHAPE_PATTERNS. has_shape_rules() gates ONLY the POST
      named-target route (check-domain.sh:1377); the PRE Write route builds its target
      unconditionally (:1367-1370) and reaches shape_problems() regardless. Adding the pattern to
      SHAPE_PATTERNS therefore buys the PRE route nothing and opens the POST route to one extra
      read of the file it just wrote, for a comparison of that file with itself that can never
      fire. Leaving it out is what makes the rule PRE-only by construction rather than by accident.

      2. Do NOT add a corresponding glob to the post-hoc sweep pattern list either, and carry a
      comment saying why in as many words: the sweep runs AFTER the write, where the prior content
      is already gone, so the same comparison there could only compare a file with itself. A check
      that cannot fire is worse than no check, because a reader trusts it. The same sentence
      explains the SHAPE_PATTERNS omission in step 1; write it once, covering both.

      3. shape_problems() currently takes (rel, content, display). Add a fourth parameter carrying
      the ABSOLUTE path of the file the write is aimed at, default None, and thread it from ALL
      THREE `targets` construction sites. There are three, not two, and every one must be widened
      together: the PRE Write route at check-domain.sh:1369-1370, the POST named-target route at
      :1381, and the sweep's append at :1505. The read-back at :1546 is a strict 3-tuple
      destructure (`for _rel, _text, _disp in targets:`), so 4-tuples from two sites and a 3-tuple
      from the third is a ValueError -- exit 1, non-blocking, and every Bash sweep silently off,
      which the existing sweep cases in test-check-domain.py would turn red. Value per site:
      os.path.abspath of the write's own target on the PRE and POST named-target routes, and the
      swept path itself on the sweep route. Then add a branch guarded by RE_RUN_DIGEST.match(rel)
      that reads the file at that absolute path.

      Read the file at the write's own absolute target path — the `target` the pre route already
      holds — never `os.path.join(root, rel)`. `rel` here comes from `_norm`, which STRIPS the
      worktree prefix (`check-domain.sh:1007-1013`), so joining it to `root` names the main
      checkout's copy of a worktree-resident digest: the guard would read a file that does not
      exist and allow the clobber, or refuse a legitimate write against another checkout's file.
      Compare against the copy the write will actually replace.

      With that path in hand:

      - The file does not exist, or exists and is empty or whitespace-only: no problem. Creating a
        digest and filling an empty one are both legitimate.
      - The file exists with non-empty content and that content, compared verbatim, IS a prefix of
        the incoming payload content: no problem. A lead appending to or extending its own digest
        within one run is legitimate and must not be refused.
      - The file exists with non-empty content that is NOT a prefix of the payload: append a
        problem, which the pre route turns into a denial at exit 2. The message must say that the
        run digest already holds a recorded digest, that this write would replace rather than
        extend it, and that the remedy is to write this run's digest into a run directory of its
        own. Name the file with the display path so the checkout is identifiable. This is the only
        place a lead learns why its write was refused, so naming the path alone is not enough.
      - An OSError reading the file: append no problem and fire nothing. The gate must not deny a
        write because it could not read the old file.
      - The absolute path parameter is None: append no problem. A caller that cannot say which file
        it means must not produce a refusal.

      Compare the raw text as read, decoding as utf-8 with errors replaced, exactly as the sweep
      does. Do not normalise whitespace or line endings: a normalising comparison would accept a
      rewrite that silently drops content, which is the defect.

      What this rule does and does not reach, and it must be stated in the code comment too. The
      PRE route is `Write`-only (check-domain.sh:1367-1368: `if _tool != "Write" or not target:
      sys.exit(0)`), so the guarantee is exactly this: a `Write` that would replace an existing
      non-empty runs/<runid>/digest.md is refused. An `Edit`, a `NotebookEdit` or a `cat >` from
      Bash reaches no enforcement point at all. Do not write a comment implying otherwise.

      Carry a comment recording the defect: harness-team/SKILL.md states that the run dir is the
      lead's alone but nothing enforced uniqueness, <run_dir>/digest.md was a plain overwrite, and a
      lead reusing a run directory across cycles destroyed the cycle-0 record.
    verify: |
      bash -n .claude/skills/harness/bin/check-domain.sh || exit 1
      python3 - <<'EOF'
      import json, os, subprocess, tempfile
      HOOK = os.path.abspath('.claude/skills/harness/bin/check-domain.sh')
      d = os.path.realpath(tempfile.mkdtemp())
      os.makedirs(os.path.join(d, '.harness'))
      with open(os.path.join(d, '.harness', 'team-config.yaml'), 'w') as fh:
          fh.write('schema_version: 1\nteams: []\n')
      p = os.path.join(d, '.harness', 'harness', 'features', 'FEAT-X', 'runs', 'r1')
      os.makedirs(p)
      f = os.path.join(p, 'digest.md')
      with open(f, 'w', encoding='utf-8') as fh:
          fh.write('recorded cycle-0 text\n')
      env = dict(os.environ, CLAUDE_PROJECT_DIR=d, HARNESS_PROJECT_DIR=d)
      def fire(content, *flags):
          pay = {"tool_name": "Write", "tool_input": {"file_path": f, "content": content}}
          return subprocess.run([HOOK, *flags], input=json.dumps(pay), capture_output=True,
                                text=True, env=env)
      bad = fire('a wholly different digest\n')
      good = fire('recorded cycle-0 text\nand more\n')
      post = fire('a wholly different digest\n', '--post')
      assert bad.returncode == 2, f'clobber not refused: {bad.returncode} {bad.stderr[:300]}'
      assert 'digest' in bad.stderr, f'refusal does not name the digest: {bad.stderr[:300]}'
      assert good.returncode == 0, f'prefix append refused: {good.returncode} {good.stderr[:300]}'
      assert post.returncode == 0, f'post route must stay silent: {post.returncode}'
      print('OK')
      EOF

