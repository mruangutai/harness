      4. empty-red -- the proof that case 1 CAN fail. Write a copy of validate-digest.py beside the
      original, in the script's OWN directory, under a dot-prefixed name made UNIQUE PER PROCESS by
      including os.getpid() (D-07: that directory is shared and tracked and features run in
