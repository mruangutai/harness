      hook_mode() empty branch is reverted to the truthiness form -- locate the branch by its own
      source text, not by
      a line number and not by any commit ref, relative or pinned. Copy the file mode from the
      original. Remove the mutant in a finally block. Run BOTH the real script and the mutant over
      the SAME empty-string payload of case 1 and assert all four of: the mutant text DIFFERS from
      the source; the mutant did not crash, by requiring its exit code to be 0 or 2 and its stderr
      to carry no python traceback, so a SyntaxError or NameError cannot masquerade as a passing
      return; the real script exits 2; and the mutant exits 0. Fail loudly as INCONCLUSIVE if the
      source text the case searched for was not found or the copy is byte-identical to the
