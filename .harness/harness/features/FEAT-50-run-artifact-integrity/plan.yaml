  - id: T-03
    title: Bind a governed agent's feature-artifact write to that feature's worktree
    traces: [REQ-03]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, check-domain.sh is the registered PreToolUse domain gate
    depends_on: [T-08]
    status: done
    files:
      - .claude/skills/harness/bin/check-domain.sh
    intent: |
      Add ONE narrowing check to .claude/skills/harness/bin/check-domain.sh, placed on the ALLOW
      branch inside domain_check() so it runs ONLY after the domain verdict for the target is
      otherwise an allowance. It must never turn a refusal into an allowance and never widen a
      glob.

      What it decides. Take the target's repo-relative path as the gate already computes it on the
      domain route -- `_verdict["rel"]`, which harness_boundary.classify returns RAW, without the
      worktree prefix stripped -- and match it against ^\.harness/[^/]+/features/([^/]+)/ to lift
      the feature id from the PATH ITSELF. Do not read harness_feature or any other payload key:
      presence of that key varies by route, and the target path is present on every route. Because
      that rel is raw, the anchored pattern matches a MAIN-checkout target and never a
      worktree-resident one; that is the shape #1057 measured -- six main-checkout writes, zero
      sibling-worktree ones -- and this check claims no more than it reaches. If the path does not
      match, this check says nothing.

      With a feature id in hand, call harness_boundary.worktree_for_feature(root, feature_id) --
      the helper T-08 lands, which selects by PREFIX and refuses on ambiguity; do not re-derive the
      selection here and do NOT match worktree basenames for equality, which this repository has
      already measured false (feature-worktree.py:236-248). This task is the CUTOVER that makes the
      gate use it, and the cutover is layer 0 under DEC-174 even though the helper itself is not:
      check-domain.sh is a registered PreToolUse gate, so this edit is main-session-direct while
      T-08's library edit is a team task. Treat a None return as "no registered worktree". Then:

      - No registered worktree for that feature: the check does NOT fire. Exit unchanged. A feature
        developed in the main checkout is legitimate and this rule must not forbid it.
      - A registered worktree exists and the target resolves inside it: allowed, unchanged. Note
        this branch is not reached on the domain route today, because a worktree-resident target
        does not match the raw-rel pattern above, so the check is skipped rather than taken. The
        outcome is identical; write the branch anyway so the rule is total and stays correct if the
        extraction ever consumes a stripped path.
      - A registered worktree exists and the target resolves in the MAIN checkout: DENY at exit 2.
        The message must name the target path as the gate displays it (unstripped, so the checkout
        is identifiable), name the worktree the write belonged in, and say plainly that the write
        belongs in that worktree. Without the second path the agent cannot act on the refusal.
      - worktree_for_feature raises harness_boundary.AmbiguousWorktree, meaning two registered
        worktrees both prefix this feature id: DENY at exit 2, naming the candidates the exception
        carries. A guess here binds the write to a checkout nobody chose, and a silent skip turns
        the gate off for exactly the setup that most needs it. Catch this exception specifically,
        ahead of the broad absorbing catch below.

      Decide containment with harness_boundary.checkout_relative(target): the target is inside the
      selected worktree when checkout_relative names that checkout, and in the main checkout when
      it names none. Do NOT compare realpath strings with startswith -- a sibling checkout whose
      name prefixes the selected one would be misclassified as inside it, which is the
      prefix-collision class harness_boundary already fixed once in issue 103. Treat an exception
      from the lookup as ABSORBING -- print nothing, fire nothing, leave the prior verdict
      standing. An unhandled exception here exits 1, which is non-blocking, so the write would land
      and the domain gate would go silently off.

      Placement constraints, all load-bearing:
      - Write the check as ONE function and call it from the ALLOW branch inside domain_check() at
        check-domain.sh:835-841, immediately before approval_guard(rel, agent). Both names it needs
        are already bound there: `_verdict` and `rel` (bound at :833). approval_guard sits on that
        same branch for exactly this reason -- a check on the DENY path never fires for an agent
        that HOLDS the grant, and every persona granted a feature path holds it, so the deny path
        is the one place this rule could never bite.
      - Also call it from the `shared` branch at check-domain.sh:843-848, before that branch's
        return. `shared` is check-domain.sh's SECOND allowance (DEC-85), so a rule naming only
        outcome == "allow" leaves an unbound main-checkout write through the one outcome nobody
        thought to name.
      - domain_check() is itself reached only under `if _run_domain and not _no_parser:`
        (check-domain.sh:872), so in a PyYAML-bootstrap session this binding does not run at all
        while T-04's shape-phase rule still does. That is disclosed in BRIEF.md's
        `## Verification gaps` and is NOT to be worked around here: making the domain route
        parser-free is a different change.
      - The rule binds governed agents and not the main session, because domain_check() runs on the
        governed-agent PreToolUse route only. Issue 1057 is about agents, and the main session
        legitimately writes the main checkout's copy at merge time, after the feature's worktree has
        been removed but possibly before -- denying it would wedge the ship flow.
      - AFTER the raw-then-worktree-stripped candidate match, never inside it. DEC-143's two-
        candidate match is the design that lets an agent in a worktree write what its domain grants;
        this check consumes its result and must not alter which globs are tried or in what order.
      - Do not add a pattern to SHAPE_PATTERNS or to the sweep pattern list. This is a DOMAIN
        question, not a shape question: it is about which checkout, not about what the file
        contains.

      Carry a comment stating the measured defect it closes: because the stripped path matches the
      same globs by design, a write to the MAIN checkout's copy of a feature path is equally
      domain-legal, so nothing bound a write to the checkout the agent was dispatched into. Six
      such writes happened during FEAT-45 and three of the artifacts existed nowhere else.
    verify: |
      bash -n .claude/skills/harness/bin/check-domain.sh || exit 1
      python3 - <<'EOF'
      import json, os, subprocess, tempfile
      HOOK = os.path.abspath('.claude/skills/harness/bin/check-domain.sh')
      MAN = ("schema_version: 1\nteams:\n  - name: build\n    members:\n"
             "      - name: harness-documentor\n        domain:\n"
             "          - { path: .harness/*/features/*/BRIEF.md, upsert: true }\n")
      REL = '.harness/harness/features/FEAT-X-thing/BRIEF.md'
      def root(register):
          d = os.path.realpath(tempfile.mkdtemp())
          os.makedirs(os.path.join(d, '.harness'))
          with open(os.path.join(d, '.harness', 'team-config.yaml'), 'w') as fh:
              fh.write(MAN)
          os.makedirs(os.path.dirname(os.path.join(d, REL)))
          if register:
              wt = os.path.join(d, 'wt', 'FEAT-X')
              e = os.path.join(d, '.git', 'worktrees', 'FEAT-X')
              os.makedirs(e); os.makedirs(wt)
              with open(os.path.join(wt, '.git'), 'w') as fh:
                  fh.write('gitdir: %s\n' % e)
              with open(os.path.join(e, 'gitdir'), 'w') as fh:
                  fh.write('%s\n' % os.path.join(wt, '.git'))
          return d
      def fire(d):
          pay = {"agent_type": "harness-documentor", "tool_name": "Write",
                 "tool_input": {"file_path": os.path.join(d, REL), "content": "x"}}
          return subprocess.run([HOOK], input=json.dumps(pay), capture_output=True, text=True,
                                env=dict(os.environ, CLAUDE_PROJECT_DIR=d, HARNESS_PROJECT_DIR=d))
      bound, free = fire(root(True)), fire(root(False))
      assert free.returncode == 0, f'control: {free.returncode} {free.stderr[:300]}'
      assert bound.returncode == 2, f'not refused: {bound.returncode} {bound.stderr[:300]}'
      assert 'FEAT-X' in bound.stderr, f'worktree unnamed: {bound.stderr[:300]}'
      print('OK')
      EOF
      bash .claude/skills/harness/bin/check-domain.sh --resolve \
        .claude/skills/harness/bin/check-domain.sh | grep -q 'harness-backend-dev'

  - id: T-04
    title: Refuse a run digest write that would destroy the recorded digest
    traces: [REQ-04]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out, check-domain.sh is the registered PreToolUse domain gate
    depends_on: [T-03]
    status: done
    files:
      - .claude/skills/harness/bin/check-domain.sh
    intent: |
      Add a fifth shape-rule family to .claude/skills/harness/bin/check-domain.sh covering the
      lead's run digest, beside the four that exist.

      1. Define RE_RUN_DIGEST as ^\.harness/[^/]+/features/[^/]+/runs/[^/]+/digest\.md$ next to
      RE_STATE_YAML. Do NOT add it to SHAPE_PATTERNS. has_shape_rules() gates ONLY the POST
      named-target route (check-domain.sh:1377); the PRE Write route builds its target
      unconditionally (:1367-1370) and reaches shape_problems() regardless. Adding the pattern to
      SHAPE_PATTERNS therefore buys the PRE route nothing and opens the POST route to one extra
      read of the file it just wrote, for a comparison of that file with itself that can never
      fire. Leaving it out is what makes the rule PRE-only by construction rather than by accident.

      2. Do NOT add a corresponding glob to the post-hoc sweep pattern list either, and carry a
      comment saying why in as many words: the sweep runs AFTER the write, where the prior content
      is already gone, so the same comparison there could only compare a file with itself. A check
      that cannot fire is worse than no check, because a reader trusts it. The same sentence
      explains the SHAPE_PATTERNS omission in step 1; write it once, covering both.

      3. shape_problems() currently takes (rel, content, display). Add a fourth parameter carrying
      the ABSOLUTE path of the file the write is aimed at, default None, and thread it from ALL
      THREE `targets` construction sites. There are three, not two, and every one must be widened
      together: the PRE Write route at check-domain.sh:1369-1370, the POST named-target route at
      :1381, and the sweep's append at :1505. The read-back at :1546 is a strict 3-tuple
      destructure (`for _rel, _text, _disp in targets:`), so 4-tuples from two sites and a 3-tuple
      from the third is a ValueError -- exit 1, non-blocking, and every Bash sweep silently off,
      which the existing sweep cases in test-check-domain.py would turn red. Value per site:
      os.path.abspath of the write's own target on the PRE and POST named-target routes, and the
      swept path itself on the sweep route. Then add a branch guarded by RE_RUN_DIGEST.match(rel)
      that reads the file at that absolute path.

      Read the file at the write's own absolute target path — the `target` the pre route already
      holds — never `os.path.join(root, rel)`. `rel` here comes from `_norm`, which STRIPS the
      worktree prefix (`check-domain.sh:1007-1013`), so joining it to `root` names the main
      checkout's copy of a worktree-resident digest: the guard would read a file that does not
      exist and allow the clobber, or refuse a legitimate write against another checkout's file.
      Compare against the copy the write will actually replace.

      With that path in hand:

      - The file does not exist, or exists and is empty or whitespace-only: no problem. Creating a
        digest and filling an empty one are both legitimate.
      - The file exists with non-empty content and that content, compared verbatim, IS a prefix of
        the incoming payload content: no problem. A lead appending to or extending its own digest
        within one run is legitimate and must not be refused.
      - The file exists with non-empty content that is NOT a prefix of the payload: append a
        problem, which the pre route turns into a denial at exit 2. The message must say that the
        run digest already holds a recorded digest, that this write would replace rather than
        extend it, and that the remedy is to write this run's digest into a run directory of its
        own. Name the file with the display path so the checkout is identifiable. This is the only
        place a lead learns why its write was refused, so naming the path alone is not enough.
      - An OSError reading the file: append no problem and fire nothing. The gate must not deny a
        write because it could not read the old file.
      - The absolute path parameter is None: append no problem. A caller that cannot say which file
        it means must not produce a refusal.

      Compare the raw text as read, decoding as utf-8 with errors replaced, exactly as the sweep
      does. Do not normalise whitespace or line endings: a normalising comparison would accept a
      rewrite that silently drops content, which is the defect.

      What this rule does and does not reach, and it must be stated in the code comment too. The
      PRE route is `Write`-only (check-domain.sh:1367-1368: `if _tool != "Write" or not target:
      sys.exit(0)`), so the guarantee is exactly this: a `Write` that would replace an existing
      non-empty runs/<runid>/digest.md is refused. An `Edit`, a `NotebookEdit` or a `cat >` from
      Bash reaches no enforcement point at all. Do not write a comment implying otherwise.

      Carry a comment recording the defect: harness-team/SKILL.md states that the run dir is the
      lead's alone but nothing enforced uniqueness, <run_dir>/digest.md was a plain overwrite, and a
      lead reusing a run directory across cycles destroyed the cycle-0 record.
    verify: |
      bash -n .claude/skills/harness/bin/check-domain.sh || exit 1
      python3 - <<'EOF'
      import json, os, subprocess, tempfile
      HOOK = os.path.abspath('.claude/skills/harness/bin/check-domain.sh')
      d = os.path.realpath(tempfile.mkdtemp())
      os.makedirs(os.path.join(d, '.harness'))
      with open(os.path.join(d, '.harness', 'team-config.yaml'), 'w') as fh:
          fh.write('schema_version: 1\nteams: []\n')
      p = os.path.join(d, '.harness', 'harness', 'features', 'FEAT-X', 'runs', 'r1')
      os.makedirs(p)
      f = os.path.join(p, 'digest.md')
      with open(f, 'w', encoding='utf-8') as fh:
          fh.write('recorded cycle-0 text\n')
      env = dict(os.environ, CLAUDE_PROJECT_DIR=d, HARNESS_PROJECT_DIR=d)
      def fire(content, *flags):
          pay = {"tool_name": "Write", "tool_input": {"file_path": f, "content": content}}
          return subprocess.run([HOOK, *flags], input=json.dumps(pay), capture_output=True,
                                text=True, env=env)
      bad = fire('a wholly different digest\n')
      good = fire('recorded cycle-0 text\nand more\n')
      post = fire('a wholly different digest\n', '--post')
      assert bad.returncode == 2, f'clobber not refused: {bad.returncode} {bad.stderr[:300]}'
      assert 'digest' in bad.stderr, f'refusal does not name the digest: {bad.stderr[:300]}'
      assert good.returncode == 0, f'prefix append refused: {good.returncode} {good.stderr[:300]}'
      assert post.returncode == 0, f'post route must stay silent: {post.returncode}'
