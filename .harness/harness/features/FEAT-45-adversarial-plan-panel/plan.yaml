      empty, append to bad: the plan is signed with no panel result recorded. This is the
      REQ-10 hole, and it is the direction T-08's inv32-red case proves can fail.

      2. For every findings entry whose severity is high, critical, or unrated, the entry must
      either carry disposition resolved, or be named by an approval.rulings entry with
      ruling overrule. Neither, append to bad naming the finding id. Treat unrated exactly as
      high -- an omitted severity must not ungate.

      3. Every approval.rulings entry must carry a non-empty who and a date matching
      ^[0-9]{4}-[0-9]{2}-[0-9]{2}$. Missing or malformed either, append to bad: an
      unattributed overrule is indistinguishable from a resolved finding afterwards, which is
      exactly what REQ-08 forbids.

      4. Every approval.rulings entry's finding id must be present in panel.findings. Absent,
      append to bad as a STALE OVERRIDE naming the id. This message is the ONE place the
      operator learns why a concern they already ruled on is blocking again, so it must EXPLAIN
      itself and not only name the id: it must contain the literal words "reworded" and
      "asked again", in a sentence saying that a reworded finding gets a NEW content-hash id,
      that the ruling recorded against the old id therefore stopped applying, and that the
      operator is being asked again about what may be the same concern. Without that sentence
      the operator sees an unfamiliar PF- id and cannot tell a new objection from the one they
      settled last cycle; the explanation exists nowhere else they read.

      5. panel.readers must be a list naming EVERY reader the panel defines -- should-not-exist,
      scope and goalcheck -- each entry carrying a reader and a status of exactly ran or
      skipped, and, when status is skipped, a non-empty persona and a non-empty reason.
      A reader MISSING from panel.readers, or one carrying a status that is neither ran nor
      skipped, or one skipped with no persona or no reason, appends to bad naming that reader.
      This is the REQ-14 hole and it fails closed: a reader that never ran contributes zero
      findings entries and is therefore indistinguishable, from findings alone, from a reader
      that ran and found nothing. The message must contain the literal words "never ran", in a
      sentence saying that an unrecorded reader is not a clean reader -- that is the string this
      task's verify greps for, and the distinction exists nowhere else the operator reads.
      A reader recorded as skipped WITH its persona and reason present is NOT a bad entry.
      Append it to warn instead, naming the reader and the persona, so the skip is visible at
      the signature and can never be a silent pass. Do NOT gate on a skip: the adversarial
      reader's persona is defined outside this repository (D-14) while the team file ships as
      doctrine to every project (D-09), so hard-failing an absent persona would break this gate
      in every project that lacks it -- the opposite of what REQ-14 asks, which is that the skip
      be RECORDED and SEEN, not that it be impossible.

      Read every value defensively with .get and isinstance -- a hand-edited plan.yaml may
      carry a string where a list belongs, and an exception here takes the whole gate down.
      A malformed panel or rulings value is itself a bad entry, never a silent skip.

