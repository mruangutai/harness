approval:
  # Written by the MAIN SESSION only, because it is the only tier with a user channel
  # (DEC-120). Neither pm nor the orchestrator writes it. Note that check-domain.sh's
  # approval_guard is MEASURED FAIL-OPEN inside a worktree, so this rule held here by
  # instruction rather than by enforcement.
  # SIGNED 2026-08-30, first signature. Covers 11 tasks, REQ-01..REQ-14, SC-01..SC-17.
  # The operator confirmed three consequences of the independent-model ruling at signature:
  # (1) THE READER PERSONA IS REPINNED general-purpose -> fable-advisor. This is what makes
  #     REQ-02's model half deliverable at all: general-purpose is a platform built-in with
  #     no definition file and therefore no model pin, while ~/.omp/agent/agents/fable-advisor.md
  #     carries `model: anthropic/claude-fable-5` in its own frontmatter, and
  #     dispatch-guard.sh:41-51 blocks only a caller PASSING model:, never a dispatched
