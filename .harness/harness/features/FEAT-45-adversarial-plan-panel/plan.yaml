        && OUT="$(bash .claude/skills/harness/bin/run-unit-tests.sh --kind unit)" \
        && printf '%s\n' "$OUT" | grep -q 'test-panel-findings.py' \
        && A="$(python3 .claude/skills/harness/bin/panel_findings.py id --reader scope --summary 'T-04 traces REQ-99, which does not exist')" \
        && B="$(python3 .claude/skills/harness/bin/panel_findings.py id --reader scope --summary '  t-04   TRACES   req-99, which does not exist  ')" \
        && test "$A" = "$B" \
        && test 11 -eq "${#A}" \
        && C="$(python3 .claude/skills/harness/bin/panel_findings.py id --reader scope --summary 'T-04 traces REQ-98, which does not exist')" \
        && test "$A" != "$C"
    intent: |
      Create .claude/skills/harness/bin/panel_findings.py -- the ONE place a panel finding's
      identity is computed, so the validator lead, pm and check-state.sh cannot disagree about
      what a finding is called. python3 stdlib only, no third-party import.

      The identity, exactly. Normalize the summary by lowercasing it, replacing every run of
      whitespace with a single space, and stripping leading and trailing whitespace. Build the
      digest input as the reader id, a single newline, then the normalized summary, encoded
      utf-8. Take sha256 of that and return the literal prefix PF- followed by the first 8
      characters of the lowercase hex digest. Total length 11.

      WHY a content hash and not a sequential id, as a module docstring: a sequential id is
      assigned per run, so a re-run renumbers and an overrule recorded against finding 2
      silently starts covering whatever is second next time. A content hash keeps an unchanged
      finding's id stable across runs, so an overrule survives a re-run, and gives a REWORDED
      finding a NEW id, so the old ruling stops applying and check-state.sh reports it as a
      stale override. That failure direction is deliberate and it is closed, not open.

      Expose:
        finding_id(reader, summary) -> str
        normalize_summary(summary) -> str
        a CLI: `panel_findings.py id --reader R --summary S` printing the id and exiting 0,
        and exiting 2 with a message on an empty reader or an empty normalized summary --
        an id computed over nothing would collide across every such finding.

      Create .claude/skills/harness/bin/test-panel-findings.py in the style of the other
      test-*.py files in that directory -- read one first and match its check/ran/fails
      counting shape, and count cases rather than asserting a frozen total.

      Cases, each an independent assertion:
        the id is PF- plus 8 lowercase hex, length 11
        whitespace, case and surrounding padding do not change the id
        a one-character change to the summary DOES change the id
        the same summary under two different readers gives two different ids
        an empty reader exits 2, and a whitespace-only summary exits 2
        a unicode summary round-trips without raising

      Then register it in run-unit-tests.sh by appending the literal string
      test-panel-findings.py to the UNIT_SCRIPTS array. Do NOT add it to
      INTEGRATION_SCRIPTS and do NOT touch harness.json: the runner's KIND-DRIFT check
      requires that no UNIT_SCRIPTS name appears in harness.json's integration.detect, so
      adding it there would fail the runner. The runner's own drift detector fails any
      test-*.py in the directory that is in neither array, so the registration is not
      optional.

