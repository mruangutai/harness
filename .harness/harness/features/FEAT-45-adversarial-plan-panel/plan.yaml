decisions:
  - id: D-01
    choice: >-
      The panel is TWO orchestrator-sequenced squad segments and only the validator segment
      is a team file. The product segment (pm's goal-check against stated intent) is
      orchestrator playbook text, dispatched to harness-product-lead as its own run.
    because: >-
      DEC-118 makes a team single-squad, so one file carrying pm and code-reviewer is
      unrunnable.
    dec: DEC-118
  - id: D-02
    choice: >-
      The product segment runs FIRST and its goal-check note is an INPUT to both validator
      steps. The validator lead's digest then returns to pm, which records the panel result
      in plan.yaml before the plan is presented.
    because: >-
      Intent misalignment is the evidence the should-not-be-built reader needs, and reading
      it second would make it re-derive what pm already established.
    dec: none
  - id: D-03
    choice: >-
      The adversarial reader is a spawned non-harness subagent with an EMPTY outputs list.
      Its findings reach disk only by the validator lead transcribing them into the lead's
      own run digest under runs/<runid>-validator/.
    because: >-
      A read-only non-harness persona holds no grant, which is the measured hand-run failure,
      and an empty outputs list costs zero grant widening.
    dec: DEC-116
  - id: D-04
    choice: >-
      The reader is independent of the authoring MODEL as well as of the authoring dispatch
      chain. Model independence is CLAIMED, and it is delivered by the reader persona's own
      model pin in its own frontmatter, never by anything a lead passes.
    because: >-
      MEASURED 2026-08-30. dispatch-guard.sh:41-51 blocks a lead from PASSING a model in a
      dispatch, and states the rule it is enforcing in its own comment: a member runs on the
      model pinned in its agent frontmatter, and that pin is org design. The guard does not
      strip the target's own pin, and it exits 0 recording no claim for any persona whose name
      does not start with harness-. So a lead that spawns a self-pinning persona without
      passing a model gets that persona's pinned model, and model independence survives lead
      dispatch. The c1 draft inferred the opposite from this same guard and that inference was
      FALSE. DEC-170's turn-level advisor channel is separately unattached on this workstation,
      advisorModel being absent from the user settings file, which bounds the CHANNEL and says
      nothing about a frontmatter pin. Independence from the dispatch chain remains true and is
      ADDITIONAL to model independence, not a replacement for it.
    dec: DEC-170
  - id: D-05
    choice: >-
      A panel finding's identity is a CONTENT HASH, spelled PF- followed by the first 32 hex
      characters of sha256 over the reader id, a newline, and the finding summary lowercased
      with whitespace collapsed. It is computed ONCE, by harness-pm at transcription, through
      panel_findings.py. The validator lead never computes it: its tools are read, glob, grep,
      task, write, so it cannot run the helper, and it de-duplicates on the normalized summary
      plus the reader id instead.
    because: >-
      A sequential id is assigned per run, so a re-run renumbers and an overrule silently
      starts covering a different finding. A content hash keeps an unchanged finding's id
      stable and gives a reworded finding a NEW id, which fails closed by forcing a fresh
      ruling rather than carrying a stale one.
    dec: none
  - id: D-06
    choice: >-
      The reader's prompt contractually requires a self-emitted severity per finding, with
      the sentinel value unrated, and the lead treats unrated as gating-equivalent to high.
    because: >-
      The reader's return is validated by nothing, so an omitted severity must be
      transcribable as an absence instead of invented, and an absence must not ungate.
    dec: none
  - id: D-07
    choice: >-
      The panel RESULT is a new top-level panel key in plan.yaml, written by pm. The
      operator's RULING is approval.rulings, written by the main session. They are never
      the same key.
    because: >-
      check-domain.sh's approval_guard resolves approval as a whole YAML key range, so pm is
      locked out of every sub-key while main_session.writes already spans a rulings sibling
      at zero grant cost.
    dec: DEC-120
  - id: D-08
    choice: >-
      The machine check is INV-32, a new invariant inside check-state.sh, not a new script.
    because: >-
      It reads the same plan.yaml mapping INV-3 already loads and needs no new gate class.
      INV-32 is the lowest number no live invariant and no unbuilt plan claims.
    dec: DEC-179
  - id: D-09
    choice: >-
      The team file SHIPS at .claude/skills/harness/teams/plan-panel.yaml rather than the
      project override lane .harness/teams/. Resolution order is unchanged.
    because: >-
      The panel is standing harness doctrine for every project the factory is pointed at.
      The override lane exists for project-specific teams, and shipping doctrine there would
      make it invisible to every other repository.
    dec: DEC-113
  - id: D-11
    choice: >-
      Every panel reader step carries on_fail loop_back with max_cycles 1, feed self, and
      then escalate. Never then halt.
    because: >-
      The loop exists to re-prompt a reader whose return violated the contract, and halt at
      the cap would strand the plan with no route up while an always-high reader blocks it.
    dec: DEC-117
  - id: D-12
    choice: >-
      run-unit-tests.sh is NOT enforcement-path, so a test file's registration rides the same
      team task that authors it.
    because: >-
      It gates no write and adjudicates nothing. Splitting authoring from registration would
      leave a task whose own verify cannot assert its file is reachable, and the runner's own
      drift detector already fails an unregistered test file.
    dec: DEC-174
  - id: D-13
    choice: >-
      SC-04's failing-first obligation is discharged by a MARKER-ANCHORED MUTANT, never by a
      relative commit ref. T-07 brackets INV-32 with two column-zero comment lines,
      "INV-32 BEGIN (FEAT-45 T-07)" and "INV-32 END (FEAT-45 T-07)", and T-08's inv32-red case
      writes a copy of check-state.sh with that region removed, beside the original, and
      asserts the copy reports NOTHING about INV-32 over the same fixture the real gate
      reports it on.
    because: >-
      The obvious shape, reading the previous commit's copy of the gate through a relative
      commit ref, is broken and not merely fragile: the previous commit is not a fixed point.
      T-07 lands as its own commit, so when T-08's verify first runs, the previous commit
      ALREADY CARRIES INV-32 and the assertion is false; every later commit in the repository
      moves that ref one step further from the tree without INV-32, and test-check-state.py is
      in INTEGRATION_SCRIPTS, so it runs forever. The two alternatives lose for their own
      reasons: an explicitly pinned sha survives neither a history rewrite nor a shallow clone
      and rots into a permanent error, and a vendored frozen copy of a 1803-line enforcement
      script is a second gate in the tree that nobody maintains. The mutant depends on no git
      history at all, keeps passing at any future HEAD, and is the idiom test-check-state.py
      already uses twice for exactly this proof (T14_MARKER, T10_MARKER), which also carries
      the trap those cases record: the mutant must live beside the original, because a copy in
      the fixture tmpdir dies on import and exits non-zero, a green-looking proof that
      measured nothing.
    dec: none
  - id: D-14
    choice: >-
      The adversarial reader's persona is pinned as fable-advisor, and the allowlist that
      admits it is the spawns: frontmatter of .omp/agents/harness-validator-lead.md (T-06).
      The SPAWNS map in sync-agent-adapters.py is kept in step (T-11) but is NOT the shipped
      allowlist, and no assertion is made about spawns in .claude/agents/**. Because that
      persona's definition lives OUTSIDE this repository, REQ-14's absent-persona behaviour
      ships with the pin and is not optional.
    because: >-
      The persona has to deliver REQ-02's MODEL half, and general-purpose -- the c1 pin --
      cannot. It is a platform built-in with no agent-definition file anywhere, so it carries
      no model pin at all, so a lead spawning it gets the lead's own model and the model claim
      would be false. A model claim the pinned persona cannot keep is worse than no claim.
      MEASURED 2026-08-30: fable-advisor's frontmatter at ~/.omp/agent/agents/fable-advisor.md
      carries model anthropic/claude-fable-5 with tools read, glob, grep, bash, and its own
      description makes it a read-only second-opinion critic whose stated job is hunting work
      that should not be done at all. It is the one persona measured on this workstation that
      self-pins. It does not grow the roster: .omp/agents/ holds exactly 16 harness-*.md files
      and fable-advisor is not among them, so SC-06's census and SC-14's non-harness
      requirement both still hold, and no task in this plan adds its definition to this
      repository -- agent distribution is explicitly out of scope.
      MEASURED in the c1 fix cycle and STILL TRUE, four facts about the ALLOWLIST MECHANISM,
      whose only change here is the NAME. One, the host enforces spawns: as a hard allowlist at
      preflight: a general-purpose dispatch was refused with "Cannot spawn 'general-purpose'.
      Allowed: harness-product-lead,harness-eng-lead,harness-validator-lead", a list
      byte-identical to .omp/agents/harness-orchestrator.md's own spawns:, so the canonical
      frontmatter is the enforced source. Two, SPAWNS cannot ship it: it is read only by
      bootstrap_one() via --bootstrap-from-claude, and bootstrap() refuses to run while
      .omp/agents/harness-*.md exist. Three, claude_adapter() emits name, description, tools,
      color, model, effort and skills, so .claude/agents/** carries no spawns key and a check
      there could never pass. Four, nothing on disk validates a spawns ENTRY: check-omp-port.py
      only requires a list, and bootstrap_one() only requires that a non-empty list comes with
      the task tool, so a non-harness name is structurally accepted. Also measured, and the
      reason the dispatch guard does not obstruct this: it exits 0, recording no claim, when the
      dispatched persona does not start with harness-, so a lead MAY dispatch a non-harness
      reader and that reader keeps its own model pin.
      NOT determinable from disk, and therefore SC-16's live observation rather than a claim:
      whether the host RESOLVES fable-advisor to a runnable agent once the allowlist admits it.
      The c1 refusal fired at the allowlist, before resolution. Where it resolves to nothing --
      which is every project that lacks the operator's HOME definition -- REQ-14's recorded skip
      is the defined behaviour, not an error.
    dec: none

  - id: D-15
    choice: >-
      TEAMS_EXPECTED in test-harness-yaml-corpus.py is raised from 2 to 3 under FEAT-45's
      existing signature, as a new task rather than a re-signature. FEAT-06's SC-05 is NOT
      revisited: it reads "the directory's contents at completion are exactly two files", a
      point-in-time completion snapshot that was met at FEAT-06's completion and stays met.
      What is corrected is the CONSTANT, which generalised that snapshot into a standing
      invariant it never was.
    because: >-
      The third team definition is the signed product of T-02, whose only file is
      .claude/skills/harness/teams/plan-panel.yaml, whose status is done, and which traces
      REQ-01, REQ-02, REQ-04, REQ-05, REQ-09 and REQ-14 under the operator's signature of
      2026-08-30 covering REQ-01..REQ-14. A criterion that cannot be met as written needs the
      operator; an approved consequence that no task owns needs a task. This is the second.
      The comment's own prohibition is against widening the number SILENTLY, and a recorded
      ruling citing the requirement that forces the new file is the opposite of silent.
    dec: none
tasks:
  # DEPENDENCY POLICY, after the c1 efficiency pass. Eight edges in the c0 draft were measured
  # false -- the dependent never read the predecessor's output -- and are dropped: T-02<-T-01,
  # T-03<-T-02, T-04<-T-03, T-05<-T-02, T-06<-T-02, T-07<-T-05, T-09<-T-05, T-10<-T-06. A false
  # prerequisite is a claim about the code that is simply untrue, so they go for honesty, not
  # for speed: T-02 through T-08 are all main-session-direct and one agent runs them serially
  # whatever the DAG permits. Only two of the eight buy throughput, because each frees a
  # DIFFERENT lane: T-02<-T-01 frees harness-documentor to run concurrently with main-session
  # work (the largest saving), and T-09<-T-05 frees harness-dev-ops to start the helper
  # immediately. Every surviving edge carries its reason where it is declared. Tasks appear in
  # a topological order; T-11 sits before T-10 because T-10's case 8 grades T-11's output.
  - id: T-01
    title: Record the two structural carve-outs as signed decisions and regenerate the index
    traces: [REQ-11]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: []
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
      - .harness/harness/docs/DECISIONS-INDEX.md
    verify: |
      python3 .claude/skills/harness/bin/gen-decisions-index.py \
        && git -C . diff --quiet -- .harness/harness/docs/DECISIONS-INDEX.md \
        && python3 .claude/skills/harness/bin/test-gen-decisions-index.py \
        && grep -q 'wrapped non-harness reader' .harness/harness/docs/DECISIONS.md \
        && grep -q 'plan-phase gate' .harness/harness/docs/DECISIONS.md \
        && grep -q 'wrapped non-harness reader' .harness/harness/docs/DECISIONS-INDEX.md \
        && grep -q 'plan-phase gate' .harness/harness/docs/DECISIONS-INDEX.md
    intent: |
      Append TWO new entries to .harness/harness/docs/DECISIONS.md, at the end of the
      numbered sequence, taking the next two free DEC numbers. Read the last entry first and
      match its exact heading and field shape; do not invent a new one.

      Entry A, whose statement must contain the literal phrase "wrapped non-harness reader":
      a harness lead MAY dispatch a non-harness subagent as a panel reader and normalize its
      return into the lead's own digest. State the three facts that make this a precedent
      needing a signature. One, SubagentStop fires for that reader but validate-digest.py
      returns 0 immediately for a non-harness agent_type, so the reader's return is
      structurally unvalidated. Two, coverage therefore comes only from the wrapping lead's
      own stop event against the lead schema. Three, the compensating control is that the
      reader's prompt contractually requires a self-emitted severity per finding with the
      sentinel value "unrated", and the lead TRANSCRIBES an absence rather than inventing a
      value. State the shape-versus-content line explicitly: the lead owns SHAPE (schema
      conformance, finding identity, de-duplication, ranking, roll-up) and never CONTENT
      (whether a defect exists, and how severe the reader judged it). Record that "unrated"
      is treated as gating-equivalent to "high", so an omitted severity fails closed.

      Entry B, whose statement must contain the literal phrase "plan-phase gate": a gate MAY
      fire in the plan phase, before any code exists. State what is different about it: it
      grades a specification rather than a diff, so it has no review_sha to pin and no test
      suite to run, and its evidence is a reader's judgement recorded in a lead digest. State
      the bound that keeps it from becoming a second approval loop: findings enter the ONE
      batched review pass at the signature gate per DEC-176 and never open a separate
      pre-signature fix dispatch. State that a finding at high or worse withholds the
      presentation until it is resolved or the operator records an overrule, and that the
      operator, not the panel, is the terminus.

      Cite FEAT-45-adversarial-plan-panel as the origin in both entries.

      Then regenerate the index with the command in verify, and write each new row's ruling
      text yourself. The text after the " :: " separator on a row is the ONE part of
      DECISIONS-INDEX.md the generator does not produce -- its author writes it, in the same
      change that appends the entry -- so a regeneration alone leaves both rows empty and the
      index greps in verify would fail. Each ruling must carry the same literal phrase its
      entry does: "wrapped non-harness reader" on entry A's row, "plan-phase gate" on entry
      B's row. A row is an open-or-skip filter, so one sentence each, never the rule itself.
      The regeneration is mandatory in this same change and its own test must pass.

  - id: T-02
    title: Author the plan-panel validator-squad team file
    traces: [REQ-01, REQ-02, REQ-04, REQ-05, REQ-09, REQ-14]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: >-
      .claude/skills/harness/teams/ resolves NOBODY at 7ebfc9e, no persona is granted it
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/teams/plan-panel.yaml
    verify: |
      python3 -c "import sys;sys.path.insert(0,'.claude/skills/harness/bin');import harness_yaml as y;d=y.load_file('.claude/skills/harness/teams/plan-panel.yaml');s={x['id']:x for x in d['steps']};assert d['lead']=='validator-lead',d['lead'];assert set(s)=={'should-not-exist','scope'},set(s);assert s['should-not-exist']['outputs']==[];assert s['should-not-exist']['persona'] not in [f[:-3] for f in __import__('os').listdir('.omp/agents')];assert s['scope']['persona']=='code-reviewer';print('OK')" \
        && grep -q 'then: escalate' .claude/skills/harness/teams/plan-panel.yaml \
        && test 0 -eq "$(grep -c 'then: halt' .claude/skills/harness/teams/plan-panel.yaml)" \
        && bash .claude/skills/harness/bin/check-domain.sh --resolve \
             .harness/harness/features/FEAT-45-adversarial-plan-panel/notes/review-harness-code-reviewer-planpanel-c0.md \
           | grep -q harness-code-reviewer \
        && grep -q 'fable-advisor' .claude/skills/harness/teams/plan-panel.yaml \
        && grep -q 'status skipped' .claude/skills/harness/teams/plan-panel.yaml \
        && grep -q 'empty findings list' .claude/skills/harness/teams/plan-panel.yaml
    intent: |
      Create .claude/skills/harness/teams/plan-panel.yaml, the VALIDATOR segment of the
      adversarial plan panel. Read .claude/skills/harness/teams/review.yaml first and match
      its key vocabulary and comment discipline exactly. The step vocabulary the runner reads
      is id, persona, depends_on, inputs, outputs, mutates_repo, prompt, on_fail, plus
      max_cycles, then and feed on a step that loops. Do not invent a key.

      Top-level keys: name plan-panel; purpose one line saying this reads a DRAFTED plan
      before the operator signs it; lead validator-lead; inputs [feat, plan_path,
      intent_path, goalcheck_path].

      TWO steps, both depends_on [], both mutates_repo false, so the runner dispatches them
      in one turn.

      Step one, id should-not-exist. persona fable-advisor (D-14). It is NOT one of the 16
      harness agents -- MEASURED 2026-08-30, .omp/agents/ holds exactly 16 harness-*.md files
      and fable-advisor is not among them -- so the roster does not grow. Its definition lives
      at ~/.omp/agent/agents/fable-advisor.md, in the operator's HOME and deliberately NOT in
      this repository; do NOT add that file here, agent distribution is out of scope.
      It is pinned rather than general-purpose because it carries its own frontmatter pin,
      model anthropic/claude-fable-5, which is what makes REQ-02's MODEL half true.
      general-purpose is a platform built-in with no definition file and therefore no pin at
      all, so a lead spawning it would get the lead's own model and the model claim would be
      false.
      The lead may only spawn it because T-06 adds fable-advisor to harness-validator-lead's
      spawns: frontmatter and T-11 keeps the SPAWNS map in sync-agent-adapters.py consistent
      with it; MEASURED in the c1 fix cycle, the host enforces that list as a hard allowlist at
      preflight and refused a general-purpose dispatch with "Cannot spawn 'general-purpose'.
      Allowed: harness-product-lead,harness-eng-lead,harness-validator-lead" -- that refusal is
      evidence about the HOST's allowlist behaviour, not about which persona we ship. Do not
      change the persona here without changing both of those.
      inputs [plan_path, intent_path, goalcheck_path]. outputs [] -- an empty list, because a
      non-harness persona holds no write grant and a step told to write anywhere would be
      denied by check-domain.sh. Its findings reach disk only through the lead's transcription
      into the lead's own run digest. Carry a comment saying exactly that, and saying that this
      reader is independent BOTH of the dispatch chain AND of the authoring model: MEASURED
      2026-08-30, dispatch-guard.sh:41-51 blocks a lead from PASSING a model but does not strip
