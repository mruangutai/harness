- id: D-05
  choice: 'The fail-closed criterion for D-3 (DoD) is specified against BEHAVIOUR, never against

    reproducing a pre-change exit code. Its verify asserts the REQUIRED behaviour - a non-zero

    exit whose message carries the counts in the form N of M, plus this repository''s remedy

    tail, on a tree where what the audit expects to reach has been broken - and does not depend

    on reproducing the pre-change exit status.

    '
  because: 'Two measurements disagree and both are recorded with attribution rather than one being

    dropped. The OPERATOR measured check-state.sh in a cone-mode sparse probe at abff2a84

    sweeping 1 of 88 features and exiting 0; that figure is the operator''s own measurement and

    is cited as such in SC-06 and in the DoD note. The ENGINEERING SQUAD, at this pin, built

    its own sparse probe worktree materialising exactly one real feature and could not

    reproduce it - check-state.sh there exited 1, driven by INV-25/INV-29/INV-27 plus the

    probed feature''s own findings, and with zero feature dirs materialised INV-27 alone still

    caught it non-zero (arch2-eng digest Q1, notes/receipt-harness-backend-dev-arch2-eng.md

    section B). A criterion whose passing condition is contradicting an unreproducible baseline

    is unfalsifiable by the squad that must build it, so the assertion is pinned to the

    behaviour the requirement names instead.

    '
  dec: none
- id: D-06
  choice: "DECIDED - ARM B, ERA-EXEMPT THE PAIR. This decision is no longer an open operator choice; the\noperator ruled it at the cycle-3 batched review, notes/answers-operator-c3.md:43-60, and N-08\nexecutes it. THE RECORDS ARE NOT CORRECTED. FEAT-02 and FEAT-03-subissue-mirror both naming\nfeat/harness-native-foundation is what actually happened - an era in which two features shared a\nfoundation branch. Both features are TERMINAL, so correcting either means writing a branch value\nthat never existed, which is inventing a record.\nTHE EXEMPTION LIVES IN .claude/skills/harness/bin/feature_corpus.py, IMMEDIATELY ABOVE THE\nUNIQUENESS PREDICATE - visible to every reader of the predicate, not in a separate file and not\nin a tracked JSON, which the same ruling kills along with the persisted index (D-01). Its shape:\n  BRANCH_ERA_EXEMPT = { frozenset({\"FEAT-02\", \"FEAT-03-subissue-mirror\"}): \"<reason>\" }\nKeyed on the EXACT colliding id set and valued by a NON-EMPTY reason - shared foundation branch,\nboth terminal, correcting would invent a value. A SUPERSET DOES NOT MATCH, so a third feature\njoining that branch still reports. An entry whose reason is emptied stops matching and the\ncollision reappears. Precedent already in this repository: feature_schema.py:226,\nBUILD_ENTRY_ERA_EXEMPT.\nNO PATHSPEC EXCLUSION IS SIGNED, and none may be added. Arm A's exclusion and every carve-out\nthis plan carried for it are STRUCK: the nothing-altered criterion SC-13 stays WHOLE.\n"
  because: 'Re-confirmed on disk at this pin by reading all 79 feature.json records: exactly ONE branch

    collision (FEAT-02 / FEAT-03-subissue-mirror on feat/harness-native-foundation) and exactly FOUR

    records whose branch is the literal none (FEAT-01, FEAT-15-domain-product-base,

    FEAT-19-central-product-config, FEAT-28-ci-wiring-asserted) - the sentinel, not a collision. The

    data has not moved since the DoD note measured it.

    The operator''s reasoning, recorded so the correction arm is not re-proposed: the collision is a

    HISTORICAL FACT, not a data error, and the harness does not get to tidy its own history into

    something more convenient than the truth. Arm B also dissolves the conflict the rejected arm

    created by construction - correcting a record edits a feature directory other than this

    feature''s own, which is exactly what the nothing-altered criterion forbids, so signing that arm

    would have meant signing a carve-out on that criterion''s first day.

    THE EXEMPTION IS HELD TO BOTH HALVES so it cannot become a habit, plus a third case that makes

    exact-set matching real rather than decorative. The test pins: exactly that pair produces NO

    finding; a NEW duplicate claim produces EXACTLY ONE; and the real pair PLUS a third id produces

    the finding again. An exemption that also silences future collisions is worse than no check.

    The operator''s own condition still binds: the shipped check must not go red on day one, because

    a gate whose first run reports a violation is a gate the team learns to step over.

    '
  dec: DEC-120
- id: D-07
  choice: 'Execute every enforcement, hook, validator and test task directly in the main session under DEC-174. Operator ruling 3 supersedes the FEAT-57 replay receipt and T-19 serialization prerequisite: #1655 is closed abandoned.'
  because: The enforcement layer cannot reliably supervise its own cutover; abandoned FEAT-57 supplies no execution prerequisite.
  dec: DEC-174
- id: D-08
  choice: 'Derive the sparse directory set from tracked directory metadata, exclude every .harness/*/features subtree, and re-add the exact active directory in its uniquely discovered artifact segment; use no top-level allowlist. For an id with no record directory in any artifact segment, derive active id from checkout identity: worktree directory id, feat/<id> branch or exact pin name. Exclude every .harness/*/features and include .harness/*/features/<id> across ALL segments before its record exists. Existing records still use the exact artifact segment, never the worktree segment. Multiple segment claims or underivable identity refuse cone exit 3 without mutation. Creator algorithms remain unchanged.'
  because: Cone mode includes sibling files in parent directories, fleet planning records may live outside the worktree segment, and newly tracked top-level directories must survive without manual list edits.
  dec: none
- id: D-09
  choice: Replace the archived symlink corpus provider with owner-root filesystem reads and a small feature_corpus seam shared by record population readers; never search in-progress sibling records.
  because: The settled B choice avoids .harness/corpus, sentinel materialisation and alternate content-provider abstractions; missing roots are errors rather than fallback subsets.
  dec: none
- id: D-10
  choice: Apply worktree-state.py repair from post-checkout, post-merge and post-rewrite and verify at audit or corpus-dependent gate entrypoints; leave feature-worktree.py and pinned-checkout.py creation algorithms unchanged.
  because: Git hooks cover the shared worktree creation boundary regardless of creator; helper-only repair misses bare git worktree add, merge-induced skip-bit changes and rebase.
  dec: DEC-95
- id: D-11
  choice: 'Every automated criterion in this plan runs against a SYNTHETIC fixture repository - a real

    git init, a handful of fake feature directories, a handful of tracked files - and NEVER

    against a copy of this repository. Assertions live under tests/unit and tests/integration

    only; the directory selects the kind. One shared fixture module,

    tests/integration/f58_sparse_fixture.py, is built once by N-01 and imported by every

    integration test in this plan, and it also exports the add_worktree helper and the

    REQUIRED_PATHS constant so no test carries its own copy.

    EXTENDED, NEVER REPLACED, BY D-16 (operator ruling, cycle 6, finding PL-04). The synthetic

    fixture KEEPS EVERY ASSERTION IT ALREADY CARRIES and remains the place the MECHANISM is

    tested; D-16 ADDS read-only assertions over the real repository beside it. The two coexist

    by SUBJECT: the fixture grades behaviour whose inputs a test constructs, and the real-tree

    assertions grade the one thing a fixture cannot - whether the shipped code holds over a

    tree that DISAGREES WITH ITSELF. Nothing in D-16 copies this repository into a fixture, so

    the cost rule this decision rests on is untouched.

    '
  because: 'Issue 1526 is the precedent: a fixture that copied .claude/worktrees accounted for 239 s of

    a 240 s suite. The host-scale figures this feature cites - 3337 paths reported deleted,

    3807 skip-bits cleared - are a one-shot manual measurement recorded in the DoD note, not a

    fixture assertion, and the fixtures reproduce the SHAPE rather than the magnitude.

    Placement is forced by DEC-213 (directory selects kind, and suite_layout.py refuses a

    tracked test-shaped file outside tests) and by DEC-163 read against this repository''s

    harness.json test_kinds: component, ui and typecheck carry cmd null and are unresolved,

    functional and eval are excluded, so unit and integration are the only kinds a criterion

    may rest on. The module name f58_sparse_fixture.py is deliberate: the runner globs

    test-*.py and suite_layout''s shape patterns are test-*, test_*, *_test.*, so a helper

    outside those patterns is importable without being collected or refused.

    '
  dec: DEC-213
- id: D-12
  choice: 'Retain distinct failures cone 3, skip-bits 4, materialised names 7 and class-C dirty 8. Audit reports 8 non-gating, structural failures refuse. Classify every status entry before any mutation. A: outside target cone, absent on disk, index entry equals HEAD; set skip-worktree, touching zero disk bytes. B: outside cone, present and byte-identical to index; remove. C: any content divergence, including real edits, staged index unequal to HEAD including staged deletion, cone-internal deletion and untracked files in hidden feature directories. Any C anywhere refuses exit 8 with no filesystem/index/config mutation, including mixed A/B/C. Hidden-feature unstaged deletion is A by operator ruling. Reject provenance markers. Verify never mutates; repair A/B only after complete preclassification proves no C, and is idempotent.'
  because: Removing the symlink provider removes exits 5 and 6; pre-commit must not deadlock dirty work and no gate may repair the state it is judging.
  dec: none
- id: D-13
  choice: "A PERMANENTLY COLLECTED TEST NEVER DERIVES ITS PRE-CHANGE SIDE FROM A MOVING GIT REF. It\npins the immutable pre_change_sha that N-01 records, or it is not a collected test at all -\nit is a ONE-TIME PROOF, executed once and recorded in the executing task's receipt or in a\nfeature note. There is no third form. Applied to the three sites this plan contains, and no\ntask may reintroduce a fourth:\n  N-06 PART 3 case (c), the verify-gate pre-change reproduction - DEMOTED to a one-time\n  receipt-recorded red proof.\n  N-09 PART 1 clause (b), the audit-unchanged comparison against the merge-base copy of\n  check-state.sh - DEMOTED, its verdict recorded in notes/nonregression.md; clauses (a),\n  (c) and (d) stay standing.\n  N-09 PART 3 clause 3, the nothing-altered diff - PINNED AND SELF-SCOPED: both endpoints\n  are the immutable literals this feature's own notes record, pre_change_sha in\n  notes/suite-baseline.md and review_sha in notes/nonregression.md.\nA PINNED ENDPOINT IS NOT AN AVAILABLE ONE, AND THE SKIP IS ANNOUNCED. N-09 PART 3 clauses 2 and\n3 SKIP on either of two conditions: a literal ABSENT or not 40 hex, and a literal present but\nUNRESOLVABLE in the clone the test is running in, established by git cat-file -e per endpoint.\nThe skip PRINTS its reason and NAMES the endpoint that could not resolve, and the test asserts\nthat line was printed. A check that silently does not run in the environment where it is most\nlikely to be relied upon is the fail-open pattern this whole feature exists to remove: skipping\nis acceptable, skipping quietly is not.\nTHE AUTHORITATIVE NOTHING-ALTERED OBSERVATION IS MADE ONCE, LOCALLY, IN A FULL CLONE, and it is\nwhat notes/nonregression.md records under ## NOTHING ALTERED. It is a one-time whole-feature\nassertion rather than a per-PR gate, so CI was never its natural home; the collected clause\ncross-checks the note wherever the objects resolve and announces its skip where they do not.\nREJECTED, recorded so it is not revisited: setting fetch-depth: 0 on the integration job. It\nwould make both clauses resolvable, but it changes the CI runner's behaviour to suit a check,\nand SC-12 asserts the runner is unchanged - bending the thing being measured to fit the\nmeasurement is the wrong direction. The measured premise, verified by the panel lead and again by\nthe operator: .github/workflows/tests.yml:50 is actions/checkout@v4 with NO fetch-depth, so the\ndefault depth-1 shallow clone applies, and the job id integration is the SOLE required\nbranch-protection context with enforce_admins true - which is why an unresolvable pinned object\nthere reddens every PR in the repository rather than one.\n"
  because: 'A merge-base is not a fixed point. The moment this feature merges, the merge-base of any

    later branch already contains the post-change file, so a standing test comparing a run

    against git show <merge-base>:<path> compares the change against itself: an

    assert-the-two-runs-DIFFER clause fails forever and an assert-they-are-EQUAL clause is a

    green tautology. The same ref also makes a FEAT-58 assertion grade a LATER feature''s own

    commit range - N-09 PART 3 clause 3 unpinned names that feature''s feature.json, plan.yaml

    and notes as paths outside FEAT-58''s directory and reddens the shared suite for every

    feature that follows, corrupting the very baselines those features record. This is one root

    cause at three sites (findings F-04, F-07 and F-05), so it is stated once as a rule rather

    than as three edits that a fourth site would escape.

    THE COST IS NAMED RATHER THAN ABSORBED: two demotions are a real reduction in STANDING

    coverage. The pre-change behaviour of check-state.sh is thereafter proven by a proof

    executed once, not by a test that re-proves it on every suite run. That is accepted because

    the alternative is not stronger coverage but a permanently red or permanently vacuous

    assertion, and because a demoted proof still has to be EXECUTED and RECORDED before its

    task can pass. The two demoted verdicts are named in the ledger''s evidence column at

    notes/research-FEAT-58-apply-batch-c3.md, never left to read as neutral.

    '
  dec: none
- id: D-14
  choice: 'THE HARDLINK HALF IS STRUCK, AND THE STRIKE REACHES BOTH OF ITS GATES. Out of this feature: the

    criterion SC-15; the check-domain.sh _hardlink_plan change at :1907-1922, measured glob :1916,

    which was the former N-11''s PART 1; that task''s unit candidate-set test (its PART 4); and its two

    hardlink denial cases (its PART 5 (a) and (b)). check-domain.sh:1907-1922 _hardlink_plan is NOT

    MODIFIED by this feature and no task may reintroduce a change there. What remains at that site is

    a COMMENT ONLY: N-06 marks its one census-detected enumeration # corpus-scope: checkout-local -

    the value that is true of it under this decision - so N-12''s census stays reachable without a

    behaviour edit at a site this feature no longer touches.

    THE :1916 GATE FALLS WITH SC-15 RATHER THAN SURVIVING IT. It entered scope in the scan-site

    design as the hardlink hole and nothing else, so once the criterion goes there is no second

    purpose to keep it for; the three links are in this decision''s because.

    WHAT SURVIVES, so the strike is not read wider than it is: the BRANCH-GATE widening at

    branch-create-gate.sh:89, its marker, and its two allow/deny cases - the ALLOW case being the

    clause that asserts the gate still permits a legal flow that exists at the owner root and is

    absent from the worktree, asserted BEFORE the deny case and for that reason. All three are now

    N-10 PART 6 and PART 7: the former N-11 is RETIRED and folded into N-10, because its only reason

    to be a separate task was the hardlink half this decision strikes, and what remained shares

    N-10''s subject - resolve the owner root behind feature_corpus - and N-10''s unit AND integration

    test kinds. THE CITATION MAPPING, so recorded references still resolve: N-11 PART 1 -> N-10

    PART 6; N-11 PART 2 (the marker) -> N-10 PART 3; N-11 PART 3 (c)/(d), lettered PART 5 (c)/(d) in

    the drafts the panel read -> N-10 PART 7 (c)/(d). The frozen panel entries that name N-11 keep

    their original wording and are read through this mapping.

    D-02''s two-ROUTE denial assertion also survives untouched - the Write/Edit route through

    check-domain.sh and the Bash route through bash-write-guard.sh:855, carried by N-03 and graded by

    SC-02 and SC-03.

    NO REQUIREMENT LOSES COVERAGE. REQ-08 is delivered by that surviving two-ROUTE denial: a governed

    write to a path UNDER the corpus symlink is refused on both registered routes, which is what

    D-2 (DoD) requires. The general hardlink-alias weakness in path-based guards is filed as issue

    1638 against the guard surface generally and is not this feature''s.

    '
  because: 'The operator''s ruling at cycle 5, notes/answers-operator-c5.md:6-27, recorded with its three

    reasons so this scope is not re-proposed.

    ONE. A hardlink alias is not the mistake class the write guard exists to stop. The guard

    earns its place against fumbles - the typo that writes to a path one character off, issue

    1635, is the realistic shape. Creating a hardlink to a corpus file and writing through it is

    deliberate evasion by an agent that already holds Bash, and the Bash route has its own guard.

    TWO. Path-based guards are defeated by hardlinks UNIVERSALLY and nothing about that is

    specific to the corpus. Fixing it inside this feature puts a general weakness at the wrong

    altitude and implies the rest of the guard surface is hardlink-safe, which it is not.

    THREE, and decisively. The remedy''s own failure mode IS the harm it was added to prevent.

    Panel finding VL-01 showed the widened scan FAIL-OPENING on exactly the class SC-15 existed

    to close: N-10 specifies corpus_root to RAISE, _hardlink_plan wraps only os.stat in

    try/except at check-domain.sh:1907-1922, the glob line sits outside that block, _plan_route''s

    sole caller at :1949 is bare, and check-domain.sh:14 reads verbatim "Only exit 2 blocks -

    exit 1 is a NON-blocking error and the write proceeds". A control whose failure mode is the

    harm is worse than no control, because it also buys false confidence.

    VL-01 IS THEREFORE DISSOLVED BY THIS DECISION - NOT FIXED, AND NOT MISTAKEN. No fifth

    test-corpus-denials.py case was added, no error conversion, no _hardlink_plan change: the

    code the finding was against no longer exists in this plan. The finding was genuine and the

    operator verified its premises himself rather than taking them on the panel''s word, so the

    record must not read as though the raiser were wrong.

    WHY THE :1916 WIDENING COMES OUT TOO, three links, ruled by the product lead at cycle 5 after the

    first spelling of this decision kept it. ONE: that gate entered scope in the scan-site design as

    the hardlink hole and nothing else, so it has no purpose left once SC-15 is struck, and it falls

    with the criterion rather than surviving it. TWO: keeping its widening would leave a WIDENED

    GUARD WITH NO CRITERION AND NO TEST, whose only failure path is the uncaught corpus_root() raise

    VL-01 measured - exit 1, which check-domain.sh:14 declares a NON-blocking error, so the write

    proceeds. THREE: the only fix for that failure path is the error conversion Q1 forbids. Reason

    THREE above, applied to the remedy itself - a control whose failure mode is the harm it was added

    to prevent.

    '
  dec: none
- id: D-15
  choice: 'A CENSUS ASSERTION QUANTIFIES OVER DETECTED SITES ONLY, NEVER OVER A MARKED SET. BOTH of

    N-12''s assertions take the DETECTED set as their subject: every detected site carries

    exactly one marker from the closed vocabulary, and every detected site WHOSE MARKER IS

    owner-root sits in a file that NAMES feature_corpus. No assertion in this plan quantifies

    over marked sites. Consequently no task instructs a marker on a site the census cannot

    detect: the # corpus-scope: owner-root instruction is STRUCK from N-06 PART 2, whose

    linked_worktrees fix enumerates .git/worktrees and carries no features path segment.

    '
  because: 'A hand-maintained marker set is bookkeeping that has to be maintained by hand and drifts the

    first time someone adds a site, and a criterion quantifying over a population its own

    detector cannot see is unmeetable BY CONSTRUCTION - the shape GC-01 was fixed for one cycle

    earlier. Measured here: N-06 PART 2''s site lives in harness_boundary.py, which is absent from

    the measured 8-file census list and undetectable by the narrowed subject, so under the marker

    reading HALF 1 reddened on a CORRECT implementation of N-06 with no authorised fix -

    feature_corpus imports harness_boundary and the reverse is circular. Operator ruling,

    notes/answers-operator-c5.md:65-73.

    The trade-off is named rather than absorbed: a marker placed on an UNDETECTED site is

    asserted by nothing. That is correct - the census exists to catch an unresolved enumeration,

    not to audit comments. The one blind class this leaves is recorded in N-12''s own intent, the

    artifact the operator signs, per the panel ruling on VL-04.

    '
  dec: none
- id: D-16
  choice: 'REAL-REPOSITORY ASSERTIONS SIT BESIDE THE SYNTHETIC FIXTURE, AND N-13 CARRIES THEM.

    The shipped check-state.sh is asserted GREEN at the REAL owner root - no

    expected-versus-reached mismatch refusal, the run proceeding past the choke point -

    and asserted NON-GATING on a dirty DISPOSABLE worktree of this repository, paired

    with a STRUCTURAL break in the same probe that must still refuse.

    EVERY REAL-TREE READ IS READ-ONLY: nothing mutates the owner root, nothing touches a

    live worktree, and the only tree written is a probe the task itself creates and

    removes.

    NO CENSUS FIGURE IS AN EXPECTATION anywhere. The assertion is the ABSENCE of a

    mismatch finding at the reviewed commit, with a non-vacuity floor - more than 70

    records reached - and never that a count equals a literal. The real tree gains

    feature directories, and SC-11''s host baseline is already labelled measured and NOT a

    fixture expectation for the same reason.

    '
  because: 'A fixture whose directories and records agree BY CONSTRUCTION cannot catch a defect

    that exists only because the real tree disagrees with itself. That is exactly what

    finding PL-01 was: 89 feature directories against 79 feature.json records at the real

    owner root, ten of them record-less and carrying tracked, non-ignored notes, which no

    self-consistent fixture could ever have shown.

    THIS IS THE THIRD TIME IN THIS FEATURE a control was found blind to the thing it

    existed to catch - after the derivation that stripped six tracked .harness subtrees,

    and .harness/corpus missing from REQUIRED_PATHS. Point-fixing the instances without

    adding the class leaves a fourth free to ship the same way.

    THE DoD''s SYNTHETIC-FIXTURE RULE IS NOT VIOLATED, and the operator settled this at

    cycle 6: "a synthetic fixture, never a copy of this repository" is a rule about COST -

    the precedent is issue 1526, where a fixture copying .claude/worktrees accounted for

    239 s of a 240 s suite - and about not mutating the real tree. IT WAS NEVER A RULE

    AGAINST READING THE REAL OWNER ROOT. A read-only assertion against it is cheap and is

    precisely what catches 89-versus-79.

    N-08 is the precedent inside this plan: change_type scaffolding, one test, clean over

    the real records. The audit narrowing had no counterpart until now.

    REJECTED, recorded so it is not re-proposed: replacing fixture assertions with

    real-tree ones. The fixture keeps every assertion it carries and stays where the

    MECHANISM is tested - it is simply not sufficient alone (D-11).

    '
  dec: none
- id: D-17
  choice: 'A GATE''S DECISION IS ASSERTED FROM ITS PRINTED PAYLOAD, NEVER FROM ITS EXIT STATUS.

    Every criterion and every test in this plan that grades whether a registered hook gate

    ALLOWED or DENIED parses the printed permissionDecision payload and asserts on that.

    ANY FUTURE CRITERION ASSERTING A GATE''S DECISION BY EXIT CODE IS WRONG BY DEFAULT.

    '
  because: 'Two independent gates in this repository refuse by PAYLOAD and exit 0, which makes

    this the CONVENTION here rather than an anomaly.

    merge-gate.py''s deny() has NO EXIT CONTRACT AT ALL - zero sys.exit calls - and refuses

