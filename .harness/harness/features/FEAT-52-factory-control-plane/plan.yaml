      RED PROOF, and it is TWO fixtures per row, not one, because direction_failures has TWO failure
      branches and one fixture only ever fires one of them. Fire both against FIXTURE STRINGS, never
      a mutated file, so nothing on disk is touched. For EACH row:

        - FIXTURE A, THE WRONG-ANCHOR BRANCH. The row's token prefixed with the WRONG anchor for
          that row, repeated min_occurrences times so the count branch is satisfied and only the
          per-occurrence anchor comparison can fail. For rows 1-5 that is one occurrence; for row
          6, whose min_occurrences is 2, FIXTURE A carries the wrongly-anchored token TWICE, or
          the count branch fires as well and the fixture no longer isolates the branch it exists
          to prove. Assert a non-empty failure list.
        - FIXTURE B, THE NO-OCCURRENCE BRANCH. The row's token present but UNANCHORED - the bare
          relative path with no placeholder in front of it, which is precisely the pre-feature
          spelling this whole feature removes. Zero anchored occurrences are found, so only the
          count branch can fail. Assert a non-empty failure list.

      Name the branch in each case name and say it in the assertion message, so neither fixture can
      later be dropped as a duplicate of the other. Fixture B is the one that matters most: without
      it, an implementation whose no-occurrence branch is missing or inverted - an empty match list
      read as vacuously fine, the fail-open pattern this codebase's history repeats - passes every
      other test in this task and stays green until the day a real reference is DELETED rather than
      mis-anchored, at which point the row silently reports zero failures on a real regression.
      SC-02, SC-05, SC-08 and SC-12 already hold this standard.

        - FIXTURE C, ROW 6 ONLY, THE MIN-OCCURRENCES BRANCH. A string carrying the row-6 token
          TWICE, the first occurrence correctly FEATURE_TREE-anchored and the second bare. Assert a
          non-empty failure list. Fixture B proves the branch fires at zero; only this proves it
          fires at one, which is the half-anchored file the row exists to catch.

      THE WHOLE-SCOPE RUN AT THE REVIEWED SHA, which is SC-04's remaining clause and SC-11's.
      T-12's whole-scope run reads the WORKING TREE in CI, so it does not discharge a criterion
      that names the reviewed sha. Do it here, bounded:
        - run `python3 <root>/.claude/skills/harness/bin/check-instruction-paths.py --list-scope`
          with --root <root>, collect the printed paths, and assert the list is NON-EMPTY;
        - for each listed path, take its pinned bytes with `git -C <root> show <ref>:<path>` and
          write them into a temporary root at the SAME relative path, creating parent directories;
        - run the checker with --root <that temp root> and NO positional arguments;
        - assert exit status 0, assert the summary line reports 0 violations, and assert its
          scanned count EQUALS the number of paths materialised. A scanned count lower than the
          materialised count means the temp root did not reproduce the scope and the run proves
          nothing about it;
        - remove the temp root at the end, on the failure path too.
      A `git show` failure for any listed path is a hard failure naming that path, not a skip.

      REGISTRATION. Append "test-anchor-directions.py" to UNIT_SCRIPTS in run-unit-tests.sh, next
      to test-check-instruction-paths.py. SC-04 and SC-11 both declare evidence: unit, and the
      kind is a property of which array the script name sits in. Do NOT add it to
      test_kinds.integration.detect in harness.json: the KIND-DRIFT cross-check fails when a
      UNIT_SCRIPTS name appears there, and unit.detect's glob
      .claude/skills/harness/bin/test-*.py already matches the new file - the same reasoning
      T-02's own REGISTRATION note records.

      This task depends on T-12 and on nothing else being added: every anchoring task must have
      landed for the six rows to be green, and the CI wiring must exist for the whole-scope run
      to be meaningful.
