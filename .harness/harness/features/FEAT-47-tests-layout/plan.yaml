    because: >
      the precedence rule it states is still needed by any project whose unit and integration detect
      globs can overlap. What dies is its concrete example, its no-implementation disclosure and its
      cross-check paragraph, all of which describe the deleted arrays in the present tense
    dec: DEC-197
  - id: D-07
    choice: Every task is execution_mode main-session-direct
    because: >
      the whole change is the enforcement layer and its tests, which AGENTS.md:8 names verbatim as
      the DEC-174 carve-out
    dec: DEC-174
  - id: D-08
    choice: >
      bin/fixtures moves to tests/integration/fixtures, feature-schema.json stays in bin, and
      layout_fixtures.py stays in bin
    because: >
      the fixtures directory has two consumers and both are integration tests, while
      feature-schema.json is read at runtime by feature_schema.py:45 and named in check-domain.sh's
      write-denial text. layout_fixtures.py is test support that stays under the settled scope, so
      the guard is name-shaped and not purpose-shaped, which is recorded as a residue rather than
      hidden
    dec: pending-T-06

  - id: D-13
    choice: >
      FEAT-48 ships WHOLE and lands BEFORE this feature. Parallel safety, the worker pool and
      suite wall time are its scope, and this feature migrates the two test files it adds
      (test-suite-independence.py to tests/unit, test-run-pool.py to tests/integration) while its
      two non-test helpers, isolated_bin.py and run_pool.py, stay in bin. Confirmed against
      FEAT-48's D-09, which is where that list lives. The D-NN numbers D-09 to D-12 and the tasks
      T-07 to T-09 that once held that scope are removed, not renumbered, so a reference recorded
      against them cannot silently rebind.
    because: >
      both plans rewrote run-unit-tests.sh, so the same file was planned twice, and the ordering
      resolves in one direction only. The cross-test injection hazard is live today and corrupts
      every parallel measurement including this feature's own, so FEAT-48 cannot wait. The pool
      does not depend on this layout: FEAT-48's D-05 puts scheduling in run_pool.py, invoked once
      by bash which keeps kind selection, so the pool receives a script list and never sees how
      that list was discovered, and it replaces one invocation line. An earlier draft split
      FEAT-48 across this feature's merge; that made the two plans' file censuses irreconcilable
      and rested on a dependency FEAT-48's own D-05 contradicts. Recorded so a later reader does
      not read the D-09 to D-12 gap as scope quietly abandoned, and does not re-suggest the split.
    dec: none
  - id: D-14
    choice: >
      No verify block and no success criterion in this plan states an expected count of test
      files. Each migration task asserts a floor plus a per-file rename from bin, and the exact
      set is bound once, at the end, by a conservation law derived from the ref this feature
      merges into: every test-*.py tracked under bin at that ref is present under exactly one of
      tests/unit or tests/integration, bin retains none, the two are disjoint, and the single
      deletion is named on the command line.
    because: >
      a hardcoded census is invalidated silently by any other feature that adds a test, which is
      precisely what FEAT-48 did to the numbers 19, 20, 36 and 37 in an earlier draft of this
      plan: two plans that were each internally consistent and mutually contradictory. It then
      happened a SECOND time, through a different sibling, which is why this decision is stated as
      a rule rather than as a repair: FEAT-45 merged while this plan was being written and added
      test-panel-findings.py and test-plan-panel.py, moving bin from 56 test files to 58 before
      this feature touches anything, shifting the integration enumeration from 36 to 38 and
      falsifying two rows of the verdict-line baseline. Nothing this decision put in place broke —
      the floors only weakened, the per-file rename assertions and the exact-residue assertion in
      T-03 are derived from git and were unaffected — and every number that DID have to be
      rewritten was a literal in prose. That is the measured argument for the shape. A bare
      derive-from-the-tree is the opposite failure and the one issue 979 exists to kill, a check
      that passes because it found nothing. So every derived census carries a floor whose
      staleness can only weaken it and never turn it falsely green, every literal that survives
      states the ref it was measured at so a later reader can tell staleness from error, and the
      conservation law declares its one permitted absence rather than tolerating absences in
      general.
    dec: pending-T-06
  - id: D-15
    choice: >
      The runtime mutation check keeps watching the bin directory alone after the migration, and
      the tests/ trees this feature creates are NOT added to it. run_pool.py takes exactly one
      directory, so widening it would be a change to a FEAT-48 helper that T-05 otherwise forbids
      itself. What this feature owes the flag is the argument, not the set: run-unit-tests.sh hands
      it the bin directory, and T-05's verify asserts that argument equals the pool script's own
      directory so carrying the old root argument forward is red here and not only in FEAT-48.
    because: >
      the hazard the check exists for is a test mutating the ARTIFACT under test, and every artifact
      under test — the hooks, the gate scripts and the helper modules every test imports — stays in
      bin after this migration. What the move does relocate out of the watched directory is the
      write-beside-yourself site, so this feature makes one narrow vector newly unwatched at
      runtime: a moved test mutating a file inside tests/ THROUGH A SUBPROCESS. It is named rather
      than left implicit. What carries it: FEAT-48's test-suite-independence.py walks from the
      repository root and covers tests/ for direct mutation with no escape hatch, and every fixture
      in the moved set is already built under tempfile.mkdtemp(). Watching the root instead was
      rejected upstream and must not be re-suggested here: agents write features/** continuously,
      so a root-wide runtime set reddens a passing suite on a sibling's note. If the operator wants
      the tests/ trees watched, that is a multi-directory --mutation-check and a FEAT-47 code change
      to run_pool.py, which is scope this plan does not currently carry.
    dec: pending-T-06
  - id: D-16
    choice: >
      REQ-07 is enforced by a declared LINE-exemption census, tests/manual/suite-census.py
      residue, and NOT by widening the search's path exclusions. Its exemption list holds
      (path, literal fragment) pairs — exactly three, each naming one sentence this feature
      deliberately preserves — and the mode refuses its own list if any exempted path lies under
      an expertise directory, refuses a pair that no longer matches, and refuses a search whose
      positive control over the record prefixes comes back empty.
    because: >
      the three tokens sit in two different kinds of place and one pathspec cannot tell them
      apart. A historical sentence in the past tense describes a state that really existed and
      DEC-205 keeps it; injected craft in an Expertise file, or a comment claiming the arrays are
      live, does not get that pass. The cheapest remedy — excluding .harness/harness/** — makes
      the second class invisible, which is a gate turning green on the exact defect it exists to
      catch, so the exclusion has to be per-SENTENCE. Exempting the sentence rather than the file
      also leaves every FUTURE line of DECISIONS.md and of the moved probe inside the sweep, and
      the expertise refusal makes the fail-open branch unreachable by anyone later rather than
      merely unused today. The rejected alternative, kept so it is not re-suggested: paraphrase
      the two preserved sentences so the tokens disappear. Refused because the token IS the
      historical fact — "eight of twelve INTEGRATION_SCRIPTS entries" names the artifact that
      existed, and "the forking-side script array" cannot be checked against the commit the
      sentence describes.
    dec: pending-T-06
  - id: D-17
    choice: >
      Every falsified Expertise entry is repaired inside this feature, by T-07, as execution_mode
      main-session-direct — not by a distillation dispatch to each owning persona, and not
      deferred to a later curation pass. Which entries those are is T-07's derived sweep and is
      not enumerated here (D-19).
    because: >
      every file under the two expertise globs is granted to its own persona alone and to no
      shared seat — check-domain.sh --resolve over all 28 of them at 1c9c384, not a sample — and
      DEC-145 confines an agent's write to its own Expertise to a distillation dispatch. So the
      only routes are a persona dispatched as an executor, which no plan in this repository has
      ever done and which invites the whole-file rewrite DEC-125 describes for a two-line
      correction, or the main session — the same argument this plan's lanes block already makes
      for team-config.yaml, where the owner of the surface is exactly the party that must not
      perform the write. Resolving the whole class rather than the files named today is what makes
      this argument hold for a file the sweep finds that nobody has written yet. Deferring was
      refused outright: each entry is injected at every spawn of its persona in this repository,
      so between this merge and some later curation those seats are instructed to read arrays that
      do not exist, and REQ-07 is violated with or without the sweep.
    dec: DEC-145
  - id: D-18
    choice: >
      suite-census.py's verdict-lines and migration modes declare their one-review shelf life in
      the interface, not in a comment: verdict-lines reports drift and exits 0 unless --strict is
      passed, and migration exits 2 with a message naming the cause when the ref it is handed is
      after the migration rather than exit 1 on its floor. children keeps its default and is the
      only mode with standing life.
    because: >
      both are one-shot review instruments shipped as permanent files. Post-merge, migration
      --base origin/main derives an empty set and would fail its own floor forever, and
      verdict-lines binds to a baseline measured at ea6f51f that the first legitimate later test
      edit falsifies — a permanent red on correct work, which is the mirror of the failure issue
      979 exists to kill and no better than a check that passes on broken work. T-05's verify
      passes --strict, at the one moment the baseline is current, so the discrimination this
      plan needs is unchanged; what changes is that a later reader gets an answer instead of a
      meaningless failure. Deleting the two modes after the review was refused: nothing in the
      plan removes them, and a mode that names its own validity window is cheaper than a deletion
      task nobody will run.
    dec: pending-T-06
  - id: D-19
    choice: >
      No literal this plan can be outlived by is load-bearing anywhere in it. Two censuses
      besides D-14's are therefore DERIVED at build time instead of enumerated: the set of
      Expertise files T-07 repairs, from a sweep of .harness/expertise/*.md and
      .harness/*/expertise/*.md for the three tokens, with T-07 declaring those two globs as its
      files rather than a path list; and the number of this feature's own decision entry, which
      T-06 takes by reading the last heading and which T-06's verify then locates by title
      fragment and required content, never by number. Every dec: field here reads pending-T-06
      until T-06 backfills it, and no verify in this plan reads that field.
    because: >
      D-14 already stated this rule for the test census, with the measured argument that a
      hardcoded census is silently invalidated by a sibling. It was never carried across to the
      other two censuses in the same plan and both then failed for exactly that reason, which is
      why this is stated as a rule and not as a repair. The Expertise enumeration was written as
      two files and the panel found three more, all three carrying their token text from e798b08,
      FEAT-45's own post-merge distillation on the ref this branch is rebased onto: the target
      moved during the work, so widening the literal to five buys one review and produces the same
      finding at the next distillation. DEC-207 was taken by FEAT-45 before this plan's dec: fields
      could be signed, and FEAT-48 lands first and takes another number, so no number chosen now
      is safe either. The derived sweeps carry D-14's guards, and a derive-from-the-tree without
      them is the opposite failure: a floor over the files discovered, whose staleness can only
      weaken it; D-16's positive control over the record prefixes, so a search that has stopped
      working cannot report clean; and no exemption of any kind inside an expertise directory,
      reusing D-16's own record-versus-live-craft distinction rather than inventing a second one,
      because Expertise is injected as current craft at every spawn and is never a record. The
      lane is derived with the scope: all 28 files under the two globs resolve to their own
      persona alone and to no shared seat (check-domain.sh --resolve, every file, at 1c9c384), so
      D-17's argument holds for a sixth file nobody has written yet.
    dec: pending-T-06

tasks:
  - id: T-01
    title: Classify tests as control-plane and grant the directory to the two seats that lack it
    traces: [REQ-01]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: >
      DEC-174 carve-out over harness_boundary.py, which is the module every PreToolUse domain
      decision resolves through, plus team-config.yaml, which no seat may write
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/test-harness-boundary.py
      - .claude/skills/harness/bin/test-check-domain.py
      - .harness/team-config.yaml
    verify: |
      set -e
      python3 -I -c 'import sys; sys.path.insert(0, ".claude/skills/harness/bin"); \
        import harness_boundary as h; \
        assert h.is_control_plane_target("tests/unit/test-x.py"); \
        assert h.is_control_plane_target("tests/integration/test-y.py"); \
        assert h.is_control_plane_target("tests/manual/probe-z.py"); \
        assert not h.is_control_plane_glob("tests/**"); \
        assert not h.is_control_plane_target("src/main.py"); print("classifier OK")'
      python3 .claude/skills/harness/bin/test-harness-boundary.py
      python3 .claude/skills/harness/bin/test-check-domain.py
    intent: |
      Widen the harness base's TARGET-side control-plane test to accept the repository-root tests
      directory, and grant that directory to the two seats that lack it. Write the new test cases
      FIRST, run them, watch them fail, then make the production edits.

      1. .claude/skills/harness/bin/test-harness-boundary.py — add cases asserting, over the real
         module: is_control_plane_target returns True for "tests/unit/test-x.py",
         "tests/integration/test-y.py" and "tests/manual/probe-z.py"; is_control_plane_glob
         returns False for "tests/**" and for "tests/unit/**"; is_control_plane_target still
         returns False for "src/main.py" and for "web/src/app.test.ts". The two
         is_control_plane_glob cases are not decoration: they are what pins tests/** as
         target-side ONLY, so that a product checkout's own tests directory keeps resolving in its
         product base and a product team's tests grant is never filtered away there. Run the file:
         the three True cases must fail now.

      2. .claude/skills/harness/bin/harness_boundary.py, the HARNESS_CONTROL_PLANE list at
         lines 234-242 — append "tests/**" as the eighth entry, after ".github/**".

      3. Same file, the is_control_plane_target docstring at lines 370-381 — it says "two of the
         four named entries appear in no team-config grant". The list holds seven entries before
         this change and eight after, so the count is already wrong. Restate the point without a
         count, and add one clause: tests/** is target-side only, is_control_plane_glob stays False
         for it, and that is what keeps a product checkout's own tests directory in its product
         base.

      4. .harness/team-config.yaml — insert exactly one domain entry into harness-backend-dev,
         immediately after the .claude/skills/harness/bin/** entry at line 170, and exactly one
         into harness-dev-ops, immediately after the identical entry at line 211. Both read:
             - { path: tests/**, upsert: true }
         with a trailing comment reading tests/** — harness's own tests (FEAT-47). NAME THE
         FEATURE, NEVER A DEC NUMBER: this task runs before T-06 takes one, and a number written
         here is a guess a later reader cannot tell from a fact (D-19). Do NOT touch harness-qa:
         line 231 already carries
         the grant, and it becomes effective through step 2 alone. Add it to NO other seat —
         harness-frontend-dev, harness-ai-dev and harness-data-engineer stay as blocked as they are
         today, and that is a requirement (REQ-01), not an omission.

      5. .claude/skills/harness/bin/test-check-domain.py — two edits.
         (a) The docstring at lines 1749-1757 lists tests/** among the product-code globs that
             "resolve to NOBODY at BOTH paths". Step 2 makes that false. Remove tests/** from that
             list and add one sentence: harness-qa's first domain entry is now a control-plane
             target, so the roster loop selects tests/** for it rather than falling through.
         (b) Add eleven new assertions on the live --resolve route, each its own check with its own
             message, because a count of granting seats is satisfied by the conformers alone:
             resolving tests/unit/test-zz.py names harness-qa, harness-backend-dev and
             harness-dev-ops (three assertions); resolving tests/integration/test-zz.py names the
             same three (three assertions); resolving tests/unit/test-zz.py does NOT name
             harness-frontend-dev, harness-ai-dev or harness-data-engineer (three assertions);
             resolving .claude/skills/harness/bin/zz.sh does NOT name harness-qa (one assertion);
             and resolving tests/unit/test-zz.py from inside a linked worktree returns the same set
             as at the root (one assertion, reusing this file's existing worktree fixture).

      Do not create the tests directories in this task and do not move any file. This task is the
      capability alone, and the suite must be green at the end of it.

  - id: T-02
    title: Move the 38 integration tests and their fixtures to tests/integration and repair anchors
    traces: [REQ-02, REQ-03, REQ-04]
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: >
      DEC-174 carve-out. Every file moved is a test of a hook, validator or gate script, which
      AGENTS.md:8 names verbatim, and the destination is the surface T-01 has just opened
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/test-*.py
      - .claude/skills/harness/bin/fixtures/*
      - tests/integration/test-*.py
      - tests/integration/fixtures/*
      - tests/integration/test-code-grade-cli.py
    verify: |
      set -e
      BASE=$(git rev-parse --verify --quiet origin/main || git rev-parse --verify main)
      n=$(ls tests/integration/test-*.py | wc -l | tr -d " ")
      [ "$n" -ge 39 ] || { echo "floor 39 = 38 enumerated + FEAT-48 test-run-pool.py, the 38 measured at 56a30a0; found $n"; exit 1; }
      r=$(git diff -M --name-status "$BASE" -- \
        ".claude/skills/harness/bin/test-*.py" "tests/integration/test-*.py")
      for f in tests/integration/test-*.py; do
        b=$(basename "$f")
        printf '%s\n' "$r" \
          | grep -qE "^R[0-9]+[[:space:]]+\.claude/skills/harness/bin/$b[[:space:]]+$f$" \
          || { echo "no rename from bin recorded for $f"; exit 1; }
        echo "== $f"; python3 "$f"
      done
    intent: |
      git mv the files named below from .claude/skills/harness/bin/ to tests/integration/, then
      repair every path anchor inside them. Use git mv, one file per invocation, so history follows.

      THE SET is the 38 files enumerated below PLUS FEAT-48's test-run-pool.py, which lands in bin
      before this task runs. test-run-unit-tests-kinds.py is deliberately NOT here: T-05 deletes it
      in place. The 38 were enumerated by measuring bin at 56a30a0, where 58 test-*.py are tracked
      (git ls-tree -r --name-only origin/main .claude/skills/harness/bin/ | grep -c "/test-.*\.py$"
      answers 58 at origin/main 75daa3b), and the enumeration is a CROSS-FEATURE CONTRACT rather
      than a snapshot: before moving anything, run
          comm -23 <(git ls-files -- ".claude/skills/harness/bin/test-*.py" | sed "s#.*/##" | sort)
                   <(printf "%s\n" <this set> <T-03 set> test-run-unit-tests-kinds.py | sort)
      and STOP if it prints a name. A non-empty result means another feature landed a test after
      this plan was written, exactly as FEAT-45 did with test-panel-findings.py and
      test-plan-panel.py and FEAT-48 does with its two, and the classification is a plan decision
      no doer may improvise. Do not silently move an unlisted file, and do not silently leave it:
