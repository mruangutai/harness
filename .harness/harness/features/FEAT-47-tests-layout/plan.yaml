  - id: T-05
    title: Make the directory the kind, and guard the layout with one predicate that can fail
    traces: [REQ-02, REQ-04, REQ-05, REQ-06, REQ-08]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: >
      DEC-174 carve-out. run-unit-tests.sh is the gate the tests workflow runs and CODEOWNERS pins,
      and this task also writes harness.json, which no squad may take under DEC-174
    depends_on: [T-03, T-04]
    status: pending
    files:
      - .claude/skills/harness/bin/run-unit-tests.sh
      - .claude/skills/harness/bin/suite_layout.py
      - .claude/skills/harness/bin/test-run-unit-tests-kinds.py
      - tests/unit/test-suite-layout.py
      - tests/integration/test-run-unit-tests-layout.py
      - tests/integration/test-check-plan-routes.py
      - tests/manual/suite-census.py
      - .harness/harness.json
      - .github/CODEOWNERS
    verify: |
      set -e
      .agents/skills/harness/bin/run-unit-tests.sh --check-layout
      if .agents/skills/harness/bin/run-unit-tests.sh --bogus; then exit 1; fi
      git ls-files --error-unmatch .claude/skills/harness/bin/suite_layout.py \
        tests/unit/test-suite-layout.py tests/manual/suite-census.py \
        tests/integration/test-run-unit-tests-layout.py
      python3 -c 'sh=open(".claude/skills/harness/bin/run-unit-tests.sh").read().splitlines(); \
        inv=[l for l in sh if "run_pool.py" in l and not l.strip().startswith("#")]; \
        assert len(inv)==1, f"expected one pool invocation, found {len(inv)}"; \
        p=inv[0].split("run_pool.py")[0].split()[-1].strip(chr(34)).rstrip("/"); \
        a=(inv[0].split("--mutation-check")[1:] or ["!missing"])[0].split()[0].strip(chr(34)); \
        assert a==p, f"--mutation-check must take the bin directory {p}, got {a}"; \
        assert not [l for l in sh if l.strip().startswith("for s in")]; print("pool call intact")'
      for k in unit integration; do
        o=$(.agents/skills/harness/bin/run-unit-tests.sh --kind "$k") \
          || { printf '%s\n' "$o"; echo "$k suite exited non-zero"; exit 1; }
        bad=$(printf '%s\n' "$o" | sed -n 's/^FAIL //p')
        [ -z "$bad" ] || { echo "$k reported FAIL: $bad"; exit 1; }
        got=$(printf '%s\n' "$o" | sed -n 's/^PASS \(test-.*\.py\)$/\1/p' | sort -u)
        want=$(ls "tests/$k"/test-*.py | sed "s#.*/##" | sort)
        [ "$got" = "$want" ] || { echo "$k tally set != tests/$k contents"; exit 1; }
      done
      python3 tests/manual/suite-census.py migration --floor 58 \
        --base "$(git rev-parse --verify --quiet origin/main || git rev-parse --verify main)" \
        --deleted test-run-unit-tests-kinds.py
      python3 tests/manual/suite-census.py verdict-lines \
        --baseline .harness/harness/features/FEAT-47-tests-layout/notes/research-tests-layout.md \
        --deleted test-run-unit-tests-kinds.py --strict
    intent: |
      Delete the registration bookkeeping, make discovery directory-driven, and put the invariant
      that replaces it behind one predicate with two independent tests. WRITE THE TWO TEST FILES
      FIRST, run them, watch them fail for the stated reason, then write suite_layout.py and edit
      the runner.

      1. NEW FILE .claude/skills/harness/bin/suite_layout.py — one public function,
         violations(root) -> list of strings, empty when the layout is legal. It is a non-test
         helper and stays in bin beside the runner that calls it. It reports one string per
         violation found, each naming the offending path, for these four conditions:
           (a) root/tests/unit contains no test-*.py
           (b) root/tests/integration contains no test-*.py
           (c) a basename appears in both directories, which is a copy where a move was intended
               and would run the same file twice under two kinds
           (d) root/.claude/skills/harness/bin contains a file matching test-*.py, *.test.* or
               probe-*
         Nothing else. It reads the filesystem, takes no environment and no cwd, and returns
         rather than printing or exiting, so both callers decide their own wording.

      2. NEW FILE tests/unit/test-suite-layout.py — the artifact under test runs in-process and
         the only child it spawns is git, enumerating tracked files for step 2b, which is a
         dependency read and not behaviour under assertion, so it is unit under the first
         sub-rule of the entry T-06 writes, and git is already in SC-09's declared fixture set. It
         imports suite_layout from BIN_DIR by the T-02 anchor recipe and asserts:
           - violations() over this repository's real root returns exactly the empty list
           - for each of four synthetic trees built in a tempdir, it returns exactly the expected
             one-element list, and the string names the offending path: an empty tests/unit; an
             empty tests/integration; test-dup.py present in both; test-planted.py inside the
             tree's bin. Four separate cases with four separate assertions on the message, because
             a single "returns something" assertion is satisfied by any one of them.
           - a fifth synthetic tree with all four conditions present returns four violations, so
             the function reports every violation rather than the first
         In the same file, three assertions that do not need a subprocess and have no better home:
           - .harness/harness.json test_kinds.unit.detect and test_kinds.integration.detect each
             equal the corresponding value in .claude/skills/harness/templates/harness.json
             (REQ-06), read from both files at runtime rather than hardcoded
           - neither detect value contains the substring ".claude/", so the repository-specific
             appendix cannot silently return
           - no kind whose status is active has a detect glob matching tests/manual/, and neither
             directory the runner walks is tests/manual (REQ-08). Split the pipe-separated detect
             string before matching: it is a string, not a list, so iterating it yields one
             character per step and prints like a successful enumeration
      2b. SAME FILE — the sole-implementation sweep, which is what SC-05 rests on and the only
         thing in this plan that can see a SECOND implementation of the predicate. Write it as a
         local helper taking two arguments, the root and the list of relative paths to scan, so it
         can be driven over a synthetic tree as well as over this repository. It returns the paths
         that match BOTH kind directories AND contain one of os.listdir, os.scandir, os.walk,
         glob.glob, iterdir, rglob or .glob( — the weakest fragment a copy-paste reimplementation
         of a predicate over the two kind directories necessarily carries.
         MATCH EACH DIRECTORY BY REGEX, NOT BY THE PATH LITERAL, and this is not a refinement:
         os.path.join(root, "tests", "unit") contains no substring tests/unit, so a literal search
         is blind to the joined-components form the module in step 1 is most likely to be written
         in — it would fail its own positive control below while reporting a clean sweep over
         every reimplementation of that shape. Use
             tests['"]?\s*[,/]\s*['"]?\s*unit
         and the same with integration. Verified before this task was written: those two regexes
         plus the fragment list report a planted reimplementation in all three shapes — slash
         literal, os.path.join components, and Path(r, "tests", "unit").glob — and match zero of
         the 104 tracked .py files at 56a30a0, re-derived there after FEAT-45 added three .py
         files under bin, so the sweep is neither red on arrival nor blind to
         the shapes it exists to catch. Four cases:
           - EXEMPTIONS ARE DECLARED, NOT DERIVED: a module-level list of exactly four relative
             paths, .claude/skills/harness/bin/suite_layout.py, tests/unit/test-suite-layout.py,
             tests/integration/test-run-unit-tests-layout.py and tests/manual/suite-census.py,
             with a comment above it saying exactly four on purpose, in the shape
             test-no-distribution.py's ALLOW_LIST already uses. Over this repository the helper's
             result minus that list is exactly empty, and the case names any path it reports.
             Never build the list from what the sweep happens to return: an exemption list derived
             from the finding is true by construction
           - POSITIVE CONTROL, so a pattern that has stopped matching cannot report clean: the
             helper's result over this repository CONTAINS
             .claude/skills/harness/bin/suite_layout.py and tests/manual/suite-census.py. Both
             read a kind directory by name and both must match; if either stops matching, the
             fragment list is wrong and the case is red rather than green over a pattern that
             matches nothing
           - DISCOVERY FLOOR, for the same reason the migration census carries one: the scanned
             path list has at least 90 entries. Build it from git ls-files -- "*.py" run at the
             root with check=True on the exit status, never from a pipeline whose emptiness is
             indistinguishable from its failure. 104 tracked .py files were measured at 56a30a0
             and the migration only moves them, so the floor's staleness can only weaken it.
             DO NOT RAISE THE FLOOR TO THE MEASURED COUNT: a floor equal to the number it guards
             is satisfied only by the exact tree it was written against, which is the failure two
             sibling merges have already caused in this plan
           - PROVEN ABLE TO FAIL, three shapes not one, because the shape a reimplementation is
             written in is exactly what a literal search gets wrong: for each of a slash literal
             ("tests/unit"), os.path.join components ("tests", "unit") and
             Path(r, "tests", "unit").glob, build a tempdir holding one file under a name in no
             list — tests/unit/kindcheck_helper.py is fine — whose body names both directories in
             that shape and lists one of them. Drive the helper over that tree with its own path
             list and assert, per shape, that the planted path is in the result and that the
             exemption subtraction is therefore non-empty. These are the cases that distinguish a
             working sweep from one that would report clean whatever it is pointed at
         One more assertion in this file, on the delegation rather than on a duplicate: exactly one
         non-comment line of .claude/skills/harness/bin/run-unit-tests.sh contains the string
