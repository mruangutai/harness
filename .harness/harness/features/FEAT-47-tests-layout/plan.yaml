decisions:
  - id: D-01
    choice: >
      tests/** joins HARNESS_CONTROL_PLANE as a target-side entry only, and the grant is held by
      harness-qa, harness-backend-dev and harness-dev-ops and by no other seat
    because: >
      in the harness base a glob match is accepted only for a control-plane target, so the tests/**
      grant harness-qa already carries is inert until the target is classified. is_control_plane_glob
      stays False for it, which is what keeps a product checkout's own tests directory resolving in
      its product base. The other three Iron Law seats stay exactly as blocked as they are today
    dec: DEC-207
  - id: D-02
    choice: >
      The directory a test sits in IS its kind. The two bash arrays, the drift detector and the
      KIND-DRIFT set comparison are deleted, not reconciled with the new layout
    because: >
      two lists that describe the same thing and cannot see each other diverge silently, which is
      the failure DEC-197 was written to name. A directory cannot disagree with itself
    dec: DEC-207
  - id: D-03
    choice: >
      The layout predicate is one function in one new module, bin/suite_layout.py, called by the
      runner on every invocation and driven directly by a unit test over synthetic trees
    because: >
      the guard replaces bookkeeping, so it must itself be provably able to fail. A predicate
      duplicated in bash and in python would be the same two-readers failure one level down
    dec: DEC-207
  - id: D-04
    choice: >
      Ten files move from unit to integration, decided by a runtime measurement of which child
      processes each test actually spawns, not by which array it sat in
    because: >
      issue 160 splits on whether an assertion depends on behaviour in another process, and a grep
