         tests/** is control-plane". State, as current truth:
           - Harness's own tests live in tests/unit/** and tests/integration/** at the repository
             root, like any other project's. bin holds production source
           - tests/** is an entry in HARNESS_CONTROL_PLANE, which is TARGET-side only.
