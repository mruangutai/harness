             rows inside its fenced text block, each a test filename then whitespace then an
             integer and nothing else; the block in notes/research-tests-layout.md is the baseline.
             Reading the whole file instead would let a sentence of prose that happens to name a
             file and a number redefine the number being compared. Print one line per file naming
             the expected and actual counts, and exit 1 if any of three things holds: a file on
             disk whose count differs from its baseline row; a file on disk that exits non-zero; a
             baseline row with no file on disk, unless that name was passed to --deleted, which is
             repeatable and is how a deliberate deletion is declared out loud instead of silently
             tolerated. A file on disk with no baseline row is printed as new and does NOT fail —
             the two test files this task adds and the two FEAT-48 adds all land in that bucket,
