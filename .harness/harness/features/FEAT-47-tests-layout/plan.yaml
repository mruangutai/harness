    verify: |
      python3 - <<'PY'
      import re, subprocess, sys
      from pathlib import PurePosixPath as P
      TOK = ("UNIT_SCRIPTS", "INTEGRATION_SCRIPTS", "check-kinds")
      G = (".harness/expertise/*.md", ".harness/*/expertise/*.md")
      def git(*a, ck=True):
          return subprocess.run(["git", *a], capture_output=True, text=True, check=ck).stdout
      def sel(out):
          return sorted(n for n in out.splitlines()
                        if n.startswith(".harness/") and any(P(n).match(g) for g in G))
      def txt(p):
          return open(p, encoding="utf-8").read()
      base = git("rev-parse", "origin/main").strip()
      files = sel(git("ls-files"))
      live = [(p, n) for p in files for n, l in enumerate(txt(p).splitlines(), 1)
              if any(t in l for t in TOK)]
      pre = {}
      for p in sel(git("ls-tree", "-r", "--name-only", base)):
          eid = None
          for l in git("show", f"{base}:{p}").splitlines():
              m = re.match(r"- ([A-Z]{1,3}-\d+):", l)
              eid = m.group(1) if m else eid
              if eid and any(t in l for t in TOK):
                  pre.setdefault(p, set()).add(eid)
      gone = [p for p in sorted(pre) if p not in files]
      lost = [(p, i) for p, ids in sorted(pre.items()) for i in sorted(ids)
              if p in files and f"- {i}:" not in txt(p)]
      mute = [p for p in sorted(pre) if p in files and not re.search(r"tests/(unit|integration)", txt(p))]
      ctl = git("grep", "-l", "-e", TOK[0], "-e", TOK[1], "-e", TOK[2], "--",
                ".harness/harness/features/", ck=False).split()
      fmt = (subprocess.run(["bash", ".claude/skills/harness/bin/check-expertise.sh",
                             *sorted(pre)]).returncode if pre and not gone else 9)
      print("base", base, "files", len(files), "repaired", sorted(pre), "live", live, "lost", lost,
            "gone", gone, "not-restated", mute, "control", len(ctl), "fmt", fmt)
      sys.exit(0 if not (live or lost or gone or mute) and len(files) >= 28 and len(pre) >= 5
               and ctl and fmt == 0 else 1)
      PY
