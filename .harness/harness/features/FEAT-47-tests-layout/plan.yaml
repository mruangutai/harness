    dec: DEC-207

  - id: D-13
    choice: >
      FEAT-48 ships WHOLE and lands BEFORE this feature. Parallel safety, the worker pool and
      suite wall time are its scope, and this feature migrates the two test files it adds
      (test-suite-independence.py to tests/unit, test-run-pool.py to tests/integration) while its
