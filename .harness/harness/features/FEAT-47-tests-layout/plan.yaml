    intent: |
      git mv these files from .claude/skills/harness/bin/ to tests/unit/, then repair their
      anchors by the same recipe T-02 states verbatim (TESTS_DIR / ROOT / BIN_DIR derived from
      __file__, two levels up to the root, existing names repointed rather than renamed).

      THE SET is the 19 files enumerated here PLUS FEAT-48's test-suite-independence.py, which
      lands in bin before this task runs and is unit because it is a static ast scan that spawns
      nothing:
      test-code-grade.py test-factory-claim.py test-factory-cli.py test-factory-config.py
      test-factory-gh.py test-factory-land.py test-factory-workspace.py test-gate-policy.py
      test-gh-board.py test-gh-cost-log.py test-harness-boundary.py test-harness-yaml-corpus.py
      test-lead-stop-and-wake.py test-no-distribution.py test-omp-hooks.py
      test-orchestrator-playbook.py test-render-brief.py test-team-catalog.py test-wayfind.py

      test-suite-independence.py NEEDS A DIFFERENT ANCHOR EDIT FROM EVERY OTHER FILE HERE, and
      getting it wrong makes the guard scan nothing while still exiting 0 on a smaller set. It
      imports no bin module. It derives the REPOSITORY ROOT from its own directory — four levels
      up while it sits in bin, two levels up from tests/unit — and os.walks from there to discover
      its own scan set. Repoint that climb to the two-level form, leave its --scan-dir override
      alone, and read the discovered-file count it prints: its own live-tree case asserts that
      count is at least 50, which is what makes a climb landing above or below the root go red
      instead of reporting a clean sweep.

      After the move, bin holds exactly one test-*.py — test-run-unit-tests-kinds.py, which T-05
      deletes in place — and no *.test.ts. This task's verify asserts that exact residue rather
      than an empty bin, because a sweep expecting emptiness here would be red for a reason no
      task in this plan is wrong about.

      ALSO git mv three non-python files into the SAME directory, which is load-bearing rather
      than tidy: omp-hooks.test.ts, omp-session-anchored.fixture.jsonl and
      omp-session-anchorless.fixture.jsonl. test-omp-hooks.py:9 resolves the suite as
      Path(__file__).with_name("omp-hooks.test.ts"), and the suite resolves its two fixtures
      through import.meta.dir, so all four files must sit in one directory or the shim and the
      suite each look in the wrong place. omp-hooks.test.ts itself needs no path edit: with all
      four together, import.meta.dir keeps resolving.

      REPAIR THE ALLOW_LIST, which closes the red window T-02 opened. test-no-distribution.py
      lines 98-105 declare exactly two entries, and the comment above them says exactly two on
      purpose. Rewrite both to the post-move paths: tests/unit/test-no-distribution.py and
      tests/integration/test-check-plan-routes.py. Keep both comments, keep the count at two, and
      do not derive the list from what happens to be present. Once this lands,
      test-no-distribution.py is green again, and it is in this task's verify set, so the repair is
      proven by the verify of the task that performs it.

      test-code-grade.py, test-no-distribution.py and test-gh-board.py stay unit even though they
      spawn children: git builds their fixtures, and fake-gh is a stub standing in for a
      dependency while the artifact under test runs in-process. test-omp-hooks.py stays unit
      because forking bun only re-enters a test suite in another interpreter, and that suite's own
      cases stub the host accessor. The three sub-rules and their exemplars are recorded in
      notes/research-tests-layout.md and belong in DEC-207.

