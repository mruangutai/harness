  - id: T-03
    title: Move the unit tests, the bun suite and its fixtures to tests/unit and repair anchors
    traces: [REQ-02, REQ-03, REQ-04]
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out, same surface and same reason as T-02
    depends_on: [T-02]
    status: pending
    files:
      - .claude/skills/harness/bin/test-*.py
      - .claude/skills/harness/bin/omp-hooks.test.ts
      - .claude/skills/harness/bin/omp-session-anchored.fixture.jsonl
      - .claude/skills/harness/bin/omp-session-anchorless.fixture.jsonl
      - tests/unit/test-*.py
      - tests/unit/omp-hooks.test.ts
    verify: |
      set -e
      BASE=$(git rev-parse --verify --quiet origin/main || git rev-parse --verify main)
      n=$(ls tests/unit/test-*.py | wc -l | tr -d " ")
      [ "$n" -ge 20 ] || { echo "floor 20 = 19 enumerated + FEAT-48 test-suite-independence.py, the 19 measured at 56a30a0; found $n"; exit 1; }
      r=$(git diff -M --name-status "$BASE" -- \
        ".claude/skills/harness/bin/test-*.py" "tests/unit/test-*.py")
      for f in tests/unit/test-*.py; do
        b=$(basename "$f")
        printf '%s\n' "$r" \
          | grep -qE "^R[0-9]+[[:space:]]+\.claude/skills/harness/bin/$b[[:space:]]+$f$" \
          || { echo "no rename from bin recorded for $f"; exit 1; }
        echo "== $f"; python3 "$f"
      done
      git ls-files --error-unmatch tests/unit/omp-hooks.test.ts \
        tests/unit/omp-session-anchored.fixture.jsonl \
        tests/unit/omp-session-anchorless.fixture.jsonl
      left=$(git ls-files -- ".claude/skills/harness/bin/test-*.py")
      [ "$left" = ".claude/skills/harness/bin/test-run-unit-tests-kinds.py" ] \
        || { echo "bin must hold exactly test-run-unit-tests-kinds.py here, holds [$left]"; exit 1; }
      ts=$(git ls-files -- ".claude/skills/harness/bin/*.test.ts")
      [ -z "$ts" ] || { echo "bun suite still tracked under bin: $ts"; exit 1; }
    intent: |
      git mv these files from .claude/skills/harness/bin/ to tests/unit/, then repair their
      anchors by the same recipe T-02 states verbatim (TESTS_DIR / ROOT / BIN_DIR derived from
      __file__, two levels up to the root, existing names repointed rather than renamed).

      THE SET is the 19 files enumerated here PLUS FEAT-48's test-suite-independence.py, which
      lands in bin before this task runs and is unit because it is a static ast scan that spawns
      nothing:
      test-code-grade.py test-factory-claim.py test-factory-cli.py test-factory-config.py
      test-factory-gh.py test-factory-land.py test-factory-workspace.py test-gate-policy.py
      test-gh-board.py test-gh-cost-log.py test-harness-boundary.py test-harness-yaml-corpus.py
      test-lead-stop-and-wake.py test-no-distribution.py test-omp-hooks.py
      test-orchestrator-playbook.py test-render-brief.py test-team-catalog.py test-wayfind.py

      test-suite-independence.py NEEDS A DIFFERENT ANCHOR EDIT FROM EVERY OTHER FILE HERE, and
      getting it wrong makes the guard scan nothing while still exiting 0 on a smaller set. What
      follows is checked against FEAT-48's plan as it stands, not against the earlier draft an
      earlier version of this paragraph was written from.

      THERE IS NO CLIMB TO REPOINT, and the root needs no edit at all. FEAT-48's T-03 resolves the
      repository root through harness_boundary.root_above, a pure marker walk with no depth
      arithmetic and no environment read, wrapped in a named resolve_scan_root(start), and os.walks
      from what that returns. It is layout-independent by construction, which is the property
      FEAT-48 chose it for. Leave the root resolution alone and leave the --scan-dir override
      alone. Do NOT point the walk at a __file__ climb: reintroducing a depth-counting root is
      exactly what FEAT-48's root-refusal case exists to redden, because arithmetic cannot refuse.

      WHAT DOES BREAK IS THE IMPORT. That file reaches harness_boundary by its own directory being
      on sys.path, and after this move its own directory is tests/unit. It therefore takes the
      sys.path half of T-02's recipe and nothing else: derive BIN_DIR from __file__ — two levels up
      to the root, then .claude/skills/harness/bin — and sys.path.insert it before importing
      harness_boundary. That climb is unavoidable and is the ONE place a literal depth survives in
      this file, because the marker walk lives in the module being imported and cannot be called
      before it is on the path. It locates the MODULE only: it must never become the scanned root,
      and it cannot fail quietly, since a wrong climb is an ImportError at import time.

      Then read the discovered-file count the run prints. FEAT-48's own live-tree case asserts that
      count is at least 50 AND that the printed root equals the marker walk's answer, so a run that
      walked the wrong tree or walked nothing is red there as well as in FEAT-48's verify block.

      After the move, bin holds exactly one test-*.py — test-run-unit-tests-kinds.py, which T-05
      deletes in place — and no *.test.ts. This task's verify asserts that exact residue rather
      than an empty bin, because a sweep expecting emptiness here would be red for a reason no
      task in this plan is wrong about.

      ALSO git mv three non-python files into the SAME directory, which is load-bearing rather
      than tidy: omp-hooks.test.ts, omp-session-anchored.fixture.jsonl and
      omp-session-anchorless.fixture.jsonl. test-omp-hooks.py:9 resolves the suite as
      Path(__file__).with_name("omp-hooks.test.ts"), and the suite resolves its two fixtures
      through import.meta.dir, so all four files must sit in one directory or the shim and the
      suite each look in the wrong place. omp-hooks.test.ts itself needs no path edit: with all
      four together, import.meta.dir keeps resolving.

      REPAIR THE ALLOW_LIST, which closes the red window T-02 opened. test-no-distribution.py
      lines 98-105 declare exactly two entries, and the comment above them says exactly two on
      purpose. Rewrite both to the post-move paths: tests/unit/test-no-distribution.py and
      tests/integration/test-check-plan-routes.py. Keep both comments, keep the count at two, and
      do not derive the list from what happens to be present. Once this lands,
      test-no-distribution.py is green again, and it is in this task's verify set, so the repair is
      proven by the verify of the task that performs it.

      test-code-grade.py, test-no-distribution.py and test-gh-board.py stay unit even though they
      spawn children: git builds their fixtures, and fake-gh is a stub standing in for a
      dependency while the artifact under test runs in-process. test-omp-hooks.py stays unit
      because forking bun only re-enters a test suite in another interpreter, and that suite's own
      cases stub the host accessor. The three sub-rules and their exemplars are recorded in
      notes/research-tests-layout.md and belong in this feature's own decision entry, the one
      T-06 writes.

