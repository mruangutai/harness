decisions:
  - id: D-01
    choice: gh_board.project is the single projection policy, and each active top-level feature phase assigns the same station to every unique recorded source, parent, and non-abandoned task card.
    because: phase cards must describe one feature lifecycle rather than expose unrelated task-local progress as competing board truth.
    dec: DEC-203
  - id: D-02
    choice: An active signed-plan task mutation stores transient approval.resume_station metadata, resets the local feature station to plan, and leaves every GitHub mutation to an explicit caller.
    because: atomic local reset preserves the interrupted phase without adding network failure to the plan writer or extending feature.json.
    dec: DEC-229
  - id: D-03
    choice: Initial signature and reapproval both run idempotent mirror opening followed by the station emitted by sign-approval, with initial approval defaulting to ready.
    because: one post-signature checkpoint handles new mirrors, newly added tasks, and phase resume while retaining the existing build_entry receipt schema.
    dec: DEC-220
  - id: D-04
    choice: A must-fix cycle moves all cards to building before the fix team is dispatched, and after the fix run returns the orchestrator moves all cards to review at the next validation boundary while leaving the fix-team reader wave unchanged.
    because: existing orchestrator-owned checkpoints preserve DEC-224 one-run fix-team independence and DEC-226 rework authority without another agent spawn, reader serialization, or user approval.
    dec: DEC-224
  - id: D-05
    choice: The existing board_lifecycle reconcile --apply command is the one-time repair entry point for active features and reuses the shared projection and one bounded station snapshot.
    because: extending the idempotent repair path avoids a second migration command and keeps drift detection, mutation, and repair on one policy.
    dec: DEC-203
  - id: D-06
    choice: Done remains ship-only, abandonment remains unchanged, the exact six station vocabulary remains closed, and every outbound card write remains best effort.
    because: the defect is incomplete active-phase projection, not terminal semantics, station schema, or synchronization authority.
    dec: DEC-138

