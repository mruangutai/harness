    intent: |
      Add failing cases beside the existing approval auto-reset cases before implementation. For every task-changing verb that resets an approved active plan in plan, ready, building, or review, perform one locked update that writes approval.status pending, reset_at, reset_reason, and approval.resume_station, and sets the top-level feature status to plan. Classify resume_station from the pre-reset phase and the resulting task set: ready when the phase is plan or ready and no task shows started work; review only when the interrupted phase is review and every resulting task is done or abandoned; building when the interrupted phase is building or review with non-terminal resulting work, or whenever resulting task state proves work started. On another task mutation while approval is pending and resume metadata exists, recompute the target so added ready work cannot leave a stale review target. Do not reopen top-level done or abandoned features. Keep reset and status bytes verified after reload before printing APPROVAL-RESET. Make sign-approval remove reset_at, reset_reason, and resume_station, preserve rulings and rework ordering, and print one machine-readable RESUME line: ready for an initial signature and the stored classified station for reapproval. Do not call GitHub from plan-merge. Cover all three resume outcomes, repeated pending mutation, terminal non-reopening, receipt accuracy, metadata cleanup, byte-preserving splice behavior, and existing signature and rework cases.

