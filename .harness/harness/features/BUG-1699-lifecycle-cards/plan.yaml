    intent: |
      Write the failing focused projection and status scenarios first. Replace gh_board.project's per-task active policy with one feature-phase projection: for top-level plan, ready, building, or review, return the same lowercase phase for every unique recorded source issue, parent issue, and task issue whose plan task is not abandoned. Preserve terminal done projection, absent and abandoned handling, duplicate issue de-duplication, lowercase values, and the exact six configured station vocabulary. Make cmd_status keep its existing approval and completion guards, record the local station first, and for plan, ready, building, and review attempt every issue in the shared projection through the existing board adapter. Catch and report each BoardError so later cards are still attempted. When sync is disabled or board configuration is absent, retain the local station update and perform no remote call. Leave done to cmd_ship and abandoned to cmd_abandon. Keep start-task as an idempotent task-start receipt path, not a second feature-phase projection. Update INV-26 expectations to consume the same project result. Prove initial Ready, Plan, Building, and Review exact issue sets including source, parent, and tasks; duplicate de-duplication; abandoned exclusion; per-card partial failure continuation; and local-only behavior. Keep existing open, start-task, ship open-child, and abandon regression scripts green.

