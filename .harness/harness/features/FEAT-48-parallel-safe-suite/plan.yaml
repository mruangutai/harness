      b = ".claude/skills/harness/bin/"
      pool = subprocess.run([sys.executable, b + "test-run-pool.py"],
                            capture_output=True, text=True)
      print((pool.stdout + pool.stderr)[-1200:])
      ck = subprocess.run(["bash", b + "run-unit-tests.sh", "--check-kinds"],
                          capture_output=True, text=True)
      ran = [l for l in ck.stdout.splitlines() if l.startswith(("PASS", "FAIL"))]
      bad = subprocess.run(["bash", b + "run-unit-tests.sh", "--kind", "nope"],
                           capture_output=True, text=True)
      print("pool", pool.returncode, "check_kinds", ck.returncode, "ran_any", ran,
            "unknown_kind", bad.returncode)
      sys.exit(0 if (pool.returncode == 0 and ck.returncode == 0 and not ran
                     and bad.returncode == 2) else 1)
      PY
    intent: |
      SEQUENCING, READ FIRST (D-09). This task lands only after FEAT-47 has merged to main and
      this branch has been rebased onto it, because it builds on that feature's
      directory-driven discovery. Resolve the actual paths with git ls-files before editing:
      if FEAT-47 has landed, the test files live under tests/ and discovery is directory-driven,
      so registration means placing test-run-pool.py in the integration directory and the
      harness.json edit may be unnecessary. If run-unit-tests.sh still carries UNIT_SCRIPTS and
      INTEGRATION_SCRIPTS, add "test-run-pool.py" to INTEGRATION_SCRIPTS AND add the explicit
      path .claude/skills/harness/bin/test-run-pool.py to test_kinds.integration.detect in
      .harness/harness.json — the KIND CROSS-CHECK exits 2 if an INTEGRATION_SCRIPTS name is
      absent from that string, and the drift detector exits 2 if the file is in neither array.
      If the runner's shape has changed in a way neither branch describes, return BLOCKED for
      re-planning rather than guessing.

      WHAT TO BUILD.

      1. .claude/skills/harness/bin/run_pool.py — the scheduler, and the only new logic.

         CLI: run_pool.py [--workers N] -- <script path> [<script path> ...]
         Every path is run as [sys.executable, path] from the repository root, in its own
         subprocess, exactly as the serial loop does today.

         WORKER COUNT (D-06): --workers when given; else HARNESS_TEST_WORKERS when it parses as
         a positive integer; else min(8, max(2, os.cpu_count() or 2)). A non-integer or
         non-positive HARNESS_TEST_WORKERS is a loud error, exit 2, never a silent fallback:
         a typo that halves the suite's speed must not be invisible. The cap is 8 because the
         floor is 36.7s, set by the slowest single file, so more workers buy bounded time at
         unbounded fork pressure; CI runners are about 4 vCPU and the same rule gives them 4.

         EXECUTION: a fixed pool of that many workers draws from one shared queue in list
         order. Use concurrent.futures.ThreadPoolExecutor with subprocess.run — the work is
         entirely in child processes, so threads are the right primitive and the GIL is not in
         the path. No file may be started twice, and none may be skipped.

         OUTPUT (D-07, REQ-04): capture each child's stdout and stderr combined, and print
         nothing until that file finishes. On completion print, as one contiguous block:
           ----- <basename> (exit <rc>, <secs>s) -----
           <the captured output>
           PASS <basename>        or        FAIL <basename>
         The PASS and FAIL lines keep today's exact spelling, on stdout, one per file.
         test-run-unit-tests-kinds.py case 1 greps lines starting with PASS or FAIL, and
         harness-qa reads them; a changed prefix breaks both silently.

         SUMMARY, last two lines on stdout, and REQ-05 rests on them:
           pool: <n> workers, <k> files, <total>s wall
           slowest: <basename> <secs>s, <basename> <secs>s, <basename> <secs>s
         The three slowest, so the floor stays visible to whoever next wonders why more workers
         did not help.

         EXIT: 1 if any file exited non-zero, 0 otherwise, 2 for a usage or configuration
         error. Never let one child's crash abandon the pool: every queued file runs, and the
         verdict is the aggregate.

      2. run-unit-tests.sh — replace the serial for loop, and NOTHING else. The root
         resolution, BIN_DIR, both script arrays, the --kind parsing, the --check-kinds mode,
         the drift detector and the KIND CROSS-CHECK all stay exactly as they are, including
         their exit-2 paths, because REQ-06 is a contract three callers depend on. The loop
         becomes one call:
           python3 "$BIN_DIR/run_pool.py" -- "${SCRIPTS[@]/#/$BIN_DIR/}"
         and the script exits with the pool's status. Keep the comment block explaining the
         unit/integration split; add one short one saying the pool owns scheduling and bash
         owns selection, and why (D-05).

      3. .claude/skills/harness/bin/test-run-pool.py — INTEGRATION, because every case forks
         the pool. Fixtures are shell or python scripts written under tempfile.mkdtemp() and
         removed in a finally; nothing is written into the live tree, and the invariant from
         T-03 will hold you to that. Cases, each asserting on OUTPUT and not merely on an exit
         code:
           a. attribution: three fixture scripts each printing a distinct token to stdout and
              another to stderr; assert each token appears between that file's block header and
              its PASS line, and that no two blocks interleave. This is the case that fails if
              output is streamed rather than buffered.
           b. failure propagation: one fixture exiting 3 among four passing; assert overall
              exit 1, exactly one FAIL line, that it names the failing basename, and that the
              failing child's own output still appears.
           c. every file runs exactly once: eight fixtures, each appending its name to a file
              in the tempdir; assert the file has eight distinct lines.
           d. worker count: HARNESS_TEST_WORKERS=1 and =3 each reported verbatim in the
              pool: line; HARNESS_TEST_WORKERS=0 and =many exit 2 and name the variable.
           e. order is not load-bearing (SC-08): a set built so completion order cannot match
              input order — the first fixture sleeps 0.4s, the rest are instant — run with 4
              workers; assert the sequence of PASS lines differs from the input order while the
              set of verdicts is identical to the same set run with --workers 1.
           f. the cap: with HARNESS_TEST_WORKERS unset, assert the reported count is at least 2
              and at most 8. Do not assert an exact number — it is machine-dependent by design.

      Test-first: write test-run-pool.py before run_pool.py, run it, and record the import or
      usage failure in the receipt.

      ONE NOTE ON THE VERIFY BLOCK. Its --check-kinds and unknown-kind clauses are REGRESSION
      clauses: measured 2026-08-31 at ea6f51f they already pass, exit 0 with no PASS or FAIL
      line and exit 2 respectively, so they prove nothing about the pool and everything about
      REQ-06. The discriminating half is test-run-pool.py, which does not exist until you write
      it.

      FINALLY, THE THREE MEASUREMENTS NO RUNNER CAN TAKE. SC-02, SC-05 and SC-06 have no gate
      behind them, so they are discharged here or by nobody. Record all three, verbatim output
      and commands, in
      .harness/harness/features/FEAT-48-parallel-safe-suite/notes/measurements-parallel-suite.md:
        - SC-02: the poll from notes/research-parallel-safety.md re-run over a full --kind all
          run, expecting zero broken reads of the live feature_schema.py; AND the same poll run
          against git show ea6f51f of test-check-domain.py, which MUST see more than zero. A
          control that sees nothing makes the zero inconclusive, not passing — say so in the
          note if that is what happens.
        - SC-05: ten consecutive --kind all runs at the runner's own worker count, each exit
          code and wall time listed. State plainly that ten clean runs do not prove the hazard
          is gone (this flake produced 6 consecutive clean 8-worker runs while present) and
          that SC-01 and SC-03 carry that claim.
        - SC-06: the runner's own pool: and slowest: lines from one --kind all run on the
          12-core machine, and the serial 247s baseline it is being compared against.

