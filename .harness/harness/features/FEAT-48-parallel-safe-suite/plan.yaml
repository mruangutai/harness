    dec: none
  - id: D-10
    choice: >
      Every live-tree mutation site the census scan reports AT BUILD TIME is fixed here rather than
      allowlisted, and the fix scope is DERIVED by running that scan rather than read off an
      enumeration in this plan. No count and no file list anywhere in this plan defines that scope.
    because: >
      They are the same hazard class as the injection site T-01 removes and the invariant T-03 adds
      cannot ship green beside them. THE ENUMERATION IS THE DEFECT, NOT THE COUNT, which is why this
      entry no longer carries one. The earlier drafts of this decision named three sites, then four
      after FEAT-45's commit 70fd441 merged one in during drafting, and the rebase onto origin/main then
      took it to eight across four files as FEAT-50 and BUG-1071 landed. Three rewrites of one list,
      each correct when written and stale within a cycle, on a branch whose whole subject is that the
      shared tree changes underneath a running suite. A scope defined by a list is a scope that rots at
      sibling-merge frequency; a scope defined by a procedure does not.

      THE CENSUS SCAN, the derivation, stated precisely enough that two doers get the same set. It needs
      no code this feature has not shipped and no judgement calls: (1) list every test-*.py directly
      under .claude/skills/harness/bin, sorted by name, which is the file set the lanes glob bounds; (2)
      snapshot (size, st_mtime_ns) for every file directly under that directory, skipping __pycache__
      and any name ending .pyc; (3) run each test file in turn as [sys.executable, path] from the
      repository root, with a daemon thread polling os.listdir of that directory throughout and
      recording every name absent from the snapshot; (4) after each file exits, re-snapshot and record
      every snapshotted path whose tuple changed or vanished; (5) print one line per pair, SITE
      test-file basename, sorted. The derived set is exactly the set of SITE lines. It is deterministic
      on a given tree because every known site creates its mutant unconditionally on the path the suite
      always takes, and it is reproducible by anyone: no grep pattern to get wrong and no taint model to
      reimplement. The basename is the durable identifier, as this plan already held; the anchors never
      were. Cost is one serial suite pass over those files, about 250s at 2a5cbada, which is why it is a
      build-time procedure the doer runs and records, and NOT a verify block.

      DATED OBSERVATION, NON-BINDING, AND THE ONLY FIGURE THIS ENTRY STATES. Derived at source at
      2a5cbada on 2026-09-01 by reading each site rather than by running the scan: EIGHT sites in FOUR
      files. test-check-state.py writes .mutant-check-state-t14.sh, .mutant-check-state-t10.sh,
      .check-state-inv32-mutant.sh and .check-state-inv32-era-mutant.sh; test-feature-worktree.py writes
      .mutant-feature-worktree-behind.py; test-bash-write-guard.py writes
      .feat50-bash-write-guard-PID.sh; test-check-domain.py writes .feat50-check-domain-PID.sh from the
      helper _feat50_mutant_between, which has two callers, and separately overwrites the live
      feature_schema.py, which is the site T-01 always owned. Two of those eight basenames embed
      os.getpid(), so no fixed basename list could ever have named them — the shape argument in one
      line. THIS FIGURE SIZES THE WORK AND DOES NOT DEFINE IT. If the scan at build time reports a
      different set, the SCAN is right and this sentence is stale, and no task may be skipped or
      narrowed on the strength of it.

      THE BOUNDARY, AND IT IS AN ESCALATION, NEVER A SILENT WRITE. The census scan's file set is bounded
      by the lanes glob .claude/skills/harness/bin/**. lanes: keys on that GLOB and not on individual
      files, so every test file beneath it is already lane-resolved and adding one to a task's files:
      needs no new lanes row. D-03's static walk is REPOSITORY-WIDE and can therefore report a site
      OUTSIDE the glob: such a site has no lanes row, no task owns it, and the doer must STOP and
      escalate to the operator rather than write it. At 2a5cbada all 59 discovered test files live under
      the glob, so the boundary is vacuous today; it is stated because FEAT-47 moves the whole tree to
      tests/unit, tests/integration and tests/manual, and D-09 has FEAT-48 merging first precisely so
      that move happens after this scope closes.

      AN ALLOWLIST IS STILL REFUSED, and deriving the scope is NOT a softening of D-04. Derivation makes
      the SET open; it does not make any member optional. An allowlist entry makes a member optional,
      which is how an invariant dies quietly — an allowlist covering the first eight violations is an
      invariant that never bound anything. What changed is where the set comes from, not whether every
      member of it is fixed.

      WHAT THIS CHANGES AND WHAT IT DELIBERATELY LEAVES. T-02's verify MECHANISM was already derived
      and is KEPT unchanged in substance: it polls the directory for anything that appeared rather
      than matching fixed basenames, so a new site in a file it runs reddens it on its own. What
      failed was the ENUMERATION around that mechanism — the four-item site list in T-02's intent and
      the two-file run set its verify iterated by literal name, which is why the
      test-bash-write-guard.py site and the second test-check-state.py mutant were invisible to a task
      that was otherwise correct. So the site list goes, the poll stays, and a verify's run set is
      DERIVED from plan.yaml's own ownership graph rather than spelled a second time where the two can
      drift apart: a task's run set is its own files: list, plus the files of every task superseded
      into it, minus the files of every OTHER still-live task — the task's own files: are excluded
      from that subtraction, so a file it also lists stays in the set.

      OWNERSHIP IS NO LONGER SPLIT BY FILE, AND T-07 IS SUPERSEDED. The tooling reason it ever existed
      is recorded here because nothing else records it, and because the same constraint will be met
      again. The test-bash-write-guard.py site could not be ADDED to T-02's files:, because
      plan-merge.py amend refuses a list field (measured, exit 4: "a list or mapping field would need
      its structure rewritten, which is apply's job") and apply refuses any existing id whose value
      differs (exit 7 CONFLICT). apply CAN add a new id, so cycle 4 made that site a task of its own,
      T-07. THAT SPLIT WAS ITSELF THE DEFECT. It contradicted the derived shape this entry mandates,
      and it put T-03's ordering into prose, because T-03's depends_on cannot be widened for the same
      reason — leaving a task that had to land before T-03 sitting as T-03's sibling in a ready wave,
      held apart by a sentence. Cycle 5 closes the hole without ever writing a list. T-07 is stationed
      abandoned and superseded in place: there is no delete verb, and the record of why it existed is
      worth keeping. T-02 owns the site, and its verify reaches it by DERIVATION — its own files: plus
      the files of every task whose station is abandoned and whose depends_on names T-02, minus the
      files of every OTHER still-live task — T-02's own files: are excluded from that subtraction —
      which is what keeps T-01's test-check-domain.py out of T-02's run set. The ordering that was
      prose is now the edge T-03 already carries, depends_on [T-01, T-02]; between them T-01 and T-02
      own every site the census scan reports.

      TWO INSTRUMENTS, ONE DIVISION, because neither alone fits a 60s verify budget. T-01's and T-02's
      verify blocks are the OWNERSHIP check over the files each task changes; measured serially at
      2a5cbada, those files cost 22.5s, 33.6s, 5.7s and 7.8s, which is what bounds them and why T-02
      runs its three concurrently — serially they would blow the budget, concurrently the wall clock is
      the slowest of them. Each is true by construction about completeness and claims nothing about it.
      COMPLETENESS is T-03's live-tree ZERO over every file D-03's walk discovers — the derived
      instrument that sees a site in a file no task names. A site either of them missed reddens there,
      in CI, on every push to an open PR.
  - id: D-11
    choice: >
      run_pool.py enforces REQ-01 at RUNTIME on every run, not only at fix time, over ONE
      watched directory: given --mutation-check DIR it records (size, mtime_ns) for every file
      at or below DIR before the first child starts and again after the last child exits —
      tracked and UNTRACKED alike, by walking DIR rather than asking git, and excluding
      __pycache__ directories and *.pyc — then fails the run naming, relative to DIR, every
      path that changed, vanished or appeared. run-unit-tests.sh passes
      --mutation-check "$BIN_DIR", the shared code directory, and never the repository root;
      T-06's verify asserts that exact argument and T-04's asserts the check's behaviour.
    because: >
      the static invariant T-03 adds checks the SOURCE of the tests, and this feature's own research
      note records the two classes it cannot see: a mutation performed through a subprocess
      (notes/research-FEAT-48-independence-invariant.md, Open) and one wrapped in a helper, since taint
      does not cross a call boundary. A before/after comparison of on-disk state is blind to neither,
      because it grades the effect and not the syntax. WHAT IT COVERS AND WHAT IT DOES NOT, stated
      because an earlier draft of this entry claimed coverage "against every vector including the two
      the scan is blind to", which is false of any bounded watched set and would stop the next auditor
      looking. Inside DIR it is vector-agnostic, and it sees a NEW UNTRACKED file appear — the vector
      every live-tree mutation site T-01 and T-02 remove actually used (.mutant-*.sh, .mutant-*.py,
      .check-state-inv32*.sh and the PID-named .feat50-*.sh materialising in live bin/; the set is
      derived at build time and not counted here, per D-10) and the one a git ls-files watched set
      cannot see at all. Outside DIR it sees NOTHING: a test that writes .harness/harness.json or a
      workflow file is caught only by T-03's static scan, with that scan's two blind spots intact. THERE
      IS A THIRD UNCOVERED CLASS, named here so the next auditor does not read the two named blind spots
      as the whole gap: T-03's taint model seeds only the literal __file__, so a write to a path built
      from a relative literal or joined onto os.getcwd() carries no tainted name and the static scan
      reports nothing, while a target outside DIR is invisible to this check too. Such a write is caught
      by NEITHER half. THERE IS A FOURTH UNCOVERED CLASS, opened by T-03's own content-read exclusion
      and named here for the same reason: because a value read out of a file does not carry that file's
      taint, a write to a target derived from the CONTENT of a tainted read — a path string embedded in
      a manifest, config or fixture the test reads — is never tainted, so the static scan misses it even
      where the target is inside the live checkout. Inside DIR the runtime check still grades it,
      because that half grades the effect; outside DIR neither half sees it. It is unexploited at
      d5c23a0 — the scan re-derived independently there finds exactly the ten known sites and nothing
      else — and the exclusion stays, because without it SC-03's live-tree zero is unreachable in any
      tree. The two checks together are not complete and no criterion here claims they are. WHY DIR IS
      bin/ AND NOT THE ROOT. The root-wide set the first draft specified is unusable in this factory,
      and not marginally: agents write .harness/harness/features/** — plans, notes, runs, observations —
      continuously while suites run, and run-unit-tests.sh is invoked BY those agents on the same
      machine. Operator measurement, 2026-08-31: 1,904 tracked files under that tree modified in three
      hours across the live worktrees. A root-wide snapshot therefore reddens a passing suite whenever a
      sibling agent writes a note — a new flake class introduced by the fix for a flake. bin/ is the
      shared code every test file imports from, both observed hazard sites are in it, and no agent
      writes it during a run. __pycache__ is excluded because a child importing a bin module writes
      bin/__pycache__/*.pyc by itself on every run; that directory exists in the tree today, so without
      the exclusion the check reddens on its own side effect. THE RESIDUAL TRADE, accepted: an agent or
      a human who edits a file in bin/ DURING a run trips it. That is rarer than the features-tree case
      by construction, and it is not a false alarm in the same sense — the suite's own code changed
      under it, so the verdict is untrustworthy either way — but it is a real red, so the failure line
      says that a file edited during the run looks identical from here, and names the path. T-06 records
      the tree condition its ten SC-05 runs were taken under, because that is the real operating
      condition rather than the quiet tree the first draft assumed. GIT IS NOT USED AT ALL. Dropping git
      ls-files is what makes untracked creation visible and what lets test-run-pool.py's fixtures run
      outside a checkout; the refusal it replaces — git absent or ls-files failing — becomes DIR absent
      or holding no files, exit 2, so a check that measured nothing can never report clean. Cost is
      bounded above by the root-wide measurement it replaces, 2 x 14ms over 2,069 paths at ea6f51f
      against a ~47s run; bin/ holds 117 files at ccf674a, 2,150 tracked paths repository-wide.
    dec: none

tasks:
  - id: T-01
    title: Give both test-check-domain.py mutation probes a private bin copy instead of the live tree
    traces: [REQ-01]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >
      DEC-174 carve-out. test-check-domain.py is the test of check-domain.sh, the PreToolUse
      hook that decides every agent write, and AGENTS.md:8 names a gate's test verbatim.
    depends_on: []
    status: plan
    files:
      - .claude/skills/harness/bin/isolated_bin.py
      - .claude/skills/harness/bin/test-check-domain.py
    verify: |
      python3 - <<'PY'
      import os, subprocess, sys, threading
      b = ".claude/skills/harness/bin"
      fs = os.path.join(b, "feature_schema.py")
      before, m = open(fs, "rb").read(), os.stat(fs).st_mtime_ns
      base, appeared, stop = set(os.listdir(b)), set(), threading.Event()
      def poll():
          while not stop.is_set():
              try:
                  appeared.update(set(os.listdir(b)) - base)
              except OSError:
                  pass
      threading.Thread(target=poll, daemon=True).start()
      r = subprocess.run([sys.executable, os.path.join(b, "test-check-domain.py")],
                         capture_output=True, text=True)
      stop.set()
      after, m2 = open(fs, "rb").read(), os.stat(fs).st_mtime_ns
      out = (r.stdout + r.stderr).splitlines()
      crash = [l for l in out if l.startswith("ok") and "CRASHING schema module DENIES" in l]
      untouched = [l for l in out if l.startswith("ok") and "never written" in l]
      print("exit", r.returncode, "bytes_equal", after == before, "mtime_equal", m == m2,
            "crash_case", len(crash), "untouched_case", len(untouched),
            "appeared", sorted(appeared))
      sys.exit(0 if (r.returncode == 0 and after == before and m == m2 and len(crash) == 1
                     and len(untouched) == 1 and not appeared) else 1)
      PY
    intent: |
      Remove BOTH shared-file mutation sites in test-check-domain.py and keep every case they
      prove. Do not narrow a window, do not retry, do not reorder: the hazard is removed, not made
      less likely.

      RE-DERIVE THE SITES BEFORE YOU EDIT. Every line number below is a DATED OBSERVATION at
      2a5cbada on 2026-09-01 and is NON-BINDING (D-10); the basenames and the function names are the
      durable identifiers. Run D-10's census scan over this file first and record its SITE lines in
      the receipt. If it reports a site in this file that is not described below, fix it in the same
      shape and say so in the receipt; a site outside .claude/skills/harness/bin/** is an escalation
      to the operator, never a silent write.

      SITE A — run_schema case 3, at 1470-1492. It proves that a crashing schema checker DENIES a
      write rather than failing open. It does so by rewriting the LIVE
      .claude/skills/harness/bin/feature_schema.py, firing the hook, and restoring the bytes in a
      finally. The restore is correct and asserted. The invariant it protects is "the file is intact
      afterwards"; the invariant concurrency needs is "no other process reads this file while it is
      broken", and no care inside one process can supply that. Measured 2026-08-31: 5,105 of
      1,032,849 polls saw a broken module, first at 8.68s into one run.
      notes/research-parallel-safety.md holds the evidence.

      SITE B — the helper _feat50_mutant_between, at 3275-3289, which writes
      .feat50-check-domain-PID.sh INTO the live bin directory, chmods it, runs it, and unlinks it in
      a finally. Two callers, _feat50_binding_red_case at 3293 and the second at 3367. Same hazard
      class as SITE A and strictly worse in one respect: the basename embeds os.getpid(), so no
      fixed-name census could ever have listed it, which is why D-10's scope is derived. It was
      absent at d5c23a0 and arrived on the rebase with FEAT-50.

      WHY PYTHONPATH IS NOT THE ANSWER for either, despite what the research note proposes.
      check-domain.sh exports PYTHONPATH with its own directory first (line 102) and then its
      heredoc runs sys.path.insert(0, _bin_dir) with _bin_dir taken from argv (line 125). Both
      entries are the real bin directory, so a tempdir on PYTHONPATH loses. The child must therefore
      run a hook whose OWN directory is private.

      WHAT TO BUILD.

      1. A new module .claude/skills/harness/bin/isolated_bin.py exposing one function:

           def isolated_bin(dest_root):
               """Copy the live bin directory to <dest_root>/.claude/skills/harness/bin and
               return that path. The copy is a real copy, never symlinks: check-domain.sh
               derives its root with cd/pwd on dirname(BASH_SOURCE), so a symlinked script
               would resolve back into the live tree and defeat the isolation."""

         Implement with shutil.copytree from os.path.dirname(os.path.realpath(__file__)), creating
         parents. Measured cost, a DATED and NON-BINDING observation re-measured at 8ca95d65 on
         2026-09-01 (D-10): 25 to 42ms across three runs, copying the 146 files copytree sees under that
         directory. It replaces an unlabelled 48ms-for-111-files figure that was stale as well as
         unlabelled, since D-11 records the directory at 117 files at ccf674a; re-derive rather than
         trust it. Name the four-levels-up shape in a comment: the destination path is what makes the
         copied hook derive dest_root as its project root, which is why the segment
         .claude/skills/harness/bin is not cosmetic. Do not add a mode, a filter or a cache argument;
         one caller shape, one function. T-02 imports it for every site it fixes, so it is built here
         and changed nowhere else.

      2. SITE A. In run_schema, replace case 3 with four steps. Import the helper with
         sys.path.insert(0, HERE) beside the existing HERE constant.

         a. iso = isolated_bin(root), where root is the SCHEMA_MANIFEST fixture the function already
            builds. Reusing the fixture root keeps one root: the copied hook derives it from its own
            location and _env already points HARNESS_PROJECT_DIR at it.
         b. A CONTROL, and it is load-bearing: fire the COPIED, UNBROKEN hook at the illegal
            document and assert exit 2 with invented_key in stderr. Without it, case 3's exit 2
            could come from any difference between the copy and the original rather than from the
            injection, and the case would be green for the wrong reason. Assert it with the existing
            case() helper, named so it reads as a control.
         c. Break the copy in place: same marker search on os.path.join(iso, "feature_schema.py"),
            same injected raise. No before-bytes, no try, no finally, no restore — nothing shared is
            being mutated, and a restore here would only re-teach the pattern.
         d. Fire the copied hook again at the illegal document and keep the existing assertion
            verbatim: exit 2 and CRASHED in stderr, with the same detail string.

         Then replace the old restoration assertion with the property that actually matters, phrased
