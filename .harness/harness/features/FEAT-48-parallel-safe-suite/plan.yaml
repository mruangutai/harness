      describes, return BLOCKED rather than guessing.

      WHAT TO BUILD.

      1. .claude/skills/harness/bin/run_pool.py — the scheduler, and the only new logic.

         CLI: run_pool.py [--workers N] [--mutation-check DIR] -- <path> [<path> ...]
         Every path is run as [sys.executable, path] from the current directory, in its own
         subprocess, exactly as the serial loop does today.

         WORKER COUNT (D-06): --workers when given; else HARNESS_TEST_WORKERS when it parses as
         a positive integer; else min(8, max(2, os.cpu_count() or 2)). A non-integer or
         non-positive HARNESS_TEST_WORKERS is a loud error, exit 2, never a silent fallback:
         a typo that halves the suite's speed must not be invisible. The cap is 8 because the
         floor is 36.7s, set by the slowest single file, so more workers buy bounded time at
         unbounded fork pressure; CI runners are about 4 vCPU and the same rule gives them 4.

         EXECUTION: a fixed pool of that many workers draws from one shared queue in list
         order. Use concurrent.futures.ThreadPoolExecutor with subprocess.run — the work is
         entirely in child processes, so threads are the right primitive and the GIL is not in
         the path. No file may be started twice, and none may be skipped.

         OUTPUT (D-07, REQ-04): capture each child's stdout and stderr combined, and print
         nothing until that file finishes. On completion print, as one contiguous block:
           ----- <basename> (exit <rc>, <secs>s) -----
           <the captured output>
           PASS <basename>        or        FAIL <basename>
         The PASS and FAIL lines keep today's exact spelling, on stdout, one per file.
         test-run-unit-tests-kinds.py case 1 greps lines starting with PASS or FAIL, and
         harness-qa reads them; a changed prefix breaks both silently.

         SUMMARY, last two lines on stdout, and REQ-05 rests on them:
           pool: <n> workers, <k> files, <total>s wall
           slowest: <basename> <secs>s, <basename> <secs>s, <basename> <secs>s
         The three slowest, so the floor stays visible to whoever next wonders why more workers
         did not help. The pool: line's spelling is asserted verbatim by this task's verify
         block and by T-06's, so it is a contract, not a log line.

         THE RUNTIME MUTATION CHECK (D-11, REQ-01). With --mutation-check DIR: before the
         first child starts, os.walk DIR and record (size, st_mtime_ns) for every file at or
         below it, skipping __pycache__ directories and any name ending .pyc. After the last
         child exits, walk it again. For every path whose tuple differs — including one that
         vanished and one that APPEARED, which is the vector the static scan and a git-based
         watched set both miss — print
           MUTATED <path relative to DIR>
         on STDOUT, one per path, because the verify blocks parse stdout as they do for PASS and
         FAIL. Then print, once, one line saying that a file under the watched directory changed
         while the suite ran, that this violates REQ-01, and that a file edited by hand or by
         another agent DURING the run looks identical from here. Any MUTATED line makes the run
         exit 1 even when every file passed.
         DO NOT USE git ls-files, and do not ask git anything: the untracked-creation vector is
         invisible to it (D-11), and a git-free walk is what lets test-run-pool.py's fixtures
         point the check at a bare tempdir. The refusal that replaces "git failed" is a walk
         that measured nothing: if DIR does not exist, is not a directory, or the pre-run walk
         finds zero files, exit 2 and say so — never report clean, which would be a check that
         passed because it looked at nothing. Without the flag there is no snapshot at all;
         T-06's verify asserts run-unit-tests.sh always passes it, and passes "$BIN_DIR"
         specifically, so neither the off state nor a root-wide watched set is reachable from
         CI.

         EXIT: 1 if any file exited non-zero or any watched path was mutated, 0 otherwise, 2
         for a usage or configuration error. Never let one child's crash abandon the pool:
         every queued file runs, and the verdict is the aggregate.

      2. .claude/skills/harness/bin/test-run-pool.py — INTEGRATION, because every case forks
         the pool. Fixtures are shell or python scripts written under tempfile.mkdtemp() and
         removed in a finally; nothing is written into the live tree, and the invariant from
