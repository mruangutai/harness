decisions:
  - id: D-01
    choice: >
      The crashing-checker probe gets its broken feature_schema.py from a private COPY of the
      bin directory in a tempdir, not from a tempdir placed first on the child PYTHONPATH.
    because: >
      check-domain.sh runs sys.path.insert(0, _bin_dir) inside its heredoc — at line 125 as a DATED,
      NON-BINDING anchor at 2a5cbada on 2026-09-01, whose durable identifier is that insert call
      itself — so the real bin directory wins over PYTHONPATH and the note's PYTHONPATH direction
      cannot reach this consumer. Measured cost of the copy at ccf674a: 44ms for 117 files.
    dec: none
  - id: D-02
    choice: >
      The independence invariant is a test file that performs the scan itself, not a new gate
      script with a CLI plus a separate test.
    because: >
      one file and one registration instead of two, it runs in CI as part of the unit kind,
      and it needs no subprocess so it stays in the fast kind.
    dec: none
  - id: D-03
    choice: >
      The invariant discovers its own scan set by walking the repository for test-*.py and
      test_*.py, excluding .git, .claude/worktrees, node_modules and .venv, rather than
      reading a directory list or the runner's arrays.
    because: >
      FEAT-47 moves every test file to tests/unit, tests/integration and tests/manual; a
      layout-independent walk survives that move, and it also sees an uncommitted test file
      that a git ls-files scan would miss.
      ACCEPTED CONSEQUENCE, weighed and adopted here rather than overlooked: the walk prunes
      exactly those four directories and does walk .harness/**, so together with D-04's refusal
      of an escape hatch any file named test-*.py or test_*.py anywhere under the root becomes a
      CI gate subject the moment it is written — a throwaway repro script saved beside the thing
      it reproduces reddens the unit step of every open PR until it is renamed. Taken
      deliberately, because the failure is loud, names the offending file and line, and is
      recovered by a rename. The alternative is a curated list that stops seeing a test file the
      moment someone moves it, which fails silently and is the failure this invariant exists to
      prevent.
    dec: none
  - id: D-04
    choice: The invariant has no per-line escape-hatch comment.
    because: >
      an escape hatch is how an invariant dies quietly; a genuinely legitimate live-tree
      write is grounds to amend the rule deliberately, in a diff a human reads.
    dec: none
  - id: D-05
    choice: >
      Scheduling lives in a Python module, run_pool.py, invoked once by run-unit-tests.sh;
      bash keeps kind selection, the drift detector and the kind cross-check.
    because: >
      worker pools, per-file output capture and exit aggregation are not testable in bash at
      the granularity SC-04, SC-07 and SC-08 require. Cost: one extra interpreter launch per
      suite run, against the 247s serial baseline observed at ea6f51f over 56 files.
    dec: none
  - id: D-06
    choice: >
      Worker count is HARNESS_TEST_WORKERS when set to a positive integer, else
      min(8, max(2, os.cpu_count() or 2)).
    because: >
      the floor is 36.7s, set by the slowest single file, so gains above 8 workers are bounded
      while fork and memory pressure is not; CI runners are about 4 vCPU, where the same rule
      yields 4 and measured 68.7s. All three figures were observed 2026-08-31 at ea6f51f over
      56 files on a 12-core M3 Pro; the two files FEAT-45 added since cost 0.10s and 0.40s
      serially, measured at ccf674a, so the floor and the cap's reasoning are unmoved.
    dec: none
  - id: D-07
    choice: >
      Each test file's stdout and stderr are captured and printed as one contiguous block when
      that file finishes, keeping the existing PASS name and FAIL name lines verbatim.
    because: >
      interleaved live output is unattributable, which REQ-04 forbids; the trade is that a
      long file prints nothing until it completes.
    dec: none
  - id: D-08
    choice: Change-based test selection is REJECTED as the speed lever.
    because: >
      it makes coverage a function of the diff, so a gate can pass by selecting nothing; the
      37s floor is set by one file most changes reach indirectly; and the dependency edge from
      a bash gate script to the test that forks it is not statically knowable. Recorded so a
      later scan does not re-suggest it.
    dec: none
  - id: D-09
    choice: >
      FEAT-48 ships WHOLE and BEFORE FEAT-47. All six tasks are built, verified and merged
      against today's array-driven run-unit-tests.sh. No task waits on FEAT-47, and no file
      this feature writes is placed at a path FEAT-47 has not created yet.
    because: >
      the injection hazard is live today and corrupts every parallel measurement including
      FEAT-47's own, so the isolation half cannot wait. The pool half does not depend on
      FEAT-47 either, which is what the earlier draft of this decision had wrong: D-05 puts
      scheduling in run_pool.py, invoked once by bash which keeps kind selection, so the pool
      receives a list of script paths and never sees how they were discovered. It replaces
      the serial for loop — at run-unit-tests.sh:147-157 as a DATED, NON-BINDING anchor at
      2a5cbada on 2026-09-01, whose durable identifier is that it is the only line in that script
      containing "${SCRIPTS[@]}" — with a single invocation line, which is
      an ordinary edit for FEAT-47's later rewrite of that script to carry forward. Whether it
      does carry it forward is FEAT-47's plan to state; nothing in FEAT-48 asserts that and
      nothing depends on it, because FEAT-48 merges first, against today's runner. Nothing is
      written twice and no cross-feature interleaving remains, so the ordering needs no
      mechanical enforcement inside this plan.
      THE CENSUS CONTRACT, which FEAT-47 depends on: this feature adds exactly TWO new
      test-*.py under .claude/skills/harness/bin — test-suite-independence.py (unit, T-03)
      and test-run-pool.py (integration, T-04) — plus two non-test helpers that stay in bin
      beside the runner, isolated_bin.py (T-01) and run_pool.py (T-04). FEAT-47's enumerated
