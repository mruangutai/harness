      house-style heading and a later style pass cannot break it either; the count and the last
      number are a convenience, never a constraint the gate enforces.

      The entry must state, each in one or two sentences with its reason:
        - the hazard, concretely: test-check-domain.py overwrote the live feature_schema.py for a
          ~90ms window per run, and 5,105 of 1,032,849 polls observed a broken module. A
          crashing-checker probe now gets a private copy of the bin directory instead
          (isolated_bin.py); the words "private copy" must appear, since narrowing the window is what
          a later reader will propose;
        - that this was proven by the hazard being absent, never by the flake ceasing to reproduce:
          it went quiet for 6 consecutive 8-worker runs while fully present;
        - that the fix's SCOPE was "derived and not enumerated", in those words, which the verify
          block above greps for, and why: the same census of live-tree mutation sites was written
          three times and stale within a cycle each time as sibling features merged, and two of the
          sites name themselves with os.getpid() so no fixed list could ever have held them. Say
          that every site the scan reports is fixed and none is allowlisted, and that the scan's
          file set is bounded by .claude/skills/harness/bin/** with anything outside it escalated
          rather than silently written;
        - test-suite-independence.py, what it forbids, that it has no escape hatch, and that it
          discovers its scan set by walking the tree so a layout change cannot blind it;
        - the pool: scheduling in run_pool.py, selection in bash, output buffered per file so it is
          attributable, and the worker count rule HARNESS_TEST_WORKERS else min(8, max(2, cpu_count))
          with the 36.7s floor as the reason for the cap;
        - the runtime half, and why the static scan alone was not enough: run_pool.py takes
          --mutation-check and snapshots the size and mtime of every file under the watched directory
          around the run, because the scan is blind to a mutation performed through a subprocess or
          wrapped in a helper. State the watched directory by name (.claude/skills/harness/bin) and
          say that it is that directory and NOT the repository root, with the reason: agents write
          .harness/harness/features/** continuously while suites run, so a root-wide watched set would
          redden a passing suite on a sibling agent's note. Say that the snapshot covers untracked
          files as well as tracked ones, which is what catches a mutant script appearing beside the
          original, and say plainly what it does not cover — a mutation anywhere outside that
          directory, where the static scan with its two blind spots is the only enforcement. State
          that the static scan is not a backstop for every such write either: its taint model seeds
          only the literal __file__, so a write to a path built from a relative literal or joined onto
          os.getcwd(), landing outside the watched directory, is seen by neither half. That is a third
          uncovered class and the entry must name it rather than leave a reader to infer the two named
          blind spots are the whole gap. Name a fourth alongside it, for the same reason: the scan does
          not propagate taint through a file's CONTENT, so a write to a target read out of a manifest,
          config or fixture — rather than derived from __file__ — is unflagged even inside the live
          checkout, and only the watched directory's before/after snapshot catches it. The exclusion
          that opens it is deliberate: without it the scan reports fifteen writes under a tempdir as
          live-tree violations and can never read zero. Say the entry claims no more coverage than the
          two mechanisms deliver. Name the trade: an edit to a file in that directory during a run
          trips it;
        - change-based test selection REJECTED, in those words, with all three reasons: coverage
          becomes a function of the diff so a gate can pass by selecting nothing; the floor is set by
          one file most changes reach indirectly; and the edge from a bash gate script to the test
          that forks it is not statically knowable. This is the clause a future scan will re-suggest,
          so it carries the reason, not just the verdict;
        - the measurements, with their date, sha and machine: 247s serial across 56 files, ~47s at 8
          workers, 68.7s at 4, floor ~36.7s, observed 2026-08-31 at ea6f51f on a 12-core M3 Pro.

      SUBSTANCE, NOT KEYWORDS. The verify block reads only the section under this heading, and
      requires every phrase above to appear INSIDE it plus at least 300 words. That floor exists
      because the earlier draft of this block was four substring greps over the whole file, which a
      one-line stub naming all four phrases satisfied. It is a floor, not a target: say each thing
      once, with its reason.

      Then write the index row yourself, in the same commit, right of the :: separator, and
      regenerate with gen-decisions-index.py so the generated left-hand side is correct. There is no
      --check flag; the verify block compares --stdout against the file. Adding an entry lengthens
      the file and shifts every later @line anchor, so the regeneration is mandatory rather than tidy.
  - id: T-07
    title: SUPERSEDED by T-02 — do not dispatch; the test-bash-write-guard.py site is T-02's
    traces: [REQ-01]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: >
      DEC-174 carve-out. test-bash-write-guard.py is the test of bash-write-guard.sh, a
      registered PreToolUse gate script, and AGENTS.md:8 names a gate's test verbatim.
    depends_on: [T-02]
    status: abandoned
    files:
      - .claude/skills/harness/bin/test-bash-write-guard.py
    verify: |
      python3 - <<'PY'
      import os, subprocess, sys, threading
      b = ".claude/skills/harness/bin"
      base = set(os.listdir(b))
      mt = {n: os.stat(os.path.join(b, n)).st_mtime_ns
            for n in base if os.path.isfile(os.path.join(b, n))}
      appeared, stop = set(), threading.Event()
      def poll():
          while not stop.is_set():
              try:
                  appeared.update(set(os.listdir(b)) - base)
              except OSError:
                  pass
      threading.Thread(target=poll, daemon=True).start()
      r = subprocess.run([sys.executable, os.path.join(b, "test-bash-write-guard.py")],
                         capture_output=True, text=True)
      stop.set()
      moved = sorted(n for n, v in mt.items()
                     if os.path.exists(os.path.join(b, n))
                     and os.stat(os.path.join(b, n)).st_mtime_ns != v)
      red = [l for l in (r.stdout + r.stderr).splitlines()
             if l.startswith("ok") and "bash-feature-checkout-red" in l]
      print("exit", r.returncode, "appeared", sorted(appeared), "moved", moved,
            "red_case", len(red))
      sys.exit(0 if (r.returncode == 0 and not appeared and not moved and red) else 1)
      PY
    intent: |
      SUPERSEDED BY T-02. DO NOT DISPATCH THIS TASK. It is stationed abandoned and kept only as
      the record of why it existed; there is no delete verb, and deleting the reasoning would
      invite the next planner to re-create the same split. Nothing below is an instruction.

      WHY IT EXISTED. One live-tree mutation site sits in test-bash-write-guard.py, and that file
      could not be ADDED to T-02's files: list: plan-merge.py amend refuses a list field (measured,
      exit 4) and apply refuses any existing id whose value differs (exit 7 CONFLICT), while apply
      CAN add a new id. So cycle 4 made the site a task of its own rather than an unwritable edit
      to T-02 (D-10).

      WHY THAT WAS WRONG. The split contradicted D-10's derived shape — a scope defined by a
      procedure, not by which task's files: list happened to name a file — and it created an
      ordering hole. This task had to land before T-03, whose verify asserts a live-tree ZERO, but
      T-03's depends_on could not be widened to name it for the same tooling reason. The ordering
      therefore lived in prose in two intents, which left a task that must precede T-03 sitting as
      T-03's sibling in a ready wave, held apart by a sentence a doer could miss.

      WHAT REPLACED IT (cycle 5, D-10). T-02 owns the site. Its verify block no longer reads its run
      set off its own files: list; it derives it from plan.yaml — T-02's files:, plus the files of
      every task whose station is abandoned and whose depends_on names T-02, minus the files of every
      OTHER still-live task — T-02's own files: are excluded from that subtraction. This task's
      depends_on [T-02] and its abandoned station are what carry test-bash-write-guard.py into T-02's
      run set, so the write-once list is routed around rather than fought. The ordering that was prose
      is now the edge T-03 already holds, depends_on [T-01, T-02]. T-02's intent carries the site
      description, the isolated_bin shape and the instruction to NAME the addition in the receipt.

      The verify block above is retained for the record only. It is a single-file instance of the
      same ownership check T-02's block now performs over its whole run set; the one assertion it
      carried that T-02's does not is the bash-feature-checkout-red ok-line, which T-02 subsumes
      into the requirement that every file in the run set exit 0.
