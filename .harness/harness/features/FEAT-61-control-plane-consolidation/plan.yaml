    title: Migrate lifecycle consumers and rule the historical predicates
    traces: [SC-01, SC-03]
    change_type: code
    execution_mode: main-session-direct
    execution_reason: DEC-174 and the operator-set route assign these gate consumers and regressions to the main session.
    depends_on: [T-01]
