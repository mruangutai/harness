    title: Migrate gate adapters, run schema navigation, and module loading
    traces: [SC-01, SC-05, SC-06]
    change_type: code
    execution_mode: main-session-direct
    execution_reason: DEC-174 directly governs check-state, check-domain, bash-write-guard, and their tests.
    depends_on: [T-01]
    status: ready
