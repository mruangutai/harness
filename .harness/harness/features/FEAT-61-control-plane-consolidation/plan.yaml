decisions:
  - id: D-01
    choice: Land consolidation debt before extending the risk grader, as wave 1 of three, and lock each wave with its cheap regression check.
    because: A detector calibrated against the dirty baseline would encode today's duplication as tolerated behavior; later decomposition and exception work depend on these stable seams.
    status: accepted
  - id: D-02
    choice: Represent stations in one ordered STATION_ROWS tuple whose rows are name, has_board_column, and lifecycle bucket; derive MANDATED_STATIONS, TERMINAL_STATIONS, ACTIVE_STATIONS, and FINISHED_STATIONS from it while preserving the first two exports and their order.
    because: One data row carries board and lifecycle meaning without parallel condition sets. The order is part of the live board and caller contract.
    status: accepted
  - id: D-03
    choice: Keep station values as strings and make is_active and is_finished raise on empty or unknown names, matching station_column strictness.
    because: Strings are the boundary format throughout the control plane, while permissive False hides corrupt station data and mixed Enum comparisons would fail silently.
    status: accepted
  - id: D-04
    choice: Remove qa_gate, uat, and merge from gate policy code, live configuration, templates, and examples, together with evaluate_qa, QaResult, and SUITE_OUTCOMES; retain only required review policy.
    because: These knobs have no reader. A policy option returns only with a consumer that can make it effective.
    status: accepted
  - id: D-05
    choice: Put feature artifact checkout matching in one harness_boundary predicate and retain two route adapters that own their existing refusal channels, rationale, and absorbing unexpected-failure posture.
    because: The path decision is duplicated but the tool and Bash response mechanics are load-bearing and cannot be collapsed into one literal guard.
    status: accepted
  - id: D-06
    choice: Preserve exit code and stdout and stderr bytes over every available offline fixture corpus, except for explicit strict-station, rejected-review, module-registration cleanup, and missing-policy rulings, each demonstrated red-first.
    because: Correctness is equivalence where contracts agree, not a claim of zero behavior change that would conceal known divergences.
    status: accepted
  - id: D-07
    choice: Remove only the named dead policy symbols and configuration keys in this wave; do not add a bin-wide dead-symbol sweep.
    because: Process entrypoints make broad dead-code inference exemption-heavy, and that detector belongs in the later grader feature against the cleaned baseline.
    status: accepted
  - id: D-08
    choice: Add exactly two semantic AST locks, one for a feature-station literal outside factory_config.py and one for a second repo-local bin spec_from_file_location call.
    because: These are the two high-value reintroduction paths in this wave. The station check must distinguish feature lifecycle definitions from legitimate task-status predicates rather than grep shared words.
    status: accepted
  - id: D-09
    choice: Retain the five bootstrap prologues, add a reciprocal cross-reference comment to each, and record in DEC-234 that none can import a shared helper before establishing the trusted bin path.
    because: The duplicated code creates the import seam; attempting to remove it would require the very import path it establishes.
    status: accepted
  - id: D-10
    choice: The main session executes every eventual source, test, configuration, glossary, and doctrine change directly in the feature worktree; Harness performs planning, review panel, and goal-check only.
    because: DEC-174 makes the category govern and the operator fixed this route before planning.
    status: accepted
  - id: D-11
    choice: Treat rejected as review-complete, keep work_started as the historical one-off building, review, or done predicate, and require strict predicates to accept the entire live plan corpus while rejecting explicit empty and unknown controls.
    because: Rejected and abandoned are finished under DEC-203, but neither proves execution began. The baseline corpus contains no unknown explicit station and omitted task status already reads as ready.
    status: accepted
tasks:
  - id: T-01
    title: Establish the five shared control-plane primitives
    traces: [SC-02, SC-06]
    change_type: code
    execution_mode: main-session-direct
    execution_reason: DEC-174 and the operator-set route assign the eventual control-plane source and test diff to the main session.
    depends_on: []
    status: ready
    files:
      - .claude/skills/harness/bin/factory_config.py#station_column
      - .claude/skills/harness/bin/artifact_accessors.py#load_harness_json
      - .claude/skills/harness/bin/feature_json_write.py#parse_doc
      - .claude/skills/harness/bin/harness_boundary.py#worktree_for_feature
      - tests/unit/test-factory-config.py#full_stations
      - tests/unit/test-artifact-accessors.py#JsonContracts
      - tests/unit/test-feature-json-reader.py#LoadFeatureJsonTest
      - tests/unit/test-harness-boundary.py#case_worktree_for_feature
      - tests/integration/canonical-reader-classification.json
    verify: python3 tests/unit/test-factory-config.py && python3 tests/unit/test-artifact-accessors.py && python3 tests/unit/test-feature-json-reader.py && python3 tests/unit/test-harness-boundary.py
    intent: |
      Work test-first. In factory_config.py replace the two station literal tuples with STATION_ROWS in this exact order: backlog true not_started; plan true active; ready true active; building true active; review true active; done true finished; abandoned false finished; rejected false finished. Use simple immutable string rows, not an Enum. Derive MANDATED_STATIONS from rows with a board column, TERMINAL_STATIONS from rows without one, ACTIVE_STATIONS from active rows, and FINISHED_STATIONS from finished rows. Preserve tuple type and existing order. Add is_active(name) and is_finished(name); each accepts only an exact declared string and raises FleetError with the known names for empty, non-string, or unknown input.

      In artifact_accessors.py add one strict_json_loads(text) primitive using the existing duplicate-key and non-finite hooks. Make load_harness_json and the canonical feature JSON reader translate its ValueError into their current public errors without changing messages. Make feature_json_write.parse_doc call the same primitive and translate UTF-8, parse, and non-mapping failures into its existing MergeRefusal code and exact lines. Remove its duplicate hooks and direct JSON load. Update only the affected canonical-reader inventory rows.

      In artifact_accessors.py add load_run_step_contract(bin_dir), the one accessor that strict-loads run-state-schema.json, navigates properties.steps.items, and returns the step schema, its declared property names, and the evidence propertyNames pattern. Use ordinary mapping access for nested navigation so malformed shapes preserve their natural KeyError or TypeError at the existing caller catch boundaries; do not wrap those failures in ArtifactAccessError.

      In harness_boundary.py add feature_artifact_checkout_mismatch(owner_root, raw_rel, target_path). It owns the feature-artifact regex and checkout comparison, returns None or the feature id and expected worktree, and lets AmbiguousWorktree and unexpected errors reach the route adapters. Also add load_repo_module(module_name, path, register=False), the sole bin implementation of spec_from_file_location. It refuses a missing spec or loader, optionally registers the module before exec for dataclasses, removes only that registration if exec fails, and re-raises the original failure. Unit cases must be red before source changes and cover table order, all derived exports, unknown and empty strictness, nested duplicate and non-finite JSON, non-mapping translations, natural malformed-run-schema failures, both checkout outcomes, missing loader, exec failure, and pre-exec registration.
