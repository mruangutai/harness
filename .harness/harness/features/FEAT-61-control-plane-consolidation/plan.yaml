    intent: |
      Add fail-first cases before migrating consumers. Replace every owned literal active or finished feature-lifecycle tuple with factory_config.is_active or factory_config.is_finished, preserving exact output and route behavior on legal stations. Use harness_boundary.load_repo_module for both plan-merge.py repo-local loads and worktree_terminal.py, with register false and the existing caller-specific failure handling unchanged.

      In plan-merge.py make _review_complete require a non-empty status list and all statuses to satisfy is_finished, so rejected now completes review. Keep _work_started as an explicitly named historical predicate over exactly building, review, and done; document beside it that abandoned can happen before execution and rejected happens at intake, so terminal is not evidence of work started. Do not derive this one-off from ACTIVE_STATIONS or FINISHED_STATIONS.

      Extend the approval-reset cases to prove rejected resumes review, abandoned and rejected alone resume ready rather than building, and hermetic unknown or empty explicit task statuses raise instead of being silently classified. Treat the baseline live plan.yaml corpus result already recorded in the planning research as a one-time planning receipt; do not add a permanent test that discovers or loads the live plan corpus. Preserve fixture exit code and stdout and stderr bytes for all other covered legal inputs.
