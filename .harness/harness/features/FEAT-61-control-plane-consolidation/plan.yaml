    intent: |
      Add red-first route fixtures that capture each affected gate's exit code and stdout and stderr bytes before changing production code. In check-state.py derive FINISHED_STATIONS from factory_config, replace all three spec_from_file_location sequences with harness_boundary.load_repo_module, pass register true only for check-skill-weight, and preserve each current callable check, fallback assignment, finding text, and catch boundary. Replace its run-state-schema nested navigation with artifact_accessors.load_run_step_contract.

      In check-domain.py and bash-write-guard.py delete their copied feature-artifact regex and path comparison. Each adapter calls harness_boundary.feature_artifact_checkout_mismatch and retains its exact current tool or Bash refusal wording, exit channel, rationale comment, AmbiguousWorktree wording, and unexpected-exception absorption. In check-domain.py also use load_run_step_contract while retaining the existing schema validator, undeclared-key messages, and evidence-name handling.

      Regressions must include matching and non-matching paths, correct and wrong checkout, absent worktree, ambiguous worktree, an injected unexpected core failure that remains absorbed, malformed run schema preserving its natural exception at each existing catch boundary, a null module spec, an exec exception, and the dataclass loader observing its own name in sys.modules during exec. Outside the enumerated module cleanup and strict failure cases, the before and after fixture receipts must be byte-identical.
