tasks:
- id: T-01
  title: Measure on OMP 19.2.1 what a hook-refused yield does to OMP's retries and to the parent's result
  traces: [SC-11]
  change_type: docs
  execution_mode: main-session-direct
  execution_reason: DEC-174 - a live probe of the yield gate's host behaviour, run before the gate changes; the main session holds the omp binary and credentials.
  depends_on: []
  status: ready
  files:
  - .harness/harness/features/BUG-2565-digest-frontmatter-contract/notes/research-yield-refusal-probe.md
  verify: |
    set -eu
    python3 - <<'PY'
    import re, subprocess, sys
    path = ".harness/harness/features/BUG-2565-digest-frontmatter-contract/notes/research-yield-refusal-probe.md"
    lines = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True, check=True).stdout.splitlines()
    b, e = [i for i, x in enumerate(lines) if x == "RESULT BEGIN"], [i for i, x in enumerate(lines) if x == "RESULT END"]
    if len(b) != 1 or len(e) != 1 or not b[0] < e[0]:
        sys.exit(print("RESULT BLOCK MALFORMED: need exactly one RESULT BEGIN line followed by exactly one RESULT END line") or 1)
    want = {"omp_version": "19[.]2[.]1", "model": "[^ ].*", "refused_attempts_before_end": "[1-9][0-9]*",
        "refused_attempts_in_transcript": "[0-9]+", "refused_attempts_all_invocations": "[1-9][0-9]*",
        "refused_attempts_matched_to_transcript": "[0-9]+", "run_a_matched": "yes|no", "run_c_first_matched": "yes|no",
        "run_c_repeat_matched": "yes|no|none", "run_c_invocations": "[12]", "parent_task_status": "[a-z_]+",
        "parent_receives_refused_payload": "yes|no", "run_c_sequence": "followed", "hook_refusal_consumes_schema_retry": "yes|no",
        "dataless_result_yield_without_hook": "rejected|accepted|inconclusive"}
    got, bad = {}, []
    for line in lines[b[0] + 1:e[0]]:
        m = re.fullmatch("([a-z_]+): (.+)", line)
        if not m or m.group(1) not in want: bad.append("stray line in Result block: " + line)
        elif m.group(1) in got: bad.append("duplicate key " + m.group(1))
        else: got[m.group(1)] = m.group(2)
    leak = got.get("parent_receives_refused_payload") == "yes"
    if leak: print("LEAK: a refused payload reached the parent in some Run A or Run C invocation (D-03 design defect)")
    bad += ["missing " + k for k in want if k not in got]
    bad += [k + ": " + got[k] for k, v in want.items() if k in got and not re.fullmatch(v, got[k])]
    if not bad:
        need = {"run_a_matched": "yes", "run_c_first_matched": "yes", "run_c_repeat_matched": "yes" if got["run_c_invocations"] == "2" else "none"}
        bad += [k + " is " + got[k] + ", need " + v + ": every Run A and Run C invocation must itself be matched" for k, v in need.items() if got[k] != v]
        if got["refused_attempts_before_end"] != got["refused_attempts_in_transcript"]: bad.append("Run A log and transcript refusal counts differ")
        if got["refused_attempts_matched_to_transcript"] != got["refused_attempts_all_invocations"]: bad.append("a refused attempt in some Run A or Run C invocation is not matched to its child transcript result")
        if int(got["refused_attempts_all_invocations"]) < int(got["refused_attempts_before_end"]) + 3: bad.append("refused_attempts_all_invocations is below Run A's count plus Run C's three refusals")
    print("probe receipt ok" if not (bad or leak) else "MISSING, WRONG, UNMATCHED OR INCONCLUSIVE: " + "; ".join(bad))
    sys.exit(1 if bad or leak else 0)
    PY
  intent: |
    Work directly in PRODUCT checkout /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/BUG-2565-digest-frontmatter-contract; every relative-path edit stays inside it. Main owns this task under DEC-174 and DEC-179, with no engineering-lead dispatch. Source issue 2565. Read this feature's BRIEF.md and notes/research-digest-frontmatter-contract.md first. PRODUCT docs/spec.md, docs/decisions.md and docs/architecture.md are absent in this checkout; do not invent or substitute them. Change no code in this task.
    Purpose: answer, by measurement on the installed omp (confirm omp --version prints 19.2.1), the two questions the grilling left open, before any gate changes. Build a throwaway OMP project in a fresh mktemp -d directory outside every checkout. In it create .omp/agents/probe-child.md with frontmatter name probe-child, a one-line description, tools [read], spawns [], blocking true, structured true, and output set to the closed object schema: type object, properties VERDICT (type string, enum PASS and BLOCKED) and note (type string), required [VERDICT, note], additionalProperties false.
    Extension contract, refuse exactly the first N yield calls. Create one extension file refuse-yield.ts exporting a default function that registers pi.on tool_call. It holds one module-level counter n, initialised to 0; each omp invocation is a fresh process, so every invocation starts again at 0. For toolName yield, the handler FIRST increments n by one, so the first yield call of the process sets n to 1, the second to 2, and so on; attempt is that incremented n. N is environment variable PROBE_REFUSE parsed as a non-negative integer. The call is refused if and only if PROBE_REFUSE is unset or attempt is at most N, written in code as refuse = (process.env.PROBE_REFUSE === undefined) or (n <= N). So PROBE_REFUSE unset refuses every yield; PROBE_REFUSE=0 refuses none; PROBE_REFUSE=3 refuses attempts 1, 2 and 3 and passes attempt 4 and every later attempt. Copy these three worked examples into the note's Method section beside the extension source. The handler then appends one JSON line to the file named by environment variable PROBE_LOG holding attempt, decision (refused or passed, as just decided) and data (the call input's data field, or the literal string ABSENT when the input has no data key), and, only when refused, returns block true with this reason, verbatim: Harness refused this yield: validate-digest exited 1: probe. Your object was not checked, and Harness never passes an unchecked return. This is a Harness fault, not a violation found in your object: do not change a valid object to get past it. Yield the same object once more; if it is refused again for this same cause, stop yielding and end your turn with one line naming this cause, because no yield can pass until validate-digest runs.
    Run every probe from the throwaway directory with omp -p --no-extensions -e followed by the path of refuse-yield.ts, so only that extension loads, and record the model omp used. Give every invocation its own PROBE_LOG file. The parent prompt in each invocation is: dispatch the task tool once with agent probe-child and the run's child task text, then report verbatim the task result's status, any data and any warning.
    Run A (PROBE_REFUSE unset, so every yield is refused): child task text tells it to yield data VERDICT PASS, note probe, and to follow any refusal's instruction exactly. Run A is one invocation.
    Run C (PROBE_REFUSE=3): child task text gives an exact sequence with distinct payloads: attempts 1 to 3 send VERDICT PASS with note attempt-1, attempt-2 and attempt-3; attempt 4 sends the object wrong true; attempt 5 sends VERDICT PASS, note attempt-5. Run C is one invocation, or two when the first deviates (see classification); record run_c_invocations as 1 or 2.
    Step 1, match, for EVERY Run A and Run C invocation, the deviated or inconclusive first Run C invocation and the repeat included, done before any classification. For one invocation, list its refused log lines in attempt order, and list in transcript order the yield tool results in that invocation's child session transcript (the one OMP saved for the throwaway directory) that carry the text Harness refused this yield. The k-th refused log line matches the k-th such transcript result when the yield call that result answers carried an input data field JSON-equal to the log line's data (the string ABSENT matches a call with no data key). Every refused log line must be matched; an invocation whose two lists differ in length or have any unmatched pair is unmatched. refused_attempts_all_invocations is the total number of refused log lines across every Run A and Run C invocation; refused_attempts_matched_to_transcript is the total number of matched pairs across those same invocations. In the Evidence section list, per invocation, each pair: attempt, log data and the verbatim transcript excerpt of the tool result. Record each invocation's own matched flag in the Result block: run_a_matched for the Run A invocation, run_c_first_matched for the first Run C invocation and run_c_repeat_matched for the repeat, each yes when that invocation is matched and no otherwise, with run_c_repeat_matched none when there was no repeat. A passing receipt requires every one of these flags to be yes, with run_c_repeat_matched none only when run_c_invocations is 1; equal log and matched totals alone never pass, because an unmatched transcript refusal carries no log line and so can leave the totals equal.
    Step 2, leak, across EVERY Run A and Run C invocation, the deviated or inconclusive ones included, also before any classification. An invocation's parent payload is the data field of the task tool result in that invocation's parent session transcript (none when that result has no data). parent_receives_refused_payload is yes when, in any one invocation, the parent payload is JSON-equal to the data of any refused log line of that same invocation, else no. Compare data fields only, never a whole call input. The Run C note attempt-5 payload is the accepted control: receiving it is not a leak.
    Step 3, classify, only after steps 1 and 2 cover every invocation; classification never skips, re-counts or drops an invocation from steps 1 and 2. Run A: refused_attempts_before_end is the number of refused log lines in the Run A invocation, refused_attempts_in_transcript the number of yield tool results in its child transcript carrying Harness refused this yield, parent_task_status the parent's task status word; record in the Evidence section whether the child stopped on its own. Run C: an invocation followed the sequence only when it is matched in step 1, its log shows attempts 1, 2 and 3 refused with data notes attempt-1, attempt-2 and attempt-3, and attempt 4 passed with data wrong true. If the first Run C invocation did not follow, run Run C once more; if that one also does not follow, record run_c_sequence deviated and hook_refusal_consumes_schema_retry inconclusive with the observed sequence. If one followed, record run_c_sequence followed and classify that invocation alone: when the parent receives data wrong true with OMP's schema-invalid warning, hook refusals consumed OMP's schema-retry budget (hook_refusal_consumes_schema_retry yes); when the child transcript shows attempt 4 rejected by OMP with field violations and the parent receives note attempt-5, they did not (no); when it fits neither, inconclusive. Never force yes or no.
    Run B (PROBE_REFUSE=0, so the extension logs but refuses nothing): child task text tells it to call yield first with type result and no data, then with VERDICT PASS, note probe. Record whether OMP itself rejected the data-less result yield (dataless_result_yield_without_hook rejected or accepted, or inconclusive when the child never made the data-less call). Run B documents and gates nothing and takes no part in steps 1 and 2: D-04 makes the hook refuse every data-less yield whatever OMP does, so its answer only informs T-06's prose and changes no task.
    Write .harness/harness/features/BUG-2565-digest-frontmatter-contract/notes/research-yield-refusal-probe.md. It holds exactly one Result block: a line reading exactly RESULT BEGIN, then exactly these fifteen lines in this order, one key per line, key colon space value, nothing else, then a line reading exactly RESULT END: omp_version, model, refused_attempts_before_end, refused_attempts_in_transcript, refused_attempts_all_invocations, refused_attempts_matched_to_transcript, run_a_matched (yes or no), run_c_first_matched (yes or no), run_c_repeat_matched (yes, no or none), run_c_invocations, parent_task_status, parent_receives_refused_payload, run_c_sequence (followed or deviated), hook_refusal_consumes_schema_retry (yes, no or inconclusive), dataless_result_yield_without_hook. The lines RESULT BEGIN and RESULT END appear nowhere else in the note. The verify reads only the lines between them: a duplicate key, a missing key, an unknown key or any other line there fails it, and no line outside the block, in the Method or Evidence sections included, can satisfy a key. After the block write a Method section (the agent file, the extension source with the three counter examples, the prompts) and an Evidence section (each invocation's PROBE_REFUSE and log lines, the step 1 pairs per invocation, and each invocation's parent task result verbatim). No credentials or tokens in the note. Commit the note, then run the literal verify.
    D-03 gate: the verify evaluates the leak first, before any match or classification check, and fails by design when parent_receives_refused_payload is yes; a refused payload reaching the parent in ANY Run A or Run C invocation, a deviated or inconclusive one included, stops the gate and is reported as a design defect even when the probe is also inconclusive. The probe is inconclusive, which also fails the verify, when Run A evidences no refused attempt (refused_attempts_before_end 0), Run A's log and transcript counts differ, any per-invocation matched flag is not yes (run_c_repeat_matched may be none only when run_c_invocations is 1), refused_attempts_matched_to_transcript differs from refused_attempts_all_invocations, refused_attempts_all_invocations is below Run A's count plus 3, run_c_sequence is deviated, or hook_refusal_consumes_schema_retry is inconclusive. On any failure stop the build, do not start T-02, and report the evidence to the operator: a leaked payload as a design defect, an inconclusive probe as a measurement the operator must rule on; never edit the receipt to pass. Expected result otherwise: verify prints probe receipt ok and exits 0.
