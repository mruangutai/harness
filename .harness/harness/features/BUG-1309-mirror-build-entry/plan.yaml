          post-merge-sweep: SKIP removal of <path> - <feature_id> records
          github.build_entry=<value or "absent">, so no Build entry receipt exists. The worktree
          stays until gh-sync.py recover-terminal <feat_dir> --yes and ship both succeed.
        and return without removing.
        The era gate covers the ABSENT key only. An era-named feature that actually RECORDS
        "recovery-required" wrote that receipt itself, so it is retained like any other: era
        membership excuses a feature that could not have a receipt, never one that has a bad one.

