        the implementing commit with exactly:
          python3 -c "import glob,os;print(sorted(os.path.basename(p) for p in glob.glob('.harness/*/features/*')))"
        Paste the output as the set literal, with a comment carrying that command verbatim, the
        commit sha it was generated at, and - as part of that SHIPPED comment's required text, on
        its own line directly beside the command line and the sha - this sentence, VERBATIM,
        character for character:
          When this file is vendored into another project at upgrade, regenerate this set THERE with the same command, from that project's feature directories.
        Those three - command, sha, sentence - are the comment's required content; the sentence is
        text the doer writes into .claude/skills/harness/bin/feature_schema.py, not prose about it.
        No feature.json on disk carries build_entry today, so an unguarded invariant reports every
        feature at once. A feature absent from the set - which is
        every feature created from now on - is bound. Same shape as
        feature_schema.RUNS_AGENT_EXEMPT and BUG-1071's INV-32 era guard. BUG-1309 itself must be
        IN the set: it is planned before the field exists.

        recovery_command_for(feat_dir) -> "open" | "recover-terminal" - the ONE definition of which
        recovery command may be named for a feature that owes a build-entry receipt. It returns
        "recover-terminal" when ANY of these holds, and "open" otherwise:
