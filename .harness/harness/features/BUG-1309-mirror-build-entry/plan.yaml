      AND FOR THE ERA CORPUS, SETTLED BULLET 8 IS DELIVERED BY THE GATES THAT ALREADY EXIST, not by
      this new check: a legacy feature under recovery while GitHub is unavailable records no
      milestone, so its ship prints "gh-sync: SKIP" or "gh-sync: FAILED" and the PRE-EXISTING gates
      at post-merge-sweep.sh:192-195 and :206-209 keep the worktree and return BEFORE the new
      build-entry block - and therefore before the era gate inside it - is ever reached. The new
      check is the BACKSTOP for the one case those gates miss: a ship that exits cleanly having
