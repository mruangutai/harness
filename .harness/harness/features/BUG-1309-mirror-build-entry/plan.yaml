    title: Add merge-gate.sh, the PreToolUse Bash gate that refuses a merge while recovery is owed
    traces: [REQ-07]
    change_type: feature
    execution_mode: main-session-direct
    execution_reason: DEC-174 enforcement carve-out - a new registered PreToolUse Bash gate script and its registration surfaces; check-domain.sh --resolve returns NOBODY for settings.json, settings.snippet.json and harness-hooks.ts
    depends_on:
