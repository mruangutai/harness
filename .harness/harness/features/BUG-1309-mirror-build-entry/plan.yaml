    intent: |
      Close the FEAT-55 hole: INV-26 skips mirror validation for a feature whose station is done
      or abandoned, and skips again when every task status is absent, so a sync-enabled feature
      can reach a terminal state having never mirrored anything and be reported clean.

      Add a NEW invariant, INV-37 (36 is the highest in the file today), as its own loop, NOT as
      a change to INV-26's exemptions - INV-26's terminal exemption exists because ship writes a
      done station the plan-derived station does not carry, and weakening it would make every
      shipped feature a permanent false violation.

      INV-37, over the same sorted glob of <H>/*/features/* the INV-26 block already walks:
      - Skip unless the project's .harness/harness.json github.sync is true.
      - Skip a feature whose directory name is in the frozen era-exempt set (below).
      - Skip a feature with no plan.yaml, or one that did not load - other invariants own both.
      - Skip a feature whose feature.json records a non-empty factory.issues: that is the
        product-board lane (issue 349) which this invariant does not read, the same carve-out
        INV-26 already makes.
      - Otherwise, if feature.json's github.build_entry is absent, append ONE violation line that
        names exactly ONE recovery command. WHICH command is chosen by the feature's OWN recorded
        station, never by whether it is merged, and the choice is made by calling the shared
        classifier this task adds - feature_schema.recovery_command_for(feat_dir) - never by a
        station test written inside check-state.sh. Naming both commands is what this line must
        not do: an operator reading "or recover-terminal if it is already merged" on a
        done-but-unmerged or legacy mid-build feature runs the bare open and creates exactly the
        historical task sub-issues the operator fenced off as out of scope.
        The two lines, verbatim, with <feat> the feature directory name and <feature-dir> its real
        absolute path:
          when recovery_command_for returns "open":
            "INV-37 <feat>: github.sync is enabled but feature.json records no github.build_entry,
             so no Build entry outcome was ever recorded and the board cannot be telling the truth
             about this feature - run gh-sync.py open <feature-dir>."
          when it returns "recover-terminal":
            "INV-37 <feat>: github.sync is enabled but feature.json records no github.build_entry,
             and the feature's own record says the work is already under way or finished, so
             creating the mirror now would mean task sub-issues for completed work - run
             gh-sync.py recover-terminal <feature-dir> --yes."
        The second line must not contain the token "open" at all, in any form - not as
        "gh-sync.py open", not as a description of what open would do: an operator who reads the
        word and runs it performs the forbidden act. Same rule T-04's second refusal line carries.
      - It fires REGARDLESS of the station, including done and abandoned, and REGARDLESS of the
        task statuses, including a plan whose every task status is absent. Those two conditions
        are the whole point: state both in a comment above the loop so a later reader does not
        "tidy" them back into the INV-26 exemptions. The station is read ONLY to choose the
        command, never to decide whether the invariant fires.

