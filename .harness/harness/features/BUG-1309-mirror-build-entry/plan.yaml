tasks:
  - id: T-01
    title: Declare github.build_entry in the feature.json schema
    traces: [REQ-03, REQ-04, REQ-05]
    change_type: config
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/feature-schema.json
      - tests/integration/test-validate-feature-json.py
    verify: |
      python3 tests/integration/test-validate-feature-json.py && python3 -c "import json;s=json.load(open('.claude/skills/harness/bin/feature-schema.json'));e=s['properties']['github']['properties']['build_entry']['enum'];assert sorted(e)==['not-applicable','opened','recovered-terminal','recovery-required'],e;print('VERIFY-PASS')"
    intent: |
      Add ONE property to feature-schema.json, inside the existing github object's properties
      mapping, beside milestone, parent, attached, issues, source_issues and typed:

        "build_entry": {
          "type": "string",
          "enum": ["opened", "recovery-required", "not-applicable", "recovered-terminal"],
          "description": "<see the five states below, written out in prose>"
        }

      Change nothing else in the file. The github object stays additionalProperties false and
      stays with no required list, so the field is optional: every existing feature.json must
      keep validating unchanged (DEC-191, FEAT-41 - feature.json carries no status and no phase
      key, and an undeclared key is a schema error rather than a tolerated extra).

      The description must state all FIVE states, because absence is meaningful:
      - opened: gh-sync.py open completed with github.sync enabled and github.repo pinned; the
        milestone, the parent and every task sub-issue are recorded.
      - recovery-required: sync was enabled and the repo pinned, but the run stopped on a
        temporary environmental no-go BEFORE any remote-mutating call. Build may proceed; the
        MERGE is refused until a re-run records opened.
      - not-applicable: github.sync is false or absent. An approved no-mirror delivery mode. It
        gates nothing. This state is NOT reached when sync is enabled and github.repo is unpinned:
        that is a local configuration error, it records nothing, and it blocks Build (D-09).
      - recovered-terminal: written only by gh-sync.py recover-terminal for an already-merged
        feature whose mirror was never opened. Milestone plus the parent and source issues only,
        never task sub-issues.
      - ABSENT: no Build entry ever completed - open never ran, or github.sync was enabled with
        github.repo unpinned, or the run failed after creating at least one remote object, or it
        exited on a caller or contract error. Build refuses.

      Then add cases to tests/integration/test-validate-feature-json.py, following that file's
      existing case style, writing the failing assertions BEFORE the schema edit and confirming
      they fail:
      1. a feature.json whose github block carries build_entry with each of the four legal
         values validates with no problems reported;
      2. a feature.json whose github block carries "build_entry": "opened " (trailing space) or
         "reopened" is REJECTED, and the reported message names the enum;
      3. a feature.json whose github block carries "build-entry" (hyphen, the neighbouring
         misspelling) is REJECTED by additionalProperties with the undeclared-key message;
      4. a feature.json with NO build_entry key still validates clean.

  - id: T-02
    title: Record the Build-entry outcome in gh-sync.py open
    traces:
    - REQ-01
    - REQ-03
    - REQ-04
    - REQ-05
    - REQ-06
    - REQ-07
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - tests/integration/test-gh-sync.py
    verify: |
      out=$(python3 tests/integration/test-gh-sync.py) || exit 1
      if printf '%s\n' "$out" | grep -q '^FAIL'; then exit 1; fi
      for n in "T-02 open records opened" "T-02 sync false records not-applicable" "T-02 unpinned repo records nothing" "T-02 first-call failure records recovery-required" "T-02 partial remote write records nothing" "T-02 second open stays opened" "T-02 opened never downgrades" "T-02 contract error records nothing"; do
        printf '%s\n' "$out" | grep -qF "ok    $n" || exit 1
      done
      echo VERIFY-PASS
    intent: |
      Make gh-sync.py open leave a durable local receipt of what the Build entry did. Six edits,
      in this file only.

      1. READ SIDE. In load_recorded, after the source_issues block, add:
             be = gh.get("build_entry")
             rec["build_entry"] = be if be in ("opened", "recovery-required",
                                               "not-applicable", "recovered-terminal") else None
         and seed rec with "build_entry": None in the default mapping at the top, so a first
         sync reads as absent rather than KeyError.

      2. WRITE SIDE. In save_recorded's transform, AFTER the typed block and using the same
         positive-recording shape typed already uses:
             if rec.get("build_entry"):
                 doc["github"]["build_entry"] = rec["build_entry"]
         This is load-bearing: transform rebuilds the whole github mapping from rec, so without
         it every later save_recorded call would silently delete the field.

      3. THE RECORDER. Add a module-level function beside save_recorded:
             def record_build_entry(feat_dir, value):
         It loads the record with load_recorded, returns immediately without writing when the
         existing value is already "opened" and value is not "opened" (never downgrade a
         completed mirror), sets rec["build_entry"] = value, and calls save_recorded. It must go
         through save_recorded rather than writing feature.json itself, so it inherits the lock,
         the same-directory tempfile and the atomic replace.

      4. THE STATE. Add beside skip():
             _BUILD_ENTRY = {"feat_dir": None, "remote_written": False}
             _NO_RECORD = object()
         and change skip's signature to skip(msg, build_entry=None). Before it prints and exits,
         skip records the outcome when, and only when, _BUILD_ENTRY["feat_dir"] is not None,
         _BUILD_ENTRY["remote_written"] is False AND build_entry is not _NO_RECORD: it calls
         record_build_entry(_BUILD_ENTRY["feat_dir"], build_entry or "recovery-required").
         _NO_RECORD is the explicit "this skip records nothing" sentinel: passing it leaves the
         field ABSENT, which is the state that blocks Build. It exists because the DEFAULT of the
         parameter records "recovery-required", so "pass nothing" cannot mean "record nothing".
         When remote_written is True it records NOTHING and the field stays absent - that is
         D-04, the partial-remote-write case that must block Build. die() and refuse() record
         nothing at all: a caller or contract error is not an outcome.

      5. THE CALL SITES. In the config resolver (the function holding
         skip("github.sync is not enabled for this project") and
         skip("github.repo is not pinned - run /harness-init --upgrade to record it")):
         - pass build_entry="not-applicable" to the "github.sync is not enabled" skip and to NO
           OTHER skip in the file. Sync off or GitHub unconfigured is the approved no-mirror
           delivery mode.
         - pass build_entry=_NO_RECORD to the "github.repo is not pinned" skip. That skip is
           reachable only when github.sync is TRUE - the resolver tests sync first - so it is a
           project that opted into the mirror and left the repo unpinned: a local configuration
           error under settled policy, which records NOTHING, leaves the field absent, and is
           therefore refused by Build through T-04 (D-09). Recording not-applicable there would
           turn a misconfigured mirror project into an approved no-mirror one.
         In main(), immediately before the config resolution call and only when the command is
         "open", set _BUILD_ENTRY["feat_dir"] = feat_dir. In _open_ensure_milestone,
         _open_ensure_parent and _open_sync_task, set _BUILD_ENTRY["remote_written"] = True on the
         line immediately after each successful remote CREATE (never after a lookup or an
         already-recorded skip).

      6. THE SUCCESS WRITE. Make record_build_entry(feat_dir, "opened") the LAST statement of
         cmd_open, after save_recorded and after the issue-type backfill. Reaching it is itself
         the proof no skip branch fired - the same structural argument cmd_ship's docstring
         already makes for its terminal station write.

      Idempotence is a requirement, not a side effect: a second open on an already-opened
      feature creates nothing new (already-recorded ids are skipped today) and re-writes
      "opened".

      Tests, written first and confirmed failing, in tests/integration/test-gh-sync.py using the
      existing fake-gh fixture (GH_SYNC_GH) and its feature-directory builder.

      THE CASE NAMES BELOW ARE A CONTRACT, not labels: this task's verify: greps the runner's
      "ok    <name>" lines - check() at tests/integration/test-gh-sync.py:702-708 prints one only
      when the assertion HELD - so a renamed or missing case fails the verify. Pass each name to
      check() EXACTLY as written here, character for character.
      Cases:
      - "T-02 open records opened": open with sync enabled and every create succeeding:
        feature.json github.build_entry is exactly "opened";
      - "T-02 sync false records not-applicable": open with github.sync false: exactly
        "not-applicable", and no gh call is made;
      - "T-02 unpinned repo records nothing", THE UNPINNED-REPO CASE: open with github.sync TRUE
        and github.repo absent from harness.json: the "build_entry" key is ABSENT from the github
        mapping - assert "build_entry" not in doc["github"], never a falsy or "not-applicable"
        value - and the process exits 0 through skip. Pair it with the sync-false case above,
        which must still record exactly "not-applicable": the two together are what keep a
        configuration error from being recorded as an approved delivery mode;
      - "T-02 first-call failure records recovery-required": open where the fake gh fails on its
        FIRST invocation (nothing created): exactly "recovery-required";
      - "T-02 partial remote write records nothing": open where the fake gh succeeds for the
        milestone and then fails: the key is ABSENT from the github mapping - assert absence of
        the key, not a falsy value;
      - "T-02 second open stays opened": a second open over the first case: still exactly
        "opened", and the fake gh log records no new create;
      - "T-02 opened never downgrades": a feature.json already carrying "opened" whose next open
        hits the first-call failure: still "opened" (the never-downgrade rule);
      - "T-02 contract error records nothing", THE CALLER-OR-CONTRACT-ERROR CASE, which BRIEF
        SC-02's second clause rests on: stage the fixture, DELETE its BRIEF.md, then run open with
        github.sync true and github.repo pinned. cmd_open's first data statement calls parse_brief,
        which calls read(), which calls die() on the "does not exist" branch - a contract error,
        exit 1, reached AFTER main() has already armed _BUILD_ENTRY["feat_dir"] for the "open"
        command in section 5, which is the only state in which a recording bug could fire at all.
        Assert BOTH: the process exit status is exactly 1, and "build_entry" is ABSENT from the
        github mapping - assert "build_entry" not in doc.get("github", {}), never a falsy value
        (the stage() fixture's feature.json carries no github key at all until a write creates
        one, so a bare doc["github"] would KeyError rather than assert). Without this case the
        "die() and refuse() record nothing at all" rule above is defended by nothing: it is true
        today only by construction, and a later refactor moving a record_build_entry call earlier
        in cmd_open would violate SC-02 silently.

  - id: T-03
    title: Add gh-sync.py recover-terminal and make ship name it
    traces:
    - REQ-02
    - REQ-08
    - REQ-09
