tasks:
  - id: T-01
    title: Declare github.build_entry in the feature.json schema
    traces: [REQ-03, REQ-04, REQ-05]
    change_type: config
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/feature-schema.json
      - tests/integration/test-validate-feature-json.py
    verify: |
      python3 tests/integration/test-validate-feature-json.py && python3 -c "import json;s=json.load(open('.claude/skills/harness/bin/feature-schema.json'));e=s['properties']['github']['properties']['build_entry']['enum'];assert sorted(e)==['not-applicable','opened','recovered-terminal','recovery-required'],e;print('VERIFY-PASS')"
    intent: |
      Add ONE property to feature-schema.json, inside the existing github object's properties
      mapping, beside milestone, parent, attached, issues, source_issues and typed:

        "build_entry": {
          "type": "string",
          "enum": ["opened", "recovery-required", "not-applicable", "recovered-terminal"],
          "description": "<see the five states below, written out in prose>"
        }

      Change nothing else in the file. The github object stays additionalProperties false and
      stays with no required list, so the field is optional: every existing feature.json must
      keep validating unchanged (DEC-191, FEAT-41 - feature.json carries no status and no phase
      key, and an undeclared key is a schema error rather than a tolerated extra).

      The description must state all FIVE states, because absence is meaningful:
      - opened: gh-sync.py open completed with github.sync enabled and github.repo pinned; the
        milestone, the parent and every task sub-issue are recorded.
      - recovery-required: sync was enabled and the repo pinned, but the run stopped on a
        temporary environmental no-go BEFORE any remote-mutating call. Build may proceed; the
        MERGE is refused until a re-run records opened.
      - not-applicable: github.sync is false or absent. An approved no-mirror delivery mode. It
        gates nothing. This state is NOT reached when sync is enabled and github.repo is unpinned:
        that is a local configuration error, it records nothing, and it blocks Build (D-09).
      - recovered-terminal: written only by gh-sync.py recover-terminal for an already-merged
        feature whose mirror was never opened. Milestone plus the parent and source issues only,
        never task sub-issues.
      - ABSENT: no Build entry ever completed - open never ran, or github.sync was enabled with
        github.repo unpinned, or the run failed after creating at least one remote object, or it
        exited on a caller or contract error. Build refuses.

      Then add cases to tests/integration/test-validate-feature-json.py, following that file's
      existing case style, writing the failing assertions BEFORE the schema edit and confirming
      they fail:
      1. a feature.json whose github block carries build_entry with each of the four legal
         values validates with no problems reported;
      2. a feature.json whose github block carries "build_entry": "opened " (trailing space) or
         "reopened" is REJECTED, and the reported message names the enum;
      3. a feature.json whose github block carries "build-entry" (hyphen, the neighbouring
         misspelling) is REJECTED by additionalProperties with the undeclared-key message;
      4. a feature.json with NO build_entry key still validates clean.

  - id: T-02
    title: Record the Build-entry outcome in gh-sync.py open
    traces:
    - REQ-01
    - REQ-03
    - REQ-04
    - REQ-05
    - REQ-06
    - REQ-07
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - tests/integration/test-gh-sync.py
    verify: |
      out=$(python3 tests/integration/test-gh-sync.py) || exit 1
      if printf '%s\n' "$out" | grep -q '^FAIL'; then exit 1; fi
      for n in "T-02 open records opened" "T-02 sync false records not-applicable" "T-02 unpinned repo records nothing" "T-02 first-call failure records recovery-required" "T-02 partial remote write records nothing" "T-02 second open stays opened" "T-02 opened never downgrades" "T-02 contract error records nothing"; do
        printf '%s\n' "$out" | grep -qF "ok    $n" || exit 1
      done
      echo VERIFY-PASS
    intent: |
      Make gh-sync.py open leave a durable local receipt of what the Build entry did. Six edits,
      in this file only.

      1. READ SIDE. In load_recorded, after the source_issues block, add:
             be = gh.get("build_entry")
             rec["build_entry"] = be if be in ("opened", "recovery-required",
                                               "not-applicable", "recovered-terminal") else None
         and seed rec with "build_entry": None in the default mapping at the top, so a first
         sync reads as absent rather than KeyError.

      2. WRITE SIDE. In save_recorded's transform, AFTER the typed block and using the same
         positive-recording shape typed already uses:
             if rec.get("build_entry"):
                 doc["github"]["build_entry"] = rec["build_entry"]
         This is load-bearing: transform rebuilds the whole github mapping from rec, so without
         it every later save_recorded call would silently delete the field.

      3. THE RECORDER. Add a module-level function beside save_recorded:
             def record_build_entry(feat_dir, value):
         It loads the record with load_recorded, returns immediately without writing when the
         existing value is already "opened" and value is not "opened" (never downgrade a
         completed mirror), sets rec["build_entry"] = value, and calls save_recorded. It must go
         through save_recorded rather than writing feature.json itself, so it inherits the lock,
         the same-directory tempfile and the atomic replace.

      4. THE STATE. Add beside skip():
             _BUILD_ENTRY = {"feat_dir": None, "remote_written": False}
             _NO_RECORD = object()
         and change skip's signature to skip(msg, build_entry=None). Before it prints and exits,
         skip records the outcome when, and only when, _BUILD_ENTRY["feat_dir"] is not None,
         _BUILD_ENTRY["remote_written"] is False AND build_entry is not _NO_RECORD: it calls
         record_build_entry(_BUILD_ENTRY["feat_dir"], build_entry or "recovery-required").
         _NO_RECORD is the explicit "this skip records nothing" sentinel: passing it leaves the
         field ABSENT, which is the state that blocks Build. It exists because the DEFAULT of the
         parameter records "recovery-required", so "pass nothing" cannot mean "record nothing".
         When remote_written is True it records NOTHING and the field stays absent - that is
         D-04, the partial-remote-write case that must block Build. die() and refuse() record
         nothing at all: a caller or contract error is not an outcome.

      5. THE CALL SITES. In the config resolver (the function holding
         skip("github.sync is not enabled for this project") and
         skip("github.repo is not pinned - run /harness-init --upgrade to record it")):
         - pass build_entry="not-applicable" to the "github.sync is not enabled" skip and to NO
           OTHER skip in the file. Sync off or GitHub unconfigured is the approved no-mirror
           delivery mode.
         - pass build_entry=_NO_RECORD to the "github.repo is not pinned" skip. That skip is
           reachable only when github.sync is TRUE - the resolver tests sync first - so it is a
           project that opted into the mirror and left the repo unpinned: a local configuration
           error under settled policy, which records NOTHING, leaves the field absent, and is
           therefore refused by Build through T-04 (D-09). Recording not-applicable there would
           turn a misconfigured mirror project into an approved no-mirror one.
         In main(), immediately before the config resolution call and only when the command is
         "open", set _BUILD_ENTRY["feat_dir"] = feat_dir. In _open_ensure_milestone,
         _open_ensure_parent and _open_sync_task, set _BUILD_ENTRY["remote_written"] = True on the
         line immediately after each successful remote CREATE (never after a lookup or an
         already-recorded skip).

      6. THE SUCCESS WRITE. Make record_build_entry(feat_dir, "opened") the LAST statement of
         cmd_open, after save_recorded and after the issue-type backfill. Reaching it is itself
         the proof no skip branch fired - the same structural argument cmd_ship's docstring
         already makes for its terminal station write.

      Idempotence is a requirement, not a side effect: a second open on an already-opened
      feature creates nothing new (already-recorded ids are skipped today) and re-writes
      "opened".

      Tests, written first and confirmed failing, in tests/integration/test-gh-sync.py using the
      existing fake-gh fixture (GH_SYNC_GH) and its feature-directory builder.

      THE CASE NAMES BELOW ARE A CONTRACT, not labels: this task's verify: greps the runner's
      "ok    <name>" lines - check() at tests/integration/test-gh-sync.py:702-708 prints one only
      when the assertion HELD - so a renamed or missing case fails the verify. Pass each name to
      check() EXACTLY as written here, character for character.
      Cases:
      - "T-02 open records opened": open with sync enabled and every create succeeding:
        feature.json github.build_entry is exactly "opened";
      - "T-02 sync false records not-applicable": open with github.sync false: exactly
        "not-applicable", and no gh call is made;
      - "T-02 unpinned repo records nothing", THE UNPINNED-REPO CASE: open with github.sync TRUE
        and github.repo absent from harness.json: the "build_entry" key is ABSENT from the github
        mapping - assert "build_entry" not in doc["github"], never a falsy or "not-applicable"
        value - and the process exits 0 through skip. Pair it with the sync-false case above,
        which must still record exactly "not-applicable": the two together are what keep a
        configuration error from being recorded as an approved delivery mode;
      - "T-02 first-call failure records recovery-required": open where the fake gh fails on its
        FIRST invocation (nothing created): exactly "recovery-required";
      - "T-02 partial remote write records nothing": open where the fake gh succeeds for the
        milestone and then fails: the key is ABSENT from the github mapping - assert absence of
        the key, not a falsy value;
      - "T-02 second open stays opened": a second open over the first case: still exactly
        "opened", and the fake gh log records no new create;
      - "T-02 opened never downgrades": a feature.json already carrying "opened" whose next open
        hits the first-call failure: still "opened" (the never-downgrade rule);
      - "T-02 contract error records nothing", THE CALLER-OR-CONTRACT-ERROR CASE, which BRIEF
        SC-02's second clause rests on: stage the fixture, DELETE its BRIEF.md, then run open with
        github.sync true and github.repo pinned. cmd_open's first data statement calls parse_brief,
        which calls read(), which calls die() on the "does not exist" branch - a contract error,
        exit 1, reached AFTER main() has already armed _BUILD_ENTRY["feat_dir"] for the "open"
        command in section 5, which is the only state in which a recording bug could fire at all.
        Assert BOTH: the process exit status is exactly 1, and "build_entry" is ABSENT from the
        github mapping - assert "build_entry" not in doc.get("github", {}), never a falsy value
        (the stage() fixture's feature.json carries no github key at all until a write creates
        one, so a bare doc["github"] would KeyError rather than assert). Without this case the
        "die() and refuse() record nothing at all" rule above is defended by nothing: it is true
        today only by construction, and a later refactor moving a record_build_entry call earlier
        in cmd_open would violate SC-02 silently.

  - id: T-03
    title: Add gh-sync.py recover-terminal and make ship name it
    traces:
    - REQ-02
    - REQ-08
    - REQ-09
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02]
    status: done
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - tests/integration/test-gh-sync.py
    verify: |
      out=$(python3 tests/integration/test-gh-sync.py) || exit 1
      if printf '%s\n' "$out" | grep -q '^FAIL'; then exit 1; fi
      for n in "T-03 report and ask writes nothing" "T-03 recover-terminal creates milestone and parent only" "T-03 FEAT-55 shape adopts and creates nothing" "T-03 second run is idempotent" "T-03 parent contract error refuses" "T-03 gh failure records nothing" "T-03 ship names recover-terminal"; do
        printf '%s\n' "$out" | grep -qF "ok    $n" || exit 1
      done
      echo VERIFY-PASS
    intent: |
      Add one command and adjust one message.

      THE COMMAND. gh-sync.py recover-terminal <feature-dir> [--parent <n>] [--yes] - the
      operator-approved recovery for an already-merged sync-enabled feature whose mirror was
      never opened, or was opened only in part. Register it in main()'s dispatch beside "ship",
      and add its line to the module docstring's usage list.

      What it creates, and nothing else:
      - the milestone, by the same route _open_ensure_milestone already uses, including that
        function's 422 title-lookup recovery so a re-run adopts an existing milestone;
      - the parent issue, by the same route _open_ensure_parent uses, honouring --parent to
        adopt an existing number;
      - the source issues are MIRRORED into feature.json github.source_issues from plan.yaml's
        top-level source_issues, exactly as cmd_open does through parse_source_issues. It
        creates no source issue: those are the operator's own tickets and already exist.
      It creates ZERO task sub-issues. Do not call _open_sync_task, and do not iterate
      parse_tasks for creation at all. github.issues is left EXACTLY as found - an empty mapping
      stays empty, and the ids a legacy feature already carries stay untouched.

      IT IS IDEMPOTENT, AND THAT IS THE POINT. recover-terminal never refuses merely because part
      of the receipt already exists. It is the remedy every refusal this change adds names for a
      feature that predates the receipt, and the corpus it exists for already records milestones
      and parents - FEAT-55, this bug's own subject, records milestone 52, parent 1289 and 12
      task sub-issues with no build_entry. A remedy that exits 2 on the only feature it exists
      for is a deadlock. So it ADOPTS what is recorded and creates only what is missing. The four
      cases, exhaustively:
      - milestone recorded AND parent recorded: create NOTHING remotely. Mirror source_issues,
        record build_entry "recovered-terminal", exit 0.
      - milestone recorded, parent NOT recorded: adopt the milestone, create the parent (or adopt
        the number given by --parent), mirror source_issues, record "recovered-terminal".
      - milestone NOT recorded, parent recorded: create the milestone, adopt the parent, mirror
        source_issues, record "recovered-terminal".
      - neither recorded: create both, mirror source_issues, record "recovered-terminal".
      Every adoption prints one line, "gh-sync: adopting recorded milestone <n>" and "gh-sync:
      adopting recorded parent #<n>", so the operator can see what was not created. In all four,
      github.issues is unchanged and zero task sub-issues are created. Running it a second time
      on a feature already recording "recovered-terminal" is the first case: it creates nothing,
      re-records the same value and exits 0.

      THE ONE CASE THAT STILL REFUSES, and it is a checkable contract error rather than a
      category: --parent <n> was passed AND feature.json already records github.parent as a
      DIFFERENT number. Then refuse() with exit 2, naming both numbers, and write nothing: the
      operator has asserted a parent that contradicts the record, and adopting either silently
      would strand one of them. Nothing else refuses - not an already-recorded milestone, not an
      already-recorded parent, not a non-empty github.issues, not an existing build_entry.

      REPORT AND ASK, the shape cmd_abandon already uses: without --yes it prints every write it
      would make, prefixed "gh-sync: would " one per line, plus the adoption lines for the parts
      it would not create, makes none, and exits 0. With --yes it performs them.

      On success, and as the last statement of the successful path,
      record_build_entry(feat_dir, "recovered-terminal"). If gh is unavailable the existing
      skip() funnel fires: nothing is recorded, the field stays absent, the feature stays
      non-terminal, and post-merge-sweep.sh keeps the worktree (T-07). Do NOT special-case that.

      THE MESSAGE. In cmd_ship, the existing
        skip("no recorded milestone - nothing to close")
      becomes an actionable line naming both the cause and the fix, still through skip() and
      still exit 0 so post-merge-sweep.sh's positive-signal gate keeps reading it as
      not-proof-of-a-terminal-write:
        skip("no recorded milestone - this feature never completed a Build entry, so there is
        nothing to close. Run gh-sync.py recover-terminal <feature-dir> --yes to create the
        terminal receipt, then ship again.")
      with <feature-dir> interpolated as the real absolute path. Keep the literal prefix
      "gh-sync: SKIP" that skip() emits: post-merge-sweep.sh greps for that exact substring.

      Tests, written first and confirmed failing, in tests/integration/test-gh-sync.py against
      the fake gh.

      THE CASE NAMES BELOW ARE A CONTRACT, not labels: this task's verify: greps the runner's
      "ok    <name>" lines - check() at tests/integration/test-gh-sync.py:702-708 prints one only
      when the assertion HELD - so a renamed or missing case fails the verify. Pass each name to
      check() EXACTLY as written here, character for character.
      Cases:
      - "T-03 report and ask writes nothing": recover-terminal without --yes on a feature with no
        milestone: prints the would-write lines, the fake gh log records ZERO calls that create
        anything, feature.json is byte-identical afterwards;
      - "T-03 recover-terminal creates milestone and parent only": with --yes on a feature with
        neither milestone nor parent: feature.json records a milestone, a parent, source_issues
        mirrored from plan.yaml, github.issues is an EMPTY mapping (assert len == 0, not a
        substring search), the fake gh log contains zero sub-issue creates, and build_entry is
        exactly "recovered-terminal";
      - "T-03 FEAT-55 shape adopts and creates nothing", the adoption case that replaces the
        drafted exit-2 one: a fixture whose github block already records milestone 52, parent
        1289 and TWELVE entries in github.issues, with no build_entry, run with --yes: exit 0,
        build_entry exactly "recovered-terminal", github.issues still exactly those twelve ids
        (assert the key set, not a length alone), and the number of fake-gh invocations that
        CREATE anything is EXACTLY zero - count the create lines in the fake gh log and assert
        == 0, never a substring absence;
      - "T-03 second run is idempotent": the same fixture run a SECOND time with --yes: still
        exit 0, still exactly twelve github.issues ids, still zero creates;
      - "T-03 parent contract error refuses", THE CONTRACT ERROR: the same fixture run with
        --parent 999 while github.parent records 1289: exit 2, the fake gh log records zero
        calls, feature.json is byte-identical, and the message names both numbers;
      - "T-03 gh failure records nothing": with --yes where the fake gh fails on its first call:
        build_entry is ABSENT and the process exits 0 through skip;
      - "T-03 ship names recover-terminal": ship on a feature with no recorded milestone: stdout
        contains "gh-sync: SKIP" and the string "recover-terminal", and exit status is 0.

  - id: T-04
    title: Refuse Build when no Build-entry outcome is recorded
    traces:
    - REQ-06
    - REQ-01
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 enforcement carve-out - this branch IS the Build refusal mechanism, so the harness may plan it but must not execute it through its own build machinery, whatever file hosts it
    depends_on:
    - T-03
    - T-06
    status: done
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - tests/integration/test-gh-sync.py
    verify: |
      out=$(python3 tests/integration/test-gh-sync.py) || exit 1
      if printf '%s\n' "$out" | grep -q '^FAIL'; then exit 1; fi
      for n in "T-04 non-era absent refuses" "T-04 BUG-named non-era absent refuses" "T-04 station discriminator" "T-04 era-exempt continues" "T-04 era recovery-required does not claim a refusal"; do
        printf '%s\n' "$out" | grep -qF "ok    $n" || exit 1
      done
      echo VERIFY-PASS
    intent: |
      Make Build refuse to start when the Build entry never completed, and make the refusal name a
      command that is SAFE for the feature it refuses.

      In cmd_start_task, immediately after rec = load_recorded(feat_dir) and BEFORE the existing
      "T-NN has no recorded issue" skip, branch on rec["build_entry"]:

      - None (absent):
        FIRST, THE ERA GATE, before any refusal is considered. A feature whose directory basename
        is in feature_schema.BUILD_ENTRY_ERA_EXEMPT predates this change and cannot carry a
        receipt, so it is EXEMPT FROM THIS REFUSAL: print AT MOST ONE line to stderr and CONTINUE,
        exit 0. That line, verbatim, with <feat> the feature directory name and <feature-dir> its
        real absolute path:
          "gh-sync: <feat> predates the build-entry receipt
           (feature_schema.BUILD_ENTRY_ERA_EXEMPT), so Build continues. Its terminal receipt is
           created only by an explicit operator-approved gh-sync.py recover-terminal
           <feature-dir> --yes."
        It must not contain the token "open" in any form, for the same reason the recover-terminal
        refusal line below must not.
        THE ERA SET HAS EXACTLY ONE DEFINITION: the symbol BUILD_ENTRY_ERA_EXEMPT in
        .claude/skills/harness/bin/feature_schema.py, which T-06 adds. Every refusal this change
        introduces reads that one symbol - this Build refusal, T-05's merge deny and T-06's
        INV-37 - and a second definition anywhere (a literal list, a re-derived glob, a copy in
        this file) is a DEFECT, exactly as it is for the station classifier below. The exemption
        is one rule from one source, not three rules that happen to agree: the legacy corpus is
        merge-allowed and Build-allowed, and it is recovered only by an explicit
        operator-approved recover-terminal.
        Otherwise, NOT in the era set: refuse(...) - exit 2, one line. WHICH command that line
        names is chosen by the feature's OWN recorded station, never by whether it is merged: on a
        feature whose work is already under way or finished, gh-sync.py open creates exactly the
        historical task sub-issues the operator fenced off as out of scope, and merged-ness does
        not distinguish that case (a done-but-unmerged feature, and a legacy mid-build one, reach
        the forbidden act through the same call).
        Resolve the command through the ONE shared classifier T-06 adds to
        .claude/skills/harness/bin/feature_schema.py - this task defines no station rule and no
        era-exempt set of its own, and neither does T-05:
            feature_schema.recovery_command_for(feat_dir)  ->  "open" | "recover-terminal"
        Import it the way gh-sync.py already imports its siblings: _BIN_DIR is on sys.path at :89,
        so add "import feature_schema" to the existing import block.

        The two refusal lines, verbatim, with <feature-dir> interpolated as the real absolute path:
          when recovery_command_for returns "open":
            "this feature has no recorded build entry, so Build must not start. Run gh-sync.py open
             <feature-dir> first."
          when it returns "recover-terminal":
            "this feature has no recorded build entry, and its own record says the work is already
             under way or finished, so creating the mirror now would mean task sub-issues for
             completed work. Run gh-sync.py recover-terminal <feature-dir> --yes."
        The second line must not contain the token "open" at all: an operator who reads it and runs
        open performs the forbidden act, so the word cannot appear even as a description.

        Use refuse(), NOT skip(): skip exits 0, and an exit-0 refusal is the exact signal
        post-merge-sweep.sh already documents as unsafe to read as success.
      - "recovery-required": print ONE line to stderr and CONTINUE. This is the settled policy: a
        recorded temporary environmental mirror failure gates the merge, never Build. WHICH line is
        printed is decided by the era set, because T-05 ALLOWS the merge for an era feature and a
        line asserting a refusal that will not happen is false. TWO literal strings, and the
        feature's directory basename chooses between them:
          NOT in feature_schema.BUILD_ENTRY_ERA_EXEMPT, verbatim:
            "gh-sync: build entry is recovery-required for <feature-dir>; Build proceeds, the
             MERGE is refused until gh-sync.py open records opened"
          IN feature_schema.BUILD_ENTRY_ERA_EXEMPT, verbatim:
            "gh-sync: build entry is recovery-required for <feature-dir>; Build proceeds. This
             feature predates the build-entry receipt
             (feature_schema.BUILD_ENTRY_ERA_EXEMPT), so its merge is not refused; its terminal
             receipt is created only by an explicit operator-approved gh-sync.py recover-terminal
             <feature-dir> --yes."
        The era-facing line, like every other era-facing line in this change, carries no "open"
        token in any form - not as "gh-sync.py open", not as "records opened", not as a
        description of what that command would do. The non-era line keeps its "open" clause, which
        is what makes the two strings different sentences rather than one string with a name in it.
      - "opened", "not-applicable", "recovered-terminal": no output, continue unchanged.

      Nothing else in cmd_start_task changes; the plan write, the closed-card guard and the
      parent rule all keep their current order.

      The refusal must be reachable: with github.sync false the config resolver skips the whole
      invocation at exit 0 before cmd_start_task runs, which is correct - a no-mirror project
      never sees this branch.

