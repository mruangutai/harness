decisions:
  - id: D-01
    choice: The Build-entry outcome is persisted as feature.json github.build_entry, a string with the closed set opened, recovery-required, not-applicable, recovered-terminal, and ABSENCE is a fifth meaningful state meaning no Build entry ever completed.
    because: feature.json is additionalProperties false at every closed level, so the field must be declared to be writable at all, and a closed enum lets every reader branch without a second config lookup.
    dec: none
  - id: D-02
    choice: A recovery-required receipt never escalates by age. The gates are state-based only - merge stays refused until the field reads opened, however old the receipt is.
    because: time cannot make a mirror more or less absent, and an age threshold would be a second configuration knob whose expiry produces no behaviour the state check does not already produce.
    dec: none
  - id: D-03
    choice: The legacy terminal-receipt recovery is spelled gh-sync.py recover-terminal <feature-dir> and refuses without --yes, printing every write it would make.
    because: it matches the abandon verb's existing report-and-ask shape, which is the only other command in this file that performs an operator-approved irreversible remote act.
    dec: none
  - id: D-04
    choice: A run that fails after at least one remote object has been created records NOTHING, leaving github.build_entry absent; recovery-required is written only when the run stopped before any remote-mutating call.
    because: the settled policy lets Build proceed on recovery-required and blocks it on a partial remote write, so the two must be distinguishable from the local receipt alone, and absence is the state that already blocks.
    dec: none
  - id: D-05
    choice: recover-terminal records the distinct value recovered-terminal rather than opened.
    because: a recovered feature has a milestone and a parent but deliberately no task sub-issues, so calling it opened would tell every later reader a mirror exists that does not, and an audit could never separate the two.
    dec: none
  - id: D-06
    choice: The Build refusal lives in gh-sync.py cmd_start_task, which every task start already runs, and refuses with exit 2 rather than skipping with exit 0.
    because: start-task is the one chokepoint every team and main-session task passes through at build time, and skip exits 0, which is exactly the signal post-merge-sweep.sh already documents as unsafe to read as success.
    dec: DEC-174
  - id: D-07
    choice: The merge refusal is a new registered PreToolUse Bash gate, merge-gate.sh plus merge-gate.py, modelled on gh-close-gate; it decides on the LOCAL feature.json receipt alone and FAILS OPEN on a GitHub read failure - when the head branch cannot be resolved through gh it falls back to the local current branch, denies only if that resolves to a feature owing a receipt, and otherwise allows the merge at exit 0 with one stderr line saying it could not verify and why.
    because: GitHub is a mirror, never a gate - gh absent or unauthenticated means the flow succeeds and reports the sync skipped (DEC-138, DECISIONS.md:2948-2952) - and the stated intent puts changing the user-gated merge policy out of scope. Denying on a failed read would deny every gh pr merge in the repo during an outage, including for a feature recorded opened and for a PR matching no harness feature at all. A gate that cannot verify still says so, on stderr, which is the honest half of the posture branch-create-gate.sh takes over a LOCAL fact; the deny half cannot be carried over onto a remote one. Extending gh-close-gate.sh instead was rejected because its name would then lie about its subject.
    dec: DEC-174
  - id: D-08
    choice: 'The ONE frozen set BUILD_ENTRY_ERA_EXEMPT governs the three REFUSALS this change adds, and post-merge retention is keyed on something else. The three refusals - check-state.sh INV-37 (T-06), the gh-sync.py start-task Build refusal (T-04) and the merge-gate deny (T-05) - each skip a feature whose directory basename is in that set, so a legacy feature stays Build-allowed and merge-allowed and is recovered only by an explicit operator-approved recover-terminal. POST-MERGE RETENTION (T-07) keys on the RECORDED VALUE, not on era membership: an era feature whose github.build_entry key is ABSENT is swept normally, and ANY feature that RECORDS recovery-required is RETAINED, era or not. That set, and the station rule that reads it, live in feature_schema.py as BUILD_ENTRY_ERA_EXEMPT and recovery_command_for(feat_dir), the single source T-04, T-05, T-06 and T-07 all read; a second definition of either, anywhere, is a defect. recovery_command_for names recover-terminal for a feature in the era set, at station review or done, or carrying any task recorded done, and open otherwise.'
    because: 'No existing feature.json carries the field, so an unguarded invariant would report roughly fifty violations on its first run and be muted by the operator within a day. Same shape as BUG-1071''s INV-32 era guard and feature_schema.RUNS_AGENT_EXEMPT. The exemption covers all three refusals, from one source, because the stated intent''s settled bullet 7 makes legacy recovery an explicit operator-approved act, so a refusal that FORCES that act is not the stated policy; and because blocking a legacy merge would change the user-gated merge policy the same intent fences off as out of scope. RETENTION IS DELIBERATELY DIFFERENT. Settled bullet 8 requires a feature under recovery while GitHub is unavailable to remain non-terminal and to KEEP its worktree until recovery and Ship BOTH succeed, so sweeping a feature that RECORDS recovery-required would delete the very checkout the operator''s own policy preserves - era membership excuses a feature that could not have a receipt, never one that has a bad one. The exemption still covers the ABSENT key for retention, which is why an era feature merged with no receipt is swept normally. The reason recorded here in the earlier draft - that an ungated retention would be refused downstream by check-state.sh INV-29 - is FALSE as measured, and is replaced rather than kept beside this one: worktree_terminal.py:389-394 classifies a standing worktree terminal ONLY when the LANDED plan.yaml carries top-level status done, and a feature owing a receipt never reaches that station, because cmd_ship''s no-recorded-milestone skip at gh-sync.py:1799-1800 returns before _record_pr at :1962 and before _record_station(feat_dir, done) at :1975. The guard that speaks to a terminal feature with no receipt is INV-37 (T-06), by design. The station rule has one home because four call sites choose between open and recover-terminal, and open on a feature whose work is already under way or finished creates the task-level historical mirror records the stated intent puts out of scope - merged-ness cannot discriminate that case, since a done-but-unmerged feature and a legacy mid-build one reach the forbidden act through the same call, and a second copy of the rule is where one of the four quietly keeps naming open.'
    dec: none

  - id: D-09
    choice: Enabled github.sync with github.repo NOT pinned is a local configuration error, never the approved no-mirror mode - gh-sync.py open records NOTHING there, feature.json's github.build_entry stays ABSENT, and Build is therefore refused by T-04. The value not-applicable is written only by the sync-not-enabled skip, which fires when github.sync is false or absent. That state blocks BOTH halves of the lifecycle, not Build alone - T-05's merge gate self-gates on github.sync by itself, so with build_entry ABSENT it also DENIES EVERY harness-feature merge in the project - and the remedy for both halves is the CONFIGURATION fix, pinning github.repo in <root>/.harness/harness.json or setting github.sync to false, never gh-sync.py open, which records nothing in this state.
    because: 'The stated intent''s settled bullet 4 names local configuration and contract errors under enabled sync as blocking Build, and this is the case that clause exists for - the unpinned-repo skip is reachable only after the resolver has already found sync true. The out-of-scope protection covers a project that sets github.sync false or leaves GitHub unconfigured, never one that opted into the mirror and left the repo unpinned. Recording not-applicable there turns a misconfigured mirror project into an approved no-mirror one, which is precisely the silent loss of the mirror lifecycle the destination forbids. Bullets 4 and 5 do collide on this case; this reading was an ambiguity the orchestrator resolved on the operator''s behalf, disclosed here so the operator may overturn it at signature. The price of this reading, signed knowingly: T-05 therefore carries a SECOND verbatim deny reason for the unpinned branch (step 6, REPO UNPINNED) which names no command that clears it; a dedicated fixture case, "T-05 unpinned repo absent build_entry denies naming the configuration fix", covering THE CONFIG PAIR''s unpinned half; and a standing constraint that every OTHER T-05 fixture root pins github.repo to the literal "acme/widgets", or the pinned half goes uncovered.'
    dec: none
