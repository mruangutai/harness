      Retention keys on the RECORDED VALUE, never on era membership: an era feature merged with an
      ABSENT build_entry could not have written a receipt, so it is swept; ANY feature that RECORDS
      "recovery-required" wrote that receipt itself, so it is retained, era or not. An earlier draft
      of this paragraph justified the gate by predicting that an ungated retention would be REFUSED
      downstream by check-state.sh INV-29. THAT PREDICTION IS FALSE, measured at source:
      worktree_terminal.py:389-394 classifies a standing worktree terminal ONLY when the LANDED
      plan.yaml carries top-level status done, and a feature owing a mirror receipt never reaches
