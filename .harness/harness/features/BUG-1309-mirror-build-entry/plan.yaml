      out=$(python3 tests/integration/test-merge-gate.py) || exit 1
      if printf '%s\n' "$out" | grep -q '^FAIL'; then exit 1; fi
      for n in "T-05 recovery-required denies" "T-05 non-era absent build_entry denies" "T-05 unpinned repo absent build_entry denies naming the configuration fix" "T-05 opened allows" "T-05 not-applicable allows" "T-05 recovered-terminal allows" "T-05 sync false allows" "T-05 branch matching no feature allows" "T-05 non-merge command allows" "T-05 path-prefixed gh is still detected" "T-05 bash -c wrapped merge is still detected" "T-05 era-exempt absent build_entry allows" "T-05 gh outage with no matching feature allows" "T-05 gh outage with a feature owing a receipt denies"; do
