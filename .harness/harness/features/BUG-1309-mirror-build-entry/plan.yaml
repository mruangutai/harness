      printf '%s\n' "$chk" | grep -qF 'all 9 prerequisites present (8 hooks' || exit 1
      echo VERIFY-PASS
    intent: |
      A new PreToolUse Bash gate that refuses the operator's merge while a mirror receipt is
      owed. Model it on gh-close-gate.sh plus gh-close-gate.py, which is the working precedent
      for this exact shape, and copy their structure rather than inventing one.

      merge-gate.sh: resolve the harness root from the script's own directory through
      harness_boundary.resolve_root, refuse to run with exit 2 and a named message if no root
      resolves, then exec python3 "$(dirname "$0")/merge-gate.py" "$root". One interpreter
      start, exactly as gh-close-gate.sh documents.

      merge-gate.py, reading the hook JSON on stdin, taking the root as argv[1]:
      1. SELF-GATE. Read <root>/.harness/harness.json; if github.sync is not true, exit 0
         immediately. Same posture as gh-close-gate.sh and branch-create-gate.sh.
      2. DETECT. Extract tool_input.command. Tokenize with the same technique plan-sign-gate.py
         uses - shlex, compare basenames, re-scan the argument of eval and bash -c, and fall
         back to a raw-text scan for a line that will not lex. A merge command is either a token
         whose basename is gh followed by the tokens pr and merge, or a token whose basename is
         git followed by merge as its first non-flag argument. Anything else: exit 0.
      3. RESOLVE THE HEAD BRANCH.
         - git merge <ref>: the ref as written, with a leading "origin/" stripped.
         - gh pr merge <n> where n is an integer: gh pr view <n> --repo <the pinned
           github.repo> --json headRefName -q .headRefName.
         - gh pr merge with no number: git -C <cwd> rev-parse --abbrev-ref HEAD.
         Use the GH_BIN environment override for the gh binary so the gate is testable offline,
         exactly as branch-create-gate.sh does.
         THE GH ROUTE MAY FAIL - gh absent, unauthenticated, or GitHub unreachable. That is not a
         verdict. Fall back to the LOCAL resolution, git -C <cwd> rev-parse --abbrev-ref HEAD, and
         carry forward one flag saying the head branch is locally resolved rather than confirmed,
         plus the one-line gh failure text for the message at step 5.
      4. LOCATE THE FEATURE. Scan <root>/.harness/*/features/*/feature.json for the one whose
         top-level branch equals the resolved head branch. No match: exit 0 - this gate has
         nothing to say about a merge that is not a harness feature.
      5. DECIDE, on the LOCAL record only.
         THE ERA GATE FIRST, before build_entry is read at all. If the located feature's directory
         basename is in feature_schema.BUILD_ENTRY_ERA_EXEMPT, ALLOW: exit 0, no permissionDecision
         object, and AT MOST ONE line on stderr, verbatim, with <feat> the feature directory name
         and <feature-dir> its real absolute path:
           merge-gate: <feat> predates the build-entry receipt
           (feature_schema.BUILD_ENTRY_ERA_EXEMPT), so this merge is allowed. Its terminal receipt
           is created only by an explicit operator-approved gh-sync.py recover-terminal
           <feature-dir> --yes.
         That line must carry no "open" token, for the reason T-04 and T-06 both state.
         THE ERA SET HAS EXACTLY ONE DEFINITION: the symbol BUILD_ENTRY_ERA_EXEMPT in
         .claude/skills/harness/bin/feature_schema.py, which T-06 adds. This gate, T-04's Build
         refusal and T-06's INV-37 read that ONE symbol; a second definition anywhere - a literal
         list, a re-derived glob, a copy in this file - is a DEFECT, the same rule this task
         already carries for the station classifier at step 6. Blocking a legacy merge would change
         the user-gated merge policy the stated intent fences off as out of scope, and the legacy
         corpus is merge-allowed by design.
         Otherwise, read the located document's github.build_entry.
         - "opened", "not-applicable", "recovered-terminal": exit 0.
         - "recovery-required", or the key ABSENT: DENY. This holds whether the head branch was
           confirmed through gh or resolved locally: the deny is earned by the local file, and the
           reason names that file's recorded value as the ground - never a failed GitHub read.
         - The gh route failed at step 3 AND the local fallback resolves to no feature, or to a
           feature whose build_entry is one of the three passing values: ALLOW, exit 0, and print
           exactly ONE line to stderr, no permissionDecision object:
             merge-gate: could not verify this merge - the head branch could not be resolved
             through gh (<the gh failure, first line only>) and the local branch <branch> owes no
             build-entry receipt; allowing it, because GitHub is a mirror and never a gate
             (DEC-138).
           with <branch> the locally resolved branch name, or the literal word "unknown" when even
           rev-parse fails. A GitHub outage MUST NOT deny a merge: denying every gh pr merge <n>
           in the repo while gh is unauthenticated is the mirror gating, which DEC-138 forbids and
           which the stated intent's out-of-scope line on the user-gated merge policy fences off.
           There is no branch in this script that denies on a read failure.
      6. DENY SHAPE. exit 0 plus the structured permissionDecision JSON on stdout, the same
         object branch-create-gate.sh emits. The reason names the feature directory, the value
         found, and THE REMEDY THAT ACTUALLY CLEARS IT - and which remedy that is depends on
         whether github.repo is pinned, because with sync enabled and the repo left unpinned
         gh-sync.py open records nothing at all (D-09), so naming it there would send the operator
         to a command that cannot clear this deny. Read github.repo from the
         <root>/.harness/harness.json already loaded at step 1 and branch on it, applying the SAME
         test gh-sync.py:246 applies - unpinned means the value is null, empty, or contains no "/".
         REPO PINNED - github.repo is a non-empty string containing "/". Unchanged from today.
         Choose the command through the ONE shared classifier T-06 adds to
         .claude/skills/harness/bin/feature_schema.py - feature_schema.recovery_command_for(feat_dir),
         returning "open" or "recover-terminal" - and define no station rule and no era-exempt set
         here. T-04, T-05 and T-06 read that one definition; a second copy of the rule in this file
         is the drift the shared source exists to prevent. Import it by inserting merge-gate.py's
         own directory on sys.path, the way gh-close-gate.py already reaches its siblings.
         "open" spells out "python3 .claude/skills/harness/bin/gh-sync.py open <feature-dir>";
         "recover-terminal" spells out "python3 .claude/skills/harness/bin/gh-sync.py
         recover-terminal <feature-dir> --yes".
         The reason in this branch, verbatim, with <feat> the feature directory name and <command>
         the spelled-out command chosen above:
           merge-gate: <feat> records github.build_entry=<value or "absent">, so no Build entry
           receipt exists for it. This merge is denied until <command> records one.
         REPO UNPINNED - github.sync is true and github.repo is null, empty, or contains no "/".
         recovery_command_for is NOT consulted and NO command is named as clearing the deny,
         because none does. gh-sync.py open takes the "github.repo is not pinned" skip at
         gh-sync.py:247 and records nothing; /harness-init --upgrade is not a slash command but a
         MODE of the harness-init skill that runs upgrade-config.py, merge-settings.py and
         merge-gitignore.sh, and upgrade-config.py merges the shipped template whose github block
         is sync false / repo null, so it cannot pin a repo either. The repo is pinned only by the
         fresh-onboarding mirror interview or by hand. THIS REASON MUST THEREFORE CARRY NO "open"
         TOKEN IN ANY FORM - the same rule the era line at step 5 carries, and what makes the two
         branches distinguishable by grep. Verbatim:
           merge-gate: <feat> records github.build_entry=<value or "absent">, and this project has
           github.sync true with github.repo NOT pinned, so the mirror records nothing here and no
           receipt can ever be written for it (D-09). NO COMMAND CLEARS THIS BY ITSELF. Pin
           github.repo in <root>/.harness/harness.json to the value of gh repo view --json
           nameWithOwner -q .nameWithOwner, or set github.sync to false, and then re-run the Build
           entry.
         THE DENY ITSELF IS UNCHANGED in both branches: an absent or "recovery-required" receipt
         under enabled sync denies, misconfigured project or not - a misconfigured mirror must fail
         loudly rather than become an approved no-mirror project (D-09). Only the remedy differs.

