  - id: D-09
    choice: |
      BINDING LIVENESS AND DISPATCH LIVENESS ARE TWO QUESTIONS OVER ONE STORED CLAIM, and
      this feature separates them.
      THE BINDING ANSWER, used only by the guards' read-only enumerator
      inflight_registry.live_claims: an OMP claim is live exactly when _omp_claim_live says
      so, so a proven supervisor identity binds at any age; every non-OMP claim, meaning
      runtime absent or "claude", which is the default every compatibility-host claim takes,
      binds until OMP_UNVERIFIED_TTL_SECONDS have elapsed since started_at. The enumerator
      MUST NOT filter with _expire and MUST NOT compare against CLAIM_TTL_SECONDS.
      THE DISPATCH ANSWER IS UNCHANGED at CLAIM_TTL_SECONDS, 1200s: single-flight admission,
      live_children and reconcile counts behave exactly as they do today, so FEAT-37's
      unstranding of an interrupted compatibility-host run is preserved in full. THE SEAM
      THAT MAKES BOTH TRUE AT ONCE: the record written back to the registry file and the
      answer a caller returns are computed separately. Retention changes only what is
      WRITTEN; every caller's returned answer stays at 1200s, single-flight admission most
      of all.
      THE 1200s HORIZON IS EXPLICITLY NOT ACCEPTED AS A BINDING HORIZON. It is the defect
      this decision closes, not a residue: on the compatibility host it would empty the
      claim set for every governed agent past twenty minutes, and the agent would then read
      unbound and be allowed the exact main-checkout write that is this bug's founding
      incident. The remedy proposed in the cycle-1 goal-check, that the enumerator reuse
      _expire, is REJECTED for that reason.
      THE SURVIVING RESIDUE IS ACCEPTED, NAMED: a claim past OMP_UNVERIFIED_TTL_SECONDS is
