           fourth binding ruling. Assert the returned list contains the proving worktree.

  - id: T-02
    title: Implement claim_worktrees, claim_set_refusal and the read-only claim enumerator
    traces: [REQ-01, REQ-02, REQ-05, REQ-06]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out: harness_boundary.py and inflight_registry.py are the shared libraries both registered gate scripts import (DEC-179)."
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/inflight_registry.py
    verify: |
      python3 tests/unit/test-harness-boundary.py \
        && python3 tests/integration/test-inflight-registry.py
    intent: |
      Make T-01's tests pass. Nothing more.

      In inflight_registry.py add live_claims(root, agent, now=None) -> list of claim dicts.
      READ-ONLY: read the registry JSON at _registry_path(root). ABSENT AND UNREADABLE ARE
      DIFFERENT ANSWERS, from this first mention onward: when _registry_path(root) does NOT EXIST,
      return [] — a root that carries no registry file holds no claims and is legitimately empty;
      when it EXISTS but its contents cannot be read as a claim list, RAISE UnreadableRegistry as
      the unreadable-root paragraph below specifies, and never return [] for it (D-10, SC-10).
      Otherwise filter with the existing _matches(claim, agent=agent) and
      _visible(claim) predicates, apply the BINDING liveness predicate below, sort by started_at
      ascending. Default now to time.time() when the caller passes None, so tests can inject a
      clock. It must not acquire the write lock and must not rewrite the file, because it runs on
      the PreToolUse path of every governed write; live_claim mutates and is therefore the wrong
      call here.

      THE BINDING LIVENESS PREDICATE (D-09). Binding liveness and dispatch liveness are two
      questions over one stored claim, and live_claims answers only the first: does this claim
      still BIND its holder to a worktree? Apply exactly this and nothing else:
        - a claim whose runtime is "omp" is live exactly when
          inflight_registry._omp_claim_live(claim, now) says so — a proven (pid, start time)
          identity is live at ANY age, and an unproven one falls to the module's
          OMP_UNVERIFIED_TTL_SECONDS backstop;
        - every other claim is a non-OMP claim — runtime absent or "claude", which is the default
          every compatibility-host claim takes (claim_with_receipt and claim both default it, and
          the v1 migration setdefaults it) — and is live until OMP_UNVERIFIED_TTL_SECONDS have
          elapsed since its started_at, and not before.
      live_claims MUST NOT filter with _expire and MUST NOT compare against CLAIM_TTL_SECONDS.
      CLAIM_TTL_SECONDS is the DISPATCH presumption of death and it stays at 1200s for every
      dispatch-side answer; reusing it here would empty S for every compatibility-host agent past
      twenty minutes and re-allow this bug's founding incident on that host. A claim with a
      missing or non-finite started_at is not live.

      In harness_boundary.py add claim_worktrees(owner_root, agent_type, destination) -> sorted
      list of absolute worktree paths. The THIRD PARAMETER is the write's RESOLVED ABSOLUTE
      DESTINATION and it is required, not optional: the ordering paragraph below is the whole
      reason it exists. Build the candidate registry roots as owner_root PLUS every
      path in linked_worktrees(owner_root). For each root call
      inflight_registry.live_claims(root, agent_type); for each returned claim read its own
      feature field and call worktree_for_feature(owner_root, claim_feature). Add the result
      to S only when it is not None. Deduplicate and sort. Let AmbiguousWorktree propagate to
      the caller. Do NOT infer a worktree from which registry file the claim was read in:
      that construction is the defect D-02 records, and under a short-form worktree topology
      it empties S for every agent while every test still passes.
      Import inflight_registry lazily inside the function so harness_boundary keeps its
      standard-library-only import surface at module load.

      Also add claim_set_refusal(agent_type, claim_set, destination) -> str, the single
      REQ-06 message both routes print. It names agent_type, every member of claim_set, and
      the destination, and states where the write belongs. It must never advise removing a
      worktree. When destination resolves under the control-plane root's .harness/expertise/
      the advice is to use the sanctioned CLI python3 expertise-merge.py apply, because that
      destination is legitimately outside every worktree and is reached by route, not by
      relocation (D-05).

      THE UNREADABLE ROOT IS SURFACED, NOT SWALLOWED (REQ-05, SC-10, panel finding L-01). Add
      class UnreadableRegistry(Exception) to inflight_registry and raise it from live_claims when
      _registry_path(root) EXISTS but its contents cannot be read as a claim list: unparseable
      JSON, a payload that is not a JSON object, or a mapping that is neither schema_version 2 nor
      migratable by the existing v1 reader. Carry the offending path on the exception. A MISSING
      file still returns [] — absent and unreadable are different answers. Do NOT change _parse and
      do NOT change the claim/write path: case_8_corrupt_registry
      (tests/integration/test-inflight-registry.py:329) pins that fallback for writes and must stay
      green. live_claims is the read/refusal path, and inheriting the fallback there empties S for
      an agent that may well be bound, which is allowed-by-silence.

      THE ORDERING INSIDE claim_worktrees IS DECIDED, NOT OPEN, AND THIS IS THE RULE TO BUILD (D-10,
      selected remedy (a) — notes/review-fable-advisor-plan-BUG-1304-f1-binding.md). For a governed
      write with resolved absolute destination d, build S_p from every READABLE scanned registry —
      the owner root plus every linked worktree — while COLLECTING, not raising on, the set U of
      registry paths whose live_claims call raised UnreadableRegistry. Then decide in exactly this
      order:
        1. d lies inside a member of S_p — RETURN S_p without raising. This is the ordinary allow
           path and it holds whatever U contains. It is sound under any superset of S: a destination
           already inside a proven member stays inside S however many members an unreadable root
           would have added;
        2. U is empty — S_p IS the full S, so RETURN it and let the ordinary D-01 rule apply
           unchanged in the caller, including the empty-S unbound allow;
        3. U is non-empty AND d lies inside no member of S_p — RAISE UnreadableRegistry carrying
           EVERY path in U, so the seam message can name every file the operator must repair. This
           clause covers both an empty S_p, which is SC-10's founding fixture, and a non-empty one.
      An unreadable root is NEVER read as "no claims here", and a MISSING registry file still
      returns [] from live_claims: absent and unreadable stay different answers.
      THE MEMBERSHIP TEST IN CLAUSE 1 USES THE SAME CONTAINMENT PRIMITIVE THE GUARDS USE for their
      own destination-inside-a-member comparison, called from this one seam, so the two comparisons
      cannot drift into two different answers about the same path. Do not hand-roll a prefix
      comparison here.
      AmbiguousWorktree still propagates to the caller exactly as it does today, and it is not
      subject to this ordering: it means a claim the agent HOLDS cannot be placed, which no
      destination can make irrelevant.

      THE REFUSAL DECISION IS TAKEN ONCE, IN THIS SEAM, NEVER PER ROUTE (REQ-04: one predicate, one
      message builder). Extend claim_set_refusal, or add a sibling builder beside it, so the seam
      owns the unreadable case too: the message names the agent_type, EVERY registry file that could
      not be read, and states that the agent's binding cannot be determined for THIS destination so
      the write is refused rather than allowed, and it advises repairing or removing those files.
      T-04 and T-06 only catch the exception and print what the seam returns; neither reimplements
      the rule.

