decisions:
  - id: D-01
    choice: "The binding key is CLAIM-SET MEMBERSHIP. Build S, the set of worktrees the writing persona holds a live claim in. Empty S means the agent is unbound and every governed write is allowed. Non-empty S allows a governed write only when its RESOLVED destination lies inside a member of S; otherwise exit 2, naming the members of S and the destination's proper home."
    because: "Advisor ruling 2 Q1 rules it sound and binding: one predicate refuses both the measured B-10 main-checkout incident and the sibling-worktree direction, and its inputs are durable disk state (git worktree pointers plus persisted claims) that cannot misattribute. See notes/review-fable-advisor-plan-BUG-1304-binding-key.md."
    dec: DEC-208

  - id: D-02
    choice: "S is constructed by enumerating EVERY live claim held by the payload's agent_type across ALL registries INCLUDING the owner-root registry, and resolving EACH claim's own feature field through harness_boundary.worktree_for_feature(owner_root, feature). A claim contributes a member to S only when worktree_for_feature returns a real worktree; a claim whose feature has no linked worktree contributes nothing. S is NEVER derived from which registry file a claim happens to sit in."
    because: "Ruling 2 as first written fans out over linked_worktrees(owner_root) and asks live_claim(root=w) at each, which places a claim by the file it sits in. dispatch-guard.sh _root_for places a claim by basename equality (dispatch-guard.sh:122) with an owner_root fallback (:126), while worktree_for_feature matches by PREFIX because equality was measured false in this repository: its docstring records that equality alone leaves every short-form worktree unmatched and silently unbound (harness_boundary.py:215-221). Under a short-form worktree topology the file-derived construction empties S for every agent and allows every governed main-checkout write with every success criterion still green. Feature-field resolution also PRESERVES the ruling's Q3(b) allow: the main-checkout registry is scanned, but a claim for a feature with no linked worktree resolves to None, adds no member, and leaves S empty."
    dec: none

  - id: D-03
    choice: "Two same-persona residues are ACCEPTED as a reasoned boundary, not deferred and not waived. FALSE-ALLOW: persona P dispatched for feature A writes into B's worktree while a concurrent P session holds B; set membership allows it, exact match would refuse it. FALSE-REFUSE: P holds a worktree'd claim while a concurrent P claim for an un-worktree'd feature writes the main checkout; S is non-empty so the write refuses, though REQ-01 calls that session unbound."
    because: "Ruling 2 Q1 accepts both because they are forced by the identity available at the guard: exact match is unbuildable on Claude Code (no feature field on any write payload and no per-message hook to build a capture on), and on OMP buildable only through an untested currentFeature capture carrying a named wrong-feature-first branch whose miscapture would refuse the agent's legitimate writes AND allow the sibling harm. Both residues must appear verbatim in the DECISIONS.md entry T-07 lands."
    dec: none

  - id: D-04
    choice: "Candidate B, a currentFeature payload key, is NOT re-proposed, and no per-host key or capability check is taken. One host-uniform predicate lives in the DEC-193 shared Python seam imported by both guards, fed only by agent_type, which both hosts already supply. No new payload plumbing."
    because: 'DEC-208 ruling 2 already recorded the ground for rejecting a payload key, and it is quoted here from source (DECISIONS.md:6395-6396): a payload key is present only on the routes that happen to carry it, while git''s registry cannot drift. Ruling 2 Q2 adds that a per-host key would leave the compatibility host''s copies of the SAME guard scripts blind to the whole incident class, and that deferring the measured B-10 harm on a supported host is scope reduction the operator forbids. Two consequences follow and are recorded here so nobody re-opens them: ruling 2''s fail-open cases (d) capture-timing and (e) wrong-first-marker are MOOT, because the ruled key never reads currentFeature, so no test is scheduled for either; and ruling 2''s Q4, the OMP feature-capture coverage gap, is OUT of BUG-1304''s scope and is filed separately, because the ruled key binds to inflight_registry and harness_boundary only and touches none of that mechanism.'
    dec: DEC-208

  - id: D-05
    choice: "The one legitimate outside-worktree write class, control-plane Expertise distillation, is carved out BY ROUTE and not by destination glob: python3 expertise-merge.py apply writes the control-plane root's .harness/expertise/<agent>.md at merge time from inside a worktree and stays allowed, because it is not among the Bash guard's extractable write findings (redirects, sed and perl -i, tee, mv and cp, rm, sponge, awk -i). It is pinned by a NEGATIVE test case, and REQ-06's refusal message for a control-plane Expertise destination redirects to that CLI, never to write it in your worktree."
    because: "Advisor ruling 1 Q2 examined all four candidate classes plus the factory base and found no other legitimate cross-worktree governed write; stating the carve-out by route rather than by glob keeps the destination hard-gated for every route that IS extractable."
    dec: DEC-153

  - id: D-06
    choice: "The assigned-worktree rule keys on the HARNESS BASE ONLY. DEC-193's second legal write location, workspace_root/<repo> under the DEC-189 two-base layout, is left UNBOUND by this rule."
    because: "Advisor ruling 1 Q2 flags that no factory module links worktrees, so a factory-dispatched agent has no assigned worktree to compare a destination against and must read unbound; the plan states the limit explicitly rather than leaving a reader to infer it from the absence of a rule."
    dec: DEC-193

  - id: D-07
    choice: "The recording form is a NEW DECISIONS.md entry with its DECISIONS-INDEX.md row, PLUS two SAME-EDIT REWRITES in the same landing: DEC-153's worktree carve-out clause narrowed from any disposable checkout to THE ASSIGNED worktree, and DEC-193's first surviving-divergence bullet, which currently reads that the Bash route keeps DEC-153's blanket allow. Neither is recorded as a dated sub-section, and DEC-153 is not superseded."
    because: "Advisor ruling 1 Q4 applies DEC-205: a correction rewrites the entry it corrects, amendment is not an available form, and a plan-level D-NN alone fails because plans are per-feature while DEC-153 and DEC-193 would go on asserting the old truth in the authority every future reader opens."
    dec: DEC-205

  - id: D-08
    choice: "REQ-04 is decomposed as TWO DIFFERENT EDITS with their own tasks, files and verifies, never as one shared change. The Bash route NARROWS an existing blanket allow; the Write/Edit route EXTENDS binding from target-path-derived to claim-derived."
    because: "Advisor ruling 1 obligation 3 records the asymmetry: the two routes start from opposite existing behaviours, so a single shared task would hide one of the two changes and its regression surface."
    dec: none

  - id: D-09
    choice: |
      BINDING LIVENESS AND DISPATCH LIVENESS ARE TWO QUESTIONS OVER ONE STORED CLAIM, and
      this feature separates them.
      THE BINDING ANSWER, used only by the guards' read-only enumerator
      inflight_registry.live_claims: an OMP claim is live exactly when _omp_claim_live says
      so, so a proven supervisor identity binds at any age; every non-OMP claim, meaning
      runtime absent or "claude", which is the default every compatibility-host claim takes,
      binds until OMP_UNVERIFIED_TTL_SECONDS have elapsed since started_at. The enumerator
      MUST NOT filter with _expire and MUST NOT compare against CLAIM_TTL_SECONDS.
      THE DISPATCH ANSWER IS UNCHANGED at CLAIM_TTL_SECONDS, 1200s: single-flight admission,
      live_children and reconcile counts behave exactly as they do today, so FEAT-37's
      unstranding of an interrupted compatibility-host run is preserved in full. THE SEAM
      THAT MAKES BOTH TRUE AT ONCE: the record written back to the registry file and the
      answer a caller returns are computed separately. Retention changes only what is
      WRITTEN; every caller's returned answer stays at 1200s, single-flight admission most
      of all.
      THE 1200s HORIZON IS EXPLICITLY NOT ACCEPTED AS A BINDING HORIZON. It is the defect
      this decision closes, not a residue: on the compatibility host it would empty the
      claim set for every governed agent past twenty minutes, and the agent would then read
      unbound and be allowed the exact main-checkout write that is this bug's founding
      incident. The remedy proposed in the cycle-1 goal-check, that the enumerator reuse
      _expire, is REJECTED for that reason.
      THE SURVIVING RESIDUE IS ACCEPTED, NAMED: a claim past OMP_UNVERIFIED_TTL_SECONDS is
      silently unbound, so a genuinely live compatibility-host agent older than the backstop
      reads unbound and its governed main-checkout writes are allowed again.
      THE BACKSTOP VALUE IS THE EXISTING OMP_UNVERIFIED_TTL_SECONDS, 86400s
      (inflight_registry.py:36). This is the advisor's recommendation carried as the PLANNED
      value and RATIFIED AT SIGNATURE: naming a different binding horizon is the operator's
      call, and no alternative is invented here.
      IF T-09 IS STRUCK AT SIGNATURE the registry-FILE retention half does not land, and the
      strike OVERRIDES Advisor rulings A and B, which classified this asymmetry as a DEFECT
      this feature must close rather than a residue it may accept. It is NOT the symmetric
      twin of striking T-08: T-08's strike costs nothing, because T-02 resolves each claim's
      own feature field whatever file it sits in, while this strike leaves the founding
      incident REACHABLE. OC-1 asks only WHERE the retention half lands, here or as its own
      issue; it does not ask whether the hole may stay open. The consequence, stated plainly
      rather than left to be discovered: a dispatch-expired non-OMP claim is still deleted
      from the registry file by the pruning that runs on every dispatch and at every parent
      return, so the enumerator cannot see it however correct its predicate is, the agent
      reads unbound, and the exact main-checkout write of this bug's founding incident is
      allowed again on the suspend path until the separate issue lands. SC-11 is struck with
      the task, so nothing else in the plan asserts the retention half.
    because: |
      Advisor ruling 3 (notes/review-fable-advisor-plan-BUG-1304-ttl-residue.md) measured the
      asymmetry and ruled it a DEFECT rather than a residue, on the two tests an accepted
      residue must pass. It is closable here, inside the files T-02 already owns, because the
      host capability limit recorded at inflight_registry.py:27-28 forces only the DISPATCH
      presumption of death, not the binding one. And it is materially worse than D-03's two
      residues, which never reopen the founding incident, whereas this one reopens it
      verbatim on a supported host under routine conditions.
      The residue that survives is accepted on the module's own recorded ground at
      inflight_registry.py:30-35: no supervisor proof exists on the compatibility host, and a
      claim that can never age out strands its parent's yield through validate-digest.py's
      held-child gate forever. 86400s is well above the 7,200s longest measured leaf run, so
      the horizon can never cut short a real agent.
      D-03 stays EXACTLY as written and is not amended: its two residues are unbuildable-limit
      residues of a different class, and folding this one into that entry would blur the
      distinction between a limit and a defect.
    dec: DEC-204
  - id: D-10
    choice: |
      AN UNREADABLE OR UNREPRESENTABLE REGISTRY IS A REFUSE CASE, not an empty one. A registry
      file that EXISTS among the scanned roots and cannot be read as a claim list — unparseable
      JSON, a payload that is not a JSON object, or a mapping that is neither schema_version 2
      nor migratable — makes inflight_registry.live_claims raise UnreadableRegistry carrying
      that path; harness_boundary.claim_worktrees propagates it as it propagates
      AmbiguousWorktree; and both guards exit 2 with ONE seam-built message naming the file to
      repair. A MISSING registry file still returns an empty list: absent and unreadable are
      different answers. The CLAIM/WRITE path is untouched — _parse keeps its treat-as-empty
      fallback (inflight_registry.py:56-65) and case_8_corrupt_registry
      (tests/integration/test-inflight-registry.py:329) stays green. Only the READ/REFUSAL path
      this feature adds refuses.
    because: |
      THE ADVISOR'S REQ-05 PATTERN EXTENDED BY PM, RATIFIED AT SIGNATURE. It is flagged that way
      deliberately, so the operator reads an extension rather than a silent widening. Advisor
      rulings 1 and 2 fixed REQ-05's shape — a record that exists, claims to carry the answer
      and cannot be read is refused, never treated as absent — and enumerated the destination
      .git pointer and claim ambiguity, but never reached the registry file itself. The
      cycle-1 plan panel measured the consequence: live_claims spec'd to return an empty list
      for a corrupt root empties S, the agent reads UNBOUND, and this bug's founding
      main-checkout write is ALLOWED with every success criterion green — a fail-open under a
      failure mode this codebase already names and tests elsewhere. No advisor ruled on the
      case, so pm applies the existing pattern rather than inventing a rule, and the operator
      ratifies or strikes it at signature.
      THE TRUE COST, STATED AT ITS ACTUAL SCOPE — CORRECTED AT PANEL CYCLE 2. The refusal is NOT
      scoped to the write's own destination, nor to the registry that would place that write.
      claim_worktrees(owner_root, agent_type) scans the owner-root registry PLUS every linked
      worktree's registry while it BUILDS S, and the destination is not an argument to that function
      at all, so every scanned registry must be readable before any destination is compared to S.
      Stated plainly: while ANY scanned registry file is unreadable, EVERY governed write by EVERY
      governed persona on EVERY feature is refused with exit 2 — including a write squarely inside
      the writer's own healthy assigned worktree, the paradigm case REQ-03 promises keeps working
      unchanged — until that one unrelated file is repaired. The refusal is loud and names the file,
      and it replaces a silent fail-open in which a corrupt registry anywhere emptied S and allowed
      this bug's founding main-checkout write; but the trade is FACTORY-WIDE, not per-write. The
      earlier wording of this paragraph said only that a governed persona's governed writes are
      refused loudly, which states a NARROWER rule than the plan implements. It is corrected here so
      that signature ratifies the trade that exists rather than a smaller one.
      THE bash-write-guard.sh:684-694 COMPARISON IS KEPT ONLY FOR THE DIRECTION OF THE TRADE, and is
      explicitly NOT a precedent for its scope: that manifest refusal is bounded to the write whose
      own manifest cannot be read, while this one is bounded by nothing the write itself controls.
      SC-10 binds the refusal, and its paired well-formed control keeps the criterion from being
      satisfied by the ordinary claim-set refusal — but no criterion and no task case in this plan
      exercises "my own destination and my own registry are healthy while an unrelated feature's
      registry is corrupt", so that scope is disclosed here at signature rather than measured by a
      gate.
      THE REMEDY IS AN OPEN CHOICE AT SIGNATURE AND NEITHER OPTION IS SELECTED HERE. Panel cycle 2
      raised it as a HIGH finding (PF-055b89703a96f6c82edc6d37e6fb973c, harness-code-reviewer,
      notes/review-harness-code-reviewer-planpanel-c2.md); under DEC-176 a HIGH finding is not
      accepted by pm or by a lead, so both remedies are recorded verbatim and the operator picks one.
      REMEDY (a) — NARROW THE RULE TO THE WRITE THAT ASKED. Allow a write whose resolved destination
      lies inside a member of the PARTIAL S built from the readable roots, and require full
      readability only when the partial S does not already place the destination. The panel's own
      assessment, carried here unchanged: this is sound under ANY superset of S, because a
      destination already inside a proven member stays inside S however many members a readable
      registry would have added. WHAT IT CHANGES: the ordering inside T-02's predicate — resolve the
      destination first, compare it against the partial S, and raise UnreadableRegistry only when the
      answer would depend on the unreadable root. WHAT BINDS IT: SC-10 as written binds the refusal,
      not the allow, so remedy (a) needs a NEW criterion, which would assert that with one scanned
      registry unreadable and the writer's own registry readable, a write inside the writer's own
      worktree exits 0 while a main-checkout write still exits 2 naming the unreadable file. REQ-03
      stands unamended under (a).
      REMEDY (b) — KEEP THE GLOBAL RULE AND CARVE THE EXCEPTION INTO REQ-03. The factory-wide blast
      radius is accepted and REQ-03's unconditional promise is amended to match it. PROPOSED CARVE-OUT
      TEXT, RECORDED HERE AS PROPOSED ONLY AND DELIBERATELY NOT WRITTEN INTO BRIEF.md: "EXCEPTION:
      while any registry file among the scanned roots cannot be read as a claim list, every governed
      write is refused, including writes whose destination is inside the writer's own assigned
      worktree, until that file is repaired; the refusal names the file to repair." WHAT BINDS IT:
      SC-10 already binds the refusal itself, so (b) needs one added criterion asserting by inspection
      that the seam's message names the unreadable file and states the repair — the operator would be
      accepting a factory-wide stop, so the recovery instruction is the part that must be verifiable.
      THE CHOICE IS NOT PRE-EMPTED BY PM, AND IT SUPERSEDES Q1. pm's own open question Q1
      (notes/research-BUG-1304-plan-repair-panelc1.md:85-86) disclosed only the narrower REQ-01
      unbound-agent scope; the panel judged that wording inadequate for exactly this reason. Q1 is
      superseded by this paragraph and must be resolved together with it, never signed off separately
      on its narrower framing.
      A KNOWN ASYMMETRY, RECORDED AND NOT REPAIRED, SO THE OPERATOR SEES IT BEFORE SIGNING (panel
      cycle 2 finding PF-5b09773491bc20f90f69a59b84294788, med, harness-code-reviewer; no task is
      added for it and this feature does not widen to reach it). S has TWO inputs and this decision
      makes only ONE of them fail-closed. The registry input is now fail-CLOSED. The worktree-pointer
      input remains fail-OPEN: harness_boundary.linked_worktrees returns [] on any OSError listing
      owner_root/.git/worktrees (harness_boundary.py:170-173, anchors re-verified in the worktree) and
      silently skips a pointer file it cannot read (harness_boundary.py:177-183, re-verified), so an
      I/O fault at the enumeration layer is indistinguishable from "no worktrees exist";
      worktree_for_feature then resolves to None, a live claim in that worktree contributes nothing to
      S, the agent reads UNBOUND and the governed main-checkout write is ALLOWED — B-10's silent
      unbound-allow verbatim, one layer above the layer this decision closes. The feature also
      repurposes linked_worktrees, written and documented as a REPORT primitive, as an ENFORCEMENT
      input, which is what makes its report-grade tolerance load-bearing. Likelihood is lower than a
      corrupt registry file, since it needs an I/O fault on the directory itself, hence med and not
      high. Closing it is its own issue.
