           the readable roots and then ignores the unreadable one.
        8. THE ALLOW HALF (SC-12 at the unit level). With one root's registry unreadable and a
           READABLE root proving a worktree that CONTAINS the destination, claim_worktrees RETURNS
           that partial S and RAISES NOTHING. It is sound because a destination already inside a
           proven member stays inside S however many members the unreadable root would have added.
           This case goes red against an implementation that requires every scanned registry to be
