      destination is under the control-plane root's .harness/expertise/ it must advise the
      sanctioned CLI python3 expertise-merge.py apply instead of advising the agent to write
      it in its own worktree.

      THE UNREADABLE-REGISTRY CASES (REQ-05, SC-10, SC-12, panel finding L-01). _parse treats an
      unreadable registry as empty (inflight_registry.py:56-65), and case_8_corrupt_registry
      (tests/integration/test-inflight-registry.py:329) pins that fallback deliberately FOR THE
      CLAIM/WRITE PATH. The READ/REFUSAL path this bug adds must NOT inherit it: an unreadable
      root leaves the claim set INCOMPLETE, and an incomplete claim set must never be reported as
