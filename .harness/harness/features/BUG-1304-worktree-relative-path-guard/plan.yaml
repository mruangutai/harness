  - id: D-10
    choice: |
      AN UNREADABLE OR UNREPRESENTABLE REGISTRY IS A REFUSE CASE FOR THE GOVERNED WRITES THE READABLE
      ROOTS CANNOT PLACE — not an empty answer, and not a factory-wide stop. A registry file that EXISTS
      among the scanned roots and cannot be read as a claim list — unparseable JSON, a payload that is not
      a JSON object, or a mapping that is neither schema_version 2 nor migratable — makes
      inflight_registry.live_claims raise UnreadableRegistry carrying that path.
      THE ORDERING IS PART OF THIS DECISION AND IS SELECTED, not left open: the fourth binding ruling
      (notes/review-fable-advisor-plan-BUG-1304-f1-binding.md) adopted remedy (a). For a governed write
      with resolved absolute destination d, harness_boundary.claim_worktrees builds S_p from every
      READABLE scanned registry while collecting the set U of unreadable registry paths, and then:
        1. d lies inside a member of S_p — the ordinary allow path, whatever U holds;
        2. U is empty — S_p is the full S and the ordinary D-01 rule applies unchanged, including the
