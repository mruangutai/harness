        3. U is non-empty AND d lies inside no member of S_p — exit 2 on BOTH routes with ONE seam-built
           message naming EVERY file in U. This clause covers both the empty S_p case, which is SC-10's
           founding fixture, and the non-empty one.
      An unreadable root is NEVER read as "no claims here". A MISSING registry file still returns an empty
