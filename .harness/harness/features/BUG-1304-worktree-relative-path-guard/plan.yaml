decisions:
  - id: D-01
    choice: "The binding key is CLAIM-SET MEMBERSHIP. Build S, the set of worktrees the writing persona holds a live claim in. Empty S means the agent is unbound and every governed write is allowed. Non-empty S allows a governed write only when its RESOLVED destination lies inside a member of S; otherwise exit 2, naming the members of S and the destination's proper home."
    because: "Advisor ruling 2 Q1 rules it sound and binding: one predicate refuses both the measured B-10 main-checkout incident and the sibling-worktree direction, and its inputs are durable disk state (git worktree pointers plus persisted claims) that cannot misattribute. See notes/review-fable-advisor-plan-BUG-1304-binding-key.md."
    dec: DEC-208

  - id: D-02
    choice: 'S is constructed by enumerating EVERY live claim held by the payload''s agent_type across ALL registries INCLUDING the owner-root registry, and resolving EACH claim''s own feature field through harness_boundary.worktree_for_feature(owner_root, feature). A claim contributes a member to S only when worktree_for_feature returns a real worktree; a claim whose feature has no linked worktree contributes nothing. S is NEVER derived from which registry file a claim happens to sit in. A claim whose feature resolves AMBIGUOUSLY — two or more prefix-matching worktrees, harness_boundary.AmbiguousWorktree — is neither guessed into S nor dropped from it: on both routes the governed write is refused with exit 2, naming the candidate worktrees the resolver declined to choose between.'
    because: "Ruling 2 as first written fans out over linked_worktrees(owner_root) and asks live_claim(root=w) at each, which places a claim by the file it sits in. dispatch-guard.sh _root_for places a claim by basename equality (dispatch-guard.sh:122) with an owner_root fallback (:126), while worktree_for_feature matches by PREFIX because equality was measured false in this repository: its docstring records that equality alone leaves every short-form worktree unmatched and silently unbound (harness_boundary.py:215-221). Under a short-form worktree topology the file-derived construction empties S for every agent and allows every governed main-checkout write with every success criterion still green. Feature-field resolution also PRESERVES the ruling's Q3(b) allow: the main-checkout registry is scanned, but a claim for a feature with no linked worktree resolves to None, adds no member, and leaves S empty."
    dec: none

  - id: D-03
    choice: "Two same-persona residues are ACCEPTED as a reasoned boundary, not deferred and not waived. FALSE-ALLOW: persona P dispatched for feature A writes into B's worktree while a concurrent P session holds B; set membership allows it, exact match would refuse it. FALSE-REFUSE: P holds a worktree'd claim while a concurrent P claim for an un-worktree'd feature writes the main checkout; S is non-empty so the write refuses, though REQ-01 calls that session unbound."
    because: "Ruling 2 Q1 accepts both because they are forced by the identity available at the guard: exact match is unbuildable on Claude Code (no feature field on any write payload and no per-message hook to build a capture on), and on OMP buildable only through an untested currentFeature capture carrying a named wrong-feature-first branch whose miscapture would refuse the agent's legitimate writes AND allow the sibling harm. Both residues must appear verbatim in the DECISIONS.md entry T-07 lands."
    dec: none

  - id: D-04
    choice: "Candidate B, a currentFeature payload key, is NOT re-proposed, and no per-host key or capability check is taken. One host-uniform predicate lives in the DEC-193 shared Python seam imported by both guards, fed only by agent_type, which both hosts already supply. No new payload plumbing."
