  - id: T-04
    title: Bind the Write and Edit route to the claim set in check-domain.sh
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-06]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out: check-domain.sh is a registered PreToolUse gate script (DEC-179)."
    depends_on: [T-02, T-03]
    status: done
    files:
      - .claude/skills/harness/bin/check-domain.sh
    verify: |
      python3 tests/integration/test-check-domain.py
    intent: |
      This route EXTENDS an existing binding; it does not narrow one. Today
      feature_checkout_guard (check-domain.sh:737-753) derives the feature id from the TARGET
      PATH via RE_FEATURE_ARTIFACT (:734), so any destination carrying no feature id in its
      path is unbound. Keep that guard exactly as it is and add a SECOND, claim-derived check
      beside it that reaches the destinations the path-derived one cannot.

      Add a function that runs on the same allow and shared verdict paths where
      feature_checkout_guard is already called (:917 and :922), taking the resolved absolute
      destination. It must:
        - return immediately when agent_type is empty or does not start with harness- ,
          because the main session is the DEC-174 executor of gate-script work and carries no
          agent identity;
        - call harness_boundary.claim_worktrees(root, agent_type, destination) to get S, passing
          the RESOLVED ABSOLUTE DESTINATION as the third argument — the seam needs it to apply
          D-10's selected ordering, and passing anything else there silently changes which writes
          the unreadable-registry rule refuses;
        - return immediately when S is empty: an unbound agent is out of the rule's scope
          (REQ-01), and this is the Q3(a) and Q3(b) allow;
        - otherwise resolve the destination's own checkout with the harness_boundary
          primitive this file already uses, and exit 0 when it lies inside a member of S;
        - otherwise print harness_boundary.claim_set_refusal(agent_type, S, destination) to
          stderr and exit 2. Only exit 2 blocks (DEC-100).
      An unparsed .git pointer on the DESTINATION checkout, with S non-empty, is a REFUSAL,
      not a pass-through (Q3(c)). AmbiguousWorktree raised while building S is also a refusal
      naming the candidates (REQ-05, bound but unplaceable).
      A defect inside the guard's own code keeps failing open, unchanged: wrap the
      inflight_registry import and any unexpected exception exactly the way the existing
      quarantine branch does, and say on stderr that the boundary was not enforced.
      The rule keys on the HARNESS BASE ONLY. Do not bind destinations under
      workspace_root/<repo>, the DEC-189 two-base second location (D-06).

      UNREADABLE REGISTRY (REQ-05, SC-10, SC-12, panel finding L-01). inflight_registry.UnreadableRegistry
      raised while building S is a REFUSAL, and the rule is decided in the seam, not here: catch it
      exactly where AmbiguousWorktree is caught, print the message T-02's seam builder returns for
      it, and exit 2. Never treat it as an empty S — empty means unbound, and an unreadable root
      means the question could not be answered. This exception is NOT a defect inside the guard's
      own code, so it must NOT take the quarantine-style fail-open branch above; that branch stays
      for genuinely unexpected exceptions. Because the destination was passed in, the seam raises
      only for a destination the readable roots cannot place, so this catch never fires for a write
      inside a worktree a readable registry already proved (SC-12's allow half).

