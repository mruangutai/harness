      IN SCOPE, AND SETTLED. The fourth binding ruling
      (notes/review-fable-advisor-plan-BUG-1304-f1-binding.md, Q2) ruled this task IN SCOPE and the
      operator authorised that ruling with no overrules. It is not strikeable and no part of it is an
      open question: Advisor rulings A and B
      (notes/review-fable-advisor-plan-BUG-1304-ttl-residue.md) classified the compatibility-host TTL
      asymmetry as a DEFECT this feature must close and named registry-FILE retention as one half of
      the closing boundary, and the ruling agreed. THE HOLE IT CLOSES, so a later reader knows what
      this task is worth: dispatch-guard.sh:197 calls the mutating live_claim on every dispatch and
      validate-digest.py:1755-1760 calls live_children at every parent return, so without this task a
      compatibility-host claim older than 1200s is DELETED FROM THE FILE on the routine suspend path,
      the guards' enumerator cannot see it however correct its predicate is, the agent reads unbound,
      and its governed main-checkout write is allowed — this bug's founding incident, verbatim, not a
      residue. A read-side-only guard is ceremonial on that host. The closure sits entirely inside
      files T-02 already owns, and SC-11 binds it.

      Both halves below land TOGETHER, because assertion (b) is the only thing that catches
      the suspend-path side-channel and it moves with the retention change.

      TEST FIRST, exactly as T-01 precedes T-02. Write (b) before (a) and confirm the suite
      exits 1 before you touch inflight_registry.py.

      (a) THE RETENTION RULE, AND THE SEAM IT LANDS ON.

      THE SEAM IS THE POINT OF THIS TASK. Inside every pruning function the list _expire_where
      returns is used for TWO DIFFERENT PURPOSES: the FILE-CONTENT assignment
      (data["claims"] = live) and the CALLER'S OWN ANSWER computation. Retention changes ONLY
      WHAT IS WRITTEN BACK to the file. It must NEVER change what is RETURNED. Implement the two
      as separately computable values — for example, have _expire_where produce a pair,
      (answer_live, retained), where answer_live is exactly what it returns today and retained is
      answer_live PLUS every claim that is dispatch-expired under CLAIM_TTL_SECONDS, younger than
      OMP_UNVERIFIED_TTL_SECONDS, and not an OMP claim already proven dead — and have each caller
      assign retained to data["claims"] while computing its answer from answer_live exactly as it
      does today. A caller that writes retained into its ANSWER, or answer_live into the FILE, is
      the defect this task exists to prevent. Do not solve it by changing the shared primitive
      alone and letting every caller inherit one new meaning of live: that is the failure mode
      named at claim_with_receipt below.

      _expire_where is defined at inflight_registry.py:227 and has SIX callers. Every one of them
      must RETAIN the record, and every one of them must return byte-for-byte the answer it gives
      today:
        - orphan_write (:297) — retains; its return value and the orphan marking it performs are
          unchanged. It deletes the claim today, so leaving it out reopens the hole by itself
          even if every other site is patched.
        - live_claim (:323-328) — retains; still returns only the claims live at 1200s.
        - live_children (:343-349) — retains; its child list and counts stay at 1200s.
        - claim_with_receipt (:375) — retains; and its SINGLE-FLIGHT ADMISSION,
          any(_matches(c, agent=agent, feature=feature) for c in live), MUST keep reading the
          1200s answer list. If admission reads the retained list instead, a fresh same-agent
          same-feature dispatch is refused for up to 86400s instead of 1200s — the FEAT-37
          stranding D-09 forbids. This is the most dangerous site in the task and the reason the
          record/answer split is stated before the site list.
        - attach_runtime_identity (:432) — retains; the claim it selects and the identity it
          attaches are unchanged.
        - release (:472) — retains every claim its selector does not release; its selection, its
          matches list and its return value are unchanged. Like orphan_write it deletes today,
          so leaving it out reopens the hole by itself.
