      In tests/unit/test-harness-boundary.py, two more assertions inside case_bug1304_claim_set,
      which together pin D-10's selected ordering — the refusal is scoped to the writes the
      readable roots cannot place, so ONE of these two must go red under either wrong ordering:
        7. THE REFUSAL HALF. With one scanned root's registry unreadable and a destination lying
