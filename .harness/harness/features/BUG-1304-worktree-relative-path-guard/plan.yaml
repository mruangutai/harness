           "claude" (the compatibility-host default) and its started_at is back-dated MORE
           than inflight_registry.CLAIM_TTL_SECONDS but LESS than
           inflight_registry.OMP_UNVERIFIED_TTL_SECONDS before now, writes a governed
           MAIN-CHECKOUT path: exit 2, stderr naming the worktree it holds. Back-date by
           writing started_at through inflight_registry's own API and then rewriting that one
           stored field; started_at is stored data, so this case needs no clock mocking and is
           deterministic. It goes red against any implementation that filters the enumerator
           with _expire or CLAIM_TTL_SECONDS, which is the exact remedy RULING D rejected.
           Assert exit 0 from bug1304_pre_change_hook for the same payload, as every refusal
           case above does.

      THE PRE-CHANGE CALL MUST PROVE THE FROZEN GUARD RAN (SC-06, panel finding L-04). An exit 0
      out of a fail-open branch is NOT an unrefused write, so an exit-code-only pre-change
      assertion is satisfiable by a guard that never reached the rule. check-domain.sh prints and
