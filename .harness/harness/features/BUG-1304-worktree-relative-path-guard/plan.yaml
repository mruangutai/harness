      unbound-allow verbatim, one layer above the layer this decision closes. The feature also
      repurposes linked_worktrees, written and documented as a REPORT primitive, as an ENFORCEMENT
      input, which is what makes its report-grade tolerance load-bearing. Likelihood is lower than a
      corrupt registry file, since it needs an I/O fault on the directory itself, hence med and not
      high. Closing it is its own issue.
    dec: none
  - id: D-11
    choice: |
      THREE DEFECTS THIS FEATURE FOUND AND DELIBERATELY DOES NOT CLOSE ARE FILED AS THEIR OWN
      ISSUES, and filing them is REQUIRED, not optional. They are recorded here in one place so a
