      feature adds refuses.
    because: |
      THE SHAPE BEGAN AS THE ADVISOR'S REQ-05 PATTERN EXTENDED BY PM AT CYCLE 1, AND THE FOURTH
      BINDING RULING HAS SINCE RULED THE CASE ITSELF. It is flagged that way deliberately, so the
      operator reads where each half came from rather than a silent widening. Advisor
      rulings 1 and 2 fixed REQ-05's shape — a record that exists, claims to carry the answer
      and cannot be read is refused, never treated as absent — and enumerated the destination
      .git pointer and claim ambiguity, but never reached the registry file itself. The
      cycle-1 plan panel measured the consequence: live_claims spec'd to return an empty list
      for a corrupt root empties S, the agent reads UNBOUND, and this bug's founding
      main-checkout write is ALLOWED with every success criterion green — a fail-open under a
      failure mode this codebase already names and tests elsewhere. At cycle 1 no advisor had yet reached the registry
      file itself, so pm extended the existing pattern rather than inventing a rule. The FOURTH BINDING
      RULING (notes/review-fable-advisor-plan-BUG-1304-f1-binding.md) SUBSEQUENTLY ruled on exactly
      this case, SELECTED remedy (a), and the operator AUTHORISED that ruling with NO overrules.
      Nothing here is left awaiting a ratify-or-strike at signature.
      THE TRUE COST, STATED AT ITS ACTUAL SCOPE UNDER THE SELECTED REMEDY (a). The refusal binds every
      governed write the READABLE roots cannot place, and NEVER a write whose resolved destination lies
      inside a proven member of the partial S_p. Stated plainly: while a scanned registry file is
      unreadable, an agent whose own claim is readable keeps writing inside its own assigned worktree, and
      what is refused is the governed write the readable roots cannot account for — the main-checkout
      write, the sibling-worktree write, and every governed write by an agent whose only claim sits in the
      unreadable file. That is a per-write refusal, not a factory-wide stop. It is sound under any superset
      of S: a destination already inside a proven member stays inside S however many members the unreadable
      root would have added, so repairing the file can never revoke an allow this rule gave. The cost that
      DOES remain is real and is what signature ratifies: an agent whose OWN claim sits in the unreadable
      file is refused every governed write outside the worktrees the readable roots still prove for it,
      until that file is repaired, and the refusal is loud and names every unreadable file. The
      panel-cycle-2 wording of this paragraph — that the trade is FACTORY-WIDE, refusing even a write
      inside the writer's own healthy worktree — described the ordering the plan carried BEFORE the fourth
      binding ruling and no longer describes the plan; it is corrected here rather than left for a reader
      to reconcile.
      THE bash-write-guard.sh:684-694 COMPARISON NOW HOLDS IN SCOPE AS WELL AS DIRECTION. That manifest
      refusal is bounded to the write whose own manifest cannot be read; under the selected remedy this
      refusal is likewise bounded by the write itself — its own resolved destination decides whether the
      unreadable root can matter to it. The gap panel cycle 2 named, that no criterion and no task case
      exercised "my own destination and my own registry are healthy while an unrelated feature's registry
      is corrupt", is CLOSED rather than disclosed: BRIEF SC-12 asserts exactly that pair on both routes,
      generated by T-03 and T-05, and SC-10 keeps binding the refusal on its own disjoint fixture where the
      agent's only claim is the corrupt one.
      THE REMEDY IS SELECTED AND THE CHOICE IS CLOSED. Panel cycle 2 raised the blast radius as a HIGH
      finding (PF-055b89703a96f6c82edc6d37e6fb973c, harness-code-reviewer,
      notes/review-harness-code-reviewer-planpanel-c2.md); under DEC-176 neither pm nor a lead may accept a
      HIGH finding, so it went to the advisor, and the operator authorised the fourth binding ruling
      (notes/review-fable-advisor-plan-BUG-1304-f1-binding.md) with no overrules.
      SELECTED — REMEDY (a), NARROW THE RULE TO THE WRITE THAT ASKED. Resolve the destination first,
      compare it against the partial S_p built from the readable roots, and raise UnreadableRegistry only
      when the answer would depend on an unreadable root. It keeps REQ-03 unamended, keeps the fail-closed
      refusal for exactly the writes the readable roots cannot place, and covers SC-10's founding case
