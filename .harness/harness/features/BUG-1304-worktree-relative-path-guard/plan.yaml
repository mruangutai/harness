tasks:
  - id: T-01
    title: Add the failing claim-set tests for the shared seam and the registry enumerator
    traces: [REQ-01, REQ-02, REQ-05]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out: harness_boundary.py and inflight_registry.py are gate-script libraries, so their tests are enforcement-layer files the main session executes directly (DEC-179)."
    depends_on: []
    status: done
    files:
      - tests/unit/test-harness-boundary.py
      - tests/integration/test-inflight-registry.py
    verify: |
      python3 tests/unit/test-harness-boundary.py; a=$?
      python3 tests/integration/test-inflight-registry.py; b=$?
      test "$a$b" = "11"
    intent: |
      Write tests FIRST, before any production code. Both files must exit 1 when you are
      done, because neither function under test exists yet. A guard test that cannot go red
      proves nothing.

      In tests/integration/test-inflight-registry.py add a case function for a new READ-ONLY
      enumerator inflight_registry.live_claims(root, agent, now=None) returning a list of
      every live claim dict for that agent in that one registry, oldest first. It must be
      read-only: unlike live_claim it must NOT rewrite the registry file, because it runs on
      the PreToolUse path on every governed write. Assert, each as its own case:
        1. two live claims for one agent in one registry are BOTH returned, with their own
           feature fields intact (live_claim returns only the oldest, which is why this
           function is needed);
        2. a NON-OMP claim (runtime absent or "claude") past the BINDING horizon is not returned. The binding horizon is
           OMP_UNVERIFIED_TTL_SECONDS, not CLAIM_TTL_SECONDS: back-date started_at further than
           OMP_UNVERIFIED_TTL_SECONDS before the injected now and assert the claim is absent.
           Do not write this case against CLAIM_TTL_SECONDS — under D-09 a claim in that window
           is still binding, and case 5 below asserts exactly that;
        3. calling live_claims does not change the bytes of the registry file on disk;
        4. a missing registry file returns an empty list and raises nothing.
      Then add the four D-09 binding-horizon cases, each its own case. Every one of them injects
      time through the now= argument and back-dates the fixture's started_at; started_at is
      stored data, so no clock is mocked and each case fails deterministically against an
      implementation that filters with _expire or CLAIM_TTL_SECONDS:
        5. an OMP claim (runtime "omp") whose recorded supervisor identity is PROVEN live and
           whose started_at is back-dated far past CLAIM_TTL_SECONDS IS returned. Build the
           proven identity the way _omp_claim_live checks it — a pid that is alive with a
           matching recorded supervisor_started_at; use the test process's own pid and the value
           inflight_registry._process_start_time reports for it, so the identity is genuinely
           proven rather than stubbed;
        6. a non-OMP claim (runtime absent or "claude") back-dated MORE than CLAIM_TTL_SECONDS
           but LESS than OMP_UNVERIFIED_TTL_SECONDS before now IS returned by live_claims. This
           is the case that goes red the moment anyone re-wires the enumerator to _expire, and it
           is the assertion that keeps this bug's founding incident closed on the compatibility
           host;
        7. a non-OMP claim back-dated MORE than OMP_UNVERIFIED_TTL_SECONDS before now is NOT
           returned. This pins the horizon from above and fails a binds-forever implementation.
        8. an OMP claim (runtime "omp") whose recorded supervisor identity is PROVEN live and
           whose started_at is back-dated MORE than OMP_UNVERIFIED_TTL_SECONDS before the injected
           now IS still returned. Build the proven identity exactly the way case 5 does — the test
           process's own pid together with the value inflight_registry._process_start_time reports
           for it — so the identity is genuinely proven rather than stubbed. This is the assertion
           that separates "a proven identity binds at ANY age" (D-09) from "everything binds until
           86400s": a BACKSTOP-ONLY enumerator, one that ignores supervisor proof and simply binds
           every claim until OMP_UNVERIFIED_TTL_SECONDS, passes cases 1 through 7 and goes RED only
           here. Without it D-09's proven-identity half ships unpinned.
      Wire the new function into the file's own aggregate so its failures are counted.

      In tests/unit/test-harness-boundary.py add case_bug1304_claim_set and register it in
      main() with the exact line: run_case(case_bug1304_claim_set)
      It tests a new seam function
      harness_boundary.claim_worktrees(owner_root, agent_type, destination), which returns S as a
      sorted list of absolute worktree paths, built as follows and no other way: enumerate every
      live claim held by agent_type across ALL registries, INCLUDING the owner-root registry
      itself, and resolve EACH claim's own feature field through
      harness_boundary.worktree_for_feature(owner_root, feature). A claim contributes
      a member only when worktree_for_feature returns a real worktree. The third parameter is the
      write's RESOLVED ABSOLUTE DESTINATION and it matters only when a scanned registry cannot be
      read (D-10 clauses 1 and 3, cases 7 and 8 below); with every scanned registry readable the
      returned S does not depend on it, so cases 1 through 6 may pass any resolved path.
      Build fixtures with tempfile plus real .git pointer files, in the shape the existing
      case_worktree_for_feature uses. Assert, each as its own case:
        1. a claim whose feature is FEAT-32-concurrent-write-merge, held in a registry, with
           a linked worktree whose BASENAME is FEAT-32, yields that worktree in S. This is
           the prefix path and it is the case a registry-file-derived construction misses;
        2. a claim recorded in the OWNER-ROOT registry whose feature DOES have a linked
           worktree still yields that worktree in S, proving S is not derived from which
           registry file the claim sits in. This case is also the unit-level discrimination
           that T-03 case 7 and T-05 case 8 point at: at the subprocess level an allow cannot
           distinguish "the owner-root registry was read and contributed nothing" from "the
           owner-root registry was skipped", and this assertion is what separates them;
        3. a claim whose feature has NO linked worktree contributes nothing, so S is empty
           and the caller reads unbound;
        4. an agent holding live claims in two different features with two linked worktrees
           yields BOTH in S;
        5. no live claim anywhere yields an empty S;
        6. a claim whose feature resolves to two prefix-matching worktrees propagates
           harness_boundary.AmbiguousWorktree rather than guessing or silently dropping it.
