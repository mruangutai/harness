      owner_root/.git/worktrees (harness_boundary.py:170-173, anchors re-verified in the worktree) and
      silently skips a pointer file it cannot read (harness_boundary.py:177-183, re-verified), so an
      I/O fault at the enumeration layer is indistinguishable from "no worktrees exist";
      worktree_for_feature then resolves to None, a live claim in that worktree contributes nothing to
