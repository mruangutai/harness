      Follow the file's existing shape: build a temp owner root plus real linked worktrees,
      set both CLAUDE_PROJECT_DIR and HARNESS_PROJECT_DIR via _env, build every claim through
      inflight_registry's own API rather than hand-written JSON, and assert exit codes
