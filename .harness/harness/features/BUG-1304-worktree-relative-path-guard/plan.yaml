      bug1304_assert_pre_change_allows like every other refusal case:
       14. SC-10. UNREADABLE REGISTRY. A governed agent whose ONLY live claim sits in a registry
           file that exists among the scanned roots and holds unparseable JSON writes a governed
           MAIN-CHECKOUT path: exit 2, and stderr names that registry file. Build the fixture by
