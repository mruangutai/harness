      reason: "DEC-174 carve-out: check-domain.sh, bash-write-guard.sh, harness_boundary.py, inflight_registry.py and dispatch-guard.sh are registered gate scripts, so the harness plans them and the main session executes them."
    - surface: tests/unit/**
