      the allow half it needs is BRIEF SC-12, whose evidence T-03 and T-05 generate.
      REJECTED — REMEDY (b), KEEP THE GLOBAL RULE AND CARVE THE EXCEPTION INTO REQ-03: rejected because it
      repairs the contradiction by amending REQ-03's promise to fit an implementation ordering, accepting a
      factory-wide stop of every governed write as the price of a per-write question. Its proposed REQ-03
      carve-out text was never written into BRIEF.md and is not written now.
      Q1 IS RESOLVED WITH THIS PARAGRAPH RATHER THAN CARRIED FORWARD. pm's own question Q1
      (notes/research-BUG-1304-plan-repair-panelc1.md:85-86) disclosed only the narrower REQ-01
      unbound-agent scope, which the panel judged inadequate for exactly this reason; it was superseded by
      the blast-radius paragraph above and is answered by the same ruling that selected remedy (a). Nothing
      about the unreadable-registry rule is left for the operator to pick between.
      A KNOWN ASYMMETRY, RECORDED AND NOT REPAIRED, SO THE OPERATOR SEES IT BEFORE SIGNING (panel
      cycle 2 finding PF-5b09773491bc20f90f69a59b84294788, med, harness-code-reviewer; no task is
      added for it and this feature does not widen to reach it). S has TWO inputs and this decision
      makes only ONE of them fail-closed. The registry input is now fail-CLOSED. The worktree-pointer
