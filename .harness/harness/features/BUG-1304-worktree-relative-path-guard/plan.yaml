  - id: T-09
    title: Retain a dispatch-expired non-OMP claim in the registry file until the binding backstop
    traces: [REQ-01, REQ-05]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out: inflight_registry.py is a shared library both registered gate scripts import, and its suite is an enforcement-layer file (DEC-179)."
    depends_on: [T-02]
    status: ready
    files:
      - .claude/skills/harness/bin/inflight_registry.py
      - tests/integration/test-inflight-registry.py
    verify: |
      grep -q 'def case_bug1304_retention(' tests/integration/test-inflight-registry.py \
        && grep -q 'def case_bug1304_retention_admission(' tests/integration/test-inflight-registry.py \
        && grep -q 'case_bug1304_retention,' tests/integration/test-inflight-registry.py \
        && grep -q 'case_bug1304_retention_admission,' tests/integration/test-inflight-registry.py \
        && python3 tests/integration/test-inflight-registry.py \
        && python3 tests/integration/test-dispatch-guard.py
    intent: |
      STRIKEABLE AT SIGNATURE, AND THE STRIKE IS NOT FREE. Striking this task OVERRIDES
      Advisor rulings A and B (notes/review-fable-advisor-plan-BUG-1304-ttl-residue.md), which
      classified the compatibility-host TTL asymmetry as a DEFECT this feature must close and
      named registry-FILE retention as one half of the closing boundary. It is NOT symmetric
      with T-08's strike: striking T-08 leaves the remedy intact, because T-02 resolves each
      claim's own feature field whatever registry file it sits in. Striking THIS task leaves
      B-10 REACHABLE on a supported host: dispatch-guard.sh:197 calls the mutating live_claim
      on every dispatch and validate-digest.py:1755-1760 calls live_children at every parent
      return, so a compatibility-host claim older than 1200s is DELETED FROM THE FILE on the
      routine suspend path, the guards' enumerator cannot see it however correct its predicate
      is, the agent reads unbound, and its governed main-checkout write is allowed — this bug's
      founding incident, verbatim, not a residue. OC-1 asks only WHERE that closure lands, here
      or as its own issue; answering "separate issue" is a decision to leave the hole OPEN until
      that issue lands, and it is the operator's to make with that cost in view, not a scope
      question with a free answer. If struck: no other task depends on it, T-10 does not name it
      in depends_on, SC-11 is struck with it, T-07 obligation 1b's strike sentence applies, and
      the rest of the plan stands.

      Both halves below strike TOGETHER, because assertion (b) is the only thing that catches
      the suspend-path side-channel and it moves with the retention change.

      TEST FIRST, exactly as T-01 precedes T-02. Write (b) before (a) and confirm the suite
      exits 1 before you touch inflight_registry.py.

      (a) THE RETENTION RULE, AND THE SEAM IT LANDS ON.

      THE SEAM IS THE POINT OF THIS TASK. Inside every pruning function the list _expire_where
      returns is used for TWO DIFFERENT PURPOSES: the FILE-CONTENT assignment
      (data["claims"] = live) and the CALLER'S OWN ANSWER computation. Retention changes ONLY
      WHAT IS WRITTEN BACK to the file. It must NEVER change what is RETURNED. Implement the two
      as separately computable values — for example, have _expire_where produce a pair,
      (answer_live, retained), where answer_live is exactly what it returns today and retained is
      answer_live PLUS every claim that is dispatch-expired under CLAIM_TTL_SECONDS, younger than
      OMP_UNVERIFIED_TTL_SECONDS, and not an OMP claim already proven dead — and have each caller
      assign retained to data["claims"] while computing its answer from answer_live exactly as it
      does today. A caller that writes retained into its ANSWER, or answer_live into the FILE, is
      the defect this task exists to prevent. Do not solve it by changing the shared primitive
      alone and letting every caller inherit one new meaning of live: that is the failure mode
      named at claim_with_receipt below.

      _expire_where is defined at inflight_registry.py:227 and has SIX callers. Every one of them
      must RETAIN the record, and every one of them must return byte-for-byte the answer it gives
      today:
        - orphan_write (:297) — retains; its return value and the orphan marking it performs are
          unchanged. It deletes the claim today, so leaving it out reopens the hole by itself
          even if every other site is patched.
        - live_claim (:323-328) — retains; still returns only the claims live at 1200s.
        - live_children (:343-349) — retains; its child list and counts stay at 1200s.
        - claim_with_receipt (:375) — retains; and its SINGLE-FLIGHT ADMISSION,
          any(_matches(c, agent=agent, feature=feature) for c in live), MUST keep reading the
          1200s answer list. If admission reads the retained list instead, a fresh same-agent
          same-feature dispatch is refused for up to 86400s instead of 1200s — the FEAT-37
          stranding D-09 forbids. This is the most dangerous site in the task and the reason the
          record/answer split is stated before the site list.
        - attach_runtime_identity (:432) — retains; the claim it selects and the identity it
          attaches are unchanged.
        - release (:472) — retains every claim its selector does not release; its selection, its
          matches list and its return value are unchanged. Like orphan_write it deletes today,
          so leaving it out reopens the hole by itself.
      Two further sites, already named and unchanged in this repair: the per-claim prune in
      reconcile (:519) and _all_live (:593) — retain in the file, return today's answers.

      A claim past OMP_UNVERIFIED_TTL_SECONDS is pruned from the file as before, at every one of
      these sites. Dispatch liveness does not change anywhere: CLAIM_TTL_SECONDS stays 1200s and
      no dispatch-side answer moves (D-09). What changes is only that the record survives to the
      binding backstop, so the guards' enumerator can still see it.

      (b) THE ASSERTIONS, RULING D case (4). TWO case functions, both wired into the file's CASES
      tuple by bare name, which is that file's convention. Back-date started_at as stored data in
      both, so no clock is mocked and both are deterministic. Assert the FILE BYTES for every
      presence claim, read back from the registry JSON, never a return value: a read-side-only
      implementation returns the same answers and leaves the file pruned, which is the exact
      defect these assertions exist to catch.

        case_bug1304_retention — with an injected now that makes a non-OMP claim dispatch-expired
        but under the backstop, run reconcile, live_children, AND at least one of the two sites
        this task previously omitted, orphan_write or release. For EACH call assert both halves:
        the claim is STILL PRESENT in the registry file on disk afterwards; AND that call's own
        return value is exactly what it is today — excluded from reconcile's and live_children's
        answers, and orphan_write's or release's own return value unchanged. Finish the case with
        the horizon from above: a claim back-dated past OMP_UNVERIFIED_TTL_SECONDS is still gone
        from the file after the same calls.

        case_bug1304_retention_admission — SINGLE-FLIGHT ADMISSION UNCHANGED AT 1200s. With a
        dispatch-expired-but-retained non-OMP claim for (agent, feature) present in the file,
        assert that a fresh claim_with_receipt for the SAME agent and SAME feature is still
        ADMITTED — it takes the claim and is not refused as a duplicate — and that the retained
        record does not appear as a second live claim in that call's own answer. This case goes
        red against a fix that changes the shared primitive alone, which is the FEAT-37 stranding
        regression D-09 forbids; nothing else in this plan exercises the single-flight path, so
        without this case that regression ships silently.

  - id: T-10
    title: Run the full suite and the state checker over the completed change
    traces: [REQ-03, REQ-04]
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out: the two runners it executes live under .claude/skills/harness/bin, and the change it verifies is entirely gate-script work the main session executes directly (DEC-179)."
    depends_on: [T-02, T-04, T-06, T-07]
    status: ready
    files:
      - .claude/skills/harness/bin/run-unit-tests.sh
      - .claude/skills/harness/bin/check-state.sh
    verify: |
      bash .claude/skills/harness/bin/run-unit-tests.sh --kind all \
        && bash .claude/skills/harness/bin/check-state.sh
    intent: |
      THIS TASK EDITS NOTHING. Its files list names the two runners it executes, not files
      it modifies. Its deliverable is the two exit codes and the run output, attached to the
      build digest.

      WHY IT IS A TASK AND NOT A CLOSEOUT HABIT. This change mutates two registered
      PreToolUse gates (check-domain.sh, bash-write-guard.sh) and two shared libraries
      (harness_boundary.py, inflight_registry.py). A gate's blast radius is EVERY governed
      write in the repository, and a shared-library change breaks callers that no guard
      suite imports — the three guard suites T-08 re-runs are the widest verification the
      rest of this plan carries, and they are narrower than the change. Nothing else in the
      plan runs the full suite or the state checker, and both are named in the issue's own
      success definition.

      RUN, IN THIS ORDER, FROM THE REPOSITORY ROOT, AND BOTH MUST EXIT 0:
        bash .claude/skills/harness/bin/run-unit-tests.sh --kind all
        bash .claude/skills/harness/bin/check-state.sh
      The runner's own usage line records the accepted argument set
      (run-unit-tests.sh:23); "--kind all" selects tests/unit/test-*.py plus
      tests/integration/test-*.py, which is every suite in the repository, and the runner
      exits 2 on a layout violation before it runs anything. check-state.sh takes no
      arguments and resolves its own root; 0 means every invariant holds, 1 means
      violations printed, 2 means it could not resolve a root. This is deliberately the
      slowest verify in the plan and it is expected to exceed a minute.

      ORDERING. It runs LAST, after every implementation task that survives signature.
      Its depends_on names only the tasks that always land (T-02, T-04, T-06, T-07), so no
      edge dangles if the operator strikes either strikeable task. The two strikeable ones
      are T-08 (dispatch-guard _root_for) and T-09 (registry-file retention): if either
      stands, this task runs after it as well, even though no depends_on edge says so.

      DO NOT bolt this onto another task's verify, and do not narrow it to the suites the
      change happens to touch. A failure here is a real finding: report it, do not
      re-scope it.
