        8. MULTI-CLAIM MEMBERSHIP ALLOW. A persona holding live claims in TWO linked
           worktrees writes INSIDE one of them: exit 0. Without this case a construction
           that refuses whenever it finds two or more candidates passes every other case.
        9. SC-05, Q3(c). Destination checkout whose .git pointer does not parse, with S
           non-empty: exit 2.
       10. SC-05, ambiguity. A live claim whose feature resolves to two prefix-matching
           worktrees: exit 2, and stderr names the candidates.
       11. SC-08. SHORT-FORM WORKTREE. Linked worktree basename BUG-1304 while the feature
           directory and the claim's feature field are BUG-1304-worktree-relative-path-guard.
