       15. SC-10's PAIRED CONTROL, in the same fixture and the same case. Fire the identical
           payload with that one registry file WELL-FORMED and holding no claim for this agent:
           exit 0. This is what proves the refusal in case 14 is caused by unreadability rather
           than by the ordinary claim-set rule or by a blanket refusal of governed writes — with a
           readable claim present the write would be refused anyway, so the exit code alone
           discriminates nothing.

