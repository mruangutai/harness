decisions:
  - id: D-01
    choice: |
      Each of the two records is corrected by REWRITING the false sentence in place, carrying the same
      three clauses in both: that gen-decisions-index.py --check was never a supported mode, that
      before argv validation landed at ffbdbfa1 (2026-08-05) an unrecognized argument fell through to
      the write path so the 2026-08-03 exit 0 was a regeneration of DECISIONS-INDEX.md and could not
      prove index drift, and the read-only form
      gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md.
      Neither record gains an appended dated note or a new section.
    because: |
      DEC-205 ends the amendment convention for DECISIONS.md - an entry states current truth and a
      correction rewrites the entry it corrects - and the integration test
      test_no_amendment_construct_survives_in_the_authority enforces it mechanically. STATE.md is
      barred from a new section by its two-heading vocabulary. One shape for both keeps the two
      records saying the same thing.
    dec: DEC-205
  - id: D-02
    choice: |
      The FEAT-05 STATE.md task is execution_mode team with execution_agent harness-orchestrator, not
      main-session-direct.
    because: |
      check-domain.sh --resolve grants .harness/harness/features/FEAT-05-pyyaml-file-parsers/STATE.md
      to harness-orchestrator alone at 41c16c7; no member persona holds it, and the build-phase
      orchestrator writes it directly rather than dispatching a member. It is a feature state record,
      not an enforcement-layer artifact, so DEC-174 supplies no carve-out and declaring a granted path
      main-session-direct would be both untrue and a check-plan-routes DEVIATION.
    dec: DEC-179
  - id: D-03
    choice: |
      Both tasks are change_type docs.
    because: |
      Every changed file is a record under .harness/ and no runtime code is touched, so
      test_matrix.docs.always of empty list is the honest floor; labelling the change bugfix would put
      it under DEC-217 predicates written for diffs that change code or tests, and require a test kind
      no assertion about corrected prose could earn.
    dec: DEC-217
  - id: D-04
    choice: |
      FEAT-05 STATE.md is changed with Edit, never Write, and its pre-existing shape violation is left
      as found.
    because: |
      The file is 165 lines against the 120-line budget with 7 headings against the 2 allowed, so
      check-domain.sh denies a Write pre-hoc while an Edit is permitted and reported after the fact.
      Shrinking a completed feature's record is out of scope for a correction flow.
    dec: DEC-150

tasks:
  - id: T-01
    title: Correct DEC-174's evidence sentence and regenerate the decisions index
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: []
    status: ready
    files:
      - .harness/harness/docs/DECISIONS.md
      - .harness/harness/docs/DECISIONS-INDEX.md
    verify: |
      R="$(git rev-parse --show-toplevel)"
      E="$(sed -n '/^## DEC-174 /,/^## DEC-175 /p' "$R/.harness/harness/docs/DECISIONS.md")"
      N="$(printf '%s' "$E" | tr -s '[:space:]' ' ' | tr -d '\140*_')"
      printf '%s' "$N" | grep -qF 'Every gate was green' && { echo 'T-01 stale claim survives'; exit 1; }
      for t in 'never a supported mode' 'could not prove index drift' 'ffbdbfa1' '2026-08-03' \
               'gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md'; do
        printf '%s' "$N" | grep -qF "$t" || { echo "T-01 MISSING: $t"; exit 1; }
      done
      python3 "$R/tests/integration/test-gen-decisions-index.py"
    intent: |
      Two edits, one commit, in .harness/harness/docs/DECISIONS.md and
      .harness/harness/docs/DECISIONS-INDEX.md.

      1. DECISIONS.md, DEC-174, the EVIDENCE SENTENCE ONLY. At 41c16c7 it is lines 4308-4309 and
         reads: "The evidence, all from 2026-08-03 and all on this repo. Every gate was green -
         run-unit-tests.sh, check-docs.sh, check-state.sh, gen-decisions-index.py --check - while:"
         (the file spells the command names and the bold lead-in with its own backtick and asterisk
         markup; re-read the region before editing, since line numbers move). Rewrite that sentence
         so it states current truth. It MUST, after the edit:
           - keep the bold lead-in naming the date, and keep the sentence ending with "while:" so the
             three-bullet defect list that follows still reads as its continuation;
           - name only run-unit-tests.sh, check-docs.sh and check-state.sh as the gates that were
             green, because those three were;
           - say of gen-decisions-index.py --check, using these EXACT contiguous phrases, which this
             task's verify greps after collapsing whitespace and stripping backticks, asterisks and
             underscores:
               never a supported mode
               could not prove index drift
               ffbdbfa1
             The load-bearing facts, all measured: --check has never been a supported mode; before
             argv validation landed at commit ffbdbfa1 (2026-08-05, "perf(140): validate argv so
             --help stops rewriting the index") main() read stdout_mode = "--stdout" in sys.argv[1:],
             so an unrecognized --check fell through to the WRITE path; the script therefore
             regenerated DECISIONS-INDEX.md in place and exited 0, and a regeneration overwrites
             exactly the drift a check would have reported;
           - name the read-only form as the contiguous string
             gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md
             so a reader reaching for --check finds what to use instead. Wrap commands and filenames
             in backticks, the entry's own convention; the verify strips them.
         DO NOT add a dated sub-section, an "Amendment" heading or any appended note: DEC-205 says a
         correction rewrites the entry, and tests/integration/test-gen-decisions-index.py rejects a
         line beginning with the bold token Amendment. DO NOT touch the DEC-174 heading, the three
         defect bullets, the "Self-hosting caught none of these" paragraph, the carve-out table or
         any other entry. Change no other decision, and strike nothing.

      2. DECISIONS-INDEX.md: regenerate with
         python3 .agents/skills/harness/bin/gen-decisions-index.py
         and change nothing by hand. The index stores a per-row source line, so lengthening DEC-174
         shifts every later row's anchor even though no row's text changes; the regeneration is
         mandatory. DEC-174's hand-written ruling after the " :: " is preserved verbatim by the
         generator and must not be reworded - the RULING is not what this feature corrects.

      Do not edit any other file. Historical artifacts - receipts, research notes, prior plans,
      reviews and observation logs - are out of scope and must be left byte-identical.

  - id: T-02
    title: Correct the four-gates-green claim in FEAT-05's STATE.md
    traces: [REQ-01, REQ-02, REQ-03, REQ-04]
    change_type: docs
    execution_mode: team
    execution_agent: harness-orchestrator
    depends_on: []
    status: ready
    files:
      - .harness/harness/features/FEAT-05-pyyaml-file-parsers/STATE.md
    verify: |
      R="$(git rev-parse --show-toplevel)"
      S="$R/.harness/harness/features/FEAT-05-pyyaml-file-parsers/STATE.md"
      M="$(tr -s '[:space:]' ' ' < "$S" | tr -d '\140*_')"
      printf '%s' "$M" | grep -qF 'All four gates green' && { echo 'T-02 stale claim survives'; exit 1; }
      for t in 'never a supported mode' 'could not prove index drift' 'ffbdbfa1' '2026-09-06' \
               'gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md'; do
        printf '%s' "$M" | grep -qF "$t" || { echo "T-02 MISSING: $t"; exit 1; }
      done
      test "$(grep -c '^## ' "$S")" = 7 || { echo 'T-02 heading set changed'; exit 1; }
    intent: |
      One edit, in .harness/harness/features/FEAT-05-pyyaml-file-parsers/STATE.md.

      At 41c16c7 lines 14-15 read: "All four gates green: run-unit-tests.sh 0 (11 suites),
      check-docs.sh 0, check-state.sh 0, gen-decisions-index.py --check 0. Every .harness slash-star
      yaml parses." (the file carries backtick and asterisk markup; re-read the two lines before
      editing). Rewrite them IN PLACE so they say:
        - three gates were green, naming run-unit-tests.sh 0 with its 11 suites, check-docs.sh 0 and
          check-state.sh 0, and keep the sentence that every .harness YAML file parses - both claims
          are true and are not what this feature corrects;
        - that the fourth entry, gen-decisions-index.py --check 0, is corrected on 2026-09-06 under
          BUG-148, using these EXACT contiguous phrases, which this task's verify greps after
          collapsing whitespace and stripping backticks, asterisks and underscores:
            never a supported mode
            could not prove index drift
            ffbdbfa1
            2026-09-06
          The facts, all measured: --check has never been a supported mode; before argv validation
          landed at ffbdbfa1 (2026-08-05) an unrecognized argument fell through to the write path, so
          that exit 0 was a regeneration of DECISIONS-INDEX.md, which overwrites exactly the drift a
          check would have reported;
        - the read-only form, as the contiguous string
          gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md.

      USE Edit, NEVER Write. The file is 165 lines against check-domain.sh's 120-line STATE.md budget
      and carries 7 headings against the 2 the vocabulary allows, so a Write carrying whole-file
      content is DENIED pre-hoc while an Edit is not. The PostToolUse shape report that fires on the
      over-budget file afterwards is EXPECTED and non-blocking: leave the pre-existing violation
      exactly as found. Do not shrink the file, do not add or remove a heading - the verify asserts
      the heading count is still 7 - and do not touch any other line, section or file. This is a
      completed feature's record; only the false gate claim changes.
