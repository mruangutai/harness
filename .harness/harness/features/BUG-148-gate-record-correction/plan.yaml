decisions:
  - id: D-01
    choice: |
      Each of the two records is corrected by REWRITING the false sentence in place, carrying the same
      three clauses in both: that gen-decisions-index.py --check was never a supported mode, that
      before argv validation landed at ffbdbfa1 (2026-08-05) an unrecognized argument fell through to
      the write path so the 2026-08-03 exit 0 was a regeneration of DECISIONS-INDEX.md and could not
      prove index drift, and the read-only form
      gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md.
      Neither record gains an appended dated note or a new section.
    because: |
      For DECISIONS.md the in-place rewrite is FORCED: DEC-205 ends the amendment convention - an entry
      states current truth and a correction rewrites the entry it corrects - and the integration test
      test_no_amendment_construct_survives_in_the_authority enforces it mechanically. For FEAT-05's
      STATE.md it is NOT forced by any test: it is the operator's ruling of 2026-09-06, at signature
      review, that the false claim is rewritten in place to match DEC-174's treatment, with no appended
      dated note. That ruling is SUPPORTED, not compelled, by two things in check-domain.sh:1796-1806 -
      its own characterisation of STATE.md as a current-truth record, carried as the rationale on the
      120-line-budget denial ("It holds no history: the Current section is replaced, never appended"),
      and its section-vocabulary bar, which denies any heading outside Current and Open Questions, so a
      new dated SECTION is barred even though an inline dated note inside Current is not. No test
      constrains STATE.md at all: test_no_amendment_construct_survives_in_the_authority opens
      gdi.DECISIONS_PATH and nothing else (tests/integration/test-gen-decisions-index.py:836-874). One
      shape for both keeps the two records saying the same thing.
    dec: DEC-205
  - id: D-02
    choice: |
      The FEAT-05 STATE.md task is execution_mode team with execution_agent harness-orchestrator, not
      main-session-direct.
    because: |
      check-domain.sh --resolve grants .harness/harness/features/FEAT-05-pyyaml-file-parsers/STATE.md
      to harness-orchestrator alone at 41c16c7; no member persona holds it, and the build-phase
