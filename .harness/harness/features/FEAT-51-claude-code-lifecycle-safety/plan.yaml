      qgate(command, agent_type, session_id, root); do not define a second fixture pair, do
      not touch ROOT at :54 or gate() at :57, and add the group at the foot of the file AFTER
      the T-07 group and BEFORE the summary line, which is the literal print(f"\n{fails}
      failing." measured at :446 with the SystemExit at :447, so anchor on the literal and not
