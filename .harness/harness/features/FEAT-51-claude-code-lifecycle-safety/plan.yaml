      USE THESE EXACT LABEL STRINGS. The task verify greps six of them, so a typo in any of
      those six is a red verify on correct work:

        a raising inflight_registry call fails OPEN at the check-domain.sh quarantine branch
        an unimportable inflight_registry fails OPEN at the check-domain.sh quarantine branch
        NEGATIVE CONTROL: with the registry healthy an orphan canonical write is still refused at the check-domain.sh quarantine branch
        a raising inflight_registry call fails OPEN at the plan-sign-gate.py quarantine rule
        an unimportable inflight_registry fails OPEN at the plan-sign-gate.py quarantine rule
        NEGATIVE CONTROL: with the registry healthy an orphan plan-merge apply is still refused at the plan-sign-gate.py quarantine rule
        the raising call fail-open at check-domain.sh NAMES the unenforced boundary on stderr
        the unimportable module fail-open at check-domain.sh NAMES the unenforced boundary on stderr
        the raising call fail-open at plan-sign-gate.py NAMES the unenforced boundary on stderr
        the unimportable module fail-open at plan-sign-gate.py NAMES the unenforced boundary on stderr

      PROVE THE GROUP DISCRIMINATES and record the failing output. Write the ten assertions
      FIRST and record them failing against the tree as T-07 leaves it, before touching either
      source file. If the handler already encloses the calls, the four fail-open assertions
      pass on first run and the discrimination proof is the WIDENED-HANDLER mutant instead:
      replace the handler except clause body with a bare pass that returns the allow, and both
      NEGATIVE CONTROL cases must go RED while the four fail-open cases stay green. Record
      both numbers. Do not leave any copy, stub or mutant on disk.

      RECORDED BASELINE, observed 2026-09-01 from the MAIN checkout at 2e2e45d2 with all eight
      files byte-identical to ad93d43e. This task verify block run VERBATIM exits 1 with NO
      output, because the first grep fails. The literal inflight_registry occurs 0 times in
      test-check-domain.py, in test-plan-sign-gate.py and in plan-sign-gate.py today, so each
      of the six greps fails individually. The two tail conjuncts alone are green today:
      python3 .agents/skills/harness/bin/test-check-domain.py exits 0 printing 251 ok lines
      and 0 FAIL lines, and python3 .agents/skills/harness/bin/test-plan-sign-gate.py exits 0
      printing 45 ok lines and 0 FAIL lines. The six greps are therefore the whole
      discriminator, and no earlier conjunct masks them because the greps run FIRST.
