      python3 .agents/skills/harness/bin/test-check-domain.py &&
      python3 .agents/skills/harness/bin/test-plan-sign-gate.py
    intent: |
      THE ANCHORS AND THE SHA. Every line number, literal and behaviour below was measured
      from the MAIN checkout at ad93d43e1f232ec1ab87e08ccf70a01a08c206b7, the sha this plan
      lanes block resolves at. Re-measured 2026-09-01 at the main checkout HEAD 2e2e45d2:
      git hash-object over check-domain.sh, test-check-domain.py, plan-sign-gate.sh,
      plan-sign-gate.py, test-plan-sign-gate.py, inflight_registry.py, harness_boundary.py
      and harness_merge.py is IDENTICAL at ad93d43e, at 2e2e45d2 and in the working tree, so
      every anchor below holds at all three. Re-read each anchor before editing and treat the
      quoted literals as the anchors, never the numbers.

      WHY THIS TASK EXISTS. Panel finding PF-ba976e85d89cca1d56310530d12a05ef, severity high,
      reader scope: the catch-all any-exception fail-open around every inflight_registry call
      in check-domain.sh and plan-sign-gate.py has zero test coverage across the whole plan.
      T-03 at its quarantine branch and T-07 at quarantines() both specify the identical
      wrapped-call shape, and none of T-02 cases 29 to 33, nor the
      fifteen labels across T-03 and T-07, ever forces that handler to fire. Both
      failure modes therefore ship unobserved in the SOLE enforcement mechanism for REQ-03 and
      REQ-04: a handler widened until it swallows a real refusal, and a crash where a
      fall-through was promised. This task adds the coverage and nothing else. It does NOT
      change the fail-open POSTURE, which is D-13 and is deliberate.

      SCOPE, AND THE ONE PERMITTED SOURCE EDIT. The deliverable is test cases, in the two
      existing test files, which are both in run-unit-tests.sh INTEGRATION_SCRIPTS (D-09).
      check-domain.sh and plan-sign-gate.py are in files for ONE bounded reason: the handler
      must ENCLOSE the registry CALLS and not the import alone, or case A below is
      unreachable. T-03 and T-07 describe the try around the import with the calls written
      after it, and that reading is ambiguous in their prose. If the landed code encloses only
      the import, widen the SAME existing try so it also encloses the canonical_artifact and
      orphan_write calls, changing nothing else: no new handler, no second try, no message
      change, no posture change. If it already encloses them, the source files are untouched.
      Nothing else in either source file is in scope for this task.

      FOUR CASES, TWO PER SURFACE, PLUS A NEGATIVE CONTROL PER SURFACE. The two failure shapes
      are NOT one shape twice, and only one of them is an exception raised by a call:

        CASE A, THE CALL RAISES FROM INSIDE THE TRY. Mechanism, MEASURED, and it uses the REAL
        module rather than a stub so the real call site is the thing exercised: make the
        registry PATH a DIRECTORY. REGISTRY_REL at inflight_registry.py:33 is
        .harness/.inflight-claims.json and _registry_path at :39 joins it under the root, and
        every predicate reads it through _update_registry at :82 to :97, which calls
        harness_merge.locked_update. Measured 2026-09-01 against the current tree: with
        .harness/.inflight-claims.json created as a DIRECTORY, live_claim(root, "harness-pm")
        raises IsADirectoryError errno 21, and that propagates out of the predicate. Every
        predicate that reads the registry shares that one code path, so orphan_write raises
        the same way. Two candidate mechanisms were measured and REJECTED, and the task must
        not use them: a MALFORMED registry file does not raise, it prints
        "is corrupt or unparseable, treating as empty" from _parse at :47 to :55 and returns
        cleanly, which is T-02 specified behaviour; and .harness chmod 0o500 does not raise
        either, live_claim returned (None, 0). The raise lands on the orphan_write call and
        NOT on canonical_artifact, which T-02 specifies as pure string work with no filesystem
        access. UNDO: the directory lives in the case OWN throwaway root, which is created per
        case and removed with shutil.rmtree in a finally, so no later case inherits it.

        CASE B, THE MODULE IS UNIMPORTABLE. This is the other half the finding names and it
        does not travel the same code path: the import statement itself raises ImportError, so
        no call is ever made. Mechanism, MEASURED: shutil.copytree(bin_dir, copybin) into a
        throwaway directory, then os.remove of copybin/inflight_registry.py, then fire the
        COPIED hook DIRECTLY. This is the idiom test-check-domain.py already uses at :2370 to
        :2377, where a copytree of the bin dir with feature_schema.py overwritten is fired as
        mhook and its verdict compared with the real hook. It reaches the import because
        check-domain.sh puts its OWN directory on PYTHONPATH at :102 and inserts it at
        sys.path[0] at :125, so the module set in the copy directory IS the module set the
        hook imports, and the #556 case at :1676 to :1703 is the standing proof that nothing
        outside that directory can supply it. For plan-sign-gate.sh the same copy works
        because _selfbin at :53 is the copy directory, resolve_root at harness_boundary.py:64
        to :68 honours HARNESS_PROJECT_DIR whenever the override carries MARKER, which is
        .harness/team-config.yaml at :41 and which both _root() at test-plan-sign-gate.py:36
        and T-07 _qroot write, and :60 execs plan-sign-gate.py from the copy directory so its
        sibling imports resolve there too.

        DO NOT re-point the WHOLE suite at a copy for these cases. Measured 2026-09-01: with
        CHECK_DOMAIN_BIN set to a copytree copy the suite went from 251 ok and 0 FAIL to 250
        ok and 1 FAIL, reddening "schema/a CRASHING schema module DENIES the write rather than
        letting it through", which builds its own mutant relative to the real HOOK. Per-case
        direct fire has no such effect: measured, a copytree copy with inflight_registry.py
        removed, and again with a raising stub in its place, returns the SAME verdict as the
        real hook on a governed in-domain write, exit 0 and empty stderr. For the plan-sign
        surface the whole-suite route IS safe and was measured green, 45 ok and 0 FAIL through
        PLAN_SIGN_GATE_BIN at a copytree copy both with and without inflight_registry.py, so
        either route may be used there; prefer the per-case copy for symmetry.

        THE NEGATIVE CONTROL, one per surface, and it is what catches a WIDENED handler. With
        the registry HEALTHY and a live orphan claim for the feature held by another persona
        in another session with runtime not omp, which is T-02 case 29 fixture, the refusal
        must STILL fire at exit 2. Without it every other case in this group is satisfied by a
        handler broadened to swallow every exception, which is precisely the confusion the
        finding names. These two controls deliberately restate an assertion T-03 and T-07
        already make, INSIDE this group, so the group cannot be read as coverage of a handler
        that no longer refuses anything.

      TWO ASSERTIONS PER FAIL-OPEN CASE, BOTH MANDATORY, each its own check() or wt() call
      with its own detail string, because a combined condition is satisfied by the half that
      holds:

        1. The write or the command is PERMITTED, asserted as the EXACT exit code 0. Never
           "not 2". A test that accepts anything other than 2 also accepts exit 1, which is
           the unhandled-traceback outcome this task exists to distinguish from a deliberate
           fall-through.
        2. The stderr carries the diagnostic line saying the quarantine boundary was not
           enforced, the line T-03 and T-07 specify the handler to print. Exit code alone
           cannot tell a deliberate fall-through from a handler that silently swallowed
           everything, which is the finding own words.

