decisions:
  - id: D-01
    choice: The digest hook gains a third answer for a lead or orchestrator return, a nonterminal suspension spelled VERDICT SUSPENDED with an awaiting list naming every live child, while a terminal verdict with live children stays refused at exit 2
    because: the false-reporting harm is the terminal verdict, not the turn-end, so only the turn-end is legalised
    dec: DEC-210
  - id: D-02
    choice: A suspension does not release the suspending parent claim; only a terminal return does
    because: the orphan predicate reads claim liveness, so releasing on suspension would make every suspended parent child look orphaned
    dec: DEC-210
  - id: D-03
    choice: Orphanhood is self-referential - a writer is an orphan when the registry holds at least one live claim for the target feature and none for that writer persona in that writer session
    because: a parent claim is not a reliable signal since a main-session dispatch records no claim for the orchestrator, and this predicate needs only schema-2 data already recorded
    dec: DEC-210
  - id: D-04
    choice: The quarantine boundary applies only to claims whose runtime is not omp
    because: OMP liveness is process-owned, so the OMP path must be unable to reach this branch at all
    dec: DEC-204
  - id: D-05
    choice: Canonical feature artifacts are exactly plan.yaml, BRIEF.md, feature.json and STATE.md directly under a feature directory; notes, observations and runs stay writable
    because: those three are per-agent or merge-safe, and quarantining them would destroy the completed analysis the operator wants recoverable
    dec: DEC-210
  - id: D-06
    choice: The quarantine sandbox is granted by one glob added to team-config.yaml shared, .harness/*/features/*/quarantine/**, not by twelve per-persona domain grants
    because: shared already means owned by nobody and writable by any specialist, and quarantined content is inert until adoption
    dec: DEC-85
  - id: D-07
    choice: Adoption of a quarantined plan.yaml goes through plan-merge.py locked union, never a whole-file replace
    because: adopting a one-task orphan file must not be able to delete a fourteen-task canonical plan, which is the measured loss in issue 551
    dec: DEC-199
  - id: D-08
    choice: Every code task except the adoption CLI is main-session-direct; quarantine.py is imported by no gate and is routed to harness-dev-ops, which also holds the test registration surfaces
    because: DEC-174 forbids executing a change to the enforcement layer through the harness, and splitting registration off would strand a new test file the drift detector already refuses
    dec: DEC-174
  - id: D-09
    choice: New assertions for enforcement-layer scripts land in their existing INTEGRATION_SCRIPTS test files, so every criterion citing them declares evidence integration
    because: the kind is a property of the script array, so an assertion in an integration-array file cannot be cited as unit evidence; the matrix unit requirement is met by the unchanged unit array running green
    dec: none
  - id: D-10
    choice: The playbook task is change_type docs, not ai_behavior
    because: DEC-70 scopes the eval kind to prompt, model and tool-integration changes and grades a preloaded markdown playbook by conduct, which SC-10 carries
    dec: DEC-70
  - id: D-11
    choice: The quarantine branch sits AFTER the FEAT-41 plan.yaml route denial in check-domain.sh and defers to it, so at the Write gate the boundary governs BRIEF.md, feature.json and STATE.md while an editor write of plan.yaml keeps the route-denial message it already has
    because: FEAT-41 made an editor write of plan.yaml a route that does not exist for every author, so a quarantine denial placed ahead of it would replace a correct refusal with advice about a route nobody may use, and would be non-discriminating there
    dec: DEC-210

  - id: D-12
    choice: The Bash half of the quarantine boundary is a SECOND RULE inside the already registered plan-sign-gate.sh and plan-sign-gate.py, not a new PreToolUse Bash hook and not a check inside plan-merge.py itself
    because: it is the only candidate needing no .claude/settings.json entry and no new test-file registration, it inherits a tokenizer already hardened through five measured evasion classes, and a check inside plan-merge.py would sit inside the very tool that quarantine.py adopt delegates to under D-07, so adoption would have to be exempted from its own gate and the exemption would be the hole
    dec: DEC-174
  - id: D-13
    choice: The Bash rule bites on the four mutating plan-merge.py verbs AND on quarantine.py adopt, and it falls OPEN when the value of --file cannot be resolved to a canonical-artifact path
    because: adopt is the only other command that turns a quarantined file canonical, so REQ-05 is unreachable on this route without it, and failing open on an unresolvable value matches orphan_write's own fail-open on a missing registry and preserves the asserted control that an apply written with a shell variable as its --file value stays allowed
    dec: none
  - id: D-14
    choice: The quarantine rule reads the root plan-sign-gate.sh already resolves from its own directory through harness_boundary.resolve_root, the same root check-domain.sh resolves at its _root, and never a root derived from the command line
    because: the two routes must read ONE claims registry or an orphan quarantined at the Write gate could be allowed at the Bash gate for no reason a reader could see, and a root taken from the caller's own argument is a root the caller can choose
    dec: DEC-204

  - id: D-15
    choice: The DEC-210 entry T-06 writes carries BOTH halves of the quarantine boundary, and this decision SUPERSEDES two bullets of T-06's immutable intent, the bullet saying the boundary is refused at the check-domain.sh Write gate on the canonical artifacts and the bullet beginning The four canonical artifacts are plan.yaml BRIEF.md feature.json and STATE.md; the entry must instead state (a) the check-domain.sh Write and Edit half, which bites on BRIEF.md, feature.json and STATE.md, (b) the plan-sign-gate.sh PreToolUse Bash half, which bites on the four mutating plan-merge.py verbs apply, add-tasks, set-task-station and set-feature-station and on quarantine.py adopt, and (c) explicitly that plan.yaml's only write route is plan-merge.py invoked through Bash, so plan.yaml is covered by the plan-sign-gate.sh half and NOT by FEAT-41's editor route denial, which is a second and independent refusal on a route nobody may use
    because: a documentor following T-06's bullet list verbatim writes an entry that omits the Bash half entirely and leaves a reader believing plan.yaml is covered because the FEAT-41 denial handles it, which is the exact false belief T-07 exists to overturn, and DEC-210 is the entry future readers rely on to know what the boundary covers, so an incomplete entry understates the contract that shipped
    dec: DEC-210
  - id: D-18
    choice: quarantine.py discard is deliberately NOT covered by the Bash quarantine rule, the DEC-210 entry must NOT claim that an orphan cannot destroy a quarantined result, and enforcement against a plain removal of a quarantine directory is out of scope for this feature and is filed as backlog
    because: a rule guarding discard while bash-write-guard.sh permits rm -rf of the same directory under D-06's shared glob would record a protection that does not exist, and generic deletion enforcement for quarantine directories is a different feature
    dec: DEC-210
  - id: D-19
    choice: The quarantine boundary bounds exactly the two GOVERNED write routes the harness can reach, the Write and Edit editor route through check-domain.sh and the plan-merge.py mutating verbs plus quarantine.py adopt through plan-sign-gate.sh, and it does NOT bound a generic Bash write such as cp, cat, tee, mv, sed -i or python3 -c to a canonical artifact that lies inside the writer's own domain; no artifact this feature ships may assert the boundary without that qualification
    because: bash-write-guard.sh passes an in-domain write and exempts harness-dev-ops outright, check-domain.sh is registered on PreToolUse for Write and Edit only, and closing the generic write route needs a generic write-route gate, which is a different feature and is filed as backlog
    dec: DEC-210

tasks:
  - id: T-01
    title: Give validate-digest.py a nonterminal suspension answer for a parent with live children
    traces: [REQ-02, REQ-06]
    change_type: api
    execution_mode: main-session-direct
    execution_reason: DEC-174 names validate-digest.py and its test file as enforcement layer
    depends_on: []
    status: building
    files:
      - .claude/skills/harness/bin/validate-digest.py
      - .claude/skills/harness/bin/test-validate-digest.py
    verify: |
      grep -q 'a SUSPENDED return with a live child is accepted' .agents/skills/harness/bin/test-validate-digest.py &&
      grep -q 'a SUSPENDED return leaves the parent claim live' .agents/skills/harness/bin/test-validate-digest.py &&
      python3 .agents/skills/harness/bin/test-validate-digest.py
    intent: |
      Every line number below was RE-MEASURED at
      0bc57c887b06a5f651363153b5895437c6748e6d, because validate-digest.py grew by about
      112 net lines after the earlier measurement and essentially every anchor inside
      hook_mode() moved by that shift. Re-read before you edit; treat the quoted literals
      as the anchors and the numbers as hints.

      Write the six new cases in test-validate-digest.py FIRST, run them against the
      unchanged validate-digest.py, and record that each fails, before editing
      validate-digest.py.

      DO NOT use the case() helper at :239 - it is the CLI schema harness, it drives
      validate-digest.py with a persona argument and no payload, and it cannot carry a
      registry. Use the T-09 group's fixture builders, which are exactly this shape
      already: _t09_root() at :1241 makes a throwaway checkout carrying
      .harness/team-config.yaml, _reg_module() at :1231 loads inflight_registry from the
      binary under test so claims are written with claim_with_receipt, _t09_fire(root,
      agent, text, hook=None, extra...) at :1249 fires validate-digest.py --hook with a
      JSON payload on stdin and both root env names set, and t09(name, ok, detail) at
      :1227 records. Add a new group function beside run_t09 with its own results list and
      register it in main() at :3571 next to the other fails += run_...() lines, beside
      fails += run_t09() at :3578. Use these
      exact label strings so the verify grep resolves: a SUSPENDED return with a live child
      is accepted, a terminal PASS with a live child is refused, a SUSPENDED return with no
      live child is refused, a SUSPENDED return omitting a live child is refused, a
      SUSPENDED return from a member persona is refused, a SUSPENDED return leaves the
      parent claim live. Assert EXACT exit codes, 0 or 2, as that group does. Read the
      claim back off disk for the last case with the claims() reader defined inside
      run_t09 at :1286, not from the exit code. VALIDATE_DIGEST_BIN at :18 already exists
      for pointing the suite at a control copy: place the pre-change copy of
      validate-digest.py INSIDE .claude/skills/harness/bin, because a copy in /tmp cannot
      import its siblings, and delete it once the six exit codes are recorded.

      Then change hook_mode() in validate-digest.py, which begins at :1565. Today the
      block under the comment STEP TWO - THE D-09 RETURN CONTRACT at :1661 - note the
      comment uses an em dash, so grep for D-09 RETURN CONTRACT - answers any lead or
      orchestrator return with a non-empty _reg.live_children() result at :1675 by printing
      _reg.children_refusal_lines at :1687, then one release_cmd line per child from the
      _reg.release_cmd call at :1698, then returning 2 at :1706. Replace that single answer
      with three, evaluated on the last_assistant_message text after the same last-VERDICT
      tail slice validate() uses. Note the text is read at :1714, AFTER this block, so the
      suspension branch must read d.get("last_assistant_message") itself rather than move
      that read.

      1. The text carries VERDICT SUSPENDED. Legal only when norm(agent) is lead or
         orchestrator AND live_children is non-empty AND the DIGEST block carries an
         awaiting value that is a YAML list naming every persona in live_children. Set
         equality on the persona strings, not a subset; live_children returns a list of
         (persona, claim) pairs, so the personas are the first element of each pair. On
         all three holding, return 0 and print one stderr line naming the personas the
         parent is suspended on. On any of them failing, return 2 with a message that
         states which condition failed and the actual live child personas; do not print
         children_refusal_lines for this branch, because the parent is not being told to
         wait.
      2. The text carries a terminal VERDICT (PASS, FAIL, BLOCKED, ESCALATE) and
         live_children is non-empty. Unchanged: children_refusal_lines plus the per-child
         release_cmd lines, return 2.
      3. No live children. Unchanged: fall through to the existing schema validation, where
         SUSPENDED must be REJECTED as an unknown verdict by the existing VERDICTS check at
         :35.

      SUSPENDED is NOT added to VERDICTS and no persona schema gains a suspension shape.
      The suspension is recognised only inside hook_mode, so a member cannot return it and
      no artifact digest can carry it.

      One further change, in the SAME function and load-bearing: STEP ONE at :1639
      currently calls _reg.release(...) at :1646 on EVERY return. It must not release on
      the accepted-suspension branch. Since step one runs before the text is classified,
      either classify first and skip the release, or move the release below the
      classification - whichever you choose, leave every other path byte-identical in
      behaviour, including the failure swallowing at :1656: the release step still may
      never change the verdict, and the two steps must stay in the order the comment at
      :1610 requires for every non-suspension return. Keep every existing pass-through (no
      agent_type at :1598, a non-harness agent_type at :1604, stop_hook_active at :1606, an
      unreadable payload, an unavailable registry at :1622, no root at :1635) exactly as it
      is.

  - id: T-02
    title: Add the orphan-write predicate and the quarantine path rule to inflight_registry.py
    traces: [REQ-04, REQ-07]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: both write hooks import inflight_registry.py, so DEC-174 holds it back with the gates that read it
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/inflight_registry.py
      - .claude/skills/harness/bin/test-inflight-registry.py
    verify: |
      grep -q 'def case_29_orphan_write' .agents/skills/harness/bin/test-inflight-registry.py &&
      grep -q 'def case_33_orphan_write_omp_runtime_is_never_orphaned' .agents/skills/harness/bin/test-inflight-registry.py &&
      grep -q 'the children refusal names SUSPENDED and never says a repeated return ships' .agents/skills/harness/bin/test-inflight-registry.py &&
      python3 .agents/skills/harness/bin/test-inflight-registry.py
    intent: |
      Re-measured at ad93d43e1f232ec1ab87e08ccf70a01a08c206b7: the highest case number in
      test-inflight-registry.py is case_28_featureless_claim_still_gets_a_remedy, so 29 to
      33 are free, and main() at the foot of that file calls every case by name - register
      the five new ones there or they never run.

      Write cases 29 to 33 first, in the file's existing def case_NN_name style with a
      check(name, ok, detail) assertion per claim, and run them against the unchanged
      module to record that each fails. The five cases are: 29 a live claim for the feature
      held by another persona in another session makes this writer an orphan; 30 the writer
      own live claim in its own session makes it not an orphan; 31 a feature with no live
      claim at all makes it not an orphan, which is the fail-open case for a dispatch whose
      claim was never recorded; 32 a claim whose session key is absent is visible to any
      session and makes it not an orphan; 33 a claim whose runtime is omp with a live
      supervisor pid is never orphaned, whatever the session. Name case 29 exactly
      case_29_orphan_write and case 33 exactly
      case_33_orphan_write_omp_runtime_is_never_orphaned. Build fixtures the way cases 16
      and 21 already do, with claim_with_receipt and a real child process for the
      supervisor pid.

      Then add three public names to inflight_registry.py, beside live_children at :289 and
      using _update_registry at :82, _expire_where at :222, _matches at :235 and _visible
      at :247 rather than new primitives:

      CANONICAL_ARTIFACTS = ("plan.yaml", "BRIEF.md", "feature.json", "STATE.md")

      canonical_artifact(rel) -> (feature, basename) or None. Matches a checkout-relative
      POSIX path against ^\.harness/[^/]+/features/([^/]+)/(plan\.yaml|BRIEF\.md|feature\.json|STATE\.md)$
      and nothing else. A path under notes/, observations/, runs/ or quarantine/ returns
      None, and so does a deeper or shallower path.

      quarantine_rel(rel, agent, session) -> the checkout-relative path a quarantined write
      goes to: the feature directory of rel, then quarantine/, then agent plus the
      character - plus the first eight characters of session (the literal nosession when
      session is None or empty), then the basename of rel. Pure string work, no filesystem
      access, so both the hook and the CLI can call it.

      orphan_write(root, agent, feature, session, now=None) -> bool. True when, reading the
      registry once under the existing lock: at least one live claim exists for feature
      whose runtime is not omp, AND no live claim for feature matches agent and is _visible
      to session. False in every other case, including a missing or unparseable registry
      file, a feature with no live claims, and any case where the only claims for the
      feature carry runtime omp. Expiry stays query-scoped: pass feature into the predicate
      used by _expire_where so looking up one feature never sweeps another feature claim,
