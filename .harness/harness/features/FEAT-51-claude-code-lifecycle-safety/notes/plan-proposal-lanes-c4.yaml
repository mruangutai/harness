      grep -q 'a SUSPENDED return leaves the parent claim live' .agents/skills/harness/bin/test-validate-digest.py &&
      python3 .agents/skills/harness/bin/test-validate-digest.py
    intent: |
      Every line number and quoted literal below was re-measured at
      ad93d43e1f232ec1ab87e08ccf70a01a08c206b7. Re-read before you edit; treat the quoted
      literals as the anchors and the numbers as hints.

      Write the six new cases in test-validate-digest.py FIRST, run them against the
      unchanged validate-digest.py, and record that each fails, before editing
      validate-digest.py.

      DO NOT use the case() helper at :239 - it is the CLI schema harness, it drives
      validate-digest.py with a persona argument and no payload, and it cannot carry a
      registry. Use the T-09 group's fixture builders, which are exactly this shape
      already: _t09_root() at :1241 makes a throwaway checkout carrying
      .harness/team-config.yaml, _reg_module() at :1231 loads inflight_registry from the
      binary under test so claims are written with claim_with_receipt, _t09_fire(root,
      agent, text, hook=None, extra...) at :1249 fires validate-digest.py --hook with a
      JSON payload on stdin and both root env names set, and t09(name, ok, detail) at
      :1227 records. Add a new group function beside run_t09 with its own results list and
      register it in main() at :3036 next to the other fails += run_...() lines. Use these
      exact label strings so the verify grep resolves: a SUSPENDED return with a live child
      is accepted, a terminal PASS with a live child is refused, a SUSPENDED return with no
      live child is refused, a SUSPENDED return omitting a live child is refused, a
      SUSPENDED return from a member persona is refused, a SUSPENDED return leaves the
      parent claim live. Assert EXACT exit codes, 0 or 2, as that group does. Read the
      claim back off disk for the last case with the claims() reader defined inside
      run_t09 at :1286, not from the exit code. VALIDATE_DIGEST_BIN at :18 already exists
      for pointing the suite at a control copy: place the pre-change copy of
      validate-digest.py INSIDE .claude/skills/harness/bin, because a copy in /tmp cannot
      import its siblings, and delete it once the six exit codes are recorded.

      Then change hook_mode() in validate-digest.py, which begins at :1453. Today the
      block under the comment STEP TWO - THE D-09 RETURN CONTRACT at :1549 - note the
      comment uses an em dash, so grep for D-09 RETURN CONTRACT - answers any lead or
      orchestrator return with a non-empty _reg.live_children() result at :1563 by printing
      _reg.children_refusal_lines at :1575, then one release_cmd line per child, then
      returning 2 at :1594. Replace that single answer with three, evaluated on the
      last_assistant_message text after the same last-VERDICT tail slice validate() uses.
      Note the text is read at :1602, AFTER this block, so the suspension branch must read
      d.get("last_assistant_message") itself rather than move that read.

      1. The text carries VERDICT SUSPENDED. Legal only when norm(agent) is lead or
         orchestrator AND live_children is non-empty AND the DIGEST block carries an
         awaiting value that is a YAML list naming every persona in live_children. Set
         equality on the persona strings, not a subset; live_children returns a list of
         (persona, claim) pairs, so the personas are the first element of each pair. On
         all three holding, return 0 and print one stderr line naming the personas the
         parent is suspended on. On any of them failing, return 2 with a message that
         states which condition failed and the actual live child personas; do not print
         children_refusal_lines for this branch, because the parent is not being told to
         wait.
      2. The text carries a terminal VERDICT (PASS, FAIL, BLOCKED, ESCALATE) and
         live_children is non-empty. Unchanged: children_refusal_lines plus the per-child
         release_cmd lines, return 2.
      3. No live children. Unchanged: fall through to the existing schema validation, where
         SUSPENDED must be REJECTED as an unknown verdict by the existing VERDICTS check at
         :35.

      SUSPENDED is NOT added to VERDICTS and no persona schema gains a suspension shape.
      The suspension is recognised only inside hook_mode, so a member cannot return it and
      no artifact digest can carry it.

      One further change, in the SAME function and load-bearing: STEP ONE at :1527
      currently calls _reg.release(...) on EVERY return. It must not release on the
      accepted-suspension branch. Since step one runs before the text is classified, either
      classify first and skip the release, or move the release below the classification -
      whichever you choose, leave every other path byte-identical in behaviour, including
      the failure swallowing at :1544: the release step still may never change the verdict,
