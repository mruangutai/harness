decisions:
  - id: D-01
    choice: The digest hook gains a third answer for a lead or orchestrator return, a nonterminal suspension spelled VERDICT SUSPENDED with an awaiting list naming every live child, while a terminal verdict with live children stays refused at exit 2
    because: the false-reporting harm is the terminal verdict, not the turn-end, so only the turn-end is legalised
    dec: DEC-209
  - id: D-02
    choice: A suspension does not release the suspending parent claim; only a terminal return does
    because: the orphan predicate reads claim liveness, so releasing on suspension would make every suspended parent child look orphaned
    dec: DEC-209
  - id: D-03
    choice: Orphanhood is self-referential - a writer is an orphan when the registry holds at least one live claim for the target feature and none for that writer persona in that writer session
    because: a parent claim is not a reliable signal since a main-session dispatch records no claim for the orchestrator, and this predicate needs only schema-2 data already recorded
    dec: DEC-209
  - id: D-04
    choice: The quarantine boundary applies only to claims whose runtime is not omp
    because: OMP liveness is process-owned, so the OMP path must be unable to reach this branch at all
    dec: DEC-204
  - id: D-05
    choice: Canonical feature artifacts are exactly plan.yaml, BRIEF.md, feature.json and STATE.md directly under a feature directory; notes, observations and runs stay writable
    because: those three are per-agent or merge-safe, and quarantining them would destroy the completed analysis the operator wants recoverable
    dec: DEC-209
  - id: D-06
    choice: The quarantine sandbox is granted by one glob added to team-config.yaml shared, .harness/*/features/*/quarantine/**, not by twelve per-persona domain grants
    because: shared already means owned by nobody and writable by any specialist, and quarantined content is inert until adoption
    dec: DEC-85
  - id: D-07
    choice: Adoption of a quarantined plan.yaml goes through plan-merge.py locked union, never a whole-file replace
    because: adopting a one-task orphan file must not be able to delete a fourteen-task canonical plan, which is the measured loss in issue 551
    dec: DEC-199
  - id: D-08
    choice: Every code task except the adoption CLI is main-session-direct; quarantine.py is imported by no gate and is routed to harness-dev-ops, which also holds the test registration surfaces
    because: DEC-174 forbids executing a change to the enforcement layer through the harness, and splitting registration off would strand a new test file the drift detector already refuses
    dec: DEC-174
  - id: D-09
    choice: New assertions for enforcement-layer scripts land in their existing INTEGRATION_SCRIPTS test files, so every criterion citing them declares evidence integration
    because: the kind is a property of the script array, so an assertion in an integration-array file cannot be cited as unit evidence; the matrix unit requirement is met by the unchanged unit array running green
    dec: none
  - id: D-10
    choice: The playbook task is change_type docs, not ai_behavior
    because: DEC-70 scopes the eval kind to prompt, model and tool-integration changes and grades a preloaded markdown playbook by conduct, which SC-10 carries
    dec: DEC-70
  - id: D-11
    choice: The quarantine branch sits AFTER the FEAT-41 plan.yaml route denial in check-domain.sh and defers to it, so at the Write gate the boundary governs BRIEF.md, feature.json and STATE.md while an editor write of plan.yaml keeps the route-denial message it already has
    because: FEAT-41 made an editor write of plan.yaml a route that does not exist for every author, so a quarantine denial placed ahead of it would replace a correct refusal with advice about a route nobody may use, and would be non-discriminating there
    dec: DEC-209

  - id: D-12
    choice: The Bash half of the quarantine boundary is a SECOND RULE inside the already registered plan-sign-gate.sh and plan-sign-gate.py, not a new PreToolUse Bash hook and not a check inside plan-merge.py itself
    because: it is the only candidate needing no .claude/settings.json entry and no new test-file registration, it inherits a tokenizer already hardened through five measured evasion classes, and a check inside plan-merge.py would sit inside the very tool that quarantine.py adopt delegates to under D-07, so adoption would have to be exempted from its own gate and the exemption would be the hole
    dec: DEC-174
  - id: D-13
    choice: The Bash rule bites on the four mutating plan-merge.py verbs AND on quarantine.py adopt, and it falls OPEN when the value of --file cannot be resolved to a canonical-artifact path
    because: adopt is the only other command that turns a quarantined file canonical, so REQ-05 is unreachable on this route without it, and failing open on an unresolvable value matches orphan_write's own fail-open on a missing registry and preserves the asserted control that an apply written with a shell variable as its --file value stays allowed
    dec: none
  - id: D-14
    choice: The quarantine rule reads the root plan-sign-gate.sh already resolves from its own directory through harness_boundary.resolve_root, the same root check-domain.sh resolves at its _root, and never a root derived from the command line
    because: the two routes must read ONE claims registry or an orphan quarantined at the Write gate could be allowed at the Bash gate for no reason a reader could see, and a root taken from the caller's own argument is a root the caller can choose
    dec: DEC-204

  - id: D-15
    choice: The DEC-209 entry T-06 writes carries BOTH halves of the quarantine boundary, and this decision SUPERSEDES two bullets of T-06's immutable intent, the bullet saying the boundary is refused at the check-domain.sh Write gate on the canonical artifacts and the bullet beginning The four canonical artifacts are plan.yaml BRIEF.md feature.json and STATE.md; the entry must instead state (a) the check-domain.sh Write and Edit half, which bites on BRIEF.md, feature.json and STATE.md, (b) the plan-sign-gate.sh PreToolUse Bash half, which bites on the four mutating plan-merge.py verbs apply, add-tasks, set-task-station and set-feature-station and on quarantine.py adopt and discard per D-16, and (c) explicitly that plan.yaml's only write route is plan-merge.py invoked through Bash, so plan.yaml is covered by the plan-sign-gate.sh half and NOT by FEAT-41's editor route denial, which is a second and independent refusal on a route nobody may use
    because: a documentor following T-06's bullet list verbatim writes an entry that omits the Bash half entirely and leaves a reader believing plan.yaml is covered because the FEAT-41 denial handles it, which is the exact false belief T-07 exists to overturn, and DEC-209 is the entry future readers rely on to know what the boundary covers, so an incomplete entry understates the contract that shipped
    dec: DEC-209
  - id: D-16
    choice: quarantine.py discard IS covered by the Bash quarantine rule, which reverses the deliberately-not-covered comment T-07's immutable intent directs for ADOPT_TOOL, and T-07 is the task that implements it; discard is matched on the value of --dir and not --file, because discard takes --dir, so the rule normalises that value from its last .harness/ segment, matches the result against ^\.harness/[^/]+/features/([^/]+)/quarantine/[^/]+/?$, takes the feature from group 1, refuses when orphan_write is True, and falls OPEN on an unresolvable or absent value exactly as D-13 states for --file; the new case in test-plan-sign-gate.py carries the exact label string "an orphan quarantine.py discard of a quarantine directory is refused", and the refusal text says that discarding a quarantined result is the resumed parent's act and this caller is not it, rather than naming a quarantine path to write instead
    because: this answers Q2 as a choice and not an omission - REQ-05 is untouched since discard makes nothing canonical, but the boundary's whole promise to the operator is a recoverable artifact, and an orphan destroying the only copy of its own result silently undoes REQ-04's remedy with no wake and no operator act, which is the same unsupervised-durable-state harm this feature exists to stop; the cost is one branch in a rule already being written, and a note that discard is uncovered would read to a later reader as an oversight
    dec: DEC-209

  - id: D-17
    choice: T-09 owns the --dir branch of the Bash quarantine rule and T-07 does not, and this decision SUPERSEDES two clauses BY NAME which the add-only merge tool cannot edit in place. FIRST, D-16's clause reading "and T-07 is the task that implements it" no longer governs - the task that implements D-16's discard half is T-09, and a reader arriving at T-07 from D-16 must come here. SECOND, the sentence of T-07's immutable intent reading "discard is deliberately NOT covered - it removes a quarantine directory and can make nothing canonical - and list is read-only. Say so in a comment, because the omission must read as a choice." no longer governs either, so T-07 must NOT ship a comment asserting that discard is deliberately uncovered; T-09 corrects that comment if T-07 wrote it. Every other sentence of T-07's intent stands unchanged, T-07 still ships the adopt half and the three labels its own verify greps, and T-09 adds the --dir branch on top of the quarantines() rule T-07 creates. On the requirement footing, which D-16 leaves ambiguous and this decision settles - the --dir branch stands on REQ-05's SECOND sentence, that adoption and discard are BOTH explicit acts of a resumed parent and neither is a default nor a timeout, read together with REQ-04, whose remedy is that an orphan's canonical write is quarantined rather than lost. D-16's because calls REQ-05 untouched on the ground that discard makes nothing canonical, and that is true of REQ-05's FIRST sentence only; the branch does not rest on that sentence. It rests on the second one, and on issue 280's acceptance boundary that a completed child's analysis stays RECOVERABLE, which an orphan's discard destroys. T-09 therefore traces REQ-04 and REQ-05, and the decision record's DEC-209 entry already names adopt AND discard on the Bash half under D-15
    because: as the plan stood, D-16 named T-07 as its implementer while T-07's immutable intent directed the opposite comment and T-07's verify greps only three adopt-era labels, so T-07 alone would have shipped discard UNCOVERED plus a code comment asserting the omission was deliberate, D-16 would have gone undelivered, T-07's own verify would still have passed, and every gate would have stayed green over a decision the plan made and did not build; D-15 already supersedes two bullets of T-06's immutable intent by name, so this follows the file's own precedent rather than inventing a second mechanism, and an addition is the ONLY route available because plan-merge.py apply is add-only and exits 7 on any proposal that changes D-16's or T-07's existing text
    dec: DEC-209

