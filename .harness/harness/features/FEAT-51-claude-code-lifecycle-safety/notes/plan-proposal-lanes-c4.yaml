  - id: T-02
    title: Add the orphan-write predicate and the quarantine path rule to inflight_registry.py
    traces: [REQ-04, REQ-07]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: both write hooks import inflight_registry.py, so DEC-174 holds it back with the gates that read it
    depends_on: []
    status: ready
    files:
      - .claude/skills/harness/bin/inflight_registry.py
      - .claude/skills/harness/bin/test-inflight-registry.py
    verify: |
      grep -q 'def case_29_orphan_write' .agents/skills/harness/bin/test-inflight-registry.py &&
      grep -q 'def case_33_orphan_write_omp_runtime_is_never_orphaned' .agents/skills/harness/bin/test-inflight-registry.py &&
      python3 .agents/skills/harness/bin/test-inflight-registry.py
    intent: |
      Re-measured at ad93d43e1f232ec1ab87e08ccf70a01a08c206b7: the highest case number in
      test-inflight-registry.py is case_28_featureless_claim_still_gets_a_remedy, so 29 to
      33 are free, and main() at the foot of that file calls every case by name - register
      the five new ones there or they never run.

      Write cases 29 to 33 first, in the file's existing def case_NN_name style with a
      check(name, ok, detail) assertion per claim, and run them against the unchanged
      module to record that each fails. The five cases are: 29 a live claim for the feature
      held by another persona in another session makes this writer an orphan; 30 the writer
      own live claim in its own session makes it not an orphan; 31 a feature with no live
      claim at all makes it not an orphan, which is the fail-open case for a dispatch whose
      claim was never recorded; 32 a claim whose session key is absent is visible to any
      session and makes it not an orphan; 33 a claim whose runtime is omp with a live
      supervisor pid is never orphaned, whatever the session. Name case 29 exactly
      case_29_orphan_write and case 33 exactly
      case_33_orphan_write_omp_runtime_is_never_orphaned. Build fixtures the way cases 16
      and 21 already do, with claim_with_receipt and a real child process for the
      supervisor pid.

      Then add three public names to inflight_registry.py, beside live_children at :289 and
      using _update_registry at :82, _expire_where at :222, _matches at :235 and _visible
      at :247 rather than new primitives:

      CANONICAL_ARTIFACTS = ("plan.yaml", "BRIEF.md", "feature.json", "STATE.md")

      canonical_artifact(rel) -> (feature, basename) or None. Matches a checkout-relative
      POSIX path against ^\.harness/[^/]+/features/([^/]+)/(plan\.yaml|BRIEF\.md|feature\.json|STATE\.md)$
      and nothing else. A path under notes/, observations/, runs/ or quarantine/ returns
      None, and so does a deeper or shallower path.

      quarantine_rel(rel, agent, session) -> the checkout-relative path a quarantined write
      goes to: the feature directory of rel, then quarantine/, then agent plus the
      character - plus the first eight characters of session (the literal nosession when
      session is None or empty), then the basename of rel. Pure string work, no filesystem
      access, so both the hook and the CLI can call it.

      orphan_write(root, agent, feature, session, now=None) -> bool. True when, reading the
      registry once under the existing lock: at least one live claim exists for feature
      whose runtime is not omp, AND no live claim for feature matches agent and is _visible
      to session. False in every other case, including a missing or unparseable registry
      file, a feature with no live claims, and any case where the only claims for the
      feature carry runtime omp. Expiry stays query-scoped: pass feature into the predicate
      used by _expire_where so looking up one feature never sweeps another feature claim,
      exactly as live_children does. Do not change CLAIM_TTL_SECONDS at :24,
      OMP_UNVERIFIED_TTL_SECONDS at :31, SINGLE_FLIGHT_AGENTS at :21, release, release_all,
      reconcile, or any existing signature.

