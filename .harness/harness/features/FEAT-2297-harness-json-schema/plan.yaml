decisions:
- id: D-01
  choice: Publish Draft 2020-12 config-schemas/harness.json as the sole version-3 shape/default contract; all ordinary Python
    config reads validate through load_harness_json and invalid or missing files fail closed.
  because: One portable contract replaces duplicated reader checks and silent policy disablement.
  dec: none
- id: D-02
  choice: Absent optional configuration uses schema-declared template defaults, never live Harness project values; missing
    schema_version defaults 3 and missing decision_dispositions_era_start defaults null; present invalid or legacy shapes
    are refused.
  because: New optional keys must not require fleet-wide edits, while omission must not disguise an invalid present structure.
  dec: none
- id: D-03
  choice: Close structural keys and the ten change types, six conditions, ten registered kind names and four statuses; require
    complete present kind/board/matrix records and conditionally pinned github.repo; retain unchecked underscore prose except
    operational _matrix_provenance.
  because: Typos become mechanical errors without treating prose as config, and conditional requirements are signed rather
    than developer-inferred.
  dec: none
- id: D-04
  choice: Retain load_harness_json path/text/context API and ArtifactAccessError; introduce strict load_json_mapping for non-config
    artifacts and named raw repair/report inputs, never a permissive switch on the config loader.
  because: Three existing non-config callers must remain strict JSON readers without accidentally receiving config defaults
    or schema rejection.
  dec: none
- id: D-05
  choice: Upgrade version 2 to 3 explicitly, infer absent kind status active for nonempty cmd and unresolved for
    null cmd, preserve project values, validate before atomic replacement and support config-only product migration;
    Bash gates recognize their governed actions before loading config and refuse matched actions on invalid or missing
    input before consulting sync.
  because: Existing config-independent governed-command recognition keeps repair/report and unrelated commands reachable
    without a new allowlist or permission to execute governed actions on invalid input.
  dec: none
- id: D-06
  choice: One schema-valid fixture builder serves every fixture including inline and TypeScript test configs; dispose every
    inventory row and require negative net physical lines across all affected test/helper files versus the pinned base.
  because: Central validation earns deletion of duplicated tests, not merely a larger parallel suite.
  dec: none
- id: D-07
  choice: Prepare a validated Kaya payload from the real fleet checkout and remote main, publish a dedicated PR to mruangutai/kaya
    main, and require operator mruangutai review and explicit merge authorization before recording a remote-main landing.
  because: Default-branch authority is the product contract and repository protections or prior approvals cannot be inferred
    from inaccessible APIs.
  dec: none
- id: D-08
  choice: Keep the existing TypeScript resolveBudgetNumber fallback only for advisory budgets; Python advisory readers still
    refuse invalid config, and all implementation tasks stay main-session-direct.
  because: The operator retained DEC-198 advisory host behavior without extending that exemption to Python enforcement.
  dec: DEC-198
