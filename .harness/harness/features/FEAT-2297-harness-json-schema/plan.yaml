  intent: 'Product is Harness in /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2297-harness-json-schema. Before execution read /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2297-harness-json-schema/.harness/harness/features/FEAT-2297-harness-json-schema/notes/research-apply-plan-c1.md section Shared task contract, /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2297-harness-json-schema/.harness/harness/features/FEAT-2297-harness-json-schema/BRIEF.md and plan.yaml D-01 through D-08; those shared execution, authority, fixture and verification rules are mandatory inputs to this task and its future dispatch. Create the schema and harness_config.py behind artifact_accessors.load_harness_json. Keep exactly one path or text source, optional context, and ArtifactAccessError as the one public failure boundary. Share strict duplicate-key/nonfinite/object decoding through a new load_json_mapping(path=None, *, text=None, context=None); caller migrations are owned by T-03. Schema documents themselves use that strict generic read, never the validated config loader. Cache the checked local Draft202012Validator/referencing registry, not config data; prohibit remote ref retrieval and fail closed on absent dependency or invalid schema. Return a fresh mapping per call. Deterministically choose the first error by key path then rule and report source, key path and schema validator keyword/message; version 2 names upgrade-config.py. Missing file refuses, unlike missing optional key. Because the validating loader refuses non-config JSON, migrate digest_schema.SchemaStore._load_one and run_identity.read_marker to strict load_json_mapping in this task, preserving their non-config contracts (operator ruling 2026-11-22; T-03 classifies both sites).

    Apply defaults only where absent, preserving explicit null and never repairing wrong present values. Require current structural records before defaults could hide absent required fields, then validate the resulting document. All structural objects reject unknown keys except unchecked underscore-prefixed prose; operational _matrix_provenance is reserved and validated. Root defaults: schema_version 3; panel_era_start null; seam_era_start null; decision_dispositions_era_start null; _matrix_provenance {}; commit_attribution agent_prefix [harness:<step-id>] and human_prefix [harness:human]; dirty_tree_whitelist entries .harness/** and .claude/worktrees/**; log_retention_days 30; gates.review advisory_unless_high; github sync false, repo null, board null, issue_types {}; budgets max_total_cycles 10, max_total_runs 20, orchestrator_context_warn_tokens 200000, plan_phase_warn_minutes 90, rework_round_minutes 45, preload_warn_words universal 1900 and agent 5500. These objects and their missing scalar leaves default recursively. Explicit null is accepted only for eras, repo, board and kind cmd. Version is const 3 excluding bool. Date eras are real YYYY-MM-DD dates or null; dispositions era is null or a real timezone-qualified ISO-8601 instant checked for calendar/time/offset validity.

    Use schema numeric integer semantics, excluding bool; retention and max_total_cycles/max_total_runs are nonnegative, other budget leaves positive. Stop config numeric-string budget coercion; do not change feature.json budget override parsing. Review enum is blocking/advisory/advisory_unless_high. github.repo is null or owner/name without whitespace; sync true requires explicitly present non-null repo; a non-null board requires repo even with sync false. A present non-null board requires owner and station_field nonempty strings, number integer-valued JSON number or whitespace-padded decimal digit string, and exact ordered stations backlog, plan, ready, building, review, done. Do not add a positive board-number requirement. Do not default an incomplete board. github.issue_types has only optional Bug, Feature, Task, parent keys with nonempty strings; absence means current built-in type mapping.

    Closed change types: logic, api, cross_module, frontend, feature, bugfix, ai_behavior, config, scaffolding, docs. Closed kinds: unit, functional, integration, component, ui, eval, typecheck, omp_session_accessor, handoff_comprehension, issue_types_live. Closed conditions: touches_runtime_code, touches_db_or_external, has_interaction_flow, touches_config_shape, fix_confined_to_tests_and_contract_docs, match_bug_class. Each present test_matrix row requires always array, optional when defaults []; each when entry requires kind and if, no other structural keys. __bug_class__ is allowed only paired with match_bug_class, which requires that sentinel. A present test_matrix map retains its entry population: do not synthesize missing rows. Whole-map absence uses the existing template matrix values: logic unit; api unit+functional with integration/touches_db_or_external; cross_module unit+functional+integration; frontend unit+component with ui/has_interaction_flow; feature unit+functional+integration with ui/has_interaction_flow; bugfix empty always with unit/touches_runtime_code, integration/fix_confined_to_tests_and_contract_docs and __bug_class__/match_bug_class; ai_behavior eval; config empty always with integration/touches_config_shape; scaffolding/docs empty always. Do not evaluate predicates or reconcile evidence.

    Each present test_kinds entry requires detect, exclude, cmd and status; status-less present entries are invalid. detect is nonempty string, exclude string (empty allowed), cmd null or nonempty string; statuses active/excluded/unresolved/locally_run. Excluded requires nonempty excluded_because and signed DEC identifier; locally_run requires nonempty cmd and runner_note. Active/unresolved null cmd remains structurally legal and is still BLOCKED by existing QA semantics. A present test_kinds map retains its population. Whole-map absence uses the seven baseline template kinds, their existing detect/exclude values and null cmd, with status unresolved. Preserve per-project matrix rows, commands, reasons, excludes, detect and statuses. _matrix_provenance defaults {}; each present change-type entry requires removed/added arrays of allowed kinds and signed DEC identifier. No new closure/evaluator policy replaces the existing QA semantic checks.

    Add tests/harness_config_support.py as the only fixture builder/writer, with build_config(overrides=None), write_config(path, overrides=None), and a CLI --overrides-json accepting JSON and emitting the validated JSON config. TypeScript budget fixtures are checked-in outputs of this same builder, not a second builder and not runtime Python subprocesses in Bun. Start from schema_version 3 and merge overrides recursively, replacing lists, then invoke the canonical loader to get schema defaults and validation. Never copy live project commands, github identity or era dates. Expose no unchecked-config builder. Tests create deliberate invalid configs by corrupting the valid result. Before production edits the helper can call the old loader on this minimal base, so new assertions must visibly fail on unknown keys/default absence rather than missing imports. Unit coverage exercises all default leaves, each required/conditional field, enum members and near-misses, underscore prose versus operational provenance, explicit null distinctions, nested duplicate/nonfinite values, old version, missing file, wrong source count and caller mutation isolation.

    Upgrade-config raw source/template input uses load_json_mapping; preserve strict decoding. Migrate 2 to 3, filling absent per-kind status active for nonempty cmd or unresolved for null cmd, preserving recorded statuses/reasons/commands/globs/era values. Validate the candidate through load_harness_json before write_harness_json backup/atomic replacement; failed validation leaves original unchanged. Add --config-only to skip team-config reporting for product-only upgrades, never install a manifest. Keep normal control-plane manifest reporting and --check semantics. Update live and template version to 3; template baseline kinds receive status unresolved and honest null-runner wording. Existing live values and statuses stay unchanged. New integration upgrade tests exercise real CLI --config-only, ordinary control-plane reporting, failed candidate non-write, backup preservation, version-specific diagnostics and idempotent repeat. Migrate existing test-upgrade-config fixtures through the one builder; old-version migration cases explicitly corrupt schema_version/status after constructing valid base. Focused test gates are the phase boundary; broad legacy suites run after later fixture tasks, with no version-2 compatibility shim.'
