decisions:
  - id: D-01
    choice: >-
      The worktree lifecycle ships as one new CLI, .claude/skills/harness/bin/feature-worktree.py,
      with create, list and remove subcommands, rather than as playbook prose or as a mode of the
      factory_ modules.
    because: >-
      every worktree criterion in the BRIEF is verify automated evidence integration, and prose
      cannot be asserted; the factory_ modules are fleet-scoped and harness is deliberately not a
      fleet member (DEC-174 am.1), so a fleet-only entry point could not serve the harness half of
      SC-01.
    dec: none
  - id: D-02
    choice: >-
      REQ-08 replaces WORKTREE_REL_RE with one function in harness_boundary.py that relativizes a
      path against the checkout it stands in, and EVERY consumer of the fixed segment count moves to
      it: harness_boundary.classify, the check-domain.sh resolve path, the check-domain.sh shape
      phase normaliser, and the check-domain.sh sweep globs.
    because: >-
      the mechanism is one-for-one, and a consumer left on the regex keeps the segment count
      load-bearing. The shape normaliser and the sweep globs were measured this run as the two
      literals harness_boundary.py deliberately did not rewire, and both assume exactly one segment
      after WORKTREES_SEGMENT, so under the repo-and-id layout the shape gate silently stops seeing
      worktree state files. That is a regression no success criterion would catch. The cutover is
      therefore ONE task, T-04, and must not be split per file: WORKTREE_REL_RE has consumers in two
      files, so a partial cutover leaves an intermediate state where harness_boundary.py no longer
      defines the attribute while check-domain.sh still reaches for it, and that direction fails
      OPEN. DEC-193 records the same direction - a handled import failure was deliberately made to
      exit 2 because an unhandled ImportError exits 1, which is non-blocking, and would switch
      enforcement off on both routes at once. A missing attribute is the same fail-open shape, so
      atomicity is the safety property, not a tidiness preference.
    dec: DEC-193
  - id: D-03
    choice: >-
      Linked worktrees are enumerated from the owner checkout's own .git/worktrees pointer files
      inside the guards, and by git worktree list --porcelain inside the CLI.
    because: >-
      DEC-193 forbids a git subprocess on the governed-write path, and the pointer registry is
      depth-agnostic, so neither the shape sweep nor the boundary rule regains a fixed segment count.
      The CLI is not on a write path, so it may fork git and should, rather than reimplement git
      bookkeeping.
    dec: DEC-193
  - id: D-04
    choice: >-
      The HEAD-move refusal binds governed agents only, with no exemption for harness-orchestrator,
      and the main session is not covered.
    because: >-
      REQ-04 scopes the refusal to a governed agent, and the main session case is answered by
      isolation instead: once the orchestrator works in its own worktree, a main-session branch
      change cannot move the HEAD the orchestrator commits against, which is the 2026-08-19
      incident. Exempting the orchestrator would reopen the same hole from inside the run.
    dec: DEC-151
  - id: D-05
    choice: >-
      Concurrent Expertise close-outs are made safe by an entry-level union apply behind an exclusive
      lock, and any entry that cannot survive the apply - a section cap overflow, or the same entry
      id carrying divergent text - is an error exit that applies nothing.
    because: >-
      DEC-95 recorded the lost-entry residue and the right answer is usually the union, which no tool
      chooses by itself; a merge that silently truncates at the DEC-145 caps would trade one silent
      loss for another, so the cap case must fail loudly instead of choosing a survivor.
    dec: DEC-95
  - id: D-06
    choice: >-
      Task verifies invoke a new test file directly with python3 until T-08 registers it, and only
      tasks ordered after T-08 call run-unit-tests.sh. No task ordered before T-08 may invoke
      run-unit-tests.sh, and that is an ordering requirement rather than a preference.
    because: >-
      run-unit-tests.sh runs a drift detector over the union of its two arrays, so an unregistered
      new test file makes the runner fail; a verify routed through the runner before registration
      would report a failure that is not the task's. The consequence is a runner-red window: from
      the moment T-01 lands until T-08 lands the full suite is red and no mid-build qa gate can
      pass, because T-08 depends on T-02 and T-06. The task set as written avoids it - no task
      between T-01 and T-08 invokes the runner, and T-09 sits after T-08 - but a build that
      reordered tasks would break it, so the constraint is stated here instead of being left
      implicit in depends_on.
    dec: none
  - id: D-07
    choice: >-
      The worktree CREATION door in bash-write-guard.sh stays fleet-unaware and unchanged. A
      served-repo worktree creation issued over Bash stays refused, and the sanctioned creation path
      is feature-worktree.py, whose single dest_for() makes an illegal destination unrepresentable.
    because: >-
      measured at eeabc59, git worktree add against workspace_root/<repo>/.claude/worktrees/<repo>/
      FEAT-30 exits 2 for harness-backend-dev and for harness-orchestrator, because the legal home is
      computed as realpath(CLAUDE_PROJECT_DIR)/.claude/worktrees at bash-write-guard.sh:464 with no
      fleet awareness. That is not REQ-01's served-repo half being blocked: creation goes through
      feature-worktree.py, which forks git from inside Python, so the Bash parser sees no git token
      and the door never fires. Making the door fleet-aware would widen a governed write path to
      reach outside the checkout and buy nothing, since the CLI cannot build an illegal destination
      in the first place. Recorded as a decision so an architecture review does not read the exit 2
      as an unaddressed gap and re-open it.
    dec: DEC-174
  - id: D-08
    choice: >-
      SC-09's baseline is the SUITE baseline and nothing else: at eeabc59, run-unit-tests.sh
      --kind unit and --kind integration each pass with zero FAIL lines and zero ERROR lines,
      re-observed unchanged at HEAD during the simplify pass with 269 PASS, 0 FAIL, 0 ERROR and
      exit 0. Separately, and explicitly NOT part of SC-09 and owned by no task: an operator-run
      sanity check at ship time that check-state.sh reports no VIOLATION line whose text contains
      FEAT-30. A VIOLATION COUNT is rejected as the assertion form for either.
    because: >-
      SC-09's own text is about the test suites - no test that passed before this feature fails
      after it, and the full unit and integration suites pass - so a check-state.sh clause cannot
      be a half of it, and no task's verify instruments one. Inventing a verify for it would
      assert a whole-repository property against a criterion that does not claim it. The
      count-form reasoning below is kept rather than trimmed with it, because it is the
      load-bearing lesson about asserting anything over a whole-repository scan here. The count
      form was written first and was falsified three minutes later. The same command in
      the same checkout, FACTORY_GH=/nonexistent/gh check-state.sh, reported 2 VIOLATIONs at 07:41
      and 3 at 08:07; the third was the unapproved BRIEF of FEAT-31-orchestrator-context-watch,
      which the main session started and which has nothing to do with this feature. The defect is
      structural rather than stale arithmetic: a violation count over a whole-repository scan is a
      shared mutable global in a repository that runs concurrent flows by design, which is the very
      condition this feature exists to make safe, so a count is the one shape this baseline must not
      take. A FEAT-30-scoped assertion is stable when another flow appears; a count is not. Do not
      restore the count as a tighter assertion. An equally acceptable form of the same rule is the
      set difference against a baseline captured at the start of the task, with the foreign flows
      NAMED rather than counted. The suite half stays a hard zero because it is a property of this
      checkout's code rather than of other flows' approval state. Also measured in the 08:07 run:
      FEAT-30's own plan.yaml with approval.status pending produces NO violation. Producing the
      artifact for signature IS the mission, so a plan-phase feature is not penalised for an
      unsigned plan - that is not a problem for a later reader to fix.
    dec: none
  - id: D-09
    choice: >-
      Every fixture directory that a test case treats as a worktree is built as a REAL linked
      worktree, both sides of the git pointer pair, and the literal .claude/worktrees/*/ strip and
      glob are DELETED rather than retained as a fallback beside checkout_relative and
      linked_worktrees. This binds T-03's new in-worktree half, T-04's SC-02c cases, and the two
      pre-existing bare-directory fixtures in test-check-domain.py run_post, which T-04 converts.
      REQ-08 therefore stays one mechanism replacing one mechanism in all four consumers. The
      accepted cost, stated plainly: a directory under WORKTREES_SEGMENT that is NOT a registered
      linked worktree stops being reached by the shape sweep and stops being normalised by the
      shape phase, so state files written into one are no longer budget-checked.
    because: >-
      depth-agnostic, pointer-free and bounded per-write cost cannot all hold at once - the single
      wildcard segment is exactly what made the old literal cheap and pointer-free, so a fallback
      is not a free extra tier. It is the depth-coupled strip itself, surviving in _norm, which is
      the consumer the settled REQ-08-is-a-simplification ruling is about; and at the repo-and-id
      layout that fallback strips ONE segment and yields a path matching no state-file shape, so
      it is wrong rather than merely redundant. It would also falsify a benefit this plan states
      in writing - that once the normaliser goes through checkout_relative the segment string is
      read from the constant in one place, which strengthens the WORKTREES_SEGMENT mutation proof.
      The decisive evidence is what the fixtures actually are: a bare directory under
      .claude/worktrees is not a worktree, so sixteen T-03 assertions that a worktree write
      resolves to the same grant would be asserting it about something that is not one. Converting
      makes them exercise the mechanism the production code uses, which is a strengthening rather
      than a concession, and it is cheap - test-check-domain.py already builds a linked worktree by
      hand in run_worktree's _linked helper, with no git subprocess. The obstacle was this plan's
      own change-no-existing-case rule, not the operator's: SC-09's text is that no test which
      passed before fails after, and a strengthened fixture that still passes does not violate it.
      Blast radius, re-derived at source and larger than the simplify digest reported: five
      assertions across the two run_post fixtures go red while they stay bare, not two - the two
      sweep cases plus post Edit on the worktree CLAUDE.md, post Edit on the worktree state file,
      and pre Write on the worktree CLAUDE.md, because all three reach the shape regexes only
      through _norm's strip even though _show is unchanged. The residual risk is named where it
      lands: converting changes what the issue #103 legitimacy branch answers for those paths, so
      a conversion is not behaviour-neutral, and each task's verify already requires the whole file
      to pass, which catches it inside the task rather than after it.
    dec: DEC-193

tasks:
  - id: T-01
    title: Create the feature-worktree CLI with its create and list subcommands, and the four-worktree isolation test
    traces: [REQ-01, REQ-02, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-dev-ops
    execution_reason: none
    depends_on: []
    status: building
    files:
      - .claude/skills/harness/bin/feature-worktree.py
      - .claude/skills/harness/bin/test-feature-worktree.py
    verify: |
      set -u
      FEATURE_WORKTREE_BIN=/nonexistent/feature-worktree.py \
        python3 .claude/skills/harness/bin/test-feature-worktree.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with no CLI under test"; exit 1; }
      git show eeabc59:.claude/skills/harness/bin/feature-worktree.py >/dev/null 2>&1 \
        && { echo "RED PROOF INVALID: the CLI already existed at eeabc59"; exit 1; }
      python3 .claude/skills/harness/bin/test-feature-worktree.py || exit 1
      exit 0
    intent: |
      Write two new files. Nothing else in the tree changes.

      FILE 1 - .claude/skills/harness/bin/feature-worktree.py, executable, python3 stdlib only
      plus the existing sibling module factory_config, imported lazily.

      It is a CLI, not a hook. Argument shape:

        feature-worktree.py create --repo <name> --id <id>
        feature-worktree.py list   --repo <name>
        feature-worktree.py path   --repo <name> --id <id>

      The remove subcommand is T-02 and is NOT written here. An unknown subcommand exits 2 with a
      usage line on stderr.

      RESOLVING --repo. Exactly two accepted forms, and the difference is the whole point of the
      vocabulary:

        harness                 the harness repository itself. owner_root is
                                factory_config.harness_root(). The repository path segment is the
                                literal harness. The default branch is main.
        owner-slash-repo        a repository declared in .harness/factory/fleet.yaml repos. Load the
                                declaration with factory_config.load_fleet(), find the entry with
                                factory_config.repo_entry(), take owner_root from
                                factory_config.workspace_path(fleet, name), the repository path
                                segment from the part of the name after the slash, and the default
                                branch from that entry's default_branch field. A name that is not
                                declared exits 2 naming the file it was looked for in.

      owner_root is ONE checkout. workspace_root is the CONTAINER that holds served repository
      checkouts. Never join WORKTREES_SEGMENT to workspace_root: that would put every served
      repository's worktrees in one directory and destroy the per-repository isolation this CLI
      exists to build. Compute owner_root first, then join.

      THE DESTINATION, computed in exactly one function called dest_for(owner_root, segment, id):

        os.path.join(owner_root, ".claude", "worktrees", segment, id)

      Read the segment string .claude/worktrees from harness_boundary.WORKTREES_SEGMENT rather than
      spelling it again; import harness_boundary lazily and, if the import fails, exit 2 with a
      message naming the module. Do not spell the segment a second time anywhere in this file.

      create, in order, and every failure exits non-zero with a one-line reason on stderr:
        1. Refuse when the destination already exists: exit 3, printing the destination.
        2. Refuse when --id does not match the flow-id form FEAT or BUG, a number, an optional
           kebab slug: exit 2.
        3. Create the parent directory of the destination.
        4. Ask git whether a local branch named feat/ plus the id already exists in owner_root,
           using rev-parse --verify --quiet against the refs/heads path.
           If it does NOT exist, create the worktree AND the branch in one git worktree add
           invocation, naming the default branch as the start point explicitly.
           If it DOES exist, create the worktree attached to that existing branch, and print one
           line to stdout beginning REUSED BRANCH so a caller can tell the two apart.
        5. On a non-zero git exit, pass git stderr through and exit 4.
        6. On success the LAST line of stdout is the absolute destination path and nothing else on
           that line, so a caller can read it with tail -n 1.

      list prints one line per linked worktree of owner_root that lives under
      owner_root/WORKTREES_SEGMENT, as three space-separated fields: id, branch, absolute path. The
      id is the last path component. Derive the set from git worktree list --porcelain run against
      owner_root, and filter by commonpath against owner_root/WORKTREES_SEGMENT resolved through
      os.path.realpath - never by string prefix, because a sibling directory named worktrees-old must
      not read as inside worktrees. Exit 0 with no output when there are none.

      path prints dest_for(...) and exits 0 whether or not it exists. It computes, it does not check.

      TWO MODULE-LEVEL CONSTANTS, and they exist so that a test can mutate one by name to prove its
      assertions discriminate. Declare them now even though T-02 is what consumes them:

        REFUSE_ON_DIRTY = True
        REQUIRE_LANDED = True

      Nothing reads an environment variable or a command-line flag to change either. There is no
      force flag in this CLI, and adding one is what SC-07 forbids.

      FILE 2 - .claude/skills/harness/bin/test-feature-worktree.py. House shape: a list of
      (name, ok, detail) tuples, print PASS or FAIL per case, print one summary line
      PASS test-feature-worktree.py or FAIL test-feature-worktree.py, exit 0 only when every case
      passed. Resolve the CLI as

        HERE = os.path.dirname(os.path.abspath(__file__))
        CLI = os.environ.get("FEATURE_WORKTREE_BIN") or os.path.join(HERE, "feature-worktree.py")

      so the verify can point it at a path that does not exist and watch every case fail.

      THE FIXTURE, built in a tempfile.mkdtemp() and torn down at the end:
        - repoA: a git repository standing in for the harness case. Initialise it, point HEAD at
          refs/heads/main before the first commit, make one commit, and give it BOTH of these
          files: .harness/harness/docs/SPEC.md with any readable content, and
          .harness/team-config.yaml so the tree looks like a checkout. The SPEC.md path is the
          load-bearing one and must not be trimmed as a redundant fixture file: harness_root() in
          factory_config honours CLAUDE_PROJECT_DIR only when that exact probe path is readable
          under it, and otherwise warns on stderr and falls back to a root derived from the
          module's own location - which is this repository. Creating the probe is what makes
          CLAUDE_PROJECT_DIR=repoA authoritative, makes FLEET_PATH resolve to the fixture's own
          fleet.yaml, and makes --repo harness resolve owner_root to repoA. Its owner_root is repoA
          itself.
        - a workspace_root directory holding repoB: a second git repository whose default branch is
          master, NOT main, with one commit.
        - a fleet declaration written into repoA at .harness/factory/fleet.yaml, schema
          factory-fleet/1, one repos entry named org/repoB with default_branch master, and
          workspace_root pointing at the workspace directory.
        Invoke the CLI as a SUBPROCESS with CLAUDE_PROJECT_DIR set to repoA in that subprocess's
        environment, so factory_config resolves the fixture rather than this repository. The
        subprocess is load-bearing, not incidental: FLEET_PATH in factory_config is a module-level
        value computed from harness_root() at import time, so setting the variable after an
        in-process import has no effect and the fleet declaration read would be this repository's.
        Never import the CLI in-process for these cases. Do not edit factory_config.

        THE GUARD, asserted FIRST, before anything is created: invoke path --repo harness --id
        FEAT-90 and assert the printed path is inside the mkdtemp() fixture directory, compared with
        os.path.commonpath over os.path.realpath of both sides. If it is not, fail loudly and create
        nothing. A resolution that escapes the fixture would create real worktrees and real branches
        in this checkout, and every other case would still pass, because both sides of their
        comparisons derive from the same wrong owner_root. path computes without creating, which is
        why it is the right probe for this.

      CASES, all mechanical:
        1. SC-01 layout: create four worktrees - repoA FEAT-90, repoA FEAT-91, org/repoB FEAT-92,
           org/repoB FEAT-93. Assert each returned path equals owner_root joined with
           .claude/worktrees, then the segment, then the id, exactly - segment repoA for the first
           two and repoB for the last two.
        2. SC-01 the conflation guard: assert no created path is under workspace_root joined with
           .claude/worktrees, and that the repoB paths are under
           workspace_root/repoB/.claude/worktrees/repoB.
        3. SC-01 isolation, per tree and not in aggregate: write a distinct file named for its own id
           into each of the four trees. Then for EACH of the four trees assert its own file is
           present AND assert, one assertion per other tree, that each of the other three files is
           absent. Twelve absence assertions, not one glob count.
        4. SC-01 branch isolation: for each tree assert its HEAD names its own branch, read with
           rev-parse --abbrev-ref, and assert it differs from all three other branch names.
        5. SC-02 cut point: for each tree assert the merge-base of its branch and its repository's
           default branch equals the default branch tip as recorded BEFORE the create call. Assert
           against the merge-base, never the branch name. repoB carries master here, so this case
           fails if default_branch is ignored and main is assumed.
        6. REQ-07 the clone is not moved: assert workspace_root/repoB still exists, still holds its
           .git directory, and still reports master as its own current branch after all four
           creates.
        7. create refuses an existing destination: a second create for repoA FEAT-90 exits 3 and the
           first tree is untouched.
        8. list: for repoA it prints exactly two lines, one per id, each with the branch and a path
           equal to the created path. Assert the id and branch fields, not just the count.
        9. an undeclared --repo org/nope exits 2 and its stderr names fleet.yaml.

      Do not assert on wording beyond what is named above. Every case that claims to test the CLI
      must go through the CLI rather than creating a worktree itself.

  - id: T-02
    title: Add the remove subcommand with its dirty-tree refusal and its landed-artifact check
    traces: [REQ-03]
    change_type: logic
    execution_mode: team
    execution_agent: harness-dev-ops
    execution_reason: none
    depends_on: [T-01]
    status: building
    files:
      - .claude/skills/harness/bin/feature-worktree.py
      - .claude/skills/harness/bin/test-feature-worktree.py
    verify: |
      set -u
      T=$(mktemp -d) || exit 1
