    intent: |
      Extend the CLI written in T-01 with one subcommand, and extend its test file. No other file
      changes.

        feature-worktree.py remove --repo <name> --id <id>

      Resolve --repo, owner_root, the repository path segment and the default branch exactly as
      create does, through the same functions. Do not add a second resolver.

      remove performs three ordered gates and removes the tree only when all three pass. There is no
      force flag and no environment override; the two module constants REFUSE_ON_DIRTY and
      REQUIRE_LANDED exist solely so a test can mutate a source copy by name.

      GATE 1 - the destination exists and is a linked worktree of owner_root. Otherwise exit 3
      naming the path.

      GATE 2 - DIRTY TREE, guarded by REFUSE_ON_DIRTY. Ask git for the porcelain status of the
      worktree, including all untracked files. If the output is non-empty, print one line per
      reported path in the form

        WOULD DISCARD <path>

      then a final line naming the count and the tree, and exit 4 WITHOUT removing anything. It
      reports exactly what it would discard and refuses; it never asks for confirmation and never
      proceeds.

      GATE 3 - ARTIFACTS LANDED, guarded by REQUIRE_LANDED. The feature artifact directory is
      .harness, then the repository path segment, then features, then the id - relative to the
      worktree. Enumerate every file under it in the worktree with os.walk. For each, compute its
      blob hash with git hash-object in the worktree, and read the hash recorded on the default
      branch in owner_root with rev-parse against the branch-colon-path form. Then print exactly one
      line per file:

        VERIFIED <repo-relative path>
        MISSING <repo-relative path>       when the default branch has no such path
        DIFFERS <repo-relative path>       when both exist and the hashes are not equal

      Print no count in place of the paths - the criterion is that the check names what it verified.
      If any line is MISSING or DIFFERS, exit 5 without removing anything. An artifact directory
      absent from the worktree entirely is exit 5 with one line naming the directory, never a silent
      pass.

      THE REMOVAL. Only when all three gates pass, ask git to remove the worktree from owner_root and
      then prune. Pass git stderr through and exit 4 on a non-zero git exit. On success print
      REMOVED and the destination as the last line.

      TEST CASES to add to .claude/skills/harness/bin/test-feature-worktree.py, reusing the T-01
      fixture builder - the same builder, including its .harness/harness/docs/SPEC.md probe file,
      which is what makes CLAUDE_PROJECT_DIR=repoA resolve owner_root inside the fixture. These
      cases create and remove real trees, so no case may run against a resolved owner_root outside
      the temporary fixture directory: assert the T-01 guard first, and create nothing if it fails.
        1. SC-07 refuse: create a tree, write an untracked file into it, call remove. Assert exit 4,
           assert stdout contains WOULD DISCARD followed by that path, and assert the tree still
           exists on disk with the file still in it.
        2. SC-07 the paired direction: modify a tracked file in an otherwise clean, fully landed tree
           and assert remove still exits 4 and names that path. A dirty tree is dirty whether the
           change is tracked or not, and asserting only the untracked half would pass against a guard
           that only looks at untracked files.
        3. SC-04 refuse: in a clean tree, commit a file at .harness/<segment>/features/<id>/BRIEF.md
           on the feature branch and do NOT merge it. Call remove, assert exit 5, assert stdout
           carries the line MISSING with that exact repo-relative path, and assert the tree still
           exists.
        4. SC-04 allow: merge the feature branch into the default branch in owner_root, call remove
           again, assert exit 0, assert stdout carries VERIFIED with that exact path, assert the
           final line begins REMOVED, and assert the destination directory no longer exists.
        5. SC-04 differs: recreate the tree, change that artifact file's content in the worktree and
           commit it on the feature branch only, and assert remove exits 5 with DIFFERS naming that
           path. This is the case a presence-only check passes and must not.
        6. A tree with no artifact directory at all exits 5 and names the directory.

      Every one of these six asserts BOTH the exit code and the named path. An exit-code-only
      assertion passes against a guard that refuses for the wrong reason.

