schema: plan/1
feature: FEAT-30-worktree-per-feature

approval:
  status: approved
  approved_by: operator
  date: 2026-08-20
  # SIGNED IN PLACE, and the placement of `rulings:` below is why. Q28 records that this budget
  # lives INSIDE approval:, so a process that rewrites the block wholesale carries it away. This
  # signature edits three scalars and nothing else, so that risk did not fire. It is NOT fixed:
  # relocating rulings: to a top-level key is a structural change to an approved artifact, and
  # nothing reads the field programmatically, so it buys protection against a future writer rather
  # than a present one. Accepted knowingly; the next process to rewrite approval: must carry
  # rulings: forward by hand.
  #
  # W1, W3 and Q27 were surfaced before signature and accepted with it: T-10's team lane rests on a
  # judgement no tool can settle, and SC-06 is named by no task though T-09's verify implements its
  # assertion verbatim.
  rulings:
    - id: R-01
      date: 2026-08-20
      subject: REQ-04's HEAD refusal binds all sixteen governed agents, harness-dev-ops included
      ruling: >-
        The HEAD-move matcher is evaluated BEFORE bash-write-guard.sh's harness-dev-ops early
        return, so the refusal reaches that persona too. The early return survives unchanged for
        every WRITE.
      reason: >-
        DEC-151 scopes the exemption to TARGET PATHS. The authority at DECISIONS.md:3650 reads that
        every other harness agent except dev-ops, exempt per DEC-85 as owning builds, gets
        extractable target paths checked against its team-config domain - and moving HEAD is not a
        target path. The exemption exists to keep one recovery path open when the guard itself is
        broken, and that path is untouched: dev-ops still writes anything, including the guard's own
        source. DEC-85, the exemption's own basis, cuts the same way: at :1092 it corrects the
        premise that dev-ops is special on this route, recording that all nine doers hold Bash and
        not just dev-ops. Citation corrected 2026-08-20 - three tiers argued this from
        DECISIONS-INDEX.md:170, a generated summary row, before anyone opened the entry. Substance
        unchanged.
      accepted_cost: >-
        When HEAD is wrong and the guard is working, harness-dev-ops cannot fix it either. The
        repair is the operator's, from the main session, which carries no agent_type and which this
        guard does not bind.
      lands_in: [BRIEF.md REQ-04, T-05]
    - id: R-02
      date: 2026-08-20
      subject: max_total_cycles raised from 10 to 13 for this feature
      ruling: >-
        feature.json's max_total_cycles is 13 for FEAT-30, not the default 10.
      reason: >-
        SC-01b became automated in the same round, and a four-writer concurrency test is the
        likeliest source of fix cycles in this plan. The raise budgets for that failure rather than
        discovering the ceiling mid-build. DEC-157 makes a per-feature raise a user decision
        recorded against the feature, which is why it is recorded here.
      accepted_cost: >-
        Three more cycles of spend before the flow halts for the operator.
      lands_in: [feature.json]
      fix_surfaces_if_sc01b_fails:
        - >-
          T-10's own fixture is the likeliest, and it is NEW concurrency code: a barrier that fails
          open, a pairwise-overlap assertion that never held, or a shared-checkout negative that
          does not detect the collision. Fix surface .claude/skills/harness/bin/
          test-feature-worktree.py, lane team.
        - >-
          T-01's create and its destination derivation, if case A shows two trees sharing a branch,
          a tree cut from another feature's branch, or a commit reaching a default branch. Fix
          surface .claude/skills/harness/bin/feature-worktree.py, lane team.
        - >-
          NOT T-02, NOT T-05 and NOT T-06, against the operator's provisional list, and each for a
          checked reason. T-10 never calls remove, so T-02 cannot fail it. T-05's refusal is a
          PreToolUse Bash hook, verified at .claude/settings.json, so it sees an agent's Bash tool
          calls and not a git fork from inside a python test - T-10's children are forks, so the
          refusal cannot reach them. T-10 asserts nothing about Expertise, which is REQ-06, T-06 and
          SC-08. The consequence that matters to the budget: no fix cycle for SC-01b lands in the
          enforcement layer, so none of them costs the operator's own hands under DEC-174.

