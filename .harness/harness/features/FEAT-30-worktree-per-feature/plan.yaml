      changes, and no new mechanism - everything named here exists after T-01, T-02 and T-05.

      THE RULE, in the fixed vocabulary and no other words. A feature run works in the worktree at
      owner_root, then WORKTREES_SEGMENT, then the repository path segment, then the id. For harness
      that is harness_root then WORKTREES_SEGMENT then harness then the id; for a served repository
      it is that repository's own checkout under workspace_root, same shape. workspace_root is the
      container that holds served repository checkouts and is never the parent of a worktree.

      1. .claude/commands/harness.md - the entry path. Before an orchestrator is spawned for a
         feature, the main session creates the worktree by running
         python3 .claude/skills/harness/bin/feature-worktree.py create with the repository and the
         flow id, and passes the printed absolute path to the orchestrator in its dispatch. State
         that the worktree is cut from the repository's default branch, and that a served
         repository's default branch comes from its fleet.yaml entry.

      2. .claude/agents/harness-orchestrator.md - where it works. It addresses its worktree by
         ABSOLUTE PATH for every file operation, and by git's directory option - git -C and the
         worktree path - for every git command. It never uses cd, which does not persist between
         Bash calls in any case. It never moves HEAD: checking out a branch, switching, a hard reset,
         a rebase and a merge are all refused for a governed agent by bash-write-guard.sh, and the
         refusal names the alternative. State that the refusal exists, so the orchestrator does not
         read a denial as a malfunction.

      3. .claude/skills/harness/SKILL.md - the playbook, which the orchestrator preloads, so the
         rule reaches it at spawn rather than by being told to read a file. Add the lifecycle: the
         worktree is created at flow start by the main session; the orchestrator works inside it; at
         a terminal state its artifacts reach the default branch and THEN
         python3 .claude/skills/harness/bin/feature-worktree.py remove, with the repository and the
         flow id, removes it. THE MAIN SESSION RUNS THAT REMOVAL, FROM OUTSIDE THE TREE, never the
         orchestrator from inside it - symmetric with point 1, which attributes creation to the main
         session for the same reason. This sentence discharges must_fix M-1: git worktree remove
         succeeds at exit 0 from inside the tree it removes, so guidance that omits who runs it and
         from where tells the orchestrator to delete its own cwd, which check-domain.sh:428-431,
         bash-write-guard.sh:135-137 and check-state.sh:1082-1085 each already refuse to say and
         T-05 refuses on the Bash route. The orchestrator's part of a terminal state is to finish
         landing its artifacts and report; removal is not its act. State that remove refuses on a dirty tree, and refuses until every
         artifact under the feature's directory is present with identical content on the default
         branch; that it names the paths it verified; and that there is no force flag - a refusal
         means finish landing the work, never override the check.

      Each of the three must be a rule an agent can follow: a path shape, a command, and what happens
      when it is disobeyed. A passing mention of the word worktree does not satisfy REQ-05. Do not
      restate the mechanism in more than one of the three files; cross-reference instead.

  - id: T-10
