      python3 .claude/skills/harness/bin/test-bash-write-guard.py || exit 1
      python3 .claude/skills/harness/bin/test-check-domain.py || exit 1
      exit 0
    intent: |
      Add one rule to .claude/skills/harness/bin/bash-write-guard.sh and its cases to
      test-bash-write-guard.py. No other file changes.

      THE RULE. When the payload's agent_type matches the governed-agent prefix harness-, a Bash
      command that MOVES HEAD in any checkout is refused with exit 2 and a reason. The main session,
      which carries no agent_type, is unaffected: it is not governed, and the case where it moves a
      branch under a live run is answered by isolation instead, since after T-01 the orchestrator
      commits inside its own worktree. There is NO exemption for harness-orchestrator.

      PLACEMENT IS A REQUIREMENT OF THIS RULE, NOT AN IMPLEMENTATION DETAIL. Operator ruling R-01
      of 2026-08-20, recorded under approval.rulings: this rule is evaluated BEFORE the
      harness-dev-ops early return at lines 56 to 57, so it binds ALL SIXTEEN governed agents.
      Placed after that return it would provably never reach harness-dev-ops, because the return
      precedes the harness- prefix test at line 58 that this rule keys off - and T-01, T-02 and
      T-08 are laned to exactly that persona. THE EARLY RETURN SURVIVES for every WRITE: do not
      delete it, do not narrow it, and do not add a second exemption. Only the ordering changes.
      DEC-151 scopes that exemption to TARGET PATHS - DECISIONS.md:3650, not the index summary row -
      and moving HEAD is not one, so the recovery path it exists to preserve - dev-ops writing when
      the guard itself is broken, including writing this file - is unchanged. The accepted cost is
      recorded in the BRIEF beside REQ-04:
      when HEAD is wrong and the guard is working, harness-dev-ops cannot fix it either, and the
      repair is the operator's from the main session.

      WHAT COUNTS AS MOVING HEAD, matched on the command text with the same conservative shape
      filtering this guard already applies to the git worktree subcommands, including a leading
      directory option and configuration options:
        checking out a branch or a commit, in either the checkout or the switch form
        a hard, keep or merge reset
        a forced branch re-point during checkout
        rebase, merge, cherry-pick and revert
        removing or pruning the worktree the session is standing in
      NOT refused, because they move no HEAD:
        a checkout whose operands are exclusively pathspecs, which restores files
        status, log, diff, fetch, add, commit, and listing stashes
        a read-only command that NAMES a commit without moving to it - show, rev-parse, merge-base,
          cat-file, ls-tree, branch with a list-only form, worktree list. This is load-bearing under
          ruling R-01, not a nicety: T-01's and T-02's verify blocks call git show against the
          pinned sha and are executed by harness-dev-ops, which R-01 now binds. An implementation
          that reads its refuse list as exhaustive-by-default would refuse a task's own
          verification command. The refuse list is the closed set; everything else decidable is
          allowed, and only the UNDECIDABLE case is refused.
        a reset with no mode flag and with a pathspec
        creating a worktree, which is already governed by the existing rule and by
          branch-create-gate.sh

      The refusal message must name three things: the command shape that was refused, that HEAD is
      shared mutable state for the duration of a run, and the alternative - work in the worktree cut
      for this feature, addressing it by the directory option rather than by moving to it. Print it
      with the same deny helper and exit code this guard already uses for a refused worktree
      destination, so the two refusals are indistinguishable in shape to an agent.

      Where the extraction cannot decide - a command this guard cannot parse into subcommand and
      operands, or a shell composition that hides the subcommand - REFUSE, matching the existing
      unparsed-destination branch. This guard is a casual-shape filter by DEC-151, and refusing the
      undecidable case is the direction that entry already chose.

      TEST CASES in test-bash-write-guard.py, every one asserting the exit code AND that stderr
      names the alternative:
        1. SC-03 refuse: agent_type harness-backend-dev, a command that checks out the default
           branch. Exit 2, stderr carries the worktree alternative.
        2. SC-03 refuse, orchestrator: the same command with agent_type harness-orchestrator. Exit 2.
           This is the case D-04 forbids exempting and it must be asserted, not assumed.
        3. SC-03 refuse, one case each: switching to the previous branch, a hard reset one commit
           back, a rebase onto the default branch, and a checkout carrying a leading directory
           option. Each exits 2.
        4. SC-03 allow, and this is the half that makes the set discriminating: restoring a single
           file via a pathspec checkout, a status call, staging one file, and a reset naming one
           pathspec each exit 0 for the same governed agent. A guard that refuses everything passes
           case 1 and fails here.
        5. the main session is not governed: the same branch checkout with NO agent_type key in the
           payload exits 0.
        6. the undecidable case: a command this guard cannot parse into a git subcommand exits 2 and
           says it could not determine what the command does.

      THE SECOND RULE - A FORCED WORKTREE REMOVAL OVER BASH. This is the Bash-route half of SC-07
      and it is why SC-07 is not satisfied by T-02 alone. T-02's refusal lives inside
      feature-worktree.py, and a governed agent can bypass that CLI by calling git directly.
      Measured at eeabc59: git worktree remove on a tree holding one untracked file exits 128, which
      is git's own refusal and the half that can be relied on - but the SAME removal carrying a
      force flag passes this guard at exit 0, because the worktree parser at lines 405 to 427 tests
      _ops[1] against add and move only, so remove is never inspected. A CLI gate an agent can route
      around is the shape this feature exists to replace.

      EXTEND THE EXISTING PARSER. Do not add a second one, and do not duplicate its operand walk.
      In that same _ops[1] test, admit remove and prune alongside add and move, and REFUSE when a
      force flag is present for either of the two new subcommands. The destination logic stays
      reached only for add and move: remove and prune carry no destination this guard needs to
      resolve, so nothing about the existing add and move behaviour changes.

      Do NOT build a dirty-tree detector in this guard. It cannot cheaply know whether a tree is
      dirty and it does not need to: without a force flag git itself already refuses a dirty tree at
      128, so refusing the force flag is the whole mechanism. That is why this rule is small.

      The refusal message names feature-worktree.py remove as the sanctioned path, and says that the
      CLI refuses on a dirty tree and reports every path it would discard. Use the same deny helper
      and exit code as the other worktree refusals in this file.

      This is a DIFFERENT case from the HEAD-move list's removing or pruning the worktree the
      session is standing in, which protects the session's own cwd rather than another feature's
      tree. Keep that rule and add this one alongside it; neither covers the other.

      TEST CASES for the second rule, in the same file, both directions from ONE fixture:
        7. SC-07 on the Bash route, refuse: agent_type harness-backend-dev, git worktree remove
           carrying a force flag against a path under WORKTREES_SEGMENT. Exit 2, and stderr names
           feature-worktree.py. One more case for a forced prune, same assertions.
        8. SC-07 the paired direction: the SAME removal WITHOUT a force flag is NOT refused by this
           guard - exit 0 - because it reaches git, which decides and refuses a dirty tree itself.
           A refuse-only set is what an allow-nothing guard produces, so this half is what makes
           case 7 discriminating.
        9. the existing worktree add and move destination refusals stay green and unchanged: a
           governed add to a path outside WORKTREES_SEGMENT still exits 2 and an add inside it still
           exits 0. Assert both, because admitting two more subcommands into the same parser is the
           edit most likely to disturb them.

      TWO MORE CASES FOR THE HEAD RULE, and they are a PAIR - the pair is what makes the reordering
      discriminating rather than a blanket. Neither is covered by case 2: harness-orchestrator is
      refused today only because no exemption exists for it, while harness-dev-ops has an explicit
      one, so this is a second and different hole.
        10. agent_type harness-dev-ops, a command that checks out the default branch. Exit 2, and
            stderr names the worktree alternative. This case FAILS against any implementation that
            places the rule after the line 56 to 57 early return, which is exactly what it is for.
        11. agent_type harness-dev-ops, a write the guard would otherwise check and refuse for any
            other governed persona - use the same not-granted destination shape the existing
            dev-ops-exemption assertions in this file already rely on. Exit 0. The exemption for
            WRITES is intact. Without this half, case 10 is satisfied by deleting the exemption
            outright, which would remove the recovery path DEC-151 exists to preserve.

  - id: T-06
    title: Make two concurrent Expertise close-outs lose no entry, or fail loudly
    traces: [REQ-06]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    execution_reason: none
    depends_on: []
    status: building
    files:
      - .claude/skills/harness/bin/expertise-merge.py
      - .claude/skills/harness/bin/test-expertise-merge.py
    verify: |
      set -u
      T=$(mktemp -d) || exit 1
      cp -R .claude/skills/harness/bin "$T/bin" || exit 1
      python3 - "$T/bin/expertise-merge.py" <<'PY' || exit 1
      import sys
      p = sys.argv[1]
      s = open(p).read()
      m = s.replace("UNION_APPLY = True", "UNION_APPLY = False", 1)
      assert m != s, "UNION_APPLY assignment not found BY NAME"
      open(p, "w").write(m)
      PY
      EXPERTISE_MERGE_BIN="$T/bin/expertise-merge.py" \
        python3 .claude/skills/harness/bin/test-expertise-merge.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with the union apply switched off"; exit 1; }
      python3 .claude/skills/harness/bin/test-expertise-merge.py || exit 1
      exit 0
    intent: |
      Write two new files. Nothing else in the tree changes. This task is SC-08 and it is not folded
      into any worktree task: the loss it prevents happens whenever two close-outs run at once, with
      or without worktrees, and DEC-95 recorded it as unaddressed residue.

      FILE 1 - .claude/skills/harness/bin/expertise-merge.py, executable, python3 stdlib only.

        expertise-merge.py apply --file <path to an Expertise markdown file> --entries <path or ->

      It reads a set of proposed entries and applies them to the file so that no entry already in the
      file is lost. The entries input uses the same line format the file itself uses: entries of the
      form dash, an id such as P-01, a colon, then text, at column zero, grouped under the four
      canonical section headings Patterns, Gotchas, Outcomes and Open. That format and its caps are
      DEC-145's and are enforced by check-expertise.sh; this tool must produce a file that
      check-expertise.sh still accepts.

      THE ALGORITHM, and the ordering matters:
        1. Take an exclusive lock: create a sibling lock file with os.open using the create-and-
           exclusive flags. If it already exists, retry with a short sleep for at most 10 seconds,
           then exit 6 naming the lock file. A lock that waits forever inside a close-out is worse
           than one that reports.
        2. Read the file under the lock and parse it into sections keyed by heading, each an ordered
           list of entry id and text.
        3. Compute the UNION, keyed by section and entry id, preserving existing order and appending
           new ids in the order the proposal gives them.
        4. Exit 7, applying nothing, when the same section and entry id exists on both sides with
           DIFFERENT text. Print both texts. A silent overwrite here is the loss this tool exists to
           report.
        5. Exit 8, applying nothing, when the union exceeds a section cap - 15 Patterns, 15 Gotchas,
           10 Outcomes, 5 Open. Print the section, the cap and the union size. Truncating would trade
           one silent loss for another; the caller must curate and re-apply.
        6. Write the union to a temporary file in the same directory and os.replace it onto the
           target, so a concurrent reader never sees a half-written file.
        7. Release the lock in a finally block, on every exit path above included.
        8. On success print one line per entry id added and one line per entry id preserved, then a
           final line APPLIED and the path. Never a bare count.

      Declare one module-level constant, UNION_APPLY = True, guarding step 3. When it is False the
      tool writes the proposal alone - which is exactly today's last-writer-wins behaviour. Nothing
      reads an environment variable or a flag to change it; it exists so a test can mutate a copy of
      this file by name and prove its assertions can go red.

      FILE 2 - .claude/skills/harness/bin/test-expertise-merge.py, house shape, resolving the tool as

        CLI = os.environ.get("EXPERTISE_MERGE_BIN") or os.path.join(HERE, "expertise-merge.py")

      CASES:
        1. THE RED CASE, and it is permanent rather than a one-off proof. Simulate today's close-out
           directly: write a starting file holding P-01 and P-02, then have writer A replace the file
           with P-01 and P-03 by a plain whole-file write, then writer B replace it with P-01 and
           P-04. Assert that P-02 and P-03 are BOTH absent afterwards - that is the last-writer-wins
           loss DEC-95 recorded, asserted rather than described. This case never goes stale, because
           it tests the naive sequence rather than the tool.
        2. THE GREEN CASE, the same two close-outs through the tool: starting file with P-01 and
           P-02, apply A's proposal of P-01 and P-03, then apply B's proposal of P-01 and P-04.
           Assert all four ids are present, one assertion per id, and that the file still passes
           check-expertise.sh by forking it and asserting exit 0.
        3. CONCURRENCY FOR REAL: spawn two subprocesses that apply overlapping proposals to the same
           file at the same time, join both, and assert that either the union of both proposals
           survives, or that one run exited 6 with the lock message and applied nothing. Assert
           exactly those two outcomes and no third; run it at least 20 times so a lost race is
           visible.
        4. DIVERGENT TEXT: the same id with different text exits 7, the file on disk is byte
           identical to before, and both texts appear in stdout.
        5. CAP OVERFLOW: a proposal taking Patterns to 16 exits 8, names the section and the cap, and
           leaves the file byte identical.
        6. A file that does not exist yet is created from the proposal alone and exits 0.
        7. The lock is released: after each of cases 4, 5 and 6 the lock file does not exist.
        8. THE CAP DRIFT DETECTOR, which this task owes because step 5 re-spells DEC-145's four
           section caps in a second file. Read .claude/skills/harness/bin/check-expertise.sh as
           TEXT, extract the four numbers from the CAPS mapping it assigns - those caps live inside
           a python3 heredoc in that script and cannot be imported - and assert they equal the four
           caps this tool enforces, section by section, naming any section whose two values differ.
           This is the remedy DECISIONS.md:5219-5225 recorded for the handoff cap of 60 when it
           appeared in two scripts: a test asserting the two files agree, rather than a third copy
           of the numbers. T-07 forbids restating these caps in prose; this case is what makes the
           code copy safe instead of forbidding it too.

