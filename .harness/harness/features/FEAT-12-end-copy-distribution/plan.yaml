  - id: T-02
    title: Delete kaya-ai's copies of the harness skills, slash commands and agents
    traces: [REQ-03]
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: the path is outside CLAUDE_PROJECT_DIR and no team-config lane grants it
    depends_on: [T-01]
    status: done
    files:
      - /Users/molchairuangutai/GitHub/kaya-ai/.claude/skills
      - /Users/molchairuangutai/GitHub/kaya-ai/.claude/commands
      - /Users/molchairuangutai/GitHub/kaya-ai/.claude/agents
      - .harness/features/FEAT-12-end-copy-distribution/notes/kaya-agents-count-before.txt
    verify: |
      cd /Users/molchairuangutai/GitHub/kaya-ai && test "$(ls -1d .claude/skills/harness* 2>/dev/null | wc -l | tr -d ' ')" = 0 && test "$(ls -1 .claude/commands/harness*.md 2>/dev/null | wc -l | tr -d ' ')" = 0 && test -d .claude/agents && test "$(ls -1 .claude/agents/harness-*.md 2>/dev/null | wc -l | tr -d ' ')" = 0 && test -s /Users/molchairuangutai/GitHub/harness/.harness/features/FEAT-12-end-copy-distribution/notes/kaya-agents-count-before.txt && test "$(cat /Users/molchairuangutai/GitHub/harness/.harness/features/FEAT-12-end-copy-distribution/notes/kaya-agents-count-before.txt)" -gt 0 && test -d .claude/commands && test -f .claude/commands/review-team.md && test -d .harness/expertise && test -d .harness/codebase && test -d .harness/features && test -d .harness/artifacts && test -d .harness/notes && test -f .harness/harness.json && test -f .harness/team-config.yaml
    intent: |
      In the working tree at /Users/molchairuangutai/GitHub/kaya-ai, remove the harness tooling that
      deploy.sh copied there. Three sets, and only these three:

      1. Every directory matching .claude/skills/harness*/ - 21 of them at the time of planning,
         including the 37-file harness/bin/. Remove the directories themselves, not just contents.
      2. Every file matching .claude/commands/harness*.md - 8 of them.
      3. Every file matching .claude/agents/harness-*.md. This set is DIFFERENT IN KIND from the
         other two and must not be handled as if it were the same. Measured in kaya on 2026-08-10:
         git ls-files .claude/agents/harness* returns ZERO rows, while ls -1 .claude/agents returns
         16 files, all matching harness-*.md and nothing else. They are real files on disk and
         deleting them is real work, but they were never committed, so this deletion produces NO
         COMMIT CONTENT and the remote never carried them. That is why T-05's remote verify has no
         agents clause and why SC-04's agents half is graded against kaya's working tree. It is also
         why git rm cannot be used on them at all.

      FIRST, before deleting anything, record the pre-deletion agent count so the 16-to-0 transition
      has a witness that a post-hoc command cannot supply - once the directory is empty, nothing can
      distinguish "16 were deleted" from "there were never any". Run, in kaya:

        ls -1 .claude/agents | wc -l | tr -d ' '

      and write that single number, and nothing else, to
      .harness/features/FEAT-12-end-copy-distribution/notes/kaya-agents-count-before.txt in THIS
      repository. This task's verify asserts that file exists and holds a number greater than zero,
      alongside the post-deletion count of zero. Also report the same number in your receipt: it is
      SC-04's cited evidence for the agents half.

      The directory .claude/agents/ SURVIVES, empty, and so does .claude/commands/, which still
      holds review-team.md. The verify asserts both, because an all-absent result is also what
      deleting the wrong directory outright would produce.

      .claude/skills/ IS EXPECTED TO DISAPPEAR, and that is correct rather than an overreach.
      Measured in kaya on 2026-08-10: ls -1 .claude/skills returns 21 entries and every one of them
      matches harness*, nothing else is in there. git removes a leading directory that its removals
      leave empty - reproduced in a scratch repository - so the directory goes with its last child.
      Do not recreate it, and do not treat its absence as a fault.

      The pre-count you record must be the LITERAL output of ls -1 .claude/agents | wc -l run before
      any deletion in this task - not a number carried from this plan, not one recalled from a
      measurement note. Quote the command next to the number in your receipt. SC-04 cites that
      number as its evidence, and a number with no command beside it is an assertion rather than a
      measurement.

      Explicitly DO NOT touch:
      - .claude/commands/review-team.md. It does not match harness* and is not harness tooling.
      - .harness/ in any form. All seven of its top-level entries are kept by operator ruling.
      - .claude/settings.json. That is T-03.
      - any non-harness file anywhere in the repository.

      Derive the deletion set from the three globs above at execution time; do not paste a
      hand-written list, and do not use a broader glob such as .claude/skills/* .

      HOW TO DELETE. The operator ruled git rm rather than rm. git rm cannot be applied blanket-wise
      here, and both reasons were reproduced in a scratch repository rather than reasoned about:

        - git rm -r -- <pathspec> on a pathspec that includes an UNTRACKED path exits 128 with
          "fatal: pathspec ... did not match any files" and removes nothing at all.
        - git rm -r -- <pathspec> on a TRACKED path that has local modifications exits 1 with
          "error: the following file has local modifications". -f is required.
        - git rm -f -r -- on a tracked path already deleted from disk exits 0 and stages the
          deletion, so a path that git ls-files reports but ls does not is expected, not a fault.

      So split the set AT EXECUTION TIME, by the same rule that derives it - never from a number
      written in this plan:

        - Whatever git ls-files reports under the three globs is removed with git rm -f -r -- .
        - Everything the globs match that git ls-files does not report is removed with rm -rf .

      -f is authorized, and here is the authorization, because it discards local modifications
      permanently. Measured on 2026-08-10: 34 tracked harness files under .claude/skills/harness* or
      .claude/commands/harness* carry local modifications. Every one of them is reproducible from
      this repository - 28 are byte-identical to this repo's copy at 365a8a9, and the remaining 6
      are present in this repo's object database, confirmed by hashing kaya's copy and running
      git cat-file -e on the hash here. Nothing unique is lost. Do not stop and escalate on the
      local-modifications error; it is expected and -f is the answer.

      THIS TASK THEREFORE STAGES, and that is deliberate: git rm stages by construction, so the
      earlier direction that no staging happens here is superseded. What is still forbidden is a
      staging decision that widens the set. Do not run git add, git commit, git stash or git
      checkout in this task, and never use -a, -A or a bare rm -rf .claude . The working tree there
      carries 63 modified or untracked entries that are not this feature's. The set this task
      stages is exactly the deletion set derived from the three globs, which is a subset of T-05's
      pathspec .claude/skills .claude/commands .claude/settings.json - so T-05's check that every
      staged entry is either a deletion of a harness* path or the single settings.json modification
      still holds, and holds over what this task staged.

      Two of the tracked paths under those globs are already deleted from disk in kaya
      (.claude/skills/harness/bin/cost-report.py and .claude/skills/harness/teams/gate-probe.yaml).
      git ls-files still reports them, git rm -f -r stages their deletion, and ls disagreeing with
      git ls-files is not grounds to stop.

      kaya carries six git worktrees under .claude/worktrees/. Three of them - 333-env-test,
      feat02-statements and feat03-live-review-loop - hold their own .claude/skills/harness* tree,
      153 files across 56 directories, and those files are TRACKED content of each worktree's own
      branch, not untracked. They are invisible to kaya's root git status only because
      .gitignore line 23 ignores the .claude/worktrees/ container in the main tree. Nothing on
      master tracks any worktree path, so the three globs cannot reach them and neither the git rm
      set nor the rm -rf remainder touches them. Do not extend any glob to reach them and do not
      delete them: they are a declared deferral in the BRIEF Constraints section, and each of the
      three branches drops its copy on its own when it next merges or rebases master.

  - id: T-03
    title: Unwire all eight harness hook registrations from kaya-ai's settings.json
    traces: [REQ-06]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: the path is outside CLAUDE_PROJECT_DIR and no team-config lane grants it
    depends_on: [T-01]
    status: done
    files:
