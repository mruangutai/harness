    verify: |
      cd /Users/molchairuangutai/GitHub/kaya-ai && python3 -c "
      import json
      t = open('.claude/settings.json').read()
      d = json.loads(t)
      assert 'skills/harness' not in t, 'a harness skill path survives in settings.json'
      assert set(d) >= {'hooks', 'env'}, 'a top-level key was lost: %s' % sorted(d)
      cmds = [h['command'] for ev in d['hooks'].values() for m in ev for h in m['hooks'] if 'command' in h]
      for s in ('work-tracking-nudge.sh', 'pre-commit-tests.sh', 'pr-issue-gate.sh', 'branch-issue-gate.sh'):
          assert any(s in c for c in cmds), 'a non-harness hook was lost: ' + s
      assert all('.claude/hooks/' in c for c in cmds), 'a hook outside .claude/hooks/ survives: %s' % cmds
      print('ok', len(cmds), 'hooks remain')
      "
    intent: |
      Edit /Users/molchairuangutai/GitHub/kaya-ai/.claude/settings.json so that it no longer
      registers any hook whose command points inside the skill tree T-02 deletes.

      There are EIGHT such registrations and they span FOUR hook events, not three PreToolUse hooks.
      An earlier draft of this task enumerated three; that enumeration was wrong, it contradicted
      this task's own headline instruction and its own verify, and a builder who followed it would
      leave five registrations wired and then fail the verify. Measured with json.load in kaya on
      2026-08-10, the full set is:

        PreToolUse   Bash              .claude/skills/harness/bin/branch-create-gate.sh
        PreToolUse   Bash              .claude/skills/harness/bin/branch-create-gate.sh   (a SECOND,
                                       duplicate entry, spelled ${CLAUDE_PROJECT_DIR} where the
                                       first uses "$CLAUDE_PROJECT_DIR" - both go)
        PreToolUse   Bash              .claude/skills/harness/bin/bash-write-guard.sh
        PreToolUse   Write or Edit     .claude/skills/harness/bin/check-domain.sh
        PreToolUse   Task or Agent     .claude/skills/harness/bin/dispatch-guard.sh
        SubagentStart  harness-.*      .claude/skills/harness/bin/inject-expertise.sh
        SubagentStop   harness-.*      .claude/skills/harness/bin/validate-digest.py --hook
        PostToolUse  Write or Edit or Bash  .claude/skills/harness/bin/check-domain.sh --post

      Do not treat this list as the definition of the set. The DEFINITION is the headline above -
      any hook whose command points inside .claude/skills/harness/ - and the list is what that
      definition matched on 2026-08-10. If you find a ninth, remove it too and say so.

      WHY THE COUNT MATTERS HERE, where you are reading it: SC-06 is the operator's own blocking
