decisions:
  - id: D-01
    choice: >-
      All three distributed surfaces are removed from kaya-ai, not just the skills the operator
      ruling names - 21 harness skill directories, 8 harness slash commands, and the harness agent
      files on kaya's disk. The three are NOT one committed triple, and the plan must not treat them
      as one. Measured in kaya-ai on 2026-08-10, and superseding every earlier count in this plan:
      55 tracked skill files and 8 tracked command files on master, and 16 agent files present on
      disk but tracked by nothing - git ls-files .claude/agents/harness* returns zero rows while
      ls -1 .claude/agents returns 16 files, all matching harness-*.md and nothing else.
      Consequence, stated once here and repeated wherever it binds: the agents deletion is
      WORKING-TREE-ONLY, it produces no commit content, and the remote never carried it. So T-05's
      remote verify carries no agents clause by design, and SC-04's agents half is a claim about
      kaya's working tree, never about origin/master.
    because: >-
      deploy.sh derives its payload from all three sets at lines 52 to 59 and copies commands into
      each enrolled project at lines 264 to 268, so the mechanism itself is the authority for
      treating the triple as one distributable. deploy.sh line 54 attributes the slash-command half
      to DEC-161; that citation is unfounded, because no DEC-161 exists in docs/harness/DECISIONS.md
      - grep -c '^## DEC-161' returns 0 at 687fd3e, and DEC-188 records that DEC-161 had already been
      deleted. The mechanism is re-derived from deploy.sh directly and no decision is cited for it.
      The operator deleted exactly that triple from the global install on 2026-08-10 - 21 skills,
      16 agents, 8 commands. review-team.md is not harness tooling and survives.
    dec: none
  - id: D-02
    choice: >-
      kaya-ai's committed .claude/settings.json loses EVERY harness registration, and there are
      EIGHT of them across FOUR hook events, not three PreToolUse hooks. Measured with json.load in
      kaya-ai on 2026-08-10: PreToolUse Bash branch-create-gate.sh; PreToolUse Bash
      branch-create-gate.sh a second, duplicate time under a different variable spelling; PreToolUse
      Bash bash-write-guard.sh; PreToolUse Write or Edit check-domain.sh; PreToolUse Task or Agent
      dispatch-guard.sh; SubagentStart on matcher harness-.* inject-expertise.sh; SubagentStop on
      matcher harness-.* validate-digest.py --hook; PostToolUse Write or Edit or Bash
      check-domain.sh --post. All eight go, in this feature rather than as a deferral.
    because: >-
      those paths live inside the skill tree D-01 deletes, so leaving them wired makes every Bash,
      Write, Task and subagent call in any kaya session - including the factory checkouts the fleet
      entry exists to enable - fail on a dangling command, which would ship the fleet entry inert.
      The earlier count of three was wrong and is corrected here rather than left for the builder to
      discover: SC-06 is the operator's own blocking UAT and it spawns a Task, which fires
      PreToolUse Task or Agent, SubagentStart and SubagentStop - three of the four events the
      three-hook framing never mentioned. deploy.sh line 14 disclaims writing settings.json, so this
      wiring came from merge-settings.py, and unwinding it touches ground that issue 206 also covers.
    dec: none
  - id: D-03
    choice: The retirement is recorded by STRIKING DEC-12 from the record and striking the two falsified parts of DEC-113, not by declaring stale markers.
    because: >-
      DEC-188 is the governing rule and it says so directly: a decision the tree flatly contradicts
      is struck from the record and removed from every gate, not marked stale, not amended, not left
      standing with a marker beside it. DEC-188 also records what was already carried out under it -
      bin/check-docs.sh deleted, the INV-10 block out of check-state.sh, and the 66 stale-wording
      markers and 14 escape comments gone from the live docs - so a marker task would write into a
      mechanism that no longer exists. Confirmed at 687fd3e of this repository: check-docs.sh is
      absent from the tree.
    dec: none
  - id: D-04
    choice: DEC-12 is struck whole; DEC-113 is struck in part, keeping only its override-precedence ruling with a justification that no longer cites distribution.
    because: DEC-12 is about nothing but the deploy and init split, so every clause of it is falsified. DEC-113 carries three rulings and only two die with deploy - agents distributed globally only, and agent_skills cleanup reported not performed. Its third, that team and crew overrides live outside the tool tree and resolve first, is still live and is cited by harness-team/SKILL.md, so striking DEC-113 whole would delete a rule the tree still obeys.
    dec: none
  - id: D-05
    choice: A new unit test, test-no-distribution.py, carries the absence claims, and every absence assertion in it is paired with a presence assertion.
    because: DEC-169 - an absence check proves only that the wrong words are gone, and a grep that was going to pass anyway proves nothing. It also has to be registered in run-unit-tests.sh UNIT_SCRIPTS in the same task, because the drift detector fails the whole run on an unregistered test file.
    dec: DEC-169
  - id: D-06
    choice: >-
      kaya-ai's .claude/settings.json.harness-bak is declared OUT OF SCOPE and left on master, as a
      deferral on the record rather than an omission. It is tracked on the remote - git ls-tree -r
      --name-only origin/master lists it beside .claude/settings.json - it is modified in kaya's
      working tree, and it registers six harness scripts. After this feature master therefore still
      ships one tracked file naming scripts that no longer exist. No task, REQ or SC here touches it,
      and T-05's pathspec does not match it.
    because: >-
      The discriminating check is whether merge-settings.py ever reads the backup back. It does not.
      In this repository at 687fd3e, grep -n over .claude/skills/harness/bin/merge-settings.py
      returns exactly three hits for harness-bak: line 325 a comment, line 326
      shutil.copyfile(path, path + ".harness-bak"), and line 338 a print naming its location. It is
      write-only, nothing restores from it, and Claude Code does not load a .harness-bak file, so the
      residue is inert for SC-06 and cannot cause a dangling-hook error. Bringing it in would also
      need a REQ it does not have: REQ-03 is about harness tooling, REQ-06 about dangling hooks, and
      REQ-07 about this repository, and line 325's own comment says the backup exists because
      merge-settings edits a file the project owns and harness does not - it is kaya's property, not
      harness tooling. Inventing a ninth REQ on a brief the operator is about to sign is scope
      widening, so the residue is declared here and in BRIEF's Constraints instead. What a future
      reader needs: deleting it is a one-path change to T-03 and one entry on T-05's pathspec, and
      git history on the remote retains the file, so the deferral is cheap to reverse.
    dec: none

