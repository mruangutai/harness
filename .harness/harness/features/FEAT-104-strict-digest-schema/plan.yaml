decisions:
  - id: D-01
    choice: The lead passthrough becomes a declared typed table PASSTHROUGH in validate-digest.py, optional per key, checked against the origin persona's type or enum, rather than new members of SCHEMAS
    because: a SCHEMAS member is REQUIRED under DEC-121 and DEC-216 would then force matrix_ok into every lead's documented block
    dec: none
  - id: D-02
    choice: A field earns a PASSTHROUGH row when it is already declared for another persona, as a SCHEMAS member or a DOCUMENTED_OPTIONAL entry under D-10, and is seen riding up a lead roll-up; occurrence count decides nothing, and a field declared and documented nowhere is drift whatever its count
    because: an occurrence bar classed four already-legitimate fields as drift, coverage_gaps and failures and suite and kinds, three of them declared members of SCHEMAS qa and the fourth documented at .omp/agents/harness-qa.md line 91, while promoting nothing, so the bar measured popularity where the question is provenance
    dec: none
  - id: D-03
    choice: adequacy_notes enters SCHEMAS lead as a REQUIRED list, lead-only, not universal
    because: all 78 measured producers are lead returns, and an optional field reproduces the unrelied-upon state issue 37 was filed about
    dec: none
  - id: D-04
    choice: The steps entry shape is a closed 21-key set plus one container, and membership is decided by whether a fresh context needs the key to resume, not by how often it appears
    because: DEC-191 puts the burden of proof on keeping a key, so severity_max at 20 runs is still evidence rather than schema
    dec: DEC-191
  - id: D-05
    choice: The container is evidence, a mapping whose keys must match a lowercase identifier pattern and whose values are scalars or flat lists of scalars, governed in shape and free-form in content
    because: DEC-191 refused a drawer in a permanent machine-read record, while a per-run step entry is append-only and no script routes on it, and blanket rejection pushes evidence back into a context that demonstrably vanishes
    dec: DEC-191
  - id: D-06
    choice: Step-level enforcement is gated on schema_version 2, all 356 existing runs declare 1 and stay legal and unrewritten
    because: it makes historical readability true by construction instead of by promise
    dec: none
  - id: D-07
    choice: The stop_hook_active passthrough stays open, and the unknown-key error is emitted as ONE message listing every offending key with its declaration route
    because: DEC-208 records the passthrough as deliberate, so the single shot must be sufficient rather than closed
    dec: DEC-208
  - id: D-08
    choice: The step key set lives in one JSON schema file read by both gates, not duplicated in check-domain.sh and check-state.sh
    because: feature-schema.json is the DEC-191 precedent and two copies of a key set drift
    dec: DEC-191
  - id: D-09
    choice: Drifted spellings are fixed at the instruction surfaces, and no alias is added to either gate
    because: an alias makes the wrong spelling permanently legal, which is the tolerance this feature removes
    dec: none

  - id: D-10
    choice: The legal digest key set is derived from every persona's DOCUMENTED output block, and a documented field carrying no declaration enters a new module-level DOCUMENTED_OPTIONAL table in validate-digest.py, keyed by RAW agent type, optional and typed, rather than becoming a required SCHEMAS member
    because: a SCHEMAS member is REQUIRED under DEC-121, so 16 new required fields across 7 personas would reject every conforming return that omits one, and the three reviewer agents collapse to one canonical persona at validate-digest.py lines 243 to 244, so only the raw key keeps mode illegal on a security review
    dec: DEC-121
  - id: D-11
    choice: The step enforcement floor binds by refusing the CREATION of a run state.yaml whose write payload declares schema_version below 2 or omits it, checked on check-domain.sh's existing write-payload path and only when the target file does not yet exist
    because: without a floor REQ-02 is satisfied by prose, since D-06 gates step enforcement on a version the writing agent picks for itself, and keying the refusal on creation leaves every existing version-1 file writable and unrewritten so REQ-08 does not weaken
    dec: none
  - id: D-12
    choice: Agreement between a persona's documented output block and its declaration is asserted mechanically in BOTH directions by tests/integration/test-validate-digest.py, reusing the existing CONTRACT_SOURCES map and documented_block parser, with .omp/agents as the source of record because the .claude/agents copies are generated
    because: DEC-216 asserts required to documented only, and the reverse gap is exactly the defect that made this feature's first draft reject seven personas' documented returns, so it must be findable by a test rather than by the next reader
    dec: DEC-216
tasks:
  - id: T-01
    title: Declare the passthrough and documented-optional tables, require adequacy_notes, and document it in the lead block
    traces:
    - REQ-04
    - REQ-07
    - REQ-09
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out, validate-digest.py is the validator being changed
    depends_on:
    - T-10
    status: ready
    files:
    - .claude/skills/harness/bin/validate-digest.py
    - tests/integration/test-validate-digest.py
    - .claude/skills/harness-team/SKILL.md
    - .omp/agents/harness-validator-lead.md
    - .claude/agents/harness-validator-lead.md
    - .harness/harness/features/FEAT-104-strict-digest-schema/notes/base-revision-pre-T-04.txt
    verify: |
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-104-strict-digest-schema
      out=$(python3 tests/integration/test-validate-digest.py) || exit 1
      printf '%s\n' "$out" | grep -q 'ALL PASSED' || exit 1
      printf '%s\n' "$out" | grep -q 'adequacy_notes' || exit 1
      printf '%s\n' "$out" | grep -q 'every documented key is declared' || exit 1
      grep -q 'DOCUMENTED_OPTIONAL' .claude/skills/harness/bin/validate-digest.py || exit 1
      grep -q '^  adequacy_notes:' .claude/skills/harness-team/SKILL.md || exit 1
      python3 .claude/skills/harness/bin/sync-agent-adapters.py --check || exit 1
    intent: |
      This task subsumes the former T-02, which is abandoned: the declaration and its documentation
      land as ONE commit, because a lead return omitting adequacy_notes exits 2 from the first of the
      two onward and this feature's own build runs are lead returns.

      PART 1, in .claude/skills/harness/bin/validate-digest.py, beside SCHEMAS (currently lines
      183 to 229), add TWO module-level mappings.

        PASSTHROUGH = {"lead": {"sc_status": list, "needs_approval": bool,
                                "severity_max": set(SEV), "matrix_ok": bool,
                                "coverage_gaps": list, "failures": int,
                                "suite": {"pass", "fail"}, "kinds": list}}

      A PASSTHROUGH field is OPTIONAL, and that is the difference from SCHEMAS on purpose. When
      present it is validated exactly as SCHEMAS validates a field of that type or enum, reusing the
      existing field loop rather than a second one. When absent nothing is reported. Write a comment
      stating why it is not in SCHEMAS: a SCHEMAS member is REQUIRED under DEC-121, and DEC-216 would
      then force matrix_ok into every lead's documented output block. The last four rows are D-02's
      repaired bar: coverage_gaps, failures and suite are declared members of SCHEMAS qa, and kinds is
      documented at .omp/agents/harness-qa.md line 91, so all four are a lower tier's own field riding
      up a roll-up rather than invented vocabulary, whatever their measured count.
      Move sc_status OUT of SCHEMAS lead into PASSTHROUGH lead and delete the prose comment that
      described it as a passthrough, so there is one mechanism rather than a comment.

        DOCUMENTED_OPTIONAL, keyed by RAW agent type, never by the canonical persona

      Same optional-and-typed semantics as PASSTHROUGH, and keyed on the raw type deliberately
      (D-10): the three reviewer agents collapse to the single canonical persona "reviewer" at
      validate-digest.py lines 243 to 244, so only the raw key keeps mode illegal on a security
      review. Read the raw type from the same value line 1341 already reads. The rows, each field
      taken from that agent's own documented DIGEST block:

        harness-code-reviewer:    spec_violations list, human_commits_in_scope list
        harness-security-reviewer: in_scope bool, scope_reason str, threat_model list
        harness-ui-reviewer:      mode {"A","B"}, in_scope bool, states_unspecified list,
                                  contract_violations list, a11y list
        harness-qa:               kinds list, sc_evidence list
        harness-documentor:       stale_found list
        harness-dev-ops:          test_kinds_written list
        harness-visual-designer:  needs_prototype bool, why str, prototype str

      Sixteen distinct field names, and every one of them is instructed by a documented block while
      appearing nowhere in this file today; the persona-by-persona enumeration with its file and line
      anchors is in
      .harness/harness/features/FEAT-104-strict-digest-schema/notes/research-FEAT-104-planfix-c1.md
      Add "prototype" to NULLABLE: its documented value is <path|none>, and NULLABLE is the one
      mechanism DEC-173 established for an inapplicable scalar.

      PART 2, still in validate-digest.py: add "adequacy_notes": list to SCHEMAS lead as a REQUIRED
      field. It is a list of one-line strings naming what the PASS does not cover; an explicit empty
      list is the DEC-121 spelling for none.
      Do NOT add unknown-key rejection in this task. That is T-04, and it lands in its own later
      commit so T-08 has a base revision that contains this task and not that one.

      PART 3, .claude/skills/harness-team/SKILL.md carries the one canonical lead digest block at
      lines 237 to 258 and is the DEC-216 contract source for all three leads
      (tests/integration/test-validate-digest.py lines 311 to 313). Add to that block, at the same
      indentation as the other DIGEST fields so the line begins with exactly two spaces, a field
      adequacy_notes whose example value is a list naming what this PASS does not cover, with the
      annotation that an empty list is used when there is nothing and that it is NEVER omitted.
      Add one sentence of semantics beside the block: adequacy_notes is a qualification on a PASS, it
      means act on nothing but do not read this green as wider than it is. It is not must_fix, which
      gates, and not open_questions, which reaches the user.
      Also add, in the same block, a commented line naming the optional passthrough fields a lead may
      carry when rolling a member up - sc_status, needs_approval, severity_max, matrix_ok,
      coverage_gaps, failures, suite, kinds - and stating that any OTHER field is rejected from T-04
      onward and belongs in adequacy_notes or in the run state evidence container.

      PART 4, .omp/agents/harness-validator-lead.md is the CANONICAL role file; .claude/agents is
      GENERATED from it by .claude/skills/harness/bin/sync-agent-adapters.py, which copies the body
      wholesale (sync-agent-adapters.py lines 191 to 226). Edit the .omp file only, then run
      python3 .claude/skills/harness/bin/sync-agent-adapters.py --apply and confirm --check exits 0.
      Two edits at .omp/agents/harness-validator-lead.md lines 135 to 136. First, the existing
      adequacy_notes instruction stays but must now say the field is required of EVERY lead with an
      explicit empty list, not a validator-lead extra. Second, its documented severity_max enum reads
      info|low|med|high|critical, and info is not a member of SEV (validate-digest.py line 36), so the
      documented value is one the validator rejects today: correct info to none.

      PART 5, tests in tests/integration/test-validate-digest.py, each asserted SEPARATELY, never a
      count:
        - a lead return carrying EACH of the eight PASSTHROUGH keys with a correct value validates -
          one assertion per key;
        - a lead return carrying severity_max set to the string sever is rejected naming the enum;
        - a lead return OMITTING each PASSTHROUGH key validates - one assertion per key;
        - a lead return omitting adequacy_notes is rejected; one with an empty list validates;
        - for EACH of the sixteen DOCUMENTED_OPTIONAL fields, its own persona's return carrying that
          field with a correct value validates, and carrying it with a wrong-typed value is rejected
          naming the field - one assertion per field, thirty-two assertions;
        - the REVERSE-DIRECTION agreement case (D-12), which is the mechanical assertion that
          documentation and declaration agree: for every persona in the existing CONTRACT_SOURCES map
          (lines 297 to 314), take documented_block for its mapped source, collect every key matching
          a line of exactly two spaces then a lowercase identifier then a colon, and assert that key
          is a member of UNIVERSAL, or headline, or SCHEMAS for the canonical persona, or
          PASSTHROUGH for it, or DOCUMENTED_OPTIONAL for the raw persona. One assertion per persona,
          and the failure message must name the persona, the key and its source path. The ok line for
          this case must contain the literal string: every documented key is declared
        - one value-level assertion beside it: the severity_max enum documented for the leads is a
          subset of set(SEV), which is what PART 4's info correction makes true;
        - demonstrate the reverse case DISCRIMINATES rather than asserting it: with one
          DOCUMENTED_OPTIONAL row temporarily removed in-process, the case must FAIL naming that
          field, and the demonstration is part of the case, not a claim in a note.
      run_documented_contract_cases must PASS at the end of this task - PART 3 is what closes it, and
      that is why the two former tasks are one.

      PART 6, the base-revision pin, which is what makes SC-06 falsifiable on behaviour rather than on
      ordering. Commit parts 1 to 5 as ONE commit. Then, as a second act of this same task, write the
      40-character output of git rev-parse HEAD, as a single line with no trailing text, to
      .harness/harness/features/FEAT-104-strict-digest-schema/notes/base-revision-pre-T-04.txt using
      the Write tool (bash-write-guard.sh denies a shell redirect), and commit that one note file
      alone. A separate commit is unavoidable: a commit cannot contain its own id. It touches one note
      file, so git show of that pinned id for validate-digest.py returns the post-part-2,
      pre-T-04 content either way. T-08 reads this file and re-derives both sides of the pin.

