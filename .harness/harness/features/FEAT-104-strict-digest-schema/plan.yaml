  - id: D-11
    choice: The step enforcement floor binds by refusing the CREATION of a run state.yaml whose write payload declares schema_version below 2 or omits it, checked on check-domain.sh's existing write-payload path and only when the target file does not yet exist
    because: without a floor REQ-02 is satisfied by prose, since D-06 gates step enforcement on a version the writing agent picks for itself, and keying the refusal on creation leaves every existing version-1 file writable and unrewritten so REQ-08 does not weaken
    dec: none
  - id: D-12
