tasks:
  - id: T-01
    title: Declare the passthrough and documented-optional tables, require adequacy_notes, and document it in the lead block
    traces:
    - REQ-04
    - REQ-07
    - REQ-09
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out, validate-digest.py is the validator being changed
    depends_on:
    - T-10
    status: done
    files:
    - .claude/skills/harness/bin/validate-digest.py
    - tests/integration/test-validate-digest.py
    - tests/integration/fixtures/pre-t04-validate-digest.py.fixture
    - .claude/skills/harness-team/SKILL.md
    - .omp/agents/harness-validator-lead.md
    - .claude/agents/harness-validator-lead.md
    verify: |
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-104-strict-digest-schema
      out=$(python3 tests/integration/test-validate-digest.py) || exit 1
      printf '%s\n' "$out" | grep -q 'ALL PASSED' || exit 1
      printf '%s\n' "$out" | grep -q 'adequacy_notes' || exit 1
      printf '%s\n' "$out" | grep -q 'every documented key is declared' || exit 1
      grep -q 'DOCUMENTED_OPTIONAL' .claude/skills/harness/bin/validate-digest.py || exit 1
      grep -q '^  adequacy_notes:' .claude/skills/harness-team/SKILL.md || exit 1
      F=tests/integration/fixtures/pre-t04-validate-digest.py.fixture
      grep -q 'DOCUMENTED_OPTIONAL' "$F" || exit 1
      if grep -q 'undeclared digest key' "$F"; then exit 1; fi
      python3 .claude/skills/harness/bin/sync-agent-adapters.py --check || exit 1
    intent: |
      This task subsumes the former T-02, which the operator struck under ruling OD-5 on 2026-09-09
      and removed from this plan: the declaration and its documentation land as ONE commit, because a
      lead return omitting adequacy_notes exits 2 from the first of the two onward and this feature's
      own build runs are lead returns.

      PART 1, in .claude/skills/harness/bin/validate-digest.py, beside SCHEMAS (currently lines
      183 to 229), add TWO module-level mappings.

        PASSTHROUGH = {"lead": {"sc_status": list, "needs_approval": bool,
                                "severity_max": set(SEV), "matrix_ok": bool,
                                "coverage_gaps": list}}

      FIVE rows, and no more. A PASSTHROUGH field is OPTIONAL, and that is the difference from SCHEMAS
      on purpose. When PRESENT it is validated exactly as SCHEMAS validates a field of that type or
      enum, reusing the existing field loop rather than a second one. When ABSENT nothing is reported
      and nothing is required.
      READ THAT SECOND SENTENCE LITERALLY, because the loop you are reusing does not behave that way
      today: validate-digest.py line 1190 builds all_fields as schema merged with UNIVERSAL and line
      1197 iterates it treating EVERY member as required-when-absent, with no optional branch at all.
      An optional field - PASSTHROUGH and DOCUMENTED_OPTIONAL alike - is validated only WHEN PRESENT
      and is NEVER reported absent. Adding these tables into all_fields unchanged would make all 21
      optional fields mandatory and reject every conforming return; the reuse is of the per-field type
      and enum checking, not of the required-when-absent sweep. PART 5's omission assertions are what
      hold you to this.
      Write a comment stating why these fields are not in SCHEMAS: a SCHEMAS member is REQUIRED under
      DEC-121, and DEC-216 would then force matrix_ok into every lead's documented output block.
      The five rows are exactly D-02's repaired bar - a documented output block instructs a LEAD to
      carry the field. sc_status is documented in the canonical lead block at
      .claude/skills/harness-team/SKILL.md line 255, needs_approval at
      .omp/agents/harness-product-lead.md line 90, severity_max at
      .omp/agents/harness-validator-lead.md line 135, and matrix_ok and coverage_gaps are documented by
      PART 3 of this task, on the commented passthrough line it adds to the canonical lead block.
      failures, suite and kinds are NOT rows: no lead-facing block instructs them, and being members of
      SCHEMAS qa makes them legitimate on a QA return, which this change does not touch, not on a lead
      roll-up. Do not add them, and do not alter SCHEMAS qa.
      Move sc_status OUT of SCHEMAS lead into PASSTHROUGH lead and delete the prose comment that
      described it as a passthrough, so there is one mechanism rather than a comment.

        DOCUMENTED_OPTIONAL, keyed by RAW agent type, never by the canonical persona

      Same optional-and-typed semantics as PASSTHROUGH, and keyed on the raw type deliberately
      (D-10): the three reviewer agents collapse to the single canonical persona "reviewer" at
      validate-digest.py lines 243 to 244, so only the raw key keeps mode illegal on a security
      review. Read the raw type from the same value line 1341 already reads. The rows, each field
      taken from that agent's own documented DIGEST block:

        harness-code-reviewer:    spec_violations list, human_commits_in_scope list
        harness-security-reviewer: in_scope bool, scope_reason str, threat_model list
        harness-ui-reviewer:      mode {"A","B"}, in_scope bool, states_unspecified list,
                                  contract_violations list, a11y list
        harness-qa:               kinds list, sc_evidence list
        harness-documentor:       stale_found list
        harness-dev-ops:          test_kinds_written list
        harness-visual-designer:  needs_prototype bool, why str, prototype str

      Sixteen distinct field names, and every one of them is instructed by a documented block while
      appearing nowhere in this file today; the persona-by-persona enumeration with its file and line
      anchors is in
      .harness/harness/features/FEAT-104-strict-digest-schema/notes/research-FEAT-104-planfix-c1.md
      Add "prototype" to NULLABLE: its documented value is <path|none>, and NULLABLE is the one
      mechanism DEC-173 established for an inapplicable scalar.

      PART 2, still in validate-digest.py: add "adequacy_notes": list to SCHEMAS lead as a REQUIRED
      field. It is a list of one-line strings naming what the PASS does not cover; an explicit empty
      list is the DEC-121 spelling for none.
      Do NOT add unknown-key rejection in this task. That is T-04, and it lands in its own later
      commit, so the fixture PART 6 vendors carries this task and not that one.

      PART 3, .claude/skills/harness-team/SKILL.md carries the one canonical lead digest block at
      lines 237 to 258 and is the DEC-216 contract source for all three leads
      (tests/integration/test-validate-digest.py lines 311 to 313). Add to that block, at the same
      indentation as the other DIGEST fields so the line begins with exactly two spaces, a field
      adequacy_notes whose example value is a list naming what this PASS does not cover, with the
      annotation that an empty list is used when there is nothing and that it is NEVER omitted.
      Add one sentence of semantics beside the block: adequacy_notes is a qualification on a PASS, it
      means act on nothing but do not read this green as wider than it is. It is not must_fix, which
      gates, and not open_questions, which reaches the user.
      Also add, in the same block, a COMMENTED line - it must begin with a hash so the PART 5 reverse
      parser, which collects a line of exactly two spaces then a lowercase identifier then a colon,
      does not read it as a documented field and demand a declaration for it - naming the five optional
      passthrough fields a lead may carry when rolling a member up: sc_status, needs_approval,
      severity_max, matrix_ok, coverage_gaps. State on it that any OTHER field is rejected from T-04
      onward and belongs in adequacy_notes or in the run state evidence container. This line is what
      documents matrix_ok and coverage_gaps for a lead, which is the ground D-02's repaired bar keeps
      them on.

      PART 4, .omp/agents/harness-validator-lead.md is the CANONICAL role file; .claude/agents is
      GENERATED from it by .claude/skills/harness/bin/sync-agent-adapters.py, which copies the body
      wholesale (sync-agent-adapters.py lines 191 to 226). Edit the .omp file only, then run
      python3 .claude/skills/harness/bin/sync-agent-adapters.py --apply and confirm --check exits 0.
      Two edits at .omp/agents/harness-validator-lead.md lines 135 to 136. First, the existing
      adequacy_notes instruction stays but must now say the field is required of EVERY lead with an
      explicit empty list, not a validator-lead extra. Second, its documented severity_max enum reads
      info|low|med|high|critical, and info is not a member of SEV (validate-digest.py line 36), so the
      documented value is one the validator rejects today: correct info to none.

      PART 5, tests in tests/integration/test-validate-digest.py, each asserted SEPARATELY, never a
      count:
        - a lead return carrying EACH of the five PASSTHROUGH keys with a correct value validates -
          one assertion per key;
        - a lead return carrying severity_max set to the string sever is rejected naming the enum;
        - a lead return OMITTING each PASSTHROUGH key validates - one assertion per key. This is the
          case that reddens on the wrong reading of PART 1's reuse sentence;
        - a lead return omitting adequacy_notes is rejected; one with an empty list validates;
        - for EACH of the sixteen DOCUMENTED_OPTIONAL fields, its own persona's return carrying that
          field with a correct value validates, and carrying it with a wrong-typed value is rejected
          naming the field - one assertion per field, thirty-two assertions;
        - the REVERSE-DIRECTION agreement case (D-12), which is the mechanical assertion that
          documentation and declaration agree: for every persona in the existing CONTRACT_SOURCES map
          (lines 297 to 314), take documented_block for its mapped source, collect every key matching
          a line of exactly two spaces then a lowercase identifier then a colon, and assert that key
          is a member of UNIVERSAL, or headline, or SCHEMAS for the canonical persona, or
          PASSTHROUGH for it, or DOCUMENTED_OPTIONAL for the raw persona. One assertion per persona,
          and the failure message must name the persona, the key and its source path. The ok line for
          this case must contain the literal string: every documented key is declared
        - one value-level assertion beside it: the severity_max enum documented for the leads is a
          subset of set(SEV), which is what PART 4's info correction makes true;
        - demonstrate the reverse case DISCRIMINATES rather than asserting it: with one
          DOCUMENTED_OPTIONAL row temporarily removed in-process, the case must FAIL naming that
          field, and the demonstration is part of the case, not a claim in a note.
      run_documented_contract_cases must PASS at the end of this task - PART 3 is what closes it, and
      that is why the two former tasks are one.

      PART 6, vendor this task's own validator bytes as an INERT FIXTURE. This is what makes SC-06
      falsifiable on behaviour while staying hermetic, and it replaces the commit-id pin an earlier
      draft carried: this suite already removed that mechanism once, at
      tests/integration/test-validate-digest.py lines 30 to 33 and 2866 to 2869, because a shallow CI
      checkout carries no history to resolve a pinned id against. Do not reintroduce it. Follow the
      mechanism that is there.
      After PARTS 1 to 5 are written and the verify passes, copy the CURRENT content of
      .claude/skills/harness/bin/validate-digest.py - post-PART-2, pre-T-04 - byte for byte into
      tests/integration/fixtures/pre-t04-validate-digest.py.fixture, using the Write tool
      (bash-write-guard.sh denies a shell copy). The .fixture suffix is load-bearing and is the same
      one the existing prior-validate-digest.py.fixture uses: code_grade._changed_python_files never
      selects a non-.py path, so the vendored bytes are inert data rather than a second copy of the
      validator entering the graded set.
      Commit PARTS 1 to 6 as ONE commit. No second commit and no commit id is needed anywhere: the
      fixture is proven to be the right revision by its own CONTENT, which this task's verify asserts
      and T-08's case asserts again - it CONTAINS DOCUMENTED_OPTIONAL, so this task is in it, and does
      NOT contain the literal undeclared digest key, so T-04 is not. If you ever find both true, the
      fixture was taken after T-04 and is wrong; retake it, never weaken the assertion.

