  - id: T-04
    title: Reject unknown digest keys with a one-shot actionable message
    traces:
    - REQ-01
    - REQ-04
    - REQ-05
    - REQ-06
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out, validate-digest.py is the validator being changed
    depends_on: [T-01, T-03]
    status: ready
    files:
      - .claude/skills/harness/bin/validate-digest.py
      - tests/integration/test-validate-digest.py
    verify: |
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-104-strict-digest-schema
      out=$(python3 tests/integration/test-validate-digest.py) || exit 1
      printf '%s\n' "$out" | grep -q 'ALL PASSED' || exit 1
      printf '%s\n' "$out" | grep -q 'undeclared digest key' || exit 1
      grep -q 'undeclared digest key' .claude/skills/harness/bin/validate-digest.py || exit 1
    intent: |
      In validate-digest.py's validate(), after the existing required-field loop, compute the legal
      key set for the return: UNIVERSAL, plus headline, plus SCHEMAS for the canonical persona, plus
      PASSTHROUGH.get(canonical, {}), plus DOCUMENTED_OPTIONAL.get(raw_persona, {}), plus the reviewer
      inline extension code_grade, reviewed and grade_2_reasons where it already applies. Every DIGEST
      key at the block's own base indent that is not in that set is a contract violation.
      The DOCUMENTED_OPTIONAL term is load-bearing and is not optional to include: without it every
      conforming return from harness-code-reviewer, harness-security-reviewer, harness-ui-reviewer,
      harness-qa, harness-documentor, harness-dev-ops and harness-visual-designer exits 2, because
      each of those seven agents' own documented DIGEST block instructs fields this file did not
      declare before T-01 (sixteen of them, enumerated in
      .harness/harness/features/FEAT-104-strict-digest-schema/notes/research-FEAT-104-planfix-c1.md).
      Report ALL offending keys in ONE error entry, never the first only. The message must carry, for
      the whole set: the offending key names; the literal phrase undeclared digest key so a check can
      find it; the sentence that the digest contract is closed; and the declaration route by name -
      a lower tier's field riding up a lead roll-up is declared in PASSTHROUGH in
      .claude/skills/harness/bin/validate-digest.py, a field a persona's own documented output block
      instructs is declared in DOCUMENTED_OPTIONAL in the same file, a persona's own new REQUIRED
      field is declared in SCHEMAS in the same file and must also be documented in that persona's
      output block under DEC-216, and a per-dispatch answer is not a digest key at all and goes to
      adequacy_notes or the run state steps evidence container.
      Do not use the phrase unknown key as the message literal: validate-digest.py already contains
      unknown keys are ignored in a comment (two occurrences today), so a check greping for it cannot
      tell the new message from the old comment.
      Why one message: validate-digest.py line 1744 is the stop_hook_active early return, read on
      2026-09-09 as a guard returning 0 when that payload key is set, so a re-prompted return is NOT
      revalidated and strictness gets exactly one shot. A message naming one key of three sends the
      second attempt out unvalidated with two violations still in it. D-07 keeps that passthrough
      open. Do NOT touch the stop_hook_active branch, and add this check AFTER it, never before -
      SC-09 is what pins that ordering.
      Tests, each asserted separately:
        - one unknown key on a lead return exits 2 and names it;
        - the same for each persona key in SCHEMAS - pm, dev, qa, reviewer, visual-designer,
          documentor, dev-ops, lead, orchestrator;
        - for EACH of the sixteen raw personas in CONTRACT_SOURCES, a return carrying its documented
          block's FULL field set - every key that block instructs, not a minimal valid payload -
          exits 0. One assertion per persona. A minimal payload is what made this defect invisible in
          cycle 0, so the fixture must be built from the documented block, not hand-written;
        - three unknown keys on one return produce ONE error naming all three;
        - the message contains the literal substrings PASSTHROUGH, DOCUMENTED_OPTIONAL and SCHEMAS;
        - the same three-unknown-key payload with stop_hook_active set exits 0.

  - id: T-05
    title: Declare the closed step shape and the evidence container
    traces: [REQ-02, REQ-03, REQ-08]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out by category, this file is the data two gate scripts enforce
    depends_on: [T-03]
    status: ready
    files:
      - .claude/skills/harness/bin/run-state-schema.json
      - .claude/skills/harness-team/SKILL.md
    verify: |
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-104-strict-digest-schema
      python3 -c "
      import json
      p = json.load(open('.claude/skills/harness/bin/run-state-schema.json'))['properties']['steps']['items']
      assert p['additionalProperties'] is False, 'additionalProperties must be false'
      want = {'id','persona','task','seq','depends_on','outputs','mutates_repo','on_fail',
              'status','verdict','lead_verdict','cycles','max_cycles','redispatches',
              'dispatched_at','completed_at','redispatched_at','recompleted_at',
              'routed_by','note','artifact','evidence'}
      got = set(p['properties'])
      assert got == want, 'symmetric difference: ' + repr(sorted(got ^ want))
      assert 'evidence' in p['properties']
      "
      grep -q 'schema_version: 2' .claude/skills/harness-team/SKILL.md || exit 1
    intent: |
      Create .claude/skills/harness/bin/run-state-schema.json, modelled on the sibling
      feature-schema.json (the DEC-191 precedent), describing a run state.yaml.
      The steps items object carries additionalProperties false and exactly these 22 properties:
        id, persona, task, seq, depends_on, outputs, mutates_repo, on_fail,
        status, verdict, lead_verdict, cycles, max_cycles, redispatches,
        dispatched_at, completed_at, redispatched_at, recompleted_at,
        routed_by, note, artifact, evidence
      Required per step: id and status. Give each property a description naming its reader, as
      feature-schema.json does.
