      SC-09 is what pins that ordering.
      Tests, each asserted separately:
        - one unknown key on a lead return exits 2 and names it;
        - the same for each persona key in SCHEMAS - pm, dev, qa, reviewer, visual-designer,
          documentor, dev-ops, lead, orchestrator;
        - for EACH of the sixteen raw personas in CONTRACT_SOURCES, a return carrying its documented
