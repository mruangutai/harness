    verify: |
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-104-strict-digest-schema
      out=$(python3 tests/integration/test-validate-digest.py) || exit 1
      printf '%s\n' "$out" | grep -q 'ALL PASSED' || exit 1
      printf '%s\n' "$out" | grep -q 'undeclared digest key' || exit 1
