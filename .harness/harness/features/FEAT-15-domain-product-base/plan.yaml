      Then extend the T12 fixture helper so a fixture root may optionally carry
      .harness/factory/fleet.yaml, and add a run_fleet() group of cases asserting, in this order:
      (a) a fixture with NO fleet file - a write the agent owns exits 0, and a path under an arbitrary
      absolute directory outside the fixture exits 0; (b) a fixture whose fleet.yaml is broken YAML -
      the SAME write the agent owns, inside the fixture root, exits 2 and stderr contains fleet.yaml;
