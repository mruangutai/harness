    title: Resolve the fleet declaration once per invocation, and separate absent from unreadable
    traces: [REQ-03, REQ-04]
    change_type: cross_module
    test_kinds: [unit, integration]
    execution_mode: main-session-direct
    execution_reason: carve-out (check-domain.sh is named in CLAUDE.md's DEC-174 list)
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/check-domain.sh
      - .claude/skills/harness/bin/test-check-domain.py
    verify: |
      python3 .claude/skills/harness/bin/test-check-domain.py
    intent: |
      In check-domain.sh's Python heredoc, inside domain_check(), add a fleet resolution step. Place
      it immediately after the manifest_domains try/except block that produces globs and shared, and
      BEFORE the outside-root branch whose body is the bare return following the comment that begins
      OUTSIDE THE REPO IS NOT A DOMAIN QUESTION. It runs exactly once per hook invocation, for every
      governed write, whatever the target looks like.

      Step 1, existence. fleet_path = os.path.join(root, ".harness", "factory", "fleet.yaml"). If
      os.path.exists(fleet_path) is False, set workspace_root to None and workspace_bases to an empty
      list and fall through with no further work: a project with no factory has no second base and
      keeps today's behaviour exactly. Import nothing in this case.

      Step 2, import. Only when the file exists, import factory_config lazily inside the function,
      wrapped in contextlib.redirect_stderr(io.StringIO()) for the duration of the import statement
      only. Measured: with CLAUDE_PROJECT_DIR set to a directory holding no docs/harness/SPEC.md, the
      import prints a discard notice to stderr and would reach the agent on every governed write from
