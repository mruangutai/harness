      Step 3, load. Call factory_config.load_fleet(fleet_path) with the explicit path. Never read
      factory_config.FLEET_PATH - it is computed at import time from that module's own root probe,
      which is not this hook's root probe. Catch factory_config.FleetError, harness_yaml.YamlParseError
      and ImportError. On any of them print to stderr, then sys.exit(2):
        check-domain: BLOCKED - the fleet declaration does not load, so no product path can be
        identified.
        <fleet_path>
        <the exception text>
        Enforcement is CLOSED rather than partial: the value that identifies product paths is the one
