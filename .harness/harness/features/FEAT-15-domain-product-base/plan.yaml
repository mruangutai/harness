      The --resolve branch exits before domain_check() and carries its own root derivation, its own
      manifest load and its own call to matches() over _cands, so T-02's change does not reach it.
      Left alone, the plan checker would keep reporting that a persona owns a base the hook now
      refuses - the build-time discovery that checker exists to prevent.

      In the --resolve branch, after the manifest is parsed and before the roster walk, resolve the
      fleet with the SAME four steps T-01 added, against the root this branch derived. Factor T-01's
      resolution into a module-scope function taking a root and returning (workspace_root,
      workspace_bases) and call it from both places rather than writing it twice - it is the same
      rule and D-01's reason applies to it too. This branch already exits 2 on an unreadable
