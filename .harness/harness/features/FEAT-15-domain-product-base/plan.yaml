    verify: |
      python3 .claude/skills/harness/bin/test-check-domain.py
      python3 .claude/skills/harness/bin/check-plan-routes.py
    intent: |
      The second verify command is the tree-wide, no-argument invocation - the one the integration CI
      job runs as a required check on main (DEC-183). It must report 0 violation(s) and exit 0 after
      this task lands. Do not scope it to this plan: the whole point of the ruling's four named
      entries is that FEAT-12 T-12 and T-14 and FEAT-14 T-09 and T-10, whose files are docs/harness
      paths and README.md, keep resolving to harness-documentor. If any of them reports VIOLATION, the
