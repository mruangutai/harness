decisions:
  - id: D-01
    choice: >-
      Classification is TARGET-KEYED, not glob-keyed, and two-sided. In the harness base every glob is
      matched, control-plane and product alike, and a match is accepted only if the base-relative
      target is control-plane - its first path segment is .harness or .claude, or it matches one of
      the four named harness entries. In the product base, globs whose first segment is .harness or
      .claude are excluded and the rest match normally; the four named entries play no part there.
      Both tests live in module-scope helpers that the hook path and the resolve path call.
    because: >-
      a glob-keyed classifier cannot express the ruling at all - the manifest grants docs/** and holds
      no docs/harness/** entry, so two of the four named entries have nothing to match against - and
      two copies of the rule would drift the way the plan checker and the hook would then disagree
    dec: none
  - id: D-08
    choice: The four named harness control-plane entries are a literal constant inside check-domain.sh, matched against the base-relative target with the existing glob_to_re and matches idiom, and are not manifest data.
    because: ruling 1 forbids a team-config.yaml schema change, and the operator ruled out machinery to detect an omitted future entry, so the cost is one remembered place rather than a grammar every entry carries
    dec: none
  - id: D-02
    choice: The fleet declaration is read once per hook invocation, at the top of the domain check, before the outside-root branch and before any glob is matched.
    because: ruling 3 closes on every write, so a read gated on the target looking like a workspace path would skip the closure for in-root writes
    dec: none
  - id: D-03
    choice: An absent fleet file is distinguished from an unreadable one by an explicit existence test taken before the load.
    because: harness_yaml.load_file wraps OSError into YamlParseError, so without it a project with no factory is bricked by the same branch that closes on a corrupt file
    dec: none
  - id: D-04
    choice: The hook passes an explicit fleet path built from its own resolved root and never reads factory_config.FLEET_PATH.
    because: FLEET_PATH is computed at import time from factory_config.harness_root(), whose probe is docs/harness/SPEC.md while the hook's is .harness/team-config.yaml, so under a fixture root it names the live repo
    dec: none
  - id: D-05
    choice: factory_config is imported lazily, only after the existence test passes, with stderr captured for the duration of the import.
    because: the import evaluates harness_root() and prints a CLAUDE_PROJECT_DIR discard notice, and a top-level import would break DEC-101's isolated-copy fail-open the way the harness_yaml import once did
    dec: DEC-101
  - id: D-06
    choice: The checkout path for a declared repository is obtained by calling factory_config.workspace_path(fleet, name) for each entry in the fleet's repos list.
    because: that function is the one place the workspace_root-plus-name-after-owner derivation exists, and restating it is how two copies start disagreeing
    dec: none
  - id: D-07
    choice: The resolve path gets the same base treatment as the hook path in the same feature, not later.
    because: a resolver that still grants a base the hook refuses is exactly the build-time discovery check-plan-routes.py exists to prevent
    dec: DEC-183

tasks:
