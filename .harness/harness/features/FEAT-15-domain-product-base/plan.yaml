      repository, print the literal token NOBODY and exit 0: it is refused for everyone, and silence
      here is the fail-open this branch exists to remove.

      In test-check-domain.py add resolve-path cases run through the acme/widget fixture with
      CLAUDE_PROJECT_DIR set to the fixture root and stdin closed: --resolve on
      <workspace>/widget/src/main.py names the persona granted src/**; --resolve on <root>/src/main.py
      prints NOBODY; --resolve on a path under workspace_root in an undeclared directory prints
      NOBODY. Assert on the exact stdout tokens, not on the exit code alone.

      Add one further resolve case against the LIVE root rather than a fixture, because it is what
      guards the tree-wide check in this task's verify: --resolve on docs/harness/SPEC.md names
      harness-documentor. Under a glob-keyed rule it would print NOBODY, which is precisely the defect
      that would redden CI.

  - id: T-05
    title: Record the two-base rule, the accepted risk, and what it revoked
    traces: [REQ-08]
    change_type: docs
    test_kinds: []
    execution_mode: main-session-direct
    execution_reason: no build squad is spawned on this feature; the record of a ruling is the operator's own
    depends_on: [T-04]
    status: done
    files:
      - docs/harness/DECISIONS.md
      - docs/harness/DECISIONS-INDEX.md
    verify: |
      python3 .claude/skills/harness/bin/gen-decisions-index.py --stdout | diff - docs/harness/DECISIONS-INDEX.md
    intent: |
      Add one decision entry to docs/harness/DECISIONS.md recording, in the document's own voice and
      without narrating this feature:

      (1) The write guard resolves a target against two bases: the harness checkout, and the checkout
      of a repository declared in the fleet under the factory's workspace root. Which base applies is
      decided from the TARGET, not from the manifest entry, and the rule is two-sided. In the harness
      checkout every entry is matched and a match is accepted only when the base-relative target is
      control plane - its first path segment is .harness or .claude, or it is one of four named
      harness paths: docs/harness/**, docs/PRINCIPLES.md, README.md and .github/**. In a product
      checkout, entries whose first segment is .harness or .claude are excluded and the rest apply
      normally; the four named paths are not consulted there, so a product repository keeps its own
      readme, docs and CI. There is no manifest schema change.
      (2) The accepted risk, stated so it is not rediscovered as a defect: this is one more place to
      remember. A harness-owned path beginning with neither of those two segments and absent from the
      four named paths is treated as a product path. A per-entry base tag, a two-list split and a
      value-level prefix marker were each offered and declined, because each changes the grammar every
      future entry must carry. No detection machinery is added; the omission is accepted, not fixed.
      (3) A path under the workspace root belonging to no declared repository is refused; a fleet
      declaration that exists and cannot be read closes every write, because the value that identifies
      product paths is the one that failed; an absent declaration changes nothing; and a path outside
      both bases still receives no verdict.
      (4) Which harness-repo paths lost a route as a consequence, stated precisely rather than
      generally. NO live harness file loses one: the four named paths carry harness's own docs, its
      constitution, its readme and its CI, which is why they were named. What does lose a route is the
      shared block - all eight entries are dependency manifests and lockfiles, package.json,
      package-lock.json, pnpm-lock.yaml, yarn.lock, pyproject.toml, uv.lock, requirements.txt and
      tsconfig.json - none of which is control plane, so in the harness checkout each stops being a
      serialized allow and becomes a refusal. The consequence is latent: none of those eight files
      exists in the harness repository, and adding one would need it named the way the four are. State
      the empty live set explicitly; do not omit it, and record the sha the tree was observed at,
      because it rests on nothing in docs/ sitting outside docs/harness/ except docs/PRINCIPLES.md.

      Then regenerate docs/harness/DECISIONS-INDEX.md with gen-decisions-index.py and hand-write the
      right-hand side of the new row. There is no --check flag: the verify command pipes the
      read-only mode into diff, and any output means the row and the entry disagree.
