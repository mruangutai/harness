      their first segment is neither .harness nor .claude and they are none of the four named harness
      entries, so T-02 refuses them in the harness base. Add one control-plane entry to
      FIXTURE_MANIFEST's domain list:
        - { path: .harness/allowed/**, upsert: true }
      Leave allowed/** in place - it is granted today, it stays granted for product bases, and
      deleting it would remove the only product-shaped glob the shared fixture carries. Then repoint
