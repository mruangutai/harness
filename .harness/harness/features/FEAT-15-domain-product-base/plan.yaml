  - id: T-02
    title: Select the base from the target and give the outside-root branch a verdict for product paths
    traces: [REQ-01, REQ-02, REQ-05, REQ-06]
    change_type: cross_module
    test_kinds: [unit, integration]
    execution_mode: main-session-direct
    execution_reason: carve-out (check-domain.sh is named in CLAUDE.md's DEC-174 list)
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/check-domain.sh
      - .claude/skills/harness/bin/test-check-domain.py
    verify: |
      python3 .claude/skills/harness/bin/test-check-domain.py
    intent: |
      The classifier is TARGET-KEYED, not glob-keyed. A glob-keyed classifier cannot express the
      ruling: .harness/team-config.yaml grants harness-documentor docs/** and holds no docs/harness/**
      entry anywhere, so there is nothing for two of the four named entries to match against. Build
      the two-sided rule below exactly.

      Add to check-domain.sh, at module scope beside glob_to_re and matches so both the hook path and
      the resolve path can call them:

      HARNESS_CONTROL_PLANE = ["docs/harness/**", "docs/PRINCIPLES.md", "README.md", ".github/**"] -
      a closed literal list, the operator's verbatim four. Do not widen docs/harness/** to docs/**
      and do not add a fifth entry.

      def is_control_plane_glob(pat): strip a leading "./" and any leading "/", take the text before
      the first "/", return True when it is exactly ".harness" or ".claude", else False.

      def is_control_plane_target(rel): return True when is_control_plane_glob(rel) is True, or when
      matches(rel, e) is True for any e in HARNESS_CONTROL_PLANE. Match anchored with the existing
      glob_to_re and matches idiom against the base-relative path, so README.md means the
      repository-root readme and never docs/README.md, and .github/** never matches vendor/.github/x.

      In domain_check(), replace the outside-root branch - the one whose body is a bare return, under
      the comment beginning OUTSIDE THE REPO IS NOT A DOMAIN QUESTION - with a base selection over the
      absolute target. Keep the existing containment idiom: os.path.commonpath over abspaths, never a
      string prefix, so a path reached through .. that resolves back inside still lands in the right
      base. Four outcomes, in this order:

      (1) target inside root - the HARNESS base. Keep the existing rel computation, the worktree strip
      and the rel_candidates list unchanged. Applicable globs are ALL of globs and applicable shared is
      ALL of shared - nothing is filtered on the glob side here. A match is accepted only for a
      rel_candidate for which is_control_plane_target(rel) is True; for any other rel_candidate the
      match is discarded and the outcome is the ordinary refusal. Apply the same acceptance test to
      the shared list, so a shared entry only serializes a control-plane target.
      (2) target inside one of workspace_bases, the longest matching base wins - the PRODUCT base. rel
      is relpath of the target against that base and the same worktree strip is applied to it.
      Applicable globs are the globs for which is_control_plane_glob is False, applicable shared is
      the shared entries for which it is False. HARNESS_CONTROL_PLANE plays NO part on this side: it
      is target-side only, and consulting it here would refuse a product checkout's own README.md.
      (3) workspace_root is not None and the target is inside workspace_root but inside none of
      workspace_bases: print to stderr and sys.exit(2):
        check-domain: BLOCKED - <target> is under the factory workspace but belongs to no repository
        declared in <fleet path>.
        A checkout there for an unlisted repository is stale or a mistake. Add the repository to
        repos in that file, or remove the directory.
      (4) anything else: return with no verdict, unchanged. /tmp, /var/folders and unrelated
      checkouts keep exactly today's behaviour.

      Three cases must hold when you are done, and they are the whole rule: with src/** granted,
      <root>/src/main.py is REFUSED and <workspace>/<repo>/src/main.py is PERMITTED; with
      .harness/expertise/** granted, <root>/.harness/expertise/x.md is PERMITTED and
      <workspace>/<repo>/.harness/expertise/x.md is REFUSED; with docs/** granted,
      <root>/docs/harness/guide.md is PERMITTED and <workspace>/<repo>/docs/guide.md is PERMITTED.

      The permitted and shared matching below the branch, and the actionable rejection message, are
      otherwise unchanged. The Permitted for you line must not advertise globs that cannot grant
      anything in the base that was selected: in the product base it lists the agent's
      non-control-plane globs, and in the harness base it must not list globs that no control-plane
      target could satisfy. How that line is composed is yours; SC-12 reads the emitted stderr.

      In test-check-domain.py, add a fixture whose fleet declares a repository whose name is NOT
      harness - use acme/widget with a workspace_root inside the same tempdir - and assert as one
      paired group: a persona granted src/** may write <workspace>/widget/src/main.py (exit 0) while
      a persona not granted it is refused the same path (exit 2); and a path under workspace_root in
      a directory named for no declared repository exits 2 with fleet in the stderr. Nothing needs to
      exist on disk under the workspace: the branch is a path comparison, not a stat.

      The shared list has a consequence worth naming rather than discovering: all eight entries in the
      manifest's shared block are dependency manifests and lockfiles - package.json, pyproject.toml,
      uv.lock and the rest - none has a control-plane first segment and none is among the four named
      entries, so in the harness base every one of them stops being serialized-allow and becomes a
      refusal. No such file exists in this repo today, so nothing live breaks, but the test case does.

      Exactly ONE existing EXPECTATION changes, against the live manifest: the case named a shared
      path is allowed and serialized, asserting <ROOT>/package.json exits 0, becomes exit 2, for the
      reason in the paragraph above. Update the case and its comment to say why.

      The case named documentor writing docs/, which asserts harness-documentor writing
      <ROOT>/docs/harness/guide.md exits 0, KEEPS exit 0 - docs/harness/** is one of the four named
      entries. Do not flip it. Likewise, in run_resolve() under the comment beginning (g)+(h) THE HOOK
      PATH IS UNCHANGED, the case named (h) no --resolve: an in-domain Write still exits 0 keeps both
      its path, docs/harness/SPEC.md, and its expectation. Neither needs repair.

      The two fixture assertions granted by FIXTURE_MANIFEST's allowed/** were already repointed in
      T-01, along with the control-plane entry that grants their new paths. Do not repeat that work
      and do not change their expectations either.

      Any other existing case whose expectation you find yourself changing is a regression - stop and
      report it.

  - id: T-03
    title: Assert the mirror-image bug is absent in both directions and the four named entries hold in both bases
    traces: [REQ-06]
    change_type: cross_module
    test_kinds: [unit, integration]
    execution_mode: main-session-direct
    execution_reason: rides with the carve-out file it tests (DEC-174)
    depends_on: [T-02]
    status: done
    files:
      - .claude/skills/harness/bin/test-check-domain.py
    verify: |
      python3 .claude/skills/harness/bin/test-check-domain.py
    intent: |
      Add three paired assertion groups to test-check-domain.py, each using the acme/widget fixture
      built in T-02. Each pair must be asserted from ONE fixture and ONE manifest, because either
      half alone is also what a broken guard produces.

      Pair A, the product half. Fixture manifest grants harness-documentor exactly one writable path,
      src/**. Assert that writing <root>/src/main.py exits 2 - a product-shaped glob must not match
      inside the harness repo - AND that writing <workspace>/widget/src/main.py exits 0. A guard that
      simply widened both bases passes the second and fails the first.

      Pair B, the control-plane half. Fixture manifest grants harness-documentor exactly one writable
      path, .harness/expertise/**. Assert that writing <root>/.harness/expertise/x.md exits 0 AND
      that writing <workspace>/widget/.harness/expertise/x.md exits 2 - a control-plane glob must not
      match inside a product checkout, even though a product repository could contain a directory of
      that name.

      Pair C, the both-bases half - the four named entries, and the only place the PRODUCT side of the
      ruling is checked at all. Build a THIRD fixture manifest for this pair, because neither
      FIXTURE_MANIFEST nor Pair A's and Pair B's manifests carry the globs it needs: grant one persona
      docs/** and README.md, and a second persona .github/**. Use the same acme/widget fleet so the
      fixture has both bases. Assert, all from that one manifest:
      - in the harness base: <root>/docs/harness/guide.md exits 0, <root>/docs/PRINCIPLES.md exits 0,
        <root>/README.md exits 0, <root>/.github/workflows/tests.yml exits 0 for the .github persona,
        and <root>/docs/guide.md exits 2 FOR THE PERSONA GRANTED docs/** - the same persona that is
        permitted <root>/docs/harness/guide.md above, never the .github persona. A harness path
        matched by docs/** but under none of the four named entries must be refused, and that last
        assertion is what proves docs/harness/** was not widened to docs/**. Fired against a persona
        that was never granted docs/** it exits 2 for the wrong reason and passes under exactly the
        rule it exists to catch, so the persona is part of the assertion.
      - in the product base: <workspace>/widget/README.md exits 0 and
        <workspace>/widget/docs/guide.md exits 0 for the docs persona, and
        <workspace>/widget/.github/workflows/ci.yml exits 0 for the .github persona. These three are
        the assertions nothing else in this feature covers: the routing measurement behind the
        ruling models in-harness resolution only and cannot see a product-side regression.
      Assert the harness-base and product-base halves in the SAME group from the SAME manifest, so a
      rule that consulted the four named entries on the product side, or that dropped them from the
      harness side, fails here rather than shipping.

      Name each assertion for the direction it protects, so a later reader can tell from the failure
      text which half of the mirror image broke. Register all three groups in the file's runner and
      summary.

  - id: T-04
    title: Give the resolve path the same base treatment as the hook path
    traces: [REQ-07]
    change_type: cross_module
    test_kinds: [unit, integration]
    execution_mode: main-session-direct
    execution_reason: carve-out (check-domain.sh is named in CLAUDE.md's DEC-174 list)
    depends_on: [T-02]
    status: done
    files:
