      Do not call harness_yaml.require_or_bootstrap here and do not consume its grant: that escape
      exists for a missing PyYAML, not for a malformed file.

      Step 4, success. Set workspace_root = fleet["workspace_root"] and workspace_bases to the list of
      os.path.abspath(factory_config.workspace_path(fleet, entry["name"])) for every entry in
      fleet["repos"]. Both names are consumed by T-02; this task leaves the outside-root branch
