decisions:
  - id: D-01
    choice: 'INV-17''s only discriminator is the frozen baseline: the fifth section is demanded of a persisted note whose repo-relative path is absent from the frozen list handoff_done_when_baseline in .harness/harness.json (141 paths, the notes tracked at b7956fc4 that lack the section), and is not demanded of a note whose path IS in that list. When the section is present, whoever wrote it, the persisted pass checks block shape and pointer GRAMMAR, never target resolution. On the write-time versus persisted split this decision decides nothing and defers to D-10.'
    because: a frozen path list needs no git history, so the answer cannot change with clone depth the way a git-log discriminator does in a depth-1 CI checkout; failure mode is a dead entry after a note is renamed, which exempts nothing; a historical note someone later edits is refused by the write gate until it gains the section, so it can only leave the historical set by becoming compliant; what each pass checks once the section is present is D-10's ruling, not this one's, and is deferred to it by id.
    dec: none
  - id: D-02
    choice: 'one implementation of block parsing and pointer resolution, a new module .claude/skills/harness/bin/handoff_done_when.py, imported by check-domain.sh and check-state.sh'
    because: 'DEC-179 priced a second matcher that drifts from the first; two gates asking the same question must ask the same code'
    dec: DEC-179
  - id: D-03
    choice: 'resolution semantics, one clause per type. plan-task:T-NN.verify resolves against the note feature dir plan.yaml when a task with that id exists and its verify value is a non-empty string. brief-sc:SC-NN resolves against that dir BRIEF.md when a line begins with the SC id followed by a colon. finding:PATH-HASH-ID takes a repo-relative path and resolves when the file exists and some line carries the id as a whole token, id matching F-NN or PF-NNNN. approval:PATH-HASH-HEADING takes a repo-relative path and resolves when a markdown heading whose text case-insensitively equals the heading exists. Anything else is an unknown type and is refused'
    because: 'the feature dir is derivable from the note own path, so resolution needs no configuration; an absent target file is unresolved rather than skipped, which is the whole point of real resolution'
    dec: none
  - id: D-04
    choice: 'the comprehension benchmark is persisted as .claude/skills/harness/bin/probe-handoff-comprehension.py and registered in .harness/harness.json test_kinds as handoff_comprehension with status locally_run, in neither UNIT_SCRIPTS nor INTEGRATION_SCRIPTS and absent from test_matrix'
    because: 'run-unit-tests.sh requires every probe under bin to be declared in exactly one locally_run kind, so persisting it unregistered exits 2; locally_run keeps it rerunnable at review without making a nondeterministic model run a release gate'
    dec: DEC-201
  - id: D-05
    choice: 'refusal messages keep the existing register: the head line stays handoff shape (DEC-159), each problem names the rule, the count or pointer that broke it, and templates/HANDOFF.md'
    because: 'the existing handoff and CLAUDE.md messages already explain the rule and name the template, and DEC-100b requires naming the offending item rather than leaving the author to guess'
    dec: DEC-100b
  - id: D-06
    choice: 'the new test file .claude/skills/harness/bin/test-handoff-done-when.py joins UNIT_SCRIPTS only, and is not added to test_kinds.integration.detect'
    because: 'it spawns no subprocess, and run-unit-tests.sh KIND-DRIFT fails when a UNIT_SCRIPTS name appears in integration.detect'
    dec: none
  - id: D-07
    choice: 'DEC-159 is amended in place to state five sections and the amendment is recorded as a new decision at the next free id, 212 at b7956fc4'
    because: 'a signed decision that still says four sections would contradict the gate that enforces five, and the amendment needs its own citable id'
    dec: none

  - id: D-08
    choice: 'a handoff note written during this feature''s own build is a NEW note: it carries the five-section contract like any other, it is NEVER added to handoff_done_when_baseline, and the baseline stays exactly the 141 notes tracked at the feature''s base commit b7956fc4 (git merge-base main HEAD). Notes written between that base commit and the landing of T-04 escape the write gate, so T-11 brings each of them into compliance before review_sha is pinned'
    because: 'the operator settled that untouched historical handoffs remain valid AND that every newly written or edited handoff must use the five-section contract (grilling line 16); widening the baseline to cover this build''s own notes would exempt the first notes ever written under the new contract, and leaving them non-compliant would redden the corpus scan T-07 adds, for a planning reason no code fix addresses'
    dec: none
  - id: D-10
    choice: 'pointer TARGETS are resolved at write time only: check-domain.sh calls handoff_done_when.problems(..., resolve=True) and checks section presence, block shape, pointer grammar AND target resolution; check-state.sh (INV-17) calls the same single implementation with resolve=False and checks section presence against the frozen baseline, block shape and pointer GRAMMAR only — the authority prefix is one of the four legal types and the pointer is well formed for that type — and never opens a target. One module, one parser, one pointer grammar (DEC-179); resolve gates nothing but whether a target file is opened'
    because: 'the operator ruled at the batched signature review of 2026-09-02, on finding PF-4205e7e2, that a standing re-resolution over the persisted corpus is a rot vector: a later BRIEF repair that renumbers an SC reddens an untouched, previously valid note and forces the very edit the frozen baseline exists to prevent, while the grilling settled resolution at write time only. Pointer GRAMMAR stays in the persisted pass because a typed prefix consults no target and therefore cannot rot, and a note whose authority is outside the four legal kinds must still be caught there. The operator ruled at the same batched signature review of 2026-09-02, on finding PF-bd92960a, that the typed pointer grammar — the four authority types and the id format of each — is a STABLE CONTRACT: the persisted pass validates grammar only and never target existence, and any future rename or narrowing of an authority type or of an id format is an explicit versioned contract change made by the feature that makes it, not machinery this feature builds. The operator also confirmed (Q3) that grammar validation IS part of the persisted shape validation. This clause is a record of the ruling and adds no mechanism, no task, no criterion and no grammar-versioning machinery, which stays out of scope'
    dec: DEC-179

tasks:
  - id: T-01
    title: Write the failing unit test for the Done when module
    traces: [REQ-02, REQ-03, REQ-04, REQ-05, REQ-06]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: 'DEC-174 — the test of gate logic imported by check-domain.sh and check-state.sh'
    depends_on: []
    status: ready
    files:
      - .claude/skills/harness/bin/test-handoff-done-when.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      cd "$CLAUDE_PROJECT_DIR" && out=$(python3 .claude/skills/harness/bin/test-handoff-done-when.py 2>&1); rc=$?
      test "$rc" -ne 0 && printf '%s\n' "$out" | grep -q handoff_done_when
    intent: |
      Create .claude/skills/harness/bin/test-handoff-done-when.py, a stdlib-only self-checking
      script in the style of the other test-*.py files in that directory (named cases, one
      printed line per case, exit 1 on any failure), and register its basename in
      run-unit-tests.sh UNIT_SCRIPTS. Do NOT add it to test_kinds.integration.detect: it spawns
      no subprocess and KIND-DRIFT fails if a UNIT_SCRIPTS name appears there.

      It tests a module that does not exist yet, .claude/skills/harness/bin/handoff_done_when.py,
      imported as `import handoff_done_when` after inserting its own directory on sys.path. The
      module's contract, which this test pins:

        problems(rel_path, text, root, resolve) -> list[str]
          rel_path  repo-relative path of the handoff note
          text      the note's full text
          root      absolute repository root
          resolve   True: each pointer's TARGET is opened and must exist. False: section
                    presence, block shape and pointer GRAMMAR only, and NO target file is
                    opened at all (D-10)
          returns   [] when the note's Done when block is well formed and, under resolve=True,
                    every pointer resolves; otherwise one message per problem

      Cases required, each asserting on the RETURNED MESSAGES and not on source text:
      (a) a note with the four historical headings and no "## Done when" section returns exactly
          one message naming "## Done when" and templates/HANDOFF.md;
      (b) a well formed block (one Scope: line, one Authority: line whose pointer resolves)
          returns [];
      (c) zero Scope: lines, two Scope: lines, zero Authority: lines, five Authority: lines, and
          a non-blank line that is neither Scope: nor Authority: each return a message naming the
          count or the offending text — five separate cases, five separate assertions;
      (d) for EACH of the four pointer types, WITH resolve=True, a resolving pointer returns []
          and an unresolvable pointer of the SAME type returns a message naming that pointer —
          eight assertions, built over a temporary fixture repo laid out as
          <tmp>/.harness/harness/features/FEAT-90-fixture/ with plan.yaml (a task T-03 carrying a
          non-empty verify), BRIEF.md (a line beginning "- SC-04:"), notes/review-fixture.md
          (a line carrying the token F-02) and BRIEF.md's "## Approval" heading. Assert per type;
          a single aggregate count would be satisfied by three types resolving and one not;
      (e) TWO refusals of an authority outside the four types, asserted separately: an Authority:
          line whose prefix is none of the four ("Authority: docs:whatever") returns a message
          saying so and listing the four legal prefixes; and an Authority: line carrying a BARE
          SOURCE-CODE LOCATION ("Authority: check-domain.sh:1523") returns the same refusal, so
          "a source-code location alone is not an authority" (REQ-04) is observed and not assumed;
      (f) AND semantics, distinguished from ANY observably: four authorities all resolving returns
          [], proving the maximum is accepted, and the SAME block with exactly one of those four
          made unresolvable returns exactly one message, naming that pointer — a three-of-four
          block must be REFUSED, which is what separates AND from ANY;
      (g) resolve GATES TARGET RESOLUTION AND NOTHING ELSE (D-10), asserted as PAIRS — one pair
          per authority type, over case (d)'s fixture: the SAME unresolvable-pointer input
          returns NO message under resolve=False and exactly one message naming that pointer
          under resolve=True. Four pairs, eight assertions. Plus a ninth: resolve=False opens no
          target at all — a note whose block is well formed and whose pointers are all
          syntactically legal, evaluated against a fixture feature directory where plan.yaml,
          BRIEF.md and notes/review-fixture.md are ABSENT, returns [] under resolve=False. And
          the counter-assertions that make the flag's scope observable: the missing-section
          message (a), each of the five shape messages (c) and both unknown-authority refusals
          (e) are returned under BOTH settings — asserted a second time with resolve=False, so a
          flag that suppressed shape or grammar reddens here.

      Every fixture is built in a tempfile.TemporaryDirectory; the test must not read or write
      anything under .harness/harness/features outside that directory. The expected state at the
      end of this task is RED: the import fails because the module is absent, and the failure
      names handoff_done_when.
  - id: T-02
    title: Implement the shared Done when module
    traces: [REQ-02, REQ-03, REQ-04, REQ-05, REQ-06]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: 'DEC-174 — gate logic imported by both check-domain.sh and check-state.sh'
    depends_on: [T-01]
    status: ready
    files:
      - .claude/skills/harness/bin/handoff_done_when.py
    verify: |
      cd "$CLAUDE_PROJECT_DIR" && python3 .claude/skills/harness/bin/test-handoff-done-when.py
    intent: |
      Create .claude/skills/harness/bin/handoff_done_when.py, stdlib plus PyYAML (imported
      plainly, as plan-merge.py does), exposing:

        SECTION = "## Done when"
        problems(rel_path, text, root, resolve) -> list[str]

      Behaviour, exactly as test-handoff-done-when.py pins it:

      1. Locate the section by a line whose stripped, lowercased form equals "## done when". Its
         body runs to the next line whose stripped form starts with "##", or end of text. Absent
         section: return one message naming the section and templates/HANDOFF.md.
      2. Shape. Non-blank body lines must be exactly one line beginning "Scope:" followed by
         between one and four lines beginning "Authority:". Report, one message each: a Scope:
         count that is not 1 (name the count), an Authority: count outside 1..4 (name the count),
         and any other non-blank line (quote its first 60 characters). Order of the lines within
         the body is not enforced beyond Scope: appearing exactly once.
      3. Pointer grammar and resolution, per D-03. The feature directory is derived from
         rel_path: the ".harness/<repo>/features/<FEAT>/" ancestor of the note. If rel_path is
         not inside such a directory, report it and resolve nothing.
           plan-task:T-NN.verify   -> yaml.safe_load(<featdir>/plan.yaml); resolved when a task
                                      with id T-NN exists and its verify value is a non-empty
                                      string. The only legal field suffix is ".verify".
           brief-sc:SC-NN          -> <featdir>/BRIEF.md; resolved when some line, stripped and
                                      with a leading "- " removed, begins "SC-NN:".
           finding:<path>#<id>     -> <root>/<path>; id matches F-NN or PF-NNNN; resolved when
                                      the file exists and some line carries the id as a whole
                                      token (regex word boundaries).
           approval:<path>#<head>  -> <root>/<path>; resolved when some line starting with one or
                                      more "#" characters has, after stripping them and
                                      whitespace, a case-insensitively equal text.
         An unknown prefix returns a message listing the four legal prefixes, under BOTH
         settings of resolve. An unresolvable pointer returns a message naming the pointer, the
         file consulted, and what was not found in it. A target file that does not exist or does
         not parse is UNRESOLVED, never skipped.

         `resolve` GATES TARGET RESOLUTION AND NOTHING ELSE (D-10). Under resolve=False: locate
         the section, check its shape, and check each pointer's GRAMMAR — the prefix is one of
         the four legal types and the remainder is well formed for that type — then return
         WITHOUT opening plan.yaml, BRIEF.md, or any finding or approval target. No filesystem
         read of a target may occur on that path. Under resolve=True: everything resolve=False
         does, plus opening each target as described above. There is ONE parser and ONE pointer
         grammar (DEC-179), and the flag adds no second code path through either.
      4. Every message is a single line with no leading whitespace and no markdown; the callers
         add their own indentation and head line. Messages name templates/HANDOFF.md.
      5. No I/O outside the paths named above, and no process spawn: both callers are hooks on a
         latency budget.

      Do not touch check-domain.sh or check-state.sh in this task. The expected state at the end
      is GREEN for test-handoff-done-when.py and unchanged behaviour everywhere else.
  - id: T-03
    title: Write the failing write-gate cases in test-check-domain.py
    traces:
    - REQ-01
    - REQ-02
    - REQ-04
    - REQ-05
    - REQ-06
    - REQ-08
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: 'DEC-174 — check-domain.sh''s own test'
    depends_on: [T-02]
    status: ready
    files:
      - .claude/skills/harness/bin/test-check-domain.py
    verify: |
      cd "$CLAUDE_PROJECT_DIR" && out=$(python3 .claude/skills/harness/bin/test-check-domain.py 2>&1); rc=$?
      test "$rc" -ne 0 && printf '%s\n' "$out" | grep -qi 'done when'
    intent: |
      Extend .claude/skills/harness/bin/test-check-domain.py with the write-gate cases for the
      fifth handoff section. Use the existing handoff fixture helpers in that file (the rows near
      the current handoff cap and missing-section cases) so the new cases go through the real
      check-domain.sh process and assert on its exit code and stderr, never on its source.

      Cases, each a separate named assertion:
      (a) a handoff note carrying "## Next", "## Trust", "## Dead ends", "## Working set" and no
          "## Done when" is REFUSED with exit 2, and the stderr names "## Done when" and
          templates/HANDOFF.md;
      (b) the same note with a well formed block whose single authority resolves is ALLOWED,
          exit 0;
      (c) five malformed blocks refused, one case each: zero Scope: lines, two Scope: lines, zero
          Authority: lines, five Authority: lines, a stray prose line. Each assertion checks that
          the message names the count or the stray text;
      (d) eight pointer cases, one RESOLVING and one UNRESOLVABLE per authority type
          (plan-task, brief-sc, finding, approval), asserted separately: resolving is exit 0,
          unresolvable is exit 2 with the pointer named;
      (e) the 60-line cap still fires: a five-section note of 61 lines is refused with the cap
          message, and the same note at 60 lines is allowed;
      (f) an EDIT of an existing four-section note that does not add the section is refused, and
          the same edit that adds a well formed block is allowed;
      (g) an authority outside the four types is refused through the gate, TWO separate
          assertions: an unknown prefix ("Authority: docs:whatever") and a BARE SOURCE-CODE
          LOCATION ("Authority: check-domain.sh:1523"). Each is exit 2 and the stderr lists the
          four legal prefixes. This is the gate-level proof of REQ-04's second sentence;
      (h) NO PER-SECTION CAP EXISTS, asserted positively: a five-section note whose "## Trust"
          section runs 25 lines and whose whole file is exactly 60 lines is ALLOWED, exit 0, and
          the stderr mentions no cap. The only length refusal is the whole-file cap in case (e);
