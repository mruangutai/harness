      python3 .claude/skills/harness/bin/check-decision-anchors.py --file /dev/null || exit 1
      exit $rc
    intent: |
      Write .claude/skills/harness/bin/check-decision-anchors.py, a checker with no model in it, and
      its test test-check-decision-anchors.py.

      WHAT IT DOES. It takes an optional --file argument defaulting to
      .harness/harness/docs/DECISIONS.md resolved the same way gen-decisions-index.py resolves it -
      reuse that resolution, do not hand-roll a second one. It extracts every backticked
      file-and-line anchor: a backtick, then a path of word characters, dots, slashes and hyphens
      ending in a known source extension (py, sh, md, json, yaml, yml, ts, toml), then a colon, then
      a line number, optionally a hyphen and a second number. For each anchor it asserts two things
      and two things only:

        the named file exists in the tree, resolved by basename against git ls-files so an anchor
        written relative to a subdirectory still resolves;
        the first line number is within that file's line count.

      It prints one line per failing anchor naming the anchor and which of the two checks failed, and
      exits 1 if any failed, 0 otherwise. Exit 2 for a usage error or an unreadable target - never
      exit 0 on a target it could not read, because an empty result and a successful result must not
      look the same.

      WHAT IT DELIBERATELY DOES NOT DO: store or compare snippets. Existence plus range already finds
      three real rot sites today at zero authoring cost, and a snippet still cannot see a line that
      exists and now says something unrelated - which is the executable-claims checker's job, not
      this one's. Do not add a snippet mechanism.

      THE TEST. At least four cases, each against a SYNTHETIC fixture written into the test's own
      temp directory, never against the live document - a test that reads live state passes or fails
      for reasons that have nothing to do with the code:
        an anchor naming a file that exists at a line in range - reports nothing, exit 0;
        an anchor naming a file that does not exist - reported, exit 1;
        an anchor naming a real file at a line past its end - reported, exit 1;
        a file with no anchors at all - exit 0, and assert the checker SAID it examined zero anchors,
        so a silent zero-anchor pass is distinguishable from a working one.
      Pass the fixture path explicitly on every call. If the module resolves its default path at
      import time, a test that omits the argument reads live state and passes for the wrong reason.

      Then record the existence proof, in
      .harness/harness/features/FEAT-38-decisions-current-knowledge/notes/receipt-harness-backend-dev-<runid>.md:
      run the checker against the PRE-FEATURE authority via
