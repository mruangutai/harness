  - id: T-20
    title: Build the executable-claims checker and its test
    traces: [REQ-08]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-03]
    status: pending
    files:
      - .claude/skills/harness/bin/check-decision-claims.py
      - .claude/skills/harness/bin/test-check-decision-claims.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      python3 .claude/skills/harness/bin/test-check-decision-claims.py > /tmp/t20.out 2>&1
      rc=$?
      grep '^FAIL' /tmp/t20.out && exit 1
      test "$(grep -c '^ok - ' /tmp/t20.out)" -ge 5 || exit 1
      exit $rc
    intent: |
      Write .claude/skills/harness/bin/check-decision-claims.py and its test.

      THE MARKER FORMAT, which the new decision entry from T-03 also states. An HTML comment on its
      own line inside a decision body:

        <!-- claim: git grep -c "budget is 80" .claude/skills/harness/bin/check-domain.sh :: 1 -->

      Everything between "claim:" and the " :: " separator is the COMMAND. Everything after it is the
      expected stdout SUBSTRING, stripped of surrounding whitespace.

      WHAT THE CHECKER DOES. Takes an optional --file defaulting to
      .harness/harness/docs/DECISIONS.md, resolved the way gen-decisions-index.py resolves it. For
      each marker it runs the command and asserts the expected substring appears in stdout. It prints
      one line per failing claim naming the DEC heading the marker sits under, the command, the
      expected substring and the actual stdout, and exits 1 if any failed.

      THE SAFETY BOUNDARY, which is not optional. Split the command with shlex.split and run it with
      subprocess.run WITHOUT shell=True. REFUSE - report and exit 1, never skip - any command whose
      first token is not exactly git or grep. A documentation file must not become an arbitrary code
      execution surface inside the test suite, and a refusal that skips is a hole that looks like a
      pass. Impose a per-command timeout of 10 seconds and treat a timeout as a failure.

      EXIT CODES. 0 only when every marker ran and passed. 1 when any failed or was refused. 2 for a
      usage error or an unreadable target. And print the number of markers examined on success, so a
      zero-marker run is visibly different from a working one - a checker that passes over zero
      markers is indistinguishable from one that works, and that is the specific way this mechanism
      dies quietly.

      THE TEST. At least five cases, each against a synthetic fixture in the test's own temp
      directory with the fixture path passed explicitly:
        a marker whose command output contains the expected substring - exit 0;
        a marker whose command output does not - reported by DEC heading, exit 1;
        a marker whose command's first token is python3 - REFUSED and reported, exit 1, and assert
        the refusal message says so rather than merely exiting non-zero;
        a fixture with no markers - exit 0, and assert the reported marker count is zero;
        a marker whose command names a path that does not exist - a failure, not a crash and not a
        skip.
      Do not use shell=True anywhere in the test either.

      Registration is T-18's and T-19's. Do not edit run-unit-tests.sh or harness.json here.

