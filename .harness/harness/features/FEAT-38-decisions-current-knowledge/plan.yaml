decisions:
  - id: D-01
    choice: >-
      The governing scope is the operator ruling of 2026-08-26, recorded in
      .harness/notes/triage-decisions-authority-2026-08-26.md section 9: the seven struck entries
      DEC-103, DEC-104, DEC-137, DEC-140, DEC-186, DEC-192 and DEC-196 are deleted, and DEC-90 alone
      stays with its strike record.
    because: >-
      It answers the same question the 2026-08-24 grilling answered and it answers it later, so it
      reverses that ruling; DEC-90 is exempted because its successor is a SPEC section rather than a
      decision and its 18 historical citations sit in signed artifacts.
    dec: none
  - id: D-02
    choice: >-
      DEC-188's retention clause, the sentence beginning "Struck decisions keep their heading and a
      strike record.", is struck by DEC-188's own strike procedure and replaced with a narrower rule:
      a struck decision is deleted only when a named successor exists to repoint its citations to.
    because: >-
      The clause forbids D-01 outright, so any agent following decision discipline opens DEC-188 and
      correctly refuses the deletion; the replacement permits the seven, forbids DEC-90, and is
      derived from the successor measurement rather than asserted beside it.
    dec: DEC-188
  - id: D-03
    choice: >-
      DEC-181 is a LIVE decision, not a deletion candidate. Its STRUCK IN PART paragraph is folded as
      an amendment like any other, and the entry is rewritten to state the live 80-line CLAUDE.md
      budget as current truth plus one clause that the propagation-checker half no longer exists.
    because: >-
      The budget half is enforced in code at check-domain.sh line 1335, so the entry is live; the
      strike paragraph narrates a different half's history, which is exactly what an amendment is.
      Without this ruling instruction 4 of issue 78 has no defined behaviour and the sweep stalls.
    dec: none
  - id: D-04
    choice: >-
      One clause of issue 686 is in scope: the index generator must not emit a refs graph id that has
      no live DEC heading. The rest of issue 686, the full generation contract, stays out.
    because: >-
      DECISIONS-INDEX.md line 206 is DEC-188's row and reads refs DEC-103 DEC-104 DEC-161 DEC-165
      DEC-181. DEC-188 survives this feature and DEC-103 and DEC-104 are deleted by it, so the
      feature manufactures two phantom refs in a generated file that cannot be hand-edited. DEC-161
      is the standing proof: zero headings exist, two rows cite it. Orphan detection sees rows, never
      refs graphs.
    dec: none
  - id: D-05
    choice: >-
      .harness/logs/** and .harness/harness/features/** are dated records and are never rewritten,
      even where they cite a deleted id.
    because: >-
      They record what was true on a day; editing them falsifies the record. This is what keeps the
      citation sweep at 54 sites rather than several hundred.
    dec: none
  - id: D-06
    choice: A deleted decision number is never reused.
    because: >-
      Reuse makes every historical citation actively wrong rather than merely dangling, which is
      strictly worse than the problem deletion solves.
    dec: none
  - id: D-07
    choice: >-
      Deletion runs BEFORE folding, so amendments owned by deleted entries are never folded. That
      leaves 29 live amendments, of which the MOOTED DEC-145 am.3 is deleted rather than folded, so
      28 folds across 14 owner decisions plus DEC-181 equals 15 entries rewritten.
    because: >-
      Nine of the 38 amendments belong to DEC-137, DEC-186 and DEC-196. Folding first would spend
      judgement on text that is about to be deleted, and every intake figure for this work is wrong
      because it counted before the deletion was in scope.
    dec: none
  - id: D-08
    choice: >-
      An amendment is attributed to the decision id its own heading DECLARES, never to the span it
      physically sits in.
    because: >-
      DEC-137 amendment 2 sits inside DEC-138's span, DEC-138 amendment 5 through 8 sit inside
      DEC-168's span, and one DEC-189 amendment 1 sits inside DEC-194's span. A folder walking the
      file top to bottom would fold four DEC-138 amendments into DEC-168.
    dec: none
  - id: D-09
    choice: >-
      The anchor check M1 asserts only that the cited file exists and the cited line is within its
      length. No stored snippets.
    because: >-
      Existence plus range already reddens on exactly three sites today with zero authoring cost,
      and a snippet still cannot see a line that exists and now says something unrelated, which is
      M2's job. Snippets for 29 anchors buy nothing M2 does not already give.
    dec: none
  - id: D-10
    choice: >-
      REVERSED 2026-08-29 by operator ruling, and the id is kept rather than deleted so the record
      states what was decided and then undone. It specified M2, the executable claim marker: an
      HTML comment inside a decision body carrying a command, a double-colon separator and the
      expected stdout substring, re-run by a checker that refused any command whose first token was
      not git or grep and never invoked a shell. That mechanism was built by T-20 and populated by
      T-21, and it is now DELETED rather than redesigned. There is no marker, no checker and no
      second mechanical check; D-09's anchor check is the only one that survives.
    because: >-
      The allowlist bounded the risk without removing it. Document text still reached a subprocess
      argv, so DECISIONS.md stayed an execution surface whose safety depended on an allowlist
      keeping pace with every future git and grep release, and the operator declines that class of
      risk outright. A non-executing declarative replacement was put to them in full and rejected
      as machinery layered above this feature's goal rather than the goal itself. What the reversal
      costs is recorded in D-14, and the class the requirement now covers in D-13.
    dec: none
  - id: D-11
    choice: >-
      The read-back that proves the fold preserved meaning confirms two things per entry, the prior
      belief and what falsified it. The DATE is deliberately dropped from the prose.
    because: >-
      Issue 615 asks for three including the date, and the 2026-08-24 destination forbids dates and
      attribution in an entry. The date stays recoverable by git log --follow, which is the required
      form because the file was renamed in FEAT-22 and a plain git log reaches only 8 amendments.
    dec: none
  - id: D-12
    choice: >-
      Every citation site on a path that check-domain.sh --resolve reports as NOBODY is carved into a
      single main-session-direct task, declared once in the lanes block above.
    because: >-
      A NOBODY path is a violation in check-plan-routes.py under execution_mode team, so routing
      these to a squad fails the plan gate and the failure would surface mid-build. The
      2026-08-24 grilling's claim that this feature is entirely squad work is false.
    dec: DEC-174

  - id: D-13
    choice: >-
      REQ-10 is a requirement about a CLASS, not about one file, so the plan discharges it by
      sweeping every script under .claude/skills/harness/bin/ for the same shape - any command line
      built out of text read from a document or a configuration file - and recording a per-file
      verdict in a note under this feature's notes/. The sweep is a task with a written filter and a
      named enumeration command, not an open-ended audit.
    because: >-
      The operator's ruling is about a class of risk. Deleting the one known instance leaves the
      requirement asserted and unproven, and an unproven absence claim is the failure mode this
      feature exists to end. 72 files there mention subprocess, shlex, shell=, Popen, os.system or
      eval, and most are tests invoking a fixed argv, so the answer is a filtering judgement over a
      real surface rather than one grep. Without a written filter and a fixed enumeration command,
      two readers reach two different verdicts and neither is falsifiable.
    dec: none
  - id: D-14
    choice: >-
      Removing the mechanism removes the only detector of semantic citation rot - a cited line that
      still exists, still resolves, and no longer says what the entry claims about it - and nothing
      replaces it. No gate, no suite, no reviewer prompt and no convention. The detector is a human
      reading a diff.
    because: >-
      The operator accepted that cost with the alternative on the table, choosing it over a
      non-executing declarative redesign that would have preserved a weaker form of the capability.
      It is recorded as its own decision rather than as a footnote to D-10 because it is the thing a
      signature is signing away, and because the retained anchor check sees existence and range only,
      which reads as coverage to anyone who does not know this.
    dec: none
  - id: D-15
    choice: >-
      A task whose product this plan now deletes keeps status done and keeps its title and its
      intent instruction unchanged. The reversal is carried in exactly two places: a preamble
      paragraph at the head of intent, and a verify block rewritten into a two-sided reversal check
      that asserts the product existed at 48bbe7e and does not exist at final state. A task that
      traced only the retired REQ-08 and does not serve REQ-10 carries traces as an empty list. No
      forward depends_on edge is added from a done task to the task that reverses it.
    because: >-
      plan.yaml's legal task statuses are exactly pending, building and done - there is no struck and
      inventing one would fail the plan gate at check-plan-routes.py line 421. The work genuinely
      landed and committed, so flipping a status or deleting a task would falsify the record. The
      verify block is the only field a gate reads, so leaving it asserting a deleted surface is the
      one part that cannot stay; inverting it into a reversal check makes landed-then-deleted
      mechanically legible instead of a claim in prose. traces stays empty rather than borrowing a
      plausible id because REQ-08's tombstone makes a surviving trace a plan defect and REQ-10 is
      served by removing this work, not by having done it. A forward depends_on edge would encode a
      build order that never happened, so the grading window is stated in intent instead.
    dec: none

tasks:
  - id: T-01
    title: Strike DEC-188's retention clause and replace it with the successor-exists rule
    traces: [REQ-03, REQ-05]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: []
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      D=.harness/harness/docs/DECISIONS.md
      grep -q 'Struck decisions keep their heading and a strike record.' "$D" && exit 1
      grep -q 'a named successor exists to repoint its citations to' "$D" || exit 1
      grep -q 'They are not deleted from the file' "$D" && exit 1
      exit 0
    intent: |
      In .harness/harness/docs/DECISIONS.md, inside the entry whose heading begins
      "## DEC-188 — A contradicted decision is struck, not marked", locate the paragraph that begins
      with the exact sentence:

        **Struck decisions keep their heading and a strike record.** They are not deleted from the
        file. A reader who finds `DEC-103` cited in a shipped digest must land somewhere that
        explains what happened, and an absent entry reads as a broken reference rather than a
        decision.

      Do NOT search by line number: the paragraph has already drifted from 5942 to 5949 once.

      Strike that paragraph using DEC-188's OWN strike procedure as DEC-188 defines it, and replace it
      with the narrower rule, written as current truth in the document's own voice, no dates and no
      attribution:

        A struck decision is DELETED only when a named successor exists for a reader to land on. A
        successor need not carry the rule forward; it need only explain what happened, which is all
        the citation ever asked for. Where no successor exists the entry keeps its heading and its
        strike record, because an absent entry with nowhere to point reads as a broken reference
        rather than as a decision.

      Then add one clause of current truth recording the boundary the measurement produced, so nobody
      re-proposes a uniform rule: DEC-90 is the one entry this rule keeps, because its successor is a
      SPEC section rather than a decision and its historical citations cannot be edited.

      Change nothing else in DEC-188. Its strike procedure, its statement that enforcement is a human
      reading a diff, and its record that the propagation checker was deleted all stand unmodified.

      This task must land before any entry is deleted. Until it does, an agent following decision
      discipline will open DEC-188 and correctly refuse every deletion task in this plan.

  - id: T-02
    title: Rewrite the APPEND-ONLY front-matter mandate, which the fold makes false
    traces: [REQ-01, REQ-05]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: []
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      D=.harness/harness/docs/DECISIONS.md
      head -12 "$D" | grep -q 'APPEND-ONLY' && exit 1
      head -12 "$D" | grep -q 'add a new' && exit 1
      head -20 "$D" | grep -qi 'current' || exit 1
      exit 0
    intent: |
      In .harness/harness/docs/DECISIONS.md, the file's opening blockquote begins:

        > **APPEND-ONLY. Never rewrite or renumber an existing entry.** If a decision changes, add a
        > new entry that references and supersedes the old one. This is the whole point of the file:
        > a settled question stays settled, and reversals are visible as reversals rather than as
        > edits.

      That mandate is the thing this feature ends, so it is rewritten rather than struck. It is NOT a
      decision entry, so DEC-188's strike procedure does not apply to it and there is no DEC-NN to
      strike.

      Replace it with a mandate stating the new convention as current truth. It must say all four of:

        1. Every entry states CURRENT truth in its own voice. There are no amendment sub-sections and
           no dated corrections; a correction rewrites the entry it corrects.
        2. A claim the tree has since falsified survives as one clause of current truth inside the
           entry that replaced it, with no date and no attribution, so nobody re-proposes something
           already measured false.
        3. The author of a superseding decision DELETES the decision it replaces, in the SAME edit.
           Writing the replacement and deleting the replaced is one act, so there is never a moment
           where both exist.
        4. Numbers are never renumbered and a deleted number is never reused.

      Leave the "Numbering:" paragraph that follows, which distinguishes DEC-NN from D-NN, unchanged
      except to add that a deleted number is retired rather than reused if that is not already stated
      by point 4 above.

      History is not lost and the mandate should say where it went: git holds it, and because the
      file was renamed in FEAT-22 the command is git log --follow on the path, not a plain git log,
      which reaches only 8 of the amendments this feature folds.

  - id: T-03
    title: Author the new decision entry that homes every convention this feature establishes
    traces: [REQ-05, REQ-06, REQ-07]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: [T-01]
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      D=.harness/harness/docs/DECISIONS.md
      N=$(grep -oE '^## DEC-[0-9]+' "$D" | grep -oE '[0-9]+' | sort -n | tail -1)
      grep -q "^## DEC-$N " "$D" || exit 1
      B=$(sed -n "/^## DEC-$N /,/^## DEC-$((N+1)) /p" "$D")
      for s in 'current truth' 'refs' 'anchor' 'never reused'; do
        printf '%s' "$B" | grep -qi "$s" || { echo "missing: $s"; exit 1; }
      done
      printf '%s' "$B" | grep -q '<!-- claim:' && { echo 'claim marker survives'; exit 1; }
      printf '%s' "$B" | grep -qi 'double-colon' && { echo 'command grammar survives'; exit 1; }
      printf '%s' "$B" | grep -qi 'two mechanical checks' && { echo 'stale check count'; exit 1; }
      python3 .claude/skills/harness/bin/gen-decisions-index.py --stdout >/dev/null || exit 1
      exit 0
    intent: |
      Author ONE new entry at the end of .harness/harness/docs/DECISIONS.md, taking the next unused
      number after the highest ## DEC-NNN heading present when you run. At 7ebfc9e the highest is
      DEC-204, so the new entry is DEC-205; re-derive it rather than trusting that, because another
      feature may have landed an entry first.

      CORRECTED 2026-08-29, and the correction is the reason to read this task rather than skip it.
      As authored at 48bbe7e the entry carried a SIXTH rule mandating executable claim markers, and
      its heading and enumeration sentence both said two mechanical checks guard the file. The
      operator's removal ruling deletes that rule, so the instruction below no longer asks for it,
      and the entry that already landed is repaired by T-28 - which owns DEC-205's heading, its
      enumeration-introducing sentence, item 2 and the closing paragraph that counts the checks.
      Nothing here re-authors the entry; this record is corrected so a reader of the plan is not
      told to author a rule the plan elsewhere deletes.

      THIS VERIFY BLOCK IS GRADED AT FINAL STATE, after T-27 and T-28 land. Its three negative
      assertions are red in the window between T-21 and T-27, when DEC-205 still carries the two
      markers T-21 added; that window is stated here rather than as a depends_on edge, because a
      forward edge from a done task would falsify the order the work was actually built in. The
      former grep for the bare substring claim was dropped as non-discriminating: the word appears
      in ordinary prose in this entry - "a claim the tree has falsified" - so it matches whether or
      not any marker survives, and an assertion that cannot fail is worse than none.

      This entry is the ONLY home these conventions have. Verified at 7ebfc9e: the amendment
      convention is written down nowhere in the tree - not in SPEC.md, not in the documentor's agent
      file, not in any skill. It exists only in the generator's regexes, which this feature deletes.
      Written as current truth, no dates, no attribution, it must state all six rules - the sixth
      names one mechanical check where it once named two:

        1. THE AMENDMENT CONVENTION IS ENDED. An entry states current truth directly. A correction
           rewrites the entry it corrects. A falsified claim survives as one clause of current truth
           so it cannot be re-proposed as new. The cost is recorded honestly: dated reasoning about
           how a decision CHANGED is recoverable only from git log --follow on the path, and for one
           block, the former DEC-145 am.3, the reasoning existed only in the file because its
           authoring commit message is an unrelated write-up. That was accepted on 2026-08-20 as a
           fair price.

        2. SUPERSESSION IS DELETION. The author of a superseding decision deletes the decision it
           replaces in the same edit. There is no SUPERSEDED BY marker and no code that can emit one.
           Nine superseded entries had accumulated precisely because the deletion was somebody
           else's later problem.

        3. A STRUCK DECISION IS DELETED only when a named successor exists to repoint its citations
           to. State that this is DEC-188's rule as amended by this feature and do not restate its
           reasoning here - one statement, one home.

        4. A DELETED NUMBER IS NEVER REUSED. Reuse makes every historical citation actively wrong
           rather than merely dangling.

        5. THE INDEX GENERATION CONTRACT, one clause only: a refs graph entry naming a DEC with no
           live heading is never emitted. State the evidence, because it is the whole reason the
           clause exists: DEC-161 was deleted outright, zero ## DEC-161 headings exist, and
           DECISIONS-INDEX.md still carried DEC-161 in the refs graph of two rows, regenerated on
           every run, because the generator scraped the id from the sentences describing the
           deletion. Orphan detection guards a ROW whose entry is gone; it never looked at a refs
           graph. Note that this is one clause of issue 686 and that the rest of that ticket, the
           full generation contract, is deliberately not settled here.

        6. ONE MECHANICAL CHECK GUARDS THE FILE, AND ONLY ONE - ANCHOR ROT. Every file-and-line
           anchor cited in DECISIONS.md must name a file that exists and a line within its length.
           Record that this is deliberately existence plus range and NOT a stored snippet: at
           7ebfc9e it already catches three anchors naming feature.yaml, a file DEC-191 renamed to
           feature.json, at zero authoring cost, and a snippet cannot see a line that still exists
           and now says something unrelated. Record also that nothing detects that second failure
           any more: a human reading a diff is the only detector left for it.

      Also record what was considered and REFUSED, so a future scan does not re-suggest it: a
      referenced-file watch (M3) hands over a review list without proving anything, and a periodic
      LLM audit of design claims (M4) decays the moment code moves, so it is a one-time sweep rather
      than a gate. Neither becomes cheap merely because the entries are open, which is the whole
      reason the one above is in.

      Do not delete or edit any other entry in this task.

  - id: T-04
    title: Delete DEC-140, the free deletion, as the first test of T-01 and T-03 together
    traces: [REQ-03]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: [T-01, T-03]
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
    verify: |
      cd "$(git rev-parse --show-toplevel)"
