  - id: T-06
    title: Remove the supersession machinery from the generator and stop emitting phantom refs
    traces: [REQ-01, REQ-04, REQ-06]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/gen-decisions-index.py
      - .claude/skills/harness/bin/test-gen-decisions-index.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      G=.claude/skills/harness/bin/gen-decisions-index.py
      for s in SUPERSESSION_VERB_RE BODY_SUPERSESSION_RE compute_supersession_target \
               superseded_by 'SUPERSEDED BY'; do
        grep -q "$s" "$G" && { echo "still present: $s"; exit 1; }
      done
      grep -q 'def compute_amendments' "$G" || exit 1
      python3 .claude/skills/harness/bin/test-gen-decisions-index.py > /tmp/t06.out 2>&1
      grep -q '^ok - test_orphaned_ruling_is_reported_not_silently_dropped$' /tmp/t06.out || exit 1
      grep -q '^FAIL - test_committed_index_matches_a_fresh_regeneration' /tmp/t06.out || exit 1
      grep '^FAIL' /tmp/t06.out \
        | grep -vE 'test_committed_index_(matches_a_fresh_regeneration|is_complete_and_within_budget)' \
        && exit 1
      exit 0
    intent: |
      Two changes to .claude/skills/harness/bin/gen-decisions-index.py, plus their tests.

      CHANGE 1 - delete the supersession machinery entirely. Locate each construct BY NAME, not by
      line number:

        SUPERSESSION_VERB_RE          - the module-level regex on SUPERSEDES, CORRECTS, INVERTS
        BODY_SUPERSESSION_RE          - the module-level body-prose regex
        compute_supersession_target   - the whole function
        the superseded_by dict, its construction loop, and the call to compute_supersession_target
        the clause that appends an em-dash SUPERSEDED BY DEC-N suffix to the TARGET's row
