      Script-side citations are T-12's, T-13's and T-14's. Do not reach into them.

      THE GENERATOR EXITS 1 HERE AND THAT IS CORRECT. DECISIONS-INDEX.md is not regenerated until
      T-11, so each entry you delete leaves an orphan index row and orphan detection is a hard error.
      The verify asserts the shape of that failure instead of exit 0: an ORPHAN line for each of your
