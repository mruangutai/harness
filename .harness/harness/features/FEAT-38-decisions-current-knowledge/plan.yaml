  - id: T-29
    title: Audit the rest of bin/ for any other command line built from document or config text
    traces: [REQ-10, SC-17]
    change_type: docs
    execution_mode: team
    execution_agent: harness-pm
    depends_on: [T-24]
    status: pending
    files:
      - .harness/harness/features/FEAT-38-decisions-current-knowledge/notes/research-FEAT-38-bin-argv-class-audit.md
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      N=.harness/harness/features/FEAT-38-decisions-current-knowledge/notes/research-FEAT-38-bin-argv-class-audit.md
      test -f "$N" || exit 1
      P='subprocess|shlex|shell=|Popen|os\.system|eval\('
      CAND="$(git grep -lE "$P" -- .claude/skills/harness/bin)"
      C="$(printf '%s\n' "$CAND" | grep -c .)"
      test "$C" -ge 60 || { echo "enumeration returned $C, expected 60 or more"; exit 1; }
      MISS=0
      for f in $CAND; do
        B="$(basename "$f")"
        grep -qE "^\| $B \| (FIXED-LITERAL-ARGV|TEXT-DERIVED-ARGV|NO-EXECUTION) \| *[^| ][^|]*\|" \
          "$N" || { echo "unjudged or rationale empty: $B"; MISS=1; }
      done
      test "$MISS" -eq 0 || exit 1
      grep -qF 'git grep -lE' "$N" || { echo 'enumeration command not recorded'; exit 1; }
      grep -qE '^## TEXT-DERIVED-ARGV' "$N" || { echo 'no TEXT-DERIVED-ARGV section'; exit 1; }
      sed -n '/^## TEXT-DERIVED-ARGV/,$p' "$N" | grep -qE 'EMPTY|remaining work' \
        || { echo 'TEXT-DERIVED-ARGV section states no disposition'; exit 1; }
      grep -qF 'test_kinds' "$N" \
        || { echo 'the config-stored command case is not addressed'; exit 1; }
      exit 0
    intent: |
      Write .harness/harness/features/FEAT-38-decisions-current-knowledge/notes/research-FEAT-38-bin-argv-class-audit.md,
      recording a per-file verdict for every candidate script under .claude/skills/harness/bin/.
      REQ-10 is a claim about a class, and until this note exists the class half of it is asserted
      and unproven.

      ENUMERATE THE CANDIDATES WITH EXACTLY THIS COMMAND, and quote it in the note so a later reader
      re-runs it and lands on the same set:

        git grep -lE 'subprocess|shlex|shell=|Popen|os\.system|eval\(' -- .claude/skills/harness/bin

      At 99bb52c it returns 72 files. Most are tests invoking a fixed argv, so this is a filtering
      judgement, not a one-command answer.

      THE FILTER, WHICH IS TWO QUESTIONS PER CALL SITE. Answer both for every subprocess, os.system,
      eval or shell= call site in the file. The filter is written this way so two readers reach the
      same verdict on the same file:

        Q1. Is the EXECUTABLE a literal in this file's own source? For shell=True, os.system or
            eval, the executable is the whole command string. If the answer is no - the program name
            or the command string comes from somewhere else - the verdict is TEXT-DERIVED-ARGV.
        Q2. A QUESTION ABOUT PROVENANCE, NOT ABOUT GRAMMATICAL ROLE. Does the VALUE of any argv
            element come from an input this script does not control - anything it reads and parses,
            whether a .md document, a .json, .yaml, .yml or .toml configuration, or stdin - rather
            than from this file's own source, sys.argv, the environment, a harness_boundary
            resolution, or git output? If yes, the verdict is TEXT-DERIVED-ARGV; name the element,
            the input it came from, and the parse step. A value is text-derived whether it lands as
            the program name or as a later argument.

      STDIN IS NAMED IN Q2 DELIBERATELY: the hook scripts under bin/ parse agent-controlled JSON on
      stdin, which is the same risk class as a document and had no verdict in an earlier draft.

      What does NOT make a site text-derived, stated explicitly because these are the cases that
      generate disagreement: a literal in the script's own source; a path resolved by
      harness_boundary; a value taken from sys.argv or from an environment variable set by a caller;
      a filename produced by git ls-files.

      THE PATH-ARGUMENT EXCLUSION IS NARROW, AND AN EARLIER DRAFT'S WORDING CONTRADICTED Q2 ON THE
      CASE THAT MATTERS MOST. A path THIS SCRIPT ITSELF CONSTRUCTS - a literal in its own source, a
      harness_boundary resolution, or a join of those - passed as an argument to a fixed executable,
      is not a command and does not make the site text-derived. A path that ARRIVED FROM A PARSED
      INPUT is text-derived even when it is passed as a plain argument. Provenance decides, never
      position.

      THE DECISIVE CASE, AND THE NOTE MUST SHOW IT WAS CAUGHT RATHER THAN CONCLUDE THE CLASS IS
      EMPTY: a whole command string stored in configuration. .harness/harness.json's test_kinds
      entries hold a cmd value such as
      .agents/skills/harness/bin/run-unit-tests.sh --kind integration
      and Q1 already catches any script that reads that field and executes it, because the
      executable is then not a literal in the reading script's own source. Find the readers of a
      test_kinds cmd, judge each one, and name the field and the reading site in the note. The verify
      requires the string test_kinds to appear in the note for exactly this reason.

      Both answers no, in a file that does contain an executing call site, is FIXED-LITERAL-ARGV.

      A THIRD VERDICT EXISTS BECAUSE THE CANDIDATE SET IS WIDER THAN THE ENUMERATION PATTERN.
      NO-EXECUTION is the verdict for a candidate file that executes nothing at all: the eval pattern
      matches literal_eval, and the subprocess pattern matches a docstring or a comment, so a file
      can be in the enumerated set with no call site to judge. Recording such a file as
      FIXED-LITERAL-ARGV would be a false statement, so the rubric and the verify both accept
      NO-EXECUTION. A file with several call sites gets the STRICTEST verdict its sites earn:
      TEXT-DERIVED-ARGV over FIXED-LITERAL-ARGV over NO-EXECUTION.

      THE DELIVERABLE. The note carries, in this order: the enumeration command verbatim, the count
      it returned, and a table with one row per candidate in exactly this shape, no backticks, so the
      verify can match it:

        | <basename> | <VERDICT> | <the call site, file:line, and why> |

      Every candidate the command returns gets a row, and THE THIRD COLUMN MUST BE NON-EMPTY - the
      verify requires it, because seventy-odd rows with an empty rationale is a table that records
      nothing and passes anyway. Each site of a multi-site file is cited.

      Then a closing section headed exactly

        ## TEXT-DERIVED-ARGV

      listing that set: either stated EMPTY in those letters, or listed as remaining work with a
      recommendation. The verify asserts that the section exists and states one of those two
      dispositions, because the section is SC-17's whole substance and nothing asserted it in an
      earlier draft. A bare "swept, found nothing" does not meet SC-17.

      THE VERIFY RE-DERIVES THE CANDIDATE SET AND ASSERTS EVERY MEMBER HAS A ROW, so a note covering
      40 of 72 goes red and names the files it missed. "A note exists" is not a gate. The count
      floor of 60 is the positive control: a git grep that errors prints nothing, the loop then runs
      zero times, and without the floor an empty enumeration would pass.

      RUN AFTER T-24, which is the merged deregister-and-delete task. The deleted checker is the one
      known instance of argv-from-document today, and enumerating before its deletion puts a file in
      the candidate set that no longer exists at review_sha. traces carries SC-17 as well as REQ-10
      because this note IS that criterion's entire evidence, and the grader looks for the id here.
