tasks:
  - id: T-01
    title: Add a documented-contract conformance guard to the digest validator suite
    traces: [REQ-02, REQ-04]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out - the enforcement layer's own tests are edited directly and run explicitly
    depends_on: []
    status: done
    files:
      - tests/integration/test-validate-digest.py
    verify: |
      python3 tests/integration/test-validate-digest.py | python3 -c "import sys;o=sys.stdin.read();a='ok    [documented contract discrimination] omitted field reported, present field accepted';b='ok    [documented contract completeness] unmapped persona, absent source, unlocatable block and out-of-block field each reported by name';sys.exit(0 if a in o and b in o else 1)"
    intent: |
      Add a documented-contract conformance guard to tests/integration/test-validate-digest.py,
      modelled on run_reviewer_severity_enum_cases() already in that file. That function guards
      severity_max enum drift between the validator and the reviewer agent templates; reuse its
      shape, its mechanical-discovery discipline and its ok/FAIL print style rather than inventing a
      second convention. Edit no other file. In particular do NOT edit
      .claude/skills/harness/bin/validate-digest.py: it already implements DEC-207 plan-review mode
      correctly, and this feature must leave it byte-identical.

      Every assertion added here has a failing direction that is DEMONSTRATED rather than argued: either a
      synthetic case in (7) that reports it red inside this same suite run, or a real red at the end of
      this task which T-02/T-03 close. Nothing is asserted whose red state nobody has seen.

      Add, in this order:

      (1) A pure helper documented_block(source_text, source_path) returning the region of source_text
      that documents a persona's DIGEST block, or None when it cannot be located. When source_path ends
      with SKILL.md the block is the fenced block carrying the line whose first non-space token is
      DIGEST: - scan to that line, then out to the nearest fence line above and the nearest fence line
      below. For any other source, an agent file, the block is the "## Output" section: the "## Output"
      heading line through to the next line that opens a heading of the same or higher depth, or end of
      file. It takes TEXT and a path STRING and reads nothing from disk, so it is exercisable on
      synthetic input.

      Why the block and not the whole file: four dev personas share .claude/skills/harness-digest-dev/SKILL.md
      and three leads share .claude/skills/harness-team/SKILL.md, so a whole-file search lets one required
      field name occurring anywhere in prose satisfy the guard for seven of the sixteen personas at once.
      Measured at c369fb1f in this worktree, that is latent rather than live: grepping the required field
      names of SCHEMAS["dev"] against harness-digest-dev/SKILL.md matches only at lines 18-27 and those of
      SCHEMAS["lead"] against harness-team/SKILL.md only at lines 240-253, every match inside the single
      fenced digest block. Scope it anyway - the shape is wrong either way and those seven personas are
      one prose edit away from a false green.

      (2) A pure helper documented_contract_gaps(required_fields, documented_text) returning the
      sorted list of names in required_fields for which documented_text contains no line whose
      first non-space token is that name followed by a colon. It takes TEXT, never a path, so it
      can be exercised on synthetic input.

      (3) A module-level CONTRACT_SOURCES map from persona name to the repo-relative file or files that
      document that persona's DIGEST block. It is a PATH MAP AND NOTHING ELSE: it must not double as the
      roster of personas under test, and no expected count, floor or roster literal may be written beside
      it. Nine personas document their own block in their agent file and map to ONE source, the
      canonical .omp/agents/<persona>.md and that copy only: harness-pm, harness-qa, harness-documentor,
      harness-dev-ops, harness-visual-designer, harness-code-reviewer, harness-security-reviewer,
      harness-ui-reviewer, harness-orchestrator. Do NOT also map .claude/agents/<persona>.md for those nine: D-07 establishes
      .omp/agents/** as canonical and .claude/agents/** as generated adapters, so the canonical copy is
      the one a contract is authored in, and the standing sync-agent-adapters.py --check - all sixteen
      pairs, already invoked by check-omp-port.py:156-166 - is what asserts the generated copy agrees.
      Only this path map shrinks: step (6)'s three reviewer sources are not CONTRACT_SOURCES and are
      unchanged, and the seven SKILL.md-documented personas below are unchanged because there is no
      .omp/skills/ tree for D-07's argument to reach. The four dev personas harness-frontend-dev,
      harness-backend-dev, harness-ai-dev and harness-data-engineer map to .claude/skills/harness-digest-dev/SKILL.md. The three leads
      harness-product-lead, harness-eng-lead and harness-validator-lead map to
      .claude/skills/harness-team/SKILL.md.

      (4) A PURE grading helper documented_contract_results(roster, sources, required_by_persona,
      read_source) returning a list of (ok, line) pairs, one per graded unit, in roster order. It reads NO
      module global: the roster, the path map, the per-persona required-field sets and the source reader
      all arrive as ARGUMENTS, so the whole grading path is exercisable on synthetic input exactly as (2)
      is. read_source(path) returns that source's text, or None when the path does not exist on disk. For
      each persona in roster, sorted:

        - sources carries no entry for that persona: one (False, ...) line naming that persona and stating
          it is present in the validator registry but has no documented-contract source mapped. An entry
          that is PRESENT but whose list of sources is EMPTY takes this same branch and is reported by
          name the same way: an empty mapping is an unmapped persona, never a zero-iteration
          silent pass. This is the completeness check and it is the point of deriving the roster elsewhere: a seventeenth persona
          added to validator.ALIAS/SCHEMAS must redden this section BY NAME, not merely produce a smaller
          count that still passes.
        - otherwise, for each mapped source, in order: read_source returns None - one (False, ...) line
          naming that path as absent from disk; documented_block returns None - one (False, ...) line
          naming that path and stating its documented block could not be located, never a silent pass;
          otherwise one (ok, line) pair naming BOTH the persona and the source path, ok False when
          documented_contract_gaps of that persona's required set over the BLOCK - never over the whole
          source text - is non-empty, with the missing field names in the line.

      Never iterate sources to decide who is graded; the roster argument alone decides that.

      (5) run_documented_contract_cases(). Load the validator with importlib exactly as
      run_reviewer_severity_enum_cases does (spec_from_file_location over VALIDATE).

      DERIVE the persona roster under test from the validator's own registry: sorted(validator.ALIAS),
      whose keys are the persona names the validator recognises (sixteen at c369fb1f). Never iterate
      CONTRACT_SOURCES to decide who is under test, and never hand-type the roster or a count of it. The
      file's own _reviewer_template_paths (tests/integration/test-validate-digest.py:117) already derives
      its subject set from validator.norm()/ALIAS this way; follow it. The point is that the set being
      graded comes from the artefact that DEFINES it, so it cannot be shrunk by an omission in the artefact
      being graded.

      Build required_by_persona from the module, never retyped: for each roster persona,
      set(validator.SCHEMAS[validator.norm(persona)]), and for harness-code-reviewer add code_grade and
      reviewed - mirroring validate()'s own per-persona schema extension. Pass sorted(validator.ALIAS),
      CONTRACT_SOURCES, that mapping, and a read_source that reads repo-relative paths from the repository
      root, into documented_contract_results; print every returned pair as an ok/FAIL line in the file's
      style and count the FAILs.

      Write no expected-count assertion and no hand-typed floor anywhere in this section. The floor is
      deliberately removed rather than relocated: a floor typed beside the map it grades is derived from
      the artefact it grades, so a persona missing from BOTH the map and the floor cleared it silently -
      which is the exact failure REQ-04 exists to end.

      (6) Reviewer plan-mode assertions. For each of .claude/agents/harness-code-reviewer.md,
      .omp/agents/harness-code-reviewer.md and .claude/skills/harness-code-review/SKILL.md print one
      ok/FAIL line asserting that the file documents the DEC-207 plan form. Assert COMPOSITES, never bare
      substrings, with both tokens taken FROM THE VALIDATOR MODULE and never retyped:

        - the literal "reviewed: " concatenated with validator._PLAN_REVIEW_PREFIX must occur in the file.
          Bare _PLAN_REVIEW_PREFIX is "plan:" and survives in ordinary prose ("the plan:"), so the bare
          form would keep the guard green after the plan-form line was deleted.
        - the file must carry a line whose first non-space token is code_grade: and which contains the n_a
          member of validator.CODE_GRADE_VALUES. Bare n_a is already present at
          .claude/skills/harness-code-review/SKILL.md:112-113, in the unrelated pre-existing "enum is an
          audit claim" passage (measured at c369fb1f), so a bare-substring assertion is vacuous for that
          file today; pairing the token with its own field is what makes it evidence. The field-paired form
          is satisfied by T-02's "code_grade: pass|fail|grade_2|n_a" line and by T-03's "code_grade: n_a".
        - for the two agent-file copies ONLY, additionally the literal fragment

            features/<FEAT>/notes/review-harness-code-reviewer-

          which is the artifact-path half of D-06 - the half that is fatal on its own, and which is
          otherwise guarded only by T-02's one-shot verify and never enters the suite. Without it, a later
          edit reverting that line reddens nothing and B-9 recurs verbatim, under a decision entry claiming
          the class is checked mechanically.

      FAIL naming the file and the missing token in each case.

      Failing direction for all of (6), demonstrated by this task's own run: at the end of this task every
      one of these assertions is RED - the composite reviewed line and the code_grade line for all three
      sources, and the artifact fragment for the two agent copies, none of which exists yet - and each goes
      green only when T-02 (agent copies) and T-03 (SKILL.md) land. Quote that red output in your receipt.

      (7) Two synthetic discrimination groups. Both run on synthetic input only, so both are green before
      and after T-02 and T-03 land - which is the property this task's verify rests on.

        (7a) Store the harness-code-reviewer section titled Output exactly as it stands BEFORE this feature
        as an inert string constant PRE_FIX_REVIEWER_BLOCK in the test file. The file already stores a prior
        revision's bytes as inert fixture data; follow that convention, and do not read it from git. Case
        one: documented_contract_gaps over PRE_FIX_REVIEWER_BLOCK must contain code_grade. Case two: the
        same text with a code_grade line inserted, spelled exactly as T-02 will spell it, must yield an
        empty gap list. When both hold print exactly this line, spaced as the file's other ok lines are:
        ok    [documented contract discrimination] omitted field reported, present field accepted

        (7b) A synthetic-registry case for the branches of (4) that the real registry cannot exercise: it
        maps all sixteen personas, every mapped path exists and every block is locatable, so those branches
        have zero live executions and a swallowed FAIL in any of them would ship under ALL PASSED. and
        surface only when a seventeenth persona is added - exactly when REQ-04's promise is needed.

        Build a synthetic roster, a synthetic sources map, a synthetic required_by_persona and a
        dict-backed read_source, and call documented_contract_results ONCE on them. Within that one call
        assert all six:
          - a roster persona carrying no entry in the synthetic map yields a failure line NAMING that
            persona;
          - a roster persona whose entry in the synthetic map is an EMPTY list yields that same failure
            line NAMING that persona, never zero lines;
          - a mapped path for which read_source returns None yields a failure line NAMING that path;
          - a mapped source whose text contains no locatable documented block yields a failure line NAMING
            that path;
          - a mapped source carrying the required field name only OUTSIDE its documented block - in prose
            above the block - yields a failure line naming that persona and that field, which a whole-file
            search would have passed;
          - a fully-mapped, fully-documented synthetic control yields no failure line at all.
        When all six hold print exactly this line, spaced as the file's other ok lines are:
        ok    [documented contract completeness] unmapped persona, absent source, unlocatable block and out-of-block field each reported by name
        The ok-line text above is UNCHANGED by the empty-list case and must stay byte-identical to the
        string this task's verify greps: an empty mapping is an unmapped persona, so that line already
        names it truthfully.

      (8) Register it in main() as: fails plus-equals run_documented_contract_cases().

      At the end of this task the suite is EXPECTED TO BE RED, for exactly these reasons:
      harness-code-reviewer missing code_grade in its documented block in both agent trees, and the
      plan-mode assertions of (6) for all three sources. That red state is the point of this task and is
      closed by T-02 and T-03. Quote the red output in your receipt. The verify command above checks only
      the two synthetic ok lines of (7), both of which are green before and after those two tasks land.

  - id: T-02
    title: Document code_grade and the DEC-207 plan form in the code-reviewer persona output block
    traces: [REQ-01, REQ-02]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for both agent-file copies, so no team lane may write them
    depends_on: [T-01]
    status: done
    files:
      - .claude/agents/harness-code-reviewer.md
      - .omp/agents/harness-code-reviewer.md
    verify: |
      python3 .claude/skills/harness/bin/sync-agent-adapters.py --check && grep -qF "code_grade: pass|fail|grade_2|n_a" .claude/agents/harness-code-reviewer.md && grep -qF "code_grade: pass|fail|grade_2|n_a" .omp/agents/harness-code-reviewer.md && grep -qF "reviewed: plan:" .claude/agents/harness-code-reviewer.md && grep -qF "reviewed: plan:" .omp/agents/harness-code-reviewer.md && grep -qF "features/<FEAT>/notes/review-harness-code-reviewer-" .claude/agents/harness-code-reviewer.md && grep -qF "features/<FEAT>/notes/review-harness-code-reviewer-" .omp/agents/harness-code-reviewer.md && ! grep -qF "<HARNESS_CONTROL_PLANE_ROOT>/.harness/notes/review-harness-code-reviewer-" .claude/agents/harness-code-reviewer.md && ! grep -qF "<HARNESS_CONTROL_PLANE_ROOT>/.harness/notes/review-harness-code-reviewer-" .omp/agents/harness-code-reviewer.md && python3 -c "import sys;k='# Harness: Code Reviewer';a=open('.claude/agents/harness-code-reviewer.md').read();b=open('.omp/agents/harness-code-reviewer.md').read();sys.exit(0 if a[a.index(k):] == b[b.index(k):] else 1)"
    intent: |
      The section titled Output in the harness-code-reviewer persona documents a digest that
      validate-digest.py rejects unconditionally. It never mentions code_grade, which the validator requires
      of this persona; it offers only the quoted base..review_sha range, which cannot be written in the plan
      phase because no commit exists yet; and its artifact: line names a path outside any feature directory,
      which the validator refuses before it will bind code_grade at all.

      EDIT THE CANONICAL SOURCE, THEN REGENERATE. .omp/agents/harness-code-reviewer.md is the canonical
      role policy and .claude/agents/harness-code-reviewer.md is a GENERATED compatibility adapter of it -
      sync-agent-adapters.py's own docstring, lines 3-5: "Canonical role policy lives in `.omp/agents`.
      Claude files are generated compatibility adapters; edit the OMP source, then run `--apply`."
      Hand-editing the generated copy is silently reverted by the next --apply. So:

        a. Make ALL FOUR edits below in .omp/agents/harness-code-reviewer.md and in that file only.
        b. Then run: python3 .claude/skills/harness/bin/sync-agent-adapters.py --apply
           which regenerates .claude/agents/harness-code-reviewer.md from it. Both files change on disk,
           which is why both are in this task's files: list, but only one is authored.
        c. Confirm python3 .claude/skills/harness/bin/sync-agent-adapters.py --check returns rc 0. The
           bodies must remain byte-identical from the "# Harness: Code Reviewer" heading onward; only
           frontmatter differs, and the verify compares them.

      Recorded as D-07. Make exactly the four edits enumerated below, and no others.

      (1) In the fenced yaml DIGEST block, immediately above the existing reviewed: line, add this field,
      spelled exactly so, because T-01's guard and the verify both grep for it:

        code_grade: pass|fail|grade_2|n_a

      Follow it with a trailing comment saying it is REQUIRED, that validate-digest.py recomputes it
      independently from the range merge-base(default branch, review_sha)..review_sha and refuses a digest
      whose claim disagrees (DEC-209), and that it is therefore an audit claim rather than evidence of
      itself.

      (2) Extend the reviewed: line so both legal targets are documented. Keep the existing quoted
      base..review_sha value as the post-pin form, and add beneath it a second, commented line showing the
      plan form: the field name reviewed, a colon, the token plan, a colon, and then the path to this
      feature's own plan.yaml written as an angle-bracketed placeholder named path-to-plan.yaml. The
      comment must state that this form is written in the PLAN phase, before any commit exists, together
      with code_grade: n_a (DEC-207), and must name the three conditions the validator enforces for it:
      the path must be this feature's own plan.yaml, the plan's approval.status must be pending, and
      feature.json must have no pinned review_sha. The characters "reviewed: plan:" must appear literally
      on that line - the verify greps for them.

      (3) Replace the artifact: line that closes the same fenced block. It reads today:

        artifact: <HARNESS_CONTROL_PLANE_ROOT>/.harness/notes/review-harness-code-reviewer-<runid>.md

