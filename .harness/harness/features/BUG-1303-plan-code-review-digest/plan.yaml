decisions:
  - id: D-01
    choice: The remedy is a mechanical guard, not doctrine alone - a check that every persona's documented output block carries every field the validator schema requires of that persona
    because: "measured at c369fb1f the same check over all sixteen personas reddens on exactly one field, so the guard costs one fix today and closes the whole class"
    dec: none
  - id: D-02
    choice: The guard is one-directional - a required field must be documented, but a documented field the schema does not enumerate stays legal
    because: "SCHEMAS holds only the enum-and-typed required fields, while headline, files_touched and open_questions are required elsewhere in validate(), so a two-directional check would redden on fourteen conformant personas"
    dec: none
  - id: D-03
    choice: A NEW decision records the contract-divergence rule and DEC-207 is not amended
    because: "DEC-207's ruling that plan mode is legal is unchanged and correct - what was missing is that a persona's documented output block is an enforced half of the digest contract"
    dec: none
  - id: D-04
    choice: Plan mode is documented in harness-code-review/SKILL.md as well as in the persona output block
    because: "the SKILL is where a reviewer is told to diff base..review_sha and never HEAD, and that is the instruction which misroutes a plan-phase reader"
    dec: none
  - id: D-05
    choice: The pre-fix reviewer output block is stored in the test as an inert string constant rather than read from git
    because: "the same test file already stores a prior revision's bytes as inert fixture data, and a git-read fixture rots the moment the commit it names drifts"
    dec: none

  - id: D-06
    choice: >-
      A persona's DOCUMENTED OUTPUT BLOCK is an enforced half of the digest contract in full - its
      DIGEST fields, the artifact: path it names, and the Write grant sentence that says where that
      report may be written - so correcting all three in one task is REQ-01's own logic rather than
      new scope, and doing it before signature is planning rather than a change to an approved
      artifact
    because: >-
      measured at c369fb1f in this worktree, a plan-mode digest carrying code_grade n_a and a correct
      reviewed plan target is still BLOCKED at exit 1 with the single error that the artifact does
      not name a .harness/repo/features/FEAT location, while the identical digest with only the
      artifact line moved under the feature's own notes/ returns digest ok at exit 0 - so the field
      fix alone leaves REQ-01 unmeetable, the whole defect closes with zero change to
      validate-digest.py, and a file that corrects the artifact line while its write-grant prose
      still names the refused path contradicts itself
    dec: none
  - id: D-07
    choice: >-
      The canonical persona source is .omp/agents/**; the .claude/agents/** copies are GENERATED
      compatibility adapters and are never hand-edited. Any persona-file change in this feature is
      made in the .omp source and then regenerated with sync-agent-adapters.py --apply, and
      sync-agent-adapters.py --check returning rc 0 is what asserts the two copies agree
    because: >-
      sync-agent-adapters.py's own docstring, lines 3-5, states it verbatim - "Canonical role policy
      lives in .omp/agents. Claude files are generated compatibility adapters; edit the OMP source,
      then run --apply" - so a hand edit to the generated copy is silently reverted by the next
      --apply and the fix disappears without anything asserting anything false; --check compares all
      sixteen adapter pairs over the whole file, exits 0 at c369fb1f, and is already run by
      check-omp-port.py:156-166, so this feature needs no third guard of its own for that invariant
    dec: none
