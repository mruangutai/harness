      # Expect exit 0 and all assertions passing, including fleet cases with BOTH FACTORY_GH and GH_SYNC_GH bound to the shared fake, shared contents responses, and a complete call log proving no Harness mutation or real-gh escape. The 60-second focused ceiling is unmeasured; record first-green wall time and move the slowest case to the full matrix if exceeded, rather than inflate the claim. Full matrix runs exactly once at pinned review_sha after T-02 and before T-03 activation.
    intent: 'Execute only after explicit repair BRIEF and plan approval, directly in
      the main session under DEC-174. This task owns all shared production/schema/test
      files so no intermediate layer is declared shipped. Use test-first regressions
      in the existing unit/integration suites and fake-gh support before production
      edits. No real GitHub calls or Kaya state changes belong to this task. Keep factory_config.product_config
      and board_for, gh_board projection/station primitives, artifact_accessors and
      feature_json_write as the existing seams; do not add a second config, projection,
      lock or digest parser. resolve_binding, receipt_allows_merge and the evidence
      resolver/verifier below are NEW functions to create in the existing feature_schema
      module, not predicates claimed to exist already.

      Repository contract: create one resolve_binding(feature_doc, root) -> (repo, board,
      issue_types) in feature_schema, composing existing artifact_accessors.load_fleet,
      declared repo_entry, product_config, board_for and gh_issue_types.overrides_from_config.
      A present non-null factory.repo must be a valid declared owner/name and is authoritative;
      derive issue-type overrides from that same product config, never owner Harness
      config. Unbound Harness features retain owner-checkout configuration, sync-off
      and environmental mirror semantics; null board is legal only where the existing
      unbound Harness path permits it, not for fleet board_for. Invalid binding or unavailable/malformed
      product configuration refuses with no ancestor/disk fallback. gh-sync load_config
      loads the feature before calling this resolver, including status early branch,
      skip/build-entry and every feature-bound command. Route INV-37, board_lifecycle
      status/audit/reconcile, merge-gate and post-merge-sweep through the same resolver,
      with no per-caller binding derivation. Preserve INV-26 read-only/offline boundaries:
      network unavailability is a non-mutating diagnostic, not permission to reuse an
      unproven mapping. Refuse invalid binding/provenance before any mutation or local
      status station write. Route record-pr and ship PR reads through the bound repository
      too. Source tickets come only from the signed plan; factory claims remain unchanged.

      Add optional validated owner/name github.repo and closed github.history/github.recovery
      records in feature-schema.json. Absence remains readable for untouched historical
      records, but a nonempty active mapping with absent/conflicting repo cannot be
      reused without explicit recovery. New mappings/build-entry outcomes carry provenance.
      Factor the existing github mapping sub-schema into one shared definition excluding
      history/recovery; active github and github.history[].previous reference that same
      definition, without a second hand-listed field set. Archive previous by copying
      that object verbatim minus history/recovery, preserving every original absence
      versus value, including repo absence. Each history entry has recovery_id, at,
      repo, reason, evidence (the shared evidence_ref) and previous. Recovery has id,
      from_repo, to_repo, mode (full or terminal), state (in-progress or complete),
      plan_sha256, started_at, optional completed_at and optional pending_create with
      role and started_at; role is milestone, parent or task:<signed-task-id>. Its id
      identifies exactly one history entry, which owns the evidence reference; no second
      stored evidence copy. Validate closed keys, nonempty IDs, repositories, timestamps,
      hashes and map/number types. save_recorded preserves history/recovery rather than
      reconstructing them away. record_build_entry cannot let an archived opened generation
      prevent recovery-required on the active replacement; retain no-downgrade only
      within the same bound generation.

      Add gh-sync.py recover-mirror <feature-dir> --previous-repo <owner/name> --evidence
      <local-authentic-recovery-note> --yes, with optional --adopt-receipt <role>=<positive-number>
      for explicit reconciliation. Require --yes, authentic local authorization, unchanged
      signed plan and matching factory.repo/target configuration. Refuse disagreement
      between --previous-repo and recorded prior provenance; absent provenance is recorded
      as the evidenced prior repo, not retroactively claimed original metadata. Under
      the existing locked writer archive once, set target repo, clear only active milestone/parent/task/attached/typed
      receipts, retain signed source issues, set recovery-required and save in-progress
      before remote creation. Do not close, reopen, relabel or move previous-repository
      objects. Claims, verdicts, approvals and task statuses are unchanged.

      Extend existing feature_schema.recovery_command_for, preserving its current compatible-missing-receipt
      behavior, as the single home for full versus terminal recovery mode and recovery
      command/gate text. Add optional context for feature document/bound repo and requested
      replacement; share the existing work-started/terminal decision instead of copying
      it. Before work starts replacement creates milestone/parent/current signed task
      mirrors and finishes opened; started/completed work creates only milestone/parent
      and finishes recovered-terminal. Invalid/unproven mapping selects recover-mirror
      with required --previous-repo, --evidence and --yes operands; compatible missing
      receipts select open or recover-terminal. gh-sync, merge-gate and post-merge-sweep
      use this shared selection/formatter, deleting hard-coded gate command duplicates.
      Reuse existing title/type/link/projection logic, not a parallel DAG. Ordinary
      open refuses invalid or in-progress replacement; recover-terminal stays compatible
      adoption-only and rejects invalid provenance.

      Conservative create protocol: before each remote create durably save pending_create
      for that exact role under the same recovery ID/plan hash. Persist each returned,
      confirmed remote number and clear pending_create in one locked transition BEFORE
      any next create. A failure before dispatch can clear the intent only when no request
      could have reached the remote. A missing number, interruption with pending_create,
      or local save failure after a possibly successful create REFUSES naming the uncertain
      intent; do not issue another create. Never add issue-body recovery markers or
      automatically read back, scan, adopt a match, retry, poll or title-search for
      replacement recovery, including milestone uncertainty. Known saved receipts resume
      remaining linking/type/projection work without recreating the object; create only
      missing roles with no uncertain pending intent. Repeated completed recovery with
      identical target/evidence/plan is a durable no-op and adds no archive.

      Explicit reconciliation uses --adopt-receipt for the exact pending role only,
      never an inferred source ticket. A separately authorized immutable target-local
      note must name the recovery ID, pending role/task, target repository, positive
      object number, signed plan hash, authentic ownership evidence and adoption effect;
      number/title alone is insufficient. The same confined verifier rejects partial/ambiguous/conflicting
      evidence, duplicate role/number, wrong repo/task/plan and unapproved effects before
      state/remote changes. Store the note through the shared evidence_ref as an optional
      reconciliation reference in recovery, retained after completion for audit; renewed
      authorization uses a new note and never overwrites the originally referenced note.
      Atomically record the evidenced number and clear only that pending intent, then
      resume the same recovery generation. Adoption does not authorize another uncertain
      create or automatic discovery. A normal resume still uses the original recovery
      authorization; the new adoption note only discharges its exact pending intent.

      Create receipt_allows_merge(doc, bound_repo) in feature_schema; DELETE the three
      literal allowed-receipt sets in merge-gate, post-merge-sweep and check_state.board
      and route them to this predicate. Preserve currently legal not-applicable cases
      and frozen era exemption sets without adding Kaya/this repair. opened/recovered-terminal
      requires usable matching repo provenance and no in-progress/uncertain replacement;
      an opened string alone cannot pass a wrong-repo receipt. gh-sync preflights share
      the same provenance rule. INV-37 grades per-feature enablement/binding, not ancestor
      github.sync or factory.issues as proof. board_lifecycle scopes projection/fixes
      by resolved binding and usable receipts; remove its comment claiming github.repo
      does not exist. Invalid mappings are non-mutating diagnostics, never numbers projected
      onto another board.

      Evidence contract: define ONE closed evidence_ref $def containing required path
      and sha256. Create feature_schema.resolve_evidence_ref(feature_dir, operand) ->
      {path, sha256} and verify_evidence_ref(feature_dir, ref, subject) as the one confined
      path/hash and subject/effect resolver/verifier for cycle/refusal writers, history/recovery,
      recover-mirror/adoption and all INV-7/INV-15/INV-46 readers. CLI absolute operands
      are allowed only inside the target feature containing feature.json; normalize
      stored paths feature-relative. Reject lexical parent traversal, symlink escape,
      nonregular/absent files, external files, changed hash and wrong feature/repository/run/plan/effect
      before state changes. Define one operator_authorization shape with by, at and
      authorization referencing evidence_ref, reused for operator-history cycle/refusal
      provenance. Do NOT migrate set-rework or raise-cycles or tighten their existing
      _require_decision_file operand grammar. digest_record remains the sole accepted-digest
      selector/parser; feature_schema remains JSON-only without PyYAML.

      Cycle contract: optional closed cycle_evidence carries source (lead-digest or
      operator-history), path, sha256 using the evidence_ref definition; operator-history
      additionally carries by, at and authorization using the shared authorization shape.
      Store no reported_cycles or third count. For lead-digest compare run.cycles_used
      == DIGEST.cycles_used selected through digest_record; retain CLI --cycles-used
      and validate it against that digest, not the rolled-up VERDICT. Explicit historical
      supported counts live only in the operator-history authorization note and must
      equal the run attribution. close-run forwards its digest to run-end; run-end --digest
      is required for new/changed attribution including newly attributed zero. Add feature-record.py
      record-cycle-evidence --file <feature.json> --id <run-id> --digest <digest.md>
      --evidence <operator-note> --by <operator> --yes to attach authentic historical
      authorization to the original run/count, refusing contradiction. A refused historical
      run without an accepted digest can derive count only from separately authorized
      authentic history, never malformed prose treated as DIGEST.

      Retain legacy residual = prior feature total minus existing per-run attributions;
      new total = residual plus updated attribution sum. Refuse attributed totals above
      feature total, negative/bool counts and contradictory evidence. Repeated reports
      preserve totals/evidence identity, measured tokens and original timestamps. INV-7
      grades these relationships and shared evidence verification, not number of FAILs.
      Legacy entries without evidence/attribution remain readable with explicit unknown
      notes; never inferred zero, invented evidence or rewritten totals. Preserve INV-39
      ceilings/raise authorization and INV-40 regate duties; regate itself is not send-back
      evidence. Update descriptions and table inputs/contracts so --changed includes
      every evidence artifact actually read. Fleet-wide forward duty applies only to
      new/changed attribution; unchanged historical rows and exact replay need no retroactive
      backfill or rewritten timestamp. Missing new evidence refuses before total changes.

      Refusal contract: optional closed refusal alone marks refused provenance; do NOT
      add return_status or store constant validation_exit. refusal contains source (close-run
      or operator-history), digest (evidence_ref), original run_id, reason, by and at;
      operator-history adds authorization (evidence_ref). BLOCKED-only and exact run/hash
      subject checks apply. Normal records keep existing accepted-return rules. close-run
      --refused-return accepts only the expected validator CLI contract-rejection exit
      1, not valid returns, crashes, signals, missing/unreadable artifacts or arbitrary
      nonzero. Persist provenance through the locked writer before later station/judgement/spend
      stages, preserving raw malformed digest bytes. Repeat closure preserves refusal
      identity and attribution/tokens; normal close cannot upgrade refusal to PASS.
      New/changed refused-run attribution, even zero, obeys the same authentic evidence
      duty.

      Add feature-record.py record-refusal --file <feature.json> --id <run-id> --digest
      <original-digest.md> --evidence <operator-note> --by <operator> --reason <text>
      --yes for closed historical BLOCKED runs only. Evidence must authorize that exact
      run/hash/effect. Do not rerun old prose through the live schema, alter verdict/time,
      synthesize an accepted fence or change reports. Use shared evidence_ref verification
      and digest_record accepted selection, not another parser. INV-15/INV-46 keep complete
      as execution completion, retain weaker existing accepted historical key/verdict
      checks, and report proven BLOCKED refusal as refused completion, not accepted
      PASS. Missing/mismatched evidence or complete with neither accepted return nor
      valid refusal still violates; later success cannot mask earlier malformed reports.
      Preserve state.yaml vocabulary, INV-36 identity and DEC-237 closed object-only
      live validation; historical metadata never authorizes a live append bypass.

      Authorization is target-local, not relative to caller/repair checkout. T-03 separately
      creates canonical Kaya notes/research-fleet-planning-recovery-authorization.md
      with identity/date, authentic origin, feature/repository binding, run IDs/digest
      hashes, supported historical counts, signed plan hash and expressly permitted
      metadata/replacement effects. Its bytes/hash, not the external repair receipt,
      are runtime evidence. Existing original digests remain in place; authorization
      is not invented history or an accepted return. Renewed/adoption authorization
      is a new immutable target-local note/reference, never overwrite referenced history.

      Tests: in existing gh_sync_support.run set BOTH FACTORY_GH and GH_SYNC_GH to the
      same fake binary and add ONE shared repos/<repo>/contents handler returning per-repo
      product configs and loudly rejecting unknown repos/unsupported calls. Ensure env_extra
      cannot silently restore a real binary in fleet tests. Exercise the real product_config
      subprocess path, board and issue-type overrides against conflicting Harness/Kaya
      config and colliding numbers; assert the COMPLETE fake call log includes config
      reads, targets correct repo/overrides and contains NO Harness mutation or real-gh
      escape. Cover every feature-bound command, build-entry and board reconciliation,
      missing config, malformed binding, sync off and null board only on legal unbound
      paths, matching/absent/mismatched provenance and status preflight ordering. Cover
      schema refs/closed keys, verbatim previous snapshots including absent repo, shared
      gates and partial/invalid receipts. Cover signed source separation, full/terminal
      modes, saved milestone/parent/task progress and repeated completion; interruption
      before create, remote-success/no-number, local-save failure and restart with pending
      intent must refuse with no next create and unchanged durable known receipts. Assert
      NO automatic recovery reads/scans/retries/poll/title-search or issue markers.
      Exercise separately authorized explicit adoption of each role under the same ID,
      no duplicate create/archive, and partial/ambiguous/wrong-role/repo/plan evidence
      refusal before changes. Existing nonreplacement read purposes remain unchanged.

      Add unit cases for authentic two FAILs with 0/1, one real send-back, repeated
      deltas, preserved legacy residual and conflicting/negative/bool counts; checker
      cases preserve ceilings/regates. Cover missing new digest, authentic newly attributed
      zero, forwarding, unchanged legacy and replay. Cover lead-evidence equality without
      a stored third count; reject unauthorized historical counts. Cover refusal before/after
      later valid run, changed hash, absent provenance, valid-digest misuse, validator
      exit/crash/read failure and repeated close. Keep DEC-237 null/prose/fenced/live-object
      negative controls. Unit/integration cases reject external repair evidence unchanged,
      accept authentic target-local authorization, and reject traversal/symlink/mutated
      bytes/wrong subject/effect before writes. Absolute-inside-target operands normalize
      to the same evidence_ref read by every historical consumer.

      Produce actual red-first receipts and named tests for SC-01 through SC-06, with
      measured first-green focused wall time; the 60-second ceiling is currently unmeasured.
      If exceeded move the slowest case to full-matrix coverage, not delete coverage
      or inflate the claim. Main/qa runs the full active unit/integration matrix EXACTLY
      ONCE at pinned review_sha after T-02 and before T-03 activation, including existing
      live validation and all gh-sync suites; T-03 through T-05 add no code and require
      no second matrix. No unexecuted claims, UI, generic retries, telemetry, framework
      redesign, invented source tickets or unrelated fixes. S-6 timestamp/hash factoring
      and S-13 possible close-run count derivation are build notes only, not scope/tasks/SC
      additions; this plan retains --cycles-used.

