    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 keeps clean-checkout proof collection and the immutable canonical-writer pin with the direct main-session change.
    depends_on: [T-01]
    status: done
    files:
      - .harness/harness/features/FEAT-70-long-file-plan-merge-package/notes/**
    verify: |
      python3 -c 'import re,subprocess; rel=".harness/harness/features/FEAT-70-long-file-plan-merge-package/notes/clean-pin-byte-receipts.generated.md"; c=subprocess.check_output(["git","log","-1","--format=%H","HEAD","--",rel],text=True).strip(); assert c,"receipt commit not found"; t=subprocess.check_output(["git","show",f"{c}:{rel}"],text=True); p=re.findall(r"(?m)^implementation_pin: ([0-9a-f]{40})$",t); assert len(p)==1,p; pin=p[0]; assert pin!=c; assert "baseline: 9e531b34fc04f752cedf51586dc13c460580901a" in t; assert re.search(r"(?m)^baseline_existing_cases: 107/107 PASS$",t); assert re.search(r"(?m)^pin_existing_cases: 107/107 PASS$",t); assert re.search(r"(?m)^behavioral_identity: PASS$",t); assert re.search(r"(?m)^scratch_identity: PASS$",t); assert re.search(r"(?m)^overall: PASS$",t); subprocess.run(["git","merge-base","--is-ancestor",pin,c],check=True); subprocess.run(["python3",".harness/harness/features/FEAT-70-long-file-plan-merge-package/notes/receipt-scripts/feat70-grade-assert.py",pin,"9e531b34fc04f752cedf51586dc13c460580901a"],check=True)'
    intent: |
      After T-01 is committed and green, designate that exact full SHA as the immutable implementation pin before creating any receipt script or receipt file. Under notes/receipt-scripts adapt the FEAT-69 structure as feat70-baseline.py, feat70-cleanpin.py, and feat70-grade-assert.py; do not introduce a second proof framework. The scripts create clean detached baseline and pin checkouts under .claude/worktrees/harness, assert the exact checked-out SHAs and empty status before measurement, never fetch or use GitHub, and delete no pre-existing worktree.

      The grade assertion enumerates the entry and the exact eleven Python files in plan_merge at the pin, requires every function at grade 4 or better, requires all twelve named baseline below-bar identities to be present at their package owners, and proves signed_task_hash remains importable from the entry. Parse the baseline monolith as the pre-image table: match every moved function by its qualified identity, record baseline and pin grades, require unchanged moved bodies to retain grade identity, require the twelve named functions to improve to at least 4, and list each genuinely new function separately at grade 4 or better. Run the pin assertion against both snapshots so baseline is the committed red and pin is green.

      For SC-02, run the baseline checkout's own baseline test-plan-merge.py against its monolith and the pin checkout's package-aware test-plan-merge.py against its entry plus package. In each checkout assert that CASES contains exactly the same 107 pre-existing case identities, that every one runs, the process exits zero, and no FAIL result is printed; separately require the pin's added SC-03 regression green. Never run the frozen baseline driver against the pin, and do not compare whole-suite transcripts: baseline-only monolith source reads and private in-process imports are structurally invalid after the split, while T-01's package-aware equivalents must remain green at the pin.

      Build the exact baseline-versus-pin identity ledger from public CLI subprocess behavior exercised by the 107-case corpus, excluding only results produced solely by monolith source-text inspection or direct private-helper calls. For every included subprocess observation, align the stable case identity and invocation ordinal and record argv, fixture context, exit status, stdout bytes, stderr bytes, plan bytes before and after, and hashes. A missing, added, reordered, or unalignable behavioral invocation is a difference, not an exclusion. Preserve concurrency trial order and every public refusal or success path. This comparison is independent of the two suite-pass receipts, so package-aware rewrites of private assertions cannot mask a CLI difference.

      Discover every .harness/harness/features/*/plan.yaml tracked at the implementation pin except FEAT-70-long-file-plan-merge-package. Make an independent scratch copy for each implementation and preserve discovery order. For each plan, run check; load its current top-level station and run set-feature-station to that same value; for each task in document order run set-task-station to its explicit station or ready when absent; then for each task or decision string field other than id and status, in document and field order, run amend --show. Record every command, exit status, stdout, stderr, before bytes, after bytes, and hashes. Do not include record-amendments in this script because it crashes at baseline; SC-03 is its red-first proof.

      Run each baseline and pin measurement once and derive every reported byte, hash, difference, and verdict from that execution. Before comparison replace only each checkout's raw absolute root bytes with one common token on both sides. Apply no other normalization, filtering, sorting, message rewriting, or accepted-difference rule. Require normalized exit status, stdout, stderr, and resulting plan bytes to match for every behavioral subprocess record and the scratch-plan script. Put every remaining difference in build-divergences.md with exact old and new bytes and leave overall red unless the operator explicitly rules it.

      Record the SC-03 case separately: the same new two-entry digest test must fail against the baseline implementation at the block-scalar list-shape defect and pass at the pin with both fields and the atomic ledger update. Capture commands, exit values, stdout, stderr, plan bytes, ledger bytes, and hashes. This intended behavior difference does not enter the SC-02 identity ledger.

      Commit notes/receipt-scripts, red-first-receipts.md, clean-pin-byte-receipts.generated.md, clean-pin-byte-receipts.md, and build-divergences.md only after the immutable pin exists. The generated receipt contains exactly one implementation_pin line with the full 40-character SHA, exactly one baseline line naming 9e531b34fc04f752cedf51586dc13c460580901a, and the exact lines baseline_existing_cases: 107/107 PASS, pin_existing_cases: 107/107 PASS, behavioral_identity: PASS, scratch_identity: PASS, and overall: PASS only when every required comparison and assertion passes. Every receipt names both full SHAs, detached checkout paths and clean status, exact commands, timestamps, one-execution provenance, raw and normalized hashes, comparison outcomes, grade tables, regression outcomes, and the exact-byte divergence ledger. State that the receipt commit postdates the pin and that no receipt or script is claimed to exist in the pin. Do not amend the implementation pin; any production or test change selects a new pin and reruns every measurement.
