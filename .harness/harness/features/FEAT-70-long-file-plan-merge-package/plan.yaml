tasks:
  - id: T-01
    title: Split plan-merge into the settled package and fix block-scalar amendments
    traces: [SC-01, SC-02, SC-03]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 assigns plan-merge.py, its source classification, and its owning tests directly to the main session because they gate every plan write.
    depends_on: []
    status: done
    files:
    - .claude/skills/harness/bin/plan-merge.py
    - .claude/skills/harness/bin/plan[-_]merge*
    - tests/integration/test-plan-merge.py
    - tests/integration/check_state_support.py
    - tests/integration/canonical-reader-classification.json
    verify: |
      python3 -c 'import importlib.util,pathlib,sys; r=pathlib.Path("."); p=r/".claude/skills/harness/bin/plan_merge"; want={"__init__.py","text.py","guards.py","union.py","approval.py","stations.py","panel.py","amend.py","amendments.py","delete.py","check.py"}; assert {x.name for x in p.glob("*.py")}==want; g=r/".claude/skills/harness/bin/code_grade.py"; s=importlib.util.spec_from_file_location("feat70_grade",g); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m); paths=[r/".claude/skills/harness/bin/plan-merge.py",*sorted(p.glob("*.py"))]; bad=[(q.path,q.qualname,q.grade) for x in paths for q in m.grade_source(x.read_text(),str(x)) if q.grade<4]; assert not bad,bad; sys.path.insert(0,str(r/".claude/skills/harness/bin")); e=importlib.util.spec_from_file_location("feat70_entry",paths[0]); n=importlib.util.module_from_spec(e); e.loader.exec_module(n); assert callable(n.signed_task_hash)' &&
      python3 tests/integration/test-plan-merge.py && python3 tests/integration/test-check-state-worktrees.py && python3 tests/integration/test-check-plan-routes.py
    intent: |
      Work only in the assigned FEAT-70 worktree at baseline 9e531b34fc04f752cedf51586dc13c460580901a. Before production edits, add the SC-03 regression to test-plan-merge.py and run it red: record-amendments receives a valid two-entry digest, the first entry replaces a block-scalar field and the second replaces another allowed field, and baseline crashes before both entries and the ledger can land. Retain that case as the observable atomicity regression; after the fix it must assert both requested values, block-scalar reload identity, a valid two-entry amendment ledger, no partial plan or ledger write on refusal, exit zero, and no traceback.

      Keep .claude/skills/harness/bin/plan-merge.py at its exact hyphenated path as a roughly 250-line forked entry. It contains the existing docstring, imports and required public re-exports, _register_record_panel, _register_sign_approval, _register_amend, _register_delete_items, the one unchanged VERBS dispatch table, and main. It remains the only CLI. Preserve argv, exit codes, stdout, stderr, lock behavior, signal behavior, and every byte written. Preserve signed_task_hash as a callable import from the entry for check-state INV-40. Do not edit any current caller, introduce a shim, add a family entry point, or create a second dispatcher.

      Create plan_merge/__init__.py and exactly ten implementation modules. text.py owns the shared regexes and all generic indexing, field extraction, render, splice, reindent, item-boundary, and deletion-boundary primitives, including _index_top_keys, _index_list_items, _field_lines, _item_range, _field_block, _render_field, _structured_field_lines, _reindent, _splice_out, and _item_delete_end. guards.py owns _resolve_plan, _legal_stations, _refuse_illegal_station, _reload_or_refuse, _schema_error, _die, _locked_plan_update, _replace_bytes, _restore_plan, _refuse_governed_agent, and anchor validation. union.py owns apply and add-tasks, MergeResult, _verify_spliced, receipt rendering, replacement logic, and the UNION_MERGE, PRESERVE_BASE_BYTES, and APPROVAL_REFUSAL proof switches. approval.py owns sign-approval, revoke-approval, rework recording, signed task hashes, and approval-signature helpers. stations.py owns set-task-station, set-feature-station, station classification, and the complete reset/resume family from _now_iso through _maybe_reset_approval, including RESET_FIELDS, _RESET_LINE_RE, _approval_status, _replace_approval_reset, _reset_approval_lines, _task_statuses, _review_complete, _WORK_STARTED, _work_started, _resume_station, _verify_reset, and _approval_reset_context. approval.py calls that stations family for revoke rather than duplicating it. panel.py owns panel and lanes validators, byte-preserving panel splice, record-panel, set-key, set-panel, set-lanes, and KEY_VALIDATORS so its forward binding remains within one module. amend.py owns amend, amendments.py owns record-amendments and the all-or-nothing plan-plus-ledger update, delete.py owns delete-items, and check.py owns check.

      Fix the crash in text.py by changing _render_field's block-scalar return contract from one joined list element to the list of physical lines that every splice consumer indexes. Do not special-case record-amendments or the test digest. Consolidate TASK_ID_RE and ITEM_ID_RE into one shared text.py regex. Move comments and banners byte-for-byte with the code they describe and make no rename beyond package-qualified imports and the explicitly named grade decompositions.

      In stations.py, implement _task_search(lines, lo, hi, task_id) as the current tasks-range loop: append each matched id before testing the target or terminator, retain the first target, and stop only on a later item at the target indent. Implement _status_in_task(lines, start, indent) as the current scan from start through the input end: stop at the next item of the same indent and return the first status line whose indentation is deeper. _task_status_line uses _index_top_keys to obtain only the tasks range, delegates to those helpers, and returns the exact current index/indent or None/id-list tuples. Preserve the append-before-break terminator id, scan-to-end behavior for a final task, duplicate-first behavior, id ordering, and caller refusal text.

      In union.py, _reload_spliced decodes and loads the candidate and preserves both current parse refusals and the mapping refusal verbatim. _verify_schema_preserved applies the existing do-no-harm rule only when the base passes _schema_error and preserves the three-line refusal. _expected_union_ids returns base ids in order followed by proposal ids not already present. _verify_union_ids iterates UNION_KEYS, skips keys absent from out_order, compares exact ordered ids, and preserves the existing refusal. _verify_spliced retains its full signature including unused added_ids, calls those helpers in the current order, then _verify_replaced, and returns the reloaded mapping.

      Bring every function in the entry and package to code grade 4 or better. The baseline grade-2 functions are _task_status_line, _verify_spliced, cmd_amend, and cmd_amend.transform; the grade-3 functions are _item_range, _index_list_items, _find_field_line, _parsed_value, _index_top_keys, _print_apply_receipt, _panel_own_end, and _replace_fields. Improve each in its owner without changing public or internal observable behavior. All new helpers must also meet the bar; no exemption and no file-length gate.

      In check_state_support.py, extract copy_check_state's current shutil behavior into the single generalized copy_executable_package(entry, package_name, dst_bin) operation. It resolves the package as package_name beside realpath(entry), copies the entry to dst_bin under its basename while preserving executable mode, copies the complete sibling package without __pycache__, and is the only implementation of those copy semantics. Keep copy_check_state as a thin delegate using SCRIPT and check_state so existing check-state callers do not change. In test-plan-merge.py, add copy_plan_merge(dst_bin) only as a thin delegate to that shared operation using CLI selected from PLAN_MERGE_BIN and sibling plan_merge. Every isolated-bin, in-process import, and source-mutation proof must use that copied tree; do not add independent shutil.copy/copytree logic.

      Update the same 107 pre-existing test-plan-merge cases for package ownership without changing their observable assertions. case_amend_f2_under_lock_hash_is_pinned loads _require_locked_hash from plan_merge/amend.py and reads its wiring source there; case_delete_items_verify_catches_a_boundary_error_that_still_parses loads _verify_deletion from plan_merge/delete.py and reads its wiring source there. Resolve both owners from the PLAN_MERGE_BIN entry's sibling package, including overridden isolated copies. Convert every mutation that formerly copied or patched only plan-merge.py to copy the full tree and patch the owner module. Keep the three proof switches in union.py and retain each proof's original discriminating behavior. Do not add private entry re-exports, keep stale monolith source assertions, or pad entry source to satisfy them.

      Re-key exactly the 15 canonical-reader-classification rows currently sourced from plan-merge.py. Change only each row's source-derived file and id to its actual plan_merge owner and preserve artifact, category, DEC-174 category, disposition, route, exemption, reason, remedy, symbol, task, and ordinal. Replace the legacy scanned_files source with the unchanged entry plus __init__.py and all ten modules. The owning classification suite must remain green. Do not edit validate-digest.py, check-domain.py, gh-sync.py, or unrelated long files.
