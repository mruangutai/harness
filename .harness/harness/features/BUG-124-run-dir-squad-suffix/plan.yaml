decisions:
  - id: D-01
    choice: >-
      The dispatch-time rule is callee-INDEPENDENT shape validation: every
      .harness/*/features/*/runs/<slug>/... path named in a governed dispatch prompt must match at
      least one write grant whose pattern contains /runs/, and no ownership by the dispatched
      persona is checked.
    because: >-
      A prompt may name a run-dir path the callee writes and one it merely reads and prose cannot
      tell them apart, so a callee-specific rule generates false positives on legitimate read
      references, while a path no lead at all can write is wrong whoever reads it. Scoping to the
      run-dir grant family is also what makes the rule non-vacuous, since the orchestrator holds
      .harness/*/features/** and a rule requiring only that the path resolve to at least one agent
      would pass the reported defect unchanged.
    dec: none
  - id: D-02
    choice: >-
      The squad vocabulary and the compliant forms printed in the refusal are DERIVED from
      .harness/team-config.yaml at runtime by harness_boundary.run_dir_grant_globs, and no squad
      name is spelled literally in the guard or the library.
    because: >-
      A second vocabulary beside the manifest is treated as a defect in this repo, and a renamed or
      added squad must change the gate with no second edit.
    dec: none
  - id: D-03
    choice: >-
      The manifest is parsed through harness_yaml in a SEPARATE non-isolated python invocation in
      the shell half of dispatch-guard.sh, whose result crosses into the python3 -I body as the
      environment variable HARNESS_RUN_DIR_GLOBS.
    because: >-
      DEC-171 requires a real PyYAML parse and strikes hand-rolled YAML regex readers of this
      manifest, but PyYAML lives in the user site-packages that python3 -I excludes (measured at the
      pinned sha: the isolated import fails while a plain import succeeds), so a parse inside the
      isolated body would fail open on every dispatch and the gate would never fire. Dropping -I was
      rejected because it weakens the isolation of a security gate and changes the invocation that
      integration case 16 pins.
    dec: none
  - id: D-04
    choice: >-
      The check runs after the harness_boundary import and BEFORE the checkout resolution and the
      single-flight claim, and on its own failure it falls through to the claim step rather than
      exiting.
    because: >-
      A refusal recorded after a claim strands that claim in the registry, and an early exit 0 would
      silently skip the claim the guard exists to record.
    dec: none
