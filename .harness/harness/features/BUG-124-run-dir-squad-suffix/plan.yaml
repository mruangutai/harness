decisions:
  - id: D-01
    choice: >-
      The dispatch-time rule is callee-INDEPENDENT shape validation: every
      .harness/*/features/*/runs/<slug>/... path named in a governed dispatch prompt must match at
      least one write grant whose pattern contains /runs/, and no ownership by the dispatched
      persona is checked.
    because: >-
      A prompt may name a run-dir path the callee writes and one it merely reads and prose cannot
      tell them apart, so a callee-specific rule generates false positives on legitimate read
      references, while a path no lead at all can write is wrong whoever reads it. Scoping to the
      run-dir grant family is also what makes the rule non-vacuous, since the orchestrator holds
      .harness/*/features/** and a rule requiring only that the path resolve to at least one agent
      would pass the reported defect unchanged.
    dec: none
  - id: D-02
    choice: >-
      The squad vocabulary and the compliant forms printed in the refusal are DERIVED from
      .harness/team-config.yaml at runtime by harness_boundary.run_dir_grant_globs, and no squad
      name is spelled literally in the guard or the library.
    because: >-
      A second vocabulary beside the manifest is treated as a defect in this repo, and a renamed or
      added squad must change the gate with no second edit.
    dec: none
  - id: D-03
    choice: >-
      The manifest is parsed through harness_yaml in a SEPARATE non-isolated python invocation in
      the shell half of dispatch-guard.sh, whose result crosses into the python3 -I body as the
      environment variable HARNESS_RUN_DIR_GLOBS.
    because: >-
      DEC-171 requires a real PyYAML parse and strikes hand-rolled YAML regex readers of this manifest, but PyYAML lives in the user site-packages that python3 -I excludes (measured at the pinned sha: the isolated import fails while a plain import succeeds), so a parse inside the isolated body would fail open on every dispatch and the gate would never fire. Dropping -I was rejected because it weakens the isolation of a security gate and changes the invocation that integration case 16 pins. An orchestrator measurement dated 2026-09-07, taken at 6d969ed3 on this machine, bounds what remains at risk: import yaml SUCCEEDS under /opt/homebrew/bin/python3, under /usr/bin/python3 and under PATH=/usr/bin:/bin python3, while python3 -I -c import yaml fails. So the shell-half bridge is necessary, and the gate is not a dead no-op in this environment - which is why the plan panel blocking question about the python3 a live hook resolves is ANSWERED, and panel finding F-4 is an observability defect rather than a dead gate. What the measurement does not buy is silence: the derivation subprocess must still be able to report its own breakage, so T-02 gives it a non-zero exit on a failed parse and two distinguishable SKIPPED texts.
    dec: none
  - id: D-04
    choice: >-
      The check runs after the harness_boundary import and BEFORE the checkout resolution and the
      single-flight claim, and on its own failure it falls through to the claim step rather than
      exiting.
    because: >-
      A refusal recorded after a claim strands that claim in the registry, and an early exit 0 would
      silently skip the claim the guard exists to record.
    dec: none
  - id: D-05
    choice: >-
      A run-dir path that is QUOTED or illustrated rather than directed - in the guard refusal
      message itself, in a plan verify: or intent: block, in a receipt, in a bug report - is
      spelled with [.]harness/ in place of .harness/, which run_dir_refs cannot see because it
      anchors on the literal .harness/ segment. The guard prints every path in its refusal in
      that form, and the convention is stated once in the Run-dir slugs paragraph of
      .claude/skills/harness/SKILL.md rather than left to be inferred from the refusal output.
    because: >-
      The reported case must still fail closed, so the escape cannot be an override flag or a
      suppression token: it is a spelling that breaks the anchor, and a governed dispatch cannot
      carry it by accident because a directive path has to resolve on disk for the callee to
      write it while [.]harness resolves nowhere in any checkout. On panel Q2 the ruling is to
      state it in SKILL.md, because a dispatcher who hits a FALSE refusal - a prompt that merely
      quotes or illustrates a run-dir path rather than directing a write - is expected to
      re-spell that one reference with the [.]harness/ anchor and re-dispatch with nothing else
      changed, and the authors who most need the rule are the plan and dispatch writers who have
      not been refused yet and whom the refusal output never reaches. Anchor-breaking the
      refusal alone was rejected: it teaches the convention only by example, only after a block,
      and leaves a reader unable to tell an escape from a typo. A typed marker such as a NOSCAN
      token was rejected because anything a dispatcher can type into a quote can also be typed
      into a directive, which is a suppression switch on a security gate.
    dec: none
