    intent: |
      TWO PARTS. Part 1 is comments only in .github/workflows/tests.yml - no step body, no key, no
      trigger change. Part 2 adds ONE case to
      .claude/skills/harness/bin/test-check-plan-routes.py. Nothing else in either file changes.

      PART 2 - THE ASSERTION THAT LANDS HERE, AND WHY IT COULD NOT LAND AT T-01.
      Add one case to the case_26 family:
          case_26o_real_workflow_text_has_zero_phantom_citations
      It reads .github/workflows/tests.yml as text and asserts
      phantom_citations(text) == [], with the returned list interpolated into the failure
      message. T-01 built and mutation-proved phantom_citations but could not assert it against
      the real file, because at T-01 the real file still cited case_25b9 at line 44 and the case
      would have been red on the task that introduced it. Part 1 of THIS task is what removes
      that citation, so this is the first point at which the assertion is true - and adding it
      here is what stops the scanner from being a gate that never runs against the real file.
      Do the comment repairs FIRST, then add the case, then run the verify.
      After this task the case_26 family has FIFTEEN cases: the fourteen T-01 added plus
      case_26o.

      Two ids are cited in the workflow today and the enumeration is complete: case_25b9 at
      line 44, which Part 1 removes, and case_19a3b at line 177, which resolves via the
      check(" label at test-check-plan-routes.py line 366 and must be left exactly as it is.
      Do not touch line 177.

      PART 1 - THE FOUR COMMENT SITES. All four are currently false or stale. Each replacement cites the cases added by T-01 in
      .claude/skills/harness/bin/test-check-plan-routes.py, and must say "change both together",
      matching the coupling pattern the file already uses at lines 141-146 and 192-197.

      TWO CITATION RULES, BINDING AT EVERY SITE BELOW.
        RULE A - a citation ENUMERATES exactly the cases that site relies on, one id at a time, and
        NEVER uses a range. A range silently drops any case added later: case_26j was added after
        the first draft, and every range written before it excluded it while still reading as
        complete. There is no correct range notation here - the ids are not lexically ordered.
        RULE B - cite the FULL check() label, never the bare case_NNx. "case 25" is exactly the
        short form that rotted at line 112: a number carries no claim, so nobody notices when the
        test behind it asserts something else. The full labels are:
          case_26a_real_workflow_has_zero_ci_wiring_violations
          case_26b_plan_route_step_deleted_is_a_violation
          case_26c_exit_capture_removed_is_a_violation
          case_26d_missing_summary_exit_removed_is_a_violation
          case_26j_missing_examined_exit_removed_is_a_violation
          case_26e_examined_zero_guard_removed_is_a_violation
          case_26f_exit_rc_replaced_by_exit_zero_is_a_violation
          case_26g_layout_gate_step_deleted_is_a_violation
          case_26h_container_key_added_is_a_violation
          case_26i_phantom_case_citation_is_a_violation
          case_26k_guard_is_wired_into_the_required_context
          case_26l_unit_suite_step_deleted_is_a_violation
          case_26m_continue_on_error_on_a_guarded_step_is_a_violation
          case_26n_step_level_if_on_a_guarded_step_is_a_violation
          case_26o_real_workflow_text_has_zero_phantom_citations
        A site cites only the labels whose cases assert what its own prose claims - not the whole
        list. Check each site's list against its own sentence before writing it.

      SITE 1 - line 112, inside the "AND THE STEP CAN BE DELETED BY THE THING IT PROTECTS" block.
      It currently says test-check-plan-routes.py case 25 reads this file and asserts the step is
      here and unneutered. That is false: case_25a-case_25e (test-check-plan-routes.py lines
      1030-1093) assert plan.yaml status values. Replace the citation with exactly these EIGHT full
      labels, one per claim the sentence makes:
          case_26b_plan_route_step_deleted_is_a_violation          (the step is present)
          case_26c_exit_capture_removed_is_a_violation             (it captures the checker's exit)
          case_26d_missing_summary_exit_removed_is_a_violation     (exit 1 on a missing summary line)
          case_26j_missing_examined_exit_removed_is_a_violation    (exit 1 on a missing examined line)
          case_26e_examined_zero_guard_removed_is_a_violation      (exit 1 on examined == 0)
          case_26f_exit_rc_replaced_by_exit_zero_is_a_violation    (it propagates the checker's exit)
          case_26m_continue_on_error_on_a_guarded_step_is_a_violation  (it cannot be made non-fatal)
          case_26n_step_level_if_on_a_guarded_step_is_a_violation      (it cannot be made skippable)
      Eight ids for eight claims - the prose enumerates five behaviours plus presence, and the word
      "unneutered" in the sentence covers the two ways the step can be switched off without being
      deleted: continue-on-error and a step-level if. A list that stops at six would leave that
      clause of the comment uncited, which is this feature's own defect.

      SITE 2 - line 116, the header "M IS ASSERTED, NOT JUST THE EXIT CODE." False as written:
      plans is extracted at line 154 and read only by the echo at line 180; no conditional touches
      it. Rewrite the header so it states what is actually live - the summary line must EXIST, and
      the examined line must exist and be non-zero - and keep the block's existing explanation at
      lines 156-164 of why the plans == 0 check was removed on 2026-08-13. Do NOT reinstate
      M-gating and do not imply a future reader should. Say plainly that M is reported, not gated.

      SITE 3 - line 44, "case_25b9 keeps the key banned; nothing checks the uid." case_25b9 does
      not exist anywhere under .claude/skills/harness/bin/. Replace it with exactly one full label,
      case_26h_container_key_added_is_a_violation, which asserts a container key on the integration
      job is a violation - that is the site's only claim. Keep the second half - nothing checks
      the runner uid - it is still true. Do NOT name any new case case_25b9; naming a test after a
      phantom citation manufactures a match instead of fixing one.

      SITE 4 - lines 183-184, "THE LAYOUT GATE (FEAT-20/T-03, REQ-06). Nothing in the repository
      asserts this step is present or unneutered." No longer true after T-01. Replace the second
      sentence with a citation to exactly one full label,
      case_26g_layout_gate_step_deleted_is_a_violation - the site claims presence and the final
      exit "$rc", both of which that one case asserts - and state what remains uncovered: the step's
      inner branches are not pinned.

      ONE THING THAT MUST STAY SAID, in the Plan-route gate block: the Integration suite step
      (line 81) is what carries these assertions into CI, and nothing can protect that step from
      inside this workflow - deleting it leaves the job green with the guard never run. Write it as
      a known, accepted limitation with no fix implied here.

