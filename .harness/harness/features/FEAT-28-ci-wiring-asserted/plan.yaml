tasks:
  - id: T-01
    title: Add a parsed CI-wiring predicate and its mutation cases to test-check-plan-routes.py
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-07, REQ-08]
    change_type: logic
    execution_mode: main-session-direct
    execution_agent: harness-dev-ops
    depends_on: []
    status: abandoned
    files:
      - .claude/skills/harness/bin/test-check-plan-routes.py
    verify: |
      python3 .claude/skills/harness/bin/test-check-plan-routes.py && git diff --exit-code -- .github/workflows/tests.yml
    intent: |
      Add a new case family case_26 to .claude/skills/harness/bin/test-check-plan-routes.py, and
      call it from main() after case_25(). Nothing outside this file changes.

      WHAT IT GUARDS. .github/workflows/tests.yml is read by nothing in this tree today, so any of
      its gate steps can be deleted by the same PR they would have failed: pull_request runs the
      workflow from the PR's own ref, the required status context is the job id integration
      (tests.yml line 32, the job carries no name key), and a deleted step still emits it green.

      SHAPE - A PREDICATE OVER PARSED YAML, NOT A GREP OVER A FILE.

      1. Add a module-level constant for the workflow path, derived from REPO_ROOT, which this file
         already computes:
             CI_WORKFLOW = os.path.join(REPO_ROOT, ".github", "workflows", "tests.yml")
         Do NOT make this overridable by an environment variable. An inherited value would silently
         redirect the real-file case away from the real file and nothing would notice - the VF-1
         hazard documented at check-domain.sh lines 37-44. Mutant cases receive a parsed document
         as an argument instead.

      2. Add a pure function that takes an already-parsed document and returns a list of violation
         strings:
             def ci_wiring_violations(doc):
         It covers items a through h below and NOTHING about case-id citations - the citation scan
         is a separate sibling function, for the reason given in item 3.
         It must find steps by NAME inside doc["jobs"]["integration"]["steps"], never by index -
         immunity to step reordering is the reason for parsing. A step that is not found is itself
         a violation naming which step is missing. Report, in this order:
           a. "job integration missing" if doc has no jobs.integration mapping.
           b. "job integration declares container:" if the integration job mapping contains the key
              container. The comment at tests.yml line 44 bans that key because a container job
              runs as root, root ignores file permissions, and the chmod 000 assertions in
              test-check-domain.py and test-gh-sync.py would then pass for the wrong reason.
           c. "step missing: Plan-route gate" if no step has name == "Plan-route gate".
           d. If it is present, five behaviour checks over its parsed run: scalar, each reported as
              its own violation string naming what is gone. Use Python substring or re.search over
              the already-parsed string - that is not a shell grep over a file, so issues #248 and
              #249 do not apply:
                - the checker is invoked and its exit captured: the run body contains
                  "check-plan-routes.py" and contains "|| rc=$?"     (tests.yml line 136)
                - the missing-summary branch: the body contains 'if [ -z "$summary" ]' and an
                  exit 1 inside it                                    (tests.yml lines 149-152)
                - the missing-examined branch: the body contains 'if [ -z "$examined" ]' and an
                  exit 1 inside it                                    (tests.yml lines 166-169)
                - the discovery guard: the body contains '[ "$examined" -eq 0 ]' and an exit 1
                  inside it                                           (tests.yml lines 170-173)
                - the verdict is propagated: the body contains 'exit "$rc"'   (tests.yml line 181)
              Do NOT assert anything about the plan count M. M-gating was removed deliberately on
              2026-08-13 (tests.yml lines 156-164) after it failed a healthy all-shipped tree;
              asserting it here would restore a deleted behaviour.
           e. "step missing: Layout gate" if no step has name == "Layout gate"; if present, one
              behaviour check that its run body contains 'exit "$rc"' (tests.yml line 233).
           f. "step missing: Unit suite" if no step has name == "Unit suite"; if present, one
              behaviour check that its run body contains "run-unit-tests.sh --kind unit"
              (tests.yml lines 75-79). It is a separate step from Integration suite on purpose,
              and FEAT-14/T-03 put the unit kind inside the required context precisely so the
              schema-refusal proof runs there; deleting it makes that proof unreachable while the
              job stays green.
           g. For EACH of the four GUARDED STEPS - Unit suite, Integration suite, Plan-route gate,
              Layout gate - "step declares continue-on-error: <name>" if that step's mapping
              contains the key continue-on-error. The violation string NAMES THE STEP it was found
              on; iterate the four, do not scan the document once. Measured at 061acbb with
              grep -n "continue-on-error" .github/workflows/tests.yml: zero hits, so the key
              appears nowhere in the file today. continue-on-error: true on a gate step makes its
              failure non-fatal, so the job still succeeds and still emits the required integration
              context with the gate red. That is deletion by another name, and it is a one-line
              diff.
           h. For EACH of the same four guarded steps, "step declares if: <name>" if that step's
              mapping contains the key if - again one check per step, with the step named in the
              violation. Measured at 061acbb with grep -nE "^[[:space:]]+if:"
              .github/workflows/tests.yml: zero hits, so no step-level if key exists today. A step
              whose if evaluates false is SKIPPED, and a skipped step counts as success for the
              job, so an if is the quietest available way to switch a gate off. The JOB-level if is
              deliberately not covered - see the ceiling in T-03.
              WHAT AN ABSENT GUARDED STEP MEANS IN g AND h: nothing. g and h inspect only the steps
              they find, because presence is already carried elsewhere, one owner per claim -
              Plan-route gate by item c, Layout gate by item e, Unit suite by item f, and
              Integration suite by case_26k, which asserts that step's run body and therefore fails
              if the step is gone. Do NOT add an Integration suite presence check to
              ci_wiring_violations.

      3. Add a SEPARATE, SIBLING function for case-id citations - deliberately NOT an item of
         ci_wiring_violations:
             def phantom_citations(text):
         It accepts the workflow file TEXT as an argument - a separate read, because safe_load
         drops comments and every citation in this file is a comment - and returns a list of
         "phantom citation: <id>" strings.

         WHY A SIBLING RATHER THAN AN ITEM OF ci_wiring_violations. case_26a asserts
         ci_wiring_violations(real doc) == []. At T-01 the real .github/workflows/tests.yml still
         carries the phantom case_25b9 at line 44; T-02 is the task that removes it. Folding the
         citation scan into ci_wiring_violations would therefore make case_26a red at T-01, and
         T-01 would fail its own verify on the task that introduces it. So T-01 builds and proves
         the scanner, and the assertion that the REAL workflow text carries zero phantoms is added
         by T-02 - the task that makes it true.

         THE RESOLUTION RULE - FULL IDENTIFIERS, TWO DEFINITION SOURCES, NO TRUNCATION.
         Collect every match of r"case_[0-9][0-9a-z_]*" in the text. An id RESOLVES if some file
         matching os.path.join(BIN_DIR, "test-*.py") contains a definition site whose name is that
         id, or begins with that id followed by "_". Two kinds of definition site count, and both
         are required:
             a "def " name         - example: "def case_25()" at test-check-plan-routes.py line
                                     1030
             a check("...") label  - example: check("case_19a3b_discovery_finds_the_live_plan_
                                     and_skips_the_shipped_one" at test-check-plan-routes.py
                                     line 366
         THE check(" LABEL IS A RESOLUTION SOURCE BECAUSE SUB-CASE IDS EXIST ONLY THERE. This
         suite defines one function per case family and calls check() once per sub-case, so a
         sub-case id such as case_19a3b has no def of its own and never will. A rule that resolved
         against def names alone would report it as a phantom - a false red on a real, correct
         citation. Do NOT truncate an id to its leading case_NN: truncation is the defect this
         item exists to remove, because it lets a citation to a deleted sub-case keep resolving
         through any surviving sibling of the same family.

         BOTH OUTCOMES AT THE CURRENT TREE, MEASURED AND COMPLETE. .github/workflows/tests.yml
         cites exactly two case ids - the enumeration is the whole set, not a sample:
             case_25b9  (line 44)  - no def name and no check(" label under
                                     .claude/skills/harness/bin/ begins with it. REPORTED as
                                     "phantom citation: case_25b9". T-02 removes the citation.
             case_19a3b (line 177) - resolves via the check(" label at
                                     test-check-plan-routes.py line 366. CLEAN, and it must stay
                                     clean; a rule that reports it is wrong.
         Observed at 061acbb with: grep -no "case_[0-9][0-9a-z_]*" .github/workflows/tests.yml
         and grep -rn "case_19a3b" .claude/skills/harness/bin/ (one hit, line 366) and
         grep -rn "case_25b9" .claude/skills/harness/bin/ (no hits).

      4. Cases. Each check() name is listed here and each must appear:
           case_26a_real_workflow_has_zero_ci_wiring_violations
             yaml.safe_load(open(CI_WORKFLOW)) and assert ci_wiring_violations(doc) == [], with the
             violation list interpolated into the failure message.
           case_26b_plan_route_step_deleted_is_a_violation
           case_26c_exit_capture_removed_is_a_violation
           case_26d_missing_summary_exit_removed_is_a_violation
           case_26j_missing_examined_exit_removed_is_a_violation
           case_26e_examined_zero_guard_removed_is_a_violation
           case_26f_exit_rc_replaced_by_exit_zero_is_a_violation
           case_26g_layout_gate_step_deleted_is_a_violation
           case_26h_container_key_added_is_a_violation
           case_26i_phantom_case_citation_is_a_violation
           case_26k_guard_is_wired_into_the_required_context
           case_26l_unit_suite_step_deleted_is_a_violation
           case_26m_continue_on_error_on_a_guarded_step_is_a_violation
           case_26n_step_level_if_on_a_guarded_step_is_a_violation
         That is FOURTEEN cases at T-01. T-02 adds one more, case_26o, for a post-T-02 total of
         fifteen - see T-02. Keep both numbers straight: T-01's own comment block says fourteen,
         and only the DEC-183 amendment in T-03 says fifteen.
         case_26l, case_26m and case_26n are mutant cases built the same way as 26b-26h, from a
         copy.deepcopy of the document parsed in case_26a. case_26l removes the Unit suite step.
         case_26m and case_26n each run FOUR mutations, one per guarded step - Unit suite,
         Integration suite, Plan-route gate, Layout gate - adding continue-on-error: true (26m) or
         if: false (26n) to that step alone, and asserting the reported violation NAMES THAT STEP.
         Mutating a single step would pass against an implementation that inspects a single step,
         which is the failure this parametrization exists to catch. Each of the three cases asserts
         the same three things listed below, per mutation. They exist because a gate can be
         switched off without being deleted, and 26b-26h see only deletion.
         case_26k asserts the guard's OWN wiring, which nothing else can see: read
         run-unit-tests.sh as text and assert "test-check-plan-routes.py" appears inside the
         INTEGRATION_SCRIPTS array assignment, and assert the parsed step named "Integration suite"
         has a run body containing "run-unit-tests.sh --kind integration". A guard nothing runs is
         this repository's most-repeated defect. Prove it can fail by running the same two checks
         against a copy of the run-unit-tests.sh text with the filename removed, and a deep copy of
         the document with the Integration suite step's run body replaced - never the real files.
         Five behaviours in item 2d means FIVE mutant cases: 26c exit capture, 26d missing-summary
         exit, 26j missing-examined exit, 26e examined-zero exit, 26f final exit rc. A single
         combined case would pass on the four behaviours that survive any one deletion.
         Every mutant is built with copy.deepcopy of the document parsed in case_26a - never by
         writing to .github/workflows/tests.yml, which this suite must leave untouched. Each mutant
         case asserts THREE things, and the first two are what stop a fixture that shares the value
         of the thing under test:
             ci_wiring_violations(original) == []
             mutant != original
             any(expected_fragment in v for v in ci_wiring_violations(mutant))
         case_26i is the one text-level case, and it is a MUTATION PROOF of phantom_citations.
         Read the real workflow text, INJECT the id case_25zz9 into a COPY of that text - never
         write to .github/workflows/tests.yml - and assert all three of:
             "phantom citation: case_25zz9" in phantom_citations(mutated_text)
             mutated_text != original_text
             "phantom citation: case_25zz9" not in phantom_citations(original_text)
         THE INJECTED ID IS CHOSEN, NOT ARBITRARY. Three constraints, each binding:
           - It must be ABSENT from the real workflow text. An id the text already carries would
             be reported whether or not the injection did anything, so the case would pass on a
             no-op mutation. This is also why the case INJECTS rather than replacing an existing
             id: injection keeps working after T-02 removes case_25b9 from the real text.
           - Its BASE, case_25, must RESOLVE - "def case_25()" at test-check-plan-routes.py line
             1030. That is what makes the case discriminate between the broken rule and the fixed
             one: under the old truncating rule case_25zz9 truncates to case_25, finds that def,
             and is NOT reported, so the case is red on the broken implementation and green only
             on the fixed one.
           - Do NOT use case_99zz. Its base case_99 has zero defs anywhere in the tree, so it is
             reported under the truncating rule and the fixed rule alike and cannot tell them
             apart. Do NOT use case_25b9 either - it is present in the real text at T-01, which
             breaks the first constraint.
         phantom_citations takes the text as an argument, which is what makes this mutation
         possible without touching the real file.

      5. Comments. Above the case family, write a short block naming the reciprocal pointer:
         these cases guard .github/workflows/tests.yml steps Plan-route gate (line 131) and Layout
         gate (line 185) and the container ban on the integration job (line 32); the workflow's own
         comments cite these case ids, and the two must be changed together. Say that the family
         has FOURTEEN cases as of this task - T-02 adds a fifteenth, case_26o - and enumerate
         nothing as a range. Keep the file's existing tone: state what a deletion would cost, not
         what the code does.

      Do not touch run-unit-tests.sh. This file is already in INTEGRATION_SCRIPTS (line 18), which
      is the array the required integration context runs.

  - id: T-02
    title: Repair every stale and phantom citation in tests.yml, and assert the repaired file
    traces: [REQ-05]
    change_type: logic
