      5. _attach_digest: without an authorization it is unchanged. With one: when not changed and the existing cycle_evidence has source main-session-fix, an existing record with the same authorization and by is kept as it is (at kept, file bytes unchanged), and any other is refused with REFUSED: the fix receipt conflicts with the recorded receipt. Otherwise entry["cycle_evidence"] = {"source": "main-session-fix", "path" and "sha256" of the digest ref, "by": args.by, "at": now_iso(), "authorization": authorization}, plus "previous" when ref carries it. The feature total moves by the attribution delta exactly as _record_run_end already computes it.
