    intent: |
      Execute in the main session under DEC-174, inside the feature worktree .claude/worktrees/harness/FEAT-2516-stamp-sweep-hardening only; every relative path here is relative to that worktree root and no edit may land outside it. Run gates with HARNESS_AGENT_TYPE unset.

      Product checkout: the harness repository itself (segment harness). It carries no docs/spec.md, docs/decisions.md or docs/architecture.md; its decision record is .harness/harness/docs/DECISIONS.md. Read DEC-157 (the cycle unit and run-end's exact-count rule this amends), DEC-191 (cycle_evidence is a closed shape), DEC-226 (the hard bound), DEC-221 (a served feature's ledger lives in the control plane, its code in the product checkout), DEC-159 (close-run composes run-end), DEC-230 (every FAIL run owes a regate) and DEC-227 (spend advises, never gates), and .claude/skills/harness/references/ledger.md sections Runs and Spend, before editing. The BRIEF is .harness/harness/features/FEAT-2516-stamp-sweep-hardening/BRIEF.md (SC-09 to SC-12); plan D-02 is the receipt.

      Where the code lives since FEAT-2581: .claude/skills/harness/bin/feature-record.py is the thin CLI (argparse registration and the VERBS docstring); the package .claude/skills/harness/bin/feature_record/ holds the verbs. runs.py holds run-end (_record_run_end, _record_attribution, _attach_digest, _run_end_digest, _check_digest_record, _is_refused) and close-run (_close_run_options, _close_run_stages); evidence.py holds the evidence_ref protocol (resolve_evidence_ref, verify_evidence_ref, _authorized_effect) and the INV-7 reader run_evidence_problems(feature_dir, feature_id, run, runs), which check_state/feature_record.py and check_state/run_state.py call; spend.py holds spend (_regate_rounds, _rework_rounds, spend_for, DISTILL_RUN, _not_before); binding.py holds a feature's repository binding (has_repository_binding, _bound_mirror_binding); judgements.py holds _judgements_of and now_iso.

      Write the unit tests first and observe the run-end acceptance, close-run acceptance, bound-feature acceptance, unsegmented acceptance, verdict-rewrite refusal, non-checkout refusal, PASS-digest reader, FEAT-2458-shaped and one-second spend assertions fail before editing production code.

      A. The shared receipt contract (the writer and INV-7 call the same function) and the code repository.
      1. feature_record/evidence.py: verify_evidence_ref(feature_dir, ref, subject=None) gains a keyword-only parameter sole_effect=False and passes it on as _authorized_effect(path, subject, sole_effect). In _authorized_effect, after the feature_id check, when sole_effect is True and effects is a list, count the entries of effects that are dicts whose "effect" value equals subject["effect"]; unless that count is exactly 1, raise ValueError(f"authorization evidence requires exactly one {subject['effect']} effect"). Existing callers pass nothing and keep their behaviour.
      2. feature_record/evidence.py: add a module-level _FIX_EFFECT_KEYS = frozenset({"effect", "run_id", "digest", "cycles_used", "fix_commit"}) and a public verify_fix_receipt(feature_dir, authorization, subject, verdict, digest_path), where subject is {"feature_id", "run_id", "digest": {"path", "sha256"}, "cycles_used", "effect": "main-session-fix"}. In order: verdict must equal "FAIL", else ValueError("a main-session fix receipt answers a FAIL run only"); effect = verify_evidence_ref(feature_dir, authorization, subject, sole_effect=True); set(effect) must equal _FIX_EFFECT_KEYS, else ValueError("main-session fix effect must carry exactly effect, run_id, digest, cycles_used and fix_commit"); effect["fix_commit"] must be a str fully matching [0-9a-f]{40}, else ValueError("main-session fix effect needs a 40-hex fix_commit"); record = digest_record.load_record(digest_path) (import digest_record locally, as verify_historical_cycle_count does), unless record.get("VERDICT") equals "FAIL" and "artifact" is a key of record, ValueError("main-session fix digest must record VERDICT FAIL and an artifact"): the authenticated digest itself, not only the ledger verdict, must be the FAIL the round answers, with the record shape _check_digest_record requires; then count = record["DIGEST"].get("cycles_used") when DIGEST is a dict, else None; unless type(count) is int, count is not negative and subject["cycles_used"] equals count plus one, ValueError("main-session fix attribution must be the digest count plus one"). Return effect. It never resolves fix_commit: a squash merge can drop the commit, so only the writer resolves it.
      3. Move validate-digest.py's _qa_code_repository into feature_record/binding.py as the public code_repository(record, planning_root), where the caller passes the root of the repository holding the feature; body and return contract otherwise unchanged: (planning_root, planning_root, None) for an unbound feature, (fleet checkout, factory.repo, None) for a bound one with fleet.yaml read from planning_root/.harness/factory/fleet.yaml, (None, None, why) otherwise. Inside binding.py, has_repository_binding becomes a same-module call, and artifact_accessors and factory_config are imported locally inside the function, as _bound_mirror_binding imports them. Add a public feature_repository_root(feature_dir) for the writer, resolving the two layouts feature_record/write.py FEATURE_JSON_TAIL accepts: f = os.path.realpath(feature_dir), features = os.path.dirname(f), above = os.path.dirname(features); unless os.path.basename(features) equals "features", raise ValueError(f"{feature_dir} is not a .harness features directory"); when os.path.basename(above) equals ".harness", return os.path.dirname(above) (unsegmented, REPO/.harness/features/FEAT); when os.path.basename(os.path.dirname(above)) equals ".harness", return os.path.dirname(os.path.dirname(above)) (segmented, REPO/.harness/SEGMENT/features/FEAT); otherwise raise the same ValueError. It reads no file. Extend binding.py's module docstring: it also resolves the repository holding a feature's code. In .claude/skills/harness/bin/validate-digest.py: add from feature_record import binding as record_binding beside the existing module-level from feature_record import read as record_read; in _qa_policy, the one call code_root, repository, why = _qa_code_repository(record, feature_dir) becomes code_root, repository, why = record_binding.code_repository(record, _repo_root_for_feature(feature_dir)); delete _qa_code_repository, with its local binding import. _repo_root_for_feature keeps its name, docstring and four-level body unchanged: the validator's checkout contract (DEC-256 QA review-pin exception D-01) is not changed by this task. Change nothing else in validate-digest.py.
