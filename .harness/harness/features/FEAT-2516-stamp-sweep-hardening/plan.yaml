decisions:
  - id: D-01
    choice: classify_feature returns a distinct fourth class, absent, for an id landed nowhere, beside terminal, not_terminal and unresolved; the stamp sweep keeps such a stamp and labels it absent, and no code or test reads a reason string to detect absence.
    because: "the operator chose option A at grilling, reversing FEAT-2458 plan D-01 (absent folded into unresolved); the rejected alternative, a collision-proof reason phrase as issue 2517 first proposed, still makes every caller parse prose."
    dec: none
  - id: D-02
    choice: A main-session-direct fix round enters cycles_used only through run-end or close-run with --fix-receipt and --by on a FAIL run. The receipt is a strict-JSON authorization note under the feature directory, recommended name notes/fix-round-RUNID.json, whose effects list holds exactly one main-session-fix effect carrying exactly run_id, the digest path and sha256, the resulting cycles_used and a 40-hex fix_commit; C must equal the digest count plus one. The writer resolves fix_commit in the feature's code repository (the factory.repo fleet checkout when bound, else the repository holding the feature), INV-7 checks the same receipt contract but never re-resolves the commit, and the run records cycle_evidence source main-session-fix.
    because: an evidence_ref must hash an immutable regular file under the feature directory, and feature.json is the mutable ledger feature-record.py rewrites, so the receipt cannot live there; one FAIL run is answered by at most one fix round before the next run re-gates it, so the delta is exactly one; a served feature's fix lands in the product checkout, not the planning checkout that holds feature.json (DEC-221), and a squash merge can later drop the commit, so only the writer resolves it.
    dec: DEC-157
  - id: D-03
    choice: The canonical-reader cases keep running inside the default CASES tuple that the integration runner executes, guarded by a case asserting that every CANONICAL_READER_CASES member is in CASES; no runner step passes --canonical-reader-self-test. The --canonical-reader-self-test flag stays a supported local entry point, and T-04's verify runs it as the direct evidence that the self-test is green.
    because: FEAT-2489 (PR 2530, which closed 2519) made the default run a superset of the self-test, so a runner step passing the flag would run the same cases twice; that step is the alternative the grilling text would re-suggest.
    dec: none

