decisions:
  - id: D-02
    choice: A main-session-direct fix round enters cycles_used only through run-end or close-run with --fix-receipt and --by on a FAIL run. The receipt is a strict-JSON authorization note under the feature directory, recommended name notes/fix-round-RUNID.json, whose effects list holds exactly one main-session-fix effect carrying exactly run_id, the digest path and sha256, the resulting cycles_used and a 40-hex fix_commit; C must equal the digest count plus one. The writer resolves fix_commit in the feature's code repository (the factory.repo fleet checkout when bound, else the repository holding the feature in either accepted feature layout), which must be its own git checkout root; a run so attributed stays FAIL; INV-7 checks the same receipt contract, including that the authenticated digest records FAIL, but never re-resolves the commit, and the run records cycle_evidence source main-session-fix.
    because: an evidence_ref must hash an immutable regular file under the feature directory, and feature.json is the mutable ledger feature-record.py rewrites, so the receipt cannot live there; one FAIL run is answered by at most one fix round before the next run re-gates it, so the delta is exactly one; a served feature's fix lands in the product checkout, not the planning checkout that holds feature.json (DEC-221), and a squash merge can later drop the commit, so only the writer resolves it.
    dec: DEC-157
