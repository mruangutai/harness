      B. The writer.
      1. .claude/skills/harness/bin/feature-record.py: _register_run_end adds --fix-receipt (dest fix_receipt, help: a feature-local operator note naming a main-session fix round) and --by (help: the operator signing the fix receipt). _register_close_run adds --fix-receipt (dest fix_receipt); its existing --by is shared, and its help becomes: operator authorizing a refused-run attribution or a main-session fix receipt. In the module docstring, the run-end and close-run VERBS entries each gain one sentence: with --fix-receipt NOTE --by OPERATOR on a FAIL run, C is the digest count plus one (the main-session fix route, references/ledger.md).
      2. feature_record/runs.py _close_run_options refuses through _exit_refused, before any stage runs: --fix-receipt with --refused-return, --fix-receipt without --by, and --fix-receipt with a --verdict other than FAIL. _close_run_stages appends "--fix-receipt", args.fix_receipt, "--by", args.by to the run-end stage argv when args.fix_receipt is given.
      3. feature_record/runs.py _record_run_end, inside mutate once the entry is found and before _ledger_cycles, refuses through _refuse, writing nothing: --fix-receipt without --by; --by without --fix-receipt; --fix-receipt without --digest; --fix-receipt with a --verdict other than FAIL; --fix-receipt on an entry _is_refused reports; and, whatever flags are given, a --verdict other than FAIL on an entry whose existing cycle_evidence has source main-session-fix (REFUSED: a run attributed by a main-session fix receipt stays FAIL), so a bare same-count run-end, which keeps the receipt in _record_attribution without entering _attach_digest, can never rewrite a receipt-backed FAIL.
      4. Thread doc through the attribution path: _record_run_end calls _record_attribution(doc, entry, args, runs, previous_cycles), which calls _attach_digest(doc, entry, args, runs, changed), which calls _run_end_digest(doc, args, entry, changed, runs). _run_end_digest resolves directory = os.path.dirname(os.path.abspath(args.file)) and returns (ref, authorization). _check_digest_record gains a parameter expected, the count the digest must report: args.cycles_used without a receipt, args.cycles_used minus 1 with one; its verdict and artifact check is unchanged. Without args.fix_receipt the behaviour is otherwise unchanged and authorization is None. With it: authorization = evidence.resolve_evidence_ref(directory, args.fix_receipt); subject = {"feature_id": doc["feature_id"], "run_id": entry["id"], "digest": {"path": ref["path"], "sha256": ref["sha256"]}, "cycles_used": args.cycles_used, "effect": "main-session-fix"}; effect = evidence.verify_fix_receipt(directory, authorization, subject, args.verdict, os.path.join(directory, ref["path"])). Then code_root, _name, why = binding.code_repository(doc, binding.feature_repository_root(directory)) (add from feature_record import binding to runs.py's imports); a why raises ValueError(why); _require_checkout_root(code_root), a new private runs.py function, imports subprocess locally as _stage does, runs ["git", "-C", code_root, "rev-parse", "--show-toplevel"] with capture_output=True and text=True, and unless its returncode is 0 and os.path.realpath of its stripped stdout equals os.path.realpath(code_root) raises ValueError(f"fix receipt repository {code_root} is not a git checkout root"), because a directory with no checkout of its own nested under the planning repository would otherwise resolve commits in the enclosing repository; then code_grade.commit_oid(code_root, effect["fix_commit"]) (import code_grade locally, as budget.py's _commit_id does) must return effect["fix_commit"], and a ValueError from it or a different