      open(p, "w").write(m)
      PY
      INFLIGHT_REGISTRY_DIR="$T2/bin" python3 .claude/skills/harness/bin/test-inflight-registry.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with no persona under single flight"; exit 1; }
      python3 .claude/skills/harness/bin/test-inflight-registry.py || exit 1
      exit 0
    intent: |
      Write two new files. Change nothing else. This is a LIBRARY plus a small CLI, not a gate - the
      two hooks that call it are cut over separately in T-08 and T-09, which are the operator's
      hands under DEC-174 amendment 4.

      PRECONDITION: read
      .harness/harness/features/FEAT-32-concurrent-write-merge/notes/research-FEAT-32-hook-payloads.md,
      written by T-01, and take the dispatched-persona key path from its DISPATCHED_PERSONA_KEY line.
      Do not guess it. If that note is absent, or its DISPATCHED_PERSONA_KEY is NONE, return BLOCKED.

      FILE 1 - .claude/skills/harness/bin/inflight_registry.py.

      Module-level literals, each a mutation target for the red proof:
        SINGLE_FLIGHT_AGENTS = ("harness-pm",)
        CLAIM_TTL_SECONDS = 3600
        REGISTRY_REL = ".harness/.inflight-claims.json"

      The registry is a JSON object mapping a persona name to a claim object holding started_at as a
      unix float, dispatcher as the dispatching persona name or null, and cwd as the checkout it was
      claimed in. It is stored at REGISTRY_REL relative to the checkout root, which is taken from the
      CLAUDE_PROJECT_DIR environment variable when set and otherwise from an explicit root argument.
      One registry per checkout, so two worktrees never contend.

      EVERY read-modify-write of that file goes through harness_merge.locked_update. Do not write
      fcntl, O_EXCL or os.replace anywhere in this file - a registry that many hook processes write
      concurrently is another instance of the very defect this feature exists to fix, and the whole
      point of the shared core is that it is fixed once.

      Public functions:
        live_claim(root, agent, now=None) - returns the claim mapping for agent, or None. A claim
        whose started_at is older than CLAIM_TTL_SECONDS is treated as ABSENT and is DELETED as a
        side effect, and the function records that it did so in a second return value so the caller
        can say it on stderr. Failing OPEN on a leaked claim is the house precedent for a guard's own
        bug - see the printed line at validate-digest.py:869.
        claim(root, agent, dispatcher, cwd, now=None) - returns True having recorded the claim, or
        False when a live claim already exists. Never raises for contention.
        release(root, agent) - removes the claim if present. Returns whether it removed one.
        release_all(root) - removes every claim. Returns how many.
        is_single_flight(agent) - agent in SINGLE_FLIGHT_AGENTS.
        refusal_lines(agent, existing, release_cmd) - the exact stderr block a caller prints. It MUST
        contain, in this order: a first line beginning "dispatch-guard: BLOCKED - single-flight" and
        naming the agent; a line naming the existing claim's started_at as an ISO-8601 timestamp and
        its dispatcher; a line stating that this is issue #551 and that the second writer would
        otherwise overwrite the first's plan.yaml; and a final line carrying release_cmd verbatim as
        the way to clear it. Assemble it here so the hook and the test read the same one source.

      A missing, empty or unparseable registry file is treated as an EMPTY registry and reported on
      stderr - never an exception out of a hook.

      CLI, for the operator's escape hatch:
        inflight_registry.py list          - one line per claim, or the literal line NO CLAIMS
        inflight_registry.py release --agent <name>
        inflight_registry.py release-all
      Exit 0 for all three. The release_cmd string that refusal_lines prints must be exactly the
      release-all invocation, built from the same constant, so the message cannot drift from the
      command.

      FILE 2 - .claude/skills/harness/bin/test-inflight-registry.py, house shape, resolving the
      module as sys.path.insert(0, os.environ.get("INFLIGHT_REGISTRY_DIR") or HERE). Every case uses
      a fresh tempfile.mkdtemp() as the root and never touches the real .harness directory.

      CASES:
        1. claim then live_claim returns the claim, with the recorded dispatcher and cwd asserted.
        2. A SECOND claim for the same agent returns False and does not change the stored started_at.
           Assert the stored value is the FIRST one - a second claim silently replacing the first is
           this feature's own defect in miniature.
        3. STALENESS: a claim written with started_at at now minus CLAIM_TTL_SECONDS minus one is
           treated as absent, live_claim reports that it expired one, and a following claim succeeds.
           With CLAIM_TTL_SECONDS mutated large this case must FAIL.
        4. release removes the claim and returns True; releasing an absent claim returns False and
           does not create the file.
        5. is_single_flight is True for harness-pm and False for harness-backend-dev. With
           SINGLE_FLIGHT_AGENTS mutated to an empty tuple this case must FAIL - that is what makes
           the second red proof discriminating.
        6. refusal_lines contains the literal marker "dispatch-guard: BLOCKED - single-flight", the
           agent name, an ISO-8601 timestamp, the string "#551", and the release command byte for
           byte identical to the CLI invocation string the module exports. Assert each of the five
           separately.
        7. CONCURRENCY: 20 trials of two subprocesses both calling claim for harness-pm at once.
           Assert that in every trial exactly ONE returned True and the registry holds exactly one
           claim. Report any trial where both succeeded, by trial number - that outcome is the defect
           and must never be admitted.
        8. A corrupt registry file - the single byte "{" - is treated as empty, a claim succeeds, and
           a message naming the file appears on stderr. No exception escapes.
        9. release_all empties a registry holding three claims and returns 3; list prints NO CLAIMS
           afterwards.
       10. NO OWN PRIMITIVE: read inflight_registry.py as TEXT and assert it contains no occurrence
           of fcntl, O_EXCL or os.replace, and does contain a call to harness_merge.locked_update.
           Both halves, so the assertion is positive as well as negative.

