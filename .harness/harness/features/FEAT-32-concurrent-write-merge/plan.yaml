      PY
      OBSERVATIONS_MERGE_BIN="$T/bin/observations-merge.py" \
        python3 .claude/skills/harness/bin/test-observations-merge.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with the union switched off"; exit 1; }
      python3 .claude/skills/harness/bin/test-observations-merge.py || exit 1
      exit 0
    intent: |
      Write two new files. Change nothing else. Import the lock and the atomic replace from
      harness_merge - do not write fcntl, O_EXCL or os.replace anywhere in either file.

        observations-merge.py apply --file <path to an observations log> --entries <path or - for stdin>

      D-05 defines what union means for this file class and it is NOT expertise-merge.py's
      section-plus-id union. Read it before starting. In particular: there is no conflict exit and no
      cap for this file class, so there is no exit 7 and no exit 8.

      THE FORMAT, taken from a real log
      (feat/FEAT-31-orchestrator-context-watch, FEAT-31's observations/harness-pm.md): an optional
      title line beginning with a hash, then BULLET RECORDS. A record begins at a line matching a
      dash and a space at column zero and continues through every following line until the next such
      line or end of file - so an indented continuation line and a blank line both belong to the
      record above them.

      THE ALGORITHM:
        1. require_destination on --file against a tail that matches, on the RESOLVED path, a
           features directory either directly under a .harness segment or nested one segment deeper,
           a FEAT- or BUG- prefixed directory, the literal segment observations, and a filename of
           the form harness- followed by lowercase letters, digits and hyphens, ending .md. Exit 9
           otherwise.
        2. Inside harness_merge.locked_update on --file.
        3. Parse base and entries into (title_or_None, [record_text, ...]).
        4. UNION_MERGE = True, a module-level literal guarding step 5; when False write the entries
           alone, which is today's last-writer-wins behaviour, so a test can prove the union
           assertions can go red. Nothing reads an environment variable or a flag to change it.
        5. Output = the base title if the base had one, else the entries title, else a title of the
           form "# Observations - <the filename stem>"; then every base record in base order, then
           every entries record whose normalised text is not already present, in entries order.
           NORMALISED means: strip trailing whitespace from every line, collapse runs of whitespace
           to a single space, and join. Compare on the normalised form; WRITE the original text.
        6. Emit through locked_update. Print one ADDED line per record added, giving its first 60
           characters, one PRESERVED line per base record kept, and a final APPLIED line. Never a
           bare count.

      Exit codes: 0 applied, 6 lock not acquired, 9 the destination is not an observation log. No
      other code is defined for this tool, and that is deliberate - see D-05.

      test-observations-merge.py, house shape, resolving the CLI as

        CLI = os.environ.get("OBSERVATIONS_MERGE_BIN") or os.path.join(HERE, "observations-merge.py")

      Fixtures live in a fresh tempfile.mkdtemp() under a
      .harness/harness/features/FEAT-99-fixture/observations/harness-pm.md path.

      CASES:
        1. THE RED CASE, PERMANENT, never routed through the tool. Reproduce #606 directly: write a
           log holding bullets A and B by a plain whole-file write, then overwrite it with a plain
           whole-file write holding A and C. Assert B is absent. That is the loss the issue records.
        2. GREEN: the same two appends through the tool leave A, B and C all present - one assertion
           per bullet - with A first and the base order of A and B unchanged.
        3. DEDUP: applying an entries file whose only record is byte identical to a base record
           leaves the file with exactly one copy of it. Count occurrences of the record's first line
           and assert one.
        4. DEDUP IS ON NORMALISED TEXT: a record differing from a base record only in line wrapping
           and trailing spaces is treated as the same record and not duplicated.
        5. TWO DIFFERENT RECORDS ARE BOTH KEPT, with no conflict and exit 0 - the case that would
           break if expertise-merge.py's exit 7 were copied here.
        6. MULTI-LINE RECORDS: a base record with two indented continuation lines survives with those
           lines attached to it and in order, asserted on the exact text.
        7. CONCURRENCY FOR REAL, 20 trials, two subprocesses appending distinct records. Admit
           exactly two outcomes - both records plus every base record present, or one process exited
           6 having applied nothing. Report any third outcome by trial number.
        8. A log that does not exist yet is created from the entries alone, with a generated title,
           exit 0.
        9. DESTINATION REFUSAL, both directions: a source path exits 9 untouched, a dot-dot escape
           wearing a legal tail exits 9, an Expertise file path exits 9 - it belongs to a different
           tool - and a legitimate observations path exits 0.

