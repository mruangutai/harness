      export CLAUDE_PROJECT_DIR="$PWD"
      T=$(mktemp -d) || exit 1
      cp -R .claude/skills/harness/bin "$T/bin" || exit 1
      python3 - "$T/bin/observations-merge.py" <<'PY' || exit 1
