  - id: T-09
    title: On SubagentStop, release the returning agent's claim and refuse a return made with children in flight
    traces: [REQ-05, REQ-06, REQ-12]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: >-
      validate-digest.py is named in DEC-174 amendment 4 as a registered SubagentStop validator, and
      amendment 4 puts its test file inside the carve-out with it
    depends_on: [T-01, T-06]
    status: pending
    files:
      - .claude/skills/harness/bin/validate-digest.py
      - .claude/skills/harness/bin/test-validate-digest.py
    verify: |
      set -u
      cd "$(git rev-parse --show-toplevel)" || exit 1
      export CLAUDE_PROJECT_DIR="$PWD"
      python3 .claude/skills/harness/bin/test-validate-digest.py || exit 1
      python3 - <<'PY' || exit 1
      src = open(".claude/skills/harness/bin/validate-digest.py").read()
      for marker in ("unreadable hook payload", "has no agent_type", "stop_hook_active"):
          assert marker in src, "a named fail-open pass-through disappeared: %r" % marker
      body = src[src.index("def hook_mode"):]
      i_rel = body.index("inflight_registry")
      i_stop = body.index("stop_hook_active")
      assert i_rel > i_stop, "the release runs before the stop_hook_active pass-through"
      i_child = body.index("children_refusal_lines")
      assert i_child > i_rel, "the children check runs before the release, so a refused return leaks its own claim"
      PY
      exit 0
    intent: |
      Two files change. The validator gains ONE side effect and ONE new refusal, and loses no
      behaviour.

      NO PRECONDITION ON THE T-01 NOTE. An earlier draft gated this task on a STOP_HAS_AGENT_TYPE
      line; that fact is already settled and T-01 no longer measures it. SubagentStop carries
      agent_type, evidenced by validate-digest.py selecting a persona-specific schema from the
      SCHEMAS mapping - a live orchestrator return was rejected against the "orchestrator" schema, and
      the no-agent_type pass-through did not fire. This task uses agent_type directly.

      IN hook_mode() in validate-digest.py, AFTER the stop_hook_active pass-through and BEFORE the
      last_assistant_message check, insert TWO steps, IN THIS ORDER.

      STEP ONE, THE RELEASE:
        - Import inflight_registry from this file's own directory, inside a try. On any ImportError,
          print one stderr line naming the module, skip BOTH steps, and CONTINUE - never return, never
          raise. This hook validates digests; the registry is a side errand and must never be able to
          change the verdict.
        - Call release for THIS agent against the root taken from CLAUDE_PROJECT_DIR, wrapped in a try
          that swallows and reports any exception on stderr. Print one line saying whether a claim was
          released. Call it for every harness-* persona, not only single-flight ones, because T-08 now
          records a claim for every dispatched persona and an unreleased claim is a leak until its TTL.

      STEP TWO, THE D-09 RETURN CONTRACT, and it must come AFTER step one:
        - If norm(agent) is "lead" or "orchestrator", call live_children for this agent. If it returns
          any, print inflight_registry.children_refusal_lines and RETURN 2.
        - Nothing else. Do not loop, do not sleep, do not retry. Read D-09 before writing this: making
          the agent WAIT is not achievable on this hook and this task must not attempt it. The
          stop_hook_active pass-through means this refusal fires AT MOST ONCE, which is a single
          correction round and exactly the strength every other digest contract in this file has. A
          second identical return ships, and that residual is recorded in D-09 rather than papered
          over.

      WHY THE ORDER IS RELEASE-THEN-CHECK, and the verify asserts it by index: if the check refused
      before the release ran, the refused agent's own claim would still be on disk while the re-run
      passes straight through the stop_hook_active gate and never reaches the release - a leaked claim
      on every refusal, which for harness-pm means no further pm dispatch until the TTL expires. A fix
      that bricks the next dispatch is worse than the defect.

      Placing both after stop_hook_active is deliberate: on a re-run the claim is already gone and the
      refusal is deliberately not re-raised, which is what keeps this out of the infinite-stop-loop
      path the pass-through exists to prevent.

      CHANGE NOTHING ELSE. The unreadable-payload, no-agent_type and stop_hook_active pass-throughs,
      the no-final-message pass-through, the no-schema pass-through, the internal-error pass-through,
      the lead artifact check, and every printed line stay exactly as they are. Cite those three
      pass-throughs by their stderr markers, not by line number.

      IN test-validate-digest.py, ADD cases and EDIT NONE - the existing suite passing unedited is
      SC-08 and is the only evidence that the validator's behaviour is unchanged.

      NEW CASES:
        1. A SubagentStop payload with agent_type harness-pm and a VALID digest releases the claim:
           write a claim, run the hook with CLAUDE_PROJECT_DIR pointed at a temp root, assert exit 0
           and assert the registry no longer holds it.
        2. A SubagentStop payload with agent_type harness-pm and an INVALID digest still exits 2 for
           the contract violation AND still releases the claim. A blocked return must not leak a
           claim, or a re-prompted pm can never be re-dispatched.
        3. stop_hook_active true still returns 0 and does not raise, with a claim present.
        4. A non-single-flight persona releases its OWN claim and leaves an unrelated harness-pm claim
           untouched. Assert both halves.
        5. With inflight_registry.py absent from a copied tree, a valid digest still exits 0 and
           stderr names the module - neither the release nor the children check can break validation.
        6. THE D-09 REFUSAL. Write two live claims dispatched by harness-eng-lead, then feed a
           SubagentStop payload with agent_type harness-eng-lead and an otherwise VALID lead digest.
           Assert ALL of: exit code exactly 2; stderr contains
           "check-digest: BLOCKED - returned with children in flight"; stderr names BOTH children by
           persona; stderr contains "#551"; and the harness-eng-lead claim itself is gone from the
           registry, proving the release ran first. A non-zero exit alone is NOT the assertion - a
           crash is also non-zero.
        7. THE ALLOW HALF. The same lead payload with NO children on disk exits with whatever the
           digest's own validation says - assert exit 0 for the valid digest - and stderr carries no
           children marker. Assert the absence of the marker, so a hook that refuses every lead fails.
        8. A MEMBER'S RETURN IS NEVER SUBJECT TO IT: a harness-pm payload with a live claim dispatched
           BY harness-pm on disk still exits 0. Only a lead or the orchestrator is governed, because
           only they dispatch.
        9. THE ONE-SHOT BOUND IS ASSERTED, NOT HIDDEN: the same refusal payload with stop_hook_active
           true exits 0 with children still on disk. This case records the residual D-09 names. Do not
           "fix" it - a second refusal here is the infinite stop loop the pass-through prevents.

