          space-separated: split the entry on the FIRST space - entry.split(" ", 1), never rsplit -
          and treat the tail as a fragment only if it ends in a colon or begins with two hashes and a
          space. Otherwise the whole entry is a glob with no fragment.

          THE FIRST SPACE IS THE MECHANISM AND NOT A DETAIL, recorded here because "simplify that to
          the last space" is the edit that silently guts this task. MEASURED in this worktree at
          1e73248 against the REAL .harness/team-config.yaml, whose main_session.writes holds three
          entries at that sha, plus the fourth entry T-15 adds and the verify above asserts:

            .harness/*/features/*/BRIEF.md ## Approval  -> glob .harness/*/features/*/BRIEF.md,
                                                          fragment "## Approval", a MARKDOWN HEADING
            .harness/*/features/*/PLAN.md ## Approval   -> glob .harness/*/features/*/PLAN.md,
                                                          fragment "## Approval", a MARKDOWN HEADING
            .harness/logs/**                            -> no space, so no fragment, by design
            .harness/*/features/*/plan.yaml approval:   -> glob .harness/*/features/*/plan.yaml,
                                                          fragment "approval:", a MAPPING KEY

          THREE of those four entries deny. Splitting on the LAST space instead hands the two heading
          entries a tail of "Approval", which ends in no colon and begins with no two hashes, so both
          are read as FRAGMENT-LESS and contribute NO DENIAL - and it corrupts their glob into one
          ending "BRIEF.md ##", which matches no path on disk. ONE entry of the four would still
          deny, the plan.yaml one. The three-file mechanism D-10 records would collapse into a
          plan.yaml-only special case: exactly the hardcoded pattern the paragraph above forbids,
          reached through a parser bug instead of a hardcode, and passing every behavioural case in
          this task that is not about BRIEF.md or PLAN.md.
        - THREE ENTRY KINDS, and only two of them deny:
            fragment ending in a colon  -> a YAML MAPPING KEY. yaml.safe_load both sides and compare
              that key's value. This is the plan.yaml approval: case.
            fragment beginning with two hashes and a space -> a MARKDOWN HEADING. Compare that
              section's body, the lines from the heading to the next heading at the same or a shallower
              level. This is the BRIEF.md and PLAN.md ## Approval case, and it is the reason this is
              sourced from the list: the same rule, three files, one mechanism.
            NO fragment (the .harness/logs/** entry) -> a plain main-session grant. It contributes NO
              denial. The parser SKIPS it. A governed agent's write to a path matching such an entry
              is decided by its own domain rules exactly as before.
        - Match the target against the entry's glob with fnmatch on the resolved relative path, the
          same normalisation the existing domain matching uses. Do NOT add anything to SHAPE_PATTERNS.
          The comment at that tuple explains why plan.yaml is deliberately absent from the SHAPE gate
          and that reasoning still holds - this is a domain question, "may this agent write this part
          of this file", which needs the agent's identity and therefore cannot live in a gate that has
          none.
        - Decide it by comparing the PROPOSED fragment against the ON-DISK one. For a Write, the
          proposed content is tool_input.content. For a NotebookEdit there is nothing to do. If the
          file does not exist on disk, ALLOW: a first write cannot change a signature that does not
          exist yet.
        - FOR AN EDIT, APPLY NOTHING - and do NOT decide it by an indentation heuristic alone. Two
          limbs, and the FIRST one carries the weight:

            LIMB A, the old_string limb, and it is EXACT rather than heuristic. Locate the fragment's
              byte range in the file AS IT IS ON DISK - for the mapping-key kind, the lines from the
              key's own line to the line before the next line matching a top-level key at column zero.
              DENY when tool_input.old_string occurs as a SUBSTRING anywhere inside that range. This
              needs no reconstruction of the edit's result, no replace_all semantics and no in-memory
              application: it asks only whether the text being replaced is text the signature is made
              of. It is INDENTATION-INDEPENDENT, which is why it is limb A and not limb B.
            LIMB B, the new_string limb, for a payload that INTRODUCES a signature rather than
              replacing one. DENY when tool_input.new_string contains, at a line start, either the
              fragment's own key at column zero, or any CHILD KEY of the on-disk fragment at the
              indent that fragment actually uses ON DISK. Read that indent from the file. Do NOT
              hardcode two spaces.

          WHY LIMB B READS THE INDENT RATHER THAN HARDCODING TWO SPACES - the counter-example,
          measured in this worktree at 1e73248 via git ls-files. The two-space discriminator is a
          property of the plan.yaml EMITTER only, not of the rule's subject matter, and ONE OF THE
          THREE FILES this rule covers ALREADY INVERTS IT TODAY, not in some hypothetical future
          reformatting. Of the 9 tracked */PLAN.md files, all 9 carry their signature heading at ZERO
          indent - 9 lines matching ^## Approval, and the signature's own status: key sits at zero
          indent as well, 10 such lines across the 9 files, the extra one being FEAT-06's
          re-signature block - while 27 lines across 5 of those files carry a TASK status: at TWO
          spaces: FEAT-06-team-layer-inv6/PLAN.md 10, FEAT-07-verify-teeth-batch-probe/PLAN.md 10,
          FEAT-09-plan-time-route-check/PLAN.md 4, FEAT-02/PLAN.md 2 and
          .claude/skills/harness/templates/PLAN.md 1. A hardcoded two-space rule applied there denies
          27 legitimate task lines and matches ZERO signatures - inverted, not merely imprecise. In
          plan.yaml at the same sha the convention runs the other way: 23 tracked files, status:
          line-start indents of two spaces x23 (one per file, the signature), four spaces x176 (task
          keys) and ten spaces x1, and that single ten-space hit is PROSE inside a task intent,
          FEAT-14-feature-json-schema/plan.yaml:1154, not a key. Two of the three covered files, two
          opposite conventions, one rule - so limb B reads the fragment's indent from the file it is
          judging.

          MEASURED, in this worktree at 6bb7d82, against FEAT-32's own plan.yaml whose approval block
          is lines 4-7 and loads as the four bytes-exact lines "approval:", two-space "status:
          pending", two-space "approved_by:" and two-space "date:". Three attack payloads, all three
          of which flip the signature, and two legitimate payloads:

            targeted, old_string two-space "status: pending"                 limb A DENIES
            mid-line-start, old_string "status: pending" newline two-space
              "approved_by:" - unique in the file, and its FIRST line carries
              ZERO leading spaces                                            limb A DENIES
            accidental, old_string "status: pending" with replace_all true -
              18 occurrences in this file, one of them the signature          limb A DENIES
            a task's own four-space "status: pending"                         limb A ALLOWS
            a task-body chunk "change_type: logic" newline four-space
              "status: pending"                                              limb A ALLOWS

          A rule matching only a two-space-indented "status:" key catches the FIRST of those three and
          MISSES THE OTHER TWO, because neither of their payloads contains a two-space line start at
          all. Both misses flip the signature. That is why limb A is a substring test against the
          on-disk range and not an indent test against the payload.

          THE FALSE-POSITIVE COST, stated rather than glossed: limb A denies any Edit whose old_string
          happens to be a substring of the approval block - "date:" alone, for instance. The block is
          four short lines, so the set is tiny, the denial is conservative in the safe direction, and
          deny()'s message tells the agent to add surrounding context or go through plan-merge.py. An
          allow-by-default rule here has no such cheap remedy.

          THE TOCTOU RESIDUAL IS REAL AND IS NOT CLOSED. Limb A reads the on-disk range at PRE time
          and the edit applies moments later; a file rewritten in between could be judged against a
          stale range. It is accepted, not solved: the main session is the only tier entitled to that
          block, so the interleaving that would matter is one no legitimate writer performs, and
          plan-merge.py holds a lock over every other route into the file.
        - A COMMENT AT THE RULE IS A DELIVERABLE OF THIS TASK, not a nicety, and the verify greps
          for it. Immediately above limb B, in check-domain.sh itself, state that the indentation it
          reads is a CONVENTION AND NOT A YAML GUARANTEE: the format permits an approval block at any
          indent, and limb B can discriminate an approval child key from a task's own key only because
          every plan.yaml in the tree is emitted by harness-pm and, after this feature, by
          plan-merge.py, both of which control the shape. Name the failure mode in these terms and do
          not soften it: a future reformatting that put task keys at the same indent as the approval
          block's would silently unhook limb B, NOTHING IN THE TREE WOULD NOTICE, and there is no
          propagation checker that would (DEC-188 deleted it). Say also which part survives that
          reformatting and which does not - limb A is a substring test against the on-disk range and
          does not read indentation at all, so it still holds; limb B is the part that dies. The
          comment must carry the literal words

            CONVENTION, NOT A YAML GUARANTEE

          because the verify greps for exactly that string, and a comment that gets reworded into
          something reassuring during review is the failure this grep exists to catch.
        - THE COVERAGE THIS RULE DOES AND DOES NOT HAVE, RE-MEASURED in this worktree at 1e73248 so
          a later reader can tell drift from falsification. Every tracked plan.yaml - 23 of them at
          this sha, git ls-files '*plan.yaml' - carries EXACTLY ONE line matching a two-space
          "status: " and it is the approval block's in all 23. In 22 the line immediately above is
          literally "approval:"; the 23rd is .claude/skills/harness/templates/plan.yaml, hit at line
          27, where "approval:" sits three lines above and two comment lines intervene. Task
          "status:" keys sit at four spaces, 1 to 17 per file. EXACTLY ONE line in the whole corpus
          carries a "status:" at any other indent - FEAT-14-feature-json-schema/plan.yaml:1154 at ten
          spaces - and it is prose inside a task intent rather than a YAML key, so it is neither a
          counter-example to the discriminator nor an anomaly to fix. This paragraph previously read
          EXACTLY TWO, naming a second hit at eleven spaces in this plan's own line 647; that line
          was real at 6bb7d82 and reflowed away by 1e73248, so the earlier number was drift rather
          than error - which is what anchoring the count to a sha is for. The corpus is uniform; that
          uniformity is the convention the comment above refuses to call a guarantee.
        - For the mapping-key kind, compare by PARSING both sides and comparing the loaded value, not
          by comparing text. A whitespace-only difference is not a signature change and denying it
          would make plan-merge.py's own output undeniable-by-luck. If either side fails to parse,
          ALLOW and say so on stderr - a gate that blocks on its own parse failure breaks every write
          the moment the payload shape changes, which is the precedent this file already sets.
        - FAIL OPEN, LOUDLY, on our own failure to read the record. If main_session is absent, or
          writes is missing or an empty list, ALLOW and print to stderr that the exclusion list was
          unreadable so no fragment denial was applied. Silence here is the fail-open this whole task
          exists to remove; DEC-127 at DECISIONS.md:2839 sets fail-OPEN-LOUDLY by matching this file's
          own precedent at :798 and :811 by name. D-10 records the residual plainly: delete the entry
          and the gate stops denying, and the only two things that notice are this stderr line and
          this task's own test.
        - On a difference, call deny() with lines that name the file, name the fragment, name the
          main_session.writes entry it came from, and name the route: every other write to plan.yaml
          goes through plan-merge.py, which carries the base file's approval bytes forward untouched.

      THE MAIN SESSION IS EXEMPT BY THE MECHANISM, NOT BY A SPECIAL CASE. This check sits inside the
      `_domain_phase` region, which is `_governed and not _post`, and check-domain exits 0 for a
      payload carrying no agent_type. Do NOT add an explicit main-session branch: a second carve-out
      is a second thing to keep in sync, and issue #132 records what happened last time this file
      grew one.

      IN test-check-domain.py, ADD cases and EDIT NONE. Resolve the hook the way that file already
      does, via CHECK_DOMAIN_BIN, and point CLAUDE_PROJECT_DIR at a fresh tempfile.mkdtemp() for every
      case with a real .harness/team-config.yaml copied in, exactly as its existing cases do.

      NEW CASES, and each asserts the exit code AND a distinguishing string so a crash cannot satisfy
      it:
        1. A harness-pm Write of a fixture plan.yaml whose content changes approval.status from
           pending to approved is DENIED - exit 2, and stderr names the approval mapping and names
           plan-merge.py. With APPROVAL_GUARD mutated to False this case must FAIL, and it is what
           makes the red proof discriminating.
        2. A harness-pm Write of the same file that adds a task and leaves approval byte identical is
           ALLOWED, exit 0. Both directions, so a deny-everything implementation fails.
        3. A harness-orchestrator Write that changes approval is DENIED too. The orchestrator is a
           governed agent since DEC-120 and D-10 records that it is not the signer.
        4. NO agent_type at all - the main session - changing approval.status to approved is ALLOWED,
           exit 0. This is the case the whole design turns on.
        5. THE EDIT ROUTE, FIVE PAYLOADS, EACH ITS OWN ASSERTION - never one assertion over the set,
           because the set's whole point is that a rule can pass on part of it. Against a fixture
           plan.yaml whose approval block is the four lines "approval:", two-space "status: pending",
           two-space "approved_by:" and two-space "date:", and which also carries several tasks each
           with a four-space "status: pending":
             5a. TARGETED. A harness-pm Edit with old_string a two-space "status: pending" and
                 new_string a two-space "status: approved" is DENIED, exit 2.
             5b. THE MID-LINE-START EVASION. old_string is "status: pending" then a newline then
                 two-space "approved_by:" - a payload whose FIRST line carries ZERO leading spaces
                 and which is therefore invisible to any rule anchored on a two-space line start.
                 DENIED, exit 2. This case exists because the obvious implementation ALLOWS it.
             5c. THE ACCIDENTAL SWEEP. old_string "status: pending", new_string "status: approved",
                 replace_all true. DENIED, exit 2. Measured at 6bb7d82: FEAT-32's own plan.yaml
                 carries 18 occurrences of that substring and one of them is the signature, so this
                 payload flips it with no awareness that it did. Also invisible to a two-space rule.
             5d. LIMB B, INTRODUCING a block. An Edit whose new_string carries an "approval:" line at
                 column zero is DENIED, exit 2.
             5e. THE ALLOW DIRECTION, and it must be a payload the deny cases make tempting to
                 over-block. An Edit whose old_string and new_string touch only a task body - a
                 four-space "status: pending" with its surrounding task keys - is ALLOWED, exit 0. A
                 deny-everything implementation passes 5a through 5d and fails this one.
           Assert the exit code AND a distinguishing stderr string on each of 5a-5d, so a crash
           cannot satisfy them.
        6. A plan.yaml that does not exist on disk is ALLOWED even with an approval block in the
           content - there is no signature to destroy.
        7. AN UNPARSEABLE PROPOSAL IS ALLOWED and stderr says the parse failed. Assert the stderr
           line, not just the exit code: a silent allow and a reported allow are different gates.
        8. A whitespace-only reflow of the approval block - same loaded value, different bytes - is
           ALLOWED. A text-comparing implementation fails this, which is why it is here.
        9. THE LIST IS THE SOURCE, PROVEN BY REMOVING FROM IT. With a fixture team-config.yaml whose
           main_session.writes keeps every other entry but DROPS the plan.yaml approval: entry, the
           same harness-pm approval-changing Write of case 1 is ALLOWED. A hardcoded plan.yaml pattern
           passes cases 1 through 8 and FAILS this one, which is the only case that discriminates
           reading the record from reimplementing it.
       10. THE LOUD FAIL-OPEN, both shapes. With a fixture team-config.yaml that has no main_session
           key at all, and again with one whose writes is an empty list, the case-1 Write is ALLOWED
           and stderr SAYS the exclusion list was unreadable. Assert the stderr line, not just the exit
           code: a silent allow and a reported allow are different gates, and the reported one is the
           only thing that notices a deleted entry.
       11. A FRAGMENT-LESS ENTRY CONTRIBUTES NO DENIAL. A governed agent's Write to a path matching
           .harness/logs/** is not denied on the fragment path. Assert the absence of the fragment
           denial's own marker string in stderr rather than asserting exit 0, because that path may be
           refused by ordinary domain rules for unrelated reasons and a bare exit assertion would pass
           for the wrong reason.
       12. THE GENERALISATION, BRIEF.md, both directions. A harness-pm Write of a fixture BRIEF.md
           that changes the ## Approval section body from pending to approved is DENIED, exit 2, and
           stderr names the ## Approval heading. A harness-pm Write of the same file that changes only
           the ## Goal section body and leaves ## Approval byte identical is ALLOWED. Measured at
           62f861c, the deny half of this case FAILS before the task: team-config.yaml:89 grants pm
           BRIEF.md whole and the words except ## Approval beside it are a comment, so nothing refuses
           it. That failing state must be demonstrated before the fix.
       13. THE GENERALISATION, PLAN.md. A harness-pm Write of a fixture PLAN.md changing its ##
           Approval section body is DENIED, exit 2. Same hole as case 12 at team-config.yaml:90.
       14. THE REPOSITORY'S OWN RECORD carries the entry. Read the real .harness/team-config.yaml -
           not a fixture - and assert main_session.writes contains an entry ending in
           "plan.yaml approval:" and that the BRIEF.md and PLAN.md ## Approval entries are still there.
           This case is why this task depends_on T-15: T-15 SUPPLIES that entry. It is here as well as
           in T-15's own verify because this file runs in the integration kind on every CI run, so it
           is the thing that keeps noticing if the entry is ever deleted, whereas T-15's verify runs
           once at build.

      THE EDIT ROUTE REACHES THE DOMAIN PHASE ALREADY - do not touch the PRE short-circuit. Measured
      in this worktree at 6bb7d82: the domain phase is entered at check-domain.sh:316 under
      _domain_phase, set at :294 to _governed and not _post, and nothing between :276 and :316 exits on
      the tool name. The tool-name short-circuit at :1032, if _tool != "Write" or not target, sits far
      BELOW that and gates only the SHAPE targets list. So an Edit already arrives at the region this
      task adds to, and :1032 must be left exactly as it is: moving or widening it would put Edit
      payloads into the shape gate, which is the thing DEC-180 deliberately routed to POST.

      WHY THIS DOES NOT CONTRADICT DEC-180 OR check-domain.sh:1039, and read both before starting
      rather than trusting this paragraph. DEC-180 at DECISIONS.md:5105 routes Edit and Bash to POST
      because a SHAPE verdict needs the whole resulting file to count its lines, so it would have to
      reconstruct replacement semantics and replace_all before the fact; :1039 records the same refusal
      in the POST branch's own words. Neither limb above reconstructs anything: limb A asks whether
      old_string is a substring of text already on disk, limb B asks what new_string contains. There is
      no in-memory application and no replace_all reconstruction, so the recorded refusal is untouched.
      The same decision also settles WHY this must be PRE: it fixes _domain_phase as PRE-ONLY, so the
      approval guard cannot exist as a post-hoc report at all. There is no POST detection of a flipped
      signature to fall back on. This is the first place this file inspects an Edit payload, and D-10
      records that extension of DEC-180's boundary.

      Every case that passed before this task must still pass, unedited. If one fails, the new denial
      reaches a payload it should not. THE NUMBER, so "every prior case" is gradeable rather than
      rhetorical: measured in this worktree at 6bb7d82 with CLAUDE_PROJECT_DIR set to the worktree
      root, python3 .claude/skills/harness/bin/test-check-domain.py exits 0 and prints 167 lines
      beginning "ok". After this task the count is 167 plus the new cases, never fewer, and the verify
      above asserts the floor.

      A NEAR MISS TO EXPECT WHILE ESTABLISHING THAT BASELINE, so it is not recorded as a broken test:
      python3 .claude/skills/harness/bin/test-dispatch-guard.py exits 2 at 6bb7d82. That is Python's
      no-such-file, NOT a failing suite - the file genuinely does not exist at this sha, git ls-files
      returns nothing for it, and T-07 creates it. Do not investigate it and do not treat it as a
      regression introduced here.

  - id: T-15
    title: Make the three artifacts that name a plan signer say the same thing
    traces: [REQ-11]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: >-
      check-domain.sh --resolve prints NOBODY for all three files at c32f332, so DEC-179 makes this a
      declared main-session step rather than a dispatch that would be rejected mid-run
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/templates/plan.yaml
      - .claude/agents/harness-pm.md
      - .harness/team-config.yaml
    verify: |
      set -u
      cd "$(git rev-parse --show-toplevel)" || exit 1
      export CLAUDE_PROJECT_DIR="$PWD"
      grep -qi 'written by the orchestrator only' .claude/skills/harness/templates/plan.yaml \
        && { echo "the template still names the orchestrator as the signer"; exit 1; }
      grep -q 'only it can reach the user' .claude/agents/harness-pm.md \
        && { echo "harness-pm.md still gives the orchestrator a reason DEC-120 contradicts"; exit 1; }
      python3 - <<'PY' || exit 1
      import yaml
      w = yaml.safe_load(open(".harness/team-config.yaml"))["main_session"]["writes"]
      hit = [g for g in w if g.endswith(" plan.yaml approval:")]
      assert hit, "main_session is still granted no plan.yaml approval mapping: %r" % (w,)
      assert all(len(g.split(" ", 1)) == 2 for g in hit), "the entry is not glob-space-fragment: %r" % (hit,)
      excl = [l for l in open(".harness/team-config.yaml").read().splitlines()
              if "except" in l and ("## Approval" in l or "approval:" in l)]
      assert len(excl) == 3, "expected 3 approval-exclusion comment lines, found %d: %r" % (len(excl), excl)
      for l in excl:
          assert "DEC-129" not in l, "still cites DEC-129 for the approval exclusion: %s" % l.strip()
          assert "DEC-120" in l, "the approval exclusion does not cite DEC-120: %s" % l.strip()
      
      assert any(g.endswith("BRIEF.md ## Approval") for g in w), "the BRIEF grant was dropped"
      assert any(g.endswith("PLAN.md ## Approval") for g in w), "the PLAN.md grant was dropped"
      PY
      python3 .claude/skills/harness/bin/check-plan-routes.py \
        .harness/harness/features/FEAT-32-concurrent-write-merge/plan.yaml || exit 1
      exit 0
    intent: |
      Three files. Read D-10 first: the signer is the MAIN SESSION, and the evidence is behavioural -
      DEC-120 at DECISIONS.md:2431 puts the user channel at the main session alone, so it is the only
      tier that can hold a signature the user actually gave.

      THIS TASK IS NO LONGER COSMETIC. T-14 makes check-domain.sh READ main_session.writes, so the
      entry item 3a adds is the gate's INPUT and not a record beside it. T-14 depends_on this task and
      its own suite asserts the entry's presence in the REAL file. The verify's assertion on that list
      is therefore load-bearing: if it fails, the plan.yaml approval denial does not exist.

      1. .claude/skills/harness/templates/plan.yaml, the comment above `status:` inside the approval
         block. It currently reads "Written by the ORCHESTRATOR only — pm never self-approves, and the
         orchestrator cannot ask the user (DEC-120)", which contradicts itself in one sentence: an
         agent that cannot ask the user cannot be the only writer of the user's answer. REPLACE it
         with: written by the MAIN SESSION only, because it is the only tier with a user channel;
         neither pm nor the orchestrator writes it, and check-domain.sh denies an agent's write of this
         mapping. Keep the existing sentence that any change to the task set resets this to pending.

      2. .claude/agents/harness-pm.md, the Writable paragraph. It currently says the approval block
         "is the orchestrator's, because only it can reach the user." Both halves are wrong. REPLACE
         with: never the `approval:` block - `## Approval` in a `PLAN.md` - that is the main session's,
         the only tier that can reach the user. Change nothing else in that file; it is a preloaded
         agent definition and every added line taxes every pm spawn.

      3. .harness/team-config.yaml, TWO changes, and read D-10 before making either. This file stops
         being a record and becomes THE GATE'S INPUT: after T-14, check-domain.sh READS
         main_session.writes and denies a governed agent's write that changes an excluded fragment.
         The entry you add here is the datum that makes the plan.yaml denial exist. Deleting it later
         disarms that denial, which is the residual D-10 records.

         3a. The `main_session.writes` list grants ".harness/*/features/*/BRIEF.md ## Approval" and
             ".harness/*/features/*/PLAN.md ## Approval" - the pre-DEC-182 heading form only - and
             names plan.yaml's `approval:` mapping NOWHERE, so the org-as-data record grants the live
             plan format's signature to nobody at all. ADD, keeping both existing entries untouched
             and byte identical, because T-14 asserts all three:

               ".harness/*/features/*/plan.yaml approval:"

             The entry MUST use the same glob-plus-space-plus-fragment grammar as the two beside it,
             with a single space before `approval:` and the trailing colon present, because T-14's
             parser splits on that space and uses the trailing colon to decide the comparison is a
             YAML mapping key rather than a markdown heading. Add a comment on the line naming DEC-182
             as why the third form exists and D-10's ruling as why the main session holds it.

         3b. THE CITATION IS WRONG ON THREE COMMENT LINES, not one. At 62f861c, lines :89, :90 and :91
             of this file each cite DEC-129 for the approval exclusion:

               :89  { path: .harness/*/features/*/BRIEF.md, upsert: true }   # except ## Approval (DEC-129)
               :90  { path: .harness/*/features/*/PLAN.md, upsert: true }    # except ## Approval (DEC-129)
               :91  { path: .harness/*/features/*/plan.yaml, upsert: true }  # DEC-182; except approval: (DEC-129)

             DEC-129 at DECISIONS.md:2954 is the feature-folder layout entry and contains ZERO
             occurrences of the word approval. Replace DEC-129 with DEC-120 on ALL THREE lines. DEC-120
             at DECISIONS.md:2431 is the authority: an orchestrator cannot call AskUserQuestion, so
             every approval bubbles to the main session, which asks. Do not add any other text to those
             lines; they are comments on a preloaded config and every character is context. Do not
             touch any other stanza.

         After T-14, the three `except` comments on :89-:91 are true rather than aspirational: the
         fragment denial is what enforces each of them.

      Do NOT edit .claude/skills/harness/SKILL.md. It already states this correctly and is the
      artifact the other three are being brought into line with.

  - id: T-16
    title: Fix validate-digest.py's stale self-citation of its own stop_hook_active line
    traces: [REQ-12]
    change_type: docs
