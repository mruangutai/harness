    title: Build inflight_registry.py, the single-flight claim store, and its test
    traces: [REQ-05, REQ-06, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    execution_reason: none
    depends_on: [T-01, T-02]
