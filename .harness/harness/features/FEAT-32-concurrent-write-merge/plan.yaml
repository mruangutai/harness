      exit 0
    intent: |
      Two files change. The gate gains ONE new refusal and loses none.

      PRECONDITION: read
      .harness/harness/features/FEAT-32-concurrent-write-merge/notes/research-FEAT-32-hook-payloads.md
      and use its DISPATCHED_PERSONA_KEY value as the key path for the dispatched persona. Do not
      guess it.

      IN dispatch-guard.sh, inside the existing embedded python3 block, AFTER the existing
      not-governed early exit and AFTER the existing model check, add the claim step:

        - Read the dispatched persona from the key path the note names. If absent, print one stderr
          line saying so and exit 0 - fail OPEN, loudly, on our own gap, which is the precedent this
          script's own header already states and validate-digest.py's no-agent_type pass-through
          states again in its own stderr line.
        - Import inflight_registry from the script's own directory. If the import fails, print one
          stderr line naming the module and exit 0. A guard that blocks every spawn because its
          library moved is worse than no guard.
        - Call live_claim for the dispatched persona. If it expired any, say so on stderr and
          continue.
        - If is_single_flight(dispatched) AND a live claim for it exists, print refusal_lines and
          exit 2.
        - Otherwise call claim with the dispatched persona, the DISPATCHING agent_type as dispatcher,
          and the payload's cwd, and exit 0. A claim is recorded for EVERY harness-* persona and not
          only the single-flight ones: D-06 and D-09 both depend on the dispatcher edge existing on
          disk, and it can only be written here, at the one moment the dispatcher's identity and the
          dispatched persona's name are both in one payload.

      Preserve, unchanged: the shebang, set -uo pipefail, the payload=$(cat) read, the unreadable-payload
      pass-through, the non-harness pass-through, the no-model pass-through, and every word of the
      existing model refusal. Resolve the script's own directory from BASH_SOURCE so the test can
      point DISPATCH_GUARD_BIN at a copied tree and get that copy's inflight_registry.py.

      IN test-dispatch-guard.py, ADD cases and EDIT NONE. Resolve the script as
        GUARD = os.environ.get("DISPATCH_GUARD_BIN") or os.path.join(HERE, "dispatch-guard.sh")
      and point CLAUDE_PROJECT_DIR at a fresh tempfile.mkdtemp() for every case so no case touches
      the real registry.

      NEW CASES:
        6. THE REFUSAL, and the assertion is that the predicate was REACHED. Write a registry holding
           a live harness-pm claim with a known started_at and a known dispatcher, then feed a Task
           payload naming harness-pm as the dispatched persona. Assert ALL of: exit code exactly 2;
           stderr contains "dispatch-guard: BLOCKED - single-flight"; stderr contains the ISO-8601
           form of the recorded started_at; stderr contains the recorded dispatcher name; stderr
           contains the release-all command string exported by inflight_registry. A non-zero exit
