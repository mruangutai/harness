        7. THE ALLOW HALF. Same payload, empty registry: exit 0, and the registry afterwards holds
           exactly one harness-pm claim whose dispatcher is the payload's agent_type. Assert the
           write, not just the exit.
        8. A NON-SINGLE-FLIGHT PERSONA: a payload naming harness-backend-dev exits 0 twice in a row
           and the registry afterwards holds TWO harness-backend-dev claims, so a parallel squad stays
           legal AND the dispatcher edge is on disk for both. Assert the count is two and assert each
           claim's dispatcher is the payload's agent_type. An earlier draft asserted no claim was
           written at all, which would have left D-09 with nothing to read.
        9. A STALE CLAIM: a registry whose harness-pm claim is older than the TTL yields exit 0, and
           stderr says the claim expired.
       10. THE LIBRARY IS MISSING: with inflight_registry.py absent from the copied tree, the same
