      goes on the DOMAIN path and not the SHAPE path.

      IN check-domain.sh, inside the existing embedded python3 block, inside the `if _domain_phase:`
      region and AFTER the existing domain verdict for the path, add the approval denial:

        - A module-level literal, spelled exactly

            APPROVAL_GUARD = True

          guarding the whole check. When False the check does nothing. Nothing reads an environment
          variable or a flag to change it; it exists only so a test can prove its own assertions can
          go red, which is the discipline expertise-merge.py's UNION_APPLY literal set.
        - The check applies only when the resolved relative target matches a feature plan.yaml - a
          features directory either directly under a .harness segment or nested one segment deeper, a
          FEAT- or BUG- prefixed directory, and the literal filename plan.yaml. Add a named regex
          beside the existing RE_ constants; do NOT add it to SHAPE_PATTERNS. The comment at that
          tuple explains why plan.yaml is deliberately absent from the SHAPE gate and that reasoning
          still holds - this is a domain question, "may this agent write this part of this file", which
          needs the agent's identity and therefore cannot live in a gate that has none.
        - Decide it by comparing the PROPOSED approval mapping against the ON-DISK one. For a Write,
          the proposed content is tool_input.content; for an Edit, apply nothing - instead deny when
          tool_input.old_string or tool_input.new_string contains a line whose first non-space text is
          `approval:` or which sits inside the approval block's own indentation. For a NotebookEdit,
          there is nothing to do. If the file does not exist on disk, allow: a first write cannot
          change a signature that does not exist yet.
        - Compare by PARSING both sides with yaml.safe_load and comparing the `approval` value, not by
          comparing text. A whitespace-only difference is not a signature change and denying it would
          make plan-merge.py's own output undeniable-by-luck. If either side fails to parse, ALLOW and
          say so on stderr - a gate that blocks on its own parse failure breaks every write the moment
          the payload shape changes, which is the precedent this file already sets.
        - On a difference, call deny() with lines that name the file, name the approval mapping as the
          main session's alone, and name the route: every other write to plan.yaml goes through
          plan-merge.py, which carries the base file's approval bytes forward untouched.

      THE MAIN SESSION IS EXEMPT BY THE MECHANISM, NOT BY A SPECIAL CASE. This check sits inside the
      `_domain_phase` region, which is `_governed and not _post`, and check-domain exits 0 for a
      payload carrying no agent_type. Do NOT add an explicit main-session branch: a second carve-out
      is a second thing to keep in sync, and issue #132 records what happened last time this file
      grew one.

      IN test-check-domain.py, ADD cases and EDIT NONE. Resolve the hook the way that file already
      does, via CHECK_DOMAIN_BIN, and point CLAUDE_PROJECT_DIR at a fresh tempfile.mkdtemp() for every
      case with a real .harness/team-config.yaml copied in, exactly as its existing cases do.

      NEW CASES, and each asserts the exit code AND a distinguishing string so a crash cannot satisfy
      it:
        1. A harness-pm Write of a fixture plan.yaml whose content changes approval.status from
           pending to approved is DENIED - exit 2, and stderr names the approval mapping and names
           plan-merge.py. With APPROVAL_GUARD mutated to False this case must FAIL, and it is what
           makes the red proof discriminating.
        2. A harness-pm Write of the same file that adds a task and leaves approval byte identical is
           ALLOWED, exit 0. Both directions, so a deny-everything implementation fails.
        3. A harness-orchestrator Write that changes approval is DENIED too. The orchestrator is a
           governed agent since DEC-120 and D-10 records that it is not the signer.
        4. NO agent_type at all - the main session - changing approval.status to approved is ALLOWED,
           exit 0. This is the case the whole design turns on.
        5. A harness-pm Edit whose new_string contains an `approval:` line is DENIED; an Edit whose
           old_string and new_string touch only a task body is ALLOWED. Both directions.
        6. A plan.yaml that does not exist on disk is ALLOWED even with an approval block in the
           content - there is no signature to destroy.
        7. AN UNPARSEABLE PROPOSAL IS ALLOWED and stderr says the parse failed. Assert the stderr
           line, not just the exit code: a silent allow and a reported allow are different gates.
        8. A whitespace-only reflow of the approval block - same loaded value, different bytes - is
           ALLOWED. A text-comparing implementation fails this, which is why it is here.

      Every case that passed before this task must still pass, unedited. If one fails, the new denial
      reaches a payload it should not.

