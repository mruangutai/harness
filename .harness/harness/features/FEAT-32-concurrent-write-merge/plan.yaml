  - id: T-02
    title: Build harness_merge.py, the one locked read-modify-write core, and its test
    traces: [REQ-04, REQ-06, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    execution_reason: none
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/harness_merge.py
      - .claude/skills/harness/bin/test-harness-merge.py
    verify: |
      set -u
      test -f .claude/skills/harness/bin/expertise-merge.py || {
        echo "START GATE FAILED (D-01): FEAT-30 is not merged, so expertise-merge.py is absent"; exit 1; }
      T=$(mktemp -d) || exit 1
      cp -R .claude/skills/harness/bin "$T/bin" || exit 1
      python3 - "$T/bin/harness_merge.py" <<'PY' || exit 1
      import sys
      p = sys.argv[1]
      s = open(p).read()
      m = s.replace("USE_FLOCK = True", "USE_FLOCK = False", 1)
      assert m != s, "USE_FLOCK assignment not found BY NAME"
      open(p, "w").write(m)
      PY
      HARNESS_MERGE_DIR="$T/bin" python3 .claude/skills/harness/bin/test-harness-merge.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with flock switched off"; exit 1; }
      python3 .claude/skills/harness/bin/test-harness-merge.py || exit 1
      exit 0
    intent: |
      Write two new files. Change nothing else. This is the shared core every other write route in
      this feature calls, and it is a LIBRARY, not a gate - it is imported, never registered as a
      hook. python3 stdlib only, no third-party imports.

      START GATE, and it is not negotiable. Before writing anything, assert that
      .claude/skills/harness/bin/expertise-merge.py exists. If it does not, FEAT-30 has not merged
      and this whole feature is blocked by D-01 - return BLOCKED naming D-01, and write nothing.

      FILE 1 - .claude/skills/harness/bin/harness_merge.py.

      Module-level literals, each of which a test mutates BY NAME in a copy of the tree:
        USE_FLOCK = True
        LOCK_TIMEOUT_SECONDS = 10.0
        LOCK_RETRY_INTERVAL = 0.05

      Public surface, exactly four names:

        class MergeRefusal(Exception) - carries an integer code and a list of stderr lines. The
        caller prints the lines and exits the code. It exists so the core never calls sys.exit
        itself; a library that exits cannot be tested for its return value.

        acquire(lock_path) - a context manager. When USE_FLOCK is True: open lock_path with
        O_CREAT|O_RDWR (NEVER O_EXCL, so the file's existence is not the lock), then loop
        fcntl.flock(fd, LOCK_EX|LOCK_NB) with LOCK_RETRY_INTERVAL sleeps until
        LOCK_TIMEOUT_SECONDS elapses, then raise MergeRefusal(6, ["LOCKED: could not acquire
        <lock_path> within <n>s"]). The lock file is NOT removed on release - flock is released by
        closing the descriptor, and removing the file would reintroduce the race it avoids. When
        USE_FLOCK is False: reproduce expertise-merge.py's behaviour exactly - os.open with
        O_CREAT|O_EXCL|O_WRONLY, retry on FileExistsError, exit-6 refusal on timeout, and remove the
        file in a finally. That branch exists ONLY so a test can prove the flock branch is what makes
        the stale-lock case pass; nothing selects it at runtime, no flag and no environment variable.

        locked_update(path, transform) - the whole read-modify-write, under acquire(path + ".lock"):
        read path as BYTES if it exists, else None; call transform(base_bytes) which returns the new
        bytes or raises MergeRefusal; write the result to a tempfile created with tempfile.mkstemp in
        the SAME directory as path and os.replace it onto path, removing the tempfile if the write
        raises. os.replace is what makes a mid-write read impossible - a reader sees the whole old
        file or the whole new one, never a prefix. On MergeRefusal, write nothing at all and
        re-raise: the file must be byte identical to before.

        require_destination(path, tail_regex, what, hint_lines) - resolve path with
        os.path.realpath(os.path.abspath(path)), search tail_regex against the RESOLVED string, and
        raise MergeRefusal(9, ...) when it does not match. Matching the resolved path rather than the
        argument is what stops a dot-dot segment or a symlink walking out of the file class and back
        in under a legal-looking tail. The refusal lines must name the given path, the resolved path,
        and what the tool does own.

      Write a module docstring that states, in the tool's own voice: this core has NO identity
      source, so it can check WHERE a write lands and never WHO asked for it; and it is reachable
      from a read-only persona because bash-write-guard.sh is allow-by-omission, which is issue #627
      and is not fixed here.

      FILE 2 - .claude/skills/harness/bin/test-harness-merge.py, house shape - a check(name, ok,
      detail) accumulator, PASS and FAIL lines, a final PASS or FAIL summary line, exit 1 on any
      failure. Resolve the module under test as

        sys.path.insert(0, os.environ.get("HARNESS_MERGE_DIR") or HERE)

      so a mutated copy of the tree can be swapped in without editing this file. Every case runs in a
      fresh tempfile.mkdtemp() and never touches a real .harness path.

      CASES:
        1. locked_update creates a file that does not exist, from a transform that receives None.
        2. locked_update applies a transform to an existing file and the result is exactly the bytes
           the transform returned - asserted byte for byte, not by a substring.
        3. A transform that raises MergeRefusal leaves the file BYTE IDENTICAL to before, and no
           tempfile is left in the directory. Assert both.
        4. THE STALE-LOCK CASE, which is D-02's whole reason. Fork a child that acquires the lock on
           a fixture and then blocks forever; SIGKILL it; then run locked_update on the same path in
           the parent and assert it returned normally AND that the transform's output is on disk.
           The assertion is the successful apply, never merely the absence of a hang. With USE_FLOCK
           False this case must fail, because the O_EXCL branch leaves the lock file behind.
        5. CONTENTION: two subprocesses each call locked_update with a transform that appends a
           distinct line and sleeps briefly inside the transform. Admit exactly two outcomes - both
           lines present, or one process raised MergeRefusal code 6 and applied nothing. Report any
           third outcome by trial number with both results and the file content. Run 20 trials.
        6. NO TORN READ: a subprocess loops reading the file while another runs locked_update with a
           transform producing a much larger body. Assert that every read the reader observed was
           either exactly the old bytes or exactly the new bytes - never a prefix of either and never
           empty. This is the read-side assertion for REQ-04.
        7. require_destination accepts a matching resolved path and raises MergeRefusal(9) for a
           non-matching one AND for a dot-dot escape whose literal argument ends in a matching tail.
           Both directions, so an allow-nothing implementation fails.
        8. acquire raises MergeRefusal(6) when the lock is already held by a LIVE process, and the
           refusal lines name the lock path. Assert the code and the path, not just that something
           was raised.

  - id: T-03
    title: Build plan-merge.py so a second plan writer adds tasks and never deletes them
    traces: [REQ-01, REQ-03, REQ-08]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    execution_reason: none
    depends_on: [T-02]
    status: pending
    files:
      - .claude/skills/harness/bin/plan-merge.py
      - .claude/skills/harness/bin/test-plan-merge.py
    verify: |
      set -u
      T=$(mktemp -d) || exit 1
      cp -R .claude/skills/harness/bin "$T/bin" || exit 1
      python3 - "$T/bin/plan-merge.py" <<'PY' || exit 1
      import sys
      p = sys.argv[1]
      s = open(p).read()
      m = s.replace("UNION_MERGE = True", "UNION_MERGE = False", 1)
      assert m != s, "UNION_MERGE assignment not found BY NAME"
      open(p, "w").write(m)
      PY
      PLAN_MERGE_BIN="$T/bin/plan-merge.py" \
        python3 .claude/skills/harness/bin/test-plan-merge.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with the union switched off"; exit 1; }
      T2=$(mktemp -d) || exit 1
      cp -R .claude/skills/harness/bin "$T2/bin" || exit 1
      python3 - "$T2/bin/plan-merge.py" <<'PY' || exit 1
      import sys
      p = sys.argv[1]
      s = open(p).read()
      m = s.replace("PRESERVE_BASE_BYTES = True", "PRESERVE_BASE_BYTES = False", 1)
      assert m != s, "PRESERVE_BASE_BYTES assignment not found BY NAME"
      open(p, "w").write(m)
      PY
      PLAN_MERGE_BIN="$T2/bin/plan-merge.py" \
        python3 .claude/skills/harness/bin/test-plan-merge.py >/dev/null 2>&1 \
        && { echo "RED PROOF FAILED: the suite passes with the byte preservation switched off"; exit 1; }
      python3 .claude/skills/harness/bin/test-plan-merge.py || exit 1
      exit 0
    intent: |
      Write two new files. Change nothing else. Import the lock and the atomic replace from
      harness_merge - do not write fcntl, O_EXCL or os.replace anywhere in either file.

        plan-merge.py apply --file <path to a plan.yaml> --proposal <path or - for stdin>

      THE ALGORITHM. Read D-03 and D-04 before starting: the merge SPLICES TEXT and never re-renders
      through a YAML dumper, and the approval block is the base file's bytes and nothing else.

        1. require_destination on --file, against a tail that matches, on the RESOLVED path, a
           features directory either directly under a .harness segment or nested one segment deeper,
           a FEAT- or BUG- prefixed directory, and the literal filename plan.yaml. Exit 9 otherwise.
        2. Everything below happens inside harness_merge.locked_update on --file.
        3. yaml.safe_load both the base bytes and the proposal. PyYAML is REQUIRED (DEC-171 am.1) -
           import it plainly. Either side failing to parse is MergeRefusal(5) naming which side and
           the parser's own message, applying nothing. A base that does not exist is treated as an
           empty mapping and the proposal is written whole.
        4. Build a LINE-RANGE INDEX over the base TEXT: for each top-level key, the half-open line
           range from its own line to the line before the next line matching a top-level key at
           column zero; and within the tasks and decisions blocks, for each list item, the range from
           the item's leading dash line to the line before the next dash at that same indent. Key
           each item by its id value. Do the same for the proposal.
        5. UNION_MERGE = True, a module-level literal guarding step 6, exactly as expertise-merge.py
           uses UNION_APPLY. When False, write the proposal's bytes alone - which is today's
           last-writer-wins behaviour - so a test can prove the union assertions can go red. Nothing
           reads an environment variable or a flag to change it.
        6. For tasks and for decisions: every base item stays, in its base order, as its own base
           TEXT. A proposal item whose id is absent from the base is APPENDED to that block as its
           own proposal text, in proposal order. A proposal item whose id is present and whose
           safe_load-ed value is EQUAL to the base's is skipped and reported PRESERVED. A proposal
           item whose id is present and whose value DIFFERS is a conflict: exit 7, apply nothing,
           print the id and both loaded values. A real conflict is the author's to resolve, not the
           tool's to guess.
        7. approval: the base's line range, byte for byte, always. The proposal's approval block is
           IGNORED, and the tool reports IGNORED-APPROVAL on stdout when the proposal carried one so
           the caller knows it was dropped. Guard this with a second module-level literal,
           PRESERVE_BASE_BYTES = True; when False, render the whole output through yaml.safe_dump,
           which is what a naive implementation does and what the byte-identity test must reject.
        8. Every other top-level key: present in base only, keep the base text. Present in proposal
           only, append the proposal text. Present in both and loaded-equal, keep the base text.
           Present in both and loaded-different, exit 7 naming the key and both values.
        9. Emit the assembled bytes through locked_update, so the replace is atomic.
       10. On success print one ADDED line per new id, one PRESERVED line per kept id, and a final
           APPLIED line with the path. Never a bare count.

      Exit codes, and they are the interface: 0 applied, 5 a side did not parse, 6 lock not acquired,
      7 the same id with two different values or a top-level key with two different values, 9 the
      destination is not a plan.yaml.

      test-plan-merge.py, house shape, resolving the CLI as

