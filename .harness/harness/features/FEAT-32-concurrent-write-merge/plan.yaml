decisions:
  - id: D-01
    choice: >-
      The build takes one shared module, harness_merge.py, holding the lock and the atomic replace,
      with expertise-merge.py rewired onto it. That shape requires expertise-merge.py to exist in the
      tree, and its PRECONDITION IS NOW DISCHARGED: FEAT-30 merged as squash 47a9935 (PR 629) with
      terminal record 7dbb0f1, and 47a9935 is an ancestor of this feature's HEAD c32f332. All four
      FEAT-30 deliverables are present in this worktree — expertise-merge.py, test-expertise-merge.py,
      feature-worktree.py, test-feature-worktree.py. T-02's start-gate assertion STAYS as a
      regression guard, not as a wait. THE ALTERNATIVE SHAPE IS REJECTED, not deferred: a transcribed
      second copy of the lock, giving two lock dialects in one bin directory, is off the table by
      operator ruling and must not be re-proposed by any task.
    because: >-
      DEC-193 settled this exact fork for the two write routes and chose one shared implementation
      with divergences recorded; a transcribed second copy would put two lock dialects in one bin
      directory, and REQ-07 exists because three copies of this defect is how it got filed three
      times. The gating price this decision used to carry — the destructive defect staying live until
      FEAT-30 merged — has been paid: the merge happened, so no mitigation window remains and no task
      is blocked on it.
    dec: DEC-193
  - id: D-02
    choice: >-
      The shared core locks with fcntl.flock on a sibling lock file opened O_CREAT (never O_EXCL),
      not with expertise-merge.py's O_CREAT-plus-O_EXCL create-and-delete. Retry with LOCK_NB for
      the same ten seconds and the same exit 6. Recorded as a deliberate divergence from the model,
      and expertise-merge.py is rewired onto it so the divergence exists in one place.
    because: >-
      a create-and-delete lock file leaves permanent state when the holder is SIGKILLed or when
      /clear kills an in-flight agent, and every later write then exits 6 after a ten-second wait.
      For an Expertise file that is a distillation failing loudly; for plan.yaml it bricks every
      plan write for that feature, which is a worse outcome than the loss this feature exists to
      prevent. flock is released by the kernel on process death, so it has no stale state at all.
    dec: none
  - id: D-03
    choice: >-
      plan-merge.py merges by SPLICING TEXT out of the two source files, keyed on each list item's
      id, and never re-renders the file through a YAML dumper. safe_load is used to validate both
      sides and to compare two items with the same id, never to produce the output.
    because: >-
      a dumper round trip destroys every comment and reorders every mapping, which would silently
      carry away the approval block's sub-keys and the template's own explanatory comments; and
      REQ-03 asks for byte identity, which a re-render cannot give. The cost is a second parser
      shape in the tool — a line-range index over top-level keys and list-item ids — and it is
      accepted because the byte-identity criterion cannot be met any other way.
    dec: DEC-182
  - id: D-04
    choice: >-
      The approval block is never written by plan-merge.py and never carried from the proposal. It
      is the base file's bytes, untouched. THE MAIN SESSION — not the orchestrator — continues to
      write approval with the Edit tool, which is a surgical patch rather than a whole-file write and
      therefore cannot destroy the task list; every OTHER write to plan.yaml, by any tier, goes
      through plan-merge.py.
    because: >-
      the approval block is the main session's and nobody else's: team-config.yaml's main_session
      writes list is the only place any signer is granted, DEC-120 puts the user channel at the main
      session alone, and the orchestrator playbook .claude/skills/harness/SKILL.md states in its own
      words that only the main session writes plan.yaml's approval mapping. An earlier draft of this
      decision named the orchestrator, which is false in a way that matters — the orchestrator cannot
      reach the user, so a signature it wrote would be nobody's. FEAT-30's approval.rulings carried an
      operator cycle budget that a wholesale rewrite would have taken away silently. A tool that can
      write it is a tool that can lose it. The authority is DEC-120 at DECISIONS.md:2431, re-derived at
      62f861c from DECISIONS-INDEX.md:139 — an orchestrator cannot call AskUserQuestion, so every
      approval bubbles to the main session, which asks. DEC-112 at DECISIONS.md:1931 corroborates from
      the init side, writing the user's explicit approval without ever self-approving. An earlier draft
      of this decision cited DEC-129, which is the feature-folder layout entry and contains zero
      occurrences of the word approval.
    dec: DEC-120
  - id: D-05
    choice: >-
      For an observation log, union means an ORDER-PRESERVING UNION OF BULLET RECORDS keyed on the
      record's whitespace-normalised text. A record starts at a line matching a dash and a space at
      column zero and runs to the next such line. Base records keep their order and come first,
      then proposal records whose normalised text is not already present, in proposal order.
      THERE IS NO CONFLICT EXIT FOR THIS FILE CLASS and no id scheme is imposed: two records with
      different text are two records and both are kept. Its refusal exits are 6, lock not acquired,
      and 9, a destination that is not an observation log. There is no cap and therefore no exit 8.
    because: >-
      the log has no entry ids to key on, so expertise-merge.py's section-plus-id union does not
      transfer. Imposing ids would rewrite every existing log and change what agents are told to
      write for no gain, since the log is append-only prose that nothing parses. Exit 7 would be
      wrong here rather than merely unnecessary — divergent text is the NORMAL case for a log, and
      a tool that refused it would refuse almost every append. No cap exists because the log is
      deliberately uncapped — DEC-145 split recording from distillation
      precisely so this log is never injected into a spawn, so its size costs no spawn anything.
    dec: DEC-145
  - id: D-06
    choice: >-
      The #551 fix is a CLAIM REGISTRY that records EVERY harness-* dispatch and REFUSES only the
      ones under single flight. dispatch-guard.sh, already the PreToolUse Task hook, records a claim
      for every dispatched harness-* persona and refuses a dispatch of a persona named in the module
      literal SINGLE_FLIGHT_AGENTS while a live claim for that persona exists on this checkout;
      validate-digest.py, already the SubagentStop hook, releases the returning agent's own claim.
      The registry file is .harness/.inflight-claims.json and it is written through harness_merge.py,
      so the registry is not itself a new instance of this defect class. Only harness-pm is in
      SINGLE_FLIGHT_AGENTS. The registry maps a persona name to a LIST of claims, each carrying the
      DISPATCHER's persona name, so "which children of this agent are still in flight?" is a lookup
      rather than an unanswerable question — that lookup is what D-09 stands on.
    because: >-
      refusing the SECOND DISPATCH is what #551 occurrence 1 actually needed, and it is achievable;
      making a lead WAIT for its members is not — see D-09 for the measurement and for what is
      achievable instead. Recording a claim for every persona while refusing only the single-flight
      ones costs one locked JSON write per spawn, roughly 33 per feature, and is the only way the
      dispatcher edge exists on disk at all; refusing on that edge is a separate decision and is not
      taken here, so a legitimate parallel squad of two harness-backend-dev members stays legal. A
      persona's claims are a list rather than one object because two harness-backend-dev members are
      legal and one object could not hold both; release removes the OLDEST claim for the returning
      persona, which is sufficient because the registry is a counter of live children and not an
      identity map. #551's occurrences 5, 6 and 7, all from run dir 2026-08-21-1-product, are the same
      shape as 1 seen from the other two tiers: 5 is a lead forced to a terminal digest with its pm
      still in flight, 6 is the orchestrator forced to a stop with its lead still in flight, and 7 is
      what 5 COST. Occurrence 7: that lead's first digest was written under a forced SubagentStop close
      with pm still in flight and asserted pm's work was files_touched empty and unrecoverable, and
      that digest was COMMITTED as the run's outcome. pm was then resumed, ran to completion and
      returned PASS, and 148c8c5 corrected the record. So the defect does not merely cost a spawn - it
      WROTE A FALSE VERDICT INTO THE DURABLE RECORD, and only a resume caught it. That is strictly
      stronger than losing a spawn and nobody had recorded it before. Run dirs are gitignored, so the
      durable record of all three is STATE.md and the decision entry T-13 writes - never the run dir.
    dec: none
  - id: D-07
    choice: >-
      Every claim carries a start time and is treated as ABSENT once older than CLAIM_TTL_SECONDS,
      set to 3600. The staleness is reported on stderr and the dispatch is allowed. inflight_registry.py
      also ships list and release-all subcommands, and the refusal message prints the release-all
      command verbatim.
    because: >-
      the release runs in a hook process that can die, and a leaked claim with no expiry would
      refuse every later pm dispatch on that checkout — a fix that bricks the factory is worse than
      the defect. 3600 is above the longest observed pm spawn and below any plausible session, and
      it is a named literal so a measurement can move it. Failing OPEN on a leaked claim is the
      house precedent for a guard's own bug, printed by validate-digest.py's internal-error
      pass-through - the stderr line ending "this is our bug, not theirs" - and set by check-domain.sh.
    dec: none
  - id: D-08
    choice: >-
      Each merge CLI carries its own exit-9 destination refusal, decided on os.path.realpath, and
      THREE ISSUES ARE EXPLICITLY OUT OF SCOPE AND NO TASK MAY ABSORB THEM: #627,
      bash-write-guard.sh's allow-by-omission default; #560, nothing serialises Expertise writes
      against an open distillation run; and #605, nothing serialises two leads' members against one
      checkout. #560 and #605 are named out because the claim registry built here IS the mechanism
      both would need, so a build agent will be tempted to add a persona to SINGLE_FLIGHT_AGENTS and
      call them fixed; which personas join that literal is a policy call with a real cost — refusing
      a legitimate parallel squad — and it is not this feature's to make. The pattern accepts both
      layout forms — a features segment directly
      under .harness and one nested under a repository segment — because DEC-194 judges a partial
      layout migration per coupled surface.
    because: >-
      bash-write-guard.sh is allow-by-omission, so a python3 invocation reaches neither the
      read-only denial at its agent-in-REVIEWERS branch nor the domain walk over its findings list -
      cite those by symbol, because the line anchors used in earlier rounds had all drifted by
      c32f332 - and the tool's own destination check is
      the only guard left. Fixing #627 properly means designing a rule rather than a list for
      extracting each tool's destination argument, in a named enforcement-layer gate, which is a
      feature of its own. Accepting both layout forms costs one alternation and avoids a tool that
      refuses the very file it was pointed at on whichever branch has not migrated yet.
    dec: DEC-194
  - id: D-09
    choice: >-
      A LEAD CANNOT BE MADE TO WAIT FOR ITS CHILDREN, AND THAT IS RECORDED AS AN IMPOSSIBILITY RATHER
      THAN WORKED AROUND. What ships instead is two mechanisms that can actually hold, on the two
      hooks that can actually hold them.
      (1) THE ONE-SHOT RETURN CONTRACT, on SubagentStop. validate-digest.py refuses, exit 2, a return
      from a lead or the orchestrator while the registry holds a live claim whose dispatcher is that
      agent, and the stderr names each in-flight child and its start time. This fires AT MOST ONCE
      per return, which is not a wait — but it is exactly the strength every other digest contract in
      that file already has, and it is aimed at the right defect: #551 occurrences 3, 4, 5, 6 and 7 are
      FALSE REPORTING, a verdict asserted about members the reporter could not see, and one
      correction round is the house mechanism for a false return. OCCURRENCE 7 IS THE STRONGEST
      EVIDENCE IN THIS FEATURE FOR THAT ARGUMENT and it was measured on this feature's own run: a
      lead's digest, written under a forced close with pm still in flight, asserted pm's work was
      files_touched empty and unrecoverable, and was COMMITTED as the run's outcome; pm was resumed,
      completed, returned PASS, and 148c8c5 corrected the record. The harm was not a lost spawn - it
      was a FALSE VERDICT in the durable record, caught only by a resume. A one-shot refusal on the
      hook the return travels through is aimed at exactly that.
      (2) THE UNBOUNDED CONTAINMENT, on PreToolUse. A PreToolUse refusal has no once-only bound, and
      dispatch-guard.sh already exercises that. The single-flight refusal of D-06 is what actually
      prevents the LOSS, because the loss happens at the second dispatch and not at the premature
      return.
      WHAT REMAINS IMPOSSIBLE, stated so nobody mistakes this for a fix: an agent that re-returns the
      same premature digest a second time ships it, because stop_hook_active passes the second return
      through unconditionally; and an orphaned child of an interrupted parent (DEC-131) has no parent
      left to refuse, so neither mechanism reaches it. #551 therefore NARROWS rather than closes, and
      the residual is those two cases and not "occurrences 3 and 4".
    because: >-
      the measurement that forces this is in the tree and was re-read at c32f332:
      validate-digest.py:845 is `if d.get("stop_hook_active"): return 0`, and its docstring at
      :815-818 gives the reason — blocking again when we are already re-running because a stop hook
      blocked is an infinite loop with no operator escape. So a SubagentStop refusal fires once and
      can never be a wait, and any task planning one would plan something unachievable. The
      discriminating question was therefore not "how do we wait" but "which of #551's harms needs a
      wait": the LOSS needs a refused dispatch, which PreToolUse gives unbounded, and the FALSE
      REPORT needs one correction round, which SubagentStop gives exactly once. Neither harm needed
      the thing that is impossible. The alternative of a polling wait inside the lead's own turn was
      rejected: there is no disk signal a lead could poll that its children write, and a wait loop in
      an agent turn is the shape this repository forbids outright.
    dec: none
  - id: D-10
    choice: >-
      THE SIGNER IS THE MAIN SESSION, AND THE EXCLUSION BECOMES ENFORCED BY A CHECK THAT READS THE
      RECORD. check-domain.sh gains a domain-path denial sourced from team-config.yaml's
      main_session.writes list. Each entry in that list is a glob plus an OPTIONAL trailing FRAGMENT,
      space-separated, and the fragment decides the comparison. A fragment ending in a colon is a YAML
      mapping key: load both sides and compare that key's value. A fragment beginning with two hashes
      and a space is a markdown heading: compare that section's body. An entry with NO fragment, such
      as the logs glob, is a plain main-session grant and contributes no denial at all. A governed
      agent's Write or Edit that changes an excluded fragment of a matching file is denied; one that
      leaves it untouched is allowed. Sourcing the denial from the list is what generalises it from one
      file to three with ONE mechanism, because the list already names BRIEF.md and PLAN.md Approval
      headings alongside the plan.yaml approval mapping this feature adds to it. It goes on the domain
      path deliberately, not the SHAPE path, because check-domain exits 0 for a payload carrying no
      agent_type, so the main session is exempt by the mechanism itself rather than by a special case.
      plan-merge.py KEEPS its byte-identical carry-forward of the approval block as a separate and
      independent property — a tool must not corrupt the mapping even when its caller is entitled to
      write the file — but it is NOT the enforcement point. TWO LAYERS SHIP, AND THEY ARE NOT
      REDUNDANCY: each exists for a different reason and neither substitutes for the other. LAYER 1,
      in check-domain.sh, IS THE ENFORCEMENT OF WHO MAY SIGN. It is the gate: it holds the agent's
      identity, it is a PreToolUse hook so it runs on every governed Write and Edit whether or not the
      writer chooses to invoke any tool, and it is the only layer that can REFUSE. LAYER 2, in
      plan-merge.py, IS NOT THAT ENFORCEMENT. It is the structural backstop against a reformatting
      that unhooks layer 1's text convention: it parses the file and refuses when the proposal's
      approval mapping differs from the base's, which is a comparison of loaded values and therefore
      survives any change of indentation or quoting that would defeat a text rule. NOBODY MAY DELETE
      LAYER 1 ON THE GROUND THAT plan-merge.py COVERS IT, and that deletion is the specific failure
      this paragraph exists to prevent: plan-merge.py is a tool the writer CHOOSES to invoke, so layer
      2 is unreachable by an agent that simply uses Edit — which is exactly the argument three
      paragraphs down that rejected plan-merge.py as the enforcement point in the first place, and it
      is not weakened by layer 2 existing. Nor may layer 2 be deleted on the ground that layer 1
      covers it: layer 1's discrimination rests on an indentation convention no YAML rule guarantees.
      A BOUNDARY OF DEC-180 IS EXTENDED HERE DELIBERATELY, and it is recorded so it is not mistaken
      for an oversight. DEC-180 at DECISIONS.md:5105 routes Edit to PostToolUse because a SHAPE
      verdict needs the whole resulting file to count its lines, so it would have to reconstruct
      replacement semantics before the fact; check-domain.sh:1039 records that refusal in the POST
      branch's own words. Layer 1 reconstructs nothing — it asks whether the replaced text is a
      substring of the approval block already on disk, and what the replacement text contains — so the
      refusal stands untouched. The same decision also forces layer 1 to be PRE: it fixes
      _domain_phase as _governed and not _post, so there is no post-hoc detection of a flipped
      signature available to fall back on, and an approval guard that is not preventive does not exist
      at all. The residual accepted with that: a PRE read of the on-disk block is a time-of-check
      window, bounded only by the fact that the main session is the sole tier entitled to write the
      block and that plan-merge.py locks every other route into the file. Three record artifacts that name a
      different signer are corrected to match: the plan template's approval comment, harness-pm.md's
      writable paragraph, and team-config.yaml, which today names plan.yaml's approval mapping nowhere
      at all and carries the wrong decision number on three separate comment lines.
    because: >-
      four artifacts disagreed and the tree enforced none of them. Measured at 62f861c: grep -n
      main_session in check-domain.sh returns ZERO lines, so main_session.writes is a record no code
      reads, which is the defect class this repository files most often; check-domain.sh --resolve on a
      plan.yaml prints harness-orchestrator and harness-pm, so both may write the whole file including
      the mapping and nothing refuses them; and THE SAME HOLE IS THREE FILES WIDE, because
      team-config.yaml grants pm BRIEF.md and PLAN.md whole at :89 and :90 and the words except ##
      Approval beside those grants are a COMMENT, so a pm writing an approved status into a BRIEF is
      unrefused too. Documenting the exclusion without enforcing it was put and DECLINED. The main
      session wins on BEHAVIOUR and not on seniority: DEC-120 at DECISIONS.md:2431 rules that an
      orchestrator cannot call AskUserQuestion so every approval bubbles to the main session, which
      asks, making it the only tier that can hold a signature the user actually gave; DEC-112 at
      DECISIONS.md:1931 corroborates. plan-merge.py was REJECTED as the enforcement point: it is a tool
      the writer CHOOSES to invoke, pm holds Write and Edit and --resolve grants it the whole plan.yaml,
      so a check inside the merge tool is refusable by not calling the merge tool — a convention, not
      an exclusion, and the same defect class as the unread record one level up. Denying the mapping to
      any agent_type outright was CONSIDERED AND IS SUBSUMED rather than dropped: its insight, that no
      tier but the main session may write it, is exactly why no main-session carve-out is needed, since
      a payload with no agent_type never reaches the domain phase at all. THE COST, stated rather than
      glossed: sourcing the denial from the list makes the list load-bearing, and that cuts both ways —
      delete the entry and the gate silently stops denying. Fail-open is the correct direction, because
      a gate that blocks when it cannot read its own record breaks every write, but it MUST BE LOUD,
      which is the precedent check-domain.sh sets in its own words at :798 and :811 and DEC-127 at
      DECISIONS.md:2839 sets for validate-digest.py in matching check-domain.sh's precedent by name.
      So a missing key or an empty list ALLOWS and says on stderr that the exclusion list was
      unreadable, and T-14 asserts that stderr LINE and not only the exit code. The residual is exact
      and is not closed: someone who deletes the entry disarms the gate, and the only two things that
      notice are that stderr line and T-14's own test — which is why T-14 asserts the entry's presence
      in the repository's REAL team-config.yaml and not only in its fixtures.
    dec: DEC-120

tasks:
  - id: T-01
    title: Measure the one unknown hook payload key — the name of the DISPATCHED persona
    traces: [REQ-05, REQ-09]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: >-
      the capture temporarily instruments dispatch-guard.sh, a registered PreToolUse hook and so
      inside DEC-174 amendment 4's enforcement-layer CATEGORY, even though the only file that changes
      is the note
    depends_on: []
    status: done
    files:
      - .harness/harness/features/FEAT-32-concurrent-write-merge/notes/research-FEAT-32-hook-payloads.md
    verify: |
      set -u
      cd "$(git rev-parse --show-toplevel)" || exit 1
      export CLAUDE_PROJECT_DIR="$PWD"
      F=.harness/harness/features/FEAT-32-concurrent-write-merge/notes/research-FEAT-32-hook-payloads.md
      test -f "$F" || { echo "the capture note does not exist"; exit 1; }
      grep -q '^## PreToolUse Task payload keys$' "$F" || { echo "no PreToolUse key-set section"; exit 1; }
      grep -q '^DISPATCHED_PERSONA_KEY=' "$F" || { echo "the dispatched-persona key is not named"; exit 1; }
      grep -q '^DISPATCHED_PERSONA_KEY=NONE$' "$F" && { echo "the key was not found - T-06, T-08 are blocked"; exit 1; }
      grep -q '^STOP_HAS_AGENT_TYPE=' "$F" && { echo "SubagentStop agent_type is already measured; do not re-measure it"; exit 1; }
      git diff --quiet -- .claude/skills/harness/bin/dispatch-guard.sh || { echo "instrumentation left in dispatch-guard.sh"; exit 1; }
      git diff --quiet -- .claude/skills/harness/bin/validate-digest.py || { echo "validate-digest.py must not be touched by this task"; exit 1; }
      exit 0
    intent: |
      This task measures the platform. It writes ONE markdown note and reverts every other change it
      makes. Nothing in the rest of this plan may cite a payload key this note does not record.

      METHOD, copied from the probe FEAT-31 already ran successfully
      (feat/FEAT-31-orchestrator-context-watch, notes/probe-hook-payload-identity.md): append one
      line to the hook script immediately after it reads stdin, writing the raw payload to a scratch
      file outside the repository, then trigger the hook once, then REVERT the line and confirm with
      git diff that the file is clean.

      ONE CAPTURE, AND ONLY ONE. An earlier draft of this task also measured whether SubagentStop
      carries agent_type. DO NOT MEASURE THAT - it is already measured, and re-measuring a settled
      fact is how a plan spends a spawn on nothing. The evidence: validate-digest.py selects a
      PERSONA-SPECIFIC schema from the dispatched agent's own name, and a live orchestrator return was
      rejected against the "orchestrator" schema in the SCHEMAS mapping. The no-agent_type
      pass-through, whose print begins "check-digest: hook payload has no agent_type", did not fire.
      A schema chosen by persona cannot be chosen when the persona is absent. SubagentStop carries
      agent_type: settled.

      WHAT IS STILL UNKNOWN is exactly one key: the key path on a PreToolUse Task payload that names
