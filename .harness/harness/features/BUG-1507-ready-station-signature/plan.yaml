    intent: |
      Create ONE new file, tests/integration/test-station-argument-spelling.py, in the worktree
      /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/BUG-1507-ready-station-signature.
      Touch no other file. python3, stdlib only, no pytest. Match the harness of
      tests/integration/test-check-instruction-paths.py: a module-level RESULTS list, a
      check(name, ok, detail="") helper that appends and prints "PASS - " or "FAIL - " plus the
      name, a main() that runs the cases and raises SystemExit(1) if any row is false, and the
      standard __main__ guard. tests/integration/test-*.py is what run-unit-tests.sh --kind
      integration globs, so the filename must keep that shape.

      WHY THIS FILE EXISTS: FEAT-41 D-14 migrated the station CLI argument to lowercase and left
      two instruction files behind teaching a spelling both tools hard-refuse. Nothing could catch
      that. This file is that witness.

      THE SWEEP IS A PURE FUNCTION OF A ROOT, AND IS CALLED IN-PROCESS. Every helper below takes an
      explicit root argument. There is NO environment variable that repoints the scope, no
      module-level scope override, no subprocess re-invocation of this file, and therefore no
      recursion guard and no conditionally-skipped rows. The negative control in case 5 calls the
      same helpers on a scratch root inside the same process. This is deliberate and is the shape
      the sibling test uses (tests/integration/test-check-instruction-paths.py lines 25-26 pass an
      explicit --root to the checker rather than repointing it through the environment): a scope
      override read at import time would make every positive-control row conditional, and a stale
      export would then let the whole file print PASS while sweeping zero repo files.

      1. Module-level setup.

      HERE = dirname(abspath(__file__)); REPO_ROOT = abspath(join(HERE, "..", "..")).
      sys.path.insert(0, join(REPO_ROOT, ".claude", "skills", "harness", "bin")) and import
      factory_config.

      ACCEPTED SETS ARE DERIVED, NEVER SPELLED. gh-sync.py status accepts
      set(factory_config.MANDATED_STATIONS) | {factory_config.TERMINAL_MARKER}, matching gh-sync.py's
      own STATION_VALUES at line 122. board-station.py accepts set(factory_config.MANDATED_STATIONS)
      only - its own docstring says the terminal marker names no column and it validates against
      MANDATED_STATIONS. Comment both, and say a hand-written list here would be the same defect
      the file is testing for. Expose them as one mapping from tool name to accepted set, so
      offenders() below needs no branching.

      EXPECTED_FILES = the three basenames harness-plan.md, github-mirror.md, SKILL.md.
      MIN_OCCURRENCES = 6, the number measured in this scope at 4b5dbb23.

      2. Helper: scope_files(root) -> sorted list of paths.
      glob(join(root, ".claude", "commands", "*.md")) plus
      glob(join(root, ".claude", "skills", "**", "*.md"), recursive=True), deduplicated and sorted.
      Nothing else is in scope (plan D-05): gh-sync.py line 116 quotes the old capitalized spelling
      as history, and everything under .harness/harness/features is an immutable record, so a wider
      sweep would redden on text that must not change.

      3. Helper: occurrences(root) -> list of (path, tool, token) tuples.
      For each scope file, read it utf-8, then COLLAPSE WHITESPACE with re.sub(r"\s+", " ", text)
      before matching. The collapse is load-bearing and not a convenience: the occurrence FEAT-41's
      migration missed sits at github-mirror.md lines 55-56 with the tool name ending one line and
      its argument beginning the next, so a line-anchored pattern is blind to exactly the case this
      file exists for.
      Pattern: re.compile(r"(gh-sync\.py status|board-station\.py) \S+ ([A-Za-z_][A-Za-z_-]*)").
      Group 1 is the tool, group 2 is the station argument - both tools take the shape TOOL FIRSTARG
      STATION. A placeholder argument like <station> cannot match, because the character class does
      not admit a leading angle bracket, so a template line is correctly ignored.

      4. Helper: offenders(root) -> list of (path, tool, token) tuples, one for every occurrence
      whose token is not in that tool's accepted set. This is the single predicate both cases below
      assert on, which is what lets the negative control run in-process.

      5. case_every_argument_is_accepted, always over REPO_ROOT and over nothing else. As SEPARATE
      check() rows so a failure names the cause, and every row is unconditional - none of them may
      be skipped, for any reason:
        a. the scope is non-empty: len(scope_files(REPO_ROOT)) > 0.
        b. len(occurrences(REPO_ROOT)) >= MIN_OCCURRENCES, detail printing the count found - an
           empty or narrowed sweep must not pass by finding nothing.
        c. every name in EXPECTED_FILES appears among the basenames of the occurrence paths, one
           check() row per expected file - the positive control that the sweep actually reaches the
           three files the defect lived in.
        d. ONE check() row named exactly
           "every station argument in the instruction scope is an accepted station"
           whose ok is offenders(REPO_ROOT) == [], and whose detail lists every offender as path,
           tool and token. The verify command greps for this exact label, so it must be spelled
           character for character.

      6. case_reddens_on_a_reintroduced_capital - the permanent negative control, in-process.

      6a. With tempfile.TemporaryDirectory() as tmp: for each of the two real files
      .claude/commands/harness-plan.md and .claude/skills/harness/references/github-mirror.md,
      os.makedirs the same relative directory under tmp and shutil.copy the file there. Assert
      offenders(tmp) == [] on the unmutated copy FIRST, as its own check() row named
      "the unmutated scratch copy reports no offender" - the anti-false-red control, which without
      it would let the ladder be green merely because any scratch root reports offenders.

      6b. Then mutate ONE occurrence in the copy of harness-plan.md by replacing the exact text
      "status <feature-dir> ready" with "status <feature-dir> Ready", asserting the text actually
      changed first - a no-op replace would make the case vacuous.

      6c. ONE check() row named exactly
      "the sweep reddens on a reintroduced capital"
      whose ok requires ALL of: offenders(tmp) is non-empty, and one of its tuples names the
      harness-plan.md copy with tool "gh-sync.py status" and token "Ready". The second half is what
      attributes the red to the capital this case reintroduced rather than to any other difference
      in the scratch root. Detail prints the offender list. Spell the label character for character;
