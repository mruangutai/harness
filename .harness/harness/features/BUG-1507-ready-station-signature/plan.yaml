  - id: T-05
    title: Add an integration witness asserting every station argument in the instruction scope names an accepted station
    traces: [REQ-05]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01, T-02]
    status: ready
    files:
