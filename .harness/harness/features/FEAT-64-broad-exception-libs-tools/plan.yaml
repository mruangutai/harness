      Work red-first and preserve every current return value, exit effect, stdout byte, stderr byte, and documented silence for natural boundary failures. Add behavioral cases before production edits for each changed contract, including one unrelated RuntimeError case that must escape each new typed-boundary contract. For hook_guard specifically, add explicit KeyboardInterrupt and SystemExit cases that must escape. Do not add assertions over exception syntax or forwarding plumbing.

      In factory_decompose.extract_brief, keep the non-blocking missing, unreadable, non-UTF-8, malformed-heading, and empty-section result while catching only OSError and UnicodeError. In factory_gh.run_gh, convert every subprocess launch OSError and artifact_accessors.ArtifactAccessError from JSON decoding into factory_gh.GhError with the existing argv, status, stdout, stderr, factory_cli rendering, and chained cause; retain the FileNotFoundError wording. In feature_schema.recovery_command_for and handoff_policy._plan_mapping, catch harness_yaml.YamlParseError from artifact_accessors.load_plan and preserve the current recovery string or parenthetical exactly.

      In gh_cost_log._read_counter, narrow to OSError, subprocess.SubprocessError, UnicodeError, and ValueError; in record, narrow to OSError, UnicodeError, TypeError, and ValueError, preserving the best-effort no-raise contract and moving its existing rationale byte-for-byte. In run_identity.record_seed, catch only temp-file, filesystem, Unicode, TypeError, and ValueError failures, keep write-once atomic replacement and finally cleanup, and let unrelated defects surface.

      In handoff_done_when, enumerate the typed read, YAML, JSON, authority-shape, and registered resolver errors at _satisfied and _resolution_problems instead of absorbing every Exception. Carry an already loaded plan authority through resolution and satisfaction so one source is not parsed and reported twice. Preserve True, False, and None semantics plus every failure message byte.

      In harness_yaml.load_str, translate yaml.YAMLError, UnicodeError, TypeError, and ValueError to YamlParseError while keeping DuplicateKeyError and MissingDependency subclasses intact; unexpected RuntimeError must propagate. Narrow require_or_die root resolution to ImportError and ValueError, and narrow require_or_bootstrap courtesy output to OSError, UnicodeError, TypeError, and ValueError. Move each existing fail-closed or courtesy-channel rationale byte-for-byte with its handler.

      In harness_boundary, narrow checkout-pointer and worktree-owner reads to OSError and UnicodeError, fleet resolution to artifact_accessors.FleetError plus its documented mapping-shape errors, and manifest grant reads to artifact_accessors.ArtifactAccessError, artifact_accessors.FleetError, and harness_yaml.YamlParseError. Replace the separate broad handlers in load_repo_module and call_repo_module with one private execution wrapper containing one except Exception that raises RepoModuleError with module name, path, original exception, exception chain, and current sys.modules restoration. Add hook_guard(main, name, fail="open") as the second broad handler: return main's successful result unchanged, catch Exception but not BaseException, and return 0 for open or 2 for closed. Reject any other fail value before calling main. Do not call hook_guard from any production file and do not freeze per-hook message wording in this feature.

      In worktree_terminal, narrow Git launches to OSError and subprocess.SubprocessError, fleet access to artifact_accessors.FleetError, landed feature reads to artifact_accessors.FeatureJsonError, landed plan reads to harness_yaml.YamlParseError while handling MissingDependency by class rather than type-name text, and mapping-shape access to KeyError, TypeError, and ValueError. Preserve all unresolved records, reason strings, dirty flags, and repository classification. The ten shared libraries finish with no broad catch except the two specified harness_boundary handlers.
