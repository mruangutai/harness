decisions:
  - id: D-01
    choice: Mint or reuse typed errors at producer boundaries before narrowing consumers, and let unrelated programming defects plus every BaseException-only process-control signal propagate.
    because: Consumer-side error reconstruction would duplicate boundary knowledge and preserve the defect-hiding behavior this feature removes.
    status: accepted
  - id: D-02
    choice: End harness_boundary.py with exactly two broad catches by routing repository-module load and call execution through one RepoModuleError wrapper and adding one unwired hook_guard that catches Exception but not BaseException.
    because: Repository execution and hook own-failure are the only designed ordinary-exception boundaries, while separate load and call catches would spend a third allowance.
    status: accepted
  - id: D-03
    choice: Treat baseline exit status, stdout bytes, and stderr bytes as immutable unless a red-first case and notes/build-divergences.md record the exact old bytes, new bytes, and operator ruling.
    because: The sweep is intended to expose unrelated defects without changing established command or silence contracts.
    status: accepted
  - id: D-04
    choice: Ratchet only FEAT-64 library and tool ceilings to their shipped counts, leaving every hook ceiling unchanged for FEAT-65.
    because: A repository-wide zero target now would make this feature depend on explicitly excluded hook work.
    status: accepted
