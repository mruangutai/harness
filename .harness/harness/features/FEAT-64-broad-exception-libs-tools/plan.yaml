      In board-station.main, catch only gh_board.BoardError and factory_gh.GhError around the station write, preserving the current error line and exit 0. In check-omp-port, narrow runtime-pin reads to OSError, UnicodeError, json.JSONDecodeError, and ValueError; narrow OMP config, agent frontmatter, and provider overlay reads to artifact_accessors.ArtifactAccessError plus OSError and UnicodeError where Path.read_text remains local. Preserve error ordering and text.

