      python3 tests/unit/test-factory-gh.py && python3 tests/unit/test-handoff-done-when.py && python3 tests/integration/test-merge-settings.py && python3 tests/integration/test-sync-agent-adapters.py && python3 tests/integration/test-worktree-terminal.py && python3 tests/integration/test-gh-sync-record.py && python3 tests/integration/test-board-lifecycle.py
    intent: |
      Use T-01's checked-in classification as the complete input. Before editing, confirm every live row assigned here has a current source file, a listed target, a canonical remedy, a targeted test, and a team route. If any live row is new, unclassified, absent from files, or cannot be covered by the named tests, stop and require an explicit plan amendment rather than absorbing drift. Do not edit tests/integration/test-check-plan-routes.py or its classification machinery in this team task; T-05 owns the main-session-direct postcondition check for T-03.

