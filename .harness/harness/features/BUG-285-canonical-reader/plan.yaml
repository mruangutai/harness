    intent: |
      Add an AST-based canonical-reader audit to check-plan-routes.py, discriminating integration coverage to test-check-plan-routes.py, and a deterministic checked-in hand-classification artifact at tests/integration/canonical-reader-classification.json. Scan every .py file directly under .claude/skills/harness/bin, parse each with ast.parse, and inspect genuine Call nodes only so comments and docstrings are invisible. Recognize raw json.load and json.loads, PyYAML parse calls, harness_yaml low-level load_file and load_str calls, aliases established by imports, the already-landed feature_json_write.load_feature_json route, and the current parse shapes found by the AST rather than a copied name list. The artifact must contain exactly one row for every current call, keyed by file and enclosing symbol and recording call category, artifact or payload kind, semantic or mechanical disposition, canonical accessor remedy or syntactically proven exemption, assigned task T-03 through T-07 when migration is required, and the targeted test that proves that row. Include explicit rows for low-level primitives, in-memory validated payloads, canonical locked writer transforms, the sole state.yaml reader, the deferred manifest_domains route, and every dispatchable and DEC-174 site, so an exemption is visible rather than absent from the work list. Sort deterministically and make the integration test compare the artifact's complete file-and-symbol set with the live AST result before any migration. Add a test-only classification-task T-NN mode that uses the production scanner and this artifact to fail until every row assigned to that task has reached its declared postcondition; it must fail with PLAN AMENDMENT REQUIRED if the live scan contains a new or unmatched site, an artifact row lacks an owning task or targeted test, or a task assignment is not present in that task's plan files. No migration task may edit such a site until plan.yaml is explicitly amended and returned for approval. Encode only syntactically provable exemptions: parsing inside artifact_accessors or harness_yaml low-level implementation, input whose classification records why parser choice is itself validation rather than artifact access, bytes already inside a canonical locked writer transform, the current sole state.yaml reader, and manifest_domains while all live callers remain excluded shell hooks pending issue 1674. Do not scan .sh and print that boundary with issue 1674. Each finding must name file, enclosing symbol, parse category, and an exact use-accessor remedy. Add fixture cases for calls, aliases, prose, callbacks, malformed Python, a second state.yaml reader, a newly discovered unclassified site, an assignment missing from task files, and a detector-blind control. The normal integration suite must demonstrate the scanner reports a seeded raw-call fixture and ignores an equivalent prose fixture, and the live classification capture made before migration must be non-empty. Do not add expect-findings or any other durable production CLI mode whose only purpose is accepting the one-time non-empty baseline; the final live zero assertion belongs to T-07.

