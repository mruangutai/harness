      For the classified factory_config.py::product_config::json_string#1 row, the concrete remedy is the existing public load_harness_json invoked with its explicit keyword-only in-memory text source. Do not exempt or reassign this row and do not add a second public accessor.

      Preserve every caller's absent-file, malformed-input, non-mapping, diagnostic, exit-code, mutation, and fallback contract except where SC-03 deliberately makes corruption loud. Update existing consumer tests to exercise the public accessor seam and add assertions only for changed observable behavior. Do not relocate other already-correct load_plan, load_fleet, or manifest_domains calls reserved for the separate T-04 and T-07 mechanical review units.

      For harness_boundary.run_dir_grant_globs, call the existing public manifest_domains(path, agent=None) mode, combine the returned all-role and shared write-domain glob tuples, and filter the combined values to run-directory grant globs. Preserve the function's established fail-open behavior on manifest-access failure. Do not add a second accessor, raw parser, exemption, hard-coded role list, or unrelated scope. Board-lifecycle fixture repairs discovered during T-03 remain T-03 implementation work and require no separate task or scope change; do not move them elsewhere.

