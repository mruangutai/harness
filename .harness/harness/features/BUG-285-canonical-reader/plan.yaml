decisions:
  - id: D-01
    choice: Consolidate every in-scope artifact reader in one dependency-light artifact_accessors.py module above harness_yaml.py.
    because: One module makes reader discovery deterministic without pulling heavy dependencies into hook paths.
    dec: none
  - id: D-02
    choice: Build the AST checker first, hand-classify every current result, and let its live output define migration work instead of a frozen count.
    because: Prior text scans and copied counts missed code, matched prose, and could not see the former shell entrypoints before PR 1688.
    dec: none
  - id: D-03
    choice: Classify every AST-visible parse by semantic category and permit only explicit low-level primitive, validated-payload, canonical-writer-transform, module-internal, and sole-state-reader exemptions.
    because: Treating every parse call as identical would either migrate sanctioned implementation internals or leave unbounded exceptions.
    dec: none
  - id: D-04
    choice: Land and review semantic parser bypass cutovers separately from mechanical relocation of already-correct accessors.
    because: Relocation noise can conceal the parser and error-contract changes that carry the risk.
    dec: none
