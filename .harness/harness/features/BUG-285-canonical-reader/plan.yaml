  - id: T-01
    title: Build and baseline the AST reader inventory
    traces: [SC-01, SC-05]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: The inventory is implemented in check-plan-routes.py and its integration test, both inside the DEC-174 enforcement carve-out.
    depends_on: [T-09]
    status: ready
    files:
      - .claude/skills/harness/bin/check-plan-routes.py#main
      - tests/integration/test-check-plan-routes.py#case_20
      - tests/integration/canonical-reader-classification.json
    verify: |
      python3 tests/integration/test-check-plan-routes.py --canonical-reader-self-test
    intent: |
      Add the canonical-reader inventory to check-plan-routes.py, discriminating integration coverage to test-check-plan-routes.py, and a deterministic checked-in hand-classification at tests/integration/canonical-reader-classification.json. Recursively parse every Python source under .claude/skills/harness/bin with ast.parse and inspect genuine Call nodes only. Resolve direct and aliased calls to stdlib JSON loaders, PyYAML loaders, harness_yaml load_file and load_str, existing load_plan, load_fleet, manifest_domains, load_feature_json, and the canonical writer callbacks that contain parsing. String constants containing helper programs, comments, and docstrings are not AST calls and must not be inventoried as executable sites.

      Emit one row for every live candidate, keyed by file and enclosing class or function symbol, with parse category, artifact or payload, disposition, canonical remedy, assigned task, DEC-174 category and execution route, and a concise exemption reason where applicable. The inventory must cover all current Python entrypoints, including the PR 1688 conversions; parse-bearing bash-write-guard.py, branch-create-gate.py, check-domain.py, check-state.py, dispatch-guard.py, inject-expertise.py, gh-close-gate.py, merge-gate.py, plan-sign-gate.py, and post-merge-sweep.py must appear with main-session-direct routes. Converted files with no candidate call must be proven covered by the scanned-file manifest rather than added as fake parse rows.

      The only legal exemption classes are harness_yaml low-level primitives, in-memory validation of an already supplied document, parsing inside a canonical locked writer transform, a documented module-internal format such as the claims registry, test or migration corpus data, and the current sole state.yaml reader. Every other current candidate must name one canonical accessor and T-02 through T-07. Refuse a missing or duplicate classification row, a live AST row absent from the artifact, an artifact row absent from the AST, a task assignment whose files list omits its source, or an execution route inconsistent with DEC-174. Diagnostics must name file, enclosing symbol, category, remedy, and PLAN AMENDMENT REQUIRED for new or unmatched sites.

      Add detector mutants for aliases, nested calls, docstrings, comments, string-contained helper programs, canonical writer callbacks, every exemption class, and a synthetic second state.yaml reader. The self-test must prove the pre-migration live tree has unresolved rows and exits non-zero for the audit while the detector and hand-classification consistency checks pass; it must not ship a one-shot expected-count CLI mode. Preserve every pre-existing check-plan-routes result outside separately named canonical-reader cases.

