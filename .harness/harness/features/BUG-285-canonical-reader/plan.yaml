decisions:
  - id: D-01
    choice: Consolidate all artifact readers in one dependency-light artifact_accessors.py module above harness_yaml.py.
    because: Option B gives maintainers one place to find a reader without adding heavy hook-path imports.
    dec: none
  - id: D-02
    choice: Build an AST checker first, hand-classify every current result once, and let its live output define the migration instead of a frozen count.
    because: Earlier text scans and site counts missed real calls and matched prose.
    dec: none
  - id: D-03
    choice: Limit raw-parse enforcement and migration to Python files until issue 1674 makes shell-embedded Python AST-readable.
    because: Token scans and maintained heredoc extraction were rejected as brittle technical debt.
    dec: none
  - id: D-04
    choice: Land and review semantic parser bypass cutovers separately from mechanical relocation of already-correct accessors.
    because: Relocation noise can conceal the parser and error-contract changes that carry the risk.
    dec: none
