      python3 tests/unit/test-feature-json-reader.py && python3 tests/integration/test-gh-sync-open.py && python3 tests/integration/test-factory-decompose.py && python3 tests/integration/test-harness-yaml.py && python3 tests/unit/test-factory-config.py && python3 tests/integration/test-sync-agent-adapters.py
    intent: |
      Create .claude/skills/harness/bin/artifact_accessors.py as the dependency-light artifact layer above harness_yaml.py. It must import no network or subprocess modules and expose ArtifactReadError plus load_feature_json, load_harness_json, load_plan, load_fleet, load_frontmatter, load_omp_config, read_hook_payload, parse_gh_json, and write_harness_json. Move the already-landed FeatureJsonError, load_feature_json, and opt_int implementation out of feature_json_write.py into artifact_accessors.py rather than rebuilding a second reader. In the same task repoint gh-sync.py load_recorded and factory_decompose.py load_factory, update the central test imports, and leave no compatibility alias or reader re-export in feature_json_write.py; that module continues to own only the canonical write_feature_json route and its writer internals. Preserve FeatureJsonError's name, message shape, next_step attribute, absent-file return, legacy numeric-string coercion, and both consumers' current exit and diagnostic behavior except for the issue 1682 fail-open closed below.

      Relocate load_plan and load_fleet implementation ownership to artifact_accessors.py while retaining temporary dependency-light forwarding at harness_yaml.load_plan and factory_config.load_fleet so the already-correct caller migration remains a separate mechanical T-04 diff. T-04 must remove those Python compatibility forwarders after every live Python caller is repointed. Do not move manifest_domains: leave its definition and public contract in harness_yaml.py because every live caller is embedded in an excluded .sh hook and physical relocation is deferred to issue 1674.

      The module contract docstring must give concise maintainer guidance naming each canonical reader and the sanctioned writer or source routes, including write_feature_json, write_harness_json, plan-merge.py verbs, sync-agent-adapters.py, main-session-owned files, the sole state.yaml reader trip-wire, and the deferred manifest_domains exception. Do not export a route-table mapping, expose prose as runtime data, duplicate the documentation into tests, or assert docstring wording. Tests must behaviorally exercise each public reader and writer route, while T-01 classification and AST checks prove coverage of the live parse surface.

      JSON file and in-memory accessors must open or decode inside their error boundary, reject duplicate keys with object_pairs_hook, and pass parse_constant to reject NaN, Infinity, and -Infinity as invalid JSON. Preserve load_plan schema validation and load_fleet validation without copying harness_yaml's duplicate-key or timestamp-resolver logic. Frontmatter owns delimiter extraction plus strict YAML parsing once; OMP config reads .yml or .yaml through that primitive. Hook and GitHub-output readers parse in-memory text without opening files and preserve caller-visible context in errors. write_harness_json must preserve upgrade-config.py's complete rendering, backup, same-directory temporary file, flush or fsync, and atomic os.replace behavior.

      Close issue 1682 at the feature.json boundary and through both real consumers. A missing github or factory block remains a legitimate absent state. When either block is present, validate the parent and issues fields needed to decide whether GitHub objects already exist: preserve the documented legacy numeric-string coercion, but refuse a present value whose type or contents cannot produce the recorded parent or issue number, and refuse a present issues value that is not a mapping. Neither load_recorded nor load_factory may turn those wrong-typed present fields into the same empty parent or issues result as absence. Add real-consumer regression cases proving gh-sync open and factory decompose refuse before any parent or task issue creation on those corrupt records, with zero mutating GitHub calls.

      Preserve and extend the already-landed central coverage in tests/unit/test-feature-json-reader.py, including the comment-bearing document that closed issue 285 on current main. Do not claim a new fail-first for those landed cases. Write genuinely new issue 1682 cases first and observe them fail before implementation: NaN, Infinity, and -Infinity at the JSON boundary, wrong-typed nested parent and issues fields through load_recorded and load_factory, and the duplicate-parent or duplicate-task-issue prevention scenarios. Then require the complete named verify command to pass.

