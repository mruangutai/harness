    intent: |
      Create .claude/skills/harness/bin/artifact_accessors.py as the one dependency-light artifact layer above harness_yaml.py. It must import no network or subprocess modules and expose ArtifactReadError plus load_feature_json, load_harness_json, load_plan, load_fleet, manifest_domains, load_frontmatter, load_omp_config, read_hook_payload, parse_gh_json, write_harness_json, and the existing write_feature_json route. Its module contract docstring is the authoritative operator and maintainer table: for every accessor and sanctioned non-accessor route, state the artifact or payload, read, write, or source direction, owning public function or external verb, parser or serializer owner, typed failure boundary, canonical writer, and migration or exemption category. The table must include plan-merge.py verbs, sync-agent-adapters.py, main-session-owned files, canonical writer callbacks, and the sole state.yaml reader trip-wire. Do not export a table mapping or treat prose as runtime API. Tests must import and exercise every public route through artifact_accessors, prove each function's observable parsing, writing, and error contract, and use T-01's classification plus AST integration checks to prove exhaustive route ownership; they must not assert docstring wording or mirror its rows as a second prose table. Preserve load_plan schema validation, manifest domain traversal, fleet validation and existing public constants while moving their implementation toward the one module; do not duplicate harness_yaml duplicate-key or timestamp-resolver logic. JSON file readers must open with UTF-8 inside the try, reject duplicate keys with object_pairs_hook, require the documented mapping shape where the current accessor does, and convert OSError, UnicodeDecodeError, JSON decode, duplicate-key, and shape failures to the accessor's documented single catch type. Frontmatter owns delimiter extraction plus strict YAML parsing once; OMP config reads .yml or .yaml through the strict YAML primitive. Hook and GitHub-output accessors parse in-memory text without opening files and preserve caller-visible context in errors. write_harness_json must preserve upgrade-config.py's complete JSON rendering, backup, same-directory temporary file, flush or fsync, and atomic os.replace behavior. Reuse write_feature_json rather than copying its lock or schema logic. Extend the existing central YAML, fleet, and adapter tests with fail-first cases for every accessor, especially valid controls, duplicate keys, unreadable files, non-UTF-8 bytes, malformed and non-mapping inputs, read-inside-error-boundary behavior, frontmatter delimiter disagreement, and issue 285's comment-bearing feature.json that YAML accepts and JSON must reject. Each negative family needs a positive control and an observed pre-implementation failure.

