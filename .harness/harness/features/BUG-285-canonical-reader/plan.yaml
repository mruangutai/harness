    verify: |
      python3 tests/unit/test-artifact-accessors.py && python3 tests/unit/test-feature-json-reader.py && python3 tests/integration/test-gh-sync-open.py && python3 tests/integration/test-factory-decompose.py && python3 tests/integration/test-harness-yaml.py && python3 tests/unit/test-factory-config.py && python3 tests/integration/test-sync-agent-adapters.py && python3 tests/integration/test-upgrade-config.py
    intent: |
      Create artifact_accessors.py as the single dependency-light public artifact layer above harness_yaml.py. It must have no eager network or subprocess imports and must expose load_feature_json, load_harness_json, load_plan, load_fleet, manifest_domains, load_frontmatter, load_omp_config, read_hook_payload, parse_gh_json, and write_harness_json. During T-02 through T-06, load_feature_json, load_plan, load_fleet, and manifest_domains must delegate inward to their existing implementations in feature_json_write.py, harness_yaml.py, and factory_config.py. Do not move those bodies yet and do not add legacy-module forwarders, re-exports, or a second public import path. T-07 performs the one physical relocation after every caller has been repointed. Harden the existing feature reader in feature_json_write.py now so artifact_accessors exposes the final behavior through delegation; feature_json_write.py remains the canonical locked writer until T-07 moves only its reader implementation.

      File JSON readers must read bytes and decode UTF-8 inside the documented error boundary, reject duplicate keys at every nesting level, and reject NaN, Infinity, and -Infinity through parse_constant. YAML readers must delegate to harness_yaml so duplicate-key rejection and the timestamp-resolver behavior are not copied. load_plan must still run validate_plan_doc and load_fleet must retain every existing fleet validation and diagnostic. load_frontmatter owns delimiter extraction and strict YAML parsing once; load_omp_config accepts .yml and .yaml through the same primitive. read_hook_payload and parse_gh_json parse in-memory text without opening files and preserve caller context in their typed failures. write_harness_json must preserve upgrade-config.py rendering, backup, same-directory temporary file, flush or fsync, and atomic os.replace behavior.

      Close issue 1682 at the feature.json boundary and through both real consumers. Missing github or factory blocks remain legitimate absence. When present, validate the parent and issues fields used to decide whether GitHub objects exist: retain legacy numeric-string coercion, reject booleans and values that cannot produce a recorded issue number, and reject a present issues value that is not a mapping. Neither gh-sync.py load_recorded nor factory_decompose.py load_factory may collapse a wrong-typed present parent or issues value into absence. Add consumer regressions proving refusal occurs before parent or task issue creation. Preserve the existing issue 285 comment-bearing JSON fixture; add the new NaN, Infinity, -Infinity, wrong-typed parent, wrong-typed issues, and duplicate-creation cases test-first and record their failing state before implementation.

      The module docstring must name each public reader and the sanctioned write or source route: write_feature_json, write_harness_json, plan-merge.py verbs, sync-agent-adapters.py, main-session-owned files, and the sole state.yaml reader trip-wire. Do not expose a route-table mapping or test prose. Make the T-01 classification recognize the four inward delegations as canonical accessor implementations while leaving caller migration rows unresolved for later tasks.

