  - id: T-01
    title: Build and baseline the AST reader inventory
    traces: [SC-01, SC-05]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: The inventory is implemented in check-plan-routes.py and its integration test, both inside the DEC-174 enforcement carve-out.
    depends_on: [T-09]
    status: done
    files:
      - .claude/skills/harness/bin/check-plan-routes.py#main
      - tests/integration/test-check-plan-routes.py#case_20
      - tests/integration/canonical-reader-classification.json
    verify: |
      python3 tests/integration/test-check-plan-routes.py --canonical-reader-self-test
    intent: |
      Add the canonical-reader inventory to check-plan-routes.py, discriminating integration coverage to test-check-plan-routes.py, and a deterministic checked-in hand-classification at tests/integration/canonical-reader-classification.json. Recursively parse every Python source under .claude/skills/harness/bin with ast.parse and inspect genuine Call nodes only. Resolve direct and aliased calls to stdlib JSON loaders, PyYAML loaders, harness_yaml load_file and load_str, existing load_plan, load_fleet, manifest_domains, load_feature_json, and the canonical writer callbacks that contain parsing. String constants containing helper programs, comments, and docstrings are not AST calls and must not be inventoried as executable sites.

      Emit one row for every live candidate, keyed by file and enclosing class or function symbol, with parse category, artifact or payload, disposition, canonical remedy, assigned task, DEC-174 category and execution route, and a concise exemption reason where applicable. The inventory must cover all current Python entrypoints, including the PR 1688 conversions; parse-bearing bash-write-guard.py, branch-create-gate.py, check-domain.py, check-state.py, dispatch-guard.py, inject-expertise.py, gh-close-gate.py, merge-gate.py, plan-sign-gate.py, and post-merge-sweep.py must appear with main-session-direct routes. Converted files with no candidate call must be proven covered by the scanned-file manifest rather than added as fake parse rows.

      The only legal exemption classes are harness_yaml low-level primitives, in-memory validation of an already supplied document, parsing inside a canonical locked writer transform, a documented module-internal format such as the claims registry, test or migration corpus data, and the current sole state.yaml reader. Every other current candidate must name one canonical accessor and T-02 through T-07. Refuse a missing or duplicate classification row, a live AST row absent from the artifact, an artifact row absent from the AST, a task assignment whose files list omits its source, or an execution route inconsistent with DEC-174. Diagnostics must name file, enclosing symbol, category, remedy, and PLAN AMENDMENT REQUIRED for new or unmatched sites.

      Add detector mutants for aliases, nested calls, docstrings, comments, string-contained helper programs, canonical writer callbacks, every exemption class, and a synthetic second state.yaml reader. The self-test must prove the pre-migration live tree has unresolved rows and exits non-zero for the audit while the detector and hand-classification consistency checks pass; it must not ship a one-shot expected-count CLI mode. Preserve every pre-existing check-plan-routes result outside separately named canonical-reader cases.

  - id: T-02
    title: Establish and harden the artifact accessor layer
    traces: [SC-02, SC-03, SC-07]
    change_type: cross_module
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/artifact_accessors.py
      - .claude/skills/harness/bin/feature_json_write.py#load_feature_json
      - .claude/skills/harness/bin/gh-sync.py#load_recorded
      - .claude/skills/harness/bin/factory_decompose.py#load_factory
      - .claude/skills/harness/bin/upgrade-config.py#load_json
      - tests/unit/test-artifact-accessors.py
      - tests/unit/test-feature-json-reader.py#LoadFeatureJsonTest
      - tests/integration/test-gh-sync-open.py#main
      - tests/integration/test-factory-decompose.py
      - tests/integration/test-harness-yaml.py
      - tests/unit/test-factory-config.py
      - tests/integration/test-sync-agent-adapters.py#main
      - tests/integration/test-upgrade-config.py
    verify: |
      python3 tests/unit/test-artifact-accessors.py && python3 tests/unit/test-feature-json-reader.py && python3 tests/integration/test-gh-sync-open.py && python3 tests/integration/test-factory-decompose.py && python3 tests/integration/test-harness-yaml.py && python3 tests/unit/test-factory-config.py && python3 tests/integration/test-sync-agent-adapters.py && python3 tests/integration/test-upgrade-config.py
    intent: |
      Create artifact_accessors.py as the single dependency-light public artifact layer above harness_yaml.py. It must have no eager network or subprocess imports and must expose load_feature_json, load_harness_json, load_plan, load_fleet, manifest_domains, load_frontmatter, load_omp_config, read_hook_payload, parse_gh_json, and write_harness_json. During T-02 through T-06, load_feature_json, load_plan, load_fleet, and manifest_domains must delegate inward to their existing implementations in feature_json_write.py, harness_yaml.py, and factory_config.py. Do not move those bodies yet and do not add legacy-module forwarders, re-exports, or a second public import path. T-07 performs the one physical relocation after every caller has been repointed. Harden the existing feature reader in feature_json_write.py now so artifact_accessors exposes the final behavior through delegation; feature_json_write.py remains the canonical locked writer until T-07 moves only its reader implementation.

      The existing single public load_harness_json must accept either a filesystem path or an explicit keyword-only in-memory text source; path and text are mutually exclusive. Both source modes must run through the identical strict JSON parser and documented typed-error contract: reject duplicate keys at every nesting level and NaN, Infinity, and -Infinity, require a mapping result, and preserve caller context. Do not add a second public accessor. Add focused test-first coverage in test-artifact-accessors.py for both source modes, mutual exclusion, strictness, mapping enforcement, caller context, and the typed error, plus test-factory-config.py coverage that product_config can consume remote harness.json text through that same accessor; T-03 owns repointing the production consumer.

      The existing public parse_gh_json(text, context) must return any valid strict JSON value, including a mapping, list, or scalar, rather than enforcing one top-level shape. It must reject duplicate keys at every nesting level and NaN, Infinity, and -Infinity, preserve the supplied caller context, and raise the existing typed accessor error for parse failures. Each GitHub consumer owns and retains validation of the mapping, list, scalar, entry, or field shape its operation requires. Add focused test-first coverage in test-artifact-accessors.py for mapping, list, and scalar results, nested duplicate keys, all three rejected non-finite constants, caller context, and the existing typed error.

      The existing single public load_feature_json must accept either a filesystem path or an explicit keyword-only text source, with the two modes mutually exclusive. Both modes must use the same strict JSON parser, require a feature mapping, run the same feature field validation, preserve caller context, and raise the same existing typed errors. Add focused test-first coverage in test-feature-json-reader.py for path and text modes, mutual exclusion, duplicate keys at every nesting level, NaN, Infinity, and -Infinity, mapping and feature-field validation, caller context, and typed failures. Do not add any public accessor, exemption, caller-local wrapper or adapter, compatibility alias, temporary-file bridge, or reader temporary file for either generalized contract.

      File JSON readers must read bytes and decode UTF-8 inside the documented error boundary, reject duplicate keys at every nesting level, and reject NaN, Infinity, and -Infinity through parse_constant. YAML readers must delegate to harness_yaml so duplicate-key rejection and the timestamp-resolver behavior are not copied. load_plan must still run validate_plan_doc and load_fleet must retain every existing fleet validation and diagnostic. load_frontmatter owns delimiter extraction and strict YAML parsing once; load_omp_config accepts .yml and .yaml through the same primitive. read_hook_payload and parse_gh_json parse in-memory text without opening files and preserve caller context in their typed failures. write_harness_json must preserve upgrade-config.py rendering, backup, same-directory temporary file, flush or fsync, and atomic os.replace behavior.

      Close issue 1682 at the feature.json boundary and through both real consumers. Missing github or factory blocks remain legitimate absence. When present, validate the parent and issues fields used to decide whether GitHub objects exist: retain legacy numeric-string coercion, reject booleans and values that cannot produce a recorded issue number, and reject a present issues value that is not a mapping. Neither gh-sync.py load_recorded nor factory_decompose.py load_factory may collapse a wrong-typed present parent or issues value into absence. Add consumer regressions proving refusal occurs before parent or task issue creation. Preserve the existing issue 285 comment-bearing JSON fixture; add the new NaN, Infinity, -Infinity, wrong-typed parent, wrong-typed issues, and duplicate-creation cases test-first and record their failing state before implementation.

      The module docstring must name each public reader and the sanctioned write or source route: write_feature_json, write_harness_json, plan-merge.py verbs, sync-agent-adapters.py, main-session-owned files, and the sole state.yaml reader trip-wire. Do not expose a route-table mapping or test prose. Make the T-01 classification recognize the four inward delegations as canonical accessor implementations while leaving caller migration rows unresolved for later tasks.

      Generalize the existing public manifest_domains to the runtime signature manifest_domains(path, agent=None, *, view=False). With view=False, preserve the omitted-agent and explicit None aggregation contracts and the explicit-agent two-list contract byte-for-byte, including mutable list return types, ordering, and current error behavior. The omitted or None mode must still return in the first list all non-read write-domain globs aggregated dynamically from every named role in the manifest and the shared write-domain globs in the second list; do not hard-code a role list. Explicit-agent callers and behavior remain unchanged.

      With view=True and agent None, the same public manifest_domains function returns immutable dependency-light records exactly shaped as ManifestRoleDomains(name: str, write_globs: tuple[str, ...]) and ManifestDomainsView(roles: tuple[ManifestRoleDomains, ...], shared_write_globs: tuple[str, ...], main_session_present: bool, main_session_writes: tuple[str, ...] | None). Preserve first-seen role order in roles, emit one record per role name, aggregate duplicate same-name nodes exactly like the existing explicit-agent walk, coerce paths with str(), exclude read-only entries, and keep shared write globs separate. Preserve nested member, lead, and top-level role names with their owner globs.

      main_session_present distinguishes an absent main_session key. main_session_writes preserves original nonblank strings and their order; it is None when writes is absent, is not a list, or is an empty list, and it may be () when a nonempty list contains no valid nonblank strings. The view must perform one strict harness_yaml.load_file read and propagate DuplicateKeyError and YamlParseError unchanged for duplicate, malformed, unreadable or non-UTF-8, and non-mapping manifests; do not wrap these failures in ArtifactAccessError. Passing a non-None agent with view=True raises a documented TypeError.

      Add focused test-first unit coverage in the already-owned tests/unit/test-artifact-accessors.py that pins unchanged omitted and explicit None aggregation and explicit-agent results; nested member, lead, and top-level role names with owner globs; duplicate same-name aggregation; read-only exclusion and shared separation; every main_session presence and writes state above, including ordered unmodified fragment strings; and unchanged DuplicateKeyError and YamlParseError types for duplicate, malformed, unreadable or non-UTF-8, and non-mapping manifests. Do not add a second accessor, expose a raw manifest mapping, add exemptions, callbacks, query enums, a general manifest model, or policy or approval-fragment grammar in the accessor. Do not change unrelated scope.

