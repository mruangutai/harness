         read" wording and the trailing "\n  {e}". This placement is DECIDED (D-10): the decode
         failure comes out of f.read(), inside this try, so "could not be read" is the truthful
         message for it, and a separate third arm would emit an identical message with no
         observable difference. Do not add an arm, do not reword the message, do not use {e!r} -
         the refusal must not contain an exception class name, and str() of a UnicodeDecodeError
         does not while repr() does.

      2. Line 567 becomes, exactly:

             except ValueError as e:

         DELETE the dead UnicodeDecodeError member. KEEP ValueError - json.JSONDecodeError
         subclasses it (measured) and that arm is live, and it is also what refuses a zero-byte
         feature.json, which the comment at 568-571 records as the exact defect this reader exists
         to prevent. Dropping ValueError, or narrowing it to json.JSONDecodeError, is a
         REGRESSION and will be sent back. The message at 572-574 and the comment at 568-571 are
         UNCHANGED.

