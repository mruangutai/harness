      factory_decompose.py's reader", and that claim is FALSE today: measured over 13 input classes
      fed as identical bytes to both readers at 6cb113f4, NINE disagree
      (notes/research-BUG-285-parity-survey.md). D-06 decides it is CORRECTED here, not confirmed and
