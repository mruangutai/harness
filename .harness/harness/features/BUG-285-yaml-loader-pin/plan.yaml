      tests/unit/test-feature-json-readers.py, plus its own note under this feature's notes/ directory.
      It only RUNS tests/integration/test-gh-sync-open.py and tests/integration/test-gh-sync-record.py
      (the two gh-sync pole files with a measured baseline, which together carry the standing
      behavioural pin on load_recorded) and the unit runner. In particular DO NOT touch
      tests/integration/test-gh-sync-open.py - T-01 EDITS that file - and do not touch
      tests/integration/gh_sync_support.py, which all five pole files share. A new file is what keeps
      you out of T-01's way, and your depends_on chain (T-02, T-04, and T-04 depends on T-01) means
      T-01's edit is already in the tree by the time your verify runs it (D-13). You DO depend on T-02
      and T-04, whose runtime edits this file asserts, so both must be in the tree before you start -
      if load_factory still calls harness_yaml.load_file, or still returns the empty record for a
      document that parses to a non-mapping, or still admits only real ints for its parent member, or
      load_recorded's read guard still says except OSError alone, STOP and report it rather than
      writing round it.

      WHAT THIS PINS, and why it is not two per-reader tests. BUG-285 exists because two readers of
      feature.json disagree. Two independent per-reader assertions cannot catch them drifting apart
      again; only a comparison on ONE SHARED INPUT SET can. The set SPANS the measured table in BOTH
      DIRECTIONS on purpose (D-14, D-16): it carries inputs where load_recorded refused and load_factory
      did not, the input where load_factory refused and load_recorded did not, AND the inputs where both
      ACCEPTED but read a DIFFERENT VALUE. Measured at 6cb113f4, before T-02 and T-04, SEVEN of the
      twelve inputs below disagree - six on the verdict and one on the value read - so this file is red
      on the pre-change tree by construction, which is its able-to-fail evidence (D-09). No mutation
      probe is wanted here; do not write one.

      THIS FILE IS ALSO THE DRIFT DETECTOR FOR A DELIBERATE DUPLICATE, and that is why check group E
      below exists. T-02 reimplements gh-sync's _opt_int inside load_factory rather than importing it,
      because gh-sync.py is hyphen-named and cannot be imported (D-16). A second copy of a coercion rule
      is the exact defect class BUG-285 exists to close, so it is acceptable ONLY because this file
      feeds the SAME bytes to BOTH readers and asserts the VALUES they read are EQUAL - a change to
