  - id: D-08
    choice: >-
      SUPERSEDED by D-14 on 2026-09-11, and kept as the cycle-4 record rather than deleted. AS RECORDED THEN: the shared input set that pins reader parity is SIX inputs, and TWO divergence classes are EXCLUDED from it and recorded as surviving divergences, DISCLOSED and not closed - class A, a document that parses to a non-mapping; class B, a document that parses to a mapping whose own block key is present but is not a mapping. WHAT IS LIVE NOW, RE-STATED 2026-09-11 after D-16, because the previous WHAT IS LIVE NOW clause is itself now false and is quoted here rather than deleted - it said "the parity set SPANS the measured table at ten inputs, and the one surviving divergence is a block mapping with wrong-typed members", and both halves of that went false the moment D-16 closed that row. What is live: both classes A and B are CLOSED by T-02 under the operator's 2026-09-11 ruling that absence and corruption must be distinguishable; the parity set SPANS the measured table at TWELVE inputs; and NO measured divergence survives the feature, the wrong-typed-members row being closed too, by ALIGNING load_factory onto _opt_int's tolerance rather than by refusing (D-16). Three DELIBERATE contract differences remain and are recorded with their reasons in D-06, BRIEF Risk and SC-15. Read D-14 and then D-16, not this entry, for current behaviour.
    because: >-
      HISTORY, superseded by D-14. Everything below was measured at 6cb113f4 and was true when written at
      cycle 4; the one clause that is no longer live is marked. Both classes measured at that sha, and
      both anchors pinned at it. CLASS A, a document that parses to a NON-MAPPING - on the text "[1, 2]"
      gh-sync's load_recorded refuses via SystemExit at gh-sync.py:578 while factory_decompose's
      load_factory returned the empty factory at the isinstance guard at factory_decompose.py:124-125.
      NO LONGER LIVE: the clause "T-02 item 5 keeps that guard deliberately" - the amended T-02 makes that
      guard REFUSE (D-14). CLASS B, the reader's OWN BLOCK KEY present but not a mapping - on the text
      {"github": "x", "factory": "x"} load_recorded refuses at gh-sync.py:588-594 while load_factory did
      f = doc.get("factory"), found a non-dict and returned the empty factory at
      factory_decompose.py:127-128, reading the file as "nothing recorded" - the fail-open shape this bug
      exists to remove, one level down from class A and the same shape. Class B was found by the cycle-4
      goal-check (notes/research-BUG-285-goalcheck-plan-c4.md) after the earlier record named class A
      alone.
      WHY BOTH WERE EXCLUDED THEN, and why that reasoning no longer holds. The exclusion rested on one
      premise: closing either class would change approved T-02 behaviour and widen this feature's scope
      past the operator's ruling, so the choice to close class B remained the operator's to take at
      signature rather than this plan's to foreclose. The operator took it on 2026-09-11 - absence and
      corruption must be distinguishable - so the premise is spent and the exclusion with it. That is a
      supersession by ruling plus measurement, not a reversal of a wrong call: the cycle-4 position was
      the correct one to hold while the ruling was outstanding.
    dec: none
  - id: D-09
    choice: >-
      T-05 gets NO mutation probe. Its able-to-fail evidence is the measured pre-change
      disagreement table, recorded in notes/research-BUG-285-foldq7.md, plus T-04's inline
      red-then-green probe.
    because: >-
      The plan panel raised two info findings against doubled mutation-probe ceremony
      (PF-2242299b369215b13ad577fe4279d52e, PF-cceab610738069ec6ea1a56ddc058195), both naming the
      note-delivery chain as the likeliest source of a false not_met. A third probe would triple that
      exposure to prove something already observed - the parity assertions are red on the pre-change tree
