      measured table including both coercion rows (D-16; the figure was six of ten before that widening,
      and four of seven before the D-14 widening). So the pre-change tree IS the mutant and no copy needs
      constructing. RE-DERIVED 2026-09-11, not carried forward: the six verdict disagreements are the
      empty file, the YAML-only block mapping, the non-UTF-8 bytes, the non-mapping document, the
      non-mapping own block key and the duplicate block key; the seventh is the VALUE disagreement on the
      quoted-int member row, measured live as load_recorded parent 7 against load_factory parent None. The
      twelfth input, the bool-valued member, AGREES before the change and is a control rather than
      able-to-fail evidence - it reddens only if the coercion is reimplemented without _opt_int's bool
      exclusion. T-04 still carries a red-then-green probe because its own runtime edit has no other
      able-to-fail evidence.
    dec: none
  - id: D-10
    choice: >-
      The decode failure joins the READ guard as except (OSError, UnicodeDecodeError), rather than
      becoming a third separate arm, and the parse guard becomes a bare except ValueError.
    because: >-
      The decode failure is raised by f.read() inside the read try, not by the parse, so the read
      guard's existing message - "could not be read, so what is already mirrored cannot be known"
      - is the truthful one for it, and a separate arm would duplicate that message with no
      observable difference. On the parse side json.loads is handed a str, so it can never raise
      UnicodeDecodeError - measured: json.loads on a str raises JSONDecodeError - and the member
      is dead. ValueError STAYS because json.JSONDecodeError subclasses it and that arm is live,
      also covering the empty file. Deleting the dead member is preferred over leaving it because
      a handler that cannot fire reads as coverage and is not, which is the same failure shape as
      the docstring claim in D-06.
    dec: none
  - id: D-11
    choice: >-
      Parity is pinned on VERDICT plus observable-output properties, never on exit code or message
      text equality.
    because: >-
      The two readers refuse by different mechanisms and both are correct in their own context -
      gh-sync raises a bare SystemExit whose code is the message string (process status 1), while
      load_factory goes through factory_cli.refuse, which prints to stderr and exits
      EXIT_REFUSED (2) so factory_cli.run propagates it unwrapped per issue 208. Demanding
      identical exit codes would force one of the two CLIs to change its contract for no operator
      benefit. What IS pinned, per input - both readers agree on accept versus refuse; every
      refusal raises SystemExit; every refusal's observable output (str(e) for gh-sync, captured
      stderr for load_factory) contains the feature.json path; and none of it contains the string
      "unexpected failure" or any exception class name.
    dec: none
  - id: D-12
    choice: |-
      T-01's YAML-only fixture goes into tests/integration/test-gh-sync-open.py, beside the
      reader-contract cases it was written to join, and not into the pole file named for the
      subcommand. No new test file is created.
    because: |-
      Measured in this worktree at 6cb113f4, after commit efcebe2d split the gh-sync integration
      monolith into five pole files plus gh_sync_support.py (issue 1527). test-gh-sync-open.py is the
      ONLY pole file that holds reader-level cases - cases that call load_recorded directly rather than
      driving a subcommand: the whole T-06 Part C block (:350-399) and the whole fix1 Part B block
      (:401-474) sit there, including the zero-byte fixture at :426-442 that this fixture's own comment
      argues against. grep of load_recorded across the five poles returns hits in test-gh-sync-open.py
      alone; test-gh-sync-record.py, -ship.py and -abandon.py contain none, and
      test-gh-sync-start-task.py binds _ghs for other functions only. The split itself endorses the
      placement: gh_sync_support.load_gh_sync's docstring at :844-846 says it is "Used by the cases that
      assert a function's own contract rather than a subcommand's". The fixture's subject is
      load_recorded's PARSER, so its neighbours are the other reader-contract cases, not the open
      subcommand - the shared subject is the reader, and the pole file that owns the reader is -open by
      measurement rather than by its name. A new test file was rejected: it would move a case out of the
      block whose comments explain why it exists, and creating one is a scope change this retarget has
      no authority to make.
    dec: none
  - id: D-13
    choice: |-
      T-04 gains depends_on T-01, serialising the two, and T-05 keeps depends_on T-02 and T-04.
      The build order is T-01 then T-04 then T-05, with T-02 then T-03 free to run in parallel.
    because: |-
      After the retarget T-01 EDITS tests/integration/test-gh-sync-open.py while T-04 and T-05
      RUN it in their verify blocks. A verify that runs a file another in-flight task is mid-edit
      measures neither task's work - it can read a half-written fixture, and it makes an unrelated
      red unattributable. depends_on is the only ordering the scheduler reads (teams/build.yaml
      consumes from_task_depends_on; prose in intent is invisible to it), so the constraint is
      written there. The direction is forced: T-01 must precede, because T-04 and T-05 both run
      the file T-01 edits, while T-01 runs nothing they edit. What it costs is parallelism -
      T-04's runtime edit no longer starts until a test-only task has landed - and that is
      accepted because the alternative is a verify whose baseline nobody can pin. Both T-04's and
      T-05's expected ok-count for that pole file therefore reads "above 79", not "79".
    dec: none
  - id: D-14
    choice: |-
      Divergence classes A and B are CLOSED by T-02, not disclosed. A feature.json that is PRESENT
      and parses to a non-mapping REFUSES, and one whose own factory key is PRESENT and is not a
      mapping REFUSES. The factory key ABSENT keeps returning the empty record, and so does an
      absent file. The shared parity input set therefore SPANS the measured table, in both
      directions. D-08 is SUPERSEDED by this decision.
      PARTLY SUPERSEDED IN TURN by D-16 on 2026-09-11, and kept rather than rewritten. AS RECORDED
      THEN: the set stood at ten inputs and "exactly ONE measured divergence survives this feature -
      a block mapping carrying wrong-typed members". WHAT IS LIVE NOW: that row is CLOSED too, by
      aligning load_factory onto _opt_int's tolerance rather than by refusing, the set SPANS the table
      at TWELVE inputs, and NO measured divergence survives the feature. Three DELIBERATE contract
      differences remain and are recorded with their reasons in BRIEF Risk and SC-15 - neither reader
      detects a duplicate key any more, both refuse a YAML-only document, and the issues mapping's key
      admission still differs. Read D-16 for the coercion row; the four rows this entry closed are
      unaffected by it.
    because: |-
      The operator ruled on 2026-09-11 that absence and corruption must be DISTINGUISHABLE: returning
      the empty record for an ABSENT feature.json is correct and stays, returning that SAME empty
      record for a file that is PRESENT and malformed is the defect. Under that ruling D-08's
      exclusion no longer holds, and the four rows it covered are closed by one guard pair inside
      load_factory.
      WHAT CHANGED, and why this is not scope growth. D-08 excluded both classes on the premise that
      closing either would change approved T-02 behaviour and widen scope past the operator's
      ruling. The premise was correct at cycle 4 and is now false: the operator has ruled the rows
      in. D-08's record stands unaltered as the cycle-4 position - superseded by measurement plus
      ruling, never deleted.
      EVIDENCE, all re-measured in this worktree at 6cb113f4 on 2026-09-11.
      One - the parity survey fed 13 input classes as identical bytes to both readers, 4 SAME and 9
      DIFFERENT, 6 carrying the FEAT-14 incident class (notes/research-BUG-285-parity-survey.md).
      Classes A and B are four of those rows: a top-level list, a top-level scalar string, a
      top-level scalar int, and a present-but-non-mapping block key.
      Two - the caller survey found exactly ONE call site, factory_decompose.py:515 inside _main(),
      and it does not depend on malformed tolerance: a refusal there exits before ensure_labels, the
      declared point of no return at :538, with zero remote writes made
      (notes/research-BUG-285-caller-survey.md). No test depends on the tolerance either; the one
      malformed fixture already asserts refusal.
      Three - all 80 feature.json files under .harness/*/features/*/ have the factory key ABSENT.
      Zero carry a non-mapping factory value and zero carry a non-mapping document. So the SPLIT is
      what keeps every live file working: closing the block-key row WITHOUT splitting absent from
      present-and-not-a-mapping would turn all 80 into refusals.
      Four - the shape is not invented. load_recorded already carries exactly this split: "github"
      not in doc returns the default record at gh-sync.py:583-586, while a present non-mapping
      github value refuses at :588-594, and a document that parses to a non-mapping refuses at :578.
      Closing these rows converges load_factory onto a shape the other reader has carried since
      FEAT-14, which is why one guard pair discharges four table rows with no new task.
      WHAT SURVIVES - SUPERSEDED 2026-09-11 by D-16, and kept here as the record of what was believed
      at that hour rather than deleted. AS RECORDED THEN: "Block mapping with wrong-typed members -
      for example a factory block recording parent as the string "7". load_recorded returns a POPULATED
      record because _opt_int coerces "7" to 7 at gh-sync.py:512-524; load_factory returns the EMPTY
      record because it admits only real ints at :134-135. That is a COERCION-POLICY divergence, not a
      guard divergence ... Closing it on the load_factory side means choosing between refusing and
      silently dropping a wrongly-typed member - a policy choice about POPULATED records ... and one the
      operator has not ruled. It is a separate ticket."
      WHY THAT IS NO LONGER LIVE. The operator DID rule it, on 2026-09-11, and ruled the direction as
      well: load_factory ADOPTS _opt_int's tolerance rather than refusing. The reasoning above had
      framed the choice as refuse-or-drop and missed the third option, which is the correct one - the
      measurement that settles it is _opt_int's own docstring (gh-sync.py:515-518), which records that
      the coercion exists because reading a quoted "7" as ABSENT once made gh-sync create a duplicate
      parent or milestone. So refusing would have reopened a closed incident. D-16 carries the decision,
      its trade-off and its drift detector; the enumeration above is preserved unaltered because a
      superseded record is still the record (rule 15).
    dec: none
  - id: D-15
    choice: |-
      The unit assertions for the two new refusals are SPLIT across the two existing test tasks
      rather than carried by a new one. T-03 carries the per-reader load_factory guard variants and
      the absent-path controls; T-05 carries the cross-reader parity rows. No sixth task is minted.
    because: |-
      T-03 already owns the load_factory-only unit file, tests/unit/test-factory-decompose-loader.py,
      with the exact tempdir plus redirect_stderr plus EXIT_REFUSED check shape the new guards need,
      and it already depends on T-02, so the assertions land after the change they grade. The three
      non-mapping document variants - list, string, int - are ONE guard, so exercising all three
      belongs in the per-reader file; the parity set pins CROSS-READER agreement and needs one
      representative per class, not three near-identical rows. T-05 gains the two closed classes as
      parity rows plus a block-key-absent row and a duplicate-key row, which is what makes its set
      span the table in both directions - inputs where load_recorded refused and load_factory did
      not, and the duplicate-key row where load_factory refused and load_recorded did not.
      A sixth task was REJECTED: both files already exist in the plan, both already depend on T-02,
      and a new task would add a scheduler edge plus a third file of assertions for behaviour their
      owners can carry. The cost of the split is that no single file holds the whole closure set; it
      is accepted because the two files answer different questions, and SC-06 grades the source
      guards independently of both. Machine fields stay inside check-plan-routes.py's 50-line
      per-task cap because only intent grows, and intent is not counted.
    dec: none
  - id: D-16
    choice: |-
      The wrong-typed-members row is closed by ALIGNING load_factory onto gh-sync's TOLERANCE, not
      by making load_factory refuse. load_factory REIMPLEMENTS _opt_int's four lines as a nested
      helper inside itself; it does not import them, and gh-sync.py's _opt_int is not edited. The
      duplicate is protected by T-05's cross-reader parity rows, which feed the SAME bytes to BOTH
      readers and assert the VALUES they read are EQUAL. D-14's "exactly ONE measured divergence
      survives" is SUPERSEDED by this decision.
    because: |-
      THE DIRECTION IS THE WHOLE DECISION, and the obvious fix is the wrong one. _opt_int is not
      laxity: its docstring (gh-sync.py:515-518) records its own incident - the coercion "tolerates
      the quoted form the old (\d+) regex silently read as ABSENT - and 'absent' here meant gh-sync
      believed nothing was recorded and would create a duplicate parent or milestone." So making
      load_factory admit only real ints REINTRODUCES that incident: a legacy-quoted "parent": "7"
      reads as no parent. This row therefore differs from the five fail-open rows D-14 closed -
      there the empty read came from a MISSING guard, here it would come from a STRICTER one, so
      refusing would look like tightening while reopening a closed incident.
      MEASURED, in this worktree at 6cb113f4 on 2026-09-11, one feature.json holding
      {"github": {"parent": "7"}, "factory": {"parent": "7", "repo": "a/b"}}: load_recorded returns
      parent 7, load_factory returns parent None. On {"parent": " 7 "} the same split appears. On
      {"parent": true} both already return None, because _opt_int excludes bool explicitly and
      load_factory's isinstance guard excludes it too - that row AGREES before the change and is
      the control that reddens if the copy is written without the bool exclusion.
      THE TRADE-OFF, and why reimplementation won. Three options were live.
      ONE, IMPORT _opt_int. Rejected as not reachable without new machinery: gh-sync.py is
      HYPHEN-named, so import gh_sync cannot resolve it, and reaching the helper would need
      importlib.util.spec_from_file_location, which in this repo appears only in TEST support
      (tests/integration/gh_sync_support.py:844-850) and in no reader - grep of
      factory_decompose.py for gh-sync, gh_sync, _opt_int and spec_from_file_location returns
      PROSE references only, zero imports. Importing would also couple two deliberately separate
      CLIs at their readers.
      TWO, HOIST the helper into a module both already import. Rejected: it would edit
      factory_decompose.py and gh-sync.py OUTSIDE load_factory and load_recorded, which the
      BRIEF's own Constraints forbid, and it would touch gh-sync's coercion, which this segment
      forbids in both directions.
      THREE, REIMPLEMENT the four lines inside load_factory. CHOSEN. What it gives up is real and
      is the exact defect class BUG-285 exists to close: a second copy that can DRIFT. What stops
      it is not discipline but a detector - T-05's parity rows feed the SAME bytes to BOTH readers
      and assert the values read are EQUAL, so a change to either copy alone reddens
      run-unit-tests.sh --kind unit. A duplicate with a behavioural equality detector is a
      different risk from a duplicate with only a comment, and that is what makes option three
      acceptable where it otherwise would not be.
