  - id: T-04
    title: Make load_recorded refuse a non-UTF-8 feature.json and delete its dead except member
    traces: [REQ-09, REQ-10, REQ-11]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on:
    - T-01
    status: ready
    files:
      - .claude/skills/harness/bin/gh-sync.py
    verify: |
      env -u HARNESS_AGENT_TYPE python3 -c "
      import importlib.util, os, sys, tempfile
      BIN = '.claude/skills/harness/bin'
      sys.path.insert(0, BIN)
      spec = importlib.util.spec_from_file_location('ghs', os.path.join(BIN, 'gh-sync.py'))
      m = importlib.util.module_from_spec(spec)
      spec.loader.exec_module(m)
      d = tempfile.mkdtemp()
      with open(os.path.join(d, 'feature.json'), 'wb') as fh:
          fh.write(bytes([0xff, 0xfe]) + b'trash')
      accepted = False
      escaped = None
      msg = ''
      try:
          m.load_recorded(d)
          accepted = True
      except SystemExit as e:
          msg = str(e)
      except Exception as e:
          escaped = type(e).__name__ + ': ' + str(e)
      ok = (not accepted) and escaped is None and 'feature.json' in msg and 'UnicodeDecodeError' not in msg
      if accepted:
          print('FAIL: accepted a non-UTF-8 feature.json')
      elif escaped is not None:
          print('FAIL: escaped uncaught as ' + escaped)
      elif ok:
          print('OK refused: ' + msg.splitlines()[0])
      else:
          print('FAIL: refusal message unusable: ' + msg)
      sys.exit(0 if ok else 1)
      "
      env -u HARNESS_AGENT_TYPE .agents/skills/harness/bin/run-unit-tests.sh --kind unit
      env -u HARNESS_AGENT_TYPE python3 tests/integration/test-gh-sync-open.py
      env -u HARNESS_AGENT_TYPE python3 tests/integration/test-gh-sync-record.py
