      THE SHARED INPUT SET, TWELVE inputs, each a name and a BYTES payload, written to feature.json in
      BINARY mode in a fresh tempfile.TemporaryDirectory per reader per input:

        1. "valid JSON mapping"        b'{"github": {"parent": 40}, "factory": {"repo": "o/n"}}'
                                       expected verdict: accept
        2. "absent feature.json"       no file written at all
                                       expected verdict: accept
        3. "own block key absent"      b'{"feature_id": "F1"}'
                                       expected verdict: accept
        4. "empty file"                b""
                                       expected verdict: refuse
        5. "malformed JSON text"       b"{ not: valid json [[["
                                       expected verdict: refuse
        6. "YAML-only block mapping"   b"factory:\n  repo: owner/name\n"
                                       expected verdict: refuse
        7. "non-UTF-8 bytes"           bytes([0xff, 0xfe]) + b"trash"
                                       expected verdict: refuse
        8. "document is not a mapping" b"[1, 2]"
                                       expected verdict: refuse
        9. "own block key not a map"   b'{"github": "x", "factory": "x"}'
                                       expected verdict: refuse
       10. "duplicate block key"       b'{"github": {"parent": 1}, "factory": {"repo": "a/b"},
                                         "github": {"parent": 2}}' - one physical line, no newline
                                       inside the braces
                                       expected verdict: accept
       11. "quoted int members"        b'{"github": {"parent": "7", "issues": {"T-01": "12"}},
                                         "factory": {"parent": "7", "repo": "a/b",
                                         "issues": {"T-01": "12"}}}' - one physical line
                                       expected verdict: accept
