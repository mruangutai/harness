         SystemExit whose code is the message string, load_factory exits EXIT_REFUSED through
         factory_cli.refuse, and both are correct in their own CLI's contract.
      D. Per ACCEPTING reader-and-input pair for inputs 2 and 3 only (four checks), one check that
