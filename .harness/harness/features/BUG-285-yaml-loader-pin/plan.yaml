  - id: D-06
    choice: >-
      load_recorded's docstring claim that the reader is converged with factory_decompose.py's
      reader is CORRECTED by T-04, not confirmed and not left standing.
    because: >-
      The sentence is false today and measurably so - on 13 input classes fed as identical bytes to both
      readers in this worktree at 6cb113f4, NINE disagree
      (notes/research-BUG-285-parity-survey.md). The replacement must NOT assert convergence in any form,
      qualified or not: an unverifiable prose claim of convergence is what let the two readers drift in the
      first place, and the same claim with a repaired scope is the same false-record defect in a new
      spelling. What T-04 writes instead is an ENUMERATION of what was measured, claiming no completeness
      beyond it, which is what SC-15 now mandates.
      WHAT THE ENUMERATION HOLDS, after T-02 as amended by D-14 and D-16 and after T-04, every row
      measured at 6cb113f4:
      - treated identically, both readers load the record: a valid JSON mapping.
      - treated identically, both return the empty or all-None default record: an absent feature.json, and
        a mapping whose own block key is absent.
      - treated identically, both refuse by raising SystemExit whose observable output names the
        feature.json path: an empty file, malformed JSON text, a YAML-only block mapping, bytes that are
        not valid UTF-8, a document that parses to a non-mapping, and a document whose own block key is
        present and is not a mapping.
      - treated identically, both accept, last key wins: a document carrying a duplicate key.
      - treated identically, both read the same VALUE out of an integer-valued member: a block mapping
        carrying wrong-typed members, where a quoted "7" reads as 7 on both sides and a bool reads as no
        value on both sides, because T-02 adopts _opt_int's tolerance (D-16).
      - DELIBERATELY DIFFERENT, and each stated with its reason rather than as an exception to a
        convergence claim: (i) NEITHER reader detects a duplicate key any more - load_factory's
        DuplicateKeyError refusal is given up by the parser swap, there is no measured incident behind it,
        and the compensating rule is the BRIEF constraint that nothing may emit one; (ii) BOTH refuse a
        YAML-only block mapping, which is the point of the feature rather than a residual, because
        feature.json stays strict JSON; (iii) the issues mapping's KEY ADMISSION still differs - measured
        2026-09-11, load_recorded admits only keys matching T-\d+ and strips them, load_factory admits any
        key verbatim, so {"issues": {"X-1": 5}} reads as {} on one side and {"X-1": 5} on the other. That
        is a key-admission policy, not a coercion, no incident is measured behind it, and it is NOT closed
        by this feature - it is raised to the operator as an open question and named here so the record
        does not lose it.
      - what holds what is enumerated: tests/unit/test-feature-json-readers.py, the file T-05 adds.
      WHY THIS ENTRY WAS REVISED, TWICE. Its first revision named TWO surviving classes - a document
      parsing to a non-mapping, and a present-but-non-mapping own block key - both CLOSED by the amended
      T-02 under D-14. Its second (2026-09-11, this amendment) named ONE surviving class, a block mapping
      carrying wrong-typed members, now CLOSED by T-02 under D-16 by aligning load_factory onto _opt_int's
      tolerance. Each time the enumeration went false, which is exactly the failure mode this decision
      exists to prevent, arriving from the other direction. The durable lesson is the FORM, not the number:
      the docstring states the classes actually measured, cites the note they were measured in, and states
      each deliberate difference with its reason - so a later amendment revises an enumeration instead of
      falsifying a claim.
    dec: none
  - id: D-07
    choice: >-
      change_type is bugfix on T-04 and T-05; the required kind is unit for both, and T-05 also
