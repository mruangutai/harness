      RUNNING ONE READER ON ONE INPUT. Write a single helper that takes a callable and a payload,
      makes the tempdir, writes the bytes if the payload is not None, calls the callable with
      stderr captured by contextlib.redirect_stderr, and returns a (verdict, observable, record) triple:
        - returns normally      -> ("accept", captured stderr, the returned record)
        - raises SystemExit     -> ("refuse", captured stderr plus str(e), None)
