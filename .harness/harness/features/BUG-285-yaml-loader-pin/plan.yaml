      DO NOT REPLACE IT WITH A CONVERGENCE CLAIM OF ANY KIND, qualified or not. Not "converged
      except for", not "now converged", not "the one input that still diverges", not "converged on
      every class measured". An unverifiable prose claim of convergence is what let the two readers
      drift in the first place, and the same claim with a repaired scope is the same false-record
