      function before you edit - the line numbers below were re-derived after main was merged in,
      and an earlier dispatch on this feature carried stale ones.

      HALF ONE, the uncaught escape. load_recorded starts at line 527. Lines 558-560 open the file
      with open(path, encoding="utf-8") and call f.read(). Line 561 catches OSError only, raising
      SystemExit at 562-564 with the wording "... could not be read, so what is already mirrored
