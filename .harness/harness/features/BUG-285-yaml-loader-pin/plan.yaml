  - id: D-02
    choice: T-01 is dispatched to harness-qa, not to harness-backend-dev or harness-dev-ops.
    because: All three resolve for tests/**, but only qa's consult-when names writing regression tests and closing coverage gaps, which is the whole of this change; backend-dev's names service logic and dev-ops's names test-runner setup, not fixtures.
    dec: none
  - id: D-03
    choice: change_type is bugfix, and the only required kind is integration.
    because: DEC-217 binds a bugfix confined to tests to the integration kind; touches_runtime_code is false here, so unit is not demanded, and integration is active with a real runner.
    dec: DEC-217
  - id: D-04
    choice: The able-to-fail proof is a throwaway mutation probe against a COPY of gh-sync.py in a tempdir, recorded as a transcript, never committed as a test.
    because: .agents/skills is a symlink to .claude/skills, so the reader is one inode and an in-place probe edit would be a live-tree edit of production code this bug forbids touching.
