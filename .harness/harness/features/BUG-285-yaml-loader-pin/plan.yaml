      Change ONE function, load_recorded, in .claude/skills/harness/bin/gh-sync.py. Edit no other
      function in that module, no other production file, and no test file. T-05 writes the durable
      test; do not write it yourself. In particular do NOT touch _opt_int at :512-524 - it is out of
