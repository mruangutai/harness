      input escapes load_recorded as a TRACEBACK. Measured in this worktree: writing
      bytes([0xff, 0xfe]) + b"trash" to a feature.json and calling load_recorded raises
      "UnicodeDecodeError: 'utf-8' codec can't decode byte 0xff in position 0: invalid start byte",
