decisions:
  - id: D-01
    choice: Use one QA review-pin policy path for fleet products and unbound Harness
      features, with no current-tree, default-branch or Harness-policy fallback.
    because: The reviewed repository and commit own both policy tables. A separate Harness
      compatibility path would preserve policy drift. Proposed cost is migration of
      affected validator fixtures to real commits and trusted feature/pin bindings plus
      local commit/blob reads and one config validation per QA return; compatibility
      intentionally changes unpinned Harness reports from current-tree acceptance to
      explicit refusal until a trusted pin exists. No bulk historical backfill or non-QA
      product_config change is included.
    dec: DEC-256
  - id: D-02
    choice: Policy-check all reported kinds under every verdict; refuse always-floor
      unresolved and active/null omissions under every verdict, but retain the full
      satisfied-kind floor only at PASS with matrix_ok true and leave when predicates
      with QA.
    because: The settled hard gate must not disappear on a non-PASS return. A blanket
      presence floor for otherwise configured kinds would force fictitious not-yet-run
      states in legitimate early BLOCKED reports; omission there is not exclusion or
      coverage proof. DEC-212 leaves conditional applicability with QA, and the conservative
      all-excluded no-kind exemption stays intact.
    dec: DEC-212
  - id: D-03
    choice: Accept that Kaya features requiring unresolved kinds become BLOCKED until Kaya supplies verified active runners or signed exclusions.
    because: This intentionally exposes the missing verification rather than preserving a false soft skip; INV-49 disclosure never grants an exclusion.
    dec: DEC-187
