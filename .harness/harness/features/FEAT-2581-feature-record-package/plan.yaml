decisions:
  - id: D-01
    choice: The canonical feature.json read moves with its loader to feature_record/read.py, and every canonical-reader remedy, category key and T07 relocation key that named artifact_accessors.load_feature_json or feature_json_write names feature_record.read.load_feature_json or its feature_record owner.
    because: canonical_reader_audit matches a canonical row only when a call's resolved callee equals the row's remedy, so keeping the old remedy on the 24 caller rows would turn every one into a missing-accessor finding; the grilling's change-only-file-and-id rule cannot hold for rows whose remedy names the moved function.
    dec: DEC-259
  - id: D-02
    choice: 'Each diagnostic literal that names the module that failed to import or crashed names the module actually loaded instead of feature_schema or plan-merge.py: check-domain''s not-importable, CRASHED and whole-file line-budget texts and check_state INV-23, INV-26, INV-37 and INV-40. No output change is exempted in advance: these, the RepoModuleError renderings that embed the loaded module''s name by themselves (INV-7, check_state/run_state''s refusal-evidence check, harness_config''s harness.json validation), the check-state --list reads column, every traceback frame the move relocates, any other byte of a check-state or check-domain output stream the existing tests capture, and the canonical-reader audit''s scanned Python file count are measured from the processes the existing tests start (the audit from both clean checkouts), compared as raw bytes, and recorded with exact old and new bytes in notes/build-divergences.md; an item no existing test reaches is recorded as unreached with its old and new source template, never given a new test; and each such record stays red until the operator rules on it.'
    because: Keeping the old literals would send a reader to a deleted file, so the direction is signed here; Settled Q3 (a) keeps every measured byte difference red until the operator rules on it, so this signature authorizes the source change, never its output bytes in advance.
    dec: none
  - id: D-03
    choice: check_state/ctx.py loads signed_task_hash by module name from plan_merge.approval through harness_boundary.load_repo_module, and plan-merge.py re-exports nothing.
    because: the path load of plan-merge.py from the checked bin directory was the only reason for the re-export DEC-259 names as its one exception; check-state.py already puts its own directory first on sys.path, so the name import resolves the same checkout's package.
    dec: DEC-259
