    intent: |
      Product checkout: the FEAT-2581 worktree of the Harness repository; baseline e12381fde910eb05728004476a10d741d6918010. Adapt FEAT-70's receipt-script structure (git show a98451c5:.harness/harness/features/FEAT-70-long-file-plan-merge-package/notes/receipt-scripts/ and that feature's notes/divergence-rulings.json); the committed measurement store, the recorder and the recomputing verify below go beyond Settled Q3 (a)'s no-new-proof-framework bar, an exceedance the operator accepted as disclosed in the BRIEF (PL-10). After T-01 and T-02 are committed and green, record HEAD's full SHA as the immutable implementation pin before creating any receipt script or receipt file. Write under this feature's notes/receipt-scripts exactly feat2581-cleanpin.py (orchestrates both sides and writes the generated receipt and build-divergences.md), feat2581-grade-assert.py, feat2581-ledger-driver.py, recorder/sitecustomize.py, feat2581-bun-preload.js and feat2581-replay.py. The scripts create clean detached baseline and pin checkouts under .claude/worktrees/harness, assert the checked-out SHA and empty status before measuring, never fetch or call GitHub, never edit either checkout, and delete no pre-existing worktree. Run every measurement with HARNESS_AGENT_TYPE unset, once per side, the two sides one after the other, deriving every reported byte, hash and verdict from that one execution; feat2581-cleanpin.py --reuse rereads the same per-side measurement, as FEAT-70's did, so a ruling recorded later never forces a second execution. The suites, case identity, CLI ledger and gate capture below come from one run of each test file per side with PYTHONPATH naming notes/receipt-scripts/recorder; everything the recorder writes goes to the side's ledger directory outside both checkouts, and it changes no byte or value any test receives or prints.

      The verify guarantees four things, and every rule below serves one of them. (1) Every captured stream decodes strictly: a value that is not canonical base64 is a failure, never decoded leniently into something that can equal an empty capture. (2) Every disclosed field is derived from the two refs, never accepted from the file being checked: each receipt line other than the verdicts, each divergence record body including each d02# source-only record's file, symbol and source, and each test_change record is recomputed from the committed measurement files read at the review ref and from git show at the baseline and the pin, and must equal what the receipt and build-divergences.md say. (3) Every record SC-08 requires is present: one divergence: record in build-divergences.md per divergence of every kind, the test_change records, the d02_item lines and both audit records. (4) Every ruled id carries a human-readable account: each divergence: record ends with a derived account rendered as readable text, so escaped byte literals are never the only form the operator sees.

      Measurement files (the evidence every verdict and disclosed field is recomputed from): each side's suite, CLI, gate, replay and audit records are written, raw and before any root replacement, to notes/measurements/baseline.jsonl.gz and notes/measurements/pin.jsonl.gz: gzip with mtime 0 over UTF-8 JSON Lines, one object per record with keys id (unique within the file), kind (suite, cli, gate, replay or audit), class (cli records only: checkout, copied or bun) and streams, a mapping from stream name to the canonical standard base64 of that stream's exact bytes: the RFC 4648 alphabet with = padding and no other character, such that base64-encoding the decoded bytes reproduces the string exactly. exit is the decimal ASCII exit status, argv the arguments joined by NUL bytes, cwd its path bytes. Every record carries exactly the stream keys its kind requires, no more and no fewer: suite argv, cwd, exit, stdout, stderr and cases; cli argv, cwd, exit, stdout, stderr, file_before and file_after; gate argv, cwd, exit, stdout and stderr; replay argv, exit, stdout, stderr, before and after; audit exit, stdout and stderr. A suite record's id is suite#<test file>, and no record of another kind has an id beginning suite#. A captured stream that is empty is the empty string, the base64 of zero bytes, never omitted. The only value that is not a base64 string is JSON null in file_before or file_after, written only when the invocation names no --file argument or the named file does not exist at that moment. A recorder that cannot capture a required stream writes no record for that process and makes feat2581-cleanpin.py exit non-zero without writing a receipt, never a record with the key missing, so a missing capture is never confused with an empty or absent value. Before it recomputes anything, the verify refuses a record whose kind is not one of the five, whose stream keys are not exactly its kind's set, or whose stream value is neither a canonical base64 string nor that permitted null; it decodes every stream with validation, so stderr !!!! on one side is a failure and never compares equal to an empty stderr on the other. It also refuses an exit that does not decode to a decimal integer, a cli record whose class is not checkout, copied or bun, a record of another kind carrying one of those classes, a suite id rule broken in either direction, and an id whose kind differs between the two sides. streams {} on both sides, or stderr missing on both sides, therefore fails. The receipt scripts write these files from the one execution; nothing edits them afterwards.

      Grade (SC-02): feat2581-grade-assert.py --ref <sha> reads feature-record.py and every feature_record/*.py at that ref, and the baseline's feature-record.py and feature_schema.py, through git show, never from a checkout, and grades them with the current tree's code_grade.py. It finds the repository from its working directory (git rev-parse --show-toplevel), never from its own file path, so the committed bytes run unchanged when piped to python3 - on stdin, which is how the verify runs them. At a ref holding feature_record/ it exits 0 only when every function is at grade 4 or better, the twelve baseline below-bar functions (main, _close_refused_run.mutate, cmd_record_history.mutate, _run_end_digest, _record_run_end.mutate, spend_for, recovery_command_for, verify_evidence_ref, run_evidence_problems, mirror_provenance_problem, _runs_agent_problems, _problems_for_doc) are present at their owners at grade 4 or better, and every other moved function keeps its baseline qualified name and grade; it lists each new function separately. At a ref without feature_record/ it prints one line below_bar: <qualname> <grade> per function below grade 4 and exits 1. The receipt records both runs: the pin exits 0, the baseline exits 1 with exactly the twelve below_bar lines.

      Suites (SC-03, SC-04): in each checkout run every file directly under tests/unit and tests/integration named test-*.py or test_*.py at the baseline, except tests/integration/test-feature-json-merge.py, which T-01 deletes and neither side runs, plus tests/unit/omp-hooks.test.ts under bun, one file at a time. Each run is one suite measurement record: id suite#<file>, streams argv, cwd, exit, stdout and stderr (the runner's exact bytes) and cases (see Case identity). A FAIL line is a line of stdout or stderr, after root replacement and split at LF, whose first whitespace-delimited token begins with FAIL. A file exiting non-zero at the baseline is written as one line baseline_failing: <file> <exit> <FAIL line count> and is not compared. The measured set is tests/integration/test-typescript-typecheck.py alone, exit 1, because node_modules/.bin/tsc is not installed (measured at e12381fd in this worktree, files run in parallel). Any other baseline_failing file also gets a divergence record baseline#<file>, carrying its exit status and full output in build-divergences.md, and stays red until ruled: the exempt set is never enlarged silently. Every other run file must exit 0 at the pin with a FAIL-line list identical to the baseline's; tests/unit/test-factory-claim-mutation.py prints four FAIL lines from its deliberate mutants at exit 0, and every other file prints none. unit_files and integration_files are PASS only when that holds for every file of their directory, omp-hooks.test.ts counting under tests/unit. Never run a baseline test file against the pin. The verify requires exactly one suite record per run file on each side, each bound to its invocation: its cwd is that side's checkout root and its argv's last argument is the file (PF-40325938), and recomputes every baseline_failing line, exit status and FAIL-line list from those records.

      Case identity (SC-10), FEAT-70's b_cases == pre_existing per file: a file's case identity is the ordered list of its suite stdout lines (after root replacement, split at LF) whose first whitespace-delimited token is ok, ok:, PASS or PASS:, byte for byte, followed by the non-empty lines of its cases stream. For a Python file the cases stream holds one line <outcome> <test id>, LF-terminated, per unittest result in result order, and is empty when there is none: recorder/sitecustomize.py writes it by wrapping unittest.TestResult addSuccess (success), addSkip (skip), addFailure (failure), addError (error), addExpectedFailure (expected_failure), addUnexpectedSuccess (unexpected_success) and addSubTest when its outcome is not None (subtest_failure), each calling the original. The method is marker, unittest or marker+unittest by which of the two sources named an entry at the baseline; a file naming no entry at the baseline is unnamed and its identity is its whole stdout. For tests/unit/omp-hooks.test.ts the bun run also passes --reporter=junit --reporter-outfile=<side ledger directory>/omp-hooks.junit.xml, its cases stream is that file's exact bytes, parsed as raw XML before any root replacement, which applies to each derived entry instead (PF-db2ae14a), and its identity is one entry <outcome> <classname> <name> per testcase element in file order, the outcome being the tag of its first failure, error or skipped child, else passed; its method is bun-junit. This junit run serves SC-10. The operator's answer to PL-04 keeps the CLI ledger's bun-spawned class, its zero-records gate and feat2581-bun-preload.js; panel findings PF-d35d903d and PF-502d3541 are disposed of at signature, not here. Measured at e12381fd: 131 files name cases by marker lines, 26 by unittest only, 3 by both; test-code-grade.py, test-code-grade-cli.py and test-suite-claim-preservation.py print one summary marker line only; test-harness-config-fixtures.py, test-factory-claim-mutation.py and test-omp-hooks.py print none and use no unittest; bun reports 247 testcases. Compare each compared file's identity bytes (each entry followed by LF, concatenated; an unnamed file's whole stdout) between sides after root replacement only, and write one line case_set: <file> <method> <baseline entries> <pin entries> SAME or DIFFERENT for each compared file and omp-hooks.test.ts. A DIFFERENT file gets one divergence record cases#<file> whose build-divergences.md record holds both identities; a dropped, added, renamed, reordered or newly skipped case is a difference. A list with fewer than two baseline entries cannot show a dropped case, so such a file must also be byte-identical between baseline and pin (git diff --quiet <baseline> <pin> -- <file>), and its identity is its whole stdout after root replacement, so a changed summary or any other output line is a cases# difference (PF-15af8306); T-01 edits none of the six measured above. case_identity is PASS only when every compared file and omp-hooks.test.ts has exactly one case_set line, every DIFFERENT one is RULED and every file under two baseline entries is unchanged. The verify recomputes every case_set line and every cases# record from the suite records.

      CLI ledger (SC-05): during the same run, plus tests/unit/omp-hooks.test.ts under bun, recorder/sitecustomize.py acts in every Python process whose argv[0] has the basename feature-record.py, wherever that file lives: the checkout's bin, a bin a test copied (tests/unit/test-feature-record.py test_an_unexpected_defect_stays_loud_and_nonzero runs mbin/feature-record.py from a mutated copy), or a process a hook or another tool spawned. It runs the identical command once as a child with the same argv, stdin, cwd and environment plus a recursion marker, records the child's real exit status, its exact stdout and stderr bytes, the --file bytes before and after and sha256 of each, relays stdout and stderr byte for byte, and exits with the child's status. Each invocation is one measurement record: kind cli, id <test file>#<ordinal> (the per-test-file invocation ordinal), class checkout, copied or bun, streams argv, cwd, exit, stdout, stderr, file_before and file_after. In the child it binds every datetime name in the entry and the modules it imports for feature.json (feature_record/* at the pin, feature_schema and feature_json_write at the baseline) to one fixed clock. Make fixture directories deterministic where they are created, never in the output: the recorder replaces tempfile directory and file naming in every test process with a per-test-file counter under one fixed absolute root, /tmp/feat2581-fixtures, identical on both sides and cleared before each side's execution, and feat2581-bun-preload.js, passed to bun with --preload, does the same for node mkdtempSync under the same root. Record tracebacks raw. The receipt gives, per side, the record count for each spawning class; cli_identity is FAIL while any class has zero records on either side.

