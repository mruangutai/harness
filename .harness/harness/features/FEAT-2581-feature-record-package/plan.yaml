      Measurement files (the evidence the receipt's verdicts are recomputed from): each side's CLI, gate, replay and audit records are written, raw and before any root replacement, to notes/measurements/baseline.jsonl.gz and notes/measurements/pin.jsonl.gz: gzip with mtime 0 over UTF-8 JSON Lines, one object per record with keys id (unique within the file), kind (cli, gate, replay or audit), class (cli records only: checkout, copied or bun) and streams, a mapping from stream name to the base64 of that stream's exact bytes. exit is the decimal ASCII exit status, argv the arguments joined by NUL bytes, cwd its path bytes. Every record carries exactly the stream keys its kind requires, no more and no fewer: cli argv, cwd, exit, stdout, stderr, file_before and file_after; gate argv, cwd, exit, stdout and stderr; replay argv, exit, stdout, stderr, before and after; audit exit, stdout and stderr. A captured stream that is empty is the base64 of zero bytes, never omitted. The only value that is not a base64 string is JSON null in file_before or file_after, written only when the invocation names no --file argument or the named file does not exist at that moment. A recorder that cannot capture a required stream writes no record for that process and makes feat2581-cleanpin.py exit non-zero without writing a receipt, never a record with the key missing, so a missing capture is never confused with an empty or absent value. Before it recomputes any difference, the verify refuses a record whose kind is not one of the four, whose stream keys are not exactly its kind's set, whose value is neither a string nor that permitted null, or whose exit does not decode to a decimal integer; a cli record whose class is not checkout, copied or bun, or a record of another kind carrying one of those classes; and an id whose kind differs between the two sides. streams {} on both sides, or stderr missing on both sides, therefore fails. The receipt scripts write these files from the one execution; nothing edits them afterwards.

      Grade (SC-02): feat2581-grade-assert.py --ref <sha> reads feature-record.py and every feature_record/*.py at that ref, and the baseline's feature-record.py and feature_schema.py, through git show, never from a checkout, and grades them with the current tree's code_grade.py. It finds the repository from its working directory (git rev-parse --show-toplevel), never from its own file path, so the committed bytes run unchanged when piped to python3 - on stdin, which is how the verify runs them. At a ref holding feature_record/ it exits 0 only when every function is at grade 4 or better, the twelve baseline below-bar functions (main, _close_refused_run.mutate, cmd_record_history.mutate, _run_end_digest, _record_run_end.mutate, spend_for, recovery_command_for, verify_evidence_ref, run_evidence_problems, mirror_provenance_problem, _runs_agent_problems, _problems_for_doc) are present at their owners at grade 4 or better, and every other moved function keeps its baseline qualified name and grade; it lists each new function separately. At a ref without feature_record/ it prints one line below_bar: <qualname> <grade> per function below grade 4 and exits 1. The receipt records both runs: the pin exits 0, the baseline exits 1 with exactly the twelve below_bar lines.

      Suites (SC-03, SC-04): in each checkout run every file directly under tests/unit and tests/integration named test-*.py or test_*.py, one file at a time, recording file, exit status and every FAIL line (a stdout or stderr line whose first whitespace-delimited token begins with FAIL). A file exiting non-zero at the baseline is written as one line baseline_failing: <file> <exit> <FAIL line count> and is not compared. The measured set is tests/integration/test-typescript-typecheck.py alone, exit 1, because node_modules/.bin/tsc is not installed (measured at e12381fd in this worktree, files run in parallel). Any other baseline_failing file also gets a divergence record baseline#<file>, with its exit status and full output in build-divergences.md, and stays red until ruled: the exempt set is never enlarged silently. Every other baseline file except tests/integration/test-feature-json-merge.py must exit 0 at the pin with a FAIL-line list identical to the baseline's after root replacement; tests/unit/test-factory-claim-mutation.py prints four FAIL lines from its deliberate mutants at exit 0, and every other file prints none. unit_files and integration_files are PASS only when that holds for every file of their directory. Never run a baseline test file against the pin.

      Case identity (SC-10), FEAT-70's b_cases == pre_existing per file: a file's case identity is the ordered list of its stdout lines whose first whitespace-delimited token is ok, ok:, PASS or PASS:, byte for byte, followed by one entry <outcome> <test id> per unittest result. recorder/sitecustomize.py writes the unittest entries by wrapping unittest.TestResult addSuccess (success), addSkip (skip), addFailure (failure), addError (error), addExpectedFailure (expected_failure), addUnexpectedSuccess (unexpected_success) and addSubTest when its outcome is not None (subtest_failure), each calling the original. The method is marker, unittest or marker+unittest by which of the two sources named an entry at the baseline; a file naming no entry at the baseline is unnamed and its identity is its whole stdout. For tests/unit/omp-hooks.test.ts the bun run also passes --reporter=junit --reporter-outfile=<side ledger directory>/omp-hooks.junit.xml, and its identity is each testcase element's classname and name in file order with its outcome (failure, error or skipped child, else passed); its method is bun-junit. This junit run serves SC-10 and stays whatever the operator rules on PF-d35d903d: that open question covers only the CLI ledger's bun-spawned class (its zero-records gate) and feat2581-bun-preload.js, not whether bun runs. Measured at e12381fd: 131 files name cases by marker lines, 26 by unittest only, 3 by both; test-code-grade.py, test-code-grade-cli.py and test-suite-claim-preservation.py print one summary marker line only; test-harness-config-fixtures.py, test-factory-claim-mutation.py and test-omp-hooks.py print none and use no unittest; bun reports 247 testcases. Compare each compared file's list and the omp-hooks.test.ts list between sides after root replacement only, and write one line case_set: <file> <method> <baseline entries> <pin entries> SAME or DIFFERENT for each. A DIFFERENT file gets one divergence record cases#<file> with both full lists in build-divergences.md; a dropped, added, renamed, reordered or newly skipped case is a difference. A list with fewer than two baseline entries cannot show a dropped case, so such a file must also be byte-identical between baseline and pin (git diff --quiet <baseline> <pin> -- <file>); T-01 edits none of the six measured above. case_identity is PASS only when every compared file and omp-hooks.test.ts has exactly one case_set line, every DIFFERENT one is RULED and every file under two baseline entries is unchanged.

      CLI ledger (SC-05): during the same run, plus tests/unit/omp-hooks.test.ts under bun, recorder/sitecustomize.py acts in every Python process whose argv[0] has the basename feature-record.py, wherever that file lives: the checkout's bin, a bin a test copied (tests/unit/test-feature-record.py test_an_unexpected_defect_stays_loud_and_nonzero runs mbin/feature-record.py from a mutated copy), or a process a hook or another tool spawned. It runs the identical command once as a child with the same argv, stdin, cwd and environment plus a recursion marker, records the child's real exit status, its exact stdout and stderr bytes, the --file bytes before and after and sha256 of each, relays stdout and stderr byte for byte, and exits with the child's status. Each invocation is one measurement record: kind cli, id <test file>#<ordinal> (the per-test-file invocation ordinal), class checkout, copied or bun, streams argv, cwd, exit, stdout, stderr, file_before and file_after. In the child it binds every datetime name in the entry and the modules it imports for feature.json (feature_record/* at the pin, feature_schema and feature_json_write at the baseline) to one fixed clock. Make fixture directories deterministic where they are created, never in the output: the recorder replaces tempfile directory and file naming in every test process with a per-test-file counter under one fixed absolute root, /tmp/feat2581-fixtures, identical on both sides and cleared before each side's execution, and feat2581-bun-preload.js, passed to bun with --preload, does the same for node mkdtempSync under the same root. Record tracebacks raw. The receipt gives, per side, the record count for each spawning class; cli_identity is FAIL while any class has zero records on either side.

      Replay (SC-06): for every feature.json record tracked at the pin, the paths .harness/<segment>/features/<feature>/feature.json, except FEAT-2581's, in git ls-files order, build an independent scratch tree per side at one fixed absolute path, /tmp/feat2581-replay, identical on both sides and cleared before each side's execution, holding the record at its own .harness relative path with that checkout's .harness/harness.json and .harness/team-config.yaml and the sibling plan.yaml when tracked, then run nine steps: 1 validate-feature-json.py on it, then feature-record.py 2 spend, 3 propose-rework, 4 run-start --id feat2581-replay --squad product --agent harness-product-lead, 5 stamp-tokens --tokens 1, 6 run-end --id feat2581-replay --verdict PASS --cycles-used 0, 7 judgement --by harness-orchestrator --kind continue --decision replay --reason replay, 8 spend, and 9 validate-feature-json.py again, under the recorder's clock. Each step is one measurement record: kind replay, id replay#<index>:<feature.json path>:<step>, index counting records from 1 in that order and step 1 to 9, streams argv, exit, stdout, stderr, before and after (the record's bytes).

      Gate capture and D-02 inventory, measured (SC-08): recorder/sitecustomize.py also records, in every test process, each child whose script (argv[0], or argv[1] when argv[0] is a Python interpreter) has the basename check-state.py or check-domain.py, wherever it lives, and whose output the test captures through communicate (subprocess.run included): one measurement record of kind gate, id gate#<test file>#<ordinal>, streams argv, cwd, exit, stdout and stderr. stdout and stderr are the exact bytes the child wrote to its pipes, taken before any decoding or newline translation in the test process, while the test still receives exactly the str or bytes value it received before; a gate run in-process or without captured output is not seen. Prove the raw capture on each side before the corpus: a Python process loaded with the recorder runs subprocess.run on /tmp/feat2581-fixtures/calibration/check-state.py with capture_output=True and text=True, that script writing exactly the bytes b"feat2581 raw\r\nline\rend\xe2\x80\x94\n" to stdout; its record is gate#calibration#1 and must hold those bytes. The receipt writes one line gate_captures: <baseline count> <pin count>, counting gate records other than the calibration. Every gate record is compared whole: each stream of each aligned record is compared as raw bytes after root replacement only, with no line filter, decoding or module-name selection, so a changed traceback frame, line ending or any other byte is a difference. Then classify the differences against the inventory (research note section 8, items 1 to 11), each marker below being the exact substring between the double quotes, matched in the raw stream bytes: item 1, "is not importable, so this file CANNOT be checked"; item 2, "CRASHED while checking this file"; item 3, "was not importable) — budget is"; item 4, "INV-23 CANNOT RUN for"; item 5, "INV-37 CANNOT RUN"; item 6, "INV-26 CANNOT RUN" in a line not containing "gh_board.py"; item 7, "INV-40 CANNOT RUN"; item 8, "INV-7 CANNOT RUN for"; item 9, "refusal evidence CANNOT be checked"; item 10, "harness.json cannot be validated"; item 11, in a gate record whose argv holds --list, each line whose first token is INV-7, INV-15, INV-46 or INV-37 (the rows reading check_state/table.py _EVIDENCE_READER). An item whose marker appears in a captured stream on either side is d02_item: <item> MEASURED <baseline lines> <pin lines>, with one line d02_item_record: <item> <gate record id>:<stream> for each differing gate stream containing its marker. An item 1 to 11 with no capture on either side is d02_item: <item> UNREACHED with exactly one divergence record d02#<item>:unreached, whose build-divergences.md entry gives the file, symbol and old and new source template read from both refs through git show. Never write a test to reach an item. The residual is every differing gate stream no d02_item_record names, written d02_item: residual <count>; each is a divergence like every other gate difference. Expected from a static read at e12381fd, not gated: items 2 (test-check-domain-grant.py _schema_crash_cases), 10 (test-check-state-feat59.py case_feat63_inv23_import_boundary) and 11 (the --list runs in test-check-state-table.py, test-check-state-corpus.py and test-check-state-shipped.py) are reached; 1 and 3 to 9 are not, because the only feature_schema failure injection makes harness.json validation fail first and the INV-40 observer never raises. d02_inventory is PASS only when items 1 to 11 and residual each have exactly one d02_item line, every MEASURED item 1 to 11 has at least one d02_item_record (D-02 changes each one, so a MEASURED item with no differing stream means the capture missed its branch), gate_captures is non-zero on both sides, the calibration record holds its bytes on both sides, and every gate and d02# record is RULED. Also write to build-divergences.md every test expectation T-01 changed, by file and case, with its old and new bytes.

      Audit (SC-07, SC-08): run .agents/skills/harness/bin/check-plan-routes.py --canonical-reader-audit in each clean checkout, the baseline as well as the pin, as one measurement record per side: kind audit, id audit, streams exit, stdout and stderr. Write exactly one line audit_scanned_files: <baseline count> <pin count>, each count being the N of the one line in that side's raw audit stdout of the form <M> unresolved reader site(s) across N Python file(s). The verify derives the same pair from the two committed audit records and refuses the receipt when its single audit_scanned_files line differs, or when either side's stdout holds no such line or more than one. T-01 adds ten package files and deletes three flat Python files, so the count and audit:stdout differ; that record is a divergence like every other and stays red until ruled. canonical_reader_audit is PASS only when the pin's audit exits 0 with zero unresolved sites.

      Compare baseline and pin after replacing only each checkout's absolute root bytes with one common token; fixture and replay paths are already the same bytes on both sides and are never rewritten. Apply no other normalization, filtering or sorting, traceback frames included. Align measurement records by id: every stream that differs is a divergence record <id>:<stream> (for example tests/unit/test-feature-record.py#3:stderr, gate#tests/integration/test-check-domain-grant.py#2:stdout, replay#4:<path>:6:after, audit:stdout), and a record present on one side only is <id>:unaligned; record ids contain no space. Write each to notes/build-divergences.md as one measured-bytes entry: a line divergence_entry: <record id>; then, for <id>:<stream>, exactly two lines, old: <payload> and new: <payload>, or, for <id>:unaligned, one line side: baseline or side: pin naming the side that holds the record followed by one line stream <name>: <payload> per stream of that record in sorted name order; then a line end_divergence_entry. A payload is the Python repr of the stream's bytes after root replacement (a b-prefixed bytes literal on one line, exact and reversible with ast.literal_eval), or the word absent for a null file_before or file_after. Nothing else goes between the two delimiter lines; any explanation for the operator goes outside them. The verify recomputes every entry body from the two committed measurement files and requires the divergence_entry blocks, ids and bodies alike, to equal the recomputed set exactly, so a missing, extra, stale or altered payload fails. The d02#<item>:unreached records are never measured-bytes entries: each is one source-only entry, a line source_only_entry: d02#<item>:unreached, then lines file:, symbol:, old_source: and new_source: (the source template read from both refs through git show, labelled as source text and never as output), then a line end_source_only_entry; the verify requires exactly one per d02# record and no d02# id inside a divergence_entry. baseline#, cases# and the listing of changed test expectations use neither delimiter. Nothing is exempted in advance, D-02 diagnostics included: a difference is RULED only when notes/divergence-rulings.json, a JSON list the main session writes on the operator's ruling after measurement as FEAT-70 did, holds an entry whose record is that exact id with non-empty by, date and reason; otherwise it is UNRULED. The divergence lines for measurement records must be exactly the differences recomputed from the two committed measurement files; the T-03 verify recomputes them. cli_identity and replay_identity are PASS only when the records align and every difference is RULED. This comparison paragraph, together with the required stream keys under Measurement files, the audit_scanned_files derivation under Audit and the build-divergences.md entry format above, is normative for both feat2581-cleanpin.py and the T-03 verify. Where the two compute a different divergence set, payload or audit count from the same committed measurement files, the one that departs from this text has a bug: fix it and regenerate the receipt from the same measurements with feat2581-cleanpin.py --reuse. Such a drift is never a divergence record, never put to the operator for a ruling, and never a reason to re-measure at a new pin.

      Commit notes/receipt-scripts, notes/measurements, clean-pin-byte-receipts.generated.md, clean-pin-byte-receipts.md, build-divergences.md and divergence-rulings.json only after the pin exists. The generated receipt holds exactly one implementation_pin line with the full SHA; one line baseline: e12381fde910eb05728004476a10d741d6918010; one line checkout_root: baseline <absolute path> and one checkout_root: pin <absolute path>, the bytes the comparison replaced; one line script_sha256: <repository-relative path> <sha256> for each of the six receipt scripts, six distinct paths; the baseline_failing, case_set, gate_captures, d02_item, d02_item_record and audit_scanned_files lines above; one line divergence: <record id> RULED or divergence: <record id> UNRULED per difference of every kind (baseline#, cases#, d02#, cli, gate, replay and audit); and the lines grade_bar, unit_files, integration_files, case_identity, cli_identity, replay_identity, d02_inventory, canonical_reader_audit and overall, each PASS or FAIL, overall PASS only when every other line is PASS. Every receipt names both SHAs, detached checkout paths and clean status, exact commands, timestamps and raw and normalized hashes.

      Binding to the review: the verify reads every receipt, measurement file, ruling file and receipt script through git show at feature.json review_sha once pin-review has written a full SHA there, else at HEAD, and requires baseline, implementation pin, receipt commit, that ref and HEAD to be in ancestor order with no path outside this feature's directory changed between the implementation pin and either the ref or HEAD. The reviewer reads the receipt and measurements the same way, git show <review_sha>:<path>. Any later commit that changes a path outside this feature's directory invalidates the receipts: re-measure at a new pin.
