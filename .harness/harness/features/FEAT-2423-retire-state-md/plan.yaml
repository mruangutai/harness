    python3 - <<'PY'
    import re, subprocess, sys
    p = subprocess.run(['git', 'grep', '-n', '-I', '-E', r'INV-(2|5)([^0-9]|$)|INV-([0-9]+/)+(2|5)([^0-9]|$)|INV-[0-9]+\.\.[0-9]+', '--', '.claude/skills/harness/bin', 'tests', ':(exclude)tests/integration/fixtures/prior-*', ':(exclude)tests/integration/test-check-state-table.py'], capture_output=True, text=True)
    def names(text):
        if re.search(r'INV-(2|5)([^0-9]|$)|INV-([0-9]+/)+(2|5)([^0-9]|$)', text):
            return True
        return any(int(lo) <= n <= int(hi) for lo, hi in re.findall(r'INV-([0-9]+)\.\.([0-9]+)', text) for n in (2, 5))
    hits = [h for h in p.stdout.splitlines() if names(h.split(':', 2)[2])]
    retired = [h for h in hits if re.match(r'\.claude/skills/harness/bin/check_state/table\.py:[0-9]+:\s+"INV-(2|5)": "DEC-129 ', h)]
    live = [h for h in hits if h not in retired]
    print('git grep exit', p.returncode, p.stderr.strip(), 'retired', len(retired), 'live', len(live), *live, sep='\n'); sys.exit(2 if p.returncode not in (0, 1) else 0 if not live and len(retired) == 2 else 1)
    PY
