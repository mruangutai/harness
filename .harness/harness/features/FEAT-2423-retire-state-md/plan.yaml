decisions:
- id: D-01
  choice: 'Retire STATE.md outright: the orchestrator reads plan.yaml status and approval.status, feature.json runs (the open run is the PENDING entry) and the latest accepted run digest''s open_questions with handed answers notes; no replacement file and no feature.json field. The latest accepted run digest is runs/<run-id>/digest.md of the last feature.json runs entry that is closed (its verdict is not PENDING) and not refused (it carries no refusal mapping and no legacy return_disposition: refused); a BLOCKED verdict without either marker is accepted. When no entry qualifies, no digest has been accepted: record that as none accepted, never as an accepted digest with no open questions. A refused return is skipped by its refusal marker (feature_record/runs.py _is_refused, DEC-156), never by its BLOCKED verdict.'
  because: 12 of the 15 newest copies were stale while plan.yaml said done, main-session-direct features have no reader, and a second status channel drifts.
  dec: DEC-129
- id: D-02
  choice: INV-2 and INV-5 retire into check_state RETIRED with their numbers never reused; INV-23 keeps its number for feature.json and CLAUDE.md; INV-2 is not retargeted to a feature.json-without-BRIEF rule.
  because: Both read only the retired file; a retarget is a new gate outside this scope, at the accepted cost that a feature directory lacking BRIEF.md is no longer flagged.
  dec: DEC-129
- id: D-03
  choice: DEC-45 is struck with its heading and strike record kept rather than deleted, and its logs/ separation rule survives only in SPEC section 2.4.
  because: Operator ruling keeps citations resolving, and the logs half of DEC-45 is not contradicted by this feature.
  dec: DEC-188
