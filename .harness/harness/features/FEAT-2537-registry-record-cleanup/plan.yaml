decisions:
  - id: D-01
    choice: The registry reads and writes version 2 only; a version-1 persona-keyed file, and any other non-v2 object including the empty object, is refused as unreadable by strict readers and folded to empty with a warning by locked writers.
    because: an unreadable or unknown registry must never read as no claims, no writer produces v1 and the census found none, and the rejected alternative of keeping the migration arm preserves a silent no-claims answer for a shape nothing writes.
    dec: DEC-204
  - id: D-02
    choice: The held-child read is exact-parent live_claims alone; live_children and its dispatcher-persona selection are deleted, and their tests are deleted or re-driven rather than migrated.
    because: live_children has no production caller, selects on a different axis than the production gate and mutates disk, so migrating its tests would duplicate case 19b or assert what a strict reader cannot do.
    dec: DEC-199
