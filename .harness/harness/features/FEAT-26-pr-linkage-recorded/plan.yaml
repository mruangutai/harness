  - id: T-05
    title: Add INV-28, the invariant that a shipped feature with no recorded pull request is visible
    traces: [REQ-04]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out - check-state.sh is a gate script the harness never
      executes changes to, and its fixture is kept in the same hand so red-first is provable
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/check-state.sh
      - .claude/skills/harness/bin/test-check-state.py
    verify: |
      out=$(python3 .claude/skills/harness/bin/test-check-state.py 2>&1) || { printf '%s\n' "$out"; exit 1; }
      printf '%s\n' "$out" | grep -q '^ok - INV-28 warns on a Done feature whose pr is null$' || exit 1
      printf '%s\n' "$out" | grep -q '^ok - INV-28 is silent on a Done feature whose pr is an integer$' || exit 1
      printf '%s\n' "$out" | grep -q '^ok - INV-28 is silent on an Abandoned feature whose pr is null$' || exit 1
      printf '%s\n' "$out" | grep -q '^ok - INV-28 is silent on a feature that is not terminal$' || exit 1
      printf '%s\n' "$out" | grep -q '^ok - INV-28 names each offending feature on its own line$' || exit 1
      printf '%s\n' "$out" | grep -q '^ok - INV-28 is silent when github.sync is off$' || exit 1
      echo VERIFY-OK
    intent: |
      Make a missing pull request number visible instead of silent, at warn level.

      In .claude/skills/harness/bin/check-state.sh add a new invariant block, numbered INV-28
      (INV-27 is the highest in the file today). Model it on the INV-21 block - the per-feature
      glob loop over the feature.json files, its parse guard, and its warn-level append - and
      place it after INV-24's block so the file's blocks stay in a readable order.

      Gate the whole block on `github.sync` being true in harness.json, exactly as INV-21's block
      opens - a repository with no mirror configured has no pull requests to record, and the
      remedy this invariant names needs a working gh. The gate is decided here rather than left
      to the doer: INV-21's shape implies it and the wording below does not, and two readings of
      one instruction is the gap this sentence closes.

      What it checks, for each feature.json under the features glob:
      - Read the document. If it does not parse, append the same shape of message INV-21 uses,
        naming INV-28 as the check that could not run for that feature, and move to the next.
      - If the top-level `status` is not exactly the string `Done`, say nothing. `Abandoned` is
        terminal but asserts no seam was crossed and shipped no pull request, so it is silent
        here, and so is every non-terminal status.
      - If the top-level `pr` is an int and not a bool, say nothing.
      - Otherwise append ONE warn line naming that feature by id, saying its pull request number
        was never recorded, and naming the remedy command:
          gh-sync.py record-pr <feature-dir>
        One line per offending feature, appended inside the loop. A single summary line counting
        offenders is wrong: a per-feature check that reports one aggregate line cannot tell the
        operator which feature to fix, and a count is satisfied without naming the last one.

      Warn, never violation: the GitHub mirror never gates a flow (INV-21's own recorded reason),
      and pull request linkage is bookkeeping rather than correctness. Do not change any existing
      invariant, do not renumber anything, and do not change check-state.sh's exit behaviour.

      In .claude/skills/harness/bin/test-check-state.py add six cases in the file's existing
      style. That suite prints `ok - <label>` per passing case and carries its verdict in the
      exit code rather than a summary line, so the LABELS must be exactly these strings, with no
      prefix and no suffix, because the task's verify matches whole lines:

        INV-28 warns on a Done feature whose pr is null
        INV-28 is silent on a Done feature whose pr is an integer
        INV-28 is silent on an Abandoned feature whose pr is null
        INV-28 is silent on a feature that is not terminal
        INV-28 names each offending feature on its own line
        INV-28 is silent when github.sync is off

      The names-each case builds a fixture tree holding TWO offending features and one conforming
      one, and asserts a line naming each offender individually - a count of warn lines does not
      satisfy it. The sync-off case reuses the same offending fixture and only flips the config,
      so a pass proves the gate rather than an empty tree.

      RED FIRST, and this one is the operator's own hands: write the six cases first, run
      test-check-state.py against the unmodified check-state.sh, and record which of them fail
      there - the cases asserting a warn APPEARS must fail, and a silence case may pass early
      against a file that has no INV-28 at all, which is not evidence of anything. Then add the
      block and confirm all six pass. This task is executed
      directly, never dispatched to a squad; both files are named in DEC-174's carve-out or kept
      beside it.

