  - id: T-07
    title: Record the new subcommands and the source_issues key where an author will look for them
    traces: [REQ-02, REQ-03, REQ-06]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for both the templates directory
      and the playbook
    depends_on: [T-03, T-04]
    status: done
    files:
      - .claude/skills/harness/templates/plan.yaml
      - .claude/skills/harness/SKILL.md
    verify: |
      grep -q '^source_issues:' .claude/skills/harness/templates/plan.yaml || exit 1
      grep -q 'record-pr' .claude/skills/harness/SKILL.md || exit 1
      grep -q 'gh-sync.py closes' .claude/skills/harness/SKILL.md || exit 1
      grep -q 'source_issues' .claude/skills/harness/SKILL.md || exit 1
      # The stale sentence wraps across two lines, so a line-oriented grep can never match it
      # and could never fail. Read the file whole and collapse every run of whitespace first.
      python3 -c "import re,sys; t=re.sub(r'\s+',' ',open('.claude/skills/harness/SKILL.md').read()); sys.exit(1 if 'composes no issue-closing text into any pull request body' in t else 0)" || exit 1
      python3 -c "import yaml,sys; d=yaml.safe_load(open('.claude/skills/harness/templates/plan.yaml')); sys.exit(0 if 'source_issues' in d else 1)" || exit 1
      echo VERIFY-OK
    intent: |
      Two files, so the next author writes the field without being told.

      In .claude/skills/harness/templates/plan.yaml, add a top-level `source_issues:` key
      directly under the `feature:` line, with a short comment above it in the file's existing
      voice: the GitHub issue numbers this feature was planned from, a list of bare integers,
      written by pm at plan time and signed with the plan; gh-sync.py open mirrors them into
      feature.json, and gh-sync.py closes renders them as the pull request body's closing
      keywords. Say that an empty list is legal for a feature planned from no ticket. Keep the
      template's own placeholder style - the value in the template is an example, not real data.

      In .claude/skills/harness/SKILL.md, in the table of gh-sync subcommands and their owners,
      add two rows in the table's existing voice:
      - `gh-sync.py record-pr <feature-dir> [--pr N]`, owner main session, when: after the pull
        request has merged - derives the number from the recorded branch when that branch carries
        exactly one merged pull request, leaves it alone otherwise, and never overwrites a number
        already recorded. Note that `ship` runs it too, so the ordinary flow needs no separate
        call.
      - `gh-sync.py closes <feature-dir>`, owner main session, when: composing the pull request
        body - prints one `Closes #N` line per issue number recorded in feature.json's
        `github.source_issues`, makes no GitHub call, and posts nothing. Name the
        `source_issues` key explicitly in this row and say where it comes from: pm writes it as
        a top-level list in plan.yaml, the operator signs it, and `open` mirrors it.

      Then correct the paragraph a few lines below the table which today reads "the harness
      composes no issue-closing text into any pull request body". That sentence becomes false the
      moment `closes` exists, and this repository strikes falsified statements rather than
      leaving them standing. Replace it with the true statement: the harness DERIVES the closing
      keywords from the source tickets recorded in feature.json and prints them for the operator,
      who opens the pull request and pastes them; it never opens the pull request, never posts
      the text, and never closes a source ticket itself. The verify for this task asserts the old
      sentence is gone as well as that the new rows are present.

      Keep the file within its 80-line-per-CLAUDE.md discipline where that applies - SKILL.md has
      no such budget, but say it in the fewest lines that carry the rule.

  - id: T-08
    title: Record the decision that the mirror now reads one fact back into execution state
    traces: [REQ-01, REQ-02]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: [T-03, T-04, T-05]
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
      - .harness/harness/docs/DECISIONS-INDEX.md
    verify: |
      grep -q '^## DEC-200 ' .harness/harness/docs/DECISIONS.md || exit 1
      grep -q '^- DEC-200 @' .harness/harness/docs/DECISIONS-INDEX.md || exit 1
      python3 - <<'PY' || exit 1
      import re, sys
      idx = open(".harness/harness/docs/DECISIONS-INDEX.md").read()
      row = [l for l in idx.splitlines() if l.startswith("- DEC-200 ")]
      if len(row) != 1:
          print("expected exactly one DEC-200 row, found", len(row)); sys.exit(1)
      m = re.match(r"- DEC-200 @(\d+) ", row[0])
      if not m:
          print("DEC-200 row carries no line anchor:", row[0]); sys.exit(1)
      lines = open(".harness/harness/docs/DECISIONS.md").read().splitlines()
      n = int(m.group(1))
      if not (1 <= n <= len(lines)) or not lines[n - 1].startswith("## DEC-200 "):
          print("anchor", n, "does not land on the DEC-200 heading"); sys.exit(1)
      print("ok DEC-200 row and anchor agree")
      PY
      echo VERIFY-OK
    intent: |
      Write the entry a future reader will need when they find the mirror reading from GitHub.

      Append a new entry `## DEC-200` to .harness/harness/docs/DECISIONS.md, in the file's
      established voice and length, and add its one-row summary to
      .harness/harness/docs/DECISIONS-INDEX.md in the index's exact row format, with the line
      anchor pointing at the new heading. Use the index's generator if this repository has one
      rather than hand-writing the anchor.

      What the entry must record, because these are the parts a later reader will otherwise
      re-litigate:

      - The pull request number is derived at ship time from the branch already recorded, by one
        query on that head, and written only when exactly one merged pull request is found. The
        rejected alternative is recording it when the pull request is opened, rejected because
        the opening seat is the user's under DEC-153, so open-time recording still depends on a
        human remembering.
      - Exactly one, not first match: one branch in this repository's own history carries two
        merged pull requests.
      - This is the mirror reading ONE fact back from GitHub. DEC-138 made the mirror write-only
        so that a wiki-editable surface could not feed an approval-gated artifact. That guarantee
        is intact: `pr` lives in feature.json, which is execution state and carries no approval
        block, and nothing read back reaches BRIEF.md or plan.yaml. Say that plainly, because the
        write-only phrase is what a future reader will remember.
      - The source tickets live in the signed plan.yaml as `source_issues` and are mirrored into
        feature.json's github block. The plan is the truth; feature.json is the mirror; a re-plan
        that changes them is picked up by re-running open.
      - The closing keywords are rendered for the operator and never posted, under DEC-138
        amendment 6, and no source ticket is ever closed by the harness, under DEC-196.
      - All eleven previously null features were backfilled rather than grandfathered, because
        every one mapped to a merged pull request; four of them took a number the operator
        confirmed from the pull request titles because their branch could not resolve.
      - The new invariant is warn level, following INV-21's recorded reason that the mirror never
        gates a flow.

      Do not restate the implementation. Carry the rule and one clause of why, as DEC-158
      requires.
