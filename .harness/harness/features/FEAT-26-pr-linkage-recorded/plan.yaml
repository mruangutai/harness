      printf '%s\n' "$out" | grep -q '^ok    record-pr writes the number when the branch has exactly one merged PR' || exit 1
      printf '%s\n' "$out" | grep -q '^ok    record-pr leaves pr null when the branch has no merged PR' || exit 1
      printf '%s\n' "$out" | grep -q '^ok    record-pr leaves pr null when the branch has two merged PRs' || exit 1
      printf '%s\n' "$out" | grep -q '^ok    record-pr never overwrites a pr that is already an integer' || exit 1
      printf '%s\n' "$out" | grep -q '^ok    record-pr --pr writes the number given without querying' || exit 1
      printf '%s\n' "$out" | grep -q '^ok    ship records the pr and then the status' || exit 1
      printf '%s\n' "$out" | grep -q '^ok    record-pr exits 0 on every branch case' || exit 1
      printf '%s\n' "$out" | grep -q 'ALL PASSED' || exit 1
      echo VERIFY-OK
    intent: |
      Give the pull request number a seat that does not depend on anyone remembering it.

      In .claude/skills/harness/bin/gh-sync.py add `_record_pr(feat_dir, repo, pr_arg=None)`:

      - Read feature.json with json.load. Absent, unreadable or not a mapping: print one line and
        return, exactly as _record_status does. This function NEVER creates a document.
      - If the document's top-level `pr` is already an int and not a bool, print one line naming
        the recorded number and return. It is never overwritten, on any path, including when
        pr_arg is given and differs. Idempotence is what makes the backfill re-runnable.
      - If pr_arg is not None, use int(pr_arg) as the number and skip the query entirely.
      - Otherwise read the document's `branch`. If it is missing, not a string, or the literal
        string "none", print one line saying the branch is unset and return.
      - Otherwise query, once:
          gh pr list --repo <repo> --head <branch> --state merged --limit 10 --json number
        Parse the JSON array. Exactly one element: that element's `number` is the value. Zero
        elements: print one line saying no merged pull request was found on that head, and
        return without writing. Two or more: print one line naming every number found and saying
        the branch is ambiguous, and return without writing. A gh failure or unparseable output
        is the same shape as zero - one printed line, no write.
      - Write by setting the top-level `pr` and calling _atomic_write on the whole document, the
        same shape _record_status uses. Print one line naming the feature and the number.
      - Every path returns normally and the process exits 0. Never die, never skip the caller's
        remaining work: the mirror never gates a flow.

      Exactly one is the rule, not first-match: the branch feat/harness-native-foundation carries
      two merged pull requests, 15 and 4, so a first-match rule records the wrong one.

      Wire it up two ways:
      - `cmd_ship` calls `_record_pr(feat_dir, repo, pr_arg)` immediately BEFORE its final
        `_record_status(feat_dir, "Done")` call. That final status write must remain the last
        statement of the successful path - the file's own docstrings at cmd_ship and cmd_abandon
        make that structural property explicit, so put the pr call above it, not after.
      - A new subcommand `record-pr <feature-dir> [--pr N]` in main(), dispatched like the
        existing ones, calling `_record_pr(feat_dir, repo, pr_arg)` and nothing else. Add
        `record-pr` to the usage string, and parse `--pr <n>` alongside the existing --parent,
        --reason-file and --body-file flags, dying with a message when its value is missing.
        `--pr` is accepted by `record-pr` and by `ship`.

      In .claude/skills/harness/bin/test-gh-sync.py add seven cases in the file's existing style,
      driving the fake gh the suite already installs, with exactly these check names:

        record-pr writes the number when the branch has exactly one merged PR
        record-pr leaves pr null when the branch has no merged PR
        record-pr leaves pr null when the branch has two merged PRs
        record-pr never overwrites a pr that is already an integer
        record-pr --pr writes the number given without querying
        ship records the pr and then the status
        record-pr exits 0 on every branch case

      The two-merged-PRs case must have the fake gh return two numbers, and must assert that pr
      is still null afterwards - not merely that some line was printed. The never-overwrites case
      must have the fake gh return a DIFFERENT number from the one on disk, so a fixture that
      would pass by coincidence cannot. The exits-0 case asserts returncode 0 for the one, zero
      and two cases together.

      RED FIRST: run all seven against the unmodified gh-sync.py first and confirm each fails.

      Do not touch gh_board.py or load_board. Do not add a harness.json key.

