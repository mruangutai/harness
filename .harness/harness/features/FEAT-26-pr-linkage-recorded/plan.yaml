decisions:
  - id: D-01
    choice: The pull request number is DERIVED at ship time from the branch already recorded in
      feature.json, by one gh pr list query on that head, and is never typed by a caller
    because: the seat that opens a PR is the user's under DEC-153, so recording at open time still
      depends on a human remembering to run a command
    dec: DEC-153

  - id: D-02
    choice: Derivation writes only when the branch resolves to EXACTLY ONE merged pull request,
      leaving pr unchanged and printing one line on zero or on more than one
    because: the branch feat/harness-native-foundation really does carry two merged PRs, so a
      first-match rule would silently record the wrong one
    dec: none

  - id: D-03
    choice: The source tickets live in plan.yaml as a top-level source_issues list and are mirrored
      into feature.json github.source_issues by gh-sync.py open
    because: the operator names the tickets at plan time and signs them there, while the code that
      needs them runs at ship time, so the value must already be durable when it runs
    dec: DEC-138

  - id: D-04
    choice: The closing keywords are RENDERED to stdout for the operator's pull request body; the
      harness never posts them and never closes a source ticket
    because: DEC-138 amendment 6 forbids the mirror composing its own text at post time and DEC-196
      limits closing to cards the harness created
    dec: DEC-196

  - id: D-05
    choice: All eleven null features are backfilled and none is grandfathered; the four whose branch
      does not resolve take an operator-confirmed number at signature
    because: every one of the eleven maps to a merged pull request, so a boundary would preserve a
      gap that measurement shows is closable, and the new invariant can then be clean on day one
    dec: none

  - id: D-06
    choice: The new invariant is warn level, not violation level
    because: INV-21 set the precedent that the GitHub mirror never gates a flow, and PR linkage is
      bookkeeping rather than correctness
    dec: DEC-138

  - id: D-07
    choice: save_recorded refuses to write when feature.json is absent instead of starting from an
      empty document
    because: a document holding only a github key fails the schema's eight required keys, and
      _record_status in the same file already refuses for exactly that reason
    dec: DEC-191

  - id: D-08
    choice: An absent or empty source_issues list is legal and silent everywhere - the renderer
      emits nothing at exit 0 and no invariant mentions it
    because: features planned before this mechanism existed carry none, and a feature can genuinely
      be planned from no ticket
    dec: none

