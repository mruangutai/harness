decisions:
  - id: D-01
    choice: The factory dispatcher writes a `HARNESS-REPOSITORY` locator beside `HARNESS-FEATURE`, carrying the owner-qualified repository from its factory claim; dispatch-guard validates both locators against that claim, the fleet, and the repository-tier feature artifact before recording a claim.
    because: A feature id can exist under multiple product segments, while cwd and ordinary prompt prose are not authority. The repository header is only a locator into independently validated factory state.
    dec: none
  - id: D-02
    choice: A governed factory-product dispatch creates a repository-bound claim before spawn, binds the dispatch to the host-provided parent runtime id in the trusted task hook, and authorizes the child only when OMP supplies a matching child id and immediate-parent id. No bearer token, prompt secret, caller-authored runtime id, or post-completion task result participates in write authority.
    because: The pinned OMP runtime now propagates project extensions to children and supplies immutable child and immediate-parent lineage at every child callback, so authority can remain host-derived from the first governed mutation.
    dec: DEC-204
  - id: D-03
    choice: Both guard routes call one shared repository-and-runtime-lineage decision after target classification. Repository metadata and target classification remain in completed T-01; dispatch claim creation, trusted lineage binding, guard wiring, and enforcement tests are main-session-direct under DEC-174.
    because: Duplicate lineage or repository comparators would drift, while DEC-189 requires one target-side two-base classification and DEC-174 keeps the active enforcement path outside the mechanism it enforces.
    dec: DEC-189
  - id: D-04
    choice: A factory-product target requires the host-provided child and immediate-parent ids to resolve exactly one active claim with the same repository, feature, role, expiry, and release state. Missing lineage, unknown or mismatched identity, stale or released claim, cross-repository/feature/role state, unreadable registry, and ambiguity refuse with exit 2 and no wildcard fallback.
    because: Exact host-derived lineage preserves concurrent same-role and nested work without transporting a reusable credential or trusting prompt content.
    dec: DEC-218
  - id: D-05
    choice: Keep `check-domain.py --resolve` ahead of runtime-lineage payload processing and repository-binding lookup.
    because: DEC-179 makes it a plan-time ownership resolver, not a dispatch authorization check.
    dec: DEC-179
  - id: D-06
    choice: Keep DEC-218 claim-set worktree membership for self-development and checkout liveness separate from factory repository authority.
    because: Agents may work independently in separate worktrees within one declared product without crossing repository boundaries.
    dec: DEC-218

