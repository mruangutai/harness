decisions:
  - id: D-01
    choice: When apply or add-tasks merges a proposal that adds tasks onto a station-only record (station_only true, empty tasks) whose station is not finished, and the proposal does not itself carry station_only, the writer converts the record in the same locked write - it drops the station_only key, seeds approval status pending when the base has no approval mapping, and stamps drafted_at from its own UTC clock when the base has none. A finished-station record (done, abandoned, rejected) is still refused with exit 5.
    because: The loader pair stays intact (FEAT-41 MF-3 and HIGH-1), and a record that only lost its marker would read to INV-3 as a plan with no approval block and would escape DEC-254's decisions_affected check for lack of a drafted_at stamp. Rejected alternatives - relaxing _validate_station_only (reopens HIGH-1), a set-key route that nulls station_only (the same forgery route HIGH-1 closed, and it leaves approval and drafted_at unseeded), a separate convert verb (a second route pm must know to call), and not firing INV-34 before the first plan run (operator put INV-34 timing out of scope).
    dec: DEC-254
  - id: D-02
    choice: validate-digest ranks a plan-team reader member's FAIL as PASS only in a harness-product-lead digest with team plan for a feature whose feature.json records mission plan, and only for that exact member entry. The digest must carry exactly one member per reader step; a finding is attributed to the member whose step or persona equals its reader, persona spellings compared through digest_schema.canonical_persona; each team-digest finding attributed to the member must match exactly one plan.yaml panel.findings row by recomputed PF id, that row carrying the same reader string and disposition exactly resolved, and every other on-disk row attributed to the member must be exactly resolved too. A finding that matches no member or more than one, a duplicated reader step or a malformed panel row denies the carve-out to every reader in that digest, and only a raw FAIL is ever re-ranked.
    because: Observed reader values differ across runs (code-reviewer and should-not-exist in BUG-2566, harness-code-reviewer in BUG-2565), so attribution tolerates spellings; but panel_findings.finding_id hashes the exact reader string, so the matched row must carry that string, and checking presence and disposition separately let a stale id on another member's row stand in for the failing reader's own record (plan c1 scope finding 3). Keying relief by step let a duplicated step re-rank a second member, even one at ESCALATE (scope finding 2). Rejected alternatives - trusting the lead's statement, requiring every panel finding resolved (holds one reader's FAIL on another reader's open info finding), tying through the panel.readers slot alone (findings do not carry the slot), and case-folding the disposition (accepts a value the writer refuses).
    dec: DEC-123

  - id: D-03
    choice: The plan team's apply step, after record-panel and before check, runs plan-merge.py set-panel marking resolved exactly the findings whose remedy pm applied in that step, with resolved_by naming the task that carries the remedy where one exists; a scope mission finding, a finding pm did not remedy and every earlier disposition stay as they are.
    because: record-panel writes every new finding open and the shipped apply prompt never resolved one, so without this step D-02 has no trigger and Destination 2 is not delivered (plan c1 should-not-exist finding and scope OQ-1). The resolution is pm's own record of its own apply, the trust the BRIEF discloses; sign-approval and INV-32 already read resolved the same way. Rejected alternatives - record-panel writing resolved itself (it cannot know what was applied), the lead resolving findings (it does not apply them), and deferring D-02 with its docs (leaves Destination 2 undelivered).
    dec: DEC-228
  - id: D-04
    choice: No dispatch-guard change. A station-only record written through plan-merge.py apply, the route INV-34 prescribes, is created by _seed_new_plan with approval status pending and a drafted_at stamp, so _plan_preflight already admits the product plan lead on it; a hand-written record without approval stays refused for every plan-panel start, as at base.
    because: Measured at e6960865 with the private-bin dispatch fixture of tests/integration/test-lead-start-return.py - an apply-written stub starts the product lead, the validator lead and the scope reader, and a hand-written stub with no approval refuses all three (notes/research-plan-c1-apply.md). Scope finding 1 held only for the hand-written shape. Rejected alternatives - a guard allowance for a non-finished station-only record (widens an enforcement surface for a shape the remedy never produces) and an explicit approval block in INV-34's stub text (_seed_new_plan refuses a creating proposal that carries approval, exit 8).
    dec: none

