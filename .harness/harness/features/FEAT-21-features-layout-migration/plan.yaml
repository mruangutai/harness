          print('\n'.join(stale)); sys.exit(1)
      assert '".harness", "*", "features"' in vf, 'validate-feature-json.py glob has no segment'
      shown = [l for l in vf.splitlines() if 'print(' in l or 'scanning' in l]
      assert any('.harness/*/features/' in l for l in shown), \
          'the scanning line does not name the migrated path'
      tg = open(b + 'test-gh-sync.py', encoding='utf-8').read()
      assert 'migrated_depth' in tg, 'no case named for the migrated depth was added'
      assert 'not_onboarded' in tg, 'no case named for the un-onboarded fallback was added'
      tv = open(b + 'test-validate-feature-json.py', encoding='utf-8').read()
      k = tv.find('migrated_depth')  # the case's own body, not the whole file - see intent
      m = re.search(r'^def ', tv[k:], re.M) if k >= 0 else None
      if k < 0 or tv[k:(k + m.start()) if m else len(tv)].count('.harness/*/features/') != 1:
          print('test-validate-feature-json.py: no migrated_depth case, or its body does not name .harness/*/features/ exactly once'); sys.exit(1)
      wf = open('.github/workflows/tests.yml', encoding='utf-8').read()
