      here. The verify fails on any line carrying BOTH print( and .harness/features/ , then requires
      exactly two lines carrying print( and .harness/*/features/ . That pair discriminates the two
      message sites from the narrative comments, which say "prints" or "printed" but never contain
      print( . Measured at 62fef85: the file carries the legacy literal on six lines, four of them
      comments (anchored by content, not by number - the module docstring's wildcard-segment example,
