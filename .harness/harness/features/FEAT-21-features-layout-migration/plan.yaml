    intent: |
      Two mechanisms resolve the control plane by ARITHMETIC over the path depth rather than by any
      literal a sweep can find, so both go silently green after the move and neither is visible to
      the detector, which is forbidden from reading them. D-07 pulls both forward from unit 9 for
      that reason. Both are behaviour-testable mid-sequence, because both suites build their own
      temporary trees and depend on no real file - which is why this task, unlike T-02 through T-08,
      runs its tests rather than only checking form.

      GROUP 1 - gh-sync.py. It derives the repository root as
      os.path.abspath(os.path.join(feat_dir, "..", "..", "..")), which is correct for
      .harness/features/<FEAT> and lands on <repo>/.harness for .harness/harness/features/<FEAT>.
      load_config then finds no harness.json and calls skip(), which its own docstring describes as
      "Environmental no-go: one loud line, exit 0. The mirror never gates" - so open, start-task,
      close-task, abandon, ship and backlog all print a SKIP and succeed while mirroring nothing.

      DO NOT FIX THIS BY CHANGING THE DEPTH. A fourth ".." is correct for this repository and wrong
      for the fixtures, which stage <tmp>/.harness/features/<FEAT> with harness.json at
      <tmp>/.harness/ - so a depth-only fix reddens test-gh-sync.py for a brand-new reason inside the
      atomic commit. Replace the arithmetic with a derivation that is depth-agnostic: walk UP from
      the absolute feature directory and return the first ancestor holding .harness/harness.json ,
      falling back to today's behaviour only if no ancestor does, so a genuinely un-onboarded tree
      still reaches skip() with the message it prints today. Walking up satisfies both depths at
      once: from <tmp>/.harness/features/<FEAT> the first such ancestor is <tmp>, and from
      <repo>/.harness/harness/features/<FEAT> it is <repo>. Line 122's
      os.path.join(root, ".harness", "harness.json") is correct as written and does not move.

      Then ADD one case to test-gh-sync.py - additive, changing no existing fixture - that stages a
      feature at <tmp>/.harness/<seg>/features/<FEAT> with harness.json still at <tmp>/.harness/ and
      asserts the root resolves to <tmp> rather than skipping. Without it the walk-up ships unproven:
      the existing fixtures stay green under BOTH the bug and the fix, because they only ever
      reproduce the legacy depth. Put the string migrated_depth in the case label - the verify greps
      for it, and a case running under a label nobody can find is a case that silently stops running.

      ADD A SECOND CASE, also additive, for the FALLBACK BRANCH - the one the walk-up takes when no
      ancestor holds .harness/harness.json. Nothing exercises it today: every existing fixture
      writes harness.json before any run, so the walk-up always finds a root and the fallback is
      preserved by construction rather than by evidence. Stage a feature directory in a tmp tree
      with NO harness.json anywhere above it, run a mirror command against it, and assert that it
      reaches skip() - the not-onboarded outcome, asserted on the SKIP text the command prints
      today, taken from gh-sync.py rather than invented. Label it with the string not_onboarded;
      the verify greps for that too. If the walk-up is implemented so that it cannot reach the
      fallback at all from a tmp tree, say so in the receipt rather than weakening the case.

      GROUP 2 - validate-feature-json.py. discover_paths() globs
      os.path.join(root, ".harness", "features", "*", "feature.*") and, by the comment directly
      beneath it, KEEPS EXIT 0 on zero matches - deliberately, so a legitimate zero-feature checkout
      is not a failure. After the move that glob matches nothing here, and the CI step "Validate every
      feature's execution state" - which the workflow's own comment names as the backstop for a
      session where check-domain.sh's write-time gate is not registered at all - becomes a green tick
      over zero files. Give the glob a wildcard repository segment: .harness/*/features/*/feature.* .

      Three further sites in the same file must move with it, or the fix repeats the defect T-04
      exists to close - a scan that discovers under one shape while telling the operator it searched
      another:
        - the scanning line printed to stderr, which names the pattern it globbed;
        - the module docstring's sentence describing what the no-argument sweep globs, which is
          present-tense normative rather than historical;
        - any other line in the file carrying the legacy literal. The verify fails on every one of
          them and requires the scanning line to name the migrated path, so there is no partial pass.

      Then ADD one case to test-validate-feature-json.py - again additive - that builds a tmp tree at
      <tmp>/.harness/<seg>/features/<FEAT>/feature.json , runs the CLI with CLAUDE_PROJECT_DIR set to
      <tmp> and no arguments, and asserts the scan reports one file rather than zero. Label it with
      migrated_depth. This is the only assertion in the plan that proves the CI backstop still
      examines anything; a form check cannot, because zero matches and a correct empty tree print the
      same exit code.

      That case already reads the CLI's stderr, so give it ONE MORE CONJUNCT: assert that the
      scanning line names the migrated shape .harness/*/features/ . It is nearly free, it is exactly
      parallel to the conjunct T-06 adds to case_22a_unreadable_feature_dir_exits_2, and it is what
      makes SC-14 true as written rather than resting the validator's scan line on this task's own
      source-form check. The verify enforces that conjunct and is REGION-ANCHORED to the case's own
      body - from the first occurrence of migrated_depth to the next top-level def - because GROUP 3
      below re-anchors this file's module docstring to the same migrated shape, and the docstring
      sits above every def, so a whole-file grep would go green on the docstring edit plus a bare
      label. Starting the region at migrated_depth is what excludes the docstring. Inside that
      slice the shape must appear exactly once, so the clause reds on a missing conjunct and on a
      deleted one alike, and it reds with a readable message rather than a traceback if the label
      is absent altogether.

      GROUP 3 - the two stale texts that describe this task's own work, one in each remaining file.

        test-validate-feature-json.py, module docstring: it says nothing here "reads, writes or
        depends on any real file under .harness/features/*/." Re-anchor that path to
        .harness/*/features/*/ . It is the file's own independence claim, so it must name the layout
        it is independent of. KNOWING SURVIVOR, do not touch it: the string
        ".harness/features/FEAT-99-x/feature.json" in the display-path case is a synthetic argument
        passed to problems_for_text and is never resolved against the filesystem, so it is
        self-consistent fixture text. The verify's absence check is written narrowly enough to let it
        stand.

        .github/workflows/tests.yml, TWO present-tense reader-facing texts. First, the comment above
        the step "Validate feature execution state", which tells a CI reader the sweep globs
        .harness/features/*/feature.{json,yaml,yml} - the very glob this task moves. Re-anchor it to
        .harness/*/features/*/feature.{json,yaml,yml} and keep the comment at its current line count.
        Second, the operator-facing error string in the plan-route step, which today ends "Check
        CLAUDE_PROJECT_DIR and .harness/features/." - re-anchor it to .harness/*/features/. and
        change nothing else in that sentence.

        THE M-IS-ASSERTED COMMENT BLOCK - one carve-out, stated exactly, because this block is both
        a knowing survivor and the one place in the file that gains a further edit.

        Its three legacy path literals are KNOWING SURVIVORS and do NOT move: they name the paths
        the measurement was taken against, so they stay true as taken - the same rule T-04 applies
        to check-plan-routes.py's four historical comments. What DOES change is the block's
        undated, present-tense NUMBERS, one of which has already drifted: the ls-files command it
        quotes returns 19 at 62fef85, not 8. It returned 8 at eafc8ad, where the comment was
        written; plan files have accumulated since. Post-move it returns something different again,
        so an undated figure here is unfalsifiable and already wrong.

        Make exactly these three verbatim substitutions, anchored on the content strings and never
        on line numbers. Each sits inside a wrapped # comment, so rewrap as needed and keep every
        line's # prefix:
          - "Not a live hole today:" becomes "Not a live hole as of 62fef85, pre-move:"
          - "all 8 plan files are git-tracked" becomes "all 19 plan files are git-tracked"
          - "Both halves measured, not assumed:" becomes
            "Both halves measured at 62fef85, pre-move, not assumed:"
        The third one is what carries the sha anchor onto BOTH quoted commands - the ls-files count
        and the check-ignore exit - which is the whole requirement. The first two move the count in
        both of the places it appears; moving only one leaves the block contradicting itself two
        sentences apart.

        Do NOT re-measure either command yourself. T-10 may run after T-08 has moved the tree, and
        a figure re-taken post-move under a pre-move label is precisely the defect this edit closes.
        The numbers above were measured at 62fef85 with the tree unmoved and are quoted here so
        this is a pure text substitution.

        Change nothing else in this file - no step name, no env: block; inside that run: block only
        the path text of that one message, and inside the M-is-asserted block only the three
        substitutions above. The verify re-parses the workflow as YAML, because an edit inside a
        block scalar is the one that can break it.

      THE COMMIT SHAPE, stated identically wherever this plan states it: exactly one commit carrying
      T-02 through T-08, T-10 and T-09; T-01 is its own earlier commit. This task is inside that one
      commit. It depends only on T-01 and may be done at any point after it; T-09 is what commits.

