      THE DEPTH SWEEP, into that same note, under a heading containing the words "depth sweep" - the
      verify greps for it. Three of this feature's findings were mechanisms that resolve a feature
      path and carry NO .harness/features/ literal at all: a fixed climb of "..", a comma-joined
      tuple, a join over a root variable. A literal sweep cannot see them, and neither can the
      detector, whose stated residual bound is per-file form agreement rather than per-site
      completeness - so the sweep that finds them is for PATH-DEPTH ARITHMETIC, run alongside the
      literal one. Run it once over .claude/skills/harness/bin/ and record, in the note, the command
      you ran, the hits it returned, and for each hit whether it resolves a control-plane path or is
      unrelated. Patterns worth running at minimum: a chain of two or more ".." inside an
      os.path.join; any join whose second element is a literal ".harness"; and any comma-joined tuple
      containing "features". Units 4 through 7 face the same shape, so the value of this note is that
      the next unit inherits a worked example instead of rediscovering the class.

      THE COMMIT SHAPE, stated identically wherever this plan states it: exactly one commit carrying
      T-02 through T-08, T-10 and T-09; T-01 is its own earlier commit. This task is T-09, and it is
      the only task that commits the cluster. Splitting them
      leaves a landed tree where either every write is denied or the shape gate is silently off,
