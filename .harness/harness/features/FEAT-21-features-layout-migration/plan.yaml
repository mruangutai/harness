    verify: |
      set -e
      python3 - <<'PY'
      import re, sys
      b = '.claude/skills/harness/bin/'
      gs = open(b + 'gh-sync.py', encoding='utf-8').read()
      assert 'os.path.join(feat_dir, "..", "..", "..")' not in gs, \
