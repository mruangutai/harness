decisions:
  - id: D-01
    choice: >-
      Grants, globs and regexes take a WILDCARD repository segment
      (.harness/*/features/... and .harness/[^/]+/features/...), never a hardcoded harness segment.
      Prose instructions, which must name a path an agent can actually write, take the literal
      .harness/harness/features/... .
    because: >-
      team-config.yaml is one global file (issue 346), so a hardcoded segment grows a line per
      repository forever in a hand-edited shared file, and harness_boundary.glob_to_re supports no
      placeholder. Accepted cost, recorded rather than argued away - until unit 7's agent_id
      mechanism lands, a write into an undeclared segment is grantable; the layout buys locality
      and per-repo resolution, not write isolation.
    dec: none
  - id: D-02
    choice: >-
      The atomic commit is WIDER than the five-item cluster issue 344 named. It also carries the
      test suites pinned to the old path, the guard-enforced instruction paths in agents, skills,
      team definitions and the harness command, branch-create-gate.sh, this repository's own
      .gitignore, the three path-depth resolvers pulled forward by D-07 - test-factory-cli.py,
      gh-sync.py and validate-feature-json.py - and the one CI comment that describes the sweep
      D-07 pulls forward, in .github/workflows/tests.yml. In task terms, stated identically
      wherever this plan states it: exactly one commit carrying T-02 through T-08, T-10 and T-09;
      T-01 is its own earlier commit.
    because: >-
      Each of those is enforced by the same grants or globs that move, or resolves a feature path by
      arithmetic over the same depth. Leave the suites and the landed commit is red; leave the
      instruction paths and every doer's own bookkeeping write is denied at the next dispatch; leave
      branch-create-gate.sh and no branch can be created for any feature; leave .gitignore and every
      run directory becomes untracked, which halts a team run on a dirty tree; leave
      test-factory-cli.py and the unit suite dies on import; leave gh-sync.py and every GitHub
      mirror command succeeds while doing nothing; leave validate-feature-json.py and the CI schema
      backstop ticks green over zero files.
    dec: none
  - id: D-03
    choice: >-
      The blame and cause parity test of issue 387 lands FIRST, as its own commit, before anything
      moves.
    because: >-
      This feature makes the detector's rendered finding a stop condition at two call sites, and the
      validator recommended pinning that seam before unit 3 leans on it. It is test-only and touches
      no file the move touches, so it costs the atomic commit nothing.
    dec: none
  - id: D-04
    choice: >-
      Issue 356 is NOT folded in. Only its two literals that name .harness/features/ are re-anchored
      here, as move-coupling. The ticket stays open and whole.
    because: >-
      Its defect is that a relative path in prose resolves against the agent's working directory,
      which in a factory workspace is not the control plane - orthogonal to which literal the prose
      names. Its own closing comment records the design as unruled on three counts, and no factory
      worker has ever run, so nothing regresses by deferring it. Folding an unruled design into an
      atomic migration commit is how a reviewable diff stops being reviewable.
    dec: none
  - id: D-05
    choice: >-
      .claude/skills/harness-init/SKILL.md and everything under .claude/skills/harness/templates/
      KEEP the legacy .harness/features/ literal, unchanged.
    because: >-
      Both describe a path inside the tree being ONBOARDED, not inside harness's control plane, and
      an onboarded product's own .harness/ does not move in this unit. Neither is in the detector's
      reader table, so neither reddens it. Recorded because a scan for surviving literals will
      re-suggest them.
    dec: none
  - id: D-06
    choice: Every task in this feature is main-session-direct. No squad is dispatched.
    because: >-
      Two of DEC-174's four named carve-out scripts are in the cluster, layout_migration.py is one
      by content, and every remaining surface resolves to NOBODY. The cost, stated rather than
      argued away - the whole feature is built by hand and no team-lane review runs over it; the
      compensating control is the human reading one diff, which is the same control DEC-174 exists
      to preserve.
    dec: DEC-174
  - id: D-07
    choice: >-
      gh-sync.py's root derivation and validate-feature-json.py's discovery glob are PULLED FORWARD
      out of unit 9 into this atomic commit, alongside test-factory-cli.py's module-scope plan read.
      The rest of unit 9 - factory_claim.py, templates/gitignore.snippet, merge-gitignore.sh and
      informational prose - stays in unit 9 and is untouched here, with ONE named exception: the
      comment in .github/workflows/tests.yml that describes what the pulled-forward
      validate-feature-json.py sweep globs. That comment is informational prose by form, but it
      describes the very step this decision moves, so leaving it behind would tell a CI reader the
      sweep globs a path nothing occupies - the defect class T-04 and T-10 exist to close, one file
      over. It rides here, in T-10.
    because: >-
      Map 336 files the first two under unit 9 "anytime", which is a DEPENDENCY-ORDER claim rather
      than a prohibition, and this plan already applied the override test once when it pulled
      branch-create-gate.sh forward for hard-blocking post-move. That test selects for LOUD, but the
      BRIEF's own severity ordering says SILENT is worse, and both of these are silent. Measured at
      62fef85 - gh-sync.py:729 derives root as feat_dir/../../.., which post-move resolves to
      <repo>/.harness, load_config finds no harness.json and takes skip(), documented at gh-sync.py
      lines 72-75 as "one loud line, exit 0. The mirror never gates", so all six mirror commands
      succeed while doing nothing; validate-feature-json.py:41 globs the legacy path and keeps exit
      0 on zero matches by its own comment, so the CI backstop - the step named "Validate feature
      execution state" in .github/workflows/tests.yml, the only backstop for a write-time gate that
      is not registered - becomes a green tick over zero files.
      test-factory-cli.py is not a judgement call at all - it opens a real feature's plan.yaml at
      module scope and is in UNIT_SCRIPTS, so post-move the whole unit suite dies on import and
      T-09's own suite check fails. The cost is diff size, not correctness - measured at 62fef85,
      none of the three is a row in layout_migration.READER_TABLE (lines 74-101, whose four features
      rows are team-config.yaml, check-domain.sh, check-plan-routes.py and check-state.sh), so the
      detector reads none of them either way and none reddens it at any commit. Two of the three,
      gh-sync.py and validate-feature-json.py, are ADDITIONALLY on the module's explicit
      DO-NOT-READ list at lines 42-44; test-factory-cli.py is NOT on that list and does not need to
      be, because the list constrains only which files a row may name.
    dec: none
  - id: D-08
    choice: >-
      check-state.sh's feature dictionaries KEEP keying on the bare directory basename. Only the
      finding LABEL gains its repository segment, built from the discovered path rather than from
      the key. The key-collision defect proper is deferred to unit 5 or unit 8.
    because: >-
      Once discovery globs a segment, two repositories holding a same-named feature directory
      collapse last-write-wins - and DEC-133 coins ids per-BRIEF with no cross-repo uniqueness rule
      while every onboarded repo starts at FEAT-01, so the collision is likely rather than exotic.
      It cannot fire at this feature's landed commit, because one repository exists. Qualifying the
      KEY is the tempting fix and is the one measured hazard here - check-state.sh derives the
      feature name in two different shapes, os.path.basename(os.path.dirname(p)) at ten sites and
      os.path.basename(_fp) at the station-mirror site whose lookup is plan_docs.get(_feat). Qualify
      one shape and not the other and every station-mirror check silently continues past every
      feature - a fail-open of exactly the class this feature exists to prevent, introduced inside
      an already-large atomic commit for a defect that cannot yet fire. The label change carries the
      operator benefit at none of that risk, and it is what T-05 already promised.
    dec: DEC-133

tasks:
  - id: T-01
    title: Pin the blame and cause parity between the CI and session-entry renderings
    traces: [REQ-06]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "co-changes with layout_migration.py, a DEC-174 carve-out by content (FEAT-20 D-02)"
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/test-layout-migration.py
    verify: |
      u=$(mktemp); ru=0
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit >"$u" 2>&1 || ru=$?
      grep -q '^PASS test-layout-migration\.py$' "$u" || { echo "the layout suite did not run"; cat "$u"; exit 1; }
      grep -qi 'parity' "$u" || { echo "no parity case ran"; cat "$u"; exit 1; }
      exit "$ru"
    intent: |
      Close issue 387. Nothing today asserts that layout_migration.render (the CI rendering) and the
      INV-27 rendering consumed by check-state.sh name the same reader set and the same cause for
      the same input. That seam produced two divergences on 2026-08-14 and the fix that followed
      changed the policy without adding a test, so a third divergence would be equally silent.

      Add cases to test-layout-migration.py that construct SurfaceReport values directly - do not go
      through a fixture tree - and compare the two renderings for the same input. Read
      layout_migration.py first and use whatever the two call sites actually consume today: both
      were converted to a shared blame_text/cause_text pair, so the parity surface is one function
      pair. Cover, at minimum: a MIXED report naming two readers with different formsets; a
      CANNOT_VERIFY report for each cause value the module defines, including the one that carries
      detail; and a CLEAN report. For each, assert that the set of reader paths named by one
      rendering equals the set named by the other, and that the cause token is the same in both.

      Name at least one case with the word parity in its case label - the verify greps for it, and a
      case that runs under a label nobody can find is a case that silently stops running.

      This task lands as its OWN COMMIT, before anything moves. It touches no file the migration
      touches.

      THEN, WITH THAT COMMIT LANDED, capture the PRE-MOVE boundary state - this is the only moment in
      the sequence at which it can be captured, because from T-02 onward the working tree is half
      edited. Run and save the verbatim output of both, together with git rev-parse HEAD, to a
      scratch file T-09 will read:
        python3 .claude/skills/harness/bin/layout_migration.py
        bash .claude/skills/harness/bin/check-state.sh
      The detector must print features: CLEAN with evidence legacy, docs: CLEAN with evidence legacy,
      and a summary of 0 mixed, 0 cannot-verify; check-state.sh must exit 0 emitting no INV-27 line at
      all. If either is not true, STOP: the base has drifted and this plan's audits were taken against
      a different tree.

  - id: T-02
    title: Move the write grants in team-config.yaml onto a wildcard repository segment
    traces: [REQ-02, REQ-04]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: "check-domain.sh --resolve answers NOBODY at 62fef85"
    depends_on: [T-01]
    status: done
    files:
      - .harness/team-config.yaml
    verify: |
      python3 - <<'PY'
      import re, sys
      t = open('.harness/team-config.yaml', encoding='utf-8').read()
      bad = [l for l in t.splitlines() if re.search(r'\.harness/features/', l)]
      if bad:
          print('legacy form survives on %d line(s):' % len(bad)); print('\n'.join(bad[:5])); sys.exit(1)
      if not re.search(r'\.harness/\*/features/', t):
          print('migrated form absent - a deletion would also pass the check above'); sys.exit(1)
      import subprocess
      subprocess.run([sys.executable, '-c',
                      'import yaml,sys; yaml.safe_load(open(".harness/team-config.yaml", encoding="utf-8"))'],
                     check=True)
      print('OK')
      PY
    intent: |
      Rewrite every occurrence of the literal .harness/features/ in .harness/team-config.yaml to
      .harness/*/features/ - a wildcard repository segment, per D-01, never a hardcoded harness.

      THE ROW AUDIT, re-taken at 62fef85 so a later editor can re-run it. The detector's reader-table
      row for this file has legacy pattern \.harness/features/ and migrated pattern
      \.harness/[^/ ]+/features/ . At 62fef85:
        git grep -c '\.harness/features/' 62fef85 -- .harness/team-config.yaml  ->  43
        git grep -c '\.harness/features'  62fef85 -- .harness/team-config.yaml  ->  43
      The broader pattern adds no line, so the narrow pattern names every stale site and there is no
      prose-only occurrence to exclude. All 43 are grant paths or the paths block.

      Every one of the 43 is in scope, including the three that are easy to miss:
        - the main_session.writes list, whose entries carry a section suffix after the path
          (BRIEF.md ## Approval and PLAN.md ## Approval);
        - the orchestrator domain's bare .harness/features/** entry, whose failure is in the literal
          prefix and not in the wildcard;
        - the paths block key features: .harness/features/ . Issue 344 verified that NO SCRIPT READS
          this key - it is decorative - but the detector matches whole text, so a stale value here
          holds the file MIXED and reddens the landed commit.

      Do not widen any grant to accept both shapes. The gate moves with the files; a grant that
      accepts the old path as well is a gate that never notices a stale writer.

      Leave .claude/skills/harness/templates/team-config.yaml alone (D-05).

  - id: T-03
    title: Move check-domain.sh's sweep globs and its four shape regexes onto a repository segment
    traces: [REQ-02]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out named in CLAUDE.md"
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/check-domain.sh
    verify: |
      set -e
      python3 - <<'PY'
      import re, sys
      p = '.claude/skills/harness/bin/check-domain.sh'
      t = open(p, encoding='utf-8').read()
      bad = [l for l in t.splitlines() if re.search(r'\.harness/features/', l)]
      if bad:
          print('legacy form survives on %d line(s):' % len(bad)); print('\n'.join(bad)); sys.exit(1)
      if len(re.findall(r"\.harness/\*/features/", t)) != 4:
          print('expected 4 migrated SWEEP_GLOBS entries'); sys.exit(1)
      if len(re.findall(r"\\\.harness/\[\^/\]\+/features/", t)) != 4:
          print('expected 4 migrated shape regexes'); sys.exit(1)
      print('OK')
      PY
      bash -n .claude/skills/harness/bin/check-domain.sh
    intent: |
      Rewrite the eight stale sites in check-domain.sh onto a wildcard repository segment (D-01).

      THE ROW AUDIT, re-taken at 62fef85. The detector's row for this file has legacy pattern
      \.harness/features/ and migrated pattern \.harness/(\*|\[\^/\]\+)/features/ - it accepts
      either the glob spelling or the regex spelling, because this file carries both. At 62fef85:
        git grep -c '\.harness/features/' 62fef85 -- .../check-domain.sh  ->  8
        git grep -c 'features'           62fef85 -- .../check-domain.sh  ->  8
      The broader pattern adds nothing: there is no prose occurrence in this file, and all eight
      sites are code. They are, by content rather than by line number:

        SWEEP_GLOBS (four array entries):
          ".harness/features/*/feature.json"
          ".harness/features/*/runs/*/state.yaml"
          ".harness/features/*/notes/handoff-*.md"
          ".harness/features/*/STATE.md"
        the four anchored shape regexes:
          RE_FEATURE_JSON  ^\.harness/features/[^/]+/feature\.json$
          RE_STATE_YAML    ^\.harness/features/[^/]+/runs/[^/]+/state\.yaml$
          RE_HANDOFF       ^\.harness/features/[^/]+/notes/handoff-[a-z0-9-]+\.md$
          RE_STATE_MD      ^\.harness/features/[^/]+/STATE\.md$

      Give the four globs the segment as *, so .harness/*/features/... . Give the four regexes the
      segment as [^/]+, so ^\.harness/[^/]+/features/[^/]+/... . The existing [^/]+ groups are
      anchored and by construction cannot cross a path segment, which is why they are rewritten
      rather than adjusted.

      These regexes are the SILENT half of the failure: if they stop matching, the feature.json
      budget, the state.yaml key vocabulary and the STATE.md and handoff budgets all stop being
      enforced with no error, while the sweep still advances the shape-sweep stamp as if the tree
      were clean. T-09 is what proves they still fire.

  - id: T-04
    title: Move check-plan-routes.py's feature discovery onto a repository segment
    traces: [REQ-02]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "carve-out by content - it is the CI plan-route gate and shells out to check-domain.sh --resolve"
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/check-plan-routes.py
    verify: |
      set -e
      python3 - <<'PY'
      import re, sys
      p = '.claude/skills/harness/bin/check-plan-routes.py'
      t = open(p, encoding='utf-8').read()
      if re.search(r'"\.harness", "features"', t):
          print('legacy discovery join survives'); sys.exit(1)
      if not re.search(r'"\.harness", [^,)]+, "features"', t):
          print('migrated discovery join absent'); sys.exit(1)
      lines = t.splitlines()
      stale = [l for l in lines if 'print(' in l and '.harness/features/' in l]
      if stale:
          print('a diagnostic message still names the pre-move path on %d line(s):' % len(stale))
          print('\n'.join(stale)); sys.exit(1)
      shown = [l for l in lines if 'print(' in l and '.harness/*/features/' in l]
      if len(shown) != 2:
          print('expected exactly 2 message lines naming the migrated path, found %d' % len(shown))
          print('\n'.join(shown)); sys.exit(1)
      print('OK')
      PY
      python3 -c "import py_compile; py_compile.compile('.claude/skills/harness/bin/check-plan-routes.py', doraise=True)"
      python3 .claude/skills/harness/bin/check-plan-routes.py --help >/dev/null 2>&1 || true
    intent: |
      Rewrite check-plan-routes.py's feature discovery so it finds plans under a repository segment.

      THE ROW AUDIT, re-taken at 62fef85. The detector's row for this file is CODE-SHAPED: legacy
      pattern "\.harness", "features" and migrated pattern "\.harness", [^,)]+, "features" . At
      62fef85 the narrow pattern matches exactly ONE site:
        feats = os.path.join(root, ".harness", "features")
      The broader pattern os\.path\.join\(root, "\.harness" adds exactly one further line - the
      team-config.yaml root probe, os.path.join(root, ".harness", "team-config.yaml") - which is not
      a features site and must NOT be touched. So the narrow pattern names every stale site.

      Change the discovery so that instead of scanning one level under .harness/features it scans
      one level under each repository segment: build the root as
      os.path.join(root, ".harness", "*", "features") and enumerate through glob, keeping the
      existing per-feature-directory logic unchanged. The discovery must still count what it will
