  - id: T-05
    title: Move check-state.sh's fifteen feature-discovery sites onto a repository segment
    traces: [REQ-02]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out named in CLAUDE.md - the state gate"
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/check-state.sh
    verify: |
      set -e
      python3 - <<'PY'
      import re, sys
      p = '.claude/skills/harness/bin/check-state.sh'
      t = open(p, encoding='utf-8').read()
      bad = re.findall(r'.*os\.path\.join\(H, "features".*', t)
      if bad:
          print('legacy discovery form survives at %d site(s):' % len(bad)); print('\n'.join(bad)); sys.exit(1)
      if not re.search(r'os\.path\.join\(H, [^,)]+, "features"', t):
          print('migrated discovery form absent'); sys.exit(1)
      print('OK')
      PY
      bash -n .claude/skills/harness/bin/check-state.sh
    intent: |
      Rewrite every feature-discovery site in check-state.sh so it finds features under a repository
      segment. This is the highest-value silent failure in the repository: if these sites stop
      matching, INV-8, INV-12, INV-15, INV-17, INV-18 and INV-26, the budgets and the station mirror
      all evaluate over an empty set and the gate that session entry runs reports a healthy tree.

      THE ROW AUDIT, re-taken at 62fef85. The detector's row for this file has legacy pattern
      os\.path\.join\(H, "features" and migrated pattern os\.path\.join\(H, [^,)]+, "features" . At
      62fef85:
        git grep -c 'os\.path\.join(H, "features"' 62fef85 -- .../check-state.sh  ->  15
        git grep -c 'join(H,'                      62fef85 -- .../check-state.sh  ->  23
      The broader pattern adds exactly eight lines, and every one of them joins a SIBLING of
      features - harness.json three times, codebase four times, factory/fleet.yaml once. None is a
      features site and none moves in this unit. So the narrow pattern names every stale site, all
      fifteen of them.

      Anchor your edits on CODE FRAGMENTS, never on line numbers - this file is edited often and an
      ordinal rots within a cycle. The fifteen sites are, by the fragment each contains:

        glob sites, one per artifact kind:
          "features", "*", "BRIEF.md"
          "features", "*", "PLAN.md"
          "features", "*", "plan.yaml"
          "features", "*", "STATE.md"
          "features", "*", "feature.json"   - FIVE separate sites carry this fragment
          "features", "*", "runs"
          "features", "*", "runs", "*", "state.yaml"
          "features", "*"                   - the trailing bare enumeration
        and the two that carry NO trailing wildcard segment, which are the ones a narrower pattern
        would have missed:
          os.listdir(os.path.join(H, "features"))  - guarded by an isdir test on the same line
          os.path.join(H, "features", _f, "feature.json")  - inside that listdir loop

      Convert every glob site to carry the segment as a wildcard: os.path.join(H, "*", "features",
      ...). Convert the listdir pair: it enumerates feature directory NAMES, so replace it with a
      glob over os.path.join(H, "*", "features", "*") and derive the name with os.path.basename,
      keeping the isdir guard and keeping the loop's ordering stable with sorted(). Its inner
      feature.json join must then be built from the directory path the glob returned, never
      re-joined from H and a bare name.

      THE FINDING LABEL, and the one thing you must NOT do to the keys (D-08). Every finding today
      identifies a feature by a bare directory name, and most build a path from it - "FEAT-21/
      BRIEF.md". Under a segment that string names no file on disk and, once a second repository
      lands, does not say which repository is meant. So: where a finding names a path, build the
      label FROM THE DISCOVERED PATH - the segment-qualified relative path the glob returned - so a
      reader can open exactly what the finding names. Where a finding names a feature and not a
      path, leave it as the bare name.

      Do NOT put the segment into the DICTIONARY KEYS. The dicts stay keyed on the bare basename.
      The reason is measured, not stylistic: this file derives the feature name in TWO different
      shapes - os.path.basename(os.path.dirname(p)) at ten sites, and os.path.basename of the
      feature directory itself at the station-mirror site, whose next line is a plan_docs.get()
      lookup. Qualify one shape and not the other and that lookup misses for every feature, the
      loop continues past all of them, and the station mirror silently checks nothing at exit 0 -
      a fail-open of exactly the class this unit exists to remove. The cross-repository key
      collision is real and deferred to unit 5 or unit 8, where a second repository actually lands;
      it cannot fire here, because one repository exists.

      NAMED COST: label changes may break exact-match assertions in test-check-state.py. T-06 opens
      that file anyway. Its substring-style assertions - the ones checking that a feature name
      appears somewhere in a finding line - are tolerant of a segment prefix and need no change;
      only an assertion comparing a whole finding line does. Fix those in T-06, not here.

