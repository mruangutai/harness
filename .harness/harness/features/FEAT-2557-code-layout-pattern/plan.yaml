      Edit two files and nothing else.

      A. .claude/skills/harness-codebase-design/SKILL.md. Insert a new section headed exactly "## Layout — where a split lands" between "## Reader load — the two axes" and "## Applying it". It is language-neutral, for every repository Harness builds: no bin/, no .py, no __init__, no Harness path or script name. In a few bullets or short paragraphs it states each of these rules, in this order:
      - Split where reads diverge: a file grown past one thing to say splits at the seam where its functions' reads diverge, in the same change; cite harness-craft's delete-first leaf (Put it where its inputs are) as the trigger, without restating it.
      - The entry stays put and thin: the file callers invoke keeps its path and does parse and dispatch only, no logic.
      - The package is the entry's twin: one package named for the entry, never flat siblings sharing a prefix.
      - Modules are named for what their functions read, never by subject or by kind (utils, helpers, common); short nouns the package path completes.
      - One home per domain: a domain lives in one module, never two.
      - A split moves code without changing it; callers migrate in the same change; no re-export shim.
      - Size is judged in review, never capped: no line limit, no ratchet.
      Keep it compact (about 150 words): every agent that autoloads this skill pays for it on every spawn.

      B. In the same file's "## Applying it", add one bullet after the code-reviewer stage-two bullet: for eng-lead at architecture review and code-reviewer at stage two, flat prefixed siblings, subject or kind module names, an entry that kept logic, two homes for one domain, and a re-export shim are findings (each with its concrete failure scenario, per harness-code-review); in the Harness control plane, also judge a bin/ change against the layout entry in AGENTS.md's project map. Do not edit the frontmatter or any other section.

      C. AGENTS.md. In "## Project map" add one table row, What "Code layout of Harness bin/ (entry plus package)", Where .claude/skills/harness/bin/LAYOUT.md in backticks, placed after the Remaining build ledger row. In "## Conventions" add one bullet, first in the list, reading exactly:
      - Before writing code, read the harness-codebase-design skill and, for Harness `bin/`, the layout entry in the project map.
      The LAYOUT.md path appears in AGENTS.md exactly once, in the map row; the Conventions bullet names no location.

      Decided at plan: harness-craft/references/delete-first.md gains no pointer to the new section. The section's own citation of delete-first makes the link, and that leaf already sends readers to harness-codebase-design twice (its Flatten and consolidate bullet and its closing line), a skill eight seats preload; a section-level pointer would be a second home for the same link (the grilling's one Not yet specified item). Do not edit it. change_type is docs: prose only, so no test kind is required (harness.json test_matrix.docs).
