      HARNESS-FEATURE: FEAT-2557-code-layout-pattern. Main session, directly, under the operator's INV-32 ruling .harness/harness/features/FEAT-2557-code-layout-pattern/notes/answers-2026-11-27-inv32.md: this patch is one task over five files, built in the order of steps 1, 2 and 3 below. PRODUCT checkout is Harness itself, the feature worktree /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2557-code-layout-pattern; every relative path below is inside it and every edit stays inside it. It ships no docs/spec.md, docs/decisions.md or docs/architecture.md; report that absence and do not create them. Authority read: DECISIONS-INDEX.md, then DECISIONS.md DEC-149, DEC-158, DEC-202, DEC-205, DEC-235, and DEC-255 and DEC-258 as the format model for step 3; this feature's BRIEF.md and plan.yaml decision D-01; the binding grilling .harness/notes/grilling-code-layout-pattern-2026-11-27.md in the main checkout /Users/molchairuangutai/GitHub/harness, read-only, whose Settled wording governs; delete-first.md in harness-craft/references for the split bullet the new section cites. Provenance for step 3 is readable from git: the FEAT-69 grilling via git show d8b139de:.harness/notes/grilling-long-file-check-state-package-2026-09-28.md, FEAT-69 commit 0e03dad4 and FEAT-70 commit a98451c5, FEAT-71's removal a41f7cfc.

      Edit these five files and nothing else: .claude/skills/harness/bin/LAYOUT.md, .claude/skills/harness-codebase-design/SKILL.md, AGENTS.md, .harness/harness/docs/DECISIONS.md and .harness/harness/docs/DECISIONS-INDEX.md.

      Step 1, first: LAYOUT.md. Create one new file, .claude/skills/harness/bin/LAYOUT.md. It is a layout note for Harness bin/, never a script catalogue (each script's docstring already says what it does). Content, in this order and nothing more:
      1. A level-one title naming the layout of bin/, and one scope line: this file says how a bin/ script splits into an entry and a package; the language-neutral rule (where a split lands, how modules are named) is the Layout section of the harness-codebase-design skill, which this file does not restate.
      2. A two-column Markdown table headed Entry and Package with exactly two rows: check-state.py to check_state/, and plan-merge.py to plan_merge/. No size, line-count or any third column: sizes rot and read as a target.
      3. Naming: the entry keeps its hyphenated name and path because callers, hooks and tests invoke it by path; the package takes the importable underscore name of the entry; its __init__.py is empty.
      4. The entry: keeps its module docstring and its bootstrap, puts its own directory on sys.path, and imports from the package what it dispatches (plan-merge.py inserts its directory and imports cmd_ functions from plan_merge modules, for example). The entry parses and dispatches; logic lives in the package.
      5. Flat modules: a flat bin/ module that serves one package's domain moves into that package; only cross-cutting modules that many entries share stay flat, for example harness_boundary.py and harness_merge.py.
      Do not include: an "A split" section, any size, line-count or grade-bar rule (harness-code-risk-grading covers grading), the DEC-174 splitting carve-out (AGENTS.md covers it), test forking, scanners following the code, FEAT ids or other provenance (that lives in DEC-259). Avoid the words lines, size and grade anywhere in the file, because the verify refuses them. Name only files that exist in bin/. No markdown links.

      Step 2, after step 1 has written LAYOUT.md: the skill and AGENTS.md.

      A. .claude/skills/harness-codebase-design/SKILL.md. Insert a new section headed exactly "## Layout — where a split lands" between "## Reader load — the two axes" and "## Applying it". It is language-neutral, for every repository Harness builds: no bin/, no .py, no __init__, no Harness path or script name. In a few bullets or short paragraphs it states each of these rules, in this order:
      - Split where reads diverge: a file grown past one thing to say splits at the seam where its functions' reads diverge, in the same change; cite harness-craft's delete-first leaf (Put it where its inputs are) as the trigger, without restating it.
      - The entry stays put and thin: the file callers invoke keeps its path and does parse and dispatch only, no logic.
      - The package is the entry's twin: one package named for the entry, never flat siblings sharing a prefix.
      - Modules are named for what their functions read, never by subject or by kind (utils, helpers, common); short nouns the package path completes.
      - One home per domain: a domain lives in one module, never two.
      - A split moves code without changing it; callers migrate in the same change; no re-export shim.
      - Size is judged in review, never capped: no line limit, no ratchet.
      Keep it compact (about 150 words): every agent that autoloads this skill pays for it on every spawn.

      B. In the same file's "## Applying it", add one bullet after the code-reviewer stage-two bullet: for eng-lead at architecture review and code-reviewer at stage two, flat prefixed siblings, subject or kind module names, an entry that kept logic, two homes for one domain, and a re-export shim are findings (each with its concrete failure scenario, per harness-code-review); in the Harness control plane, also judge a bin/ change against the layout entry in AGENTS.md's project map. Do not edit the frontmatter or any other section.

      C. AGENTS.md. In "## Project map" add one table row, What "Code layout of Harness bin/ (entry plus package)", Where .claude/skills/harness/bin/LAYOUT.md in backticks, placed after the Remaining build ledger row. In "## Conventions" add one bullet, first in the list, reading exactly:
      - Before writing code, read the harness-codebase-design skill and, for Harness `bin/`, the layout entry in the project map.
      The LAYOUT.md path appears in AGENTS.md exactly once, in the map row; the Conventions bullet names no location.

      Decided at plan: harness-craft/references/delete-first.md gains no pointer to the new section. The section's own citation of delete-first makes the link, and that leaf already sends readers to harness-codebase-design twice (its Flatten and consolidate bullet and its closing line), a skill eight seats preload; a section-level pointer would be a second home for the same link (the grilling's one Not yet specified item). Do not edit it.

      Step 3, last, after steps 1 and 2 have landed: DEC-259 and the index. Read the landed step 1 and step 2 text first (harness-codebase-design SKILL.md Layout section and Applying it bullet, .claude/skills/harness/bin/LAYOUT.md, the AGENTS.md map row and Conventions bullet).

      Number. Append one entry after DEC-258 as DEC-259. If DECISIONS.md already carries a DEC-259 heading when this step starts, stop and report the collision for plan amendment; never overwrite it or choose another number silently.

      Heading, level two: "DEC-259 — A long file splits into a thin entry over its twin package, modules named by what they read; review enforces it, no lint". Body in Chose / Over / Because / Tradeoff accepted / Record shape, citing symbols and paths, never file:line anchors (check-decision-anchors.py refuses them). It states current truth (DEC-205):
      Chose: a long file splits where its functions' reads diverge; the entry keeps its path and only parses and dispatches; the code moves into one twin package, never flat prefixed siblings; modules are named for what their functions read, never by subject or kind; one home per domain; a split moves code unchanged, migrates callers in the same change, keeps no re-export shim; size is judged in review, never capped. The rule lives in harness-codebase-design's Layout section (language-neutral, every repository Harness builds) with its review findings in that skill's Applying it; the Harness Python mechanics live in .claude/skills/harness/bin/LAYOUT.md (hyphenated entry, underscore package with an empty __init__.py, entry inserts its directory on sys.path and imports what it dispatches, flat modules serving one package move into it, cross-cutting ones such as harness_boundary.py stay flat), reached from the AGENTS.md project map and a pathless Conventions bullet.
      Over: a lint, length cap or ratchet (no evidence the prose fails; FEAT-69's prose-first ruling); flat check_state_ style prefixed siblings; utils, helpers or common modules; putting the rule in harness-digest-dev (the dev return contract, DEC-126) or only in AGENTS.md (the main session loads no autoloaded skills, specialists never see AGENTS.md); a size column in LAYOUT.md (sizes rot and read as a target); a script catalogue in LAYOUT.md (every script's docstring already says what it does).
      Because: FEAT-69 split check-state.py into check_state/ and FEAT-70 split plan-merge.py into plan_merge/ in this shape; the convention's only full record, the FEAT-69 grilling note, was removed by FEAT-71, leaving delete-first's one split bullet as the sole written rule.
      Tradeoff accepted: enforcement is a reviewer reading a diff; nothing mechanical catches a deviation; test-code layout is not covered.
      Record: FEAT-2557 (#2557), plan.yaml decision D-01; signature line as the main session records it at sign-off, or the approver and date from plan.yaml approval if signed. Refs: DEC-149, DEC-158, DEC-202, DEC-205, DEC-235.

      Index. Regenerate with python3 .claude/skills/harness/bin/gen-decisions-index.py (never hand-edit anchors), then write the DEC-259 row's ruling text after " :: " by hand, one sentence: a long file splits into a thin entry over its twin package with modules named by their reads, enforced by review alone; rule in harness-codebase-design, Harness mechanics in bin/LAYOUT.md. The generator does not produce that tail. Then confirm gen-decisions-index.py --stdout equals the file.

