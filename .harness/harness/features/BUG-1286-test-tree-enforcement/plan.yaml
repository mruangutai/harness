tasks:
  - id: T-01
    title: Refuse tracked test-shaped files outside the test tree, with its unit coverage written first
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-08]
    change_type: cross_module
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: ready
    files:
      - tests/unit/test-suite-layout.py
      - .claude/skills/harness/bin/suite_layout.py
    verify: |
      python3 tests/unit/test-suite-layout.py && .claude/skills/harness/bin/run-unit-tests.sh --check-layout
    intent: |
      Extend suite_layout.violations(root) so it also refuses every TRACKED test-shaped file outside
      tests/, and write the covering assertions in tests/unit/test-suite-layout.py FIRST, observing
      each of them fail against the current predicate before you change it. Keep every existing
      clause, message string and ordering in the predicate exactly as it is; this work is additive.

      Add these module-level constants to suite_layout.py:
        NAME_PATTERNS = ("test-*", "test_*", "*_test.*", "*.test.*", "probe-*")
        SOURCE_EXTENSIONS = (".py", ".sh", ".ts", ".tsx", ".js", ".mjs", ".cjs")
        DOCUMENTED_EXCEPTIONS = one tuple of (relative_path, reason) pairs, seeded with exactly one
        entry whose path is
        .harness/harness/features/FEAT-44-omp-context-advisory/evidence/probe-session-accessors.ts
        and whose reason states: FEAT-44 evidence, the committed OMP extension that
        tests/manual/probe-omp-session-accessor.py loads; classified as evidence, not a test
        (BUG-1286 D-05).
      A path is test-shaped when fnmatch.fnmatch(basename, pattern) holds for some NAME_PATTERNS
      entry AND os.path.splitext(path)[1] is in SOURCE_EXTENSIONS. Both conditions are required.
      These two constants and the extension restriction govern the NEW repository-wide clause ONLY.
      Do not feed them into the existing under-tests/ clause or the existing bin clause: both keep their
      own globs byte-identical, including the bin clause's deliberately unrestricted probe-* (D-01, D-04),
      which is what keeps a probe-shaped plant under bin refused whatever its extension.

      Add def tracked_paths(root): returns a sorted tuple of POSIX-relative tracked paths. It runs
      git ls-files -z with cwd=root, text=True, timeout=20, splits on NUL and drops empties, and
      raises LookupError with a one-line reason on any of: git missing (FileNotFoundError), non-zero
      exit (use the stderr first line), subprocess.TimeoutExpired, or git rev-parse --show-toplevel
      not resolving via os.path.realpath to the same directory as root. The toplevel comparison is
      required so a fixture root nested inside another checkout can never be scanned against the
      outer index.

      In violations(), after the existing bin clause, run the repository-wide clause only when
      os.path.exists(os.path.join(root, ".git")) is true. Then:
        - call tracked_paths(root); on LookupError append exactly one line
          "cannot enumerate tracked files under {root}: {reason}" and skip every tracked-dependent
          check below (never return clean, never report a partial set);
        - if ".claude/skills/harness/bin/suite_layout.py" is not in the tracked set, the repository
          under scan does not ship this rule: contribute nothing further and do not report a
          violation. This is what keeps a product checkout unaffected;
        - otherwise, for every tracked path that is test-shaped, does not start with "tests/", is not
          already reported by the bin clause — compute that set once as
          {p.relative_to(root).as_posix() for p in set(planted)} and test membership against it,
          never a substring of the bin clause's message, which carries an absolute path — and is not
          an exact DOCUMENTED_EXCEPTIONS path, append
          "tracked test-shaped file outside tests/: {rel}" — iterating the sorted tracked set so the
          output order is stable across runs.
      Registry self-policing, appended after the file findings and sorted by entry path, and running
      whether or not the index is available except where noted:
        - a path containing any of * ? [ -> "documented exception is not an exact path: {rel}"
        - a path listed more than once -> "documented exception is listed twice: {rel}"
        - a path that is not test-shaped, or starts with "tests/" -> "documented exception is
          unnecessary: {rel}"
        - index available and the path absent from the tracked set -> "documented exception is no
          longer tracked: {rel}"
      Every finding is a plain string in the returned list, same as today, and violations() must stay
      importable and side-effect free.

      Unit coverage in tests/unit/test-suite-layout.py, added with the existing check() helper and
      the existing failures list, each case cleaning up its temporary directory:
        1. a real Git fixture: mkdtemp, git init -b main, write .harness/team-config.yaml, create
           tests/unit/test-unit.py, tests/integration/test-integration.py and a legal manual file
           tests/manual/probe-fixture.py, copy this repository's suite_layout.py to
           .claude/skills/harness/bin/suite_layout.py, add a rogue .harness/tools/test_rogue.py,
           git add -A and commit with -c user.email=t@example.com -c user.name=t -q -m fixture; assert
           the rogue path appears in exactly one finding and that finding is the "tracked test-shaped
           file outside tests/" line, and assert SEPARATELY that no finding names
           tests/manual/probe-fixture.py. The probe-*.py shape is the manual shape asserted here and it
           is chosen deliberately: the unchanged under-tests/ clause rglobs test-*.py, test_*.py and
           *_test.py and refuses any match whose parent is not tests/unit or tests/integration, so a
           tests/manual/test-*.py file is refused today and is the wrong shape to plant as legal.
           Then, in this same case and on this same fixture, add the EXACT-EQUALITY assertion that is
           the grader of SC-06's first clause. With suite_layout.DOCUMENTED_EXCEPTIONS temporarily
           rebound to () inside a try/finally — case 6's mechanism, restored in the finally block —
           assert that the returned list is EQUAL to exactly this one-element list:
             ["tracked test-shaped file outside tests/: .harness/tools/test_rogue.py"]
           Write it as equality on the whole returned list. Never `in`, never a containment, membership
           or substring test, and never a length check paired with a membership test: only equality
           proves that the valid tests/unit, tests/integration and tests/manual files, and the copied
           bin module, each contributed NOTHING. Any second element fails the assertion, which is
           exactly the property SC-06 needs.
           The rebinding is REQUIRED for that assertion to be satisfiable and is not bookkeeping: the
           registry self-policing clause above reports "documented exception is no longer tracked:
           {rel}" whenever the index is available and a DOCUMENTED_EXCEPTIONS path is absent from the
           tracked set, and the seeded FEAT-44 path
           .harness/harness/features/FEAT-44-omp-context-advisory/evidence/probe-session-accessors.ts
           is not tracked in this fixture, so the UNREBOUND call returns TWO findings — that staleness
           line and the rogue line — measured on a faithful prototype of this spec against this exact
           fixture. Do NOT instead create and track that FEAT-44 path inside the fixture: that couples
           case 1 to the live registry's contents, which case 7 exists to keep out of every other case.
           Nothing is lost by rebinding, because the registry's own behaviour is graded by cases 6
           and 7 and is not case 1's subject;
        2. the same fixture with the rogue file present but NEVER git added: assert no finding names
           it — this is the tracked-versus-untracked distinction and it must be its own case;
        3. three rogue tracked files in different directories: assert all three are reported and that
           their order in the returned list is the sorted path order, and that a second call returns
           an identical list;
        4. a fixture where .git is replaced by an empty directory: assert exactly one finding starting
           "cannot enumerate tracked files under" and that no tracked-dependent finding is present;
        5. the existing non-git legal_tree(): assert the repository-wide clause contributes nothing
           and the existing four-violation case still returns exactly its four findings;
        6. registry cases on a Git fixture, each by temporarily rebinding
           suite_layout.DOCUMENTED_EXCEPTIONS in a try/finally: a listed tracked rogue path is
           accepted; an entry containing a * is refused as not an exact path; the same path listed
           twice is refused as listed twice; an entry naming a tracked non-test-shaped file is refused
           as unnecessary; an entry naming an untracked path is refused as no longer tracked;
        7. the live registry is load-bearing: read the single entry's path from
           suite_layout.DOCUMENTED_EXCEPTIONS first and assert against that value rather than a
           literal, so a later registry change cannot redden this case; with DOCUMENTED_EXCEPTIONS
           temporarily set to () assert violations(ROOT) contains that path, and with it restored
           assert violations(ROOT) == [];
        8. vocabulary boundary: a tracked .harness/notes/probe-something.md in the Git fixture
           produces no finding, while a tracked .harness/notes/probe-something.py does;
        9. self-ownership is load-bearing in the other direction: a Git fixture built exactly like
           case 1 but WITHOUT .claude/skills/harness/bin/suite_layout.py in its index — do not copy
           the module in; the fixture needs only the two kind directories and the tracked rogue file
           — must produce no "tracked test-shaped file outside tests/" finding at all, which is the
           clause that leaves a checkout not shipping this rule untouched.
      Do not modify .harness/harness.json, run-unit-tests.sh, or any file outside the two named here.
  - id: T-02
    title: Prove the runner presents the refusal before any test sentinel runs
    traces: [REQ-01, REQ-02, REQ-03]
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: ready
    files:
      - tests/integration/test-run-unit-tests-layout.py
    verify: |
      python3 tests/integration/test-run-unit-tests-layout.py
    intent: |
      Add integration coverage to tests/integration/test-run-unit-tests-layout.py for the
      repository-wide clause, driving the real .claude/skills/harness/bin/run-unit-tests.sh through
      the existing tree() and run() helpers. Keep every existing case and its expectations unchanged.

      Add a git_tree() helper that builds tree() and then makes it a real checkout: git init -b main,
      git add -A, and commit with -c user.email=t@example.com -c user.name=t -q -m fixture, so the
      copied .claude/skills/harness/bin/suite_layout.py is tracked at that relative path (the
      predicate requires this to enforce repository-wide, per T-01). Cases:
        1. clean git_tree(): run(r, "--kind", "all") returns 0 and stdout carries both
           "PASS test-unit.py" and "PASS test-integration.py" — the guard costs nothing when clean;
        2. git_tree() with a tracked rogue file: write .harness/tools/test_rogue.py, git add and
           commit it, then run(r, "--kind", "all") and assert ALL THREE of returncode == 2,
           ".harness/tools/test_rogue.py" present in stderr on a line beginning "MISCONFIGURED:",
           and "PASS test-unit.py" NOT present in stdout. The third assertion is the ordering
           guarantee: the refusal must arrive before any sentinel executes, so a run that reported the
           violation after running the suite would fail this case;
        3. same as 2 but with three tracked rogue files in different directories: assert all three
           appear in stderr and that the MISCONFIGURED lines naming them are in sorted path order;
        4. git_tree() with .git replaced by an empty directory: run(r, "--kind", "all") returns 2,
           stderr carries "cannot enumerate tracked files under", and stdout carries no
           "PASS test-" sentinel — enumeration failure is a closed failure at the runner boundary too;
        5. untracked control: git_tree() with the rogue file written but not added returns 0 and runs
           both sentinels.
      Use only subprocess, tempfile, shutil and pathlib as the file already does, keep the per-case
      check() reporting, and do not edit run-unit-tests.sh or suite_layout.py.
  - id: T-03
    title: Add a re-runnable tree-audit census subcommand for any ref
    traces: [REQ-06]
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: ready
    files:
      - tests/manual/suite-census.py
    verify: |
      out=$(python3 tests/manual/suite-census.py tree-audit --ref HEAD) && printf '%s\n' "$out" | grep -q 'probe-session-accessors\.ts.*documented-exception'
    intent: |
      Add a tree-audit subcommand to tests/manual/suite-census.py, registered the same way the
      existing subcommands are (an add_tree_audit_parser function plus its entry in the parser table),
      so the repository audit is an instrument anyone can re-run at a named ref rather than a one-off
      measurement.

      Arguments: --ref, defaulting to HEAD, and --against, an optional path to a Markdown note.
      Import suite_layout by inserting ROOT/.claude/skills/harness/bin at the front of sys.path, and
      take NAME_PATTERNS, SOURCE_EXTENSIONS and DOCUMENTED_EXCEPTIONS from it — never re-declare
      them here, so the audit and the guard can never disagree.

      Enumerate with git ls-tree -r --name-only <ref> run with cwd=ROOT, check=True. Select every
      path whose basename matches a NAME_PATTERNS entry, WITHOUT the extension filter, so records the
      guard deliberately ignores are still measured and dispositioned. For each selected path print
      one row, path then a single tab then the disposition, sorted by path:
        - in-tests-tree      when the path starts with tests/
        - documented-exception when the path is an exact DOCUMENTED_EXCEPTIONS entry
        - out-of-vocabulary  when the extension is not in SOURCE_EXTENSIONS
        - violation          otherwise
      Print the rows inside a fenced text block so the same block can be pasted into a note, then a
      final line "TOTAL <n> OUTSIDE <n> VIOLATIONS <n>" counting selected paths, selected paths not
      under tests/, and violation rows. Exit 1 if any violation row exists, else 0.

      With --against, extract the fenced text block from the given note by reusing the same
      fenced-block pattern baseline() applies at tests/manual/suite-census.py line 24 — a
      triple-backtick fence, an optional text info string, and a lazy dot-all body — but parse each
      extracted line as path then a single tab then disposition. Do NOT call baseline() itself: its
      row regex requires a test-prefixed .py basename followed by an integer, matches no tree-audit
      row, and would silently compare the measurement against an empty set. Compare the note's row
      set to the measured rows, print each row present in one side only prefixed MISSING or EXTRA,
      and exit 1 on any difference. Exit 0 only when the note's rows and the measured rows are
      identical and no violation exists.

      At the pinned SHA the expected measurement is 9 rows outside tests/, of which 1 is the FEAT-44
      documented exception and 8 are out-of-vocabulary Markdown or JSONL records, and 0 violations; if
      your run disagrees, report the difference rather than adjusting the classification.
  - id: T-04
    title: Record the repository audit and every outside-tree disposition at the reviewed revision
    traces: [REQ-06]
    change_type: docs
    execution_mode: team
    execution_agent: harness-qa
    depends_on: [T-03]
    status: ready
    files:
      - .harness/harness/features/BUG-1286-test-tree-enforcement/notes/qa-tree-audit.md
    verify: |
      out=$(python3 tests/manual/suite-census.py tree-audit --ref HEAD --against .harness/harness/features/BUG-1286-test-tree-enforcement/notes/qa-tree-audit.md) && printf '%s\n' "$out" | grep -q 'probe-session-accessors\.ts.*documented-exception'
    intent: |
      Run python3 tests/manual/suite-census.py tree-audit --ref HEAD from the repository root and
      write the audit record to
