decisions:
  - id: D-01
    choice: >-
      The authoritative vocabulary for the NEW repository-wide clause is a basename match in TWO GROUPS
      with deliberately different extension policies. Group one, extension-restricted: test-*, test_* and
      probe-*, refused only when the extension is one of the source extensions .py .sh .ts .tsx .js .mjs
      .cjs, so Markdown, JSONL and other captured data matching those three shapes stay out of scope of
      that clause, probe-shaped records included. Group two, extension-agnostic: *_test.* and *.test.*,
      refused whatever the extension. The extension policy is a property of group one within that clause
      alone and is not a repository-wide property of probe-shaped names: the pre-existing filesystem
      clause over the bin directory deliberately keeps its own unrestricted probe-* glob, so a
      probe-shaped file under bin stays refused whatever its extension, because that clause reads the
      filesystem rather than the Git index and is the untracked-plant net; the pre-existing under-tests/
      clause likewise keeps its own three .py shapes. Three clauses, three deliberately different
      vocabularies, none of them widened by this feature.
      GOVERNING SEMANTICS. The property this vocabulary must satisfy is stated against the matcher
      Harness actually uses, never against a segment-wise reading of a glob string. The only mechanical
      consumer of harness.json test_kinds detect is code_grade._is_test_path at
      .claude/skills/harness/bin/code_grade.py lines 458 to 473: it fnmatch-matches the FULL relative
      path against each detect pattern of EVERY kind whose status is active or locally_run, minus that
      kind's exclude patterns, with _patterns splitting on the pipe. fnmatch has no ** operator, so a
      bare * matches any characters INCLUDING /, and a pattern therefore reaches paths whose basename it
      never constrained. Two consequences bind this decision. First, the obligation spans every running
      kind and not the unit kind alone: in this repository that is unit, integration, omp_session_accessor
      and handoff_comprehension. Second, the guard is a SUPERSET obligation rather than a mirror of
      detect: it must refuse at least every tracked path outside tests/ that this matcher counts, AND it
      must additionally carry the manual-probe source-name rule, test-* and probe-*, which no detect
      pattern expresses at all. No claim in this plan about what the guard covers may be justified by
      reading a glob segment by segment.
    because: >-
      the split is what makes each half defensible on its own evidence, and the group-one membership is
      justified shape by shape rather than in bulk. The extension restriction on probe-* survives because
      eight of the nine tracked matches outside the test tree are Markdown or JSONL records of probes, and
      refusing a feature's own honest record would make the guard fight the evidence trail rather than the
      drift; probe-* is matched by no detect pattern of any running kind at all, so a probe record is
      discovered by nothing and needs no guard to keep it honest. test-* is likewise matched by no detect
      pattern and is carried by the guard as the runner's own selection shape, which is one half of why
      the guard is a superset of discovery rather than a mirror of it. The extension-agnostic pair is the
      one place where a restricted guard would be strictly narrower than discovery: detect carries
      **/*.test.* and **/*_test.* with no extension filter, so a tracked session_test.md or run.test.jsonl
      outside tests/ would be counted a unit test by the matcher, permitted by an extension-restricted
      guard, and executed by no runner - the same silently-smaller-suite defect this feature exists to
      close, one size down. The at-least-as-wide property is now ASSERTED against the matcher's own
      semantics rather than argued from a snapshot of today's detect value, and the argument that once
      stood here - that **/test_*.py reaches only paths the source-extension form contains - is WITHDRAWN
      as a segment-wise misreading: under fnmatch the * in that pattern crosses /, so it also counts
      .harness/tools/test_dir/gen.py, whose basename gen.py no basename vocabulary can refuse. T-01 case
      11 states the property in two halves. The BEHAVIOURAL half quantifies over actual path sets - the
      repository's own tracked set and a fixed synthetic tracked set - and requires that every path
      outside tests/ that code_grade._is_test_path counts is accepted by the imported is_test_shaped
      predicate and is not a DOCUMENTED_EXCEPTIONS entry, so a counted-but-permitted file reddens the unit
      suite on the commit that introduces it. The HYGIENE half certifies every detect pattern of every
      running kind as inside-tests, by a normalized literal prefix with any .. component rejected
      outright, or as guard-covered, by requiring that the pattern's core - the pattern with a single
      leading **/ removed - contains no /, carries FIXED wildcard-free literal text the vocabulary keys on
      (either the extension-agnostic infix _test. or .test., or one of the restricted prefixes test-,
      test_ and probe- together with a fixed source extension), and leaves no basename of a fixed
      adversarial corpus matched and unrefused. That is a SUFFICIENT condition and it is stated as one:
      the universal property - every path the pattern can match outside tests/ is refused by the
      vocabulary - IS satisfiable by a **/-prefixed pattern, **/*_test.py being one, but is not decidable
      by inspection for an arbitrary glob, whereas fixed slash-free literal text is, and that literal text
      is what actually closes the escape. A pattern certifying as NEITHER category fails the case by name,
      so a glob shape the rule does not recognise is refused rather than waved through - fail-closed by
      design, and the part of the rule that generalises beyond the leak axes enumerated to date. Measured
      at cab6adb2 against the real .harness/harness.json and the real Git index, the set of tracked paths
      outside tests/ that the matcher counts is EMPTY, so the behavioural half over the real root is a
      TRIPWIRE today rather than a demonstration. That is why the synthetic set exists and why the case
      also proves the tripwire discriminates. The residual is stated rather than certified away: because *
      crosses /, a pattern like **/test_*.py can reach a path whose basename the guard never refuses, and
      the behavioural half - not the hygiene half - is what catches such a path the day one is committed.
      Of the leak axes enumerated to date the hygiene half closes the extension-position axis - exhibited
      by **/test_*.p?, which counts .harness/test_evil.pw whose .pw extension the vocabulary refuses
      nowhere - and refuses a wildcard in any non-final segment, while the directory-component residual
      above stays with the behavioural half; both axes were found by picking an axis by hand and the axis
      space was never enumerated, so a third is not excluded. Widening the agnostic pair to any extension
      is inert on the present tree and so costs nothing already committed: measured at c040c319, zero
      tracked paths outside tests/ have a basename matching *_test.* or *.test.*.
    dec: none
  - id: D-02
    choice: >-
      Exceptions live in one module-level DOCUMENTED_EXCEPTIONS tuple of exact relative path plus
      written reason inside suite_layout.py, never a glob, and the registry polices itself: a glob
      character, a duplicate, an entry absent from the tracked set, and an entry the vocabulary would
      never have flagged are each their own violation.
    because: >-
      an exception that cannot go stale silently is the only kind that stays honest, and a separate
      data file would add a module to the sole-implementation sweep for no gain.
    dec: none
  - id: D-03
    choice: >-
      Tracked means the current Git index read by git ls-files in the root, so a staged addition is
      scanned and a staged deletion is not; the clause runs only when the root carries a .git entry, the
      git toplevel equals the root, and the index carries suite_layout.py itself, and once the root claims
      to be a checkout any enumeration failure is reported as a violation; the toplevel comparison is a
      precondition of enumeration and must not be moved after the self-ownership test, because a fixture
      root nested inside another checkout enumerates empty, which would fail self-ownership and go
      silently inert instead of fail-closed.
    because: >-
      the ownership condition scopes repository-wide enforcement to a checkout whose own index carries
      this predicate at that exact relative path, and violations() has exactly one caller, Harness's own
      run-unit-tests.sh (pinned by the runner-delegates-layout-once assertion at
      tests/unit/test-suite-layout.py lines 136 to 139), so a product checkout is reached by neither the
      clause nor the runner; DEC-189 (DECISIONS.md heading "The write guard resolves against two bases")
      records that the factory works on repositories it does not contain, that a product repo is checked
      out under the fleet's workspace_root and is worked on from a harness-rooted session, and that it is
      harness's hooks that fire and never the product's, so harness's own runner is the only thing that
      ever calls violations(); while a root with no index at all must stay usable for the synthetic layout
      fixtures rather than being reported as a failure.
    dec: none
  - id: D-04
    choice: >-
      The existing filesystem clause over the bin directory is retained beside the new index-driven
      clause, and a path the bin clause already reported is not reported twice.
    because: >-
      the filesystem clause catches untracked plants that an index scan cannot see, and dropping it
      would both weaken the guard and redden the fixtures that plant such files.
    dec: none
  - id: D-05
    choice: >-
      FEAT-44 evidence/probe-session-accessors.ts is an allowed documented exception at its exact
      current path and is not relocated, so the consumer reference in
      tests/manual/probe-omp-session-accessor.py lines 54 to 55 stays exactly as it is.
    because: >-
      relocating it would force edits to a landed feature's evidence README and shipped review note,
      rewriting the record of completed work to satisfy a layout rule, and keeping it makes the live
      registry entry load-bearing so the real repository is itself positive coverage; and the coupling is
      accepted with its consequence stated: if that evidence file is ever archived or removed, the
      registry entry reports "no longer tracked" on every runner invocation until suite_layout.py, granted
      to backend-dev and dev-ops and not to whoever archives a feature, is edited.
    dec: none
  - id: D-06
    choice: >-
      DEC-213 is amended in place with an Amended-by paragraph that supersedes its bin-only
      enumeration clause, and DECISIONS-INDEX.md is regenerated in the same task with its DEC-213
      ruling tail rewritten by hand.
    because: >-
      the index records each entry's source line, so lengthening DEC-213 moves every later anchor,
      and the text right of the row separator is hand-written and survives regeneration untouched.
    dec: DEC-213

