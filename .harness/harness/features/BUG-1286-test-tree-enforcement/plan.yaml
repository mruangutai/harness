decisions:
  - id: D-01
    choice: >-
      The authoritative vocabulary for the NEW repository-wide clause is a basename match in TWO GROUPS
      with deliberately different extension policies. Group one, extension-restricted: test-*, test_* and
      probe-*, refused only when the extension is one of the source extensions .py .sh .ts .tsx .js .mjs
      .cjs, so Markdown, JSONL and other captured data matching those three shapes stay out of scope of
      that clause, probe-shaped records included. Group two, extension-agnostic: *_test.* and *.test.*,
      refused whatever the extension, exactly mirroring harness.json test_kinds.unit.detect. The extension
      policy is a property of group one within that clause alone and is not a repository-wide property of
      probe-shaped names: the pre-existing filesystem clause over the bin directory deliberately keeps its
      own unrestricted probe-* glob, so a probe-shaped file under bin stays refused whatever its
      extension, because that clause reads the filesystem rather than the Git index and is the
      untracked-plant net; the pre-existing under-tests/ clause likewise keeps its own three .py shapes.
      Three clauses, three deliberately different vocabularies, none of them widened by this feature.
    because: >-
      the split is what makes each half defensible on its own evidence, and the group-one membership is
      justified shape by shape rather than in bulk. The extension restriction on probe-* survives because
      eight of the nine tracked matches outside the test tree are Markdown or JSONL records of probes, and
      refusing a feature's own honest record would make the guard fight the evidence trail rather than the
      drift; probe-* is also matched by no harness.json detect glob at all, so a probe record is
      discovered by nothing and needs no guard to keep it honest. test_* stays restricted because
      test_kinds.unit.detect reaches it only as **/test_*.py, which the source-extension form strictly
      contains, so nothing the kind map discovers escapes the guard. test-* stays restricted because it is
      the runner's own selection shape and is matched by no detect glob either. The extension-agnostic
      pair is the one place where a restricted guard would be narrower than discovery: detect carries
      **/*.test.* and **/*_test.* with no extension filter, so a tracked session_test.md or run.test.jsonl
      outside tests/ would be counted a unit test by the map, permitted by an extension-restricted guard,
      and executed by no runner - the same silently-smaller-suite defect this feature exists to close, one
      size down. The guard must therefore be at least as wide as what unit.detect discovers, on exactly
      those two shapes and no others, and that property is now ASSERTED rather than argued from a snapshot
      of today's detect value: T-01 case 11 reads test_kinds.unit.detect from .harness/harness.json at
      test time, keeps every glob whose final segment constrains a basename, synthesises one
      representative name per such glob under a fixed directory outside tests/, and requires the imported
      is_test_shaped predicate to judge each one test-shaped, so a future edit that widens unit.detect
      past this vocabulary reddens the unit suite instead of decaying silently (SC-19). Widening them is
      inert on the present tree and so costs nothing already committed: measured at c040c319, zero tracked
      paths outside tests/ have a basename matching *_test.* or *.test.*.
    dec: none
  - id: D-02
    choice: >-
      Exceptions live in one module-level DOCUMENTED_EXCEPTIONS tuple of exact relative path plus
      written reason inside suite_layout.py, never a glob, and the registry polices itself: a glob
      character, a duplicate, an entry absent from the tracked set, and an entry the vocabulary would
      never have flagged are each their own violation.
    because: >-
      an exception that cannot go stale silently is the only kind that stays honest, and a separate
      data file would add a module to the sole-implementation sweep for no gain.
    dec: none
  - id: D-03
    choice: >-
      Tracked means the current Git index read by git ls-files in the root, so a staged addition is
      scanned and a staged deletion is not; the clause runs only when the root carries a .git entry, the
      git toplevel equals the root, and the index carries suite_layout.py itself, and once the root claims
      to be a checkout any enumeration failure is reported as a violation; the toplevel comparison is a
      precondition of enumeration and must not be moved after the self-ownership test, because a fixture
      root nested inside another checkout enumerates empty, which would fail self-ownership and go
      silently inert instead of fail-closed.
    because: >-
      the ownership condition scopes repository-wide enforcement to a checkout whose own index carries
      this predicate at that exact relative path, and violations() has exactly one caller, Harness's own
      run-unit-tests.sh (pinned by the runner-delegates-layout-once assertion at
      tests/unit/test-suite-layout.py lines 136 to 139), so a product checkout is reached by neither the
      clause nor the runner; DEC-189 (DECISIONS.md heading "The write guard resolves against two bases")
      records that the factory works on repositories it does not contain, that a product repo is checked
      out under the fleet's workspace_root and is worked on from a harness-rooted session, and that it is
      harness's hooks that fire and never the product's, so harness's own runner is the only thing that
      ever calls violations(); while a root with no index at all must stay usable for the synthetic layout
      fixtures rather than being reported as a failure.
    dec: none
  - id: D-04
    choice: >-
      The existing filesystem clause over the bin directory is retained beside the new index-driven
      clause, and a path the bin clause already reported is not reported twice.
    because: >-
      the filesystem clause catches untracked plants that an index scan cannot see, and dropping it
      would both weaken the guard and redden the fixtures that plant such files.
    dec: none
  - id: D-05
    choice: >-
      FEAT-44 evidence/probe-session-accessors.ts is an allowed documented exception at its exact
      current path and is not relocated, so the consumer reference in
      tests/manual/probe-omp-session-accessor.py lines 54 to 55 stays exactly as it is.
    because: >-
      relocating it would force edits to a landed feature's evidence README and shipped review note,
      rewriting the record of completed work to satisfy a layout rule, and keeping it makes the live
      registry entry load-bearing so the real repository is itself positive coverage; and the coupling is
      accepted with its consequence stated: if that evidence file is ever archived or removed, the
      registry entry reports "no longer tracked" on every runner invocation until suite_layout.py, granted
      to backend-dev and dev-ops and not to whoever archives a feature, is edited.
    dec: none
  - id: D-06
    choice: >-
      DEC-213 is amended in place with an Amended-by paragraph that supersedes its bin-only
      enumeration clause, and DECISIONS-INDEX.md is regenerated in the same task with its DEC-213
      ruling tail rewritten by hand.
    because: >-
      the index records each entry's source line, so lengthening DEC-213 moves every later anchor,
      and the text right of the row separator is hand-written and survives regeneration untouched.
    dec: DEC-213

