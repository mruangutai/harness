           twice is refused as listed twice; an entry naming a tracked non-test-shaped file is refused
           as unnecessary; an entry naming an untracked path is refused as no longer tracked;
        7. the live registry is load-bearing: read the single entry's path from
           suite_layout.DOCUMENTED_EXCEPTIONS first and assert against that value rather than a
           literal, so a later registry change cannot redden this case; with DOCUMENTED_EXCEPTIONS
           temporarily set to () assert violations(ROOT) contains that path, and with it restored
           assert violations(ROOT) == [];
        8. extension-restricted boundary: a tracked .harness/notes/probe-something.md in the Git
           fixture produces no finding, while a tracked .harness/notes/probe-something.py does. This is
           the half of the split that keeps a feature's honest Markdown probe record legal;
        9. self-ownership is load-bearing in the other direction: a Git fixture built exactly like
           case 1 but WITHOUT .claude/skills/harness/bin/suite_layout.py in its index — do not copy
           the module in; the fixture needs only the two kind directories and the tracked rogue file
           — must produce no "tracked test-shaped file outside tests/" finding at all, which is the
           clause that leaves a checkout not shipping this rule untouched;
       10. extension-agnostic mirror, the other half of the split and its own case: on a Git fixture
           built like case 1, additionally create and track .harness/tools/session_test.md and
           .harness/evidence/run.test.jsonl, and assert that BOTH are named by their own
           "tracked test-shaped file outside tests/" finding, with no extension in play. Assert it in
           this case and not by widening case 1's fixture, so case 1's exact-equality list stays a
           one-element list. Case 8 and case 10 together are the split asserted in both directions: a
           non-source extension is out of scope for a restricted pattern and in scope for an agnostic
           one, and without both halves only one direction is proved.
       11. guard covers unit.detect, derived at test time and never copied. This case builds no fixture
           and plants no file. Import is_test_shaped from suite_layout. Read
           test_kinds.unit.detect from .harness/harness.json through the repo_cfg dict this file already
           loads for the template-equality assertions, and split it on "|". Never a literal copy of
           today's value: a copy is exactly what lets a future detect edit pass a stale assertion.
           Partition the globs mechanically into THREE buckets, computable from the glob string ALONE,
           with no appeal to repository state, to git ls-files, or to what a runner would select. For each
           glob take the final "/"-separated segment. It is a BASENAME glob iff that segment contains a
           wildcard character ("*" or "?") AND segment.strip("*?") is non-empty, that is, the segment
           constrains the BASENAME and is not made of wildcard characters alone. Every other glob is
           DIRECTORY-ONLY, and its literal prefix is the "/"-joined leading segments before the first
           segment that contains a wildcard. A directory-only glob is EXCUSED from this case's check iff
           that literal prefix is exactly "tests" or starts with "tests/"; a directory-only glob with any
           other prefix, the empty prefix included, is ROGUE. Excusing is conditional on the prefix
           because a unit.detect glob rooted outside tests/ names files that the kind map counts and that
           no runner runs -- run-unit-tests.sh --kind unit splits its suite by the tests/unit and
           tests/integration directories (the excluded functional kind in .harness/harness.json records
           that same split) -- which is the exact defect this assertion exists to catch.
           Today's four globs classify as: tests/unit/** -> final segment "**" -> strips to "" ->
           directory-only with literal prefix "tests/unit" -> EXCUSED; **/*.test.* -> "*.test.*" ->
           strips to ".test." -> BASENAME; **/*_test.* -> "*_test.*" -> strips to "_test." -> BASENAME;
           **/test_*.py -> "test_*.py" -> strips to "test_*.py", unchanged, because str.strip removes only
           leading and trailing characters and this segment starts with "t" and ends with "y" -> BASENAME.
           Three basename globs, one excused, none rogue.
           Assert in its own check() that the ROGUE set is EMPTY, with a message naming every rogue glob.
           A rogue glob has nothing to synthesise -- it carries no basename wildcard -- and no legitimate
           assertion to pass: its mere presence in unit.detect means the kind map claims files the runner
           cannot reach, so this case FAILS naming it. When that fires the remedy is to fix detect, or to
           record why the new root is genuinely discoverable by the unit runner; NEVER to delete, narrow
           or skip this assertion.
           Assert also that exactly one of today's globs is EXCUSED, so a partition bug that excuses every
           glob and empties the check cannot pass silently.
           Synthesise one representative path per BASENAME glob, deterministically: a leading "**/" is
           replaced by the fixed directory prefix ".harness/tools/", which is outside tests/; a glob with
           no leading "**/" gets that same prefix prepended to its final segment; then within the final
           segment every "*" and every "?" becomes the fixed literal token "x". Worked results for
           today's three basename globs: **/*.test.* -> .harness/tools/x.test.x; **/*_test.* ->
           .harness/tools/x_test.x; **/test_*.py -> .harness/tools/test_x.py.
           Assert that is_test_shaped is True for EVERY synthesised path, one check() per path so a
           single failure names its own glob. Judge them with the IMPORTED predicate only: do not
           re-spell the expression, do not call fnmatch here, and do not consult the pattern tuples
           directly.
           The TWO mutants this case exists to catch, both of which leave the pre-existing "unit detect
           matches template" assertion at tests/unit/test-suite-layout.py:100-103 GREEN because both files
           move together: (a) ADDING **/*.spec.* to test_kinds.unit.detect in BOTH .harness/harness.json
           AND .claude/skills/harness/templates/harness.json -- it is a basename glob, this case
           synthesises .harness/tools/x.spec.x, which matches no group of the guard's vocabulary, neither
           agnostic pattern nor any restricted pattern, so is_test_shaped returns False and the case goes
           RED; (b) SUBSTITUTING docs/** for tests/unit/** in both of those same two files -- a
           directory-only glob whose literal prefix "docs" is not inside tests/, so it is ROGUE, has no
           legitimate assertion to pass, and the case goes RED naming it, with the excused count falling
           to zero and reddening too. Mutant (b) is the one that PASSES the weaker partition this
           paragraph replaces, which excused every wildcard-only final segment whatever its root. When
           either fires, the remedy is to widen the guard's vocabulary to cover the new shape, to fix
           detect, or to record in DEC-213 why the new detect entry is deliberately outside this clause's
           scope. NEVER to delete, narrow or skip this assertion.
           This case is ADDITIVE. The existing "unit detect matches template" and "unit detect excludes
           .claude" assertions are kept exactly as they are and are not replaced by it, and because it
           plants no file, T-01 case 1's fixture and its one-element exact-equality list are untouched.
      Case 11 READS .harness/harness.json and must not write it. Do not modify .harness/harness.json, run-unit-tests.sh, or any file outside the two
