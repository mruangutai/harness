  - id: T-03
    title: Add a re-runnable tree-audit census subcommand for any ref
    traces: [REQ-06]
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: ready
    files:
      - tests/manual/suite-census.py
    verify: |
      out=$(python3 tests/manual/suite-census.py tree-audit --ref HEAD) && printf '%s\n' "$out" | grep -q 'probe-session-accessors\.ts.*documented-exception'
    intent: |
      Add a tree-audit subcommand to tests/manual/suite-census.py, registered the same way the
      existing subcommands are (an add_tree_audit_parser function plus its entry in the parser table),
      so the repository audit is an instrument anyone can re-run at a named ref rather than a one-off
      measurement.

      Arguments: --ref, defaulting to HEAD, and --against, an optional path to a Markdown note.
      Import suite_layout by inserting ROOT/.claude/skills/harness/bin at the front of sys.path, and
      take RESTRICTED_NAME_PATTERNS, AGNOSTIC_NAME_PATTERNS, SOURCE_EXTENSIONS and
      DOCUMENTED_EXCEPTIONS from it — never re-declare them here, so the audit and the guard can never
      disagree.

      Enumerate with git ls-tree -r --name-only <ref> run with cwd=ROOT, check=True. Select every path
      whose basename matches an entry of EITHER pattern tuple, WITHOUT the extension filter, so records
      the guard deliberately ignores are still measured and dispositioned. For each selected path print
      one row, path then a single tab then the disposition, sorted by path:
        - in-tests-tree      when the path starts with tests/
        - documented-exception when the path is an exact DOCUMENTED_EXCEPTIONS entry
        - out-of-vocabulary  when the basename matches ONLY RESTRICTED_NAME_PATTERNS and the extension
          is not in SOURCE_EXTENSIONS. This disposition means exactly one thing: matched an
          extension-restricted pattern with a non-source extension. A Markdown or JSONL file whose
          basename matches *_test.* or *.test.* is NOT out-of-vocabulary — the agnostic pair carries no
          extension policy, so such a file is a violation (D-01)
        - violation          otherwise

      OUTPUT CONTRACT, unconditional. The complete fenced row block and the final line
      "TOTAL <n> OUTSIDE <n> VIOLATIONS <n>" — counting selected paths, selected paths not under tests/,
      and violation rows — print on EVERY invocation, with --against and without it, and they print
      BEFORE any comparison or verdict output. Nothing about --against suppresses, truncates, filters or
      replaces either of them. A diff-only implementation that prints just MISSING/EXTRA lines under
      --against violates this task even though it would satisfy a looser reading. The reason is
      mechanical and both this task's verify: and T-04's verify: depend on it: each pipes the
      subcommand's stdout into
      grep -q 'probe-session-accessors\.ts.*documented-exception'
      as a non-vacuity anchor, and T-04 runs it WITH --against, so the FEAT-44 documented-exception row
      must appear in stdout in comparison mode exactly as it does in plain mode. Print the block first,
      then the TOTAL line, then any --against output.

      Without --against, exit 1 if any violation row exists, else 0.

      With --against, the MISSING/EXTRA lines are ADDITIVE output that FOLLOWS the block and the TOTAL
      line, never a replacement for either.

      NOTE SHAPE CONTRACT, one fence exactly. The note handed to --against must carry EXACTLY
      ONE fenced block. Collect every fenced block with the same pattern baseline() applies at
      tests/manual/suite-census.py line 24 - a triple-backtick fence, an optional text info string, and a
      lazy dot-all body - and COUNT the blocks before parsing anything:
        - zero blocks -> print to stderr "note carries no fenced block: {path}" and exit 2;
        - two or more -> print to stderr "note carries {n} fenced blocks, expected exactly 1: {path}" and
          exit 2;
        - exactly one -> parse that block's lines, each as path then a single tab then disposition.
      Exit 2 is reserved for this refusal, so it is distinguishable from the exit 1 a row difference or a
      violation row produces, and each message names the note path. REFUSING is the contract, NOT
      first-block-only: a first-block rule silently compares the wrong block the day a correct note grows
      a second fence, and the reader then suspects the instrument rather than the note. Never silently
      pick one of several blocks, and never merge several blocks' rows into one set - merging is
      precisely what line 24's find-all pattern does by default, so counting is the contract and not
      optional bookkeeping. The unconditional row block and TOTAL line print BEFORE this refusal is
      evaluated, so a refused note still shows the measurement.
      Do NOT call baseline() itself: its
      row regex requires a test-prefixed .py basename followed by an integer, matches no tree-audit
      row, and would silently compare the measurement against an empty set. Compare the note's row
      set to the measured rows and print each row present in one side only prefixed MISSING or EXTRA.
      The exit status under --against is the COMBINATION of the conditions: exit 2 when the note does
      not carry exactly one fenced block; otherwise non-zero on any row difference AND non-zero on any
      violation row. Exit 0 only when the note carries exactly one fenced block, its rows and the
      measured rows are identical, and no violation row exists; any one fault alone is a non-zero exit.

      Expected measurement, re-measured for this amendment at c040c319 with a clean worktree and
      reported in
      notes/research-BUG-1286-vocabulary-split.md: TOTAL 85, OUTSIDE 9, VIOLATIONS 0. Of the 9 rows
      outside tests/, 1 is the FEAT-44 documented exception (.ts) and 8 are out-of-vocabulary Markdown
      or JSONL probe records, all 8 matching probe-* only. Zero tracked paths outside tests/ have a
      basename matching *_test.* or *.test.*, so widening those two shapes to any extension changes no
      row's disposition on the present tree. If your run disagrees, report the difference rather than
      adjusting the classification.
