decisions:
  - id: D-01
    choice: |
      The self-checkout guard compares the resolved real path of the computed workspace path
      against the resolved real path of this control-plane checkout, and refuses only on identity
      of the two paths. It does not refuse because the target is some harness-onboarded
      repository.
    because: |
      harness is legitimately a fleet repo, so a factory checkout of harness at a workspace_root
      elsewhere is a DIFFERENT checkout and must still work; and the containment case, a computed
      path that merely CONTAINS the control plane, already refuses under the uncommitted-work
      condition, because a nested checkout is untracked-not-ignored content.
    dec: none

