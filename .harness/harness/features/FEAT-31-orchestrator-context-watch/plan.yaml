      warning lines is 1 for the original and 0 for the mutant. A COUNT on both sides, never an
      exit status (D-08). Equal counts means the mutation did not apply: report INCONCLUSIVE and
      exit non-zero, never as passed.
      Also assert the never-raises contract: a payload that is not JSON, and one missing agent_id,
      each exit 0 with empty stderr and NO traceback.
      Print a summary line of the form "N of M cases passed" and exit non-zero on any failure.

      YOU MUST ALSO CHECK, NOT ASSUME, ONE THING THE PROBE COULD NOT. The probe's "Not verified
      here" section is explicit: that the stderr text is visible to the model as CONTEXT rather
