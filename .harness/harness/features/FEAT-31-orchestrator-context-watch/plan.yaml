      threshold figure and the substring handoff. Assert stdout is empty -- the channel is stderr.
      Case 2, DOES NOT CROSS: the SAME fixture with a threshold above its current. Assert exit 0
      and stderr EMPTY.
      Case 3, NOT AN ORCHESTRATOR: the same crossing fixture but agent_type harness-backend-dev in
      the payload. Assert exit 0 and stderr empty, so the hook is inert for every other agent.
      Case 4, RED PROOF -- SC-13 requires that removing the threshold comparison make the crossing
      fixture STOP warning. Write a mutant copy of the file holding the comparison (T-16's
      context-watch.py) into the tmpdir with that comparison removed, ASSERT the mutant text
