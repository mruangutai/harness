      bash .claude/skills/harness/bin/run-unit-tests.sh --kind integration
      # expect NO line containing MISCONFIGURED -- run-unit-tests.sh:52-53 print it and exit 2, so
      # exit 0 already forbids it. This is the line that proves the INTEGRATION_SCRIPTS append
      # landed.
    intent: |
      THE DELIVERY CHANNEL IS SETTLED AND MUST NOT BE RE-LITIGATED. Evidence:
      notes/probe-hook-delivery-channel.md. PostToolUse plus exit 2, whose stderr reaches the
      running agent. check-domain.sh:571-573 states the mode table and :648-653 records the
      consequence -- in POST the write already landed, so exit 2 there only carries stderr back to
