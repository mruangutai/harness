  - id: D-02
    choice: SETTLED 2026-08-21. This plan is NO LONGER half-written and this decision is no longer a live deferral - it is the record of a deferral that CLOSED. What happened, in order, stated as it happened rather than as it was intended. The FIRST planning run wrote tasks covering SC-01 to SC-06, SC-08, SC-10, SC-11 only, that is REQ-01, REQ-02, REQ-03, REQ-05, REQ-06, REQ-07, and DEFERRED SC-07, SC-09, SC-13, SC-14, SC-15, that is REQ-04, REQ-08, REQ-09, REQ-10, to a second run. That was a real deferral of five approved criteria and it is not being rewritten as anything else. The SECOND run (plan4) appended T-09 through T-14 and closed SC-09, SC-14 and SC-15's automatable half - it did NOT reach SC-07 or SC-13, and notes/finding-sc-coverage-orchestrator.md is the measurement that caught the shortfall rather than anything on disk surfacing it. The THIRD run (plan5, 2026-08-21) appended T-15 through T-18 and closed SC-07 and SC-13, after the operator DECLINED both alternatives - shipping the measurement half with the two deferred, and amending them out of the approved BRIEF. Every criterion in BRIEF.md now has a task or a named non-task disposition - SC-10 is verify uat and is the operator's by D-12, and SC-15's behaviour half is hand-graded by D-21. NOTHING in this plan may cite this decision as authority to defer further work; the clause it carried is spent.
    because: A standing "half-written by design" clause is an excuse with no expiry, and a goal-check reading it would report the shortfall as intended rather than as a gap - which is exactly the trap D-21 named for SC-15 and the trap the SC-07 and SC-13 finding walked into. DEC-188's grammar is the model - a superseded statement keeps its record rather than being deleted, because this decision is cited elsewhere in this plan and a citation must still land somewhere. The original split rationale, one writer on lanes and decisions and two on tasks, is preserved as history - it is why the lanes and decisions blocks were complete for both halves from the first run and why plan5 extended them only for surfaces no row covered.
