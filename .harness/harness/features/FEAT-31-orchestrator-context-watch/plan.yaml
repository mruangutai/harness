tasks:
  - id: T-01
    title: Create context-watch.py — sidecar discovery, corrected context arithmetic, unmeasured rows, feature attribution, worktree slug resolution
    traces: [REQ-01, REQ-02, REQ-05, REQ-06, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/context-watch.py
    verify: |
      # THE EXPECTED VALUE IS COMPARED, NOT COMMENTED. The previous form printed the slug and put
      # the expectation in a `#` comment, so the command exited 0 whatever it printed and this gate
      # could not go red. `test` supplies the verdict now.
      test "$(python3 .claude/skills/harness/bin/context-watch.py --resolve-dir /Users/molchairuangutai/GitHub/harness/.claude/worktrees/fix-harness-tooling-backlog)" = "-Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog"
      # exit 0 ONLY on an exact match. A resolver returning the harness_root slug, or one dropping
      # the double hyphen that .claude's leading dot produces, exits 1.
      python3 .claude/skills/harness/bin/context-watch.py --projects-dir /nonexistent-projects-dir 2>&1 | grep -qE "no orchestrator"
      # a traceback carries no such line, so a crash on an absent dir fails HERE rather than
      # passing quietly on a zero exit from something else
    intent: |
      Create .claude/skills/harness/bin/context-watch.py, a read-only operator CLI. It writes
      NOTHING, anywhere, ever. Python 3 standard library only.

      Usage: python3 .claude/skills/harness/bin/context-watch.py [agent-id]
      Flags: --projects-dir PATH overrides the projects root (tests use this);
             --resolve-dir PATH prints the transcript-directory name for that cwd and exits 0.

      TRANSCRIPT DIRECTORY NAME. Pure string slug of an absolute path: every / and every .
      becomes -. No filesystem access, no existence check. The literal
      /Users/molchairuangutai/GitHub/harness/.claude/worktrees/fix-harness-tooling-backlog must
      produce
      -Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog
      (note the double hyphen from the leading dot of .claude). Expose this as a module-level
      function taking the path and returning the name. Default projects root is
      ~/.claude/projects. The slug of a cwd names a PROJECT directory directly under that root -
      it does NOT name a session directory. See DISCOVERY for the two levels.

      DISCOVERY IS TWO LEVELS DEEP, CORRECTED 2026-08-21 — the earlier wording of this clause said
      one level, contradicted the paragraph above it, and the tool built faithfully against it
      finds nothing. The layout is
      <projects-root>/<project-dir>/<session-dir>/subagents/agent-<id>.meta.json
      where <project-dir> is the slug of a cwd and <session-dir> is a session id. MEASURED on this
      machine on 2026-08-21: the one-level glob <root>/*/subagents/agent-*.meta.json matches 0
      files and the two-level glob <root>/*/*/subagents/agent-*.meta.json matches 2004, of which
      104 carry agentType harness-orchestrator, spread across THREE project directories
      (-Users-molchairuangutai-GitHub-harness 90,
      -Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog 9,
      -private-tmp-uat-pyyaml 5).

      WITH NO ARGUMENT THE TOOL SCANS EVERY PROJECT DIRECTORY UNDER THE ROOT, and every session
      directory within each. It does NOT restrict itself to the current cwd's project directory.
      This is what SC-01 and SC-10 require and they are the authority: SC-10 fails outright if a
      running orchestrator is missing from the no-argument output, and REQ-05 requires an
      orchestrator running inside a worktree to be readable — a worktree has its OWN project
      directory, as the 9 sidecars in the fix-harness-tooling-backlog slug above show, so a tool
      scanning only the invoking cwd's project directory would miss every worktree orchestrator
      whenever it was run from the primary checkout. transcript_dir_for_cwd() stays as the resolver
      that --resolve-dir exposes and that a caller may use to narrow to one project directory; it
      is NOT the default scan.

      Read every subagents/agent-<id>.meta.json found by that two-level walk. Select a row when
      its agentType equals
      harness-orchestrator. Depend on ONLY agentType, description and spawnDepth — these are the
      three universal keys across the sidecar shapes on this machine. Treat every other key as
      optional and never fail because one is missing. The sidecar is Claude Code's own file with
      no contract; this tool only reads it.

      PER-ROW MEASUREMENT reads subagents/agent-<id>.jsonl beside the sidecar. For each entry
      take the mapping at message.usage. Size is input_tokens + cache_read_input_tokens +
      cache_creation_input_tokens, each defaulting to 0. WHERE message.usage.iterations IS A
      NON-EMPTY LIST, the size for that entry is the MAX of that same three-field sum computed
      PER ITERATION — never the top-level value, which is the SUM across sub-calls and is tokens
      read, not context size. Where iterations is absent or empty, the top-level sum IS the size.

      THE MEASURED SET, and all three figures come off it (D-11 as corrected 2026-08-21). The
      measured set is exactly those lines of that transcript that parse as JSON AND carry a
      mapping at message.usage. peak is the MAX size over that set. current is the size of the LAST
      MEMBER OF THAT SET — not the last line of the file, and NEVER a zero standing in for a line
      that carried no measurement. entries is the CARDINALITY of that set. A line that parses but
      has no message.usage contributes to none of the three.
      MEASURED on agent a7783f0ec41e6a8c6 on 2026-08-21, which is the case this paragraph exists
      for: 1046 lines parse, 669 carry message.usage, peak is 696,472 (matching BRIEF.md line 43 to
      the token), the last member of the measured set is also 696,472, and the file's LAST line
      carries no message.usage — so appending a 0 for it and taking the last element reports
      current 0 for an orchestrator holding 696,472 tokens. Do not do that. Where the measured set
      is EMPTY the row is unmeasured (see below), naming the transcript path; it is never reported
      as current 0 peak 0.

      FEATURE ATTRIBUTION. Search the first four entries of that agent's transcript for the first
      match of FEAT-[0-9]+ and report it. Report unknown when there is no match. Do NOT use the
      entry's gitBranch, the entry's cwd, or the sidecar description: gitBranch names the checkout
      the agent was spawned from and today would report the FEAT-31 orchestrator as working on
      FEAT-30.

      UNMEASURED ROWS ARE ROWS, NEVER OMISSIONS (REQ-07). If the sidecar is not valid JSON, or has
      no agentType, or the matching .jsonl is missing or unreadable, still EMIT a row for it,
      marked unmeasured, naming the ABSOLUTE PATH of the file that defeated it. When any row is
      unmeasured the process exits 1. Otherwise exit 0. A row whose sidecar cannot be parsed at
      all counts as an orchestrator row for the purpose of the count, so a silent drop is
      impossible.

      OUTPUT. One line per row, aligned, carrying: agent id, feature, current, peak, entries, and
      for an unmeasured row the word unmeasured and the offending path. Thousands separators on
      the token figures. A one-argument invocation restricts output to that agent id and reports a
      stated not-found line with exit 1 if no such orchestrator exists. With no argument, every
      orchestrator row is printed. NO threshold, no headroom and no blind-spot footer in this
      task: those are T-06 and T-08, and adding them here would make SC-05's before-and-after
      assertion unwritable.

      Never crash on malformed input. Never read or write anything outside the projects root.

