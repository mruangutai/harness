      test "$(python3 .claude/skills/harness/bin/test-context-watch-hook.py | grep -oE '^[0-9]+ of' | head -1 | cut -d' ' -f1)" -ge 4
      # THE SUMMARY AND ITS FLOOR ARE BOTH ASSERTED. The file does not exist at 2cf792f so there
