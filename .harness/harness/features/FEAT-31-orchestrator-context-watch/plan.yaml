      Case 1, CROSSES: a fixture projects tree at the real two-level depth
      (<root>/<project-slug>/<session-id>/subagents/), one sidecar with agentType
      harness-orchestrator, a transcript whose last measured entry is above a fixture threshold.
      Feed the hook a payload naming that session_id, agent_id, agent_type and cwd. Assert exit 2,
