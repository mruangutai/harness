      # THE WHOLE EXISTING TREE MUST STILL VALIDATE, and this is SC-07's second half asserted
      # against real data rather than a fixture. Measured at 2cf792f in this worktree: this CLI
      # sweeps 31 feature.json files holding 390 runs entries and exits 0. If the new rule is
