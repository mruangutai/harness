      Exit 0 IMMEDIATELY, doing nothing, unless agent_type is exactly harness-orchestrator.
      Otherwise call T-16's function with those values. If it returns None, exit 0 silently. If it
      returns text, write that text to STDERR and exit 2.
      IT NEVER RAISES AND NEVER BLOCKS. Wrap everything: a payload that is not JSON, a missing
      field, an unreadable transcript, an import failure -- every one exits 0 silently. A warning
      path that crashes takes a live orchestrator's tool call with it, and this hook fires on
      nearly every one (2858 Bash events across 25 orchestrator transcripts, measured 2026-08-21).
      Fail silent is the correct direction HERE and only here, and say so in a comment, because
      the instrument is advisory and the operator's own reading of the tool is the backstop.

      PART TWO — .claude/settings.json. APPEND the command to the hooks array of the EXISTING
      PostToolUse entry whose matcher is Write|Edit|Bash, beside check-domain.sh --post. Create no
      new matcher and add no new event. Use the same ${CLAUDE_PROJECT_DIR} form the neighbouring
