      python3 -c "import json;s=json.load(open('.claude/skills/harness/bin/feature-schema.json'));r=s['properties']['runs']['items'];assert 'agent' in r['properties'], sorted(r['properties']);assert 'agent' not in r.get('required',[]), r['required'];print('VERIFY-OK agent declared, not schema-required')"
