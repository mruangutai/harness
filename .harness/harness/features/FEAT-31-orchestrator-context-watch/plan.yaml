  - id: T-16
    title: SC-13 library half — context-watch.py can answer "is THIS agent over the threshold, and what should the warning say", as a function and a mode, with no knowledge that a hook exists
    traces: [REQ-08]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-06]
    status: done
    files:
      - .claude/skills/harness/bin/context-watch.py
      - .claude/skills/harness/bin/test-context-watch.py
    verify: |
      python3 .claude/skills/harness/bin/test-context-watch.py
      # line 1 is the VERDICT -- bare, so a failing case is not masked by a pipe.
      test "$(python3 .claude/skills/harness/bin/test-context-watch.py | grep -oE '^[0-9]+ of' | head -1 | cut -d' ' -f1)" -ge 22
      # MEASURED FLOOR: 15 cases at 2cf792f, plus T-06's four (D, E, F, G) which this task depends
      # on, plus this task's three (H, I, J) = 22.
      bash .claude/skills/harness/bin/run-unit-tests.sh --kind unit
      # expect NO line containing MISCONFIGURED
    intent: |
      THIS TASK BUILDS A LIBRARY, NOT A HOOK, AND THE DISTINCTION IS THE WHOLE REASON IT IS A
      SEPARATE TASK. Read D-24. context-watch.py must NOT be registered in .claude/settings.json
      by this task or any task -- registering it would make it a hook, put it inside DEC-174's
      category, and retroactively move T-01, T-06, T-08 and this task out of the team lane, three
      of which are already built under it. The thin registered hook is T-17's separate file.

      Add to .claude/skills/harness/bin/context-watch.py a module-level function that answers one
      question for ONE agent and returns text, and a --warn-for AGENT_ID mode that exposes it.

      THE FUNCTION. Given the projects root, a session id, an agent id and a cwd, locate that
      agent's transcript at
      <projects-root>/<slug of cwd>/<session-id>/subagents/agent-<agent-id>.jsonl
      using the slug function T-01 already exposes, compute `current` over the measured set
      exactly as T-01 defines it (the last member of the set of lines that parse AND carry
      message.usage -- never a zero standing in for a line with no measurement), read the
      threshold from budgets.orchestrator_context_warn_tokens exactly as T-06 does with the same
      stated default of 200000, and return EITHER None when current is below the threshold OR the
      warning TEXT when current is at or above it.
      READ ONLY WHAT IS NEEDED. This function is called on nearly every orchestrator tool call --
      measured on 2026-08-21, 2858 Bash events across 25 recent orchestrator transcripts -- so it
      must not compute `peak`, which requires the whole file. Read the transcript from the END and
      stop at the last line carrying message.usage. State in a comment that peak is deliberately
      not computed here and why.
      THE TEXT NAMES THREE THINGS, because SC-13 requires all three: the agent's CURRENT size, the
      THRESHOLD, and the NEAREST SEAM. For the seam, name DEC-159's seam rule and the concrete
      next artifact the orchestrator must write -- notes/handoff-<stem>.md with its four required
      sections -- rather than a generic instruction. It ADVISES: it must not contain the words
      blocked, stopped, refused or prevented, for the reason check-domain.sh:648-653 records for
      its own VERB in post mode. Nothing was prevented and the orchestrator decides.
      IT WRITES NOTHING AND IT NEVER RAISES. Any unreadable file, missing directory, absent config
      or unparseable line returns None, because a warning path that can crash would take an
      orchestrator's tool call down with it. Return None rather than a partial figure.

      THE --warn-for MODE. python3 context-watch.py --warn-for AGENT_ID --session-id ID
      [--cwd PATH] [--projects-dir PATH] [--config PATH] prints the warning text and exits 2 when
      the function returns text, prints nothing and exits 0 when it returns None. This mode is
      what T-17's hook shells out to or imports; it is NOT itself registered anywhere. Keep the
      existing no-argument and one-argument behaviour, the blind-spot footer and the threshold
      warning of T-06 EXACTLY as they are -- this mode is additive and must not change the table.

      TESTS, appended to test-context-watch.py, each printing one line beginning "ok" and counted
      in the existing "N of M cases passed" summary.
      Case H, CROSSES: a fixture whose single agent's last measured entry is above a fixture
      threshold. Assert --warn-for exits 2, that stdout is non-empty, and that the text contains
      the agent's current figure, the threshold figure, and the substring handoff. Assert it
      contains NONE of blocked, stopped, refused, prevented.
      Case I, DOES NOT CROSS: the SAME fixture transcript with a threshold above its current.
      Assert exit 0 and stdout EMPTY. Same transcript both times so only the config differs.
      Case J, RED PROOF: a mutant copy of context-watch.py with the threshold comparison in the
      new function removed. Assert the mutant text differs from the original. Run case H's fixture
      through both and assert the count of warning lines is 1 for the original and 0 for the
      mutant -- a COUNT, never an exit status (D-08). Equal counts means the mutation did not
      apply: report INCONCLUSIVE and exit non-zero.
      Also assert that a fixture whose transcript is absent, and one whose config is absent,
      return None and exit 0 rather than raising.

  - id: T-17
