  - id: D-11
    choice: Context size for one entry is message.usage input_tokens plus cache_read_input_tokens plus cache_creation_input_tokens, EXCEPT that where message.usage.iterations is a non-empty list the size is the MAX of that same sum computed per iteration. Peak is the max over entries; current is the last entry's value. A sum across iterations is never reported.
