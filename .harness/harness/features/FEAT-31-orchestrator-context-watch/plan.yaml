  - id: D-19
    choice: D-4's check lands INSIDE .claude/skills/harness/bin/run-unit-tests.sh as a cross-check between its two script arrays and .harness/harness.json's test_kinds, plus a --check-kinds mode that runs only that cross-check and exits. T-12, execution_mode main-session-direct. Its test is a NEW file .claude/skills/harness/bin/test-run-unit-tests-kinds.py, registered in INTEGRATION_SCRIPTS by T-12 and named in test_kinds.integration.detect by T-11. THE RULE IS A SET COMPARISON, NOT A CLASSIFIER - every INTEGRATION_SCRIPTS entry must appear as an explicit literal path in integration.detect, and no UNIT_SCRIPTS entry may.
    because: Today the drift detector reads its own two bash arrays and NEVER reads harness.json, so a mismatch between the arrays and test_kinds is invisible to every gate — which is exactly how the eight in D-18 went unnoticed. Placing the cross-check in run-unit-tests.sh makes it unskippable - that script IS the command behind tests.yml lines 78 and 84, the two required steps. That same fact makes it enforcement layer by CATEGORY rather than by analogy — DECISIONS.md lines 4851 to 4854 declare the enumeration non-exhaustive and rule that a script becomes enforcement layer on the day it becomes a gate, the category deciding and the list recording; lines 4856 to 4859 add that the cutover which makes a gate use new logic is main-session-direct. D-06 is NOT contradicted - its stated basis is that a one-element array append changes no gate rule, and T-02 and T-07 remain team on exactly that basis. T-12 changes what the runner REJECTS, which D-06 never covered. THE SET COMPARISON is chosen over a glob classifier so the check does not depend on the unwritten precedence rule in Q-B - it needs no answer to whether an explicit path beats a catch-all glob. THE SELF-REFERENCE IS RESOLVED, not left - test-run-unit-tests-kinds.py matches the drift detector's own test-*.py glob, so it must sit in one array, it drives run-unit-tests.sh as a subprocess so that array is INTEGRATION_SCRIPTS, and it must therefore also be explicit in integration.detect or the new check goes red on itself — which is why T-11 lists it and why T-12 depends on T-11.
    dec: DEC-174

  - id: D-20
    choice: SC-14's approved second half is a SIBLING task T-14, not folded into T-10, and T-14 runs BEFORE T-10 (T-10 depends_on T-14). T-14 RESTRUCTURES - it moves the handoff shape check OUT of the for prev in SEAM_NOTES[_status] loop in check-state.sh into a single pass that globs notes/handoff-*.md per feature directory, so the loop keeps only the missing-note branch. SEAM_NOTES is UNCHANGED. C-3's double-report risk is resolved BY STRUCTURE, not by ordering. BRIEF.md's SC-14 mechanism clause is rewritten by this plan round because the mechanism it named is now forbidden.
    because: A sibling is chosen over a fold because T-14 is a refactor with its own red proof while T-10 is a new rule, and one dispatch carrying both makes a failed refactor indistinguishable from a failed empty-body check. T-14 runs FIRST so T-10's empty-body check is written ONCE, into the single extracted shape-check site, instead of being written inside the loop and then moved. BY STRUCTURE beats BY ORDERING because after the extraction the shape check has exactly ONE call site and the glob finds every existing note including the seam-stem ones, so no file can be reported twice by construction rather than by a rule someone must remember. Measured at 7299669 - check-state.sh line 592's loop both builds the required-note path and shape-checks it at line 614, which is the shared site; SEAM_NOTES is at line 495 and the comment above it, lines 475 to 481, records that deriving stems from status values matches on a case-insensitive filesystem and goes dark on Linux CI — the only machine that gates the merge. HANDOFF_HEADINGS at line 509 and the 60-line cap are untouched. A shape failure stays a VIOLATION through bad.append; the warn-instead variant was offered to the operator and REJECTED. The FEAT-01 and FEAT-02 literal exemption at HANDOFF_EXEMPT_LITERAL line 523 and the all-main-session-direct exemption at _handoff_exempt line 525 skip only the MISSING-note branch - once a file exists the shape check runs regardless, and the glob widens which files reach it rather than changing that rule. main-session-direct for the same reason as T-10, DECISIONS.md lines 4851 to 4854.
    dec: DEC-174

  - id: D-21
    choice: SC-15 IS SPLIT AND SAYS SO HERE. T-10 delivers the automatable half, INV-17 rejecting a handoff whose four headings are present but whose ## Next body is empty. The behaviour half, a fresh orchestrator's first dispatch matching its predecessor's ## Next, has NO TASK and is GRADED ONCE BY HAND against a real successor, alongside SC-10. BRIEF.md's SC-15 still reads verify automated, evidence integration and this plan does NOT edit it.
    because: The operator ruled A-3 approved as T-10 plus a UAT re-verify on 2026-08-21, so the split is settled and D-16's blocking question is closed. BRIEF.md is APPROVED at 2026-08-21 and only the C-4 rewrite of SC-14 was authorised, so SC-15's text is left byte-identical rather than quietly reclassified — a signed criterion is not the planner's to re-methodise. THE CONSEQUENCE IS NAMED SO IT IS NOT SILENT - a goal-check reading BRIEF.md alone would report SC-15 as fully automated, which is FALSE. It is met only when the hand grading is also recorded, and until then the behaviour half is not_met.
    dec: DEC-159

  - id: D-22
    choice: D-4's routing splits by DEC-174 am.4's CATEGORY rule. The eight-plus-two data entries in .harness/harness.json go to team, harness-dev-ops (T-11). The new cross-check and its test go to main-session-direct (T-12). This is a DEFAULT ADOPTED IN THE ABSENCE OF AN OPERATOR ANSWER to Q-A, carried in this plan's return as non-blocking, and it is the operator's to overrule in one read.
    because: Q-A asks whether harness.json's test_kinds is enforcement layer under DEC-174. It is config CONSUMED BY gates rather than a hook or a gate script, and DECISIONS.md lines 4856 to 4859 carry the governing analogy - a module a gate imports is not itself a gate, a squad may write the library, and the cutover that makes a gate USE it is main-session-direct. test_kinds is on the library side of that line. Three further facts point the same way - check-domain.sh --resolve .harness/harness.json returns harness-dev-ops at 7299669, so the grant exists; T-03 in this same plan already edits that file as execution_mode team, so ruling otherwise would retroactively invalidate T-03's lane; and DECISIONS.md lines 4851 to 4854 name five SCRIPTS and their tests, not a config file. The check itself is the opposite case - it becomes a gate on the day it lands, because run-unit-tests.sh is the command behind tests.yml's two required steps, so it is enforcement layer by category and not by analogy, and its test joins it because a gate's test is the only thing proving the gate discriminates.
    dec: DEC-174

tasks:
  - id: T-01
    title: Create context-watch.py — sidecar discovery, corrected context arithmetic, unmeasured rows, feature attribution, worktree slug resolution
    traces: [REQ-01, REQ-02, REQ-05, REQ-06, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: building
    files:
      - .claude/skills/harness/bin/context-watch.py
    verify: |
      # THE EXPECTED VALUE IS COMPARED, NOT COMMENTED. The previous form printed the slug and put
      # the expectation in a `#` comment, so the command exited 0 whatever it printed and this gate
      # could not go red. `test` supplies the verdict now.
      test "$(python3 .claude/skills/harness/bin/context-watch.py --resolve-dir /Users/molchairuangutai/GitHub/harness/.claude/worktrees/fix-harness-tooling-backlog)" = "-Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog"
      # exit 0 ONLY on an exact match. A resolver returning the harness_root slug, or one dropping
      # the double hyphen that .claude's leading dot produces, exits 1.
      python3 .claude/skills/harness/bin/context-watch.py --projects-dir /nonexistent-projects-dir 2>&1 | grep -qE "no orchestrator"
      # a traceback carries no such line, so a crash on an absent dir fails HERE rather than
      # passing quietly on a zero exit from something else
    intent: |
      Create .claude/skills/harness/bin/context-watch.py, a read-only operator CLI. It writes
      NOTHING, anywhere, ever. Python 3 standard library only.

      Usage: python3 .claude/skills/harness/bin/context-watch.py [agent-id]
      Flags: --projects-dir PATH overrides the projects root (tests use this);
             --resolve-dir PATH prints the transcript-directory name for that cwd and exits 0.

      TRANSCRIPT DIRECTORY NAME. Pure string slug of an absolute path: every / and every .
      becomes -. No filesystem access, no existence check. The literal
      /Users/molchairuangutai/GitHub/harness/.claude/worktrees/fix-harness-tooling-backlog must
      produce
      -Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog
      (note the double hyphen from the leading dot of .claude). Expose this as a module-level
      function taking the path and returning the name. Default projects root is
      ~/.claude/projects; the directory for a cwd is that root joined with the slug of the cwd.

      DISCOVERY. Under each session directory in the projects root, read every
      subagents/agent-<id>.meta.json. Select a row when its agentType equals
      harness-orchestrator. Depend on ONLY agentType, description and spawnDepth — these are the
      three universal keys across the sidecar shapes on this machine. Treat every other key as
      optional and never fail because one is missing. The sidecar is Claude Code's own file with
      no contract; this tool only reads it.

      PER-ROW MEASUREMENT reads subagents/agent-<id>.jsonl beside the sidecar. For each entry
      take the mapping at message.usage. Size is input_tokens + cache_read_input_tokens +
      cache_creation_input_tokens, each defaulting to 0. WHERE message.usage.iterations IS A
      NON-EMPTY LIST, the size for that entry is the MAX of that same three-field sum computed
      PER ITERATION — never the top-level value, which is the SUM across sub-calls and is tokens
      read, not context size. Where iterations is absent or empty, the top-level sum IS the size.
      peak is the max size over entries, current is the LAST entry's size, entries is the entry
      count.

      FEATURE ATTRIBUTION. Search the first four entries of that agent's transcript for the first
      match of FEAT-[0-9]+ and report it. Report unknown when there is no match. Do NOT use the
      entry's gitBranch, the entry's cwd, or the sidecar description: gitBranch names the checkout
      the agent was spawned from and today would report the FEAT-31 orchestrator as working on
      FEAT-30.

      UNMEASURED ROWS ARE ROWS, NEVER OMISSIONS (REQ-07). If the sidecar is not valid JSON, or has
      no agentType, or the matching .jsonl is missing or unreadable, still EMIT a row for it,
      marked unmeasured, naming the ABSOLUTE PATH of the file that defeated it. When any row is
      unmeasured the process exits 1. Otherwise exit 0. A row whose sidecar cannot be parsed at
      all counts as an orchestrator row for the purpose of the count, so a silent drop is
      impossible.

      OUTPUT. One line per row, aligned, carrying: agent id, feature, current, peak, entries, and
      for an unmeasured row the word unmeasured and the offending path. Thousands separators on
      the token figures. A one-argument invocation restricts output to that agent id and reports a
      stated not-found line with exit 1 if no such orchestrator exists. With no argument, every
      orchestrator row is printed. NO threshold, no headroom and no blind-spot footer in this
      task: those are T-06 and T-08, and adding them here would make SC-05's before-and-after
      assertion unwritable.

      Never crash on malformed input. Never read or write anything outside the projects root.

  - id: T-02
    title: Unit tests for the corrected arithmetic, the agentType filter and the unmeasured branch, each with a mutant-copy red proof
    traces: [REQ-01, REQ-02, REQ-06, REQ-07]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: building
    files:
      - .claude/skills/harness/bin/test-context-watch.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      python3 .claude/skills/harness/bin/test-context-watch.py
      # expect exit 0 and a final line naming the number of cases passed
      bash .claude/skills/harness/bin/run-unit-tests.sh --kind unit
      # expect the line: PASS test-context-watch.py
      # expect NO line containing MISCONFIGURED
    intent: |
      Create .claude/skills/harness/bin/test-context-watch.py. NO SUBPROCESS: load the tool with
