  - id: D-17
    choice: SC-01's live half is .claude/skills/harness/bin/verify-context-watch-live.py, a file DELIBERATELY NOT named test-*.py, delivered by T-13. The fixture half is T-07's test-context-watch-cli.py. The alternative of one test-*.py file that prints a loud skip when ~/.claude/projects is absent is REJECTED.
