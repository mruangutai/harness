      PART ONE — create .claude/skills/harness/bin/context-watch-hook.py. It is THIN by design and
      the thinness is what keeps T-16 in the team lane (D-24): it holds NO arithmetic, NO threshold
      comparison and NO message text. Python 3 standard library only. It writes nothing.
      Read the PostToolUse payload as JSON on stdin. Take session_id, agent_id, agent_type and cwd
      from it -- these are the fields notes/probe-hook-payload-identity.md established, and the
      source is session_id plus agent_id, NEVER transcript_path, which holds the PARENT session's
