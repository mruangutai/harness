    intent: |
      SC-07 (BRIEF.md line 132) requires that feature.json's runs items carry an agent identifier
      and that THE WRITE PATH REFUSES a run entry that omits it, enforced where DEC-191's closed
      key set is already enforced. It must be tested BOTH ways: an entry without the field is
      refused at write, AND a feature.json whose EXISTING entries lack it still validates. No
      existing feature.json is migrated (operator ruling, 2026-08-20).

      THOSE TWO HALVES ARE IN DIRECT TENSION AND THE SHAPE OF THE FIX IS WHAT RESOLVES IT. Read
      D-23 before writing a line. The short form: a schema `required` satisfies the first half and
      breaks the second, because check-domain.sh's post sweep reaches feature.json files this
      change never touched, so every Bash command in the repository would exit 2. The rule is
      POSITIONAL instead.

      PART ONE — .claude/skills/harness/bin/feature-schema.json. Add `agent` to
      properties.runs.items.properties as a string, with a description saying it names the agent
      that executed the run and that absence means the entry predates FEAT-31. Do NOT add it to
      that object's `required` list. Do NOT touch additionalProperties, do NOT touch the existing
      id, squad or verdict properties, and do NOT touch any other part of the schema.

      PART TWO — .claude/skills/harness/bin/feature_schema.py. Add a rule that runs ALONGSIDE the
      jsonschema validation, not inside it, and whose problems join the same returned list so
      check-domain.sh reports them through the path it already has at :815.
        THE RULE. Derive the feature directory name from the `display` path the caller passed --
        it is the path named in the message, and for a real write it is
        .harness/<repo>/features/<FEAT-NN-slug>/feature.json. Look that name up in a frozen
        literal map RUNS_AGENT_EXEMPT, mapping feature directory name to an integer count.
        DEFAULT TO 0 for any name absent from the map, and for a display path from which no
        feature directory name can be read. Then for each runs entry at index i: if
