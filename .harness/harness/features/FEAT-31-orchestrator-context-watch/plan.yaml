        every name in INTEGRATION_SCRIPTS MUST appear as an explicit literal path
        .claude/skills/harness/bin/<name> among the pipe-separated entries of
        test_kinds.integration.detect;
        no name in UNIT_SCRIPTS may appear there.
      Deliberately do NOT implement glob matching or kind precedence: whether an explicit path
      beats a catch-all glob is an unanswered question for the operator, and a check that depends
      on the answer would be built on an unwritten rule.

      The config path comes from the environment variable HARNESS_JSON, defaulting to
      .harness/harness.json relative to the directory this script already cd's into. Parse it with
      python3 -c, which this script already depends on. If the file cannot be read or parsed, or
      test_kinds.integration.detect is absent, print
        KIND-DRIFT: cannot read <path>: <reason>
      to stderr and exit 2. NEVER skip. A missing config must be a loud failure, because
      tests.yml lines 78 and 84 run this script as required steps and a silent skip inside a
      required step is a green suite that verified nothing.

      For each violation print ONE line to stderr, naming the file, in exactly these shapes:
        KIND-DRIFT: <name> is in INTEGRATION_SCRIPTS but absent from test_kinds.integration.detect
        KIND-DRIFT: <name> is in UNIT_SCRIPTS but present in test_kinds.integration.detect
      Print every violation, not just the first, then exit 2. The NAME in the message is the
      contract the test asserts against; do not reduce these to a count or a generic message.

      Run the cross-check on EVERY invocation, immediately after the existing test-*.py drift
      detector and before any test executes, for all --kind values including all — a mismatch must
      not be skippable by choosing a kind, for the same reason the existing detector runs over the
      union.

      Also add a mode: --check-kinds runs the existing drift detector and the new cross-check and
      then exits, running NO tests. The current argument parser accepts only --kind and rejects
      anything else with the usage message and exit 2; extend it so --check-kinds is accepted and
      --kind keeps its exact present behaviour and default of all. Update the usage line. This mode
      exists so part two's cases run in well under a second instead of driving the ~15s suite.

      PART TWO — create .claude/skills/harness/bin/test-run-unit-tests-kinds.py. It drives
      run-unit-tests.sh as a SUBPROCESS, which is what puts it in the integration kind. Register
      its filename in the INTEGRATION_SCRIPTS array in this same task. It is already named in
      test_kinds.integration.detect by T-11, which is why this task depends on T-11 — a new
      bin/test-*.py absent from that list would make the very check being added go RED on its own
      test file. Every fixture is a LITERAL written under tempfile.mkdtemp() and removed in a
      finally block; nothing is checked in.

      CASE 1, GREEN ON THE REAL TREE. Run run-unit-tests.sh --check-kinds with no HARNESS_JSON
      override. Assert exit 0 and assert the COUNT of lines containing KIND-DRIFT across stdout
      and stderr is EXACTLY 0. Record that count; case 2 compares against it.

      CASE 2, RED WITH THE MISMATCH NAMED. Read the real .harness/harness.json, write a MUTANT
      copy into the tmpdir with exactly one explicit path removed from
      test_kinds.integration.detect — use .claude/skills/harness/bin/test-check-state.py, which is
      in INTEGRATION_SCRIPTS and has been in integration.detect since before this feature. ASSERT
      THE MUTATION APPLIED before running anything: assert the mutant's detect string differs from
      the original AND that the removed path is absent from the mutant and present in the original.
      Then run run-unit-tests.sh --check-kinds with HARNESS_JSON pointed at the mutant. ASSERT THE
      OUTPUT CONTAINS A KIND-DRIFT LINE WHOSE TEXT INCLUDES THE LITERAL test-check-state.py, and
      assert the count of KIND-DRIFT lines is exactly 1, which is strictly greater than case 1's 0.
      THE EXIT STATUS IS NOT THE PROOF and must not be the only assertion — a non-zero exit cannot
      distinguish a detected mismatch from a crash. If the exit is non-zero but no KIND-DRIFT line
      naming that file appears, report the case as INCONCLUSIVE, print both outputs, and exit
      non-zero. Never report it as passed.

      CASE 3, THE OTHER DIRECTION. Mutant copy that APPENDS
      .claude/skills/harness/bin/test-render-brief.py — a UNIT_SCRIPTS member at 7299669 — to
      test_kinds.integration.detect. Assert the mutation applied, then assert the output carries a
      KIND-DRIFT line naming test-render-brief.py. This case is why the rule is stated in both
      directions.

      CASE 4, THE UNREADABLE CONFIG IS LOUD. Point HARNESS_JSON at a path inside the tmpdir that
      does not exist. Assert the output carries a KIND-DRIFT line naming that path and that the
      exit is non-zero. Then point it at a file containing the text not json at all and assert the
      same shape. A skip here would be invisible inside a required CI step.

      CASE 5, THE ARGUMENT PARSER DID NOT REGRESS. Assert run-unit-tests.sh --kind nonsense still
      exits 2 with a message naming the kinds, and that --check-kinds ran no test by asserting its
      stdout carries NO line beginning with PASS or FAIL.

      Print a summary line naming the number of cases passed and exit non-zero on any failure.

  - id: T-13
    title: SC-01's live half — an on-demand script that compares context-watch.py against an independent inline recomputation on a REAL orchestrator transcript, deliberately not named test-*.py
    traces: [REQ-01, REQ-02, REQ-05]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01, T-06]
    status: done
    files:
      - .claude/skills/harness/bin/verify-context-watch-live.py
    verify: |
      python3 .claude/skills/harness/bin/verify-context-watch-live.py --self-test
      # line 1 is the VERDICT: exit 0 only when the tool and the independent recomputation agree.
      # Kept bare so no pipe can swallow that status.
      python3 .claude/skills/harness/bin/verify-context-watch-live.py --self-test | grep -q 747992
      # THE NUMBER IS COMPARED, NOT COMMENTED. This was the worst instance in the plan: the
      # expected value 747992 sat in a `#` comment, and --self-test exiting 0 proved nothing
      # whatsoever about which number was printed -- a tool reporting the naive 1494870 on both
      # sides would AGREE with itself and exit 0. 747992 vs 1494870 is the exact arithmetic defect
      # this whole feature exists to catch (BRIEF.md lines 30-38), so leaving it in a comment left
      # the feature's central claim unasserted.
      test "$(python3 .claude/skills/harness/bin/verify-context-watch-live.py --self-test | grep -c 1494870)" = "0"
      # AND THE FORBIDDEN NUMBER IS FORBIDDEN. Both halves are needed: the fixture keeps the two
      # values distinct precisely so that reporting either one is observable, and asserting only
      # the presence of 747992 would pass output that printed both.
      python3 .claude/skills/harness/bin/verify-context-watch-live.py --projects-dir /nonexistent-projects-dir some-agent-id; test $? -ne 0
      # line 4: the non-zero exit is asserted here...
      test "$(python3 .claude/skills/harness/bin/verify-context-watch-live.py --projects-dir /nonexistent-projects-dir some-agent-id 2>&1 | grep -c 'Traceback')" = "0"
      # ...and THIS is the line that carries the comment's real content. A TRACEBACK ALSO EXITS
      # NON-ZERO, so "non-zero exit and never a traceback" was half-unenforced: the half that
      # mattered, since a crash is the failure mode being excluded, not a clean refusal.
      python3 .claude/skills/harness/bin/verify-context-watch-live.py --projects-dir /nonexistent-projects-dir some-agent-id 2>&1 | grep -qi 'no such agent\|not found'
      # and the STATED line is required to be present, so a silent non-zero exit fails too.
      ls .claude/skills/harness/bin/test-verify-context-watch-live.py 2>/dev/null; test $? -ne 0
      # expect success: this file must NOT be named or shadowed by a test-*.py sibling
      bash .claude/skills/harness/bin/run-unit-tests.sh --kind unit
      # expect NO line containing MISCONFIGURED — the file's name keeps it out of the drift detector
    intent: |
      Create .claude/skills/harness/bin/verify-context-watch-live.py. THE FILENAME IS PART OF THE
      DESIGN AND MUST NOT BE CHANGED TO test-*.py OR verify-*_test.py OR ANYTHING MATCHING
      test-*.py. run-unit-tests.sh's drift detector loops over "$BIN_DIR"/test-*.py and fails the
      ENTIRE suite with MISCONFIGURED on any unlisted match, whichever --kind is running; a
      differently-named file never reaches it. Registering this file as a test instead would make
      CI read ~/.claude/projects, which does not exist on ubuntu-latest, and go red on every PR.
      See D-17 for the door and its cost. Do NOT register this file anywhere: not in UNIT_SCRIPTS,
      not in INTEGRATION_SCRIPTS, not in test_kinds. Python 3 standard library only. It WRITES
      NOTHING, anywhere, ever.

      Usage: python3 .claude/skills/harness/bin/verify-context-watch-live.py <agent-id>
      Flags: --projects-dir PATH overrides the projects root, default ~/.claude/projects;
             --self-test runs the fixture case below and exits, reading nothing outside a tmpdir.

      WHAT IT PROVES. For the named agent id it computes current context, peak context and entry
      count TWICE and compares them to the token:
        (1) by invoking .claude/skills/harness/bin/context-watch.py as a SUBPROCESS with the same
            agent id and the same --projects-dir, and parsing current, peak and entries out of its
            stdout;
        (2) by an INDEPENDENT recomputation WRITTEN INLINE IN THIS FILE: walk that agent's
            transcript JSONL, read message.usage per entry, sum input_tokens,
            cache_read_input_tokens and cache_creation_input_tokens, take the MAX of that sum over
            the elements of message.usage.iterations where iterations is a non-empty list and the
            top-level sum otherwise, take the max over entries for peak and the last entry for
            current.
      IMPORT NOTHING FROM context-watch.py — not the module, not a helper, not a constant, not via
      importlib. SC-01 forbids it explicitly: sharing that code would make the criterion compare a
      function to itself.

      OUTPUT. Print both triples side by side, labelled tool and independent, then one final line
      PASS or FAIL naming which figure disagreed. Exit 0 only when all three agree. Exit non-zero
      with a stated single line — never a traceback — when: the projects dir does not exist, the
      agent id matches no sidecar, or the transcript cannot be read. Name the path in each case.

      --self-test. Build a fixture under tempfile.mkdtemp() removed in a finally block: one session
      dir, one sidecar with agentType harness-orchestrator, and a transcript whose single entry has
      message.usage with input_tokens 0, cache_creation_input_tokens 0, cache_read_input_tokens
      1494870, and iterations of three mappings whose cache_read_input_tokens are 746878, 0 and
      747992 with the other two fields 0. Run the whole comparison against that fixture and assert
      BOTH sides report peak 747992 and that neither reports 1494870. The two values are
      deliberately distinct. This mode exists so the script's plumbing is exercised by an automated
      verify even though nothing in the test matrix ever runs the file.

      HOW SC-01's LIVE HALF IS ACTUALLY DISCHARGED, and record this in the receipt: an agent runs
      this script by hand against a LIVE orchestrator's agent id while that orchestrator is
      running, and pastes the PASS line with the agent id and the timestamp. That is what
      verify: automated means under the operator's 2026-08-21 ruling — an agent runs it on demand,
      not tests.yml. The fixture half of SC-01 is T-07 and stays where it is.

