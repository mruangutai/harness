    dec: none
  - id: D-09
    choice: SC-01 is SPLIT. The automated half runs against a fixture transcript with the corrected arithmetic RE-IMPLEMENTED INLINE in the test, never imported from the tool. The live-orchestrator half is routed to SC-10's UAT.
    because: CI is ubuntu-latest with no ~/.claude/projects, so no automated test can read a live transcript. Importing the tool's own arithmetic would make the criterion compare a function to itself. The live half is demonstrable by hand — a running orchestrator's peak and current were read from disk while it ran. Raised to the operator as a blocking open question because it narrows an approved criterion.
