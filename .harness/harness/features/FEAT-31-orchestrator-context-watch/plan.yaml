      probe told the plan to check: across the 25 most recently modified harness-orchestrator
      transcripts on this machine on 2026-08-21, 3280 tool_use events are Bash 2858, Write 221,
      Agent 121, Read 78, SendMessage 2 -- so Write|Edit|Bash covers 3079 of 3280, 93.9 percent,
      and Bash alone covers 87 percent. Edit appears ZERO times and the dispatch tool is named
      Agent, not Task. Re-run that count at your own date and record it; a matcher that never
      fires for an orchestrator is the green-and-incapable-of-red failure in hook form, and this
      is the measurement that shows it does fire.

      PART THREE — create .claude/skills/harness/bin/test-context-watch-hook.py, and REGISTER its
      filename in the INTEGRATION_SCRIPTS array in run-unit-tests.sh in THIS SAME TASK. It drives
      the hook as a SUBPROCESS with a JSON payload on stdin, which is what puts it in the
      integration kind and what makes it SC-13's evidence. Every fixture is a literal written
      under tempfile.mkdtemp() and removed in a finally block; nothing is checked in and nothing
