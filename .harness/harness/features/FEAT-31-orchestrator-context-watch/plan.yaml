  - id: D-09
    choice: SC-01 is SPLIT, and it KEEPS verify automated, evidence integration. AMENDED by D-17 after the operator's A-1 ruling. The fixture half is T-07, running against a fixture transcript with the corrected arithmetic RE-IMPLEMENTED INLINE in the test, never imported from the tool. The live-orchestrator half is T-13, a script an agent runs on demand. The live half is NOT routed to SC-10's UAT and SC-01 is NOT reclassified to uat.
    because: The leg that survives is that the check must not import the tool's own arithmetic, because that compares a function to itself. The leg that did NOT survive was the premise that verify automated means tests.yml runs it. The operator ruled otherwise on 2026-08-21 - automated means an agent runs it on demand. No harness document couples automated to the CI job; harness-spec-driven SKILL.md line 155 says automated names its evidence test kind and harness-brief SKILL.md line 83 only demands that the kind have a runner.
    dec: none
  - id: D-10
    choice: The feature an orchestrator is on is read from the FIRST FEAT-NN token in the first four entries of that agent's own transcript. Never from the transcript entry's gitBranch, never from the sidecar description, never from cwd.
    because: Measured 89 of 89 for the transcript-prefix method. gitBranch actively lies, demonstrated on the FEAT-31 orchestrator's own transcript which reads feat/FEAT-30-worktree-per-feature; the sidecar description matched only 66 of 94.
    dec: none
  - id: D-11
    choice: Context size for one entry is message.usage input_tokens plus cache_read_input_tokens plus cache_creation_input_tokens, EXCEPT that where message.usage.iterations is a non-empty list the size is the MAX of that same sum computed per iteration. A sum across iterations is never reported. THE MEASURED SET IS ONE SET AND ALL THREE FIGURES ARE COMPUTED OVER IT, CORRECTED 2026-08-21 - the measured set is exactly those transcript lines that parse as JSON AND carry a mapping at message.usage. peak is the max size over that set, current is the size of the LAST MEMBER OF THAT SET - never the last line of the file - and entries is the CARDINALITY of that set. A line that parses but carries no message.usage contributes nothing to any of the three and is never counted as a zero.
    because: The iterations half is unchanged and its ground is unchanged - where a request makes nested sub-calls the top-level field is their SUM, so the naive read reports tokens read and not context size, which is what overstated this project's median peak by 78 percent. The three-figures-one-set half is a CORRECTION of this decision's own earlier wording, which said current is "the last entry's value" and left entries undefined, and both halves of that wording produce numbers the approved criteria forbid. MEASURED on agent a7783f0ec41e6a8c6 on 2026-08-21 - 1046 transcript lines parse as JSON, 669 of them carry message.usage, peak is 696472 which matches BRIEF.md line 43 to the token, the last member of the measured set is also 696472, and the last LINE of the file carries no message.usage - so the earlier reading reports current 0 for an orchestrator holding 696472 tokens. A current of 0 defeats SC-10 question 3 outright, since headroom computed from it is the whole threshold, and it defeats REQ-02, which requires the tool to say so rather than print a figure the record cannot support. The entries half is forced by T-13 and SC-01, which demand that the tool and an independent recomputation agree on all THREE figures to the token - with entries undefined between 1046 and 669 that agreement is undefined too, so the criterion could fail on a correct tool or pass on a broken one. 669 is chosen over 1046 because it is the set the other two figures are already computed over, and three figures over one set is the weakest statement that makes the comparison well defined.
    dec: none
  - id: D-12
    choice: SC-10 is verify uat and NO TASK DELIVERS IT. T-01, T-06 and T-08 only make it runnable. The operator executes it by hand against at least one LIVE orchestrator.
    because: It requires a running orchestrator, which no automated test on any machine can guarantee, and its pass conditions are what the operator can answer from the output alone.
    dec: none
  - id: D-13
    choice: SECOND HALF. The in-context warning is delivered by a PostToolUse hook that exits 2 with its text on stderr, never by PreToolUse, and its wording must not claim anything was stopped. Which matcher it registers under is an open item that run must CHECK against a real orchestrator's tool mix rather than assume.
    because: In PostToolUse the tool has already run, so exit 2 only carries stderr back to the agent, which is exactly the operator ruling that the warning advises and does not refuse. A matcher that never fires for an orchestrator is the green-and-incapable-of-red failure in hook form.
    dec: none
  - id: D-14
    choice: SECOND HALF. Four surfaces are main-session-direct and every cutover is the operator's hands — .claude/settings.json, check-domain.sh, check-state.sh and test-check-state.py.
    because: DEC-174 carves out the enforcement layer and its list is non-exhaustive; settings.json and the templates directory additionally resolve to NOBODY.
    dec: DEC-174
  - id: D-15
    choice: SECOND HALF. feature.json runs items gain an agent identifier inside DEC-191's closed key set, and NO existing feature.json is migrated, so absence of the field can only mean the entry predates the change.
    because: runs items are additionalProperties false with required id, squad, verdict, so the key must be added to the schema to be writable at all, and the read side needs absence to be unambiguous.
    dec: DEC-191
  - id: D-16
    choice: SECOND HALF. SC-15 IS SPLIT. Its automatable half asserts that INV-17 rejects a handoff whose four required section headings are all present but whose Next section body is empty, which is the exact mutation SC-15 names. Its agent-behaviour half, that a fresh orchestrator's first dispatch matches the predecessor's Next section, has NO TASK and is routed to the operator alongside SC-10, because only a live orchestrator can produce a first dispatch.
    because: Measured at 6f651f1, INV-17 tests only heading PRESENCE, via HANDOFF_HEADINGS at check-state.sh line 509 and the membership test at line 614, so an emptied Next section passes the gate today and the new assertion goes red before the change. No automated test can spawn a harness orchestrator, and D-12 forbids reading the projects directory, so the behaviour half is unautomatable for the same reason SC-10 is. Raised to the operator as a blocking open question because it narrows an approved criterion that reads verify automated, evidence integration.
    dec: DEC-159

  - id: D-17
    choice: SC-01's live half is .claude/skills/harness/bin/verify-context-watch-live.py, a file DELIBERATELY NOT named test-*.py, delivered by T-13. The fixture half is T-07's test-context-watch-cli.py. The alternative of one test-*.py file that prints a loud skip when ~/.claude/projects is absent is REJECTED.
    because: run-unit-tests.sh's drift detector loops over "$BIN_DIR"/test-*.py, so a bin file whose name does not match that glob never reaches it and cannot raise MISCONFIGURED. The skip variant is the weaker door - tests.yml lines 78 and 84 run --kind unit and --kind integration as required steps, so a printed skip inside a required step is a green suite that verified nothing, which is this repository's most-filed defect shape. THE COST, NAMED - verify-context-watch-live.py matches no test_kinds detect glob at 7299669, so it sits OUTSIDE the test matrix and outside tests.yml, and nothing runs it unless an agent is told to. That is the price of the operator's A-1 ruling and it is accepted, not hidden. T-13's own verify covers the script's plumbing with a fixture self-test so the file is not wholly unexercised.
    dec: none

  - id: D-18
    choice: F-1's instance and D-4's class are ONE edit to ONE file in ONE task. T-11, execution_mode team, execution_agent harness-dev-ops, appends TEN explicit literal paths to test_kinds.integration.detect in .harness/harness.json. T-07 does NOT carry .harness/harness.json in its files. The class is CLOSED, not widened.
    because: Measured at 7299669 in the FEAT-31 worktree, INTEGRATION_SCRIPTS in run-unit-tests.sh holds 12 entries and test_kinds.integration.detect names 4 of them explicitly, so EIGHT classify as unit via unit.detect's catch-all .claude/skills/harness/bin/test-*.py — test-validate-digest.py, test-check-expertise.py, test-gen-decisions-index.py, test-bash-write-guard.py, test-check-domain.py, test-harness-yaml.py, test-upgrade-config.py, test-merge-settings.py. The ten are those eight plus test-context-watch-cli.py (T-07, the F-1 instance) and test-run-unit-tests-kinds.py (T-12). It is one task and not two because check-domain.sh --resolve .harness/harness.json returns harness-dev-ops ONLY at 7299669, so T-07 at harness-backend-dev cannot carry that path and check-plan-routes.py would report a DEVIATION for it. The split is FORCED by the grant, not chosen. THE SWEEP, all ten tasks at 7299669 - T-02 appends test-context-watch.py to UNIT_SCRIPTS and unit.detect's catch-all already classifies it unit, so it agrees and needs nothing; T-05 edits test-upgrade-config.py, which is one of the eight and is fixed by T-11 rather than by T-05, whose lane is harness-backend-dev; T-10 edits test-check-state.py, already explicit in integration.detect; no other task creates or moves a test file. COST - 1 new task, 1 config file, 10 string appends, no code. The template .claude/skills/harness/templates/harness.json is NOT touched - its integration.detect is tests/integration/** with cmd null at 7299669, and the ten paths are this repository's own bin tests, so propagating them to a fresh project would name files that will never exist there.
    dec: DEC-160

  - id: D-19
    choice: D-4's check lands INSIDE .claude/skills/harness/bin/run-unit-tests.sh as a cross-check between its two script arrays and .harness/harness.json's test_kinds, plus a --check-kinds mode that runs only that cross-check and exits. T-12, execution_mode main-session-direct. Its test is a NEW file .claude/skills/harness/bin/test-run-unit-tests-kinds.py, registered in INTEGRATION_SCRIPTS by T-12 and named in test_kinds.integration.detect by T-11. THE RULE IS A SET COMPARISON, NOT A CLASSIFIER - every INTEGRATION_SCRIPTS entry must appear as an explicit literal path in integration.detect, and no UNIT_SCRIPTS entry may.
    because: Today the drift detector reads its own two bash arrays and NEVER reads harness.json, so a mismatch between the arrays and test_kinds is invisible to every gate — which is exactly how the eight in D-18 went unnoticed. Placing the cross-check in run-unit-tests.sh makes it unskippable - that script IS the command behind tests.yml lines 78 and 84, the two required steps. That same fact makes it enforcement layer by CATEGORY rather than by analogy — DECISIONS.md lines 4851 to 4854 declare the enumeration non-exhaustive and rule that a script becomes enforcement layer on the day it becomes a gate, the category deciding and the list recording; lines 4856 to 4859 add that the cutover which makes a gate use new logic is main-session-direct. D-06 is NOT contradicted - its stated basis is that a one-element array append changes no gate rule, and T-02 and T-07 remain team on exactly that basis. T-12 changes what the runner REJECTS, which D-06 never covered. THE SET COMPARISON is chosen over a glob classifier so the check does not depend on the unwritten precedence rule in Q-B - it needs no answer to whether an explicit path beats a catch-all glob. THE SELF-REFERENCE IS RESOLVED, not left - test-run-unit-tests-kinds.py matches the drift detector's own test-*.py glob, so it must sit in one array, it drives run-unit-tests.sh as a subprocess so that array is INTEGRATION_SCRIPTS, and it must therefore also be explicit in integration.detect or the new check goes red on itself — which is why T-11 lists it and why T-12 depends on T-11.
    dec: DEC-174

  - id: D-20
    choice: SC-14's approved second half is a SIBLING task T-14, not folded into T-10, and T-14 runs BEFORE T-10 (T-10 depends_on T-14). T-14 RESTRUCTURES - it moves the handoff shape check OUT of the for prev in SEAM_NOTES[_status] loop in check-state.sh into a single pass that globs notes/handoff-*.md per feature directory, so the loop keeps only the missing-note branch. SEAM_NOTES is UNCHANGED. C-3's double-report risk is resolved BY STRUCTURE, not by ordering. BRIEF.md's SC-14 mechanism clause is rewritten by this plan round because the mechanism it named is now forbidden.
    because: A sibling is chosen over a fold because T-14 is a refactor with its own red proof while T-10 is a new rule, and one dispatch carrying both makes a failed refactor indistinguishable from a failed empty-body check. T-14 runs FIRST so T-10's empty-body check is written ONCE, into the single extracted shape-check site, instead of being written inside the loop and then moved. BY STRUCTURE beats BY ORDERING because after the extraction the shape check has exactly ONE call site and the glob finds every existing note including the seam-stem ones, so no file can be reported twice by construction rather than by a rule someone must remember. Measured at 7299669 - check-state.sh line 592's loop both builds the required-note path and shape-checks it at line 614, which is the shared site; SEAM_NOTES is at line 495 and the comment above it, lines 475 to 481, records that deriving stems from status values matches on a case-insensitive filesystem and goes dark on Linux CI — the only machine that gates the merge. HANDOFF_HEADINGS at line 509 and the 60-line cap are untouched. A shape failure stays a VIOLATION through bad.append; the warn-instead variant was offered to the operator and REJECTED. The FEAT-01 and FEAT-02 literal exemption at HANDOFF_EXEMPT_LITERAL line 523 and the all-main-session-direct exemption at _handoff_exempt line 525 skip only the MISSING-note branch - once a file exists the shape check runs regardless, and the glob widens which files reach it rather than changing that rule. main-session-direct for the same reason as T-10, DECISIONS.md lines 4851 to 4854.
    dec: DEC-174

  - id: D-21
    choice: SC-15 IS SPLIT AND SAYS SO HERE. T-10 delivers the automatable half, INV-17 rejecting a handoff whose four headings are present but whose '## Next' body is empty. The behaviour half, a fresh orchestrator's first dispatch matching its predecessor's '## Next', has NO TASK and is GRADED ONCE BY HAND against a real successor, alongside SC-10. BRIEF.md's SC-15 still reads verify automated, evidence integration and this plan does NOT edit it.
    because: The operator ruled A-3 approved as T-10 plus a UAT re-verify on 2026-08-21, so the split is settled and D-16's blocking question is closed. BRIEF.md is APPROVED at 2026-08-21 and only the C-4 rewrite of SC-14 was authorised, so SC-15's text is left byte-identical rather than quietly reclassified — a signed criterion is not the planner's to re-methodise. THE CONSEQUENCE IS NAMED SO IT IS NOT SILENT - a goal-check reading BRIEF.md alone would report SC-15 as fully automated, which is FALSE. It is met only when the hand grading is also recorded, and until then the behaviour half is not_met.
    dec: DEC-159

  - id: D-22
    choice: D-4's routing splits by DEC-174 am.4's CATEGORY rule. The eight-plus-two data entries in .harness/harness.json go to team, harness-dev-ops (T-11). The new cross-check and its test go to main-session-direct (T-12). This is a DEFAULT ADOPTED IN THE ABSENCE OF AN OPERATOR ANSWER to Q-A, carried in this plan's return as non-blocking, and it is the operator's to overrule in one read.
    because: Q-A asks whether harness.json's test_kinds is enforcement layer under DEC-174. It is config CONSUMED BY gates rather than a hook or a gate script, and DECISIONS.md lines 4856 to 4859 carry the governing analogy - a module a gate imports is not itself a gate, a squad may write the library, and the cutover that makes a gate USE it is main-session-direct. test_kinds is on the library side of that line. Three further facts point the same way - check-domain.sh --resolve .harness/harness.json returns harness-dev-ops at 7299669, so the grant exists; T-03 in this same plan already edits that file as execution_mode team, so ruling otherwise would retroactively invalidate T-03's lane; and DECISIONS.md lines 4851 to 4854 name five SCRIPTS and their tests, not a config file. The check itself is the opposite case - it becomes a gate on the day it lands, because run-unit-tests.sh is the command behind tests.yml's two required steps, so it is enforcement layer by category and not by analogy, and its test joins it because a gate's test is the only thing proving the gate discriminates.
    dec: DEC-174

  - id: D-23
    choice: THIRD HALF, SC-07. The runs item gains an OPTIONAL key agent in feature-schema.json - declared in properties so it is writable at all under additionalProperties false, and deliberately NOT in the schema's required list - and the refusal is a SEPARATE rule in feature_schema.py keyed on POSITION - an entry at index greater than or equal to that feature's frozen exempt COUNT must carry a non-empty agent, and an entry below it need not. The exempt count is a frozen literal map from feature directory name to the number of runs entries that feature had at the cutover sha, defaulting to ZERO for any feature absent from the map. T-15 delivers all of it and it is main-session-direct.
    because: The two halves of SC-07 are in direct tension and only a positional rule satisfies both. Putting agent in the schema's required list satisfies "a run entry without the field is refused at write" and BREAKS "a feature.json whose existing entries lack it still validates" - measured at 2cf792f, 31 feature.json files carry 390 runs entries and the keys present across all of them are exactly id, squad and verdict, so a required agent denies every subsequent write to all 31, and check-domain.sh's post sweep reaches untouched files, so every Bash command in the repository would exit 2. Three rules were considered and rejected with their reasons named. A DIFF against the on-disk previous state is the strongest rule and is UNAVAILABLE - check-domain.sh:1027-1034 records that only the PRE Write route carries whole-file content, and in POST the disk already holds the new version, so the diff exists on one route of four - green and incapable of red on the others. A DATE-PREFIX cutoff on the run id is DEAD ON MEASUREMENT - 175 of the 390 existing ids are not date-prefixed, so the pattern cannot be enforced, and FEAT-31's own six ids (plan4-product, build-eng and four others) are all non-date, so the harness's live convention is the non-conforming one and the rule would almost never fire. A MONOTONE SUFFIX rule - once one entry carries agent every later one must - satisfies both halves but has a hole of exactly one entry per feature, which is the entry that matters, because a feature with no agent-bearing entry yet can append one more without it. The frozen count closes that hole completely and is exact - an existing feature's legacy entries are exempt by index, its next entry is not, and a NEW feature defaults to zero so its FIRST entry is required. Cost, named - the map is 31 lines of literal data that must be measured at the sha the task lands rather than at plan time, and deleting a legacy runs entry shifts the indices so a legacy entry becomes required - a loud attributable denial rather than a silent pass, which is the right direction to fail. THE RESIDUAL GAP, stated rather than hidden - the map is keyed on the feature directory name parsed out of the display path, so a feature.json validated under a display path carrying no FEAT id defaults to exempt count zero and requires agent everywhere, which is strict rather than permissive.
    dec: DEC-191
  - id: D-24
    choice: THIRD HALF, SC-13. The warning is SPLIT ACROSS TWO LANES BY THE MODULE-VERSUS-CUTOVER RULE, and the split is deliberate rather than incidental. T-16, execution_mode team, harness-backend-dev, puts the warning LOGIC in context-watch.py as a module-level function and a --warn-for AGENT_ID mode that reads nothing but a transcript and prints nothing but text. T-17, execution_mode main-session-direct, creates the THIN registered hook .claude/skills/harness/bin/context-watch-hook.py, registers it in .claude/settings.json, and delivers the hook's own test. context-watch.py NEVER becomes the registered hook.
    because: DECISIONS.md lines 4864 to 4867 at 2cf792f state the rule this follows - a module a gate imports is not itself a gate, a squad may write the library, and the cutover that makes a gate use it is main-session-direct. Registering context-watch.py itself as the hook would make it a hook, put it in DEC-174's category by lines 4859 to 4862, and RETROACTIVELY move T-01, T-06, T-08 and T-16 out of the team lane - three of which are already built under it. The split is therefore not a convenience - it is what keeps the built work's lane honest. The dividing line is stated so a reader can check it - the LIBRARY decides whether to warn and what the text says and cannot reach settings.json; the HOOK parses the PostToolUse payload, calls the library, writes the text to stderr and exits 2. Nothing in the library knows it is being called by a hook, so the library's violation set is identical before and after registration, which is exactly the proof lines 4864 to 4867 ask for. Contrast with D-23, where the same split was examined and found UNAVAILABLE because check-domain.sh already imports the module - the two decisions apply one rule and reach opposite answers, and the difference is whether a cutover exists to be separated out.
    dec: DEC-174
  - id: D-25
    choice: THIRD HALF, SC-13. The hook registers on the EXISTING PostToolUse entry whose matcher is Write|Edit|Bash - the command is appended to that entry's hooks array beside check-domain.sh --post. No new matcher, no PreToolUse registration, and it exits 2 with the warning on stderr. It warns whenever the measured current size is at or above the threshold, on every crossing tool call, with no state and no once-only suppression.
    because: The matcher was the one thing notes/probe-hook-delivery-channel.md left open and told the plan to CHECK rather than assume, so it was measured rather than inherited. Across the 25 most recently modified harness-orchestrator transcripts on this machine on 2026-08-21, 3280 tool_use events break down as Bash 2858, Write 221, Agent 121, Read 78, SendMessage 2 - so Write|Edit|Bash covers 3079 of 3280, or 93.9 percent, and Bash alone covers 87 percent. The existing matcher fires abundantly for an orchestrator, so the green-and-incapable-of-red hook shape the probe warned about does not arise and no new matcher is justified. Two further measured notes - Edit appears ZERO times, so its presence in the matcher is inert here, and the dispatch tool is named Agent rather than Task, which matters to anyone tempted to add Task to the matcher. PreToolUse is excluded by the operator's ruling, not by measurement - in PRE, exit 2 IS the refusal. WARN-EVERY-TIME over warn-on-the-crossing-edge, and the trade is real in both directions - the edge rule warns approximately once and is stateless, but it MISSES ENTIRELY when the hook does not fire on the exact call that crosses, and a warning that silently never arrives is the failure DEC-148's watchdog died of. Warn-every-time cannot miss and its cost is repetition, bounded by the orchestrator doing what the warning asks. Repetition is the cost accepted; it is raised to the operator as a non-blocking question rather than settled here.
    dec: none
