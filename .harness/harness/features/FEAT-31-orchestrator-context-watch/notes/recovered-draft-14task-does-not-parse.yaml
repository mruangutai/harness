  - id: T-08
    title: Add the hook mode that warns a crossing orchestrator in its own context
    traces: [REQ-08]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02]
    status: pending
    files:
      - .claude/skills/harness/bin/context-watch.py
    verify: |
      python3 -c "import subprocess,json,sys;p=subprocess.run([sys.executable,'.claude/skills/harness/bin/context-watch.py','--hook'],input=json.dumps({'hook_event_name':'PreToolUse','tool_name':'Task','agent_type':'harness-backend-dev','agent_id':'zzz','session_id':'s','cwd':'/tmp'}),capture_output=True,text=True);assert p.returncode==0,(p.returncode,p.stderr);assert p.stdout.strip()=='' or 'hookSpecificOutput' not in p.stdout;print('non-orchestrator is silent, exit 0')"
    intent: |
      Add a --hook mode to .claude/skills/harness/bin/context-watch.py. It reads one JSON
      hook payload on stdin and ALWAYS exits 0. It must never exit 2, never print a
      permissionDecision, and never block a tool call: the operator ruled on 2026-08-20 that
      the warning advises and does not refuse, because a blocking hook would trap an
      orchestrator whose own handoff writes fell outside the allow-list.

      Identity comes from the payload's session_id plus agent_id, and NEVER from
      transcript_path. A probe on 2026-08-20 captured a real subagent PreToolUse payload:
      transcript_path holds the PARENT session's transcript and session_id is the parent's
      id, so the transcript this hook must read is
      <projects_root>/<slug_for_cwd(payload["cwd"])>/<payload["session_id"]>/subagents/agent-<payload["agent_id"]>.jsonl.
      Build that path with the functions T-01 added; do not re-derive the slug inline.

      Exit 0 immediately and print nothing at all when: the payload does not parse; it lacks
      agent_id or session_id or cwd; payload["agent_type"] is not exactly
      "harness-orchestrator"; the transcript file is absent or unreadable; or scan_transcript
      reports peak below threshold(). A hook that speaks when it has nothing to say is a hook
      the reader learns to ignore.

      Rate-limit to one warning per crossing per agent. The stamp is
      os.path.join(tempfile.gettempdir(), "harness-context-watch", payload["agent_id"]),
      holding the integer peak at which the last warning fired. Warn only when the current
      peak is at least threshold() AND at least 1.25 times the stamped value, then rewrite
      the stamp. Create the directory with makedirs(exist_ok=True) and treat any OSError as
      no stamp: degrade to warning more often, never to warning less. NOTHING under
      .harness/ or .claude/skills/ is written by this mode.

      When it does warn, print ONE json.dumps object to stdout carrying both channels,
      because this repository has verified additionalContext delivery only on SubagentStart
      and never on PreToolUse:
        hookSpecificOutput: {hookEventName: "PreToolUse", additionalContext: <the text>}
        systemMessage: <the same text>
      The text must name, in this order: the current peak in tokens; the threshold; the
      nearest seam from nearest_seam(); and the instruction to end at that seam after writing
      notes/handoff-<stem>.md, or, when nearest_seam returns the mid-phase string, to write
      notes/handoff-mid-<phase-stem>.md and end anyway rather than continue. It must state
      that this advises and does not block. Keep it under 12 lines: it lands inside the
      context it is warning about.

