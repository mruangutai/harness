decisions:
  - id: D-01
    choice: The tool is .claude/skills/harness/bin/context-watch.py, and its hook mode is
      the same file invoked as context-watch.py --hook, following validate-digest.py --hook.
    because: One module means one arithmetic implementation, so the operator view and the
      in-context warning can never disagree about a number.
    dec: none

  - id: D-02
    choice: Context size is the largest single prompt in one request, computed by resolving
      message.usage.iterations per iteration and taking the maximum, never the top-level
      input plus cache_read plus cache_creation sum.
    because: Where a request makes nested sub-calls the top-level fields are their SUM, so
      the naive read reports tokens READ across sub-calls as if it were one context.
    dec: none

  - id: D-03
    choice: SC-07's write-path rule is DIFF-SCOPED against git HEAD. feature_schema builds
      legacy_ids as the set of ids of runs entries in git HEAD's copy of the target file
      that themselves lack agent_id, and requires agent_id on every runs entry whose id is
      not in that set. Prior content unavailable (untracked file, no git) means the set is
      empty and agent_id is required on every entry.
    because: check-domain.sh validates the whole proposed document, so a blanket required
      breaks the no-migration ruling and a blanket optional lets the first new entry omit it.
      HEAD rather than the on-disk file, because on the PostToolUse route disk already holds
      the NEW content, which would grandfather every entry and make that route toothless.
      What it does NOT catch, stated: (a) presence, not truth, so agent_id set to a wrong or
      placeholder id passes; (b) a new run reusing a legacy entry's id is grandfathered;
      (c) a feature.json whose legacy entries were never committed loses grandfathering
      entirely, which is safe today because all 372 existing runs entries across 26 tracked
      feature.json files carry exactly id, squad and verdict and are committed at
      6f651f16c1e198f4f0e9cc5f78f681835581611d; (d) an Edit that appends is caught only on
      the PostToolUse route, after the write has landed, because the PreToolUse route blocks
      Write alone.
    dec: DEC-191

  - id: D-04
    choice: The new runs item key is agent_id, a string, added to feature-schema.json's runs
      item properties. required stays exactly id, squad, verdict.
    because: agent_id is the name Claude Code's own hook payload uses, and leaving it out of
      required is what makes D-03's diff scope the single enforcement point instead of two
      rules that can disagree.
    dec: DEC-191

  - id: D-05
    choice: The threshold key is budgets.orchestrator_context_tokens in .harness/harness.json,
      with a sibling _orchestrator_context_tokens_rationale string, defaulting to 200000 when
      absent or unparseable. Its existence is declared inside the DEC-159 edit of T-14.
    because: DEC-160 requires a decision that adds a harness.json key to say so, and DEC-148
      is where 200000 came from. The name is new rather than the deleted
      context_per_turn_tokens because the quantity changed from a per-turn average to a
      largest-single-prompt peak, and reusing the old name would assert a false equivalence.
    dec: DEC-160

  - id: D-06
    choice: The warning fires from a PreToolUse hook on matcher Task|Agent, filtered to
      agent_type equal to harness-orchestrator, and ALWAYS exits 0. It emits both
      hookSpecificOutput.additionalContext and systemMessage, and rate-limits itself to one
      warning per crossing per agent using a stamp file under the system temp directory.
    because: Task|Agent is the decision point where a relay is actually cheap, is already the
      registered seam for dispatch-guard.sh, and costs one transcript read per dispatch rather
      than one per tool call. Exit 0 because the operator ruled the warning advises and never
      refuses. Both channels because this repository has verified additionalContext delivery
      only on SubagentStart, never on PreToolUse, so systemMessage is the fallback that at
      least reaches the operator.
    dec: DEC-174

  - id: D-07
    choice: Registering a new test file in run-unit-tests.sh's UNIT_SCRIPTS or
      INTEGRATION_SCRIPTS array is TEAM lane, not enforcement layer.
    because: It is absent from DEC-174's enumeration and check-domain.sh --resolve grants it
      to harness-backend-dev and harness-dev-ops; it selects which tests run and asserts no
      test file is unregistered, but it decides no policy. Overrule this in one read if the
      drift detector counts as a gate.
    dec: none

  - id: D-08
    choice: SC-14's assertion changes. INV-17 gains a glob over every
      notes/handoff-*.md it finds under a feature and shape-checks each one, four headings
      and the 60-line cap, while SEAM_NOTES keeps governing which notes are REQUIRED. The
      shape check moves out of the SEAM_NOTES loop so a required note is reported once.
    because: The criterion as written is already true by silence and cannot go red.
      check-state.sh:593 is the only place a handoff path is constructed and it only builds
      paths for stems in SEAM_NOTES[status], so notes/handoff-anything-else.md is never
      opened, never demanded and never rejected. Verified separately that check-domain.sh
      already shape-gates any stem at write, RE_HANDOFF at check-domain.sh:665 matching
      handoff-[a-z0-9-]+.md with no stem whitelist, so acceptance of a mid-phase stem exists
      at both gates today. The real gap the glob closes is a note that never passed through a
      Write or Edit route, which check-domain.sh cannot see. Verified safe: all 68 handoff
      notes currently on disk pass the four-heading and 60-line shape, so the widening adds
      zero findings to the current tree.
    dec: DEC-159

  - id: D-09
    choice: A mid-phase handoff is notes/handoff-mid-<phase-stem>.md, for example
      handoff-mid-build.md. Latest supersedes; a second crossing inside one phase overwrites.
    because: It matches check-domain.sh's RE_HANDOFF character class, can never collide with
      the plan, build or validate stems SEAM_NOTES demands, and names the phase it interrupted
      so a successor knows what it inherited.
    dec: DEC-159

  - id: D-10
    choice: Every must-go-red proof uses a named mutation seam rather than an exit status.
      For Python, the test loads context-watch.py through importlib.util.spec_from_file_location
      and rebinds one named module attribute, asserting first that the rebind changed the
      value the function returns. For check-state.sh, the test copies the script and
      harness_yaml.py into a temp bin directory, deletes the one line carrying a named
      literal, asserts the literal is present in the original and absent in the copy, and runs
      the copy through the existing CHECK_STATE_BIN environment override.
    because: An exit-status-only assertion cannot tell a load-bearing failure from a broken
      harness, and FEAT-30 paid for that twice. Both seams already exist:
      test-check-state.py:16 reads CHECK_STATE_BIN and test-check-state.py:1815 already copies
      the script into a temp bin directory.
    dec: none

  - id: D-11
    choice: SC-10 is the UAT and NO TASK IN THIS PLAN DELIVERS IT. See the uat block below.
    because: It requires at least one orchestrator alive at the moment of measurement, which
      no checked-in fixture and no CI runner can supply.
    dec: none

  - id: D-12
    choice: Every fixture is generated in-process under tempfile.mkdtemp() by the test that
      needs it, from literal token values written in the test body or from a fixed-seed
      generator. No transcript, sidecar or projects directory is checked in, and nothing under
      .harness/ or .claude/skills/ gains a data file.
    because: CI is ubuntu-latest with no ~/.claude/projects and no existing test reads one, so
      any test needing a machine-local transcript directory reds the required integration
      context and blocks every PR. SC-11 also forbids this feature owning a file format.
    dec: none

  - id: D-13
    choice: context-watch.py takes --projects-root, defaulting to $CLAUDE_CONFIG_DIR/projects
      then ~/.claude/projects, and every test passes a fixture root explicitly.
    because: A loader whose default binds at import reads live machine state, the test then
      passes for the wrong reason, and it proves nothing about the fixture it appears to
      exercise.
    dec: none

  - id: D-14
    choice: merge-settings.py's required-hook spec list is NOT extended, so the warning hook
      does not propagate to product checkouts.
    because: The measured problem is this repository's own orchestrators, and widening the
      distributed hook set is scope this brief never asked for. The named consequence: an
      orchestrator running against a product checkout whose settings.json came from
      merge-settings.py gets no warning.
    dec: none

uat:
  sc: SC-10
  status: not_met
  who: the operator, by hand
  why_no_task: Requires at least one harness-orchestrator ALIVE at the moment of
    measurement. Measuring a finished orchestrator proves nothing about the case the
    criterion exists for, and no fixture or CI runner can supply a live one.
  tasks_that_only_make_it_possible: [T-01, T-02]
  steps:
    - With at least one orchestrator running, run python3
      .claude/skills/harness/bin/context-watch.py with no argument from the checkout that
      orchestrator is running in.
    - Confirm every running orchestrator appears, each with the feature it is on.
    - Confirm each row shows current context, peak context and entry count.
    - Confirm each row shows distance to the threshold as a printed number, so nothing has
      to be divided, subtracted or compared by hand.
    - Confirm any orchestrator the tool could not measure is listed as unmeasured with the
      offending file path named, never omitted.
    - Re-run naming one orchestrator's agent id as the single argument and confirm the same
      figures for that one row.
    - It FAILS if a running orchestrator is missing, if any figure needs hand arithmetic to
      be useful, or if the operator has to ask what a number means.

tasks:
  - id: T-01
    title: Build the context-watch reader, arithmetic and orchestrator discovery
    traces: [REQ-01, REQ-02, REQ-05, REQ-07]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/context-watch.py
    verify: |
      python3 -c "import importlib.util as u;s=u.spec_from_file_location('cw','.claude/skills/harness/bin/context-watch.py');m=u.module_from_spec(s);s.loader.exec_module(m);[getattr(m,n) for n in ('entry_prompt_size','scan_transcript','discover_agents','slug_for_cwd','measure_row','UNMEASURED')];assert m.slug_for_cwd('/Users/molchairuangutai/GitHub/harness/.claude/worktrees/fix-harness-tooling-backlog')=='-Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog';assert m.entry_prompt_size({'message':{'usage':{'input_tokens':0,'cache_read_input_tokens':1494870,'cache_creation_input_tokens':0,'iterations':[{'usage':{'input_tokens':0,'cache_read_input_tokens':746878,'cache_creation_input_tokens':0}},{'usage':{'input_tokens':0,'cache_read_input_tokens':0,'cache_creation_input_tokens':0}},{'usage':{'input_tokens':0,'cache_read_input_tokens':747992,'cache_creation_input_tokens':0}}]}}})==747992;print('T-01 api and arithmetic ok')"
    intent: |
      Create .claude/skills/harness/bin/context-watch.py, a python3 script with no
      third-party imports. It reads Claude Code's own per-agent transcripts and reports how
      much context each running orchestrator holds. It WRITES NOTHING except a stamp file
      under the system temp directory, and it OWNS NO FILE FORMAT: every file it reads is
      written by Claude Code.

      Expose these module-level names exactly as spelled, because tests rebind them:

      slug_for_cwd(cwd) -> str. The transcript project directory name for an absolute cwd.
      The rule is a pure string transform: replace every "/" with "-", then every "." with
      "-". No filesystem access. Verified: the input
      /Users/molchairuangutai/GitHub/harness/.claude/worktrees/fix-harness-tooling-backlog
      must produce
      -Users-molchairuangutai-GitHub-harness--claude-worktrees-fix-harness-tooling-backlog
      This is what makes the tool work for an orchestrator running inside a worktree rather
      than only in the primary checkout.

      projects_root(argv_value) -> str. Resolution order: an explicit --projects-root value,
      then os.environ["CLAUDE_CONFIG_DIR"] joined with "projects", then
      os.path.expanduser("~/.claude/projects"). Never bind the default at import time; it
      must be computed inside the function on every call.

      entry_prompt_size(entry) -> int. The size of the single largest prompt this one
      transcript entry represents. Read entry["message"]["usage"]. If that usage carries a
      non-empty list under "iterations", return the MAXIMUM over iterations of
      input_tokens + cache_read_input_tokens + cache_creation_input_tokens taken from each
      iteration's own "usage" mapping. Otherwise return that sum from the top-level usage
      mapping. Return 0 when there is no usage mapping at all. This is the whole point of
      the tool: where a request makes nested sub-calls, Claude Code records them under
      usage.iterations and the TOP-LEVEL fields are their SUM, so the top-level number is
      tokens read across sub-calls and not the size of any one context. Never sum across
      iterations. Never sum across entries.

      scan_transcript(path) -> dict with keys current, peak, entries, no_usage. Read the
      .jsonl one line at a time, json.loads each line, skip a line that does not parse.
      entries is the count of lines that carried a usage mapping. no_usage is the count of
      lines that did not. current is entry_prompt_size of the LAST entry that carried a
      usage mapping. peak is the maximum entry_prompt_size across all of them. Both 0 for an
      empty transcript. Raise nothing: an unreadable or absent file is the caller's problem.

      UNMEASURED. A module-level sentinel object used as the marker for a row whose figures
      could not be obtained.

      measure_row(row) -> dict. Given a discovered row, attach current, peak, entries and
      no_usage by calling scan_transcript. On ANY failure -- the .jsonl missing, unreadable,
      or a sidecar that is not valid JSON -- set row["status"] to UNMEASURED and
      row["defeated_by"] to the absolute path of the exact file that defeated it, and return
      the row. Never drop a row and never raise. An orchestrator that cannot be measured is
      reported as unmeasured with the offending path named, never silently omitted from the
      watch.

      discover_agents(projects_root, cwd, agent_id=None) -> list of dict rows. Compute
      slug_for_cwd(cwd), then walk projects_root/<slug>/*/subagents/agent-*.meta.json. For
      each sidecar: parse it, and select it only when its "agentType" is exactly
      "harness-orchestrator". When agent_id is given, select only the sidecar whose id
      matches. Build each row with: agent_id taken from the filename between "agent-" and
      ".meta.json"; session_id taken from the parent-of-subagents directory name; jsonl set
      to the sibling agent-<id>.jsonl path; agent_type; description; and feature, derived by
      searching for a regex match of (FEAT|BUG)-[0-9]+ first in the sidecar's optional
      "worktreeBranch", then in its "description", and set to the literal string "unknown"
      when neither matches. DEPEND ON ONLY THREE SIDECAR KEYS -- agentType, description and
      spawnDepth. Every other key including toolUseId, worktreePath, worktreeBranch and
      model is OPTIONAL and must be read with .get: across 1406 sidecars on this machine
      those keys fall into ten distinct shapes and nothing this feature does can make the
      file stable. A sidecar that is not valid JSON still yields a row, carrying UNMEASURED
      and defeated_by set to that sidecar's own path. Also attach mtime, the .jsonl file's
      modification time, and live, true when that mtime is within LIVE_WINDOW_SECONDS, a
      module-level constant set to 900.

      Do not add a command-line interface, a threshold, a report or a hook mode in this
      task. T-02 and T-08 add those.

  - id: T-02
    title: Add the threshold, the report, the exit codes and the derived blind-spot footer
    traces: [REQ-01, REQ-03, REQ-06]
    change_type: feature
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/context-watch.py
      - .harness/harness.json
    verify: |
      python3 -c "import json;b=json.load(open('.harness/harness.json'))['budgets'];assert b['orchestrator_context_tokens']==200000, b;assert isinstance(b['_orchestrator_context_tokens_rationale'],str);print('key ok')"
      python3 -c "import importlib.util as u,json,os,tempfile;s=u.spec_from_file_location('cw','.claude/skills/harness/bin/context-watch.py');m=u.module_from_spec(s);s.loader.exec_module(m);d=tempfile.mkdtemp();p=os.path.join(d,'h.json');open(p,'w').write(json.dumps({'budgets':{'orchestrator_context_tokens':1234}}));assert m.threshold(p)==1234;q=os.path.join(d,'e.json');open(q,'w').write('{}');assert m.threshold(q)==200000;assert m.threshold(os.path.join(d,'nope.json'))==200000;assert len(m.blind_spots([],p))==3;print('threshold and footer ok')"
    intent: |
      Extend .claude/skills/harness/bin/context-watch.py with its threshold, its printed
      report and its exit codes, and add the threshold key to .harness/harness.json.

      In .harness/harness.json, inside the existing "budgets" object, add exactly two keys
      beside max_total_cycles and max_total_runs. First orchestrator_context_tokens, integer,
      value 200000. Second _orchestrator_context_tokens_rationale, a string, following the
      style of the two _rationale keys already there. Its text must say: the figure is the
      largest single prompt one orchestrator request represents, resolved per
      usage.iterations and never summed across sub-calls; 200000 is carried over from DEC-148
      rather than guessed fresh; the corrected median peak over 76 orchestrator transcripts
      measured 2026-08-20 was 136406, which sits BELOW this threshold, while 28 of 76 peaked
      above it and 10 above twice it, so this is a tripwire for the top of the distribution
      and not a critique of a normal orchestrator; and crossing it warns and never blocks.
      Change nothing else in harness.json.

      In context-watch.py add these module-level names, exactly as spelled:

      threshold(harness_json_path) -> int. Read the JSON file, return
      int(doc["budgets"]["orchestrator_context_tokens"]). Return DEFAULT_THRESHOLD, a
      module-level constant set to 200000, when the file is absent, unreadable, not valid
      JSON, missing either key, or holding a value int() rejects. Never raise, and never
      crash on a deleted key: a stated default is required behaviour, not a fallback nobody
      sees. When the default is used, the printed report says so on its own line, naming
      DEFAULT_THRESHOLD and the path it looked in.

      warn_lines(rows, limit) -> list of str. One line for each row whose peak is greater
      than or equal to limit. Each line names the agent id, the feature, the peak, the
      limit, and the nearest seam. Empty list when no row crosses. This function is the ONLY
      place the comparison to limit happens; T-03 and T-13 rebind it to prove the warning is
      load-bearing, so no caller may re-implement the comparison.

      nearest_seam(row) -> str. Read the feature's .harness/harness/features/<feature>/feature.json
      status and map it through the same station vocabulary check-state.sh uses: Plan and
      Ready return "plan", Building returns "build", Review returns "validate", Done and
      Abandoned and Backlog return "none". When the feature is unknown or its feature.json is
      absent or unreadable, return the literal string
      "mid-phase, write notes/handoff-mid-<phase-stem>.md". Never raise.

      blind_spots(rows, harness_json_path) -> list of exactly three strings, each DERIVED
      from state observed at runtime rather than a fixed sentence. Line one carries the sum
      of no_usage over rows and the sum of entries over rows, and says a context that has
      already compacted reads lower than it was because those entries carry no usage record
      and are not counted. Line two carries the integer read from log_retention_days in
      harness_json_path and the projects root actually used, and says transcripts older than
      that window are gone and the figures go stale silently rather than erroring. Line
      three carries the largest peak in rows and says it is the prompt size the API recorded
      and not the model's window limit, which this tool does not know. Every one of the three
      must interpolate a value computed from the arguments; a line with no interpolated value
      is a failure of this task.

      main(argv) -> int, and an if __name__ == "__main__" guard calling
      sys.exit(main(sys.argv[1:])). Accept an optional positional agent id and the optional
      flags --projects-root, --harness-json and --cwd, all defaulting as T-01 and this task
      specify, with --cwd defaulting to os.getcwd(). Discover rows, measure each, print one
      aligned table row per orchestrator sorted by mtime descending with columns: live,
      agent id, feature, entries, current, peak, threshold, headroom, pct. headroom is
      limit minus peak printed as a signed integer. pct is peak divided by limit as a
      percentage to one decimal place. Both are PRINTED, never left for the reader to
      compute. An UNMEASURED row prints the word UNMEASURED in place of its figures and
      prints its defeated_by path on the same line. After the table print the warn_lines
      output, then the three blind_spots lines under a heading line reading exactly
      "What this tool cannot see:". Return 1 when warn_lines is non-empty OR any row is
      UNMEASURED, otherwise 0. Never return 2 and never raise out of main.

  - id: T-03
    title: Unit-test the arithmetic, the selection, the threshold and the unmeasured branch
    traces: [REQ-01, REQ-02, REQ-03, REQ-07]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02]
    status: pending
    files:
      - .claude/skills/harness/bin/test-context-watch.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Create .claude/skills/harness/bin/test-context-watch.py and append its filename to the
      UNIT_SCRIPTS array in .claude/skills/harness/bin/run-unit-tests.sh. Change nothing else
      in run-unit-tests.sh. The drift detector at its lines 17-51 fails the whole suite if a
      test-*.py under bin/ is in neither array, so the registration is not optional.

      Follow the reporting shape the other test-*.py files in that directory use: a report
      helper printing a per-case line and a non-zero exit when any case fails. Load the
      module under test with importlib.util.spec_from_file_location, never by import, because
      the filename carries a hyphen. Build every fixture with tempfile.mkdtemp() and pass its
      path explicitly into projects_root, --harness-json or --cwd; never let a default bind
      to live machine state.

      Case A, the iterations fixture. Write a one-entry .jsonl whose message.usage has
      cache_read_input_tokens 1494870, input_tokens 0, cache_creation_input_tokens 0, and an
      iterations list of three entries whose own usage cache_read_input_tokens are 746878, 0
      and 747992 with the other two fields 0. Assert scan_transcript reports peak exactly
      747992 and assert it does NOT report 1494870. The two values must stay distinct so the
      case cannot pass by coincidence. THEN prove the assertion is load-bearing: rebind the
      module's entry_prompt_size to a naive function returning the top-level
      input_tokens + cache_read_input_tokens + cache_creation_input_tokens, assert the rebind
      took effect by calling it directly and getting 1494870, re-run scan_transcript, and
      assert peak is now 1494870 and the unmutated assertion would therefore have failed.
      Report the mutated and unmutated numbers in the case line.

      Case B, orchestrator selection. Build a fixture projects root holding one session
      directory whose subagents/ holds three complete sidecar and .jsonl pairs: one with
      agentType "harness-orchestrator", one "harness-backend-dev", one "general-purpose".
      Assert discover_agents returns exactly one row and that its agent_id is the
      orchestrator's. Assert the row count is 1 and not merely that an orchestrator is
      present.

      Case C, the threshold from config. Build one fixture whose peak is 500000. Write a
      fixture harness.json with orchestrator_context_tokens 400000 and assert main returns 1
      and its stdout contains a warning line naming 500000 and 400000. Rewrite the same
      fixture harness.json with 600000 and assert main returns 0 and stdout contains no
      warning line. Then delete the budgets key entirely and assert main does not raise,
      reports the stated default 200000, and says on its own line that the default was used.

      Case D, the warning must be shown to fail first. On the crossing fixture from case C,
      assert len(warn_lines(rows, limit)) == 1 with the shipped function. Then rebind the
