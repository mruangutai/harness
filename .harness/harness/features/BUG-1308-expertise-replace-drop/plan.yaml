      It must state, in the file's own voice:

        - target is required on every op and names the entry id; section is required for add and
          optional for replace and drop, and an id given without a section must match exactly one
          entry in the whole file or the op is refused.
        - merge is an authoring outcome, not a mechanism op: express it as a replace on the surviving
          id plus a drop of the absorbed id. The tool refuses op merge and says so.
        - the invocation, as a bash block:
          python3 .claude/skills/harness/bin/expertise-merge.py ops --file <expertise file>
          --ops <path or -> , with the payload being the JSON form of the expertise_update list.
        - the refusal vocabulary and its exit codes, one line each: 7 CONFLICT, 8 CAP EXCEEDED,
          9 not an Expertise file, 10 MISSING TARGET, 11 AMBIGUOUS TARGET, 12 MALFORMED OPS.
        - the three conditions that make a target ambiguous, from D-03.
        - that add-only proposals may still go through apply --entries, unchanged.

      Keep the existing sentence that an op naming a nonexistent target is a contract violation,
      rejected and not guessed at - it is now enforced at exit 10 rather than only asserted.
      Change nothing else in the file.

