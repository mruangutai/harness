decisions:
  - id: D-01
    choice: >-
      Replace and drop ship as a second subcommand, ops, taking the distill contract's op objects as
      JSON; apply --entries and compute_union are not touched.
    because: >-
      The entries stream is the markdown format check-expertise.sh also parses, so a verb inside it
      changes a format two tools read; the contract's ops are already structured data in the DIGEST.
    dec: none
  - id: D-02
    choice: >-
      target and section are BOTH required on every op: target names the entry id, section names one of
      Patterns, Gotchas, Outcomes or Open, and every op resolves inside its own named section. There is no
      optional-section affordance and no whole-file id resolution.
    because: >-
      A uniform required key on every verb removes an agent-facing footgun - omitting section and depending
      on global id uniqueness - and removes an entire resolution mode from the mechanism, so there is one
      way to name a target and one way to resolve it.
    dec: none
  - id: D-03
    choice: >-
      Exactly two conditions are ambiguous and each exits 11 with AMBIGUOUS TARGET naming section, id and
      reason - (a) a target id appearing more than once inside one section of the base file, and (b) two
      ops in one proposal resolving to the same section and id.
    because: >-
      An enumerated refusal set is auditable only if every member is reachable, and D-02 makes an
      unqualified id spanning sections unrepresentable, so a third condition for it would be a refusal
      branch no input can reach - dead code carried as if it were a guarantee. Guessing which of two
      entries was meant remains the one behaviour DEC-66 forbids outright.
    dec: DEC-66
  - id: D-04
    choice: >-
      A replace or drop whose target resolves to no entry exits 10, MISSING TARGET, naming section
      and id.
    because: 10 and 11 are free beside the established 6, 7, 8 and 9, so no caller's routing changes.
    dec: none
  - id: D-05
    choice: >-
      A malformed proposal exits 12, MALFORMED OPS - undecodable JSON, a payload that is not a list, an
      unknown op verb, a missing required key including a missing section on any op of any verb, a
      forbidden key for that verb, or a section outside the four canonical names.
    because: A shape error and a target error are different repairs, so they must be different codes.
    dec: none
  - id: D-06
    choice: >-
      A replace never moves an entry: it rewrites the text of the entry its (section, id) key names and
      leaves the section's relative order untouched, so a replace-only proposal leaves the section length
      and every ordinal unchanged and replace at capacity is legal. Where a proposal also drops an entry
      above it, the replaced entry keeps its position relative to every surviving entry.
    because: Position drift turns a one-entry change into an unreviewable whole-section diff.
    dec: none
  - id: D-07
    choice: >-
      Caps are evaluated once, on the final merged state, after every op has been applied, so a
      proposal that drops one entry and adds another in the same section at capacity succeeds.
    because: Evaluating per op would refuse a net-zero proposal on a transient over-cap state.
    dec: DEC-145
  - id: D-08
    choice: >-
      Every op resolves against the one base snapshot read inside the transform, nothing is applied
      until all ops have resolved, and any refusal raises MergeRefusal before a byte is written.
    because: >-
      locked_update writes only what the transform returns, so an all-or-nothing transform is
      byte-identity on refusal, proven by a sha256 comparison in the regression.
    dec: none
  - id: D-09
    choice: >-
      Compatibility means the apply code path is unmodified - its exit 0, 7 and 8 semantics and its
      ADDED, PRESERVED and APPLIED tokens are what they are today - and ops takes the same lock file,
      so the two subcommands serialise against each other.
    because: The concurrency guarantee DEC-95 bought is a property of the lock path, not of the verb.
    dec: DEC-95
  - id: D-10
    choice: >-
      merge stays an authoring concept and is not a mechanism op; the tool refuses op merge at exit 12
      with a message naming the rewrite, a replace on the surviving id plus a drop of the absorbed id.
    because: >-
      Merging synthesises new text from two entries, which only the authoring agent can do, so merge
      survives as an authoring concept the contract rewrites rather than as a verb the tool applies. The
      agreement this buys is the one SC-09, T-02 case17 and T-03 all state: every op verb the distillation
      contract names is either accepted by the expertise-merge.py ops subcommand or is merge, the one verb
      the contract itself rewrites into a replace on the surviving id plus a drop of the absorbed id; and
      the tool accepts no verb the contract does not name. The rewrite is pinned VERBATIM where the feature
      owns the characters - inside the tool's own exit-12 refusal line, which u7 asserts - and is checked
      in the contract text by its two load-bearing phrases, replace on the surviving id and drop of the
      absorbed id, rather than by a whole prose sentence a copy-edit would redden.
    dec: DEC-66
  - id: D-11
    choice: >-
      The contract text is realigned in the same feature - harness-distill SKILL.md as a
      main-session-direct step, SPEC.md section 5.3 and a new DEC-216 through the documentor.
    because: >-
      The issue's Alternative is only reachable if the mechanism is not built; building it makes the
      contract true, and a text that still promises an unapplied verb reopens the same defect.
    dec: none
  - id: D-12
    choice: >-
      The ban on reusing a dropped entry id is enforced only where the tool can see it - a drop and an
      add of the same section and id in one proposal exit 11 - and stays a contract rule across time.
    because: The tool reads the current file only and cannot know an id was dropped in an earlier run.
    dec: DEC-66

  - id: D-13
    choice: >-
      The mid-build yield to the main session is accepted for exactly one edge and removed
      everywhere else: T-02 keeps depends_on T-03 because case17 grades the contract text T-03
      writes, while T-04 drops its dependency on T-03 - SPEC 5.3 and DEC-216 describe the
      mechanism, not the skill text, so nothing in T-04 reads what T-03 wrote.
    because: >-
      T-03 is main-session-direct under DEC-174, so every task depending on it is a barrier the
      squad build must stop at; the cost is one orchestrator round trip inside the build phase,
      priced against an 8-cycle cap, and it is paid once rather than twice. Reordering the
      remaining edge away is not possible - a drift detector that runs before the text it detects
      drift in would grade the pre-change file and pass on work never done.
    dec: DEC-174
  - id: D-14
    choice: >-
      Record the operator-delegated Advisor's cycle-1 rulings as given, changing no task: D-12's
      in-proposal-only id-reuse ban stands with no tombstone, D-10's contract/tool split on merge
      stands, and T-02 keeps change_type scaffolding; the three answers are held verbatim at
      .harness/harness/features/BUG-1308-expertise-replace-drop/notes/research-BUG-1308-expertise-replace-drop-advisor-c1.md
    because: >-
      the signature review needs the rulings pointed at from the plan, and that note is where they
      live verbatim
    dec: none
  - id: D-15
    choice: >-
      At the cycle-1 signature review the operator ruled REVISE rather than overrule, and the plan is
      revised to his four rulings: (1) the high panel finding
      PF-f4d258f365f54f04d9cc976baf0ad981 is resolved before signature by specifying application
      against stable target identity, plus regression covering at least two ops on distinct original
      indices in one section including a low-index drop with a higher-index replace or drop;
      (2) section becomes required on every op, deleting the optional-section affordance and the
      cross-section ambiguity condition while keeping deterministic refusal for a duplicate id inside
      one section and for two ops naming one target; (3) the Advisor's A3 merge-as-authoring rewrite
      is kept, so D-10 stands, the contract keeps merge and the tool still refuses op merge at exit 12
      naming the rewrite; (4) the substantive medium verification gaps are closed where feasible - the
      concurrency case forces lock contention deterministically with no production test bypass, and
      T-03 and T-04 verify blocks cover the contract their intents promise. Every panel finding stays
      recorded with the reader's own severity; nothing was overruled, waived or reworded, and the
      panel is re-run afterwards.
    because: >-
      The revision is the operator's, not the plan author's, so the plan must say whose call each
      change was and where the reasoning lives; the per-finding record of what changed and why is at
      .harness/harness/features/BUG-1308-expertise-replace-drop/notes/research-BUG-1308-expertise-replace-drop-revision-c2.md
    dec: none
