      Three edits, one commit.

      1. SPEC.md section 5.3, the paragraph that begins "The apply is a union merge, not a whole-file
         write" and the invocation block under it. Add the second subcommand beside the first: the
         ops invocation, that a target is keyed on section plus entry id, that a replace keeps the
