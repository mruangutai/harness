      R="$(git rev-parse --show-toplevel)"
      grep -q '^## DEC-216' "$R/.harness/harness/docs/DECISIONS.md" &&
      grep -q '^- DEC-216 .* :: .*replace and drop through the ops subcommand' "$R/.harness/harness/docs/DECISIONS-INDEX.md" &&
      grep -q 'expertise-merge.py ops' "$R/.harness/harness/docs/SPEC.md" &&
      python3 "$R/tests/integration/test-gen-decisions-index.py"
