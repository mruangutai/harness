      grep -q 'MISSING TARGET' "$S" &&
      grep -q 'AMBIGUOUS TARGET' "$S"
    intent: |
      Rewrite the ops block of .claude/skills/harness-distill/SKILL.md - the yaml example and the
      sentences around it, currently the region introduced by "Updates are ops, each naming its
      target" - so the contract states exactly what the mechanism does. Keep it short; this file is
      read only at distillation but it is still a skill.

      The statement the rewritten text must make true is the one SC-09, D-10 and T-02 case17 all word
      identically: Every op verb the distillation contract names is either accepted by the
      expertise-merge.py ops subcommand or is merge, the one verb the contract itself rewrites with the
      literal sentence: a replace on the surviving id plus a drop of the absorbed id; and the tool
      accepts no verb the contract does not name.

      Two hard consequences for the text you write, both machine-checked by case17:
        - the ops vocabulary line names EXACTLY add, replace, merge and drop - no fifth verb, and none
          of add, replace or drop dropped;
        - the file carries, VERBATIM and as a contiguous substring, the characters
            a replace on the surviving id plus a drop of the absorbed id
          in the sentence that says how a merge is expressed. Do not paraphrase it, do not reorder it,
          do not break it across a line, and do not wrap any of it in backticks or emphasis - case17
