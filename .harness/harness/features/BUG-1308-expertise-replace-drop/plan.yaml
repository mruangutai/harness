tasks:
  - id: T-01
    title: Add the ops subcommand to expertise-merge.py with its unit coverage
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-06, REQ-07]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: ready
    files:
      - .claude/skills/harness/bin/expertise-merge.py
      - tests/unit/test-expertise-ops.py
    verify: |
      python3 "$(git rev-parse --show-toplevel)/tests/unit/test-expertise-ops.py"
    intent: |
      Write tests/unit/test-expertise-ops.py FIRST, watch it fail, then make it pass. Do not touch
      compute_union, cmd_apply, parse_expertise, render, CAPS or require_expertise_destination -
      REQ-07 is that the existing apply path is unchanged.

      Add to .claude/skills/harness/bin/expertise-merge.py, python3 stdlib only:

      1. A PURE function resolve_ops(base_sections, base_order, ops) -> (merged, order, outcomes). It
         never does IO and never calls sys.exit; it raises harness_merge.MergeRefusal(code, lines)
         for every refusal, exactly as compute_union's caller does today. This is the function the
         unit tests import and exercise directly.

         An op is a dict:
           op:      one of "add", "replace", "drop"          (required)
           target:  the entry id string, for example P-01    (required on all three verbs)
           section: one of Patterns, Gotchas, Outcomes, Open (REQUIRED on all three verbs)
           entry:   the entry text WITHOUT the leading "- <id>: " (required for add and replace,
                    and must be absent for drop)
           why:     any string, accepted and ignored, so an op copied from a DIGEST applies verbatim

         Step A, shape. A payload that is not a list, an op that is not a dict, an unknown op verb,
         op == "merge", a missing required key - including a missing or empty section on an op of ANY
         verb, since D-02 makes section required everywhere - a forbidden key for that verb, or a
         section outside CAPS -> MergeRefusal(12, ["MALFORMED OPS <one line naming the op index, the
         offending key or verb, and what was expected>"]). For op == "merge" the line must read:
         MALFORMED OPS op=merge is not a mechanism op; express it as a replace on the surviving id
         plus a drop of the absorbed id.

         Step B, resolution, EVERY op against the ORIGINAL base_sections, never against the result of
         an earlier op, and always scoped to the op's own section - there is no whole-file resolution
         (D-02). Resolution yields a STABLE TARGET IDENTITY, the (section, id) KEY, and never an
         index: no op carries, stores or computes a position in any list.
         For replace and drop, candidates are the entries of the op's own section whose entry id
         equals target.
           zero candidates    -> MergeRefusal(10, ["MISSING TARGET section=<section> id=<target>
                                 reason=no entry with this id exists in this section"])
           two or more        -> MergeRefusal(11, ["AMBIGUOUS TARGET section=<section> id=<target>
                                 reason=the id appears N times in section <section>"])
         For add, the candidate section is the op's section key; if that section already holds target
         with IDENTICAL text the op is a no-op reported PRESERVED, and if it holds target with
         different text raise MergeRefusal(7, ...) using the existing CONFLICT line shape from
         cmd_apply - CONFLICT section=<n> id=<id>, then the existing text and proposed text lines.

         Step C, proposal-internal ambiguity. If two ops resolve to the same (section, id) key -
         including a drop and an add of the same target - raise MergeRefusal(11, ["AMBIGUOUS TARGET
         section=<n> id=<id> reason=two ops in one proposal name this target"]). With Step B this is
         the whole of D-03: two conditions, no third.

         Step D, application against STABLE TARGET IDENTITY, after ALL ops have resolved (D-08: any
         refusal above has already been raised, so no byte is written on any failing proposal).
         THE INVARIANT, and the one sentence a reviewer checks this step against: no index resolved
         against the base snapshot is ever used to address the mutated list.
         Application is a SINGLE PASS that REBUILDS each affected section from the base snapshot:
           - walk that section's base entries in their ORIGINAL order and, for each one, look its
             (section, id) key up in the proposal: a drop op naming it emits nothing, a replace op
             naming it emits the same id carrying the op's new text, and no op naming it emits the
             entry unchanged;
           - then append that section's add ops, in proposal order, after the walk, creating the
             section and appending its name to order when it is absent.
         Sections no op names are carried through untouched.
         Because the walk preserves base order, a replaced entry keeps its original ordinal among the
         surviving entries (D-06), and the merged section is INDEPENDENT OF THE ORDER the ops were
         given in for replace and drop. Only adds are order-sensitive, and only relative to each
         other. Never delete from, or assign into, a list you are also iterating by index.

         Step E, caps, ONCE on the final state, for every name in CAPS: size > cap ->
         MergeRefusal(8, ["CAP EXCEEDED section=<n> cap=<c> union_size=<s>"]) - the same line the
         existing cap check emits.

         outcomes is the per-op verb for stdout, in op order: REPLACED, DROPPED, ADDED or PRESERVED,
         each paired with its id.

      2. A cmd_ops(args) modelled on cmd_apply: call require_expertise_destination(args.file) first,
         printing its refusal lines to stderr and exiting 9 unchanged; read args.ops from a path or
         from stdin when it is "-"; json.loads it, accepting either a list of ops or a mapping whose
         expertise_update key holds that list, and raising the exit 12 refusal on a JSONDecodeError;
         then run harness_merge.locked_update(resolved, transform) where transform parses the base -
         a None base means empty sections, so an ops-only add creates the file exactly as apply does
         today - and calls resolve_ops. Print refusal lines to stdout and sys.exit(refusal.code),
         matching cmd_apply. On success print one line per op in op order - REPLACED <id>,
         DROPPED <id>, ADDED <id> or PRESERVED <id> - then APPLIED <file path>, then sys.exit(0).

      3. Register the subparser: ops --file <path> --ops <path or ->, both required, help text naming
         the JSON payload. argparse's own exit 2 is untouched.

      tests/unit/test-expertise-ops.py loads the module with importlib.util.spec_from_file_location
      (the filename is hyphenated) from .claude/skills/harness/bin/expertise-merge.py, resolving the
      repository root from its own __file__, and writes nothing under that bin directory. Follow the
      RESULTS/check/main shape of tests/integration/test-expertise-merge.py: print PASS or FAIL per
      case and exit 1 if any failed. Cases, all against resolve_ops directly:
        u1  Patterns holding 15 entries, replace P-07: merged Patterns still has 15 entries, index 6
            carries the new text, and every other id is untouched at its own index.
        u2  drop G-03: G-03 absent, every other id present, section length one smaller.
        u3  replace naming an id in no section: MergeRefusal.code == 10 and the line starts
            MISSING TARGET.
        u5  a base whose Patterns holds P-04 twice, op names section Patterns: code 11.
        u6  two ops naming the same section and id: code 11.
        u7  op merge: code 12 and the line names the replace plus drop rewrite.
        u8  Patterns at 15, one drop and one add in the same proposal: succeeds, final length 15.
        u9  Patterns at 15, one add: code 8, line starts CAP EXCEEDED.
        u10 THE PERMANENT RED CASE. Feed u1's exact base and replacement text to compute_union
            instead - as a single-entry proposal for section Patterns carrying id P-07 with the new
            text - and assert it returns a non-empty conflicts list AND that its merged Patterns
            still carries the OLD text at index 6. This pins the defect the feature fixes, so
            reverting resolve_ops to the union path reddens this file.
        u11 MULTI-OP SAME SECTION, low-index drop with a higher-index replace. Base: Patterns
            holding P-01 through P-05, at original indices 0 to 4. One proposal, ops given in this
            order: drop P-01 (original index 0), then replace P-05 (original index 4) with a
            distinct marker text. Assert no MergeRefusal is raised; the merged Patterns id sequence
            is EXACTLY [P-02, P-03, P-04, P-05] in that order; and the P-05 entry carries the
            marker text while no other entry does. Then run the SAME two ops in the OPPOSITE order
            against the same base and assert an identical merged section, so Step D's
            order-independence is asserted rather than assumed. This is the case the cycle-1 panel
            found no case exercised.
        u12 TWO DROPS AT DISTINCT ORIGINAL INDICES IN ONE SECTION. The same P-01..P-05 base; one
            proposal dropping P-01 and P-04. Assert the merged Patterns id sequence is EXACTLY
            [P-02, P-03, P-05] and its length is 3 - not an IndexError, and not P-05 dropped in
            place of P-04.
        There is no u4: the cross-section ambiguity case it held is unrepresentable now that D-02
        requires section on every op. The number is left unused rather than reassigned.

  - id: T-02
    title: Add the regression cases the issue names to the expertise-merge integration suite
    traces:
    - REQ-01
    - REQ-02
    - REQ-03
    - REQ-04
    - REQ-05
    - REQ-06
    - REQ-07
    - REQ-08
    - REQ-09
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-qa
    depends_on: [T-01, T-03]
    status: ready
    files:
      - tests/integration/test-expertise-merge.py
    verify: |
      python3 "$(git rev-parse --show-toplevel)/tests/integration/test-expertise-merge.py"
    intent: |
      Extend tests/integration/test-expertise-merge.py with new case functions and register each in
      main(). Change no existing case. Reuse the file's own helpers - write_file, write_entries,
      target(root, stem), run_apply, check - and add a run_ops(file_path, ops_path) beside run_apply
      that invokes [sys.executable, CLI, "ops", "--file", file_path, "--ops", ops_path]. Ops payloads
      are written with json.dump. Capture the file's sha256 with hashlib before each refusal case and
      compare it after; a byte-identity assertion is the point of three of these cases. Every op in
      every payload carries both target and section - D-02 requires section on all three verbs.

      case11 REPLACE AT CAPACITY. Patterns with 15 entries P-01 through P-15. One op replacing P-07.
        Assert exit 0; REPLACED P-07 in stdout; the written file still parses to 15 Patterns entries;
        the 7th entry line carries the new text; and
        bash .claude/skills/harness/bin/check-expertise.sh on the written file exits 0.
      case12 REMOVAL. Gotchas with G-01 through G-05. One drop of G-03. Assert exit 0; DROPPED G-03
        in stdout; the string "- G-03:" absent from the file; G-01, G-02, G-04 and G-05 all still
        present; and check-expertise.sh on the written file exits 0.
      case13 MISSING TARGET. One replace naming P-99. Assert exit 10; the combined stdout and stderr
        carries MISSING TARGET, the id and the section token; the file's sha256 is unchanged; and a
        following add-only run_apply still exits 0.
      case14 AMBIGUOUS TARGET, TWO sub-cases - D-03's whole set - each its own fixture and each
        asserting exit 11, the token AMBIGUOUS TARGET, the id, the section name and a reason, plus an
        unchanged sha256:
        (b) a base file whose Patterns section carries P-04 twice and the op names Patterns;
        (c) two ops in one proposal naming the same section and id.
        The former sub-case (a) - one id in two sections with the op omitting section - is DELETED,
        not renamed: section is required on every op, so that input is refused at exit 12 by shape
        before any resolution runs. The (b) and (c) labels are left as they are; nothing is
        renumbered.
      case15 ATOMIC FAILURE. A three-op proposal whose first two ops are a valid replace and a valid
        drop and whose third names a missing target. Assert non-zero exit, that the file's sha256
        equals the sha256 taken before the invocation - neither of the first two ops landed - and
        that a following add-only run_apply still exits 0.
      case16 ADD-ONLY COMPATIBILITY. Through apply --entries only: an add-only proposal exits 0 and
        prints the ADDED, PRESERVED and APPLIED tokens; a same-id-different-text proposal still exits
        7; an over-cap proposal still exits 8. Assert the tokens by exact string.
      case17 CONTRACT DRIFT DETECTOR, the same idiom as case 8. The one statement this case exists to
        hold, worded as SC-09, D-10 and T-03 word it: every op verb the distillation contract names is
        either accepted by the expertise-merge.py ops subcommand or is merge, the one verb the contract
        itself rewrites into a replace on the surviving id plus a drop of the absorbed id; and the tool
        accepts no verb the contract does not name.

        Mechanise it with NO judgement anywhere, as a function contract_drift(skill_text) -> list of
        failure strings, so the same function can be run against a drifted copy:
          NORMALISED = skill_text with every run of whitespace collapsed to one space and the
            characters backtick, asterisk and underscore removed. Every text test below runs against
            NORMALISED, so a reflow, a rewrap or an emphasis change cannot redden this case.
          CONTRACT = the set of op verbs named by the ops vocabulary line of
            .claude/skills/harness-distill/SKILL.md, read as TEXT and collected the way case 8 collects
            its vocabulary.
          ACCEPTED = the set of verbs expertise-merge.py's ops parser accepts, collected by probing each
            verb in CONTRACT plus each verb the parser's own help names, with a well-formed single op
            against a throwaway fixture, and treating exit 12 whose line names an unknown verb or names
            op=merge as NOT accepted. Every probe op must carry a target and a section that EXIST in the
            throwaway fixture, so a refusal is attributable to the verb and not to a missing key: an
            exit 12 whose line names a key rather than a verb is a broken probe and must FAIL the case
            loudly, never be counted as "not accepted".
          REWRITTEN = {"merge"} if NORMALISED contains BOTH of the substrings
              replace on the surviving id
              drop of the absorbed id
            else the empty set. These are the two load-bearing phrases of the rewrite, not a whole
            prose sentence: the connecting words, the punctuation and the sentence they sit in are the
            author's to edit. The rewrite is pinned character for character where the feature owns the
            characters - expertise-merge.py's own exit-12 refusal line, asserted by u7 and reachable to
            the one agent who ever emits op=merge - so this case does not need a second verbatim copy.
        Then assert both directions, each reported as its own failure string:
          CONTRACT minus ACCEPTED == REWRITTEN - every contract verb the tool does not accept is exactly
            the set the contract itself rewrites;
          ACCEPTED minus CONTRACT == the empty set - the tool accepts no verb the contract omits.
        Run contract_drift against the real file and assert it returns no failures.

        MUTATION DEMONSTRATION, in the same case, so "fails if either side changes alone" is shown and
        not assumed. Build two drifted COPIES of the SKILL.md text in the case's own tmp dir and assert
        contract_drift returns a NON-EMPTY failure list for each:
          (a) the copy with the phrase
              drop of the absorbed id
              removed - REWRITTEN becomes empty while merge is still named, so the first direction
              fails; this is the copy that proves the case still detects a contract that stops
              rewriting merge;
          (b) the copy with one extra verb, "prune", inserted into the ops vocabulary line - CONTRACT
              grows a verb that is neither accepted nor rewritten, so the first direction fails again.
        Copies only: the real SKILL.md is never written by this test.
      case18 CONCURRENT WRITERS, SC-11 - contention forced DETERMINISTICALLY by the test itself, with
        NO production test bypass: no environment variable, no injected sleep, no test-only flag, and
        no edit of any kind to expertise-merge.py or harness_merge.py.
        One Expertise file whose Patterns holds P-01 through P-08. Import harness_merge from
        .claude/skills/harness/bin the same way the suite already loads the CLI, and have the TEST
        PROCESS take the production lock itself:
          with harness_merge.acquire(str(file_path) + ".lock"):
        which is the very primitive locked_update uses, on the very path both subcommands derive. Then,
        INSIDE that block, spawn both children with subprocess.Popen and neither waited on:
          child A: apply --entries adding two new Patterns entries P-09 and P-10;
          child B: ops replacing P-07's text with a distinct marker string.
        Still holding the lock, poll both children with .poll() every 0.05 seconds for a HOLD WINDOW of
        2.0 seconds and assert that NEITHER has exited. A child that COMPLETES WHILE THE TEST HOLDS THE
        PRODUCTION LOCK is THE RED: it did not take the lock the core defines, which is exactly the
        D-09 regression this case exists to catch, and the FAIL message must say which child it was.
        2.0 seconds is deliberately far below harness_merge.LOCK_TIMEOUT_SECONDS, which is 10.0, so a
        correctly-locking child is still WAITING - not refused at exit 6 - when the block exits.
        Leave the with-block, then communicate() with each child with timeout=20; a TimeoutExpired is a
        FAIL, not a skip. Then assert on the final file:
          both children exited 0 - a non-zero exit 6 here means the hold window outgrew the lock
            timeout and is a FAIL, not a pass;
          the id census - the set of ids parsed out of Patterns - is exactly the eight ids that were
            present before plus P-09 and P-10, so neither writer's work was lost;
          the P-07 entry carries child B's marker text, not its original text.
        Those last two are the other two shapes a shared-lock regression takes (D-09). Assert all
        three and name which one fired in the FAIL message. Worst-case wall clock for the whole case,
        including the FAIL path, is the 2.0s hold plus two 20s waits: under 45 seconds.
        The order the two writers land in is not asserted - either order leaves the same final state,
        which is why the case is deterministic.
      case19 MULTI-OP COMPOSITION IN ONE SECTION, through the CLI. Patterns holding P-01 through P-05.
        One ops payload carrying two ops on DISTINCT ORIGINAL INDICES of that one section, given low
        index first: drop P-01 (original index 0), then replace P-05 (original index 4) with a distinct
        marker text. Assert exit 0; DROPPED P-01 and REPLACED P-05 both in stdout; the id sequence
        parsed out of the written file's Patterns section is EXACTLY P-02, P-03, P-04, P-05 IN FILE
        ORDER; the P-05 entry carries the marker text and no other entry does; and check-expertise.sh
        on the written file exits 0. Then repeat the whole case on a fresh fixture with the two ops in
        the OPPOSITE order and assert byte-identical file content, so the CLI path is shown
        order-independent for replace and drop. This is the integration half of the composition the
        cycle-1 panel found untested; u11 is the unit half.

