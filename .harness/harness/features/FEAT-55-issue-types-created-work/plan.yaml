    intent: |
      Write tests/manual/probe-issue-types.py, executable, run on a credentialled host against
      the real GitHub. It is the only check in this feature that touches the real API; every
      other criterion runs against a fake, so this file must NEVER import a fixture, never set
      GH_SYNC_GH, and never fall back to a canned response. A fixture-derived pass here would
      make the one live gate a no-op.

      IT CREATES NOTHING BY DEFAULT (D-19). The default invocation is READ-ONLY: it reports the
      capability verdict and the declared type names and creates no issue in any repository.
      Creating a throwaway issue happens only under the explicit opt-in of section 6.

      Behaviour:
      1. Resolve the repository from .harness/harness.json github.repo. If gh is not on PATH or
         gh auth status fails, print "probe-issue-types: SKIP <reason>" and exit 0 - that is a
