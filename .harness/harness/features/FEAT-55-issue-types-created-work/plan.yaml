  - id: T-02
    title: Add the shared gh_issue_types module - mapping, capability classifier and argv builders
    traces: [REQ-02, REQ-03, REQ-04]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    files:
      - .claude/skills/harness/bin/gh_issue_types.py
    verify: |
      python3 tests/unit/test-issue-types.py
    intent: |
      Create .claude/skills/harness/bin/gh_issue_types.py, a pure module on the
      gh_issues.py pattern: mapping data, response parsing and argv builders only. It
      EXECUTES NOTHING - no subprocess, no network - because gh-sync.py and factory_gh.py
      have different failure semantics (skip-and-exit-0 versus raise GhError) and each keeps
      its own runner. Do not modify any other file in this task. tests/unit/test-issue-types.py
      already exists and is red; make it green without editing it.

      The mapping resolves an issue's type from its ROLE, which is D-18. There are three
      resolvers and each answers for exactly one role: type_for_change_type for a TASK
      SUB-ISSUE (planned or factory), type_for_nature for a backlog item, type_for_parent for
      a feature or factory parent. No caller may resolve a parent through
      type_for_change_type.

      Module contents, exactly:

      DEFAULT_TYPE_BY_CHANGE_TYPE = {"bugfix": "Bug", "feature": "Task", "logic": "Task",
      "api": "Task", "cross_module": "Task", "frontend": "Task", "ai_behavior": "Task",
      "docs": "Task", "config": "Task", "scaffolding": "Task", "infra": "Task", "ci": "Task"}
      All twelve keys spelled out. "feature": "Task" is D-18 and is not a typo: this table is
      consulted only for a task sub-issue, and a task sub-issue is an implementation task
      whatever the shape of its diff - a Feature nested under a Feature is exactly what the
      canonical dimension must not contain. bugfix is the only Bug. infra and ci are included
      deliberately: they are members of CHORE_TYPES in gh-sync.py:102 and
      factory_decompose.py:48 and are not legal values of the change_type enum, and Task is
      exactly what CHORE_TYPES membership meant in label mode. Do not prune them from either
      CHORE_TYPES set; that is out of scope.

      DEFAULT_TYPE_BY_NATURE = {"bug": "Bug", "chore": "Task", "enhancement": "Feature"}
      PARENT_KEY = "parent" and DEFAULT_PARENT_TYPE = "Feature".
      LEGAL_OVERRIDE_KEYS = ("Bug", "Feature", "Task", "parent") - the WHOLE configuration
      surface (D-12). An override map is keyed by CANONICAL TYPE NAME plus the literal parent;
      change_type values and backlog natures are internal vocabulary and are not configuration
      keys.

      class UnknownWorkNature(Exception) - raised, never returned, by both resolvers.

      type_for_change_type(change_type, overrides): the type of a task sub-issue. If
      change_type is not a key of DEFAULT_TYPE_BY_CHANGE_TYPE, raise UnknownWorkNature with the
      message f"{change_type!r} is not a known change_type, so no issue type is mapped for it -
      add it to DEFAULT_TYPE_BY_CHANGE_TYPE or fix the plan". Otherwise resolve the canonical
      default first - default = DEFAULT_TYPE_BY_CHANGE_TYPE[change_type] - and return
      overrides.get(default) or default, where an override value that is not a non-empty string
      is ignored. THE LOOKUP IS BY CANONICAL NAME, never by the change_type string (D-12):
      renaming Task renames it for every change_type that resolves to Task, feature included,
      and there is no per-change_type key for a repository to set.

      type_for_nature(nature, overrides): the type of a backlog item, same shape against
      DEFAULT_TYPE_BY_NATURE - resolve the canonical default, then look the OVERRIDE up by that
      name - and the same "no issue type is mapped" wording.

      type_for_parent(overrides): overrides.get(PARENT_KEY) or DEFAULT_PARENT_TYPE. The parent
      has its own key so a repository can name its parent type independently of the type its
      enhancement backlog items take.

      overrides_from_config(cfg): cfg is a loaded harness.json mapping. Read
      cfg["github"]["issue_types"] and, when it is a dict, return the subset of its entries
      whose key is in LEGAL_OVERRIDE_KEYS and whose value is a non-empty string; every other
      key is DROPPED here, so no resolver ever sees one. Return {} when the block is missing or
      is not a dict. Never raise; a malformed or unrecognised override block falls through to
      the defaults.

      CAPABILITY_QUERY is the query measured against mruangutai/harness:
      query($owner:String!,$name:String!){ repository(owner:$owner,name:$name){ issueTypes(first:10){ nodes { id name } } } }
      capability_query_args(repo): split repo on "/" into owner and name and return
      ["api", "graphql", "-f", "query=" + CAPABILITY_QUERY, "-f", "owner=" + owner,
      "-f", "name=" + name].

      classify_capability(returncode, stdout) -> (state, declared, message):
      parse stdout as JSON. If parsing fails, return ("query_failed", {}, <the parse error or
      the raw first 200 chars>). If the parsed document has a top-level "errors" key that is a
      non-empty list, return ("query_failed", {}, <the first error's message>) - regardless of
      returncode. If returncode is non-zero, return ("query_failed", {}, <stdout truncated to
      200 chars>). Otherwise read data.repository.issueTypes: JSON null (or the repository key
      null) means ("absent", {}, ""); a mapping with a "nodes" list means ("available",
      {node["name"]: node["id"] for each node with both keys}, ""). Anything else is
      ("query_failed", {}, ...). The three states are the entire vocabulary; no fourth value.

      node_id_args(repo, number): ["api", f"repos/{repo}/issues/{number}", "--jq", ".node_id"].
      This is node_id, NOT the .id that gh_issues.internal_id_args reads: the sub-issue REST
      endpoint takes the database id, and the GraphQL mutation takes the node id. They are
      different values and swapping them 422s.

      APPLY_TYPE_MUTATION:
      mutation($id:ID!,$type:ID!){ updateIssue(input:{id:$id,issueTypeId:$type}){ issue { id } } }
      apply_type_args(node_id, type_id): ["api", "graphql", "-f",
      "query=" + APPLY_TYPE_MUTATION, "-f", "id=" + node_id, "-f", "type=" + type_id].
      issueTypeId is a measured input field of BOTH CreateIssueInput and UpdateIssueInput, so a
      create CAN carry the type; this plan deliberately does not use it. The create stays on the
      gh CLI path, which already builds every label, milestone, body and sub-issue argument, and
      gh 2.92.0 has no --type flag on issue create or issue edit, so that path itself cannot
      carry the type - the type is applied afterwards through updateIssue. The create-then-type
      window that results is a design choice, and its ordering is what the D-10/D-20 provenance
      receipt and the remnant cases pin.

      missing_types(required_names, declared): sorted, de-duplicated list of the names in
      required_names that are not keys of declared.

      refusal_text(repo, type_name, config_key): config_key is one of LEGAL_OVERRIDE_KEYS - the
      canonical key whose value the operator would set, never a change_type or a nature, which
      the configuration does not accept. A single line reading
      f"issue type {type_name!r} is not declared by {repo} - set github.issue_types.{config_key}
      in .harness/harness.json to a type name this repository declares, or add the type to the
      repository". One line, no newline inside it.

