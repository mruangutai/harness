      printf '%s\n' "$out" | grep -Eq "^probe-issue-types: (CAPABILITY ABSENT|CAPABILITY PRESENT) $repo " || printf '%s\n' "$out" | grep -Eq "^probe-issue-types: SKIP .*$repo" || { echo "no verdict line naming the configured repo $repo: $out"; exit 1; }
      printf '%s\n' "$out" | grep -Eq "created issue|LIVE PASS" && { echo "the default invocation must create nothing (D-19): $out"; exit 1; }
      skip=$(env PATH=/usr/bin:/bin "$py" tests/manual/probe-issue-types.py); rc=$?
      test "$rc" = 0 || { echo "an absent gh must SKIP and exit 0, got $rc: $skip"; exit 1; }
      printf '%s\n' "$skip" | grep -Eq "^probe-issue-types: SKIP " || { echo "an absent gh must SKIP, got: $skip"; exit 1; }
