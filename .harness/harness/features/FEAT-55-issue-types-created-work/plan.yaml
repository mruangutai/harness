decisions:
  - id: D-01
    choice: change_type bugfix maps to the native type name Bug.
    because: it is the only member of BUG_TYPES and names a defect outright.
    dec: none
  - id: D-02
    choice: change_type feature does NOT map to Feature - on a task sub-issue it maps to Task like every other implementation change_type - while both the gh-sync feature parent and the factory parent map to Feature through type_for_parent. The override key feature stays legal and still renames that task type per repository (D-12).
    because: D-18 settles that the type follows the issue's ROLE, and this decision was under-specified about role. The grilling named parents explicitly as Feature and classified implementation tasks as Task, and a planned or factory task sub-issue is an implementation task whatever its change_type says. bugfix stays Bug on every route (D-01).
    dec: none
  - id: D-03
    choice: the ten remaining change_type values - logic, api, cross_module, frontend, ai_behavior, docs, config, scaffolding, infra, ci - all map to Task.
    because: the mapping classifies the NATURE of the work, and a planned T-NN of any of those shapes is an implementation task or a chore.
    dec: none
  - id: D-04
    choice: backlog natures map bug to Bug, chore to Task, enhancement to Feature.
    because: the three natures already name the axis the type vocabulary uses.
    dec: none
  - id: D-05
    choice: a change_type or nature outside those sets is a loud refusal before any issue is created, never an untyped issue.
    because: REQ-04 requires an unrecognised value to be reported rather than silently accepted.
    dec: none
  - id: D-06
    choice: infra and ci stay in CHORE_TYPES and factory_decompose CHORE_TYPES untouched, and both map to Task.
    because: Task is exactly what CHORE_TYPES membership already meant in label mode, so behaviour is preserved and pruning the vocabulary is out of scope.
    dec: none
  - id: D-07
    choice: DEC-138 and DEC-203 are amended by rewriting the falsified paragraphs in place to present-tense current truth; no dated amendment sub-section is appended.
    because: DEC-205 ended the amendment-sub-section convention even though DEC-138's own history used it.
    dec: DEC-205
  - id: D-08
    choice: the eighth read-back purpose is written into DEC-203's own copy of the enumerated list AND into the table in .claude/skills/harness/references/github-mirror.md, in identical wording, as ONE row covering three clauses - the new capability-and-declared-names read, the issue-identifier reads gh_issues.internal_id_args and gh_issue_types.node_id_args make against an already-recorded number, and the type read-back the probe makes under its create opt-in.
    because: the two lists are separately maintained copies of one set, and one row is what keeps them from drifting. The three clauses are one bounded class - a lookup against a repository or against an issue whose number Harness already recorded locally - and the identifier clause names practice that has existed since sub-issue mirroring shipped (gh-sync.py:974 and :1215, factory_gh.py:981, verified at eb9d044e) and that the enumeration never listed; naming it is completing the record, not authorising a new read.
    dec: DEC-203
  - id: D-09
    choice: the issue_types_live test kind is registered in .harness/harness.json test_kinds with a non-null cmd and status locally_run, in its own task that the probe task depends on.
    because: DEC-187 forbids qa treating an unknown or null-cmd kind as a soft skip.
    dec: DEC-187
  - id: D-10
    choice: crash recovery is receipt-only - create the issue, record its number AND the provenance value created in the SAME receipt write, apply the type, then promote that entry to True - and a rerun retries the idempotent type-apply only against a locally recorded number whose recorded provenance says Harness created it (D-20); a number whose provenance is absent or adopted is never typed.
    because: DEC-138 rejects discovering an existing issue by title or label search, and a local id cannot be defeated by a title collision or a partial create.
    dec: DEC-138
  - id: D-11
    choice: capability detection, type-name resolution, the mapping table and response parsing live in ONE new shared module, .claude/skills/harness/bin/gh_issue_types.py, imported by gh-sync.py and factory_gh.py; only the invocation glue stays per-caller.
    because: gh_issues.py already proves the shared argv-builder pattern across both callers, and ensure_labels' two independent implementations are the failure mode not to repeat.
    dec: none
  - id: D-12
    choice: the per-repository override is a flat string-to-string map at the EXISTING key github.issue_types in .harness/harness.json, keyed by the twelve change_type values, the three backlog natures, and the literal key parent; an absent key falls through to the default.
    because: it reuses the github block rather than opening a new configuration surface, and mirrors the flat style of the sibling board mapping.
    dec: none
  - id: D-13
    choice: cmd_backlog gains a NET-NEW local receipt file, backlog-issues.json in the feature directory, keyed by the nature:title item string and carrying number and typed - read and written ONLY where the target repository declares native Issue Types.
    because: that route has no receipt at all today, so REQ-08's guarantee has nothing to extend there, and the receipt is written locally rather than read back from GitHub. It is gated on the available state because REQ-05 and clause 3 of the grilling's Settled require the label path preserved exactly - a net-new file in the feature directory, and the duplicate-suppression its read would cause, are an ungranted behaviour change on the compatibility path, where there is no type to recover and so nothing for a receipt to serve.
    dec: DEC-138
  - id: D-14
    choice: the type is applied AFTER creation through gh api graphql updateIssue with issueTypeId, never through a gh issue create flag.
    because: gh 2.92.0 has no --type flag on issue create or issue edit, measured, so the CLI cannot set a native type at all.
    dec: none
  - id: D-15
    choice: a capability query that FAILS - non-zero exit with a top-level errors array, or unparseable output - is classified query_failed, runs in compatibility mode with its own one-line diagnostic, and never gates the run.
    because: the measured discriminator is the response shape, and treating a failed query as capability-absent would silently downgrade an enabled repository while treating it as fatal would make the mirror a gate.
    dec: none
  - id: D-16
    choice: github.issue_types is NOT added to .claude/skills/harness/templates/harness.json.
    because: the pre-creation refusal message names the exact key that repairs it, which is the discovery path the requirement actually needs, and the template stays free of a key most projects never set.
    dec: none
  - id: D-17
    choice: the new behaviour is asserted in three NEW integration test files rather than by extending tests/integration/test-gh-sync.py and test-factory-decompose.py.
    because: the legacy files must keep asserting today's label behaviour unchanged as the compatibility-mode control, and a red-then-green task pair needs a file whose whole content is the new contract.
    dec: none

  - id: D-18
    choice: the native type is determined by the issue's ROLE, not by the change_type string alone - the gh-sync feature parent and the factory parent type as Feature through type_for_parent, a backlog item types by its nature (enhancement Feature, bug Bug, chore Task), and a TASK SUB-ISSUE, planned or factory, types as Bug when its change_type is bugfix and as Task for every other change_type INCLUDING feature.
    because: the destination is that project and organisation views can use the canonical Bug / Feature / Task dimension, and a Feature nested under a Feature destroys exactly that dimension. Issue 1289 and the grilling both say implementation tasks become Task, and a planned T-NN is an implementation task whatever the shape of its diff. Defects stay Bug on every route, so the settled mapping's first clause is preserved. This REFINES D-02, which was under-specified about role. The mapping stays total with no fall-through, and an unrecognised value still refuses loudly.
    dec: none
  - id: D-19
    choice: tests/manual/probe-issue-types.py creates nothing by default - its default invocation is read-only and reports the capability verdict and the declared type names - and it creates a throwaway live issue only when the operator passes an explicit opt-in flag naming the target repository, after which it reports what it created and how to remove it.
    because: no operator grant exists for the probe to write to any repository - neither the grilling note nor issue 1289 authorises a live write, and issue 1289 asks for an acceptance observation. A probe that writes to a repository by default is authority nobody granted it, and the kind registered in harness.json runs the default invocation unattended.
    dec: none
  - id: D-20
    choice: >-
      provenance is recorded POSITIVELY at creation and ABSENCE MEANS UNKNOWN, which is never
      typed. In feature.json's github.typed and in factory.yaml's typed, an entry is written
      in the SAME receipt act as the issue number, carrying the string created; it is promoted
      to True only after the type-apply succeeds, and the string adopted records a number
      Harness took over rather than created. An entry that is ABSENT is unknown provenance and
      is NEVER typed - not on the first run, not on any rerun, and on no route. Only an entry
      whose recorded value is exactly created is ever backfilled.
    because: >-
      the typed mapping is net-new, so the key-presence reading it replaces treats every receipt
      written before this feature ships as a backfill candidate. Measured in this tree, 41 of 41
      feature.json files with a numeric github.parent carry no typed mapping, and DECISIONS.md
      records the parents of FEAT-34 and FEAT-35 as recorded by hand - issues Harness did not
      create. Typing them breaches the grilling note's out-of-scope item (a) and REQ-10.
      DEC-138's own history records an origin marker that was read after the fact and came back
      null for exactly this reason, so a marker written only after the apply cannot distinguish
      a legacy receipt from a mid-crash one. The direction must fail safe: type only what the
      record positively says Harness created. The cost is that a genuine Harness-created issue
      recorded before this ships is never typed by a rerun, which is the acceptable side - it
      leaves an issue untyped rather than retyping an issue somebody else owns.
    dec: DEC-138
