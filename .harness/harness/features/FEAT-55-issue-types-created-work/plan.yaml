tasks:
  - id: T-01
    title: Write the failing unit test for the issue-type mapping and capability classifier
    traces: [REQ-02, REQ-03, REQ-04]
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    files:
      - tests/unit/test-issue-types.py
    verify: |
      python3 -c "import ast; ast.parse(open('tests/unit/test-issue-types.py').read())" || exit 1
      for w in bugfix feature logic api cross_module frontend ai_behavior docs config scaffolding infra ci bug chore enhancement; do
        grep -q "[\"']$w[\"']" tests/unit/test-issue-types.py || { echo "MISSING enumerated value: $w"; exit 1; }
      done
      grep -q "UnknownWorkNature" tests/unit/test-issue-types.py || { echo "MISSING the unrecognised-value assertion"; exit 1; }
      for s in type_for_change_type type_for_nature type_for_parent overrides_from_config classify_capability query_failed capability_query_args node_id_args apply_type_args missing_types refusal_text Defect Story Epic Maintenance; do
        grep -qF "$s" tests/unit/test-issue-types.py || { echo "MISSING the assertion group naming: $s - every numbered assertion group in this task's intent must be present, so an OMITTED group fails this gate as loudly as a failing one"; exit 1; }
      done
      python3 tests/unit/test-issue-types.py && { echo "UNEXPECTED PASS: this test must be RED before T-02"; exit 1; }
      echo "RED as required - all twelve assertion groups present"
    intent: |
      Write tests/unit/test-issue-types.py. It must be RED when you finish: the module it
      imports does not exist yet and is written by T-02. Run it and paste the failure in your
      receipt. Do not create gh_issue_types.py in this task.

      Header: copy the sys.path anchor idiom from tests/integration/test-gh-sync.py:11-16 -
      resolve the repository root two levels up from the test file, join
      ".claude/skills/harness/bin", insert it at sys.path[0], then "import gh_issue_types".
      Exit 0 when every case passes, 1 otherwise, matching the convention in the docstring of
      tests/integration/test-gh-sync.py.

      Assert, ONE ASSERTION PER VALUE, never a loop-wide count:

      1. gh_issue_types.type_for_change_type(ct, {}) returns exactly:
         bugfix -> "Bug"; and "Task" for each of feature, logic, api, cross_module, frontend,
         ai_behavior, docs, config, scaffolding, infra, ci.
         Twelve separate assertions. feature -> "Task" is deliberate and is D-18: this resolver
         answers for a TASK SUB-ISSUE, whose role is an implementation task whatever the shape
         of its diff. A parent's type comes from type_for_parent, never from here.
      2. gh_issue_types.type_for_nature(n, {}) returns: bug -> "Bug", chore -> "Task",
         enhancement -> "Feature". Three separate assertions.
      3. gh_issue_types.type_for_parent({}) returns "Feature".
      4. type_for_change_type("hovercraft", {}) raises gh_issue_types.UnknownWorkNature, and
         str(exc) contains both "hovercraft" and "no issue type is mapped". Same for
         type_for_nature("hovercraft", {}). Assert the raise, not a returned None.
      5. Overrides: type_for_change_type("bugfix", {"bugfix": "Defect"}) == "Defect";
         type_for_change_type("logic", {"bugfix": "Defect"}) == "Task" (fall-through);
         type_for_change_type("feature", {"feature": "Story"}) == "Story" - D-18 changes
         feature's DEFAULT, not the override surface, and the override key stays legal (D-12);
         type_for_parent({"parent": "Epic"}) == "Epic";
         type_for_nature("chore", {"chore": "Maintenance"}) == "Maintenance".
      6. gh_issue_types.overrides_from_config(cfg) returns {} for cfg={},
         for cfg={"github": {}}, and for cfg={"github": {"issue_types": "not-a-map"}}; and
         returns {"bugfix": "Defect"} for cfg={"github": {"issue_types": {"bugfix": "Defect"}}}.
      7. gh_issue_types.classify_capability(returncode, stdout) returns a 3-tuple
         (state, declared, message) where declared maps type NAME to type id:
         - (0, '{"data":{"repository":{"issueTypes":null}}}')
           -> state "absent", declared {}, message "".
         - (0, '{"data":{"repository":{"issueTypes":{"nodes":[{"id":"IT_1","name":"Bug"},{"id":"IT_2","name":"Task"}]}}}}')
           -> state "available", declared {"Bug": "IT_1", "Task": "IT_2"}.
         - (1, '{"data":{"repository":null},"errors":[{"type":"NOT_FOUND","message":"Could not resolve to a Repository with the name x."}]}')
           -> state "query_failed", declared {}, and message contains "Could not resolve".
         - (0, "") -> state "query_failed" (unparseable output is never read as absent).
         These four are the discriminator the whole feature rests on: exit 0 with no top-level
         errors key and a JSON null issueTypes means the repository has no native types; a
         non-zero exit with a top-level errors array means the query failed and must NOT be
         read as capability-absent.
      8. gh_issue_types.capability_query_args("owner/name") returns a list whose first two
         elements are "api" and "graphql", that contains "-f" followed by "owner=owner" and
         "-f" followed by "name=name", and whose query element contains the substrings
         "issueTypes(first:10)", "nodes", "id" and "name".
      9. gh_issue_types.node_id_args("owner/name", 77) ==
         ["api", "repos/owner/name/issues/77", "--jq", ".node_id"].
      10. gh_issue_types.apply_type_args("I_node", "IT_1") returns a list starting
          ["api", "graphql"], whose query element contains "updateIssue" and "issueTypeId",
          and which passes the node id and the type id as -f values.
      11. gh_issue_types.missing_types(["Bug", "Task"], {"Bug": "IT_1"}) == ["Task"] and
          missing_types(["Bug"], {"Bug": "IT_1"}) == [].
      12. gh_issue_types.refusal_text("owner/name", "Task", "chore") contains the type name
          "Task", the string "github.issue_types.chore" and the repo "owner/name".

  - id: T-02
    title: Add the shared gh_issue_types module - mapping, capability classifier and argv builders
    traces: [REQ-02, REQ-03, REQ-04]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    files:
      - .claude/skills/harness/bin/gh_issue_types.py
    verify: |
      python3 tests/unit/test-issue-types.py
    intent: |
      Create .claude/skills/harness/bin/gh_issue_types.py, a pure module on the
      gh_issues.py pattern: mapping data, response parsing and argv builders only. It
      EXECUTES NOTHING - no subprocess, no network - because gh-sync.py and factory_gh.py
      have different failure semantics (skip-and-exit-0 versus raise GhError) and each keeps
      its own runner. Do not modify any other file in this task. tests/unit/test-issue-types.py
      already exists and is red; make it green without editing it.

      The mapping resolves an issue's type from its ROLE, which is D-18. There are three
      resolvers and each answers for exactly one role: type_for_change_type for a TASK
      SUB-ISSUE (planned or factory), type_for_nature for a backlog item, type_for_parent for
      a feature or factory parent. No caller may resolve a parent through
      type_for_change_type.

      Module contents, exactly:

      DEFAULT_TYPE_BY_CHANGE_TYPE = {"bugfix": "Bug", "feature": "Task", "logic": "Task",
      "api": "Task", "cross_module": "Task", "frontend": "Task", "ai_behavior": "Task",
      "docs": "Task", "config": "Task", "scaffolding": "Task", "infra": "Task", "ci": "Task"}
      All twelve keys spelled out. "feature": "Task" is D-18 and is not a typo: this table is
      consulted only for a task sub-issue, and a task sub-issue is an implementation task
      whatever the shape of its diff - a Feature nested under a Feature is exactly what the
      canonical dimension must not contain. bugfix is the only Bug. infra and ci are included
      deliberately: they are members of CHORE_TYPES in gh-sync.py:102 and
      factory_decompose.py:48 and are not legal values of the change_type enum, and Task is
      exactly what CHORE_TYPES membership meant in label mode. Do not prune them from either
      CHORE_TYPES set; that is out of scope.

      DEFAULT_TYPE_BY_NATURE = {"bug": "Bug", "chore": "Task", "enhancement": "Feature"}
      PARENT_KEY = "parent" and DEFAULT_PARENT_TYPE = "Feature".

      class UnknownWorkNature(Exception) - raised, never returned, by both resolvers.

      type_for_change_type(change_type, overrides): the type of a task sub-issue. If
      change_type is not a key of DEFAULT_TYPE_BY_CHANGE_TYPE, raise UnknownWorkNature with the
      message f"{change_type!r} is not a known change_type, so no issue type is mapped for it -
      add it to DEFAULT_TYPE_BY_CHANGE_TYPE or fix the plan". Otherwise return
      overrides.get(change_type) or DEFAULT_TYPE_BY_CHANGE_TYPE[change_type], where an override
      value that is not a non-empty string is ignored. Every one of the twelve keys remains a
      legal override key, feature included (D-12): D-18 changes that key's default, not the
      configuration surface.

      type_for_nature(nature, overrides): the type of a backlog item, same shape against
      DEFAULT_TYPE_BY_NATURE, same "no issue type is mapped" wording.

      type_for_parent(overrides): overrides.get(PARENT_KEY) or DEFAULT_PARENT_TYPE.

      overrides_from_config(cfg): cfg is a loaded harness.json mapping. Return
      cfg["github"]["issue_types"] when it is a dict of str to non-empty str, else {}. Never
      raise; a malformed override block falls through to the defaults.

      CAPABILITY_QUERY is the query measured against mruangutai/harness:
      query($owner:String!,$name:String!){ repository(owner:$owner,name:$name){ issueTypes(first:10){ nodes { id name } } } }
      capability_query_args(repo): split repo on "/" into owner and name and return
      ["api", "graphql", "-f", "query=" + CAPABILITY_QUERY, "-f", "owner=" + owner,
      "-f", "name=" + name].

      classify_capability(returncode, stdout) -> (state, declared, message):
      parse stdout as JSON. If parsing fails, return ("query_failed", {}, <the parse error or
      the raw first 200 chars>). If the parsed document has a top-level "errors" key that is a
      non-empty list, return ("query_failed", {}, <the first error's message>) - regardless of
      returncode. If returncode is non-zero, return ("query_failed", {}, <stdout truncated to
      200 chars>). Otherwise read data.repository.issueTypes: JSON null (or the repository key
      null) means ("absent", {}, ""); a mapping with a "nodes" list means ("available",
      {node["name"]: node["id"] for each node with both keys}, ""). Anything else is
      ("query_failed", {}, ...). The three states are the entire vocabulary; no fourth value.

      node_id_args(repo, number): ["api", f"repos/{repo}/issues/{number}", "--jq", ".node_id"].
      This is node_id, NOT the .id that gh_issues.internal_id_args reads: the sub-issue REST
      endpoint takes the database id, and the GraphQL mutation takes the node id. They are
      different values and swapping them 422s.

      APPLY_TYPE_MUTATION:
      mutation($id:ID!,$type:ID!){ updateIssue(input:{id:$id,issueTypeId:$type}){ issue { id } } }
      apply_type_args(node_id, type_id): ["api", "graphql", "-f",
      "query=" + APPLY_TYPE_MUTATION, "-f", "id=" + node_id, "-f", "type=" + type_id].
      issueTypeId is a measured input field of both CreateIssueInput and UpdateIssueInput;
      updateIssue is used because gh 2.92.0 has no --type flag on issue create or issue edit,
      so the type can only be applied after the create.

      missing_types(required_names, declared): sorted, de-duplicated list of the names in
      required_names that are not keys of declared.

      refusal_text(repo, type_name, config_key): a single line reading
      f"issue type {type_name!r} is not declared by {repo} - set github.issue_types.{config_key}
      in .harness/harness.json to a type name this repository declares, or add the type to the
      repository". One line, no newline inside it.

