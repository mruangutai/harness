  - id: T-10
    title: Add the host-only probe that reports live pass or capability absent
    traces: [REQ-11]
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-02, T-09]
    files:
      - tests/manual/probe-issue-types.py
    verify: |
      py=$(command -v python3)
      repo=$("$py" -c "import json; print(json.load(open('.harness/harness.json'))['github']['repo'])") || exit 1
      out=$("$py" tests/manual/probe-issue-types.py); rc=$?
      test "$rc" = 0 || { echo "the default invocation must exit 0, got $rc: $out"; exit 1; }
      test "$(printf '%s\n' "$out" | grep -c '^probe-issue-types: ')" = 1 || { echo "not exactly one verdict line: $out"; exit 1; }
      printf '%s\n' "$out" | grep -Eq "^probe-issue-types: (CAPABILITY ABSENT|CAPABILITY PRESENT) $repo " || printf '%s\n' "$out" | grep -Eq "^probe-issue-types: SKIP .*$repo" || { echo "no verdict line naming the configured repo $repo: $out"; exit 1; }
      printf '%s\n' "$out" | grep -Eq "created issue|LIVE PASS" && { echo "the default invocation must create nothing (D-19): $out"; exit 1; }
      skip=$(env PATH=/usr/bin:/bin "$py" tests/manual/probe-issue-types.py); rc=$?
      test "$rc" = 0 || { echo "an absent gh must SKIP and exit 0, got $rc: $skip"; exit 1; }
      printf '%s\n' "$skip" | grep -Eq "^probe-issue-types: SKIP " || { echo "an absent gh must SKIP, got: $skip"; exit 1; }
      echo "probe verdict names $repo, creates nothing, and skips without gh"
    intent: |
      Write tests/manual/probe-issue-types.py, executable, run on a credentialled host against
      the real GitHub. It is the only check in this feature that touches the real API; every
      other criterion runs against a fake, so this file must NEVER import a fixture, never set
      GH_SYNC_GH, and never fall back to a canned response. A fixture-derived pass here would
      make the one live gate a no-op.

      IT CREATES NOTHING BY DEFAULT (D-19). The default invocation is READ-ONLY: it reports the
      capability verdict and the declared type names and creates no issue in any repository.
      Creating a throwaway issue happens only under the explicit opt-in of §6.

      Behaviour:
      1. Resolve the repository from .harness/harness.json github.repo. If github.sync is
         false, the repo is unpinned, gh is not on PATH, or gh auth status fails, print
         "probe-issue-types: SKIP <reason>" and exit 0. Name the repository in the reason
         whenever one was resolvable.
      2. Import gh_issue_types from .claude/skills/harness/bin (same sys.path anchor idiom as
         tests/integration/test-gh-sync.py:11-16), run the real
         gh_issue_types.capability_query_args(repo) through subprocess, and classify the
         result with gh_issue_types.classify_capability.
      3. On state "absent", print exactly one line:
         f"probe-issue-types: CAPABILITY ABSENT {repo} declares no native issue types" and
         exit 0. This is the verdict expected against the pinned mruangutai/harness, which
         returned issueTypes null at eb9d044.
      4. On state "query_failed", print
         f"probe-issue-types: SKIP capability query failed on {repo} ({message})" and exit 0 -
         an unreachable API is not a failed acceptance.
      5. On state "available" WITHOUT the opt-in flag - the default - print exactly one line
         naming the repository and every type it declares, in sorted order:
         f"probe-issue-types: CAPABILITY PRESENT {repo} declares native issue types <names>",
         and exit 0. Nothing is created, nothing is written to GitHub, and no issue-level read
         is made.
      6. The opt-in. Accept exactly one argument, --create-in <owner/name>, and require its
         value to EQUAL the repository resolved in step 1: on a mismatch print
         "probe-issue-types: SKIP --create-in <value> does not name the configured repository
         <repo>" to stdout and exit 2, creating nothing. Retyping the repository is the whole
         safety of the flag. With the flag and state "available": resolve the type a real
         create would use - gh_issue_types.type_for_parent(overrides) read from the same
         harness.json - and if gh_issue_types.missing_types names it, print
         "probe-issue-types: SKIP " followed by gh_issue_types.refusal_text(...) and exit 0
         WITHOUT creating. Otherwise create one throwaway issue titled
         "probe-issue-types scratch <UTC timestamp>" with the label harness, apply that type
         through gh_issue_types.apply_type_args, read the created issue's type back with a
         GraphQL query for issue(number:N){ issueType { name } }, close the issue in a finally
         block so a failure does not leave it open, and print exactly one line:
         f"probe-issue-types: LIVE PASS {repo} created issue N, read back native type <name>,
         closed it - remove it with gh issue delete N --repo {repo} --yes". Exit 0 when the
         read-back name equals the applied name, and exit 1 with a line naming both the applied
         and the observed name when it does not. The read-back is authorised by the eighth
         read-back purpose T-11 and T-12 write; it happens only on this opt-in path.
      7. Exactly one verdict line, always prefixed "probe-issue-types: ", and exactly one of
         LIVE PASS, CAPABILITY PRESENT, CAPABILITY ABSENT or SKIP. No other line starts with
         that prefix, and every verdict except a SKIP for an unresolvable repository names the
         repository.

