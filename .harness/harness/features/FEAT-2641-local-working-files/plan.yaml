    execution_mode: main-session-direct
    execution_reason: DEC-174 - merge-gitignore.py and the ignore contract are Harness enforcement surfaces, and .gitignore resolves to NOBODY (DEC-179).
    depends_on: []
    status: ready
    files:
      - .gitignore
