decisions:
  - id: D-01
    choice: A feature's notes/ (prototypes, mockups and screenshots included), runs/ (all of it, not only ui/) and observations/, and every project note under .harness/notes/, are local working files - ignored by four directory rules in .gitignore and templates/gitignore.snippet, untracked here with git rm --cached, history never rewritten, and a committed guard test refuses any tracked one; the committed feature record is feature.json, plan.yaml, BRIEF.md and STATE.md. Recorded as a new decision that strikes DEC-257.
    because: Since FEAT-71 about half of main's object growth is notes and runs and deleting them later never shrinks history; the operator ruled notes exist only for distill and expertise. An ignore rule alone leaves already-tracked files and in-flight branches tracked, so the index is guarded too.
    dec: DEC-262
  - id: D-02
    choice: check-state retires INV-8, INV-12, INV-15, INV-16, INV-17, INV-18, INV-36, INV-43, INV-46, INV-47 and INV-51 and INV-40 clause (c), numbers never reused; INV-7 keeps only the cycle arithmetic; the read-side evidence helpers in feature_record/evidence.py go with them. Rejected - keeping them as local-only check-state rows, because check-state is one program CI also runs and a row red in CI by construction is the defect being removed.
    because: Each reads a notes, runs or handoff file that is no longer in any checkout CI sees; write-time and yield-time checks keep grading the same artifacts while they exist on disk.
    dec: DEC-262
  - id: D-03
    choice: No working file gets a committed home. Answers, UAT results, ship briefings, prototypes, research, debug and review notes, handoffs, receipts and run records stay local; feature-record --decision, --evidence and --digest keep their write-time checks and record path and sha256 as provenance of a file not retained after cleanup. Rejected - copying ruling and answer text into feature.json, which DEC-150 caps at 300 lines, or into the PR body.
    because: The operator ruled notes need not be committed or included in any artifact; the decisions they informed are already in feature.json judgements, rework and runs and in plan.yaml approval and panel.
    dec: DEC-262
  - id: D-04
    choice: 'Expertise receipts stay at notes/expertise-receipt-<sha>.json as local working files; expertise-merge reads every receipt in the feature''s local notes with no base-tree exclusion, merge-distill replays them unchanged, and already-applied state is main''s merged Expertise plus the receipts'' deletion by the post-merge cleanup. Distill runs stay registered in feature.json runs: the distill PR commits the reconstructed Expertise files and feature.json, staged only after every distill run is closed, while the run directories, receipts and observation logs stay local and unstaged and are read at runtime by validate-digest and dispatch-guard as today. Rejected - committing receipts to a tracked path outside notes, which keeps a remote audit of applied ops but regrows the committed record the operator excluded.'
    because: merge-distill already runs in the live distill worktree where the receipts exist, so committing them only served the git ls-tree exclusion that an untracked receipt makes dead.
    dec: DEC-262
  - id: D-05
    choice: 'One module, bin/working_files.py, owns cleanup and its path contract. It removes the feature directory''s notes/, runs/ and observations/ recursively, unlinks each project note feature.json project_notes lists as one file or symlink, refuses before removing anything when a listed note is a directory or the .harness/notes parent is a symlink or resolves elsewhere, never follows a symlink, and owns the project-note path validator feature-record.py imports. Every caller runs it only after its own terminal write has succeeded, so a refused write leaves every file in place. Callers - merge-gate.py merge-distill after a successful merge; gh-sync.py abandon --yes after it records abandoned; plan-merge.py set-feature-station whenever it has written rejected, which covers gh-sync.py reject --yes with a numeric successor (it writes the station through that verb) and the caller of reject --superseded-by none alike; gh-sync.py skip-distill after it records and commits the declined distill (D-11); and a new feature-worktree.py clean verb, which resolves the owner checkout from whichever checkout runs it and the one linked worktree holding the feature directory, named by the short or the full id, refuses when two hold it, and is refused unless the landed record (the owner checkout''s plan.yaml, which ship writes) or the worktree''s plan.yaml reads done, abandoned or rejected - the routine skip-distill runs, the route for a distill that changed no Expertise, and the retry for a failed cleanup. A terminal command whose write landed but whose cleanup failed names what was removed and the clean command and never asks for the terminal command again: gh-sync.py and merge-gate.py exit 4, plan-merge.py set-feature-station exits 10, a code no plan-merge path returned before.'
    because: The operator wants cleanup to be a routine, not a hand step, and ruled on 2026-11-27 (GC-01) that writing rejected and declining a distill run it automatically, overriding the drafted caller-run step; one implementation keeps every cleaning path - abandon, the rejected write, merge-distill, skip-distill and clean, while ship leaves the files for distill - deleting the same bounded set (generalizes DEC-238's abandon prune). Cleaning inside set-feature-station, after its locked write returns, is the one place both reject paths share and the one point where the station is known to have landed, so the evidence of an intake whose station write refuses is never destroyed. Rejected - cleaning inside gh-sync.py reject for the none path, which cannot know whether its caller's later station write succeeds.
    dec: DEC-262
  - id: D-06
    choice: feature.json gains project_notes, a list of .harness/notes/<name> paths, written only by feature-record.py project-note; the orchestrator records the grilling artifact and every other .harness/notes/ path its dispatch hands it at its first cycle; cleanup deletes only listed project notes and never one no feature claimed.
    because: A grilling note is written before the feature id exists, so it cannot live under the feature; a recorded claim is the only way cleanup can tell a feature's project notes from spike and ad-hoc notes it must never delete.
    dec: DEC-262
  - id: D-07
    choice: gh-sync.py ship's validation precondition reads feature.json instead of notes/handoff-validate.md - it refuses, before any GitHub write, a feature with no validator-squad validate or fix run recorded PASS unless every task is main-session-direct. Rejected - deleting the precondition outright, which reopens BUG-1129 (the post-merge sweep shipping a feature whose validate is still in flight).
    because: Ship runs in the main checkout or a plain clone, where an untracked note never exists, so the old check would refuse every feature; the PASS run it stood for is already in the committed ledger. This departs from the grilling, which listed ship's handoff-validate refusal among the gates to delete; the operator kept the precondition, moved to feature.json, on 2026-11-27 (OQ-01).
    dec: DEC-262
  - id: D-08
    choice: feature-worktree.py remove refuses, exit 4, while the feature directory holds any file under notes/, runs/ or observations/ that git does not track, naming each of those directories with its file count and the clean command, and bash-write-guard.py refuses an unforced native git worktree remove on the same condition (T-11, operator ruling E4); the post-merge sweep therefore keeps a shipped feature's worktree until distill or clean has run. Rejected - deleting working files with the tree, because the sweep removes the worktree when the station-done record lands, which would destroy the observation logs before distill reads them.
    because: Ignored files are invisible to the existing dirty-tree gate and git worktree remove deletes them silently, so without this gate nothing protects them.
    dec: DEC-262
  - id: D-09
    choice: harness.json seam_era_start stays declared in the schema and template and in this repository's harness.json, unread once INV-43 retires.
    because: Removing a declared key makes every onboarded checkout's harness.json fail DEC-256's closed schema; a schema migration is outside this feature, and an unread declared key breaks nothing.
    dec: DEC-256

  - id: D-10
    choice: The main session executes every task directly in the feature worktree as local commits on feat/FEAT-2641-local-working-files and pushes the branch and opens its one pull request only after T-09's verify passes on the final tree. CI's integration shards, canonical-reader audit and repository-state gate therefore grade only that final head, never T-01's untracking without T-02's retired rows or a deleted test before T-09's registry update. The operator merges it through the ordinary hooked merge, which runs the owner checkout's pre-change merge-gate.py on its ordinary route - a route this feature does not change (T-06 changes only merge-distill) - so no change executes through the enforcement it changes. FEAT-2641's own ship, clean and any distill, and the five distill declines of D-12, run after the merge on main's new code. Rejected - one pull request per task, which would put an untracked tree in front of the old check-state in CI and leave the reader registries stale between merges.
    because: The tasks share gate inputs without sharing file anchors - the root .gitignore read by merge-gate and feature-worktree fixtures, check-state's corpus, and the two CI registries - so only the cumulative tree is a state any live gate may see (DEC-174, DEC-183).
    dec: DEC-174
  - id: D-11
    dec: DEC-262
    choice: gh-sync.py skip-distill <feature-dir> --reason-file <path> [--yes] records a declined distill and then cleans. It takes the landed record in the owner checkout and refuses a worktree path as ship does; refuses, writing nothing, unless that plan.yaml reads done; appends one feature.json judgement of a new eighth kind, distill, decision declined, through feature-record.py judgement, unless one is already recorded; commits that feature.json alone in its own checkout without pushing, through ship's terminal-station commit helper; and only after that commit succeeded runs feature-worktree.py clean --yes, which deletes the retained worktree's copy when one exists. A failed commit exits 1 with nothing removed, and a re-run commits the recorded decline without appending another. It is dispatched before gh-sync's GitHub config and auth preflight, so github.sync off or an absent or unauthenticated gh never turns it into a silent SKIP. Without --yes it prints what it would record and remove and changes nothing. Rejected - a plan.yaml station or key, because done must stay the shipped station every reader keys on; a marker under notes/, which the cleanup itself deletes; and feature-record.py as the home, which writes one feature.json and cannot resolve the retained worktree copy the cleanup must delete.
    because: The operator ruled on 2026-11-27 (GC-01) that declining a distill is a recorded act that runs the same cleanup, not a documented follow-up; feature.json judgements is the committed ledger the operator already audits, and gh-sync.py already hosts the terminal verbs with their --yes preview, the landed-record worktree refusal and the local commit of a terminal record.
  - id: D-12
    dec: DEC-262
    choice: 'BUG-2451, FEAT-2557, BUG-2565, BUG-2566 and FEAT-2581, shipped with no distill commit on origin/main, are declined: no preservation step and no snapshot of their observation logs. After the operator merges FEAT-2641, the main session runs gh-sync.py skip-distill --yes on each one''s landed record in the owner checkout, on main''s new code, so each feature.json carries the committed distill declined judgement, which the main session confirms per feature from git and the ledger rather than from the exit alone. Rejected - copying their observation logs aside before the untracking lands, which keeps lessons the operator chose to drop.'
    because: 'Operator ruling 2026-11-27 (OQ-02): their lessons are dropped; their working files leave every checkout when the untracking commit is pulled and stay readable in git history. Recording after the merge keeps every write of this feature''s build inside its own directory (FEAT-1559) and runs the new verb on landed code (DEC-174).'
  - id: D-13
    dec: DEC-261
    choice: 'Raw verification output (runner logs, captured stdout/stderr, measurement stores, generated receipts and receipt scripts) is written under the feature''s scratch/ directory, .harness/<segment>/features/<id>/scratch/, a fifth local working-file class beside notes/, runs/ and observations/: git-ignored by the same .gitignore and gitignore.snippet rule set, refused when tracked by the guard test, counted by GATE 2b and bash-write-guard''s native worktree-remove check, and removed by working_files.clean on every terminal path. Notes and receipts carry one summary per check - what ran, at which commit, the verdict and the counts - never the pasted output; a dev receipt still carries the verify command verbatim, which is all validate-digest.py checks. DEC-261''s clause that runs/ records and QA manifests stay as DEC-238, DEC-255 and DEC-257 set them becomes: they are local working files under DEC-262, never committed. Rejected - /tmp/featNNNN-* paths, which no cleanup owns and no worktree gate protects.'
    because: 'Operator ruling 2026-11-28 (notes/answers-validate-c0-amend2.md (b)): DEC-261 landed on main while FEAT-2641 was in validate, and its pointer to DEC-238/DEC-257 contradicts DEC-262, which untracks runs/ and QA manifests; a scratch directory inside the feature lets the routine that already owns working-file cleanup own raw output too.'
