decisions:
  - id: D-01
    choice: >-
      The segment rule and its composition are SPLIT, and both are homed in factory_config.py.
      segment_of(repo_name) returns the fleet repository name after the owner and is the one shared
      rule; it has three callers, factory_claim.py, feature-worktree.py:resolve_repo, and
      factory_config.workspace_path, which re-implements that rule inline today.
      features_root(repo_name) joins harness_boundary.resolve_root(_BIN_DIR), ".harness",
      segment_of(repo_name) and "features"; it has exactly one caller, factory_claim.py.
      DEVIATION FROM THE SETTLED WORDING, NAMED SO THE OPERATOR SIGNS IT KNOWINGLY: the wording settled
      in grilling was ONE resolver function called by both factory_claim.py and
      feature-worktree.py:resolve_repo. Under this shape the function both callers share is segment_of,
      NOT a features-root function, and features_root is a thin single-caller wrapper. The module home
      is also no longer engineering's free choice: it is pinned to factory_config.py.
      THE SAME DEVIATION APPLIES TO THE TICKET, IN THE SAME WORDS: issue 1290's Scope bullet asks to add
      ONE repo name to features root resolver and have both callers call it. Under this shape the
      features-root resolver has exactly one caller and the function both callers share resolves the
      SEGMENT, not the features root, so a signer grading this plan against the ticket sees the
      identical deviation there and need not map the grilling wording onto it.
    because: >-
      Three measurements at eb9d044e retire both the one-function shape and the free home.
      (1) feature-worktree.py:resolve_repo (:64-87) needs the SEGMENT and composes it with
      factory_config.workspace_path's workspace_root (:382-387), not with the harness root, so a single
      features-root function forces it to recover the segment as basename(dirname(...)) of a path built
      for a different consumer, coupling the worktree CLI to the features layout.
      (2) factory_config.workspace_path (:382-387) already performs the identical owner-strip and its
      docstring claims to be the one place that derivation exists, so any home outside factory_config.py
      leaves a second live derivation one file over that SC-06's scan would have to grow to catch.
      (3) harness_boundary.py already holds a layout_fixtures.STUB entry (:53-56) keyed by path ALONE,
      while READER_TABLE is keyed by (surface, path), so D-04's retarget onto it would produce a
      duplicate dict key that the set-comparing import guard at layout_fixtures.py:68-71 does not catch.
      factory_config.py holds neither a table row nor a STUB entry, and already imports
      harness_boundary and defines _BIN_DIR (:34-37), so it needs no new import.
    dec: none
  - id: D-02
    choice: >-
      _BlockerCache takes no root at construction; it resolves the features root per candidate
      from repo_name and keys its plan and issue-map caches on the pair of repository and
      feature, never on feature alone.
    because: >-
      A FEAT-04 directory exists today under both .harness/harness/features and
      .harness/kaya-ai/features, so a feature-only key serves one repository's plan to the other.
    dec: none
  - id: D-03
    choice: >-
      The single-home property is asserted by a source-scan case rather than by a behavioural probe, and
      the scan matches the owner-strip BEHAVIOUR rather than one spelling. Its pattern is: a split,
      rsplit, partition or rpartition on a slash literal applied to an identifier whose name starts with
      repo, OR os.path.basename applied to such an identifier - as a regex,
      \brepo\w*\s*\.\s*(?:r?split|r?partition)\s*\(\s*["']/["']|\bbasename\s*\(\s*repo\w*
      The scan reads THREE files: factory_claim.py and feature-worktree.py must each contain ZERO
      matches, and factory_config.py exactly one.
    because: >-
      The property is textual, that no second derivation exists, and a behavioural probe cannot prove a
      negative over source text; the repository has precedent for source-scan drift guards at
      tests/unit/test-no-distribution.py:371-372. The scan is AMENDED rather than replaced.
      factory_config.py joins the scanned set because workspace_path (:382-387) carries a second live
      derivation today that a two-file scan would ship green.
      WHY THE PATTERN IS BEHAVIOURAL, NOT THE split-on-slash SPELLING: the first draft pinned
      split("/", 1)[-1], so an rsplit, partition or basename re-derivation in feature-worktree.py would
      have satisfied the scan while ticket 1290's Done-when bullet - no second owner-strip - stayed
      undelivered under a green verify. MEASURED at eb9d044e: the pattern above matches exactly
      feature-worktree.py:86 and factory_config.py:386 and nothing else in the three files; in
      particular it does NOT match factory_claim.py:84 (url.rstrip("/").split("/")),
      feature-worktree.py:203 (rest.split(" -> ", 1)) or :278 (r.stdout.split("\0")), so it is red for
      the derivation that exists today and false-positives on no unrelated split in the scanned set.
      THE RESIDUE IT CANNOT SEE, stated rather than implied: an owner-strip whose subject is first
      copied into a differently-named local, one written as an index slice on repo.find("/"), and one
      delegated to a fourth module. That residue is accepted because this change edits only the three
      scanned files and every line of that diff is read at review, and because the behavioural half -
      that feature-worktree.py still resolves the RIGHT segment after the edit - is covered by
      tests/integration/test-feature-worktree.py inside T-03's verify, not by the scan.
    dec: none
  - id: D-04
    choice: >-
      layout_migration.READER_TABLE's factory_claim.py row (:92-94) is MOVED onto
      .agents/skills/harness/bin/factory_config.py, the module that carries the .harness / segment /
      features join after T-03, with layout_fixtures.STUB's key changed in the same edit. The features
      surface keeps five reader rows. Removing the row outright was the alternative considered, and is
      not taken.
    because: >-
      Once claim delegates, no regex on its text can tell legacy from migrated, so the reader classifies
      as neither and the whole features surface goes CANNOT_VERIFY, which check-state.sh INV-27
      (:2363-2367) reports as a failure.
      CITATION CORRECTED: the FEAT-42 precedent recorded at layout_migration.py:98-104 is a REMOVAL, not
      a move. factory_config.py's docs row was deleted because after that change NO file carried the
      path string at all. Here a successor file does carry it, so the row moves rather than being
      removed: the move keeps the module that now owns the rule under coupled-reader scrutiny, which
      removal would forfeit, and it preserves the surface's reader count.
      factory_config.py holds neither a READER_TABLE row nor a layout_fixtures.STUB entry today, so the
      move creates no duplicate STUB key and needs no combined stub body carrying two surfaces'
      fragments. That is the same fact D-01 relies on, and it is why the home pin and this row move must
      land together.
    dec: none

