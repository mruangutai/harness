tasks:
  - id: T-01
    title: Write the failing unit coverage for per-repository claim resolution
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-06, REQ-07]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: ready
    files:
      - tests/unit/test-factory-claim.py
    verify: |
      # PASS requires a FAIL marker line from EACH of the six new cases: one red case, an ImportError,
      # or a non-discriminating 5d/5e/5f can no longer satisfy this task. Every new case's check() name
      # begins "BUG-1290 5x:" and every case reports its own exception through check() rather than
      # aborting the file (T-01 step 5), so a marker line exists even when the seam is absent.
      # Measured at eb9d044e: tests/unit/test-factory-claim.py exits 0 with 120 ok lines and no FAIL
      # line at all, so every grep below misses and this command exits 1, printing MISSING RED: 5a..5f.
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/BUG-1290-factory-claim-repo-root && out=$(python3 tests/unit/test-factory-claim.py 2>&1); rc=0; for m in 5a 5b 5c 5d 5e 5f; do printf '%s\n' "$out" | grep -q "^FAIL  BUG-1290 $m" || { echo "MISSING RED: $m"; rc=1; }; done; test $rc -eq 0
    intent: |
      Write the failing unit coverage for BUG-1290 in tests/unit/test-factory-claim.py, before any
      production change. This task also FIXES the shared seam's public shape: T-03 implements exactly
      what these tests import, so record the choice in this file's docstring.

      1. The seam is TWO module-level functions, both homed in factory_config.py (D-01). T-03 adds them
         there; write the tests against them.
         segment_of(repo_name) returns the fleet repository name after the owner, i.e. the part after
         the first slash. Its input is always an owner-qualified fleet repository name such as
         acme/widget or owner/harness. It is NOT the bare literal harness: that is
         feature-worktree.py's own --repo CLI form, which returns early at :67-69 before reaching any
         shared call, so write no case for it.
         features_root(repo_name) returns os.path.join(harness_boundary.resolve_root(_BIN_DIR),
         ".harness", segment_of(repo_name), "features"), using factory_config's existing _BIN_DIR (:37)
         and its existing harness_boundary import (:34).
         factory_claim must reach features_root through its imported factory_config module attribute, so
         a monkeypatch of factory_config.features_root is honoured.
      2. DELETE the two module-scope cases at :58-68 that pin the unpatched FEATURES_ROOT default,
         together with the comment introducing them at :54-57 and the docstring sentences describing
         them at :14-16. SEPARATELY, reword only the docstring's FEATURES_ROOT sentence at :7-8 to say
         the features root is now resolved per candidate through a monkeypatched
         factory_config.features_root; the rest of :7-12 documents the fixture rig, stays true, and
         stays. Do not re-pin the deleted default anywhere, and do not convert the two deleted cases
         into weaker assertions.
      3. Replace run_main's FEATURES_ROOT save/patch/restore (:393-394, :420) and the B5-ter root swap
         (:850-867) with a patch of the resolver seam: monkeypatch factory_config.features_root with a
         FUNCTION OF repo_name that mirrors the real join into this file's fixture tree, i.e. it joins
         the fixture harness root, ".harness", the part of repo_name after the first slash, and
         "features". It must be a function of its argument, never a dict lookup or a constant: T-05's
         mutation proof works by freezing that argument, and a constant patch would make the mutant
         indistinguishable from the correct code.
      4. Extend build_features_root() to lay down two segment roots under one temporary harness root,
         .harness/kaya-ai/features and .harness/harness/features, each holding a feature directory with
         the SAME id whose plan.yaml carries a DIFFERENT task DAG: one whose task is blocked, one whose
         task is clear.
      5. Add these cases, using the existing check(name, cond, detail) idiom and the Recorder-based
         factory_gh patching. Add no test framework and spawn no subprocess.
         NAMING IS PART OF THE CONTRACT: each case's check() name begins with the literal marker
         "BUG-1290 5a: ", "BUG-1290 5b: " and so on through 5f, because this task's verify and T-05
         both select cases by those markers.
         EVERY CASE MUST EMIT ITS MARKER LINE EVEN WHEN THE SEAM IS ABSENT. Run each case body inside a
         try/except that reports the exception through check(name, False, repr(exc)); at eb9d044e
         factory_config carries neither function, and an uncaught AttributeError would abort the file
         part-way and take the later markers with it.
         a. a candidate on a served non-harness repository reads its own segment's plan and reaches the
            blocker-gate verdict that plan implies, not no_plan (SC-01);
         b. two candidates, same feature id, different repositories: each verdict matches its own
            segment's plan, and the second candidate is not served the first's cached plan task or
            issue map (SC-02);
         c. a served repository whose segment root does not exist: the refusal is the existing no_plan
            reason, and its message contains the resolved absolute path including that repository's
            segment (SC-03);
         d. a fixture fleet entry whose owner-qualified name ends in harness, e.g. owner/harness,
            resolves to .harness/harness/features (SC-04);
         e. after import, factory_claim exposes no FEATURES_ROOT attribute, asserted with hasattr, so an
            alias or a fallback constant fails this case (SC-05);
         f. a source scan reading factory_claim.py, feature-worktree.py AND factory_config.py from disk.
            The scan matches the owner-strip BEHAVIOUR, not one spelling (D-03): compile
            \brepo\w*\s*\.\s*(?:r?split|r?partition)\s*\(\s*["']/["']|\bbasename\s*\(\s*repo\w*
            and require ZERO matches in each of the first two files and EXACTLY ONE in factory_config.py
            (SC-06). Measured at eb9d044e: it matches feature-worktree.py:86 and factory_config.py:386
            and nothing else in the three files, so this case is red today and an rsplit, partition,
            rpartition or os.path.basename re-derivation cannot ship green past it.
      Leave every production file untouched in this task.

  - id: T-02
    title: Move both integration claim fixtures onto the repository's own segment
    traces: [REQ-01, REQ-07]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: ready
    files:
      - tests/integration/test-factory-integration.py
    verify: |
      # PASS requires BOTH claim markers RED: (F) and (H) each build their fixture on REPO's own segment
      # (widget) while claim still hardcodes harness, so each reports no_plan and reddens. The exit code
      # alone is NOT selective - this file has no case selection, one global FAILS counter and one
      # sys.exit(1 if FAILS else 0), so any unrelated regression would read as the intended red.
      # MEASURED at eb9d044e on this worktree, file unmodified: exit 0 in 9.3s, 131 ok lines, ZERO FAIL
      # lines, with "ok    (F) claim exits 0" and "ok    (H) claim against the two-board fleet exits 0" -
      # so both greps miss today and this command exits 1 until BOTH fixtures move (PANEL-01).
      cd /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/BUG-1290-factory-claim-repo-root && out=$(python3 tests/integration/test-factory-integration.py 2>&1); printf '%s\n' "$out" | grep -q '^FAIL  (F) claim exits 0' && printf '%s\n' "$out" | grep -q '^FAIL  (H) claim against the two-board fleet exits 0'
    intent: |
      In tests/integration/test-factory-integration.py, move BOTH end-to-end cases that drive claim off
      the hardcoded harness segment and onto the segment their own fleet entry implies, so each case
      proves per-repository resolution end to end.

      SCOPE, SETTLED BY PANEL-01 AND MEASURED BY A WHOLE-FILE GREP, NOT BY KNOWN LINE NUMBERS: grepping
      this file for .harness at eb9d044e returns exactly TWO hardcoded features-root joins, :882 (case F,
      FEAT-INTEG-HAPPY) and :1246 (case H, FEAT-INTEG-TWOBOARD), and both are inside this task. Every
      other .harness join in the file is out of scope with its reason: :538-542 is the HARNESS_PROJECT_DIR
      marker probe (docs/SPEC.md plus team-config.yaml, not a features root); :1404, :1452, :1495, :1558
      and :1608 write a case's own .harness/harness.json (a file, not a features root); :1506 already
      builds on the widget segment and drives board_lifecycle.py audit, not claim; :27, :30-31 and :429
      are prose. Case (H) sits in this task because a correct T-03 would otherwise redden it - its fixture
      is on the harness segment while its REPO is acme/widget - and that red is &&-chained inside T-03's
      own verify.

      1. At :879-883, build feat_dir from the segment of REPO (REPO is acme/widget at :487, so the
         segment is widget) instead of the literal harness: join root, .harness, that segment, features,
         feat. Derive the segment from REPO in the case rather than typing widget a second time. The
         comment at :879-880 says the fixture lives where factory_claim's import-time FEATURES_ROOT will
         look; that is false after the move, so reword it to say the fixture lives where claim resolves
         REPO's own features root.
      2. At :1245-1247, do the same for case (H) FEAT-INTEG-TWOBOARD. Its REPO is the same module-level
         REPO (acme/widget), so its feat_dir moves onto the same derived segment. Derive the segment from
         REPO here too; do not type widget. Touch none of case (H)'s other lines: its decompose call
         passes feat_dir explicitly (:1257) and stays green, and its claim (:1263), land (:1270) and
         gh-call assertions stay exactly as they are.
      3. Update the file docstring at :28-30, which states that factory_claim's import-time
         FEATURES_ROOT resolves under the case's temp root. It now resolves per candidate, to
         <HARNESS_PROJECT_DIR>/.harness/<segment>/features.
      4. Change nothing else. The decompose and claim assertions, the fake gh and git binaries and the
         --fleet wiring all stay as they are in both cases, and NO NEW CASE IS ADDED. The prohibition
         this task keeps is on ADDING a case; it no longer forbids editing case (H)'s fixture line, which
         PANEL-01 moved into this task's scope.
      BOTH cases are expected to FAIL until T-03 lands; that red state, in both of them, is what this
      task delivers, and this task's verify asserts both markers rather than the file's exit code.

  - id: T-03
    title: Resolve the features root per repository and delete FEATURES_ROOT
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-06]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01, T-02]
    status: ready
    files:
    - .agents/skills/harness/bin/factory_claim.py
    - .agents/skills/harness/bin/feature-worktree.py
    - .agents/skills/harness/bin/factory_config.py
    verify: |
      # PASS: all three suites exit 0 and no FEATURES_ROOT survives in factory_claim.py.
      # test-feature-worktree.py is here because this task edits feature-worktree.py and drives
