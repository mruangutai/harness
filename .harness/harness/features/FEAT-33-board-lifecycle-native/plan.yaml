  - id: T-03
    title: Add the GraphQL primitives for board creation, field options and workflow state
    traces: [REQ-01, REQ-02]
    change_type: api
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/factory_gh.py
      - .claude/skills/harness/bin/test-factory-gh.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Add the five read/write primitives board provisioning needs to factory_gh.py. Every one of
      them goes through run_gh so the rate-limit and fake-binary handling already in that module
      applies unchanged, and every one raises GhError rather than returning a default - the
      existing discipline in project_item_stations and _project_field_resolve.

      1. project_create(owner, title) -> dict with the project's node id and number. Resolves the
         owner's node id first (query user(login:$o){id}), then mutation createProjectV2 with
         input {ownerId, title}. Raise GhError naming the owner and title when
         createProjectV2.projectV2 resolves null.
      2. project_link_repository(project_id, repo) -> None. Resolves the repository node id
         (query repository(owner:,name:){id}), then mutation linkProjectV2ToRepository with input
         {projectId, repositoryId}. Treat an already-linked response as success, not an error.
      3. project_single_select_create(project_id, field_name, option_names) -> the field node id.
         Mutation createProjectV2Field with input {projectId, dataType: SINGLE_SELECT, name,
         singleSelectOptions}. Each singleSelectOptions entry is {name, color: GRAY,
         description: ""} - GitHub rejects the mutation when color or description is omitted, so
         send both explicitly.
      4. project_single_select_extend(project_id, field_id, option_names) -> None. Mutation
         updateProjectV2Field with input {fieldId, singleSelectOptions}. THE MUTATION IS A
         REPLACEMENT, NOT AN APPEND: the caller must pass the full desired option list, existing
         options first with their existing name/color/description preserved, then the additions.
         So this function takes the FULL list it must send and does not compute it - computing the
         union belongs to T-04, where the existing options have already been read. Document that
         in the docstring, because getting it wrong deletes an operator's columns.
      5. project_workflows(owner, number) -> list of {"name": str, "enabled": bool, "number": int}.
         Query user(login:$o){projectV2(number:$n){workflows(first:50){nodes{name enabled
         number}}}}. Measured live on 2026-08-22: this query works and returns those three fields.
         ProjectV2Workflow exposes NEITHER trigger NOR action, so state in the docstring that a
         caller can only match by name and that there is no ProjectV2 mutation that creates or
         enables a workflow - all 31 mutations include deleteProjectV2Workflow and nothing that
         creates one. Raise GhError when user, projectV2 or workflows resolves null; do not return
         an empty list for those cases, because "no workflows" and "cannot see the project" are
         two different findings.

      project_field_options already exists at line 465 - reuse it to read an existing field's
      options; do not add a second reader.

      In test-factory-gh.py cover each of the five against a fake gh binary, following the fake
      already used in that file. Assert on the argv and the GraphQL variables each function sends,
      not only on the parsed return - a mutation that sends the wrong variable name exits 0 with a
      null payload. Include a case where the owner resolves null and assert GhError. Include a
      case asserting project_single_select_extend sends every option it was given, in the order it
      was given, so a future refactor that drops the leading existing options goes red.

  - id: T-04
    title: board_lifecycle.py provision - create the board, the Status field and the missing options
    traces: [REQ-01]
    change_type: feature
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-02, T-03]
    status: pending
    files:
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/test-board-lifecycle.py
      - .claude/skills/harness/bin/run-unit-tests.sh
      - .harness/harness.json
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Create the new bin board_lifecycle.py with its first subcommand. The file will grow two more
      subcommands in T-05 and T-06, so structure it now as
      `board_lifecycle.py <provision|audit|reconcile> [--repo <owner/name>]`.

      Board resolution, one code path for both repositories and nothing else:
      - no --repo, or --repo naming harness.json's github.repo: read the board from
        gh_board.load_board(root).
      - --repo naming a fleet member: read it from factory_config.board_for(fleet, repo). That
        function reads the repository's own .harness/harness.json FROM THE REMOTE at its
        default_branch and never from a checkout - so this tool needs no checkout of a served
        repository at all.
      - --repo naming neither: exit 2 with one line naming the repo and both sources tried.

      provision does exactly this, in order, and is idempotent:
      1. Resolve the board declaration. If it is an explicit null, print one line and exit 0 -
         a project's own declaration that it has no board is not a misconfiguration.
      2. Try to read the project's Status field options with factory_gh.project_field_options for
         board["owner"], board["number"], board["station_field"]. If the project itself does not
         resolve, call factory_gh.project_create(board["owner"], "<repo name>") and
         factory_gh.project_link_repository, then report the NEW project number and STOP with
         exit 3 and one line: the declared board["number"] no longer matches, and the operator
         must record the new number in that repository's harness.json. Do not edit any harness.json
         from this tool - a tool that rewrites the declaration it was validating cannot be trusted
         to have validated it.
      3. If the project resolves but has no field named board["station_field"], call
         project_single_select_create with ALL SIX declared station values, in the declared key
         order backlog, plan, ready, building, review, done.
      4. If the field exists, compute the set difference: declared values not present among the
         field's option names, compared BYTE FOR BYTE and case sensitively (DEC-192). If the
         difference is empty, print "nothing to do" and exit 0 without any mutation. Otherwise
         call project_single_select_extend with the FULL list - every existing option first, in
         its existing order, then the additions. updateProjectV2Field REPLACES the option set, so
         omitting an existing option deletes a column.
      5. NEVER rename, reorder or delete an existing option, and never write an option the
         declaration does not name. There must be no code path that can produce an option named
         "Abandoned" (D-03).
      6. Print one line per action taken and one summary line. Exit 0 on success, 2 on a caller or
         declaration error, 3 on the new-project case in step 2.

      Register the new test file: add "test-board-lifecycle.py" to UNIT_SCRIPTS in
      run-unit-tests.sh, and add .claude/skills/harness/bin/test-board-lifecycle.py to
      test_kinds.unit.detect in .harness/harness.json only if the existing
      ".claude/skills/harness/bin/test-*.py" glob there does not already match it - it does, so
      expect no harness.json change for detect. Rebase on whatever FEAT-31 lands in
      run-unit-tests.sh; that file has another writer.

      Tests in test-board-lifecycle.py, all against a fake gh with BOTH FACTORY_GH and GH_SYNC_GH
      pointing at it (D-11): the no-project path creates and exits 3; the no-field path creates the
      field with all six options in declared order; the missing-option path sends existing options
      first then the addition; the complete-board path performs ZERO mutations and exits 0 - assert
      the fake recorded no mutation call, not merely that the exit code was 0; a second consecutive
      run performs zero mutations; an explicit null board exits 0 silently; an unknown --repo exits
      2. Add one case asserting that for a declaration whose values are all present, no argv the
      fake receives contains the string "Abandoned".

  - id: T-05
    title: board_lifecycle.py audit - the finite finding list, including workflow state
    traces: [REQ-02, REQ-06]
    change_type: feature
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-03, T-04]
    status: pending
    absorbs: ["#673"]
    files:
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/test-board-lifecycle.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Add the audit subcommand to board_lifecycle.py, reusing the board resolution T-04 built.
      audit performs NO writes. It prints one line per finding and a count, exits 0 with zero
      findings and 1 with one or more.

      The five finding classes, and the set is closed:
      1. DECLARATION: a declared station key whose value is not among the board's Status field
         option names, compared byte for byte. Report the key, the value and the board number.
      2. STATION: a CLOSED issue of the repository that is on the board and is not at the declared
         done station. Report the issue number, the station it reads, and the station expected.
         Read stations with gh_board.board_stations, which is the targeted cost-1 query and already
         refuses a truncated page by raising.
      3. REASON: a closed issue whose state_reason is null. Report the issue number. Measured on
         mruangutai/harness 2026-08-22: #416 and #452 both read null, because gh issue close with
         no --reason writes nothing.
      4. LABEL: an issue whose state_reason is not_planned and which does not carry the label
         "abandoned". Report the issue number. Measured: #349 carries not_planned and does not
         carry the label.
      5. WORKFLOW: any of the three names "Item closed", "Auto-close issue", "Pull request merged"
         that factory_gh.project_workflows does not return, or returns with enabled false. Report
         the name, whether it was absent or disabled, and - on the same line - that no API can
         enable it and only a click in the project's web UI can. Detection is by NAME because
         ProjectV2Workflow exposes neither trigger nor action, so a workflow the operator renamed
         is reported as MISSING rather than assumed present; say that in the report header, once
         (SC-09).

      Fetch issue state, state_reason and labels in as few calls as the existing helpers allow:
      one `gh issue list --repo <repo> --state closed --json number,stateReason,labels --limit
      1000` for classes 3 and 4, one board_stations call for class 2, one project_field_options
      call for class 1, one project_workflows call for class 5. Five network calls per audit, and
      state that count in the module docstring so a later reader can see the cost.

      Failure posture: this is a control-plane tool, not the mirror, so it exits non-zero rather
      than printing SKIP - DEC-186's stated inverse of gh-sync's posture. A GhError propagates as
      one line on stderr and exit 4, distinct from the exit 1 that means findings were found; an
      audit that could not run must never be mistaken for an audit that found nothing.

      Tests, all against a fake gh with BOTH FACTORY_GH and GH_SYNC_GH set (D-11). Give each of
      the five finding classes its own case with its own fixture, and assert on the finding's text,
      not on the count alone - a count-only assertion is satisfied by the wrong finding. Include a
      clean board returning exit 0 with zero findings; a renamed workflow reported MISSING; a
      disabled workflow reported disabled; a GhError producing exit 4 with no findings printed.

  - id: T-06
    title: board_lifecycle.py reconcile - move the drifted cards and set the missing reasons
    traces: [REQ-07]
    change_type: feature
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-05]
    status: pending
    files:
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/test-board-lifecycle.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Add the reconcile subcommand to board_lifecycle.py. It runs audit's detection and then fixes
      exactly the three finding classes a write can fix, leaving the other two to a human.

      What it fixes:
      - STATION findings: move the card to the declared done station with gh_board.set_station.
        The right station for a card whose feature is long done is the done station, and the ticket
        stays closed - that is the definition of finished this feature adopts.
      - REASON findings: PATCH repos/<repo>/issues/<n> with state=closed and
        state_reason=completed. Only for issues with no abandoned label and no not_planned reason;
        a null reason on an issue carrying the abandoned label is set to not_planned instead.
      - LABEL findings: add the label "abandoned" to the issue, creating the label first through
        the same helper T-09 adds it to.

      What it does NOT fix, and says so per finding: DECLARATION findings (the declaration is a
      file a human signs, and provision is the subcommand that changes a board) and WORKFLOW
      findings (no API can enable one).

      Flags: --dry-run prints every write it would perform and performs none, and it is the
      DEFAULT. A real write requires --apply explicitly. Reason: this tool can move hundreds of
      cards on the operator's live tracker and nothing undoes that; a default that writes is a
      default that surprises.

      After applying, re-run the audit detection in the same process and print the residual finding
      count. Exit 0 only when the residual count is zero; exit 1 with the residual findings
      otherwise. A reconcile that fixed nine of ten must not report success.

      Tests against a fake gh with BOTH FACTORY_GH and GH_SYNC_GH set (D-11): --dry-run performs
      zero mutations - assert the fake recorded none; --apply fixes one of each fixable class and
      the assertions name the specific argv sent; a DECLARATION finding and a WORKFLOW finding
      survive --apply and appear in the residual list; a residual finding produces exit 1; a fully
      reconciled fixture produces exit 0. Add one case where the first station write raises
      BoardError and assert the run continues to the remaining cards and still reports the failure
      as a residual finding - a bulk fix that stops at the first error leaves the board half
      migrated with a zero exit.

  - id: T-07
    title: Guard start-task against driving a closed card backwards
    traces: [REQ-04]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: []
    status: pending
    absorbs: ["#674"]
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - .claude/skills/harness/bin/test-gh-sync.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind integration
    intent: |
      cmd_start_task in gh-sync.py guards only `if tid not in rec["issues"]` (line 621 at d065b3b)
      and never checks whether the issue is closed or where its card already sits. Measured
      timeline on #642: closed 01:37:47, github-project-automation[bot] set Done at 01:37:48, the
      harness set Building at 02:34:21. #643 is identical. This is the cause of every board error
      on this project.

      Add the guard. Before the set_station call, read the board's current stations once with
      gh_board.board_stations(board, repo) and read the issue's state with
      gh issue view <n> --repo <repo> --json state. Refuse the station write when EITHER the issue
      state is CLOSED or the card's current station equals board["stations"]["done"]. On refusal,
      print exactly one line on stdout naming the issue number, the task id, the current station
      and the reason, in the gh-sync: prefix every line in that file already carries, and return
      WITHOUT calling set_station and WITHOUT calling _apply_parent_rule - the parent rule would
      write a Building parent for a task the guard just refused.

      Reuse the single board_stations result for the guard; do not add a second board read. State
      the added cost in the function docstring: start-task now performs one board read and one
      issue read before its writes, where before it performed none. That read is squarely inside
      DEC-186's second sanctioned purpose - learning which station an item is at.

      A refusal is NOT a failure: exit code and control flow are unchanged, because DEC-146 keeps
      the station flip best-effort by design and DEC-138 forbids the mirror from gating a flow.
      A gh or network failure during either read must also not gate: catch it, print one line, and
      fall through to the ORIGINAL behaviour rather than refusing - a guard that cannot see the
      board must not silently stop moving cards.

      Tests in the existing test-gh-sync.py, with BOTH FACTORY_GH and GH_SYNC_GH pointed at the
      fake (D-11). Replay #642's exact shape first and assert it goes RED against the pre-change
      code: issue closed, card at Done, start-task invoked - assert no station write argv reaches
      the fake and the refusal line is printed. Then: an open issue at Backlog is moved to Building
      as before; an open issue whose card already reads Done is refused; a closed issue whose card
      reads Building is refused; a board read that raises falls through and still writes Building.

  - id: T-08
    title: Close with an explicit reason and label an abandoned ticket
    traces: [REQ-05]
