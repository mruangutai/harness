        default_branch and never from a checkout - so this tool needs no checkout of a served
        repository at all.
      - --repo naming neither: exit 2 with one line naming the repo and both sources tried.

      provision does exactly this, in order, and is idempotent:
      1. Resolve the board declaration. If it is an explicit null, print one line and exit 0 -
         a project's own declaration that it has no board is not a misconfiguration.
      2. Ask whether the PROJECT exists, with factory_gh.project_resolve(board["owner"],
         board["number"]) - the primitive T-03 adds for this step. NEVER infer the project's
         absence from a field-resolution failure. _project_field_resolve raises one GhError class
         for four conditions and deliberately collapses "field absent" with "field is not
         single-select" (factory_gh.py:452-457), so a broad `except GhError` here would call
         project_create on a board that already exists and CREATE A DUPLICATE PROJECTS V2 BOARD ON
         THE OPERATOR'S ACCOUNT, then exit 3 telling them to record the number of the duplicate.
         There is no code path in this tool that may call project_create on any outcome other than
         project_resolve returning None.
         When project_resolve returns None: call factory_gh.project_create(board["owner"],
         "<repo name>") and factory_gh.project_link_repository, then report the NEW project number
         and STOP with exit 3 and one line - the declared board["number"] no longer matches, and
         the operator must record the new number in that repository's harness.json. Do not edit any
         harness.json from this tool: a tool that rewrites the declaration it was validating cannot
         be trusted to have validated it.
         When project_resolve RAISES (the owner does not resolve, or the board is organization-
         owned): exit 2 with the message, and perform ZERO mutations.
      3. The project exists. Read its Status field options with factory_gh.project_field_options for
         board["owner"], board["number"], board["station_field"], and discriminate the two shapes
         its GhError collapses rather than treating them as one:
         - the field NAME is absent -> call project_single_select_create with ALL SIX declared
           station values, in the declared key order backlog, plan, ready, building, review, done.
         - the field exists but is NOT single-select -> EXIT 2 REFUSING, with one line naming the
           field and its actual data type. Perform no mutation. Do not call createProjectV2Field
           for a name that already exists, and do not attempt to convert the field: a Status field
           the operator made a text field is a decision only they can reverse.
         Since factory_gh raises the same class for both, discriminate by reading the project's
         field list rather than by matching a message substring - a message substring is not a
         contract and the wrong branch here is destructive. If the field list cannot distinguish
         them, exit 2 rather than guessing.
      4. If the field exists and is single-select, compute the missing options with the ONE shared
         helper described below, and act on its result. If the difference is empty, print "nothing
         to do" and exit 0 without any mutation. Otherwise call project_single_select_extend with
         the FULL list - every existing option first, in its existing order, then the additions.
         updateProjectV2Field REPLACES the option set, so omitting an existing option deletes a
         column.

