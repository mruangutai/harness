      WHY THIS SHAPE AND NOT A HOOK, so you do not propose one: the only writes in this system that
      are genuinely caused rather than remembered are GitHub's own workflows and a Claude Code hook.
      Hooks are the enforcement layer, which DEC-174 forbids this feature from executing, and a
      board read inside a PostToolUse Write or Edit hook costs a measured 490 to 506 GraphQL points
      per fire on board 3 and would fire on every edit in every session. Folding the station write
      into a command that is already mandatory at that moment is the ceiling, and it is chosen
      deliberately (D-16).

      1. THE PARENT'S BUILDING STATION IS NOT YOURS AND GAINS NO SECOND WRITER (D-21).
         gh_board.derive_station at gh_board.py:88, called through gh-sync.py's own
         _apply_parent_rule at gh-sync.py:177 - re-derived at 46ee87c, and note the earlier draft
         put _apply_parent_rule in gh_board.py, which is wrong - stays the ONLY thing that
         writes a parent card from task statuses. Do NOT make _record_status write a station, and do
         not resolve feature.json's status to a column for the parent. derive_station already answers
         "any sub-issue is building" from plan.yaml task statuses, which is the same answer as reading
         the children's board stations with one fewer network read - the plan is what the children's
         stations are written from. Do not convert it to a board read, now or as a tidy-up.

      2. NEW SUBCOMMAND: `gh-sync.py status <feature-dir> <Status>`. It records feature.json's status
         through the existing _record_status and then performs exactly the station writes that event
         implies, and NOTHING else:
         - Ready: move EVERY recorded T-NN sub-issue to board["stations"]["ready"], using
           gh_board.set_station once per sub-issue, reading the numbers from load_recorded's issues
           map. Write NOTHING to the parent. If no sub-issue is recorded, write nothing at all and
           print one line saying so - do NOT fall back to the parent.
         - Review: move the PARENT to board["stations"]["review"] AND move EVERY recorded T-NN
           sub-issue to board["stations"]["review"] as well, one gh_board.set_station call each,
           reading the numbers from load_recorded's issues map exactly as the Ready path does.
           THE SUB-ISSUES ARE PART OF THIS WRITE (operator ruling 2026-08-23, D-23): close-task no
           longer runs per commit, so a sub-issue is still OPEN when the panel kicks off and it
