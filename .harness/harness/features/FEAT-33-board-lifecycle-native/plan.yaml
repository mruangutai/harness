      0. project_resolve(owner, number) -> dict with the project's node id and its title, or None
         when the project genuinely does not exist. THIS PRIMITIVE EXISTS TO PREVENT A SPECIFIC
         DISASTER, so read the reason before implementing it. _project_field_resolve (line 400,
         re-derived at 46ee87c) raises ONE GhError class for FOUR distinct conditions: project
         owner not found (:435-438), organization-owned board not supported (:441-444), project
         not found (:447-450), and project field not found (:452-457). They are separated only by a
