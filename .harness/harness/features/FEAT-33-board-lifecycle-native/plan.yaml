      - .harness/harness/docs/DECISIONS-INDEX.md
    verify: |
      python3 .claude/skills/harness/bin/gen-decisions-index.py --check
    intent: |
      Append an amendment to DEC-196 recording that the harness board now declares a plan station,
      and regenerate the index row. Append only - the record is never rewritten, and amendment 1's
      body paragraph stays standing exactly as it is.

      The amendment must state, in its own voice and without restating the whole entry:

      - What became false: amendment 1's clause "`plan` is deliberately NOT declared". Measured at
        the SHA this feature ships at, .harness/harness.json's github.board.stations declares six
        keys - backlog, plan, ready, building, review, done - and kaya-ai's own harness.json on
        master declares the same six.
      - Why this is not a strike under DEC-188 and amendment 1's REASONING is not falsified.
        Amendment 1 argued that the option resolves BY NAME at the board, so a wrong value fails
        loudly there and an undeclared name is still writable. Both halves remain true in the tree:
        board-station.py passes the station as a plain string and factory_gh.project_field_set
        resolves the option by name at runtime.
      - What actually changed and why the clause is reversed: parity, not capability. DEC-192's six
        case-sensitive status values ARE the board's column names, and a station map that names
        five of six cannot express one of them by key. The declaration now carries all six, and
        factory_config._STATION_KEYS requires exactly those six, so a five-key declaration is
        rejected with a message naming github.board.stations.
      - What did NOT change, stated so a future scan does not add it: gh_board.derive_station still
        returns exactly the building station, the review station, or None. There is no Plan
        derivation and none is wanted. Plan is written at kickoff by board-station.py. An
        all-pending derivation would overwrite a card the operator promoted to Ready, whose meaning
        is documented in kaya-ai's own harness.json, and that would be a new backwards-move defect
        of the same class as issue 674.
      - The accepted cost: the required key set is now exact at six across every served repository,
        so a repository joining the fleet with a five-key declaration is rejected until it declares
        all six.

      Then run gen-decisions-index.py to regenerate DECISIONS-INDEX.md so DEC-196's row reflects
      the new amendment count. Do not hand-edit the index row.

      Do not open a new DEC number, do not mark any decision stale, and do not touch DEC-192 -
      its refusal of a seventh column is upheld by this feature, not amended.

      This file has other writers this round (FEAT-31, FEAT-26, FEAT-32). Rebase before appending
      and place the amendment after the last existing DEC-196 amendment, whatever its number is.

