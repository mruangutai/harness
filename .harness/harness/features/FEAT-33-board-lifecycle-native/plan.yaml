decisions:
  - id: D-01
    choice: The canonical station map is six keys - backlog, plan, ready, building, review, done - one per DEC-192 status value.
    because: DEC-192's six case-sensitive values ARE the board columns, and both live boards already carry exactly those six options.
    dec: DEC-192
  - id: D-02
    choice: Declare plan but add NO derivation for it; derive_station keeps returning only the building station, the review station, or None.
    because: Plan is not a function of task statuses, and an all-pending branch would overwrite a card the operator promoted to Ready.
    dec: DEC-196
  - id: D-03
    choice: Abandoned stays a ticket state - state_reason not_planned plus a visible abandoned label - and never becomes a board column.
    because: DEC-192 declined a seventh column on the record, and feature-schema.json already documents Abandoned as the one status with no column.
    dec: DEC-192
  - id: D-04
    choice: The abandoned label is created by gh-sync.py's own ensure_labels, and the three ensure_labels implementations are NOT unified.
    because: that implementation already creates labels at open with the swallow-errors policy DEC-138 requires of a mirror; unifying is a separate feature.
    dec: DEC-138
  - id: D-05
    choice: validate_board keeps EXACT set equality on the station keys; the required set widens from five to six.
    because: exactness is what makes a drifted declaration loud, and loosening it permanently to buy a transient cross-repo ordering window is a bad trade.
    dec: none
  - id: D-06
    choice: kaya-ai's own harness.json on master is updated BEFORE the harness validator widens.
    because: validate_board is exact-equality, so no order is atomic; this order leaves the interim failure latent and loud rather than silent.
    dec: none
  - id: D-07
    choice: The harness CREATES a board, its Status field and its missing options, and never renames, reorders or deletes an existing option.
    because: six case-sensitive column names typed by a human is a silent-drift generator, while a destructive provisioner could erase a column the operator uses.
    dec: none
  - id: D-08
    choice: One new bin, board_lifecycle.py, with three subcommands - provision, audit, reconcile.
    because: all three resolve the same board from the same declaration; three bins would restate that resolution three times.
    dec: none
  - id: D-09
    choice: Workflow detection matches by name and enabled only, and reports a non-matching name as MISSING.
    because: ProjectV2Workflow exposes neither trigger nor action, so name is the only handle; measured 2026-08-22 that workflows(first:30) returns name and enabled.
    dec: none
  - id: D-10
    choice: start-task refuses its station write when the issue is closed or its card already reads the done station, and prints one line.
    because: the guard has to catch #642's shape, where the card was already at Done before the harness asked for Building.
    dec: DEC-146
  - id: D-11
    choice: Every test that exercises a board path sets BOTH FACTORY_GH and GH_SYNC_GH to the same fake binary.
    because: gh_board.py's own docstring records that a fake injected through one variable alone leaves the other calls hitting the real board.
    dec: none

