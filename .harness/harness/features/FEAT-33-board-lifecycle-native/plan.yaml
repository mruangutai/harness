  - id: T-17
    title: board_lifecycle.py retitle - the backfill, deriving each id from the ticket's own milestone
    traces: [REQ-11]
    change_type: feature
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-04, T-06, T-16]
    status: pending
    files:
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/test-board-lifecycle.py
      - .claude/skills/harness/bin/test-factory-integration.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind all
    intent: |
      Add a fourth subcommand, `board_lifecycle.py retitle`, that renames existing task tickets to
      the shape T-16 now generates - and refuses rather than guessing.

      HOW IT WORKS:
      1. Enumerate every issue on the target repository with one call:
         `gh issue list --repo <repo> --state all --limit 1000 --json number,title,milestone`.
         Measured 2026-08-22 at f5f5185: 640 issues, cost 7 GraphQL points, by differencing
         `gh api rate_limit --jq .resources.graphql.used`. Refuse with exit 2 if the returned count
         equals the limit, because a truncated enumeration would silently skip tickets.
      2. Select the issues whose title matches ^T-\d+ followed by a space. Measured: 188 of 640.
      3. For each selected issue, derive the feature id from THAT ISSUE'S OWN milestone title and
         from nothing else (D-20). Measured: all 188 carry a milestone naming their feature, so
         nothing needs recovering from notes and nothing is inferred. An issue with NO milestone is
         REFUSED, not renamed: print one line naming the issue number and count it as refused. A
         wrong feature id on a ticket is a false statement nothing will ever re-check, which is worse
         than no id at all.
      4. Skip an issue whose title already starts with its own milestone title followed by the em
         dash separator. That skip is what makes the run idempotent and self-resuming with no state
         file: the title itself records whether the rename happened, so an interrupted run is simply
         re-run. Say so in the tool's own docstring.
      5. Rename with `gh issue edit <n> --repo <repo> --title <new>`. Measured 2026-08-22 at
         f5f5185: 2 GraphQL points per call, so 188 renames plus one enumeration is 383 points
         against the 5000/hour budget, 7.7 percent. Use this route and NOT any `gh project` command:
         a title lives on the ISSUE, not on the card, so no project call is needed at all - and
         `gh project field-list` costs 102 points per call, measured at 3ecaf8c, which is the figure
         that makes a project-based route wrong here.
      6. Support `--dry-run`, which prints the full rename list and the projected point cost and
         writes nothing, and `--apply`. Default to --dry-run, matching reconcile.
      7. Print a summary: renamed, already correct, refused, and points spent - each as its own
         number, not a total.

      Every cost figure written into this tool's output or docstring carries the three conditions the
      repository requires: the board or repository it was measured on, that surface's item count, and
      the commit it was measured at.

      Tests in test-board-lifecycle.py against a fake gh injected through BOTH FACTORY_GH and
      GH_SYNC_GH (D-11): a ticket with a milestone renamed to the exact expected string; a ticket
      with no milestone refused and named, with NO rename call issued (SC-18); a ticket already
      carrying its feature id skipped, with no rename call issued; a truncated enumeration refused
      with exit 2; --dry-run issuing zero write calls. Assert each case individually - a count of
      renames is satisfied by the conformers alone and is blind to the one ticket that conforms to
      nothing. The integration case goes in test-factory-integration.py (D-12).

      ORDERING: T-06 adds the reconcile subcommand to board_lifecycle.py before this task, so retitle
      is the fourth subcommand appended to a file that already carries provision, audit and reconcile.
      Register it in the existing subcommand dispatch rather than re-authoring the entry point.

