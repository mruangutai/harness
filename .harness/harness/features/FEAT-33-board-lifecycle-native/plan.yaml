decisions:
  - id: D-01
    choice: The canonical station map is six keys - backlog, plan, ready, building, review, done - one per DEC-192 status value.
    because: DEC-192's six case-sensitive values ARE the board columns, and both live boards already carry exactly those six options. Confirmed by the operator on 2026-08-23 as ruling 3 in notes/rulings-2026-08-23.md, so the sixth key is a ruling and no longer the plan's own assumption; the fixture blast radius it causes is T-02's engineering work, not a further decision.
    dec: DEC-192
  - id: D-02
    choice: Declare plan but add NO derivation for it; derive_station keeps returning only the building station, the review station, or None.
    because: Plan is not a function of task statuses, and an all-pending branch would overwrite a card the operator promoted to Ready.
    dec: DEC-196
  - id: D-03
    choice: Abandoned stays a ticket state - state_reason not_planned plus a visible abandoned label - and never becomes a board column.
    because: DEC-192 declined a seventh column on the record, and feature-schema.json already documents Abandoned as the one status with no column.
    dec: DEC-192
  - id: D-04
    choice: The abandoned label is created by gh-sync.py's own ensure_labels, and the three ensure_labels implementations are NOT unified.
    because: that implementation already creates labels at open with the swallow-errors policy DEC-138 requires of a mirror; unifying is a separate feature.
    dec: DEC-138
  - id: D-05
    choice: validate_board keeps EXACT set equality on the station keys; the required set widens from five to six.
    because: exactness is what makes a drifted declaration loud, and loosening it permanently to buy a transient cross-repo ordering window is a bad trade.
    dec: none
  - id: D-06
    choice: kaya-ai's own harness.json on master is updated BEFORE the harness validator widens.
    because: validate_board is exact-equality, so no order is atomic; this order leaves the interim failure latent and loud rather than silent.
    dec: none
  - id: D-07
    choice: The harness CREATES a board, its Status field and its missing options, and never renames, reorders or deletes an existing option.
    because: six case-sensitive column names typed by a human is a silent-drift generator, while a destructive provisioner could erase a column the operator uses.
    dec: none
  - id: D-08
    choice: One new bin, board_lifecycle.py, with three subcommands - provision, audit, reconcile.
    because: all three resolve the same board from the same declaration; three bins would restate that resolution three times.
    dec: none
  - id: D-09
    choice: Workflow detection matches by name and enabled only, and reports a non-matching name as MISSING.
    because: ProjectV2Workflow exposes neither trigger nor action, so name is the only handle; measured 2026-08-22 that workflows(first:30) returns name and enabled.
    dec: none
  - id: D-10
    choice: start-task refuses its station write when the issue is closed or its card already reads the done station, and prints one line.
    because: the guard has to catch #642's shape, where the card was already at Done before the harness asked for Building.
    dec: DEC-146
  - id: D-11
    choice: Every test that exercises a board path sets BOTH FACTORY_GH and GH_SYNC_GH to the same fake binary.
    because: gh_board.py's own docstring records that a fake injected through one variable alone leaves the other calls hitting the real board.
    dec: none
  - id: D-12
    choice: Every task whose change type requires the integration kind carries its integration cases in test-factory-integration.py, and NO task edits run-unit-tests.sh's INTEGRATION_SCRIPTS array or harness.json's test_kinds.integration.detect list.
    because: integration.detect is tests/integration/** plus 22 explicit filenames and INTEGRATION_SCRIPTS is a matching 22-name array, both re-counted at 46ee87c where an earlier draft said six and fourteen, so a new test-board-lifecycle.py can never be selected as integration; the qa gate refuses an unrelated passing test as coverage, so the three feature-typed tasks would FAIL the gate after being built. test-factory-integration.py is already in both lists, is by its own docstring the only file in the tree that forks a real process against a stub gh, and already answers _project_field_resolve's GraphQL query - so the gate is satisfied by a genuinely covering test with no edit to a runner array and no edit to the matrix, both of which have three concurrent writers.
    dec: DEC-187
  - id: D-13
    choice: T-01's abandon path is a revert pull request on kaya-ai's master, opened by the operator, and it is stated in T-01 rather than discovered.
    because: T-01 is an irreversible write into another repository landed first, so abandoning the feature after it merges leaves kaya-ai's master declaring six keys the shipped five-key validator rejects, with no revert lever inside the harness repo. D-06's ordering is kept; only the rollback was missing.
    dec: none
  - id: D-14
    choice: Every build task verifies with run-unit-tests.sh --kind all, and no task verifies a single test script directly, even where one script would bind equally.
    because: T-02 widens the station key set in three integration-kind files and six unit-kind ones, so any kind-scoped verify makes a cross-kind regression invisible to the task that caused it - measured as the second half of finding L1, where test-gh-sync.py and test-check-state.py go red invisibly to T-02 and surface inside T-07. The accepted cost is real and is named here rather than discovered later - the integration suite alone was measured at 153s against 73s for test-gh-sync.py alone, so --kind all exceeds the 60-second guideline for a verify command by minutes, per task, per red/green iteration. The single-script alternative was measured and DECLINED for two reasons beyond the cross-kind blindness - harness.json:121 declares test_kinds.integration.cmd as exactly run-unit-tests.sh --kind integration, so a per-script verify forks a second spelling of the same authority, and invoking a script directly skips the MISCONFIGURED drift detector at run-unit-tests.sh:41-55, which is the only thing that catches the unregistered new test file this plan adds.
    dec: none

  - id: D-15
    choice: The station a parent card should read is feature.json's own status resolved through the board's declared stations map, and no new vocabulary is introduced for it.
    because: check-state.sh:494 already declares the closed set Backlog Plan Ready Building Review Done Abandoned, the feature.json schema already enforces it, and gh-sync.py's _record_status already writes it at ship and abandon - so the event-driven map is a coupling of two existing writes rather than a new concept, and the offline comparison of a recorded status against a card station needs no new derivation and no extra network read.
    dec: DEC-192
  - id: D-16
    choice: Recording a feature's status and writing its parent card's station become ONE act inside gh-sync.py's _record_status, and a new status subcommand is the only way to record a phase status.
    because: the only writes in this system that are genuinely CAUSED are GitHub's own workflows and a Claude Code hook; hooks are the enforcement layer DEC-174 forbids this feature from executing, and a board read inside a PostToolUse Write or Edit hook costs a measured 490 to 506 GraphQL points per fire on board 3 and would fire on every edit in every session. So each station write is folded into a command that is already mandatory at that moment, which makes forgetting the station require forgetting the whole act. This is a ceiling, not a solution, and it is recorded as one.
    dec: DEC-174
  - id: D-17
    choice: gh_board.derive_station is left exactly as it is - it keeps returning the building station, the review station, or None - and the explicit status write is ADDED beside it rather than replacing it.
    because: check-state.sh INV-26 grades the parent card against derive_station's return, so removing the review branch would silence INV-26's parent comparison instead of improving it. T-22 does edit check-state.sh, by main-session-direct cutover under the DEC-174 carve-out (D-24), but that edit is a bounded INV-26 widening for the done-task-with-open-sub-issue case and does not touch the parent comparison - so the file being editable here does not license this change. The derivation stops being the only path to Review; it does not stop being the expectation INV-26 reads.
    dec: DEC-174
  - id: D-18
    choice: Ready holds a feature's TASK SUB-ISSUES and never a parent card, on every board, and the factory's claim queue is not touched.
    because: factory_decompose.py:393 already records that the parent is NEVER added to a served-repo board, so factory_claim.py:302's poll of the ready station has only ever contained tasks - by construction, not by convention. The harness lane does the opposite and carries parents as cards, so the fix is to make the harness lane agree with the shipped factory lane about this one station rather than to move any queue or invent a mechanism. Both anchors re-derived at 46ee87c and both still resolve.
    dec: none
  - id: D-21
    choice: The parent KEEPS its card and keeps its existing single writer - gh_board.derive_station read through _apply_parent_rule - and gains no second source. feature.json's status is not a parent-station source.
    because: derive_station already answers "any sub-issue building" from plan.yaml task statuses, which is the same answer as reading the children's board stations with one fewer network read, since the plan is what the children's stations are written from; a per-parent children read would spend GraphQL points on every mirror call. And two writers for one card is the drift this feature exists to remove - so the status record drives the EVENT's writes (sub-issues to ready, parent to review) while the derivation keeps owning the parent's building verdict.
    dec: DEC-196
  - id: D-22
    choice: The audit's STATUS finding class has NO Done exemption - a terminal feature.json status whose parent card is not at the done column is a finding, whether the parent issue is open or closed.
    because: measured at f5f5185, issues 85 and 98 are OPEN parents whose features shipped, whose feature.json status reads Done and whose cards read Backlog; INV-26 skips them on its terminal exemption and the audit's existing STATION class skips them because it keys on closed issues. A Done exemption here would reproduce exactly the blindness the class exists to remove. Abandoned stays exempt because DEC-192 gave it no column at all.
    dec: DEC-192
  - id: D-19
    choice: A task ticket's title carries the FULL feature id, using the same em dash separator gh-sync.py's parent title already uses at :574, and nothing new is invented.
    because: the parent title and the milestone both carry the full id, so a short form would be a third spelling of one name; measured 2026-08-22 the worst existing combination is 226 characters on issue 654, inside GitHub's title cap, and a title that ever exceeded it would fail loudly at the API rather than truncate silently.
    dec: DEC-133
  - id: D-23
    choice: gh-sync close-task is NO LONGER RUN per commit. A task sub-issue stays OPEN through Building and Review and closes with the parent when the pull request merges, from the Closes lines in the PR body. Recording a feature status of Review moves the PARENT and EVERY recorded task sub-issue to the review column.
    because: operator ruling, 2026-08-23, recorded verbatim in notes/rulings-2026-08-23.md. A closed card is moved to the done column by the native Item closed workflow, so a sub-issue cannot hold Review while it is closed - the earlier per-commit close and the ruling that sub-issues reach Review could not both stand, and the operator chose Review. The stated cost the operator accepted - this returns to FEAT-31's close-everything-at-merge shape, so a sub-issue's Done depends on the merge again, and Review becomes reachable because it is written explicitly rather than because the close was deferred. What is no longer written per commit is only the close - the task's status is still recorded as done in plan.yaml in the same act as the commit, and the parent's derived station is still written by start-task.
    dec: DEC-138
  - id: D-24
    choice: A task whose recorded status is done but whose sub-issue is deliberately still open is made legal in check-state.sh INV-26 by a main-session-direct cutover (T-22), and SC-10's untouched-enforcement-file list narrows from five files to four. It is NOT made legal by giving the task a status INV-26 does not map, and NOT absorbed by accepting a standing violation.
    because: INV-26 builds _EXPECT at check-state.sh:1234 as {building, done, pending} and compares every recorded sub-issue's card against it at :1304-1318 - re-derived at 57e18ca, where _want is read at :1304, the silent skip sits at :1305-1306 and the comparison that appends the violation is the elif at :1315-1318 - so status done demands the done column. Today close-task closes the sub-issue at commit and the native workflow lands it in the done column, which is why the invariant has always agreed. Under D-23 the sub-issue is open and at building or review for the whole Review phase, so EVERY done task of EVERY feature becomes an INV-26 violation in the gate that runs at every harness door and before every commit - including this feature's own validate phase. The two alternatives are worse - a status INV-26 does not map is silently skipped, which weakens a gate by the back door, and a standing false violation trains the operator to read violations as noise. DEC-174 keeps this edit out of every squad's hands, so it is the operator's own, and it is the only edit to the enforcement layer this feature requires. RULED - the operator accepted T-22, this decision and SC-20 on 2026-08-23 as ruling 4 in notes/rulings-2026-08-23.md, and accepted with it the cost that SC-10's untouched list is four gate files rather than five. The separation the ruling made explicit is the one this decision turns on - an issue's STATE is GitHub's own open-or-closed field and a card's STATION is the board column, and INV-26's defect was reading a station off a state.
    dec: DEC-174
  - id: D-20
    choice: The backfill derives each ticket's feature id from that ticket's OWN milestone and refuses any task ticket with no milestone rather than guessing.
    because: measured 2026-08-22 all 188 task-titled issues on mruangutai/harness carry a milestone naming their feature, so nothing needs recovering; and a wrong feature id on a ticket is a false statement nothing will ever re-check, which is worse than no id at all.
    dec: none

