  - id: T-06
    title: board_lifecycle.py reconcile - move the drifted cards and set the missing reasons
    traces: [REQ-07]
    change_type: feature
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: [T-05, T-08, T-15]
    status: pending
    files:
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/test-board-lifecycle.py
      - .claude/skills/harness/bin/test-factory-integration.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind all
    intent: |
      Add the reconcile subcommand to board_lifecycle.py. It runs audit's detection and then fixes
      exactly the finding classes a write can fix, leaving the others to a human.

      THE STATUS CLASS T-15 ADDS IS FIXABLE, and it is a FOURTH fixable class beside the three
      below: a feature whose feature.json status disagrees with its parent card is repaired by
      moving the PARENT card to the column that recorded status means, resolved through the board's
      declared stations map. Never the other way round - the recorded status is the source and the
      card is the mirror, so this must never rewrite feature.json. Statuses Done and Abandoned are
      exempt for the reasons T-15 states, so this write applies to Plan, Ready, Building and Review
      only. Give it its own test case asserting the parent card moved and feature.json was not
      written.

      What it fixes:
      - STATION findings: move the card to the declared done station with gh_board.set_station.
        The right station for a card whose feature is long done is the done station, and the ticket
        stays closed - that is the definition of finished this feature adopts.
      - REASON findings: PATCH repos/<repo>/issues/<n> with state=closed and
        state_reason=completed. Only for issues with no abandoned label and no not_planned reason;
        a null reason on an issue carrying the abandoned label is set to not_planned instead.
      - LABEL findings: add the label with
        `gh issue edit <n> --repo <repo> --add-label abandoned`, creating the label first by
        shelling out DIRECTLY: `gh label create abandoned --repo <repo> --color b60205
        --description "created by harness gh-sync"`, swallowing the error the way gh-sync.py's own
        ensure_labels does, because "label already exists" is the common case.
        DO NOT import a helper for this and do NOT call factory_gh.ensure_labels. Two measured
        reasons. First, gh-sync.py is HYPHENATED, so it is not an importable module name and
        board_lifecycle.py cannot reach the ensure_labels T-08 edits at gh-sync.py:520-531 at all.
        Second, the only importable one, factory_gh.ensure_labels (factory_gh.py:186-195), passes
        --force with a single _LABEL_COLOR = "5319e7" (:30), so calling it would repaint abandoned
        harness-purple over T-08's b60205 on EVERY run - which is precisely the
        three-implementations collision D-04 records as accepted-and-not-fixed, arriving here as a
        live defect. The literal b60205 must match the value T-08 adds to gh-sync.py's colours map;
        T-08 is in this task's depends_on so that value is authored before you copy it.

      What it does NOT fix, and says so per finding: DECLARATION findings (the declaration is a
      file a human signs, and provision is the subcommand that changes a board) and WORKFLOW
      findings (no API can enable one).

      Flags: --dry-run prints every write it would perform and performs none, and it is the
      DEFAULT. A real write requires --apply explicitly. Reason: this tool can move hundreds of
      cards on the operator's live tracker and nothing undoes that; a default that writes is a
      default that surprises.

      After applying, re-run the audit detection in the same process and print EVERY residual
      finding and the total count.

      THE EXIT CODE COUNTS ONLY THE CLASSES RECONCILE CAN FIX. Exit 0 when no STATION, REASON or
      LABEL finding survives; exit 1 with the residual list otherwise. DECLARATION and WORKFLOW
      residuals are printed in full and are NOT counted toward the exit code. The reason is a
      design fault this ordering removes: reconcile admits no write can enable a workflow, so if
      WORKFLOW counted, reconcile could never exit 0 on a board with one disabled workflow, and
      T-11 and T-12 - which require exit 0 - would be permanently gated by the one class that is
      unfixable by definition. If GitHub ever renames a default workflow, every board would report
      three MISSING forever with no override. audit keeps BOTH classes in its own exit code, so
      SC-09's honesty and REQ-06's finite list are untouched; only the FIXER's success measure
      narrows to what fixing means. Print a one-line summary distinguishing the two totals, so a
      zero exit never reads as "the board is perfect": "0 fixable findings remain; N findings
      require a human (see above)". A reconcile that fixed nine of ten fixable findings must still
      exit 1.

      Tests against a fake gh with BOTH FACTORY_GH and GH_SYNC_GH set (D-11): --dry-run performs
