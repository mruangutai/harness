decisions:
  - id: D-01
    choice: The stale check re-hashes the full content of every fingerprinted regular file with sha256 on every governed call; a stat call only classifies each entry's kind and is never a shortcut around the content comparison.
    because: Measured at e12381fd a full re-hash costs 0.35 ms median against 14 ms for one gate process spawn, while a stat or mtime shortcut saves 0.3 ms and adds a false-negative path (an equal-size, equal-mtime rewrite) that is exactly the silent staleness this bug removes; rejected alternative is stat-first then hash.
    dec: none
  - id: D-02
    choice: 'On mismatch the stale refusal precedes every other check and covers every governed call (a persona''s tool calls, Main''s task dispatch and Main''s merge-gated Bash) with one exception: a persona''s yield whose data is an object with VERDICT exactly BLOCKED skips the stale check and continues through the unchanged held-run and yield validation path, as a held run''s BLOCKED yield does. Every other yield is refused, a persona''s refusal adds the sentence While this process is stale, you may yield only a BLOCKED digest that names this cause. and Main''s other calls are never checked. Skipping the stale check admits a BLOCKED yield to the normal yield validation; it does not guarantee that the yield is accepted, ends the run or releases its claim.'
    because: 'Each governed call runs through the loaded stale code and the operator ruled out warn-and-continue. At the 2026-11-27 signature questions (Q-04) the operator took the BLOCKED-yield carve-out, so an in-flight child can still submit a BLOCKED digest recording why instead of being stranded; that yield reaches validate-digest.py, a new process that is never stale, which judges it exactly as before, so whether it completes the run and releases the run''s claim stays subject to that normal validation (a lead with no authorized durable artifact, for example, is still refused). Leaving Main''s ordinary calls unchecked lets the operator always repair and restart. DEC-204 and DEC-100 stay true as written. Rejected alternatives: refusing every yield, which strands completed child work in transcripts, and letting any yield through, which would pass a success digest produced under stale enforcement.'
    dec: none
  - id: D-03
    choice: "The fingerprint is a map from absolute path to entry state (content hash, absent, not-a-file or unreadable) over exactly the hook modules the omp process loads from .omp/extensions, which on the post-BUG-2565 base is harness-hooks.ts alone, resolved from import.meta.url and captured once at module load. The digest schema directory (schemas/digest, formerly DIGEST_SCHEMA_DIR), digest-schema.ts and the .omp/agents definitions are not fingerprinted."
    because: 'Operator ruling at the 2026-11-27 signature questions (Q-02, Q-03), overriding the grilling''s settled set. After BUG-2565 the loaded hook reads no schema file and digest-schema.ts no longer exists, so fingerprinting them would refuse every governed call on a schema regeneration while guarding no loaded code. OMP rediscovers agent definitions on every task spawn (omp task-agent-discovery.md, verified by the main session), so each new spawn receives the current frontmatter digest contract (a child already running keeps the schema it started with, which is not loaded hook code), and validate-digest.py starts as a new process per call. Resolving from the loaded module rather than cwd means a session reacts only to the checkout whose code it is running, and per-path keys let the refusal name each changed module. Rejected alternatives: keeping the schema directory and digest-schema.ts (false refusals, no loaded code guarded) and adding .omp/agents (rediscovered on each new spawn).'
    dec: none

  - id: D-04
    choice: 'T-01 builds only on a base where BUG-2565-digest-frontmatter-contract has landed, checked by .omp/extensions/digest-schema.ts being absent and by a text grep of harness-hooks.ts for the known legacy import spelling, from "./digest-schema, counting 0. The grep is not import-aware: it would also count a commented-out line in that spelling and would miss another spelling, so the new code and comments never contain that phrase, and the file''s absence is the check that carries the 2565-first condition. If either check fails, T-01 stops BLOCKED; this plan makes no claim to build in the reverse order.'
    because: "The operator settled sequential builds with BUG-2565 first, and both features edit harness-hooks.ts. At e12381fd harness-hooks.ts imports digest-schema.ts at module load, so on a pre-2565 base the process would load a second module that D-03's fingerprint does not cover, and the tests would pin a module set BUG-2565 then deletes. Rejected alternative: an order-independent build that fingerprints digest-schema.ts while it exists, which the operator dropped (Q-03)."
    dec: none
