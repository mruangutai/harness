tasks:
  - id: T-01
    title: Fingerprint the loaded hook code at module load and refuse every governed call when disk differs
    traces: [SC-01, SC-02, SC-03, SC-04, SC-05, SC-06, SC-07, SC-08, SC-10]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 - changes the tool_call hook in harness-hooks.ts that enforces the build itself, with its test.
    depends_on: []
    status: ready
    files:
      - .omp/extensions/harness-hooks.ts#registerHarnessHooks
      - tests/unit/omp-hooks.test.ts
    verify: |
      set -eu
      test ! -e .omp/extensions/digest-schema.ts
      test "$(grep -c 'from "./digest-schema' .omp/extensions/harness-hooks.ts || true)" = 0
      bun install --frozen-lockfile
      bun test tests/unit/omp-hooks.test.ts
      bun run typecheck
      test "$(grep -c 'export function staleHookRefusal' .omp/extensions/harness-hooks.ts)" = 1
      test "$(grep -cE 'export (function|type|const) (hookFingerprint|staleHookReason|HookFingerprint|entryState)' .omp/extensions/harness-hooks.ts || true)" = 0
      test "$(grep -c 'BUG-2566' tests/unit/omp-hooks.test.ts)" -ge 4
    intent: |
      Work directly in PRODUCT checkout /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/BUG-2566-stale-hook-detection; every relative-path edit stays inside it. Main owns this task under DEC-174 and DEC-179, with no engineering-lead dispatch. Source issue 2566. Read this feature's BRIEF.md and notes/research-stale-hook-detection.md first. PRODUCT docs/spec.md, docs/decisions.md and docs/architecture.md are absent in this checkout; do not invent or substitute them; .harness/harness/docs/SPEC.md section 4.2 is the governing description of the hook.

      Precondition (D-04): BUG-2565-digest-frontmatter-contract has landed in this branch's base. Rebase on main, then check both: .omp/extensions/digest-schema.ts does not exist, and grep -c 'from "./digest-schema' .omp/extensions/harness-hooks.ts prints 0. The grep is a text check for the known legacy import spelling, not an import-aware one: it would also count a commented-out line in that spelling and would miss another spelling. So no new code or comment may contain the phrase from "./digest-schema (name digest-schema.ts without it), and the file's absence is the check that carries the 2565-first condition. If either fails, stop and report BLOCKED naming D-04; do not build against the pre-2565 hook and do not adapt this task to the reverse order.

      Write the tests first (the BUG-2566 cases below), run bun test tests/unit/omp-hooks.test.ts and confirm the new refusal and fingerprint cases fail against the unchanged hook, then implement. The (b) carve-out cases already reach validate-digest.py on the unchanged hook: record them as preserved, never as failing first. Record the command, the failing test names, the preserved test names and the exit status in .harness/harness/features/BUG-2566-stale-hook-detection/notes/fail-first-T-01.md.

      Implementation, all inside .omp/extensions/harness-hooks.ts (no new module: OMP loads every module in .omp/extensions as an extension, so a new file would be loaded code outside the fingerprinted set). Add the import createHash from node:crypto, add closeSync, constants, fstatSync, openSync and statSync to the existing node:fs import, and add relative to the existing node:path import. Next to BIN, declare the module-level constant MERGE_COMMAND_PREFILTER = /\bmerge\b/ (no g flag, so test keeps no state) and change the first line of mainMergeGate to test that constant instead of its inline literal; nothing else in mainMergeGate changes. Below gatePath, add one comment block naming BUG-2566 that says: OMP imports this module once per process, so a long-running session keeps enforcing the code it loaded; the fingerprint covers exactly the hook modules this process loaded from .omp/extensions, which after BUG-2565 is this module alone, and a module later added to .omp/extensions must be added to HOOK_FINGERPRINT_MODULES; the digest schema directory and the agent definitions are deliberately not fingerprinted, because this module reads neither after BUG-2565 and OMP rediscovers agent definitions on every task spawn (D-03); the fingerprint is taken at module load and compared by content on every governed call (D-01: stat only classifies an entry's kind, never shortcuts the comparison; a regular file is hashed through the one nonblocking descriptor whose fstat confirms it is a regular file, so a FIFO swapped in after the stat cannot block); an absent module is a recorded state. Then add the following; only item 6 is exported:
      1. A private type HookFingerprint, Readonly of Record of string and string.
      2. A private function entryState(path: string) returning a string. It first calls statSync(path), which follows links: any kind other than a regular file (directory, FIFO, socket, device) returns the string not-a-file and the path is never opened. For a regular file it opens the path once with openSync(path, constants.O_RDONLY | constants.O_NONBLOCK), calls fstatSync on that descriptor, and returns not-a-file without reading when the opened descriptor is not a regular file (a FIFO or other kind swapped in after the statSync); otherwise it returns the sha256 hex digest of readFileSync(fd), read from that same descriptor. The descriptor is closed with closeSync in a finally block. The kind check and the read use one descriptor, so a path replaced by a FIFO after statSync can never block the call. On a thrown error (from statSync, openSync, fstatSync or the read) whose code is ENOENT or ENOTDIR it returns the string absent; on any other error it returns unreadable: followed by the error code (or the message when there is no code). It never throws.
      3. A private function hookFingerprint(modules: readonly string[]) returning a HookFingerprint. It maps each module path to entryState(path), returns the object frozen and never throws.
      4. Module-level constants, in this order: HOOK_MODULE = fileURLToPath(import.meta.url); HOOK_FINGERPRINT_MODULES, a readonly array holding HOOK_MODULE alone; LOADED_HOOK_FINGERPRINT = hookFingerprint(HOOK_FINGERPRINT_MODULES); HOOK_LOADED_AT = new Date().toISOString(). Nothing here reads an environment variable, process.cwd(), ctx or tool input, and module load never throws.
      5. A private function staleHookReason(loaded: HookFingerprint, current: HookFingerprint, root: string, loadedAt: string) returning a string or undefined. Collect every key of loaded or current whose values differ, a key missing on one side counting as the value absent. Sort them and map each through relative(root, key). If none remain, return undefined; otherwise return exactly: Harness refuses this call: the Harness hook code this omp process loaded at LOADEDAT no longer matches PATHS on disk; restart omp to load the current hooks. where LOADEDAT is loadedAt and PATHS is the relative paths joined with a comma and a space. The string contains no newline.
      6. An exported function staleHookRefusal() returning a string or undefined: staleHookReason(LOADED_HOOK_FINGERPRINT, hookFingerprint(HOOK_FINGERPRINT_MODULES), gateRoot(), HOOK_LOADED_AT). It uses only node:fs and node:crypto and spawns nothing.
      7. A private function isBlockedYieldData(data: unknown) returning a boolean. When data is a string it is replaced by JSON.parse(data), and a parse error returns false. It returns true only when the value is a non-null object, not an array, whose VERDICT property is exactly the string BLOCKED.

      registerHarnessHooks gains a third optional parameter staleCheck, typed as a zero-argument function returning a string or undefined, defaulting to staleHookRefusal, after the existing pi and policyRunner parameters. The default export harnessHooks stays registerHarnessHooks(pi).

      In the tool_call handler: move the existing ompMainTask declaration (no persona, toolName task, agentId Main, no parentAgentId) up so it is computed right after sessionCwd is assigned, keeping its expression unchanged and removing it from its old place. Immediately after it, before the existing task-without-agentId check and before the held-run check, declare governedCall as Boolean(currentAgent) or ompMainTask or (toolName is bash and MERGE_COMMAND_PREFILTER tests true on text(input.command)), and blockedYield as Boolean(currentAgent) and toolName is yield and isBlockedYieldData(input.data). When governedCall is true and blockedYield is false, call staleCheck() once and, if it returns a string, return a block with block true and as reason: that string when currentAgent is empty (Main), or that string followed by one space and While this process is stale, you may yield only a BLOCKED digest that names this cause. when currentAgent is set. A BLOCKED yield skips the stale check and continues through the existing held-run and yield handling unchanged, so it still reaches validate-digest.py. Add a one-line comment citing BUG-2566 D-02: the stale refusal outranks every other check; only a persona's BLOCKED yield passes, as in a held run; Main's other calls are never checked. Change nothing else in the handler.

      Tests, in tests/unit/omp-hooks.test.ts; every new test name starts with BUG-2566. Add an optional staleCheck option, the same zero-argument function type, to the options of the fixture() helper inside describe OMP task lifecycle adapter, and pass it as the third argument of that helper's registerHarnessHooks(pi, runner) call (undefined keeps the default). Inside that describe, using the existing start helper and ompContext, with staleCheck returning the fixed reason stale-fixture-reason restart omp, and P meaning that reason followed by one space and While this process is stale, you may yield only a BLOCKED digest that names this cause. Persona sessions start through start. Main is always initialized through its unmarked fixture, never through start: ctx = ompContext("/repo", "Main", undefined, "main-session"), then await handlers.get("before_agent_start")?.({ systemPrompt: ["project"] }, ctx) before the call under test. The cases:
      (a) SC-02 refused: each of these is its own test asserting the result is a block with block true and the stated reason exactly, and that the tool_call recorded no policy invocation (compare calls.length before and after the call): a started persona session's read, write, edit, bash and task, reason P; a started persona session's yield of a well-formed object with VERDICT PASS, reason P; a started persona session's yield whose data is an array, reason P; a started persona session's yield whose data is the JSON text of a well-formed object with VERDICT PASS, reason P; a started persona session's yield whose data is the malformed text not json, reason P; a started persona session's data-less finalize, a yield whose input is {type: "result"} with no data property, reason P (the stale check refuses it before the existing data-less early return); a persona session whose run is held (make run-start refuse through the gate option) calling read, reason P, not the held reason; Main (initialized through its unmarked fixture) task, reason exactly the fixed reason; Main bash with command echo merge, reason exactly the fixed reason.
      (b) SC-02 carve-out: each of these four is its own test asserting that the result carries no reason containing stale-fixture-reason, and that the tool_call recorded exactly one new validate-digest.py call (filter calls by script, compare before and after), whose args equal ["--hook"] and whose payload's digest_object deep-equals the decoded BLOCKED object: a started persona session's yield whose data is an object with VERDICT BLOCKED; a started persona session's yield whose data is the JSON text of that object; a held persona session's yield whose data is that object; a held persona session's yield whose data is the JSON text of that object.
      (c) SC-03: Main, initialized through its unmarked fixture, calling read, edit, write, and bash git status each return undefined, each its own test.
      Add a new top-level describe named BUG-2566 stale hook fingerprint. Its helper staleTree() creates root = realpathSync(mkdtempSync(join(tmpdir(), "bug2566-"))); cpSync the repository's .omp/extensions into root/.omp/extensions recursively; cpSync the repository's .claude/skills/harness/schemas/digest into root/.agents/skills/harness/schemas/digest recursively, so the exclusion cases below change real schema files; set the copied hook module's atime and mtime with utimesSync to the fixed whole-second value M = 1800000000, so its load-time mtime is exactly M seconds; then dynamically import root/.omp/extensions/harness-hooks.ts and return root and the imported module. Each case uses a fresh staleTree. Let H be .omp/extensions/harness-hooks.ts and S be .agents/skills/harness/schemas/digest, both relative to root.
      (d) SC-01: right after import, staleHookRefusal() is undefined. Then each change alone, one test each, makes it return a string with no newline that contains restart omp and contains H: append a comment line to H; delete H; overwrite H with bytes of the same length that differ only in the last byte (it becomes a space, or a newline if it already was a space), then utimesSync H back to atime and mtime M, and assert statSync(H).size is unchanged and statSync(H).mtimeMs equals M times 1000 before calling staleHookRefusal(); replace H with a FIFO. The FIFO case never runs the detector in the test process: write a probe script to root/fifo-probe.ts that dynamically imports root/H, then rmSync H, creates the FIFO with spawnSync of mkfifo on H, calls staleHookRefusal() and prints its JSON.stringify to stdout. Run it with spawnSync(process.execPath, [the probe path], { encoding: "utf8", timeout: 5000, killSignal: "SIGKILL" }) and give that test a 15000 ms test timeout. Assert the child returned normally (its signal is null, its error is undefined and its status is 0) and that its parsed stdout is a string with no newline containing restart omp and H. A regression that opens the FIFO then fails at the deadline instead of hanging the suite.
      (e) SC-04: staleHookRefusal() stays undefined after each of these, one test each. Controlled mtime offsets apply only to the three hook timestamp cases, each relative to H's load-time mtime M: utimesSync alone on H to M plus 5 seconds with bytes unchanged; H rewritten with its identical bytes, then utimesSync on H to M plus 5 seconds; H changed (assert a reason is returned first), then restored to its original bytes and utimesSync on H to M plus 10 seconds. The remaining cases are plain writes with no utimesSync: the bytes of S/common.json changed; S/harness-pm.json removed; a new file .omp/extensions/digest-schema.ts, which this process never loaded and which has no load-time mtime, created with the content export {}; followed by a newline. With two staleTree roots A and B, appending to B's H leaves A's staleHookRefusal() undefined while B's returns a reason.
      (f) SC-05: on the repository's real module (the hooks namespace already imported at the top of the file), call hooks.staleHookRefusal() 20 times, then time 200 calls with performance.now(); assert every call returned undefined and the median duration is below 5 ms.
      Import rmSync, statSync and utimesSync from node:fs where not already imported (spawnSync is already imported from node:child_process).

      After the suite is green, prove SC-04 discriminates. Save a byte copy of the implemented .omp/extensions/harness-hooks.ts to a mktemp path outside the repository; change only entryState's regular-file branch to return String(fstatSync(fd).mtimeMs), read from the opened descriptor, instead of the digest; run bun test tests/unit/omp-hooks.test.ts -t 'BUG-2566 stale hook fingerprint'; confirm the touch, identical-bytes rewrite and restore cases (SC-04) and the same-size, fixed-mtime byte-change case (SC-01) fail under this mutant. Append the command, the failing test names and the exit status to notes/fail-first-T-01.md. Then copy the saved bytes back, confirm with cmp that the file equals the saved copy, and only then commit. Run the literal verify from the PRODUCT checkout root; expected: both precondition checks pass, every bun test passes, typecheck exits 0 and the three grep counts match.

  - id: T-02
    title: Document the stale hook refusal and its BLOCKED-yield exception in SPEC 4.2
    traces: [SC-09]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: DEC-174 - documents the hook change; the operator routed every task of this feature main-session-direct.
    depends_on: [T-01]
    status: ready
    files:
