    dec: none
  - id: D-08
    choice: "Both task verify blocks additionally assert the behaviour directly and name-independently — T-01 loads the module by path and asserts compute_union raises MergeRefusal with code 11 on a duplicated proposal id, T-02 drives the real CLI against a duplicate proposal in a temp directory and asserts exit 11 — rather than resting on the PASS check-name greps alone"
