    choice: "check-expertise.sh is not modified"
    because: "Its duplicate-id check already exists at lines 202-206 and cannot see this defect, because the drop happens before the file it inspects is written"
    dec: none
  - id: D-05
    choice: Correct the module docstring's exit-code table to list every code the apply subcommand can return, adding 9 and 11 only
    because: 'The docstring documents one subcommand, apply, and apply can return 0, 6, 7, 8, 9 and, after this fix, 11. Codes 10 and 12 are raised only on the ops path, so listing them would make SC-06 fail: SC-06 grades that no code is listed which apply cannot return. Documenting the ops path is unrequested work on a bug fix.'
