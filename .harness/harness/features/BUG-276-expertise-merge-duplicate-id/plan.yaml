tasks:
  - id: T-01
    title: Refuse a duplicated section plus id inside one apply entries proposal
    traces: [REQ-01, REQ-04]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: ready
    files:
      - tests/unit/test-expertise-ops.py
      - .claude/skills/harness/bin/expertise-merge.py
    verify: |
      # Green suite AND the three new u23 checks present and passing. Both suites already exit 0
      # at 6d969ed3 without these cases, so the greps carry the name-level discrimination — and the
      # final python3 asserts the BEHAVIOUR name-independently, because a PASS line is printed for
      # any truthy ok and so a correctly-named check can pass on a weaker assertion (D-08).
      out=$(env -u HARNESS_AGENT_TYPE python3 tests/unit/test-expertise-ops.py) &&
      printf '%s\n' "$out" | grep -q '^PASS  u23a: different texts refuse with code 11' &&
      printf '%s\n' "$out" | grep -q '^PASS  u23b: identical texts refuse with code 11' &&
      printf '%s\n' "$out" | grep -q '^PASS  u23c: no base refuses with code 11' &&
      python3 -c '
      import importlib.util, sys
      s = importlib.util.spec_from_file_location("m", ".claude/skills/harness/bin/expertise-merge.py")
      m = importlib.util.module_from_spec(s)
      s.loader.exec_module(m)
      try:
          m.compute_union({"Patterns": [("P-01", "one")]}, ["Patterns"],
                          {"Patterns": [("P-02", "ALPHA"), ("P-02", "BRAVO")]}, ["Patterns"])
      except m.harness_merge.MergeRefusal as e:
          assert e.code == 11, e.code
          assert e.lines[0].startswith("AMBIGUOUS TARGET"), e.lines
          assert "section=Patterns" in e.lines[0] and "id=P-02" in e.lines[0], e.lines
          sys.exit(0)
      sys.exit(1)
      '
    intent: |
      Close the silent-drop defect in expertise-merge.py's apply --entries merge, test first.

      MEASURED PRE-FIX BEHAVIOUR at 6d969ed3, by calling the function directly: with base
      {"Patterns": [("P-01","one")]} and proposal
      {"Patterns": [("P-02","ALPHA"),("P-02","BRAVO")]}, compute_union returns
      ({"Patterns": [("P-01","one"),("P-02","ALPHA")]}, ["Patterns"], []) — the FIRST entry wins,
      BRAVO is discarded, conflicts is empty, no exception is raised, and the CLI exits 0 printing
      ADDED P-02 once. That is the bug.

      STEP 1, THE FAILING TEST, BEFORE ANY PRODUCTION EDIT.
      In tests/unit/test-expertise-ops.py add case_u23() and register it in main() by adding a
      case_u23() call to the explicit list at lines 361-382, immediately after case_u22().
      Use the module-level bindings the file already has — compute_union at line 24, MergeRefusal
      at line 25, the base_sections helper at line 46, the check(name, ok, detail) helper at line
      42. Add no imports.
      Three sub-cases, each following case_u9's structure at lines 131-139: the call inside a try,
      a check(..., False, ...) on the no-exception path, the assertions in the except branch.

      THE CHECK NAMES ARE PART OF THE CONTRACT. main() prints each passing check as
      PASS, two spaces, then the name, and the task's verify command greps for three of them
      anchored at line start. Use these names EXACTLY, character for character:
        u23a: different texts refuse with code 11
        u23b: identical texts refuse with code 11
        u23c: no base refuses with code 11
      Each is the name of that sub-case's e.code == 11 assertion. Name the remaining assertions
      in the same per-sub-case style, prefix u23a / u23b / u23c, wording yours — for example
      "u23a: line starts AMBIGUOUS TARGET" and "u23a: line carries section, id and reason tokens".
      Name the no-exception-path check "u23a: MergeRefusal raised" and its siblings likewise. Do
      not rename any pre-existing check.

        (a) DIFFERENT texts. secs, order = base_sections([("Patterns", [("P-01","one")])]);
            prop_secs = {"Patterns": [("P-02","ALPHA"), ("P-02","BRAVO")]};
            prop_order = ["Patterns"]. compute_union(secs, order, prop_secs, prop_order) must
            raise MergeRefusal. Assert e.code == 11; e.lines[0].startswith("AMBIGUOUS TARGET");
            "section=Patterns" in e.lines[0]; "id=P-02" in e.lines[0]; "reason=" in e.lines[0].
        (b) IDENTICAL texts. As (a), but both proposal entries carry the text "ALPHA". The same
            assertions — code 11 and the same four line tokens.
        (c) NO BASE. The same proposal as (a) against base sections {} and base order [].
            The same assertions — code 11.
      Run the verify command and OBSERVE it exit non-zero with the u23 checks FAILING, for the
      reason recorded above. Do not proceed until they have been seen red.

      STEP 2, THE GUARD.
      In .claude/skills/harness/bin/expertise-merge.py, immediately above compute_union at line
      114, add a helper _check_proposal_duplicate_ids(prop_sections, prop_order): for each section
      name in prop_order, walk prop_sections.get(name, []) in order holding a set of the ids
      already seen; on the second occurrence of an id raise
      harness_merge.MergeRefusal(11, [f"AMBIGUOUS TARGET section={name} id={eid} reason=two
      entries in one proposal name this target"]) as ONE line, in exactly that token order.
      Compare no text at all. This mirrors _check_proposal_ambiguity at lines 305-317, whose
      message differs only in saying ops where this one says entries.
      Call the helper as the FIRST statement of compute_union's body, before the order list is
      built, so the refusal is a property of the proposal alone and fires ahead of every base
      comparison.
      Do NOT change compute_union's return arity or its existing conflicts behaviour: case_u10 at
      line 150 unpacks three values and pins the base-versus-proposal conflict path.
      Add one clause to compute_union's docstring stating the new refusal.

      STEP 3, THE DOCUMENTED INTERFACE.
      The module docstring's exit-code table at lines 14-19 lists only 0, 6, 7 and 8, and the
      docstring documents ONE subcommand: apply (line 12). apply can return 9, the destination
      refusal raised by require_expertise_destination, and — after STEP 2 — 11. Neither is listed.
      Add exactly TWO lines, in the table's existing style: 9 for the destination refusal raised by
      require_expertise_destination, and 11 AMBIGUOUS TARGET.
      Do NOT add 10 or 12. They are raised only on the ops path, apply cannot return them, and
      SC-06 grades exactly that: no code listed that apply cannot return. Adding them would make
      this task fail its own criterion.

      CONSTRAINTS. python3 stdlib only, no new imports.
      .agents/skills/harness/bin/expertise-merge.py is the SAME INODE as the .claude path — edit
      the .claude path only, and add no sync step of any kind.
      Then re-run the verify command: it exits 0, which requires both a green suite and all three
      u23 marker lines, and no other case in the file reddens.

  - id: T-02
    title: Pin the apply duplicate-id refusal at the CLI including the absent-destination path
    traces: [REQ-01, REQ-02, REQ-03]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: ready
    files:
      - tests/integration/test-expertise-merge.py
    verify: |
      # Green suite AND the three new case27 checks present and passing. The suite already exits 0
      # at 6d969ed3 without these cases, so the greps carry the name-level discrimination — and the
      # final python3 drives the real CLI in a temp tree and asserts exit 11 directly, because a
      # PASS line is printed for any truthy ok and so a correctly-named check can pass on a weaker
      # assertion (D-08).
      out=$(env -u HARNESS_AGENT_TYPE python3 tests/integration/test-expertise-merge.py) &&
      printf '%s\n' "$out" | grep -q '^PASS  case27a: duplicate ids exit 11' &&
      printf '%s\n' "$out" | grep -q '^PASS  case27b: identical duplicate ids exit 11' &&
      printf '%s\n' "$out" | grep -q '^PASS  case27c: absent destination exits 11' &&
      python3 -c '
      import os, subprocess, sys, tempfile
      cli = os.path.abspath(".claude/skills/harness/bin/expertise-merge.py")
      with tempfile.TemporaryDirectory() as d:
          dd = os.path.join(d, ".harness", "expertise")
          os.makedirs(dd)
          dest = os.path.join(dd, "harness-pm.md")
          open(dest, "w").write("# Expertise — harness-pm\n## Patterns\n- P-01: one\n")
          ent = os.path.join(d, "entries.md")
          open(ent, "w").write("## Patterns\n- P-02: ALPHA\n- P-02: BRAVO\n")
          r = subprocess.run([sys.executable, cli, "apply", "--file", dest, "--entries", ent],
                             capture_output=True, text=True)
          c = r.stdout + r.stderr
          assert r.returncode == 11, (r.returncode, c)
          assert "AMBIGUOUS TARGET" in c and "id=P-02" in c, c
      '
    intent: |
      Pin the duplicate-id refusal at the CLI boundary, which a unit test cannot reach: the exit
      code, the message tokens, byte identity of an existing destination, and the
      absent-destination path where cmd_apply's transform runs with base_bytes None.

      Add case_duplicate_proposal_ids(root) to tests/integration/test-expertise-merge.py and
      register it in _run_all_cases at lines 1310-1335, immediately after
      case_ops_target_grammar_well_formed(root). Use only helpers the file already has:
      target(root, stem) at line 88 for an Expertise-tier --file path, write_file at line 59,
      write_entries at line 75, run_apply at line 102, check at line 55, and hashlib.sha256 as
      case_atomic_failure, which begins at line 583, does at its two sha256 calls at lines 589
      and 601. Add no imports.

      THE CHECK NAMES ARE PART OF THE CONTRACT. _report_results prints each passing check as
      PASS, two spaces, then the name, and the task's verify command greps for three of them
      anchored at line start. Use these names EXACTLY, character for character:
        case27a: duplicate ids exit 11
        case27b: identical duplicate ids exit 11
        case27c: absent destination exits 11
      Each is the name of that sub-case's returncode == 11 assertion. Name the remaining
      assertions in the same per-sub-case style, prefix case27a / case27b / case27c, wording
      yours — for example "case27a: message carries AMBIGUOUS TARGET, section, id and reason" and
      "case27a: destination bytes unchanged". Do not rename any pre-existing check.

      Three sub-cases, all through apply --entries, each with its own fixture stem. In each, read
      combined = r.stdout + r.stderr: cmd_apply prints refusal lines to STDOUT at line 538, so
      assert nothing about which stream carries them.
        (a) stem case27a, DIFFERENT texts.
            write_file(target(root, "case27a"), [("Patterns", [("P-01", "one")])]); take the
            sha256 of the file before the invocation; write_entries with
            [("Patterns", [("P-02", "ALPHA"), ("P-02", "BRAVO")])]; r = run_apply(path, entries).
            Assert r.returncode == 11; "AMBIGUOUS TARGET" in combined; "section=Patterns" in
            combined; "id=P-02" in combined; "reason=" in combined; and the sha256 taken after
            the invocation equals the one taken before. This is the assertion set
            _assert_case24_ambiguous applies at lines 1190-1209 for the ops path.
        (b) stem case27b, IDENTICAL texts. Both proposal entries carry the text "ALPHA". The same
            five assertions plus the byte-identity check.
        (c) stem case27c, ABSENT destination. Compute path = target(root, "case27c") but write NO
            file there — case_new_file at line 256 is the exit-0 twin of this path. Propose the
            same duplicated entries as (a). Assert r.returncode == 11; "AMBIGUOUS TARGET" in
            combined; and os.path.exists(path) is False, so nothing was created.

      DO NOT add a regression sub-case for exit 0, exit 7 or exit 8: case_add_only_compatibility
      at line 614 already pins all three on this exact subcommand, and a copy would add no
      discrimination. This is deliberate reuse, not an omission: SC-04's evidence IS that
      pre-existing case at tests/integration/test-expertise-merge.py line 614, and the
      REQ-03 trace on this task promises no NEW regression case. DO NOT modify any existing
      case, helper or fixture.
      Run the verify command BEFORE writing the case and observe it exit non-zero, then re-run it
      after: it exits 0, which requires both a green suite and all three case27 marker lines.
