    choice: "The exit 11 row is NOT added to the agent-facing apply refusal table in .claude/skills/harness-distill/SKILL.md (the table headed Three refusals, and each wants a different response, at about lines 40 to 46, one row per code: 6 retry, 7 resolve it yourself, 8 curate, 9 fix the path); panel finding PF-8eac8a4b4f41d3ea8f759cdec6e73186 stays open and the operator is asked to settle it at signature"
    because: "THE COST, stated rather than hidden: after this fix apply can return the new exit 11, so a distilling agent that meets that refusal consults the table it routes on and finds no row for it, and the only mention of 11 in the same file is the ops subcommand code list at about lines 135 to 141, a different context that invites the wrong response. THE REASON for excluding it: bash .agents/skills/harness/bin/check-domain.sh --resolve .claude/skills/harness-distill/SKILL.md returns NOBODY, and check-plan-routes.py treats a NOBODY path under team execution as a violation, so the remedy cannot be a line a dev writes alongside the guard - it would have to be an execution_mode main-session-direct task, widening a deliberately narrow bug fix beyond lanes.rows. THE OPERATOR'S CHOICE at signature: keep the exclusion as recorded here, or direct that the row be added, in which case this plan needs exactly one new main-session-direct task adding the single exit 11 row to that table plus one amendment to this decision. Neither is pre-written here."
    dec: none
