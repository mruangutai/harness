    intent: |
      Write .claude/skills/harness/bin/test-orchestrator-playbook.py, a stdlib-only test with no
      subprocess, following the style of the other test files in that directory. It reads the
      playbook from the path in the PLAYBOOK_PATH environment variable, defaulting to
      .claude/skills/harness/SKILL.md, so the same assertions can be pointed at an older copy of
      the file. Exit non-zero on any failure and name the failing assertion.

      Assert, each as its own named case so one failure is locatable:
      1. the literal string "Receive the team digest" does not appear.
      2. the literal string "Loop until DONE" does not appear.
      3. the literal string "NEVER WAIT FOR A LEAD" appears.
      4. the literal string "context-watch.py" appears.
      5. the literal string "orchestrator_context_warn_tokens" appears.
      6. no single line contains orchestrator_context_warn_tokens together with any of refuse,
         refused, blocked or prevented, matched case-insensitively.
      7. the literal string "Record your phase in" does not appear.
      8. the literal string "Record your status in" appears.

      Every one of these eight fails against the file as it stands at 569d417, and the task is not
      done until that has been demonstrated: extract that copy with git show, point PLAYBOOK_PATH
      at it, run the test, and confirm it exits non-zero naming all eight. A green run against a
      copy of the old file means an assertion is not discriminating and must be fixed, not
      accepted.

      Then register the file in run-unit-tests.sh by adding its basename to the UNIT_SCRIPTS
      array. UNIT_SCRIPTS is correct rather than INTEGRATION_SCRIPTS because the test spawns no
      subprocess, and it is what the kind cross-check requires: a UNIT name must NOT appear in
      harness.json integration.detect, so harness.json is not edited. Registration is not
      optional - the drift detector in that script exits 2 for the entire suite on any unlisted
      test-*.py under bin.
