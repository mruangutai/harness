  - id: D-08
    choice: T-05 stays with the eng squad on the team lane (harness-dev-ops) and T-04 writes no DEC-174 amendment 5, because adding a basename to run-unit-tests.sh UNIT_SCRIPTS does not make that script a gate
    because: am.4's join-the-list rule fires on the DAY a script becomes a gate, and that day is not this one - run-unit-tests.sh was already a step of the required integration CI job before this feature (.github/workflows/tests.yml:81 and :87), T-05's edit to it is one basename added to an array so its gate status is identical before and after, and check-domain.sh --resolve returns harness-backend-dev and harness-dev-ops for it at 569d417. The contrary evidence was engaged - that workflow's own comment says the required context is integration and both suites are steps of it, so the script IS reached by a required check - but the category am.4 governs by is hooks, validators and gate scripts, and a runner that executes assertions refuses nothing itself. Reading it the other way makes every bin/test-*.py enforcement layer, which contradicts both the enumeration naming each gate's own test and the squad grant on .claude/skills/harness/bin/**. The circularity am.4 exists to refuse is absent too - this change only adds assertions, and the runner's drift detector exits 2 for the whole suite on any unlisted test-*.py, so a missing or broken registration is loud rather than invisible
    dec: DEC-174
  - id: D-09
    choice: "The three domain leads keep the same enforced wait and this feature does not touch it - accepted as a known cost of the scope boundary, tracked by #610 and #552"
    because: the wait is not merely described by harness-team, it is mechanically enforced - validate-digest.py --hook refuses a lead or orchestrator return made with a live child, printing inflight_registry.children_refusal_lines, which is why leads burn context holding turns open. That refusal fires at most once per return and the second identical return ships, so the cost is one turn rather than an unbounded wait. Removing it means editing validate-digest.py, which is enumerated enforcement layer under DEC-174 am.4 and needs its own signature
    dec: DEC-174
tasks:
  - id: T-01
    title: Recast the orchestrator loop as stop-and-wake
    traces: [REQ-01, REQ-02, REQ-03]
    change_type: ai_behavior
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for this path at 569d417
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/SKILL.md
    verify: |
      grep -q "NEVER WAIT FOR A LEAD" .claude/skills/harness/SKILL.md && grep -q "The single-flight refusal on your return is EXPECTED" .claude/skills/harness/SKILL.md && ! grep -qE "Receive the team digest|Loop until DONE" .claude/skills/harness/SKILL.md && echo T-01-PASS
    intent: |
      Rewrite the delegation loop in .claude/skills/harness/SKILL.md so that no step tells the
      orchestrator to stay alive. Use the file's existing conventions for emphasis and for
      code-formatting identifiers; change no other section. Four edits, in order:

      (1) Step 3, appended after the sentence ending "pin review_sha before any validator run
      (INV-6)." Add a paragraph whose first words are exactly "NEVER WAIT FOR A LEAD. END YOUR
      TURN." followed by: a dispatch reports back on its own, so you never poll for it, never
      sleep, and never invent activity to stay alive; with nothing to do until a lead returns,
      state what is in flight and end your turn; the platform resumes you when the child
      completes. One clause of why: a stalled orchestrator is killed by the 600s no-progress
      watchdog and takes its lead and its member with it, while a partial you returned is
      resumable. Point at the decision recorded by T-04. Do NOT copy the incident numbers from
      branch chore/744-never-wait-for-a-lead into this file - they live in DECISIONS.md
      (DEC-158). This paragraph is the absorbed content of that branch, which is then abandoned.

      Then, still inside this same paragraph, add a sentence beginning exactly "The single-flight
      refusal on your return is EXPECTED" and saying: when you end your turn with a child still in
      flight, validate-digest.py's issue #551 return contract refuses that return once - stderr
      "check-digest: BLOCKED - returned with children in flight" - and its own message states that
      the refusal fires ONCE and that a second identical return will ship. Read it as a prompt to
      correct any claim you made about a child you cannot see, and NEVER as "you may not return
      yet". Ending your turn is the rule; one refusal is not permission to start waiting again.
      That refusal is the exact reading this rewrite exists to remove, so say it here rather than
      leaving a future orchestrator to infer it.

      (2) Step 4, today titled "Receive the team digest". Retitle it "On waking, assess what came
      back" and rewrite the body: you resume because a dispatch completed, not because you chose
      to look; re-read STATE.md and feature.json from disk before acting, because your context
      may have reset; the SubagentStop hook has checked the digest's shape and roll-up at source,
      but shape is not truth; and a completion you were told about is a CLAIM until an artifact
      on disk confirms it - spot-check files_touched against the artifacts when a claim matters,
      and never act on a digest you cannot open. Name the reason in one clause: a parent has been
      measured fabricating a completion for its child, with an invented identifier that appeared
      nowhere but in its own messages, and writing a wrong verdict to disk before the real
      notification arrived. Cite DEC-199.

      (3) Step 6, today titled "Loop until DONE". Retitle it "Advance until DONE, one wake at a
      time" and add, before its existing first sentence, that each wake advances the plan by
      exactly one step - assess, record, dispatch the next thing, end your turn again - and that
      there is no waiting anywhere in this loop. Keep the rest of the step unchanged: done means
      the success criteria are met rather than the tasks exhausted, the goal-check delegation,
      the four bullets, the cycle budget outranking "until done", and the closing "Also stop
      for" sentence.

      (4) Renumber the steps if and only if T-02's insertion requires it; otherwise leave the
      numbering as it stands. Do not touch the Authority boundary paragraph, the routing table,
      or the cycle budget section.

  - id: T-02
    title: Add the wake-time context check, self-identification and handoff trigger
    traces: [REQ-04, REQ-05]
    change_type: ai_behavior
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for this path at 569d417
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/SKILL.md
    verify: |
      grep -q "context-watch.py" .claude/skills/harness/SKILL.md && grep -q "orchestrator_context_warn_tokens" .claude/skills/harness/SKILL.md && ! grep -qiE "orchestrator_context_warn_tokens.*(refuse|refused|blocked|prevented)" .claude/skills/harness/SKILL.md && grep -q "Exactly one match" .claude/skills/harness/SKILL.md && grep -q "SKIP the context check for this wake" .claude/skills/harness/SKILL.md && grep -q "Never guess an id" .claude/skills/harness/SKILL.md && grep -q "never treat a skipped check as a passed one" .claude/skills/harness/SKILL.md && echo T-02-PASS
    intent: |
      Add one new numbered step to the delegation loop in .claude/skills/harness/SKILL.md,
      immediately after the step T-01 retitled "On waking, assess what came back", and extend the
      "You are a PHASE, not the feature" section. Nothing else changes.

      The new loop step is titled "Weigh your own context before you continue" and says: before
      deciding the next dispatch, measure your own context; over
      budgets.orchestrator_context_warn_tokens in .harness/harness.json (200000 today) you decide
      whether to finish this phase or hand it to a fresh orchestrator. State plainly that the
      threshold ADVISES and never refuses, that nothing is blocked by it, and that the decision
      is yours (DEC-198). Do not write a bound, a refusal, or a stop anywhere near it.

      Give the mechanism as literal commands, in a fenced shell block, with the two-call
      structure stated as a requirement rather than a formatting choice:

        first Bash call, on its own:
          echo self-id ORCH-SELF-<pick any fixed literal string, once, and reuse it>

        second Bash call, later:
          grep -l '"agentType":"harness-orchestrator"' ~/.claude/projects/*/*/subagents/*.meta.json 2>/dev/null | sed 's/\.meta\.json$/.jsonl/' | xargs grep -l ORCH-SELF-<the same literal> 2>/dev/null

        then:
          python3 .claude/skills/harness/bin/context-watch.py <the id>

      State these four facts about it, because each one is a way to get it wrong:
      - the two calls must be separate. A single call that greps for a nonce it emitted in the
        same command finds nothing: the message carrying it is not in the sidecar yet.
      - the nonce must be a fixed literal you can retype, not one generated in the shell, and it
        must be unguessable enough that it appears nowhere else.
      - the match count decides what happens next, and all three outcomes must be written out.
        Use these words for them, because the task's verify greps for them:
          "Exactly one match" - your agent id is that filename with the agent- prefix and the
          .jsonl suffix removed. Proceed with that id.
          Zero matches - the nonce has not flushed yet, or the sidecar layout has changed.
          Two or more matches - the nonce was not unique. This is REPRODUCED, not hypothetical:
          a non-unique probe string matched THREE transcripts.
          For zero and for two-or-more the outcome is identical: "SKIP the context check for this
          wake", say so in one line, and continue the loop. "Never guess an id", and
          "never treat a skipped check as a passed one" - do not report a headroom figure at all
          when the check was skipped. Skipping is legal because the threshold only ADVISES
          (DEC-198); reporting a headroom figure read off the wrong transcript is not.
      - never narrow the glob by your cwd. The transcript directory is named for the SESSION's
        cwd, not yours, so a worktree cwd resolves to a directory that does not exist.
      Record that this was measured working end to end at 569d417 in about one second, and that
      context-watch.py is read-only and decides nothing.

      In the "You are a PHASE" section, extend the handoff paragraph: a handoff triggered by
      context uses the same notes/handoff-<phase>.md note, written at the next STEP boundary
      inside the phase - never mid-dispatch and never with a child in flight - and it supersedes
      any earlier note for that phase rather than being appended to. No new seam, no new
      artifact, no schema change (DEC-159). The successor's step zero is unchanged: validate the
      note's Next against the plan and STATE before acting on it.

