  - id: T-04
    title: Record the stop-and-wake rule and its measured reason as a decision
    traces: [REQ-07]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: [T-03]
    status: done
    files:
      - .harness/harness/docs/DECISIONS.md
      - .harness/harness/docs/DECISIONS-INDEX.md
    verify: |
      python3 .claude/skills/harness/bin/gen-decisions-index.py --stdout | diff - .harness/harness/docs/DECISIONS-INDEX.md && grep -q "^- DEC-201 " .harness/harness/docs/DECISIONS-INDEX.md && echo T-04-PASS
    intent: |
      Append one new entry, DEC-201, to .harness/harness/docs/DECISIONS.md, after DEC-199 and in
      the file's existing entry form. Then regenerate the index with
      python3 .claude/skills/harness/bin/gen-decisions-index.py and hand-write the summary to the
      right of the :: separator on the new row, which regeneration preserves.

      The decision: an orchestrator never waits. Every dispatch ends its turn, the platform wakes
      it with the child's completion, and on waking it re-reads state from disk, treats a reported
      completion as a claim until an artifact confirms it, and weighs its own context against
      budgets.orchestrator_context_warn_tokens to decide whether to continue the phase or hand it
      to a fresh orchestrator. The threshold advises and never refuses.

      The evidence, which is why the entry exists and why the playbook does not carry it
      (DEC-158): one orchestrator spent 354 of its 450 Bash calls on echo hold and sleep, went
      quiet, and was killed by the 600s no-progress watchdog, taking its lead and its member with
      it. Three probes on 2026-08-23, each with unguessable identifiers written to disk, measured
      that a parent subagent that has STOPPED is woken by its child at every depth the org uses -
      one stopped at 15:17:14, received the completion at 15:18:05 and resumed at 15:18:09
      quoting the child's identifier exactly. The published sub-agent documentation states the
      opposite; treat the measurement as the authority and say so. Both stalling parents in the
      probes invented a hold to stay alive, and one FABRICATED a completion for its child with an
      identifier that appears nowhere but in its own messages - which is why the woken
      orchestrator verifies against disk (DEC-199).

      Record the self-identification mechanism as part of the decision, including that the two
      Bash calls cannot be collapsed into one, and that it needed no new code: it was measured end
      to end at 569d417, resolving a live orchestrator to its own row in about one second.

      Record the open measurement honestly: whether a STOPPED parent survives past 600s while its
      child is still running has never been measured, and if it does not, this decision removes
      the invented stalling without removing the death. Name it as the thing to watch.

      State the lineage: DEC-148 and DEC-159 (one phase per orchestrator, the phase boundary is
      normal termination, the capped handoff note), DEC-118 (one phase spans several single-squad
      lead round-trips, which is why 600s is not survivable by waiting), DEC-120, DEC-198 (the
      threshold advises), DEC-199 (the false-reporting harm shape), DEC-158 (why the incident
      numbers live here and not in the playbook). Note that branch
      chore/744-never-wait-for-a-lead is absorbed and abandoned. Keep the entry to the length of
      its neighbours; nothing in it is repeated from the playbook.

