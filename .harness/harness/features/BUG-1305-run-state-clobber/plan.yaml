decisions:
  - id: D-01
    choice: 'Prevention rests on run_uid, a machine-minted identity the checkpoint itself carries, and TWO compares deny, separated by WHAT EACH CAN SEE. run_uid lives inside the checkpoint, so the minted-identity compare is readable only where the prior parses: it stays inside the existing prior-checkpoint ladder and refuses a PRESENT parsing prior carrying a run_uid against an incoming checkpoint carrying a different one or none, on the Write and Edit routes. The WITNESS is a separate file, so it is the only identity available when the prior is absent, zero-byte or unparseable: the seed-field compare runs BEFORE that ladder and is SKIPPED whenever the prior parses to a mapping carrying a non-empty run_uid, deferring to the ladder''s more specific message. There is no acquisition refusal and no refusal keyed on an empty or absent prior, on any route - an owner recovering a zeroed or absent checkpoint agrees with its own witness on every seed field and passes. The write-once per-run-directory marker is therefore a WITNESS WITH TWO CONSUMERS and NOT detection only, and the earlier detection-only phrasing was a defect in this entry: its seed fields are a PRE denial input, and its run_uid is the detection input T-03 reads. What is a denial input NOWHERE is the SESSION IDENTITY the witness records - not on PRE, not on POST, not directly and not through a per-runtime table; it is forensic evidence a human reads when recovering a clobbered directory. The complete set of denial inputs is: the witness seed fields conflict() compares (run_id, feature, squad, host), and the prior checkpoint run_uid against the incoming one.'
    because: 'a resumed owning run and a foreign run reusing the slug carry IDENTICAL seed fields and DIFFERENT session identities by construction, so a denial keyed on session disagreement refuses exactly the resumed-owner writes this feature exists to protect - _resolve_identity (harness_yaml.py:511-546) resolves a property of the SESSION, never of the RUN, and no fail-open row and no additional recorded field can separate the two cases at state.yaml write time. The discriminator that survives is a value minted per RUN and carried by that run own checkpoint: a resumed owner presents it because it reads it out of the file it is updating, and a foreign run cannot present it without deliberately copying it (D-11). The acquisition discriminator this replaces - CREATION versus CONTINUATION - was measured to refuse approximately only the owner recovering a lost checkpoint and approximately no foreign run (plan panel ranks 1 and 2), because an empty prior_state arises from a readable ZERO-BYTE file as well as from an absent one (check-domain.sh:1508-1518 at c369fb1f).'
    dec: none
  - id: D-02
    choice: "Post-hoc detection is hosted by check-state.sh and is fed by the same marker the write guard reads; the marker is one mechanism with two consumers, not two artifacts."
    because: "a clobbered checkpoint is definitionally silent about its own history, and building the witness twice guarantees the two copies disagree"
    dec: none
  - id: D-03
    choice: "REQ-05's remedy is extend-compatible: the pure-append repair route is already allowed today, so the work is a regression test pinning that allowance plus a refusal message that names the append route, and no replace-style remedy is planned."
    because: "DEC-208 ruling 3 signs that a recorded digest is extended and never replaced, and the diagnosis probe measured an append Edit at exit 0 on the pre-change tree"
    dec: DEC-208
  - id: D-04
    choice: "The operator authorises a separate DEC-205 in-place rewrite of DEC-208 ruling 3's false Write-only scope sentence to the measured Write/Edit truth. REQ-06 separately corrects check-domain.sh's own inline comment."
    because: "live check-domain.sh reconstructs Edit content for run digests and applies the preservation rule; leaving a measured-false present-tense decision would contradict DEC-205"
    dec: DEC-208
  - id: D-05
    choice: "This feature touches validate-digest.py's check_artifact_file root resolution and fail-closed behaviour only; issue 1303 owns the code_grade and review_sha binding in the same file."
    because: "the two flows edit one file in separate worktrees and may collide at merge, which the main session serialises; neither depends on nor blocks the other"
    dec: none
  - id: D-06
    choice: "The operator DECLINED run-directory slug unification at signature. T-07, REQ-08 and SC-08 are retired; both grammars remain live and run_uid refusal absorbs equal-slug collisions."
    because: "the change affects collision frequency rather than correctness, and the proposed supersession mechanics contradict DEC-205's in-place current-truth rule"
    dec: DEC-145
  - id: D-07
    choice: "No task in this plan reads, parses or asserts run-directory slug internals; every remedy keys on recorded run identity."
    because: "the two live grammars disagree, so a remedy coupled to either one is wrong in half the corpus and would need migrating when the doctrine task lands"
    dec: none
  - id: D-08
    choice: "Mode B is closed inside validate-digest.py's already-registered SubagentStop hook by fixing check_artifact_file's root resolution and failing closed on a resolvable run directory with no digest; check-state.sh is NOT wired to a hook."
    because: "that interpreter is already paid per spawn while check-state.sh's sweep grows with run history forever, and the /harness-entry instruction that would otherwise cover the gap is instruction-enforced with nobody having verified it executes"
    dec: none
  - id: D-09
    choice: "Each automated criterion's pre-change failure is demonstrated at build time against a pinned copy of the pre-change script and recorded verbatim in notes/redproof-BUG-1305.md; no pre-change script is committed as a test fixture."
    because: "a committed prior-script fixture rots against every later edit, and a test that fetches a historical blob is unreachable under a depth-1 CI checkout"
    dec: none
  - id: D-10
    choice: "Every task touching check-domain.sh, check-state.sh, validate-digest.py, run_identity.py or their tests is main-session-direct with a DEC-174 reason."
    because: "the harness plans changes to its own enforcement layer and does not execute them"
    dec: DEC-174

  - id: D-11
    choice: "Mode A prevention keys on run_uid, a machine-minted collision-resistant identity carried as a new top-level key on the run checkpoint beside the human-legible run_id, and the refusal is the existing Issue 1124 identity compare re-keyed onto it - a PRESENT prior carrying a run_uid, against an incoming checkpoint carrying a different one or none, is refused on the Write and Edit routes. run_id keeps its meaning, its author and every display use it has today. No refusal is keyed on an empty or absent prior, and a prior carrying no run_uid is legacy that nothing new refuses."
    because: "the acquisition refusal this replaces was measured to refuse approximately only the legitimate owner recovering a lost checkpoint and approximately no foreign run - the plan panel union finding at ranks 1 and 2 - because a foreign run reusing a slug always presents a PRESENT prior with equal seed fields. The Advisor consult recorded this mechanism as fallback Q2c and declined it only on the condition that a second identity signal could deny instead, and cycle 2 F-01 destroyed that condition by measuring that a resolved session identity cannot separate a resumed owner from a foreign run. A minted identity is the weakest thing that CAN separate them, because a foreign run has no way to hold the value except by copying it deliberately."
    dec: none
  - id: D-12
    choice: "run_uid is minted by check-domain.sh in its existing PostToolUse mode, which already reads what landed - the hook mints the value, appends one run_uid line to the landed state.yaml by text, and records the same value in the write-once witness beside it. The PRE routes never mint. Both key vocabularies that reject unknown top-level keys, ALLOWED in check-domain.sh and CHECKPOINT_KEYS in check-state.sh, gain run_uid in the same task that introduces the field."
    because: "minting has to happen where a shell observes every governed write, and POST is the only such place - a PreToolUse hook cannot alter a payload, the leads that author state.yaml hold no shell, and no program in the tree writes a run state.yaml. The cost is that the POST reporter becomes a writer of one line into the file it just read, which is why it appends a single top-level key by text rather than round-tripping the YAML, and never touches a file it could not parse."
    dec: none
  - id: D-13
    choice: The detection invariant judges a run directory only where a WITNESS sits beside the checkpoint, and from there it reports three paths - an unreadable witness, a witness/checkpoint disagreement on a seed field, and a witness/checkpoint disagreement on run_uid. A directory carrying no witness is invisible to it, a checkpoint carrying no run_uid over a witness that carries one is not reported either, and no backfill of the historical corpus is planned or run.
    because: "a one-shot seeder cannot keep up with a corpus that grew from 575 to 630 in one day across the control-plane root and every sibling worktree, so a witness-absent invariant would put a red state gate over dozens of legitimate historical directories at every /harness entry on the day this ships. Making the invariant self-limiting removes the migration and the false positives together, at the price of never judging a legacy directory - and a legacy directory is exactly the coverage that exists today, not a regression. The unreported checkpoint-without-run_uid case is conceded for the same reason: a legitimate write in a session where the hooks are not registered reaches that state, and INV-9 already asserts hook registration."
    dec: none

