      verb, so a retired task is re-specified rather than deleted, and this body is the record of why.

      What it was for: it seeded a write-once marker into every run directory that predates the mechanism,
      then enabled a check-state.sh invariant reporting any checkpoint that still had none - the
      "detection is total" half of REQ-02 as originally written.

      Why it earns no place now. The corpus it backfills is machine-local, untracked and CONTINUOUSLY
