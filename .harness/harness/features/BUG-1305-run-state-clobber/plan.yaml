tasks:
  - id: T-01
    title: Add run_identity.py - mint the run identity, record the write-once witness, compare identities
    traces: [REQ-01, REQ-02]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out - a module imported by check-domain.sh and check-state.sh is enforcement-layer code the harness plans but does not execute"
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/run_identity.py
      - tests/unit/test-run-identity.py
    verify: |
      python3 tests/unit/test-run-identity.py
    intent: |
      Create .claude/skills/harness/bin/run_identity.py, a stdlib-only module that imports no gate
      script and no YAML parser, plus tests/unit/test-run-identity.py.

      Public surface, exactly these nine names:

      MARKER_NAME = ".run-identity.json"
      class MarkerUnreadable(Exception)

      marker_path(run_dir) -> str
        os.path.join(run_dir, MARKER_NAME).

      read_marker(run_dir) -> dict or None
        Return None when the marker file does not exist. Parse it with json.load and return the
        mapping. Raise MarkerUnreadable when the file exists but does not parse, is not a JSON
        object, or cannot be opened. A caller must be able to fail closed on that exception and
        must never be able to mistake an unreadable marker for an absent one.

      mint_uid() -> str
        Return uuid.uuid4().hex - 32 lowercase hex characters, 122 random bits from the platform
        CSPRNG. NOTHING ELSE GOES INTO IT: no timestamp, no hostname, no pid, no directory name.
        Every derivable component is a way for a run that did not mint the value to reconstruct it,
        and this value is the whole of the collision resistance D-11 rests on. uuid4 is the stdlib
        answer and this module takes it unmodified.

      inject_uid(state_path, uid) -> bool
        BEST EFFORT, NEVER RAISES. If the file already carries a line matching ^run_uid: at column
        0, write nothing and return False. Otherwise append one line, exactly "run_uid: <uid>",
        preceded by a newline if the file does not already end in one, and return True. Write to a
        temp file in the same directory and os.replace() it, so an interrupted injection never
        leaves a half-written checkpoint. Return False, never raise, on any OSError or UnicodeError.
        A TEXT APPEND, NOT A YAML ROUND TRIP, and this is not a shortcut: re-emitting a parsed
        checkpoint reorders keys, drops comments and reformats values in a file its author owns and
        will read back. A hook that runs immediately after someone writes a file is the last place
        that should reformat it. Say that in a comment.

      record_seed(run_dir, doc, identity, run_uid) -> bool
        WRITE ONCE. If marker_path(run_dir) already exists, write nothing and return False.
        Otherwise write a JSON object with exactly the keys run_id, feature, squad, host, identity,
        run_uid, created_at: the first four are str(doc.get(k)) when the key is present and None
        when it is not; identity is the caller resolved identity string or None; run_uid is the
        caller effective uid or None; created_at is a UTC ISO-8601 timestamp. Write to a temp file
        in the same directory and os.replace() it onto the marker path. Return True.
        Return False, never raise, when run_dir does not exist or the write fails for any reason:
        recording is best effort and a hook must not break a legitimate write because the witness
        could not be stored.

      conflict(marker, doc) -> str or None
        Return None when marker is None. Otherwise return a one-line reason string when the marker
        and the incoming checkpoint cannot be the same run. EVERY ROW CARRIES THE SAME
        RECORDED-NON-NONE GUARD, run_id INCLUDED:
          - run_id recorded non-None in the marker and str(marker["run_id"]) != str(doc.get("run_id")):
            the reason names both values;
          - any of feature, squad, host recorded non-None in the marker and disagreeing with
            str(doc.get(field)): the reason names the field and both values.
        Check run_id first and return on the first disagreement, so the message is one sentence.
        THE run_id GUARD IS LOAD-BEARING, NOT SYMMETRY FOR ITS OWN SAKE. record_seed writes None for
        a key the first landed checkpoint did not carry, and nothing requires run_id on a first
        write, so a witness can be BORN with run_id None. record_seed is WRITE-ONCE, so that witness
        can never be corrected; an unguarded compare would then read str(None) != "A" for the
        directory's OWN owner and refuse every later write of that run on both routes, with no
        repair route through the guards. A witness born with a null field must never brand a run
        directory unwritable, and write-once is exactly why the guard belongs here rather than in a
        repair path. Say that in a comment on this function.
        IT DOES NOT LOOK AT run_uid. The two predicates are separate on purpose: this one compares
        the incoming write against the WITNESS of the directory first write, uid_conflict compares
        it against the PRIOR CHECKPOINT, and merging them would make one message answer two
        questions.

      uid_conflict(prior_doc, doc) -> str or None
        The minted-identity compare. BOTH ARGUMENTS ARE PARSED CHECKPOINTS, never markers.
          - Return None when prior_doc is not a mapping, or carries no run_uid, or carries one that
            is None or an empty string: that directory is LEGACY and nothing new refuses it. This
            row is what keeps the historical corpus quiet without a migration (D-13);
          - Return None when both carry run_uid and str() of the two are equal - the resumed owner;
          - When doc carries a different run_uid: return a reason naming BOTH values and saying the
            incoming checkpoint belongs to a different run than the one whose record is there;
          - When doc carries no run_uid at all: return a reason naming the prior value, saying this
            write cannot be shown to be an update of that run, that a run that owns the record
            carries the run_uid line forward verbatim from the checkpoint it is updating, and that
            the same value is recorded in the witness beside it. THIS IS THE MODAL BRANCH, not an
            edge: a foreign run that has never written a checkpoint has no run_uid of its own to
            carry, so an accidental slug collision arrives here and not at the different-value row.
        It reads nothing else: no marker, no session, no directory name, no filesystem.

      IDENTITY IS NOT A DENIAL INPUT ANYWHERE, AND THE RECORDED FIELD STAYS. record_seed keeps
      writing the resolved session identity as one of its seven keys; that is the whole of the
      session-identity signal this feature ships. Neither conflict() nor uid_conflict() may consult
      it, and no gate in this feature consults it either: D-01 records that a resumed owning run
