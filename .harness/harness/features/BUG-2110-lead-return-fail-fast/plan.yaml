    verify: |
      python3 tests/unit/test-lead-start-preflight.py && python3 tests/integration/test-lead-start-return.py
    intent: |
      Work only in /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/BUG-2110-lead-return-fail-fast, after T-01 red evidence. In dispatch-guard.py place lead prerequisites after feature/repository checkout resolution and before live_claim or claim_with_receipt can mutate the registry. Import digest_destination.LEAD_SQUADS and call registered_destination(root, declared, dispatched) for each lead; reuse this function's exact feature identity, sole open registered run, run-id safety and writable-grant checks. Do not duplicate the runs predicate, mint runtime ids, fabricate a digest binding, weaken return authorization, or claim that a preflight can validate runtime identities not yet created. A registered_destination AuthorizationError must exit 2 with its original failure, declared feature and dispatched lead. Missing matching run guidance names feature-record.py run-start with the actual record, agent and squad; ambiguous-run guidance explains legitimate reconciliation to one matching open run. Resolve/read failures must not silently allow a recognized lead whose prerequisite cannot be established. Keep unrelated non-lead dispatch behavior unchanged.
      Read HARNESS-MISSION lines from the individual prompt/task string already seen by this guard, not batch context. For product-lead and validator-lead targets require exactly one nonempty lowercase mission declaration; refuse missing or conflicting declarations with actionable guidance to supply the actual phase, never guessed prose or a review relabel. Require an explicit plan declaration on the plan scope-reader route. Do not refuse an engineering-lead start for missing mission; its registered_destination preflight remains mandatory regardless of mission. Preserve existing mission forwarding and distill behavior unchanged. Product patch dispatches declare patch explicitly and must not inherit plan. Do not impose mission requirements on unrelated code-reviewer dispatches. Preserve the existing hook marker spelling; do not add a TypeScript field. A plan mission for product-lead or validator-lead identifies the canonical plan.yaml beside the exact registered feature.json resolved by digest_destination, inside the assigned checkout, not the owner corpus or a similarly named feature. Derive this feature directory from the returned registered digest destination rather than doing a second feature-record search. A product plan-team start with no plan file may draft it; an existing file with missing approval or any status other than pending refuses. A validator standalone panel requires an existing pending plan. For code-reviewer dispatch with explicit HARNESS-MISSION: plan require the canonical existing pending target too, so a status change after lead startup stops the reader before work; readers do not need a lead run of their own. Other mission values do not infer a plan panel merely because a plan path occurs in prose or the plan is signed.
      Reuse validate-digest.py's existing _pending_plan_status_error for the canonical target, loading the script once only when a plan preflight is needed through harness_boundary.load_repo_module with the trusted HARNESS_GUARD_BIN_DIR script path and register=True. The script's __main__ guard makes import read-only; do not invoke its CLI or duplicate its YAML approval predicate. Keep _is_plan_review and _resolve_plan_review_path unchanged because dispatch already knows its canonical assigned target and has no reviewed field. Translate a returned error into exit 2 plus startup context explaining panels precede signature and callers must return to the legitimate pending-plan phase. Import/read failures must name the unavailable prerequisite, not claim pending status or pass through. No approval toggle, automatic revoke, status rewrite or review relabel is a remedy.
      Leave validate-digest.py and digest_destination.py unchanged. Their runtime identity, missing-binding, wrong-destination, plan-feature target equality, no pinned review_sha, checkout branch/code-grade and pending-only checks remain authoritative at every yield, including changes after a valid preflight. Do not loosen sign-approval findings gates. Do not change .omp/extensions/harness-hooks.ts: refusing in Python before spawn prevents the two known startup conditions from reaching its silently unbound lead path; bind and authorized_destination continue enforcing runtime child/parent/feature/checkout identity. Do not promise race freedom if the registered run or approval changes after preflight. Run each focused test command within 60 seconds and require exit 0. Main performs the existing full unit/integration suites once after all tasks land.
