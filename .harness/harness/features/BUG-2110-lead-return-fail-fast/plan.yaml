      For SC-02 integration cases invoke dispatch-guard.py with HARNESS-MISSION: plan for product and standalone validator leads. Existing approved plans and existing plans with absent approval/status must refuse before assessment, reader dispatch or a claim receipt, naming the exact canonical target and observed status. Assert pending-plan success; product-lead initial drafting with no plan file succeeds; validator standalone plan-panel with no plan file refuses. Include normal validator validate/fix and product patch dispatches against an approved plan as positive controls. Product patch must declare patch explicitly rather than inherit plan. Test missing/conflicting mission refusal for product-lead and validator-lead and missing plan mission on the plan scope-reader route. A registered engineering-lead build or standalone SIMPLIFY start without HARNESS-MISSION must succeed against an approved plan; prove its zero/two-run cases still refuse independently of mission. Preserve existing mission forwarding and distill behavior with regression controls; do not introduce an engineering mission prerequisite. Unit SC-03 cases assert the plan diagnostic says panels run before signature and directs callers to the pending-plan phase; it must not recommend toggling approval or relabelling the review. Cover plan scope-reader dispatch after approval changes while the plan-team lead is already running.
      For SC-04 integration cases drive dispatch, runtime claim registration, digest_destination.bind and validate-digest.py --hook in sequence for each lead using a regular human-assessment digest file and schema-complete valid objects. Assert successful authorized append to exactly the registered destination, and a pending-plan scope review accepted normally. Assert missing trusted binding still refuses without append and a plan accepted at startup then changed to approved is refused at reader return. Retain existing wrong-child, wrong-parent, wrong-feature, wrong-checkout and wrong-artifact authorization assertions. Prove missing-binding and pending-only return refusals discriminate with separate temporary gate-loosening mutants, each mutant making its own retained refusal assertions fail. Never alter the real gates during this task.
      Do not add --prove-baseline or any historical provisioning mode to committed tests. Before T-02, create the disposable external procedure /tmp/BUG-2110-fail-first-evidence.py and run it once with --baseline 63cac11a. It must provision historical production bin subjects and required sibling imports from that exact pin in private temporary trees, and execute the current test assertions and current fixtures against those subjects using disposable copies, adapting only their subject paths outside the committed tree. Preserve a durable QA receipt in this feature notes directory with the baseline pin, subject and per-SC/per-case exit, diagnostic and assertion output. The procedure must exit 0 only when each named new startup refusal/diagnostic case fails for the intended missing behavior, each new SC-04 startup-to-return witness demonstrates the old startup gap, and unchanged return controls and positive fixture controls execute successfully. Import failure, unavailable historical bytes, fixture failure or an earlier unrelated guard invalidates the receipt and must exit nonzero. Independently exercise the retained missing-binding and pending-only refusal assertions against separate temporary gate-loosening mutants, recording which assertions each mutant makes fail. Complete each focused suite invocation within 60 seconds. Remove the disposable procedure and private subject trees after QA consumes the receipt; never commit them or require historical git objects in normal tests or CI. Normal no-argument mode runs current runtime behavior with no historical dependency and exits nonzero on any failed assertion. Add --check-producers to the integration test to additionally inspect every T-03 producer file individually across the dispatch-contract authority chain. Assert that the existing zero-micro-management header section is the sole authority for mission applicability, harness-team points to it, and the orchestrator persona and harness lead headers reference or comply