    intent: |
      Before production edits, run all eight named suites from the pinned baseline and retain each command, exit status, stdout digest, and stderr digest in the implementation digest. Add a failing behavioral case that removes feature_schema for INV-23 and requires a CANNOT RUN line instead of the hard-coded 300-cycle fallback. Add only boundary cases whose consumer-visible behavior is not already defended; do not pin implementation plumbing or exception syntax.

      Replace every remaining except Exception in check-state.py with the real boundary class. Use ImportError for _resolve_root and the module-level handoff_done_when import, and keep the latter's existing context-load finding that INV-17 prints. Use OSError for read(). Catch gh_board.BoardError at INV-26 board_stations_for. Catch harness_boundary.RepoModuleError at each repo-module load used by the invariant import helpers, Ctx.validate_digest, INV-40's plan-merge load, and check-skill-weight; keep their CANNOT RUN behavior and render the stored cause when necessary for receipt identity. Catch ArtifactAccessError, FeatureJsonError, FleetError, and YamlParseError at their owning accessors, and each sibling boundary's own exported error class, including BoardError and the worktree-terminal and check-skill-weight errors. Verify every loud reporter individually against the exception its called boundary documents; do not replace a broad catch with an ungrounded tuple.

      Make the feature_schema ImportError in INV-23 append CANNOT RUN and stop that row from grading against 300. Preserve every other finding, warning, order, severity, exit status, and stream. Move each existing silence rationale byte-for-byte with the handler it explains; do not consolidate or reword those comments. Compare all eight post-change receipts with the retained baseline. Record only the ruled INV-23 difference in the implementation digest, with red-first evidence and exact old/new bytes if its fixture triggers; any visible skip, disappeared row, or other difference fails the task. The final source must contain zero except Exception and zero bare except clauses.
