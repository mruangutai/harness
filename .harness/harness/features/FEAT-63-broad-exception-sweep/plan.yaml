      Extend the existing consolidation audit red-first. Add load_feature_json and load_harness_json to _SHARED_SOURCE_LOADERS beside load_plan, then mutate an isolated checker copy to call each loader inside an invariant and prove a named shared-source-reparse finding.

      Implement exactly one AST census and one broad-catch finding path for every bin Python script. The census counts handlers typed exactly Exception and bare except. Its check-state.py entry has a zero ceiling; it is not a second checker-specific detector or rule. Prove each syntax with its own isolated check-state mutant, assert each mutant produces exactly one broad-catch finding naming check-state.py, and keep the unchanged checker green. Do not duplicate the AST traversal, finding, mutant family, or maintenance surface for the checker zero invariant.

      Encode this literal nonzero 950b2f04 file-to-count map for the unchanged legacy scripts: bash-write-guard.py 6; board-station.py 1; branch-create-gate.py 4; check-domain.py 24; check-omp-port.py 4; check-plan-routes.py 2; check-skill-weight.py 1; dispatch-guard.py 9; factory_decompose.py 1; feature-record.py 1; feature_schema.py 1; gh-close-gate.py 3; gh-sync.py 3; gh_cost_log.py 2; handoff_done_when.py 2; handoff_policy.py 1; harness_yaml.py 3; inflight_registry.py 3; inject-expertise.py 2; merge-gate.py 5; plan-sign-gate.py 2; post-merge-sweep.py 5; run-unit-tests.py 2; run_identity.py 1; upgrade-config.py 1; validate-digest.py 18; worktree_terminal.py 7. Derive harness_boundary.py's count from the post-T-01 tree when T-03 lands and record that observed count as its per-file ceiling; do not force it to four and do not rebase any unchanged file. Every other existing or new bin Python script has an implicit zero ceiling. Do not assert a fixed aggregate total for the allowlist.

      Compare each current file to its own ceiling through that same census: fewer catches pass, more catches produce one finding naming that file and both counts, and allowance cannot transfer between files. Add a red-first mutant that inserts one except Exception into an unchanged frozen script and assert the single finding names that same script; add a reduction mutant and assert it remains clean. Derive counts from the AST, never source text or comments. Do not narrow the legacy sites in this wave or scan hooks under this policy.

      Keep the audit within the existing public --consolidation-audit surface and existing checker-structure rule family. The final gate is exactly test-check-state-table.py followed by test-check-plan-routes.py --consolidation-audit. Do not edit workflows, hooks, command entry, grader rules, review skills, or any file in the frozen legacy set merely to satisfy the audit.
