decisions:
  - id: D-01
    choice: Consolidate checker environment work behind Ctx.spawn and cached Ctx state while leaving each call's argv, cwd, text mode, capture mode, and timeout at its existing call site; consume the already parsed feature, harness, and plan documents from Ctx instead of reparsing them in invariant bodies.
    because: One exception boundary can preserve the deliberately quiet environmental contract without obscuring command-specific policy, and the runner context already owns parse reporting and source identity.
    status: accepted
  - id: D-02
    choice: Make harness_boundary.load_repo_module wrap every Exception raised during specification creation, loader validation, or registered or unregistered module execution in RepoModuleError carrying module name, path, the original exception, and an exception chain; let KeyboardInterrupt, SystemExit, and every other BaseException-only process-control exception propagate unchanged, preserve sys.modules registration restoration after registered execution fails, and render the original exception type and message where existing CANNOT RUN receipts require those bytes.
    because: Checker callers need one catchable repository-load boundary for ordinary load failures, while process-control exceptions must remain able to stop the checker; preserving the original cause, established rendering, and registration cleanup keeps diagnosis, interruption, and unrelated output stable.
    status: accepted
  - id: D-03
    choice: 'Use one AST census of handlers typed exactly Exception or bare across bin Python scripts: require check-state.py to remain at zero, freeze harness_boundary.py at its observed post-T-01 count when T-03 lands, and freeze every other non-check-state script at its authoritative per-file 950b2f04 count. An increase above a file''s own ceiling is one finding, a decrease is accepted, allowance never transfers between files, and files absent from the recorded nonzero allowlist have a zero ceiling.'
    because: A single per-file census prevents any legacy script from gaining a broad catch without making later wave-4 reductions fail, counting comment mentions, or letting one script spend another script's removed allowance; sizing the changed boundary after T-01 avoids constraining its correct exception shape to a stale baseline.
    status: accepted
  - id: D-04
    choice: Preserve exit status, stdout bytes, and stderr bytes for each of the eight existing checker suites against 950b2f04, with only a red-first ledger entry for INV-23 reporting CANNOT RUN when a fixture removes feature_schema; a newly visible skip or missing row is never an accepted divergence.
    because: Narrowing exception boundaries is intended to expose programming defects, not change established checker results, and the operator explicitly ruled the feature-schema fallback unsafe.
    status: accepted
