    title: Consolidate checker context and the repo-module boundary
    traces: [SC-02, SC-03, SC-05]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 assigns the checker, shared Python boundary, and their unit proof directly to the main session.
    depends_on: []
    status: plan
    files:
      - .claude/skills/harness/bin/check-state.py#Ctx
      - .claude/skills/harness/bin/harness_boundary.py#load_repo_module
      - tests/unit/test-harness-boundary.py#case_load_repo_module_failures
    verify: python3 tests/unit/test-harness-boundary.py
    intent: |
      Work red-first at the shared boundary. Replace the current unit expectations for natural loader exceptions with failing cases for a public RepoModuleError. Exercise specification creation, an absent loader, registered module execution, and unregistered module execution, and require every raised Exception to become RepoModuleError with module_name, path, and the original exception as structured data and as the chained cause. Add cases proving KeyboardInterrupt, SystemExit, and any other exercised BaseException-only process-control signal propagate unchanged rather than becoming RepoModuleError. Restore or remove sys.modules registration exactly as today after every failed registered execution, including a process-control exception, and preserve successful registered and unregistered loading. The string available to checker reporters must include the original exception type and text so callers can retain established CANNOT RUN detail rather than printing a generic wrapper. Choose the handler structure that satisfies the full boundary and cleanup contract; do not constrain the wrapper to the current registered-execution BaseException handler.

      In Ctx, add one spawn boundary that accepts argv plus the existing call-specific subprocess options and returns CompletedProcess or None only on OSError or subprocess.SubprocessError. Route all twelve checker subprocess launches through it, move the existing DEC-138 environmental-precondition rationale byte-for-byte to that one boundary, leave the 10-, 15-, and 60-second timeouts at their current callers, and preserve each call's text or bytes mode, cwd, capture options, return-code handling, and silent-None behavior. Cache gh auth status in one ctx.gh_ok result shared by INV-26 and INV-30, and replace the runner's second git rev-parse with ctx.git_top.

      Delete the eleven invariant-body feature.json and harness.json reparses. Read feature records through ctx.record(feat) and harness configuration through ctx.config; when either parsed document is None, skip because its context loader has already emitted the one parse finding. Make station_of consume the context's parsed plan while preserving the empty-string result for every unknowable case. Do not add parse findings, convert an environmental None into a red result, or change output bytes. Keep _resolve_root's clean-interpreter probe behavior, read()'s absent-or-unreadable contract, and all command-specific policy outside spawn.
