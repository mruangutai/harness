decisions:
  - id: D-01
    choice: >-
      Rulings 1 and 3 land as ONE change, split across T-02, T-04 and T-05 only because the routing
      differs. Ruling 1's consolidation lands in T-02 and T-04 as a single shared validator that
      raises; T-05 carries the same cutover into check-state.sh, which is a DEC-174 carve-out and
      therefore cannot be dispatched. There is no task in which the board consolidates while a
      silent None survives, and no later or optional task removes it.
    because: >-
      Issue 350's own words are that any consolidation inherits the silent loader unless it is
      fixed in the same change. The execution_mode enum has two values and no split mode, so a
      change spanning a team surface and a carve-out surface is two task records of one cutover.
    dec: none
  - id: D-02
    choice: >-
      default_branch STAYS in fleet.yaml and does not move into harness.json, reversing that one
      clause of 350's resolution while keeping the rule the resolution derives from.
    because: >-
      Measured at ada8e99, factory_workspace.py:115 reads default_branch in order to CREATE the
      checkout, and factory_claim.py:355 and factory_land.py:45,49,67 read it with no checkout
      present, while factory_config.py:146 validates it. 350 moved it on an explicitly stated
      premise, that central placement makes the product config readable without a clone, and the
      2026-08-18 comment on 493 killed central placement. Ruling 1's operative rule is that no
      value appears in BOTH files, and default_branch appears in exactly one. Which branch a
      checkout is cut from is a fact about where the checkout comes from, which is the fleet
      declaration's own responsibility.
    dec: none
  - id: D-03
    choice: >-
      A fleet member's configuration is read FROM THE REMOTE at its default_branch, by one gh api
      contents call, and never from a checkout. A failed read raises naming the repository, the
      path and the ref. There is no checkout fallback, and no cached value is consulted when a read
      fails - a failure is always a fresh, loud failure. A SUCCESSFUL read is memoised per
      repository and ref for the life of the process, which is a success-path optimisation and
      never a fallback: nothing is memoised on the failure path and nothing is persisted to disk.
    because: >-
      In-repo placement means a product config needs a checkout, and factory_decompose.py:329,399
      and factory_claim.py:226 both resolve a product's board BEFORE any clone exists, with no
      issue number available at decompose time, so factory_workspace cannot be ordered ahead of
      them. The rejected alternative is a checkout read with clone-on-demand: it needs an issue
      number that does not exist yet, adds stale-checkout semantics, and makes a read mutate the
      disk. The accepted cost, stated rather than argued away, is that a product's config is
      visible only as merged on its default branch, and that a network failure now stops a claim
      that a local file used to serve. Reading always-remote rather than checkout-if-present is
      deliberate: the second is the silent dual mode this feature exists to remove. A second
      accepted cost, stated here rather than discovered at build time: factory_decompose resolves a
      product's board TWICE in one run, at factory_decompose.py:329 and again at :399 through
      board_station, while factory_claim.py:226 and factory_land.py:85 resolve it once each. The
      success-path memo makes that one network read per process; a failed read is never memoised, so a
      run against an unreachable remote pays one loud failure per call site rather than one per
      run. That is accepted: cheap retries matter less than never serving a stale or invented
      board.
    dec: none
  - id: D-04
    choice: >-
      The pen for kaya's .harness/harness.json is the MAIN SESSION, and the route is the existing
      factory one: an issue on mruangutai/kaya-ai, factory_workspace to materialise the checkout at
      workspace_root/kaya-ai, a main-session-direct edit there, factory_land to push and open the
      pull request, and the operator merges it. No new grant is added to team-config.yaml.
    because: >-
      check-domain.sh --resolve returned NOBODY for that path at ada8e99, and that is forced rather
      than an omission: DEC-189 excludes every manifest entry whose first segment is .harness or
      .claude when the target resolves in a product checkout, so no seat can hold it. DEC-193 names
      workspace_root/<product> as one of exactly two locations code is written under harness
      authority, so the checkout itself is sanctioned. The rejected alternative is granting a seat,
      most plausibly harness-dev-ops, a .harness/** path inside product checkouts: that reverses
      DEC-189's target-side exclusion permanently, for every product and every agent, to buy one
      one-time edit. The accepted cost of the chosen route is that it needs an issue on a product
      repository and an operator merge, and that the main session hand-edits a file in a checkout
      it did not create.
    dec: none
  - id: D-05
    choice: >-
      There is ONE board validator, factory_config.validate_board, and every board reader on either
      side goes through it. gh_board.load_board calls it and propagates FleetError. The class is
      not renamed.
    because: >-
      Two validators with two failure modes is the trap 350 recorded verbatim. FleetError's string
      is built by factory_cli.body from a what, a value and a next step, so the message names the
      offending key and the file path and the class name never reaches the operator; a rename would
      touch every catch site in six tools for no change in what anyone reads.
    dec: none
  - id: D-06
    choice: >-
      The required stations key set is FIVE - backlog, ready, building, review, done - not the
      three the fleet schema requires today and not the six DEC-192 names. plan is deliberately not
      declared.
    because: >-
      Every one of the five has at least one code reader at ada8e99: ready in
      factory_decompose.py:399, building and review in gh_board.derive_station:115,117, and
      building, done and backlog in check-state.sh's INV-26 _EXPECT map. plan has none, because
      board-station.py takes the station as a plain CLI string resolved by name at the board
      (DEC-196), so declaring it would be a declaration no writer reads, which is DEC-196's own
      objection. Probed live on 2026-08-18: boards 2 and 3 both carry all six options, so five is
      satisfiable on both. The accepted cost of one uniform key set is that each board declares one
      or two keys its own writers never resolve; a per-board key set was rejected because it is a
      second schema, which is the thing being removed. Reversibility: a sixth required key later is
      one pull request per fleet repository, each needing an operator merge.
    dec: none
  - id: D-07
    choice: >-
      A board declared as an explicit null is ACCEPTED and writes no station. A board key that is
      absent, or present and incomplete, is an error. For a fleet member the board is required, so
      null and absent are both errors there.
    because: >-
      templates/harness.json:155 ships board: null with a note saying this project has no board, so
      an unconditional error would make a boardless project unonboardable. An explicit null is a
      declaration a reader can see, not the hidden default ruling 2 removes; an absent key is
      indistinguishable from a typo, which is precisely the shape ruling 3 kills.
    dec: none
  - id: D-08
    choice: >-
      load_fleet REJECTS a repos[].board key with a message naming where the board moved to, and
      the fleet schema string stays factory-fleet/1.
    because: >-
      This is the exact pattern already used for the leftover top-level board key at
      factory_config.py:127-132, and a targeted message telling an author which file the block
      belongs in is more actionable than a version mismatch. A bump to factory-fleet/2 was
      considered and declined: it would replace a specific instruction with a generic one for a
      declaration that has one machine and one consumer.
    dec: none
  - id: D-09
    choice: >-
      This feature amends DEC-174 amendment 2 and DEC-196 in the same plan, as T-10.
    because: >-
      DEC-188 requires that a decision the tree flatly contradicts is not left standing, and there
      is no propagation checker, so the amendment happens here or nowhere. DEC-174 am.2 states that
      each repos entry carries its own board mapping, and DEC-196 states that no stations map is
      declared for the harness's own board; T-06 and T-07 make both false. DEC-196 conditions its
      clause on 350's ruling having no implementing ticket, so this is the pre-authorised follow-on
      it names, not a reversal of it.
    dec: DEC-196
  - id: D-10
    choice: >-
      Kaya's pull request (T-09) must be MERGED before T-07 removes the board block from
      fleet.yaml, and the plan orders them that way.
    because: >-
      Between the harness-side cutover and that merge, every factory_decompose and factory_claim
      run against kaya fails loudly on a config with no board. That is correct behaviour and is
      stated as designed rather than discovered, but it is a cross-repository sequencing
      constraint, and T-07's verify enforces it: a gh api read of kaya's config at master that
      exits non-zero when T-09 is unmerged.
    dec: none

tasks:
  - id: T-01
    title: factory_gh gains a single-file read of a repository at a ref
    traces: [REQ-04]
    change_type: api
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/factory_gh.py
      - .claude/skills/harness/bin/test-factory-gh.py
    verify: |
      out=$(python3 .claude/skills/harness/bin/test-factory-gh.py 2>&1); rc=$?
      has() { printf '%s\n' "$out" | sed -E 's/^(ok|PASS)[ -]+//' | grep -qxF "$1"; }
      has "file_at_ref: returns the decoded file body" || { echo "T-01: the happy-path case did not pass or did not run"; exit 1; }
      has "file_at_ref: hits the contents path with the ref" || { echo "T-01: the argv case did not pass or did not run"; exit 1; }
      has "file_at_ref: a missing file raises GhError naming repo, path and ref" || { echo "T-01: the missing-file case did not pass or did not run"; exit 1; }
      has "file_at_ref: undecodable content raises rather than returning empty" || { echo "T-01: the undecodable case did not pass or did not run"; exit 1; }
      has "default_branch_sha: returns the sha" || { echo "T-01: a pre-existing case vanished"; exit 1; }
      printf '%s\n' "$out" | grep -E "^FAIL" && { echo "T-01: a case failed"; exit 1; }
      test "$rc" = 0 || { echo "T-01: the suite exited $rc"; exit 1; }
      echo "T-01 GREEN"
    intent: |
      Harness must be able to read one file out of a repository it has not cloned. Add that
      primitive to .claude/skills/harness/bin/factory_gh.py and nothing else. This task adds no
      caller; T-02 is the caller.

      WHAT MUST BE TRUE AFTERWARDS

      1. A new module-level function file_at_ref(repo, path, ref) returns the file's contents as a
         str. repo is the owner/name form, path is repository-relative with no leading slash, ref
         is a branch name.
      2. It goes through run_gh, exactly as every other function in this module does, so that
         FACTORY_GH keeps selecting the binary at call time and a fake binary keeps working. The
         invocation is the REST contents endpoint with the ref as a query parameter, and the
         response body is base64 in the content field, so the function decodes it. Ask gh for the
         content field alone rather than the whole object.
      3. EVERY failure raises GhError and none returns a sentinel. A repository that does not
         exist, a path that does not exist at that ref, a ref that does not exist, an
         unauthenticated gh, and a content field that is absent or does not base64-decode are all
         raises. A caller must never be able to mistake "not there" for "empty file", which is the
         silent-None class this whole feature removes.
      4. The GhError message names the repository, the path and the ref, in that order, and it is
         built the way this module already builds them so that factory_cli prints it verbatim.
      5. The function returns text and parses nothing. JSON parsing belongs to the caller in T-02.
      6. The module docstring gains one sentence placing this function among the others: it is the
         only function here that reads repository CONTENT rather than issue, board or ref
         metadata.

      TESTS, in .claude/skills/harness/bin/test-factory-gh.py, using the recorder harness the file
      already uses for default_branch_sha. Four new cases, with these exact ok-line texts:
        file_at_ref: returns the decoded file body
        file_at_ref: hits the contents path with the ref
        file_at_ref: a missing file raises GhError naming repo, path and ref
        file_at_ref: undecodable content raises rather than returning empty
      The third case asserts all three of the repository, the path and the ref appear in str(exc) -
      three separate assertions in one case, not one substring check on a concatenation. Do not
      remove or renumber any existing case; the verify names default_branch_sha: returns the sha
      specifically to catch that.

  - id: T-02
    title: One loud board validator, and a fleet member's config is read from its remote
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05]
    absorbs: ["#493"]
    change_type: cross_module
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: building
    files:
      - .claude/skills/harness/bin/factory_config.py
      - .claude/skills/harness/bin/test-factory-config.py
    verify: |
      out=$(python3 .claude/skills/harness/bin/test-factory-config.py 2>&1); rc=$?
      has() { printf '%s\n' "$out" | sed -E 's/^(ok|PASS)[ -]+//' | grep -qxF "$1"; }
      for k in backlog ready building review done; do
        has "validate_board accepts the five-key stations map: $k" || { echo "T-02: the $k station case did not pass or did not run"; exit 1; }
        has "validate_board rejects a stations map missing $k" || { echo "T-02: the missing-$k case did not pass or did not run"; exit 1; }
      done
      has "load_fleet rejects a repos entry carrying a board key" || { echo "T-02: the fleet board rejection case did not pass or did not run"; exit 1; }
      has "load_fleet still requires repos[].name, repos[].default_branch and workspace_root" || { echo "T-02: the surviving-keys case did not pass or did not run"; exit 1; }
      has "product_config reads the remote at default_branch with no checkout on disk" || { echo "T-02: the no-checkout case did not pass or did not run"; exit 1; }
      has "product_config raises naming repo, path and ref when the remote read fails" || { echo "T-02: the remote-failure case did not pass or did not run"; exit 1; }
      has "product_config never falls back to a checkout" || { echo "T-02: the no-fallback case did not pass or did not run"; exit 1; }
      has "product_config memoises a successful read: a second board_for makes no second remote read" || { echo "T-02: the memoisation case did not pass or did not run"; exit 1; }
      has "board_for resolves through product_config" || { echo "T-02: the board_for case did not pass or did not run"; exit 1; }
      has "board_for raises when the product config declares no board" || { echo "T-02: the absent-board case did not pass or did not run"; exit 1; }
      for shape in "no board key" "board is not a mapping" "owner missing" "number not an int" "station_field missing" "stations missing" "stations key set wrong" "a station value is empty"; do
        has "board_for raises naming the file and the key: $shape" || { echo "T-02: the board_for raise case for '$shape' did not pass or did not run"; exit 1; }
      done
      has "(16) repo_entry finds the listed repo" || { echo "T-02: a pre-existing case vanished"; exit 1; }
      printf '%s\n' "$out" | grep -E "^FAIL" && { echo "T-02: a case failed"; exit 1; }
      test "$rc" = 0 || { echo "T-02: the suite exited $rc"; exit 1; }
      echo "T-02 GREEN"
    intent: |
      This task and T-04 and T-05 are ONE cutover. The board leaves the fleet declaration and the
      single surviving validator is the loud one; there is no intermediate state in which a board
      consolidates while a silent failure mode survives. Do not defer any part of the loudness.

      A RED WINDOW BETWEEN THIS TASK AND T-03 IS EXPECTED, AND IT IS NOT A REGRESSION. This task's
      verify runs test-factory-config.py alone. The moment a board inside a repos entry becomes a
      rejected shape, five other suites - test-factory-claim.py, test-factory-decompose.py,
      test-factory-land.py, test-factory-integration.py and test-check-domain.py - go red on
      fixtures that still nest one there, and T-03 is what repairs them. Return on this task's own
      verify; do not migrate another file's fixtures here, and do not read a red full suite between
      the two as evidence that this task is wrong. T-02 and T-03 land in ONE commit, so the red
      window never exists in recorded history.

      Edit .claude/skills/harness/bin/factory_config.py.

      WHAT MUST BE TRUE AFTERWARDS

      1. _STATION_KEYS becomes the five-tuple backlog, ready, building, review, done. Not three,
         not the six DEC-192 names. plan is deliberately excluded: no code resolves it, because
         board-station.py takes the station as a plain CLI string resolved by name at the board.
      2. _validate_board becomes PUBLIC as validate_board(board, where, path), keeping its current
         three-argument signature and its current FleetError shape, and gaining the five-key
         stations check. It is the ONLY board validator in the tree after this feature; gh_board
         imports it in T-04. Its docstring says so, and says that the where argument is a
         caller-supplied prefix so the same validator serves a fleet entry and a harness.json
         github block.
      2a. THE where CONTRACT CHANGES, and this is not cosmetic. Today factory_config.py:77 reads
         key_base = f"{where}.board", which made sense only for the deleted load_fleet caller that
         passed repos[<name>]. After item 3 that caller is gone and both surviving callers - item 7
         here and T-04 item 1 - pass the FULL prefix github.board. So: where is the FULL key
         prefix, and key_base becomes where itself with NO appended segment. Leaving the append in
         place would make every message name github.board.board.owner, a key that exists in no
         file, in the feature whose stated goal is naming the offending key. Correct the
         docstring's own examples in the same edit: they spell repos[owner/name].board and
         ...board.owner and must spell what the surviving callers actually produce.
      2b. THE PER-FIELD MESSAGES ARE KEPT IN SHAPE, NOT VERBATIM. The stations message at
         factory_config.py:106-107 currently reads "set exactly ready, building and review, each a
         non-empty option name" - falsified by item 1's five-key set. Rewrite it to name all five:
         backlog, ready, building, review and done, each a non-empty option name, in that path.
         The owner, number and station_field messages keep their current wording.
      2c. THE number COERCION MOVES INSIDE validate_board. Today gh_board.load_board coerces a
         digit string to an int at gh_board.py:80-85 while factory_config._validate_board:88
         rejects any non-int, so the same bytes are accepted through one entry point and rejected
         through the other - two acceptance sets behind one validator, which is the defect class
         this feature exists to remove. validate_board therefore accepts an int OR a string whose
         stripped form is all digits, coerces the latter to an int, and rejects everything else
         including a bool, a float and a non-digit string. Because the function validates a mapping
         in place, it must make the coerced value visible to the caller: mutate board["number"] to
         the int, and say in the docstring that a valid board comes back with number normalised to
         an int. AND validate_board RETURNS the validated mapping. Today _validate_board returns
         None because raising was its whole job, but item 7 here and T-04 item 1 both CONSUME its
         return value, so a strict reading of "keeping its current signature" that also kept the
