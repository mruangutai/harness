    intent: |
      Work directly in PRODUCT Harness checkout /Users/molchairuangutai/GitHub/harness/.claude/worktrees/harness/FEAT-2452-gh-one-transport; never delegate execution. Consult its AGENTS.md, .harness/harness/docs/SPEC.md sections 3.3 and 9, .harness/harness/docs/DECISIONS.md DEC-138/146/174/200/203 and module contracts. The generic docs/spec.md, docs/decisions.md and docs/architecture.md are absent; SPEC section 3.3 and existing modules supply applicable architecture guidance.
      Add a small frozen GhResult with status int-or-None, stdout str, stderr str, value object-or-None, error GhError-or-None, and a derived ok property equal to error is None. Add try_gh(args, json_out=False, *, input=None): on success retain raw streams and real process status, and set value to strict parsed JSON or stripped stdout; on known transport, nonzero or JSON failure return error plus original captured streams/status and value None. A JSON failure with process status zero must have ok false. Catch only GhError; programming exceptions continue to escape. Preserve launch exception chaining and original diagnostic attributes. GhResult.status, stdout and stderr are the authoritative process facts: status is None only on launch failure, and callers classify on these result fields, never on result.error attributes such as error.status, which the preserved rate-limit diagnosis may set to None after a completed nonzero process. Add no field for this. No retries or process deadlines.
      Replace the existing private launch entry with public launch_gh(args, *, input=None), the sole subprocess and call-time FACTORY_GH resolution boundary. It returns a captured text CompletedProcess, does not measure, interpret nonzero exits, or parse JSON, and types FileNotFoundError and other OSError as GhError with status None. With input None close stdin through DEVNULL; with text input pass that input without also passing stdin. Remove obsolete resolver/launcher aliases and migrate their tests.
      try_gh measures exactly once around launch_gh; preserve current rate-limit diagnosis and its recursion guard without retrying the failed operation. run_gh becomes the raising adapter over this result, returning value or raising its GhError; preserve existing run_gh positional calls, strict duplicate-key/nonfinite JSON rejection and no stdout side effects. Add keyword input support for the later wayfind gist migration.
      gh_cost_log._read_counter calls launch_gh, never run_gh or try_gh, using a function-local factory_gh import after module initialization to avoid the existing factory_gh-to-gh_cost_log import cycle. Remove its independent binary resolver/subprocess execution. Keep opt-in recording and None-on-counter-failure policy, no counter self-measurement, unchanged return-code accounting, and exact counter guard. Delete factory_gh's old gh_issues binary-override warning and update cost coverage prose to describe the shared seam. Do not create a second low-level transport module.
      Add issue_number_from_url(args, output) in factory_gh and reuse it from create_issue. Accept a complete http/https GitHub issue URL ending /issues/ followed by a positive ASCII decimal number and an optional trailing slash; reject malformed, zero, non-ASCII and oversized integer tails as GhError with argv and original output, never raw ValueError. Preserve the existing factory error grammar. Add failing-first parser cases including the successful URL contract; this is the shared parsing boundary used by T-02 and T-04 for issue 1542.
      Write the unit regressions first and record real failing-first evidence before production edits. Cover success/raw streams/JSON null, nonzero, missing binary, permission/general OSError, strict malformed/duplicate/nonfinite JSON, unexpected exception escape, input forwarding, call-time FACTORY_GH, and both import orders with no import-time gh call. Enable telemetry with one fake binary and assert exactly before-counter, operation, after-counter launches, no nested counters and no real gh. Adapt the existing gh_issues.gh_bin monkeypatch assertions so T-04 can remove that API without a shim. Keep the existing gh-sync gh() wrap-site ON/OFF cases in test-gh-cost-log.py transport-agnostic: they keep intercepting the shared subprocess.run module attribute and assert counter, operation, counter plus one cost line when ON and one launch with no line when OFF, so the same unchanged assertions hold before and after T-02. This task's run observes only the old mirror wrapper; the post-cutover mirror telemetry proof is T-02's verify rerun of this file and the final cumulative unit gate, not T-01. Expected verify exit 0 with all four selected scripts PASS; the two check-state INV-26 scripts are run, never edited, so a factory_gh import or alias break in the enforcement dependency chain surfaces at this task, and T-05's final boundary re-proves them cumulatively; suite results and fail-first evidence belong in later QA, not this planning run.
