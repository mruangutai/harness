      Preserve gh-sync command flows, argv, routing, signed local authority, immediate receipts, and caller-specific policies for open, start-task, status, abandon, reject, backlog, ship and recovery. Replace every gh subprocess path, including gh, gh_try, auth, label creation, type capability, PR list, ordinary milestone and replacement create, with factory_gh.try_gh or run_gh. Remove GH, GH_SYNC_GH, duplicate measurement/imports and direct launch code, not merely the two wrappers. gh retains SKIP/0 and capture=False behavior; gh_try retains its tuple contract and 200-character failure diagnostic by explicitly translating the typed result. Launch failures now reach these same policies without traceback. Preserve the PR list no-write/continue behavior and exactly-one/readback restrictions; capability failure, including launch and malformed JSON, still prints labels-only compatibility rather than SKIP. Do not change command policy simply because the common transport raises.
      Check each mirror label-create result: stop dependent issue writes via mirror SKIP on real failure, but accept as the prior idempotent case only this label-exists condition, spelled once here and cited verbatim by T-03: result.status is a nonzero integer (never None, which is a launch failure) and the lowercased concatenation of result.stdout and result.stderr contains both label with name and already exists, the text gh label create prints for an existing label without --force (it carries no 422). Every other result, including a launch failure, is a real failure. Preserve all existing per-label colors and absence of force; do not call factory ensure_labels with different semantics. Add regression for failed first label, no dependent issue create, existing-label acceptance with the fake exiting 1 and printing gh's existing-label stderr label with name "harness" already exists; use --force to update its color and description, and unchanged colors.
      Ordinary milestone create uses the typed result; the title lookup is permitted only when the failed result's captured stdout plus stderr, lowercased, contains both 422 and already exists, the same local conjunction factory_gh.create_ref already applies. No second spelling, structured error-code parsing, helper or recovery framework. Any other failure, including a launch failure, takes ordinary SKIP without a lookup. Add exactly two regressions: a 422 already-exists failure performs the title lookup and records the milestone; a 401 failure skips with no lookup call. This is divergence (e), settled as first to cut: if this inline conjunction over the existing typed result would need a helper, a further spelling or more regression cases, do not implement (e); keep today's lookup behavior and return to PM so the settled cut lever and the SC-04 wording are recorded at re-signature. Replacement milestones never use this ordinary lookup.
      Fold issue 1542 into ordinary parent/task create handling. Validate the returned /issues/positive-decimal-number URL using T-01's factory_gh.issue_number_from_url(args, output), which catches invalid/oversized int conversion as GhError. Do not edit factory_gh in this task. In gh-sync use the shared parser and translate its failure to actionable ordinary mirror SKIP, never a receipt with a false number, traceback, or automatic second create. Apply the same shared parser to every other gh-sync issue-create URL parse: _backlog_create maps its GhError to the ordinary skip with no backlog receipt written, and _replacement_create's non-JSON URL branch replaces its local regex with the parser and adds GhError to its existing except, so a malformed URL still refuses as an uncertain create with the durable pending intent preserved. No issue-URL grammar other than factory_gh.issue_number_from_url remains in gh-sync. Mark the remote-write attempt consistently so Build-entry does not claim not-applicable after a successful create with unreadable response. Keep replacement create's stronger durable intent, refusal/exit 2 and explicit-adoption-only contract. Preserve safe FileNotFoundError/PermissionError intent clearing by examining the chained typed launch cause; uncertain OSError/Unicode/SubprocessError and post-dispatch/nonzero/malformed response retain pending intent and refuse with no retry/discovery.
      Fold issue 13 into a regression where abandon receives a failing REST close/API result: assert diagnostic, later item writes and local abandoned recording, without changing the existing continue policy. Keep required reject halt behavior. Add failing-first tests for launch errors in gh and gh_try, ordinary URL malformation for both parent and task, backlog create URL malformation in test-gh-backlog-issue-types.py (SKIP, no backlog receipt, no traceback), checked label creation, the two milestone cases above, and abandoned API failure; retain all existing safety assertions.
