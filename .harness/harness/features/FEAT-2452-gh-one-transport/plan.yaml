    choice: Consolidate operator and library execution in factory_gh while keeping caller failure policy outside the transport; reject native issue/pr read URIs and run_watch as code replacements.
    because: Rendered cached Markdown lacks the strict typed JSON contract, and native watch has no Python entry point or current polling caller; rewriting mirror flows would change settled policy.
