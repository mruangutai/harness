      Cite the exit code of a COMPLETED run for every command you report; a partial read of a
      still-running background job is not evidence.

  - id: T-02
    title: Write the never-wait rule and its inoculation into the lead playbook between the dispatch and collect steps
    traces: [REQ-01, REQ-02, REQ-03, REQ-04]
    change_type: ai_behavior
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve on .claude/skills/harness-team/SKILL.md returns NOBODY at 9165162, so DEC-179 makes this a declared main-session step and no squad may write it
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness-team/SKILL.md
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      python3 .claude/skills/harness/bin/test-lead-stop-and-wake.py --group playbook && echo T02_PASS
    intent: |
      Edit .claude/skills/harness-team/SKILL.md. Insert ONE short bold-led instruction into the
      section 3 loop, between the dispatch paragraph beginning "d. Dispatch the rest of the ready set
      in one turn" (line 97 at sha 9165162) and the "e. Collect returns." line (line 112 at that
      sha). Four to eight lines of prose is the ceiling. It carries THREE things, in the file's own
      voice, matching the shape .claude/skills/harness/SKILL.md lines 45 to 56 already uses for the
      orchestrator.

      ONE - the lead never waits for a member. Having dispatched, it ends its turn. It does not poll,
      does not sleep, does not re-read files to look busy and does not restate that it is waiting.

      TWO - stopping is safe. The platform wakes the lead when the member completes, so ending the
      turn is HOW a lead waits, not a way of giving up.

      THREE - THE INOCULATION, and it is not optional. Every first turn-end after this change meets a
      live child and IS refused - stderr reads BLOCKED, returned with children in flight. Say that
      the refusal is EXPECTED, that the correct response is to END THE TURN AGAIN, and that it can
      RECUR on a later wake while a child is still live. Say plainly that it is never a bar on
      returning - it is a prompt to correct any claim made about a child the lead cannot see. Without
      this clause the rule installs the very loop it removes, because a lead told only to stop reads
      the refusal as an instruction to stay.

      Use the plain words - end your turn, wake, expected, again, recur. The test's detectors are
      synonym alternations, but these are the plainest members of them.

      DO NOT write that the refusal fires at most once, or that a second identical return will ship
      unconditionally. That bound is FALSE as stated and is being corrected elsewhere in this
      feature. The measured bound is at most once per CONSECUTIVE STOP SEQUENCE, re-firing on each
      wake while a child is still live.

      Bound the whole insertion by DEC-158 - the rule, ONE clause of why, and a DEC-201 pointer. No
      incident narrative, no probe identifiers, no transcript quotes; those are T-05's and live in
      DECISIONS.md.

      Then make the surrounding loop read as one document, changing as little as possible.
        Line 81, "Until every step is terminal, or you halt:", must not read as one continuous turn.
        State that the loop iterates ACROSS turns, each wake re-entering it, and that state.yaml
        carries the loop's position because the lead's context may not survive.
        Line 112, "e. Collect returns.", must not read as receive-in-place. Make explicit that
        collecting happens ON WAKING, after the turn ended, and never by staying alive to receive.
      Do not touch line 181's DEC-124 sentence about turn-boundary visibility, do not touch sections
      4 and 5, and do not grant or mention any message-sending tool anywhere - a lead holding one
      gains a reason to stay awake and watch, which is the behaviour being removed (D-03).

      Verify with a COMPLETED run of
      python3 .claude/skills/harness/bin/test-lead-stop-and-wake.py --group playbook
      expecting exit 0.

