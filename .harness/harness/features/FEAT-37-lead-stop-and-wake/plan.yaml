      live child and IS refused - stderr reads BLOCKED, returned with children in flight. Say that
      the refusal is EXPECTED, that the correct response is to END THE TURN AGAIN, and that it can
      RECUR on a later wake while a child is still live. Say plainly that it is never a bar on
      returning - it is a prompt to correct any claim made about a child the lead cannot see. Without
      this clause the rule installs the very loop it removes, because a lead told only to stop reads
      the refusal as an instruction to stay.

