    intent: |
      Create .claude/skills/harness/bin/test-lead-stop-and-wake.py, a stdlib-only Python 3 test, and
      register it in run-unit-tests.sh. It guards three invariants of FEAT-37. It must FAIL today —
      nothing it guards has shipped yet — and that failing state is the proof it discriminates.

      Repo root. Derive it from os.path.abspath(__file__) with four os.path.join ".." hops up from
      the bin dir, exactly as test-orchestrator-playbook.py does. NEVER from the current working
      directory.

      CLI. Accept these arguments and nothing else.
        --self-check          run the fixture self-check only, reading no live file
        --group NAME          run one group only; NAME is one of playbook, bound, coverage
        --only PATH           valid with --group bound only; restrict the bound group to that one
                              site path
      With no arguments, run all three groups. Print the path each group read at the top of its run.
      Use the PASS/FAIL print shape, failures list and exit codes of test-orchestrator-playbook.py -
      exit 0 when every selected case passes, exit 1 with a trailing "N FAILURE(S)" line otherwise.
      A missing marker or an unreadable file is a named FAIL, never an exception traceback.

      GROUP "playbook". Subject is .claude/skills/harness-team/SKILL.md, read from
      os.environ.get("TEAM_PLAYBOOK_PATH") falling back to the repo-root path.
      Region extraction. The loop steps are bold-lettered paragraphs starting at column 0 in the form
      that begins with two asterisks then the letter then a period then a space. Find the first line
      matching the regex for the letter d and the first line AFTER it matching the regex for the
      letter e. The REGION is the text from the start of the d line up to but excluding the e line.
      If either marker is absent, that is a FAIL named case0_region_markers_present.
      Detectors, applied to the REGION only, all case-insensitive.
        STOP_RE  matches an end-your-turn directive - the alternation must cover end your turn, ends
                 its turn, end the turn, ending your turn, stop your turn.
        WAKE_RE  matches the wake half - the alternation must cover wakes, waking, woken, wake you,
                 resumes you, resumed you.
        EXPECT_RE  matches the refusal being expected - the alternation must cover is EXPECTED, to be
                 expected, will be refused, expect the refusal, expect to be refused.
        AGAIN_RE  matches the prescribed response - the alternation must cover end your turn again,
                 stop again, return again, end the turn again, do it again.
        RECUR_RE  matches recurrence - the alternation must cover recur, recurs, re-fires, refires,
                 again on a later wake, on each wake, every wake, per stop sequence, each stop
                 sequence, consecutive stop sequence.
      Cases, each its own assertion, each reported separately.
        case1_stop_half        STOP_RE searches the region successfully
        case2_wake_half        WAKE_RE searches the region successfully
        case3_halves_adjacent  the case1 and case2 match offsets lie within 600 characters of one
                               another inside the region
        case4_refusal_expected AGAIN and EXPECT - EXPECT_RE searches the region successfully
        case5_stop_again       AGAIN_RE searches the region successfully
        case6_refusal_recurs   RECUR_RE searches the region successfully
      Cases 4, 5 and 6 are three separate assertions on purpose - one region-wide search would be
      satisfied by the two easy clauses and blind to the missing third.

      GROUP "bound". Three site paths, each a separate case, each skippable by --only.
        .harness/harness/docs/DECISIONS.md
        .claude/skills/harness/bin/inflight_registry.py
        .claude/skills/harness/SKILL.md
      For each site, find every occurrence of the once-only phrasing with an alternation covering -
      fires at most once, fires ONCE, refusal fires once, a second identical return will ship,
      one-correction-round. For EACH occurrence, take the SENTENCE containing it, defined as the text
      between the previous and the next sentence-terminating period-space or newline-newline
      boundary. The occurrence is ACCEPTABLE when either
        (a) that sentence also matches a qualifier alternation covering - per consecutive stop
            sequence, per stop sequence, each stop sequence, consecutive stop sequence, re-fires,
            refires, on each wake, every wake; or
        (b) the site is DECISIONS.md AND the nearest preceding line matching the regex for a level-3
            heading beginning with DEC- introduces an entry whose body, up to the next such heading,
            contains the word STRUCK.
      Any occurrence that is neither is a FAIL naming the site, the line number and the sentence.
      Exemption (b) is a general rule and not a branch on this feature - DEC-188 keeps a struck
      entry's body in place so that citations still land, so a falsified sentence inside a STRUCK
      entry must not fail this guard. At 9165162 no struck entry carries the once-only phrasing, so
      (b) exempts nothing today; it exists so the guard stays correct when one does.
      This group must not read any other file, and must not treat a file it cannot open as a pass.

      GROUP "coverage". Two cases against the decision record.
        case_index_row - in .harness/harness/docs/DECISIONS-INDEX.md, the line beginning with the
        DEC-201 row marker matches a lead-tier alternation covering - lead, leads, domain lead,
        lead tier - case-insensitively.
        case_entry_scope - in .harness/harness/docs/DECISIONS.md, the DEC-201 entry, sliced from its
        level-3 heading to the next level-3 heading that introduces a different DEC number, matches
        the same lead-tier alternation.
      Both fail at 9165162, where the row and the entry name only the orchestrator.

      SELF-CHECK. With --self-check, read NO live file. Build an embedded synthetic skeleton that
      mimics the playbook's shape - a level-3 "3. Loop" heading, then bold-lettered c, d, e and f
      paragraphs, with the d paragraph titled Dispatch the rest of the ready set in one turn and the
      e paragraph titled Collect returns. Run the playbook detectors against five variants and assert
      the verdict on each.
        A  skeleton with NOTHING between d and e                                    must FAIL
        B  skeleton with this exact text inserted between d and e                    must PASS
           You never wait for a member. Having dispatched, end your turn - the platform wakes you
           when the member completes. The stop refusal on that return is EXPECTED, not a bar - end
           your turn again, and expect it to recur on each later wake while a child is still live.
        C  variant B with that text removed from the region and appended at the end of the file
                                                                                     must FAIL
        D  skeleton carrying only the first two sentences of B between d and e - the stop and wake
           halves, no inoculation                                                    must FAIL
        E  skeleton carrying B with the words "end your turn again" and every AGAIN_RE synonym
           removed, so only two of the three inoculation clauses remain              must FAIL
      Variants D and E are what prove case4, case5 and case6 are not vacuous. All five variants are
      worded by this test and never copied from the shipped playbook, so a later reword of the
      shipped sentence cannot make the self-check vacuous. Print SELFCHECK PASS or SELFCHECK FAIL per
      variant and exit 0 only when all five verdicts are as stated, 1 otherwise. Structure the case
      functions so they run against a passed-in text and return a boolean verdict without touching
