      THE REGION STAYS THIS NARROW ON PURPOSE. SC-01 rests on a sentence moved outside d-to-e being
      caught, so widening the region to cover T-02's other two edits would destroy the property the
      criterion buys. Those two edits get their OWN regions, in cases 8 and 9 below, rather than a
