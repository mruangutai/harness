        case4_refusal_expected AGAIN and EXPECT - EXPECT_RE searches the region successfully
        case5_stop_again       AGAIN_RE searches the region successfully
        case6_refusal_recurs   RECUR_RE searches the region successfully
        case7_overrides_tool_text  SOME SINGLE SENTENCE of the region matches BOTH NUDGE_RE and
