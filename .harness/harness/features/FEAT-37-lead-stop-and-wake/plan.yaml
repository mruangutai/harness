decisions:
  - id: D-01
    choice: The rule is written once into the harness-team skill and no lead agent file is edited
    because: all three lead agents preload harness-team, so one file reaches the whole tier and three copies cannot drift apart
    dec: none
  - id: D-02
    choice: DEC-201 is corrected IN PLACE (D-09) to cover the lead tier rather than by a new entry, and its body widens the scope its title narrows to the orchestrator
    because: one rule keeps one home under DEC-158, and a second entry would leave two statements of the never-wait rule free to drift
    dec: DEC-201
  - id: D-03
    choice: No lead is granted SendMessage or any message-sending tool as part of this fix, in any form
    because: a lead that has ended its turn cannot send anything, and a message tool gives it a fresh reason to stay awake and watch, which is the loop being removed; issues 610 and 552 are closed on that ruling
    dec: none
  - id: D-04
    choice: The shipped rule carries an INOCULATION clause — the refusal is expected, the response is to end the turn again, and it can recur on a later wake — and not merely an end-your-turn sentence
    because: after this fix every dispatch's first turn-end meets a live child and IS refused (measured), so a lead told only to stop reads the refusal as an instruction to stay and rebuilds the loop; the clause states the expected response, which is rule text under DEC-158 and not narrative
    dec: DEC-158
  - id: D-05
    choice: The guard test uses region-scoped synonym alternations plus a five-fixture self-check, and deliberately does not copy the exact-literal shape of test-orchestrator-playbook.py
    because: issue 804 measured that four of that file's eight assertions are defeated by a reword while the file stays green, so a copy would grade nothing
    dec: none
  - id: D-06
    choice: Each of the three inoculation clauses gets its own assertion rather than one region-wide search
    because: a whole-region search is satisfied by the two easy clauses and is blind to the missing third, which is the failure shape a criterion quantifying over N items always has
    dec: none
  - id: D-07
    choice: The issue-811 hook work was ISOLATED DELIBERATELY as a contiguous block of three tasks, T-07 to T-09, strikable whole with no other task depending on it, and that block was then STRUCK from this plan on an operator ruling of 2026-08-24; issue 811 stays OPEN and returns to the backlog, and no task in this plan spends effort on it
