    choice: DECISIONS.md is no longer append-only and the amendment sub-section is removed as a form; a decision SUBSUMES its correction IN PLACE so the entry reads as current knowledge in one voice, and git holds the history. T-05 and T-06 edit DEC-201 and DEC-199 in their own bodies and add no amendment heading, bold amendment marker, dated note or changelog sentence, even though many amendment sub-sections already sit around those entries.
