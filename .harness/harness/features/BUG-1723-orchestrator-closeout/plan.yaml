    title: Replace manual run close-out with close-run in the orchestrator playbook
    traces:
    - SC-04
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: At the resolved SHA no team persona is granted the three orchestrator playbook source files, so DEC-179 requires a declared main-session-direct task.
    depends_on: [T-01, T-02]
    status: done
