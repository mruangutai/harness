decisions:
  - id: D-01
    choice: close-run composes the existing digest, run-end, plan-station, judgement, and spend authorities in that order, retains any earlier completed stage, and stops at the first refusal.
    because: An all-or-nothing rewrite would duplicate authority and hide which durable stage actually refused.
    dec: none
  - id: D-02
    choice: The phase-seam invariant detects a retrospective succession judgement by comparing its timestamp with the first run after the corresponding handoff, without adding feature.json identity state.
    because: Product run identity is unresolved in issue 1708, while the postdated succession shape is already observable and preserves the feature schema.
    dec: none
tasks:
  - id: T-01
    title: Add the composed close-run feature-record command
    traces: [SC-01, SC-02]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 keeps feature-record.py and the focused test that vouches for this enforcement writer outside self-hosted execution; DEC-179 requires the route to be declared now.
    depends_on: []
    status: done
    files:
    - .claude/skills/harness/bin/feature-record.py#main
    - tests/unit/test-feature-record.py#FeatureRecordCase
    verify: |
      python3 tests/unit/test-feature-record.py
    intent: |
      Work test-first and demonstrate the new success and refusal cases failing against the pre-change command. Add feature-record.py close-run with the exact interface --file FEATURE_JSON --id RUN_ID --digest DIGEST_MD --verdict VERDICT, optional paired --task TASK_ID and --station STATION, optional --judgement kind=KIND,decision=DECISION,reason=REASON, and optional --code-grade n_a. Reject an unpaired task or station, any other code-grade value, a malformed judgement, an unknown run, or an unreadable digest before invoking a later stage. Resolve the run's recorded agent and use the existing validate-digest.py contract to validate that persona's digest before mutation. Then invoke the existing run-end authority, invoke plan-merge.py set-task-station when the paired task inputs are present, invoke the existing judgement authority as harness-orchestrator when the judgement input is present, and calculate spend through the existing spend authority. Do not accept or stamp a token argument because the existing hook owns token capture. Preserve each composed authority's validation, locking, diagnostics, and durable write behavior rather than copying its mutation logic. Do not roll back an earlier successful stage. On the first refusal, stop, exit nonzero, name the failing stage, and prove later stages were not invoked. On complete success, emit exactly one transcript line that identifies the closed run and includes spend plus any completed optional station and judgement summary. Do not read or write STATE.md, write a handoff note, perform git operations, or run quarantine checks.
  - id: T-02
    title: Detect retrospective succession at the phase seam
    traces: [SC-03]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 keeps check-state.py and the integration test that directly vouches for the state gate outside self-hosted execution; DEC-179 requires the route to be declared now.
    depends_on: []
    status: done
    files:
      - path: .claude/skills/harness/bin/check-state.py
        quote: INV-40
      - path: tests/integration/test-check-state-feat59.py
        quote: INV-40 judgement-ledger
    verify: |
      python3 tests/integration/test-check-state-feat59.py
    intent: |
      Work test-first and demonstrate the retrospective and unusable-chronology cases failing against the pre-change checker. Add the next available invariant as INV-43 without changing INV-40 or the existing INV-42. Use the existing phase handoff notes, run ledger timestamps, and succession judgement records to find the first run in the later phase for a handoff. Report an INV-43 violation when the applicable succession judgement's at timestamp is later than that run's started_at timestamp, because that is a retrospective correction after work crossed the seam. Emit no INV-43 finding when succession is present no later than the first later-phase run. When a relevant handoff, run, or succession timestamp is present but cannot be parsed or related, report an INV-43 CANNOT VERIFY finding that names the unusable field rather than silently passing. Do not add a feature.json field, depend on run_uid, alter the existing missing-succession invariant, or infer a phase from orchestrator prose. Add isolated integration fixtures for the postdated violation, the prior or equal timestamp control, and each chronology shape whose unreadability must fail closed; retain every existing invariant case.
