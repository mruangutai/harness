    - path: .harness/harness/docs/DECISIONS-INDEX.md
      quote: '- DEC-159 @'
    verify: |
      python3 -c "from pathlib import Path; paths=[Path('.claude/skills/harness/SKILL.md'),Path('.claude/skills/harness/references/build-phase.md'),Path('.claude/skills/harness/references/ledger.md')]; required=('close-run','STATE.md','handoff','commit','separate','quarantine','wake'); missing={str(path):[token for token in required if token not in path.read_text()] for path in paths}; missing={path:tokens for path,tokens in missing.items() if tokens}; assert not missing, missing"
    intent: |
      Replace the repeated digest validation, run-end, optional task-station, optional judgement, and spend command sequence with the exact close-run interface in the orchestrator skill and the build-phase and ledger references. State the stage order, the first-refusal stop, and the one-line successful result so an orchestrator issues one command and does not retry later stages after a named refusal. In each of the three named playbook files, keep STATE.md current-truth authorship, the phase handoff note, and the git commit as explicit separate orchestrator writes after close-run, and keep quarantine inspection at wake time only. At a phase boundary, instruct the outgoing orchestrator to write the handoff before any later-phase run and the successor to append its succession judgement no later than its first run; explain that INV-43 reports a judgement recorded after that run. Preserve the existing per-phase orchestrator model and existing build and ledger vocabulary. Do not add the SC-05 first-post-shipment measurement procedure or its thresholds to these permanently preloaded playbook files; SC-05 remains operator UAT defined only by the brief.
