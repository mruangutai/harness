      card, which is created later by open. So the write is a kickoff act on a named source ticket
      and belongs to neither of those. Build the writer.

      WHY A NEW FILE RATHER THAN A gh-sync SUBCOMMAND, so this is not re-argued mid-build: gh-sync.py
      main reads argv1 as a feature directory and exits when it is not one, BEFORE any subcommand
      dispatch, and derives the harness root by walking up from that directory. At plan kickoff there
      is no feature directory. Do not modify gh-sync.py in this task.

      THE TOOL, at .claude/skills/harness/bin/board-station.py

      Usage: python3 .claude/skills/harness/bin/board-station.py <issue-number> <station>
      Run from the repository root. The usage line must say that the issue number is an issue of
      harness.json's github.repo — the repository is resolved implicitly from that field and is not
      a parameter, so a source ticket belonging to a different repository would silently move THIS
      repository's issue of the same number. Naming the binding in the usage text is the whole fix;
      do not add a --repo option in this task.

      1. Two positional arguments, both required. A missing or extra argument, or an issue number
         that is not a positive integer, prints one usage line to STDERR and exits 2. That is a
         caller mistake, not an environmental condition, and it is the ONLY non-zero exit.
         Exit 2 diverges deliberately from gh-sync.py, whose die() resolves the same class — a
         wrong invocation — as exit 1. This tool is a new tool rather than a gh-sync subcommand and
         2 is the conventional usage-error code; the divergence is recorded here so a later reader
         does not read it as an oversight in a contract that otherwise mirrors that file.
      2. The station is taken as a plain string and is NOT validated against any list. This is
         deliberate and is D-05: gh_board.set_station passes the name to
         factory_gh.project_field_set, which resolves the option BY NAME at runtime, so a wrong
         value fails loudly at the board instead of silently against a stale local list. Do not add
         an allowlist, an enum or a stations map anywhere.
      3. Resolve the harness root the way gh-sync.py already does: walk UP from the current working
         directory to the first ancestor holding .harness/team-config.yaml, the established
         root-probe convention. Do not add a fixed-depth climb. If no ancestor qualifies, print one
         plain line and exit 0.
      3a. EVERY line this tool prints, on stdout or stderr, carries the prefix "board-station: ",
         with no exception — including the environmental lines of items 3 and 4, which items 5 and 6
         already require of the success and failure lines. The sibling is universal in this: every
         one of gh-sync.py's own output lines carries its "gh-sync: " prefix, and the exact parallel
         case, its no-board-configured line, is a plain prefixed line printed on stdout. Match that
         shape, and do NOT reach for gh-sync.py's skip() token form for the environmental lines:
         skip() emits a SKIP marker and exits, which is a different contract from print-and-continue.
      4. Read the repository and the board with the machinery that already exists. The repository is
         harness.json's github.repo; the board is gh_board.load_board(root). load_board returning
         None means the station feature is not configured for this project, which is an
         environmental precondition and NOT an error: print one plain line naming that, write
         nothing, and exit 0. Same for github.sync being false or absent, and for github.repo being
         absent or carrying no slash.
      4a. THE harness.json READ MUST USE THE VARIABLE-FIRST FORM, and a standing gate enforces it
         that this task's own verify cannot see. test-check-plan-routes.py case_20 scans every
         non-test .py and .sh in .claude/skills/harness/bin/ for a LOGICAL line that pairs the string
         .harness with a filesystem predicate — os.path.isfile(, os.path.exists(, Path( and the
         rest — and fails any such line that does not also name team-config.yaml. Written as one
         expression, os.path.isfile(os.path.join(root, ".harness", "harness.json")) is a violation.
         Assemble the path into a variable FIRST and test the variable on the next statement, which
         is exactly how load_config escapes the same case at gh-sync.py:122-123, observed at b7ae135.
         The reason this must be stated here rather than left to the gate: test-check-plan-routes.py
         is in INTEGRATION_SCRIPTS (run-unit-tests.sh:18), so this task's --kind unit conjunct will
         not execute it and the task can report green with the violation in the tree, surfacing later
         as a qa-matrix fix cycle.
      5. On the configured path, call gh_board.set_station(board, repo, issue_number, station) and on
         success print one plain line naming the issue and the station, in gh-sync.py's shape:
         board-station: #<n> -> <station>
      6. THE BOARD WRITE IS WRAPPED SO THAT EVERY EXCEPTION EXITS 0. Catching gh_board.BoardError
         alone does not satisfy item 1: set_station catches only factory_gh.GhError, while
         run_gh with json_out=True calls json.loads unguarded, so an exit-0 non-JSON response
         raises ValueError, and OSError is unguarded too. Either would reach the top as a traceback
         at the head of an operator's planning session, which is a second non-zero exit and makes
         item 1 unsatisfiable as a contract. So wrap the call in a broad except: report ONE line on
         STDERR beginning board-station: ERROR - and naming the issue and the station, and EXIT 0,
         whatever the exception class. Report a BoardError and anything else through the same line,
         so no failure of the board write can ever abort planning. Do not let the broad except
         swallow the usage error of item 1, which is raised before the board write is attempted.
         The reason is the same one written at gh-sync.py's parent write: a station failure is loud
         on stderr and the run continues. This tool is called at the head of an operator's planning
         session, and a mirror write must never abort planning. Do not call
         factory_gh.preflight(), whose callers exit non-zero.
      7. Import gh_board and read harness.json; do not re-implement either. Do not import gh-sync.py
         (its filename is not an importable module name and it has command-line side effects).

      THE TESTS, at .claude/skills/harness/bin/test-board-station.py

      Model the file on test-gh-board.py, which is its nearest sibling: same check() helper shape,
      printing PASS followed by TWO spaces and the case name on success, and a line beginning FAIL
      on failure, and the same write_harness_json() style of temporary-root fixture. The verify
      greps those exact labels, so they must be byte-identical:
        board-station moves the named issue to the named station
        board-station with no board configured writes nothing and exits 0
        board-station reports a BoardError on stderr naming issue and station and exits 0
        board-station rejects a missing argument with exit 2
        board-station outside a harness root writes nothing and exits 0
        board-station with github.sync false writes nothing and exits 0
        board-station exits 0 when set_station raises a non-BoardError exception

      THE LAST THREE COVER SPECIFIED BRANCHES THAT NOTHING ELSE WOULD EVER EXERCISE, and they are
      why the case list is seven rather than four. The no-harness-root case runs the tool from a
      directory no ancestor of which holds .harness/team-config.yaml, and asserts exit 0 with no
      board call recorded by the fake. The sync-off case stages a harness.json whose github.sync is
      false and asserts the same. The non-BoardError case makes the board write raise something
