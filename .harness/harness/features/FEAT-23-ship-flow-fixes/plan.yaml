tasks:
  - id: T-01
    title: gh-sync ship and abandon record the terminal status in feature.json
    traces: [REQ-01, REQ-02]
    absorbs: ["#417"]
    change_type: bugfix
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/gh-sync.py
      - .claude/skills/harness/bin/test-gh-sync.py
    verify: |
      out=$(python3 .claude/skills/harness/bin/test-gh-sync.py 2>&1); rc=$?
      say() { printf '%s\n' "$out"; }
      say | grep -qF "ok    ship records feature.json status Done" || { echo "T-01: the ship status case did not pass or did not run"; exit 1; }
      say | grep -qF "ok    abandon records feature.json status Abandoned" || { echo "T-01: the abandon status case did not pass or did not run"; exit 1; }
      say | grep -qF "ok    ship closes the milestone regardless of parent origin" || { echo "T-01: the pre-existing milestone case vanished"; exit 1; }
      say | grep -qF "ok    ship leaves an adopted parent open" || { echo "T-01: the pre-existing adopted-parent case vanished"; exit 1; }
      say | grep -E "^FAIL" && { echo "T-01: a case failed"; exit 1; }
      test "$rc" = 0 || { echo "T-01: the suite exited $rc"; exit 1; }
      echo "T-01 GREEN"
    intent: |
      Two subcommands of .claude/skills/harness/bin/gh-sync.py close a feature out on GitHub but
      leave the feature's own recorded state pre-terminal, so the first gate run on merged main is
      red until somebody lands a one-field follow-up commit. This has happened on FEAT-20, FEAT-21
      and FEAT-22. Fix both, and add the cases that prove it.

      WHAT MUST BE TRUE AFTERWARDS

      1. cmd_ship, after it has closed the milestone and resolved the parent, sets feature.json's
         top-level status key to the exact string Done.
      2. cmd_abandon, after it has closed the sub-issues, the milestone and the parent, sets
         feature.json's top-level status key to the exact string Abandoned.
      3. Both spellings are exact and case-sensitive. INV-26's terminal exemption in check-state.sh
         and the parent rule at gh-sync.py:172 both compare against Done and Abandoned literally,
         and DEC-192 makes that case sensitivity deliberate. Do not lowercase, alias or translate.
      4. Neither write happens on a path that exits early — and the way to guarantee that is
         STRUCTURAL, not a guard of your own. skip() calls sys.exit(0), so reaching the end of a
         subcommand body is itself the proof that no early-exit branch fired. Write the status as
         the last statement of each subcommand's successful path, after the close has run. Do NOT
         re-test the milestone before writing: the two guards are not the same shape. cmd_ship
         exits on milestone is None, but cmd_abandon exits only on milestone is None AND no
         recorded issues — a CONJUNCTION, observed at b7ae135. A milestone-gated write would leave
         a feature abandoned with issues but no milestone sitting at Review, which is precisely the
         defect this task exists to end, and none of the prescribed fixtures would catch it because
         they all stage a milestone.
      5. The write reuses the atomic shape already in this file. save_recorded at gh-sync.py:418
         loads the whole document with json.load, mutates one key, dumps to a tempfile created in
         the same directory, fsyncs and os.replace-s it onto feature.json, so no observer ever sees
         a partial or zero-byte file. Factor out the ATOMIC WRITE ONLY — serialise, tempfile in the
         same directory, fsync, os.replace — and call that helper from all three sites rather than
         writing a third copy of it. The read-and-decide policy does NOT move into the helper:
         save_recorded deliberately starts from an empty document when feature.json is absent,
         because the first-sync path needs it, and the status write must never create a document
         that way. feature-schema.json requires eight top-level keys with additionalProperties
         false (DEC-191), so a fresh single-key document fails CI, and a write that drops or adds a
         key fails it too. Every other top-level key must survive untouched.
      6. A feature.json that is absent or unreadable is not an error here. Both subcommands are
         idempotent and the mirror never gates: if the file cannot be read, print one plain line and
         carry on with exit 0. Do not raise. This item is about the STATUS write only and is not
         licence to relax load_recorded, whose existing behaviour stays as it is.
      7. The docstrings of cmd_ship and cmd_abandon both currently end with the sentence that
         feature.json is untouched. That sentence becomes false with this change. Correct it in
         both, and grep the whole file for any other statement of the same claim and correct those
         too, so the file does not end up asserting both things. The sweep extends to the OTHER file
         this task edits: the comment above the abandon-no-origin case in test-gh-sync.py, which
         reads that cmd_abandon must write no receipt, becomes stale for the same reason. Correct
         the comment only — the behavioural assertion below it reads the github block, so it
         survives a top-level status write and must not be changed.

      THE TESTS, in .claude/skills/harness/bin/test-gh-sync.py

      Add two cases using the file's own existing helpers stage(), write_feature_json(), run() and
      read_feature_json(). Do not build new fixture machinery. Each case stages a feature whose
      feature.json is SCHEMA-VALID AND FULLY POPULATED, and that is a requirement of the fixture, not
      a nicety. Stage all eight keys feature-schema.json requires — feature_id, branch, pr, status
      set to Review, review_sha, cycles_used, max_total_cycles and runs — plus a github block with
      milestone 7, parent 41, parent_origin created, attached as a LIST OF STRINGS (the schema types
      github.attached as an array of string, observed at b7ae135, so a bare true is schema-invalid
      and load_recorded drops it silently) and one recorded issue in the issues map. Then run the
      subcommand against the fake gh, read feature.json back and assert the status field.

      The two case labels must be exactly these strings, because the task's verify greps for them:
        ship records feature.json status Done
        abandon records feature.json status Abandoned

      Add a third case asserting that every other top-level key present before the subcommand ran
      is still present and unchanged afterwards, so a regression that rewrites the document instead
      of mutating one key is caught here rather than by CI's schema validation. That assertion is
      only as strong as the document it runs over: against a two-key fixture it passes vacuously, so
      this case uses the fully populated fixture above and its survival claim then quantifies over
      the real key set.

      Do not register a new file anywhere: test-gh-sync.py already exists and is already listed in
      the integration bucket of run-unit-tests.sh.

      RED-RUN EVIDENCE this task must reproduce and then invert: at b7ae135 both new assertions were
      observed to fail, with gh-sync exiting 0 and the status still reading Review. The receipt is
      .harness/harness/features/FEAT-23-ship-flow-fixes/notes/research-FEAT-23-verify-red-runs.md.

  - id: T-02
    title: Ship the four-angle simplify methodology as a harness skill
    traces: [REQ-05, REQ-06]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: >-
      check-domain.sh --resolve returned NOBODY for .claude/skills/harness-simplify/SKILL.md at
      b7ae135; no persona is granted any path under .claude/skills, so a dispatched write would be
      refused mid-run.
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness-simplify/SKILL.md
    verify: |
      S=.claude/skills/harness-simplify/SKILL.md
      test -f "$S" || { echo "T-02: $S does not exist"; exit 1; }
      for a in REUSE SIMPLIFICATION EFFICIENCY ALTITUDE; do
        grep -qE "^## .*$a" "$S" || { echo "T-02: no heading for angle $a"; exit 1; }
      done
      grep -qF "research-FEAT-23-simplify-angles-source.md" "$S" || { echo "T-02: the skill does not cite its in-repo source note"; exit 1; }
      grep -qF "plan surface" "$S" || { echo "T-02: the plan-surface variant is absent"; exit 1; }
      grep -qF "code surface" "$S" || { echo "T-02: the code-surface variant is absent"; exit 1; }
      grep -qF "four separate, parallel, read-only dispatches" "$S" || { echo "T-02: the skill does not pin the dispatch discipline; the literal <four separate, parallel, read-only dispatches> is absent, so a one-reviewer checklist would pass"; exit 1; }
      grep -qF "harness-validator-lead" "$S" && { echo "T-02: the skill names the validator lead"; exit 1; }
      grep -qF "code-simplifier" "$S" && { echo "T-02: the skill names the out-of-repo code-simplifier plugin"; exit 1; }
      echo "T-02 GREEN"
    intent: |
      Write a new skill at .claude/skills/harness-simplify/SKILL.md that carries the four-angle
      quality pass as a shipped, repository-native procedure. Today the methodology exists only as
      one session's dispatch prompts; nothing in the repository holds it, so it cannot be run
      without the operator reconstructing it from memory.

      THE SOURCE, and the only source. Read
      .harness/harness/features/FEAT-23-ship-flow-fixes/notes/research-FEAT-23-simplify-angles-source.md.
      It holds all eight dispatch prompts verbatim: four over a plan surface and four over a code
      surface. Port the angles from there. Do NOT invent a fifth angle, do NOT rename the four, and
      do NOT port anything from the code-simplifier plugin agent file, which is generic guidance
      containing none of the four angles and which ships outside this repository.

      STRUCTURE. Open with YAML frontmatter in the shape every sibling carries — measured at
      b7ae135, all 21 directories matching .claude/skills/harness-*/SKILL.md begin with a fenced
      frontmatter block holding a name and a description, the name matching the directory. So:
      name harness-simplify, and a description saying what the pass is and when to run it, in the
      when-to-use voice the siblings use. Then a first-level heading in their style.

      Then four second-level headings, one per angle, each heading containing the angle's name
      in capitals so the verify can find it: REUSE, SIMPLIFICATION, EFFICIENCY, ALTITUDE. Under each
      angle, state what it looks for on a plan surface and what it looks for on a code surface. The
      literal phrases "plan surface" and "code surface" must both appear. Cite the source note by
      filename in the skill so a later reader can reach the original prompts.

      WHAT EACH ANGLE ASKS, distilled from the source prompts, not restated from them:
        REUSE — flag work that re-implements something the tree already has, naming the existing
        helper by file and line and the concrete cost of two spellings drifting.
        SIMPLIFICATION — flag unnecessary complexity: the same fact asserted twice through different
        spellings, one rule restated in two places that can drift, dead references to shapes that no
        longer exist, and pipelines with simpler equivalents THAT PRESERVE the anchoring semantics
        the original fought for.
        EFFICIENCY — flag wasted work the change would actually do, costed honestly. Judge minutes
        and hot-path milliseconds; deliberate full-suite runs at boundary steps are not waste.
        ALTITUDE — judge depth: is the capability at the right home, is there one authoritative
        statement or N that can drift, are the accepted residuals right to accept, and for each
        finding give an explicit recommendation of fold-in, briefing-row, or leave.

      THE DISCIPLINE the skill must state plainly:
        - Each angle is a SEPARATE read-only dispatch. They run in parallel and none of them edits.
          The value came from four independent readers, not one reader with four checklists. The
          skill must contain this literal string, byte-exact, because the verify greps for it and a
          skill that lists the four angles as one reviewer's checklist would otherwise pass the whole
          clause:
            four separate, parallel, read-only dispatches
        - WHO THE FOUR READERS ARE, stated so the lead never has to invent it mid-run. They are
          drawn from the eng squad by adjacency to the domains the diff touches — one spawn per
          angle, four spawns, each read-only. The lead does not read the angles itself and does not
          collapse two angles into one spawn; a squad smaller than four angles still gets four
          spawns, with the nearest specialist taking more than one angle in separate dispatches.
        - Each finding is: file, line, summary, cost, and the concrete alternative. An empty return
          is a real and expected result; say so, so a reviewer does not manufacture findings.
        - Every dispatch names its scope as a concrete diff or file set, and names what is already
          settled and therefore NOT flaggable. A signed decision re-litigated as a finding is noise.
        - On a plan surface the pass is FLAG-ONLY and the findings go back to harness-pm, which
          applies them to its own draft. No other seat may edit plan.yaml or BRIEF.md: the domain
          guard grants those to harness-pm alone, and this is forced, not stylistic (D-03).
        - On a code surface the findings are applied by the build side, by whichever specialist owns
          the touched file, and the suites are re-run after the apply. Where two specialists both
          hold a touched path — bin/ resolves to backend-dev AND dev-ops — the lead picks one and
          records which it picked and why in the segment digest. That is a rule, not a habit: an
          unattributed pick is unreviewable.
        - THE BRANCH FOR SURFACES NOBODY OWNS, and it is not optional. Where the domain guard
          resolves a touched path to NOBODY, the finding is FLAG-ONLY: it is returned to the
          orchestrator with its concrete alternative and is not applied by the pass. No apply is
          attempted, because a dispatched write to an ungranted surface is refused mid-run and the
          segment returns with nothing applied and the findings lost. This is the same shape the
          plan surface already gets, for the same reason. Say plainly in the skill that this is an
          implementation gap in the rule that the simplify pass is a build-side step applied before
          review_sha pins — it does not weaken that rule, and it does not move the step.
        - The pass is NEVER run by harness-validator-lead or by any validator-squad member. The
          fixer is never the judge; the validator's authority comes from being read-only on source.
          Do not name harness-validator-lead anywhere in the file, including as a negative example,
          because the verify asserts its absence as the cheapest available proof of this rule.
        - The skill depends on nothing outside this repository. Name no plugin, no slash command and
          no file outside the tree. In particular the string code-simplifier must not appear
          anywhere in the file, not even in a sentence disclaiming it: the verify asserts its
          absence, and a disclaimer would redden correct work.

      Keep it about one screen of prose plus the four angle sections. It is read on demand at the
      point of use, not preloaded.

  - id: T-03
    title: Sequence the simplify step into the build and plan playbooks
    traces: [REQ-03, REQ-04, REQ-06]
    absorbs: ["#430"]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: >-
      check-domain.sh --resolve returned NOBODY for both .claude/skills/harness/SKILL.md and
      .claude/commands/harness-plan.md at b7ae135.
    depends_on: [T-02]
    status: pending
    files:
      - .claude/skills/harness/SKILL.md
      - .claude/commands/harness-plan.md
    verify: |
      K=.claude/skills/harness/SKILL.md
      P=.claude/commands/harness-plan.md
      for anchor in "the build is not done until the matrix" "is pinned before any validator run"; do
        n=$(grep -cF "$anchor" "$K")
        [ "$n" = 1 ] || { echo "T-03: anchor <$anchor> occurs $n times in $K, expected exactly 1 — ANCHOR DRIFT, not a work failure"; exit 1; }
      done
      qa=$(grep -nF "the build is not done until the matrix" "$K" | cut -d: -f1)
      pin=$(grep -nF "is pinned before any validator run" "$K" | cut -d: -f1)
      simp=$(grep -nF "SIMPLIFY, the last build step" "$K" | head -1 | cut -d: -f1)
      test -n "$simp" || { echo "T-03: $K carries no simplify step; the marker SIMPLIFY, the last build step is absent (qa=$qa pin=$pin)"; exit 1; }
      test "$qa" -lt "$simp" -a "$simp" -lt "$pin" || { echo "T-03: the simplify step at line $simp is not between qa=$qa and pin=$pin"; exit 1; }
      grep -qF "harness-simplify" "$K" || { echo "T-03: the build step does not name the skill"; exit 1; }
      grep -qE "squad plans,.*simplif.*eng-lead reviews architecture" "$P" || { echo "T-03: $P does not sequence the simplify pass between the plan draft and the architecture review"; exit 1; }
      grep -qF "harness-simplify" "$P" || { echo "T-03: the plan step does not name the skill"; exit 1; }
      echo "T-03 GREEN"
    intent: |
      Put the four-angle simplify pass into both playbooks, at the two positions the operator ruled
      on issue #430. Today it is run ad hoc and has twice landed too late to change anything: on
      FEAT-20 after the validator PASS, which invalidated a pinned verdict, and on FEAT-22 after the
      signature, where zero findings could be applied.

      EDIT 1 — the build flow, in .claude/skills/harness/SKILL.md, inside the numbered loop step
      that sequences the qa segment. Insert the new step AFTER the sentence ending "the build is not
      done until the matrix passes" and BEFORE the sentence "The INV-6 pin above applies unchanged:
      review_sha is pinned before any validator run." Each of those two sentences occurs exactly
      once; the verify asserts that uniqueness and reports anchor drift distinctly from a work
      failure, so if either sentence has moved or been reworded, stop and report rather than
      guessing a new home.

      THE TWO ANCHORS ARE NOT ADJACENT, and inserting between them literally is a trap. The qa
      sentence ends mid-line, and a THIRD sentence — the one saying the step is not part of the
      build team because a team is single-squad (DEC-118) — closes that same line before the pin
      sentence begins. Insert AFTER the DEC-118 sentence and leave that line intact; do not split
      it. The verify orders line numbers only and is green either way, so nothing would catch an
      orphaned half-sentence.

      The inserted text must contain the literal marker phrase, exactly:
        SIMPLIFY, the last build step
      and must state, in the file's own voice:
        - It runs once the qa matrix is green and before review_sha is pinned. That order is the
          whole point: run it after the pin and the apply commit moves the tip and invalidates the
          verdict the panel just gave.
        - The orchestrator sequences it as its own squad segment, dispatched to harness-eng-lead,
          which runs the four angles as four parallel read-only passes — one spawn per angle, drawn
          from the eng squad by adjacency to the domains the diff touches — and then routes the
          apply to the specialist that owns each touched file. Where the domain guard resolves a
          touched path to NOBODY, that finding is FLAG-ONLY and returns to the orchestrator instead
          of being applied; attempting the apply there is refused mid-run and loses the finding.
          It is a squad segment rather than part of the
          build team because a team is single-squad by construction (DEC-118), and the same
          reasoning already makes the qa segment orchestrator-sequenced.
        - The procedure is .claude/skills/harness-simplify/SKILL.md. Name it by path; it is read at
          the point of use and is deliberately not preloaded on any agent.
        - The suites are re-run after the apply, before the pin.
        - THE APPLY MAY NOT DELETE OR WEAKEN AN ASSERTION. The step runs after the qa gate has
          PASSed, and the qa gate is more than a green suite — it is the test-matrix judgement and
          coverage adequacy, which nothing re-assesses afterwards. So a finding of the form "this
          conjunct asserts the same fact twice" becomes a backlog row, never an apply. Everything
          else about the step's position is unchanged.
        - THE APPLY HAS A CEILING OF ONE FIX. If the apply reddens the suites and one fix does not
          restore green, revert the apply and file the finding as a backlog row. This is the only
          permanent build step with no max_cycles of its own — that value lives in a team file and
          this is an orchestrator-sequenced squad segment — so without the ceiling the loop is
          unbounded at the last step before the pin.
        - It is never dispatched to the validator lead.
        - An empty pass is a real outcome. Nothing is invented to justify the step.

      EDIT 2 — the plan flow, in .claude/commands/harness-plan.md, in the Target state bullet. Its
      sequence currently sits on ONE line reading, verbatim: product-lead's squad plans, eng-lead
      reviews architecture, ui-reviewer checks the design contract.

      Insert the simplify segment between the first and second of those, ON THAT SAME LINE. Leave
      the two existing clauses byte-identical: the text "squad plans," and the text "eng-lead
      reviews architecture" are both anchors the verify matches, and rewording either one reddens
      the clause even though the work was done. So the line becomes: product-lead's squad plans, the
      eng squad runs the four-angle simplify pass over the plan surface, eng-lead reviews
      architecture, ui-reviewer checks the design contract. Name
      .claude/skills/harness-simplify/SKILL.md in the bullet.

      State on that bullet that the plan-surface pass is FLAG-ONLY: the findings return to
      harness-pm, which applies them to its own draft before the signature. This is not a style
      choice — check-domain.sh grants plan.yaml and BRIEF.md to harness-pm alone, so any other seat
      applying them would be refused mid-run (D-03). And it is the entire point of moving the pass
      earlier: on FEAT-22 the pass ran after the signature and not one finding could be applied.

      Keep both edits short. These are two of the most-read files in the repository and CLAUDE.md's
      context-budget constraint binds here.

  - id: T-04
    title: Record DEC-195 and DEC-196 and regenerate the decisions index
    traces: [REQ-07, REQ-09]
    change_type: docs
