      prove item 6's widened catch; without it item 1's exit contract is asserted and never tested.

      THE FAKE-BINARY TRAP, and it is not optional. gh_board.py's module docstring records it:
      factory_gh.run_gh finds gh through the FACTORY_GH environment variable. A test that injects a
