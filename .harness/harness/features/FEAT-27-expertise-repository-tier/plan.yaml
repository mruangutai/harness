decisions:
  - id: D-01
    choice: >-
      inject-expertise.sh injects EVERY repository tier it finds by globbing
      .harness/*/expertise/<agent>.md, each under its own header naming the path segment, rather
      than selecting one repository from the spawn payload.
    because: >-
      the hook receives only agent_type and nothing tells it which repository the spawn serves;
      the alternatives were reading fleet.yaml to pick a segment, which is a no-touch surface this
      cycle and would give a hook that must never block a spawn a YAML parse dependency, and an
      environment variable, which nothing in the spawn path sets. The cost, stated in full: every
      repository tier present on disk rides every spawn, nested spawns included, so the per-spawn
      payload is 40 lines times N, not 40. N is the number of first-level directories under
      .harness/ that hold an expertise/ subdirectory, and because the glob is over .harness/*/ it
      counts every such directory, not only fleet-declared repository segments. Measured at ada8e99
      the tree has five first-level directories under .harness/ — expertise, factory, harness, logs,
      notes — of which only harness will hold a tier after T-04, so N is 1 today and grows by one
      per repository the control plane takes on. At ten repositories that is 400 lines on top of
      craft 150, global 150 and the 80-line codebase index, on every spawn, and nothing in the tree
      measures total injected size. The segment filter T-02 adds, [a-z0-9-]+, is name hygiene only:
      it keeps traversal and shell metacharacters out of the emitted header, and it does NOT stop a
      legitimately named stray such as .harness/backup/expertise/harness-qa.md from being injected
      into every qa spawn. Only the aggregate bound covers that. Revisit trigger: unit 7, when
      grants become repo-aware and the hook can be told which segment a spawn serves. A hook-side
      aggregate cap across all repository blocks is available then and is deliberately not built
      now, because a cap that silently truncates an unpredictable subset of blocks is worse than a
      bound the operator signed with its multiplier visible.
    dec: none
  - id: D-02
    choice: >-
      the repository-tier grant is written as the per-repository wildcard
      .harness/*/expertise/harness-<agent>.md, not pinned to the harness segment.
    because: >-
      harness_boundary.glob_to_re emits a no-slash-crossing class for a single star
      (harness_boundary.py:56-57), measured at ada8e99, so .harness/*/expertise/harness-<agent>.md
      cannot reach .harness/a/b/... and still isolates by agent and by exactly one segment. A second
      isolation property holds too: select_base filters control-plane globs out entirely in a
      product base (harness_boundary.py:200-205), so this grant can never reach a product
      checkout's own .harness/. The wildcard is chosen for symmetry with D-01's read side, which
      globs .harness/*/, and to avoid widening sixteen grant lines a second time at unit 7. It is
      NOT justified by issue 372: pinning the segment to harness would close 372 completely, and a
      second repository's tier is unwritable today regardless of what this line says. The cost,
      stated: per-repository write isolation is forfeited until unit 7 makes grants repo-aware, and
      that isolation is unreachable today anyway because the guard sees only agent_type.
    dec: none
  - id: D-03
    choice: >-
      the sixteen entries flagged by the token scan are adjudicated at plan time, and the eleven
      ruled repository-specific are moved by one main-session-direct task, rather than by
      distillation dispatches to the owning agents. The other five are ruled craft and are not
      moved: sixteen flagged, eleven moved, five left where they are.
    because: >-
      the guard grants each craft file to its owning agent alone and three of the six owners are
      not dispatchable task executors; the harness-expertise rule preloaded into every agent also
      trains them to refuse a mid-run Expertise write, so a normal dispatch would correctly return
      BLOCKED. The operator's signature on this plan is the human ruling that issue 340 requires.
    dec: none

tasks:
  - id: T-01
    title: Grant every agent its repository-tier Expertise path in the team manifest
    traces: [REQ-02]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: >-
      check-domain.sh --resolve prints NOBODY for .harness/team-config.yaml at ada8e99, and the
      file is the enforcement data check-domain.sh itself reads
    depends_on: []
    status: pending
    files:
      - .harness/team-config.yaml
    verify: |
      set -u
      R=.claude/skills/harness/bin/check-domain.sh
      fail=0
      for a in harness-orchestrator harness-product-lead harness-eng-lead harness-validator-lead \
               harness-pm harness-visual-designer harness-documentor harness-frontend-dev \
               harness-backend-dev harness-ai-dev harness-data-engineer harness-dev-ops \
               harness-qa harness-code-reviewer harness-security-reviewer harness-ui-reviewer; do
        repo=$($R --resolve ".harness/harness/expertise/$a.md")
        craft=$($R --resolve ".harness/expertise/$a.md")
        [ "$repo" = "$a" ] || { echo "FAIL repo-tier $a resolved to [$repo]"; fail=1; }
        [ "$craft" = "$a" ] || { echo "FAIL craft $a resolved to [$craft]"; fail=1; }
      done
      other=$($R --resolve ".harness/kaya/expertise/harness-qa.md")
      [ "$other" = "harness-qa" ] || { echo "FAIL second segment resolved to [$other]"; fail=1; }
      deep=$($R --resolve ".harness/a/b/expertise/harness-qa.md")
      [ "$deep" = "NOBODY" ] || { echo "FAIL two-segment path resolved to [$deep]"; fail=1; }
      [ "$fail" = 0 ] && echo ALL-GRANTS-OK
      exit $fail
    intent: |
      Edit .harness/team-config.yaml so every agent that already holds a craft Expertise grant also
      holds a repository-tier grant.

      For each of the sixteen agents that currently carry a line of the form

        - { path: .harness/expertise/harness-<agent>.md, upsert: true }

      add, immediately beneath it, a sibling line

        - { path: .harness/*/expertise/harness-<agent>.md, upsert: true }

      with a trailing comment reading: repository tier, 40-line budget.

      The star is deliberate and its behaviour is measured: harness_boundary.matches does not let a
      single star cross a slash, so this grants exactly one path segment and exactly that agent's
      own file. Do not write .harness/**/expertise/, and do not pin the segment to harness.

      Sixteen agents carry a craft grant at ada8e99, including harness-frontend-dev, which has a
      grant but no craft file on disk yet. Work from the grep result, not from a remembered list:
      every line matching .harness/expertise/harness- gets a sibling, and there must be sixteen of
      each afterwards.

      Leave the top-level paths: block ALONE. An earlier draft of this task added
      expertise_repo: .harness/*/expertise/ there; it is dropped deliberately, because no code
      reads that key and this task's verify cannot assert it — unverified prose inside enforcement
      data is worse than an absent key, and the repository path is already stated in the sixteen
      domain lines, in SPEC.md (T-05) and in README.md (T-05). Do not re-add it.

      Change nothing else in the file. In particular do not touch any domain: entry that is not an
      expertise path, and do not reorder existing entries.

      Note for the write: this file is loaded with safe_load and one unquoted hash inside a plain
      scalar has already broken a resolver here. Keep every added comment after a value, never
      inside one.

  - id: T-02
    title: Add the repository-tier read path to the spawn injection hook, with its own budget and a test
    traces: [REQ-01, REQ-05]
    change_type: logic
    execution_mode: team
    execution_agent: harness-dev-ops
    execution_reason: none
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/inject-expertise.sh
      - .claude/skills/harness/bin/test-inject-expertise.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      set -u
      out=$(.claude/skills/harness/bin/run-unit-tests.sh --kind unit 2>&1)
      echo "$out"
      echo "$out" | grep -q '^PASS test-inject-expertise.py$' || exit 1
      echo "$out" | grep -q '^FAIL ' && exit 1
      exit 0
    intent: |
      Give inject-expertise.sh a third read path and build the test it has never had.

      PART 1 — the hook, .claude/skills/harness/bin/inject-expertise.sh.

      Today it reads exactly two files (lines 27-29 at ada8e99): $HOME/.harness/expertise/$agent.md
      emitted under the header "## Your Expertise — cross-project craft (global tier)", and
      $root/.harness/expertise/$agent.md under "## Your Expertise — this codebase (project tier,
      authoritative on conflict)". Keep both read paths and their order. CHANGE the second header,
      and add a precedence line — see 1a, which is the part of this task with the largest blast
      radius.

      1a — HEADERS LABEL SCOPE, PRECEDENCE IS STATED ONCE BY NAME.
      The shipped project header claims "authoritative on conflict". A repository header claiming
      "most specific" would contradict it, and those headers are the only interface an agent has
      for arbitrating between two blocks of instructions — an agent following craft where a
      repository rule applied fails silently and no gate can see it. Position cannot carry the rule
      either: once two segments are present, ordering decides precedence by alphabetical accident.

      So: label each block by SCOPE only, and state precedence once, in words.

      The three headers become exactly:

        ## Your Expertise — cross-project craft (global tier)
        ## Your Expertise — this checkout's craft (project tier)
        ## Your Expertise — <segment> repository (repository tier)

      The first is unchanged. The second loses "authoritative on conflict" — remove that phrase from
      the script entirely. The third is new.

      Immediately BEFORE the first repository block — and only when at least one repository block
      will be emitted, because with no repository tier there is nothing to arbitrate — emit this
      line verbatim, followed by a blank line:

        Expertise precedence: repository over project over global, by specificity. A repository
        block whose segment is not the one you were dispatched against is not authoritative for
        your work — read the segment name.

      Emit it as ONE line of output (no internal newline); it is wrapped here only for this
      document. Emit it exactly once per spawn even when several repository blocks are present.
      The second sentence is not optional: the hook cannot know which repository a spawn serves, so
      it must tell the agent to check the segment itself.

      1b — THE REPOSITORY BLOCKS.
      After the two craft blocks, and before the codebase-map index block, emit every repository
      tier found by globbing $root/.harness/*/expertise/$agent.md, in sorted order by segment name.
      For each hit, derive the segment as the directory name between .harness/ and /expertise, and
      emit the header form above, followed by a blank line and the file body, then two newlines,
      exactly as the two existing blocks do. Repository blocks come last because they are the most
      specific tier and the precedence line says so; do NOT justify the order by later text
      carrying more weight, and do not leave that rationale anywhere in the script.

      Update the script's own comment above the emit group (lines 56-57 at ada8e99, "project wins
      on conflict, and later text carries more weight, so ordering encodes the precedence rule") —
      it is false after this change. Replace it with a comment saying precedence is stated
      explicitly in the emitted precedence line, and ordering is presentation only.

      Use a plain shell glob with nullglob semantics or an [ -r "$f" ] guard inside the loop, so a
      non-matching glob never emits a literal star as a filename. Do not read fleet.yaml,
      harness.json or team-config.yaml: this hook fires on every SubagentStart including nested
      spawns and must never block, and it must not acquire a YAML parse dependency.

      1c — VALIDATE THE AGENT NAME BEFORE ANY PATH IS BUILT.
      Today the script accepts any agent matching the shell case pattern harness-* and interpolates
      it straight into two fixed paths. The new glob widens that: agent_type values containing a
      slash, a dot-dot or a shell metacharacter now reach a globbed path. Before building any path,
      require the agent to match the extended-regex anchor ^harness-[a-z0-9-]+$; anything else
      exits 0 with no output, exactly as a non-harness agent does today. Note precisely what this
      buys, and do not overstate it in any comment: it is name hygiene for the value interpolated
      into paths and headers. It does not filter which directories under .harness/ are injected —
      a stray but legitimately named directory is still read, and that cost is D-01's, not this
      filter's.

      1d — SEGMENT NAMES.
      Skip any globbed hit whose derived segment does not match ^[a-z0-9-]+$, for the same
      interpolation-hygiene reason and no other. Skipping is silent; the hook never warns and never
      blocks.

      cap_body currently hardcodes 150. Change it to take the budget as its second argument:
      cap_body <file> <budget>. Call it with 150 for the two craft blocks and with 40 for every
      repository block. The truncation notice must name the budget it actually applied, so it reads

        [TRUNCATED at 40 lines — this Expertise file violates its budget; distillation is overdue (DEC-145)]

      for a repository tier and keeps saying 150 for craft. A notice naming the wrong number tells
      an agent to curate to a budget that is not its own.

      The script must still exit 0 on every path, and must still emit nothing at all when no file
      is readable and no index exists.

      PART 2 — the test, a new file .claude/skills/harness/bin/test-inject-expertise.py.

      Follow the shape of the existing test-check-expertise.py: plain python3, no framework, a
      module-level constant pointing at the script under test overridable by an environment
      variable, temp directories built per case, a printed PASS or FAIL per case, and sys.exit(1)
      if any case failed. Each case invokes the real script as a subprocess with CLAUDE_PROJECT_DIR
      set to a temp root and the hook JSON on stdin, then json.loads stdout and reads
      hookSpecificOutput.additionalContext.

      Cases, all required:

      1. Both tiers present, and the precedence rule. Temp root has .harness/expertise/harness-qa.md
         and .harness/harness/expertise/harness-qa.md with distinguishable bodies. Assert the
         injected context contains the literal substring
         "## Your Expertise — harness repository (repository tier)", contains the repository file's
         body text, and contains the literal project header
         "## Your Expertise — this checkout's craft (project tier)". Assert it contains the literal
         substring "repository over project over global, by specificity" and the literal substring
         "read the segment name". Assert it does NOT contain "authoritative on conflict" and does
         NOT contain "most specific". Assert the precedence substring's index is LESS than the
         repository header's index. This case is the discriminator on two counts: it fails against
         the pre-change hook, which emits no repository header at all and still ships
         "authoritative on conflict".
      2. Two repository segments present (harness and kaya). Assert both segment headers appear,
         both bodies appear, and the harness header precedes the kaya header (sorted order). Assert
         the precedence substring "repository over project over global" occurs EXACTLY ONCE in the
         output — count occurrences, do not test for presence.
      3. No repository tier, craft only. Assert exit status 0, assert the project-tier header
         appears, and assert the string "repository" does NOT appear anywhere in the output — that
         covers both the repository header and the precedence line, neither of which may be emitted
         when there is nothing to arbitrate.
      4. Nothing on disk at all. Assert exit status 0 and stdout is empty or contains no
         hookSpecificOutput.
      5. agent_type missing from the payload, and a payload that is not valid JSON. Assert exit
         status 0 for both and no traceback on stderr.
      6. agent_type is "some-other-agent" (not harness-prefixed). Assert exit status 0 and empty
         stdout, even with expertise files present.
      7. Repository-tier budget. Write a 41-line repository file and assert the output contains
         "[TRUNCATED at 40 lines" and does NOT contain "TRUNCATED at 150". Write a 41-line craft
         file with no repository tier and assert neither truncation notice appears.
      8. A 151-line craft file still truncates at 150 and says so.
      9. The codebase-map index block survives. Temp root has both Expertise tiers AND
         .harness/codebase/INDEX.md with a distinguishable body. Assert the injected context
         contains the literal substring "## Codebase map — index" and the index body, and that its
         index in the string is GREATER than every Expertise header's index. Then a second sub-case
         with INDEX.md present and NO expertise file of any tier: assert exit 0 and that the index
         header and body are still emitted. This block is DEC-137's only delivery path for the
         third knowledge tier and this change edits inside the same emit group, so without these
         assertions a dropped or reordered index block passes every other case.
      10. Repository tier with NO craft tier. Temp root has .harness/harness/expertise/harness-qa.md
         only — no .harness/expertise/harness-qa.md and no global file. Assert exit 0, the
         repository header and body appear, the precedence line appears, and the project-tier header
         does NOT appear. This is a live state, not a hypothetical: harness-frontend-dev holds a
         craft grant and has no craft file on disk at ada8e99.
      11. Never blocks, and never parses YAML. Temp root has both tiers plus a
         .harness/team-config.yaml whose contents are deliberately unparseable (an unterminated
         quote and a bare tab-indented line) and NO fleet.yaml anywhere. Assert exit status 0, that
         the full injection is present — both headers, both bodies, the precedence line — and that
         stderr contains no traceback. The intent's constraint that this hook acquires no YAML parse
         dependency is otherwise only prose, and nothing reddens if a successor adds one.
      12. Agent-name validation. Invoke with agent_type values "harness-", "harness-qa/../../etc",
         "harness-*" and "harness-qa;id", with expertise files present on disk for harness-qa.
         Assert exit status 0 and EMPTY stdout for each — none matches ^harness-[a-z0-9-]+$ — and
         assert no file body text appears in the output for any of them.

      Case bodies must avoid incidental collisions with the strings the cases assert absent: in
      particular case 3's craft body must not itself contain the word "repository".

      Do not renumber cases 1-8; the BRIEF cites case 3 by ordinal.

      PART 3 — registration. Add "test-inject-expertise.py" to the UNIT_SCRIPTS array in
      .claude/skills/harness/bin/run-unit-tests.sh. The runner has a drift detector that exits 2 on
      any test-*.py not present in one of its two arrays, which would redden every other task's
      verify, so this must land in the same commit as the test file.

  - id: T-03
    title: Give the expertise checker the repository-tier budget and the advisory craft-token scan
    traces: [REQ-04]
    change_type: cross_module
    execution_mode: team
    execution_agent: harness-dev-ops
    execution_reason: none
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/check-expertise.sh
      - .claude/skills/harness/bin/test-check-expertise.py
    verify: |
      set -u
      out=$(.claude/skills/harness/bin/run-unit-tests.sh --kind integration 2>&1)
      echo "$out"
      echo "$out" | grep -q '^PASS test-check-expertise.py$' || exit 1
      echo "$out" | grep -q '^FAIL ' && exit 1
      live=$(.claude/skills/harness/bin/check-expertise.sh .harness/expertise/ 2>&1)
      rc=$?
      echo "$live"
      [ "$rc" = 0 ] || { echo "live craft dir no longer exits 0"; exit 1; }
      echo "$live" | grep -q '^ADVISORY ' || { echo "no advisory line on the live craft dir"; exit 1; }
      exit 0
    intent: |
      Two changes to .claude/skills/harness/bin/check-expertise.sh, plus the cases that prove them.

      CHANGE 1 — the line budget becomes per tier. The Python body currently has
      LINE_BUDGET = 150 applied to every file. Replace it with a per-path budget: a file whose path
      matches the craft form, a path ending in .harness/expertise/<name>.md, keeps 150; a file whose
      path matches the repository form, .harness/<segment>/expertise/<name>.md, gets 40. Decide by
      the path, not by a flag: the checker is invoked with bare paths from the distill skill, the
      curate skill and by hand. A path matching neither form keeps 150 and is not an error — the
      checker is also run against files in temp directories by its own tests.

      Classify on os.path.abspath(path), never on the argument as typed. This matters and is not a
      tidiness point: this task's own intent says the checker is invoked by hand, and
      cd .harness/harness/expertise && check-expertise.sh harness-qa.md matches neither form as
      typed, so it would keep 150 and print OK over a 41-line file that is over budget — the new
      budget silently unenforced by the only gate that enforces it. abspath resolves that
      invocation to the repository form. It is compatible with cases 4 and 5 below, which build
      <tmp>/.harness/... paths that abspath preserves, and it keeps the neither-form default for
      genuinely out-of-tree fixtures.

      The over-budget message must name the budget it applied, so a repository file reads
      "41 lines — over the 40-line budget (the spawn hook truncates the rest)".

      CHANGE 2 — the advisory scan that harness-distill already promises. For CRAFT-tier files only,
      report every entry naming a repository-specific token. The token set is issue 340's, verbatim:
      the regex alternation DEC-\d+, INV-\d+, FEAT-\d+, \.harness/, \.claude/, check-[a-z-]*\.sh,
      factory_[a-z]*\.py, gh-sync, harness\.json, team-config.

      Three properties, all mandatory:

      a. It is ADVISORY. It must never make the script exit non-zero and must never be appended to
         the per-file problems list, because that list drives both the FAIL verdict and the exit
         status. Issue 340 rejected a blocking gate explicitly: a legitimate craft entry may cite a
         path as an example, and a false-positive gate teaches the operator to work around it.
      b. It NAMES THE TOKEN. The output line must carry the file, the line number, the entry id and
         the exact matched token, in the form
         ADVISORY <path>:<line>: <id> names '<token>' — repository-layer candidate; rule on it (issue 340)
         Printing a count, or naming only the entry, is not enough: the human ruling on it must see
         the evidence rather than re-derive it.
      c. It is emitted for files that otherwise pass. Today a clean file prints only "OK <path>".
         Advisory lines must print for a clean file too, after the OK line.

      Note that FEAT-\d+ is already a hard violation under the existing FEATURE_TOKEN_RE, so an
      entry naming one produces both a problem and an advisory. That is correct and must not be
      special-cased.

      Repository-tier files are NOT scanned: naming a repository token is what that tier is for.

      CASES — add to .claude/skills/harness/bin/test-check-expertise.py, following its existing
      shape. Every one of these must be present:

      1. Redden proof for the advisory. A craft-form temp file, otherwise valid, whose entry text
         contains DEC-042. Assert exit status 0, assert stdout contains "ADVISORY", assert stdout
         contains the literal "DEC-042", and assert stdout contains "OK " for that file. Then assert
         the same file with DEC-042 removed produces NO line starting with ADVISORY. Both
         directions, so the check is proven able to redden and proven able to stay silent.
      2. One case per token class. Ten temp craft files, each carrying exactly one of the ten token
         forms, each asserted individually to produce an advisory naming that exact token. Assert
         them one at a time — a single file carrying all ten, or a count of advisory lines, is
         satisfied by nine matching and cannot see the tenth.
      3. The advisory never blocks. A craft file carrying a token AND a real format violation exits
         1; a craft file carrying a token and no violation exits 0. Assert the exit statuses
         directly.
      4. Repository-tier files are exempt: a file at <tmp>/.harness/harness/expertise/harness-qa.md
         carrying DEC-042 produces no ADVISORY line.
      5. Budget by tier: a 41-line repository-form file is reported over budget and the message
         names 40; a 41-line craft-form file is not reported; a 151-line craft-form file is reported
         and the message names 150.
      6. Budget by tier under a bare-path invocation. Run the checker with cwd set to
         <tmp>/.harness/harness/expertise and the single argument harness-qa.md, over the same
         41-line repository-form file as case 5. Assert it is reported over budget and the message
         names 40. Without abspath classification this case passes OK and is the documented
         by-hand invocation, so it is the discriminator for CHANGE 1's path rule.

  - id: T-04
    title: Move the eleven adjudicated repository-specific entries into the harness repository tier
    traces: [REQ-03]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: >-
      each craft file is granted to its owning agent alone and three of the six owners are a lead, a
      reviewer and the orchestrator, none of which is a dispatchable task executor, so no single
      doer can be dispatched to move all eleven (see D-03)
    depends_on: [T-01, T-03]
    status: pending
    files:
      - .harness/expertise/harness-backend-dev.md
      - .harness/expertise/harness-dev-ops.md
      - .harness/expertise/harness-documentor.md
      - .harness/expertise/harness-eng-lead.md
      - .harness/expertise/harness-orchestrator.md
      - .harness/expertise/harness-security-reviewer.md
      - .harness/harness/expertise/harness-backend-dev.md
      - .harness/harness/expertise/harness-dev-ops.md
      - .harness/harness/expertise/harness-documentor.md
      - .harness/harness/expertise/harness-eng-lead.md
      - .harness/harness/expertise/harness-orchestrator.md
      - .harness/harness/expertise/harness-security-reviewer.md
    verify: |
      set -u
      python3 - <<'PY'
      import sys, os
      O=".harness/expertise/%s.md"; N=".harness/harness/expertise/%s.md"
