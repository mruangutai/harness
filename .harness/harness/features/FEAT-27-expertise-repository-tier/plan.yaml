    verify: |
      set -u
      fail=0
      R=.harness/README.md
      S=.harness/harness/docs/SPEC.md
      grep -q -F '<repo>/expertise/' "$R" || { echo "FAIL README names no repository tier"; fail=1; }
      grep -q -F 'expertise/<agent>.md' "$R" || { echo "FAIL README lost its craft row"; fail=1; }
