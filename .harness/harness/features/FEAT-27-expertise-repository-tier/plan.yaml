      grep -q -F '40-line' "$S" || { echo "FAIL SPEC does not state the repository budget"; fail=1; }
      grep -q -F '150-line' "$S" || { echo "FAIL SPEC does not state the craft budget"; fail=1; }
      grep -q -F 'repository over project over global, by specificity' "$S" \
        || { echo "FAIL SPEC does not state the precedence rule"; fail=1; }
      grep -q -F 'read the segment name' "$S" \
        || { echo "FAIL SPEC omits the not-your-segment caveat"; fail=1; }
      if grep -n -F 'authoritative on conflict' "$S"; then
        echo "FAIL SPEC still calls the project tier authoritative on conflict"; fail=1
      fi
      if grep -n -F 'carries more weight' "$S"; then
        echo "FAIL SPEC still explains precedence by position"; fail=1
      fi
      for f in "$R" "$S"; do
        if grep -n -E 'expertise/<repo>|\*\*/expertise' "$f"; then
          echo "FAIL a third path form appears in $f"; fail=1
        fi
      done
      [ "$fail" = 0 ] && echo DOCS-OK
      exit $fail
    intent: |
      Two documents describe the Expertise layout and both now understate it.

      .harness/README.md is the layout-and-ownership map for .harness/. Its table uses paths relative
      to .harness/, and at ada8e99 line 18 carries exactly one Expertise row, keyed
      expertise/<agent>.md, described as per-agent durable knowledge injected at every spawn and
      owned by each agent for its own file only. Keep that row and add a SECOND row beneath it, keyed
      <repo>/expertise/<agent>.md, in the same three-column shape. Between the two rows the
      description must convey: craft in the first, 150 lines, true wherever the agent works;
      repository-specific in the second, 40 lines, true of one repository only; the same owner rule
      for both, that agent and its own file alone; and that BOTH are injected at every spawn by the
      SubagentStart hook and neither is ever read by the agent itself.

      .harness/harness/docs/SPEC.md line 806 at ada8e99 says check-expertise.sh enforces the format
      mechanically and that the injection hook hard-truncates. Extend that passage so it states: the
      two tiers and their two paths; the two budgets, 150 for craft and 40 for repository, enforced
      both at authoring time by check-expertise.sh and as a truncation backstop in the hook; that the
      hook injects global craft, then project craft, then every repository tier present; and
      that check-expertise.sh reports craft entries naming a repository-specific token as ADVISORY
      only, never as a violation.

      The precedence rule must be stated in SPEC with the same words the hook emits, and must not be
      stated as an ordering rationale. Write, in the passage's own voice, that each injected block is
      labelled by scope only, that precedence is repository over project over global, by
      specificity, and that because the hook cannot know which repository a spawn serves, a
      repository block whose segment is not the one the agent was dispatched against is not
      authoritative for that agent's work — the agent reads the segment name. Do NOT write that
      later text carries more weight, and do not describe the project tier as authoritative on
      conflict; the hook stops saying both in T-02 and a document that keeps saying either
      contradicts what the agent is handed. The literal phrase "repository over project over global,
      by specificity" must appear in SPEC.md verbatim, because T-02's test asserts the hook emits it
      and this task's verify asserts the document states it.

      Write exactly two path forms and no third. In SPEC use the absolute forms .harness/expertise/
      and .harness/<repo>/expertise/, and state both budgets with the literal words 150-line and
      40-line. In README use the table's existing relative convention, expertise/<agent>.md and
      <repo>/expertise/<agent>.md. Do not write **/expertise or expertise/<repo> in either file.

      Do not restate the token list; point at check-expertise.sh for it. Do not add a decision record
      — this task documents what exists, and the decisions live in the plan and in DECISIONS.md if
      the operator promotes them.

