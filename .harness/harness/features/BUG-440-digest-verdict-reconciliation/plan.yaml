tasks:
  - id: T-01
    title: Add INV-37 to check-state.sh - a completed lead run's digest verdict must equal its feature.json entry
    traces: [REQ-01, REQ-02, REQ-03, REQ-04]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: "DEC-174 carve-out - check-state.sh is the state gate run at every /harness entry and its own tests ride the carve-out with it; the harness plans changes to its enforcement layer and does not dispatch them to a squad."
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/check-state.sh
      - tests/integration/test-check-state.py
      - .harness/harness/features/BUG-440-digest-verdict-reconciliation/notes/redproof-BUG-440.md
    verify: |
      grep -q '^## INV-37 red proof' .harness/harness/features/BUG-440-digest-verdict-reconciliation/notes/redproof-BUG-440.md &&
      grep -q '772790be52774eafe2971f9c44400e18b2d54275' .harness/harness/features/BUG-440-digest-verdict-reconciliation/notes/redproof-BUG-440.md &&
      grep -q 'CHECK_STATE_BIN' .harness/harness/features/BUG-440-digest-verdict-reconciliation/notes/redproof-BUG-440.md &&
      grep -q '^RESULT: RED' .harness/harness/features/BUG-440-digest-verdict-reconciliation/notes/redproof-BUG-440.md &&
      python3 -c "import importlib.util as u, sys; s=u.spec_from_file_location('t','tests/integration/test-check-state.py'); mod=u.module_from_spec(s); s.loader.exec_module(mod); sys.exit(0 if mod.case_bug440_digest_verdict_reconciliation() else 1)"
    intent: |
      Make the state gate refuse a completed lead-hosted run whose durable digest contradicts the
      verdict feature.json records for it. Measured on the control-plane root run tree on 2026-09-06, HEAD at
      772790be52774eafe2971f9c44400e18b2d54275: 308 completed lead-hosted runs carry a digest, all 308
      are structurally valid, 298 of those are CLAIMED by a feature.json runs[] entry and are therefore
      compared (the other 10 run directories are unclaimed and out of scope by construction), and 4 of
      the 298 contradict their entry. Nothing compares them today.

      ORDER OF WORK, and it is not negotiable: write the test case FIRST, observe it RED against the
      pre-change check-state.sh, record that red proof, and only then add the check.

      ---- 1. THE SIDE STRUCTURE (check-state.sh, the feature.json loop at :604-666)

      Before the loop, initialise `run_verdicts = {}`.

      THE RECORDING GOES IMMEDIATELY AFTER THE UNCONDITIONED `runs.append((...))` AT :650-652, AT
      EXACTLY ITS INDENTATION - the statement that runs for EVERY entry of EVERY squad, inside the
      `for entry in (doc.get("runs") or [])` loop at :645-666 and inside NO `if` at all. DO NOT put it
      beside `code_reviewing_runs.append(entry)` at :666: that line sits inside
      `if _squad == "validator" and entry.get("code_grade") != "n_a":` at :665, so recording there
      would capture validator runs only and silently miss every product-squad and eng-squad run -
      including two of the four live mismatches this feature exists to surface
      (FEAT-07/goalcheck-product and FEAT-22/2026-08-16-15-distill-product, both `squad: product`).
      If the line you are about to write is indented deeper than `runs.append((...))`, it is wrong.

      Record, reusing the values already computed for the tuple where convenient:

        run_verdicts.setdefault(os.path.dirname(fy), {}).setdefault(
            str(entry.get("id","")).strip(), []).append(str(entry.get("verdict","")).strip())

      A LIST PER RUN ID, NEVER A SINGLE VALUE (D-07). `runs[]` rows are list items, so two rows may
      carry the same `id` and nothing forbids it: the strict loader's DuplicateKeyError never fires on
      list items, and no invariant asserts run-id uniqueness. Measured 2026-09-06 across the live
      control plane: 65 feature.json files, 1002 `runs[]` entries, duplicate ids in exactly one feature
      (FEAT-45-adversarial-plan-panel, id `2026-08-31-1-validator` twice, both `PASS`, therefore benign
      today). A dict keyed on id would compare one entry per id while the approved contract quantifies
      over ENTRIES.

      DO NOT WIDEN THE `runs` 3-TUPLE. The comment at :640-642 pins it at three because INV-7 and the
      INV-22 loop unpack exactly three; BUG-1080's exemption took its own list for the same reason and
      this takes another. Key on the feature DIRECTORY PATH (`os.path.dirname(fy)`), never the bare
      feature name: the INV-15 loop's glob is `H + "/*/features/*/runs/*/state.yaml"`, so two repos
      under one control plane can carry the same feature name.

      ---- 2. THE CHECK (check-state.sh, inside the INV-15 branch at :1516-1535)

      In that branch, `complete` and `_host in LEADS` are already computed, `dg` is already resolved,
      and the digest is already read and validated. Two changes:

      (a) Read the digest text ONCE into a local (e.g. `_dtext`) and pass that local to
          `_vd_mod.validate("lead", _dtext)`. Do not add a second `open()` of the same file - the
          sweep re-validates the whole run history at every /harness entry, which is why INV-15
          stopped forking an interpreter per run in the first place (:1408-1412).

      (b) In a NEW `else:` arm on the `if _errs:` test at :1532 - that is, ONLY where `_errs` is
          falsy, never the outer `else:` at :1527, which is entered for valid and invalid digests
          alike - so a digest that fails the contract keeps exactly its current single finding and
          gets nothing stacked on top (REQ-03(d)). There, compare the two verdicts:

            _feat_dir = os.path.dirname(os.path.dirname(rundir))   # .../features/<FEAT>
            _rid      = os.path.basename(rundir)
            _recorded = run_verdicts.get(_feat_dir, {})

          If `_rid` is NOT a key of `_recorded`, do nothing and report nothing: the comparison is
          quantified FROM feature.json's runs list, so a run directory the record does not claim is
          out of scope by construction (REQ-03(e)), and a feature whose feature.json is missing or
          unparseable is already reported by the loop above. Test membership explicitly - never a
          `.get()` chain that leaves both sides None and compares equal.

          When `_rid` IS present, extract the digest verdict with the SAME two-step, tail-anchored
          semantics validate-digest.py already implements at :1155-1160, byte for byte, with a
          comment citing those lines:

            _anchors = list(re.finditer(r"^\s*VERDICT:", _dtext, re.M))
            _tail    = _dtext[_anchors[-1].start():] if _anchors else _dtext
            _dm      = re.search(r"^\s*VERDICT:\s*(\S+)", _tail, re.M)

          DO NOT invent a second regex convention and DO NOT restate the legal token set: the
          comparison is plain string equality and needs none. `validate("lead", ...)` has already
          rejected a digest with no VERDICT line (:1161-1162) and one whose token is outside VERDICTS
          (:1163-1164), so in this arm `_dm` is non-None and its group is a legal token - no
          unparseable branch is owed. Guard `_dm` only if you prefer a defensive `if _dm and ...`;
          never report a finding for its absence.

          Compare `_dm.group(1)` against EACH DISTINCT recorded value for that id -
          `for _rv in dict.fromkeys(_recorded[_rid]):`, which preserves order and collapses
          byte-identical duplicates - with EXACT string equality, and emit ONE finding per distinct
          value that differs (D-07). One entry means exactly one comparison and at most one finding,
          which is what fixture M asserts; two rows with the same id and the same verdict still yield
          at most one; two rows contradicting each other yield one finding each, naming its own
          recorded value. Both sides are already `.strip()`ed - the recorded values by step 1, the
          digest token by `(\S+)`. NO case folding, no normalisation, no aliasing: `feature.json` carries values outside VERDICTS in
          the live corpus (two FEAT-22 entries record `INCOMPLETE`) and exact equality is what makes
          those visible.

          On inequality append to `bad` - the BLOCKING list, never `warn` - ONE finding prefixed
          `INV-37:` whose text names all five things: the feature name (`os.path.basename(_feat_dir)`),
          the run id, the digest verdict, the feature.json verdict (`_rv`), and BOTH paths - the digest.md
          path and the feature.json path, each relative to `H` as the neighbouring messages are. Say
          which value came from which record, and that the gate does not decide which one is wrong.
          Write NOTHING: no repair, no rewrite, no move of either file (REQ-04).

      ---- 3. THE CASES (tests/integration/test-check-state.py)

      One new function `case_bug440_digest_verdict_reconciliation()`, registered in `main()` and folded
      into the final `and` conjunction at :4775-4784 - a case that is not in that conjunction never
      gates. Model the fixture builders on `_bug1305_invariant_scaffold` and
      `_bug1305_invariant_feature` (:4502-4557), but parameterise each run by host, status, verdict
      and digest text; the BUG-1305 builders hardcode `verdict: PASS` and a non-lead host.

      THE VALID LEAD DIGEST IS SYNTHETIC AND THE TEST MUST PROVE ITS OWN FIXTURE. No live lead digest
      exists in a worktree (run directories are untracked; this worktree's feature tree has none).
      Build the digest text in the test, import validate-digest.py from `_anchor_bin` the way this
      file already imports siblings, and ASSERT `validate("lead", text) == []` for both the PASS and
      FAIL variants before asserting anything about check-state.sh. Without that assertion a fixture
      that drifts out of validity makes the whole case vacuously green. The lead schema fields are
      branch, cycles_used, escalations, members, must_fix, sc_status, steps_run, team plus the
      universal contract fields; derive the minimal passing text by running
      `.agents/skills/harness/bin/validate-digest.py lead <file>` until it is clean.

      ONE mixed fixture tree, one feature FEAT-TEST, with these runs - each asserted SEPARATELY, never
      by a file-global count alone:
        - M: status complete, host harness-eng-lead, valid digest VERDICT: FAIL, feature.json verdict
             PASS. Expect exit 1 and EXACTLY ONE line containing `INV-37`, and assert SIX separate
             substrings in it: FEAT-TEST, the run id M, FAIL, PASS, the digest.md path, the
             feature.json path.
        - E: complete, harness-product-lead, valid digest VERDICT: PASS, recorded PASS. No `INV-37`
             line naming E.
        - N: complete, host omp, valid digest VERDICT: FAIL, recorded PASS. No `INV-37` line naming N.
        - I: status active, host harness-eng-lead, valid digest VERDICT: FAIL, recorded PASS. No
             `INV-37` line naming I.
        - G: complete, harness-eng-lead, NO digest.md, recorded PASS. Exactly ONE existing
             missing-digest violation for G, and no `INV-37` line naming G.
        - X: complete, harness-eng-lead, digest.md containing `# digest\n` (the invalid shape this
             file already uses at :489-490), recorded PASS. Exactly ONE existing lead-digest-contract
             violation for X, and no `INV-37` line naming X.
        - O: a run DIRECTORY with state.yaml complete + harness-eng-lead + a valid FAIL digest and NO
             entry in feature.json runs. Silent: no `INV-37` line naming O.
      Then assert REQ-04 on this same tree: take a sha256 of feature.json and of every digest.md
      before `run(tmp)` and again after, and assert every pair is equal.

      A SECOND, CLEAN tree containing only run E: assert exit 0 and `INV-37` not in the output. This
      is the control that separates a working check from one that fires on everything.

      ---- 4. THE RED PROOF (notes/redproof-BUG-440.md)

      Prove the new case FAILS against the pre-change script. Use `isolated_bin(dest_root)`
      (.claude/skills/harness/bin/isolated_bin.py:8-14) to copy the whole bin tree into a temp root so
