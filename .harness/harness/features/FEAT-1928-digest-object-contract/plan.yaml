decisions:
  - id: D-01
    choice: Use the YieldTool data mapping as the only live digest contract and render YAML only when the validator appends a lead artifact.
    because: One typed wire value removes the lossy text parser without changing the human-readable durable record.
    dec: DEC-236
  - id: D-02
    choice: Use one in-process TypeScript adapter to read the canonical external-ref persona schemas, resolve and project ref-free structural bundles, and cache those bundles for the OMP extension lifetime.
    because: Python enforces the same files while dispatch avoids per-call processes and providers receive a derived subset rather than a second hand-authored contract.
    dec: DEC-236
  - id: D-03
    choice: Read historical digests by selecting the last fenced YAML mapping and handing its structured keys to legacy consumers without live-schema validation, rewriting, or date grandfathering.
    because: Historical mappings carry durable keys outside the new closed live contract, while live yields and newly appended blocks can remain strictly validated without changing old bytes.
    dec: DEC-236
  - id: D-04
    choice: Remove the host-null repair only after a real disposable OMP run proves that explicit null is rejected and a following valid object completes the same job.
    because: Unit mocks cannot prove host job settlement order at the irreversible deletion boundary.
    dec: DEC-236
  - id: D-05
    choice: Make every enforcement-layer source and owning-test edit main-session-direct and run post-cutover validation from the pre-cutover main checkout against a pinned worktree SHA.
    because: DEC-174 forbids a contract under review from grading its own implementation.
    dec: DEC-174
