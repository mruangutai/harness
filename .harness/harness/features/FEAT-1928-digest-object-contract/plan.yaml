    intent: "Work test-first and keep every source and owning-test edit in the main session under DEC-174. This task is independent of FEAT-70 and must remain runnable while the separately gated plan digest-reader task waits. Before removing any text path, run the baseline validator at baseline SHA against all 135 named CLI cases and every current hook, shadow, claim-lifecycle, and non-plan reader case, then express the same cases as mappings and run the new object validator. Record each case name, old accept or reject result, new accept or reject result, immutable SHAs, commands, and zero mismatches in validator-parity.md. Parser-syntax-only cases must retain their rejection counterpart as a missing, extra, wrong-type, or enum-invalid object case. The permanent tests keep the object cases and consumer semantics, not a baseline checkout, text parser, or compatibility shim.\n\nAdd .omp/extensions/digest-schema.ts as the one in-process provider adapter. Export loadDigestSchemaBundle(schemaDir, persona), backed by one module-lifetime Map keyed by canonical schema directory and canonical persona. The adapter must synchronously read the selected persona JSON file and relative shared JSON files from the canonical digest-schemas directory, resolve external file references plus JSON-pointer fragments with cycle, missing-target, and schema-directory-escape rejection, project the resolved tree to object, array, string, integer, number, boolean, null, properties, required, additionalProperties false, items, enum, and nested nullable anyOf, reject any unsupported surviving keyword or reference, and return the cached ref-free bundle. It derives every field and required set from the JSON files; it must not contain a second hand-authored contract or spawn Python. Tests import this real adapter, load all 16 canonical schemas, assert one recursive structural-keyword whitelist over the complete bundle set, assert cache identity for a repeat load, and exercise actionable malformed JSON, unresolved reference, and unsupported-keyword errors.\n\nIn the task hook, reject dispatcher-supplied outputSchema and schemaMode at both the top level and every tasks item before any claim side effect, naming the forbidden location. For every harness task item, including main, call loadDigestSchemaBundle with the canonical schema directory, inject the returned bundle and schemaMode strict via revisedInput, and preserve unrelated task fields, batching, model rules, and non-harness dispatches. Catch any persona, read, parse, reference-resolution, or projection error and refuse the dispatch before acquiring a claim; never inject a loose fallback. The hook is the sole in-process schema authority and must finish forbidden-control refusal and schema loading before it invokes dispatch-guard.py, so a schema-refused dispatch records no claim. Dispatch-guard.py remains the governed preflight and claim boundary for an otherwise accepted dispatch; preserve its existing policy and claim behavior through the hard cut and cover that boundary in tests/integration/test-dispatch-guard.py. Dispatch-guard.py must not load, resolve, project, cache, or inject a schema, and must not duplicate the hook's schema-control refusal. The terminal gate runs OMP's pinned canonical schema-normalization, schema-compatibility, anthropic-tool-schema, and provider-schema-compatibility suites once for the configured OpenAI and Anthropic families. Do not build a per-model-tier matrix or broaden AGENTS.md or provider-neutral capability claims.\n\nOn YieldTool calls, pass event.input.data as digest_object to validate-digest.py and validate the mapping directly through digest_schema.py. Preserve claim release, child-in-flight, identity, artifact, suite, review, and repository semantic checks and their actionable diagnostics. A string, null, absent data, wrapper, or malformed mapping must be blocked with an instruction to return the object. Explicitly delete the string-data branch added by issues 1960 and 1969 and delete its pinning tests in tests/unit/omp-hooks.test.ts, including passes string data through as multi-line digest text and uses the last assistant message for an omitted yield payload. Remove agent-end and last-assistant-message digest fallback validation while retaining unrelated claim and spend behavior. The direct CLI with no artifact argument accepts a JSON object from stdin through digest_schema.py. Historical check-state consumers use digest_record.py directly and never send the loaded mapping through live persona-schema validation.\n\nAfter a lead mapping passes all live schema and semantic checks, resolve its registered digest.md as today, require the target to be a safe existing regular artifact, and compare with digest_record.py's final fenced mapping. If structurally identical, write nothing; if different, append a deterministic yaml.safe_dump fenced block after the human narrative so last mapping wins. Reject the yield if resolution or writing fails; non-lead validation never writes an artifact. The submitted live mapping is validated before every append, but a pre-existing historical mapping is comparison input only and is never retroactively schema-validated. Retarget _inv15_digest_verdict to check_state/run_state.py and update check_state/ctx.py, check_state/run_state.py, check_state/table.py, and check_state/feature_record.py so INV-15, INV-46, and INV-47 consume digest_record.py's structured keys. Keep exactly one checker file owning a callable named _inv15_digest_verdict so the FEAT-69 mutants remain anchored. Update the INV-15 and INV-46 declared read tuples to name every new input, including digest_record.py, and update tests/integration/test-checker-structure-locks.py for the cross-module mutant anchors and two-helper read walk. Delete the checker digest regex and bare-text fallback, and prove all 30 tracked historical digest.md files, including blocks with out-of-live-schema keys, remain byte-identical and readable.\n\nReplace the fenced return templates in the eight named agent files and three named skills with a pointer to that persona's schema file and one complete object example using the exact YieldTool data shape; update team-run-state.md so durable fenced YAML is described only as validator-owned output. Add a census that fails if a live harness return contract still asks an agent to serialize a fenced digest. Preserve each role's current field semantics and the instruction that the object is returned through YieldTool.\n\nKeep the implemented disposable probe and historical pre-cutover receipt. T-05 owns the current source-bound credentialled run, its fresh receipt and transcript, and the canonical provider terminal gate; none of those gates is removed or weakened.\n Bind each lead append destination at trusted hook runtime startup, independently of returned artifact: exact claim feature, persona, runtime id, parent id and checkout plus exactly one open registered feature.json run for that lead and squad, within its manifest writable grants. Cache that hook-owned binding for the ready runtime so refused returns can release their claim first and still retry or no-op; clear it when opening a new wake turn. Revalidate the bound registered run at append, and refuse other squads, other features, another same-role run, missing or mismatched binding, closed registrations and relative or absolute parent symlink escapes before reading for equality or writing. Open directories and the existing regular digest through no-follow directory descriptors, append through the same file descriptor, and preserve every prior byte, historical record comparison, correction and identical-object no-op. No caller-selected fallback and no post-release live-claim requirement. Delegate explicit null yield execution to the native OMP tool, not a hook-only refusal; typed terminal null under the injected strict schema must produce the native retryable declared-schema error, then the same job accepts the next full valid object. Retain non-object and malformed-object refusal and all claim settlement boundaries."
