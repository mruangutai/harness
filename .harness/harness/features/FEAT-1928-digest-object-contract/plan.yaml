    intent: "Work test-first under the DEC-174 direct route. Add common.json and exactly one closed JSON Schema for each of the 16 runtime harness personas, with external file references for shared VERDICT, artifact, and DIGEST structures. Encode every current required field, type, enum, nested object, list-entry shape, nullable n/a rule, and additionalProperties false boundary now declared by validate-digest.py, including persona-specific findings, amendments, sc_status, members, fail_first, code_grade, and task verification fields. Map the existing main-session and lead aliases to the appropriate canonical persona schemas without creating a seventeenth persona file. Do not add frontmatter output schemas, a schema generator, or a duplicated drift invariant.\n\nAdd digest_schema.py as the dependency-light canonical live-schema loader. It must cache strict schema loads, reject duplicate or malformed schema files, validate Python mappings with the installed jsonschema package, expose canonical persona resolution, and decode object-input JSON for the validator CLI so validate-digest.py does not introduce a second JSON reader. It must not parse durable Markdown or implement the provider projection.\n\nAdd digest_record.py as the narrow durable-record loader used only by historical artifact consumers and append comparison. It scans fenced YAML blocks from the end, selects the last block that safely loads to a mapping, and returns that mapping and structured keys without importing digest_schema.py or validating against any live persona schema. It must never accept historical text as a live return, search for a VERDICT token to choose a block, rewrite bytes, or grandfather by date. Its unit test must include historical mappings with extra durable keys, prove the final fenced mapping wins, prove malformed or absent mappings fail actionably, and hash the fixture before and after every read to prove byte identity.\n\nBoth new bin modules have a zero broad-catch ceiling: neither may contain except Exception nor a bare except. Catch only the concrete OSError, YAML, JSON, and jsonschema errors each operation can raise. Import through the normal bin package boundary or harness_boundary; do not add a second importlib.util.spec_from_file_location loader anywhere under bin.\n\nThe live-schema unit test must enumerate all 16 personas, prove representative valid objects pass, and prove missing, extra, wrong-type, and near-miss enum objects fail. The durable-reader unit test owns historical selection and byte preservation separately. Update canonical-reader-classification.json with canonical rows for every detected read in digest_schema.py and digest_record.py, set every new row's execution_route to main-session-direct, add both module paths to scanned_files, and run the canonical-reader self-test.\n Reconcile the inherited canonical-reader inventory with the actual source tree without editing the shipped BUG-285 plan or weakening its eleven historical T-07 identities. Generalize the existing exact implementation relocation tuples to file, symbol, category and callee; retain its four artifact-accessor resolutions and add domain_check to check-domain._manifest_domains_or_exit, process_plan_yaml to check-plan-routes._load_plan_once, and check-state module load_plan to check_state.ctx.Ctx._load_plan_docs. Every destination must still have explicit current source ownership. Add optional per-row plan ownership, defaulting to the inventory document plan; load each distinct referenced plan through the canonical reader, scope task lookup and historical migration selection by plan plus task, and refuse unreadable plans, missing declared source files, same-named tasks from another plan and wrong DEC-174 routes. Newly maintained source rows reference this feature plan and their actual owning task; keep historical rows bound to their original plan. Retarget or remove only genuinely extracted or deleted non-terminal reader sites, keep one actual state.yaml file reader, retain both check-domain view=true requirements, and account for every current scanned Python file and parser call without blanket exemptions. Replace prune-run-evidence._load_record direct feature.json decoding with artifact_accessors.load_feature_json; invalid records refuse before any deletion. Its UI results envelope remains a reasoned module-internal-format exemption. Preserve live zero-unresolved audit, all historical T-03 through T-07 postconditions and exact terminal-contract mutants. Add behavioral negative coverage for cross-plan task confusion, unreadable ownership, omitted destinations, exact relocation mismatches and invalid pruning records without losing run directories."
