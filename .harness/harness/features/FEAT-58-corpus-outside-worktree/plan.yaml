      A worktree that FAILS the ancestor test is LEFT FULLY MATERIALISED. Not partially converged, not
      sparsified-then-fixed, not silently skipped: untouched, exactly as found, and named in the record as
      skipped-pending-merge WITH its reason - that its branch does not yet carry <fix-sha>. It converges
      later by re-running this same task once its branch carries the fix. A skipped row is a normal
      outcome of this task, never a failure of it.

      WHY A depends_on EDGE IS INSUFFICIENT, and this is the whole reason the precondition is on HEAD
      CONTENT rather than on plan order: .claude/settings.json registers every hook through
      ${CLAUDE_PROJECT_DIR}, so each worktree executes ITS OWN branch's check-state.sh, check-domain.sh
      and merge-gate.py. A sibling sparsified ahead of its own branch therefore keeps running a PRE-FIX
      gate over a sparse tree until that branch merges the fixes - the measured 1-of-88 / EXIT=0 shape,
      host-wide, for an unbounded window. Ordering this task after T-09 says nothing about what any other
      worktree's HEAD contains, so no edge in this DAG can close it; only the per-worktree HEAD-content
      test can.

      Rules, all binding:
        - No worktree is removed and none is created. Do not call git worktree remove or git worktree
          add, and do not remove a worktree you are inside - git worktree remove exits 0 when run from
          inside the tree it deletes.
