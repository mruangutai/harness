      a 240 s suite. The host-scale figures this feature cites - 3337 paths reported deleted,
      3807 skip-bits cleared - are a one-shot manual measurement recorded in the DoD note, not a
      fixture assertion, and the fixtures reproduce the SHAPE rather than the magnitude.
      Placement is forced by DEC-213 (directory selects kind, and suite_layout.py refuses a
      tracked test-shaped file outside tests) and by DEC-163 read against this repository's
      harness.json test_kinds: component, ui and typecheck carry cmd null and are unresolved,
      functional and eval are excluded, so unit and integration are the only kinds a criterion
      may rest on. The module name f58_sparse_fixture.py is deliberate: the runner globs
      test-*.py and suite_layout's shape patterns are test-*, test_*, *_test.*, so a helper
      outside those patterns is importable without being collected or refused.
    dec: DEC-213
  - id: D-12
    choice: |
      worktree-state.py --verify GETS A NAMED CALLER INSIDE THIS FEATURE: check-state.sh's
      preflight, wired by N-06. Inside a linked worktree, before any invariant runs,
      check-state.sh runs worktree-state.py --verify and REFUSES non-zero when it fails,
      printing the failing check and this repository's remedy tail; outside a linked worktree
      the preflight is skipped. NO GATE EVER CALLS --repair - the hook tier is --repair's only
      caller (D-03) - and check-state.sh repairs nothing.
    because: |
      The DoD rules that --verify is what gates call and that it FAILS rather than repairing
      (note:117), and the cycle-0 draft wired only --repair, from the three hooks: --verify
      would have shipped with no caller at all and been graded only in isolation, which is the
      shape a later scan re-proposes deleting. check-state.sh is the gate whose own requirement
      this already is - D-3 (DoD) demands the audit REFUSE rather than report clean when it
      cannot reach what it expects, and a failing --verify is that same condition one layer
      lower, since a wrong cone or cleared skip-bits means the audit's view of the tree is not
      the tree. It also costs no new task, lane or file surface: N-06 is already check-state.sh's
      single writer under D-07 and check-state.sh:110-112 is already a preflight refusal site,
      so this is a second clause on an existing refusal rather than a new tier.
      REJECTED, recorded so neither is re-proposed: merge-gate.py, which gates merges rather
      than the audit that reads the corpus and would leave the audit reporting clean over a
      broken cone; and a human or CI step, which is precisely the prose-an-agent-is-expected-to-
      follow that M-1 (DoD) exists to replace.
      THE WIRING IS CARRIED BY N-06 and asserted by
      tests/integration/test-check-state-verify-gate.py; SC-09's gate clause grades it - that
      the gate invokes --verify, and that a failing --verify makes the gate refuse without
      running an invariant.
    dec: none
  - id: D-13
    choice: |
      A PERMANENTLY COLLECTED TEST NEVER DERIVES ITS PRE-CHANGE SIDE FROM A MOVING GIT REF. It
      pins the immutable pre_change_sha that N-01 records, or it is not a collected test at all -
      it is a ONE-TIME PROOF, executed once and recorded in the executing task's receipt or in a
      feature note. There is no third form. Applied to the three sites this plan contains, and no
      task may reintroduce a fourth:
        N-06 PART 3 case (c), the verify-gate pre-change reproduction - DEMOTED to a one-time
        receipt-recorded red proof.
        N-09 PART 1 clause (b), the audit-unchanged comparison against the merge-base copy of
        check-state.sh - DEMOTED, its verdict recorded in notes/nonregression.md; clauses (a),
        (c) and (d) stay standing.
        N-09 PART 3 clause 3, the nothing-altered diff - PINNED AND SELF-SCOPED: both endpoints
        are the immutable literals this feature's own notes record, pre_change_sha in
        notes/suite-baseline.md and review_sha in notes/nonregression.md, and the clause SKIPS
        WITH A NAMED LINE when either literal is absent, which is whenever it is not grading
        FEAT-58.
    because: |
      A merge-base is not a fixed point. The moment this feature merges, the merge-base of any
      later branch already contains the post-change file, so a standing test comparing a run
      against git show <merge-base>:<path> compares the change against itself: an
      assert-the-two-runs-DIFFER clause fails forever and an assert-they-are-EQUAL clause is a
      green tautology. The same ref also makes a FEAT-58 assertion grade a LATER feature's own
      commit range - N-09 PART 3 clause 3 unpinned names that feature's feature.json, plan.yaml
      and notes as paths outside FEAT-58's directory and reddens the shared suite for every
      feature that follows, corrupting the very baselines those features record. This is one root
      cause at three sites (findings F-04, F-07 and F-05), so it is stated once as a rule rather
      than as three edits that a fourth site would escape.
      THE COST IS NAMED RATHER THAN ABSORBED: two demotions are a real reduction in STANDING
      coverage. The pre-change behaviour of check-state.sh is thereafter proven by a proof
      executed once, not by a test that re-proves it on every suite run. That is accepted because
      the alternative is not stronger coverage but a permanently red or permanently vacuous
      assertion, and because a demoted proof still has to be EXECUTED and RECORDED before its
      task can pass. The two demoted verdicts are named in the ledger's evidence column at
      notes/research-FEAT-58-apply-batch-c3.md, never left to read as neutral.
    dec: none
