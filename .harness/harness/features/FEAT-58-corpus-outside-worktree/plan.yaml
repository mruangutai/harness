      by the two conforming worktrees. RED PROOF: remove the guard in a temp copy and record that exactly
      this case reddens while the ordering cases stay green.
      tests/integration/test-corpus-migration-refusal.py - over fixture worktrees:
        (a) SC-10 red-first: modify a tracked file that the NEW cone would EXCLUDE, run the migration,
