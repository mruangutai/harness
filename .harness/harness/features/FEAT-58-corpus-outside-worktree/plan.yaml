tasks:
  - id: T-01
    title: Add the corpus API to harness_boundary.py with refusal intrinsic to corpus_features
    traces: [REQ-02, REQ-03, REQ-04, REQ-05, SC-03, SC-05]
    change_type: api
    execution_mode: main-session-direct
    execution_reason: DEC-174 — harness_boundary.py is the resolver every hook, validator and gate script imports
    depends_on: []
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - tests/unit/test-corpus-boundary.py
    verify: |
      python3 tests/unit/test-corpus-boundary.py && python3 tests/unit/test-harness-boundary.py
    intent: |
      EXECUTION PRECONDITION, AND IT BINDS THE WHOLE BUILD, NOT ONLY THIS TASK: the operator gated
      EXECUTION of this effort on FEAT-57's replay manifest and dataset being FROZEN and SPOT-CHECKED -
      inside FEAT-57's build, not at its terminal state (BRIEF.md ## Constraints, the Sequencing entry).
      T-01 is the first executed task in this plan (depends_on: []), so the hold lands here: do not open
      any file for this task until that freeze is in place and has been spot-checked, and if it is not,
      report the precondition as UNMET and stop rather than proceeding. Planning had no precondition;
      execution does, and every other task in this plan depends transitively on this one, so a hold here
      holds the build. T-15's own in-file gate on the same freeze is unchanged and ADDITIONAL - it grades
      the manifest at assertion time, which is a different moment from this entry hold.

      Add THREE public functions to .claude/skills/harness/bin/harness_boundary.py - corpus_root,
      corpus_features and corpus_read, and no fourth - placed immediately after worktree_owner so the
      derivation sits at the seam that already answers "which checkout am I in". Write
      tests/unit/test-corpus-boundary.py FIRST and record its failing output before any of this exists.

      1. corpus_root(cwd)
      Returns the absolute path of the ONE materialised copy of the feature corpus, or None.
      Body: owner_root from worktree_owner(cwd); when that yields no owner root, fall back to
      resolve_root(<this file's dir>). When BOTH fail, return None. It NEVER falls back to cwd, and it
      holds no cache and no module state. In a checkout that is not a linked worktree worktree_owner
      returns (cur, cur, True), so this returns cwd's own root - that identity is the whole of REQ-10
      and T-02 pins it.

      2. corpus_features(root, *, provider="history", ref=None)
      Returns the sorted list of feature directory NAMES the corpus holds. The signature is exactly
      that: provider and ref are keyword-only, and provider is an explicit token, never inferred from
      whether ref is None. provider="history" enumerates from history - git ls-tree -d --name-only
      <ref>:.harness/<segment>/features - with ref given or defaulted to the repository's default
      branch. provider="path" lists the directories under <root>/.harness/*/features and RAISES
      ValueError if a ref is also passed, because path enumeration is ref-independent and a supplied ref
      there is a contradiction, not something to ignore silently. Any other provider value raises
      ValueError. A git invocation that fails (not a repository, ref absent, corrupt object) is a
      REFUSAL, never an empty set.

      THE PREDICATE, AND IT IS THE CORRECTION THIS TASK EXISTS FOR: the completeness compare counts the
      feature directories materialised UNDER root ITSELF - the value already passed in - against
      len(resolved). It NEVER re-derives a second, independent os.getcwd(). Counting the caller's own
      checkout is 1 vs 88 on every legitimate call inside a converged worktree, which is the end state
      REQ-01 mandates, so corpus_features would never return and T-08 case (c), SC-03 and REQ-02 would
      all be unreachable from the very call meant to satisfy them.

      THE REFUSAL IS INSIDE THIS FUNCTION AND THERE IS NO SEPARATE OPT-IN CALL (D-02). provider selects
      WHICH READ KIND runs, never WHETHER the completeness check runs, so it is not the opt-out D-02
      forbids. Do NOT add a refuse_if_incomplete() helper, a strict= flag, or any argument that makes
      the refusal optional. Three refusal states, distinguishable by their messages:
        (A) root unresolvable (no owner root, and the resolve_root fallback also failed): raise
            CorpusIncomplete - a new exception class defined in this module - naming that the corpus
            root could not be resolved and which inputs were tried, carrying NO N of M count.
        (B) the ref cannot be resolved, or git ls-tree fails while building the resolved set: raise
            CorpusIncomplete naming the ref that could not be resolved, carrying NO N of M count.
        (C) root resolves to a real directory whose OWN materialised set is short of the resolved set:
            raise CorpusIncomplete whose str() names, in one line, the count as "N of M features
            materialised", the corpus root used, and the provider and ref read. This is the ONLY N of M
            trigger. In production it fires only when the owner root's own never-sparse invariant is
            violated - a migration mistargeting the owner root, a manual git sparse-checkout run there,
            or partial corruption - and it is that invariant's last-line defence, not dead code. A
            blobless or partial clone of the owner root does NOT trigger it: a blob filter does not
            affect tree listing, only later content reads. Say that in the docstring so nobody expects
            (C) to catch it.

      EVERY ONE OF THE THREE MESSAGES STATES A NEXT STEP, not only the fault. A bare "1 of 88 features
