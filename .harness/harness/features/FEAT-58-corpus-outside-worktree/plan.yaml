      feature owns the branch being merged. main() at :167-171 then reads "if not owners: ... return" -
      it ALLOWS the merge. Under a partial corpus view that branch is reached because the owning
      feature.json is not on disk, so a merge that owes a build-entry receipt is permitted silently.
