  - id: D-15
    choice: T-17 corrects the owner root at all three linked_worktrees call sites in check-domain.sh (:752 and :780, which deny a write; :2150, which reports), resolves it once per invocation, refuses on corpus_root()==None, and memoises the enumeration. It does not change the two allow-on-empty returns at :753-754 and :809-810.
    because: The wrong root is one defect at three sites, and the two denial sites are the ones REQ-12's enforcement claim rests on. Measured at +1.9908 ms per governed write, +1.1659 ms memoised, against this hook's own 18.5-23.6 ms interpreter floor. Refusing on an unresolvable corpus_root is required rather than optional because linked_worktrees(None) raises TypeError into both tiers' bug-absorbing excepts and becomes an ALLOW. Allow-on-empty is left alone because an empty enumeration is a legitimate state at a denial tier - a feature with no worktree, an agent with no live claim - unlike an empty sweep result; distinguishing unresolvable from empty is a separate ticket.
