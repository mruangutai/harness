  - id: D-08
    choice: |
      The sparse include list is DERIVED, never literal, and it is a DIRECTORY SET ONLY. The set
      is exactly these three parts:
        (a) every TOP-LEVEL tracked directory - git ls-tree -d --name-only HEAD at the repository
            root - EXCEPT .harness itself;
        (b) every MAXIMAL tracked directory under .harness that is DISJOINT from the features
            corpus. A tracked directory under .harness is listed WHOLE unless
            .harness/<repo>/features is that path, is beneath it, or is above it; the two that
            fail that test today - .harness itself and .harness/<repo> - are NOT listed, and the
            enumeration descends into their tracked children instead. At this pin part (b) yields
            .harness/expertise, .harness/factory, .harness/logs, .harness/notes,
            .harness/<repo>/docs and .harness/<repo>/expertise;
        (c) plus .harness/<repo>/features/<active-feature-id>, and nothing else beneath
            .harness/<repo>/features. The active feature id is the worktree directory's own
            basename.
      THE ENUMERATION RECURSES, and one non-recursive listing of .harness does not reach part (b):
      .harness/<repo>/docs and .harness/<repo>/expertise sit two levels down. One enumeration that
      does reach them, named so no executor has to invent one: git ls-tree -d -r -t --name-only
      HEAD -- .harness, keep every returned directory path that is disjoint from
      .harness/<repo>/features by the rule above, then drop any kept path whose own parent was
      also kept, so only maximal directories are listed. Files sitting DIRECTLY in .harness or in
      .harness/<repo> - harness.json, team-config.yaml, glossary.md, README.md - need no entry of
      their own: cone mode materialises the files held directly by a listed directory's ancestors.
      No file path is ever added to the cone.
    because: |
      A literal list was rejected on measured evidence: the original hand-written probe list
      omitted .agents, which holds the skills symlink every dispatch resolves through, and git
      sparse-checkout set exits 0 both with no arguments and with patterns matching nothing, so
      git supplies no error path at all. The derivation was proven, not asserted - on a synthetic
      git init fixture, adding a new top-level tracked directory changed git ls-tree's output with
      zero source edits, and on a real sparse probe the top-level part of the set - .agents .claude
      .github .omp council docs tests plus the feature dir - left .agents/skills PRESENT after the
      cone was applied.
      PART (b) EXISTS BECAUSE THE EARLIER FORM OF THIS DECISION WAS MEASURED WRONG. That form was
      top-level dirs MINUS .harness plus the active feature, and minus-.harness is NOT safe: cone
      mode materialises the files sitting directly in a listed directory's ancestors and NOTHING
      ELSE beneath them, so every tracked .harness SUBDIRECTORY other than the active feature is
      stripped while git reports success. Measured on git 2.50.1 against a synthetic git init
      fixture tracking top/f, .harness/root.md, .harness/factory/fleet.yaml, .harness/notes/n.md,
      .harness/harness/docs/d.md and two feature directories: after git sparse-checkout set --cone
