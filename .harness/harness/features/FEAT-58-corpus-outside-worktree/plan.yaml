          its dirty status, its ancestor-test result, and a refusal or skip reason where applicable, plus
          the resolved <fix-sha> and the enumerated basename set before and after so "none removed, none
          added" is readable from the record alone. Every row that is neither refused nor skipped must
          read an after-count of 1. The record states the live worktree count it observed; do not copy a
          count from BRIEF.md, which records a measurement taken at abff2a84 before two throwaway probe
          worktrees were removed.
        - Counts are ls of the features directory. Never du: it reports logical size and is forbidden as
          footprint evidence in this feature.

      The second verify command is SC-07's history check. It is BOUNDED and it asserts BOTH conditions:
      the range is pinned as git merge-base origin/main HEAD .. HEAD, so no historical deletion outside
      this feature's own range can decide the result, and the check fails when git log's return code is
      non-zero OR when its stdout is non-empty. git log exits 0 whatever it prints, so a status-only
