tasks:
  - id: N-01
    title: Build the synthetic sparse fixture and record the pre-change failing-test baseline
    traces:
    - REQ-05
    - SC-12
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: |
      D-07 - runs the harness's own gate suites and writes a feature-directory note that
      check-domain.sh --resolve grants to harness-orchestrator only, plus the shared test fixture
      that DEC-174 pulls in with the gates it serves
    depends_on: []
    status: ready
    files:
      - tests/integration/f58_sparse_fixture.py
      - .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md
    verify: |
      python3 tests/integration/f58_sparse_fixture.py --self-check && grep -qE '^pre_change_sha: [0-9a-f]{40}$' .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md && grep -qE '^## PRE-CHANGE FAILING SET$' .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md && git merge-base --is-ancestor "$(sed -n 's/^pre_change_sha: //p' .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md)" HEAD
    intent: |
      THIS TASK RUNS BEFORE ANY BUILD TASK LANDS. Every other task depends on it, directly or
      transitively, because once a build task lands the pre-change failing set is no longer
      observable and the fixture every later test imports does not exist.

      PART 1 - THE FIXTURE, tests/integration/f58_sparse_fixture.py.

      THE FIXTURE RULE: it is a SYNTHETIC repository - a real git init in a temporary directory,
      five fake feature directories, a handful of tracked files, a handful of top-level
      directories - and NEVER a copy of this repository. Precedent, issue 1526: a fixture that
      copied .claude/worktrees accounted for 239 s of a 240 s suite. Do not shutil.copytree
      anything from the checkout you are running in and do not point the fixture at the real
      .claude/worktrees.

      NAMING IS LOAD-BEARING. The runner globs test-*.py and suite_layout.py's shape patterns are
      test-*, test_*, *_test.*, so this name is importable by the integration tests without being
      collected as a test itself or refused by the layout predicate. Do not rename it to test_*.

      WHAT IT BUILDS - a module-level API the other tests import:
        build_owner_root(tmpdir) -> path
          git init; git config user.email/user.name; create top-level tracked dirs mirroring the
          real repo's SHAPE, not its content - at minimum .agents (a symlink to .claude, mode
