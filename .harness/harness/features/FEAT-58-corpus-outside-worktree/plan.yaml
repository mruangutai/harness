    dec: DEC-179
  - id: D-11
    choice: |
      The five non-hook-bound repo-wide sweeps RELOCATE to the corpus root rather than repointing
      their internal call sites. check-state.sh (T-03) and the four validators (T-04) each resolve
      root = corpus_root(the root the script already validated) ONCE at the top, call
      corpus_features(root) ONCE as the completeness gate, and read every corpus-relative path
      directly against the resolved base thereafter, with no per-site materialised-or-history
      branch. T-05, T-06 and T-12 are NOT relocated.
    because: |
      REJECTED, repoint every reader in place: roughly 25 independently-maintained exists-else
      branches, 21 of them inside check-state.sh, the tree's highest-traffic gate script. One
      missed site reads its own sparse tree, the read SUCCEEDS, and nothing reddens - the
      fail-open this feature exists to close, reopened one site at a time. Relocation deletes the
      branch instead of centralising it, and the deletion cascades: corpus_open is ruled out at
      ZERO callers by the deletion test, and the batching finding (13.69 ms per call, about 13 to
      14 seconds per check-state run) disappears with it, because those reads become plain local
      open() calls rather than git show subprocesses. Scope is exactly the five because
      .claude/settings.json registers check-domain.sh, merge-gate.sh and dispatch-guard.sh as hook
      entry points bound to the caller's cwd, and none of the five appears in that file.
    dec: none

  - id: D-12
    choice: |
      corpus_features stays REF-ONLY, and the ACTIVE in-flight feature enters a sweep's grading
      scope at the CALLER, as a union over the feature directories materialised under the caller's
      own checkout. Content reads then resolve through a per-feature bases mapping computed ONCE
      beside the top-level completeness gate: every ref-resolved name maps to the corpus root, the
      single in-flight name maps to the caller's own checkout. Completeness is still counted over
      the ref-resolved set alone.
    because: |
      The active feature's record is committed only on its own branch and is absent from the
      corpus root's default ref, so with no union check-state silently stops grading the very
      feature being built. REJECTED, union inside corpus_features: a worktree's call would then
      return one more name than the owner root's own call on the same ref, breaking T-08 case (c)
      set-equality and inflating M in every count message with an entry the owner root can never
      satisfy. REJECTED, enumerating linked worktrees from the owner root with git worktree list:
      it pulls in every other in-flight feature on the machine, while INV-6 and INV-33 grade the
      ACTIVE feature, singular. REJECTED, falling back to corpus_read at the resolved ref on
      FileNotFoundError: the only ref that fallback could name is the one which by construction
      never carries the in-flight feature, so it misses exactly the feature the union exists to
      grade, and it misses SILENTLY - absent-at-ref is indistinguishable from a genuine invariant
      absence. Absence under the caller's own base is therefore an ordinary per-invariant absence,
      never a refusal.
    dec: none

