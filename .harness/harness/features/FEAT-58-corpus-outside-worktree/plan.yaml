  - id: T-08
    title: Derive the sparse include-list at worktree creation and positive-control it on disk
    traces: [REQ-01, REQ-02, SC-01, SC-02, SC-03, SC-13]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 — feature-worktree.py is the worktree lifecycle gate script
    depends_on: [T-01]
    files:
      - .claude/skills/harness/bin/feature-worktree.py
      - tests/unit/test-sparse-include-list.py
      - tests/integration/test-feature-worktree-sparse.py
    verify: |
      python3 tests/unit/test-sparse-include-list.py && python3 tests/integration/test-feature-worktree-sparse.py && python3 tests/integration/test-feature-worktree.py
    intent: |
      cmd_create (feature-worktree.py :99-135) currently runs git worktree add and stops, so the new
      worktree materialises the whole corpus. Add two steps after the existing step 5, before the
      destination is printed, and gate both on the HEAD-content precondition below.

      THE HEAD-CONTENT PRECONDITION AT CREATION, IDENTICAL TO T-10'S (operator ruling Q1, cycle 1,
      resolving panel finding PF-5945852660e0bd21e2b5aabb8cd48383). Before applying any cone, evaluate
      git merge-base --is-ancestor <fix-sha> HEAD against the NEW WORKTREE'S OWN HEAD.

      WHICH COMMIT <fix-sha> IS: the commit at which ALL SIX of the fail-closed reader changes - T-01,
      T-03, T-04, T-05, T-06, T-16 - are ancestors. Not the first of the six and not any commit before
      the last of them: an earlier commit passes a branch that carries only part of the fix, which is
      exactly the fail-open this precondition exists to close. If the six land as separate commits, the
      resolved value is the last of them to land.

      HOW IT IS SUPPLIED, and this is not optional plumbing. <fix-sha> is resolved at execution time and
      never hardcoded: make it a REQUIRED ARGUMENT of cmd_create with NO DEFAULT, exactly as T-09 makes
      it a required argument of the migration and never a default. Record the resolved value in the
      created worktree's creation output.

      WHEN IT IS ABSENT, cmd_create REFUSES: no argument and nothing in the environment supplying it
      means exit NON-ZERO, a message naming the missing input, and NOTHING created - no worktree, no
      cone, no destination directory left behind. ABSENT IS NOT THE SAME STATE AS NOT-AN-ANCESTOR and the
      two must not be collapsed: not-an-ancestor CREATES FULL and exits 0 (the case below), absent
      REFUSES and creates nothing. A default, a silent skip, or a fall-through-to-full on an absent input
      makes the whole HEAD-ancestry gate skippable by omission and silently restores
      PF-5945852660e0bd21e2b5aabb8cd48383, which the operator resolved by amendment at Q1 with no
      overrule recorded and none authorised.

      A new worktree cut from a branch that does NOT carry the fix is CREATED FULL - no sparse-checkout
      set is run at all, the worktree is left fully materialised and usable, and cmd_create prints that it
      was created full and why, naming the missing <fix-sha> and saying it converges by re-running the
      migration once its branch carries the fix. Creating it full is a success, not a failure: cmd_create
      exits 0. Why the test is on HEAD CONTENT and not on task order: .claude/settings.json registers
      every hook through ${CLAUDE_PROJECT_DIR}, so the new worktree runs ITS OWN branch's check-state.sh,
      and a sparse tree under a pre-fix gate reproduces the measured 1-of-88 / EXIT=0 fail-open for as
      long as that branch is unmerged.

      STEP A - derive the include-list, never enumerate it in source (D-03). Add a pure function
      sparse_include_list(owner_root, ref, segment, active_id) that returns the cone patterns, derived
      in three moves:
        1. git ls-tree --name-only <ref> for the top level: include every entry WHOLE except .harness.
        2. git ls-tree --name-only <ref> -- .harness/: include every entry whole except the repo
           segment(s) that hold features/ (today only .harness/harness).
        3. for each such segment: include its non-features children whole, plus
           .harness/<segment>/features/<active_id> alone.
      This is cone mode's native shape - recurse fully into a listed leaf, list-only at its ancestors,
      everything unlisted excluded - so NO negation and no non-cone pattern is needed. Never hardcode a
      path list: the probe's enumerated list already omitted .agents, which holds the skills symlink
      every dispatch resolves through. Then run git sparse-checkout set with the derived patterns in the
      new worktree.

      STEP B - the positive control, and it is the only thing that makes a wrong set loud. Measured in a
      throwaway scratch repo: git sparse-checkout set exits 0 BOTH with no arguments AND with a pattern
      matching nothing, and git sparse-checkout list echoes the nonexistent pattern back. Git has no
      error path here.

      EXPORT the control as a public function of this module: verify_required_paths(dest, segment,
      active_id) checks, on disk under dest, that each of the REQUIRED_WORKTREE_PATHS set exists -
      .agents/skills, .claude/skills, .harness/<segment>/features/<active_id>,
      .harness/team-config.yaml, .harness/harness.json, tests - and returns the missing ones. It is
      public because T-09's migration and T-10's --verify call THIS function rather than restating the
      set; a second literal would let a later required path leave migration applying a weaker control
      than creation, which is exactly the state D-03 says only the control can detect.

      cmd_create calls it after set, on the sparse path only. If anything is missing, print a message that
      names the cause class and the remedy, not only the path: that the derived sparse cone did not
      materialise required paths, which usually means the derivation or the ref is wrong, and that the
      destination is being removed so the command can be re-run once that is fixed. Then remove the
      half-built worktree with git worktree remove run from the OWNER ROOT (never from inside the
      destination) and exit non-zero. Mirror tests.yml's repository-state gate (:296-299), which derives
      its expectation from git ls-files rather than from the checker being gated, for the same reason: a
      checker cannot be its own positive control.

      tests/unit/test-sparse-include-list.py - import feature-worktree.py by importlib (the module name
      carries a dash) and test sparse_include_list against a fixture git repo: the derived list contains
      every top-level entry the fixture's ls-tree reports except .harness; it contains .agents
      explicitly; it names features/<active_id> and NO other feature; and adding a new top-level
      directory to the fixture and re-deriving includes it with no source edit. Also assert
      verify_required_paths is importable as a public name and returns the missing set for a
      deliberately incomplete destination.

      tests/integration/test-feature-worktree-sparse.py - create a real worktree of a fixture repository
      through cmd_create. Cases:
        (a) ls <worktree>/.harness/<segment>/features | wc -l returns 1 and the entry is the active id.
            RED FIRST: the same command against a worktree created by the pre-change path returns the
            full fixture corpus count - keep that assertion.
        (b) find <worktree> -type f | wc -l is at least an order of magnitude below the pre-change
            count, AND zero of those files lie under .harness/<segment>/features/ outside the active id.
            Assert the second clause separately; it is the discriminating one.
        (c) from inside the worktree, corpus_features resolves the SAME set of feature names as the
            owner root's default branch (set equality, not a count), and a content search over the
            corpus returns a path set equal to the owner root's for the same query. NAME THE COMMAND AND
            THE REF - "a content search" is not a measurement mode. The query is
            git -C <corpus_root> grep -l <needle> <ref> -- .harness/<segment>/features/ with the
            leading <ref>: stripped from each returned path, where <ref> is the owner root's default
            branch resolved ONCE as git -C <owner_root> rev-parse <default-branch> and <needle> is a
            fixed literal string the fixture commits into MORE THAN ONE feature directory, so a
            single-hit result cannot pass by accident. Compare that path set against the set the SAME
            command returns run at the owner root itself: set equality, never a count, and never a
            substring check over concatenated output.
        (d) the positive control fires: stub the derivation to return a pattern matching nothing, assert
            cmd_create exits non-zero, names the missing required path AND the cause class and remedy,
            and leaves no worktree behind.
        (e) SC-13: commit a NEW feature directory on the fixture's default branch, then re-run
            find <worktree> -type f | wc -l against the already-created worktree and assert the count is
            unchanged.
        (f) THE NON-CARRYING CASE, and it is what makes the precondition falsifiable: create a worktree
            from a fixture branch whose HEAD does NOT contain <fix-sha>. Assert it is created FULL - its
            materialised feature count equals the fixture corpus count, not 1 - that git sparse-checkout
            was never run in it (assert no sparse-checkout file exists under its .git), that cmd_create
            exits 0, and that its output names the missing <fix-sha> and the re-run remedy. Then assert
            the CARRYING case on the same fixture is sparse, so the two outcomes are told apart by HEAD
            content alone. RED PROOF, recorded in your receipt: remove the ancestor test in a temp copy
            and record that exactly this case reddens - the non-carrying worktree is sparsified - while
            (a) stays green. A guard whose test exercises only the carrying case proves nothing.
        (g) THE ABSENT INPUT, which is what keeps the gate from being skippable by omission: invoke
            cmd_create with NO fix-sha argument and nothing in the environment supplying one. Assert it
            exits NON-ZERO, that its message names the missing input, and that it leaves NO worktree
            behind - no directory at the destination and no entry in git worktree list. Assert those
            three individually. This case is distinct from (f) and must not be satisfied by it: (f) is a
            RESOLVED sha that is not an ancestor and correctly creates FULL at exit 0, while a build in
            which (g) exits 0, or creates anything at all, has made the ancestry gate optional.
      Never use du anywhere in this file: it reports logical size and would pass a wrong implementation.

  - id: T-09
    title: Write the in-place worktree migration, cleanliness evaluated before the cone changes
    traces: [REQ-06, SC-10]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 — it drives feature-worktree.py's cone and the registered worktree set
    depends_on: [T-08]
    files:
      - .claude/skills/harness/bin/migrate-worktree-corpus.py
      - tests/unit/test-corpus-migration-order.py
      - tests/integration/test-corpus-migration-refusal.py
    verify: |
      python3 tests/unit/test-corpus-migration-order.py && python3 tests/integration/test-corpus-migration-refusal.py
    intent: |
      New script .claude/skills/harness/bin/migrate-worktree-corpus.py that converges standing worktrees
      IN PLACE. It removes nothing, re-clones nothing, and never calls git worktree remove or git
      worktree add.

      Per linked worktree of the owner root, in this exact order:
        1. count: ls .harness/<segment>/features | wc -l equivalent, before.
        2. THE HEAD-CONTENT PRECONDITION (operator ruling Q1, cycle 1, resolving panel finding
           PF-5945852660e0bd21e2b5aabb8cd48383): git merge-base --is-ancestor <fix-sha> HEAD evaluated
           against THAT WORKTREE'S OWN HEAD, where <fix-sha> is the commit that landed the fail-closed
           reader changes. <fix-sha> is a REQUIRED command-line argument of this script - never a literal
           in its source and never a default - because it is resolved at execution time and recorded in
           the migration record. A worktree that fails the test is SKIPPED: left FULLY MATERIALISED and
           completely untouched, its row recording skipped-pending-merge and the reason, and the run
           continues to the next worktree. It is not a partial convergence and not a silent skip. Why the
           test is on HEAD CONTENT and not on plan order: .claude/settings.json registers every hook
           through ${CLAUDE_PROJECT_DIR}, so each worktree runs ITS OWN branch's gates, and a sibling
           sparsified ahead of its branch runs a pre-fix check-state.sh over a sparse tree - the measured
           1-of-88 / EXIT=0 shape - for an unbounded window no depends_on edge can bound.
        3. dirty check: git status --porcelain in that worktree. THIS RUNS BEFORE THE CONE CHANGES, and
           the order is the whole point. SKIP_WORKTREE makes an already-sparse worktree report clean for
           excluded paths, so a dirty check performed after sparsification cannot see a modification in
           a path the new cone excludes. While the worktree is still fully materialised every tracked
           path is compared normally.
        4. dirty means REFUSE: leave that worktree completely untouched, record the reason, and continue
           to the next one. A refusal is per worktree, never a global abort.
        5. clean AND carrying the fix means git sparse-checkout set with the patterns from
           feature-worktree.sparse_include_list for that worktree's own active id, then the SAME
           required-path control - IMPORT verify_required_paths from feature-worktree.py via importlib,
           exactly as this script already imports sparse_include_list, and CALL it. Do not restate the
           required-path list here; a second literal is how migration silently drifts to a weaker control
           than creation. A failed control is a refusal with the worktree left as found where possible.
        6. count after, and the per-worktree record row.

      THE OWNER ROOT IS NEVER A MIGRATION TARGET, and this is a GUARD, not a convention. Before step 5
      for any entry, compare the resolved candidate path against harness_boundary.corpus_root of it (and
      against the owner root the enumeration started from) and REFUSE that entry - recording the reason
      as "owner root, never sparsified" - rather than passing it to git sparse-checkout set. Nothing
      else in this plan forbids handing the owner root to that command, and T-01's refusal state (C) is a
      post-hoc DETECTOR, not a guard: it fires only after the damage, and the damage is total. The owner
      root holds the ONE materialised copy of the corpus, so sparsifying it destroys availability
      (REQ-02) for every reader on the host at once, and every reader then refuses correctly at the very
      moment the record is unreadable.

      This script enumerates across MULTIPLE linked worktrees rather than through any single resolved
      root, which is why T-13 allow-lists it by exact basename.

      It writes a markdown record at the path given by --record, one row per linked worktree with: the
      worktree id, the before count, the after count, its dirty status, its ancestor-test result, and an
      explicit refusal or skipped-pending-merge reason where applicable. It also writes the resolved
      <fix-sha> once, and the enumerated basename set BEFORE and AFTER, so "none removed, none added" is
      checkable from the record alone.

      Add a --verify mode that takes the same --record path and the same <fix-sha>, re-enumerates the
      linked worktrees live, and exits non-zero unless ALL of: the live basename set equals the record's
      after-set; every live worktree either shows a materialised feature count of exactly 1, or appears in
      the record with a refusal reason, or appears with skipped-pending-merge AND still fails the ancestor
      test live; and verify_required_paths returns empty for every converged live worktree. The
      skipped-pending-merge clause is what makes a wrongly-sparsified non-carrying worktree loud: a live
      worktree that does NOT carry <fix-sha> and whose feature count is 1 is a VIOLATION and exits
      non-zero. Without the required-path clause a wrong-but-nonempty cone verifies clean, which is the
      one failure the control exists to catch. This mode is what T-10's verify runs.

