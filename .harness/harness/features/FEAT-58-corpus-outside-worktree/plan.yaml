      worktree, not as a total count of calls. Assert also that verify_required_paths is the imported
      function object from feature-worktree.py, not a local definition.
      Assert also, as its OWN case, the OWNER-ROOT EXCLUSION: over a stubbed enumeration that yields the
      owner root itself alongside two linked worktrees, git sparse-checkout set is NEVER invoked with the
