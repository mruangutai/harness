    intent: |
      ONE SURFACE - branch uniqueness - written and consumed in one task, because the generator
      and its only consumer are dual-granted files and must have one writer.

      PART 1, THE GENERATOR, .claude/skills/harness/bin/feature-index.py. It resolves the OWNER
      root via harness_boundary.worktree_owner(), which parses a .git FILE correctly, reads every
      .harness/*/features/*/feature.json the GIT INDEX names - git ls-files, never a working-tree
      glob, because inside a worktree the working tree holds one record and the index holds them
      all - and writes .harness/harness/feature-index.json AT THE OWNER ROOT: one row per feature
      carrying id, branch and issue numbers, keys sorted, one trailing newline, so regeneration
      is byte-stable. Measured shape at this pin: 79 rows, 5848 bytes. Modes: default writes the
      file; --check regenerates into memory and exits non-zero naming the drifted ids if the
      on-disk file differs; --list prints the rows.
      THE INDEX LIVES AT THE OWNER ROOT AND NOWHERE ELSE. It is NOT added to the sparse cone and
      is NOT materialised inside a worktree; every consumer resolves the owner root first. This
      is the correction that removes the file-in-a-cone question entirely: a cone-mode
      sparse-checkout set is a hard fatal, exit 128, on a file path unless --skip-checks is
      passed, and because no file entry is ever added, --skip-checks is never needed. Do not add
      the index to any include list.

      PART 2, THE UNIQUENESS PREDICATE, an importable pure function over the rows -
      collisions(rows) returning findings, each naming the branch and the SORTED feature ids
      claiming it. A row is a CLAIM only when its branch value is a non-empty string that is not
      the literal none; absent, empty and none are all non-claims. Load-bearing rather than a
      nicety: four real records carry the literal none (FEAT-01, FEAT-15-domain-product-base,
      FEAT-19-central-product-config, FEAT-28-ci-wiring-asserted), so treating it as a claim
      manufactures four collisions that do not exist and the gate gets muted along with its one
      true finding. THERE IS EXACTLY ONE IMPLEMENTATION OF THIS PREDICATE: merge-gate.py IMPORTS
      it from feature-index.py by the import-by-path precedent at worktree_terminal.py:38-45 and
      never re-implements it. Assert that in the tests below.
      Commit the generated .harness/harness/feature-index.json.

      PART 3, THE CONSUMER SWAP. feature_for(branch) at merge-gate.py:132-142 globs
      ROOT/.harness/*/features/*/feature.json where ROOT is the script's own location, i.e. the
      WORKTREE root. Replace that population step with a read of the index RESOLVED AT THE OWNER
      ROOT via harness_boundary.worktree_owner(), populating owners through the imported claim
      rule. Change NOTHING else: the len(owners) > 1 deny at :172-175 keeps its behaviour and
      message and the fail-open at :169 keeps its DEC-138 semantics for a branch no feature
      claims. IF THE INDEX IS MISSING OR UNREADABLE THE GATE REFUSES, non-zero, naming the
      missing index and its remedy - it does NOT fall back to the glob. The fallback is what this
      task exists to remove: inside a worktree the glob at :137 returns at most one row, so the
      len(owners) > 1 deny can never fire and every other branch falls to :169, which ALLOWS the
      merge. Re-derive every line number against the file you open; they are recorded at
      abff2a84.

      PART 4, tests/unit/test-feature-index-uniqueness.py - direct python3, no pytest, canned row
      lists in the test file, never this repository's real records, which N-08 grades instead.
      THREE CASES, each its own named assertion with its own failure message; a single loop
      reporting one aggregate verdict does not discharge this:
        1. two records naming ONE branch -> EXACTLY ONE finding, and the finding names BOTH
           feature ids. Assert the count is 1, not merely non-zero.
        2. FOUR records all carrying the literal none -> ZERO findings. Four, not two, so the
           case has the shape of the real data.
        3. a record with the branch key ABSENT and a record with an empty-string branch -> ZERO
           findings, asserted separately from case 2 because absent, empty and none are three
           distinct inputs to the same rule.
      Plus a fourth, mixed case as the discrimination proof: four none rows PLUS one real
      collision -> exactly one finding, so an implementation that suppresses everything cannot
      pass 2 and 3 and still reach green. Plus the single-implementation assertion: import the
      predicate from both modules and assert merge-gate.py's is the SAME function object as
      feature-index.py's.

      PART 5, tests/integration/test-merge-gate-branch-uniqueness.py on f58_sparse_fixture, three
      cases, each its own:
        (a) DENY: two fixture records name one branch; regenerate the index; invoke merge-gate.py
            the way its caller invokes it with that branch as the head branch. Assert a NON-ZERO
            exit AND that the message names both feature ids.
        (b) ALLOW: correct one record - set its branch to the literal none - regenerate,
            re-invoke with the SAME head branch, assert exit 0. Same fixture, same branch, one
            field changed: that is what makes the pair discriminating.
        (c) INSIDE A SPARSE WORKTREE, the case the glob cannot pass: run (a) again with cwd
            INSIDE a sparse worktree of the fixture where exactly one feature directory is
            materialised, and assert the same non-zero deny. Then delete the owner-root index and
            assert the gate REFUSES non-zero naming the missing index rather than allowing.
            Against the pre-change spelling case (c) ALLOWS, because the glob sees one row;
            record that pre-change result in the file as the pinned reproduction.

      PART 6, tests/integration/test-feature-index-regen.py, the staleness guard D-01 names as
      this decision's own cost. Run feature-index.py --check at the OWNER root over this
      repository's real records and assert exit 0 with empty drift output - regeneration is a
      no-op. Then, as the discrimination clause, copy the index to a temp path, mutate one row's
      branch value in the copy, run --check against the copy and assert it exits non-zero NAMING
      that row's id. A no-op assertion alone passes for a --check that always returns clean.
