        1. the commands block parses to the two command lines VERBATIM, leading path included, and
           two blocks differing by ONE character compare UNEQUAL. Clause 1 is a string-identity
           claim, and a normalising parser would pass a different invocation as the same one.
        2. a failing-set section holding the literal (none) parses to the EMPTY SET, while an
           ABSENT section is an ERROR and never an empty set. N-01's note shape makes those two
           different claims, and a parser that conflates them turns a missing measurement into a
           clean one.
        3. two failing sets differing by one identifier compare UNEQUAL and the reported symmetric
           difference NAMES that identifier.
        4. a note whose pre_change_sha or review_sha is not 40 hex characters is an ERROR, so a
           placeholder can never reach clause 2 as data.

      PART 4, THE EXCLUSIONS RE-ASSERTED IN STRICT MODE. f58_sparse_fixture --self-check --strict
      is in this task's verify because by now every test file this feature adds exists: this is the
      run where the no-byte-figure and three-measurement-modes assertions actually range over the
      whole suite. --strict is the load-bearing word - it makes a listed path that does NOT exist a
      FAILURE naming it, and it asserts the list equals the set of test paths this plan's tasks
      name. Without it a path that was never written greps clean and both exclusions report green
      over files nobody produced, which is the state N-01's own non-strict run tolerates by
      design.
