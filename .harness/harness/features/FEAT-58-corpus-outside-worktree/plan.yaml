    because: |
      The active feature's record is committed only on its own branch and is absent from the
      corpus root's default ref, so with no union check-state silently stops grading the very
      feature being built. REJECTED, union inside corpus_features: a worktree's call would then
      return one more name than the owner root's own call on the same ref, breaking T-08 case (c)
      set-equality and inflating M in every count message with an entry the owner root can never
      satisfy. REJECTED, enumerating linked worktrees from the owner root with git worktree list:
      it pulls in every other in-flight feature on the machine, while INV-6 and INV-33 grade the
      ACTIVE feature, singular. REJECTED, falling back to corpus_read at the resolved ref on
      FileNotFoundError: the only ref that fallback could name is the one which by construction
      never carries the in-flight feature, so it misses exactly the feature the union exists to
      grade, and it misses SILENTLY - absent-at-ref is indistinguishable from a genuine invariant
      absence. Absence under the caller's own base is therefore an ordinary per-invariant absence,
      never a refusal.
    dec: none

  - id: D-13
    choice: |
      The gate-enforced corpus declaration is CUT. No task extends dispatch-guard.sh, no plan task
