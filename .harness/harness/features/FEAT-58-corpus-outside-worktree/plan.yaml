    dec: DEC-193
  - id: D-03
    choice: |
      THREE THIN HOOK SHIMS, NO SHARED BODY, AND NO exec. post-checkout and post-rewrite are new
      shims following the structural rules of post-merge:20-36; post-merge keeps its existing
      shim and its existing body bin/post-merge-sweep.sh, and that body gains a
      worktree-state.py --repair call ahead of its FEAT-34 sweep. Each shim RUNS its delegate
      rather than exec-ing it: on a non-zero delegate it prints one attributed line in the
      post-merge:29-32 prefixed style naming the shim, the delegate and the status, and EXITS 0.
      Consequently hook-fired --repair reports a dirty tree and still exits 0, while --verify,
      which gates call, keeps exit 8.
    because: |
      exec hands the delegate's exit status straight to git, so a legitimately failing --repair
      would abort the checkout, merge or rebase it rides on - a worse failure than the state it
      was called to fix, and the reason a post-checkout or post-merge hook must never exit
      non-zero. Running the delegate and attributing its failure keeps the operation succeeding
      while making the failure legible, and it is what makes a per-shim delegate-present-and-
      failing test possible at all. Beyond that the three bodies stay separate: both new hooks'
      useful work reduces to the same idempotent --repair call, so a shared body would be a
      single-line pass-through and the three-shim interface is already smaller than a fourth
      dispatch layer; post-merge's sweep is a pre-existing FEAT-34 concern (T-11, D-08) with its
      own tests. post-rewrite's rewritten-commit list arrives on STDIN, not argv, and is passed
      through unmodified. Evidence, notes/receipt-harness-dev-ops-arch2-eng.md section A and the
      consolidate-eng ruling C-03.
