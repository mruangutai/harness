decisions:
  - id: D-01
    choice: The corpus API lives in .claude/skills/harness/bin/harness_boundary.py beside worktree_owner, as corpus_root, corpus_features and corpus_read.
    because: A standalone module was rejected — 28 non-test files already import harness_boundary and six of them are the sweeps themselves, so a new module saves no import and would itself import harness_boundary for worktree_owner and resolve_root. materialised_count is cut as unearned.
    dec: none
  - id: D-02
    choice: The incompleteness refusal is INTRINSIC to corpus_features, not a separate refuse_if_incomplete that each sweep opts into.
    because: The opt-in shape was rejected by proof of construction — the arch-eng run found two corpus sweeps neither the ticket nor the design comment named, so the enumerate-and-edit-each-reader set is demonstrably not closed and a fifteenth reader would silently reopen the fail-open.
    dec: none
  - id: D-03
    choice: The sparse include-list is DERIVED from git ls-tree at worktree creation and immediately positive-controlled by an on-disk required-path existence check.
    because: A literal source list was rejected — the probe's own list already omits .agents, which holds the skills symlink every dispatch resolves through; and git sparse-checkout set exits 0 both with no arguments and with a pattern matching nothing, so git supplies no error path and only the existence check makes an empty or wrong set loud.
    dec: none
  - id: D-04
    choice: The two providers split by READ KIND — content reads resolve history-first at a named ref, identity and inode reads resolve path-only at the corpus root.
    because: The design comment's strict ranking of history as authoritative and path as convenience was rejected — check-domain _hardlink_plan matches (st_ino, st_dev), and git history can supply no inode at any ref, so for that caller the path provider is the only correct source.
    dec: none
  - id: D-05
    choice: A task legitimately needing the whole corpus declares corpus with provider and ref on its plan.yaml task, and dispatch-guard.sh refuses the dispatch at exit 2 when the dispatch text carries no matching HARNESS-CORPUS-PROVIDER and HARNESS-CORPUS-REF line.
    because: |
      A bare API argument with a default was rejected because it is satisfiable silently. This entry is
      the SINGLE authority for the corpus declaration mechanism: T-12's implementation, the guard's own
      comment and T-14's prose all POINT here and none of them restates the rule, so there is exactly
      one place it can go stale. STATED RESIDUAL, and it is wider than earlier drafts admitted:
      dispatch-guard.sh checks that the declared provider and ref are PRESENT in the dispatch text and
      that their values EQUAL the declaration; it cannot check CORRESPONDENCE - that the read the
      dispatched agent actually performs uses that frame. NOTHING instruments that residual. D-08's lint
      is NOT a partial instrument against it, and the earlier claim that it was is withdrawn: the lint
      detects a reader that BYPASSES the API entirely and can see neither which ref a real API call
      passes nor whether that ref matches any declaration. The residual is accepted and named, not
      covered.
    dec: none
  - id: D-06
    choice: cmd_remove's dirty check going blind to SKIP_WORKTREE-hidden corpus paths on every later remove is ACCEPTED as a residual, with no second-opinion check added.
    because: 'A second opinion was rejected as unearned — DEC-208 and DEC-218 bind HARNESS-ROUTED feature writes to the registered worktree, so nothing the harness dispatches writes outside the cone. The justification is deliberately no wider than that: an out-of-band write — a human editing a path directly, or a script run outside the harness — is not bound by those decisions, and after sparsification cmd_remove''s git status --porcelain cannot see it. That is the accepted residual, stated at its true width rather than as "nothing legitimate writes there". T-11 pins what the check must still do — discriminate on a cone-RESIDENT path after sparsification.'
    dec: DEC-208
  - id: D-07
    choice: Every files entry in this plan uses the .claude/ spelling, and no task syncs or maintains a second spelling.
    because: Measured on the worktree — .agents/skills is a mode-120000 symlink to ../.claude/skills, git tracks exactly one path, and .claude/settings.json invokes every hook through the .claude/ spelling. Maintaining or syncing two spellings was rejected because there is one inode and therefore no divergence to sync.
    dec: DEC-202
  - id: D-08
    choice: The repo lint that forbids corpus enumeration outside harness_boundary.py ships as an integration test under tests/integration, not as a new standalone gate script.
    because: A new checker was rejected because it would need its own CI wiring, its own guard registration and its own domain grant to gain nothing — the integration kind already runs in CI and in the qa gate, and the directory selects the kind under DEC-213.
