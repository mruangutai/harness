            set is unchanged, and the required-path control passed.
        (c) --verify exits non-zero when a record's after-set disagrees with the live set.
        (d) the required-path control FIRES AT MIGRATION: stub sparse_include_list to return a pattern
            set that omits a required path, run the migration over a clean fixture worktree, and assert
            it refuses that worktree non-zero naming the missing path. Without this case nothing proves
