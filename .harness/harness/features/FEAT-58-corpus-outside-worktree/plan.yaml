  - id: D-12
    choice: |
      corpus_features stays REF-ONLY, and the ACTIVE in-flight feature enters a sweep's grading
      scope at the CALLER, as a union over the feature directories materialised under the caller's
      own checkout. Content reads then resolve through a per-feature bases mapping computed ONCE
