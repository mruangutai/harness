    because: Turning an unattributable branch into a denial was rejected — DEC-138 makes GitHub a mirror and never a gate, and that allow-path is deliberate. What is a defect is allowing it because the reader could not SEE the owning record, which is exactly what an incomplete view produces today.
    dec: DEC-138

