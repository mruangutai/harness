tasks:
  - id: N-01
    title: Build the synthetic sparse fixture and record the pre-change failing-test baseline
    traces:
    - REQ-05
    - SC-12
    change_type: scaffolding
    execution_mode: main-session-direct
    execution_reason: |
      D-07 - runs the harness's own gate suites and writes a feature-directory note that
      check-domain.sh --resolve grants to harness-orchestrator only, plus the shared test fixture
      that DEC-174 pulls in with the gates it serves
    depends_on: []
    status: ready
    files:
      - tests/integration/f58_sparse_fixture.py
      - .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md
    verify: |
      python3 tests/integration/f58_sparse_fixture.py --self-check && grep -qE '^pre_change_sha: [0-9a-f]{40}$' .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md && grep -qE '^## PRE-CHANGE FAILING SET$' .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md && git merge-base --is-ancestor "$(sed -n 's/^pre_change_sha: //p' .harness/harness/features/FEAT-58-corpus-outside-worktree/notes/suite-baseline.md)" HEAD
    intent: |
      THIS TASK RUNS BEFORE ANY BUILD TASK LANDS. Every other task depends on it, directly or
      transitively, because once a build task lands the pre-change failing set is no longer
      observable and the fixture every later test imports does not exist.

      PART 1 - THE FIXTURE, tests/integration/f58_sparse_fixture.py.

      THE FIXTURE RULE: it is a SYNTHETIC repository - a real git init in a temporary directory,
      five fake feature directories, a handful of tracked files, a handful of top-level
      directories - and NEVER a copy of this repository. Precedent, issue 1526: a fixture that
      copied .claude/worktrees accounted for 239 s of a 240 s suite. Do not shutil.copytree
      anything from the checkout you are running in and do not point the fixture at the real
      .claude/worktrees.

      NAMING IS LOAD-BEARING. The runner globs test-*.py and suite_layout.py's shape patterns are
      test-*, test_*, *_test.*, so this name is importable by the integration tests without being
      collected as a test itself or refused by the layout predicate. Do not rename it to test_*.

      WHAT IT BUILDS - a module-level API the other tests import:
        build_owner_root(tmpdir) -> path
          git init; git config user.email/user.name; create top-level tracked dirs mirroring the
          real repo's SHAPE, not its content - at minimum .agents (a symlink to .claude, mode
          120000, so N-05's two-spelling assertion has a subject), .claude/skills (a tracked file
          inside it), docs, tests.
          THE .harness SHAPE IS PART OF THAT MIRROR, and it is the part the goal-check found
          missing. Track, each holding a tracked file:
            .harness/factory/fleet.yaml         - stands in for the fleet config
            .harness/expertise/<agent>.md       - stands in for the expertise layer injected into
                                                  every spawn
            .harness/harness/docs/DECISIONS.md  - THE NESTED CASE, two levels down, and the one
                                                  that matters most: a non-recursive enumeration
                                                  of .harness never reaches it
            .harness/harness.json               - a file sitting DIRECTLY in .harness, which cone
                                                  mode keeps for a different reason than a subtree
                                                  and which must not be mistaken for proof that a
                                                  subtree survived
          plus .harness/harness/features/<id>/BRIEF.md and feature.json for five fake ids;
          git add -A; git commit.
          Those three subtrees are not decoration: without them REQUIRED_PATHS has nothing to
          name and N-05's mandatory positive control is structurally blind to a derivation that
          strips every non-features .harness subtree - the measured defect D-08 now records.
        add_worktree(root, feature_id, sparse=True) -> path
          git worktree add for that feature's branch or --detach, returning the worktree path.
          THIS HELPER IS THE ONE EXPORT OF THE REUSE FOLD: add_worktree is currently hand-written
          four times across tests/integration. N-04 and N-05 import THIS one. Do NOT refactor the
          four existing copies - out of scope.
        REQUIRED_PATHS
          the module-level constant naming the paths a materialised worktree must hold. N-05's
          positive control reads this constant; it exists here so no test carries its own copy.
          IT NAMES, one entry each: .claude/skills, the same tree through the .agents spelling,
          docs, tests, .harness/factory/fleet.yaml, .harness/expertise/<agent>.md,
          .harness/harness/docs/DECISIONS.md, .harness/harness.json, and
          .harness/harness/features/<active-id>/BRIEF.md. Every entry is a path a WORKING worktree
          must hold under D-08's three-part derivation, and the three .harness subtree entries are
          exactly the ones the rejected top-level-minus-.harness form stripped while git
          sparse-checkout set exited 0.
        hidden_paths(root, active_id) -> list
          every tracked path under .harness/harness/features NOT under active_id - the set the
          merge-regression and skip-bit assertions count against.
        skip_bits(worktree) -> (h_count, s_count) parsed from git ls-files -t.
        manifest(worktree) -> dict path -> sha256, used by the no-repair and idempotence
          comparisons; a symlink is recorded as its readlink target and is NEVER followed.
        destroy(root)
          removes every worktree it created FROM OUTSIDE that worktree - git -C <root> worktree
          remove --force - then the temp tree. git worktree remove exits 0 when run from inside
          the tree it deletes, which destroys the caller's working directory; never do that.

      --self-check builds a fixture, asserts each API above returns a non-empty result of the
      right shape, prints the fixture's total tracked file count from git ls-files piped to
      wc -l, asserts that count is under 100 - a repository copy cannot satisfy that bound, which
      is what makes the assertion a real guard against the 1526 shape and not a comment - AND
      ASSERTS NO SOURCE OUTSIDE THE TEMP DIRECTORY WAS COPIED OR READ, as two named clauses: git
      rev-parse --show-toplevel run inside the fixture resolves UNDER the temp directory this
      self-check created and NOT under this repository's root, and every path git ls-files
      returns resolves inside that temp toplevel. The bound caps the cost; these two clauses are
      the assertion the ledger actually promised - that no path under the real .claude/worktrees,
      and no source outside the temp tree, is read or copied. Keep both. Then destroys the
      fixture, asserts the temp root no longer exists, and prints OK.

      --self-check ALSO CARRIES THE TWO EXCLUSIONS AS ASSERTIONS rather than as prose, and this
      is why they are here and not in a paragraph nobody greps:
        EXCLUSION 1. Over every test file this feature adds - the tests/unit/test-*.py and
        tests/integration/test-*.py paths named in this plan, resolved from a literal list in the
        self-check. FIRST ASSERT THE LIST IS SOUND, because a path that does not exist greps clean
        and the exclusion then reports green over files nobody wrote:
          - the list EQUALS the set of tests/unit/test-*.py and tests/integration/test-*.py paths
            this plan's tasks name in their own files: enumerate the plan's task file lists,
            compare as sets, and fail on either a plan path missing from the list or a list path
            no task names. That is what stops the list rotting as tasks are amended;
          - with --strict, every path in the list MUST EXIST on disk; a missing one FAILS naming
            it. N-09 runs the self-check in this mode, by which point every test file exists;
          - without --strict, the mode N-01 itself runs before any test file is written, a missing
            path is printed as a named PENDING line and the self-check prints how many of the
            listed paths it actually read, so a run over zero files can never be mistaken for the
            exclusion being discharged.
        THEN, over every path it actually read, assert NO occurrence of a du invocation, a
        byte-count assertion or a worktree-size assertion. Fail naming the file and line on a hit.
        du reports logical size and would pass a wrong implementation while failing a correct one,
        and any real-block bound is satisfiable by APFS clonefile - the mechanism this feature
        excludes.
        EXCLUSION 2. Assert the same files' measurement idioms are drawn ONLY from the three
        sanctioned modes: ls .harness/*/features counted with wc -l for materialisation, find
        -type f counted with wc -l for the read surface, git status --porcelain counted with
        wc -l for cleanliness. A file naming a fourth measurement mode fails the self-check.
      Both assertions must be shown to fire: add a temporary file containing a du call, record
      that the self-check reddens naming it, and remove it. An absence-grep that was already
      empty proves nothing.

      PART 2 - THE BASELINE, notes/suite-baseline.md.

      Run both live suites at the owner root, in the checkout as it stands, at a commit you
      record:
        .agents/skills/harness/bin/run-unit-tests.sh --kind unit
        .agents/skills/harness/bin/run-unit-tests.sh --kind integration

      Write the note with exactly this shape:
        pre_change_sha: <the full 40-hex sha of HEAD at the moment you ran them>
        observed_at: <YYYY-MM-DD>
        commands:
          <the two command lines verbatim, one per line>
        ## PRE-CHANGE FAILING SET
        <one test identifier per line, sorted, exactly as the runner names it; if a suite has no
        failure write the single line (none) under that suite's heading - an absent section is
        not the same claim as an empty one>
        ## PRE-CHANGE EXIT STATUS
        unit: <n>
        integration: <n>

      DO NOT record a pass/fail count instead of the SET. N-09 asserts set equality after the
      change, and a count is satisfied by one test starting to fail while another stops.

      DO NOT read the runner's exit code as the whole answer. This repository has a measured case
      of a runner exiting 0 while printing FAIL lines, so derive the failing SET by matching the
      runner's own failure prefix in its output, and record in the note which prefix you matched
      and the command you used to extract it. If the exit status and the extracted set disagree,
      record BOTH and say so - that disagreement is a finding for the operator.

      The commands block is load-bearing: N-09 asserts its own recorded commands are IDENTICAL to
      these, so the post-change set cannot be a different measurement wearing the same label.

      Nothing else is in scope. Do not fix a failing test you find; a pre-existing failure is
      exactly what this baseline exists to hold constant.
  - id: N-02
    title: Write worktree-state.py with five checks, six named verify exits and an announcing idempotent repair
    traces: [REQ-01, REQ-02, REQ-06, SC-09, SC-10]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: |
      D-07 - this file becomes the body of three git hooks, so DEC-174's category covers it and
      its tests
    depends_on: [N-01]
    status: ready
    files:
      - .claude/skills/harness/bin/worktree-state.py
      - tests/unit/test-worktree-state-derive.py
      - tests/integration/test-worktree-state.py
      - tests/integration/test-worktree-state-norepair.py
    verify: |
      python3 tests/unit/test-worktree-state-derive.py && python3 tests/integration/test-worktree-state.py && python3 tests/integration/test-worktree-state-norepair.py
    intent: |
      Create .claude/skills/harness/bin/worktree-state.py, a NEW sibling of feature-worktree.py
      and worktree_terminal.py, an extension of neither (D-10). Reuse the import-by-path
      precedent at worktree_terminal.py:38-45 to call resolve_repo/dest_for from
      feature-worktree.py rather than re-deriving them. Do not modify feature-worktree.py.

      TWO MODES, and the difference between them is the whole point of the file:
        --verify   runs the five checks, REPORTS, and REPAIRS NOTHING. Exits with the first
                   failing check's own code and prints one line naming that check, what it
                   observed, and ITS OWN REMEDY.
        --repair   runs the five checks, fixes what it can idempotently, ANNOUNCES each repair it
                   actually made, re-runs them, and exits 0 when the four repairable checks pass.

      SCOPE GUARD, load-bearing for D-5 (DoD) and widened by review. Both modes exit 0 having
      done and changed NOTHING, printing one line saying so, when ANY of these holds:
        - the cwd is not inside a linked worktree, resolved by harness_boundary.worktree_owner(),
          which correctly parses a .git FILE (harness_boundary.py:715-793) and returns UNKNOWN on
          parse failure. A fresh clone and a CI runner are not linked worktrees and the three
          hooks fire there too;
        - the resolved owner root has no .harness/<repo>/features directory at all;
        - the worktree's own basename is not a feature id by feature-worktree.py:46's _ID_RE.
      The last two exist because this file runs from core.hooksPath in EVERY worktree of every
      checkout, including probe and non-feature trees that legitimately hold none of this state.
      Without them the hook tier starts refusing trees this feature never claimed. The at-risk
      neighbours are tests/integration/test-post-merge-sweep.py and
      tests/integration/test-hooks-install.py; N-04 re-runs both.

      THE FIVE CHECKS, with the exit code each --verify failure returns. The codes are distinct
      because SC-09 asserts six broken inputs produce six distinguishable exits, and no two may
      share one.
        1. CONE. git sparse-checkout list equals the derived include set of D-08, which is THREE
           PARTS and is NOT top-level-minus-.harness: (a) every top-level tracked directory except
           .harness itself; (b) every MAXIMAL tracked directory under .harness that is disjoint
           from .harness/<repo>/features - at this pin .harness/expertise, .harness/factory,
           .harness/logs, .harness/notes, .harness/<repo>/docs and .harness/<repo>/expertise, and
           the ENUMERATION RECURSES because the last two sit two levels down, so .harness and
           .harness/<repo> are themselves never listed as whole entries; (c) plus
           .harness/<repo>/features/<basename-of-worktree> and nothing else beneath the features
           corpus. Derive (b) with git ls-tree -d -r -t --name-only HEAD -- .harness, keep every
           returned directory disjoint from .harness/<repo>/features, then drop any kept path whose
           own parent was also kept. Part (b) is not cosmetic: without it a worktree loses the
           fleet config, DECISIONS.md and the expertise files injected into every spawn, while git
           sparse-checkout set still exits 0 - measured, and recorded in D-08. Compare the WHOLE
           set, never just the feature entry.
           A DIRECTORY SET ONLY - there is no file entry and no index entry in the cone, because
           the branch-uniqueness index of D-01 is resolved at the OWNER ROOT and is never
           materialised into a worktree. Set equality, not sequence. Mismatch -> EXIT 3.
           Measured and settled, so no executor re-derives it: git sparse-checkout set in cone
           mode treats a FILE path as a hard fatal, exit 128, telling the caller to rerun with
           --skip-checks; with the flag it exits 0 and list round-trips the path. Since no file
           entry is ever added, --skip-checks is never used. Do not add it.
        2. SKIP-BITS. git ls-files -t; count the S-prefixed and H-prefixed paths. If the cone is
           correct but the S count is zero while paths outside the cone are tracked, the
           skip-worktree marks have been cleared -> EXIT 4. Repair is git sparse-checkout reapply,
           measured restoring 129 H / 3678 S from 3807 H / 0 S and taking git status --porcelain
           from 3678 lines back to 0.
        3. CORPUS SYMLINK PRESENT. os.path.islink('.harness/corpus') is True. False -> EXIT 5.
           Repair creates the symlink.
        4a. CORPUS SYMLINK TARGET. os.path.realpath('.harness/corpus') equals os.path.realpath of
           <owner-root>/.harness/harness/features. Mismatch -> EXIT 6. Repair replaces the link.
        4b. EXACTLY ONE FEATURE DIRECTORY. os.listdir('.harness/harness/features') has length 1
           and that name equals the worktree's own basename. Otherwise -> EXIT 7. Repair
           re-applies the cone.
        5. CLEAN TREE. git status --porcelain is empty. Non-empty -> --verify EXITS 8. --repair
           does NOT discard a dirty tree and does NOT fail on one: it REPORTS the dirty tree on
           stdout and EXITS 0, because --repair is what the three git hooks fire and a hook that
           exits non-zero makes git print an error after a merge or checkout that SUCCEEDED.
           --verify is what gates call and it is the mode that refuses. Repairing a dirty tree
           would mean deleting somebody's uncommitted work.
      Exit 0 is the passing state; exit 2 is a usage error. Every non-zero --verify exit prints
      its own distinct reason token, and the six tokens must be pairwise different strings.

      MESSAGE CONTRACT, three clauses, each separately asserted:
        - EACH of the six --verify messages names ITS OWN remedy - the command or act that fixes
          THAT check. Exit 8 says the tree is resolved BY HAND, by committing or stashing, and
          NEVER suggests --repair, which by the rule above does not clean a dirty tree. A shared
          generic remedy tail fails this clause.
        - NO --verify message contains a repair-completed verb - restored, reapplied, fixed,
          repaired. --verify changed nothing and its wording must not imply otherwise.
