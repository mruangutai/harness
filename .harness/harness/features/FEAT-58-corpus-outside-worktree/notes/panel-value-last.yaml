transcription_rule: 'THIS PASS (final panel, planpanellast-validator). Each PF- id on the seven open rows
  is computed once by pm with panel_findings.py id --reader <reader> --summary <summary>, taking that
  row''s OWN recorded reader and summary values verbatim as they appear here, so a later sign-approval
  --overrule PF-ID resolves against the recorded text and not against a reconstruction. The only normalization
  applied to digest prose is the removal of markdown emphasis and backticks, which plan.yaml values may
  not carry - ids are computed from the normalized value exactly as recorded here, never from the pre-normalization
  digest bytes. Severities, readers, lands_on, summaries, remedies and structural-versus-clause calls
  are the panel digest''s: nothing was re-ranked, re-worded into a different claim, merged, split, or
  given a disposition the digest does not state, and no finding is recorded as accepted, waived or risk-accepted.
  The six goal-check findings keep their goal-check labels H-01, M-01, M-02, L-01, L-02 and L-03 because
  the panel CONFIRMED them rather than re-raising them; the panel''s own new finding carries the run-local
  label NF-01 so it cannot collide with the carried PP-01..PP-06, PL-01..PL-04 or VL-01..VL-09 labels.
  The digest assigned no ids. The carried PP, PL and VL rows keep their existing PF- ids, labels, severities,
  summaries, reporters, lands_on, remedies and fix_order byte-for-byte; for the six PP rows only the disposition
  moved (plus an additive disposition_source naming where that move is evidenced), and prior_cycle is
  carried unchanged.'
