findings:
- label: PP-01
  severity: high
  reader: should-not-exist
  lands_on: N-13 PART 1
  summary: 'N-13 PART 1 says ''Run the SHIPPED check-state.sh with cwd at the owner root''. cwd is inert
    here. check-state.sh:22-49 resolves its root from _selfdir via harness_boundary.resolve_root, with
    the comment ''never from the environment and never from the caller''s cwd (FEAT-42 T-12)'', then cd
    $root. Lead-verified at source. The plan records this property about itself twice (D-01 on merge-gate''s
    ROOT; N-06 PART 3(c) on the extracted copy being ''wrong-rooted wherever it is staged''), so this
    is the feature''s own known mechanism applied to the one task that forgot it. Consequence: run from
    inside a feature worktree - where this suite runs during the build - the shipped copy audits the worktree,
    so clause 3''s non-vacuity floor (>70) fails against a sparse worktree that reaches 1. And the natural
    quiet resolution - invoking the copy of check-state.sh sitting at the owner root - runs the pre-change
    audit, which has no mismatch machinery, passes all four clauses, and leaves SC-16 green forever while
    proving nothing about shipped code. That is the wrong-subject fail-open this feature exists to remove.'
  remedy: Respell the invocation to run the worktree's shipped check-state.sh with HARNESS_PROJECT_DIR=<owner_root>
    - the marked override resolve_root honours at harness_boundary.py:66-78, and the owner root carries
    MARKER - and assert the resolver's discard notice is ABSENT from stderr, so a marker-less override
    cannot silently fall back to auditing the worktree (check-state.sh:36-46 keeps and replays that stderr).
    State explicitly that invoking the owner root's own copy is FORBIDDEN.
  reporter: should-not-exist (fable-advisor), transcribed from the lead's digest because that reader holds
    no write grant and has no artifact of its own; premise re-verified at source by the lead and measured
    again by the orchestrator at its own tier
  disposition: 'UNRESOLVED - open at the operator''s batched signature review under DEC-207. No agent
    in this chain risk-accepted it, waived it, resolved it or fixed it, and none may: risk acceptance
    is approval.rulings, the main session''s write alone. The digest states no other disposition.'
  fix_order: 'rank 1 of the digest fix order, TOGETHER WITH PP-05: the two are ONE respelling of PART
    1''s invocation and land in one pass.'
  id: PF-bad620b663538e3f588a594343f2cdb9
- label: PP-02
  severity: high
  reader: should-not-exist
  lands_on: N-13 PART 2
  summary: 'PART 2 clause 1 asserts worktree-state.py --verify at the freshly created probe exits 0, on
    the premise that post-checkout fired. core.hooksPath does not travel with a clone. Lead-verified in
    .github/workflows/tests.yml: git config core.hooksPath is set only inside the Repository-state gate
    step, which runs after the Integration suite step that would collect tests/integration/test-check-state-realdata.py.
    So in CI the probe is born unrepaired, is a full checkout with a feature-id basename, and --verify
    fails check 1 - wrong cone, exit 3. None of PART 2''s three announced-skip conditions (owner root
    unresolvable, empty corpus, no free probe id) covers this. integration is the sole required branch-protection
    context with enforce_admins: true - this reddens every PR in the repository from the day N-13 lands.
    Clause 1''s own framing, ''a non-zero here is a real mechanism failure and not a precondition to work
    around'', is false in that environment: it is deliberate CI state per the workflow''s own ordering.
    The same holds for any clone that has not been onboarded.'
  remedy: 'Add a fourth announced-skip condition, on the VL-02 shape PART 2 already uses - SKIP, printing
    the reason and naming the condition and asserting the line was printed, when the owner repository''s
    core.hooksPath does not resolve to the tracked .claude/skills/harness/hooks. The authoritative PART
    2 run stays local. Not recommended, but named so the operator can weigh it: moving the workflow''s
    hooksPath line ahead of the suite steps bends the CI runner to suit a check, the direction D-13 already
    rejected.'
  reporter: should-not-exist (fable-advisor), transcribed from the lead's digest because that reader holds
    no write grant and has no artifact of its own; premise re-verified at source by the lead in .github/workflows/tests.yml
    and measured again by the orchestrator at its own tier
  disposition: 'UNRESOLVED - open at the operator''s batched signature review under DEC-207. No agent
