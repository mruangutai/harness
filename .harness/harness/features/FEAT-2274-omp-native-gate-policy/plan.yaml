the captured pre-edit source, not a drifting HEAD predecessor; bounded test-process deadlines are allowed but no production timeout work is in scope. Keep the new integration suite plus the two scoped verify suites below 60 seconds total, with nonzero exit and named failure accounting. Expected verify result: every named assertion passes, no FAIL output, exit 0. Full active unit/integration matrix judgment remains validation's responsibility after all tasks, not an early whole-tree task gate.

