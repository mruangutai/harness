      Extend PolicyResult/runPolicy and every affected tool_call/tool_result caller so unavailable is not lost through firstBlock or an early return. For the four broad scripts only, synthesize the same unavailable outcome for non-2 unexpected exits, signal/null-status termination, failure before the Python guard loads, missing gate/interpreter, and spawnSync error or throw. Own execution failures allow the call and add passive additionalContext containing the gate name and the exact phrase nothing was checked; do not set block or isError for that failure and do not mark a successful result as an error. Preserve explicit structured deny and exit 2 as refusals. Emit one notice for each unavailable gate invocation, including repeated calls and multiple/pre/post invocations; no per-session cache or dedup. Compose additionalContext with existing input/env/schema revisions and tool-result content instead of replacing them. Keep existing claims, authoritative run-start/authorization refusals, schema-injection failures and non-policy command error handling intact; do not globally convert every runPolicy caller to a new fail-open or fail-closed posture.
      Make gh-close-gate, branch-create-gate and plan-sign-gate closed on their own failures, but only AFTER determining command applicability. Matching must precede root resolution, repository/library/config loads and closed guard entry; unrelated Bash must bypass those dependencies. The extension must likewise determine applicability before a missing executable or spawn error can be treated as a closed failure. Use each current gate's supported command semantics and exemptions, including plan-sign gated feature-record verbs, nested/quoted/split/indirect spellings its tests protect, branch-creation forms and gh close/API forms; do not replace semantic matching with a coarse substring that blocks unrelated commands. Build-design assignment: before writing code choose and record the smallest matching arrangement within these owned runtime files that satisfies both direct script invocation and extension startup/spawn-failure classification; this plan deliberately does not require a second general-purpose shell parser, shared startup dependency, new dependency, or one-process Bash redesign. The observable contract above is fixed and cannot be weakened by that choice. Preserve isolated trusted-path bootstrap mechanics and merge-gate's existing posture. Cover #2107 with a flow branch and malformed feature.json whose github.parent contains the Unicode digit that raises ValueError, proving a named refusal rather than exit 1.
      Delete ONLY dispatch-guard's spawns allowlist regex/frontmatter lookup and its refusal guidance, leaving all other checks and registry work unchanged. Keep every persona spawns list unchanged. Do not add owner-root parity checks, a replacement allowlist or a fork. Register before_subagent_spawn independently of currentAgent: when the target agent matches harness-* and invocationKind is anything except task, return block true with a reason directing the caller to task. Apply to Main, governed parents and any other caller. Non-governed targets and governed task invocation continue normally. Native assertDepthAndSpawnAllowed alone enforces which targets a caller may spawn.
