enuinely cheaper - about six edits, no new import surface inside the embedded python, zero risk to INV-26's runtime - and it fixes today's divergence while preserving the mechanism that hides tomorrow's. The cost bought instead is one more file on T-06 and a gh_board import that could fail at gate time; that import already exists and already fails LOUDLY at check-state.sh circa 1362-1369 at 0d4845b, which was 1337-1349 at ee66ae2, so the new failure mode is already paid for. Loud beats silent, and converting exactly this class of silence into noise is why the feature exists. T-04 still repoints the literals it renames out from under, so no build ordering leaves INV-26 blind between T-04 and T-06; that is T-04 not breaking a gate, not a substitute for this decision. PROVENANCE RECORDED 2026-08-30, AND IT WAS MISSING UNTIL THEN - this decision REVERSES a line the grilling settled, at .harness/notes/grilling-845-one-vocabulary-2026-08-25.md:46 - "Backlog does not participate in the sync." Under the no-exception rule above a task at the backlog station projects to the Backlog column, and therefore DOES participate. The reversal is deliberate and is the right call - a carve-out is exactly the two-words-two-meanings shape this feature exists to delete - but it was made silently, and a decision that overturns the intake it grew from has to say so, or a reader who goes back to the grilling finds a settled line with nothing marking it overtaken
