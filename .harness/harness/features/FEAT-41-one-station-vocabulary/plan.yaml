tasks:
  - id: T-01
    title: Declare the six stations once, as an ordered lowercase list in harness.json
    traces: [REQ-01]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: factory_config.py is the board validator every factory and mirror tool loads through
    depends_on: []
    status: done
    files:
      - .harness/harness.json
      - .agents/skills/harness/templates/harness.json
      - .claude/skills/harness/bin/factory_config.py
      - .claude/skills/harness/bin/test-factory-config.py
    verify: |
      python3 .claude/skills/harness/bin/test-factory-config.py
      grep -rn --exclude-dir=__pycache__ "_STATION_KEYS" .claude/skills/harness/bin/ ; test $? -eq 1
      python3 -c "import sys;sys.path.insert(0,'.claude/skills/harness/bin');import gh_board,board_lifecycle;b=gh_board.load_board('.');assert b is not None,'no board declared';print('_declared_stations ->',board_lifecycle._declared_stations(b))"
      .claude/skills/harness/bin/check-state.sh > /tmp/feat41-t01.out 2>&1 ; grep -q "Traceback" /tmp/feat41-t01.out ; test $? -eq 1
    intent: |
      Make harness.json the one place the station vocabulary is declared, and mandate its content.

      THIS TASK WAS BUILT, GREEN, AND REVERTED ON 2026-08-30, AND THAT IS WHY ITS VERIFY IS NOW
      HEAVIER THAN ITS EDIT. It landed at cd4aca6 with test-factory-config.py reporting 112/112
      and the _STATION_KEYS absence grep clean, and it took the project's own state gate down:
      turning github.board.stations from a MAPPING of six keys into an ordered LIST breaks every
      consumer that subscripts it by name. board_lifecycle._declared_stations
      (board_lifecycle.py:441) raises "TypeError: list indices must be integers, not str",
      check-state.sh tracebacks out of its INV-26 board block and exits 1, and gh-sync.py reaches
      the same path through audit_findings. Reverted at 33e716c; history intact. THE VERIFY COULD
      NOT SEE ANY OF IT, because it exercised factory_config in ISOLATION and grepped for an
      identifier's absence - a config SHAPE change with no cross-module consumer test. That class
      is filed as issue #1033, and the two added verify lines are what close it here: one drives a
      real consumer against the LIVE declaration, the other runs the gate itself and refuses a
      traceback. Neither is reachable by a fixture-based unit test.

      T-01 AND T-02 ARE ONE ATOMIC SHAPE CHANGE AND LAND IN ONE COMMIT, and the verify now
      ENFORCES that rather than asking for it: the consumer smoke CANNOT pass on T-01 alone,
      because T-02 is what repoints the consumers. AUDITED AT HEAD ON 2026-08-30 so the coupling
      is a measured list and not a warning - EIGHT non-test modules read board["stations"] as a
      mapping: board_lifecycle.py (:441, :525, :812, :823), check-state.sh (:1428), gh-sync.py
      (ten sites), gh_board.py (:116, :118), factory_claim.py (:273, :307, :424),
      factory_decompose.py (:328), factory_land.py (:95), and factory_config.py's own
      board_station (:315). EVERY ONE is named in some surviving task's files - the audit found
      ZERO orphans, so the plan does repair them all - but five of those modules are repointed by
      T-02, and T-01 alone leaves the gate face-down in between.

      In .harness/harness.json, replace github.board.stations (today a mapping of six keys to six
      capitalised names) with an ordered list of the six lowercase names:
      ["backlog", "plan", "ready", "building", "review", "done"]. Rewrite the note that sits
      beside it - in .harness/harness.json the key is github.board._note, NOT _board_note - so it
