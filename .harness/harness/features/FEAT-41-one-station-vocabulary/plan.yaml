tasks:
  - id: T-01
    title: Declare the six stations once, as an ordered lowercase list in harness.json
    traces: [REQ-01]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: factory_config.py is the board validator every factory and mirror tool loads through
    depends_on: []
    status: pending
    files:
      - .harness/harness.json
      - .agents/skills/harness/templates/harness.json
      - .claude/skills/harness/bin/factory_config.py
      - .claude/skills/harness/bin/test-factory-config.py
    verify: |
      python3 .claude/skills/harness/bin/test-factory-config.py
      grep -rn "_STATION_KEYS" .claude/skills/harness/bin/ ; test $? -eq 1
    intent: |
      Make harness.json the one place the station vocabulary is declared, and mandate its content.

      In .harness/harness.json, replace github.board.stations (today a mapping of six keys to six
      capitalised names) with an ordered list of the six lowercase names:
      ["backlog", "plan", "ready", "building", "review", "done"]. Rewrite the note that sits
      beside it - in .harness/harness.json the key is github.board._note, NOT _board_note - so it
      states the mandate: these six names are fixed, an operator may not rename them, and extra
      columns an operator adds to the board are untouched by the harness.
      Make the same change to .agents/skills/harness/templates/harness.json, where the key IS
      github._board_note and sits one level up, outside a board value that stays null. The two
      files spell this key differently today; do not assume either spelling, open both.

      In factory_config.py:
      - Delete _STATION_KEYS (line 41).
      - Add MANDATED_STATIONS = ("backlog", "plan", "ready", "building", "review", "done") as the
        single literal, with a comment saying it is the mandate the declaration is checked
        against, not a second vocabulary.
      - Add TERMINAL_MARKER = "abandoned" beside it, with a comment that it names no board column,
        never reaches the board, and is therefore not a seventh station. This module is where it
        lives because plan-merge.py, check-plan-routes.py and check-domain.sh each need it and
        each already imports or can import factory_config; every one of those sites imports the
        name rather than respelling the literal.
      - validate_board: require board["stations"] to be a list whose value equals
        list(MANDATED_STATIONS) exactly, in that order. Anything else raises FleetError with
        where=<key_base>.stations and a remedy line naming the exact list to write. Keep the
        existing FleetError shape (kind, key, remedy) unchanged. The returned board carries
        stations as a tuple of the six lowercase names.
      - Add station_names(board) returning that tuple.
      - Add station_column(name): the ONE derivation of the board's exact column name. It raises
        FleetError("unknown station", name, "known stations: ...") when name is not one of the
        six, and otherwise returns name.capitalize(). Its docstring states that this is the only
        place in the tree a capitalised station name is produced, and that .capitalize()
        reproduces all six declared names exactly.
      - board_station(fleet, repo_name, key) keeps its name and signature but now returns
        station_column(key) after checking membership in station_names(board_for(...)).

      In test-factory-config.py, replace the mapping-shaped fixtures with the list shape and add
      cases: (a) a declaration that renames one station is refused, and the message names the
      offending key; (b) a declaration with the six names in a different order is refused;
      (c) station_column returns each of the six exact column names, asserted ONE CASE PER
      STATION rather than by a set comparison; (d) station_column raises on TERMINAL_MARKER and
      on "Done". Each new case must be shown failing before the change lands.

  - id: T-02
    title: Lowercase everything the harness stores or compares, capitalise only at the GitHub boundary
    traces: [REQ-02]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: gh_board.py is imported by check-state.sh's INV-26, the validator that gates this run
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/gh_board.py
      - .claude/skills/harness/bin/gh-sync.py
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/board-station.py
      - .claude/skills/harness/bin/factory_claim.py
      - .claude/skills/harness/bin/factory_land.py
      - .claude/skills/harness/bin/factory_decompose.py
      - .claude/skills/harness/bin/check-state.sh
      - .claude/skills/harness/bin/test-gh-board.py
      - .claude/skills/harness/bin/test-board-lifecycle.py
      - .claude/skills/harness/bin/test-board-station.py
      - .claude/skills/harness/bin/test-factory-claim.py
      - .claude/skills/harness/bin/test-factory-land.py
      - .claude/skills/harness/bin/test-factory-decompose.py
      - .claude/skills/harness/bin/test-check-state.py
    verify: |
      python3 .claude/skills/harness/bin/test-gh-board.py
      python3 .claude/skills/harness/bin/test-board-lifecycle.py
      python3 .claude/skills/harness/bin/test-factory-claim.py
      python3 .claude/skills/harness/bin/test-factory-land.py
      python3 .claude/skills/harness/bin/test-check-state.py
    intent: |
      Make gh_board.py the single case boundary, and lowercase every other site.

      In gh_board.py:
      - set_station(board, repo, issue_number, station): station now arrives lowercase. Call
        factory_config.station_column(station) and pass THAT to factory_gh.project_field_set.
        A station outside the six raises FleetError from station_column; let it propagate.
        The BoardError message keeps naming the station the caller asked for, lowercase.
      - board_stations(board, repo): lowercase each item's station value before storing it
        (item.get("station") or None, then .lower() when it is a string). None stays None.
        Say in the docstring that a value read back from the board is lowercased here so no
        comparison anywhere else has to know the board's casing.
      - derive_station: return the lowercase names "building" and "review" directly rather than
        indexing board["stations"]. Keep the rule unchanged: building when any task is building,
        review when there is at least one task and every task is done, otherwise None. The board
        parameter is then DEAD - its only two uses are the two indexings just removed - so drop it
        from the signature and from both call sites, which are check-state.sh's INV-26 and
        board_lifecycle. Leaving a parameter the body never reads contradicts the docstring's own
        claim that plan.yaml is the sole input.
      - The absent-status default at gh_board.py:113 and the docstring sentence at :97 both say
        pending. Both become the not-started station name "ready". This is inert until T-04
        migrates the plans - neither derive_station branch tests the default - which is exactly
        why it belongs here rather than in T-04: it changes no behaviour and removes the word.

      Everywhere else, replace board["stations"][k] with the lowercase literal k, EXCEPT where the
      value is sent to GitHub or compared against a value GitHub returned outside board_stations:
      - factory_claim.py:302 builds a search query containing the column name - use
        factory_config.station_column("ready") there.
      - factory_claim.py:419 and factory_land.py:95 pass a station to a factory_gh field write -
        use station_column at that call.
      - factory_decompose.py:328 validates the board's declared options against the config - use
        station_column for each name it compares.
      - board_lifecycle.py:438 _declared_stations returns the names it audits the board's columns
        against - it must return the column names, so map station_column over the six.
      - board_lifecycle.py:522 and :809-843 compare against values that now come from
        board_stations, which are lowercase - compare lowercase, delete the value_to_key
        inversion at :820 (a lowercase station IS its own key).
      - gh-sync.py:844, 850, 941, 949, 998, 1231 become the lowercase literals.
      - check-state.sh circa 1403 _st26 becomes the six lowercase names, and every INV-26
        comparison is then lowercase on both sides because board_stations lowercased the board's
        answer. T-06 later DELETES _st26 and _EXPECT outright under D-11; this task only
        lowercases them, so the tree is green at each step. Do not anticipate T-06 here.
      - board-station.py keeps accepting an operator-supplied station on the command line, but now
        validates it against factory_config.station_names before calling set_station, and exits
        non-zero naming the six when it is not one of them. Update its module docstring, which
        currently says the station is never validated against a list.

      Update each named test to the lowercase expectations, and add one case to test-gh-board.py
      asserting that set_station passes "Done" to project_field_set when given "done", and that
      board_stations lowercases a board value of "Review" to "review".

  - id: T-03
    title: Give the plan writer its station verbs, each validating against harness.json
    traces: [REQ-03, REQ-05]
    change_type: api
    execution_mode: main-session-direct
    execution_reason: plan-merge.py is the only code that writes plan.yaml and this run records its own task statuses through it
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/plan-merge.py
      - .claude/skills/harness/bin/test-plan-merge.py
    verify: |
      python3 .claude/skills/harness/bin/test-plan-merge.py
    intent: |
      Extend plan-merge.py from one verb to five. Every verb writes through
      harness_merge.locked_update and the existing text splice - nothing re-renders through a YAML
      dumper, and require_destination (exit 9) still guards every path.

      Verbs:
      - apply --file <plan.yaml> --proposal <path or ->: unchanged behaviour, including exit 7 on
        a changed value and exit 8 on a differing approval mapping. ADD-ONLY IS NOW A PROPERTY OF
        THIS VERB, not of the tool: say so in the module docstring and in this verb's help, and
        state that the lock and the splice are what fix issue 628, while add-only is a separate
        promise this verb alone makes.
      - add-tasks --file <plan.yaml> --proposal <path or ->: an alias of apply kept for callers
        that only add tasks; identical code path, no second implementation.
      - set-task-station --file <plan.yaml> --task T-NN --station <name>: replaces that task's
        status value in place, under the lock, by splicing the one line. Exit 3 when the task id
        is absent, naming the ids the plan does carry.
      - set-feature-station --file <plan.yaml> --station <name>: sets or inserts the TOP-LEVEL
        status key. Insert it immediately after the feature: key when absent, so the file keeps a
        stable order.
      - sign-approval --file <plan.yaml> --by <name> --date <YYYY-MM-DD>: the ONLY way the
        approval mapping is ever written. It sets status: approved, approved_by and date, under
        the lock. Every other verb still leaves the base's approval bytes byte-identical, and
        exit 8 still refuses a proposal carrying a different one.

      Station validation, shared by set-task-station and set-feature-station: load the station
      vocabulary through factory_config.station_names against the harness.json of the checkout the
      target plan.yaml belongs to, and accept a value only if it is one of those six or
      factory_config.TERMINAL_MARKER, which T-01 declares. IMPORT IT; do not declare a second copy
      here and do not spell the literal. This module is imported by nothing, so a declaration here
      would be respelled as a bare literal by check-plan-routes.py and check-domain.sh and D-05's
      own claim that the marker is declared once in code would be false the day it landed.
      Anything else exits 4 with one line naming the offending value and listing the legal ones.
      The check happens BEFORE the lock is taken, so a refused value never opens the file.

      Exit codes are the interface, so extend the docstring's table: 3 unknown task id, 4 illegal
      station, and the existing 5, 6, 7, 8, 9 unchanged.

      In test-plan-merge.py add cases, each demonstrated failing first: set-task-station changes
      exactly one task's line and leaves every other byte identical; set-feature-station inserts
      the key when absent and replaces it when present; an illegal station exits 4 and writes
      nothing; sign-approval writes the three approval fields and is the only verb that can;
      apply still exits 7 on a changed task value after the new verbs exist.

  - id: T-04
    title: Retire pending, building, done - plan.yaml adopts the station vocabulary
    traces: [REQ-03]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: check-plan-routes.py is named in DEC-174 amendment 4 as a carve-out surface
    depends_on: [T-03]
    status: pending
    files:
      - .claude/skills/harness/bin/check-plan-routes.py
      - .claude/skills/harness/bin/test-check-plan-routes.py
      - .claude/skills/harness/bin/harness_yaml.py
      - .claude/skills/harness/bin/check-state.sh
      - .claude/skills/harness/bin/test-check-state.py
      - .agents/skills/harness/templates/plan.yaml
    verify: |
      python3 .claude/skills/harness/bin/test-check-plan-routes.py
      python3 .claude/skills/harness/bin/test-check-state.py
      python3 .claude/skills/harness/bin/check-plan-routes.py
      grep -rn "^    status: pending" .harness/harness/features/*/plan.yaml ; test $? -eq 1
      python3 -c "import glob,json,os,yaml;f=lambda p:(json.load(open(p)).get('status') or '').lower() if os.path.exists(p) else '';bad=[(p,t.get('id')) for p in glob.glob('.harness/harness/features/*/plan.yaml') for t in (yaml.safe_load(open(p)).get('tasks') or []) if t.get('status')=='ready' and f(os.path.join(os.path.dirname(p),'feature.json')) in ('done','abandoned')];assert not bad,bad"
    intent: |
      Replace plan.yaml's private three-value vocabulary with the mandated station vocabulary, and
      migrate every live plan onto it.

      In check-plan-routes.py:
      - Delete LEGAL_TASK_STATUSES (line 415) and its paragraph of comment. Read the legal set
        from factory_config.station_names plus factory_config.TERMINAL_MARKER, exactly as the
        writer does; import the marker, never respell it. Keep the comparison case sensitive and
        keep the existing violation message shape, which already names the offending value.
      - Add the same check for the TOP-LEVEL status key when present: a feature station outside
        the vocabulary is a violation naming the value.
      - FINISHED_STATUSES (line 408) currently holds the capitalised feature.json values. It now
        holds the lowercase ("done", factory_config.TERMINAL_MARKER). Leave _is_shipped reading
        feature.json in this task - T-07 repoints it.
      - Two COMMENTS in this file still spell the old capitalised vocabulary and go stale with
        this change: :336, which uses "Building" as the example of the capital-B typo, and :455,
        which says done is not "Done" and stays checked. Rewrite both against the one vocabulary
        rather than leaving prose that teaches the reader a distinction the code no longer makes.
        SC-02 grades quoted capitalised literals without excusing comments, so these two count.

      In harness_yaml.py's load_plan, leave REQUIRED_TASK_FIELDS alone: status stays optional, and
      an absent status still reads as the not-started station.

      In .agents/skills/harness/templates/plan.yaml, change the task status comment from
      "pending | done" to the six station names plus abandoned, add the top-level status key with
      a one-line comment saying it is the feature's station and is written only by the tool, and
      replace the paragraph telling an author to edit the file with one naming the verbs.

      ALSO IN THIS TASK, because this task is what makes the word dead: check-state.sh's INV-26
      compare side still keys on pending. Circa 1403-1405 _EXPECT maps building, done and pending;
      rename the pending key to ready AND MAP IT TO THE READY STATION, not to backlog. D-11 removes
      the ready-to-backlog exception outright: plan.yaml and the board carry the same word with the
      same meaning, and nothing is derived between them. DELETE the comment above the definitions
      that justified the old mapping rather than rewriting it - the rule it explained no longer
      exists, and T-06 deletes the definitions themselves a step later. Then fix the four remaining
      pending literals circa 1437, 1438, 1471 and 1475, where an absent task status defaults to
      pending: the default becomes ready. The guard circa 1440, not any(_s != "pending"), INVERTS
      under the rename - every migrated task would read ready, so the not-any test that means
      nothing has started would become false for every feature and the skip would stop firing.
      Rewrite it against the not-started station. Add one test-check-state.py case per _EXPECT key
      - one for ready, one for building, one for done - because a single fixture cannot see a key
      that was never migrated. This is NOT the D-11 fix; T-06 deletes _EXPECT entirely and routes
      the compare side through gh_board.project. This clause exists only so no build ordering
      leaves INV-26 blind in the window between the two tasks.

      MIGRATION, and it goes through the tool, never by hand: for every plan.yaml under
      .harness/harness/features/, rewrite each task status pending -> ready, building -> building,
