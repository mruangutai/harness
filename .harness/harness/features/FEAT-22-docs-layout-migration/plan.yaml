      rec=$(sed -n 's/^survivors: \([0-9][0-9]*\)$/\1/p' "$f" | head -1)
      test -n "$rec" || { echo "no audited survivor count"; exit 1; }
      fresh=$(git grep -lE "$P" -- . ":!$F" | wc -l | tr -d ' ')
      test "$rec" = "$fresh" || { echo "note says $rec survivors, tree has $fresh"; exit 1; }
      exp=".claude/skills/harness/bin/layout_fixtures.py:3
      .claude/skills/harness/bin/layout_migration.py:6
