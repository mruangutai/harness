      Write a line reading exactly:
        survivors: <count>
      and, beneath it, one line per survivor CLASS naming the rule that makes it a survivor. A
      shipped record is a record of what was true; a dated log entry likewise; the detector's
      legacy patterns are how it recognises a pre-migration tree; a negative-direction test subject
