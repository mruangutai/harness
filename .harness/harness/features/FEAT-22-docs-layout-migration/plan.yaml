      grep -q '^features: CLEAN — evidence migrated$' "$d" || { cat "$d"; exit 1; }
      grep -qE '^examined [0-9]+ feature dir\(s\), [1-9][0-9]* doc root\(s\), [1-9][0-9]* reader file\(s\)$' "$d" \
        || { cat "$d"; exit 1; }
      test "$rd" = 0 || { cat "$d"; exit 1; }
      B=.claude/skills/harness/bin
      $B/run-unit-tests.sh --kind unit || { echo "unit suite red on the committed tree"; exit 1; }
      $B/run-unit-tests.sh --kind integration || { echo "integration suite red on the committed tree"; exit 1; }
      c=$(mktemp); git show --name-only --format= HEAD >"$c"
      grep -q 'FEAT-22-docs-layout-migration' "$c" && { echo "the cluster commit swept the feature dir"; exit 1; }
      grep -qx '\.harness/harness/docs/SPEC\.md' "$c" || { echo "HEAD is not the cluster commit"; exit 1; }
      while read -r p; do
