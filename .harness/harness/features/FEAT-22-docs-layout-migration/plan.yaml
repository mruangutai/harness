      .harness/harness/features/FEAT-21-features-layout-migration/notes/layout-boundary-2026-08-14.md,
      and append a section headed DEPTH SWEEP to this feature's boundary note.

      THE METHOD IS LITERAL-FREE. Do not sweep for the string. FEAT-21's three worst defects carried
