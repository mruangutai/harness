    intent: |
      Close the cluster. Everything T-02 through T-08 changed is still uncommitted; this task
      regenerates the one derived artifact, proves the post-state, and makes the single commit.

      FIRST regenerate the index in place:
        python3 .claude/skills/harness/bin/gen-decisions-index.py
      It must be run AFTER T-08, because T-08 appends an amendment and every @line anchor below
      DEC-189 shifts. Everything right of ' :: ' on a row is hand-written and preserved verbatim
      across regeneration; if any hand-written ruling text is lost, stop and restore it. Confirm
      the regenerated header now names .harness/harness/docs/DECISIONS.md rather than the legacy
      spelling, which is the committed-artifact defect this unit was assigned.

      THEN run the two gates and read them, do not merely exit on them:
        python3 .claude/skills/harness/bin/layout_migration.py
        bash .claude/skills/harness/bin/check-state.sh
      The detector must print docs: CLEAN — evidence migrated AND features: CLEAN — evidence
      migrated, a summary of 2 surface(s) clean, 0 mixed, 0 cannot-verify, and a non-zero doc-root
      count, at exit 0. A non-zero doc-root count is one of the CI Layout gate's only two real
      constraints; the other is this exit code. If the docs surface is MIXED, find which reader
      disagrees before changing anything: the detector names the file and its formset, and the
      answer is almost always a site T-03, T-04 or T-05 left behind.

      Compare check-state.sh's note-line count against the PRE-MOVE capture in T-01's note rather
      than reading its exit code alone. A gate that has stopped discovering anything exits 0 too;
      FEAT-21 recorded both of its gates passing mid-cluster while examining nothing. READ
      check-state.sh, do not gate on it: its verdict also moves with this feature's own approval and
      task statuses, so its mid-feature exit code is not a figure this plan can pin. The verify
      asserts the two suites, which are what SC-07 and SC-08 name.

      THEN run BOTH suites and require each to exit 0, before committing anything:
        .claude/skills/harness/bin/run-unit-tests.sh --kind unit
        .claude/skills/harness/bin/run-unit-tests.sh --kind integration
      This is the only point in the feature where the whole suite is expected green: T-05 runs with
      test-gen-decisions-index.py FAILing on the stale committed index, and the regeneration above
      is what clears it. If either suite is red, the cluster does NOT get committed — find the
      reader or fixture the earlier tasks left behind and fix it first. The verify re-runs both
      against HEAD after the commit, which is the same tree, so the commit is what carries the
      evidence SC-07 and SC-08 rest on.

      THEN make ONE commit containing every change from T-02 through T-09: the grant, the five
      renames, the three resolvers, the four detector-invisible sites, the eleven test files, the
      six instruction-side files, the notes audit tool .harness/notes/audit-decisions.py, the two
      Expertise files, the DEC-189 amendment and this regenerated index — and NOTHING under this
      feature's own directory. Nothing from this cluster lands in any other commit.
      The audit tool is listed as its own item and not folded into the instruction-side six: it is
      an executable that reads the moved docs at module scope, so it breaks at import rather than
      going stale as prose.

      STAGE IT LIKE THIS, exactly:
        git add -u -- . ':!.harness/harness/features/FEAT-22-docs-layout-migration'
      git add -A and git add . are FORBIDDEN here. Every file in the cluster is already tracked —
      the five docs were staged as renames by T-02's git mv, and everything else is a modification —
      so -u stages the whole cluster and nothing else. -A would additionally sweep the untracked
      boundary note and this feature's run directories into the commit, which breaks SC-04's claim
