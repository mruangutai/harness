  - id: T-11
    title: Capture the post-move boundary against the landed commit
    traces: [REQ-03]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: The capture must be taken by whoever holds the landed tree; D-03.
    depends_on: [T-10]
    status: done
    files:
      - .harness/harness/features/FEAT-22-docs-layout-migration/notes/layout-boundary-2026-08-15.md
    verify: |
      f=.harness/harness/features/FEAT-22-docs-layout-migration/notes/layout-boundary-2026-08-15.md
      grep -q 'POST-MOVE' "$f" || { echo "no POST-MOVE section"; exit 1; }
      grep -q 'docs: CLEAN — evidence migrated' "$f" || { echo "post-state not verbatim"; exit 1; }
      grep -qE '^POST-MOVE HEAD: [0-9a-f]{7,40}' "$f" || { echo "no landed SHA"; exit 1; }
      n=$(git ls-files docs/harness | wc -l | tr -d ' ')
      m=$(git ls-files .harness/harness/docs | wc -l | tr -d ' ')
      test "$n" = 0 || { echo "legacy still tracked: $n"; exit 1; }
      test "$m" = 5 || { echo "expected 5 tracked docs, got $m"; exit 1; }
      echo OK
    intent: |
      Append a POST-MOVE section to the boundary note, mirroring T-01's PRE-MOVE section exactly so
      the two can be read side by side.

      Write a line reading exactly:
        POST-MOVE HEAD: <output of git rev-parse HEAD>
      This is the cluster commit from T-09, and naming it is what makes the capture falsifiable: an
      untracked capture with no SHA cannot be told apart from one taken at a different tree.

      Then the VERBATIM stdout of both commands, each fenced, each followed by exit: <code>:
        python3 .claude/skills/harness/bin/layout_migration.py
        bash .claude/skills/harness/bin/check-state.sh

      Then a short RECONCILIATION paragraph answering three questions in order, each with the
