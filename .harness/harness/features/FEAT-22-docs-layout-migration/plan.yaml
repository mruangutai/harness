      Use a subject naming the unit and the migration, and confirm with git show --stat that the
      five docs appear as RENAMES rather than as a delete-plus-add pair.

      THE VERIFY AUDITS THE COMMIT'S FILE LIST, not just its exclusions. -u stages every modified
      tracked file in the repository, and the pathspec excludes only this feature's directory, so
      an unrelated edit sitting in the tree — a dated log, a stray fixture — would ride along and
      the exclusion check would not see it. The verify therefore requires every committed path to
      fall under a prefix this plan names, and requires at least 29 files. 29 is the enumerated
      cluster: team-config.yaml, the three resolvers, T-04's six, T-05's five, T-06's six
      instruction-side files, T-06's seventh file .harness/notes/audit-decisions.py, the two
      Expertise files, and the five docs at their new path counted as renames — 1+3+6+5+6+1+2+5.
      It is a FLOOR, not an equality, so a task that legitimately touches one more file inside
      those prefixes does not red it; a file outside them reds it whatever the count.
      The allow-list above admits .harness/notes/audit-decisions.py by its exact path rather than
      by a .harness/notes/* glob, deliberately: dated grillings and handoff notes are written into
      that directory routinely, and a glob would let an unrelated one ride the cluster commit
      silently — the exact class this audit exists to catch.

