  - id: T-09
    title: Regenerate the index, prove both boundaries, and land the cluster as one commit
    traces: [REQ-02, REQ-03, REQ-06]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: It closes the atomic commit every preceding main-session-direct task fed (D-03).
