           the features surface reading CLEAN — evidence migrated at BOTH captures?
        2. Is the tracked-file count under the legacy location 0, and 5 at the destination, org.html
           included? git ls-files answers both; use tracked files, never directory existence, since
           two untracked .DS_Store files keep the old directory on disk.
        3. Did check-state.sh's note-line count move for any reason other than this feature? A gate
           that stopped discovering anything also exits 0.

      If any answer is no, do NOT record the capture as clean. Record what you saw and stop.

      FINALLY, COMMIT THE NOTE. It has been untracked since T-01 and the cluster commit deliberately
