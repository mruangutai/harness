      .claude/skills/harness/bin/test-check-state.py:1
      .claude/skills/harness/bin/test-layout-migration.py:1"
      exp=$(echo "$exp" | sed 's/^ *//')
      got=$(git grep -cE "$P" -- .claude CLAUDE.md .harness/expertise | sort)
      test "$got" = "$exp" || { echo "live-surface survivor table differs."; \
        echo "EXPECTED:"; echo "$exp"; echo "GOT:"; echo "$got"; exit 1; }
