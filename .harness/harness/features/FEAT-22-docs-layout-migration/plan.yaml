decisions:
  - id: D-01
    choice: >-
      The docs grant and the control-plane entry both take a WILDCARD repository segment,
      .harness/*/docs/** , not the literal .harness/harness/docs/** .
    because: >-
      It mirrors the shape FEAT-21 already signed for the features surface
      (.harness/*/features/** in team-config.yaml), and the detector's migrated regex for
      harness_boundary.py accepts it. A second shape for the same idea is a second thing to
      remember.
    dec: none
  - id: D-02
    choice: >-
      The HARNESS_CONTROL_PLANE docs entry is REWRITTEN in place and kept, even though it becomes
      logically redundant once the path starts with .harness.
    because: >-
      The list has TWO consumers and the entry is redundant in both. is_control_plane_target
      short-circuits on is_control_plane_glob, which returns true for any first segment of
      .harness; and the deny-message advertise filter in classify — the comprehension over
      applicable_globs that also iterates HARNESS_CONTROL_PLANE — accepts any glob the migrated
      entry could match on its own is_control_plane_glob call, on the same line. So the entry
      decides nothing anywhere in the file. It is kept because the detector's migrated pattern
      requires the string to be present, and deleting it makes the file match neither form, which
      is CANNOT_VERIFY. The redundancy is recorded in the rewritten comment rather than silently
      carried.
    dec: none
  - id: D-03
    choice: Every task in this feature is main-session-direct. No squad is dispatched.
    because: >-
      Two DEC-174 carve-out scripts are touched, harness_boundary.py is a carve-out by content
      under DEC-193, and six surfaces including the destination itself resolve to NOBODY at the
      pin. Mixing lanes inside one atomic commit would split the commit.
    dec: DEC-174
  - id: D-04
    choice: >-
      The two Expertise files carrying present-tense docs-path claims are corrected by a NAMED
      TASK inside the cluster commit, not by a distillation pass and not silently.
    because: >-
      They are injected into every spawn of their role, so a stale path becomes a false premise on
      every future run. FEAT-21 made this identical correction inside a cluster commit with no task
      naming it, and two reviewers raised the unnamed edit as a structural gap (ship review B-8).
      Naming it is the fix that finding asks for. This lane needs the user's signature because it
      writes an Expertise file outside distillation.
    dec: DEC-145
  - id: D-05
    choice: >-
      DEC-189 receives a recorded AMENDMENT stating the new spelling of its docs entry, authored in
      the cluster commit under this plan's approval.
    because: >-
      DEC-189's ruling enumerates docs/harness/** as one of four named control-plane paths, and the
      move makes that sentence false of the tree. DEC-188 strikes only a decision the tree flatly
      contradicts; this rule survives with a changed spelling, so it amends. Amending a signed
      decision is not pm's to do unilaterally, which is why it is a decision here and a task below.
    dec: DEC-189
  - id: D-06
    choice: .github/workflows/tests.yml is NOT changed by this feature.
    because: >-
      Measured at :183-233, the Layout gate asserts only the two line shapes, non-zero counts and
      the checker exit code. No per-surface string is asserted anywhere in the file, so the
      upstream premise that an expectation must flip is false. Recorded so a future scan does not
      re-propose the edit.
    dec: none
  - id: D-07
    choice: >-
      161 of the 196 files mentioning the docs path at 0f12f14 are left untouched as knowing
      survivors, by a stated rule rather than by a sweep. Both figures are the pin's, not a target:
      T-10 derives the survivor count fresh from the landed tree.
    because: >-
      Shipped feature records and dated logs are records of what was true, not claims about what
      is. Rewriting them falsifies the factory's own history, and the detector is explicit that it
      proves per-file form agreement and never per-site completeness, so a sweep buys no verdict it
      does not already have.
    dec: none

tasks:
  - id: T-01
    title: Capture the pre-move boundary and name the red states the cluster passes through
    traces: [REQ-03]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: >-
      The capture must be taken by whoever holds the tree at the boundary, and every surrounding
      task is main-session-direct under D-03.
    depends_on: []
    status: done
    files:
      - .harness/harness/features/FEAT-22-docs-layout-migration/notes/layout-boundary-2026-08-15.md
    verify: |
      f=.harness/harness/features/FEAT-22-docs-layout-migration/notes/layout-boundary-2026-08-15.md
      test -s "$f" || { echo "no boundary note"; exit 1; }
      grep -q 'PRE-MOVE' "$f" || { echo "no PRE-MOVE section"; exit 1; }
      grep -q 'docs: CLEAN — evidence legacy' "$f" || { echo "pre-state not verbatim"; exit 1; }
      grep -q 'features: CLEAN — evidence migrated' "$f" || { echo "features pre-state missing"; exit 1; }
      grep -qE '^HEAD: [0-9a-f]{7,40}' "$f" || { echo "no SHA line"; exit 1; }
      grep -q '^SUITES' "$f" || { echo "no SUITES section in the pre-move capture"; exit 1; }
      grep -qE '^(PASS|FAIL) test-layout-migration\.py' "$f" \
        || { echo "no verbatim unit-suite result line in the capture"; exit 1; }
      grep -qE '^(PASS|FAIL) test-check-domain\.py' "$f" \
        || { echo "no verbatim integration-suite result line in the capture"; exit 1; }
      echo OK
    intent: |
      Create the boundary note and record the PRE-MOVE state. This is the only moment in the
      sequence at which it can be taken, because from T-02 onward the working tree is half edited.

      Write a heading line reading exactly:
        HEAD: <output of git rev-parse HEAD>
      then a section headed PRE-MOVE holding the VERBATIM stdout of both commands, each in its own
      fenced block, each followed by a line reading exit: <code>:
        python3 .claude/skills/harness/bin/layout_migration.py
        bash .claude/skills/harness/bin/check-state.sh

      The detector must print features: CLEAN — evidence migrated, docs: CLEAN — evidence legacy,
      1 doc root(s), 7 reader file(s), and a summary of 2 surface(s) clean, 0 mixed, 0
      cannot-verify, at exit 0. If any of those differs, STOP: the base has drifted from 0f12f14
      and this plan's audits were taken against a different tree.

      ALSO CAPTURE BOTH SUITES, in a section headed SUITES, immediately after PRE-MOVE:
        .claude/skills/harness/bin/run-unit-tests.sh --kind unit
        .claude/skills/harness/bin/run-unit-tests.sh --kind integration
      Record, for each, every line matching ^PASS test- or ^FAIL test- and the exit code. This is a
      VERBATIM CAPTURE, not a gate: record what you see, including any FAIL, and do not fix
      anything here. It exists because SC-07 and SC-08 are stated as after-the-move claims about
      the two suites and had no recorded before. Measured at 0f12f14 the expected reading is zero
      FAIL lines in each, 15 PASS in unit and 12 in integration, both exit 0; a FAIL here is a
      finding about the base, not about this feature, and it changes what T-05's expected-FAIL pin
      may assume, so report it rather than absorbing it.

      THE FEATURE-DIR COUNT IS THE ONE FIGURE THAT MAY LEGITIMATELY DIFFER, so record it and do not
      compare it. It was 21 at 0f12f14 and will normally read 22 here, because the count is a
      filesystem glob over .harness/*/features/*/feature.json (layout_migration.py:171-172, reached
      from :224-226) and this feature's own feature.json is created at instantiation, after the pin.
      A larger number is expected; anything at all below 21 is the drift signal. The other four
      figures are stable until T-02 moves the docs, which is exactly why they are the ones the STOP
      hangs on: the reader-file count is the length of READER_TABLE and the doc-root count is the
      single SPEC.md evidence marker. This is the rule stated in layout_migration.py:70-71 — any
      count is stale inside a cycle — applied to the one count a cycle can move.

      Also record, in a section headed RED STATES, the states the cluster passes through between
      the two green boundaries, so a reviewer reading a mid-cluster failure knows it is expected
      rather than a defect. They are, in order:
        1. After the physical move alone: the docs surface has BOTH shapes absent or migrated while
           all three readers still carry the legacy form, so every reader formset disagrees with
           the evidence and the surface reads MIXED. The checker exits non-zero.
        2. After factory_config._PROBE moves but before harness_boundary and gen-decisions-index:
           readers disagree with each other, still MIXED.
        3. ONCE T-04 AND T-05 HAVE LANDED, and until T-09 regenerates the index, the INTEGRATION
           SUITE is red on exactly one script, test-gen-decisions-index.py, and the unit suite is
           green. The detector has nothing to say about either. That script FAILs in two successive
           ways: between T-02 and T-04's repoint because the real index is absent at the path it
           still points to — it FAILs on absence, it does not skip — and from T-04's repoint until
           the regeneration because the committed index's header still names the legacy
           DECISIONS.md, so a fresh generation differs from the committed file. T-05's verify
           encodes exactly the landed state: zero unit FAILs, integration red on that one script
           and no other.
           THE INTERVAL BEFORE THAT IS WIDER, and quantifying it as one script would mislead the
           reviewer this section exists to reassure. Between T-02 and T-04 completing, the suites
           are additionally red on T-04's six files — test-team-catalog.py, test-no-distribution.py
           and test-factory-config.py in the unit suite, test-harness-yaml.py,
           test-validate-digest.py and test-gen-decisions-index.py in the integration suite — five
           of which read a real file that T-02 moved. test-harness-yaml.py reads one too, AND has
           a SECOND, different reason: its COLLECT_FIXTURE at :81-96 mirrors the documentor's grant
           list and :185 compares it for exact equality, so T-02's grant EDIT reds it independently
           of the move. T-04 clears both reasons in the one task, which is why this file is not a
           second expected FAIL at T-05. ADDITIONALLY, and on a DIFFERENT interval
           from the five below: the unit suite is red on test-layout-migration.py from T-02 until
           T-03 lands, and green from T-03 onward. Its case 1 asserts the detector exits 0 against
           the real repository root (test-layout-migration.py:131); the physical move alone takes
           the docs surface to MIXED and the exit non-zero, which is exactly what RED STATES 1 and
           2 above describe, and T-03's rewritten readers restore agreement. T-05 only ADDS cases
           to that file; it does not clear its red, because the red is already gone by then.
           Between T-03 and T-05 completing they are additionally red on the OTHER FOUR of T-05's
           five — test-check-domain.py, test-bash-write-guard.py, test-check-plan-routes.py and
           test-factory-integration.py, ALL FOUR IN THE INTEGRATION SUITE — which assert the
           pre-move verdicts against T-03's rewritten classifier. T-05's five therefore split four
           integration to one unit, and the one unit file is the one whose window is earlier.
           Every one of those reds IS the subject of the task that clears it, and each clears as
           that task lands. A red outside those eleven files plus test-gen-decisions-index.py is
           collateral breakage, not an expected state.
           NOTE what this state is NOT: once T-03 rewrites both gen-decisions-index.py's DOCS_DIR
           and its HEADER line in the one task, the FILE reads migrated, so the detector's row for
           it is not the mid-cluster red. The stale committed ARTIFACT is.
      State plainly that the FEATURES surface must read CLEAN — evidence migrated at every one of
      these points; if it ever does not, the move has touched the wrong surface and the work stops.

      Do not commit anything else in this step. This note is feature record, not migration content.

  - id: T-02
    title: Grant the destination and physically move the five tracked docs
    traces: [REQ-01, REQ-04]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: >-
      team-config.yaml resolves NOBODY and the destination resolves NOBODY at the pin (D-03).
    depends_on: [T-01]
    status: done
    files:
      - .harness/team-config.yaml
    verify: |
      n=$(git ls-files docs/harness | wc -l | tr -d ' ')
      m=$(git ls-files .harness/harness/docs | wc -l | tr -d ' ')
      test "$n" = 0 || { echo "legacy still tracked: $n"; exit 1; }
      test "$m" = 5 || { echo "expected 5 tracked docs at destination, got $m"; exit 1; }
      git ls-files .harness/harness/docs | grep -q 'org\.html$' || { echo "org.html missing"; exit 1; }
      bash .claude/skills/harness/bin/check-domain.sh --resolve .harness/harness/docs/SPEC.md \
        | grep -qx 'harness-documentor' || { echo "destination still ungranted"; exit 1; }
      echo OK
    intent: |
      Two edits, in this order, and NOTHING is committed in this task.

      FIRST, add the docs grant to .harness/team-config.yaml. The harness-documentor role currently
      holds a grant on docs/** and nothing else that reaches the destination; measured at 0f12f14,
      check-domain.sh --resolve .harness/harness/docs/SPEC.md returns NOBODY. Add, alongside the
      documentor's existing docs/** entry, an entry of the same form as the features grants already
      in the file:
        - { path: .harness/*/docs/**, upsert: true }
      POSITION IS PINNED, not free: insert it IMMEDIATELY AFTER the documentor's docs/** entry at
      team-config.yaml:117, so it becomes the SECOND entry in that role's domain list. T-04 must
      mirror this index in test-harness-yaml.py's COLLECT_FIXTURE, which asserts exact list
      equality in manifest order, and an unpinned position makes that fixture unwritable.
      Use the WILDCARD segment, not the literal harness, per D-01: it mirrors the shape already
      signed for .harness/*/features/** on line 28 and the rows around line 88. Keep the existing
      docs/** entry: it is what grants a PRODUCT checkout's own docs, and removing it would take
      the documentor's real job away.

      Confirm with check-domain.sh --resolve before proceeding. If it still says NOBODY, stop.

      SECOND, move the five tracked files with git mv, preserving rename detection:
        git mv docs/harness/SPEC.md            .harness/harness/docs/SPEC.md
        git mv docs/harness/DECISIONS.md       .harness/harness/docs/DECISIONS.md
        git mv docs/harness/DECISIONS-INDEX.md .harness/harness/docs/DECISIONS-INDEX.md
        git mv docs/harness/BUILD.md           .harness/harness/docs/BUILD.md
        git mv docs/harness/org.html           .harness/harness/docs/org.html
      Create the destination directory first if git mv requires it.

      org.html is included deliberately. It is hand-maintained with no generator and no template,
      measured at
      .harness/harness/features/FEAT-08-remove-cost-tracking/observations/harness-documentor.md:250,
      and it is tracked, so it moves and it counts.

      docs/harness/.DS_Store and docs/.DS_Store exist and are UNTRACKED. Do not add them, do not
      remove them, and do not use directory absence as evidence of anything: the criterion is
      tracked-files-empty precisely because those two files make the directory outlive the move.

      SPEC.md must land at exactly .harness/harness/docs/SPEC.md. It is the detector's sole DOCS
      evidence marker (layout_migration.py:174-176), so any other spelling takes doc_roots to 0 and
      reds the CI Layout gate on its non-zero-count assertion.

  - id: T-03
    title: Move the three coupled resolvers and the four detector-invisible claims beside them
    traces: [REQ-02, REQ-07]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: >-
      harness_boundary.py is a carve-out by content under DEC-193; the other two co-change inside
      the same atomic commit (D-03).
    depends_on: [T-02]
    status: done
    files:
      - .claude/skills/harness/bin/factory_config.py
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/gen-decisions-index.py
    verify: |
      B=.claude/skills/harness/bin
      grep -qE 'os\.path\.join\("\.harness", [^,)]+, "docs"' $B/factory_config.py \
        || { echo "factory_config does not match the migrated row"; exit 1; }
      grep -qE '\.harness/[^/"]+/docs/\*\*' $B/harness_boundary.py \
        || { echo "harness_boundary does not match the migrated row"; exit 1; }
      grep -qE 'os\.path\.join\("\.harness", [^,)]+, "docs"|\.harness/[^/ ]+/docs/' $B/gen-decisions-index.py \
        || { echo "gen-decisions-index does not match the migrated row"; exit 1; }
      for f in factory_config.py harness_boundary.py gen-decisions-index.py; do
        if grep -qE 'docs/harness|"docs", ?"harness"' $B/$f; then
          echo "legacy spelling survives in $f"; grep -nE 'docs/harness|"docs", ?"harness"' $B/$f; exit 1
        fi
      done
      HB=$B/harness_boundary.py
      grep -B20 'HARNESS_CONTROL_PLANE = \[' $HB | grep -qi 'redundant' \
        || { echo "the comment above the control-plane list records no redundancy clause"; exit 1; }
      if grep -qE 'holds no.*entry anywhere' $HB; then
        echo "site 221: the claim team-config.yaml holds no such entry survives, and T-02 makes it false"
        grep -nE 'holds no.*entry anywhere' $HB; exit 1
      fi
      grep -qF -- '-> ../../../.claude' $HB \
        || { echo "site 111: the symlink example does not climb three segments from the new base"; exit 1; }
      if grep -qF -- '-> ../../.claude' $HB; then
        echo "site 111: a two-climb chain survives; from a three-segment base it no longer escapes"
        grep -nF -- '-> ../../.claude' $HB; exit 1
      fi
      awk '{a[NR]=$0} /guide\.md/{g=NR;c++} END{
        if (c!=1) {print "site 315: guide.md is not a unique anchor, count " c+0; exit 1}
        for (i=g-8;i<=g+3;i++) if (index(a[i],".harness/*/docs/**")) exit 0
        print "site 315: the paragraph around guide.md does not name .harness/*/docs/** as the grantor"
        exit 1}' $HB || exit 1
      echo OK
    intent: |
      Rewrite the three coupled resolvers so they resolve .harness/harness/docs. Nothing is
      committed in this task. These three must change together or root resolution silently picks a
      different checkout than the classifier is judging against (map #336 handoff, line 295).

      WHY THIS TASK RUNS AFTER T-02 AND NOT BEFORE IT, since the dependency alone does not say:
      gen-decisions-index's main preserves every hand-written ruling by READING the existing index
      at INDEX_PATH before it regenerates. If DOCS_DIR moved before the files did, INDEX_PATH would
      point at an empty location, the read would find nothing to preserve, and the next regeneration
      would silently drop every ruling in the index. The files move first, always.

      factory_config.py
        :32  _PROBE = os.path.join("docs", "harness", "SPEC.md")
             becomes os.path.join(".harness", "harness", "docs", "SPEC.md")
        It is read at :41 and :45; neither call site changes shape.
        Also correct the module docstring at :11 and :13, which name docs/harness/SPEC.md as the
        probe in the present tense and state why it is the probe rather than a script file. Keep
        that reasoning; change only the path.
        REQUIRED SHAPE: the result must match the detector's migrated regex for this row,
        os\.path\.join\("\.harness", [^,)]+, "docs" . A string literal ".harness/harness/docs/SPEC.md"
        would NOT match and would take the file to formset neither, which is CANNOT_VERIFY.

      harness_boundary.py
        :90  the HARNESS_CONTROL_PLANE entry "docs/harness/**" becomes ".harness/*/docs/**" (D-01).
        :84  the comment above the list quotes the entry character for character. Rewrite it, and
             add one clause recording that the entry is now logically REDUNDANT: is_control_plane_glob
             already returns true for any first segment of .harness, so the entry decides nothing.
             It is kept because the detector's migrated pattern requires the string to be present
             (D-02). Say so; do not delete the entry.
             USE THE WORD redundant, in any case, AND PUT THE CLAUSE IN THIS COMMENT BLOCK — the
             one within the twenty lines above HARNESS_CONTROL_PLANE = [ , which is the window
             the verify slices. It greps for the word because a clause that is purely ADDED leaves
             no legacy string behind for an absence check to catch: without that word the addition
             is invisible to every check in this plan. The window rather than the whole file so the
             word cannot be satisfied by prose written at one of the other three sites.
        :221 the is_control_plane_target docstring asserts team-config.yaml "grants docs/** and
             holds no docs/harness/** entry anywhere, so a glob-keyed classifier would have
             literally nothing to match two of the four named entries against". After T-02 that
             sentence is false twice over: a .harness/*/docs/** entry now exists, and the target it
             justifies has moved. Rewrite it to state the rule that survives, which is that the
             test is TARGET-keyed, and drop the claim about what team-config.yaml does not contain.
             THE PHRASE holds no ... entry anywhere MUST NOT SURVIVE IN ANY SPELLING. The verify
             greps for holds no.*entry anywhere and fails if it matches. Respelling the glob token
             while leaving that phrase standing manufactures a sentence that is FALSE the moment
             T-02 lands, and nothing else in this plan can see it. The verify can force the false
             claim out but cannot prove the replacement is right; the replacement sentence is yours
             to get right, and a reviewer reads it.
        PATTERN AUDIT, so a later editor can re-run it. Candidate docs/harness/\*\* over the file at
        0f12f14 returns exactly :84, :90, :221 — three sites, not the two the dispatch named, and
        :221 is a docstring rather than a comment. The broader pattern docs/harness adds :111,
