      pinned a decade range instead; that anchor was stale by construction, because this feature's
      own artifacts and the moved docs both add literal-carrying files.

      THE LIVE-SURFACE CONTROL IS A TABLE, NOT AN EXCLUSION, and this is the point of the whole
      task. The verify asserts an exact per-file line count over .claude , CLAUDE.md and
