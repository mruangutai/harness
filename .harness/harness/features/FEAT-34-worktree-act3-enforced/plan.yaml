tasks:
  - id: T-01
    title: Add worktree_terminal.py, the shared eligibility predicate over standing worktrees
    traces: [REQ-01, REQ-04, REQ-05, REQ-06]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/worktree_terminal.py
    verify: |
      python3 -c "import sys; sys.path.insert(0,'.claude/skills/harness/bin'); import worktree_terminal as w; assert sorted(w.CLASSES)==['exempt_absent','terminal','unresolved'], w.CLASSES; assert callable(w.classify) and callable(w.classify_all), 'classify_all is missing - D-10'; print('OK', sorted(w.CLASSES))"
    intent: |
      Create .claude/skills/harness/bin/worktree_terminal.py, a library with no side
      effects and no argv handling. It is imported by check-state.sh's INV-29 and by
      post-merge-sweep.sh; nothing else may duplicate this logic.

      Export CLASSES = ("terminal", "exempt_absent", "unresolved") and one function:

        classify(root) -> list of records

      Each record is a dict with keys: path (str, the worktree's absolute path as git
      reported it), feature_id (str or None), klass (one of CLASSES), dirty (bool),
      reason (str, one clause naming why this klass was chosen), repo (str, the repository
      segment under WORKTREES_SEGMENT the worktree belongs to).

      Algorithm:
      1. Enumerate worktrees with subprocess ["git","worktree","list","--porcelain"] run
         with cwd=root, timeout 10. Parse blank-line-separated records; "worktree <path>"
         opens each. Reuse the exact parsing shape check-state.sh already uses at :1117
         through :1135 - do not invent a second parser. Skip the record whose path is root
         itself (that is the main checkout, not a linked worktree).
      2. For each worktree, determine its repository segment and feature id from its path
         relative to WORKTREES_SEGMENT (.claude/worktrees/<repo>/<id>), per DEC-193.
      3. Resolve the repository's default_branch. Import feature-worktree.py's resolve_repo
         via importlib (the filename has a hyphen so a plain import will not work); do not
         re-derive the default branch yourself.
      4. Read the LANDED copy of that feature's feature.json with
         git rev-parse <default_branch>:<rel> then git cat-file, exactly as
         feature-worktree.py:287 does. NEVER read the working tree's copy - that is the
         deadlock case the brief's SC-02 grades, and check-state.sh's own root variable
         reads the working tree by default.
      5. Classify:
         - The feature directory is genuinely ABSENT from the default branch, proven by a
           git ls-tree of the default branch's features directory showing no entry whose
           name equals OR begins with the worktree's id -> klass "exempt_absent".
         - The lookup resolved and the landed status is Done -> klass "terminal".
         - The lookup resolved and the landed status is anything else -> the record is
           omitted from the returned list entirely.
         - ANY other outcome -> klass "unresolved". This covers: a short-named worktree
           whose id is a prefix of MORE THAN ONE directory on the default branch, a
           feature.json present but unparseable, and a git command that errored. Absence of
           the directory is the exempting fact; failure of the lookup is not. An
           implementation that folds these into exempt_absent silently stops every refusal
           in REQ-01 through REQ-05 from firing, which is SC-05's red proof.
         When the id is a prefix of exactly one landed directory, resolve to that directory
         and classify by its status - a short-named worktree for a landed Done feature is
         "terminal", not "unresolved". "unresolved" is for a prefix matching MORE THAN ONE
         landed directory. A prefix matching ZERO landed directories while the directory
         listing itself SUCCEEDED is "exempt_absent", never "unresolved": REQ-06 exempts a
         worktree exactly when the default branch genuinely carries no feature directory for
         it, and no landed name equalling or beginning with the id IS that condition. It is
         the ls-tree itself failing that is the lookup failure, and that is already covered
         by the errored-git-command clause above.
      6. dirty is git status --porcelain run with cwd=the worktree path, non-empty output.
      Callers treat both "terminal" and "unresolved" as reportable; only "exempt_absent" is
      silent. Return records sorted by path.

      SECOND ENTRY POINT, D-10 - classify_all(root) -> list of records. THIS is what REQ-04
      needs and classify(root) cannot give it: classify runs ONE git worktree list with
      cwd=root, and feature-worktree.py's dest_for joins WORKTREES_SEGMENT only to a resolved
      owner_root, so a served repository's worktrees live inside a DIFFERENT git repository
      that a git worktree list in the harness checkout can never report. classify_all is the
      only function check-state.sh's INV-29 calls.

      classify_all(root) returns classify(root) for the harness checkout, plus classify of
      each declared repository's own owner_root, one combined list sorted by path:
      a. Load the fleet with factory_config.load_fleet(). If that raises for ANY reason -
         file absent, unparseable, FleetError - return a single record with klass
         "unresolved", path = the fleet path factory_config.FLEET_PATH, feature_id None,
         repo None, dirty False, and a reason naming the exception, ALONGSIDE the harness's
         own classify(root) records. Never swallow it and never return only the harness's
         records: a silent failure here collapses the enumeration to the harness alone,
         which is exactly the harness-only implementation SC-04 says must fail.
      b. For each entry in fleet["repos"], owner_root is
         factory_config.workspace_path(fleet, entry["name"]). Do not re-derive that join.
      c. If owner_root does not exist as a directory, emit NOTHING for that repository. A
         directory that does not exist holds no worktrees, so nothing goes unreported, and
         this is one rule applied identically to every declared repo rather than the
         per-repository exception REQ-04 forbids. Measured at 9165162: fleet.yaml declares
         mruangutai/harness-factory-smoke and no checkout for it exists, so any other
         posture makes check-state.sh red on this machine today.
      d. Otherwise call classify(owner_root). If the git worktree list inside classify could
         not be run or returned non-zero - not a git repository, unreadable, git errored -
         classify_all emits ONE repository-level record for it: klass "unresolved", path =
         owner_root, feature_id None, repo = the entry's segment after the slash, dirty
         False, reason naming what failed. That is REQ-06's own rule one level up - absence
         of the directory is the exempting fact, failure of the lookup is not - and it
         reuses the existing unresolved klass so no caller needs a new branch. Distinguish
         "enumeration failed" from "enumerated, found nothing" inside classify by whatever
         private signal you choose; do NOT widen CLASSES and do NOT change classify's own
         public return shape, which T-02's nineteen green cases already grade.
      e. Records from a repository whose feature_id is None and whose path is that
         repository's own owner_root are the repository-level records; every other record
         keeps the six-key shape unchanged.
      classify_all takes root because check-state.sh's root is the checkout actually being
      graded, which may itself be a worktree. Never substitute factory_config.harness_root()
      for it - the CWD trap this module already documents at _repo_arg_for_segment applies.

  - id: T-02
    title: Test worktree_terminal.py against real git fixtures, including a second repository
    traces: [REQ-01, REQ-04, REQ-05, REQ-06]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/test-worktree-terminal.py
    verify: |
      python3 .claude/skills/harness/bin/test-worktree-terminal.py
    intent: |
      Create .claude/skills/harness/bin/test-worktree-terminal.py following the existing
      harness test-script convention: a results list of (name, bool, detail) tuples, PASS
      or FAIL printed per line, exit 1 if any failed.

      Build REAL git repositories with real commits and real git worktree add, the way
      test-check-state.py's case_u already does for INV-25. Directory trees are not enough
      here because every classification depends on reading a LANDED blob.

      Cases, each its own assertion - never a file-global count, never one combined
      substring:
      (a) default branch feature.json Done, worktree standing -> klass terminal.
      (b) same fixture at Review -> the record is absent from the returned list.
      (c) DEADLOCK: working tree Done, default branch Review -> not terminal. Inverse,
          default branch Done and working tree Review -> terminal. An implementation
          reading the working tree fails both halves; demonstrate that failing state by
          running the pair against a deliberately working-tree-reading stub before the
          real implementation is wired in.
      (d) feature directory genuinely absent from the default branch -> exempt_absent.
      (e) SHORT-NAMED worktree whose full-named directory on the default branch reads Done
          -> terminal, NOT exempt_absent.
      (f) feature.json present on the default branch but unparseable -> unresolved.
      (g) SECOND REPOSITORY: a real second git repo under WORKTREES_SEGMENT with its own
          default branch, its own Done feature and its own real git worktree add -> that
          worktree classifies terminal.
          THIS FIXTURE IS THE FIRST OF ITS KIND IN THIS REPOSITORY. Do not go looking for a
          precedent to copy; there is none, and assuming one exists is how this case gets
          written as a thin variation of something weaker. Verified at 9165162: the only
          multi-repo fixture anywhere in the tree is test-check-state.py's
          _factory_tree/case_s, and it is purely declarative - a fleet.yaml plus plain files,
          with no second git repository, no second default branch and no landed blob to read.
          Building the real one is the substance of this case, not an afterthought, and it is
