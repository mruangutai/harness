  - id: T-03
    title: Add post-merge-sweep.sh, the hook body that records terminal status then removes
    traces: [REQ-07, REQ-08, REQ-11]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/post-merge-sweep.sh
    verify: |
      bash -n .claude/skills/harness/bin/post-merge-sweep.sh && bash .claude/skills/harness/bin/post-merge-sweep.sh --dry-run
    intent: |
      Create .claude/skills/harness/bin/post-merge-sweep.sh, executable, the entire body of
      the post-merge git hook. The tracked hook file itself is a shim that execs this
      script; that shim's location is the brief's Q1 and is deliberately NOT part of this
      task. This script must be invocable directly so its behaviour is testable without
      settling Q1.

      Contract:
      - Accepts git's post-merge argument (the squash flag) and IGNORES it. Per D-01 the
        sweep is over every eligible worktree, not over the merged ref - post-merge is
        never told which ref merged, and one git pull can land several merges.
      - Accepts an optional --dry-run flag: prints what it would do, changes nothing,
        exits 0. This is the verify above and must be safe in any tree.
      - Resolves the repository root, then calls worktree_terminal.classify(root) via
        python3. Acts ONLY on records whose klass is terminal. A record whose klass is
        unresolved is printed and left alone: refusing is the invariant's job, and a hook
        that removed on an unresolved lookup would delete a checkout for a feature it could
        not identify.
      - SELF-EXCLUSION, REQ-08. Before acting on a record, compare the realpath of the
        current working directory against the realpath of that worktree's path. If cwd is
        inside it, SKIP it and print one line saying the sweep declined because it is
        running inside that worktree. git worktree remove exits 0 from inside the tree it
        deletes, so an unguarded sweep deletes its own working directory mid-run - the same
        mechanical fact check-state.sh:1173 already carries a comment about.
      - ORDER, D-04, per record: FIRST run
        python3 .claude/skills/harness/bin/gh-sync.py ship <feature dir on the default branch>
        to record the terminal status and close the milestone through their single writer.
        THEN, only if that exited 0, run
        python3 .claude/skills/harness/bin/feature-worktree.py remove --repo <repo> --id <id>.
        If ship exited non-zero, print why and SKIP the removal - the standing checkout is
        the evidence INV-29 will then report.
        BOTH ARGUMENT FORMS ARE MEASURED AT 9165162, not assumed. gh-sync.py takes the VERB
        FIRST: its usage line is "gh-sync.py open|start-task|...|ship|... <feature-dir>", and
        the reversed form gh-sync.py <feature-dir> ship exits 1 with
        "gh-sync: ERROR - ship is not a directory". feature-worktree.py remove takes NAMED
        options only: its usage is "feature-worktree.py remove [-h] --repo REPO --id ID", and
        the positional form remove <id> exits 2 with
        "the following arguments are required: --repo, --id". The --repo value is the same
        string worktree_terminal resolves for a worktree's repo segment - the literal
        "harness", or the owner/repo fleet name whose trailing segment matches.
      - NO FORCE FLAG, and none may be passed to remove. feature-worktree.py remove already
        declines on a dirty tree at exit 4 and on an unlanded artifact at exit 5; those
        refusals are printed and the sweep continues to the next record.
      - The script NEVER exits non-zero for a skipped or declined record. A post-merge hook
        that fails makes git print an error after a successful pull; the invariant is what
        turns a missed removal into a refusal, not the hook.
      - Every path it reads is resolved against the LOCAL default branch. Never
        origin/<default_branch>: that ref is only as fresh as the last fetch, which
        reproduces the same hole one level out.

