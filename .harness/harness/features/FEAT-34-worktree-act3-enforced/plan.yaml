      - exec .claude/skills/harness/bin/post-merge-sweep.sh, passing "$@" through unchanged so
        git's squash flag reaches the sweep, which per T-03's contract ignores it;
      - if post-merge-sweep.sh is absent or not executable, print one line naming the missing
        path and exit 0. A post-merge hook that exits non-zero makes git print an error after a
        successful pull, and a missing sweep is a broken tree, not a broken merge. INV-29 is
        what turns the resulting missed removal into a refusal.

