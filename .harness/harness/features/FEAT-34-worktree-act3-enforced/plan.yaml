decisions:
  - id: D-01
    choice: One post-merge firing sweeps EVERY eligible worktree it finds, not only the feature whose merge triggered it. This resolves the brief's Q2.
    because: post-merge receives only the squash flag as its argument and never the merged ref, so identifying the triggering feature means inferring it - and a single git pull can land several merges at once, which is exactly the shape the ten batch-closed milestones measured. Sweeping all makes the hook compute the same predicate as INV-29 WITHIN one checkout. D-10 later gave INV-29 a cross-repository entry point (classify_all) that the sweep does not call, so the two agree on which worktrees of this checkout are eligible and differ on which repositories are in view - see D-11. The accepted cost is that a pull can remove a checkout the operator was not thinking about; REQ-08's self-exclusion guard is what keeps that from being destructive to the running session.
    dec: none
  - id: D-02
    choice: The hook and the invariants share one predicate module, worktree_terminal.py, written by the squad; the edit that makes check-state.sh call it is a separate main-session-direct task.
    because: DEC-174 amendment 4's working rule for a library a gate imports - a squad may write the library, the cutover that makes the gate use it is main-session-direct, proven by showing the violation set is identical before and after. One predicate is also what makes the brief's hook-versus-invariant split honest - two implementations could drift and each would look correct alone.
    dec: DEC-174
  - id: D-03
    choice: The sweep does not re-implement the terminal write. For each terminal feature it invokes gh-sync.py ship on that feature directory.
    because: the operator's design note for #806 - status Done has more than one path that can write it and the milestone has exactly one, cmd_ship. Reimplementing the close would create a second writer of the one fact INV-30 keys on, which would make the invariant unable to detect its own bypass.
    dec: none
  - id: D-04
    choice: Within one worktree the sweep records the terminal status first and removes the checkout second, and it SKIPS the removal when the record step failed.
    because: the operator's ruling fixes the order - record the terminal status, then remove the checkout that status makes obsolete. Skipping removal on a failed record is the load-bearing half - a checkout left standing is the evidence INV-29 then reports, whereas removing it after a failed ship would destroy the only local trace that the feature was ever terminal.
    dec: none
  - id: D-05
    choice: INV-30 keys on the recorded milestone being open on GitHub, and records nothing when gh or the network is unavailable.
    because: keying on status would ask the status to corroborate itself. The offline posture is INV-26's, established at check-state.sh:1205 - an offline or unconfigured environment must never become a red gate, since check-state.sh runs before every commit. The cost is that INV-30 is silent offline, recorded as a verification gap in the amendment rather than argued away.
    dec: none
  - id: D-06
    choice: The milestone invariant is INV-30.
    because: derived at 9165162 on both halves of the rule check-plan-routes.py enforces, never from the gate script's highest number. INV-28 has BUILT into check-state.sh since this brief was signed, at :1044, :1068 and :1080, which falsifies the brief's original premise that the script held neither 28 nor 29. INV-29 is claimed by this feature's own signed brief. grep -rn INV-30 over .harness/ and .claude/ returns zero occurrences, so 30 is absent from the gate script AND unclaimed by every signed-but-unbuilt plan.
