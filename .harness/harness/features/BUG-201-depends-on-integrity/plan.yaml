decisions:
  - id: D-01
    choice: |
      The rule lives in exactly one place, a helper called by validate_plan_doc, and no separate
      checker is added beside check-plan-routes.py.
    because: |
      validate_plan_doc is the single home the reader load_plan and the writer plan-merge already
      share, extracted so the two cannot disagree (FEAT-41 HIGH-1), so one edit covers both routes
      with no new wiring; a checker beside check-plan-routes.py would cover only the pre-signature
      read and leave plan-merge apply free to write the dangling edge that issue 201 reports.
    dec: DEC-182
  - id: D-02
    choice: |
      The rejection is a PlanSchemaError naming EVERY dangling edge in the document in one message,
      each as an offending task id paired with the missing id, never the first edge only.
    because: |
      A task renamed during a plan revision usually breaks several edges at once, so a first-only
      message costs one edit-and-reload round trip per edge; PlanSchemaError is the existing class
      for a document that parses but no consumer can act on, and every caller already catches it as
      YamlParseError, so no caller changes.
    dec: none
  - id: D-03
    choice: |
      Every task in this plan is execution_mode team, dispatched to harness-backend-dev. No task is
      main-session-direct.
    because: |
      DEC-174 rules, in the paragraph headed Where the line falls for a library a gate calls, that
      "A module a gate imports is not itself a gate. A squad may write the library, and the cutover
      that makes a gate use it is main-session-direct, proven by showing the gate's violation set is
      identical before and after." harness_yaml.py is such a library and this feature performs NO
      cutover: at af859ee8 check-plan-routes.py already calls load_plan and plan-merge.py already
      calls validate_plan_doc, so no hand wires a gate to anything it did not already use, and the
      changed gate behaviour arrives entirely through a library the ruling leaves squad-writable.
      The proof DEC-174 attaches to a cutover holds here anyway: measured at af859ee8, all 67
      committed plan.yaml files load and none carries a dangling reference, so the gates' violation
      set over the live corpus is identical before and after.
      DEC-174's own list settles the rest, and it is cited by its anchor text rather than
      paraphrased: the paragraph in .harness/harness/docs/DECISIONS.md whose first words are "The
      enforcement layer, enumerated:" names check-domain.sh, bash-write-guard.sh, validate-digest.py,
      check-state.sh, check-plan-routes.py, dispatch-guard.sh, and the test file of each. NONE of the
      five surfaces this plan now touches appears in it - harness_yaml.py (T-03), factory_claim.py
      and gh-sync.py (T-06), and the two test trees, neither of which holds the test file of a gate
      in that enumeration.
      The two consumer surfaces T-06 adds sit in the SAME lane as the surfaces already here, measured
      rather than assumed: check-domain.sh --resolve, run once per path from the main checkout on
      2026-09-07, returns harness-backend-dev and harness-dev-ops for harness_yaml.py,
      factory_claim.py and gh-sync.py alike. The widened scope therefore needs no second lane and no
      second agent, and this stays one recorded reading carried by the one signature. Recorded here
      rather than in lanes.rows because plan-merge.py has no verb that can write the lanes key:
      apply exits 7 CONFLICT on it and amend accepts only tasks and decisions, both observed
      2026-09-07.
    dec: DEC-174
  - id: D-04
    choice: |
      The corpus non-regression guard walks the live plan corpus AND the same walk is run against a
      throwaway root holding one dangling plan, which it must report.
    because: |
      A walk that silently matched nothing and a rule that had stopped checking anything both leave
      a bare all-pass reading identical, so the paired fixture is what makes the guard
      discriminating; its baseline is the af859ee8 measurement recorded in the BRIEF, 67 files, 67
      loading, 0 failing, 0 dangling.
    dec: DEC-174

  - id: D-05
    choice: |
      A consumer that cannot act on a plan reports the specific PlanSchemaError text, and the
      posture differs per site by what that site's caller can already do. gh-sync _projected_for
      refuses through the existing refuse() helper - exit 2, one actionable line, never a
      traceback. gh-sync _status_plan_doc prints one actionable stderr line and returns None as
      before, leaving its callers' existing declines untouched. factory_claim still returns no
      plan but carries the validator's message into a new blocker reason, so the poll keeps
      evaluating every other candidate.
    because: |
      DEC-138 rules that the mirror never gates, and the case it rules on is named in the same
      sentence: gh absent or unauthenticated, so the flow succeeds and reports the sync skipped. A
      locally malformed signed artifact is not that case, and gh-sync has already decided it in
      this very function - the FleetError branch at gh-sync.py:1160-1168 refuses a station outside
      the vocabulary at exit 2 with one actionable line, recording that DEC-138's never-gates is
      about not blocking a flow, not about dying in it. A dangling depends_on is the same class of
      fault reaching the same function, so it takes the same posture rather than a new one.
      _status_plan_doc is different in kind: cmd_status's two guarded transitions already decline
      correctly and non-gatingly on a None doc (gh-sync.py:1306-1307 and :1318-1319), so the only
      defect there is the cause reported, and adding an exit would convert a designed decline into
      a gate DEC-138 forbids. factory_claim is a poller over many candidates: raising would abort
      the evaluation of every candidate after the bad one, so the fix is the reason text - issue
      201's complaint is being told the feature directory or its plan.yaml is missing or
      unparseable (factory_claim.py:190-198) when the real cause was a typed task id.
    dec: DEC-138
