    intent: |
      Product checkout: Harness itself (segment harness), this feature worktree. Product guidance is the decision record: read DEC-31, DEC-206, DEC-228 and DEC-237 in .harness/harness/docs/DECISIONS.md (find them through DECISIONS-INDEX.md), and SC-01 to SC-04 and SC-06 in .harness/harness/features/FEAT-2622-practicality-rule/BRIEF.md. Harness has no docs/spec.md or docs/architecture.md. Execute main-session-direct (DEC-174); every relative path stays inside this worktree.

      1. bin/panel_findings.py. Add module constants EXPOSURE_TRIGGERS = ("routine", "plausible", "contrived"), EXPOSURE_VS_TODAY = ("regression", "no_worse"), EXPOSURE_CONTROLS = ("harness", "chance", "user", "adversary") and EXPOSURE_UNRATED = "unrated". Add exposure_faults(value) -> list of str: [] for the exact string unrated, or for a dict with exactly the keys trigger, vs_today and control whose values are each in their tuple; otherwise one line per departure (not a mapping or unrated; missing key; extra key; off-enum value), each line containing the word exposure. Add is_discounted(exposure) -> bool: True only for a dict with trigger contrived, vs_today no_worse and control not adversary; unrated and anything malformed return False. Add is_non_gating(severity) -> bool: the trimmed, lowercased string is in NON_GATING_SEVERITIES, the very set gates_signature reads, so a severity of none gates here exactly as it gates signature and the non-gating set stays defined once (SC-06); add no second set. Add practicality_fault(finding) -> str or None: when is_discounted(finding.get("exposure")) and not is_non_gating(finding.get("severity")), return one line that contains the words practicality rule, the severity, and says a contrived finding no worse than today and not adversary-controlled is at most med (DEC-31 non-gating); else None. Extend FINDING_KEYS with "exposure" (optional: never in REQUIRED_KEYS). In shape_faults, when "exposure" is present append exposure_faults of it, and append practicality_fault when it returns a line. A row without exposure stays legal.

      2. schemas/digest/common.json. Add $defs.exposure: anyOf of (a) an object with additionalProperties false, required [trigger, vs_today, control], and enum properties trigger [routine, plausible, contrived], vs_today [regression, no_worse], control [harness, chance, user, adversary]; (b) {"const": "unrated"}. Add "exposure": {"$ref": "common.json#/$defs/exposure"} to $defs.finding properties and add "exposure" to its required list. Change nothing else.

      3. bin/validate-digest.py. Add _practicality_errors(canonical, seen) and append its result inside _semantic_errors for every persona, after the existing checks. It reads seen["findings"] only when it is a list, skipping non-dict entries. (a) For each finding index i, panel_findings.practicality_fault(finding) gives an error "findings[i] (<summary>): <fault>". (b) For each finding that panel_findings.is_discounted marks, compute its normalized summary with panel_findings.normalize_summary and its id with panel_findings.finding_id(reader, summary); for each must_fix entry j (strings only), refuse when normalize_summary(entry) contains the normalized summary, or when any token matching the case-insensitive regex PF-[0-9a-f]{8,32} in the entry is a prefix of that id; the error names must_fix[j], findings[i] and the practicality rule and says a discounted finding never enters must_fix. (c) When canonical is harness-code-reviewer, harness-security-reviewer, harness-ui-reviewer or harness-eng-lead (none of which transcribes a non-harness reader), a finding whose exposure is the string unrated gives an error naming findings[i] and the practicality rule and saying a harness reviewer states its exposure; unrated is a lead's transcription of a reader that gave none. (d) For every persona whose DIGEST carries a findings list and severity_max: when severity_max, trimmed and lowercased, is high or critical, at least one finding is discounted, and no finding that is not discounted has a severity for which is_non_gating is False, give an error naming severity_max and the practicality rule and saying a gating severity_max must rest on a finding the practicality rule does not discount. (e) When canonical is harness-code-reviewer, harness-security-reviewer or harness-ui-reviewer and the verdict is FAIL: when findings is a non-empty list whose every mapping entry is discounted, must_fix is an empty list, is_non_gating(severity_max) is True and code_grade is absent or not fail, give an error naming VERDICT and the practicality rule and saying a review whose only findings are discounted does not fail; a non-discounted finding, a must_fix entry, a gating severity_max or code_grade fail each leaves the FAIL legal. (f) The plan-team carve-out (DEC-123 as amended, D-06): in _digest_finding_reason and _open_row_reason, a matched panel row whose disposition is not resolved no longer denies relief when panel_findings.is_discounted(row.get("exposure")) and panel_findings.is_non_gating(row.get("severity")) are both True. Change nothing else in the carve-out: attribution, roster, malformed rows (a discounted row above med is a shape fault, so it fails closed), a reader with no attributed findings, ESCALATE and BLOCKED keep worst-wins. Every message contains the exact words practicality rule. Do not touch evaluate_review, gate_policy.py or _review_policy_errors; (f) is the only roll-up change.

      4. Create tests/unit/test-practicality-rule.py, script-style with check_support.Checks (sys.exit(C.report())), ROOT = Path(__file__).resolve().parents[2], loading validate-digest.py by path through importlib exactly as tests/unit/test-validate-digest-plan-rollup.py does, and using digest_schema.validate_object for schema-only cases. It must import no symbol that does not exist at base 3e979ae3cd303fdf65746bf13c8c8e041dac4964 (no panel_findings.is_discounted and the like), so the verify's base run reaches its checks and prints FAIL lines. A refused case passes when some error contains practicality rule (schema cases: some error names exposure and no error contains the text 'exposure' was unexpected; at base the finding schema has additionalProperties false, so every exposure-bearing finding is refused there only by that unknown-key error, which must not count as the new refusal, while the built schema refuses through the exposure path or the required-property error); an accepted case passes when no error contains practicality rule and none contains exposure. Use summaries and readers free of the words exposure, practicality and unrated. Exact case names: practicality-missing-exposure-refused, practicality-offenum-exposure-refused, practicality-extra-key-refused, practicality-missing-inner-key-refused (a mapping without control), practicality-invalid-string-refused (exposure rare), practicality-wellformed-accepted, practicality-discounted-high-refused, practicality-discounted-unrated-severity-refused, practicality-discounted-med-accepted, practicality-adversary-high-accepted, practicality-regression-high-accepted, practicality-plausible-high-accepted, practicality-unrated-exposure-high-accepted (validator-lead digest), practicality-mustfix-summary-refused, practicality-mustfix-pfid-refused (an 8-hex prefix), practicality-mustfix-other-finding-accepted, practicality-unrated-refused-code-reviewer, practicality-unrated-refused-security-reviewer, practicality-unrated-refused-ui-reviewer, practicality-unrated-refused-eng-lead, practicality-unrated-accepted-product-lead, practicality-unrated-accepted-validator-lead, practicality-severity-max-discounted-only-refused (code-reviewer FAIL, one discounted finding at med, severity_max high, must_fix empty), practicality-severity-max-witnessed-accepted (the same plus a plausible/regression/chance finding at high), practicality-fail-discounted-only-refused (code-reviewer FAIL, one discounted finding at med, severity_max med, must_fix empty), practicality-fail-with-mustfix-accepted (the same with one must_fix entry naming another, non-discounted finding), practicality-discounted-only-pass-accepted (the same digest at PASS). Two carve-out cases build a product-lead plan-team digest and a temp feature directory (feature.json mission plan, plan.yaml whose panel holds one open row for the should-not-exist reader at med) exactly as tests/unit/test-validate-digest-plan-rollup.py builds its relief cases, with the should-not-exist member at FAIL and the lead at PASS: practicality-carveout-discounted-open-relieved (row exposure contrived/no_worse/user; passes when no error says the VERDICT is better than a member) and practicality-carveout-plausible-open-denied (row exposure plausible/no_worse/user; passes when such an error is present). Only refusal and relief cases carry the words refused or relieved in their names; the verify relies on that. Other unrelated errors from validate() on a hand-built digest are ignored by these assertions.

