decisions:
  - id: D-01
    choice: Every digest finding (schemas/digest/common.json $defs.finding, shared by code-reviewer, security-reviewer, ui-reviewer, eng-lead, product-lead and validator-lead) requires the key exposure, either the closed mapping {trigger routine|plausible|contrived, vs_today regression|no_worse, control harness|chance|user|adversary} or the literal string unrated; unrated is legal only in a product-lead or validator-lead digest, where it records a non-harness reader that gave no exposure; code-reviewer, security-reviewer, ui-reviewer and eng-lead digests refuse it, since none of them transcribes a non-harness reader; an unrated exposure is never discounted. QA carries no findings, so its part of the rule is testing guidance only.
    because: A missing kind is already a refusal, and harness readers yield schema-bound objects, so a refusal costs one re-yield; DEC-206's unrated sentinel is kept for transcription so a lead never invents a reader's content, and an unrated exposure falls back to today's severity rather than to suppression. Rejected - missing exposure read as unrated-and-gating for every persona (a reviewer could skip the three questions at no cost) and free-text trigger prose (nothing mechanical can read it).
    dec: none
  - id: D-02
    choice: A finding is discounted when its exposure is a mapping with trigger contrived, vs_today no_worse and control other than adversary. validate-digest.py refuses a discounted finding whose severity is not info, low or med (panel_findings.NON_GATING_SEVERITIES, the one set gates_signature already reads; trimmed, case-insensitive; none, high, critical, unrated and unknown values all gate), and refuses a must_fix entry that contains a discounted finding's normalized summary or its PF id in full or by a prefix of PF- plus at least 8 hex characters; every refusal names the practicality rule. The predicate and the non-gating set live once in bin/panel_findings.py, and shape_faults applies the same severity ceiling to any panel row that carries exposure.
    because: med is DEC-31's non-gating band and code-review's wrong-behaviour-in-an-unlikely-case, which is the contrived case; must_fix is free prose, so containment of the finding's own identity is the only link that needs no contract change. Rejected - a structured must_fix of finding references (changes every persona's must_fix and the validator lead's non-finding entries such as pm not_met rows) and a low ceiling (makes an honest unlikely-but-real med unreportable at its true size).
    dec: none
  - id: D-03
    choice: The validator lead and the product lead apply the rule at collation, before routing or writing the fan-in - they may lower a discounted finding to at most med or drop it, with a one-line reason beside it naming the reader's severity, never raise a severity and never revise kind; a remedy touching signed text reaches the operator only when its finding survives this triage; in the plan team the product lead lowers rather than drops, so the panel row exists for the D-06 relief. This amends DEC-206's rule that the lead never owns how severe the reader judged a finding.
    because: The operator ruled it for the validator lead in issue 2622; the product lead needs the same authority because record-panel will refuse a discounted gating finding from fable-advisor, whose return no schema validates, and without it that refusal has no lawful remedy while an open gating plan finding is exactly the operator escalation the rule forbids. Rejected - leaving the product lead unamended (an unresolvable record-panel refusal) and letting either lead raise severity (not in the ruling).
    dec: DEC-206
  - id: D-04
    choice: Forward only is enforced by what is validated, with no era marker - validate-digest gates live yields and the run being closed, check-state INV-15 never re-validates a historical digest against the live schema, and exposure is optional in the panel row shape while record-panel requires it on every row it newly writes.
    because: No reader re-grades history, so an era key (the DEC-254 pattern) would defend a case that cannot occur and add a writer-owned stamp to maintain. Rejected - a harness.json era key for digests and a digest schema_version bump. Residual - a lead run open across the landing commit whose durable digest lacks exposure is refused at close-run, so the build lands with no lead run open.
    dec: none
  - id: D-05
    choice: plan.yaml panel.findings rows gain exposure as an optional key of panel_findings.FINDING_KEYS, validated by shape_faults when present; plan-merge.py record-panel refuses (exit 5) a fan-in finding without exposure and carries the exposure it was given into the new row; base rows keep their bytes and remain legal without it; gates_signature is unchanged.
    because: The fan-in file is read by record-panel and never by validate-digest, so a plan-level discounted gating finding is caught only at the writer; keeping the key optional in shape is what lets every existing plan's panel stay valid under INV-32 and sign-approval. Rejected - required in shape (reddens every live plan with a panel) and a separate exposure check in sign-approval (a second home for one rule).
    dec: none

  - id: D-06
    choice: 'A discounted finding never decides a verdict. validate-digest.py refuses a severity_max of high or critical that only discounted findings could support, in any digest carrying findings and severity_max, and a code-, security- or ui-reviewer FAIL whose every finding is discounted with must_fix empty, a non-gating severity_max and code_grade not fail; and DEC-123''s plan-team carve-out stops treating an open panel row as blocking relief when its exposure is discounted at a non-gating severity. Every other path keeps worst-wins: a FAIL carrying a non-discounted gating finding, a must_fix entry or a failed code grade, any ESCALATE or BLOCKED, and the validate team''s roll-up, where a lead whose triage reclassifies a reader''s exposure returns the finding to that reader instead of reporting better than the member.'
    because: 'Capping a finding''s severity alone left the verdict it drove standing: a reviewer that kept a pre-triage severity_max high or FAIL, or fable-advisor (whose return nothing validates) failing on a contrived finding, still forced the team to FAIL through worst-wins, since _review_policy_errors only refuses a PASS the policy fails and the carve-out relieves only resolved rows. The checks read the reader''s own exposure record, so a FAIL justified by anything else is untouched. Rejected - letting a lead outrank a member verdict after its own triage (DEC-123 refuses reporting better on the lead''s word, and the orchestrator never opens member entries) and having pm mark a discounted row resolved without a remedy (a false record).'
    dec: DEC-123
