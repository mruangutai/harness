  - id: T-17
    title: Cut validate-digest.py over, and stop the children-in-flight check compounding a strand
    traces: [REQ-01, REQ-02, REQ-06, REQ-09]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 am.4 names validate-digest.py in the enforcement layer
    depends_on: [T-03, T-06]
    status: done
    files:
      - .claude/skills/harness/bin/validate-digest.py
      - .claude/skills/harness/bin/test-validate-digest.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      B=.claude/skills/harness/bin
      G=validate-digest.py
      grep -q "HARNESS_PROJECT_DIR" $B/$G && { echo "chain survives"; exit 1; }
      grep -qE 'payload\.get\("cwd"\)|d\.get\("cwd"\)' $B/$G && { echo "payload cwd still a root input"; exit 1; }
      python3 $B/test-validate-digest.py || exit 1
      python3 $B/test-inflight-registry.py || exit 1
      grep -rqE "FAIL.*children_in_flight_stale_claim" .harness/harness/features/FEAT-42-one-root-resolver/notes/receipt-*.md \
        || { echo "SC-10: no red receipt for the cascade case"; exit 1; }
      echo T-17-OK
    intent: |
      Three changes in .claude/skills/harness/bin/validate-digest.py.

      1. The two chain sites, :821 and :913. Both build a candidate list beginning with the payload
      cwd, then the environment chain, then os.getcwd(). Replace the whole candidate walk with
      harness_boundary.resolve_root(<the bin dir derived from this file's own location>). Payload
      cwd is DELETED as a root input, and this is the ruling rather than a preference: nothing SETS
      where an agent stands — the Agent tool has no cwd parameter, cd does not persist between Bash
      calls, and bash-write-guard refuses it — so cwd stays inherited from the spawning session and
      varies by accident. The verify greps for the cwd reads and fails on either.

      2. The children-in-flight check at :890-956 is the SECOND CONSUMER of the stranded-claim
      defect, and that is new information neither #742 nor #866 records. Measured on 2026-08-26 and
      written up in
      .harness/harness/features/FEAT-42-one-root-resolver/runs/2026-08-26-2-plan-product/digest.md:
      one stranded pm claim refused the pm spawn at dispatch-guard, then refused the LEAD's return
      here, then refused the ORCHESTRATOR's return here again — three tiers locked out of reporting
      by one strand, each stranding creating the next. Pass this reader's own session id into
      inflight_registry.live_children so a claim from another session is not counted as a live
      child, which T-06 makes possible. The payload carries session_id; use it.

      3. When the check DOES refuse, the message must name the precise remedy. Replace whatever
      release command it prints with inflight_registry.release_cmd(root, agent) from T-06 — an
      absolute, single-agent command. release-all must never be printed by a refusal: it mutates
      the registry to {} and wipes every claim of every agent, and on 2026-08-26 following the
      printed advice would have destroyed a live claim.

      Add a case to test-validate-digest.py named children_in_flight_stale_claim: a registry holding
      a claim stamped with a DIFFERENT session id, a return from the parent persona, and the
      assertion that the return is ADMITTED. Run it before the fix, confirm it fails, and paste the
      verbatim FAIL line into
      .harness/harness/features/FEAT-42-one-root-resolver/notes/receipt-main-session-T-17.md.

      THE HOOK CASES NEEDED ISOLATING, and that was not in the signed text. Every case that
      does not name its own root now runs against one throwaway checkout. Without it they run
      against the LIVE registry: a claim left behind by anything else in this repository
      refuses cases that have nothing to do with it, and three digest-shape cases failed
      exactly that way while T-18 was being written. A suite whose verdict depends on what
      else touched the machine is not a suite. The DEC-156 cases carry their own root: they
      used to find their artifact by joining onto the payload cwd, and cwd is gone as a root
      input, so each fixture is now a real harness root handed over through the override.

  - id: T-18
    title: Make the dispatch declare its feature, and record the claim in that feature's checkout
    traces: [REQ-01, REQ-02, REQ-05, REQ-06, REQ-09]
    change_type: api
    execution_mode: main-session-direct
    execution_reason: DEC-174 am.4 names dispatch-guard.sh and its test file in the enforcement layer
    depends_on: [T-03, T-06]
    status: done
    files:
      - .claude/skills/harness/bin/dispatch-guard.sh
      - .claude/skills/harness/bin/test-dispatch-guard.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      B=.claude/skills/harness/bin
      grep -q "HARNESS_PROJECT_DIR" $B/dispatch-guard.sh && { echo "chain survives"; exit 1; }
      grep -q "_root_from" $B/dispatch-guard.sh && { echo "old resolver survives"; exit 1; }
      grep -q 'RELEASE_ALL_CMD' $B/dispatch-guard.sh && { echo "release-all still printed"; exit 1; }
      grep -q "HARNESS-FEATURE" $B/dispatch-guard.sh || { echo "the declared-feature field is not read"; exit 1; }
      for c in missing_feature_line_refused claim_lands_in_declared_worktree; do
        grep -rqE "FAIL.*$c" .harness/harness/features/FEAT-42-one-root-resolver/notes/receipt-*.md \
          || { echo "SC-10: no red receipt for $c"; exit 1; }
      done
      python3 $B/test-dispatch-guard.py || exit 1
      python3 $B/test-validate-digest.py || exit 1
      echo T-18-OK
    intent: |
      This is issue #742's ruling, and it is the one site in the whole system that can see the
      dispatch prompt. Measured and recorded in
      .harness/harness/features/FEAT-31-orchestrator-context-watch/notes/probe-hook-payload-identity.md:
      a PreToolUse payload carries eleven keys and tool_input.prompt exists only on the DISPATCH
      payload. So this field fixes this gate and reaches no other hook, and the plan does not
      pretend otherwise.

      1. Every governed dispatch must open with a machine-readable line HARNESS-FEATURE: <flow-id>.
      Read it out of tool_input.prompt with a fullmatch-anchored regex on its own line. A governed
      dispatch WITHOUT the line is refused at sys.exit(2) with a message naming the missing field
      and showing the exact line to add. Governed means the existing gate already applies: the
      dispatching agent_type starts with harness-, and the dispatched tool_input.subagent_type
      starts with harness-. The main session stays exempt at :38 — measured, governing it would have
      caught NONE of the six collisions, because every pm in them was dispatched by an orchestrator
      this gate already governs.

      2. DELETE _root_from(payload) at :75-93 entirely, both of its chain reads and its payload cwd
      read. The root now comes from the DECLARED feature. Resolve it without a subprocess, because
      this runs before every governed dispatch: take owner_root from
      harness_boundary.root_above(__file__), then look for the declared flow id among
      harness_boundary.linked_worktrees(owner_root), matching on the worktree directory's segment
      name. A worktree whose segment equals the declared id is the root. If no worktree carries that
      id, the feature is being worked in the main checkout and owner_root is the root. This is what
      makes the claim land where the assignment says rather than where the dispatcher was standing,
      which is the whole defect: on 2026-08-26 the same mechanism put one claim in the main checkout
      and another in a worktree, and the guard then saw six collisions and refused none.

      3. The registry stays PER-CHECKOUT. Do not merge it into one file. The reason is on record in
      the deleted function's own docstring: one shared registry would refuse a second feature's pm
      while the first feature's pm is live, breaking parallel features to fix a within-feature
      defect. What changes is the INPUT, not the shape.

      4. Pass the payload session_id into reg.claim as the session keyword T-06 adds, and pass it to
      reg.live_claim so a foreign-session claim is not counted live.

      5. The refusal must print reg.release_cmd(root, dispatched) — absolute and single-agent —
      never RELEASE_ALL_CMD. The verify greps for that name and fails on any hit.

      Every branch you add FAILS OPEN, matching the contract stated at :56, with ONE exception: the
      missing HARNESS-FEATURE line, which fails closed at exit 2 because that is the requirement.

      In test-dispatch-guard.py, _checkout() at :121-124 builds a tree carrying only a bare .harness
      DIRECTORY. Under the MARKER rule that is no longer a harness checkout, so write
      .harness/team-config.yaml into those fixtures — otherwise every case silently stops exercising
      the gate. Add the two cases the verify names. missing_feature_line_refused: a governed
      dispatch whose prompt has no HARNESS-FEATURE line exits 2 and the stderr names the field.
      claim_lands_in_declared_worktree: a fixture main checkout with a worktree under
      .claude/worktrees whose segment is the declared id, a payload whose cwd is the MAIN checkout,
      and the assertion that the claim file appears under the WORKTREE and that the main checkout's
      registry is untouched. Run both against the untouched gate first — the second fails because
      :83 resolves from payload cwd — and paste the verbatim FAIL lines into
      .harness/harness/features/FEAT-42-one-root-resolver/notes/receipt-main-session-T-18.md.

      FOUR THINGS BEYOND THE SIGNED TEXT, all forced by the change itself.

      owner_root comes from resolve_root, not root_above. root_above answers "which checkout
      is this PATH in" and cannot be steered, which leaves this gate untestable against a
      fixture without copying the whole bin tree per case. resolve_root is the same rule plus
      the override the other eight gates already honour, and the override is only accepted
      when it carries the MARKER - so nothing is loosened.

      The program is fed to python3 -c and has NO __file__. The bash wrapper already exports
      HARNESS_GUARD_BIN_DIR from BASH_SOURCE; that is the only thing that knows where this
      script lives.

      Case 6 asserted the refusal carries release-all. That assertion is inverted here, not
      deleted: it now requires the single-agent command AND requires release-all to be absent,
      so the retired remedy cannot creep back. inflight_registry.refusal_lines takes the
      command as a parameter, so no shared module changes.

      Case 2 is the one ALLOW case reaching the claim step and had no root of its own, so it
      recorded a claim in the LIVE registry every run and asserted an EMPTY stderr that
      anything already in that registry could break from outside. It gets a throwaway root.

      The two mandated case names are carried IN THE CHECK LABELS, because the receipt is
      matched by name and a case whose label does not carry it cannot be found.

