decisions:
  - id: D-01
    choice: The seven former resolver definitions are deleted outright, never left as thin forwarders.
    because: A surviving forwarder is a second door, and a second door is how nine names grew.
    dec: none
  - id: D-02
    choice: One module constant MARKER equal to .harness/team-config.yaml identifies a harness, never a per-caller parameter.
    because: team-config.yaml is the same path in every project, unlike SPEC.md which carries the project name.
    dec: none
  - id: D-03
    choice: resolve_root is strict — it raises when neither the override nor the derived root carries MARKER.
    because: A wrong root gives confident answers about the wrong tree; 36 violations were once reported from a different checkout.
    dec: none
  - id: D-04
    choice: Four names live in harness_boundary.py, extended in place with no new file, and worktree_owner does not change.
    because: harness_boundary imports only os, re and sys, and a PreToolUse hook cannot afford factory_config's eager network import.
    dec: none
  - id: D-05
    choice: Scope is all 20 occurrences of the environment chain across 16 files, not the 7 definitions of the original migration map.
    because: inject-expertise.sh line 31 falls back to pwd and is a SubagentStart hook, the exact failure that blocked the previous run.
    dec: none
  - id: D-06
    choice: The claim registry stays PER-CHECKOUT; only its input changes, from accidental payload cwd to the feature the dispatch declares.
    because: One shared registry would refuse a second feature's pm while the first is live, breaking parallel features to fix a within-feature defect.
    dec: none
  - id: D-07
    choice: When two live claims of one persona cannot be told apart, release removes NEITHER and says so on stderr.
    because: No claim carries an identity either payload can match, so oldest-pop and newest-pop are each wrong half the time; the shortened TTL reaps instead.
    dec: none
  - id: D-08
    choice: A claim records its session_id, a foreign-session claim is expired regardless of age, and CLAIM_TTL_SECONDS drops from 3600 to 1200.
    because: The measured strand outlived a 10-20 minute cycle by design; the cost is that a run past 20 minutes loses its protection.
    dec: none
  - id: D-09
    choice: dispatch-guard resolves the declared feature id to its worktree through harness_boundary.linked_worktrees, not a feature-worktree.py subprocess.
    because: It runs at PreToolUse before every governed dispatch, and a subprocess there is a new failure mode on the hot path.
    dec: none
  - id: D-10
    choice: Every gate touched here gains the established NAME_BIN environment seam if it lacks one.
    because: Five sibling test files already use it, and it is what lets the identical-violation-set proof drive the base-sha copy and the edited copy over one case set.
    dec: DEC-174
  - id: D-11
    choice: SC-11 moves from verify uat to verify automated, evidence integration.
    because: The only thing a live dispatch adds is the payload shape, and two probe notes already measured that shape off real spawns.
    dec: none
  - id: D-12
    choice: The measured scope of the environment chain is 21 occurrences across 17 files, not the 20 across 16 recorded in D-05; the seventeenth is .omp/extensions/harness-hooks.ts:144 and it is IN scope.
    because: Operator ruling of 2026-08-26 - that line hands every OMP-hosted policy script a root taken from the host process cwd, which under D-3 probes valid in a worktree and is honoured, reopening the exact hole D-4 closes.
    dec: none
tasks:
  - id: T-01
    title: Add MARKER and the three resolver functions to harness_boundary.py, with a new test file and a red receipt
    traces: [REQ-01, REQ-02, REQ-04, REQ-08]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/test-harness-boundary.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      B=.claude/skills/harness/bin
      N=.harness/harness/features/FEAT-42-one-root-resolver/notes
      python3 $B/test-harness-boundary.py || exit 1
      for c in root_from_script resolve_root_strict root_above marker_constant; do
        grep -rqE "FAIL.*$c" $N/receipt-*.md || { echo "SC-10: no red receipt line for $c"; exit 1; }
      done
      git show 3952814:$B/harness_boundary.py > /tmp/f42-hb-old.py
      python3 - <<'P'
      import ast, re, sys
      def fn(p, n):
          t = ast.parse(open(p).read())
          return next((ast.unparse(x) for x in ast.walk(t)
                       if isinstance(x, ast.FunctionDef) and x.name == n), None)
      new = ".claude/skills/harness/bin/harness_boundary.py"
      s = open(new).read()
      ok = re.search(r'MARKER\s*=\s*os\.path\.join\(\s*"\.harness"\s*,\s*"team-config\.yaml"\s*\)', s)
      ok = ok and all(fn(new, f) for f in ("root_from_script", "resolve_root", "root_above"))
      ok = ok and fn("/tmp/f42-hb-old.py", "worktree_owner") == fn(new, "worktree_owner")
      sys.exit(0 if ok else 1)
      P
      echo T-01-OK
    intent: |
      Extend .claude/skills/harness/bin/harness_boundary.py IN PLACE. Do not create a new module.
      Do not import anything beyond os, re and sys: this module is imported by PreToolUse hooks that
      run before every Bash call, so an eager network import is not affordable.

      Add one module constant and three functions. worktree_owner MUST NOT CHANGE BY ONE LINE; the
      verify compares its AST between sha 3952814 and your edit.

      MARKER = os.path.join(".harness", "team-config.yaml")
      A directory is a harness checkout when it contains MARKER. Never a caller-supplied parameter:
      a parameter left every caller inventing its own definition, which is how check-plan-routes.py
      came to probe team-config.yaml, factory_config.py to probe SPEC.md, and wayfind.py to probe the
      bare .harness DIRECTORY. $HOME/.harness exists on this machine and holds two backup tarballs
      and no team-config.yaml, so the directory probe resolves $HOME as a root — that is the
      fail-open recorded at check-plan-routes.py:489-495.

      def root_from_script(bin_dir): return the root that four-levels-up arithmetic from bin_dir
      gives. Absolute path. ZERO filesystem checks and no environment read. This is the pure
      derivation the callers that must not read cwd need.

      def resolve_root(bin_dir, strict=True): the root. Read os.environ HARNESS_PROJECT_DIR. If it
      is set AND os.path.isfile(join(it, MARKER)), return it. If it is set and does NOT carry
      MARKER, print to stderr a line naming the discarded value and the derived value being used
      instead, then fall through. Falling through means root_from_script(bin_dir): return it if it
      carries MARKER. If nothing carries MARKER and strict is true, raise ValueError naming both
      candidates. If strict is false, return the derived root. CLAUDE_PROJECT_DIR IS NOT READ
      ANYWHERE IN THIS MODULE: it is host-owned, always names the session project root, and is one
      of the three spellings of a single value this feature is deleting.

      def root_above(start): walk up from os.path.abspath(start), returning the first directory at
      or above it that contains MARKER, or None at the filesystem root. No environment read. This is
      the walk that answers "which checkout is this PATH in", and it is deliberately the only one of
      the three that can ever see a cwd, because a caller has to hand one in.

      Then write .claude/skills/harness/bin/test-harness-boundary.py in the idiom of its siblings
      (see test-no-distribution.py): a module-level failures list, a check(name, cond, detail)
      helper, plain functions named case_N_..., and a main that exits 1 if failures. It must be
      runnable directly with python3 and must not need pytest. Do not register it in
      run-unit-tests.sh — T-03 does that, and until then the drift detector will refuse the suite,
      which is why this task's verify runs your file directly.

      Cases required, each one named so the receipt can cite it:
      marker_constant — MARKER equals .harness/team-config.yaml exactly.
      root_from_script — given a fake bin dir four levels below a tmp root, returns that tmp root,
      and returns it unchanged when no MARKER exists anywhere (it does no filesystem check).
      resolve_root_strict — three cases: an override carrying MARKER is honoured; an override NOT
      carrying MARKER is discarded, the derived root is used, and the discard is reported on stderr;
      neither carrying MARKER raises. Build the tmp trees with tempfile.mkdtemp.
      root_above — a start point several directories below a MARKER-carrying root returns that root;
      a start point below a directory named .harness that contains NO team-config.yaml does NOT
      return it and keeps walking to the real root above; nothing above returns None. The second of
      those is the $HOME/.harness fail-open and it is the reason this function exists.

      TDD ORDER IS THE DELIVERABLE, NOT AN INTERNAL PREFERENCE. Write the test file first, run it
      against the untouched harness_boundary.py, and paste the VERBATIM failing output into
      .harness/harness/features/FEAT-42-one-root-resolver/notes/receipt-<your-agent-name>-<runid>.md
      before writing any implementation. The receipt must contain a FAIL line naming each of
      root_from_script, resolve_root_strict, root_above and marker_constant. The verify greps for
      exactly those four tokens on FAIL lines and fails the task if any is missing.
  - id: T-02
