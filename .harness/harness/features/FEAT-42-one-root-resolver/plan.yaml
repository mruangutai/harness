  - id: T-20
    title: Remove the HARNESS_PROJECT_DIR injection from the OMP policy-script spawn
    traces: [REQ-01, REQ-02]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: enforcement-adjacent host adapter; check-domain.sh --resolve returns NOBODY for .omp/** at sha 3952814, so no agent domain grants it
    depends_on: [T-10, T-11, T-14, T-16, T-17]
    status: done
    files:
      - .omp/extensions/harness-hooks.ts
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      F=.omp/extensions/harness-hooks.ts
      test -f "$F" || { echo "$F is missing - this task removes one option key, not the file"; exit 1; }
      HITS=$(git ls-files -z -- '*.ts' '*.js' '*.json' | xargs -0 grep -n 'HARNESS_PROJECT_DIR' 2>/dev/null | grep -v '/bin/' | wc -l | tr -d ' ')
      test "$HITS" = "0" || { echo "HARNESS_PROJECT_DIR still set outside bin/ in $HITS place(s)"; git ls-files -z -- '*.ts' '*.js' '*.json' | xargs -0 grep -n 'HARNESS_PROJECT_DIR' 2>/dev/null | grep -v '/bin/'; exit 1; }
      grep -q 'spawnSync(join(cwd, BIN, script)' "$F" || { echo "the policy-script spawn no longer resolves through join(cwd, BIN, script)"; exit 1; }
      grep -q 'process.env' "$F" || { echo "the child no longer inherits the host environment at all - too much was removed"; exit 1; }
      bash .claude/skills/harness/bin/check-domain.sh --resolve .omp/extensions/harness-hooks.ts > /dev/null 2>&1
      bash .claude/skills/harness/bin/check-state.sh; test $? -le 1 || exit 1
      echo T-20-OK
    intent: |
      In .omp/extensions/harness-hooks.ts, the runPolicy helper at line 142 spawns every OMP-hosted
      policy script with an env option that injects the host process working directory as the
      harness root. At sha 3952814 line 144 reads exactly:

      env: { ...process.env, HARNESS_PROJECT_DIR: cwd },

      Delete the HARNESS_PROJECT_DIR key from that object literal and nothing else. The child must
      still inherit the rest of the host environment, so the option becomes a plain spread of
      process.env; if removing the key leaves the env option semantically identical to the default
      inheritance, you may drop the option entirely, but do not remove or reorder any other option
      of the spawnSync call and do not change cwd, args, input or encoding.

      WHY, because a reader will otherwise put it back. This is the only place outside
      .claude/skills/harness/bin/ that sets the variable - a repo-wide grep over tracked .ts, .js
      and .json files excluding /bin/ returns exactly this one line at sha 3952814; every other
      match in the tree is prose. After T-10, T-11, T-14, T-16 and T-17 each of the five scripts
      this helper invokes - check-domain.sh, bash-write-guard.sh, branch-create-gate.sh,
      inject-expertise.sh and validate-digest.py - derives its own root from its own file location
      under D-4. Handing it one is therefore redundant. Worse, the value handed over is the host
      process working directory, and under D-2 and D-3 a feature worktree carries
      .harness/team-config.yaml, so a wrong-but-plausible cwd probes VALID and is honoured in
      preference to the script's own derivation. That is the fail-open this feature exists to
      close, reopened from outside the directory the invariant scans.

      A supporting mechanism, recorded because it makes the blast radius larger than one process:
      once a parent sets HARNESS_PROJECT_DIR, every descendant inherits it. During FEAT-40 that
      inheritance misled an orchestrator far enough that it nearly filed a wrong finding about a
      failing test - see FEAT-40/observations/harness-orchestrator.md:58, where the author records
      the reasoning and then rejects it. It is the mechanism that is evidenced, not a confirmed
      wrong-root failure.

      This task is ordered after the five cutovers on purpose: removing the injection before those
      scripts can derive their own root would leave them with no root at all.
