      grep -qE "^def root\(" $B/wayfind.py && { echo "root() survives"; exit 1; }
      grep -rqE "FAIL.*wayfind_directory_probe" $N/receipt-*.md || { echo "SC-10: no red receipt"; exit 1; }
      echo T-02-OK
    intent: |
      In .claude/skills/harness/bin/wayfind.py, DELETE the function root() at :46-53 entirely. It is
      not kept as a forwarder. Replace its single call site — cfg() at :57, which builds
      os.path.join(root(), ".harness", "harness.json") — so that it calls
      harness_boundary.root_above(os.getcwd()) and calls the module's existing die() with a clear
      message when that returns None. Import harness_boundary the way its existing importers under
      this directory already do.

      Two behaviours change and both are intended. First, the env chain
      HARNESS_PROJECT_DIR or CLAUDE_PROJECT_DIR or os.getcwd() is gone; the walk now starts from
      os.getcwd() only, which is correct for a CLI a human invokes and is the one function of the
      three that is allowed to see a cwd. Second, the probe moves from the bare .harness DIRECTORY
      to the MARKER file. That closes the fail-open documented by measurement at
      check-plan-routes.py:489-495: $HOME/.harness exists on this machine, holds two backup tarballs
      and no team-config.yaml, and today's directory probe resolves $HOME as a harness root.

      Write .claude/skills/harness/bin/test-wayfind.py in the sibling idiom (failures list,
      check(name, cond, detail), case_N_ functions, exits 1 on failure, no pytest). Do not register
      it in run-unit-tests.sh — T-03 does that. Required case, named wayfind_directory_probe: build
      a tmp tree with a real MARKER-carrying root, a child directory holding a bare .harness
      directory with NO team-config.yaml in it, and a start point below that child; assert cfg()
      resolves against the real root and not the decoy. Add a second case asserting cfg() dies with
      a non-zero exit when no MARKER exists anywhere above the start point.

      Run the wayfind_directory_probe case against the untouched wayfind.py first — it fails,
      because the directory probe returns the decoy — and paste that verbatim FAIL line into
      .harness/harness/features/FEAT-42-one-root-resolver/notes/receipt-<your-agent-name>-<runid>.md
      before writing the fix.

  - id: T-03
    title: Move run-unit-tests.sh off the env chain and register the two new test files
    traces: [REQ-01, REQ-02, REQ-08]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: the suite runner — a wrong cd on line 3 runs every gate against the wrong checkout and still exits 0, which no gate in this repository can see
    depends_on: [T-01, T-02]
    status: done
    files:
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      B=.claude/skills/harness/bin
      grep -q "HARNESS_PROJECT_DIR" $B/run-unit-tests.sh && { echo "chain survives"; exit 1; }
      for t in test-harness-boundary.py test-wayfind.py; do
        grep -q "$t" $B/run-unit-tests.sh || { echo "$t unregistered"; exit 1; }
      done
      bash $B/run-unit-tests.sh --check-kinds || exit 1
      ( cd /tmp && bash "$OLDPWD/$B/run-unit-tests.sh" --kind unit > /tmp/f42-t03-away.txt 2>&1 )
      bash $B/run-unit-tests.sh --kind unit > /tmp/f42-t03-here.txt 2>&1
      A=$(grep -cE '^(PASS|FAIL)' /tmp/f42-t03-away.txt)
      H=$(grep -cE '^(PASS|FAIL)' /tmp/f42-t03-here.txt)
      # grep -c writes 0 on no match, so equal counts alone are satisfied by a suite that
      # ran NOTHING from both cwds - a suite exiting 2 gives 0 vs 0 and diff succeeds.
      # Assert the run happened before comparing it. 300 is a floor under a MEASURED 342
      # result lines across the 24 pre-T-03 unit scripts, 0 failing, taken 2026-08-27.
      test "$H" -gt 300 || { echo "suite produced only $H result lines from the root - it did not run"; exit 1; }
      test "$A" = "$H" || { echo "cwd changed the suite: $A away vs $H here"; exit 1; }
      echo T-03-OK
    intent: |
      Two edits to .claude/skills/harness/bin/run-unit-tests.sh, and nothing else in the file.

      1. Line 3 is currently cd "${HARNESS_PROJECT_DIR:-${CLAUDE_PROJECT_DIR:-$(pwd)}}". Replace it
      with a cd to the root that harness_boundary resolves from THIS SCRIPT's own location. The file
      is bash, so shell out once: assign the result of a short python3 -c that appends
      .claude/skills/harness/bin to sys.path relative to the script's own directory, imports
      harness_boundary, and prints resolve_root(<that bin dir>). If that command fails or prints
      nothing, exit 2 with a message naming the script and saying no harness root could be resolved
      — do NOT fall back to pwd. Refusing is the point: a suite that silently runs against the wrong
      checkout is the failure this whole feature exists to remove, and it is invisible because the
      suite still exits 0.

      2. Append "test-harness-boundary.py" and "test-wayfind.py" to the UNIT_SCRIPTS array. Both are
      pure filesystem tests that spawn no subprocess, which is the split principle recorded at
      :6-16, so neither belongs in INTEGRATION_SCRIPTS. The unit test_kinds detect glob in
      .harness/harness.json is .claude/skills/harness/bin/test-*.py and already matches both, so
      harness.json needs no edit — do not touch it.

      The verify proves the cd is now cwd-independent by running the suite from /tmp and from the
      root and comparing the number of PASS/FAIL result lines. Before this task that comparison
      could not fail, because $(pwd) made /tmp the root and the run collapsed; that collapse is the
      red state, and there is no need to stage it separately.
  - id: T-04
    title: Delete factory_config.harness_root and repoint every caller at resolve_root
    traces: [REQ-01, REQ-02, REQ-03]
    change_type: cross_module
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-03]
    status: done
    files:
      - .claude/skills/harness/bin/factory_config.py
      - .claude/skills/harness/bin/board_lifecycle.py
      - .claude/skills/harness/bin/factory_claim.py
      - .claude/skills/harness/bin/feature-worktree.py
      - .claude/skills/harness/bin/gh_cost_log.py
      - .claude/skills/harness/bin/worktree_terminal.py
      - .claude/skills/harness/bin/test-factory-config.py
      - .claude/skills/harness/bin/test-factory-claim.py
      - .claude/skills/harness/bin/test-gh-cost-log.py
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/test-harness-boundary.py
    verify: |
      cd "$(git rev-parse --show-toplevel)"
      B=.claude/skills/harness/bin
      grep -rn "harness_root" $B/ && { echo "harness_root survives"; exit 1; }
      grep -q "HARNESS_PROJECT_DIR" $B/factory_config.py && { echo "chain survives"; exit 1; }
      bash $B/run-unit-tests.sh --kind all || exit 1
      echo T-04-OK
    intent: |
      DELETE the function harness_root() at .claude/skills/harness/bin/factory_config.py:44-58. It
      does not survive as a forwarder. Every reference to the NAME harness_root must be gone from
      .claude/skills/harness/bin, including the ones inside docstrings and comments — the verify
      greps for the bare name across the whole directory and fails on any hit, because a name left
      in prose is the second door this feature exists to close.

      Replace it with harness_boundary.resolve_root(_BIN_DIR), where _BIN_DIR is the constant
      factory_config already derives from its own __file__. resolve_root is strict, so a broken
      install now raises instead of returning a confident wrong answer.

      The import-time risk is real and has been checked: FLEET_PATH at :59 calls this at MODULE
      IMPORT for all 23 importers, and check-domain.sh:196 reaches it through resolve_fleet's lazy
      import inside a try whose except is sys.exit(2). A strict raise there would BLOCK a governed
      write. It cannot fire: factory_config resolves from its own _BIN_DIR, which under any test
      fixture root still sits inside the LIVE checkout, and the live checkout always carries
      .harness/team-config.yaml. Strict raises only when the bin directory itself is outside every
      harness checkout, which is a broken install where refusing is correct. Do not weaken this to
      strict=False; if you find a path where it does fire, stop and report it rather than
      downgrading the flag.

      Repoint these production call sites, all of which want the install root:
      factory_config.py:59 FLEET_PATH; factory_claim.py:45 FEATURES_ROOT;
      feature-worktree.py:67; gh_cost_log.py:111; and board_lifecycle.py at :671, :922, :934, :1034
      and :1121. Each becomes harness_boundary.resolve_root(<that module's own bin dir constant>) —
      resolve from the calling module's own location, never by importing factory_config just to
      reach a root.

      Prose-only references that must be reworded rather than repointed: factory_claim.py:26,
      board_lifecycle.py:158, feature-worktree.py:10, gh_cost_log.py:109, worktree_terminal.py:112,
      :113 and :301. worktree_terminal's are load-bearing warnings about the cwd trap; keep the
      warning and change the name it cites.

      NORMALISE THE OVERRIDE RETURN, folded in here on the orchestrator's finding at the T-01/T-02
      run and the operator's ruling of 2026-08-27. resolve_root returns the accepted
      HARNESS_PROJECT_DIR value VERBATIM, while every other return path is already absolute because
      root_from_script builds it with os.path.abspath. Measured: a relative override returns '.',
      and a trailing-slash override returns the slash. Wrap that one return in os.path.abspath and
      add a case to test-harness-boundary.py asserting a relative marker-carrying override resolves
      to the same absolute path an absolute one does. It cannot bite today - the variable is unset
      in this checkout and OMP injects an absolute cwd - so this is closing a latent inconsistency,
      not a live defect. It is folded into this task rather than given its own because you are
      already in the resolver's callers and a separate cycle would buy nothing.

      Three test files bind to the name and break on the delete. test-gh-cost-log.py:40, :45 and :52
      monkeypatch factory_config.harness_root by attribute — repoint them at whatever
      gh_cost_log.py now calls, keeping the same tmp-root redirection. test-factory-claim.py:54 and
      test-factory-config.py:780 assert against it — same treatment. Do not delete a case to make
      the grep pass; if a case can no longer be expressed, say so in your return.

