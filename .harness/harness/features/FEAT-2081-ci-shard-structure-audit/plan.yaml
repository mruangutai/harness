      python3 tests/integration/test-run-pool.py
    intent: |
      Work only in the FEAT-2081 feature worktree. Each listed command must exit 0 within 60 seconds independently. Preserve the trusted-root bootstrap, suite_layout validation of both suites, attributed output blocks, per-script private temporary directories, mutation detection, completion-order reporting, worker override precedence, and no-argument/--kind unit/integration/all unsharded discovery and exit behavior. Do not add change-based selection or shared-checkout mutation.
      Add --shard i/n and --manifest PATH to run-unit-tests.py. Accept --kind and the new options in either order; default kind remains all. A shard is two unsigned decimal positive integers with 1 <= i <= n; reject missing values, malformed fractions, zero, negative values, i > n, and repeated shard/manifest options with a diagnostic and exit 2 before tests run. A manifest requires --shard. Preserve the existing accepted unsharded forms and --check-layout behavior; reject combining --check-layout with execution-only shard/manifest options. Allow sharding whichever suite was selected, not just integration. Empty selected shards succeed and emit an empty completed-file manifest without invoking the pool; they must not weaken nonempty full-suite layout validation.
      Commit a versioned duration document at tests/integration/integration-durations.json with schema 1, source_run_url https://github.com/mruangutai/harness/actions/runs/37264903064, source_commit b046bdfed9fa262a25f53a41d566db2b90cd140b, default_seconds equal to the median of that run's 73 attributed integration file durations, and weights mapping repository-relative integration test paths to those positive measured seconds. Extract all 73 records from the existing Actions log, not a rerun. Validate the checked-in document's shape and positive finite numbers explicitly. It is advisory weight data, never the discovery authority, and must never rewrite itself during CI. Tests use an isolated versioned weight document; update existing temporary-tree copy helpers to include the new data dependency. Unit files without integration history also receive default_seconds.
      Discover using the existing selected-suite globs, then longest-processing-time partition: sort files by descending effective duration with repository-relative path as tie breaker; assign each file to the least loaded shard with lowest shard number as tie breaker; print that shard's selected paths in lexical order before running. Stale history entries do not add files. Unknown newly discovered files use default_seconds. Every discovered file belongs to exactly one shard. Never hash-randomize, select from timing keys, or rebalance using concurrent job state.
      Add a narrow optional result-output seam to run_pool.py that records every completed script and its return code from actual futures, not from the requested script list. Keep default CLI output and exits unchanged. The runner writes manifest schema 1 containing tested_commit from git rev-parse HEAD, kind, shard_index, shard_count, selected_files, completed_files as path/returncode records, and runner_exit. Write only after all started scripts terminate and mutation checking finishes; startup crashes or cancellation may leave no manifest, which the aggregator must reject. Use repository-relative normalized paths and write outside the watched bin tree. Preserve failing test records and a nonzero runner_exit. Do not invent successful completion for an unstarted file.
      QA must record pre-fix failures for independent deterministic-completeness, weighted-versus-round-robin, equal-weight tie breaking, unknown-file inclusion, empty-shard, malformed-argument, and completed-versus-selected manifest witnesses in the new integration test. Include a positive control and execute shard fixtures in private copied repositories, not the checkout. For SC-07 record a targeted runner mutation that drops a discovered unit file, destroys attribution, or masks a child failure; the new unit regression must fail for each mutation. For SC-08 similarly prove an omitted integration file and masked failure are detected. Keep existing runner/layout/pool cases and their complete-discovery assertions; a previously green test alone is not red-first evidence.
