decisions:
  - id: D-01
    choice: Register expertise_apply inside registerHarnessHooks and bind persona, runtime lineage, mission and feature root from its existing closure and claim resolver, never tool arguments.
    because: This gives every existing persona its own pen without adding Bash or a scribe and makes the capability boundary enforceable.
    dec: none
  - id: D-02
    choice: Add member-ops and replay subcommands to expertise-merge.py, retaining its ops engine and harness_merge core; recorded applied-op receipts travel inside the distill PR and replay onto current main.
    because: The existing CLI already owns Expertise parsing and refusals; an independent queue or second merge implementation would add an unnecessary lifetime and authority.
    dec: none
  - id: D-03
    choice: Recognize distill candidates by changed Expertise paths, deny raw distill merges and add merge-distill to the existing merge-gate.py; hold one owner-root harness_merge lock through fresh base/head, replay and existing DEC-220 owner/binding/mirror-receipt enforcement and the synchronous merge subprocess.
    because: A pre-tool hook cannot hold a Python process lock after it exits; a receipt-only preflight leaves concurrent merges racing on main, and an internal gh subprocess gets no independent host Bash gate to enforce mirror provenance.
    dec: none
