      Extend expertise-merge.py, not harness_merge.py or a parallel writer. Keep existing apply/ops CLI input and refusal semantics, including strict rejection of persona as a low-level op key. Add member-ops for the trusted host extension: receive host-bound root, feature, persona and runtime child/parent ids plus selected craft/repository destination and the ordinary JSON op list. The host owns caller authority; the core checks the resolved destination is exactly that persona's selected file beneath the feature root, rejecting symlink escapes and global/control-plane targets. Repository selection is a literal existing declared segment, never a free path. Strip no unknown op keys. Delegate parsing, section/id resolution, caps, flock and atomic replacement to the existing engine and harness_merge. Run check-expertise on the computed candidate before landing it. Absent files receive the canonical title and four sections. Return before/after per-section counts as well as the receipt so a shell-less member can report measured counts.
      The applied receipt contains persona, feature, runtime child and parent ids, checkout-relative destination, ordered batches of exact accepted ops, original entry text or absence for each addressed section/id, and before/after content hashes. Give each batch a stable content-derived identity for exact recovery references. Keep persona outside the core op shape; expertise_update contains persona plus ordinary op fields and no state. Persist notes/expertise-receipt-<sha256-runtime-id>.json inside the feature directory so it travels in this PR, not in an independent ledger or queue. Multiple calls append ordered batches for the same runtime caller. Persist the receipt atomically with the existing harness_merge facility after applying the validated target candidate, and publish success only after receipt and file agree. A refused operation preserves target bytes and adds no applied batch. Do not add a write-ahead journal, pending transaction, interrupted-receipt state or resume/retry machinery. If target persistence succeeds but receipt persistence fails, fail the call; receipt/file mismatch or missing evidence then fails closed at verification and replay/merge. Historical accepted batches remain immutable; replay mappings and supersession references are separate output, not rewrites of historical ops.
      Expose read-only receipt verification for T-04: match persona, feature, runtime ids, exact op and destination, then evaluate the final effect of ordered active batches rather than requiring a superseded intermediate replacement still survive. Compare the actual file with the recorded reconstruction, distinguish preserved identical adds from invented application, and never apply inside the verifier. The host wrapper adds identity/path authorization and delegates reconstruction to this existing core.
      Add replay --root <feature-worktree> --feature <id> --base <main-sha> with read-only --check. Read this feature's receipt manifests, not arbitrary prose digests; include only the current distill PR's receipt set relative to the supplied base, never receipts already present on main from an earlier distill. Rebuild each touched file from that exact main blob, then replay active batches in recorded order. Different runtime callers cannot silently overwrite each other. For colliding adds with different text choose the first free positive numeric id for the prefix in that section, zero-padded to at least two digits, excluding existing and current-batch reserved ids; remap later references from that runtime caller to its new id. Identical existing adds preserve rather than duplicate. For replace/drop compare the recorded original entry with current main and refuse if it changed or disappeared; identical already-applied final effects are idempotent rather than duplicate edits. Preserve one-base-snapshot semantics inside each batch. Reject two independent callers replacing/dropping the same base entry, even if replay order would otherwise hide one. Check caps and check-expertise on complete candidates before writing; a refused file stays byte-identical. Report exact persona, run, destination, section/id, batch identity and refusal for the original member to re-judge or curate through its lead. Emit original-to-replayed id mappings and base/hash evidence. Repeated replay starts from the named main base rather than adding its earlier local output again.
      Resolve re-judgment within these PR-contained receipts: accept optional supersedes references to exact earlier batch identities on a replacement member-ops call, outside the low-level op objects. Only a trusted distill invocation of the same original persona for the same feature and destination may authorize replacement, including a re-dispatched runtime child with its own verified lineage. Validate referenced receipts and hashes; require references are earlier, active and inside this PR, and reject missing, cross-persona/feature/destination, cyclic or ambiguously multiply-superseded batches. Reconstruct from the explicit current main base with referenced batches omitted and other active batches retained, then apply the member's newly judged replacement ops against that reconstruction. A replacement may be empty when the member withdraws the earlier judgment; it is not an applied op or a fabricated expertise_update item. Validate and atomically persist the replacement receipt and resulting file under the same fail-closed agreement rule; failed replacement cannot retire the old batch. Derive active replay by following validated supersession references from successful replacement receipts, preserving every old receipt unchanged. Retire an entire referenced batch, so its member must re-judge all its ops, rather than silently dropping individual ops. Read-only verification checks the reconstructed active result and authorization references; historical digests remain readable in their recorded context. No digest state enum, independent active-selection file or queue.
      Add unit and isolated CLI integration cases before production changes, with local fixture repositories and bounded subprocesses, never live Expertise. Cover existing apply/ops regressions, absent craft/repository files, atomic receipt persistence and fail-closed missing/mismatched receipt/file evidence, final ordered-active-batch verification, current-PR receipt selection, two independent worktree adds/collision mapping, independent same-entry replace/drop refusal, changed-main replace/drop refusal, cap overflow preserving bytes and repeat replay. Test refusal then same-original-persona re-dispatch/re-judgment then successful replay, including empty withdrawal, immutable historical receipts, idempotent replacement replay and rejection of unauthorized or ambiguous supersession. Demonstrate new assertions fail against pre-change copies or one-mechanism mutants, retain fail-first receipts, and keep the literal verify below 60 seconds with exit 0 and zero FAIL cases. cross_module maps to the configured unit plus integration floor. This task supplies a non-gate library/CLI; it does not implement or execute merge-distill, which is enforcement owned by T-04.
