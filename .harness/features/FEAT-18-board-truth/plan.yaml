    intent: |
      This is the invariant that carries the guarantee. Failed station writes are loud only on
      stderr, and the operator accepted that stderr inside a subagent run is not something they
      read - so a board that drifted is caught here or it is not caught at all.

      Add INV-26 to .claude/skills/harness/bin/check-state.sh. The highest invariant in the file
      today is INV-25; number the new one INV-26 and follow the file's existing shape for appending
      to the bad list. It runs once, at session entry, after INV-25.

      GATING, in this order, and each of these records NOTHING and is not a violation:
        - harness.json has no github block, or github.sync is not true.
        - gh_board.load_board(root) returns None - no board configured.
        - gh is not on PATH, or gh auth status returns non-zero.
        - the board read itself fails or times out. Use a timeout, as INV-25 does for git.
      The precedent is INV-25's git-absent branch: this invariant must never turn an unrelated or
      offline environment into a red gate.

      ONE EXCEPTION TO THAT QUIETNESS, and it is INV-25's other precedent: if
      import gh_board raises, that is a VIOLATION naming
      .claude/skills/harness/bin/gh_board.py as the file to restore, because the module ships with
      the repository - being unimportable is a defect in the tree, not a property of the
      environment. Follow the wording shape INV-25 uses for harness_boundary.py.

      THE GH BINARY MUST BE OVERRIDABLE OR THIS CANNOT BE TESTED. check-state.sh has no gh call
      today. Resolve the binary once, from the environment variable FACTORY_GH if set, else gh -
      the same variable factory_gh already honours, so one fake serves the module and the
      invariant. Do not invent a third variable name.

      THE CHECK, per feature directory under .harness/features/:
        - skip the feature entirely when its feature.json status is Done. That is the terminal
          exemption: the ship closed the parent, GitHub's Item closed workflow landed it in Done,
          and the derivation would still say Review, so without this every shipped feature is a
          permanent false violation. Use the same first-whitespace-token read
          check-plan-routes.py's _is_shipped uses, and be case sensitive - done is not Done.
        - skip a feature with no plan.yaml, and skip one whose plan.yaml does not load, recording
          nothing - other invariants own those.
        - compute the derived parent station with gh_board.derive_station. If it is None, the
          feature has no task-derived verdict and the whole feature is skipped.
        - THE MIRROR-NEVER-RAN CLAUSE: if the derived station is not None but feature.json's
          github.issues map is absent or empty, that is a VIOLATION saying the feature has tasks in
          flight or finished and no mirrored issues, so the board cannot be telling the truth about
          it. This is the ticket's own third gap - a mirror that never ran and one that ran cleanly
          are otherwise indistinguishable. INV-21 warns on a DIFFERENT shape, recorded issues with
          no parent; do not merge them and do not restate INV-21's message.
        - read every card once with gh_board.board_stations, for the pinned github.repo, and then
          compare offline.
        - PER TASK: for each T-NN with a recorded issue number, the expected column is Building
          when the plan says building, Done when the plan says done, and Backlog when the plan says
          pending. Look the card up with gh_board.read_station. A mismatch is a VIOLATION naming
          the feature, the task id, the issue number, the plan's status and the column found. A
          read_station reason - not on the board, or no station set - is ALSO a violation, worded
          as CANNOT VERIFY and naming which of the two it was. Reporting it as clean is the failure
          this whole invariant exists to prevent, because a lookup that misses makes both sides
          empty and every record then compares equal.
        - PER PARENT: the recorded parent issue's column must equal the derived station. Same
          violation shape. A feature with a derived station and no recorded parent is left to
          INV-21.

      Every INV-26 finding goes to the bad list, not the warn list: a board that disagrees with the
      plan is the operator's view of the factory being wrong, which is the condition the ticket
      opens with.

      In .claude/skills/harness/bin/test-check-state.py add cases through the file's existing
      run(tmp) helper, with FACTORY_GH pointed at a fake gh that returns a canned project item-list
      page. If any of this lands as a new case function rather than an extension of an existing
      one, REGISTER it in main() alongside the other cases in the same task - an unregistered case
      never runs and passes vacuously.

      THE NON-VACUITY PAIR IS THE POINT OF THIS TASK AND BOTH HALVES SHIP TOGETHER:
        - THE MIS-COLUMNED FIXTURE. A feature whose plan.yaml records T-01 as done, whose
          feature.json records an issue number for T-01 and a parent, and whose fake board page
          puts that issue's card in Backlog. check-state.sh must report a violation whose text
          names the feature, T-01, done and Backlog.
        - THE CORRECTED TWIN. The SAME fixture with exactly one byte changed - that one card's
          status in the fake page reading Done instead of Backlog, and the parent's reading Review
          - reports no INV-26 violation. Nothing else differs between the two.
          Without this half the first is satisfied by an invariant that reports a violation for
          every feature it looks at, which is the same blindness in the opposite direction.
      And, each on its own:
        - a feature whose feature.json status is Done and whose cards are all in Backlog reports
          NOTHING, proving the terminal exemption.
        - a feature whose plan has a task building, sync on, and an EMPTY github.issues map is a
          violation.
        - a feature whose recorded issue number is absent from the board page is a CANNOT VERIFY
          violation, not a clean pass.
        - with FACTORY_GH pointing at a binary that does not exist, check-state.sh records no
          INV-26 finding and its exit status is whatever the rest of the file decides - INV-26
          contributes nothing.
