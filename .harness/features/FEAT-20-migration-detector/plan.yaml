decisions:
  - id: D-01
    choice: >-
      Failure is judged PER COUPLED SURFACE over a closed reader set, never tree-wide. Surface
      FEATURES takes its disk evidence from .harness/features/*/feature.json against
      .harness/*/features/*/feature.json, and its coupled readers are exactly unit 3's atomic
      cluster - team-config.yaml write grants, check-domain.sh SWEEP_GLOBS, check-domain.sh's four
      shape regexes, check-plan-routes.py's discovery join, check-state.sh's discovery globs.
      Surface DOCS takes its evidence from docs/harness/SPEC.md against .harness/*/docs/SPEC.md,
      and its coupled readers are exactly unit 4's atomic trio - factory_config._PROBE,
      harness_boundary.HARNESS_CONTROL_PLANE, gen-decisions-index.DOCS_DIR. Deliberately excluded
      from both sets, and named so a later reader does not add them back - gh-sync.py line 729,
      branch-create-gate.sh line 77, validate-feature-json.py, factory_claim.py line 43, the
      gitignore snippet, and all prose.
    because: >-
      Map 336 makes unit 3 one commit and unit 4 its own atomic unit with no ordering tie, so
      features-moved-docs-not is a SANCTIONED state and a tree-wide definition reddens on it. The
      excluded readers land anytime under unit 9, so reading them reddens a sanctioned state from
      the other direction.
    dec: none
  - id: D-02
    choice: >-
      Building the detector is main-session-direct. The module, its unit test, check-state.sh,
      test-check-state.py and the run-unit-tests.sh registration are all built by hand. Only the CI
      step is dispatched, to harness-dev-ops.
    because: >-
      check-state.sh computes a gate verdict from the module's return value, which FEAT-18 already
      ruled a DEC-174 carve-out by content for gh_board.py on identical --resolve output. The
      rejected alternative was invoking the detector only from CI to keep a team lane, and it was
      rejected because session entry is the higher-value call site - check-state.sh going quiet is
      the defect this feature exists to prevent. The cost is stated, not argued away - two of the
      four tasks, and five of the eight files, are hand-built.
    dec: DEC-174
  - id: D-03
    choice: >-
      Each coupled reader carries a DATA row of two forms, legacy and migrated. A reader file
      matching neither form exits 2, cannot-verify, which both call sites treat as a violation. A
      reader file matching BOTH forms exits 1. The check asserts which forms appear per file and
      never asserts a site count, and never anchors on a line number. A legacy pattern is written
      as THE WEAKEST FRAGMENT EVERY STALE SITE NECESSARILY CONTAINS, audited against the real file
      before the row is written. The residual bound is stated rather than argued away - the
      detector proves per-file FORM AGREEMENT, never per-site COMPLETENESS - and it is carried in
      the module comment and the decision entry because units 3 through 7 lean on it. Units 3 and
      4 update their own rows inside their one atomic commit, and are not done until the detector
      exits 0 on their migrated tree inside that same commit - that maintenance contract is part
      of what this hands to the next planner, and it is why the table must be data rather than
      logic. Because the table is data, CLEAN additionally requires a NON-EMPTY reader set for the
      surface being judged - over an empty set the clause every reader carries that one form is
      vacuously true, so a later edit dropping a surface's rows would report CLEAN forever. A
      surface whose table holds no rows is cannot-verify, and the two surfaces are a fixed enum
      declared independently of the table, so a surface can never be skipped ahead of its verdict
      either.
    because: >-
      The migrated form is anticipated, not observed, because nothing has moved yet. Degrading an
      unrecognised reader to clean is how issue 148's check passed forever. The site count was read
      as 13, 14 and 15 in three good-faith surveys of the same file, so a count assertion rots
      inside one cycle.
    dec: none
  - id: D-04
    choice: >-
      Applicability is decided before any surface is judged, by one positive control - the presence
      of .claude/skills/harness/bin/check-state.sh at the scanned root. A root without it is
      reported as NOT APPLICABLE with zero examined counts and exit 0, and no surface is judged at
      all.
    because: >-
      Every coupled reader is a harness control-plane file. check-state.sh also runs at session
      entry in onboarded product repositories, and test-check-state.py's existing fixtures are bare
      .harness skeletons - neither holds any reader file, so D-03 alone would exit 2 on a healthy
      product repo and on every existing test case. What keeps the branch from becoming a silent
      pass inside harness is T-01 CASE 1, not the CI step: case 1 scans the real repository root
      and asserts non-zero examined counts, so a missing or renamed marker turns NOT APPLICABLE
      into a red case in the required unit suite. The CI step's zero-count assertion is a second
      signal, not the guarantee - DEC-183 records the whole CI step class as unguarded by owner
      decision, nothing protects the gate, settled, and no .py in the tree reads
      .github/workflows/tests.yml at 88b1182, so that bound is one PR deep. The marker is also
      invariant across the migration it gates - .claude/skills/harness/bin/** moves in no unit of
      map 336 - and presence of the marker is a different property from agreement of the forms,
      so the control is sound rather than circular. Session entry is genuinely unbounded and
      silent on NOT APPLICABLE by design (SC-12 mandates that silence); case 1 is what keeps the
      harness tree from ever reaching that branch unnoticed.
    dec: none

tasks:
  - id: T-01
    title: Build the layout-migration detector module and its red-first unit suite
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-07, REQ-08]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: >-
      DEC-174 carve-out by content - check-state.sh computes INV-27's verdict from this module's
      return value. Lane row above, FEAT-18 gh_board.py precedent.
    depends_on: []
    status: building
    files:
      - .claude/skills/harness/bin/layout_migration.py
      - .claude/skills/harness/bin/test-layout-migration.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      u=$(mktemp); ru=0
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit >"$u" 2>&1 || ru=$?
      cat "$u"
      grep -q '^PASS test-layout-migration\.py$' "$u" || { echo "the new suite did not run at all"; exit 1; }
      exit "$ru"
    intent: |
      Create layout_migration.py, an importable module plus a thin CLI, and
      test-layout-migration.py, its in-process unit suite. Register
      "test-layout-migration.py" in the UNIT_SCRIPTS array of run-unit-tests.sh in this same
      task: run-unit-tests.sh runs a drift detector over the union of both arrays and an
      unregistered test file fails the WHOLE run.

      WRITE THE TESTS FIRST AND RUN THEM RED BEFORE THE MODULE EXISTS OR IS COMPLETE. Record
      the red run in the receipt. A detector that has never been observed failing is issue 148
      inside the fix for issue 148, and that is the whole reason this feature is unit 0.

      APPLICABILITY, DECIDED FIRST. Before any surface is judged, test whether the scanned root
      holds .claude/skills/harness/bin/check-state.sh. If it does not, the root is not a harness
      control-plane checkout: report NOT APPLICABLE, print zero for all three examined counts, and
      exit 0 without judging a surface. This is what keeps a healthy onboarded product repository
      and every existing check-state.sh fixture from reddening, since neither holds any coupled
      reader file at all. It is not a hole: inside harness the marker is present by construction,
      and case 1 of this suite scans the real root and asserts non-zero counts, so a missing or
      renamed marker reddens the unit suite. Do not describe the CI step as the guarantee - see
      D-04. The exact text this branch prints is pinned in the OUTPUT CONTRACT below, including
      the NOT APPLICABLE literal and the two zero-count lines; do not invent wording for it here.

      THE MODEL. Two surfaces, judged independently and never combined into one tree-wide
      verdict:

      SURFACE features
        disk evidence, two disjoint glob shapes relative to the scanned root:
          legacy   = .harness/features/*/feature.json
          migrated = .harness/*/features/*/feature.json
        The shapes differ in segment count, so they cannot both match one path and no list of
        reserved directory names is needed.
        coupled readers, each with a two-form data row. EVERY PATTERN IS A REGEX, with literal
        characters escaped in the pattern as written - a literal-substring row cannot express a
        migrated form whose repository segment is not yet known, so the whole table is regex or
        the table is inconsistent. Patterns audited against the real files at 88b1182; the audit
        result is quoted per row so a later editor can re-run it:

          .harness/team-config.yaml
            legacy   = \.harness/features/
            migrated = \.harness/[^/ ]+/features/
            audited: every write-grant line and the features: path setting carry the legacy
            fragment; there is no prose-only mention of it in this file.
          .claude/skills/harness/bin/check-domain.sh
            legacy   = \.harness/features/
            migrated = \.harness/(\*|\[\^/\]\+)/features/
            audited: the four SWEEP_GLOBS entries spell it as glob text and the four shape
            regexes spell it as regex source \.harness/features/, which contains the legacy
            fragment as a substring, so ONE pattern covers all eight sites. The migrated
            alternation exists because those two spellings diverge once a segment is inserted -
            glob text takes * and regex source takes [^/]+.
          .claude/skills/harness/bin/check-plan-routes.py
            legacy   = "\.harness", "features"
            migrated = "\.harness", [^,)]+, "features"
            audited: exactly one discovery join carries this. Six further mentions of
            .harness/features are docstring and diagnostic-message prose, and the join-shaped
            pattern excludes all six by construction - that is deliberate, see the MIXED-FOREVER
            rule below.
          .claude/skills/harness/bin/check-state.sh
            legacy   = os\.path\.join\(H, "features"
            migrated = os\.path\.join\(H, [^,)]+, "features"
            audited: 15 of 15 discovery sites match this legacy fragment, INCLUDING the two that
            carry no trailing "*" - os.path.join(H, "features") inside os.listdir, and
            os.path.join(H, "features", _f, "feature.json"). An earlier draft of this plan
            specified the legacy form as the join of H then "features" then "*", which misses
            exactly those two: unit 3 could have migrated the thirteen starred sites, left those
            two stale, and the file would then carry the migrated form and no matching legacy
            form - CLEAN with two broken discovery sites, the precise silent pass this feature
            exists to prevent. The sixteenth mention is a DEC-129 comment spelling
            .harness/features/<FEAT>/, which this pattern does not match, by design.

      THE PATTERN RULE THAT PRODUCED THAT TABLE, and which any future row must obey: A LEGACY
      PATTERN IS THE WEAKEST FRAGMENT EVERY STALE SITE NECESSARILY CONTAINS. Not the shape of the
      commonest site, and not the shape a survey of the file happened to notice. Write the
      candidate, then grep the real file with it and with a broader pattern for the same concept,
      and confirm the only lines the broader pattern adds are prose. A row that has not been
      audited that way is not written.

      THE RESIDUAL BOUND, AND IT IS NOT A DEFECT TO BE ARGUED AWAY: this detector proves PER-FILE
      FORM AGREEMENT, never PER-SITE COMPLETENESS. It answers "does this file speak one layout
      language, and the same one its evidence and its siblings speak" - it does not and cannot
      answer "did every site in this file get updated". A file whose stale sites all still match
      the legacy pattern is caught; a file migrated so thoroughly that no fragment of the legacy
      pattern survives, yet holding a stale site the pattern was too narrow to name, is not. That
      is why the pattern rule above is stated as a rule rather than left to judgement, and why
      units 3 and 4 owe the acceptance clause in T-04. State this bound VERBATIM IN A MODULE
      COMMENT: units 3 through 7 will lean on this detector and must know exactly what it does
      not promise.

      SURFACE docs
        disk evidence:
          legacy   = docs/harness/SPEC.md
          migrated = .harness/*/docs/SPEC.md
        coupled readers, same regex rule and same audit duty:
          .claude/skills/harness/bin/factory_config.py
            legacy   = os\.path\.join\("docs", "harness"
            migrated = os\.path\.join\("\.harness", [^,)]+, "docs"
            audited: one site, the _PROBE assignment. The module docstring mentions
            docs/harness/SPEC.md twice as prose; the join-shaped pattern excludes both.
          .claude/skills/harness/bin/gen-decisions-index.py
            legacy   = os\.path\.join\("docs", "harness"|docs/harness/
            migrated = os\.path\.join\("\.harness", [^,)]+, "docs"|\.harness/[^/ ]+/docs/
            audited: this is the ONE ROW WHOSE PATTERN IS DELIBERATELY NOT CODE-SHAPED, and the
            reason is the second exception to the MIXED-FOREVER rule below. Two spellings carry
            the path. Line 20 is the DOCS_DIR join, code-shaped. Line 76 is a literal
            docs/harness/DECISIONS.md inside the HEADER template string that this script EMITS
            INTO the committed docs/harness/DECISIONS-INDEX.md - slash-shaped, and invisible to a
            join-shaped pattern. If unit 4 updated DOCS_DIR and left HEADER, the file would match
            the migrated form only: CLEAN, while the shipped index tells every agent to open a
            path that no longer exists. That is the MF-3 defect class this plan already closed for
            check-state.sh, in a second row. The alternation is therefore run at both spellings.
            The cost is stated and accepted, not argued away: the same slash-shaped alternative
            also matches the module docstring at lines 2, 5 and 10, which no pattern can separate
            from line 76 because they are spelled identically. Audited at 88b1182, which is HEAD
            and matches the working tree for this file: the legacy alternation matches exactly
            lines 2, 5, 10, 20 and 76 and nothing else, and the migrated alternation matches ZERO
            lines, so case 1 stays CLEAN on today's tree rather than going instantly MIXED.
          .claude/skills/harness/bin/harness_boundary.py
            legacy   = docs/harness/\*\*
            migrated = \.harness/[^/"]+/docs/\*\*
            audited: three occurrences, and only one of them is the HARNESS_CONTROL_PLANE entry
            itself. The other two are comments that QUOTE the entry verbatim, so no pattern can
            separate them from the code. This is the one row where the MIXED-FOREVER rule below
            has real work to do, and it is ruled there rather than papered over here.

      THE READER TABLE IS DATA - one module-level structure of (surface, file, legacy_pattern,
      migrated_pattern) rows that a future task edits without touching logic. Do not inline the
      patterns into control flow. EVERY PATTERN IS MATCHED AGAINST THE FILE'S WHOLE TEXT, not
      against a named section or a parsed structure. Do not use line numbers, do not count
      occurrences, do not assert how many sites a file has: the same file was surveyed as 13, 14
      and 15 glob sites in three good-faith readings, and any count assertion is stale inside one
      cycle.

      THE MIXED-FOREVER RULE, ruled here so no reviewer reopens it as an oversight, and stated in
      a module comment: because matching is whole-text, a purely HISTORICAL mention of a legacy
      form inside a coupled reader holds that file MIXED forever, long after every live site is
      migrated. The table above resolves this in three ways, and all three are deliberate:
        - For five of the seven rows the pattern is CODE-SHAPED - a join expression, a grant path,
          a glob or regex source - so docstring narrative and diagnostic-message prose fall
          outside it without anyone relocating a word of text. Prefer this resolution when a row
          is written or edited. It is also why factory_config.py's two docstring mentions of
          docs/harness/SPEC.md stay excluded - they narrate, they are emitted nowhere, and no
          missed defect has been demonstrated through them. That exclusion is ruled here, not
          overlooked.
        - For gen-decisions-index.py the code-shaped pattern MISSES A REAL DEFECT and is therefore
          overruled, and this is the second exception rather than an inconsistency. Its HEADER
          template string carries a slash-shaped docs/harness/DECISIONS.md that is EMITTED INTO
          the committed DECISIONS-INDEX.md, so a stale HEADER points every agent at a path that no
          longer exists while a join-shaped pattern reports the file cleanly migrated. Detection
          beats an unenforced obligation in a docs task, which is the remedy this ruling rejected.
          THE PRICE IS STATED AND ACCEPTED: the same alternation also holds the file MIXED for its
          module docstring at lines 2, 5 and 10, spelled identically to line 76 and inseparable
          from it by any pattern. That is not a false positive. All four lines are PRESENT-TENSE
          OPERATIONAL CLAIMS about the paths this script reads and writes, and unit 4 falsifies
          all four at once - line 10 instructs a reader to diff against a file that will not
          exist. Rewriting them inside unit 4's atomic commit is correct maintenance, on exactly
          the harness_boundary reasoning below. The residual risk, recorded rather than hidden:
          this row costs unit 4 four extra line edits in one file, and if the rewritten HEADER
          matches neither form the file exits 2 loudly at that commit, which is D-03's intended
          way to discover it.
        - For harness_boundary.py it is unreachable: its comments at the two audited sites quote
          the HARNESS_CONTROL_PLANE entry docs/harness/** character for character. THE RULING IS
          THAT UNIT 4 REWRITES THOSE COMMENTS inside its own atomic commit, and this feature does
          not touch them. That is correctness rather than history-laundering: both comments assert
          a PRESENT-TENSE fact about the closed list - that docs/harness/** is not widened to
          docs/** and that a glob key holds no docs/harness/** entry - and the migration makes
          both statements false about the code beneath them. The detector holding the file MIXED
          until they are corrected is the behaviour we want, not a false positive.

      DO NOT READ these files under any surface, and say so in a module comment naming them:
      gh-sync.py, branch-create-gate.sh, validate-feature-json.py, factory_claim.py, the
      gitignore snippet, and prose. Map 336 lands them anytime under unit 9, so reading them
      would redden a sanctioned state.

      PER-SURFACE VERDICT. THE SURFACES ARE A FIXED ENUM - features and docs - declared in the
      module INDEPENDENTLY OF THE READER TABLE, and every member of that enum is judged on every
      applicable scan. A surface is never skipped: iterate the enum, not the table. If the table
      yields ZERO rows for a surface, that surface is CANNOT_VERIFY, not absent from the report.
      A surface declared and then not judged must be exactly as loud as one judged cannot-verify.

      Compute the set of evidence roots present on disk, and for each coupled reader the set of
      forms present in its text. Then:
        CANNOT_VERIFY  if the surface has no coupled reader rows at all; or a reader file is
                       unreadable; or a reader's text matches neither of its two forms; or the
                       surface has no disk evidence of either shape at all.
        MIXED          if both evidence shapes are present; or a reader's text matches both of
                       its forms; or the single form a reader carries disagrees with the single
                       evidence shape on disk.
        CLEAN          a NON-EMPTY reader set for this surface, exactly one evidence shape, and
                       every reader carrying exactly that form.
      THE NON-EMPTY PRECONDITION IS NOT DECORATION. Over an empty reader set "every reader carries
      exactly that form" is VACUOUSLY TRUE, so a later edit that drops a surface's rows from the
      data table - and the table is data by D-03, precisely so that later units edit it - would
      make this detector report CLEAN forever. That is issue 148 reappearing inside the verdict
      logic of the feature that exists to eliminate issue 148, and it is why the emptiness check
      and the fixed-enum iteration are both specified rather than left to the implementation.

      PROCESS EXIT CODES, and nothing else may be returned:
        0  the root is NOT APPLICABLE, or every surface CLEAN
        1  any surface MIXED and none CANNOT_VERIFY
        2  any surface CANNOT_VERIFY, which outranks MIXED because a verdict computed over
           something unreadable is not a verdict

      OUTPUT CONTRACT, copied in spirit from check-plan-routes.py because its CI step is the
      working precedent for a check that can prove it looked. The CLI prints, on their own lines
      and in this order:
        one line per surface naming the surface, its verdict, the evidence shape or shapes found,
          and for a MIXED or CANNOT_VERIFY verdict the reader files responsible, by path.
          EVERY NAMED READER PATH CARRIES ITS MATCHED FORM-SET AS A TRAILING TAG, one of exactly
          these five pinned literals: [legacy] [migrated] [both] [neither] [unreadable]. Without
          the tag the line is not actionable, and this is a correctness defect rather than a
          polish item: a reader carrying the LEGACY form on a migrated tree must be FINISHED, and
          one carrying the MIGRATED form on a legacy tree must be REVERTED - opposite remedies
          that render as the identical line without the tag.
        the two CANNOT_VERIFY causes that have no reader file to name get their own wording, so
          that all four causes are distinguishable in the text and not only in the exit code:
            no disk evidence at all  -> the exact phrase: no evidence of either shape under <root>
            the table holds no rows  -> the exact phrase: no reader rows for this surface
        a line of the exact form:
          examined N feature dir(s), M doc root(s), R reader file(s)
        a final summary line of the exact form:
          layout: X surface(s) clean, Y mixed, Z cannot-verify
      BOTH OF THOSE TWO LINES PRINT ON EVERY BRANCH, INCLUDING NOT APPLICABLE, where N, M, R, X, Y
      and Z all read 0. The trailer is branch-invariant so that no consumer needs a second parser
      and so that a NOT APPLICABLE result reaching CI trips the zero-count error rather than the
      missing-line error.
      On the NOT APPLICABLE branch, and before those two lines, the CLI prints one further line
      whose leading token is the pinned literal NOT APPLICABLE, of the exact form:
          NOT APPLICABLE: no harness control-plane marker at <root>/.claude/skills/harness/bin/check-state.sh
      NOT APPLICABLE is a pinned string exactly like every other format string in this contract,
      and case 14 asserts that literal as well as the three zero counts.
      Put a comment above these format strings saying that .github/workflows/tests.yml greps the
      examined and layout lines and that a reword must change both places together.

      Expose for import: a function that takes a root path and returns a structured result
      carrying the per-surface verdicts, the counts, and the responsible reader paths EACH WITH
      ITS MATCHED FORM-SET - the same five values the CLI tag renders, carried as data and not as
      preformatted text - plus, for a CANNOT_VERIFY surface, which of the four causes fired; and a
      function returning the exit code for that result. check-state.sh imports these in T-02, so
      neither may print to stdout or call sys.exit. THE FORM-SET AND THE CAUSE MUST BE ON THE
      STRUCTURED RESULT, not only in the CLI text: T-02 composes INV-27's wording from this object
      and never re-parses stdout, so a fix that lands only in the CLI leaves the session-entry
      operator - the higher-value call site under D-02 - reading the same ambiguity CI no longer
      has.

      THE UNIT SUITE. Every fixture is a sandboxed temporary tree built and torn down by the
      test itself, via tempfile.TemporaryDirectory. NOTHING is written into the repository tree
      and no file in the repository is moved - fixture creation is not a layout change and the
      suite must not be readable as one. Build each fixture by writing small stub files that
      carry the relevant form text; do not copy the real scripts. Cases required, each asserting
      the exit code AND the responsible surface or reader named in the output, never the exit
      code alone. CASES ARE NEVER RENUMBERED - cases 1, 14 and 15 are cited by number in D-04, in
      T-02 and in the brief, so a new case is appended at the end. Where a case below names a
      form-set tag, assert that exact tag on that exact reader path in the output, because the tag
      is what tells an operator whether to finish the reader or revert it:
        1  the REAL repository root, scanned in-process, gives exit 0 and both a non-zero
           feature-dir count and a non-zero reader-file count. Assert the counts are non-zero
           rather than equal to a literal, so the case does not rot as features land. Assert also
           that the summary line's X plus Y plus Z equals 2, so that a surface dropped or skipped
           before its verdict is computed reddens here rather than vanishing quietly from a report
           that still says clean.
           LOAD-BEARING, in the same sense as cases 7 and 8 and for a sharper reason: this case
           is the positive control that keeps D-04's not-applicable branch honest. If the marker
           file is ever renamed or moved, the harness tree itself becomes NOT APPLICABLE and the
           detector goes silent everywhere at once - and case 1 is what turns that into a red
           unit case, because a NOT APPLICABLE scan reports zero counts and this case demands
           non-zero. It also proves the marker is a SOUND rather than a circular control:
           presence of the marker and agreement of the forms are different properties, and case
           1 asserts the second on the real tree while only assuming the first.
        2  features evidence split across both shapes  -> exit 1, FEATURES named
        3  all features under a repository root, one FEATURES reader still carrying the legacy
           form -> exit 1, that reader file named and tagged [legacy]. Assert the tag: this is
           the reader that needs FINISHING, and without the tag it is indistinguishable in the
           output from case 5's mirror, which needs the opposite remedy.
        4  docs evidence split across both shapes      -> exit 1, DOCS named
        5  docs evidence migrated, one DOCS reader still legacy -> exit 1, that reader named and
           tagged [legacy]. Assert the MIRROR IMAGE in this same case: docs evidence LEGACY with
           one DOCS reader carrying the MIGRATED form -> exit 1, that reader named and tagged
           [migrated]. Both halves are required, because they are the two OPPOSITE remedies -
