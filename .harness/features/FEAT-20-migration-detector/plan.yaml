  - id: T-04
    title: Record the surface partition and the cannot-verify posture as a decision
    traces: [REQ-01, REQ-04, REQ-05]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: [T-01]
    status: pending
    files:
      - docs/harness/DECISIONS.md
      - docs/harness/DECISIONS-INDEX.md
    verify: |
      python3 .claude/skills/harness/bin/gen-decisions-index.py --stdout | diff -q - docs/harness/DECISIONS-INDEX.md &&
      grep -q "per coupled surface" docs/harness/DECISIONS.md &&
      grep -q "cannot-verify, never clean" docs/harness/DECISIONS.md &&
      grep -q "form agreement, never per-site completeness" docs/harness/DECISIONS.md &&
      grep -q "inside the same atomic commit that migrates it" docs/harness/DECISIONS.md &&
      grep -E "^- DEC-" docs/harness/DECISIONS-INDEX.md | grep -qi "layout migration"
    intent: |
      Append one decision entry to docs/harness/DECISIONS.md, taking the NEXT FREE DEC NUMBER
      read from the end of docs/harness/DECISIONS-INDEX.md at the time you write it. Do not
      assume a number from this plan; none is allocated here.

      The decision to record, in the document's own voice and in its existing entry format. FIVE
      PHRASES ARE MANDATED VERBATIM because this task's verify greps for them - reproduce them
      character for character: "per coupled surface", "cannot-verify, never clean", "form
      agreement, never per-site completeness", "inside the same atomic commit that migrates it",
      and the words "layout migration" somewhere in the one-line index summary. Each of the four
      DECISIONS.md phrases returns zero matches in that file at 88b1182, so a green grep can only
      mean you wrote the entry.

      The substance to record:

        A partial layout migration is detected per coupled surface, never tree-wide. Two surfaces
        exist - features, whose coupled readers are team-config.yaml's write grants,
        check-domain.sh's SWEEP_GLOBS and shape regexes, check-plan-routes.py's discovery join and
        check-state.sh's discovery globs; and docs, whose coupled readers are factory_config's
        probe, harness_boundary's control-plane entry and gen-decisions-index's docs directory.
        The two surfaces have no ordering tie, so a tree with one migrated and the other not is a
        sanctioned state and passes. Each reader carries a two-form data row, and a reader
        matching neither form is cannot-verify, never clean - the exit code is 2 and both call
        sites treat it as a violation. Because those rows are data that later units edit, a surface
        is judged clean only over a non-empty reader set, and the surfaces are a fixed enum judged
        independently of the table: a surface whose rows are dropped is cannot-verify rather than
        vacuously clean, and can never be skipped ahead of its verdict. Every finding names the
        reader path with the form it matched, so that finishing a reader and reverting one - which
        are opposite remedies - are not reported by the same line.

        WHAT THE CHECK PROVES, AND WHAT IT DOES NOT. It proves per-file form agreement, never
        per-site completeness: it answers whether a file speaks one layout language and the same
        one its evidence speaks, not whether every site inside it was updated. A legacy pattern is
        therefore written as the weakest fragment every stale site necessarily contains, audited
        against the real file rather than inferred from the commonest site - an earlier draft
        specified check-state.sh's legacy form with a trailing wildcard and would have missed the
        two discovery sites that carry none, reporting a clean tree with two dead call sites.

        THE MAINTENANCE CONTRACT ON EVERY LATER UNIT. Any unit that changes a reader's form
        updates that reader's row inside the same atomic commit that migrates it, and that unit is
        not done until the detector exits 0 on its own migrated tree in that same commit. Nothing
        else converts the migrated pattern from an anticipated form into an observed one; a
        pattern written too tight matches neither form and exits 2 loudly at that commit, which is
        the intended way to discover the mistake.

        HISTORICAL MENTIONS. Because every pattern is matched against a file's whole text, a
        purely historical mention of a legacy form inside a coupled reader holds that file mixed
        forever. Five of the seven rows avoid this because their patterns are code-shaped - a join
        expression, a grant path, a glob or regex source - so docstring and diagnostic prose falls
        outside them. Two rows are exceptions, both ruled deliberately and both resolved the same
        way, by correcting the text rather than excusing it.

        The first is harness_boundary.py, whose comments quote the docs/harness/** control-plane
        entry verbatim. Those comments assert a present-tense fact the migration falsifies, so the
        unit that moves docs REWRITES THEM TO DESCRIBE THE MIGRATED CONTROL-PLANE ENTRY. Rewritten,
        never deleted: deleting them would make the file clean just as cheaply and would erase the
        signed risk-acceptance recorded in the comment above HARNESS_CONTROL_PLANE, which is a
        record loss rather than a migration.

        The second is gen-decisions-index.py, and its row is the one place a code-shaped pattern
        was overruled. That script emits a HEADER template into the committed DECISIONS-INDEX.md
        carrying a literal docs/harness/DECISIONS.md, which no join-shaped pattern sees; updating
        the docs directory constant and leaving HEADER stale would report the file cleanly migrated
        while the shipped index pointed every agent at a path that no longer exists. The row
        therefore matches the slash-shaped spelling too, which also catches that script's module
        docstring - inseparably, since the two are spelled identically. That is accepted rather
        than worked around, because every one of those lines is a present-tense operational claim
        about paths the script reads and writes, and the unit that moves docs falsifies all of them
        at once. Detection was preferred to an unenforced obligation recorded in prose.

      Say why in one clause: a tree-wide definition reddens on a state the release sequence
      sanctions, and degrading an unrecognised reader to clean is how a check passes forever.

      Cross-reference DEC-174 (why the detector and its call site are built by hand) and DEC-183
      (why the CI step carrying this check is a second signal and not its guarantee). Then
      regenerate the index with gen-decisions-index.py and commit both files together. Verify with
      --stdout piped to diff against the committed index; this script has no --check flag and
      never had one, and running git diff --exit-code instead would pass on an empty edit.
