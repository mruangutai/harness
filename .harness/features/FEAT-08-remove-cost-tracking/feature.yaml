    USER RULING, binds the validate phase: run ALL FOUR steps of teams/review.yaml —
    code, qa, security, ui. NO pre-emptive skips. FEAT-07 ran two of four and recorded
    security and ui as SKIPPED on the ORCHESTRATOR'S OWN judgment, made before
    dispatching. That is the thing being corrected.
  why: >-
    ui-reviewer and security-reviewer are DESIGNED to self-scope out on an
    inapplicable diff. Looking and declining IS the job, and a decline from a reviewer
    that looked is a reviewed finding. An orchestrator deciding in advance that there
    is nothing to find is an inference standing in for a measurement — the exact shape
    issue #22 forbids, which FEAT-07 itself shipped as the probe-don't-infer rule.
