    Two spawns may return nothing. That is the CORRECT outcome, not waste.
    validate-digest.py already accepts severity_max: n/a with PASS for this case.
    Record the reviewer's own verdict, never the orchestrator's prediction. Any
    skipped step means returning awaiting_user — the call is the user's, not mine.
  overrides_expertise: >-
    My own Expertise O-01 says skip the ui-reviewer when no design contract exists.
    THE RULING OUTRANKS IT. O-01 is a revision candidate at feature-close distillation.
