          422s. gh_issues.py documents this at its head and wayfind.py:272-276 records the review
          that found it. Consequently: id resolution goes through internal_id above and NEVER through
          issue_view, and no caller may pass an issue number where a *_id argument is named. The two
          edge types stay two functions against two endpoints - sub_issues is hierarchy,
          dependencies/blocked_by is dependency - and neither is implemented in terms of the other.
      Every function takes the repository or the board owner and number as arguments. No function
      may read git remotes, the current directory, or any environment variable other than
      FACTORY_GH. Importing the module must have no side effects. This module is a library with
      NO command-line entry of its own, so it does not call factory_cli.run; its share of the C-3
      contract is the GhError message shape above, plus the rule that no function in it ever
      mutates anything its caller did not ask for — the point of no return is the caller's to state,
      because each function here is one call — plus the rule that no function in it ever
      writes to stdout — anything it has to say goes to stderr, because its callers own stdout for
      their payload.

      Add test-factory-gh.py: a plain python3 script in the style of the other bin tests, no
      pytest, one line per case, exit 1 on any failure. It must monkeypatch factory_gh.run_gh (or
      the subprocess.run it calls) with a recorder and must never invoke the real gh. Cases, at
