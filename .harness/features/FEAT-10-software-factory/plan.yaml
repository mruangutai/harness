          subprocess.run, capture_output=True, text=True and stdin closed. Raise GhError when the
          binary is absent (FileNotFoundError) or the exit status is non-zero. Never swallow a
          failure and never return a default. This is D-02: the control plane fails loudly, in
          deliberate contrast to gh-sync.py, whose SKIP-and-exit-0 behaviour is correct for a
          mirror and wrong here.
