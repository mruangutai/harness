      Do NOT restate this widening as something four other tasks' change_type: feature matrix floor
      requires. That justification is wrong and an earlier draft carried it. The qa gate judges the
      kind from the diff and never from a task's change_type field (harness-qa-gate/SKILL.md:30),
      and it defines feature as UI and API together (:38); this increment is five Python
      command-line tools and one configuration file with no user interface, so that classification
      will not be reached. The widening stands on SC-06 alone, which declares integration evidence
      and cannot be satisfied while the kind detects nothing, and T-08's verify is what produces
      that evidence.

      This task depends on NOTHING and lands in the first wave — deliberately, and do not add a
      dependency on T-12 to make the glob match at write time. The second path names a file T-12
      creates later; a glob that currently matches nothing is harmless, because test-check-state.py
      already makes the kind resolve. The verify below asserts the second path is PRESENT IN THE
      DETECT STRING and only asserts a filesystem hit for the file that exists today.

      DELETE the `_reason` key from the integration entry. Do not preserve it. The file's own
      _test_kinds_note instructs that the _reason is deleted on any kind whose cmd is filled, and
