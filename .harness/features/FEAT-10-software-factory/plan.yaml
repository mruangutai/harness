  - id: T-04
    title: Publish an approved plan as issues on the board
    traces: [REQ-01, REQ-02, REQ-07]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02, T-03, T-11]
    status: pending
    files:
      - .claude/skills/harness/bin/factory_decompose.py
      - .claude/skills/harness/bin/test-factory-decompose.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit > /tmp/v-t04.txt 2>&1; s=$?; grep -q "^PASS test-factory-decompose.py$" /tmp/v-t04.txt && [ "$s" -eq 0 ]
    intent: |
      Add factory_decompose.py, which turns one approved plan into work items in a target
      repository and places each on the control-plane board.

      Command line: factory_decompose.py <feature-dir> --repo <owner/name> [--fleet <path>]
      [--parent <n>].
      The entry is wrapped as factory_cli.run("decompose", _main, expected=(FleetError, GhError)),
      so the C-3 exit vocabulary holds and an unexpected exception exits 2 rather than Python's
      default 1. Every refusal below goes through factory_cli.refuse, so its message is one C-3
      line on stderr naming the value the operator acts on. Nothing but the step 8 payload is ever
      written to stdout.
      Behaviour, in order:
        1. Load the fleet with factory_config.load_fleet and resolve the repository with
           repo_entry. An unlisted repository is a hard error, exit 2, naming the repository and
           the fleet file.
        2. Load <feature-dir>/plan.yaml with harness_yaml.load_plan. If approval.status is not
           exactly "approved", refuse with exit 2 naming the plan path and telling the operator to
           get it signed. Nothing is published from an unsigned plan.
        3. Call factory_gh.preflight().
        4. Load <feature-dir>/feature.yaml with harness_yaml.load_file and read its `factory`
           block if present. Its shape, WIDENED by D-14 to carry the parent and a per-edge receipt,
           is:
             factory:
               repo: <owner/name>
               parent: <the parent issue number>
               parent_origin: adopted | created
               issues: { T-01: 17, T-02: 18 }
               items: { T-01: <board item id> }
               edges:
                 parent: [T-01, T-02]
                 blocked_by: { T-04: [T-02, T-03] }
           `edges.parent` lists the task ids already attached as sub-issues of the parent.
           `edges.blocked_by` maps a task id to the list of blocker task ids whose edge has already
           been drawn FOR that task. Both are receipts written the moment the call returns, exactly
           as `issues` and `items` are, and exactly as gh-sync.py's `attached` list is — and for the
           same reason, which is stated plainly in D-14 and must not be softened here: re-POSTing an
           edge is not idempotent on the dependency half. A live probe MEASURED
           dependencies/blocked_by: a repeat POST of an edge that already exists returns HTTP 422
           with a message containing "already been taken". The sub_issues endpoint has NOT been
           measured and its behaviour on a repeat is unknown. Read-before-write is available at the
           API level for blocked_by — the GET works and returns an empty list for an issue with no
           blockers — so the gap is a ONE-FUNCTION LIBRARY GAP in gh_issues.py, which ships no read
           builder for it, and not an API gap. The receipt is nevertheless the mechanism this
           increment uses: you are recording rather than reading back, deliberately. SC-01's "the
           second run mutates nothing" rests on this ledger.
           Sort every task in the plan into exactly one of FOUR dispositions. The key is all three
           records — issues, items and edges — and never issues alone:
             - recorded in issues AND in items AND with every edge it owes already in edges — fully
               published. Skip it entirely, creating nothing and calling nothing for it.
             - recorded in issues but NOT in items — PARTIALLY published. This is the state an
               interrupted run leaves when the issue was created and the board add then failed. It
               is NOT complete and must not be skipped. Create no second issue for it: carry the
               recorded issue number forward and resume it at step 7, adding the board item and
               setting its station, then recording the item id in step 8.
             - recorded in neither issues nor items — not published. It goes through step 6, then
               step 7, then step 7b.
             - recorded in issues AND in items but owing at least one edge that `edges` does not
               record — EDGES UNWRITTEN. This is the fourth disposition and it is the structural
               consequence of drawing edges at all: an interrupted run now has a third way to stop,
               and a task sorted on issues-and-items alone would have its edges left permanently
               undrawn with nothing anywhere to redraw them. Such a task creates no issue and adds
               no board item; it goes to step 7b and nowhere else. The edges it owes are: one parent
               attachment unless its id is already in edges.parent, plus one blocked_by edge per
               entry in the task's plan `depends_on` that is not already listed for it under
               edges.blocked_by.
           Keying the skip on issues alone is what would make the partial state permanent, and that
           state has no other recovery anywhere in this increment: factory_claim reads the board in
           poll mode AND in --issue mode and refuses with exit 2 when the board holds no item for
           the issue, so an issue that never reached the board is reachable by no tool at all and
           the task disappears from the feature with no operator signal.
        5. RUN THIS STEP ONLY IF AT LEAST ONE TASK IS IN THE THIRD DISPOSITION — recorded in
           neither map — OR the factory block records no `parent`. Otherwise skip step 5 entirely
           and call nothing: ensure_labels is a remote write (see the point of no return below), so
           a run with no issue left to create and a parent already recorded must make no call at
           all, or SC-01's "the second run mutates nothing" is false and the second-publish test
           case below is red. Read that condition exactly and do not widen it to "anything left to
           do": a task in the second disposition needs no label ensured because it creates no issue,
           and a task in the EDGES-UNWRITTEN disposition needs none either, because the edge
           endpoints take issue ids and touch no label. The parent is in the condition because step
           5b writes the `feature:<FEAT>` label onto it whether it was adopted or created, and a
           first run that died before step 5 cannot have recorded anything in issues, so nothing can
           reach a later disposition with its labels un-ensured.
           Two label sets, and they are NOT the same set. Conflating them is what left
           `factory:claimed` undefined in every target repository.
           The ENSURED set — passed to factory_gh.ensure_labels once, before any issue is created —
           is every label the factory will ever put on an issue in this repository, whichever tool
           puts it there: `harness`, `feature:<FEAT>`, `chore`, `bug`, and `factory:claimed`.
           `factory:claimed` is ensured here even though this tool never applies it, because
           factory_claim.py applies it and has no create-issue call to piggyback on; whether
           `gh issue edit --add-label` rejects an undefined label was deliberately NOT probed, since
           it needs a write to a live repository and ensuring the label closes the hole whichever
           way gh behaves. GitHub definitely rejects an issue CREATE naming an undefined label, and
           a fresh repository ships `bug` but not `harness`.
           The APPLIED set, per issue, is: `harness` always; `feature:<FEAT>` where <FEAT> is the
           plan's top-level `feature` value verbatim, for example feature:FEAT-10-software-factory
           (this is D-09, and it is what puts the feature address somewhere the operator reads);
           plus `chore` when change_type is one of config, scaffolding, infra or ci, plus `bug` when
           it is bugfix, and no fourth label otherwise. The chore and bug derivation is DEC-138
           amendment 3 and is mechanical. `factory:claimed` is never applied by this tool.
        5b. THE PARENT — adopt or create, run after ensure_labels and before the first task create.
           This is DESIGN.md C-5 and it reuses gh-sync.py cmd_open's shape rather than inventing a
           second one (gh-sync.py:400-416 is the reference). If the factory block already records a
           `parent`, print that it is already recorded on stderr and do nothing else here. Otherwise:
           with --parent <n>, ADOPT that issue — record parent: <n> and parent_origin: adopted
           immediately, before anything else happens. Without --parent, CREATE one, and the title and
           body come from a source this tool does not otherwise read, so name it explicitly: READ
           <feature-dir>/BRIEF.md, take the first paragraph under its `## Problem` heading as the
           problem statement and the first paragraph under its `## Goal` heading as the goal. The
           title is "<FEAT> — <the first sentence of the goal, trimmed>"; the body is two parts
           following cmd_open's precedent — the problem statement, a blank line, then one line
           "**Goal:** <goal>". Labels `harness` and `feature:<FEAT>` and nothing else; then record
           parent and parent_origin: created immediately, by the same record-after-every-create rule.
           If the problem or the goal cannot be extracted FOR ANY REASON, do NOT invent text and do
           NOT refuse the whole publish: create the parent titled with the feature id alone and with
           an empty body, and say on stderr what could not be extracted. Read that condition as
           broadly as it is written and do not narrow it back to an absent file or a missing
           heading: BRIEF.md is a human-edited markdown file, so a heading written without its
           space, a heading differing in case, a section present but empty, and an unreadable or
           malformed file are all extraction failures and all take this path. Implement it as a
           guarded extraction whose every failure yields the empty result, not as a list of the
           shapes anticipated here. A publish must not be blocked by prose
           the operator can edit afterwards, and the parent's title is not load-bearing for any tool.
           THIS IS A READ AND ONLY A READ. BRIEF.md is never written, which is D-01 and SC-03 — the
           tool's write set is unchanged, still <feature-dir>/feature.yaml alone, and SC-20 asserts
           BRIEF.md is byte-identical after a publish.
           THE FACTORY NEVER DISCOVERS A PARENT. There is no search for a likely existing issue:
           adoption is the operator naming a number on the command line. That is D-01 — GitHub state
           is read only for that decision's three enumerated purposes, none of which is discovering
           a container, and never to decide an approval-gated artifact — and it
           is also what keeps D-12 honest, since mruangutai/harness may already carry a parent for
           this feature from the gh-sync mirror and a factory that invented its own would put a
           second container beside it.
           An ADOPTED parent is not factory-created, and the asymmetry is settled here so it is not
           decided mid-build: apply `feature:<FEAT>` to the parent either way, because D-09 says every
           issue the factory puts on this address carries it, the write is additive and idempotent,
           and it is the label REQ-01's reader looks for — but NEVER rewrite an adopted parent's title
           or body. The parent carries no `change_type` and no `traces`; those describe a task and the
           parent is not one, which is why C-4's fixed-order body rule is scoped to task issues.
        6. For each task in the third disposition — recorded in neither map — create an issue in
           the repository titled "<T-NN> <title>" with those labels. The body has a fixed order and
           no other content, so it diffs
           cleanly when a task is republished: the task's `intent` verbatim first, then one blank
           line, then one line "change_type: <value>", then one line "traces: REQ-01, REQ-07" —
           comma-separated on a single line, never a YAML list dumped into prose.
        7. Add to the board with project_item_add, and set the station field to the fleet's `ready`
           option, every TASK issue that has no recorded item id — both the ones step 6 just created
           and the ones resumed from the second disposition in step 4. A resumed task reaches this
           step carrying its already-recorded issue number, so the board add is the only thing it
           does.
           THE PARENT IS NEVER ADDED TO THE BOARD. Iterate the task list, never the issue map: a
           board-add written as "every issue with no recorded item id" would sweep up a newly created
           parent, which would then sit open in the Ready column carrying `feature:<FEAT>` and
           factory_claim would claim the container. Excluding it here forecloses that with no new
           check anywhere else, because factory_claim's read is bounded by the board (D-10) and an
           issue that is not an item is invisible to it. The cost is that the parent's sub-issue
           progress bar is read on the issue page rather than on a card, which is accepted.
           On validating the `ready` option name: this tool does NOT pre-check it against
           project_field_options, and that is a decision rather than an omission. project_field_set
           resolves the option id before editing and raises GhError naming the option when the board
           does not offer it, so a bad `ready` here fails loudly with the value in the message. T-05
           pre-checks all three names because it QUERIES on one — a query naming a non-existent
           option returns zero items and exit 0, a silent empty forever, which has no failure signal
           at all. Writing has a signal; querying does not. Adding a third copy of the same check
           here would buy nothing and cost a board read on every publish.
        7b. THE EDGE PASS — a SECOND PASS, run after every issue in this publish exists. This is
           D-14 and DESIGN.md C-5. It cannot ride the create loop in step 6: a blocked_by edge needs
           BOTH endpoints, so drawing it inside the loop would make correctness depend on the plan's
           task ORDER, which is a silent dependency on an ordering nothing guarantees. For every task
           that is not fully published — the second, third and fourth dispositions — in plan order:
             a. Resolve the task's issue id ONCE with factory_gh.internal_id(repo, <its number>) and
                reuse it for both edge types. Never call issue_view for an id: it returns the GraphQL
                node id, which is truthy and 422s at the endpoint. That is the trap T-03 documents.
                MEMOIZE every resolution in ONE dict keyed by issue number, held for the lifetime of
                the process and consulted by every internal_id lookup in this pass — a task's own id
                and a blocker's alike. Without it a task that blocks six others is resolved six
                times over, once per edge, and the pass costs O(N+E) API reads where O(N) is
                available. The dict is a pure read cache: nothing invalidates it, because an issue's
                internal id does not change within a publish.
             b. Unless the task id is already in edges.parent, call
                factory_gh.attach_sub_issue(repo, <parent number>, <this task's issue id>), then
                append the task id to edges.parent and write feature.yaml immediately.
             c. For each entry in this task's plan `depends_on` that edges.blocked_by does not
                already record for this task: look up the blocker's issue number in `issues`. IF THE
                BLOCKER HAS NO RECORDED ISSUE NUMBER YET, SKIP THAT EDGE, report it on stderr naming
                both task ids, and CONTINUE — this is not an error and must never exit non-zero. It
                is an ordinary mid-publish state, and the next run draws the edge, because every task
                in the plan is published (step 4 sorts every task, including the main-session-direct
                ones) so a blocker always has an issue once the publish completes. Otherwise resolve
                the blocker's issue id with internal_id and call
                factory_gh.blocked_by(repo, <this task's number>, <the blocker's issue id>), then
                append the blocker's task id under edges.blocked_by[<this task id>] and write
                feature.yaml immediately.
           An edge write that RAISES GhError is FATAL: let it propagate, so the wrapper exits 2 with
           the C-3 line naming the value. Do not catch it and continue. Those two cases are adjacent
           on purpose and an implementer must keep them apart — a blocker with no issue number yet is
           an intermediate state and is skipped; a call that failed at the API is an environmental
           failure and D-02 says the control plane stops rather than degrades. The ledger is what
           makes stopping cheap: the re-run draws only the edges not yet recorded.
           ONE NARROW EXCEPTION, ON THE blocked_by CALL IN (c) AND NOWHERE ELSE. The window the
           ledger cannot close is a process death between a blocked_by POST that RETURNED and the
           feature.yaml receipt write that follows it: the ledger then under-records, the re-run
           re-POSTs an edge GitHub already has, and a live probe measured that repeat as HTTP 422
           with a message containing "already been taken". Under the unnarrowed rule that is exit 2
           on every re-run, reproducibly, with hand-editing feature.yaml the operator's only recovery
           and no diagnostic pointing there. So: catch GhError around the blocked_by call ONLY, and
           when the failure carries BOTH the 422 status and the phrase "already been taken", treat
           the edge as ALREADY DRAWN — record the receipt exactly as a successful call would, report
           one line on stderr naming both task ids and saying the edge already existed, and CONTINUE.
           Discriminate on the exception's own captured output, which is why GhError carries the exit
           status, the captured stdout and the captured stderr as attributes: gh api prints the HTTP
           error body on stdout, so the check is the token 422 in the captured stdout or stderr AND
           the phrase "already been taken" in either. This is the same shape create_ref already uses
           to tell a lost race from an authentication failure. Any GhError failing either half of
           that test propagates and stays fatal.
           THE ATTACH CALL IN (b) IS NOT NARROWED AND STAYS FATAL IN EVERY CASE. Do not generalise
           the exception across both endpoints, and the reason is specific rather than caution: only
           dependencies/blocked_by was probed. On sub_issues, "already been taken" plausibly means
           THIS CHILD ALREADY HAS A DIFFERENT PARENT rather than this edge exists, because GitHub
           allows an issue exactly one parent. Recording a receipt on that response would file a
           false receipt and silently mis-report the hierarchy, which is worse than exiting 2.
           The hierarchy half of this crash window therefore REMAINS OPEN by construction:
           edges.parent is a per-edge receipt with the same gap, a kill between a successful attach
           and its receipt write wedges the re-run at exit 2, and the recovery is still hand-editing
           feature.yaml. That residual is stated rather than papered over, and closing it needs a
           probe of sub_issues that this increment does not have.
        8. After each successful issue creation, each successful board add and each successful edge
           write, write the number, item id or edge receipt back into <feature-dir>/feature.yaml's
           factory block immediately, so an interrupted run resumes instead of duplicating.
           EVERY ONE OF THOSE WRITES IS ATOMIC — temp file plus os.replace, never a truncating write
           of feature.yaml in place. A publish performs roughly 27 sequential whole-file rewrites,
           and a process death DURING one of them truncates the file: that loses every receipt at
           once rather than one, and leaves a feature.yaml that no longer parses, so the re-run
           cannot read the ledger at all and a re-publish duplicates every issue. The procedure, per
           write: splice the factory block surgically as described below to produce the complete new
           file content in memory, write that content to a temporary file created in the SAME
           DIRECTORY as feature.yaml — same directory because os.replace is only atomic within one
           filesystem — flush and fsync it, close it, then os.replace it onto feature.yaml. Remove
           the temporary file if any step before the replace raises. feature.yaml itself is never
           opened in a mode that truncates it, so every observer either sees the previous complete
           file or the next complete file and never a partial one.
           When every task is done, emit one JSON object through factory_cli.payload with the keys
           repo, feature, parent, parent_origin, issues, edges_drawn and edges_skipped, where issues
           maps each task id to its issue number, edges_drawn is the count of edges this run wrote,
           and edges_skipped is the count of blocked_by edges step 7b(c) skipped because the blocker
           had no recorded issue number. edges_skipped earns its place because nothing in the harness
           validates depends_on referential integrity — check-plan-routes.py reads the field only as
           a budgeted name (:272, :285) — so a depends_on naming a task the plan does not contain
           reaches this tool inside a SIGNED plan, and stderr is otherwise the only place the
           resulting DAG gap is named. A non-zero edges_skipped in the payload makes that gap
           machine-visible instead of scrollback-visible. It is a count only and never a refusal: the
           skip stays exit 0.
           That object is the only thing this tool writes to stdout; progress lines, skips and
           warnings all go to stderr.
      The only harness file this tool writes is <feature-dir>/feature.yaml. It must never write
      plan.yaml, BRIEF.md or any approval block: that is D-01, and reading a plan while writing
      only feature.yaml is what keeps the signed plan the source of truth.

      Write feature.yaml SURGICALLY — locate the factory block textually and rewrite only those
      lines, preserving the rest of the file byte for byte. Do not load it and dump it back. That
      same file carries gh-sync.py's github block and the operator's comments; gh-sync.py does
      surgical text rewriting for exactly this reason, and check-state.sh's INV-23 budgets comment
      lines, so a round trip that reformats the file trips a gate in a different feature and reads
      as an unrelated regression.

      POINT OF NO RETURN — state it, because C-3's exit-2 row cannot claim one rule for all tools.
      Everything through step 4 mutates nothing: an unlisted repository, an unsigned plan, a failed
      preflight and an unreadable feature.yaml all exit 2 with zero mutating calls. THE POINT OF NO
      RETURN IS ensure_labels IN STEP 5, because that is the first remote write this tool makes —
      gh label create mutates the target repository — and no refusal reached after it can claim
      zero mutating calls. The consequence is stated honestly rather than made to sound clean, and
      it is mild: every label create carries --force, so an exit 2 in the window between step 5 and
      the first create_issue leaves labels defined in the repository which are idempotent and
      harmless, and leaves no issue, no board item and no harness file written.
      Two later thresholds sit inside that mutating region and are named separately because their
      consequences differ, matching DESIGN.md C-3's factory_decompose row exactly. First, the parent
      create in step 5b: after it, exit 2 can leave A PARENT WITH NO CHILDREN — an empty container
      issue in the target repository. It is off the board by construction, so it is not claimable and
      the re-run adopts it from the recorded number rather than creating a second one. Second, the
      first successful create_issue: after it, exit 2 leaves a PARTIALLY PUBLISHED feature with some
      edges undrawn, which is also deliberately safe rather than clean — step 8 records each issue
      number, item id and edge receipt immediately, so a re-run resumes, creates nothing twice and
      draws no edge twice. The operator's recovery from every one of these thresholds is to re-run
      the same command.

      Add test-factory-decompose.py: plain python3, no pytest, one line per case, exit 1 on any
      failure. Build a temporary feature directory holding a plan.yaml and a feature.yaml, and
      monkeypatch the factory_gh helpers with recorders. Cases, at minimum: an unsigned plan
      publishes nothing and exits 2; a signed two-task plan creates two issues, adds two board
      items and sets both stations to the fleet's ready option; running the same publish a
      second time against the resulting feature.yaml — which by then records the parent, both issue
      numbers, both item ids AND every edge — creates nothing, adds nothing and DRAWS NO EDGE, with
      the recorder showing zero calls of any kind, including zero internal_id calls, since an id
      lookup on a second run is the cheapest way to leak a call into a run that must make none;
      a repository absent from the fleet exits 2 before any gh call;
      the chore label appears for a config task and not for a logic task; feature.yaml carries
      the issue number after the first creation even when the board add then raises GhError;
      a feature.yaml recording an issue number for a task but NO item id for it re-runs, creates NO
      new issue — asserted from the recorder showing zero create_issue calls — and DOES call
      project_item_add for the recorded number and set that item's station to the ready option, and
      afterwards feature.yaml carries the item id. That is the resume-after-partial case, and it is
      the only thing that consumes the partial state the previous case sets up; without it a task
      whose board add failed once is unreachable by every tool forever;
      every created issue carries both `harness` and `feature:<FEAT>` with the feature id taken
      from the plan, and NOT `factory:claimed`; ensure_labels was called BEFORE the first
      create_issue call, asserted from the recorder's call order, and its argument set CONTAINS
      `factory:claimed` even though no created issue carries it — that one case is the whole
      ensured-versus-applied distinction, and it is the only thing standing between
      factory_claim.py and an undefined label in a fresh repository; a feature.yaml carrying
      comments and a github block round-trips with those bytes unchanged after the factory block is
      written; every exit-2 path before ensure_labels leaves the recorder with zero
      mutating calls, asserted over the full call list; the issue body's four parts
      appear in the C-4 order with traces on one comma-separated line.
      Eleven cases carry the DAG and the ledger that makes it idempotent (D-14, DESIGN.md C-5), and
      each is a criterion the pre-edge draft
      could not falsify:
        - with no --parent, a parent issue is created carrying exactly the labels harness and
          feature:<FEAT>, a two-part body of the problem statement, a blank line and one **Goal:**
          line, and NO change_type or traces line; feature.yaml afterwards records parent_origin
          created.
        - with --parent <n>, no issue is created for the parent, feature.yaml records that number
          with parent_origin adopted, and the recorder shows the feature:<FEAT> label applied to it
          but NO call that edits its title or its body.
        - the parent is absent from the board: assert over the FULL project_item_add call list that
          the parent's number appears in none of them. This is the case that stops factory_claim
          claiming the container.
        - every task issue is attached to the parent exactly once, and the attach call carries the
          INTERNAL id the recorder returned for internal_id, never the issue number — script
          internal_id to return an integer distinct from every issue number so a number passed in its
          place is visibly wrong rather than coincidentally equal.
        - a task whose plan depends_on lists six blockers draws exactly six blocked_by calls, one per
          blocker, and each names the blocker's resolved id. Use T-12's shape from this very plan;
          six is the number that makes a parent-per-dependency impossible and is why the two edge
          types are separate.
        - EVERY edge call goes through the second pass: assert from the recorder's call ORDER that no
          attach_sub_issue and no blocked_by call precedes the LAST create_issue call. A tool that
          drew edges inside the create loop passes every count-based assertion above and fails this
          one, and it is the ordering C-5 Q5(ii) names.
        - a blocker with no recorded issue number is SKIPPED, not fatal: run a publish where one task
          depends on a task the plan does not contain, and assert the run exits 0, draws the other
          edges, writes a line naming both task ids to stderr, and makes no blocked_by call for the
          missing one — and assert on the parsed stdout payload that edges_skipped is exactly 1 and
          that edges_drawn counts only the edges actually written. The stderr line alone is not the
          assertion: the payload key is the machine-visible half.
        - THE FOURTH DISPOSITION, and it is the case an interrupted run depends on: a feature.yaml
          recording both issue numbers and both item ids but an EMPTY edges block re-runs, creates no
          issue and adds no board item — asserted from zero create_issue and zero project_item_add
          calls — and DOES draw every parent and blocked_by edge, after which feature.yaml records
          them; running it a third time then draws nothing at all. Without this case a run
          interrupted between the board add and the edge pass leaves those edges undrawn forever.
        - THE ALREADY-DRAWN blocked_by EDGE IS NOT FATAL, and its twin on the attach STILL IS. Two
          assertions in one case, and they must both be present or the narrowing is untested in the
          direction that matters. First: script factory_gh.blocked_by to raise a GhError whose exit
          status is non-zero and whose captured stdout and stderr carry the measured shape — the
          token 422 and the phrase "already been taken" — and assert the publish exits 0, that
          feature.yaml afterwards RECORDS that edge under edges.blocked_by exactly as a successful
          call would, that a stderr line names both task ids, and that the run continues to draw
          every later edge rather than stopping at the raise. Second, in the same case: script
          factory_gh.attach_sub_issue to raise a GhError carrying that identical shape and assert
          the publish exits 2 and that feature.yaml records NO parent receipt for that task —
          the narrowing is scoped to the dependency endpoint alone, and a build that generalised it
          across both would pass the first assertion and fail this one.
        - A GhError THAT IS NOT THE ALREADY-DRAWN SHAPE STAYS FATAL ON BOTH EDGE TYPES: script
          blocked_by to raise a GhError carrying a non-zero status and an authentication message
          with neither the 422 token nor the phrase, and assert the publish exits 2 and records no
          receipt for that edge. Without this case a build that swallowed every GhError on the
          dependency call passes the case above.
        - THE LEDGER IS NEVER OBSERVED PARTIALLY WRITTEN. Monkeypatch os.replace for the duration of
          a publish and assert, at every call: that its destination is the temporary feature
          directory's feature.yaml; that its source is a different path in the SAME directory as
          that destination, which is what makes the replace atomic rather than cross-device; and
          that the source file's full contents parse as YAML and carry the factory block, so what is
          about to be swapped in is a complete file and not a truncated one. Assert separately, from
          a monkeypatched builtins.open recording every call for that path, that feature.yaml itself
          is opened only for reading and NEVER in a truncating mode — "w", "w+", "wb" or an
          os.O_TRUNC — during the whole publish. Assert last that os.replace was called at least
          once, so a build that stopped writing receipts altogether cannot pass by vacuum. These
          together are what a plain before-and-after content check cannot see: the failure being
          excluded is a kill DURING a write, which leaves no observable end state to compare.
      One case carries SC-20: hash every file in the temporary feature directory before a publish and
      again afterwards, and assert that plan.yaml and BRIEF.md are byte-identical and that
      feature.yaml is the only file whose hash changed. Three cases assert the C-3
      contract, captured with contextlib.redirect_stdout and redirect_stderr: the unsigned-plan
      refusal writes nothing at all to stdout and one line to stderr; the happy path's stdout
      parses in a single json.loads of the whole stream, proving no per-task progress line was
      interleaved into it; and a monkeypatched create_issue raising a plain KeyError makes the
      entry point exit 2, not 1. The test must not
      spawn a subprocess and must not touch the real feature directories.

      Register test-factory-decompose.py in run-unit-tests.sh's UNIT_SCRIPTS array in this task.

  - id: T-05
    title: Claim the next board item atomically
    traces: [REQ-03]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02, T-03, T-11]
    status: pending
    files:
      - .claude/skills/harness/bin/factory_claim.py
      - .claude/skills/harness/bin/test-factory-claim.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit > /tmp/v-t05.txt 2>&1; s=$?; grep -q "^PASS test-factory-claim.py$" /tmp/v-t05.txt && [ "$s" -eq 0 ]
    intent: |
      Add factory_claim.py, the polling and claiming tool. It is how an agent takes work, and it
      is the only thing standing between two agents and the same issue.

      Command line: factory_claim.py --as <github-login> [--repo <owner/name>] [--issue <n>]
      [--fleet <path>].
      The entry is wrapped as factory_cli.run("claim", _main, expected=(FleetError, GhError)).
      This tool is where the C-3 stream split bites hardest: it prints a JSON object on success
      and a human line on exit 1, and if both landed on stdout no caller could parse either. So
      the JSON object is the ONLY thing this tool ever writes to stdout, and every other line —
      no work available, the lost-race report, any warning — goes to stderr through factory_cli.

      THE CLAIM IS A REF CREATION, NOT AN ASSIGNMENT. This is D-05 and it is the point of the
      whole task. An assignee set is ADDITIVE: two racing agents both succeed at assigning, so
      neither can conclude it won, and the honest reading of the result leaves both backing off and
      the issue marked and owned by nobody. Creating the git ref refs/heads/factory/issue-<n> is a
      create-if-absent decided by the server: measured against the live API, a create against an
      existing ref returns HTTP 422 Reference already exists and mutates nothing. Exactly one
      concurrent creator can receive a create. The label and the assignee stay, but they are
      operator-visible bookkeeping written only by the winner, and they never decide anything.

      Behaviour, in order:
        1. Load the fleet; call factory_gh.preflight(). A missing or unauthenticated gh raises
           GhError and the wrapper exits 2, never 1: exit 1 means only that the ready column was
           empty, and a failure that exits 1 would be read as no work available.
        2. Validate the fleet's three station option names against the board with
           factory_gh.project_field_options for the fleet's station_field. If any of the three is
           not an option the board offers, refuse with exit 2 naming the missing option, the field
           and the fleet file. This check is not defensive padding: measured on the live account, a
           board query naming an option that does not exist returns zero items and exit 0, so
           without it a typo in fleet.yaml is indistinguishable from an empty queue, forever, and
           the operator sees agents reporting nothing to do beside a board full of cards.
        3. Read the board with factory_gh.project_items(owner, number, query=...), where the query
           is the fleet's `ready` option name and is:open, so the filter runs on the server and the
           returned set is bounded by the ready column rather than by the size of the board. That
           is D-10, and it is also why the read cannot silently truncate: project_items raises when
           the response's totalCount exceeds the items it returned. There is no webhook path: this
           poll is the discovery mechanism, which is D-04. When --issue is given, read the board the
           same way but WITHOUT the ready-station part of the query, and keep the single item whose
           content number equals --issue; if the board holds no item for that issue, refuse with
           exit 2 naming the issue and the board, because step 6 needs that item's id and no other
           call produces one. Do not skip the board read in --issue mode.
        4. Keep candidates whose repository is listed in the fleet, further filtered to --repo when
           given, and sort them by issue number ascending.
           TAKE THE REPOSITORY FROM content.repository, NOT from the item's repository key.
           Measured on the live board, one item carries repository
           "https://github.com/mruangutai/harness" and content.repository "mruangutai/harness",
           and the fleet lists repositories in owner/name form. Comparing the URL against the fleet
           matches nothing, so every candidate would be discarded and the tool would report no work
           available forever — the same silent-empty failure as an unvalidated station option, in
           the one code path that decides whether the factory does anything at all. If
           content.repository is absent on an item, normalise the URL by taking its last two path
           segments rather than dropping the item silently, and say so on stderr.
           If none remains, call
           factory_cli.nothing_to_do("claim", "no work available"), which writes that line to
           STDERR and exits 1. It is not an error and it is not a payload, so it belongs on neither
           stdout nor a non-1 exit.
        5. LOOP over the sorted candidates. Never stop at the first one that is unavailable — that
           single behaviour is the difference between a queue and a wedge, because one item nobody
           can claim would otherwise block every agent forever, and effort ticket 195's stuck
           protocol, which would release it, is deferred out of this increment. For each candidate,
           in order:
             a. Re-read the issue with issue_view for the fields number, title, state, assignees
                and labels. Then, IN THIS ORDER:
                  - Self-ownership first, and only in --issue mode: if the issue carries
                    `factory:claimed` AND its assignees include --as, this agent already owns it.
                    Re-emit the step 7 payload and exit 0. This test must come BEFORE the skip
                    below, or it can never be reached — an issue this agent owns satisfies every
                    skip condition — and it is what makes re-running after an interrupted step 6
                    safe rather than a permanent exit 3 against the agent's own claim. In poll mode
                    an owned issue is somebody's work in progress and is skipped like any other.
                  - Otherwise, if its state is not OPEN, or it carries the label
                    `factory:claimed`, or its assignees list is non-empty, SKIP to the next
                    candidate, reporting the skip and the reason on stderr. Any non-empty assignees
                    list means somebody else's, whatever logins it holds — outside the
                    self-ownership test above, this tool never compares a login against that list,
                    because the comparison is precisely the ambiguity the ref removes. Nothing is
                    mutated on a skip. This is a cheap pre-filter, not the race decider.
             a-bis. THE BLOCKER GATE. This is D-01 as amended on 2026-08-08 and DESIGN.md C-2's
                amendment, and it is the one check in this loop that decides WHAT THE FACTORY TAKES
                rather than merely how fast it reaches a candidate it would have taken anyway. A
                candidate whose plan dependencies are unfinished is not claimed. Its placement is
                exact and is ruled, not free: it sits AFTER the step 5a self-ownership branch above
                and BEFORE 5b's create_ref. After self-ownership, because re-entry under --issue on
                an issue this agent already owns repairs a claim that already exists and is NEVER
                gated - gating it would delete the only documented repair for an interrupted step 6.
                Before create_ref, because a blocked candidate must cost no race and no mutation.
                Resolve the candidate, using the same harness_yaml helper the rest of the harness
                uses, and cache each file so a poll reads each one once:
                  - The candidate's feature comes from its `feature:` label with the prefix stripped
                    - the same value step 7 reports - and its task id is the T-NN in the issue title.
                  - The DAG comes from .harness/features/<FEAT>/plan.yaml, that task's depends_on.
                    plan.yaml is the AUTHORITY for the graph and is read READ-ONLY; this tool never
                    writes it. Never read the rendered blocked_by edge from GitHub for this or any
                    other purpose - it is hand-editable, so deriving control flow from it would put
                    a remote object in charge of the signed DAG.
                  - Each blocker T-NN becomes an issue number through that same feature's
                    feature.yaml factory.issues map, and the blocker's finished-ness is that issue's
                    state read with factory_gh.issue_view. Closed means finished. This is the ONLY
                    thing GitHub contributes to the gate.
                Then, in this order:
                  - If the candidate has no resolvable feature - a feature: null issue from the
                    existing gh-sync.py mirror, D-09's tolerant read - it has no plan task and no
                    depends_on, so IT IS NOT GATED AT ALL. Fall through to 5b and claim it exactly
                    as before. State this explicitly rather than letting it fall out of the code by
                    accident: making an unresolvable feature an error would silently reverse D-09
                    and drop mirror issues off the same board. This ungated path is scoped to an
                    issue carrying NO feature: label and to nothing else. A candidate whose
                    feature: label DOES resolve but whose title yields no matching plan task is
                    edge (i) - it counts as BLOCKED, not clear: skip it, mutate nothing, and report
                    it on stderr with edge (i)'s reason. It is a factory-created issue whose task
                    identity has been lost, reachable by a hand-edited title or by amending a plan
                    after publish, and leaving it ungated would let a hand-editable remote string
                    decide whether the DAG applies at all - the class of object D-01 refuses
                    everywhere else.
                  - If the task's depends_on is empty, the candidate is clear. Fall through to 5b.
                  - If ANY blocker issue is still open, SKIP to the next candidate, mutating nothing,
                    and report on stderr a reason DISTINCT from every other skip reason in this loop
                    - name the candidate issue, the blocking T-NN and its issue number. The
                    distinctness is load-bearing and is not a style point: once the unblocked tasks
                    are claimed the ready column holds only blocked items, so a poll exits 1 on
                    D-13's protected `no claimable work` line in HEALTHY operation, and the per-skip
                    reason is the only thing left that tells the operator which kind of stuck it is.
                  - If ANY depends_on entry cannot be resolved to an issue number - a dangling entry
                    naming a task the plan does not contain, which reaches a SIGNED plan because
                    nothing validates depends_on referential integrity - the candidate counts as
                    BLOCKED, NOT CLEAR. Skip it, mutate nothing, and report it on stderr on EVERY
                    poll with its own distinct reason. Handing work out on an unresolvable blocker is
                    the failure this gate exists to stop, and the board renders no block marker for
                    such an edge (DESIGN.md C-5), so stderr is the operator's only view of it.
                    Do not refuse the whole run at exit 2 here: one bad entry would wedge the entire
                    queue, which is exactly what REQ-03 forbids.
                In POLL mode every case above is a skip and the run continues at the next candidate.
                With --issue naming a blocked issue as a FRESH claim - that is, one this agent does
                not already own, so the 5a self-ownership branch did not fire - the tool REFUSES with
                EXIT 2, naming the issue, the blocking T-NN and its issue number, having mutated
                nothing. Exit 2 is the existing DESIGN.md C-3 row for a refused run with a guard
                tripped; do NOT invent a new exit status for this. It must stay distinguishable from
                exit 3, which is reserved for a race this agent actually entered by calling
                create_ref, and no create_ref is reached on this path.
             b. Resolve the base commit with factory_gh.default_branch_sha for the repository's
                default_branch, then call
                factory_gh.create_ref(repo, "refs/heads/factory/issue-<n>", sha).
                THE RETURN VALUE OF THAT ONE CALL DECIDES OWNERSHIP.
                False means the ref already existed — either another agent holds the claim or an
                older branch survives. In poll mode, SKIP to the next candidate AND REPORT THAT SKIP
                ON STDERR ON EVERY POLL, with a reason DISTINCT from every other skip reason in this
                loop, naming the candidate issue number and the fact that the ref
                refs/heads/factory/issue-<n> already exists. This is DESIGN.md C-2's contract and it
                is not cosmetic. Once the blocker gate landed, exit 1 with no claimable work became
                the HEALTHY steady state of a queue whose remaining items are correctly waiting, so
                this line is the ONLY thing that tells the operator the queue is instead silting up
                with claim refs left by agents that died before their bookkeeping - D-13's accepted
                residual, whose acceptance is conditional on that signal existing. This is POLL MODE
                ONLY. With --issue, this
                is a lost race: call factory_cli.lost_race naming the issue number and exit 3,
                having mutated nothing. The agent's own re-entry was already handled in step 5a,
                which is why there is no ownership test here. Exit 3 is reserved for a race this
                agent actually entered and must stay distinguishable from exit 1, no work available.
                True means this agent won. Leave the loop and continue at step 6.
             c. If every candidate is exhausted without a win, call
                factory_cli.nothing_to_do("claim", "no claimable work") and exit 1, having mutated
                nothing. The queue is never blocked by a stale item; it is only shorter.
        6. Winner only. In this order: add the label `factory:claimed`, assign --as, then set the
           item's station field to the fleet's `building` option. None of these three decides
           ownership — the ref already did — so a failure here is a bookkeeping failure over a
           claim this agent holds, and it exits 2 rather than 3.
        7. Emit one JSON object through factory_cli.payload, so it is the sole content of stdout,
           with the keys repo, issue, title, branch and feature, where branch is
           "factory/issue-<number>" and feature is the value of the issue's `feature:` label with
           the "feature:" prefix stripped. An issue carrying no `feature:` label yields
           feature: null and is claimed normally — issues created by the existing gh-sync.py
           mirror carry `harness` and no feature label, they can sit on the same board, and a
           tolerant read is what keeps them claimable instead of failing them through the trap.
           An issue carrying more than one `feature:` label takes the first in sorted order and
           reports the others on stderr as a warning, without failing.
      This tool writes to nothing but GitHub, and it creates no branch locally: the ref it creates
      is a remote ref, and T-06 is what turns it into a checkout.

      POINT OF NO RETURN — the whole candidate scan is mutation-free, including every refused
      create_ref, so a losing agent NEVER mutates anything and exit 3 keeps the no-mutation
      guarantee C-3 states. The point of no return is the create_ref that returns True. After it,
      a failure in step 6 exits 2 with the claim held and the station possibly still ready; the
      recorded recovery is to re-run with --issue <n>, which the same agent completes idempotently,
      or for the operator to release the claim with
      gh api -X DELETE repos/<owner/name>/git/refs/heads/factory/issue-<n>. An abandoned claim
      costs one skipped candidate on every future poll, never a blocked queue.

      Add test-factory-claim.py: plain python3, no pytest, one line per case, exit 1 on any
      failure, monkeypatching the factory_gh helpers with a scripted recorder. Cases, at minimum:
      an empty ready column exits 1; an item in a repository absent from the fleet is not a
      candidate; every board item fixture in this file carries the REAL measured shape — a
      repository key holding "https://github.com/owner/name" AND a content mapping holding
      repository "owner/name" and number — and one case asserts that an item whose owner/name IS
      in the fleet is selected despite its repository key being a URL, which is the case a fixture
      authored from the implementer's imagination would silently invert into a permanently empty
      queue; the lowest issue number wins among three candidates that are all claimable; a
      station option name missing from the recorder's field options exits 2 naming the option,
      BEFORE any board read; the happy path sets the station to the building option exactly once
      and prints JSON whose branch is factory/issue-<n>; the happy path's feature key equals the
      value of the issue's feature: label with the prefix stripped, and an issue with only a
      `harness` label claims normally with feature null rather than raising; project_items was
      called with a query naming the ready option, asserted from the recorder, not with no query.
      Five cases carry REQ-03 and each of them is a criterion nothing in the previous draft could
      falsify:
        - create_ref returning True on the first candidate produces a payload and exit 0, and the
          label, the assign and the field set all happen AFTER the create_ref call, asserted from
          the recorder's call ORDER. Ownership before bookkeeping, or the bookkeeping is a lie.
        - EXHAUSTION, run once per route because SC-13 clause (b) binds every way a candidate can
          be unclaimable, not only the refused create. Route one: create_ref returns False for
          every one of three candidates. Route two: all three are rejected by the step 5a
          pre-filter instead — one closed, one already carrying factory:claimed, one with a
          non-empty assignees list — so no create_ref is attempted at all. Both routes exit 1 with
          a payload-free stdout and ZERO mutating calls in the recorder. The losing agent must be
          indistinguishable from an idle one in its effect on the world — but NOT in what it says.
          In BOTH routes capture stderr with contextlib.redirect_stderr, the same way the C-3
          stream cases below do, and assert it carries the words no claimable work and NOT the
          words no work available. Both that line and the empty-column line exit 1, so this one
          string is the only thing that tells the operator the ready column held candidates and
          every one of them was stuck, rather than that the column was empty. Without this
          assertion nothing in the plan can distinguish them, and a queue full of permanently
          unclaimable items reports itself as an idle factory.
          ROUTE ONE CARRIES ONE FURTHER ASSERTION, and it is the one that keeps D-13's residual
          visible: the captured stderr names EACH of the three candidate issue numbers and, for
          each, that its claim ref already exists, in a form distinct from the already-marked and
          already-assigned skip reasons route two produces. Assert route one's stderr and route
          two's stderr are NOT equal. Both routes exit 1 on the same no claimable work line, so
          without the per-candidate reason a queue silting up with stale claim refs and a queue
          of legitimately blocked work differ only by an absence, and an operator cannot read an
          absence.
        - a ready column whose LOWEST-numbered candidate is unclaimable — closed, already labelled,
          already assigned, or its ref create refused — still claims the next one and exits 0. Run
          this case once per reason, four times. This is the wedge, and a tool that exits non-zero
          here is the defect that survived three reviews. SC-13 clause (a) now carries a FIFTH
          reason, blocked by an unfinished blocker; its case lives with the blocker-gate cases below
          because it needs a plan fixture the other four do not, and it asserts identity rather than
          exit status alone.
        - with --issue <n>, create_ref returning False on an issue assigned to a DIFFERENT login
          exits 3 with zero mutating calls; with --issue on an issue assigned to --as and carrying
          factory:claimed, the tool exits 0 and re-emits the payload WITHOUT calling create_ref at
          all, asserted from the recorder — that is the step 5a self-ownership branch, and if it
          were placed after the skip test instead it would be unreachable; the same issue reached
          in POLL mode is skipped, not re-emitted.
        - a create_ref that RAISES GhError rather than returning False exits 2 and never 3, and the
          loop stops rather than skipping — an authentication failure must not be read as a lost
          race and must not silently walk the whole queue.
      SEVEN CASES COVER THE BLOCKER GATE, and the first two are written so that a tool which ignores
      blockers entirely FAILS them. That is the bar: a case asserting only that some claim happened
      would pass against the very tool the gate exists to catch, because candidates are sorted by
      issue number and an unblocked task would usually be reached first anyway. Build one fixture
      feature for these cases - a temporary plan.yaml and feature.yaml written into a temporary
      directory, never this repository's own - in which the LOWEST-NUMBERED ready candidate is the
      BLOCKED one and a higher-numbered candidate is clear. The fixture's plan.yaml carries the
      depends_on lists and its feature.yaml carries the T-NN to issue-number map, so one candidate
      may carry SEVERAL blockers resolving to several distinct issue numbers; the scripted recorder
      answers issue_view PER ISSUE NUMBER, so each blocker's open or closed state is set
      independently. This is SC-22.
        - SKIP AND CONTINUE. Ready column holds the blocked lowest-numbered candidate plus at least
          one clear higher-numbered candidate. The tool exits 0 with a payload, and the assertion is
          on IDENTITY, not on the exit status: create_ref was called EXACTLY ONCE and its issue
          number is the CLEAR candidate's, never the blocked one's, asserted from the recorder's
          call list. A tool that ignores blockers claims the blocked issue here and fails this case.
          The blocked candidate's skip reason appears on stderr and differs from the already-marked
          and already-assigned skip reasons.
        - EVERY CANDIDATE BLOCKED. Every candidate in the ready column has an open blocker. The tool
          exits 1 with ZERO mutating calls in the recorder - no create_ref, no label, no assign, no
          field set - and stderr carries the words no claimable work and NOT the words no work
          available. A tool that ignores blockers exits 0 here with a payload and fails this case.
        - ALL BLOCKERS CLOSED. The same fixture with every blocker issue closed: the previously
          blocked lowest-numbered candidate IS now claimed, asserted as create_ref called with that
          issue number. This is what stops the gate being satisfied by a tool that refuses
          everything.
        - MIXED BLOCKER SET, and this case is the only one that falsifies a PARTIALLY correct tool.
          Give the blocked lowest-numbered candidate a depends_on with THREE entries, each resolving
          through feature.yaml's factory.issues map to a DIFFERENT issue number: the first CLOSED,
          the middle CLOSED, the last OPEN. The scripted issue_view recorder answers per ISSUE
          NUMBER, which is what lets one candidate carry several blockers in different states.
          Assert the candidate is SKIPPED - create_ref called exactly once and with the clear
          higher-numbered candidate's issue number, never this one - and that its stderr reason
          names the LAST blocker's T-NN and issue number, the one that is actually open. Then, as
          the ALL BLOCKERS CLOSED case does, take THE SAME FIXTURE and close only that last blocker,
          and assert the candidate IS now claimed, asserted as create_ref called with its issue
          number. WHY THIS CASE EXISTS, so nobody drops it as a duplicate: every other case gives
          each candidate blockers that are all open or all closed, so a tool that checks only
          depends_on[0] passes all of them, and so does the mirror error that calls a candidate
          blocked only when EVERY blocker is open. T-12 in this very plan declares six blockers, so
          a depends_on[0] tool hands T-12 out the moment T-02 closes with five still open - the
          board renders the block marker and the factory hands the work out anyway, which is the
          exact failure the gate was ruled in to stop.
        - UNRESOLVABLE BLOCKER. A candidate whose depends_on names a T-NN with no entry in
          feature.yaml's factory.issues map is SKIPPED, not claimed, with its own distinct stderr
          reason - DESIGN.md C-2 edge (i), blocked and not clear.
        - FEATURE NULL IS UNGATED. An issue carrying only a `harness` label, with no feature: label,
          is claimed normally with feature null even though no plan or issue map can be resolved for
          it, and the recorder shows no plan file was consulted for it. This is D-09's tolerant read
          and the case that catches an implementation which turns unresolvable into blocked.
        - --ISSUE ON A BLOCKED ISSUE. With --issue naming a blocked issue this agent does NOT own,
          the tool exits 2 - never 3 and never 0 - with zero mutating calls and no create_ref call at
          all, and its stderr names the blocking T-NN. With --issue naming a blocked issue this agent
          DOES own - factory:claimed plus assignees including --as - the tool exits 0 and re-emits
          the payload, proving the gate sits after the self-ownership branch and never breaks the
          documented repair for an interrupted step 6.

      Three cases assert
      the C-3 contract, captured in-process with contextlib.redirect_stdout and redirect_stderr:
      on the empty-column path stdout is EMPTY and the words no work available appear on stderr,
      with exit 1; on the happy path stdout parses as JSON in a single json.loads of the whole
      stream, proving no diagnostic was interleaved into it, and stderr may hold anything; and a
      monkeypatched preflight raising GhError exits 2, not 1, with stdout empty and one stderr
      line naming a concrete value. The test must not spawn a subprocess.

      Register test-factory-claim.py in run-unit-tests.sh's UNIT_SCRIPTS array in this task.

  - id: T-06
    title: Prepare a workspace checkout for a claimed issue
    traces: [REQ-04]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02, T-11]
    status: pending
    files:
      - .claude/skills/harness/bin/factory_workspace.py
      - .claude/skills/harness/bin/test-factory-workspace.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit > /tmp/v-t06.txt 2>&1; s=$?; grep -q "^PASS test-factory-workspace.py$" /tmp/v-t06.txt && [ "$s" -eq 0 ]
    intent: |
      Add factory_workspace.py, which gives an agent a ready checkout of a repository the harness
      does not live in. The harness is not installed into that repository in this increment; the
      tool operates it from here over git.

      Command line: factory_workspace.py --repo <owner/name> --issue <n> [--fleet <path>].
      The entry is wrapped as factory_cli.run("workspace", _main, expected=(FleetError,)), so the
      C-3 exit vocabulary holds and an unexpected exception exits 2 rather than Python's default
      1. git's own stdout and stderr are never forwarded to this process's stdout: run_git
      captures them, and anything worth telling the operator is re-emitted on stderr.
      Behaviour, in order:
        1. Load the fleet, resolve the repository entry, and read default_branch from it. An
           unlisted repository refuses with exit 2, naming the repository and the fleet file,
           before any git call.
        2. The checkout path is factory_config.workspace_path(fleet, repo). Do not re-derive it
           here — one rule, in one module, or the two tools that need it end up in two directories.
        3. If that path has no .git directory, clone https://github.com/<owner/name>.git into it.
           Otherwise run a fetch and reset the local default branch onto origin's, so a stale
           checkout is refreshed rather than reused blindly.
        4. Check out branch factory/issue-<n>, and the ORDER of the two cases is a prohibition, not
           a preference. factory_claim.py creates that branch REMOTELY as the claim itself (D-05),
           so after a fetch it normally already exists as origin/factory/issue-<n>. When it does,
           check it out tracking that remote ref, and NEVER create a same-named local branch from
           any other base. A local branch cut from origin/<default_branch> beside an existing
           remote one of the same name diverges silently here and surfaces as a rejected
           non-fast-forward push in T-07 — the worst possible place to discover it, after the work
           is done. Only when origin carries no such ref may the branch be created off
           origin/<default_branch>; that is the path for a checkout prepared without a claim.
           If the branch already exists locally and tracks the remote ref, check it out as is.
        5. Emit one JSON object through factory_cli.payload with the keys path, the absolute
           checkout path, and branch. That object is the only thing this tool writes to stdout,
           so a caller can parse it rather than splitting two bare lines.
      The process must never leave the checkout on the default branch: the last git command it
      runs is the checkout of factory/issue-<n>, and it exits non-zero if that command fails.

      POINT OF NO RETURN — this tool mutates NOTHING on GitHub, ever; every mutation is local, under
      workspace_root, and every path is disposable. The point of no return is step 3's first write
      into the workspace — the clone on a fresh path, or, on an existing checkout, the
      fetch-and-reset that step 3 performs instead. Exit 2 at any point may leave a checkout that is
      not on the issue branch, and the recovery is to re-run the same command, which is why step 3
      refreshes a stale checkout rather than trusting it.
      Route every git invocation through a module-level run_git(args, cwd) that shells out to
      os.environ.get("FACTORY_GIT", "git"), so the test can substitute a recorder. Importing the
      module must have no side effects.

      Add test-factory-workspace.py: plain python3, no pytest, one line per case, exit 1 on any
      failure, monkeypatching run_git with a recorder and using a tempfile.TemporaryDirectory as
      workspace_root. Cases, at minimum: a missing checkout produces a clone followed by the
      branch checkout, in that order; an existing checkout produces a fetch and no clone; the
      final recorded git command is always the checkout of factory/issue-<n>; when the recorder
      reports that origin carries factory/issue-<n>, the recorded commands check it out tracking
      origin and NO recorded command names origin/<default_branch> as the branch's start point —
      this is the case that would otherwise send divergent work into T-07's push; when the recorder
      reports origin carries no such ref, the branch IS created off origin/<default_branch>; an
      existing local branch is checked out rather than recreated; a repository absent from the
      fleet exits 2 and
      the recorder shows zero git calls; a failing git command propagates a non-zero exit. Three
      cases assert the C-3 contract, captured with contextlib.redirect_stdout and redirect_stderr:
      the happy path's stdout parses as JSON in a single json.loads of the whole stream, so no git
      chatter reached it; the unlisted-repository refusal writes nothing to stdout and one line
      naming the repository to stderr, with exit 2; and a run_git recorder raising a plain
      RuntimeError makes the entry point exit 2 and NOT 1, which is the exit the operator would
      otherwise read as nothing to do. The test must not spawn a subprocess and must not touch any
      real repository.

      Register test-factory-workspace.py in run-unit-tests.sh's UNIT_SCRIPTS array in this task.

  - id: T-07
    title: Land finished work as a pull request
    traces: [REQ-05]
    change_type: feature
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02, T-03, T-06, T-11]
    status: pending
    files:
      - .claude/skills/harness/bin/factory_land.py
      - .claude/skills/harness/bin/test-factory-land.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit > /tmp/v-t07.txt 2>&1; s=$?; grep -q "^PASS test-factory-land.py$" /tmp/v-t07.txt && [ "$s" -eq 0 ]
    intent: |
      Add factory_land.py, the last step of the journey. It opens a pull request and stops. The
      operator merges; the factory never does, in this increment.

      Command line: factory_land.py --repo <owner/name> --issue <n> [--fleet <path>].
      The entry is wrapped as factory_cli.run("land", _main, expected=(FleetError, GhError)), so
      the C-3 exit vocabulary holds and an unexpected exception exits 2 rather than Python's
      default 1. git's and gh's own output is captured, never forwarded to stdout.
      Behaviour, in order:
        1. Load the fleet, resolve the repository entry and read default_branch. An unlisted
           repository refuses with exit 2, naming the repository and the fleet file.
        2. Compute branch = factory/issue-<n>. If branch equals default_branch, refuse with exit 2
           and a message naming that branch and saying the factory does not push default
           branches. This guard must be the first thing checked after the fleet loads.
        3. Push the branch from the workspace checkout at factory_config.workspace_path(fleet,
           repo) — the same one function T-06 uses, never a second derivation of the path — using
           the same FACTORY_GIT seam factory_workspace.py uses:
           git push --set-upstream origin <branch>. Never push any other refspec.
        4. Call factory_gh.preflight(), then create the pull request with gh pr create, base
           <default_branch>, head <branch>, title taken from the issue's title, body containing
           the line "closes #<n>". If a pull request is already open for this head, that is NOT a
           failure: report the existing URL on stderr, carry it as the payload's url, and continue
           to step 5. Without this the retry path after any step-5 failure exits 2 forever, and the
           tool becomes single-shot at the one moment the operator most wants to re-run it.
        5. Set the issue's board item station field to the fleet's `review` option.
        6. Emit one JSON object through factory_cli.payload with the keys repo, issue, branch and
           url, the pull request URL. That object is the only thing this tool writes to stdout.
      The module must contain no call to gh pr merge, no call to gh api with a merge endpoint,
      and no git push whose refspec is the default branch.

      POINT OF NO RETURN — the fleet load and the default-branch guard in steps 1 and 2 exit 2 with
      zero calls of any kind. The point of no return is the successful push in step 3. After it,
      exit 2 leaves the branch pushed with no pull request, or a pull request with the station not
      yet moved; every step from 3 onward is idempotent on a re-run — the push is a no-op, step 4
      adopts an existing pull request, and the field set is a write of the same value — so the
      recovery is to re-run the same command.

      Add test-factory-land.py: plain python3, no pytest, one line per case, exit 1 on any
      failure, monkeypatching run_git and the factory_gh helpers with recorders. Cases, at
      minimum: the happy path pushes exactly one branch, creates exactly one pull request with
      base equal to the fleet's default_branch and a body containing closes #<n>, and sets the
      station to the review option; the push runs against the path
      factory_config.workspace_path returns for that repository, asserted from the recorder's cwd;
      a pr create that fails because a pull request is already open for the head still sets the
      station and exits 0 with that url in the payload; an issue number whose branch would equal
      the default branch exits 2 with zero recorded calls; a repository absent from the fleet exits
      2 with zero recorded calls; the recorded git argument lists contain no push of the default
      branch; the
      recorded gh argument lists contain no merge subcommand. The last two cases assert over the
      full recorded argument lists, not over a single call. Three cases assert the C-3 contract,
      captured with contextlib.redirect_stdout and redirect_stderr: the happy path's stdout parses
      as JSON in a single json.loads of the whole stream; the default-branch guard writes nothing
      to stdout and one stderr line naming the branch, with exit 2; and a monkeypatched pr-create
      raising a plain ValueError makes the entry point exit 2, not 1. The test must not spawn a
      subprocess.

      Register test-factory-land.py in run-unit-tests.sh's UNIT_SCRIPTS array in this task.

