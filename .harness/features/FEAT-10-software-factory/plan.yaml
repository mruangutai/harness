      Add factory_gh.py, the single place every factory tool talks to GitHub through. It exists so
      that the tools are testable offline and so that failure behaviour is decided once.

      factory_gh.py must expose:
        - GH = os.environ.get("FACTORY_GH", "gh") — the injectable binary, resolved at call time
          so a test can set the environment variable after import.
