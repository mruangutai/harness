  - id: T-09
    title: Record the bounded read-back as a decision
    traces: [REQ-07]
    change_type: docs
    execution_mode: team
    execution_agent: harness-documentor
    depends_on: []
    status: pending
    files:
      - docs/harness/DECISIONS.md
      - docs/harness/DECISIONS-INDEX.md
    verify: |
      grep -q "^## DEC-186 " docs/harness/DECISIONS.md && grep -q "^- DEC-186 " docs/harness/DECISIONS-INDEX.md && python3 .claude/skills/harness/bin/gen-decisions-index.py --stdout > /tmp/v-t09.txt 2>&1 && diff /tmp/v-t09.txt docs/harness/DECISIONS-INDEX.md && bash .claude/skills/harness/bin/check-docs.sh
    intent: |
      Append DEC-186 to docs/harness/DECISIONS.md, following the file's existing entry shape
      (a `## DEC-186 — <title>` heading, the context, the decision, the reasoning, and the
      rejected alternatives). DEC-185 is currently the last entry.

      What it must record:
        - The decision: GitHub Issues and one Projects v2 board are the factory's INTERFACE and
          control plane; the approval-gated plan.yaml remains the source of truth for what the
          work is. Factory tools may read GitHub state back for exactly THREE purposes — learning
          whether an item is claimed, learning or setting which station it is at, and learning
          whether a BLOCKER ISSUE IS FINISHED — and may
          never write a read-back value into BRIEF.md, plan.yaml or any approval block. The only
          harness file a factory tool writes is a feature's own feature.yaml factory block.
        - THE THIRD PURPOSE, and why it is a ruling rather than a detail. DEC-138 is the write-only
          baseline being amended here, and the amendment is exactly one item wide. factory_claim
          MUST NOT claim an issue whose plan dependencies are unfinished, so blocker completion has
          to be readable. It is not a claim and not a station — it is a gate on candidacy applied
          before ownership, bookkeeping or the station field are engaged at all — so it did not fit
          the original two-purpose bound and the bound was widened deliberately. The operator ruled
          it in at the plan review of 2026-08-08 and rejected deferring enforcement, on the ground
          that a board which renders a block marker and then hands the work out anyway is worse than
          no marker, because the operator reads the board and believes ordering holds. What is read,
          and from where: the DAG authority stays the signed plan.yaml's depends_on, resolution runs
          plan.yaml depends_on to feature.yaml's issue map to that blocker issue's open or closed
          state, and GitHub contributes the last hop only. What is NEVER read is the rendered
          blocked_by edge on GitHub — it is hand-editable, so deriving control flow from it would
          put a remote object in charge of the signed DAG, which is the inversion DEC-138 exists to
          prevent. Record the cost plainly rather than leaving it implicit: enforcement adds a
          blocker-state read PER BLOCKER per candidate and not one per candidate, bounded by the
          ready column rather than by the board,
          because the board read is already a server-side query on the ready station option — on
          board 3 that query returned 1 item against 150 on the board. Record the two ruled edges
          too: a depends_on entry that cannot be resolved to an issue counts as blocked rather than
          clear and is reported on stderr, and an issue the factory cannot resolve to a plan task at
          all — a gh-sync.py mirror issue with no feature label — is not gated and stays claimable.
        - Why it is an amendment and not a contradiction: DEC-138 makes the mirror one-way and
          outbound precisely so that a wiki-editable surface cannot feed an approval-gated
          artifact. Effort ticket #184 found that treating issues as truth after approval
          contradicts DEC-138, DEC-182 and DEC-168; effort ticket #182 found that a factory needs
          some read-back to exist at all. Bounding the read-back to those three purposes and to
          nothing else keeps DEC-138's actual guarantee intact while letting the control plane
          work: nothing read back is ever written into an approval-gated artifact.
        - The contrast in failure behaviour: gh-sync.py prints SKIP and exits 0 on any
          environmental failure because a mirror must never gate a flow; the factory control-plane
          tools exit non-zero instead, because a control plane that skips leaves the board
          asserting a state that is not true.
        - The claim mechanism, because it is the part a future reader will most want the reason
          for: ownership is taken by creating the git ref refs/heads/factory/issue-N in the target
          repository, a create-if-absent the server decides, and the factory:claimed label and the
          assignee are operator-visible bookkeeping the winner writes afterwards. The rejected
          alternative is assignment as the claim, rejected because an assignee set is additive:
          two racing agents both succeed, neither can conclude it won, and the issue is left marked
          and owned by nobody. Record the residual risk plainly — that concurrent ref creates
          serialise is inferred from the endpoint being create-only, not measured, and no success
          criterion exercises the live concurrent case before ship — the operator accepted that on
          2026-08-08, so the first real dispatch is the live verification.
        - Two known duplications this increment records rather than fixes, so a later reader finds
          them named instead of rediscovering them. First, gh-sync.py and factory_decompose.py are
          two independent issue writers keeping two T-NN-to-issue maps in one file, feature.yaml's
          github and factory blocks; mruangutai/harness is both a candidate fleet member and
          harness.json's github.repo, so running both there yields two issues per task, and INV-24
          detects collisions only within the factory ledger. Second, the publish idempotence key is
          feature.yaml, which is LOCAL state, in a feature whose non-negotiable constraint is that
          GitHub is the single source of truth — a lost or reverted feature.yaml republishes
          duplicates. Both are judged non-blocking for increment 1 and both are named here as work
          a later increment owns. This is D-12.
        - The rejected alternative: issues as the post-approval source of truth, rejected because
          it reopens signed choices through a surface with no signature.
      Reference DEC-138, DEC-168, DEC-179 and DEC-182 in the entry's refs so the index rows link
      them.

      Then regenerate the index with `python3 .claude/skills/harness/bin/gen-decisions-index.py`
      and write the hand-written right-hand summary for the new row.

      On stale markers: DEC-186 adds a bounded exception to DEC-138 without falsifying any of its
      wording — the mirror stays one-way and outbound, and the new read-back neither writes an
      approval-gated artifact nor makes any DEC-138 sentence untrue. So write no
      `<!-- stale: ... -->` marker. If, while writing, you find a DEC-138 sentence that DEC-186
      does make untrue, quote that sentence in a marker inside the DEC-186 entry itself and say
      so in your digest; do not create a separate entry for markers.

  - id: T-10
    title: Widen the integration test kind to detect the state-check test
    traces: [REQ-07]
    change_type: config
    execution_mode: team
    execution_agent: harness-dev-ops
    depends_on: []
    status: pending
    files:
      - .harness/harness.json
    verify: |
      python3 -c "import json,glob; k=json.load(open('.harness/harness.json'))['test_kinds']['integration']; pats=k['detect'].split('|'); assert k['cmd']; assert '_reason' not in k, 'stale _reason left beside a filled cmd'; assert '.claude/skills/harness/bin/test-factory-integration.py' in pats, pats; hits=[f for p in pats for f in glob.glob(p, recursive=True)]; assert '.claude/skills/harness/bin/test-check-state.py' in hits, hits; print('integration detects', len(hits), 'file(s)')"
    intent: |
      In .harness/harness.json, change the `detect` value of test_kinds.integration from
      "tests/integration/**" to
      "tests/integration/**|.claude/skills/harness/bin/test-check-state.py|.claude/skills/harness/bin/test-factory-integration.py".

      Why this is load-bearing and not cosmetic: the qa gate resolves each required kind by two
      signals, and one of its four states is misconfigured — "cmd is null, or no test files
      matched" — which returns BLOCKED rather than a pass. The integration kind has a real runner
      (run-unit-tests.sh --kind integration, which does execute test-check-state.py because that
      file is listed in INTEGRATION_SCRIPTS), but its detect glob tests/integration/** matches
