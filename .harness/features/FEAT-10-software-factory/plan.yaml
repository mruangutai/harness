decisions:
  - id: D-01
    choice: AMENDED at the plan review of 2026-08-08, and the amendment is the third item in this sentence. Issues and the board are the interface, the signed plan.yaml stays the truth, and factory tools may read GitHub state back for exactly THREE purposes - learning whether an item is claimed, learning or setting which station it is at, and learning whether a BLOCKER ISSUE IS FINISHED - and never to write a read-back value into an approval-gated artifact. The third purpose is new and it is not optional at the tool - factory_claim MUST NOT claim an issue whose depends_on blockers are unfinished, so a candidate whose blockers are still open is skipped, mutates nothing, and reports a reason on stderr distinct from every other skip reason. The DAG authority stays plan.yaml's depends_on; resolution runs plan.yaml depends_on to feature.yaml's issue map to that blocker issue's open or closed state, and GitHub contributes the last hop only. The rendered blocked_by edge on GitHub is still NEVER read back, because it is hand-editable and deriving control flow from it would put a remote object in charge of the signed DAG
    because: DEC-138 IS THE WRITE-ONLY BASELINE BEING AMENDED, and this entry records a deliberate ruling rather than drift. DEC-138 makes the outbound Issues mirror strictly one-way so that a wiki-editable surface cannot feed an approval-gated artifact, and effort ticket #184 found that post-approval issues-as-truth contradicts it, so the read-back has to be bounded and recorded rather than assumed. The original bound was claim and station. Blocker completion is neither - it is not ownership, not bookkeeping and not a station, it is a gate on CANDIDACY applied before any of those are engaged - so enforcing it required widening the bound in this entry rather than adding a check under it. The operator ruled the widening in at the plan review of 2026-08-08 and rejected deferral, on the ground that a queue which renders a block marker and then hands the work out anyway is worse than no marker at all, because the operator reads the board and believes ordering holds. DEC-138's actual guarantee survives intact - nothing read here is ever written into BRIEF.md, plan.yaml or an approval block, and the only harness file a factory tool writes is a feature's own feature.yaml factory block. THE COST, STATED RATHER THAN LEFT IMPLICIT - enforcement adds one blocker-state read PER BLOCKER per candidate, not one per candidate. The cache the task specifies is the YAML FILE cache, so plan.yaml and feature.yaml are each read once per poll, but issue_view results are not cached and T-12's six blockers cost six reads. It is bounded by the ready column and not by the board, because D-10's server-side query already bounds the candidate set that way; measured on board 3, the ready-station query returned 1 item against 150 on the board. Two edges are ruled here so no implementer settles them silently - a depends_on entry the issue map cannot resolve counts as BLOCKED and not clear, reported on stderr, because handing work out on an unresolvable blocker is the failure this amendment exists to stop; and a candidate the factory cannot resolve to a plan task at all, D-09's tolerant feature null read of a gh-sync.py mirror issue, has no resolvable DAG and is NOT gated, staying claimable exactly as before, because making it an error would silently reverse D-09
    dec: DEC-138
  - id: D-02
    choice: Factory control-plane tools fail loudly with a non-zero exit when gh is missing, unauthenticated or erroring, unlike gh-sync.py which prints SKIP and exits 0
    because: a mirror that skips loses a copy, but a control plane that skips leaves the board asserting a state that is not true
    dec: DEC-138
  - id: D-03
    choice: Every board item is added explicitly by a factory tool and no Projects v2 auto-add workflow is configured
    because: effort ticket #183 measured the auto-add cap at 1 on Free and 5 on Pro, and gh api user returns a null plan here with the cause not established, so a multi-repo fleet cannot rely on it
    dec: none
  - id: D-04
    choice: Agents discover work by polling the board on demand, with no webhook path anywhere in the design
    because: effort ticket #183 measured that personal accounts emit no board-event webhooks
    dec: none
  - id: D-05
    choice: The claim is the creation of the git ref refs/heads/factory/issue-N in the target repository, a create-if-absent whose refusal is the conflict signal; the factory:claimed label and the assignee are operator-visible bookkeeping written only by the agent whose create returned 201, and they never decide a race
    because: an assignee set is additive, so two racing agents both succeed and neither can conclude it won, which leaves the issue marked and owned by nobody and is a failure that fails OPEN; measured against the live API, creating a ref that already exists returns HTTP 422 Reference already exists with process exit 1 and no mutation, and git refs are compare-and-swap by construction, so exactly one concurrent creator can receive 201; the ref is also the branch the journey already needs, so the claim costs no new object, and releasing an abandoned claim is one ref delete. Residual risk, stated not assumed - that concurrent creates serialise is inferred from the endpoint being create-only and is not measurable from this checkout, so it stays UNMEASURED BEFORE SHIP. No success criterion races two real claims on the live API - the criterion that did was deleted by the operator on 2026-08-08 as anticipation, on the ground that a one-issue-in-flight cap, one issue per wake, a single credential and push-first dispatch mean two concurrent claims on one issue cannot arise in normal use. SC-12 covers only the tool's handling of the two answers the primitive can give. This decision and REQ-03 stand unchanged; the first real dispatch is the live verification
    dec: none
  - id: D-10
    choice: The factory reads the board through the server-side query filter, selecting on the station option name plus is:open, and treats the station field as the item lifecycle signal; it never archives or removes a board item, and reaping stays the operator's through the board UI
    because: measured on board 3, which holds 150 items of which 80 are Done, the item payload carries no state key so a tool cannot filter closed issues from it, while query status:Ready returned 1 item and is:open returned 70 - the filter bounds the read by the ready column rather than by board size, at no cost. The accepted limitation is that the board still grows monotonically, which effort ticket 186 owns; the rejected alternatives were a second gh call per item, which is a per-poll cost proportional to the whole board, and an archive step, which is new scope and destroys the operator visibility REQ-01 asks for
    dec: none
  - id: D-11
    choice: The eight tasks that edit run-unit-tests.sh - T-02, T-03, T-04, T-05, T-06, T-07, T-11 and T-12 - are serialised at dispatch and never run concurrently, even when the dependency graph makes them one wave
    because: that script's drift detector exits 2 for any bin/test-*.py it does not list, so a task that has created its test file but not yet registered it turns EVERY other task's verify red with a message naming the wrong task; the graph cannot express the constraint, so recording it here is what carries it into build instead of leaving it in one lead's head. One further ordering constraint the graph cannot express rides here - T-12 must land in the same run as T-04 through T-07, before the qa gate evaluates them, because it is the only integration-kind coverage of their surface, the only test anywhere in this feature that observes a real process exit status, and, since the criteria rework, the only automated proof that the four tools COMPOSE into the journey at all (SC-19) - three reasons living in one task, so deleting or reordering it costs all three, and the gate evaluates one feature diff once after the build team returns rather than per task. T-10 by contrast must land in the FIRST wave and must not be made to wait on T-12, because SC-06 declares integration evidence and the kind detects nothing until T-10 widens its glob. Neither constraint rests on the change_type feature matrix floor - an earlier draft justified both that way and was wrong, since qa classifies a diff by reading it rather than by reading a task's change_type field
    dec: none
  - id: D-12
    choice: The duplicate-ledger problem between gh-sync.py and factory_decompose.py is recorded and deliberately not fixed in this increment
    because: both write issues for the same T-NN into the same repository and keep two maps in one file, feature.yaml's github and factory blocks, and mruangutai/harness is both a candidate fleet member and harness.json's github.repo, so running both there produces two issues per task; INV-24 detects collisions only within the factory ledger. Reconciling two issue writers is a redesign of the mirror and would consume the increment, so it becomes a named DEC-186 candidate the operator decides on with the evidence in front of them rather than a silent hazard. The edge work D-14 adds widens this entry rather than opening a new one, and the difference between the two writers is stated exactly, because the premise that they share an identical gap was checked and is false - gh-sync.py already draws the hierarchy half in full, cmd_open adopting or creating a parent, recording parent_origin and attaching every task with attach_sub_issue_args, while the string depends_on appears zero times in that file, so what it lacks is only the dependency half. Bringing the two writers to blocked_by parity is deferred with the rest of D-12; gh-sync.py is a different surface governed by DEC-138 and the Q7 ruling names the decomposition, so widening this increment to touch it would widen scope the rulings deliberately did not
    dec: DEC-138
  - id: D-06
    choice: The fleet declaration lives at .harness/factory/fleet.yaml, a surface no agent domain grants, so the operator writes it in a declared main-session step
    because: DEC-179 requires an ungranted surface to become a declared main-session-direct step at plan time instead of a mid-run rejected write
    dec: DEC-179
  - id: D-07
    choice: Factory tools are underscore-named importable Python modules whose command-line entry sits behind a main guard, and their tests import and monkeypatch the runner seam instead of forking the script
    because: run-unit-tests.sh splits its two arrays by whether a test drives a real script end to end, so import-and-monkeypatch tests belong in UNIT_SCRIPTS and the unit test kind then genuinely covers this surface
    dec: none
  - id: D-08
    choice: The CLI contract of DESIGN.md C-3 — stdout carries the machine-readable payload only, exit 0 success, 1 nothing to do, 2 refused, 3 lost race, and every entry point traps unexpected exceptions into exit 2 — is implemented once in a shared factory_cli module that every entry point calls, not restated in each tool
    because: the trap is the load-bearing part and Python's default for an unhandled exception is exit 1, which in this vocabulary reads as nothing-to-do, the single worst confusion in the table; specified six times it drifts five ways and only a shared wrapper makes the trap independently testable in isolation. The module's scope is C-3 and nothing else - no fleet knowledge, no gh knowledge, no factory imports - so it cannot become the grab-bag a shared module tends to become, and the failure-line body is built by one exported helper rather than by hand at each raise site, because two ways to build one grammar is the drift D-08 exists to stop
    dec: none
  - id: D-09
    choice: Every factory-created issue carries a feature label whose value is the plan's feature id alongside harness, factory_claim reports that feature in its payload, and a factory issue that carries no feature label is still claimable with a null feature rather than an error
    because: DESIGN.md C-4's Q3, ruled here because plan.yaml is pm-owned and unsigned — the feature address appears nowhere the operator reads today, not on the board card, not in the claim payload, not in the issue body, while T-08's INV-24 already collects repo-and-issue pairs across all features and flags a collision naming both, which is an invariant nobody writes for a case that cannot arise; the tolerant read side keeps issues created by the existing gh-sync mirror, which label harness and nothing else, claimable on the same board
    dec: DEC-138
  - id: D-13
    choice: The two accepted growths in this increment - board items that are never archived, and claim refs left behind by an agent that died before its bookkeeping - are accepted TOGETHER for increment 1 rather than fixed, and reaping stale refs is deferred as named follow-up work alongside effort ticket 186. Recorded in one place so the increment does not ship two separate reassurances in two files that each look sufficient alone. ACCEPTED BY THE OPERATOR at the plan review of 2026-08-08, in their words premature optimization right now, and the acceptance carries this entry's own condition unchanged - SC-13 clause (b) must land exactly as stated below, because it is the only signal the residual is biting. That clause is therefore protected wording in BRIEF.md and is not to be re-balanced by any later criteria pass
    because: the two are not independent, which is why one entry rather than two. D-10's server-side query bounds the board read by the ready column, but a stale-ref item IS open and IS in the ready column, so it sits inside the bounded set by construction and the bound does not exclude it; and effort ticket 186's saved views reap board items, not refs. Accepted on four grounds, each checked. The growths differ in kind and in rate - board items grow with completed work, one per task ever published, and the operator reaps them through the board UI, while stale refs grow only with an agent death inside the narrow window between a create_ref that returned True and the label, assignee and station writes that follow it. The measured ready column is small - on board 3, no query returned 150 items, the is-open query returned 70, and the ready-station query returned 1 - so stale refs add to a set of that size linearly, not multiplicatively. The cost of each stale item is one skipped candidate per poll, an O(n) scan cost and not a wedge, because work behind it stays reachable. And unlike the orphaned-issue case this plan closes in T-04 step 4, there IS an operator remedy - delete the ref. CONDITIONAL, and the condition is the whole reason this is signable - accepting the residual depends on SC-13 clause (b) landing, because the no-claimable-work line is the operator's only signal that the residual is biting, and without that assertion a queue full of stuck items is indistinguishable from an idle factory
    dec: none
  - id: D-14
    choice: The GitHub decomposition encodes the plan's task DAG as a one-way projection - each task issue is a sub-issue of one feature-level parent that is adopt-or-create and is never added to the board, and carries one blocked_by edge per depends_on entry - drawn in a SECOND PASS after every issue exists, made idempotent by a per-edge receipt recorded in feature.yaml rather than by any assumed API property, with a failed edge write fatal at exit 2 under the existing C-3 vocabulary, one narrow exception on the blocked_by call alone where a measured already-exists response records the receipt and continues, and a blocker with no issue number yet skipped on stderr
    because: the operator ruled flat issues out (Q7) and DESIGN.md C-5 settled the shape; what this entry fixes is the four things C-5 left to the plan, each of which is a real trade-off rather than a detail. The parent cannot carry the dependencies - GitHub allows an issue exactly ONE parent and T-12 declares six blockers - so hierarchy and dependency stay two edge types against two endpoints, and both take an issue's internal REST integer id, never its number. Idempotence is a LEDGER and not an API property, and the honest statement is now a measured one on the dependency half and an unmeasured one on the hierarchy half - a live probe re-POSTed an existing dependencies/blocked_by edge and got HTTP 422 with a message containing "already been taken", while sub_issues on a repeat has still not been measured. Read-before-write is AVAILABLE at the API level for blocked_by, since the GET works and returns an empty list for an issue with no blockers. What is missing is a builder in gh_issues.py, which has parent_args to read a parent back but none for blocked_by - a one-function library gap, not an API gap, and that distinction is recorded because the earlier wording claimed the read did not exist and a future reader would take it as settled. The ledger stays the mechanism anyway - it costs no read per edge, it is the same receipt shape gh-sync.py already uses for attached and T-04 step 4 already uses for issues and items, and adding a read builder would put a GET in front of every edge to learn what the receipt already records. The measured 422 is what makes the narrow non-fatal exception writable, and it is scoped to blocked_by alone - on sub_issues the same phrase plausibly means the child already has a DIFFERENT parent, since GitHub allows exactly one, so recording a receipt there would file a false one and mis-report the hierarchy. The crash window between a successful attach and its receipt therefore stays open and is named in T-04 rather than papered over, it is the same receipt shape gh-sync.py already uses for attached and T-04 step 4 already uses for issues and items, and SC-01's second run mutates nothing is false without it. The second pass rather than the create loop, because a blocked_by edge needs both endpoints and drawing it inside the loop would make correctness depend on the plan's task ORDER, a silent dependency C-5 Q5(ii) names. Fatal at exit 2 rather than a reported skip, because run_gh raises GhError on any non-zero exit and D-02 already rules that the control plane fails loudly - the ledger makes the re-run resume and draw only the undrawn edges, so the cost of stopping is one command, while continuing past a GhError would swallow an authentication failure as a cosmetic gap. The mid-publish case is different in kind and is therefore NOT fatal - a blocker whose issue is not yet recorded is an ordinary intermediate state, reported on stderr and drawn by the next run. Nothing reads an edge back to decide anything, which is what keeps this inside D-01 rather than reopening it
    dec: none
  - id: D-15
    choice: Every factory write in increment 1 is made with one GitHub credential as mruangutai, and the distinction between agents is carried by the claim ref refs/heads/factory/issue-N and never by the assignee; per-agent identity is deferred to effort ticket 192
    because: ACCEPTED by the operator at the plan review of 2026-08-08, and it is recorded as a decision because it is load-bearing for why the assignee cannot arbitrate a race and is therefore the premise under D-05 rather than a detail beside it. With one credential, two racing agents produce two identical assignee writes, so no reader of the issue can tell which agent holds it and no comparison of a login against the assignees list can decide anything - which is exactly why the tool never makes that comparison outside the --issue self-ownership branch. Reversing this later means a credential per seat and a re-reading of every ownership test, so it is recorded where a future reader looks for it
    dec: none

tasks:
  - id: T-01
    title: Create the factory fleet declaration
    traces: [REQ-06]
    change_type: config
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve reports NOBODY for .harness/factory/fleet.yaml, so no agent domain grants the write (DEC-179, D-06)
    depends_on: []
    status: pending
    files:
      - .harness/factory/fleet.yaml
    verify: |
      python3 -c "import sys; sys.path.insert(0,'.claude/skills/harness/bin'); import harness_yaml as h; d=h.load_file('.harness/factory/fleet.yaml'); assert d['schema']=='factory-fleet/1'; b=d['board']; assert b['owner'] and isinstance(b['number'],int) and b['station_field']; s=b['stations']; assert set(s)=={'ready','building','review'} and all(s.values()); r=d['repos']; assert r and all('/' in x['name'] and x['default_branch'] for x in r); assert d['workspace_root'].startswith('/'); print('fleet ok')"
    intent: |
      Create .harness/factory/fleet.yaml, the single place that states which repositories the
      factory operates and which Projects v2 board is its control plane. Nothing in the factory
      may infer either from the working directory.

      Write exactly this structure and exactly these values, as plain YAML with no markdown in any
      value:

        schema: factory-fleet/1
        board:
          owner: mruangutai
          number: 3
          station_field: Status
          stations:
            ready: Ready
            building: Building
            review: Review
        repos:
          - name: mruangutai/harness
            default_branch: main
        workspace_root: /Users/molchairuangutai/GitHub/harness-factories

      Those are the operator's answers, given at the plan review of 2026-08-08 and no longer
      placeholders: board 3 is the one named Harness, Status is its single-select station field, and
      workspace_root is deliberately NOT under the operator's hand-managed clones in
      /Users/molchairuangutai/GitHub, because T-06 refreshes an existing checkout with a fetch and a
      reset and must never do that to a clone the operator is working in. Do not invent any other
      value and do not write a placeholder.

      The three station option names must satisfy DESIGN.md C-1's naming rule, which this task is
      the only place that can enforce, because the words are chosen at this signature and never
      again: each is ONE word, distinguishable from the other two at a glance on a board card, maps
      1:1 to exactly one C-1 predicate, and is a state and never a verb. Two of those clauses are
      load-bearing rather than stylistic. One word: the claim tool passes the option name inside a
      board query string, so a name containing a space would need quoting the tools do not do.
      1:1 to a predicate: the station field IS the item lifecycle signal for this factory (D-10), so
      an option that does not correspond to exactly one predicate leaves work in a state no tool can
      select. If an operator answer breaks either clause, report it back rather than writing it.

      Every option name written here must already exist as an option on the board's single-select
      field. Measured on the live account: a query naming an option the board does not offer returns
      zero items and exit 0, so a typo here is indistinguishable from an empty queue forever. T-05
      validates the three names against the board at run time; this task must not rely on that alone.

      OPERATOR PRE-CONDITION, ARMED ON DAY ONE - two of the three option names above do not exist on
      the board yet. Re-measured by the operator on 2026-08-08, board 3's Status options are Backlog,
      Ready, In progress, In review, Done. Ready exists; Building and Review DO NOT. Before this
      fleet file is written, the operator renames the column In progress to Building and the column
