          `harness` nor `chore`. Unlike gh-sync.py, which swallows the error there because a
          mirror must never gate a flow, this one propagates it: a control plane that cannot
          create its own vocabulary must stop rather than fail at the issue create with a
          confusing message. That is D-02. `--force` makes the call idempotent for a label that
          already exists.
