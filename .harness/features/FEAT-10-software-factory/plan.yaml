      been run — a false statement about the project's own configuration, which an earlier draft of
      this task wrongly told a specialist to keep. Change nothing else: every other kind's detect,
      exclude, cmd and _reason stay exactly as they are. Keep the file valid JSON.

  - id: T-12
    title: Add the fork-level exit-status and end-to-end test for every command-line tool
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-05, REQ-08]
    change_type: scaffolding
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02, T-04, T-05, T-06, T-07, T-11]
    status: pending
    files:
      - .claude/skills/harness/bin/test-factory-integration.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind integration > /tmp/v-t12.txt 2>&1; s=$?; grep -q "^PASS test-factory-integration.py$" /tmp/v-t12.txt && [ "$s" -eq 0 ]
    intent: |
      Add test-factory-integration.py, the only test in this feature that observes a real PROCESS
      exit status.

      Why it exists, stated so nobody deletes it as redundant: SC-10 and SC-15 are written about the
      status a process exits with, and every other test in this feature asserts in-process by
      catching SystemExit — each of those tests explicitly forbids spawning a subprocess, which is
      correct for what they cover and blind to this. A tool whose `if __name__ == "__main__":` block
      forgets to call factory_cli.run, or that raises at import time, passes every one of those
      tests and violates SC-10 in production. Nothing else in the plan can catch that class.
      Its support is REQ-08 and the two criteria written on a real process exit status, SC-10 and
      SC-15, and that support was sufficient on its own before the criteria rework. It now also
      carries SC-19, the automated happy path: the operator ruled that the journey must be provable
      without a human, and this file is the only place in the feature where a stubbed board state
      lets publish, claim, workspace and land run in sequence. That is why the coverage landed here
      rather than in a new task — the seams, the stubs and the dependency on all five tools already
      exist here, and a new task would duplicate every one of them. Do not delete this file on the belief that
      its only justification was a change_type: feature matrix floor — that argument appeared in an
      earlier draft and is wrong, because the qa gate classifies from the diff rather than from a
      task's change_type (harness-qa-gate/SKILL.md:30) and this feature ships no user interface.
      It is separately the only integration-kind coverage of the factory tool surface.

      The seams already exist and no new production code is needed. factory_gh reads FACTORY_GH and
      factory_workspace reads FACTORY_GIT for the binary to invoke, so the test writes two stub
      executables into a tempfile.TemporaryDirectory — small scripts that print a scripted response
      on stdout and exit with a scripted status, chosen per case by an environment variable the stub
      reads — and points those variables at them. No case may reach the real gh or the real git, and
      no case may touch a real repository, the real board, or the real .harness/factory/fleet.yaml;
      each writes its own fleet file into the temporary directory and passes it with --fleet.

      Run each tool with subprocess.run([sys.executable, <tool path>, ...]), capture_output=True,
      text=True, and a cwd set to a temporary directory that is NOT the harness checkout — the cwd
      is part of what is under test, since a tool that resolves its fleet from the working directory
      would find nothing there.

      Cases, at minimum, for each of the five command-line tools factory_config.py,
      factory_decompose.py, factory_claim.py, factory_workspace.py and factory_land.py:
        - a stub gh that exits non-zero on auth status makes the tool exit with process status
          exactly 2, never 1 and never 0, with an empty stdout and a non-empty stderr. This is the
          SC-10 case and the reason the file exists.
        - a run whose stubs script a success exits 0 and its whole stdout parses in one
          json.loads — asserted on the captured process stdout, which is the only place an
          interleaved progress line would actually show up.
      THE HAPPY PATH, END TO END, and it is why this file grew rather than a new task appearing: it
      is the only place in this feature where the four tools are observed COMPOSING. Every other test
      here proves a tool refuses correctly; nothing else proves the factory works. Run, in one case,
      against one stubbed board state and one temporary fleet file:
        factory_decompose.py on a signed two-task plan in a temporary feature directory, then
        factory_claim.py, then factory_workspace.py, then factory_land.py for the claimed issue.
      PIN THE FIXTURE PLAN'S DEPENDENCIES, or this case fails on correct behaviour rather than on a
      defect. Since the blocker gate landed in T-05, factory_claim refuses a candidate whose
      depends_on blockers are open, and both tasks in this fixture are published open. The
      lowest-numbered task in the two-task plan must therefore carry depends_on with no entries, so
      the claim step has a clear candidate; give the second task depends_on naming the first, which
      costs nothing here and keeps the fixture honest about what a real plan looks like. The blocker
      gate's own coverage stays in T-05's unit cases (SC-22) and is not this file's job.
      Assert: decompose exits 0 and creates one issue per task, adds each to the board and sets each
      station to the fleet's ready option; claim exits 0 with exactly one payload whose branch is
      factory/issue-<n> and moves that item to the building option; workspace exits 0 with a payload
      whose path is under the temporary workspace_root and whose branch is factory/issue-<n>; land
      exits 0, pushes that branch, opens one pull request and moves the item to the review option.
      Every step's whole stdout must parse in one json.loads of the captured PROCESS stdout, and each
      step takes its issue number from the previous step's payload rather than from a constant, so a
      break in the chain shows up as a failure here rather than as four independently green steps.
      This is SC-19. There is no live-board equivalent criterion; this case proves the tools compose
      and proves nothing about GitHub's own behaviour.
      THE STUB gh MUST SCRIPT THE EDGE ENDPOINTS, or that case fails in a way that reads as a tool
      defect rather than as a gap in the stub. Beyond auth status, issue create, project item-add,
      project item-edit, project field-list, project item-list, pr create and the git refs endpoints,
      it must answer: `api repos/<owner/name>/issues/<n> --jq .id` with a plain INTEGER on stdout —
      never a GraphQL node id, since the tools must never be handed one; `api
      repos/<owner/name>/issues/<parent>/sub_issues` with a success; and `api
      repos/<owner/name>/issues/<n>/dependencies/blocked_by` with a success. The stub is reached
      through FACTORY_GH, which is exactly why the edge functions execute through factory_gh.run_gh
      and never through gh_issues.gh_bin() — the latter reads GH_SYNC_GH and would walk straight past
      this stub to the real gh.
      Plus, once each:
        - factory_claim.py with a stub gh scripting a refused ref create for every candidate exits
          with process status 1 and writes nothing to stdout — the losing agent, observed as a
          process.
        - a tool invoked with a --fleet path that does not exist exits 2 with a stderr line naming
          that path.
        - every one of the five tools, run with no arguments at all, exits 2 and never 1 — a tool
          whose entry point is not wrapped is most likely to show it here, where argument parsing
          raises before anything else runs.
      Keep each case to one subprocess call; the whole file must run in well under 60 seconds.

      Register test-factory-integration.py in run-unit-tests.sh by appending it to the
      INTEGRATION_SCRIPTS array, NOT to UNIT_SCRIPTS — that array is the one for tests that drive a
      real script end to end through a fork, which is exactly what this file does, and the split is
      what keeps the unit kind honest about what it covers. Leaving it unregistered makes the
      script's drift detector exit 2 and redden every other task's verify.
