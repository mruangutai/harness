          routed through it would bypass FACTORY_GH and silently escape T-12's stub gh.
            - internal_id(repo, num) -> int. run_gh(gh_issues.internal_id_args(repo, num)), the
              result stripped and converted to int.
            - attach_sub_issue(repo, parent_num, child_id) -> None.
              run_gh(gh_issues.attach_sub_issue_args(repo, parent_num, child_id)).
            - blocked_by(repo, num, blocker_id) -> None.
              run_gh(gh_issues.blocked_by_args(repo, num, blocker_id)).
