  - id: T-11
    title: Add the shared CLI contract module and its unit test
    traces: [REQ-08]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/factory_cli.py
      - .claude/skills/harness/bin/test-factory-cli.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit > /tmp/v-t11.txt 2>&1; s=$?; grep -q "^PASS test-factory-cli.py$" /tmp/v-t11.txt && [ "$s" -eq 0 ]
    intent: |
      Add factory_cli.py, the one place the factory's command-line contract is implemented. Every
      other factory tool with a command-line entry calls into it, so the contract is written once
      rather than six times, and so the exception trap below is testable on its own. This is D-08.

      The contract it implements:
        - stdout carries the machine-readable payload and nothing else. Every diagnostic, warning
          and error goes to stderr.
        - exit 0 success, the payload is on stdout; exit 1 nothing to do, which is not an error;
          exit 2 refused, meaning the config was invalid, the repository is not in the fleet, the
          plan is unsigned or a guard tripped, and nothing was mutated; exit 3 lost race, another
          agent owns the issue, and nothing was mutated.
        - a tool NEVER exits 1 for a failure. An unhandled exception exits 1 by Python's default
          and would read as nothing-to-do, so the entry-point wrapper traps it and exits 2.

      factory_cli.py must expose, with no imports of any other factory module so that nothing can
      import it circularly:
        - EXIT_OK = 0, EXIT_NOTHING = 1, EXIT_REFUSED = 2, EXIT_RACE = 3.
        - body(what, value, next_step) -> str. Build "{what}: {value} — {next_step}" with an em
          dash. This is the ONE place the failure-line body is constructed. factory_config's
          FleetError and factory_gh's GhError both build their message with it and neither formats
          a line by hand, because two ways to build one grammar is exactly the drift D-08 exists to
          stop, and those two classes' messages are printed verbatim behind the tool prefix.
        - message(tool, what, value, next_step) -> str. Build exactly one line in this order:
          "factory: {tool}: {what}: {value} — {next_step}" with an em dash. It must never be
          called with an exception class as the value; the value is the path, the repository, the
          issue number or the option name the operator can act on.
        - fail(tool, what, value, next_step) -> None. Write message(...) plus a newline to
          sys.stderr. Write nothing to stdout.
        - refuse(tool, what, value, next_step). fail(...) then sys.exit(EXIT_REFUSED).
        - nothing_to_do(tool, why). Write "factory: {tool}: {why}" to sys.stderr, then
          sys.exit(EXIT_NOTHING). This is the path factory_claim.py takes for no work available,
          and it is why that line is not on stdout.
        - lost_race(tool, what, value, next_step). fail(...) then sys.exit(EXIT_RACE).
        - payload(obj) -> None. Write json.dumps(obj) and a newline to sys.stdout, and nothing to
          stderr. It accepts only a dict or a list and raises TypeError on anything else. There is
          deliberately no plain-text branch: one would let a tool print arbitrary text to stdout
          while still claiming to honour the contract, and every tool's stdout must parse in a
          single json.loads of the whole stream.
        - run(tool, fn, expected=()) -> None. Call fn(). Let SystemExit propagate unchanged, so a
          deliberate sys.exit(1) stays 1 and a deliberate sys.exit(3) stays 3. Catch any exception
          whose type is in `expected` and emit "factory: {tool}: {str(exc)}" on stderr, then
          sys.exit(EXIT_REFUSED) — those exceptions are raised already carrying the
          what/value/next_step body, so no second prefix is added. Catch every other BaseException
          except SystemExit, emit
          "factory: {tool}: unexpected failure: {type(exc).__name__}: {exc} — re-run with
          FACTORY_DEBUG=1 for a traceback" on stderr, and sys.exit(EXIT_REFUSED). When
          os.environ.get("FACTORY_DEBUG") is set and non-empty, print the traceback to stderr
          after that line. `expected` is a tuple the caller passes, so factory_cli never imports
          FleetError or GhError.
      Importing the module must have no side effects and it must have no command-line entry of
      its own.

      One carve-out, stated so it is not read as a violation of the grammar: the unexpected-failure
      line is the single place an exception type name may occupy the value slot, because there is by
      definition no operator-actionable value to put there — that is what unexpected means. Every
      other line in every factory tool puts a path, a repository, an issue number, a key or an option
      name there. stderr is human-facing throughout; a machine caller reads the exit status and the
      single JSON document on stdout, never a stderr line, which is why the three shapes on stderr
      (the full grammar, the nothing-to-do line, and a preformed expected-exception message) do not
      need to be one shape.

      This module has no point of no return: it mutates nothing, ever.

      Add test-factory-cli.py: a plain python3 script in the style of the other bin tests, no
      pytest, one line per case, exit 1 on any failure. Every case runs in-process, capturing
      streams with contextlib.redirect_stdout and redirect_stderr over io.StringIO and catching
      SystemExit to read its code. Cases, at minimum:
        - fn returning normally leaves the process at exit 0 and writes nothing to either stream.
        - fn raising KeyError exits 2 and NOT 1, stdout is empty, and the stderr line contains
          FACTORY_DEBUG. This is the trap in the failure direction.
        - fn calling sys.exit(1) still exits 1, and fn calling sys.exit(3) still exits 3. This is
