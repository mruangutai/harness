          shape rather than an imagined one: each item carries the keys content, id, labels,
          repository, status and title, where repository is a URL such as
          "https://github.com/mruangutai/harness" and content is a mapping carrying the issue
          number and repository in "mruangutai/harness" form. Every fixture in this feature's tests
