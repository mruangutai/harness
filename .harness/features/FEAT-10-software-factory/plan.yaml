          `project item-list <number> --owner <owner> --format json --limit <limit>` plus
          `--query <query>` when a query is given. Return the items list. Before returning, compare
          the response's totalCount against the length of the items list and raise GhError naming
          the board and both numbers when totalCount is the larger — that means the read was
          truncated and work is hidden behind it, which must never be reported as an empty column.
          Measured on the live account: totalCount reports the UNTRUNCATED total, so this guard is
          real; at --limit 30 against a 150-item board the response carried totalCount 150 and 30
          items. gh pages internally up to --limit, so no cursor loop is needed.
          The query is the server-side filter, and it is the whole answer to reading a board that
          grows without bound. Measured on the same 150-item board: no query returned 150 items,
          `is:open` returned 70, and `status:Ready` returned 1. The item payload has NO state key,
          so a closed issue cannot be filtered out of the payload at all — the station field is the
