          --body --label ...`, parse the created issue number out of the returned URL, return it.
        - issue_view(repo, number, fields) -> dict, via `issue view <n> --repo <repo> --json
          <comma-joined fields>`.
        - add_label(repo, number, label) and assign(repo, number, login), via `issue edit`.
        - project_item_add(owner, number, url) -> str, via `project item-add <number> --owner
          <owner> --url <url> --format json`, returning the item id.
