decisions:
  - id: D-01
    choice: The board block moves inside each repos entry, number and station_field and stations
      together, and is REQUIRED on every entry. There is no fleet-level default, and after T-08 a
      leftover top-level board key is REJECTED by load_fleet rather than ignored.
    because: a default is exactly how this defect got in - kaya-ai inherited a board nobody chose for
      it and nothing failed. load_fleet accepts unknown top-level keys silently today, so leaving the
      old key merely unused would recreate the same silence one level up.
    dec: none
  - id: D-02
    choice: stations stays with its board number in one block rather than remaining fleet-level.
    because: station names are option names on a specific board, and identical names are not
      identical options. Measured on 2026-08-11 by gh api graphql over each project's Status field,
      board 2 and board 3 carry the SAME six option names in the same order - Backlog, Plan, Ready,
      Building, Review, Done - on different board numbers, and three of those names carry DIFFERENT
      option ids per board (Plan, Ready and Review), while Backlog, Building and Done share GitHub's
      default template ids across both. A board number split from its station mapping is precisely
      the pair that can drift, and factory_claim validates one against the other.
    dec: none
  - id: D-03
    choice: The migration is three-phase and the order is fixed - T-01 makes the fleet-level block
      OPTIONAL and adds per-repo support, the readers migrate, T-07 rewrites fleet.yaml and board 2
      together, and only then does T-08 tighten to required-and-rejecting.
    because: check-domain.sh calls load_fleet on every governed write and fails CLOSED on any
      exception, and test-check-domain.py case (c) asserts exit 2 on a harness path, so a
      non-loading fleet refuses harness writes too. Both naive orderings brick the guard including
      the write that would fix it, and one task cannot land both halves because fleet.yaml resolves
      to NOBODY while factory_config.py resolves to the team. The operational consequence, stated
      rather than left implicit - once T-08 lands, the schema is one-way in one narrow way. Narrow
      because fleet.yaml is tracked and every checkout carries its own copy of BOTH halves, so git
      alone cannot pair an old loader with a new fleet. What can is a MIXED invocation - a
      factory_config.py predating T-01 resolving a fleet path that lands on a post-T-07 fleet.yaml,
      whether by an explicit --fleet or by running the tool from one checkout against another's
      tree. There load_fleet raises and check-domain.sh fails CLOSED on every governed write.
      CLAUDE.md's run-everything-from-the-worktree rule covers the mechanics; the recovery is to
      rebase that checkout past T-08, never to edit the fleet back.
    dec: DEC-174
  - id: D-04
    choice: T-07 does NOT edit board 2. The board-option work is a PRECONDITION CHECK that reads
      both boards and stops if either disagrees, folded into the same task as the fleet declaration
      and one capture artifact. The live factory run is NO task at all - it is SC-06 with verify uat.
    because: the board edit this plan originally specified was already performed, differently, by
      the main session on 2026-08-11 - Todo became Backlog rather than Ready, and both boards ended
      at six options rather than four. An edit task would re-do finished work and fight live state,
      so what remains is a read that confirms the state the rest of the plan assumes. ONE capture,
      not two - with no edit between them, a before-capture and an after-capture are two identical
      files, and the unrecoverable-before-capture argument that justified the pair dies with the
      edit. The capture survives for a different reason - it is the named measurement point SC-03 is
      evaluated at, taken before any live factory run, and nothing in CI ever re-reads a GitHub
      board. The precondition, the capture and the declaration stay one ordered unit under one owner
      because the declaration must not land against a board whose vocabulary it does not match. The
      live run writes nothing in this repository, mutates a product repository and a live board, and
      only the operator can consent, so it is SC-06 with verify uat and no task at all.
    dec: DEC-179
  - id: D-05
    choice: The repo-to-board pairing assertion lives in test-no-distribution.py, not check-state.sh.
    because: check-state.sh is a DEC-174 carve-out file AND is granted to the same two agents, so
      declaring a task on it main-session-direct emits a permanent DEVIATION line in a required CI
      check and the task cannot be done by the team at all. test-no-distribution.py already asserts
      fleet membership under DEC-174 am.1 and runs in UNIT_SCRIPTS, so SC-05 gets real unit evidence.
    dec: DEC-174
  - id: D-06
    choice: No task changes any of the four DEC-174 carve-out scripts, and none needs to.
    because: re-measured at a29ad06, which is HEAD - check-domain.sh reads only workspace_root and repos[].name from
      the loaded fleet and never reads board, and check-state.sh INV-24 reads the fleet with
      harness_yaml.load_file rather than load_fleet and reads only repos[].name. Only
      test-check-domain.py's good_repos fixture has to change, and that is a fixture, not a gate.
    dec: DEC-174
  - id: D-07
    choice: SC-03 pins all three historic Status option ids on board 2, not just Done, and is
      evaluated at T-07's capture rather than at goal-check time. The id anchor is WITHIN board 2
      and across time; it is never used to compare board 2 with board 3.
    because: renaming an option in Projects v2 keeps its id and recreating one does not, so the ids
      are what distinguish the cheap rename from the forbidden rename-then-migrate route that
      reaches identical counts. All three survive the 2026-08-11 rename - f75ad846 is now named
      Backlog, 47fc9ee4 is now Building, 98236657 is still Done, measured by gh api graphql on
      2026-08-11 - which is exactly what proves no option was deleted and recreated and no item was
      moved. Pinning the old Todo option's id as well catches deleting it and creating a fresh
      station, which would strand 82 items with no status while every Done count still agreed. A
      CROSS-BOARD id comparison would be vacuous and is deliberately not made - Backlog, Building and
      Done carry identical ids on both boards because they are GitHub's default template ids, so
      cross-board assertions compare NAMES only. The named measurement point is what keeps SC-03 and
      SC-06 jointly satisfiable in every world.
    dec: none
  - id: D-08
    choice: The factory's ready station stays pointed at the Ready option on board 2, and an EMPTY
      Ready is CORRECT rather than a defect. Backlog means filed-and-untriaged; Ready means the
      operator has decided the factory may take it. Kaya's 82 unstarted issues are correctly in
      Backlog, so a claim run against kaya finds nothing to claim, and that is the truth.
    because: the earlier Todo-becomes-Ready mapping was decided when the target vocabulary was three
      stations and Ready was the only not-started-yet value available. With six values the two
      separate, and 82 unplanned issues sitting in Ready would make Ready meaningless. Board 3's own
      shape is the evidence. Pointing the intake at Backlog instead would make the factory pick up
      work nobody triaged. THE CONSEQUENCE, RECORDED RATHER THAN ABSORBED - promotion from Backlog
      to Ready is a human decision and there is NO recorded step for it anywhere in the harness.
      That is a real gap, it is OUT OF SCOPE for this feature, and the only thing this feature owes
      it is SC-13 - a claim run that finds an empty ready station must REPORT that it found nothing
      rather than exiting 0 in silence.
    dec: none
  - id: D-09
    choice: T-10 appends a second amendment to DEC-174 rather than opening a new DEC number.
    because: the loose end being closed - fleet.yaml board.number 3 described as the Harness board
      while the fleet holds only kaya-ai - was opened by DEC-174 am.1, and a closure belongs in the
      entry that opened it. A separate entry would split one story across two places a reader would
      have to find both of, and the per-repository board is a consequence of DEC-174's own carve-out
      reasoning rather than a new ruling.
    dec: DEC-174
  - id: D-10
    choice: DEC-186 is AMENDED, not struck.
    because: DEC-188's own text settles it rather than pm preference - the rule does not generalize
      by itself, it applies to a flat contradiction with no room for interpretation, and anything
      softer than that - merely dated, narrowed, or PARTLY OVERTAKEN - is amended, with striking
      needing the operator's word first. DEC-186 is partly overtaken exactly - its one-board framing
      is falsified by the per-repository board, while its three-purpose read-back bound is untouched
      by this feature and is still load-bearing in gates. Striking would remove that bound from all
      of them.
    dec: DEC-188
  - id: D-11
    choice: No prototype gate fires for this feature and no visual-designer is spawned. Recorded as
      overridable in either direction.
    because: every literal files entry across all eleven tasks is a .py, .yaml or .md file, so there
      is no rendered surface to prototype. The only human-in-the-loop surface in the feature is
      SC-06's UAT - the operator typing a CLI command and watching a GitHub Projects station move -
      and a designer cannot prototype GitHub's own board UI.
    dec: none

tasks:
  - id: T-01
    title: Teach load_fleet a per-repo board block and add board_for and a repo-scoped station lookup
    traces: [REQ-01, REQ-02]
    change_type: api
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/factory_config.py
      - .claude/skills/harness/bin/test-factory-config.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      In factory_config.py, extract the existing board validation in load_fleet into a module-level
      helper, def _validate_board(board, where, path), that raises FleetError with the SAME message
      shapes as today but with the key names prefixed by the where argument - so the current fleet-level errors
      keep saying board.owner, board.number, board.station_field and board.stations, and a per-repo
      error says repos[owner/name].board.owner and so on. The four rules are unchanged: owner
      non-empty, number an int and not a bool, station_field non-empty, stations a mapping whose key
      set is exactly ready, building and review with every value non-empty.

      Then make three changes to load_fleet:
      1. The top-level board key becomes OPTIONAL. When present it is validated exactly as today.
         When absent, no error is raised. Do NOT make it required-per-repo yet and do NOT reject a
         top-level board - T-08 does both, after the live fleet file has been migrated.
      2. Each repos entry MAY carry a board key. When present it is a mapping and is validated with
         _validate_board(entry["board"], f"repos[{name}]", path). When absent, nothing is raised.
      3. If a repos entry has no board AND there is no top-level board, raise FleetError with what
         "fleet key invalid", key f"repos[{name}].board", and a next_step telling the reader to give
         that repository its own board block with number, station_field and stations. This is the
         only new rejection this task adds.

      Add two new module functions:

        def board_for(fleet, repo_name):
            """Return the board mapping that governs repo_name: the repos entry's own board when it
            carries one, else the fleet-level board. Raises FleetError when the repository is not in
            the fleet, by delegating to repo_entry."""

      It must call repo_entry(fleet, repo_name) so an unlisted repository raises the existing
      "repository not in fleet" FleetError rather than a KeyError.

        def board_station(fleet, repo_name, key):
            """Return board_for(fleet, repo_name)["stations"][key]; raises FleetError on an unknown
            key, listing the known station keys."""

      LEAVE the existing two-argument station(fleet, key) exactly as it is. It is deleted by T-08,
      not here, and the reason is mechanical: every task in this plan verifies with the whole suite,
      factory_decompose.py:423 still calls the two-argument form at this task's boundary, and
      test-factory-decompose.py runs in UNIT_SCRIPTS - so removing it here turns THIS task's own
      verify red on arrival. The new name is board_station rather than a re-signature of station so
      that the two can coexist for exactly the three tasks the migration needs, with no rename churn
      at the end.

      Update _main so that --show prints the resolved fleet as {"repos": fleet["repos"]} plus the
      top-level board only when one is present, rather than unconditionally indexing fleet["board"].
      A KeyError there would turn a valid per-repo fleet into a crash.

      STATE THE PAYLOAD CONTRACT, because a downstream test asserts against it. After this task,
      --show emits a JSON object that ALWAYS carries the key "repos", and carries the key "board"
      IF AND ONLY IF the fleet file being shown still declares a top-level board. Each repos entry
      carries its own board mapping verbatim when it declares one, so a migrated fleet is read as
      payload["repos"][0]["board"]["number"]. After T-08 the "board" key is gone for every fleet
      that loads at all, because a top-level board becomes a load error - so "board" not in payload
      is the stable assertion at BOTH boundaries and a presence check on "board" is not.

      In test-factory-config.py, keep every existing case passing by leaving the shared good-fleet
      fixture fleet-level for now, and ADD cases for: a fleet whose single repos entry carries its
      own board and no top-level board loads; a fleet with two repos entries on two different board
      numbers returns each number from board_for; a repos entry with no board and no top-level board
      raises FleetError whose key names that repository; each of the four per-repo board field rules
      raises with a repos-prefixed key; board_station(fleet, repo, "ready") returns the per-repo
      option name when the entry has its own board and the fleet-level one when it does not;
      board_station with an unknown key raises; and board_for on a repository absent from repos
      raises "repository not in fleet". Follow the file's existing check() and add_bad_case() helpers rather than inventing a
      second style.

  - id: T-02
    title: Move factory_claim board reads and station validation inside a per-repository loop
    traces: [REQ-01]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/factory_claim.py
      - .claude/skills/harness/bin/test-factory-claim.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      factory_claim._main currently reads owner, board_number, station_field and stations once from
      fleet["board"], validates the three station options against that one board, and then either
      does a targeted per-repo lookup or one whole-board poll query. That single-board shape is the
      defect: --repo is optional, so in poll mode the tool queries a board before it knows which
      repository it is serving.

      Restructure so that everything board-shaped is scoped to one repository at a time. Build the
      list of repositories to serve first: every entry in fleet["repos"], filtered to args.repo when
      it is given, and refuse with the existing factory_cli.refuse shape when args.repo names a
      repository the fleet does not declare (factory_config.repo_entry already raises the right
      FleetError - let it propagate rather than writing a second message).

      For each repository in that list, in fleet order, resolve its board with
      factory_config.board_for(fleet, repo_name) and take owner, number, station_field and stations
      from that mapping. Keep the pre-flight station validation exactly as it is today, including its
      message text, but run it PER BOARD and name that repository's board number in the message, so a
      mismatch on one repository still identifies which fleet entry is wrong. Two repositories may
      legitimately resolve to the same board number; validating it twice is a wasted read, not a bug,
      and de-duplicating the validation is not required.

      The comment above that validation - the one beginning "validate the fleet's three station
      option names against the board, BEFORE any board read" - asserts a whole-run invariant that
      this restructure retires: validation is now per board, and it is before that board's reads, not
      before all reads. MOVE the comment with the code and reword it to the invariant that actually
      holds, so no comment in the file states the superseded contract. This is a deliberate change,
      not drift.

      Then, per repository: in targeted mode (args.issue given) call
      factory_gh.issue_board_item_id(repo_name, args.issue, that repository's board number) and stop
      at the first non-None id, exactly as the current loop does. In poll mode call
      factory_gh.project_items with that repository's owner, board number and a query built from that
      repository's own station_field and ready option name. Collect the items from every repository
      into one candidate list, tag each candidate with the repository it came from, and keep the
      existing sort by issue number across the merged list so the claim order does not change for a
      single-repository fleet.

      DE-DUPLICATE the merged candidate list on (repo_name, issue_number) before the candidate loop.
      Two fleet entries may declare the SAME board number, and in poll mode each of them issues the
      same whole-board project_items query, so every item on that board arrives once per entry
      served. Today nothing collapses those copies deliberately - the duplicate loses the create_ref
      race or is skipped by the factory:claimed label, which is a side effect, not a rule.

      MAKE THE TIE-BREAK EXPLICIT rather than incidental. Two repositories can carry the same issue
      number, so sorting on the issue number alone leaves the order between them decided by Python's
      stable sort over fleet order. That is the order to keep, but state it: sort the merged list on
      (issue_number, index of the repository in fleet["repos"]), and say in a comment that fleet
      order is the documented tie-break. Behaviour is unchanged; what changes is that it is now
      chosen.

      The candidate loop below is unchanged apart from taking each candidate's board values from the
      repository it was tagged with. The "issue not found on the board" refusal must now name every
      board that was searched, not one.

      STEP 6 IS NOT PART OF THE CANDIDATE LOOP AND MUST BE REBOUND. The winner-only bookkeeping
      block below the loop ends with
      factory_gh.project_field_set(owner, board_number, item_id, station_field, stations["building"])
      - the tool's only board mutation - and all four of owner, board_number, station_field and
      stations are today the module-level values this task deletes. Take all four from the board of
      the repository the WINNER was tagged with, not from the last repository the loop happened to
      visit. Leave the ordering of add_label, assign and project_field_set exactly as it is.

      In test-factory-claim.py, migrate the fleet fixture to a per-repo board and add cases proving:
      a two-repo fleet on two different board numbers issues its poll query against BOTH boards, each
      with its own station_field and ready option name; a candidate found on repository A is claimed
      using A's board number and never B's; station validation failing for repository B still names
      B's board number in the refusal; and --repo filters the served set to one repository so only
      that repository's board is read at all. Add one more: a two-repo fleet whose entries declare
      the SAME board number produces exactly one candidate per issue, and the claimed issue gets
      exactly one project_field_set call. Assert on the recorded gh call arguments, not on counts
      alone - equal call counts would pass while the wrong board was addressed.

      ONE MORE CASE, AND IT IS SC-13's SOLE EVIDENCE. Add a case in which the fleet declares TWO
      repositories on two different board numbers and --repo names the one whose ready station
      returns NO items: assert stdout is empty, that stderr carries "no work available", and that
      the exit code is 1 (factory_cli.EXIT_NOTHING). The existing case labelled C1 does not cover
      this and cannot be stretched to: its recorder is given an empty item list for the WHOLE run
      against a single-repository fixture, so it exercises the global empty case only. The mutant
      this case exists to kill is specific to the per-repository loop this task introduces - a loop
      that treats an empty repository as a "continue" and falls off the end of the served set into a
      normal exit 0, leaving the operator with silence where a report belongs. Anchor the new case
      on its own descriptive check text rather than on a case ordinal, since the ordinals shift.

  - id: T-03
    title: Point factory_decompose at the board of the repository it is publishing
    traces: [REQ-01]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/factory_decompose.py
      - .claude/skills/harness/bin/test-factory-decompose.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      factory_decompose._main takes --repo as a required argument and already calls
      factory_config.repo_entry(fleet, args.repo) at step 1, so the repository is known before any
      board read. Replace the hoisted block that reads owner, board_number and station_field from
      fleet["board"] and calls _validate_stations with fleet["board"]["stations"] so that all four
      values come from factory_config.board_for(fleet, args.repo). Keep the hoist where it is, before
      ensure_labels - it exists so a station typo is caught before the point of no return, and moving
      it would reopen the defect that placed it there.

      Replace the call factory_config.station(fleet, "ready") in step 7 with
      factory_config.board_station(fleet, args.repo, "ready"). This is the only in-tree caller of the
      two-argument station(), and T-08 deletes that function once this task has moved off it.

      The comment sitting immediately above that hoist names fleet["board"] as the thing whose reads
      used to sit further down. Reword it so it names the per-repo board resolution instead: after
      this task no line in this file, comment included, mentions a fleet-level board, and a criterion
      greps for exactly that.

      Change no other behaviour: the ledger, the dispositions, the parent handling and the
      record-after-project_field_set ordering all stay as they are.

      In test-factory-decompose.py, migrate the fleet fixtures to a per-repo board and add a case
      with two repos entries on two different board numbers proving that publishing --repo A adds
      every item to A's board and issues no call against B's, and a case proving the ready option
      name used for the station set is A's own, not B's. Assert on the recorded gh call arguments.

      One existing fixture in that file mutates a station name through the fleet-level block - the
      line that sets a bad ready option to "Redy" indexes the fleet's board directly. It must move to
      the per-repo path with its assertion and its case name untouched; it is one of the sites the
      fleet-level-board sweep counts.

  - id: T-04
    title: Point factory_land at the board of the repository it is landing in
    traces: [REQ-01]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness/bin/factory_land.py
      - .claude/skills/harness/bin/test-factory-land.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      factory_land._main takes --repo as a required argument and already resolves the repos entry
      before anything else. In step 5, replace the four reads of fleet["board"] - owner, number,
      station_field, and stations["review"] read directly - with values taken from
      factory_config.board_for(fleet, args.repo). Use the mapping's own stations["review"] rather
      than reintroducing a helper call, so the read stays one lookup deep and matches the surrounding
      code.

      THE IDIOM SPLIT IS DELIBERATE, so record it in a comment beside that read rather than leaving a
      later reader to tidy it away. This file indexes board["stations"]["review"] directly while
      factory_decompose goes through factory_config.board_station. Both are safe for one reason and
      only one: load_fleet validates every board's stations mapping to a key set of exactly ready,
      building and review, so the direct index cannot miss. If that validation is ever relaxed, the
      direct index is the call site that breaks first.

      Change nothing else. The default-branch guard, the push, the pull-request create-or-adopt path
      and the explicit open-check keep their current order and their current messages, including the
      known out-of-scope behaviour on a closed issue.

      In test-factory-land.py, migrate the fleet fixture to a per-repo board and add a case with two
      repos entries on two different board numbers proving that landing --repo A sets the station on
      A's board with A's review option name and issues no call against B's board. Assert on the
      recorded gh call arguments rather than on call counts.

  - id: T-05
    title: Migrate the factory integration fixtures to per-repo boards
    traces: [REQ-01]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: [T-02, T-03, T-04]
    status: done
    files:
      - .claude/skills/harness/bin/test-factory-integration.py
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind integration
    intent: |
      test-factory-integration.py writes fleet declarations carrying a fleet-level board block and
      drives the tools end to end as real processes. Move each of those fleet fixtures to the new
      shape: delete the top-level board block and give every repos entry its own board block with the
      same owner, number, station_field and stations values the fixture used before, so no case
      changes what it asserts.

      Then add one case that only this file can carry, because it is the only place the tools run as
      real processes and compose: a fleet declaring two repositories on two different board numbers,
      driven through decompose then claim then land against one of them, asserting that every gh
      invocation recorded for the run names that repository's board number and never the other's.

      EXACTLY TWO existing sites legitimately change, and no others. Both read the fleet-level board
      and both become impossible once the fixture moves, so they are part of the fixture move rather
      than exceptions to it:

      1. The (D-config) success case asserting that --show's payload carries board and repos - the
         check whose message ends "payload carries board and repos", currently
         "board" in payload and "repos" in payload. Replace the condition with all three of:
         "repos" in payload, "board" not in payload, and
         payload["repos"][0]["board"]["number"] == 9. Keep the case name; update the message text to
         say the payload carries repos, each with its own board, and no fleet-level board. That is
         the contract T-01's intent states, it is stable at both boundaries because T-08 only makes
         a top-level board harder to produce, and it gives this file real discrimination instead of
         a presence check that passed on either schema.
      2. The line that reads the ready option out of the fixture as fleet_data board stations ready,
