decisions:
  - id: D-01
    choice: >-
      The shared boundary rule moves into a new module .claude/skills/harness/bin/harness_boundary.py,
      imported lazily by both guard heredocs exactly as harness_yaml already is, and it exports a
      classify() returning a structured verdict rather than the five raw functions.
    because: >-
      select_base returns a triple whose decision is finished by its consumer in check-domain.sh
      domain_check, so moving only the five module-scope functions would recreate the drift in the
      consumer instead of removing it.
    dec: none
  - id: D-02
    choice: >-
      An out-of-place worktree is identified from the checkout's own .git pointer file - owning root
      is two levels above .git/worktrees/<id>, legitimate only if the checkout sits under
      <owning root>/.claude/worktrees/ - and no git subprocess is invoked on any governed write path.
    because: >-
      The operator declined a git worktree list call on every governed write; the pointer file is a
      filesystem read, it is self-describing, and it also catches the case where the session root IS
      the out-of-place worktree.
    dec: none
  - id: D-03
    choice: >-
      The creation refusal is BROAD over git worktree add and git worktree move, refuses an
      undeterminable or relative destination, and deliberately does not cover git clone or git init.
    because: >-
      A narrow rule fails silently at exit 0, which is the defect shape this feature exists to kill;
      clone and init materialise a different repository that carries no manifest and no agents, so
      nobody is misled into believing it is governed.
    dec: none
  - id: D-04
    choice: >-
      check-state.sh gains INV-25, which reports an out-of-place linked worktree as a FAILURE rather
      than a warning.
    because: >-
      The guards now refuse writes in that tree, so the environment really is broken; a warning line
      is the same silence in a quieter font.
    dec: none
  - id: D-05
    choice: >-
      The two out-of-place worktrees alive today are tagged and pruned rather than migrated, and the
      new module gets no test file of its own.
    because: >-
      Nothing is stranded - r6 is clean - but its commit 52d8334 is not an ancestor of main, so a tag
      is what keeps it recoverable; run-unit-tests.sh keeps explicit script arrays whose drift
      detector fails the whole run on an unregistered test file, and behavioural coverage through
      both guards is stronger evidence than a unit test of the extracted functions.
    dec: none
  - id: D-06
    choice: >-
      Every import of harness_boundary that sits on a path which can produce a verdict is wrapped in
      try/except, prints a BLOCKED line naming the missing module, and exits 2. There are three,
      enumerated rather than described: check-domain.sh line 493 under if _run_domain, the
      check-domain.sh --resolve branch before line 357, and bash-write-guard.sh line 73. The
      shape-phase import at check-domain.sh line 529 is NOT one of them - it keeps its absorbing
      except and takes no dependency on the new module.
    because: >-
      An unhandled ImportError exits 1, and exit 1 is non-blocking (check-domain.sh line 14), so an
      unimportable shared module would turn enforcement silently OFF on both routes at once - the
      same failure direction as issue 103, installed inside its own fix. Exit 2 cannot lock the
      repository out of its own repair: line 493 is gated on _run_domain, which is _governed and not
      _post (lines 432, 450, 471), so the main session never reaches it; --resolve blocks no write,
      so exit 2 there is a loud refusal to answer a query rather than a denied write; and
      harness-dev-ops returns before line 73 on the Bash route (bash-write-guard.sh lines 54-59).
      Line 529 is excluded because it is not gated on _governed and the shape gate needs nothing
      from the module, so failing closed there would block the main session's own writes.
    dec: none
  - id: D-07
    choice: >-
      T-03 preserves the Bash route's outside-repo pass-through for product paths. The .. continue
      runs after classify but only when the outcome is not out_of_place_worktree, so paths under
      workspace_root and a product name keep exactly today's Bash-route behaviour and no criterion
      is added for product-base enforcement there.
    because: >-
      rel at bash-write-guard.sh line 400 is ROOT-relative, so every product path starts with .. and
      dropping the continue in favour of classify's own not_a_domain_question would begin enforcing
      product-base domains on the Bash route for the first time. The grilling's Out of scope section
      fences out changing how .claude/worktrees/ or the product workspace are governed, and that
      fence is binding, so the widening is not this feature's to make.
    dec: none
  - id: D-08
    choice: >-
      The resolver/hook divergence T-02 opens is LEFT standing and recorded rather than closed:
      after T-02 the Write hook refuses a governed write when the session root is an out-of-place
      worktree, while check-domain.sh --resolve still names owners from inside one.
    because: >-
      --resolve exits at check-domain.sh lines 326-417, before _governed is computed at line 432 and
      before domain_check runs at all. It is a read-only query path that writes nothing, so REQ-02
      does not reach it, and refusing there would make the planning tool unusable from the very tree
      an operator must inspect to diagnose the problem. The cost is that a plan resolved from inside
      such a tree still resolves; INV-25 from T-05 reports that tree at session entry, which is the
      loud signal.
    dec: none
  - id: D-09
    choice: >-
      The root-side check sits at the START of domain_check rather than at module level, so on the
      Write route it is parser-contingent. In a PyYAML bootstrap-grant session the Write route
      therefore does NOT refuse an out-of-place session root while the Bash route, which has no
      domain_check, still does. That divergence is accepted, REQ-02 carries no no-PyYAML clause, no
      criterion asserts the parser-missing case on either route, and the Bash route is deliberately
      NOT moved below its own _no_parser exit to make the two symmetric. Taken in the 2026-08-11
      re-scope and reversible at signature: restoring the module-level hoist restores the clause and
      the assertion cluster on both routes.
    because: >-
      The bootstrap grant already skips domain_check in the REAL checkout, so it opens the same
      escape everywhere and a stray-worktree session under the grant is no worse off than a
      sanctioned one. The TARGET-SIDE refusal is parser-contingent on this route already, since it
      is wired into classify and only domain_check calls classify, so the root-side check now
      matches what this plan had already accepted. And the rooted case is a lost-work risk rather
      than an enforcement hole - re-measured at a29ad06, a rooted session's out-of-domain and
      over-cap writes are already refused under DEC-180 and issue 132 - so it does not earn an
      assertion cluster on both routes. The cost, recorded rather than hidden: the two write routes
      disagree in exactly one session shape, and a future scan will re-propose closing it by
      hoisting. Weakening the Bash route to match would degrade a working route to the level of a
      deliberately weakened one, so the divergence is the cheaper side of the trade.
    dec: none

tasks:
  - id: T-01
    title: Extract the shared boundary rule into harness_boundary.py and make check-domain.sh use it
    traces: [REQ-05, REQ-06, REQ-09]
    change_type: cross_module
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out - check-domain.sh is a registered PreToolUse gate script
    depends_on: []
    status: pending
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/check-domain.sh
    verify: |
      python3 .claude/skills/harness/bin/test-check-domain.py && python3 .claude/skills/harness/bin/test-bash-write-guard.py && grep -q '^def select_base' .claude/skills/harness/bin/harness_boundary.py && grep -q '^def classify' .claude/skills/harness/bin/harness_boundary.py && ! grep -q '^def select_base' .claude/skills/harness/bin/check-domain.sh
    intent: |
      Create .claude/skills/harness/bin/harness_boundary.py and move the boundary rule into it from
      the embedded Python heredoc in .claude/skills/harness/bin/check-domain.sh. This task changes
      NO behaviour: both existing suites must pass unchanged afterwards, with no case edited.

      Move into the module, verbatim except where stated: glob_to_re, matches, is_control_plane_glob,
      real, resolve_fleet, select_base, is_control_plane_target, and the HARNESS_CONTROL_PLANE list.

      Also move the DECISION LOGIC that currently lives in check-domain.sh's domain_check, at the
      block starting with the comment THE FLEET AND THE BASE and ending at the sys.exit(2) of the
      actionable rejection. Expose it as one function:

        classify(abs_target, root, globs, shared, label) -> verdict

      where verdict is a small object or dict carrying: outcome, one of not_a_domain_question,
      allow, shared, deny; rel, the base-relative path; base; and advertise plus shared_advertise,
      the two lists the Permitted for you line prints. classify performs, in this order, exactly
      what domain_check does today: resolve_fleet, real on the target, select_base, the None base
      early return, the glob filtering through the returned filter, rel via os.path.relpath against
      the selected base, the DEC-143 worktree prefix stripping regex on rel producing rel_candidates,
      the two matches loops gated by target_side_test, and the base == abs_root advertise
      computation. classify RETURNS its verdict and does NOT print the agent-facing BLOCKED lines -
      check-domain.sh keeps printing those, with the same wording, from the returned fields.

      Hold the legitimate worktree location as ONE named module-level constant in
      harness_boundary.py - the segment .claude/worktrees - and have every rule that needs it read
      that constant, including the DEC-143 rel-stripping regex you are moving. T-03 mutates that
      constant by name to prove there is one implementation, so a second spelling of the literal
      makes that proof mean less than it looks.

      THE REWIRING IS SCOPED TO harness_boundary.py's OWN RULES, AND NOWHERE ELSE. Two further
      occurrences of the literal survive in check-domain.sh and BOTH KEEP their literals: the
      DEC-143 stripping regex inside the _norm helper, and the .claude/worktrees prefixes built
      into SWEEP_GLOBS. Both belong to the SHAPE phase, which takes no dependency on this module -
      the shape-phase import at line 529 is deliberately absorbing and is a FORBIDDEN import site
      below - so reading a boundary-module constant from either one would give the shape gate a
      dependency the fail-closed rule then blocks the main session on. Do not rewire them, and do
      not treat their surviving literals as a second spelling of the rule: the mutation proof
      targets the module constant by name and never greps the tree.

      Three constraints that are not free:

      1. LAZY IMPORT, AT TWO NAMED SITES AND NO OTHERS. check-domain.sh has exactly three candidate
         positions and they do not behave alike, so enumerate rather than reason by analogy:
           - REQUIRED: inside the if _run_domain: block at line 493, immediately after
             import harness_yaml. This serves domain_check.
           - REQUIRED: on the --resolve path, before that branch's first use of a moved function at
             line 357. --resolve exits at lines 326-417, so it never reaches line 493 and cannot
             borrow that import.
           - FORBIDDEN: the shape-phase try/except at line 529. That import is deliberately
             absorbing, it is NOT gated on _governed, and the shape gate needs nothing from this
             module, so a fail-closed import there would block the main session's own writes.
         The comment at check-domain.sh line 292 records why the import is lazy at all: a top-of-file import made a
         hook whose module is missing crash before it could print the DEC-101 no-manifest fail-open
         message, and test-check-domain.py's isolated-copy case catches it. Do not regress that case.
      2. BOTH REQUIRED IMPORTS FAIL CLOSED. Wrap each:

           try:
               import harness_boundary
           except Exception as e:
               print to stderr: check-domain: BLOCKED - the boundary module
               harness_boundary.py could not be imported, so no domain can be checked, followed by
               the exception text and a line saying enforcement is CLOSED rather than partial and
               naming .claude/skills/harness/bin/harness_boundary.py as the file to restore.
               sys.exit(2)

         Not optional and not defensive padding: unhandled, the ImportError exits 1, exit 1 is
         NON-BLOCKING (check-domain.sh line 14), the write lands and enforcement goes silently off
         on both routes at once - the same failure direction as issue 103, installed inside its own
         fix. Exit 2 is safe at the line 493 site because _run_domain is _domain_phase which is
         _governed and not _post (lines 432, 450, 471), so the main session - the tier that must
         repair the file - never reaches it. It is safe on --resolve because that branch answers a
         query and blocks no write: exiting 2 there is a loud refusal to answer, which is the right
         answer from a resolver whose rule is missing. D-06 records both.
      3. THE HOOK LABEL. resolve_fleet and select_base currently print check-domain: BLOCKED ... and
         call sys.exit(2) themselves, for the unloadable fleet file and for a path under the
         workspace belonging to no declared repository. In the module those two must take the hook
         label as a parameter and emit it in the message, so a second caller cannot print a verdict
         naming the wrong hook. check-domain.sh passes the string check-domain.

      REWIRE THE --resolve BRANCH TOO. It is a second caller of the functions you are moving:
      resolve_fleet at check-domain.sh line 357, select_base at lines 361-362 and matches at lines
      399 and 405. Left alone it calls undefined names, and constraint 3 gives two of them a new
      signature it must satisfy - so --resolve passes the label check-domain as well. Its import is
      the second REQUIRED site named in constraint 1. test-check-domain.py drives 10 --resolve
      cases, so this task's verify catches an omission here.

      Do NOT add a refusal to the --resolve branch for an out-of-place session root. D-08 records
      that the divergence T-02 opens is left standing deliberately: --resolve exits at lines 326-417
      before domain_check runs, it writes nothing, and refusing there would make the planning tool
      unusable from the tree an operator must inspect.

      Leave bash-write-guard.sh untouched in this task.
  - id: T-02
    title: Refuse writes into, and sessions rooted in, an out-of-place worktree on the Write route
    traces: [REQ-01, REQ-02, REQ-09]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out - check-domain.sh is a registered PreToolUse gate script
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/harness_boundary.py
      - .claude/skills/harness/bin/check-domain.sh
      - .claude/skills/harness/bin/test-check-domain.py
    verify: |
      python3 .claude/skills/harness/bin/test-check-domain.py
    intent: |
      Close the write door of issue 103 on the Write and Edit route. A linked git worktree of this
      repository that does not live under .claude/worktrees/ is a mistake, not a supported shape: it
      is REFUSED, never resolved onto the globs. No git subprocess may be invoked.

      In .claude/skills/harness/bin/harness_boundary.py add:

        worktree_owner(path) -> (checkout_dir, owner_root, legitimate) or None

      It walks up from path to the first directory containing a .git entry. If .git is a directory,
      that checkout is a main checkout: return with owner_root equal to the checkout and legitimate
      True. If .git is a FILE, read it; its content is a single line of the form
      gitdir: <abs>/.git/worktrees/<id>. The owning repository root is two directory levels above the
      worktrees entry, that is the parent of the .git directory in that pointer. The checkout is
      legitimate only when the checkout directory itself is inside owner_root joined with the named
      legitimate-location constant T-01 introduced - do not spell the literal again here, T-03
      mutates that constant by name - compared with os.path.commonpath over realpath-resolved
      absolute paths, never a string prefix.
      Anything unreadable, malformed or not matching that shape returns None, which means unknown and
      is treated as not-a-worktree.

      Wire it into classify at the branch where select_base returns a None base - the branch whose
      comment today reads NOT A DOMAIN QUESTION. Before returning not_a_domain_question, call
      worktree_owner on the target. If it returns a checkout whose legitimate flag is False, return
      a new outcome out_of_place_worktree carrying the checkout directory and the expected location
      <owner_root>/.claude/worktrees/. Targets that are not inside any worktree - /tmp, an unrelated
      clone, a scratch script - keep exactly today's behaviour and still return
      not_a_domain_question. Nothing on the two legitimate bases reaches this branch at all.

      Add the ROOT-SIDE check too, and it is not the same case: when CLAUDE_PROJECT_DIR is itself an
      out-of-place worktree, that tree carries its own .harness/team-config.yaml, so root resolves to
      it and writes that are in-domain FOR THAT ROOT succeed at exit 0.
      ITS GROUNDS, STATED NARROWLY, because the wider version is false at a29ad06. Such a session is
      NOT ungoverned: DEC-180 and issue 132 made the shape caps fire relative to whatever root the
      session stands in, and the domain rules resolve against that root correctly - a 211-line
      feature.yaml, a 70-line handoff note and an out-of-domain bin/ script all exit 2 from a rooted
      session, re-measured at a29ad06 in
      .harness/features/FEAT-17-guard-boundaries/notes/answers-2026-08-11-rescope.md. What is left is
      that the session's work lands in a checkout nobody merges. This check refuses the LOCATION, on
      the standing ruling that an out-of-place worktree is a mistake rather than a supported shape.
      Do not justify it as closing an enforcement hole; that justification was overtaken.

      PLACE THE ROOT-SIDE CHECK AT THE START OF domain_check, ahead of the
      harness_yaml.manifest_domains call, and NOT at module level. root, manifest and agent are
      module-scope globals already visible there. Call worktree_owner on root; if it returns a
      checkout with legitimate False, print the verdict and exit 2.

      THE PLACEMENT IS PARSER-CONTINGENT AND THAT IS CHOSEN, NOT OVERLOOKED. domain_check is called
      at check-domain.sh line 676 under if _run_domain and not _no_parser, so in a bootstrap-grant
      session - PyYAML missing, _no_parser true - the Write route does NOT refuse an out-of-place
      root while the Bash route, which has no domain_check, still does. Three reasons that is right
      here: the bootstrap grant already skips domain_check in the REAL checkout, so it opens the same
      escape everywhere and a stray-worktree session is no worse off than a sanctioned one; the
      TARGET-SIDE refusal above is parser-contingent on this route already, because it is wired into
      classify and only domain_check calls classify; and the rooted case is a lost-work risk rather
      than an enforcement hole, so it does not earn a second assertion cluster on both routes. The
      divergence is recorded in BRIEF.md under the heading naming what the root-side rule
      deliberately does not cover. Do NOT close it by hoisting this check above line 675, and do NOT
      close it by moving the Bash route's check below its own _no_parser exit - that would weaken a
      working route to match a deliberately weakened one.

      THE EFFECTIVE GATE IS THEREFORE _run_domain AND NOT _no_parser, and the cost is stated rather
      than hidden. That gate is strictly narrower than _run_domain, so both properties this placement
      needs still hold: the main session and post mode stay exempt - the tier that must repair the
      file is never blocked - and DEC-101's deliberate fail-open on a manifest-less tree is not
      regressed, because _run_domain is already false there (lines 490-491). Gating on _domain_phase
      instead would fire on a tree with NO manifest, where root falls back to the cwd: any linked
      worktree of any unrelated, un-onboarded repository would then be refused. The cost of this gate
      is that a manifest-less or a parser-less out-of-place worktree gets NO root-side refusal on the
      Write route. That is acceptable because domain enforcement is already off in those two sessions
      - by DEC-101 and by the bootstrap grant respectively - not because it does not matter, and
      every fixture below gives each checkout used as a session root its own manifest.

      Both verdicts print, to stderr, in check-domain.sh, and the two wordings are NOT the same:
        - TARGET-SIDE, a write into a sibling worktree from outside it:
          check-domain: BLOCKED - <path> is inside a git worktree that is not under
          .claude/worktrees/, followed by a line naming <owner_root>/.claude/worktrees/ as where
          worktrees belong, and a line saying the tree should be removed with git worktree remove
          rather than written into. This wording is correct here and stays.
        - ROOT-SIDE, the session is standing in that tree: the same first two lines - the BLOCKED
          line and the line naming <owner_root>/.claude/worktrees/ as where worktrees belong - and
          then a line saying to start the session from the main checkout or from a checkout under
          that location instead. The root-side verdict MUST NOT carry the removal guidance. Measured
          by visual-designer: git worktree remove SUCCEEDS with exit 0 when run from inside the tree
          it removes, so the target-side wording, printed to a session whose cwd is that tree, is an
          instruction to delete the ground the session is standing on.
      The literal string .claude/worktrees must appear in BOTH outputs - a criterion asserts it. The
      literal string git worktree remove must NOT appear in the ROOT-SIDE output - the same
      criterion asserts its absence, because a presence-only assertion passes unchanged if the
      destructive sentence is re-added beside it.

      In .claude/skills/harness/bin/test-check-domain.py add cases built WITHOUT invoking git, so the
      suite never creates the shape the guard now forbids. Stand the fixture up as follows: make a
      tempdir root, write <root>/.harness/team-config.yaml granting .harness/allowed/** to
      harness-backend-dev, create the directory <root>/.git/worktrees/sib, create a sibling directory
      <tmp>/sib holding a .git FILE whose single line is gitdir: <root>/.git/worktrees/sib, and
      create <root>/.claude/worktrees/wt holding a .git FILE whose line is
      gitdir: <root>/.git/worktrees/wt with the matching directory. Give BOTH <tmp>/sib and
      <root>/.claude/worktrees/wt their own .harness/team-config.yaml carrying the same
      .harness/allowed/** grant, since each is used as a session root below and a root with no
      readable manifest falls to the DEC-101 fail-open and proves nothing.

      WHY EVERY IN-ROOT FIXTURE PATH IS UNDER .harness/ AND NOT allowed/. Inside the harness base a
      glob match is accepted only if the TARGET passes is_control_plane_target
      (check-domain.sh lines 277-289, wired as the harness base's unconditional target-side test at
      lines 249-253). That test passes a first path segment of .harness or .claude, and otherwise
      only the CLOSED four-entry HARNESS_CONTROL_PLANE list at lines 149-154. A grant of allowed/**
      therefore cannot permit <root>/allowed/x.txt - it exits 2 for exactly the reason SC-05 asserts
      <root>/src/main.py exits 2. Do not restore the shorter paths.

      Then assert, each on an exact exit code:
        - Write to <tmp>/sib/allowed/x.txt exits 2 and stderr contains .claude/worktrees. FORBIDDEN.
          The sibling is outside root, so select_base returns None and no grant can reach it - this
          case discriminates whatever the manifest says.
        - Write to <root>/.harness/allowed/x.txt exits 0. The paired allow, same fixture.
        - Write to <tmp>/sib/.harness/allowed/x.txt with CLAUDE_PROJECT_DIR set to <tmp>/sib exits 2.
          FORBIDDEN, root-side. The target is deliberately control-plane and in-domain FOR THAT
          ROOT: it exits 0 if the root-side rule is absent and 2 only because of it. A target of
          <tmp>/sib/allowed/x.txt would exit 2 from the ordinary glob rule with the root-side rule
          deleted, and would prove nothing.
          ASSERT THE WORDING ON THIS CASE, both halves, on the same captured stderr: it CONTAINS the
          substring .claude/worktrees, and it does NOT contain the substring git worktree remove.
          Both are needed. Presence alone passes unchanged if the destructive sentence is re-added
          beside the location line, which is the regression being guarded; absence alone passes for
          a verdict that says nothing at all. Scope the negative assertion to THIS case's stderr -
          the target-side verdict keeps that guidance, so a file-wide or tree-wide grep for the
          string would fail against correct code.
        - The same relative payload with CLAUDE_PROJECT_DIR set to <root>/.claude/worktrees/wt and
          the target <root>/.claude/worktrees/wt/.harness/allowed/x.txt exits 0. The paired allow
          for the root-side rule: same shape, legitimate location.
        - NO BOOTSTRAP-GRANT CASE IS ADDED ON THIS ROUTE, deliberately. The 2026-08-11 re-scope cut
          it with the module-level hoist it existed to pin. Do not add one back here: with the check
          inside domain_check it would assert exit 2 in a session where domain_check never runs, so
          it would fail against correct code.
        - Write to /tmp/<something>/x.txt outside any worktree still exits 0, so the change did not
          widen into ordinary scratch paths.
        - THE FAIL-CLOSED PAIR for the shared module (D-06). Build an isolated copy carrying
          check-domain.sh and harness_yaml.py but NOT harness_boundary.py. With the root manifest
          PRESENT, a governed write exits 2 and stderr names harness_boundary. With the manifest
          ABSENT, the existing DEC-101 case at test-check-domain.py lines 163-174 still prints
          enforcement OFF and exits 0. Without that second half the first is satisfied by a guard
          that blocks everything.
  - id: T-03
    title: Make bash-write-guard.sh decide from the shared module, closing issue 261 and the Bash half of 103
    traces: [REQ-01, REQ-02, REQ-04, REQ-05, REQ-06, REQ-09]
    change_type: bugfix
