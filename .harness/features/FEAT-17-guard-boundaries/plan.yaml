  - id: T-04
    title: Refuse creation of a worktree outside .claude/worktrees at the Bash route
    traces: [REQ-03]
    change_type: bugfix
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out - bash-write-guard.sh is a registered PreToolUse gate script
    depends_on: [T-03]
    status: pending
    files:
      - .claude/skills/harness/bin/bash-write-guard.sh
      - .claude/skills/harness/bin/test-bash-write-guard.py
    verify: |
      python3 .claude/skills/harness/bin/test-bash-write-guard.py
    intent: |
      Close the creation door of issue 103. Measured at a29ad06,
      git worktree add --detach ~/GitHub/harness-SIBLING HEAD exits 0 from both hooks. Catching the
      mistake after the tree exists is worth less than preventing it.

      Add a scan to .claude/skills/harness/bin/bash-write-guard.sh over the already-computed tokens
      list, which is the per-segment shlex split of the command. It fires when a segment's command
      basename is git and its first non-flag operand is worktree with the next operand add or move.
      This scan MUST run before the existing early exit if not findings: sys.exit(0) near line 320 -
      git produces no findings, so placed after it the check is dead code.

      Determining the destination:
        - For add, the destination is the first remaining operand after the subcommand, skipping
          flags. -b, -B and --reason each CONSUME the following token, so skip two for those;
          --detach, --force, -f, --checkout, --no-checkout, --lock and --quiet consume nothing.
        - For move, the destination is the SECOND remaining operand.
        - If the destination is a RELATIVE path, refuse. It cannot be resolved: the Bash payload
          carries a command and not a working directory, and resolving it against root would read
          git worktree add .claude/worktrees/FEAT-99 issued from an unrelated directory as
          legitimate, which is a silent permit of the exact mistake. Say in the verdict that an
          absolute path under .claude/worktrees/ is required.
        - If no destination can be determined at all, refuse for the same reason. Failing loudly on
          an unparsed form is the whole point; failing open reproduces the defect.
      RESOLVE BOTH SIDES WITH os.path.realpath BEFORE COMPARING, not just the destination. Permit
      when the realpath-resolved destination is inside the realpath-resolved
      <root>/.claude/worktrees/, compared with os.path.commonpath. Refuse otherwise, with a verdict
      naming <root>/.claude/worktrees/ as where worktrees belong.

      Both sides, and it is one or the other rather than a preference. bash-write-guard.sh derives
      root at lines 61-66 with os.access alone and never resolves it, so resolving only the
      destination compares two different spellings of the same tree: on darwin the test fixture is
      mkdtemp, which returns /var/folders/..., while realpath returns /private/var/folders/... -
      commonpath then returns / and T-04's paired allow goes RED against correct code. Resolving
      NEITHER also makes the fixture pass and was the cheaper branch, and it is rejected on
      substance: with no resolution the comparison is string-level, so
      git worktree add <root>/.claude/worktrees/../../../tmp/sib is judged inside .claude/worktrees/
      and permitted - a silent permit of the exact mistake this task exists to refuse. Resolving
      both closes that and the symlink form of it together.
      Do this with a LOCAL resolved copy of root inside this scan. Do not reassign the module-level
      root or change how lines 61-66 derive it: every other rule in this file compares against the
      unresolved root, and changing that would alter behaviour no criterion here covers. The task
      stays execution_mode main-session-direct, which it already is - bash-write-guard.sh is a
      DEC-174 carve-out and this is a change to its production code.

      Do NOT extend this to git clone or git init. They materialise a different repository, which
      carries no .harness/team-config.yaml and no agents, so no agent is misled into believing that
      tree is governed - which is the harm issue 103 records. Every other git subcommand is
      untouched.

      In .claude/skills/harness/bin/test-bash-write-guard.py, using fixture() and fire(), assert
      exact exit codes:
        FORBIDDEN, all 2: git worktree add /tmp/sib-xyz HEAD;
        git worktree add -b feat/x /tmp/sib-xyz HEAD, proving a flag cannot hide the destination;
        git worktree add sib HEAD, the relative form;
        git worktree move <root>/.claude/worktrees/wt /tmp/sib-xyz.
        PAIRED ALLOWS from the same fixture, all 0: git worktree add <root>/.claude/worktrees/FEAT-99
        HEAD; git worktree add --detach <root>/.claude/worktrees/FEAT-99 HEAD; git status
        --porcelain; git worktree list; git commit -m x.
      The ordinary-git allows are not decoration - they are what bounds the risk of the broad rule.
  - id: T-05
    title: Add INV-25 to check-state.sh reporting an out-of-place worktree at entry
    traces: [REQ-07]
    change_type: logic
    execution_mode: main-session-direct
    execution_reason: DEC-174 carve-out - check-state.sh is the fourth gate script named in CLAUDE.md
    depends_on: [T-01]
    status: pending
    files:
      - .claude/skills/harness/bin/check-state.sh
      - .claude/skills/harness/bin/test-check-state.py
    verify: |
      python3 .claude/skills/harness/bin/test-check-state.py
    intent: |
      An environment that already contains an out-of-place worktree must say so rather than run half
      governed. Add INV-25 to .claude/skills/harness/bin/check-state.sh. The highest invariant in the
      file today is INV-24, at the DEC-186 block; number the new one INV-25 and follow the file's
      existing shape for appending to the failure list.

      INV-25 runs git worktree list --porcelain against the root once, at session entry. This is the
      one place a git subprocess is acceptable: check-state runs once per session, not once per
      governed write, which is why the cost objection that kept it out of the two hooks does not
      apply here. If git is absent or the command fails, record nothing and do not fail - this
      invariant must never turn an unrelated environment into a red gate.

      DERIVE THE LEGITIMATE LOCATION ONCE, INTO ONE LOCAL VARIABLE, AND USE THAT SAME VALUE FOR BOTH
      THE COMPARISON AND THE MESSAGE. It is the .claude/worktrees/ directory of the MAIN CHECKOUT:
      the path carried on the FIRST entry git worktree list --porcelain returns, which is always the
      main checkout even when the command is run from inside a linked worktree, and which a
      repository with no linked worktrees still returns as itself - so the derivation is total. Do
      NOT derive it a second time anywhere in this invariant; two derivations can drift.
      The base is NEVER <root>/.claude/worktrees/. root is CLAUDE_PROJECT_DIR or the current working
      directory, so in exactly the session this invariant exists to catch - one whose root IS an
      out-of-place worktree - that base would mark every LEGITIMATE worktree under the main checkout
      as out of place and hand it destructive removal guidance.

      For every listed worktree other than the main checkout, the entry is out of place unless its
      path is inside that one derived legitimate location, compared with os.path.commonpath over
      realpath-resolved paths. The first porcelain entry plays two separate parts and they must not
      be fused: it is SKIPPED as the main checkout, and it SUPPLIES the base every other entry is
      compared against. An out-of-place entry goes to the FAILURE list, not the warning list:
      the write guards now refuse writes in such a tree, so the environment really is broken, and a
      warning is the same silence in a quieter font.

      THE MESSAGE ALWAYS NAMES THE PATH AND ALWAYS NAMES WHERE WORKTREES BELONG - that same derived
      legitimate location, read from the variable rather than rebuilt, so the message can name it
      without inventing a path. The REMEDY sentence then branches, and the branches are tested in
      this order:
        1. THE ENTRY IS THE SESSION'S OWN ROOT - realpath of the entry equals realpath of root. This
           branch tests against the SESSION ROOT and not against the legitimate location derived
           above; they answer different questions - am I standing in this tree, versus does this tree
           belong where it is - and they must stay two comparisons. The remedy is to start the session from the main checkout, or from a checkout under that
           location, instead. THIS BRANCH MUST NOT CARRY git worktree remove. Same reason FIX 2 took
           it out of the root-side hook verdict: visual-designer measured git worktree remove exiting
           0 when run from inside the tree it removes, so telling this session to remove that entry
           is telling it, at session entry, to delete the ground it is standing on.
        2. THE ENTRY IS MARKED PRUNABLE - the porcelain record carries a prunable line, which
           git worktree list --porcelain emits on its own, with no --verbose flag. The remedy is
           git worktree prune. This is safe in every case - a prunable entry is a stale
           administrative record whose tree is already gone from disk, so it can never be a live cwd.
        3. ANY OTHER OUT-OF-PLACE ENTRY. The remedy stays git worktree remove on that path. The
           session is not standing in it, so removal guidance is correct here and it STAYS - deleting
           removal guidance everywhere would be the opposite defect.
      Severity does not branch. Every out-of-place entry, in all three branches, goes to the FAILURE
      list and red-gates entry until it is cleared. Only the remedy sentence differs.

      In .claude/skills/harness/bin/test-check-state.py add a case that builds its fixtures with git
      directly - the test process is not the Bash tool route, so it may create these shapes - and
      runs them through the file's existing run(tmp) helper, which sets CLAUDE_PROJECT_DIR to the
      directory it is given and runs check-state.sh with that directory as cwd. If this lands as a
      new case function rather than an extension of an existing one, REGISTER it in main() alongside
      the other cases in the same task; an unregistered case never runs and passes vacuously. Build
      three temporary repositories, each with git init, one file and one commit:
        repo A: git worktree add <repoA>/.claude/worktrees/wt HEAD
        repo B: git worktree add <tmpdir-outside-B>/sib HEAD
        repo C: TWO worktrees, added with the same git worktree add mechanism -
          git worktree add <tmpdir-outside-C>/own HEAD, and
          git worktree add <repoC>/.claude/worktrees/legit HEAD. This repository's run is made with
          run() pointed at <tmpdir-outside-C>/own - the session's root IS the out-of-place worktree,
          while the main checkout is repo C itself. Repo C therefore holds exactly ONE out-of-place
          entry, its own root; the legit entry sits under the MAIN checkout's .claude/worktrees/ and
          is legitimate, so it must stay silent and cannot satisfy or break either half of the
          wording assertion below.
      EVERY DIRECTORY USED AS A RUN ROOT GETS THE FILE'S EXISTING make_fixture SCAFFOLD - repo A,
      repo B, and repo C's own-root worktree at <tmpdir-outside-C>/own. check-state.sh exits 1 with
      no .harness/ - project not onboarded before any invariant runs, so a bare worktree root would
      exit non-zero while printing no INV-25 line at all, and the assertions below could never be
      satisfied by correct code.
      Assert, on the run of each repository:
        - repo B prints a line containing INV-25 naming the sibling path, and exits non-zero.
          FORBIDDEN, asserted refused.
        - repo A prints NO line containing INV-25 - the paired allow from the same mechanism, without
          which the case cannot tell a working invariant from one that flags every worktree.
        - repo C prints a line containing INV-25 naming its own root path, and exits non-zero.
          FORBIDDEN, asserted refused, and the severity half of this assertion is what pins INV-25 as
          a failure in the own-root branch too.
        - THE BASE-DISCRIMINATING PAIRED ALLOW, same fixture, on repo C: NO INV-25 line in repo C's
          captured output contains the path of <repoC>/.claude/worktrees/legit. Scope this by path
          and not by the run - repo C legitimately prints one INV-25 line for its own root, so an
          assertion that the run prints no INV-25 line would contradict the FORBIDDEN half above.
