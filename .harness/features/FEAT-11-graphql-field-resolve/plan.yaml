      test "$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' .claude/skills/harness/bin/test-factory-claim.py)" = "44f6cf0a0f379869222f1628e3aeef6126927b043df10f9696437b4bd2e5eaac" || { echo "FAIL: test-factory-claim.py content no longer matches its planned hash, so a dependent test file was edited and the public signatures moved"; exit 1; }
      test "$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' .claude/skills/harness/bin/test-factory-land.py)" = "f3ca25684b1350f7757b8c5b8ce1c0cd8b7e3d2577130e1c63dab4b8b481ea0f" || { echo "FAIL: test-factory-land.py content no longer matches its planned hash, so a dependent test file was edited and the public signatures moved"; exit 1; }
      echo PASS
    intent: |
      TDD applies inside this task. Rewrite the affected cases in test-factory-gh.py FIRST, watch
      them fail against the unchanged factory_gh.py, then change factory_gh.py to make them pass.
      All THREE files are yours - factory_gh.py, test-factory-gh.py and test-factory-integration.py -
      and both test kinds must be green when you finish: the unit kind and test-factory-integration.py,
      which lives in the INTEGRATION kind and is therefore invisible to a unit-only run.

      WHY THIS EXISTS. gh project field-list costs 102 GraphQL points and gh project view costs 2,
      measured 2026-08-10 by differencing gh api rate_limit --jq .resources.graphql.used. The cost is
      in the query shape gh sends, not in the data returned - the same call with --limit 5 also costs
      102. project_field_set pays both on every call and runs inside the per-task loop at
      factory_decompose.py:444-458, so the factory exhausts the 5000-point hourly budget and stops.
      The single GraphQL query below returns all three values at cost 1, measured live the same day.

      THE MEASURED TRANSPORT - read this table before you write a single fixture. Every row was
      observed live on 2026-08-10 against this exact query document. THE EXIT CODE IS PART OF THE
      FIXTURE. A fixture written at exit 0 for a row that measured exit 1 certifies a response real
      gh never produces, and that is the defect this cycle exists to remove.

      ONE ROW CARRIES TWO ENVELOPES, and it is the only exception to the rule above. The
      organization row below was measured at exit 1 only because no org owning a REACHABLE board is
      reachable from this account - the exit 1 came from projectV2(number:) failing beneath the
      owner selection. An org that DOES own a reachable board returns exit 0 with projectV2
      populated. __typename is readable in both envelopes, which is why step 3b reads it before
      projectV2 and why the refusal must fire on either. SC-05 therefore requires BOTH org fixtures.
      The exit-code rule binds every other row absolutely.

        input                                  | exit | envelope on stdout
        ---------------------------------------|------|--------------------------------------------
        valid user / valid board / valid field | 0    | __typename User, projectV2.id, field + options
        unknown owner login                    | 0    | data.repositoryOwner is null, NO errors key
        field exists but is not single-select  | 0    | projectV2.id present, field is {} (EMPTY DICT)
        owner is an organization               | 1    | __typename Organization, projectV2 null, errors[]
        valid owner / board number not present | 1    | __typename User, projectV2 null, errors[]
        valid board / field name not present   | 1    | projectV2.id present, field null, errors[]

      On every exit-1 row, stdout still parses as JSON carrying BOTH data and errors; gh's own
      one-line diagnostic goes to stderr, not stdout. Verified by json.load on stdout alone.

      PART A - factory_gh.py.

      1. Add a module-level query constant and a private resolver:

         _project_field_resolve(owner, number, field) -> dict

         It builds this GraphQL document (one named field, never the plural connection):

           query($owner: String!, $number: Int!, $field: String!) {
             repositoryOwner(login: $owner) {
               __typename
               ... on ProjectV2Owner {
                 projectV2(number: $number) {
                   id
                   field(name: $field) {
                     ... on ProjectV2SingleSelectField {
                       id
                       name
                       options { id name }
                     }
                   }
                 }
               }
             }
           }

         The ... on ProjectV2Owner inline fragment on a RepositoryOwner selection is legal and was
         run live - both User and Organization satisfy that interface, so one selection covers both.

         The document MUST select exactly one field by name, MUST NOT contain a plural
         field-connection selection, and MUST NOT contain any connection argument (first: or last:)
         anywhere. The last clause is the load-bearing one: a selection set carrying no connection
         argument cannot fan out, which is what makes the query cheap. An implementation that
         fetches every field, or every project, and filters in Python resolves the same ids, passes
         every behavioural assertion, and costs exactly what we are removing.

         NAME THE CONSTANT EXACTLY _FIELD_QUERY, at module level. The task verify imports
         factory_gh and reads factory_gh._FIELD_QUERY by that name, then asserts the shape rules
         above against the string itself - not against the file - so a comment or docstring that
         happens to mention first: or fields( does not trip it, and a query that hides fan-out in a
         string built elsewhere does not escape it. Importing the module must stay side-effect-free,
         as its own docstring promises.

      2. It runs through THIS module's run_gh, never a new subprocess call:

           run_gh(["api", "graphql",
                   "-f", "query=" + _FIELD_QUERY,
                   "-f", "owner=" + owner,
                   "-F", "number=" + str(number),
                   "-f", "field=" + field], json_out=True)

         -F for number so gh sends an Int; -f for the two String variables.

      3. D-03 - ONE diagnosis walk, entered from BOTH paths. Do not write two.

           try:
               env = run_gh(argv, json_out=True)
           except GhError as e:
               parse e.stdout as JSON. If it is a mapping containing a "data" key, set env to it and
               FALL THROUGH to the same walk below. Otherwise this is a genuine transport or auth
               failure: re-raise a GhError carrying e.argv, e.status, e.stdout, e.stderr, with
               what "gh graphql call failed", value the string owner + " project " + str(number),
               next_step "re-run after checking gh auth status and network access".
               Do NOT let run_gh's own message escape from this path - see step 3e.

         Then walk env["data"], in this order, each raising GhError(argv, None, "", "", what, value,
         next_step) with argv as the args list actually sent:

         a. repositoryOwner is null -> what "project owner not found", value owner,
            next_step "check the owner login". D-02: this is a login that resolves to nothing, and
            it arrives at EXIT 0 with no errors key. It is NOT the organization case.
         b. repositoryOwner.__typename is not "User" -> what "organization-owned board not
            supported", value owner, next_step "run against a user-owned board". Read __typename
            BEFORE projectV2: it is present in both the exit-0 and the exit-1 envelope, so the org
            refusal does not depend on the org's board existing.
         c. repositoryOwner.projectV2 is null -> what "project not found", value the string
            owner + " project " + str(number), next_step "check the board number". D-02: a mistyped
            board number must never report the organization message.
         d. projectV2.field is null OR is an empty dict -> what "project field not found", value
            field, next_step "field-list for {owner} project {number} does not offer it". Test for
            BOTH shapes: an empty dict is what a field that exists but is not single-select returns,
            at exit 0, and `{} is None` is False, so `if field is None` alone passes here and then
            sends --field-id None to item-edit. D-04: keep that next_step byte-identical to the two
            existing sites at factory_gh.py:206-210 and :251-256, because operators learn the string
            and a reword is expensive to undo. Do not tidy it.
         e. THE VALUE RULE, D-03, applies to every raise in this path including the transport one.
            No GhError leaving this resolver may carry the generic subcommand fallback as its value.
            run_gh's _value_from_argv (factory_gh.py:48-63) looks for a literal --owner argv element
            and a repos/ prefix; a -f owner= argv has neither, so it falls through to joining
            argv[:2] and the operator reads "api graphql", which names nothing they can act on.
            preflight() (:105-114) is the in-module pattern for catching and re-raising with a real
            value. Note GhError stores only argv, status, stdout and stderr - there is no value
            attribute - so the test asserts on str(exc).

         Return {"project_id": <projectV2.id>, "field_id": <field.id>,
                 "options": [{"id": o["id"], "name": o["name"]} for o in field.get("options", [])]}.

      4. DELETE _field_list (factory_gh.py:196-198) entirely. It has exactly two callers, both of
         which you are converting. Leaving it in the tree preserves the 102-point path the operator
         settled must not remain as a fallback.

      5. project_field_options(owner, number, field) keeps its exact signature and returns a list of
         option NAMES, now built from the resolver's options list. Its field-not-found error is the
         resolver's branch (d) - do not add a second copy of it.

      6. project_field_set(owner, number, item_id, field, option) keeps its exact signature. It calls
         the resolver once, then:
         - if no entry in options has name == option, raise GhError([], None, "", "",
           "project field option not found", option,
           "field {field} on {owner} project {number} does not offer it") - the wording at
           factory_gh.py:257-262, unchanged, frozen by D-04.
         - otherwise run the SAME gh project item-edit call as today, with --project-id taking the
           resolver's project_id (the PVT_ node id, never str(number)), --field-id the field_id, and
           --single-select-option-id the matching option id.
         There is no fallback anywhere: if the resolver raises, project_field_set raises and no
         item-edit call is made. That is the D-02 never-swallow property, preserved.

      7. Delete the gh project view call and its comment block at factory_gh.py:263-271. Replace the
         comment with a short one recording that --project-id takes the GraphQL node id, never the
         board number (measured live: --project-id 4 raises "Could not resolve to a node with the
         global id of '4'"), and that the id now comes from the same single query as the field ids.
         Do not reintroduce the word parity - there is no second read to be in parity with.

      PART B - test-factory-gh.py. Every case below is fed by fixtures shaped for the OLD call
      sequence and breaks by construction. Rewrite all of them. EVERY fixture carries the exit code
      from the measured-transport table above, not exit 0 by default. There is exactly ONE
      exception, flagged where it appears below: the exit-0 organization fixture, which has no row
      in that table because no org owning a reachable board was reachable to measure.

      - :78-87 FIELD_LIST_JSON and PROJECT_VIEW_JSON. Replace with GraphQL envelope fixtures. The
        success one, at EXIT 0:
        GRAPHQL_FIELD_JSON = json.dumps({"data": {"repositoryOwner": {"__typename": "User",
        "projectV2": {"id": "PVT_kwFAKE", "field": {"id": "F1", "name": "Station",
        "options": [{"id": "O1", "name": "Ready"}, {"id": "O2", "name": "Doing"}]}}}}})
        Keep the ids F1, O1, O2 and PVT_kwFAKE so the existing value assertions stay meaningful.
        Add SIX sibling fixtures, each at its measured exit code:
          - unknown owner, EXIT 0: {"data": {"repositoryOwner": None}}, no errors key.
          - organization with an UNREACHABLE board, EXIT 1: {"data": {"repositoryOwner":
            {"__typename": "Organization", "projectV2": None}}, "errors": [{"type": "NOT_FOUND"}]}
            on stdout.
          - organization with a REACHABLE board, EXIT 0. NAME IT EXACTLY GRAPHQL_ORG_OK_JSON, at
            module level beside GRAPHQL_FIELD_JSON, so the criterion it serves has a content anchor
            to grep for. It is the success envelope with the typename flipped - {"data": {"repositoryOwner": {"__typename": "Organization", "projectV2":
            {"id": "PVT_kwFAKE", "field": {"id": "F1", "name": "Station", "options": [{"id": "O1",
            "name": "Ready"}, {"id": "O2", "name": "Doing"}]}}}}}, NO errors key. This one is the
            discriminating org fixture: against it an implementation that reads __typename only
            inside except GhError returns SUCCESSFULLY and writes to an org board. The exit-1 org
            fixture cannot catch that, because it raises either way. Unlike the other five rows this
            envelope was NOT measured - no org owning a reachable board is reachable from this
            account - it is derived from the exit-0 success shape with __typename changed. Build it
            anyway; the criterion it serves is SC-05.
          - board absent, EXIT 1: {"data": {"repositoryOwner": {"__typename": "User",
            "projectV2": None}}, "errors": [{"type": "NOT_FOUND"}]} on stdout.
          - field absent, EXIT 1: projectV2 present with its id, "field": None, plus an errors
            array, on stdout.
          - field not single-select, EXIT 0: projectV2 present with its id, "field": {}.
        The three exit-1 fixtures must put the envelope on STDOUT, because that is where the
        resolver reads it from, and may put an unrelated one-line diagnostic on stderr.
      - :255-267 asserts len(calls) == 3 and field-list then project-view then item-edit. Rewrite to
        assert exactly TWO calls: one gh api graphql, then one gh project item-edit. Keep the F1 and
        O1 assertions on the item-edit argv.
      - :269-279 the option-not-offered case. Keep the behaviour assertion; re-feed it from the
        success GraphQL fixture and assert ZERO item-edit calls were made. ALSO ADD the D-04 freeze
        assertion, which exists nowhere in the tree today and is why the freeze can currently be
        reworded green: assert that str(exc) contains the RENDERED next_step for this case's own
        arguments, byte for byte. With this case's current arguments - project_field_set("owner", 3,
        "ITEM1", "Station", "NotAnOption") - the exact substring is
        field Station on owner project 3 does not offer it
        Assert the RENDERED string, never the braced template: the source wording is an f-string
        (factory_gh.py:251-256), so an assertion written against field {field} on {owner} project
        {number} does not offer it matches nothing, ever, and is a dead assertion that ships green.
        Substitute this case's own owner, number, field and option if you change them. GhError
        exposes no next_step attribute - str(exc) is built by factory_cli.body(what, value,
        next_step) at factory_gh.py:43 - so str(exc) is where the assertion goes.
      - :282-306 the --project-id argv-dispatching case. Keep the dispatching_fake, but dispatch on
        the ("api", "graphql") prefix instead of ("project", "field-list") and ("project", "view").
        Keep the assertion that --project-id is PVT_kwFAKE and not "3".
      - :309-328 the failed-project-view case. Its trigger no longer exists. Replace it with a
        NON-DIAGNOSABLE transport failure: the ("api", "graphql") prefix returns
        Result(1, stdout="", stderr="gh: API error"). Assert GhError is raised, zero gh project
        item-edit calls were made, AND - this is the new clause - that str(exc) contains
        "mruangutai project 3" (or whatever owner/number the case uses) and does NOT contain
        "api graphql". Keep the comment naming D-02, never swallow, so the property's lineage
        survives the rewrite.
      - :446-463 project_field_options: returns the option names, and raises naming the absent field.
        Re-feed from the GraphQL fixtures. The absent-field case now uses the field-absent fixture
        at exit 1. ALSO ADD the D-04 freeze assertion for the OTHER frozen string, the one this
        error carries, for the same reason and in the same form: assert that str(exc) contains the
        RENDERED next_step for this case's own arguments, byte for byte. With this case's current
        arguments - project_field_options("owner", 3, "NoSuchField") - the exact substring is
        field-list for owner project 3 does not offer it
        Rendered, never braced: field-list for {owner} project {number} does not offer it matches
        nothing, ever. This is the correct and only home for that assertion - the resolver raises
        the field error once, in branch (d), and step 5 forbids a second copy of it.
      - :571-573 and :594-597 the writes-nothing-to-stdout cases for project_field_options and
        project_field_set. Their with_recorder positional result lists are shaped for the old
        sequence; re-shape them (one graphql result, and for field_set one graphql plus one empty
        item-edit result).

      ADD FOUR NEW CASES, one per newly separated state, each asserting the exception message and
      that zero item-edit calls were made:
        - unknown owner (exit-0 fixture) raises naming the owner, and its message is DIFFERENT from
          the organization message and from the board-not-found message. Assert the difference
          explicitly, not just that each raises.
        - organization raises the org refusal naming the owner, asserted against BOTH org fixtures -
