decisions:
  - id: D-01
    choice: ONE private resolver serves both public functions. Add _project_field_resolve(owner, number, field) to factory_gh.py, which makes the single GraphQL query and returns a dict with project_id, field_id and options as a list of dicts each carrying id and name. project_field_options keeps returning a list of option NAMES built from that dict; project_field_set reads project_id, field_id and the matching option id from the same dict. Both public signatures and return shapes are unchanged.
    because: the public signatures are frozen by three other test files and three callers. test-factory-decompose.py, test-factory-claim.py and test-factory-land.py all patch at the factory_gh module boundary with explicit name lists and recorder methods carrying the current argument tuples, so any signature change breaks three suites and three call sites for no gain. Two independent query functions were rejected because they would duplicate the query text, the owner branches and the field-missing branch, and the two copies would drift.
    dec: none
  - id: D-02
    choice: The query roots at repositoryOwner(login:) with __typename, not user(login:), and the resolver discriminates FOUR owner/board/field states rather than two. Order - owner absent (data.repositoryOwner null), owner is an Organization (__typename not User), board absent (projectV2 null), field absent or not single-select (field null or an empty object). Each raises its own GhError with its own what, value and next_step; no message is reused for another case.
    because: user(login:) returns the identical NOT_FOUND for an organization, for a misspelled login and for a deleted account, so it reproduces one level up the exact collapse this decision exists to prevent at the board number - a mistyped owner reported as an unsupported org sends the operator to the wrong fix. repositoryOwner separates them at cost 1, measured, and ProjectV2Owner is the interface both concrete types satisfy so the projectV2 selection is unchanged. Rejected alternative - keep user(login:) and reword branch (a) to state both causes; it costs nothing but leaves the operator to guess which of two unrelated fixes applies, and error text is expensive to change later because operators and runbooks learn it.
    dec: none
  - id: D-03
    choice: Diagnosis runs ONCE, over the parsed envelope, entered from BOTH the success and the failure path. The resolver calls run_gh inside try/except GhError. On GhError it parses the captured stdout - if that yields a mapping containing a data key, the envelope is diagnosable and control joins the SAME walk the success path uses; if it does not, the failure is a transport or auth failure and is re-raised with the operator's own inputs as the value, never the generic subcommand fallback. Two separate walks, one per exit code, are forbidden.
    because: measured live 2026-08-10 (notes/research-FEAT-11-combined-query-probe.md), the four failure states do not share an exit code. An unknown owner returns exit 0 with data.repositoryOwner null and NO errors key; a field that exists but is not single-select returns exit 0 with an empty object; an organization, a missing board and a missing field each return exit 1 with a partial envelope on stdout and an errors array. A resolver that diagnoses only inside except GhError misses two states; one that diagnoses only on the happy path misses three. Splitting the walk in two is D-01's own drift argument one level down. The value rule is separate and equally binding - run_gh's _value_from_argv (factory_gh.py:48-63) matches --owner and repos/ prefixes, neither of which appears in a -f owner= argv, so it falls through to joining argv[:2] and names the failure api graphql, which tells the operator nothing they can act on. preflight() (:105-114) is the in-module precedent for catch-and-re-raise with a real value. Rejected alternative - branch on exit code first, then on envelope; it reads naturally and is wrong, because the exit code does not partition the failure set.
    dec: none
  - id: D-04
    choice: The two frozen next_step strings keep their exact bytes, including the one naming a subcommand this change removes from the tree. project_field_options and project_field_set keep raising, byte-identical, the wordings at factory_gh.py:206-210 and :251-256. Nobody tidies them in a later pass.
    because: REQ-02 binds the field and option failures to behave exactly as they do today. The wording names a command the factory will no longer invoke internally, which reads like dead text and invites a cleanup - but it is an instruction to a HUMAN, who can still type that command themselves, which is exactly what the action slot is for. Recorded as a decision rather than a line of task prose because it is hard to reverse by its own argument, operators learn the string, and the next person to read the file will otherwise fix it. This also settles the reviewer's open point that one of the two frozen strings states a fact rather than an action and so sits awkwardly with the message grammar - the tension is ACCEPTED, not resolved. The remedy would be a reword, the reword breaks the freeze, and the freeze is the requirement. New messages written by this feature do obey the grammar.
    dec: none

