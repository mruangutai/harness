    RAISED BY eng-lead, non-blocking, a signed-plan consequence rather than a build defect. The
    resolver treats any exit-1 stdout that parses to a mapping carrying a "data" key as a
    diagnosable envelope. A GraphQL partial-success response — complete data, no null anywhere,
    non-empty errors — would walk clean and return success for a call gh reported as failed. No row
    in the plan's measured transport table has that shape, so no signed fixture reaches it. The
    member implemented D-03 as written rather than adding an undeclared defensive re-raise, which
    was correct. Routed to the qa segment as a known coverage hole, then to the briefing backlog.
