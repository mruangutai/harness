decisions:
  - id: D-01
    choice: The schema holds ELEVEN top-level keys - SPEC 11.3's ten minus phase, plus github and
      factory - with additionalProperties false at the top level and inside runs items, github and
      factory.
    because: Those eleven are the only keys with a demonstrated reader once phase is collapsed into
      status by the operator's 2026-08-11 ruling, and the worst prose rot is inside runs items, so
      closing only the top level would leave it untouched. The count moved from twelve to eleven for
      one reason only - phase no longer exists as a key - and no other key changed disposition.
    dec: none
  - id: D-02
    choice: EIGHT keys are required - feature_id, branch, pr, status, review_sha, cycles_used,
      max_total_cycles, runs - and three are optional - max_total_runs, github and factory.
    because: SPEC 11.3 says max_total_runs may be omitted to inherit harness.json, and github and
      factory only exist once a feature is mirrored or decomposed. Measured over all 17 feature
      files at a29ad06, max_total_runs is the only optional key ever absent and every one of the
      eight required keys is present on every file, so the migration BACKFILLS NOTHING. The earlier
      draft of this decision priced a phase backfill onto FEAT-01 and FEAT-02; phase is gone, so
      that analysis is void and is not carried forward.
      THE CONSEQUENCE THAT SURVIVES, AND IT IS LARGER THAN THE BACKFILL WAS. status is REQUIRED and
      is already present on all 17 files, so INV-17 in check-state.sh loses its exemption carrier
      outright rather than on two files. INV-17 is guarded today by phase ABSENCE - check-state.sh
      line 451 reads if _phase not in PHASE_ORDER continue, and line 436 says pre-DEC-159 features
      stay quiet - and FEAT-01 and FEAT-02 are quiet only because they carry no phase. With phase
      deleted and nothing put in its place, _phase is the empty string on all 17, so the continue
      fires every time and INV-17 stops firing ENTIRELY while check-state.sh still exits clean. A
      gate that examines nothing reports no violations. T-12 is the task that answers this, and it
      is a task rather than a note precisely because the failure mode is silence.
    dec: DEC-159
  - id: D-03
    choice: Enforcement is one implementation in two shapes - an importable module
      bin/feature_schema.py holding the schema load and the validation, plus a thin CLI wrapper
      bin/validate-feature-json.py for CI, the migration tasks and the corpus sweep. check-domain.sh
      IMPORTS the module in process on its existing write-payload path; it does not spawn the CLI.
      The PreToolUse bash-write-guard and a check-state.sh sweep are rejected as the primary point.
    because: check-domain.sh already inspects write payloads on this exact path for the line
      budget, so write-time denial costs an import and a call rather than schema logic inside a
      carve-out gate; bash-write-guard guards the Bash route, not the Write tool the orchestrator
      uses, and a check-state sweep only reddens after the bad write is on disk. IN PROCESS RATHER
      THAN SUBPROCESS, and this is the load-bearing half - check-domain.sh already exports PYTHONPATH
      and imports harness_yaml, so an import costs nothing, while a subprocess re-adds the 104.7 ms
      interpreter launch measured at check-domain.sh line 92 and removed by T-13, once per file in a
      post-Bash sweep that a bulk mtime refresh can drag the whole corpus into. A subprocess also
      fails OPEN when it cannot launch (the exception escapes to exit 1, and line 14 says exit 1 is
      NON-blocking) and can only be handed a temporary file, so its message names a path nobody
      wrote - the unattributable-finding defect DEC-180 fixed twice in this file. An import makes the
      missing dependency an ordinary except ImportError branch that appends to the problems list, so
      the write is denied with exit 2 and the message is formatted through the existing _head, naming
      the real target. The house already splits importable modules from hyphenated CLIs
      (harness_yaml.py, gh_issues.py, factory_*.py against gh-sync.py, check-plan-routes.py), so
      feature_schema.py sits in that convention; it differs from feature-schema.json by extension as
      well as separator, which is judged sufficient and is reversible.
    dec: DEC-174
  - id: D-04
    choice: jsonschema becomes a required dependency, declared where PyYAML is - harness-init's
      prerequisite gate and the CI workflow - with a missing import raising a loud error naming
      the install command, never a skip.
    because: DEC-171 am.1's shape; a validator that silently passes when its checker is absent is
      a gate that looks real and does nothing. There is no requirements.txt or pyproject.toml in
      this repo to declare it in.
    dec: DEC-189
  - id: D-05
    choice: The 20-comment-line budget for this path is struck and the 200-line budget is raised
      to 300.
    because: JSON has no comments so the first is unreachable, and the twelve-key form of FEAT-10 -
      measured before phase was dropped - is 173 lines at 32 runs with about 5 lines per run, so 200
      breaches at about 38 runs. Dropping phase removes one line from that figure and does not move
      the conclusion.
    dec: DEC-150
  - id: D-06
    choice: The migration drops keys while the files are still YAML, then converts the format in a
      separate later task.
    because: Each drop is independently verifiable against unchanged readers, and converting first
      would change ten reader files and the data in one blast.
    dec: none
  - id: D-07
    choice: A one-shot converter writes a per-feature receipt naming every dropped key and its
      value before removing it.
    because: Fourteen files lose up to twenty keys each; hand editing loses records silently and a
      diff is not a durable receipt.
    dec: none
  - id: D-09
    choice: phase and status COLLAPSE INTO ONE FIELD whose value set is the GitHub board's six
      columns - Backlog, Plan, Ready, Building, Review, Done. This is a REPLACEMENT, not a mapping
      layer. The old values are read once, by the migration, as input; NO old-to-new mapping table
      survives anywhere in the code, in the schema, or in any test fixture. pr becomes integer or
      null in the same pass, so the migration normalizes values as well as dropping keys.
    because: The operator ruled it on 2026-08-11 (notes/answers-2026-08-11-revision.md). Two
      vocabularies describing one lifecycle is the two-copies drift this org keeps paying for, and
      the board is where the operator actually looks, so the board's columns are the vocabulary
      rather than a projection of one. The cost was named and accepted at the ruling - Review cannot
      distinguish a running review panel from waiting on the operator, and Done cannot distinguish
      shipped from abandoned; one record on disk is affected by the second, FEAT-01. Both boards
      already carry the six options, applied and verified 2026-08-11, so no board mutation is in
      scope here; T-04 opens with a PRECONDITION that reads the boards and confirms the six exist.
      blocked is NOT in the vocabulary. The earlier draft kept it as legal-but-unused; the six
      columns have no Blocked column, the tree carries the value zero times, and a blocked feature
      is waiting on the operator, which is Review. That rationale is superseded, not merely dropped.
    dec: none
  - id: D-10
    choice: The surviving key is named status. phase is deleted outright.
    because: Stated on the record rather than assumed, because the reverse is defensible and nobody
      should have to re-derive why it was not taken. Every reader that survives this feature already
      reads status - check-plan-routes.py line 426 - while the only reader of phase is INV-17, which
      T-12 rewrites anyway. status is the field name SPEC 11.3, validate-digest.py and both GitHub
      boards' single-select field already use, so keeping it costs zero renames in three places that
      would otherwise all need one. Naming the survivor phase would have renamed the one field the
      board and the digest agree on, to match the field neither of them has.
    dec: none
  - id: D-11
    choice: The values keep the board's own capitalized spelling - Backlog, Plan, Ready, Building,
      Review, Done - and comparisons against them are case SENSITIVE. No lowercase alias is
      accepted anywhere.
    because: Also stated on the record, because it is a real change and not a formatting detail. The
      corpus is uniformly lowercase snake_case today, and check-plan-routes.py line 426 does
      str(doc.get("status","")).split() then a membership test on token[0], so the casing flows
      straight into that comparison - a file written Done and a constant written done silently stop
      matching, and the failure direction there is fail-CHECKED, which is loud, not silent. The
      capitalized form is chosen over normalizing the board down to lowercase because a normalizing
      step IS a mapping layer, which the ruling forbids - the value a human reads on the board and
      the value on disk must be byte-identical or the replacement has not happened. Accepting a
      lowercase alias would reintroduce the same layer through the back door, so it is refused.
    dec: none
  - id: D-12
    choice: INV-17 SURVIVES the collapse. check-state.sh keeps an ordered list of the six status
      values and a separate literal table naming, per status, the handoff-note STEMS that must exist
      once a feature is at or past it. The stems stay lowercase literals - plan, build, validate -
      and are NOT derived from the status values.
    because: Deleting INV-17 was available and is rejected, because DEC-159's guarantee is that a crossed
      seam leaves working memory on disk, and that guarantee does not depend on how many lifecycle
      values exist. The stems are decoupled from the values for a mechanical reason measured here,
      not a stylistic one - deriving the filename from the status value produces
      notes/handoff-Plan.md and notes/handoff-Building.md, which match the on-disk lowercase
      notes/handoff-plan.md on this machine's case-INSENSITIVE filesystem and MISS on Linux CI, so
      the invariant would pass locally and go dark on the only machine that gates the merge. Keeping
      the stems literal also renames none of the 34 handoff notes on disk. A status-to-required-
      artifact table is NOT the mapping layer D-09 forbids, because D-09 forbids an old-vocabulary to
      new-vocabulary translation surviving in code, and this table names neither vocabulary's
      counterpart - it names artifacts. THE RESIDUAL LOSS IS STATED RATHER THAN HIDDEN. validate and
      ship both fold into Review, so the validate-to-ship crossing is no longer separately
      observable and nothing can demand handoff-validate.md at Review; it is demanded at Done
      instead, which is the next boundary that proves Review completed. One seam therefore moves
      later; none is dropped.
    dec: DEC-159
  - id: D-13
    choice: validate-digest.py's orchestrator status enum - in_progress, in_review, shipped, blocked,
      awaiting_user, at line 182 - is OUT OF SCOPE and is NOT collapsed into the six board columns.
    because: Recorded rather than quietly skipped, because this feature's own title says one status
      vocabulary and a reader will ask why two survive. The discriminating fact is that they are
      different objects - validate-digest.py governs an agent's RETURN CONTRACT for a single run,
      while status on disk is a feature's position in its lifecycle, and the two answer different
      questions about different lifetimes. The mechanical evidence is that the digest enum carries
      blocked and the six columns have no Blocked; collapsing them would either invent a seventh
      column the operator did not authorize or delete a token the SubagentStop hook routes on.
      Changing it would also rewrite every orchestrator return contract and agent prompt, which is
      scope the 2026-08-11 ruling never granted. It is surfaced to the operator as a non-blocking
      open question at signature so the boundary is a decision rather than an oversight.
    dec: DEC-172
  - id: D-08
    choice: The closed key set gets its own decision entry alongside the dependency entry, and the
      index row is produced by gen-decisions-index.py, never hand written.
    because: This reverses ten features of growth and a future scan will re-suggest a notes field;
      the load-bearing reason has to be on the record.
    dec: DEC-190

tasks:
  - id: T-01
    title: Ship the schema artifact and its validator with unit tests
    traces: [REQ-01, REQ-02, REQ-03, REQ-04, REQ-06]
    change_type: logic
    execution_mode: team
    execution_agent: harness-backend-dev
    depends_on: []
    status: done
    files:
      - .claude/skills/harness/bin/feature-schema.json
      - .claude/skills/harness/bin/feature_schema.py
      - .claude/skills/harness/bin/validate-feature-json.py
      - .claude/skills/harness/bin/test-validate-feature-json.py
      - .claude/skills/harness/bin/run-unit-tests.sh
    verify: |
      .claude/skills/harness/bin/run-unit-tests.sh --kind unit
    intent: |
      Write a JSON Schema (draft 2020-12) at
      .claude/skills/harness/bin/feature-schema.json describing a harness feature's
      execution state, and a validator that applies it.

      SCHEMA CONTENT. Top level: type object, additionalProperties false, and exactly
      these ELEVEN properties. THERE IS NO phase PROPERTY - phase and status collapsed
      into status alone under D-09, and a schema that still declared phase would
      re-legalise the field this feature exists to delete.
        required (eight): feature_id (string), branch (string), pr (integer or null),
        status (string, enum EXACTLY these six, spelled and CASED exactly like this:
        Backlog, Plan, Ready, Building, Review, Done - these are the GitHub board's
        column names, both boards already carry them, and D-11 makes the comparison
        case sensitive so no lowercase alias is legal), review_sha (string),
        cycles_used (integer, minimum 0), max_total_cycles (integer, minimum 1),
        runs (array).
        optional (three): max_total_runs (integer, minimum 1), github (object),
        factory (object).
      runs items: type object, additionalProperties false, required id, squad, verdict,
      all strings. Nothing else - no cost_usd, no note.
      github: type object, additionalProperties false, properties milestone
      (integer or null), parent (integer or null), parent_origin (string or null),
      attached (array of strings), issues (object with additionalProperties integer).
      No property is required inside github.
      factory: type object, additionalProperties false, properties repo (string or
      null), parent (integer or null), parent_origin (string or null), issues (object),
      items (object), edges (object with properties parent (array) and blocked_by
      (object), additionalProperties false). No property is required inside factory.
      Do NOT add a notes property anywhere, at any level.
      branch and review_sha are plain strings and the literal string none is a legal
      value for both - check-state.sh INV-6 already treats none as unset via
      PLACEHOLDER_UNSET, so do not model them as nullable. pr, by contrast, IS
      integer-or-null: it is the string none in every live file today and T-04
      rewrites those to null.

      Every property carries a description string. For the object-valued ones the
      description names the code that reads it, verbatim from these census results:
      runs items are read at check-state.sh lines 184-190; review_sha at 195;
      cycles_used at 203; max_total_runs at 249; status by check-plan-routes.py's
      finished-feature skip and by check-state.sh INV-17's seam table; github by
      gh-sync.py load_recorded and check-state.sh INV-21; factory by
      factory_decompose.py load_factory, factory_claim.py issue_number and
      check-state.sh INV-24. CITE status BY THE READER'S NAME, NOT BY A LINE NUMBER -
      T-11 and T-12 both move those lines inside this same build, so a line anchor
      written here is stale before it is read.

      VALIDATOR, IN TWO PIECES - an importable module and a thin CLI over it (D-03).

      A. .claude/skills/harness/bin/feature_schema.py, an importable module in the
      house's module convention (underscored, like harness_yaml.py and gh_issues.py,
      against the hyphenated CLIs). It holds all the logic and exposes at least:
        - load_schema(), reading feature-schema.json from beside this module;
        - problems_for_text(text, display) -> list of stderr LINES, [] when clean,
          taking the document TEXT and the path to NAME IN THE MESSAGE. It never
          exits and never writes a temporary file. This is the entry point
          check-domain.sh imports at T-06, and it is why the module exists: a
          subprocess cannot be handed the real path, and its launch failure escapes
          as a non-blocking exit 1;
        - problems_for_file(path) -> the same, reading from disk.
      Import jsonschema at MODULE level inside a try, setting a module-level flag on
      ImportError. Do not import it inside a per-file function: check-domain.sh's
      post sweep calls the entry point once per candidate file, and a per-call import
      pays the cost, and emits the message, once per file.
      When jsonschema is unavailable, problems_for_* returns a ONE-line problem, and
      the caller decides what to do with it. That line reads:
        jsonschema is REQUIRED and is not importable, so this file CANNOT be checked.
        Install it with: python3 -m pip install jsonschema  (or python3 -m pip install
        --user --break-system-packages jsonschema)
      Never return [] on that path and never emit the word skip - [] means checked and
      clean, and a checker that cannot run must never be indistinguishable from one
      that passed. This mirrors harness_yaml.MissingDependency's shape under
      DEC-171 am.1.
      THE FEATURE.JSON PATH DEPENDS ON STDLIB json AND jsonschema ONLY, NEVER PyYAML.
      Say so in a comment. The state.yaml branch in check-domain.sh returns [] when
      PyYAML is absent - a fail-open the user ruled on - and the next editor will try
      to make this branch match it. It must not: this branch has no PyYAML dependency
      to be absent, so the two are not the same case.

      B. .claude/skills/harness/bin/validate-feature-json.py, executable, a THIN CLI
      wrapper over the module with a docstring stating usage - argument parsing,
      printing and exit codes only, no schema logic. Command line: one or more paths,
      or no argument meaning every execution-state file on disk.
      THE NO-ARGUMENT SWEEP GLOBS .harness/features/*/feature.* AND KEEPS ONLY THE
      .json, .yaml and .yml suffixes, rather than naming two literal filenames. Two
      reasons, and the second is not cosmetic: it spans the migration window, where the
      corpus is still YAML and the schema is already live; and T-08's verify clause fails
      the build on ANY surviving literal feature.yaml under .claude outside one pinned
      file, so a hard-coded second filename here would redden T-08 and be discovered at
      the end of the build rather than here. Name test fixtures neutrally for the same
      reason - sample.json, sample.yaml - never the literal old filename.
      LOAD BY EXTENSION, not by one permissive loader. A .json path is read with
      json.load; anything else is read with harness_yaml.load_file. A file named
      .json that is valid YAML but not valid JSON is therefore REJECTED, naming the
      json decode error. Without this, a feature.json that no json.load consumer can
      read validates clean - the guarantee gap in the feature whose product IS the
      guarantee, and gh-sync.py, factory_claim.py and factory_decompose.py are all
      json.load consumers after T-05.
      THREE EXIT CODES, DISTINCT, because callers branch on them (T-03's CI step,
      T-04's, T-07's and T-08's verify clauses all read the return code):
        0 - every file validates;
        1 - at least one file failed validation, which is a verdict ABOUT a file;
        3 - the checker could not run at all (jsonschema unimportable), which is not
            a verdict about any file.
      A caller cannot tell an escape from a real violation if both are 1, and the
      distinction is cheap here and undiscoverable at the call sites.

      REJECTION MESSAGES REDIRECT, THEY DO NOT ONLY REFUSE. For an undeclared key,
      report the file, the JSON pointer to the offending key and the key name, then a
      destination line chosen by nesting level and printed verbatim:
        This file holds execution state only. An operator ruling goes in that feature's
        plan.yaml under approval.rulings; run narrative, findings and corrections go in
        that run's digest; current state and open questions go in STATE.md;
        measurements, research and receipts go in notes/.
      For a missing required key, report the file and the key and say it is required by
      SPEC 11.3.

      TESTS. .claude/skills/harness/bin/test-validate-feature-json.py, following the
      house style of the existing test-*.py files in that directory (stdlib only, a
      main that prints a PASS/FAIL line per case and exits non-zero on any failure,
      temporary fixtures under tempfile). Cases required:
      - one accepted fixture carrying all eleven keys;
      - one accepted fixture carrying only the eight required keys;
      - three separately accepted fixtures, each omitting exactly one of
        max_total_runs, github, factory;
      - eight rejected fixtures, each omitting exactly one required key, each asserting
        the message names that key. Do not compare counts - assert per key;
      - SIX separately accepted fixtures, one per status value - Backlog, Plan, Ready,
        Building, Review, Done - because Backlog and Ready have ZERO instances in the
        live corpus after the migration, so no per-file assertion anywhere in this
        feature can ever exercise them. Fixture coverage is the only coverage those two
        values get, and without these six cases a schema that accidentally omitted
        Backlog from the enum would ship green;
      - one rejected fixture proving phase IS GONE: a document carrying all eight
        required keys PLUS phase set to ship. It must be rejected as an undeclared
        top-level key. Without this case a schema that quietly kept phase in its
        properties passes every other case in this list;
      - three rejected fixtures for undeclared keys, one per nesting level: a top-level
        invented key, a runs item carrying cost_usd, a github sub-key named closed.
        Each asserts the offending key name AND the redirection sentence appear in the
        message;
      - one rejected fixture reproducing the real rot: a runs item whose key is the
        string "3 must_fix at med";
      - THREE rejected VALUE fixtures, not key fixtures: status set to shipped (a value
        the live corpus carries on four files today and which is outside the new
        six-value enum), status set to the lowercase done (which proves D-11's case
        sensitivity - a case-insensitive enum would accept it and the on-disk value
        would stop matching the board), and pr set to the string none (not integer or
        null). All three are shapes the live corpus or a plausible careless writer
        produces, so a schema that accepts any of them would make the migration a no-op;
      - one case running the CLI in a subprocess with an environment that makes
        jsonschema unimportable (inject a directory on PYTHONPATH containing a
        jsonschema.py that raises ImportError), asserting exit EXACTLY 3, the word
        REQUIRED in stderr, and that the exit is neither 0 nor 1 - 0 would be a silent
        pass and 1 would be indistinguishable from a file that failed validation;
      - one rejected fixture named *.json whose text is valid YAML but NOT valid JSON
        (for example `feature_id: FEAT-01` in YAML block form), asserting a non-zero
        exit and a message naming the JSON decode failure. A .yaml fixture with the
        same content is ACCEPTED, which is what proves the dispatch is by extension
        rather than a blanket tightening;
      - one case calling feature_schema.problems_for_text DIRECTLY with a display path
        of .harness/features/FEAT-99-x/feature.json, asserting that path appears in
        every returned line - the in-process entry point must name the real file,
        because check-domain.sh has no other way to attribute a finding;
      - one case calling feature_schema.problems_for_text with jsonschema forced
        unavailable, asserting it returns a non-empty list (never []) whose single
        line carries REQUIRED and the install command.

      REGISTER THE NEW TEST FILE in .claude/skills/harness/bin/run-unit-tests.sh, in
      the UNIT_SCRIPTS array, NOT INTEGRATION_SCRIPTS. The runner has a drift detector
      that fails the whole run on any unregistered test-*.py, and the integration
      kind's detect globs in harness.json name only test-check-state.py and
      test-factory-integration.py, so a file registered there would match no detect
      glob.

  - id: T-02
    title: Declare jsonschema as a required prerequisite in init and CLAUDE.md
    traces: [REQ-06]
    change_type: docs
    execution_mode: main-session-direct
    execution_reason: check-domain.sh --resolve returns NOBODY for both paths, an ungranted
      surface under DEC-179
    depends_on: [T-01]
    status: done
    files:
      - .claude/skills/harness-init/SKILL.md
      - CLAUDE.md
    verify: |
      python3 - <<'PY'
      import sys
      init = open('.claude/skills/harness-init/SKILL.md').read()
      cm = open('CLAUDE.md').read()
      bad = []
      if 'jsonschema' not in init: bad.append('harness-init SKILL.md does not mention jsonschema')
      if 'pip install jsonschema' not in init and 'install jsonschema' not in init:
          bad.append('harness-init SKILL.md carries no jsonschema install command')
      if 'jsonschema' not in cm: bad.append('CLAUDE.md does not mention jsonschema')
      print('\n'.join(bad) if bad else 'OK')
      sys.exit(1 if bad else 0)
      PY
    intent: |
      Two edits, both prose, both making an already-taken decision findable.

      1. .claude/skills/harness-init/SKILL.md. The prerequisite gate around lines 44-56
      currently checks PyYAML and stops with MISSING. Extend the same gate to check
      jsonschema the same way: the probe line prints MISSING when import jsonschema
      raises, the STOP paragraph names both packages, and both install commands are
      given (python3 -m pip install pyyaml jsonschema, and the --user
