worktree_reason: >-
  THE DISPATCH PREMISE WAS FALSE and this is the correction, not a preference. It said the feature
  branch was created, checked out and signed; the branch exists at 6dfbf7c and is signed, but the
  main checkout sits on chore/203-end-copy-distribution, which is FEAT-12 mid-build. Checking out
  here would have pulled a live flow's tree out from under it. The worktree path is the DEC-143
  shape - check-domain.sh strips a single-segment .claude/worktrees/<name>/ prefix and matches the
  identical globs, so no grant widens. A worktree outside the project root instead hits the
  commonpath escape and the hook RETURNS WITHOUT ENFORCING, a silent fail-open across the whole
  feature and strictly worse than a block. Reported to the operator in the return.
wrong_root_tripwire: >-
  An edit to the MAIN checkout's copy of a factory_*.py breaks no gate - backend-dev owns that path
  in both trees, so the domain hook passes, and a verify run in that same tree passes with it. The
  work would land on FEAT-12's branch silently. RUN AFTER T-01 AND CLEAN: git diff --quiet
  origin/main over all nine in-scope files in the main checkout, all nine byte-identical. FEAT-12
  meanwhile advanced there independently, which is the flow the worktree spared.
