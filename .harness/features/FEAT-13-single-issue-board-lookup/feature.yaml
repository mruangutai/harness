plan_text_defect_found: >-
  T-01's intent specifies the zero-item-list assertion as argv[:2] == ["project", "item-list"],
  which CAN NEVER BE TRUE - run_gh at factory_gh.py:88 does [gh] + list(args), so argv[0] is the
  binary. Premise re-derived by me at source. As written it is a vacuous negative assertion under
  SC-01 and SC-02. The shipped tests use argv[1:3], the form every other assertion in that file
  uses, so the CODE is right and the SC's own wording - asserted on the argv the helper actually
  builds - is satisfied. Found independently by eng-lead and by qa. The approved plan's PROSE is the
  thing that is wrong, and amending it is pm's under the operator's signature, not mine.
