worktree_reason: >-
  THE DISPATCH PREMISE WAS FALSE and this is the correction, not a preference. It said the feature
  branch was created, checked out and signed; the branch exists and is signed, but the main checkout
  sits on chore/203-end-copy-distribution, which is FEAT-12 mid-build, and checking out here would
  have pulled a live flow's tree out from under it. The worktree path is the DEC-143 shape -
  check-domain.sh strips a single-segment .claude/worktrees/<name>/ prefix and matches the identical
  globs, so no grant widens. A worktree OUTSIDE the project root instead hits the commonpath escape
  and the hook RETURNS WITHOUT ENFORCING - a silent fail-open across the whole feature, strictly
  worse than a block. THE TRAP IS LIVE: pm's first read of test-factory-land.py hit the main
  checkout's pre-FEAT-13 copy and returned unrelated assertions at the cited lines.
wrong_root_tripwire: >-
  An edit to the MAIN checkout's copy of a factory_*.py breaks no gate - backend-dev owns that path
  in both trees, so the hook passes and a verify run in that same tree passes with it, landing the
  work on FEAT-12's branch silently. RUN AND CLEAN: git diff --quiet origin/main over all nine
  in-scope files in the main checkout, all nine byte-identical. FEAT-12 advanced there independently.
plan_text_defect_found: >-
  T-01's intent at plan.yaml:368 specifies the zero-item-list assertion as argv[:2] == ["project",
  "item-list"], which CAN NEVER BE TRUE - run_gh at factory_gh.py:88 does [gh] + list(args), so
  argv[0] is the binary. Re-derived by me at source. Found independently by eng-lead, qa and the
  panel. The shipped tests use argv[1:3] and :367 is already correct, so the CODE is right and only
  the plan's prose is wrong. pm recommends NO amendment - editing a signed artifact makes it stop
  being what was approved - and I accepted that. Backlog row instead.
