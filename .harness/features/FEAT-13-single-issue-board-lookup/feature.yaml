the_one_cycle_charged: >-
  ONE cycle for fix01, and the routing was MINE AGAINST TWO LEADS' RECOMMENDATION. pm returned SC-05
  partial and the panel returned its three gaps, and BOTH recommended sending them to the operator as
  a plan amendment on the grounds that adding an assertion exceeds plan.yaml's signed step-5 list. I
  overruled that. SC-05 is an APPROVED criterion that was UNMET, and approved-but-unmet needs no
  re-signature - only a criterion that cannot be met as written does. An enumerated assertion list is
  an implementation FLOOR; read as a ceiling it would leave an approved criterion permanently
  undischargeable because the plan's prose did not anticipate the gap. No scope, goal or signed
  decision moved and no production code changed. The operator can reverse this; it is named in the
  briefing rather than buried.
fix01_verified_by_me: >-
  Re-run at my own tier, not relayed. Unit 10/10 scripts exit 0, integration 97/97 exit 0. Production
  files factory_gh, factory_claim, factory_land and factory_decompose are BYTE-IDENTICAL to the
  previous commit - the mutation proofs were restored. The diff adds exactly 4 check() calls and
  removes 1: three genuinely new assertions plus the decompose rename, which replaces the removed
  one. The positive-path case I explicitly excluded was NOT smuggled in.
what_fix01_closed: >-
  Three properties that were asserted in PROSE and enforced ZERO times. (1) _ISSUE_ITEM_QUERY is now
  pinned STRUCTURALLY - the argument names inside issue(...) must be exactly {number} - so it reddens
  under a state filter of any spelling and survives a reformat, which a keyword blacklist would not.
  (2) issue_view's requested field list is pinned to contain "state" at BOTH factory_claim.py:274 and
  factory_land.py:63. This was the sharpest finding of the whole feature and it was MUTANT-PROVEN by
  qa, not reasoned: dropping "state" from those lists left both suites FULLY GREEN because the fakes
  ignored their fields argument, while in production .get("state") becomes None, != "OPEN" is always
  true, and BOTH TOOLS REFUSE EVERY ISSUE - a total outage invisible to the entire suite. The
  specialist made the fakes honour fields first, which is the order the panel said was required, then
  pinned the tuple. (3) test-factory-decompose.py's check named "the lookup carries no state scoping"
  could not fail from that regression, because issue_board_item_id takes no query parameter - a test
  whose NAME claimed coverage it did not provide. Renamed to state plainly what it cannot exercise.
red_proof_required_and_given: >-
  Every new assertion had to be proven to REDDEN, because the defect being fixed WAS a green
  assertion named for a property it could not test. Each carries a recorded mutation and observed
  failure: a state:OPEN argument added to the query text, and "state" dropped from each field list.
  A pure whitespace reformat of the query correctly stayed green, which is what shows the structural
  guard is not brittle.
req02_evidence_closed_by_me: >-
  pm and the panel both flagged that REQ-02's substantive property - a CLOSED issue's board item
  still resolves - had no evidence reachable from this branch, because T-02's receipt recorded the
  board STATUS "Done" rather than the issue's own state field. ONE read-only call settled it:
  gh issue view 216 --json state returns CLOSED, closedAt 2026-08-11. So T-02's live measurement DID
  run against a closed issue and the claim in factory_decompose.py's docstring and in T-01's commit
  message is TRUE, not falsified. Taken after T-02's measured window, so it cost that number nothing.
