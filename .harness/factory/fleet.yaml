schema: factory-fleet/1
# THE BOARD IS PER-REPOSITORY (FEAT-16). There is no top-level `board:` any more: a single
# board for the whole fleet meant every product's stations were read off whichever board the
# fleet happened to name, so a second product would have moved cards on the first one's board.
#
# mruangutai/harness is DELIBERATELY ABSENT (DEC-174 am.1). Harness develops itself in the
# live checkout and in worktrees under it — both sit INSIDE the repository root, resolve in
# the harness base, and keep full write rights.
#
# The absence is what enforces it, and the mechanism CHANGED when the entry came out.
# Measured both ways on `harness-factories/harness/.claude/skills/harness/bin/check-domain.sh`:
# with the entry present, `--resolve` returned NOBODY (product base, control-plane globs
# filtered); with it absent, `--resolve` exits 2 — "under the factory workspace but belongs
# to no repository declared in fleet.yaml". Louder, not quieter. Re-adding the entry is a
# decision, not a convenience.
repos:
  - name: mruangutai/kaya-ai
    default_branch: master
    # Board 2 is kaya-ai's own board. Its `Done` option is RETAINED on purpose — 118 items
    # sit there and the enabled `Item closed` workflow keeps landing cards in it.
    #
    # `ready: Ready` is deliberate even though Ready is EMPTY today (0 of 211 items). On this
    # board `Backlog` means filed-and-untriaged and `Ready` means promoted for the factory, so
    # a claim run that finds nothing has found the truth rather than hit a misconfiguration
    # (D-08). Pointing intake at `Backlog` instead would hand the factory 82 untriaged items.
    board:
      owner: mruangutai
      number: 2
      station_field: Status
      stations:
        ready: Ready
        building: Building
        review: Review
workspace_root: /Users/molchairuangutai/GitHub/harness-factories
