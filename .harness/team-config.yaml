# Harness team manifest — the org as DATA, not prose.
#
# Read by the orchestrator at every /harness entry, by each lead when delegating,
# and by bin/check-domain.sh on every Write/Edit to decide what an agent may touch.
#
# POLICY lives here (membership, consult-when routing, writable domains).
# CAPABILITY lives in agent frontmatter (tools, model, color, hooks).
# Nothing is declared twice.

schema_version: 1
cli_min_version: "2.1.217"        # floor for the spawn env vars (DEC-83)

# The MAIN SESSION is the user channel and nothing else: it spawns orchestrators,
# relays their questions to you, and writes `## Approval` and the cross-flow log.
# It is not an agent and has no domain — check-domain exits 0 when a payload carries
# no agent_type, which is what lets it maintain state at all.
main_session:
  writes: [".harness/features/*/BRIEF.md ## Approval", ".harness/features/*/PLAN.md ## Approval", ".harness/logs/**"]

# The ORCHESTRATOR is a spawned agent, one per in-flight feature, so N flows can run
# at once (DEC-120). Being an agent means it IS governed by check-domain — hence the
# domain below. It cannot call AskUserQuestion; questions bubble to the main session.
orchestrator:
  name: harness-orchestrator
  skill: .claude/skills/harness/SKILL.md   # the playbook it runs
  color: blue
  domain:
    - { path: .harness/features/**, upsert: true }   # its feature's STATE.md, feature.yaml, runs/
    - { path: .harness/features/*/notes/answers-*.md, upsert: true }
    - { path: .harness/features/*/notes/ship-review-*.md, upsert: true }   # the briefing
    - { path: .harness/expertise/harness-orchestrator.md, upsert: true }
    - { path: .harness/features/*/observations/harness-orchestrator.md, upsert: true }   # hot layer (DEC-145)
    - { path: ".", read: true }

# .claude/agents/** IS DELIBERATELY UNOWNED — no agent may write it, and that is the point.
# Agent definitions are the org's own constitution; an agent editing them is self-modification,
# and the tier that can change what the org IS should be the one with a user channel. Edits are
# the MAIN SESSION's. An agent that finds a defect in an agent file raises `open_questions`.
# (Decided after a review panel found harness-ui-reviewer.md's output template packs two fields
# per line — the exact defect its own validator rejects — and no domain covered the file.)

paths:
  agents: .claude/agents/
  teams: .claude/skills/harness/teams/     # shipped by deploy — REPLACED WHOLESALE on every push
  team_overrides: .harness/teams/          # project-owned; deploy never touches it. Resolved FIRST (DEC-113)
  features: .harness/features/
  expertise: .harness/expertise/

# Preloaded into all 16 agents at every spawn via `skills:`. KEEP THIS MINIMAL —
# measured at ~1,727 tokens per spawn, ~59k per feature (DEC-105).
universal_rules:
  - harness-handoff
  - harness-expertise

# Owned by NOBODY. Writes here are always serialized and attributed to whichever
# specialist the lead routed. Disjoint domains are unachievable for these files
# (DEC-85), so pretending otherwise would either void the parallel-safety claim
# or block routine work on files nobody may touch.
shared:
  - { path: package.json }
  - { path: package-lock.json }
  - { path: pnpm-lock.yaml }
  - { path: yarn.lock }
  - { path: pyproject.toml }
  - { path: uv.lock }
  - { path: requirements.txt }
  - { path: tsconfig.json }

teams:
  # ───────────────────────────────────────────────────────────────────────────
  - team-name: Product
    team-color: purple
    lead: { name: harness-product-lead }
    conventions:
      - id: astryx-design-system
        rule: >
          All UI work implements against the Astryx design system
          (`@astryxdesign/core`, pinned). Do not introduce a second component
          substrate. Deviating requires a PLAN ## Decisions entry.
        provision: npm dependency — NOT a Claude capability. dev-ops verifies or installs at init.
        reference: https://astryx.atmeta.com/
    members:
      - name: harness-pm
        consult-when: >
          Requirements, feature scoping, planning, task breakdown, codebase research,
          acceptance criteria, success criteria, goal verification, REQ coverage, UAT scripts.
        domain:
          - { path: .harness/features/*/BRIEF.md, upsert: true }   # except ## Approval (DEC-129)
          - { path: .harness/features/*/PLAN.md, upsert: true }    # except ## Approval (DEC-129)
          - { path: .harness/features/*/plan.yaml, upsert: true }  # DEC-182; except approval: (DEC-129)
          - { path: .harness/features/*/notes/research-*.md, upsert: true }   # the PATH carries the FEAT id (DEC-130)
          - { path: .harness/notes/research-*.md, upsert: true }            # project-scoped research only
          - { path: .harness/features/*/notes/uat-*.md, upsert: true }
          - { path: .harness/codebase/product-surface.md, upsert: true }   # its map lens (DEC-137)
          - { path: .harness/codebase/glossary.md, upsert: true }          # ubiquitous language (DEC-149)
          - { path: .harness/expertise/harness-pm.md, upsert: true }
          - { path: .harness/features/*/observations/harness-pm.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-visual-designer
        consult-when: >
          Visual identity, palette, typography, spacing, component direction, light/dark,
          mockups, high-fidelity prototypes — plus UX research, personas, journey mapping,
          usability friction.
        domain:
          - { path: .harness/features/*/DESIGN.md, upsert: true }  # per-feature (DEC-129)
          - { path: .harness/features/*/notes/mockups/**, upsert: true }
          - { path: .harness/features/*/notes/prototypes/**, upsert: true }
          - { path: .harness/expertise/harness-visual-designer.md, upsert: true }
          - { path: .harness/features/*/observations/harness-visual-designer.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-documentor
        consult-when: >
          READMEs, guides, reference docs, changelogs, user-facing explanation.
        domain:
          - { path: docs/**, upsert: true }
          - { path: README.md, upsert: true }
          - { path: .harness/README.md, upsert: true }
          - { path: .harness/codebase/INDEX.md, upsert: true }            # skeleton ONLY (DEC-137)
          - { path: .harness/codebase/architecture.md, upsert: true }
          - { path: .harness/expertise/harness-documentor.md, upsert: true }
          - { path: .harness/features/*/observations/harness-documentor.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

  # ───────────────────────────────────────────────────────────────────────────
  - team-name: Engineering
    team-color: cyan
    lead: { name: harness-eng-lead }
    conventions:
      - id: supabase
        rule: >
          Use the Supabase plugin for database, auth, storage and edge functions.
          Do not hand-roll what Supabase provides; do not add a second backend
          substrate. Deviating requires a PLAN ## Decisions entry.
        provision: Claude Code plugin — available. dev-ops confirms project linkage at init.
    members:
      - name: harness-frontend-dev
        consult-when: >
          UI components, styling, client-side state, forms, routing, accessibility,
          browser behavior, responsive layout.
        domain:
          - { path: web/src/**, upsert: true }            # seeded by /harness-init
          - { path: .harness/codebase/ui-surface.md, upsert: true }       # its map lens (DEC-137)
          - { path: .harness/features/*/notes/receipt-harness-frontend-dev-*.md, upsert: true }   # its verification receipt (B-7)
          - { path: .harness/expertise/harness-frontend-dev.md, upsert: true }
          - { path: .harness/features/*/observations/harness-frontend-dev.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-backend-dev
        consult-when: >
          APIs, endpoints, services, business logic, auth flows, background jobs,
          server-side integration, error handling at the service boundary.
        domain:
          - { path: src/**, upsert: true }               # seeded by /harness-init
          - { path: .claude/skills/harness/bin/**, upsert: true }   # this repo's source IS the harness (FEAT-02 Q3)
          - { path: .harness/codebase/api-surface.md, upsert: true }      # its map lens (DEC-137)
          - { path: .harness/codebase/domains/**, upsert: true }        # module grouping
          - { path: .harness/features/*/notes/receipt-harness-backend-dev-*.md, upsert: true }   # its verification receipt (B-7)
          - { path: .harness/expertise/harness-backend-dev.md, upsert: true }
          - { path: .harness/features/*/observations/harness-backend-dev.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-ai-dev
        consult-when: >
          LLM and agent features, prompts, model integration, tool definitions,
          retrieval, evals, and anything whose output is non-deterministic.
        domain:
          - { path: src/**/prompts/**, upsert: true }     # seeded by /harness-init
          - { path: evals/**, upsert: true }
          - { path: .harness/codebase/llm-patterns.md, upsert: true }     # its map lens (DEC-137)
          - { path: .harness/features/*/notes/receipt-harness-ai-dev-*.md, upsert: true }   # its verification receipt (B-7)
          - { path: .harness/expertise/harness-ai-dev.md, upsert: true }
          - { path: .harness/features/*/observations/harness-ai-dev.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-data-engineer
        consult-when: >
          Schemas, migrations, pipelines, data models, queries, indexes,
          serialization contracts, data backfills.
        domain:
          - { path: supabase/migrations/**, upsert: true }
          - { path: src/**/schema*, upsert: true }        # seeded by /harness-init
          - { path: .harness/codebase/data-flows.md, upsert: true }       # its map lens (DEC-137)
          - { path: .harness/features/*/notes/receipt-harness-data-engineer-*.md, upsert: true }   # its verification receipt (B-7)
          - { path: .harness/expertise/harness-data-engineer.md, upsert: true }
          - { path: .harness/features/*/observations/harness-data-engineer.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-dev-ops
        consult-when: >
          Infrastructure, CI/CD, build tooling, deployment, environment config,
          scaffolding, dependency management, test-runner detection and setup.
        domain:
          - { path: .github/**, upsert: true }
          - { path: Dockerfile, upsert: true }
          - { path: .harness/harness.json, upsert: true }
          - { path: .claude/skills/harness/bin/**, upsert: true }   # this repo's source IS the harness (FEAT-02 Q3)
          - { path: .harness/codebase/stack.md, upsert: true }            # its map lens (DEC-137)
          - { path: .harness/features/*/notes/receipt-harness-dev-ops-*.md, upsert: true }   # its verification receipt (B-7)
          - { path: .harness/expertise/harness-dev-ops.md, upsert: true }
          - { path: .harness/features/*/observations/harness-dev-ops.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }
        # SHARP EDGE (DEC-85): dev-ops holds Bash, which bypasses path checks
        # entirely. It is trusted by design — it owns deploy — and the
        # compensating control is that merge and deploy stay user-gated.

  # ───────────────────────────────────────────────────────────────────────────
  - team-name: Validation
    team-color: orange
    lead: { name: harness-validator-lead }
    members:
      - name: harness-qa
        consult-when: >
          Test coverage, writing and running tests, regression tests, E2E, the
          test-matrix gate, running evals authored by ai-dev, coverage gaps.
        domain:
          - { path: tests/**, upsert: true }              # seeded by /harness-init
          - { path: web/src/**/*.test.*, upsert: true }
          # Both spellings, because the panel's dispatch names the reviewer-style one
          # (Q6): the other three members write notes/review-harness-<persona>-c0.md,
          # so a lead composing a review run reasonably asks qa for the same shape and
          # qa is denied. Fourth recurrence of the routing wall — qa correctly wrote to
          # the permitted path and ESCALATED rather than working around the guard, which
          # is the behaviour the guard is for. Widened to match the convention its own
          # squad already follows rather than asking every future lead to remember.
          - { path: .harness/features/*/notes/qa-*.md, upsert: true }   # assessments; the 3 reviewers each own one, qa owned none
          - { path: .harness/features/*/notes/review-harness-qa-*.md, upsert: true }   # Q6
          - { path: .harness/expertise/harness-qa.md, upsert: true }
          - { path: .harness/features/*/observations/harness-qa.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      # Reviewers write ONLY their own findings — no source path in any domain,
      # enforced alongside having no Edit tool (SPEC 4.1).
      - name: harness-code-reviewer
        consult-when: >
          Spec compliance, scope creep, omissions, code quality, maintainability,
          fail-open branches, silent failure paths.
        domain:
          - { path: .harness/features/*/notes/review-harness-code-reviewer-*.md, upsert: true }
          - { path: .harness/expertise/harness-code-reviewer.md, upsert: true }
          - { path: .harness/features/*/observations/harness-code-reviewer.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-security-reviewer
        consult-when: >
          Auth, secrets, input validation, injection, SSRF, deserialization,
          OWASP Top 10, STRIDE threat modeling, data exposure in logs or exports.
        domain:
          - { path: .harness/features/*/notes/review-harness-security-reviewer-*.md, upsert: true }
          - { path: .harness/codebase/trust-boundaries.md, upsert: true } # its map lens (DEC-137)
          - { path: .harness/expertise/harness-security-reviewer.md, upsert: true }
          - { path: .harness/features/*/observations/harness-security-reviewer.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

      - name: harness-ui-reviewer
        consult-when: >
          Visual fidelity against DESIGN.md, design-contract soundness, UI
          regressions, accessibility audit, dark/light parity.
        domain:
          - { path: .harness/features/*/notes/review-harness-ui-reviewer-*.md, upsert: true }
          - { path: .harness/expertise/harness-ui-reviewer.md, upsert: true }
          - { path: .harness/features/*/observations/harness-ui-reviewer.md, upsert: true }   # hot layer (DEC-145)
          - { path: ".", read: true }

# Leads write only their own squad's run bookkeeping and their own Expertise.
# Listed separately because they host teams rather than being members of one.
leads:
  - name: harness-product-lead
    squad: product
    domain:
      - { path: .harness/features/*/runs/*-product/**, upsert: true }
      - { path: .harness/expertise/harness-product-lead.md, upsert: true }
      - { path: .harness/features/*/observations/harness-product-lead.md, upsert: true }   # hot layer (DEC-145)
      - { path: ".", read: true }
  - name: harness-eng-lead
    squad: eng
    domain:
      - { path: .harness/features/*/runs/*-eng/**, upsert: true }
      - { path: .harness/expertise/harness-eng-lead.md, upsert: true }
      - { path: .harness/features/*/observations/harness-eng-lead.md, upsert: true }   # hot layer (DEC-145)
      - { path: ".", read: true }
  - name: harness-validator-lead
    squad: validator
    domain:
      - { path: .harness/features/*/runs/*-validator/**, upsert: true }
      - { path: .harness/expertise/harness-validator-lead.md, upsert: true }
      - { path: .harness/features/*/observations/harness-validator-lead.md, upsert: true }   # hot layer (DEC-145)
      - { path: ".", read: true }
