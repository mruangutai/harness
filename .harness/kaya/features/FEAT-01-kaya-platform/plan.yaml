decisions:
  - id: D-01
    choice: Keep Mastra memory in schema mastra and use direct-5432 when reachable or the same Kaya project session-5432 pooler for IPv4-only local networks; no transaction-6543 mode or silent fallback.
    because: SQL isolation and persistent connection semantics must be explicit without settling production pooling or financial storage contracts.
    dec: none
  - id: D-02
    choice: Expose a localhost-only platform API protected by KAYA_API_STUB_TOKEN with a server-owned resource identity; do not treat this probe token as end-user account authorization.
    because: Real provider billing and privileged storage require a denial boundary now without choosing the account and resource contract reserved to Kaya issue 2.
    dec: none
