decisions:
  - id: D-01
    choice: Keep Mastra memory in schema mastra and use direct-5432 when reachable or the same Kaya project session-5432 pooler for IPv4-only local networks; no transaction-6543 mode or silent fallback.
    because: SQL isolation and persistent connection semantics must be explicit without settling production pooling or financial storage contracts.
    dec: none
  - id: D-02
    choice: Use localhost-only same-origin browser routes with a server-bootstrapped signed HttpOnly SameSite=Strict cookie
      and exact Host/Origin/Fetch-Metadata guards; keep KAYA_API_STUB_TOKEN server-only and CLI bearer supplementary, fixed
      resource kaya-local-platform.
    because: The browser must send and restore a real conversation without receiving the privileged token. Loopback binding
      plus same-origin checks grants the trusted local operator access only, not account identity or production authorization;
      signed expiry survives restart without model involvement.
    dec: none
