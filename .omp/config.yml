# Harness must run from OMP-native and provider-neutral sources.
disabledProviders:
  - claude

# Harness requires an explicit provider overlay from `.omp/providers/`.
# Concrete models never live in canonical agent definitions.
# Child work is supervised by the OMP process and has no wall-clock deadline. The
# request budget remains OMP's runaway-turn safety bound.
async:
  enabled: true

task:
  maxRecursionDepth: 3
  maxRuntimeMs: 0
  # BUG-2565: task.structured stays at OMP's default (off). Each harness agent's frontmatter
  # carries structured: true and an output generated from schemas/digest by
  # gen-agent-output.py, so the task tool exposes no schema parameter to any dispatcher;
  # non-harness children get no yield tool, accepted by the operator.
  # FEAT-2397: native per-call model authority, explicitly off for every session, Main included.
  # A project setting narrows an operator's choice but never widens it. Quoted: an unquoted
  # `off` is a YAML 1.1 boolean, and the pin is the string. A task that needs a stronger model
  # escalates instead of overriding it (DEC-155).
  perCallModel: "off"
