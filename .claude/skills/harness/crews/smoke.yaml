# The mechanism probe: the smallest crew that proves the org actually works.
#
# WHAT IT IS FOR. Run this after /harness-init, after /harness-deploy, or after a
# Claude Code upgrade, to answer one question: can a lead host a DAG, dispatch two
# different members, and pass state between them by file path? Everything in SPEC
# §10.2 and §12 rests on that, and it fails SILENTLY if the platform shifts — a
# lead with no Agent tool simply does the work itself and returns something
# plausible. This crew makes that failure visible.
#
# WHY THESE TWO STEPS. Both members are in the Product squad, so product-lead is
# dispatching its OWN members — a lead routes within its squad; cross-squad
# routing is the orchestrator's job (SPEC §3.4). Both write to disposable,
# namespaced paths already inside their domains, so running this in a real project
# touches no source and no canonical artifact.
#
# LINEAR ON PURPOSE. No gating, no loop_back, no parallelism. Those are the next
# increment; this one isolates dispatch and state-passing so a failure has exactly
# one cause.

name: smoke
purpose: Prove a lead can host a DAG, dispatch two members, and pass state by file path.
lead: product-lead
inputs: [feat]
max_cost_usd: 5                    # a two-step probe that costs more than this is itself a finding

steps:
  - id: write
    persona: pm
    depends_on: []
    inputs: []
    outputs: [.harness/notes/smoke-{{feat}}.md]
    mutates_repo: false
    prompt: >
      This is a mechanism probe, not product work. Do not research the codebase and
      do not ask questions. Write .harness/notes/smoke-{{feat}}.md containing exactly
      three lines: the literal token SMOKE-STEP-1, your own agent name, and the
      current UTC timestamp. Then return the standard three-part handoff with
      artifact set to that path.

  - id: read_back
    persona: visual-designer
    depends_on: [write]
    inputs: [write.outputs]        # resolved to the PATH written by `write`, never its contents
    outputs: [.harness/notes/mockups/smoke-{{feat}}.html]
    mutates_repo: false
    prompt: >
      This is a mechanism probe, not design work. Read the file at the input path you
      were given. Write .harness/notes/mockups/smoke-{{feat}}.html containing the
      literal token SMOKE-STEP-2, your own agent name, and — quoted verbatim — the
      three lines you read from the input file. If you were not given a readable
      input path, do NOT invent one: return VERDICT: BLOCKED and say so. A step that
      fabricates its input is the exact failure this crew exists to detect.
