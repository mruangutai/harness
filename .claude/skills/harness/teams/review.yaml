# review — the reviewer panel, run in parallel, synthesized by the lead.
#
# THE FAN-IN IS NOT A STEP. validator-lead hosts this DAG and does the assessment
# itself in its consolidated DIGEST (SPEC §10.4): it is the independence layer over
# qa, and adding a separate dispatched step to "synthesize" would just be the lead
# paying a spawn to do its own job.
#
# Four independent reviewers dispatch in ONE turn — serial dispatch looks correct
# while running 4× slower. review_sha IS PINNED BY THE CALLER, never read from
# HEAD (DEC-50; INV-6 fails an unpinned validator run).

name: review
purpose: Run the reviewer panel in parallel against a pinned SHA; the lead synthesizes one actionable set.
lead: validator-lead
inputs: [feat, review_sha]

steps:
  # All four have depends_on: [] and do not depend on each other, so the runner
  # dispatches them in a single turn. Each writes to its own namespaced note path,
  # which is what makes parallel writes safe here (SPEC §2.3).
  - id: code
    persona: code-reviewer
    depends_on: []
    inputs: []
    outputs: [".harness/features/{{feat}}/notes/review-harness-code-reviewer-c{{cycle}}.md"]
    mutates_repo: false
    prompt: >
      Review the diff at {{review_sha}} for {{feat}}. Two stages, in order: spec
      compliance against the BRIEF and PLAN first, then code quality — and do not
      start the second until the first passes. Hunt fail-open branches and silent
      failure paths specifically. Write findings to your output path with a concrete
      failure scenario for each; findings without one are not actionable. Do not fix
      anything: you have no Edit tool and source is not your domain.

  # qa in GATE-ONLY mode (D-08). This step re-runs the existing test_matrix over the
  # pinned SHA and authors NOTHING — hence mutates_repo: false. Test AUTHORING belongs
  # to the orchestrator-sequenced qa SEGMENT that runs before this panel
  # (SPEC.md:1978), which is the same persona doing the other of D-08's two jobs.
  #
  # THE TWO JOBS MUST NOT COLLIDE ON DISK. The segment keeps the historical name
  # `notes/qa-c{{cycle}}.md` (see FEAT-05/notes/qa-c0.md, qa-c1.md); this panel step
  # takes the reviewer-style `notes/review-harness-qa-c{{cycle}}.md`, matching the
  # other reviewer steps and the grant team-config.yaml:227 already carries for exactly
  # that spelling. Reuse the segment's filename here and, at cycle N of a full ship,
  # the gate-only note silently overwrites the segment's test-authoring receipt —
  # same persona, same domain, same path.
  - id: qa
    persona: qa
    depends_on: []
    inputs: []
    outputs: [".harness/features/{{feat}}/notes/review-harness-qa-c{{cycle}}.md"]
    mutates_repo: false
    prompt: >
      GATE-ONLY. Re-run the `test_matrix` gate over the diff at {{review_sha}} for
      {{feat}} and write the result to your output path: `matrix_ok`, plus the
      per-kind results and which kinds the change type required. You are auditing a
      pinned SHA, not building on it — **author nothing**: no tests, no fixtures, no
      source. If a required kind has no test, that is a finding, not a gap for you to
      fill; the fix belongs to the qa segment and the dev that owns the task. If the
      matrix cannot be run at all, say so and return the honest state — a gate that
      did not run has not passed.

  - id: security
    persona: security-reviewer
    depends_on: []
    inputs: []
    outputs: [".harness/features/{{feat}}/notes/review-harness-security-reviewer-c{{cycle}}.md"]
    mutates_repo: false
    prompt: >
      Self-scoping OWASP Top 10 and STRIDE audit of the diff at {{review_sha}} for
      {{feat}}: auth, secrets, input validation, injection, and data exposure in logs
      or exports. Write findings to your output path. If the diff has no security
      surface, say so plainly and return PASS — a scoped-out review is a valid
      result, and padding it with speculative findings is worse than silence.

  - id: ui
    persona: ui-reviewer
    depends_on: []
    inputs: []
    outputs: [".harness/features/{{feat}}/notes/review-harness-ui-reviewer-c{{cycle}}.md"]
    mutates_repo: false
    prompt: >
      Mode B — audit the built UI in the diff at {{review_sha}} against DESIGN.md,
      including accessibility and dark/light parity. **Self-scope out if the diff
      touches no user-facing surface**: write a one-line note saying so and return
      PASS. Do not manufacture findings to justify the spawn.

# The lead's consolidated DIGEST is the deliverable. It must:
#   - merge the four panels into ONE actionable set, de-duplicated
#   - carry severity_max across the panel, since the gate reads that
#   - name which reviewer raised each surviving finding, so it can be traced back
#   - drop nothing silently: a finding the lead judges not worth acting on is
#     recorded as assessed-and-dismissed with a reason, not omitted
