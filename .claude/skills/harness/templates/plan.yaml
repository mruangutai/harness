# plan.yaml — approval-gated, real YAML (DEC-182).
# Before drafting, MUST read
# <HARNESS_CONTROL_PLANE_ROOT>/.agents/skills/harness-spec-driven/SKILL.md
# for authoring, controlled-write and signature rules. Replace placeholders.

schema: plan/1
feature: FEAT-NN-<slug>          # must match the directory name

# backlog | plan | ready | building | review | done | abandoned | rejected
# abandoned: planned, never built; rejected: wrong/superseded at first intake.
# pending is an approval status, never a station.
# Feature station is recorded only here; set-feature-station refuses unknown names before opening.
status: plan

# Bare issue integers planned from, signed with the plan; [] means no source ticket.
# gh-sync open mirrors these to feature.json github.source_issues; ship marks their cards done.
source_issues: []

# apply seeds only this pending mapping. Main signs/revokes on the user's explicit instruction.
approval:
  status: pending                # pending | approved
  # approved_by: <name>           # sign-approval writes signed fields
  # date: <YYYY-MM-DD>
  # rulings: []                   # sign-approval --overrule; current PF-id, who, date, reason
  # reset_at: <timestamp>         # reset-generated metadata
  # reset_reason: <reason>
  # resume_station: <station>     # transient; consumed at reapproval

# record-panel transcribes the lead's digest (DEC-229); no hand-authored panel.
panel:
  last_run: <run-dir>
  cycle: 0
  # Every reader appears, even when skipped: clean findings do not prove a reader ran.
  readers:
    - reader: should-not-exist       # should-not-exist | scope | goalcheck
      status: skipped                # ran | skipped
      persona: fable-advisor         # required when skipped
      reason: <host refusal>         # required when skipped
  # The finding shape is enforced, not advisory (#2095): bin/panel_findings.py holds it;
  # set-panel and record-panel refuse a departure, sign-approval refuses one and refuses an
  # open gating finding without --overrule, and check-state's INV-32 reports one on any plan
  # not yet done, abandoned or rejected. No other key; no other disposition.
  findings:
    - id: PF-0123abcd
      severity: unrated              # info | low | med | high | critical | unrated
      reader: should-not-exist        # should-not-exist | scope | goalcheck
      kind: substance                # substance | form | proportionality
      # scope: task|mission          # proportionality findings only (DEC-228)
      summary: <one line>
      disposition: open              # open | resolved; risk acceptance is --overrule, never this
      # resolved_by: T-NN            # resolved findings only; must name a task in this plan
  # unrated gates like high: omitted judgement fails closed.

lanes:
  # Resolved against <HARNESS_CONTROL_PLANE_ROOT>/.harness/team-config.yaml.
  # Declare a carve-out once here, not per task.
  resolved_at: <sha>
  rows:
    - surface: .claude/skills/harness/bin/**
      lane: team
      agent: harness-backend-dev | harness-dev-ops
    - surface: <a DEC-174 carve-out path>
      lane: main-session-direct
      reason: <why, one clause>

decisions:
  # Pointers to .harness/harness/docs/DECISIONS.md, not essays.
  # A plan-local choice uses dec: none and dies with the feature.
  - id: D-01
    choice: <the decision, one sentence>
    because: <one clause>
    dec: DEC-NNN | none

tasks:
  - id: T-01
    title: <imperative, one line>
    traces: [SC-01, SC-02]       # BRIEF success criteria; D-NN belongs in decisions
    change_type: logic           # logic | api | cross_module | frontend | feature
                                 # | bugfix | ai_behavior | config | scaffolding | docs
    execution_mode: team         # team | main-session-direct
    execution_agent: <agent>     # team only; remove for main-session-direct
    # execution_reason: <why>    # main-session-direct only; omit execution_agent
    depends_on: []               # [T-NN, ...]; runner orders by dependencies, not file order
    # Same station vocabulary as feature status; absence defaults to ready.
    status: ready

    # One anchor per file; choose path, path#symbol, or {path, quote}; never path:NN.
    files:
      - path/to/exact/file.py
      # - path/to/exact/file.py#symbol
      # - {path: path/to/exact/file.py, quote: <unique text>}

    verify: |
      MANUAL — <what must be built first to make this automatable>
    intent: |
      <complete literal dispatch prompt: logic, types, structure and values>
